<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Ride History - RiderX</title>

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="../css/Style.css">
  <link rel="stylesheet" href="../css/Responsive.css">

  <style>
    :root {
      --yellow: #ffd400;
      --black: #050505;
      --dark: #101010;
      --card: #171717;
      --border: #292929;
      --white: #ffffff;
      --gray: #a8a8a8;
      --green: #35d07f;
      --red: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    .page {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* HEADER */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 64px;
      background: rgba(5, 5, 5, .96);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      backdrop-filter: blur(12px);
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #181818;
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    .title-area {
      flex: 1;
      padding-left: 13px;
    }

    .title-area h1 {
      font-size: 19px;
      font-weight: 700;
    }

    .title-area p {
      margin-top: 3px;
      color: var(--gray);
      font-size: 11px;
    }

    .refresh-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      background: #141414;
      color: var(--yellow);
      border-radius: 50%;
      font-size: 19px;
      cursor: pointer;
    }

    .refresh-btn.loading {
      animation: rotate .8s linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    /* FILTERS */

    .filters {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 15px 16px 10px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: #111;
      color: #aaa;
      padding: 9px 15px;
      border-radius: 22px;
      font-size: 13px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--yellow);
      color: #000;
      border-color: var(--yellow);
      font-weight: 700;
    }

    /* SUMMARY */

    .summary {
      margin: 8px 16px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .summary-card {
      background: linear-gradient(145deg, #1b1b1b, #101010);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
    }

    .summary-card .label {
      color: var(--gray);
      font-size: 11px;
      margin-bottom: 7px;
    }

    .summary-card .value {
      font-size: 20px;
      font-weight: 800;
    }

    .summary-card .value.yellow {
      color: var(--yellow);
    }

    /* HISTORY */

    .history-container {
      padding: 0 16px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 7px 0 12px;
    }

    .section-title h2 {
      font-size: 16px;
    }

    .section-title span {
      color: var(--gray);
      font-size: 11px;
    }

    .ride-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .ride-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 15px;
      position: relative;
      overflow: hidden;
    }

    .ride-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--yellow);
    }

    .ride-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ride-type {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .service-icon {
      width: 39px;
      height: 39px;
      border-radius: 12px;
      background: #242000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .ride-type h3 {
      font-size: 14px;
    }

    .ride-type p {
      color: var(--gray);
      font-size: 10px;
      margin-top: 3px;
    }

    .status {
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .status.completed {
      background: rgba(53, 208, 127, .12);
      color: var(--green);
    }

    .status.cancelled {
      background: rgba(255, 77, 77, .12);
      color: var(--red);
    }

    .status.pending {
      background: rgba(255, 212, 0, .12);
      color: var(--yellow);
    }

    .route {
      margin: 15px 0;
      padding-left: 4px;
    }

    .location-row {
      display: flex;
      gap: 11px;
      min-height: 30px;
    }

    .location-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--yellow);
      margin-top: 4px;
      flex-shrink: 0;
    }

    .location-dot.destination {
      background: white;
      border: 2px solid var(--yellow);
    }

    .location-text {
      color: #ddd;
      font-size: 12px;
      line-height: 17px;
      word-break: break-word;
    }

    .route-line {
      width: 1px;
      height: 14px;
      background: #4b4b4b;
      margin: -2px 0 -2px 4px;
    }

    .ride-bottom {
      border-top: 1px solid #282828;
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .ride-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ride-info small {
      color: var(--gray);
      font-size: 10px;
    }

    .ride-info strong {
      font-size: 13px;
    }

    .earning {
      text-align: right;
    }

    .earning span {
      display: block;
      color: var(--gray);
      font-size: 10px;
      margin-bottom: 3px;
    }

    .earning strong {
      color: var(--yellow);
      font-size: 18px;
    }

    /* EMPTY */

    .empty {
      display: none;
      text-align: center;
      padding: 70px 25px;
      color: var(--gray);
    }

    .empty-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 17px;
      border-radius: 50%;
      background: #171717;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .empty h3 {
      color: white;
      font-size: 16px;
      margin-bottom: 7px;
    }

    .empty p {
      font-size: 12px;
      line-height: 18px;
    }

    /* LOADING */

    .loading-box {
      text-align: center;
      padding: 55px 20px;
      color: var(--gray);
      font-size: 12px;
    }

    .loader {
      width: 35px;
      height: 35px;
      border: 3px solid #292929;
      border-top-color: var(--yellow);
      border-radius: 50%;
      animation: rotate .8s linear infinite;
      margin: 0 auto 14px;
    }

    /* NAVIGATION */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72px;
      z-index: 200;
      background: rgba(10, 10, 10, .97);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(15px);
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #777;
      min-width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      cursor: pointer;
    }

    .nav-item .icon {
      font-size: 21px;
      line-height: 22px;
    }

    .nav-item.active {
      color: var(--yellow);
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 88px;
      transform: translate(-50%, 20px);
      background: #222;
      border: 1px solid #333;
      color: white;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 500;
      max-width: 85%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 700px) {
      .page {
        max-width: 700px;
        margin: auto;
      }

      .bottom-nav {
        max-width: 700px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- HEADER -->
  <header class="topbar">
    <button class="back-btn" id="backBtn" aria-label="Back">‹</button>

    <div class="title-area">
      <h1>Ride History</h1>
      <p>Your completed and cancelled rides</p>
    </div>

    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh">↻</button>
  </header>

  <!-- FILTER -->
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="completed">Completed</button>
    <button class="filter-btn" data-filter="cancelled">Cancelled</button>
  </div>

  <!-- SUMMARY -->
  <section class="summary">
    <div class="summary-card">
      <div class="label">Total Rides</div>
      <div class="value" id="totalRides">0</div>
    </div>

    <div class="summary-card">
      <div class="label">Total Earnings</div>
      <div class="value yellow" id="totalEarnings">₹0</div>
    </div>
  </section>

  <!-- HISTORY -->
  <main class="history-container">

    <div class="section-title">
      <h2>Recent Rides</h2>
      <span id="rideCount">0 rides</span>
    </div>

    <div class="loading-box" id="loadingBox">
      <div class="loader"></div>
      Loading ride history...
    </div>

    <div class="ride-list" id="rideList"></div>

    <div class="empty" id="emptyBox">
      <div class="empty-icon">🛵</div>
      <h3>No rides found</h3>
      <p>Your completed and cancelled rides will appear here.</p>
    </div>

  </main>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="nav-item" data-page="home">
    <span class="icon">⌂</span>
    <span>Home</span>
  </button>

  <button class="nav-item active" data-page="history">
    <span class="icon">▣</span>
    <span>History</span>
  </button>

  <button class="nav-item" data-page="wallet">
    <span class="icon">₹</span>
    <span>Wallet</span>
  </button>

  <button class="nav-item" data-page="profile">
    <span class="icon">●</span>
    <span>Profile</span>
  </button>

</nav>

<div class="toast" id="toast"></div>

<script type="module">

  import {
    getAuth,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    orderBy,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import { app } from "../firebase/Firebase-config.js";

  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let allRides = [];
  let currentFilter = "all";

  const rideList = document.getElementById("rideList");
  const loadingBox = document.getElementById("loadingBox");
  const emptyBox = document.getElementById("emptyBox");
  const totalRides = document.getElementById("totalRides");
  const totalEarnings = document.getElementById("totalEarnings");
  const rideCount = document.getElementById("rideCount");
  const refreshBtn = document.getElementById("refreshBtn");

  /* -----------------------------
     AUTH
  ----------------------------- */

  onAuthStateChanged(auth, async (user) => {

    if (!user) {
      window.location.href = "../auth/login.html";
      return;
    }

    currentUser = user;

    await loadRideHistory();
  });


  /* -----------------------------
     LOAD HISTORY
  ----------------------------- */

  async function loadRideHistory() {

    showLoading(true);

    try {

      /*
       * RiderX Firestore structure:
       *
       * rides/{rideId}
       *
       * riderId
       * customerId
       * status
       * pickup
       * destination
       * fare
       * distance
       * serviceType
       * createdAt
       */

      const ridesRef = collection(db, "rides");

      let q;

      try {

        q = query(
          ridesRef,
          where("riderId", "==", currentUser.uid),
          orderBy("createdAt", "desc")
        );

        const snapshot = await getDocs(q);

        allRides = [];

        snapshot.forEach((doc) => {
          allRides.push({
            id: doc.id,
            ...doc.data()
          });
        });

      } catch (indexError) {

        /*
         * Fallback query if Firestore asks for an index.
         */

        q = query(
          ridesRef,
          where("riderId", "==", currentUser.uid)
        );

        const snapshot = await getDocs(q);

        allRides = [];

        snapshot.forEach((doc) => {
          allRides.push({
            id: doc.id,
            ...doc.data()
          });
        });

        allRides.sort((a, b) => {
          return getTime(b.createdAt) - getTime(a.createdAt);
        });
      }

      updateSummary();
      renderRides();

    } catch (error) {

      console.error("Ride history error:", error);

      allRides = [];

      showToast(
        "Unable to load ride history. Please try again."
      );

      renderRides();

    } finally {

      showLoading(false);
    }
  }


  /* -----------------------------
     RENDER
  ----------------------------- */

  function renderRides() {

    rideList.innerHTML = "";

    let rides = allRides;

    if (currentFilter !== "all") {
      rides = allRides.filter(
        ride => normalizeStatus(ride.status) === currentFilter
      );
    }

    rideCount.textContent =
      `${rides.length} ${rides.length === 1 ? "ride" : "rides"}`;

    if (!rides.length) {
      emptyBox.style.display = "block";
      return;
    }

    emptyBox.style.display = "none";

    rides.forEach(ride => {

      const card = createRideCard(ride);

      rideList.appendChild(card);
    });
  }


  /* -----------------------------
     CREATE RIDE CARD
  ----------------------------- */

  function createRideCard(ride) {

    const card = document.createElement("article");

    card.className = "ride-card";

    const status = normalizeStatus(ride.status);

    const serviceType =
      ride.serviceType ||
      ride.service ||
      ride.vehicleType ||
      "Bike Taxi";

    const pickup =
      getLocationText(
        ride.pickup ||
        ride.pickupLocation ||
        ride.from
      );

    const destination =
      getLocationText(
        ride.destination ||
        ride.dropoff ||
        ride.dropLocation ||
        ride.to
      );

    const fare =
      Number(
        ride.fare ??
        ride.amount ??
        ride.earning ??
        ride.totalFare ??
        0
      );

    const distance =
      ride.distance ??
      ride.km ??
      ride.totalDistance ??
      0;

    const date =
      formatDate(ride.createdAt);

    const time =
      formatTime(ride.createdAt);

    const icon =
      getServiceIcon(serviceType);

    card.innerHTML = `

      <div class="ride-top">

        <div class="ride-type">

          <div class="service-icon">
            ${icon}
          </div>

          <div>
            <h3>${escapeHTML(serviceType)}</h3>
            <p>${escapeHTML(date)} • ${escapeHTML(time)}</p>
          </div>

        </div>

        <span class="status ${status}">
          ${escapeHTML(status)}
        </span>

      </div>


      <div class="route">

        <div class="location-row">

          <div class="location-dot"></div>

          <div class="location-text">
            ${escapeHTML(pickup)}
          </div>

        </div>

        <div class="route-line"></div>

        <div class="location-row">

          <div class="location-dot destination"></div>

          <div class="location-text">
            ${escapeHTML(destination)}
          </div>

        </div>

      </div>


      <div class="ride-bottom">

        <div class="ride-info">

          <small>Distance</small>

          <strong>
            ${escapeHTML(formatDistance(distance))}
          </strong>

        </div>


        <div class="ride-info">

          <small>Ride ID</small>

          <strong>
            #${escapeHTML(
              String(ride.id).slice(-7).toUpperCase()
            )}
          </strong>

        </div>


        <div class="earning">

          <span>Earning</span>

          <strong>
            ${status === "cancelled" ? "₹0" : formatMoney(fare)}
          </strong>

        </div>

      </div>
    `;

    return card;
  }


  /* -----------------------------
     SUMMARY
  ----------------------------- */

  function updateSummary() {

    const validRides = allRides.filter(ride => {
      const status = normalizeStatus(ride.status);
      return status === "completed";
    });

    let earnings = 0;

    validRides.forEach(ride => {

      earnings += Number(
        ride.fare ??
        ride.amount ??
        ride.earning ??
        ride.totalFare ??
        0
      ) || 0;

    });

    totalRides.textContent = validRides.length;

    totalEarnings.textContent =
      formatMoney(earnings);
  }


  /* -----------------------------
     FILTER
  ----------------------------- */

  document.querySelectorAll(".filter-btn")
    .forEach(button => {

      button.addEventListener("click", () => {

        document.querySelectorAll(".filter-btn")
          .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        currentFilter =
          button.dataset.filter || "all";

        renderRides();
      });

    });


  /* -----------------------------
     REFRESH
  ----------------------------- */

  refreshBtn.addEventListener("click", async () => {

    refreshBtn.classList.add("loading");

    await loadRideHistory();

    setTimeout(() => {
      refreshBtn.classList.remove("loading");
    }, 400);

  });


  /* -----------------------------
     BACK
  ----------------------------- */

  document.getElementById("backBtn")
    .addEventListener("click", () => {

      if (document.referrer) {
        history.back();
      } else {
        window.location.href = "./home.html";
      }

    });


  /* -----------------------------
     BOTTOM NAV
  ----------------------------- */

  document.querySelectorAll(".nav-item")
    .forEach(item => {

      item.addEventListener("click", () => {

        const page = item.dataset.page;

        if (page === "home") {
          window.location.href = "./home.html";
        }

        if (page === "history") {
          window.location.href = "./history.html";
        }

        if (page === "wallet") {
          window.location.href = "./wallet.html";
        }

        if (page === "profile") {
          window.location.href = "./profile.html";
        }

      });

    });


  /* -----------------------------
     HELPERS
  ----------------------------- */

  function normalizeStatus(status) {

    const value =
      String(status || "")
        .toLowerCase()
        .trim();

    if (
      value === "complete" ||
      value === "completed" ||
      value === "finished" ||
      value === "success"
    ) {
      return "completed";
    }

    if (
      value === "cancel" ||
      value === "cancelled" ||
      value === "canceled"
    ) {
      return "cancelled";
    }

    return "pending";
  }


  function getLocationText(location) {

    if (!location) {
      return "Location unavailable";
    }

    if (typeof location === "string") {
      return location;
    }

    if (typeof location === "object") {

      return (
        location.address ||
        location.name ||
        location.label ||
        location.text ||
        location.formattedAddress ||
        "Location unavailable"
      );
    }

    return "Location unavailable";
  }


  function getServiceIcon(service) {

    const value =
      String(service || "").toLowerCase();

    if (value.includes("cab") ||
        value.includes("car")) {
      return "🚕";
    }

    if (value.includes("parcel") ||
        value.includes("delivery")) {
      return "📦";
    }

    if (value.includes("food")) {
      return "🍔";
    }

    return "🛵";
  }


  function formatMoney(value) {

    const amount =
      Number(value) || 0;

    return "₹" +
      amount.toLocaleString("en-IN", {
        maximumFractionDigits: 0
      });
  }


  function formatDistance(value) {

    if (
      value === undefined ||
      value === null ||
      value === ""
    ) {
      return "—";
    }

    if (typeof value === "string") {
      return value.includes("km")
        ? value
        : `${value} km`;
    }

    const km = Number(value);

    if (Number.isNaN(km)) {
      return "—";
    }

    return `${km.toFixed(km % 1 ? 1 : 0)} km`;
  }


  function getTime(value) {

    if (!value) {
      return 0;
    }

    if (
      typeof value === "object" &&
      typeof value.toMillis === "function"
    ) {
      return value.toMillis();
    }

    if (
      typeof value === "object" &&
      value.seconds
    ) {
      return value.seconds * 1000;
    }

    const time =
      new Date(value).getTime();

    return Number.isNaN(time) ? 0 : time;
  }


  function formatDate(value) {

    const timestamp = getTime(value);

    if (!timestamp) {
      return "Date unavailable";
    }

    return new Intl.DateTimeFormat("en-IN", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }).format(timestamp);
  }


  function formatTime(value) {

    const timestamp = getTime(value);

    if (!timestamp) {
      return "";
    }

    return new Intl.DateTimeFormat("en-IN", {
      hour: "2-digit",
      minute: "2-digit"
    }).format(timestamp);
  }


  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function showLoading(show) {

    loadingBox.style.display =
      show ? "block" : "none";

    if (show) {
      emptyBox.style.display = "none";
    }
  }


  function showToast(message) {

    const toast =
      document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);
  }

</script>

</body>
