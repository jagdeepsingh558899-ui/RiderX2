<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>RiderX | Ride History</title><link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>

:root{
    --yellow:#ffe500;
    --black:#000;
    --dark:#0b0b0b;
    --card:#151515;
    --line:#282828;
    --muted:#888;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Poppins,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    padding-bottom:25px;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    height:64px;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(8,8,8,.97);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(12px);
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.back{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#181818;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.logo{
    font-size:20px;
    font-weight:900;
}

.logo span{
    color:var(--yellow);
}

.header-title{
    color:#999;
    font-size:11px;
    margin-top:2px;
}

.header-icon{
    color:var(--yellow);
    font-size:18px;
}

.container{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:16px 14px 30px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:16px;
}

.summary-card{
    background:#131313;
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 7px;
    text-align:center;
}

.summary-card i{
    color:var(--yellow);
    font-size:16px;
    margin-bottom:7px;
}

.summary-number{
    font-size:19px;
    font-weight:900;
}

.summary-label{
    margin-top:3px;
    color:#777;
    font-size:9px;
}

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:15px;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    min-width:85px;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:13px;
    background:#121212;
    color:#aaa;
    font-size:11px;
    font-weight:700;
}

.filter.active{
    background:var(--yellow);
    color:#000;
    border-color:var(--yellow);
}

.history{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.ride-card{
    background:#121212;
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    cursor:pointer;
    transition:transform .15s ease,border-color .2s ease;
}

.ride-card:active{
    transform:scale(.985);
}

.ride-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.service{
    display:flex;
    align-items:center;
    gap:9px;
}

.service-icon{
    width:38px;
    height:38px;
    border-radius:11px;
    background:#202020;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--yellow);
}

.service-name{
    font-size:13px;
    font-weight:800;
}

.ride-date{
    margin-top:4px;
    color:#666;
    font-size:9px;
}

.fare{
    color:var(--yellow);
    font-size:17px;
    font-weight:900;
    text-align:right;
}

.status{
    display:inline-flex;
    margin-top:5px;
    padding:4px 8px;
    border-radius:20px;
    font-size:8px;
    font-weight:800;
}

.status.completed{
    background:#10301c;
    color:var(--green);
}

.status.cancelled{
    background:#321313;
    color:#ff6b6b;
}

.status.other{
    background:#292929;
    color:#aaa;
}

.route{
    position:relative;
    margin-top:13px;
    padding:11px 12px;
    background:#0d0d0d;
    border-radius:13px;
}

.route-row{
    display:flex;
    align-items:center;
    gap:10px;
    min-height:27px;
}

.route-row + .route-row{
    margin-top:4px;
}

.dot{
    width:9px;
    height:9px;
    min-width:9px;
    border-radius:50%;
}

.pickup{
    background:var(--green);
}

.drop{
    background:var(--yellow);
}

.route-text{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:#bbb;
    font-size:10px;
}

.ride-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-top:11px;
    padding-top:10px;
    border-top:1px solid #242424;
    color:#777;
    font-size:9px;
}

.details{
    color:var(--yellow);
    font-weight:700;
}

.loading{
    padding:40px 15px;
    text-align:center;
    color:#666;
}

.loading i{
    color:var(--yellow);
    font-size:25px;
    margin-bottom:10px;
}

.empty{
    display:none;
    padding:45px 20px;
    text-align:center;
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    color:#666;
}

.empty i{
    display:block;
    color:#444;
    font-size:34px;
    margin-bottom:12px;
}

.empty-title{
    color:#aaa;
    font-size:14px;
    font-weight:700;
}

.empty-text{
    margin-top:5px;
    font-size:10px;
}

.error{
    display:none;
    padding:20px;
    text-align:center;
    color:#ff6b6b;
    background:#180909;
    border:1px solid #3a1717;
    border-radius:16px;
    font-size:11px;
}

@media(max-width:380px){

    .container{
        padding-left:10px;
        padding-right:10px;
    }

    .summary-card{
        padding:12px 5px;
    }

    .summary-number{
        font-size:17px;
    }

}

</style></head><body><header class="header"><div class="header-left">

    <button
        class="back"
        id="backBtn"
        type="button"
        aria-label="Back"
    >
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div>

        <div class="logo">
            RIDER<span>X</span>
        </div>

        <div class="header-title">
            Ride History
        </div>

    </div>

</div>

<i class="fa-solid fa-clock-rotate-left header-icon"></i>

</header><main class="container"><!-- SUMMARY -->

<section class="summary">

    <div class="summary-card">

        <i class="fa-solid fa-road"></i>

        <div
            id="totalRides"
            class="summary-number"
        >
            0
        </div>

        <div class="summary-label">
            Total Rides
        </div>

    </div>


    <div class="summary-card">

        <i class="fa-solid fa-circle-check"></i>

        <div
            id="completedRides"
            class="summary-number"
        >
            0
        </div>

        <div class="summary-label">
            Completed
        </div>

    </div>


    <div class="summary-card">

        <i class="fa-solid fa-indian-rupee-sign"></i>

        <div
            id="totalEarned"
            class="summary-number"
        >
            ₹0
        </div>

        <div class="summary-label">
            Earned
        </div>

    </div>

</section>


<!-- FILTERS -->

<div class="filters">

    <button
        class="filter active"
        data-filter="all"
        type="button"
    >
        All
    </button>

    <button
        class="filter"
        data-filter="completed"
        type="button"
    >
        Completed
    </button>

    <button
        class="filter"
        data-filter="cancelled"
        type="button"
    >
        Cancelled
    </button>

</div>


<!-- HISTORY -->

<section
    id="history"
    class="history"
>

    <div class="loading">

        <i class="fa-solid fa-spinner fa-spin"></i>

        <div>
            Loading ride history...
        </div>

    </div>

</section>


<!-- EMPTY -->

<div
    id="empty"
    class="empty"
>

    <i class="fa-solid fa-route"></i>

    <div class="empty-title">
        No rides found
    </div>

    <div class="empty-text">
        Your ride history will appear here.
    </div>

</div>


<!-- ERROR -->

<div
    id="error"
    class="error"
>
    Unable to load ride history. Please try again.
</div>

</main><script type="module">

import { auth, db } from "../firebase/config.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const $ = id =>
    document.getElementById(id);


let allRides = [];

let activeFilter = "all";


/* =========================================
   BACK
========================================= */

$("backBtn")?.addEventListener(
    "click",
    () => history.back()
);


/* =========================================
   DATE
========================================= */

function getRideDate(data){

    const value =
        data.completedAt ||
        data.updatedAt ||
        data.createdAt;

    if(!value) return null;

    if(
        typeof value.toDate ===
        "function"
    ){
        return value.toDate();
    }

    if(value.seconds){
        return new Date(
            value.seconds * 1000
        );
    }

    const date = new Date(value);

    return isNaN(date.getTime())
        ? null
        : date;
}


/* =========================================
   STATUS
========================================= */

function normalizeStatus(value){

    const status =
        String(value || "")
            .trim()
            .toLowerCase();

    if(
        status === "completed" ||
        status === "complete" ||
        status === "finished"
    ){
        return "completed";
    }

    if(
        status === "cancelled" ||
        status === "canceled" ||
        status === "cancel"
    ){
        return "cancelled";
    }

    return "other";
}


/* =========================================
   SERVICE ICON
========================================= */

function serviceIcon(service){

    const value =
        String(service || "")
            .toLowerCase();

    if(
        value.includes("cab") ||
        value.includes("car")
    ){
        return "fa-car";
    }

    if(value.includes("parcel")){
        return "fa-box";
    }

    if(value.includes("food")){
        return "fa-utensils";
    }

    return "fa-motorcycle";
}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(date){

    if(!date){
        return "Date unavailable";
    }

    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================
   LOAD
========================================= */

async function loadHistory(uid){

    try{

        $("error").style.display =
            "none";

        const q = query(
            collection(db,"rides"),
            where("riderId","==",uid)
        );

        const snapshot =
            await getDocs(q);

        allRides = [];

        snapshot.forEach(
            rideDoc => {

                allRides.push({
                    id:rideDoc.id,
                    ...rideDoc.data()
                });

            }
        );


        allRides.sort(
            (a,b) => {

                const da =
                    getRideDate(a)?.getTime() || 0;

                const db =
                    getRideDate(b)?.getTime() || 0;

                return db - da;

            }
        );


        updateSummary();

        render();


    }catch(error){

        console.error(
            "History error:",
            error
        );

        $("history").innerHTML = "";

        $("empty").style.display =
            "none";

        $("error").style.display =
            "block";

    }

}


/* =========================================
   SUMMARY
========================================= */

function updateSummary(){

    const completed =
        allRides.filter(
            ride =>
                normalizeStatus(
                    ride.status
                ) === "completed"
        );


    let earned = 0;


    completed.forEach(
        ride => {

            earned += Number(
                ride.fare ??
                ride.totalFare ??
                ride.amount ??
                0
            );

        }
    );


    $("totalRides").innerText =
        allRides.length;


    $("completedRides").innerText =
        completed.length;


    $("totalEarned").innerText =
        "₹" +
        Math.round(earned)
            .toLocaleString("en-IN");

}


/* =========================================
   FILTER
========================================= */

function getFiltered(){

    if(activeFilter === "all"){
        return allRides;
    }

    return allRides.filter(
        ride =>
            normalizeStatus(
                ride.status
            ) === activeFilter
    );

}


/* =========================================
   RENDER
========================================= */

function render(){

    const rides =
        getFiltered();

    const container =
        $("history");

    container.innerHTML = "";


    if(!rides.length){

        $("empty").style.display =
            "block";

        return;

    }


    $("empty").style.display =
        "none";


    rides.forEach(
        ride => {

            const status =
                normalizeStatus(
                    ride.status
                );


            const service =
                ride.serviceType ||
                ride.service ||
                "Bike";


            const fare =
                Number(
                    ride.fare ??
                    ride.totalFare ??
                    ride.amount ??
                    0
                );


            const distance =
                Number(
                    ride.distance ??
                    ride.distanceKm ??
                    0
                );


            const pickup =
                ride.pickupLocation ||
                ride.pickupAddress ||
                ride.pickup ||
                "Pickup location";


            const drop =
                ride.dropoffLocation ||
                ride.dropLocation ||
                ride.destination ||
                ride.dropoffAddress ||
                "Destination";


            const date =
                getRideDate(ride);


            const payment =
                ride.paymentMethod ||
                ride.payment ||
                "Cash";


            const card =
                document.createElement("div");


            card.className =
                "ride-card";


            card.innerHTML = `

                <div class="ride-head">

                    <div class="service">

                        <div class="service-icon">

                            <i class="fa-solid ${serviceIcon(service)}"></i>

                        </div>

                        <div>

                            <div class="service-name">
                                ${escapeHtml(service)}
                            </div>

                            <div class="ride-date">
                                ${escapeHtml(formatDate(date))}
                            </div>

                        </div>

                    </div>


                    <div>

                        <div class="fare">
                            ₹${Math.round(fare).toLocaleString("en-IN")}
                        </div>

                        <div class="status ${status}">
                            ${escapeHtml(statusText(status))}
                        </div>

                    </div>

                </div>


                <div class="route">

                    <div class="route-row">

                        <span class="dot pickup"></span>

                        <span class="route-text">
                            ${escapeHtml(pickup)}
                        </span>

                    </div>


                    <div class="route-row">

                        <span class="dot drop"></span>

                        <span class="route-text">
                            ${escapeHtml(drop)}
                        </span>

                    </div>

                </div>


                <div class="ride-footer">

                    <span>
                        <i class="fa-solid fa-route"></i>
                        ${distance.toFixed(1)} KM
                    </span>

                    <span>
                        <i class="fa-solid fa-wallet"></i>
                        ${escapeHtml(payment)}
                    </span>

                    <span class="details">
                        View details
                        <i class="fa-solid fa-chevron-right"></i>
                    </span>

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    sessionStorage.setItem(
                        "riderxSelectedRide",
                        JSON.stringify(ride)
                    );

                    location.href =
                        `ride-details.html?id=${encodeURIComponent(ride.id)}`;

                }
            );


            container.appendChild(card);

        }
    );

}


/* =========================================
   STATUS TEXT
========================================= */

function statusText(status){

    if(status === "completed"){
        return "COMPLETED";
    }

    if(status === "cancelled"){
        return "CANCELLED";
    }

    return "RIDE";
}


/* =========================================
   SAFE HTML
========================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   FILTER BUTTONS
========================================= */

document.querySelectorAll(
    ".filter"
).forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
                .querySelectorAll(".filter")
                .forEach(
                    item =>
                        item.classList.remove("active")
                );


            button.classList.add("active");


            activeFilter =
                button.dataset.filter ||
                "all";


            render();

        }
    );

});


/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            location.href =
                "../auth/login.html";

            return;

        }


        loadHistory(
            user.uid
        );

    }
);

</script></body>
</html>
