<!DOCTYPE html>
<html lang="en" class="dark">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Profile</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#050505;
color:#fff;
padding-bottom:90px;

}


:root{

--yellow:#FFE500;
--card:#121212;

}




.header{

height:70px;

background:#111;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

border-bottom:1px solid #222;

}



.logo{

font-size:30px;

font-weight:900;

}



.logo span{

color:var(--yellow);

}





.container{

padding:20px;

}





.card{

background:var(--card);

border-radius:22px;

padding:20px;

border:1px solid #292929;

margin-bottom:20px;

}





.profile-top{

text-align:center;

}




.profile-img{

width:120px;

height:120px;

border-radius:50%;

object-fit:cover;

border:4px solid var(--yellow);

}





.photo-btn{

display:inline-block;

margin-top:15px;

background:var(--yellow);

color:#000;

padding:10px 20px;

border-radius:12px;

font-weight:bold;

}





#photoInput{

display:none;

}





.name{

font-size:22px;

font-weight:bold;

margin-top:10px;

}



.rider-id{

color:#999;

margin-top:5px;

}





.input-group{

margin-top:15px;

}



.input-group label{

display:block;

color:#999;

font-size:14px;

margin-bottom:7px;

}



.input{

width:100%;

padding:14px;

background:#000;

border:1px solid #333;

border-radius:12px;

color:white;

outline:none;

}





.btn{

width:100%;

padding:15px;

border:none;

border-radius:14px;

margin-top:15px;

background:var(--yellow);

color:#000;

font-size:16px;

font-weight:bold;

}





.setting{

background:#1b1b1b;

color:white;

border:1px solid #333;

}



.logout{

background:#ff3030;

color:white;

}




.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

height:75px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

border-top:1px solid #333;

}



.bottom a{

color:#777;

text-decoration:none;

text-align:center;

font-size:12px;

}



.bottom i{

font-size:22px;

display:block;

margin-bottom:5px;

}



.active{

color:var(--yellow)!important;

}



</style>

</head>



<body>



<header class="header">


<div class="logo">

RID<span>ERX</span>

</div>


<i onclick="logout()"
class="fa-solid fa-right-from-bracket"
style="color:#ff3030;font-size:22px">

</i>


</header>





<div class="container">





<div class="card profile-top">



<img id="profileImage"

src="../assets/Logo/RiderX-logo.png"

class="profile-img">



<br>


<label class="photo-btn"
for="photoInput">


<i class="fa-solid fa-camera"></i>

Change Photo


</label>



<input id="photoInput"
type="file"
accept="image/*">





<div class="name"
id="riderName">

Rider


</div>



<div class="rider-id">

Rider ID:
<span id="riderId">---</span>

</div>



</div>






<div class="card">



<h3 style="color:#FFE500">

Personal Information

</h3>





<div class="input-group">

<label>Name</label>

<input id="name"
class="input">

</div>




<div class="input-group">

<label>Phone</label>

<input id="phone"
class="input">

</div>





<div class="input-group">

<label>Email</label>

<input id="email"
class="input"
readonly>

</div>





<div class="input-group">

<label>Address</label>

<textarea id="address"
class="input"></textarea>

</div>





</div>







<div class="card">


<h3 style="color:#FFE500">

Vehicle Details

</h3>




<div class="input-group">

<label>Vehicle Type</label>

<input id="vehicleType"
class="input"
placeholder="Bike">

</div>




<div class="input-group">

<label>Vehicle Number</label>

<input id="vehicleNumber"
class="input"
placeholder="PB XX XXXX">

</div>



<button class="btn"
onclick="saveProfile()">


<i class="fa-solid fa-save"></i>

Save Profile


</button>



<button class="btn setting"
onclick="openSettings()">


<i class="fa-solid fa-gear"></i>

Settings


</button>



<button class="btn logout"
onclick="logout()">


<i class="fa-solid fa-right-from-bracket"></i>

Logout


</button>



</div>
<script type="module">

import {

auth,
db,
storage

}

from "../firebase/firebase-config.js";



import {

onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";



import {

doc,
getDoc,
setDoc

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



import {

ref,
uploadBytes,
getDownloadURL

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";





let currentUser=null;

let selectedPhoto=null;







// ===========================
// LOAD RIDER PROFILE
// ===========================


onAuthStateChanged(auth,async(user)=>{


if(!user){


location.href="../auth/login.html";

return;


}



currentUser=user;



email.value=user.email || "";



const snap =
await getDoc(
doc(db,"users",user.uid)
);



if(snap.exists()){


const data=snap.data();



name.value=data.name || "";

phone.value=data.phone || "";

address.value=data.address || "";

vehicleType.value=data.vehicleType || "Bike";

vehicleNumber.value=data.vehicleNumber || "";



riderName.innerText =
data.name || "Rider";



riderId.innerText =
user.uid.substring(0,8);




if(data.photoURL){

profileImage.src=data.photoURL;

}



}



});







// ===========================
// PHOTO SELECT
// ===========================


photoInput.addEventListener(
"change",
(e)=>{


selectedPhoto=e.target.files[0];



if(selectedPhoto){


let reader=new FileReader();



reader.onload=()=>{


profileImage.src=reader.result;


};



reader.readAsDataURL(selectedPhoto);



}



});









// ===========================
// SAVE PROFILE
// ===========================


window.saveProfile=async()=>{


try{


let photoURL="";



if(selectedPhoto){



const imageRef =
ref(
storage,
"riders/profile/"+currentUser.uid
);



await uploadBytes(
imageRef,
selectedPhoto
);



photoURL =
await getDownloadURL(imageRef);



}





let data={


name:name.value.trim(),


phone:phone.value.trim(),


address:address.value.trim(),


vehicleType:
vehicleType.value,


vehicleNumber:
vehicleNumber.value,


role:"rider",


updatedAt:new Date()



};





if(photoURL){


data.photoURL=photoURL;


}






await setDoc(

doc(
db,
"users",
currentUser.uid
),


data,


{
merge:true
}

);



alert(
"Profile Updated Successfully"
);



riderName.innerText=name.value;



}



catch(error){


alert(error.message);


}



};









// ===========================
// SETTINGS
// ===========================


window.openSettings=()=>{


location.href="settings.html";


};








// ===========================
// LOGOUT
// ===========================


window.logout=async()=>{


await signOut(auth);


location.href="../auth/login.html";


};



</script>

<i class="fa-solid fa-house"></i>

<i class="fa-solid fa-user"></i>

</a>



</nav>




</body>

</html>
