<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="theme-color" content="#FFD000">
  <title>RiderX - Rider Profile</title>

  <link rel="stylesheet" href="../css/Style.css">
  <link rel="stylesheet" href="../css/Responsive.css">

  <style>
    :root{
      --yellow:#FFD000;
      --yellow-dark:#e6b900;
      --black:#080808;
      --card:#151515;
      --card2:#1d1d1d;
      --text:#fff;
      --muted:#a9a9a9;
      --border:rgba(255,255,255,.09);
      --green:#22c55e;
      --red:#ef4444;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;
      background:var(--black);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      overflow-x:hidden;
      padding-bottom:85px;
    }

    button,input,select{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
    }

    .page{
      width:100%;
      max-width:600px;
      margin:auto;
      min-height:100vh;
      background:#080808;
    }

    /* HEADER */
    .header{
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:15px 16px;
      background:rgba(8,8,8,.95);
      border-bottom:1px solid var(--border);
      backdrop-filter:blur(12px);
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .back-btn{
      width:42px;
      height:42px;
      border-radius:13px;
      background:#191919;
      color:#fff;
      font-size:22px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .back-btn:active{
      transform:scale(.95);
    }

    .header-title{
      font-size:20px;
      font-weight:800;
    }

    .notification-btn{
      position:relative;
      width:42px;
      height:42px;
      border-radius:13px;
      background:#191919;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
    }

    .notification-dot{
      position:absolute;
      top:8px;
      right:8px;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--yellow);
      border:2px solid #191919;
    }

    /* PROFILE HERO */
    .profile-hero{
      padding:26px 18px 20px;
      text-align:center;
    }

    .avatar-wrap{
      position:relative;
      width:105px;
      height:105px;
      margin:0 auto 14px;
    }

    .avatar{
      width:105px;
      height:105px;
      border-radius:50%;
      background:linear-gradient(145deg,#252525,#101010);
      border:3px solid var(--yellow);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:0 0 0 5px rgba(255,208,0,.08);
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .avatar-letter{
      font-size:42px;
      font-weight:900;
      color:var(--yellow);
    }

    .camera-btn{
      position:absolute;
      right:-2px;
      bottom:0;
      width:34px;
      height:34px;
      border-radius:50%;
      background:var(--yellow);
      color:#000;
      border:3px solid #080808;
      font-size:15px;
    }

    .profile-name{
      margin:0;
      font-size:24px;
      font-weight:900;
    }

    .profile-phone{
      margin:6px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .online-status{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-top:12px;
      padding:7px 12px;
      border-radius:20px;
      background:rgba(34,197,94,.10);
      color:#54e37d;
      font-size:12px;
      font-weight:700;
    }

    .online-status span{
      width:8px;
      height:8px;
      background:var(--green);
      border-radius:50%;
    }

    /* STATS */
    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
      padding:0 15px 18px;
    }

    .stat{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:15px;
      padding:15px 7px;
      text-align:center;
    }

    .stat-value{
      font-size:18px;
      font-weight:900;
    }

    .stat-label{
      color:var(--muted);
      font-size:11px;
      margin-top:5px;
    }

    /* SECTION */
    .section{
      padding:0 15px;
      margin-bottom:18px;
    }

    .section-title{
      font-size:15px;
      font-weight:800;
      margin:0 0 9px 4px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:17px;
      overflow:hidden;
    }

    .menu-item{
      width:100%;
      min-height:60px;
      padding:12px 15px;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      gap:13px;
      text-align:left;
      border-bottom:1px solid var(--border);
    }

    .menu-item:last-child{
      border-bottom:0;
    }

    .menu-item:active{
      background:#202020;
    }

    .menu-icon{
      width:39px;
      height:39px;
      flex:0 0 39px;
      border-radius:12px;
      background:#222;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
    }

    .menu-content{
      min-width:0;
      flex:1;
    }

    .menu-title{
      font-size:14px;
      font-weight:800;
    }

    .menu-subtitle{
      margin-top:3px;
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .arrow{
      color:#777;
      font-size:20px;
    }

    .danger .menu-title{
      color:#ff6262;
    }

    /* VEHICLE */
    .vehicle-card{
      padding:15px;
    }

    .vehicle-top{
      display:flex;
      align-items:center;
      gap:13px;
      margin-bottom:15px;
    }

    .vehicle-icon{
      width:52px;
      height:52px;
      border-radius:15px;
      background:rgba(255,208,0,.12);
      color:var(--yellow);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:25px;
    }

    .vehicle-name{
      font-weight:900;
      font-size:16px;
    }

    .vehicle-number{
      color:var(--muted);
      font-size:12px;
      margin-top:4px;
    }

    .vehicle-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .vehicle-info{
      background:#1d1d1d;
      border-radius:12px;
      padding:11px;
    }

    .vehicle-info-label{
      color:#888;
      font-size:10px;
    }

    .vehicle-info-value{
      margin-top:4px;
      font-size:13px;
      font-weight:700;
    }

    /* LOGOUT */
    .logout{
      margin:0 15px 25px;
      width:calc(100% - 30px);
      min-height:52px;
      border-radius:15px;
      background:#241313;
      color:#ff6262;
      border:1px solid rgba(255,80,80,.15);
      font-weight:800;
    }

    .logout:active{
      transform:scale(.98);
    }

    /* BOTTOM NAV */
    .bottom-nav{
      position:fixed;
      z-index:100;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:100%;
      max-width:600px;
      height:72px;
      padding:8px 8px calc(8px + env(safe-area-inset-bottom));
      background:rgba(12,12,12,.97);
      border-top:1px solid var(--border);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      backdrop-filter:blur(15px);
    }

    .nav-item{
      background:transparent;
      color:#777;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      border-radius:13px;
      font-size:10px;
      font-weight:700;
    }

    .nav-item .nav-icon{
      font-size:19px;
    }

    .nav-item.active{
      color:var(--yellow);
      background:rgba(255,208,0,.07);
    }

    /* MODAL */
    .modal{
      position:fixed;
      inset:0;
      z-index:200;
      display:none;
      align-items:flex-end;
      justify-content:center;
      background:rgba(0,0,0,.72);
    }

    .modal.show{
      display:flex;
    }

    .modal-box{
      width:100%;
      max-width:600px;
      max-height:92vh;
      overflow-y:auto;
      background:#111;
      border-radius:24px 24px 0 0;
      padding:20px 16px 30px;
      animation:slideUp .25s ease;
    }

    @keyframes slideUp{
      from{
        transform:translateY(100%);
      }
      to{
        transform:translateY(0);
      }
    }

    .modal-handle{
      width:42px;
      height:4px;
      background:#444;
      border-radius:10px;
      margin:0 auto 18px;
    }

    .modal-title{
      font-size:20px;
      font-weight:900;
      margin-bottom:18px;
    }

    .form-group{
      margin-bottom:14px;
    }

    .form-label{
      display:block;
      color:#aaa;
      font-size:12px;
      font-weight:700;
      margin:0 0 7px 2px;
    }

    .input{
      width:100%;
      height:50px;
      padding:0 14px;
      border:1px solid #303030;
      border-radius:13px;
      background:#1a1a1a;
      color:#fff;
      outline:none;
    }

    .input:focus{
      border-color:var(--yellow);
    }

    .modal-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:18px;
    }

    .btn{
      min-height:50px;
      border-radius:13px;
      font-weight:800;
    }

    .btn-cancel{
      background:#252525;
      color:#fff;
    }

    .btn-save{
      background:var(--yellow);
      color:#000;
    }

    /* TOAST */
    .toast{
      position:fixed;
      z-index:500;
      left:50%;
      bottom:88px;
      transform:translate(-50%,20px);
      width:calc(100% - 35px);
      max-width:480px;
      padding:13px 16px;
      background:#252525;
      border:1px solid #383838;
      border-radius:13px;
      text-align:center;
      font-size:13px;
      font-weight:700;
      opacity:0;
      pointer-events:none;
      transition:.25s;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    .hidden-file{
      display:none;
    }

    @media(min-width:601px){
      .bottom-nav{
        border-left:1px solid var(--border);
        border-right:1px solid var(--border);
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <button class="back-btn" id="backBtn" aria-label="Back">‹</button>
      <div class="header-title">My Profile</div>
    </div>

    <button class="notification-btn" id="notificationBtn" aria-label="Notifications">
      🔔
      <span class="notification-dot"></span>
    </button>
  </header>

  <!-- PROFILE -->
  <section class="profile-hero">

    <div class="avatar-wrap">
      <div class="avatar">
        <img id="profileImage" alt="Profile">
        <span class="avatar-letter" id="avatarLetter">R</span>
      </div>

      <button class="camera-btn" id="cameraBtn" aria-label="Change photo">📷</button>
      <input type="file" id="photoInput" class="hidden-file" accept="image/*">
    </div>

    <h1 class="profile-name" id="profileName">Rider</h1>
    <p class="profile-phone" id="profilePhone">Loading...</p>

    <div class="online-status">
      <span></span>
      Rider Account Active
    </div>
  </section>

  <!-- STATS -->
  <section class="stats">
    <div class="stat">
      <div class="stat-value" id="ridesCount">0</div>
      <div class="stat-label">Total Rides</div>
    </div>

    <div class="stat">
      <div class="stat-value" id="ratingValue">5.0</div>
      <div class="stat-label">Rating</div>
    </div>

    <div class="stat">
      <div class="stat-value" id="earningsValue">₹0</div>
      <div class="stat-label">Earnings</div>
    </div>
  </section>

  <!-- ACCOUNT -->
  <section class="section">
    <h2 class="section-title">Account</h2>

    <div class="card">

      <button class="menu-item" id="editProfileBtn">
        <div class="menu-icon">👤</div>
        <div class="menu-content">
          <div class="menu-title">Edit Profile</div>
          <div class="menu-subtitle">Update your personal information</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-item" id="vehicleBtn">
        <div class="menu-icon">🏍️</div>
        <div class="menu-content">
          <div class="menu-title">Vehicle Details</div>
          <div class="menu-subtitle" id="vehicleSummary">Add your vehicle information</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-item" id="documentsBtn">
        <div class="menu-icon">📄</div>
        <div class="menu-content">
          <div class="menu-title">Documents</div>
          <div class="menu-subtitle">Driving licence and vehicle documents</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-item" id="walletBtn">
        <div class="menu-icon">💳</div>
        <div class="menu-content">
          <div class="menu-title">Wallet & Earnings</div>
          <div class="menu-subtitle">View balance and earning history</div>
        </div>
        <div class="arrow">›</div>
      </button>

    </div>
  </section>

  <!-- VEHICLE CARD -->
  <section class="section">
    <h2 class="section-title">My Vehicle</h2>

    <div class="card vehicle-card">

      <div class="vehicle-top">
        <div class="vehicle-icon">🏍️</div>

        <div>
          <div class="vehicle-name" id="vehicleName">Bike</div>
          <div class="vehicle-number" id="vehicleNumber">Vehicle number not added</div>
        </div>
      </div>

      <div class="vehicle-grid">

        <div class="vehicle-info">
          <div class="vehicle-info-label">MODEL</div>
          <div class="vehicle-info-value" id="vehicleModel">Not added</div>
        </div>

        <div class="vehicle-info">
          <div class="vehicle-info-label">COLOR</div>
          <div class="vehicle-info-value" id="vehicleColor">Not added</div>
        </div>

        <div class="vehicle-info">
          <div class="vehicle-info-label">TYPE</div>
          <div class="vehicle-info-value" id="vehicleType">Bike Taxi</div>
        </div>

        <div class="vehicle-info">
          <div class="vehicle-info-label">STATUS</div>
          <div class="vehicle-info-value" id="vehicleStatus">Active</div>
        </div>

      </div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="section">
    <h2 class="section-title">Preferences</h2>

    <div class="card">

      <button class="menu-item" id="settingsBtn">
        <div class="menu-icon">⚙️</div>
        <div class="menu-content">
          <div class="menu-title">Settings</div>
          <div class="menu-subtitle">App preferences and account settings</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-item" id="languageBtn">
        <div class="menu-icon">🌐</div>
        <div class="menu-content">
          <div class="menu-title">Language</div>
          <div class="menu-subtitle" id="languageText">English</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-item" id="helpBtn">
        <div class="menu-icon">❓</div>
        <div class="menu-content">
          <div class="menu-title">Help & Support</div>
          <div class="menu-subtitle">Get help with RiderX</div>
        </div>
        <div class="arrow">›</div>
      </button>

      <button class="menu-item" id="termsBtn">
        <div class="menu-icon">🛡️</div>
        <div class="menu-content">
          <div class="menu-title">Terms & Privacy</div>
          <div class="menu-subtitle">RiderX terms and privacy policy</div>
        </div>
        <div class="arrow">›</div>
      </button>

    </div>
  </section>

  <!-- LOGOUT -->
  <button class="logout" id="logoutBtn">🚪 &nbsp; Logout</button>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="nav-item" data-page="home">
    <span class="nav-icon">⌂</span>
    <span>Home</span>
  </button>

  <button class="nav-item" data-page="rides">
    <span class="nav-icon">🏍️</span>
    <span>Rides</span>
  </button>

  <button class="nav-item" data-page="wallet">
    <span class="nav-icon">₹</span>
    <span>Wallet</span>
  </button>

  <button class="nav-item active" data-page="profile">
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </button>

</nav>

<!-- EDIT PROFILE MODAL -->
<div class="modal" id="profileModal">

  <div class="modal-box">

    <div class="modal-handle"></div>

    <div class="modal-title">Edit Profile</div>

    <div class="form-group">
      <label class="form-label">FULL NAME</label>
      <input class="input" id="editName" type="text" placeholder="Enter your name">
    </div>

    <div class="form-group">
      <label class="form-label">PHONE NUMBER</label>
      <input class="input" id="editPhone" type="tel" placeholder="Enter phone number">
    </div>

    <div class="form-group">
      <label class="form-label">EMAIL</label>
      <input class="input" id="editEmail" type="email" placeholder="Enter email">
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="cancelProfileBtn">Cancel</button>
      <button class="btn btn-save" id="saveProfileBtn">Save Changes</button>
    </div>

  </div>
</div>

<!-- VEHICLE MODAL -->
<div class="modal" id="vehicleModal">

  <div class="modal-box">

    <div class="modal-handle"></div>

    <div class="modal-title">Vehicle Details</div>

    <div class="form-group">
      <label class="form-label">VEHICLE TYPE</label>
      <select class="input" id="editVehicleType">
        <option value="Bike Taxi">Bike Taxi</option>
        <option value="Cab">Cab</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">VEHICLE MODEL</label>
      <input class="input" id="editVehicleModel" type="text" placeholder="Example: Honda Shine">
    </div>

    <div class="form-group">
      <label class="form-label">VEHICLE NUMBER</label>
      <input class="input" id="editVehicleNumber" type="text" placeholder="Example: PB10AB1234">
    </div>

    <div class="form-group">
      <label class="form-label">COLOR</label>
      <input class="input" id="editVehicleColor" type="text" placeholder="Example: Black">
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="cancelVehicleBtn">Cancel</button>
      <button class="btn btn-save" id="saveVehicleBtn">Save Vehicle</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

  /*
   * RiderX Rider Profile
   * Complete standalone profile UI.
   *
   * Uses localStorage as a safe fallback so the page remains
   * functional even if Firebase is not available.
   *
   * Existing Firebase/user data can be connected later without
   * changing this page structure.
   */

  const $ = (id) => document.getElementById(id);

  const STORAGE_KEY = "riderx_rider_profile";

  const defaultProfile = {
    name: "Rider",
    phone: "",
    email: "",
    photo: "",
    rides: 0,
    rating: "5.0",
    earnings: 0,
    vehicle: {
      type: "Bike Taxi",
      model: "",
      number: "",
      color: ""
    },
    language: "English"
  };

  function loadProfile(){

    try{
      const saved = localStorage.getItem(STORAGE_KEY);

      if(!saved){
        return structuredClone(defaultProfile);
      }

      const parsed = JSON.parse(saved);

      return {
        ...defaultProfile,
        ...parsed,
        vehicle:{
          ...defaultProfile.vehicle,
          ...(parsed.vehicle || {})
        }
      };

    }catch(error){

      console.error("RiderX profile load error:", error);

      return structuredClone(defaultProfile);
    }
  }

  let profile = loadProfile();

  function saveProfile(){

    try{
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(profile)
      );
    }catch(error){
      console.error("RiderX profile save error:", error);
    }
  }

  function escapeText(value){

    return String(value ?? "")
      .replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char]));
  }

  function showToast(message){

    const toast = $("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(window.__riderxToastTimer);

    window.__riderxToastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2200);
  }

  function render(){

    const name = profile.name?.trim() || "Rider";

    $("profileName").textContent = name;

    $("profilePhone").textContent =
      profile.phone?.trim() ||
      profile.email?.trim() ||
      "RiderX account";

    $("avatarLetter").textContent =
      name.charAt(0).toUpperCase();

    $("ridesCount").textContent =
      Number(profile.rides || 0).toLocaleString("en-IN");

    $("ratingValue").textContent =
      profile.rating || "5.0";

    $("earningsValue").textContent =
      "₹" + Number(profile.earnings || 0).toLocaleString("en-IN");

    const vehicle = profile.vehicle || {};

    $("vehicleName").textContent =
      vehicle.type || "Bike Taxi";

    $("vehicleNumber").textContent =
      vehicle.number || "Vehicle number not added";

    $("vehicleModel").textContent =
      vehicle.model || "Not added";

    $("vehicleColor").textContent =
      vehicle.color || "Not added";

    $("vehicleType").textContent =
      vehicle.type || "Bike Taxi";

    $("vehicleStatus").textContent = "Active";

    $("vehicleSummary").textContent =
      vehicle.number
        ? `${vehicle.type || "Bike Taxi"} • ${vehicle.number}`
        : "Add your vehicle information";

    $("languageText").textContent =
      profile.language || "English";

    const image = $("profileImage");

    if(profile.photo){

      image.src = profile.photo;
      image.style.display = "block";
      $("avatarLetter").style.display = "none";

    }else{

      image.removeAttribute("src");
      image.style.display = "none";
      $("avatarLetter").style.display = "block";
    }
  }

  /* BACK */
  $("backBtn").addEventListener("click", () => {

    if(history.length > 1){
      history.back();
    }else{
      location.href = "home.html";
    }

  });

  /* NOTIFICATIONS */
  $("notificationBtn").addEventListener("click", () => {

    location.href = "notifications.html";

  });

  /* PROFILE MODAL */
  $("editProfileBtn").addEventListener("click", () => {

    $("editName").value = profile.name || "";
    $("editPhone").value = profile.phone || "";
    $("editEmail").value = profile.email || "";

    $("profileModal").classList.add("show");

  });

  $("cancelProfileBtn").addEventListener("click", () => {

    $("profileModal").classList.remove("show");

  });

  $("profileModal").addEventListener("click", (event) => {

    if(event.target === $("profileModal")){
      $("profileModal").classList.remove("show");
    }

  });

  $("saveProfileBtn").addEventListener("click", () => {

    const name = $("editName").value.trim();

    if(!name){

      showToast("Please enter your name");
      return;

    }

    profile.name = name;
    profile.phone = $("editPhone").value.trim();
    profile.email = $("editEmail").value.trim();

    saveProfile();
    render();

    $("profileModal").classList.remove("show");

    showToast("Profile updated successfully");

  });

  /* PHOTO */
  $("cameraBtn").addEventListener("click", () => {

    $("photoInput").click();

  });

  $("photoInput").addEventListener("change", (event) => {

    const file = event.target.files?.[0];

    if(!file) return;

    if(!file.type.startsWith("image/")){

      showToast("Please select an image");
      return;

    }

    const reader = new FileReader();

    reader.onload = () => {

      profile.photo = reader.result;

      saveProfile();
      render();

      showToast("Profile photo updated");

    };

    reader.readAsDataURL(file);

  });

  /* VEHICLE */
  $("vehicleBtn").addEventListener("click", openVehicleModal);

  function openVehicleModal(){

    const vehicle = profile.vehicle || {};

    $("editVehicleType").value =
      vehicle.type || "Bike Taxi";

    $("editVehicleModel").value =
      vehicle.model || "";

    $("editVehicleNumber").value =
      vehicle.number || "";

    $("editVehicleColor").value =
      vehicle.color || "";

    $("vehicleModal").classList.add("show");
  }

  $("cancelVehicleBtn").addEventListener("click", () => {

    $("vehicleModal").classList.remove("show");

  });

  $("vehicleModal").addEventListener("click", (event) => {

    if(event.target === $("vehicleModal")){
      $("vehicleModal").classList.remove("show");
    }

  });

  $("saveVehicleBtn").addEventListener("click", () => {

    const type =
      $("editVehicleType").value;

    const model =
      $("editVehicleModel").value.trim();

    const number =
      $("editVehicleNumber").value.trim().toUpperCase();

    const color =
      $("editVehicleColor").value.trim();

    if(!model){

      showToast("Please enter vehicle model");
      return;

    }

    if(!number){

      showToast("Please enter vehicle number");
      return;

    }

    profile.vehicle = {
      type,
      model,
      number,
      color
    };

    saveProfile();
    render();

    $("vehicleModal").classList.remove("show");

    showToast("Vehicle details saved");

  });

  /* DOCUMENTS */
  $("documentsBtn").addEventListener("click", () => {

    if(location.pathname.includes("/rider/")){
      location.href = "documents.html";
    }else{
      showToast("Documents page is not available yet");
    }

  });

  /* WALLET */
  $("walletBtn").addEventListener("click", () => {

    location.href = "wallet.html";

  });

  /* SETTINGS */
  $("settingsBtn").addEventListener("click", () => {

    location.href = "settings.html";

  });

  /* LANGUAGE */
  $("languageBtn").addEventListener("click", () => {

    const current =
      profile.language || "English";

    profile.language =
      current === "English"
        ? "Hindi"
        : "English";

    saveProfile();
    render();

    showToast(
      "Language changed to " + profile.language
    );

  });

  /* HELP */
  $("helpBtn").addEventListener("click", () => {

    if(location.pathname.includes("/rider/")){
      location.href = "support.html";
    }else{
      showToast("Support page is not available yet");
    }

  });

  /* TERMS */
  $("termsBtn").addEventListener("click", () => {

    showToast("RiderX Terms & Privacy");

    setTimeout(() => {

      window.open(
        "../index.html#terms",
        "_self"
      );

    }, 500);

  });

  /* LOGOUT */
  $("logoutBtn").addEventListener("click", () => {

    const confirmed =
      window.confirm(
        "Are you sure you want to logout?"
      );

    if(!confirmed) return;

    /*
     * Clear only authentication/session keys that RiderX
     * commonly uses. Profile data is intentionally preserved.
     */

    const keysToRemove = [
      "riderx_user",
      "riderx_current_user",
      "riderx_auth",
      "riderx_role",
      "riderx_session"
    ];

    keysToRemove.forEach(key => {

      try{
        localStorage.removeItem(key);
        sessionStorage.removeItem(key);
      }catch(error){}
    });

    showToast("Logged out");

    setTimeout(() => {

      location.href = "../auth/login.html";

    }, 600);

  });

  /* BOTTOM NAVIGATION */
  document.querySelectorAll(".nav-item").forEach(item => {

    item.addEventListener("click", () => {

      const page = item.dataset.page;

      if(page === "home"){
        location.href = "home.html";
      }

      if(page === "rides"){
        location.href = "rides.html";
      }

      if(page === "wallet"){
        location.href = "wallet.html";
      }

      if(page === "profile"){
        location.href = "profile.html";
      }

    });

  });

  /* ESC KEY */
  document.addEventListener("keydown", (event) => {

    if(event.key !== "Escape") return;

    $("profileModal").classList.remove("show");
    $("vehicleModal").classList.remove("show");

  });

  /* INITIAL */
  render();

</script>

</body>
  </html>
