<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Rider Profile</title>


<link rel="icon" href="../assets/logo.png">


<link rel="stylesheet" href="../css/Style.css">

<link rel="stylesheet" href="../css/Dashboard.css">

<link rel="stylesheet" href="../css/Responsive.css">

<link rel="stylesheet" href="../css/Animation.css">


</head>



<body>



<nav class="navbar">


<div class="logo">


<img src="../assets/logo.png">


<span>RiderX Rider</span>


</div>


</nav>







<div class="dashboard-wrapper page">





<div class="profile-card fade-in">



<img 
src="../assets/logo.png"
class="profile-img">





<h2 id="riderName">

Loading...

</h2>



<p id="riderEmail">

Loading...

</p>





<div class="profile-form">





<label>

Full Name

</label>


<input id="name" placeholder="Enter name">






<label>

Mobile Number

</label>


<input id="phone" placeholder="Mobile">





<label>

Bike Model

</label>


<input id="bikeModel" placeholder="Bike model">





<label>

Vehicle Number

</label>


<input id="vehicleNumber" placeholder="Vehicle number">





<label>

Driving License

</label>


<input id="license" placeholder="License number">






<button 
id="saveRiderProfile"
class="btn">

Save Profile

</button>



</div>






</div>








<div class="grid">





<div class="card">


<h3>

💰 Earnings

</h3>


<a href="wallet.html" class="btn">

Open Wallet

</a>


</div>







<div class="card">


<h3>

📄 Documents

</h3>


<p>

Verification Status

</p>


<button class="btn btn-dark">

Upload

</button>


</div>








<div class="card">


<h3>

🚪 Logout

</h3>


<button id="logout" class="btn btn-dark">

Logout

</button>


</div>




</div>








</div>







<script type="module" src="../js/RiderProfile.js"></script>



</body>

</html>
