<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Profile</title>

<link rel="stylesheet" href="../css/style.css">


<style>


body{

background:#000;
color:white;
font-family:Arial;

}



.header{

background:#111;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
border-bottom:2px solid #FFD600;

}



.container{

padding:20px;

}



.profile{

background:#111;
padding:25px;
border-radius:20px;
text-align:center;

}



.photo{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:3px solid #FFD600;

}



.name{

font-size:26px;
margin-top:15px;

}



.card{

background:#1d1d1d;
padding:15px;
margin-top:15px;
border-radius:15px;
text-align:left;

}



.rating{

font-size:30px;
color:#FFD600;
text-align:center;

}



button{

width:100%;
padding:15px;
margin-top:20px;
background:#FFD600;
border:none;
border-radius:12px;
font-weight:bold;

}



</style>


</head>


<body>



<div class="header">

🏍 Rider Profile

</div>




<div class="container">



<div class="profile">


<img id="photo"

src="../assets/profile.png"

class="photo">



<h2 class="name" id="name">

Rider

</h2>



<p id="phone">

📱 Phone:

</p>



<p id="email">

📧 Email:

</p>




<div class="rating" id="rating">

⭐ 0

</div>



<p id="reviews">

Reviews: 0

</p>





<div class="card">


<h3>

🏍 Bike Details

</h3>


<p id="bike">

Bike:

</p>


<p id="vehicle">

Vehicle Number:

</p>



</div>





<div class="card">


<h3>

🚕 Ride History

</h3>


<p id="rides">

Completed Rides: 0

</p>


</div>




<button onclick="history.back()">

Back

</button>




</div>



</div>








<script type="module">


import {auth,db} from "../firebase/config.js";


import {

doc,
getDoc,
collection,
getDocs,
query,
where

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";







async function loadProfile(){



let user=

auth.currentUser;



if(!user)

return;





let userSnap=

await getDoc(

doc(db,"users",user.uid)

);





if(userSnap.exists()){



let data=userSnap.data();





document.getElementById("name").innerHTML=

data.name || "Rider";



document.getElementById("email").innerHTML=

"📧 "+(data.email || user.email);



document.getElementById("phone").innerHTML=

"📱 "+(data.phone || "Not Added");





document.getElementById("bike").innerHTML=

"🏍 Bike: "+(data.bike || "Not Added");





document.getElementById("vehicle").innerHTML=

"🔢 Vehicle No: "+(data.vehicle || "Not Added");





if(data.photo){


document.getElementById("photo").src=data.photo;


}



}







let rides=

await getDocs(

query(

collection(db,"rides"),

where("riderId","==",user.uid),

where("status","==","Completed")

)

);





document.getElementById("rides").innerHTML=

"Completed Rides: "+rides.size;







let reviews=

await getDocs(

query(

collection(db,"reviews"),

where("riderId","==",user.uid)

)

);






let total=0;



reviews.forEach((r)=>{


total += Number(

r.data().rating || 0

);


});






let avg=

reviews.size ?

(total/reviews.size).toFixed(1)

:

0;





document.getElementById("rating").innerHTML=

"⭐ "+avg;



document.getElementById("reviews").innerHTML=

"Reviews: "+reviews.size;



}





loadProfile();



</script>




</body>

</html>
