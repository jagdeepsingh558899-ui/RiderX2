<!DOCTYPE html>
<html lang="en" class="dark">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Profile</title>


<link rel="stylesheet" href="../css/Style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<script src="https://cdn.tailwindcss.com"></script>


<style>

body{
background:#090A0F;
color:white;
font-family:Arial,sans-serif;
}


.card{

background:#12141C;
border:1px solid #2A2E3D;
border-radius:20px;

}


.yellow{

color:#FFE500;

}


.btn{

background:#FFE500;
color:#000;
font-weight:bold;
border-radius:12px;

}


.input{

width:100%;
background:#090A0F;
border:1px solid #2A2E3D;
padding:12px;
border-radius:12px;
color:white;

}

</style>

</head>


<body class="pb-24">


<header class="p-4 border-b border-gray-800 flex justify-between items-center">


<h1 class="text-2xl font-bold">

RID<span class="yellow">ERX</span>

</h1>


<button onclick="handleLogout()"
class="text-red-400">

<i class="fa-solid fa-right-from-bracket"></i>

</button>


</header>





<main class="p-4 max-w-3xl mx-auto">


<div id="profileSkeleton"
class="card p-6">

Loading Profile...

</div>





<div id="profileContent"
class="hidden">


<div class="card p-6 mb-5 text-center">


<div class="relative inline-block">


<img id="avatarImage"
src="https://ui-avatars.com/api/?name=Rider"
class="w-28 h-28 rounded-full border-4 border-yellow-400 object-cover">


<label for="photoFileInput"
class="absolute bottom-0 right-0 bg-yellow-400 text-black p-3 rounded-full cursor-pointer">


<i class="fa-solid fa-camera"></i>


</label>


<input id="photoFileInput"
type="file"
accept="image/*"
class="hidden"
onchange="handlePhotoUpload(event)">


</div>



<h2 id="headerFullName"
class="text-xl font-bold mt-3">

Rider

</h2>


<p id="headerRiderId"
class="text-gray-400 text-sm">

ID:-

</p>


<div class="mt-3">


<span id="headerVehicleType"
class="yellow font-bold">

BIKE

</span>


<span class="mx-2">

|

</span>


⭐
<span id="headerRating">

5.0

</span>


</div>


<p id="headerTripsCount"
class="text-gray-400 mt-2">

0 Rides

</p>



</div>





<form id="profileForm"
onsubmit="handleProfileUpdate(event)"
class="card p-6 space-y-4">


<h3 class="yellow font-bold text-lg">

Personal Information

</h3>



<input id="inputFullName"
class="input"
placeholder="Full Name">



<input id="inputPhone"
class="input"
placeholder="Phone"
disabled>



<input id="inputEmail"
class="input"
placeholder="Email">



<input id="inputDOB"
type="date"
class="input">



<select id="inputGender"
class="input">


<option>Male</option>

<option>Female</option>

<option>Other</option>


</select>



<input id="inputVehicleType"
class="input"
placeholder="Vehicle Type"
disabled>



<textarea id="inputAddress"
class="input"
placeholder="Address"></textarea>



<button class="btn w-full p-3">

<i class="fa-solid fa-save"></i>

Save Profile

</button>


</form>
<!-- Bottom Navigation -->

<nav class="fixed bottom-0 left-0 right-0 bg-[#12141C] border-t border-gray-800 p-3">

<div class="flex justify-around text-xs text-gray-400">


<a href="./Home.html" class="text-center">

<i class="fa-solid fa-house text-lg"></i>

<br>

Home

</a>



<a href="./Rides.html" class="text-center">

<i class="fa-solid fa-route text-lg"></i>

<br>

Rides

</a>




<a href="./Wallet.html" class="text-center">

<i class="fa-solid fa-wallet text-lg"></i>

<br>

Wallet

</a>




<a href="./Profile.html" class="text-center text-yellow-400">

<i class="fa-solid fa-user text-lg"></i>

<br>

Profile

</a>


</div>

</nav>




<!-- Firebase Profile JS -->

<script type="module" src="js/profile.js"></script>


</body>

</html>
