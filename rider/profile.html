<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Profile</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.card{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


.rating{

font-size:30px;
color:#ffcc00;

}

</style>

</head>


<body>


<div class="header">

🏍 Rider Profile

</div>



<div class="container">


<div class="card">


<h2 id="name">
Rider
</h2>


<p id="email">

📧 Email:

</p>



<p id="rides">

🚕 Completed Rides: 0

</p>



<div class="rating" id="rating">

⭐ 0

</div>


<p id="reviews">

Reviews: 0

</p>



</div>


</div>







<script type="module">


import {auth,db} from "../firebase/config.js";


import {

doc,
getDoc,
collection,
getDocs,
query,
where

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function loadProfile(){



let user=auth.currentUser;



if(!user){

return;

}



let profile=await getDoc(

doc(db,"users",user.uid)

);



let data=profile.data();



document.getElementById("name").innerHTML=

data.name || "Rider";



document.getElementById("email").innerHTML=

"📧 "+(data.email || "");






let rides=await getDocs(

query(

collection(db,"rides"),

where("riderId","==",user.uid),

where("status","==","Completed")

)

);



document.getElementById("rides").innerHTML=

"🚕 Completed Rides: "+rides.size;







let reviews=await getDocs(

query(

collection(db,"reviews"),

where("riderId","==",user.uid)

)

);



let total=0;


reviews.forEach((r)=>{


total += Number(r.data().rating || 0);


});



let avg=

reviews.size ?

(total/reviews.size).toFixed(1)

:

0;



document.getElementById("rating").innerHTML=

"⭐ "+avg;



document.getElementById("reviews").innerHTML=

"Reviews: "+reviews.size;



}





loadProfile();



</script>


</body>

</html>
