<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#050505"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<title>RiderX • Rider Profile</title>


<style>

:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111111;
    --card2:#181818;
    --border:#292929;
    --muted:#888;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Inter,Arial,Helvetica,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    min-height:100%;
    background:var(--black);
    color:#fff;
}

body{
    padding-bottom:30px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:50;

    height:65px;

    display:flex;
    align-items:center;
    gap:11px;

    padding:0 15px;

    background:rgba(5,5,5,.94);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    border-bottom:1px solid var(--border);
}

.back,
.settings{
    width:41px;
    height:41px;

    flex:none;

    border-radius:13px;

    border:1px solid #303030;
    background:#151515;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}

.back{
    font-size:21px;
}

.settings{
    font-size:17px;
}

.back:active,
.settings:active{
    transform:scale(.93);
    background:#202020;
}

.header-title{
    flex:1;
    min-width:0;
}

.header-title h1{
    font-size:18px;
    font-weight:1000;
}

.header-title p{
    margin-top:2px;

    color:#777;

    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================================================
   PAGE
========================================================= */

.container{
    width:100%;
    max-width:620px;

    margin:auto;

    padding:14px;
}


/* =========================================================
   PROFILE HERO
========================================================= */

.profile-card{
    position:relative;

    padding:20px;

    border-radius:23px;

    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(255,229,0,.16),
            transparent 42%
        ),
        linear-gradient(
            135deg,
            #161616,
            #0d0d0d
        );

    border:1px solid #302f12;

    overflow:hidden;
}

.profile-top{
    display:flex;
    align-items:center;

    gap:15px;
}

.avatar{
    position:relative;

    width:72px;
    height:72px;

    flex:none;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #292929,
            #151515
        );

    border:1px solid #3a3a3a;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
    font-weight:1000;

    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.avatar-image-visible{
    display:block !important;
}

.avatar-initial-hidden{
    display:none !important;
}

.online-dot{
    position:absolute;

    right:3px;
    bottom:3px;

    width:15px;
    height:15px;

    border-radius:50%;

    background:#666;

    border:3px solid #151515;

    transition:
        background .2s ease;
}

.online-dot.online{
    background:var(--green);
}

.profile-info{
    flex:1;
    min-width:0;
}

.profile-name{
    font-size:19px;
    font-weight:1000;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-phone{
    margin-top:4px;

    color:#888;

    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.verified{
    display:inline-flex;
    align-items:center;
    gap:4px;

    margin-top:7px;

    color:var(--green);

    font-size:9px;
    font-weight:900;
}

.edit-btn{
    margin-top:18px;

    width:100%;
    height:45px;

    border-radius:13px;

    border:1px solid #3c3800;

    background:#201e00;

    color:var(--yellow);

    font-size:11px;
    font-weight:900;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}

.edit-btn:active{
    transform:scale(.985);
    background:#292600;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    margin-top:12px;
}

.stat{
    padding:14px 8px;

    border-radius:16px;

    background:var(--card);

    border:1px solid var(--border);

    text-align:center;
}

.stat-value{
    font-size:17px;
    font-weight:1000;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.stat-value.yellow{
    color:var(--yellow);
}

.stat-label{
    margin-top:5px;

    color:#777;

    font-size:8px;

    text-transform:uppercase;

    letter-spacing:.5px;
}


/* =========================================================
   ONLINE
========================================================= */

.online-card{
    margin-top:12px;

    padding:15px 16px;

    border-radius:18px;

    background:var(--card);

    border:1px solid var(--border);

    display:flex;
    align-items:center;

    gap:12px;
}

.online-icon{
    width:42px;
    height:42px;

    flex:none;

    border-radius:13px;

    background:#292929;

    color:#777;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;

    transition:
        background .2s ease,
        color .2s ease;
}

.online-icon.online{
    background:#092010;
    color:var(--green);
}

.online-info{
    flex:1;
    min-width:0;
}

.online-title{
    font-size:12px;
    font-weight:900;
}

.online-sub{
    margin-top:4px;

    color:#777;

    font-size:9px;

    line-height:1.4;
}

.toggle{
    width:48px;
    height:27px;

    flex:none;

    border-radius:999px;

    padding:3px;

    background:#333;

    border:none;

    cursor:pointer;

    transition:
        background .2s ease,
        opacity .2s ease;
}

.toggle span{
    display:block;

    width:21px;
    height:21px;

    border-radius:50%;

    background:#fff;

    transition:.2s;
}

.toggle.active{
    background:var(--yellow);
}

.toggle.active span{
    transform:translateX(21px);
    background:#000;
}

.toggle:disabled{
    opacity:.55;
    cursor:wait;
}


/* =========================================================
   SECTION
========================================================= */

.section-title{
    margin:20px 2px 10px;

    color:#777;

    font-size:10px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:.8px;
}


/* =========================================================
   MENU
========================================================= */

.menu{
    border-radius:19px;

    background:var(--card);

    border:1px solid var(--border);

    overflow:hidden;
}

.menu-item{
    width:100%;

    min-height:62px;

    padding:10px 15px;

    display:flex;
    align-items:center;

    gap:12px;

    background:none;

    border:0;

    border-bottom:1px solid #242424;

    color:#fff;

    text-align:left;

    cursor:pointer;

    transition:
        background .15s ease;
}

.menu-item:last-child{
    border-bottom:0;
}

.menu-item:active{
    background:#1b1b1b;
}

.menu-icon{
    width:37px;
    height:37px;

    flex:none;

    border-radius:12px;

    background:#1b1b1b;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:16px;
}

.menu-content{
    flex:1;
    min-width:0;
}

.menu-title{
    font-size:11px;
    font-weight:900;
}

.menu-sub{
    margin-top:3px;

    color:#777;

    font-size:9px;

    line-height:1.35;
}

.menu-arrow{
    color:#666;
    font-size:16px;
}


/* =========================================================
   VEHICLE
========================================================= */

.vehicle{
    padding:16px;

    border-radius:19px;

    background:var(--card);

    border:1px solid var(--border);
}

.vehicle-row{
    display:flex;
    align-items:center;

    gap:12px;
}

.vehicle-icon{
    width:48px;
    height:48px;

    flex:none;

    border-radius:15px;

    background:#211f00;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--yellow);

    font-size:22px;
}

.vehicle-info{
    flex:1;
    min-width:0;
}

.vehicle-name{
    font-size:13px;
    font-weight:1000;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.vehicle-number{
    margin-top:4px;

    color:#888;

    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.vehicle-status{
    padding:6px 9px;

    flex:none;

    border-radius:999px;

    background:#08200f;

    border:1px solid #14532d;

    color:var(--green);

    font-size:8px;

    font-weight:900;
}


/* =========================================================
   LOGOUT
========================================================= */

.logout{
    width:100%;
    height:50px;

    margin-top:18px;

    border-radius:15px;

    background:#1d0b0b;

    border:1px solid #4b1919;

    color:#ff7777;

    font-size:12px;

    font-weight:900;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}

.logout:active{
    transform:scale(.985);
    background:#281010;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    padding:20px 5px 5px;

    text-align:center;

    color:#555;

    font-size:9px;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    padding:70px 20px;

    text-align:center;

    color:#777;
}

.loader{
    width:34px;
    height:34px;

    margin:0 auto 15px;

    border-radius:50%;

    border:3px solid #292929;
    border-top-color:var(--yellow);

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

.error-state{
    padding:30px 20px;

    border-radius:19px;

    background:#160b0b;

    border:1px solid #3b1717;

    text-align:center;
}

.error-state-icon{
    font-size:30px;
    color:#ff7777;
    margin-bottom:12px;
}

.error-state-title{
    font-size:14px;
    font-weight:900;
}

.error-state-text{
    margin-top:6px;

    color:#888;

    font-size:10px;

    line-height:1.5;
}

.retry-btn{
    margin-top:16px;

    min-width:120px;
    height:42px;

    padding:0 16px;

    border-radius:12px;

    border:1px solid #3c3800;

    background:#201e00;

    color:var(--yellow);

    font-size:11px;
    font-weight:900;

    cursor:pointer;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,20px);

    max-width:90%;

    padding:11px 14px;

    border-radius:13px;

    background:#222;

    border:1px solid #3b3b3b;

    font-size:11px;
    font-weight:700;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:100;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   SMALL DEVICES
========================================================= */

@media(max-width:370px){

    .container{
        padding:10px;
    }

    .profile-card{
        padding:16px;
    }

    .profile-name{
        font-size:17px;
    }

    .avatar{
        width:64px;
        height:64px;
        border-radius:19px;
    }

    .stats{
        gap:6px;
    }

    .stat{
        padding:12px 6px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <button
        class="back"
        id="backBtn"
        type="button"
        aria-label="Go back"
    >
        ‹
    </button>


    <div class="header-title">

        <h1>
            My Profile
        </h1>

        <p>
            RiderX rider account
        </p>

    </div>


    <button
        class="settings"
        id="settingsBtn"
        type="button"
        aria-label="Settings"
    >
        ⚙
    </button>

</header>


<!-- =======================================================
     CONTENT
======================================================= -->

<main
    class="container"
    id="content"
>

    <div class="loading">

        <div class="loader"></div>

        Loading profile...

    </div>

</main>


<!-- =======================================================
     TOAST
======================================================= -->

<div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
></div>


<!-- =======================================================
     FIREBASE / PAGE LOGIC
======================================================= -->

<script type="module">

/*
 * RiderX Profile
 *
 * IMPORTANT:
 * This file expects ../firebase/firebase-config.js
 * to export:
 *
 * auth
 * db
 * doc
 * getDoc
 * setDoc
 * onAuthStateChanged
 * signOut
 *
 * If your firebase-config.js exports only auth/db,
 * the Firestore functions are imported below directly
 * from the Firebase CDN so this page remains compatible.
 */


/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================================================
   ELEMENTS
========================================================= */

const content =
    document.getElementById(
        "content"
    );


const backBtn =
    document.getElementById(
        "backBtn"
    );


const settingsBtn =
    document.getElementById(
        "settingsBtn"
    );


const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let riderData = {};

let authResolved = false;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   PICK FIRST VALID VALUE
========================================================= */

function pick(
    data,
    keys,
    fallback = ""
){

    if(!data){
        return fallback;
    }


    for(
        const key of keys
    ){

        const value =
            data[key];


        if(
            value !== undefined &&
            value !== null &&
            value !== ""
        ){

            return value;

        }

    }


    return fallback;

}


/* =========================================================
   MONEY
========================================================= */

function money(value){

    const number =
        Number(
            value || 0
        );


    if(
        !Number.isFinite(number)
    ){

        return "₹0";

    }


    return "₹" +
        number.toLocaleString(
            "en-IN",
            {
                maximumFractionDigits:0
            }
        );

}


/* =========================================================
   SHOW TOAST
========================================================= */

let toastTimer = null;


function showToast(message){

    if(!toast){
        return;
    }


    toast.textContent =
        String(
            message ||
            ""
        );


    toast.classList.add(
        "show"
    );


    if(toastTimer){

        clearTimeout(
            toastTimer
        );

    }


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   ERROR PAGE
========================================================= */

function renderError(
    message
){

    content.innerHTML = `

        <section class="error-state">

            <div class="error-state-icon">
                ⚠
            </div>

            <div class="error-state-title">
                Unable to load profile
            </div>

            <div class="error-state-text">
                ${escapeHtml(
                    message ||
                    "Something went wrong. Please try again."
                )}
            </div>

            <button
                class="retry-btn"
                id="retryBtn"
                type="button"
            >
                Try Again
            </button>

        </section>

    `;


    document
        .getElementById(
            "retryBtn"
        )
        ?.addEventListener(
            "click",
            () => {

                if(currentUser){

                    loadProfile(
                        currentUser
                    );

                }

            }
        );

}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(
    user
){

    if(!user){

        return;

    }


    currentUser =
        user;


    content.innerHTML = `

        <div class="loading">

            <div class="loader"></div>

            Loading profile...

        </div>

    `;


    try{

        /*
         * First check rider document.
         */

        const riderRef =
            doc(
                db,
                "riders",
                user.uid
            );


        const riderSnap =
            await getDoc(
                riderRef
            );


        if(
            riderSnap.exists()
        ){

            riderData =
                riderSnap.data() || {};

        }
        else{

            /*
             * Fallback to users collection.
             */

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(
                userSnap.exists()
            ){

                riderData =
                    userSnap.data() || {};

            }
            else{

                riderData = {};

            }

        }


        renderProfile();

    }
    catch(error){

        console.error(
            "RiderX profile load error:",
            error
        );


        /*
         * Even if Firestore fails,
         * render using Auth information.
         */

        riderData = {};


        renderProfile();


        showToast(
            "Some profile data could not be loaded."
        );

    }

}


/* =========================================================
   RENDER PROFILE
========================================================= */

function renderProfile(){

    const user =
        currentUser;


    if(!user){

        return;

    }


    const name =
        String(
            pick(
                riderData,
                [
                    "name",
                    "fullName",
                    "displayName"
                ],
                user.displayName ||
                "Rider"
            )
        ).trim() ||
        "Rider";


    const phone =
        pick(
            riderData,
            [
                "phone",
                "mobile",
                "phoneNumber"
            ],
            user.phoneNumber ||
            "Mobile number not added"
        );


    const email =
        pick(
            riderData,
            [
                "email"
            ],
            user.email ||
            ""
        );


    const ratingRaw =
        pick(
            riderData,
            [
                "rating",
                "averageRating"
            ],
            "5.0"
        );


    const rating =
        Number(
            ratingRaw
        );


    const safeRating =
        Number.isFinite(rating)
            ? rating.toFixed(1)
            : "5.0";


    const totalRides =
        pick(
            riderData,
            [
                "totalRides",
                "completedRides",
                "rides"
            ],
            0
        );


    const earnings =
        pick(
            riderData,
            [
                "totalEarnings",
                "earnings"
            ],
            0
        );


    const vehicle =
        pick(
            riderData,
            [
                "vehicleType",
                "vehicle"
            ],
            "Bike"
        );


    const vehicleNumber =
        pick(
            riderData,
            [
                "vehicleNumber",
                "bikeNumber",
                "registrationNumber",
                "plateNumber"
            ],
            "Vehicle number not added"
        );


    const online =
        riderData.isOnline === true ||
        riderData.online === true;


    const photo =
        pick(
            riderData,
            [
                "photoURL",
                "profileImage",
                "photo",
                "image"
            ],
            user.photoURL ||
            ""
        );


    const initial =
        name
            .charAt(0)
            .toUpperCase() ||
            "R";


    const isCar =
        String(
            vehicle
        )
            .toLowerCase()
            .includes(
                "car"
            );


    const onlineText =
        online
            ? "You are online and can receive rides."
            : "You are offline and won't receive rides.";


    content.innerHTML = `

        <!-- PROFILE -->

        <section class="profile-card">

            <div class="profile-top">

                <div class="avatar">

                    <span
                        id="avatarInitial"
                        class="${
                            photo
                                ? "avatar-initial-hidden"
                                : ""
                        }"
                    >
                        ${escapeHtml(
                            initial
                        )}
                    </span>


                    <img
                        id="avatarImage"
                        src="${
                            escapeHtml(
                                photo
                            )
                        }"
                        alt="Rider profile photo"
                        class="${
                            photo
                                ? "avatar-image-visible"
                                : ""
                        }"
                    >


                    <span
                        class="online-dot ${
                            online
                                ? "online"
                                : ""
                        }"
                        id="onlineDot"
                        aria-label="${
                            online
                                ? "Online"
                                : "Offline"
                        }"
                    ></span>

                </div>


                <div class="profile-info">

                    <div class="profile-name">
                        ${escapeHtml(
                            name
                        )}
                    </div>


                    <div class="profile-phone">
                        ${escapeHtml(
                            phone
                        )}

/* =========================================================
   ONLINE TOGGLE
========================================================= */

async function toggleOnline(){

    const button =
        document.getElementById(
            "onlineToggle"
        );


    if(
        !button ||
        !currentUser
    ){

        return;

    }


    const current =
        riderData.isOnline === true ||
        riderData.online === true;


    /*
     * Turning ONLINE requires a real GPS location.
     *
     * The main online/location page already handles:
     * - GPS permission
     * - live location
     * - riderLocations
     * - continuous location updates
     *
     * Therefore do not create a fake "online" rider
     * from the profile page.
     */

    if(!current){

        showToast(
            "Open the Rider Online page to go online."
        );


        setTimeout(
            () => {

                /*
                 * Try common RiderX online page names.
                 */

                window.location.href =
                    "online.html";

            },
            700
        );


        return;

    }


    /*
     * Going OFFLINE can safely be done here.
     */

    button.disabled =
        true;


    try{

        await setDoc(
            doc(
                db,
                "riders",
                currentUser.uid
            ),
            {
                online:false,
                isOnline:false,

                updatedAt:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );


        /*
         * Also update public/active
         * rider location document.
         */

        await setDoc(
            doc(
                db,
                "riderLocations",
                currentUser.uid
            ),
            {
                riderId:
                    currentUser.uid,

                online:false,

                updatedAt:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );


        riderData.online =
            false;


        riderData.isOnline =
            false;


        button.classList.remove(
            "active"
        );


        button.setAttribute(
            "aria-pressed",
            "false"
        );


        const onlineText =
            document.getElementById(
                "onlineText"
            );


        const onlineDot =
            document.getElementById(
                "onlineDot"
            );


        const onlineIcon =
            document.getElementById(
                "onlineIcon"
            );


        if(onlineText){

            onlineText.textContent =
                "You are offline and won't receive rides.";

        }


        if(onlineDot){

            onlineDot.classList.remove(
                "online"
            );

        }


        if(onlineIcon){

            onlineIcon.classList.remove(
                "online"
            );

        }


        showToast(
            "You are now offline."
        );

    }
    catch(error){

        console.error(
            "Offline update error:",
            error
        );


        showToast(
            getFirebaseErrorMessage(
                error,
                "Unable to change online status."
            )
        );

    }
    finally{

        button.disabled =
            false;

    }

}


/* =========================================================
   FIREBASE ERROR MESSAGE
========================================================= */

function getFirebaseErrorMessage(
    error,
    fallback
){

    if(
        !error
    ){

        return fallback;

    }


    const code =
        String(
            error.code ||
            ""
        );


    switch(code){

        case "permission-denied":

            return "You don't have permission to update your rider status.";

        case "unavailable":

            return "Network unavailable. Please check your internet connection.";

        case "failed-precondition":

            return "Firebase request could not be completed right now.";

        case "unauthenticated":

            return "Your login session expired. Please login again.";

        default:

            return (
                error.message ||
                fallback
            );

    }

}

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

    if(!currentUser){

        return;

    }


    const confirmed =
        window.confirm(
            "Are you sure you want to log out?"
        );


    if(!confirmed){

        return;

    }


    const button =
        document.getElementById(
            "logoutBtn"
        );


    if(button){

        button.disabled =
            true;

        button.textContent =
            "Logging out...";

    }


    try{

        /*
         * If rider is currently online,
         * mark it offline before logout.
         */

        const isCurrentlyOnline =
            riderData.isOnline === true ||
            riderData.online === true;


        if(isCurrentlyOnline){

            try{

                await setDoc(
                    doc(
                        db,
                        "riders",
                        currentUser.uid
                    ),
                    {
                        online:false,
                        isOnline:false,

                        updatedAt:
                            serverTimestamp()
                    },
                    {
                        merge:true
                    }
                );


                await setDoc(
                    doc(
                        db,
                        "riderLocations",
                        currentUser.uid
                    ),
                    {
                        riderId:
                            currentUser.uid,

                        online:false,

                        updatedAt:
                            serverTimestamp()
                    },
                    {
                        merge:true
                    }
                );

            }
            catch(statusError){

                console.warn(
                    "Could not update offline status before logout:",
                    statusError
                );

            }

        }


        await signOut(
            auth
        );


        window.location.replace(
            "../auth/login.html"
        );

    }
    catch(error){

        console.error(
            "Logout error:",
            error
        );


        if(button){

            button.disabled =
                false;

            button.textContent =
                "Log Out";

        }


        showToast(
            getFirebaseErrorMessage(
                error,
                "Logout failed. Please try again."
            )
        );

    }

}

/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        authResolved =
            true;


        if(!user){

            currentUser =
                null;


            window.location.replace(
                "../auth/login.html"
            );


            return;

        }


        currentUser =
            user;


        await loadProfile(
            user
        );

    }
);


/* =========================================================

========================================================= */

setTimeout(
    () => {

        if(
            !authResolved &&
            content
        ){

            content.innerHTML = `

                <div class="loading">

                    <div class="loader"></div>

                    Checking login...

            `;

        }

    },
    5000
);
