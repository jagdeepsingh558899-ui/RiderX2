<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Profile</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.profile{

background:#1d1d1d;
padding:25px;
border-radius:15px;
text-align:center;

}


.avatar{

width:90px;
height:90px;
border-radius:50%;
background:#ffcc00;
color:#000;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
margin:auto;

}


.info{

margin-top:20px;
text-align:left;

}


.info p{

background:#222;
padding:12px;
border-radius:10px;

}

</style>


</head>


<body>


<div class="header">

🏍 Rider Profile

</div>




<div class="container">


<div class="profile">


<div class="avatar">

🏍

</div>



<h2 id="name">

Rider

</h2>



<div class="info">


<p id="email">

📧 Email:

</p>


<p>

🟢 Status: Active

</p>


<p id="rides">

🚕 Completed Rides: 0

</p>


</div>


</div>


</div>





<script type="module">


import {auth,db} from "../firebase/config.js";


import {

doc,
getDoc,
collection,
getDocs,
query,
where

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function loadProfile(){


let user=auth.currentUser;



if(!user){

return;

}



let profile=await getDoc(

doc(db,"users",user.uid)

);



if(profile.exists()){


let data=profile.data();



document.getElementById("name").innerHTML=

data.name;



document.getElementById("email").innerHTML=

"📧 "+data.email;


}





let q=query(

collection(db,"rides"),

where("status","==","Completed")

);



let rides=await getDocs(q);



document.getElementById("rides").innerHTML=

"🚕 Completed Rides: "+rides.size;



}



loadProfile();



</script>


</body>

</html>
