<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>RiderX • Rider Profile</title>

<meta name="theme-color" content="#050505">

<style>

:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111111;
    --card2:#181818;
    --border:#292929;
    --muted:#888;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Inter,Arial,Helvetica,sans-serif;
}

html,
body{
    min-height:100%;
    background:var(--black);
    color:#fff;
}

body{
    padding-bottom:30px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:50;

    height:65px;

    display:flex;
    align-items:center;
    gap:11px;

    padding:0 15px;

    background:rgba(5,5,5,.94);
    backdrop-filter:blur(16px);

    border-bottom:1px solid var(--border);
}

.back{
    width:41px;
    height:41px;

    border-radius:13px;

    border:1px solid #303030;
    background:#151515;

    color:#fff;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.header-title{
    flex:1;
}

.header-title h1{
    font-size:18px;
    font-weight:1000;
}

.header-title p{
    margin-top:2px;
    color:#777;
    font-size:10px;
}

.settings{
    width:41px;
    height:41px;

    border-radius:13px;

    border:1px solid #303030;
    background:#151515;

    color:#fff;

    font-size:17px;
}

/* PAGE */

.container{
    width:100%;
    max-width:620px;
    margin:auto;
    padding:14px;
}

/* PROFILE HERO */

.profile-card{
    position:relative;

    padding:20px;

    border-radius:23px;

    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(255,229,0,.16),
            transparent 42%
        ),
        linear-gradient(
            135deg,
            #161616,
            #0d0d0d
        );

    border:1px solid #302f12;

    overflow:hidden;
}

.profile-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.avatar{
    position:relative;

    width:72px;
    height:72px;

    flex:none;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #292929,
            #151515
        );

    border:1px solid #3a3a3a;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;
    font-weight:1000;

    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.online-dot{
    position:absolute;

    right:3px;
    bottom:3px;

    width:15px;
    height:15px;

    border-radius:50%;

    background:var(--green);

    border:3px solid #151515;
}

.profile-info{
    flex:1;
    min-width:0;
}

.profile-name{
    font-size:19px;
    font-weight:1000;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-phone{
    margin-top:4px;

    color:#888;

    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.verified{
    display:inline-flex;
    align-items:center;
    gap:4px;

    margin-top:7px;

    color:var(--green);

    font-size:9px;
    font-weight:900;
}

.edit-btn{
    margin-top:18px;

    width:100%;
    height:45px;

    border-radius:13px;

    border:1px solid #3c3800;

    background:#201e00;

    color:var(--yellow);

    font-size:11px;
    font-weight:900;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;

    margin-top:12px;
}

.stat{
    padding:14px 8px;

    border-radius:16px;

    background:var(--card);

    border:1px solid var(--border);

    text-align:center;
}

.stat-value{
    font-size:17px;
    font-weight:1000;
}

.stat-value.yellow{
    color:var(--yellow);
}

.stat-label{
    margin-top:5px;

    color:#777;

    font-size:8px;

    text-transform:uppercase;

    letter-spacing:.5px;
}

/* ONLINE */

.online-card{
    margin-top:12px;

    padding:15px 16px;

    border-radius:18px;

    background:var(--card);

    border:1px solid var(--border);

    display:flex;
    align-items:center;
    gap:12px;
}

.online-icon{
    width:42px;
    height:42px;

    border-radius:13px;

    background:#092010;

    color:var(--green);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
}

.online-info{
    flex:1;
}

.online-title{
    font-size:12px;
    font-weight:900;
}

.online-sub{
    margin-top:4px;

    color:#777;

    font-size:9px;
}

.toggle{
    width:48px;
    height:27px;

    border-radius:999px;

    padding:3px;

    background:#333;

    border:none;
}

.toggle span{
    display:block;

    width:21px;
    height:21px;

    border-radius:50%;

    background:#fff;

    transition:.2s;
}

.toggle.active{
    background:var(--yellow);
}

.toggle.active span{
    transform:translateX(21px);

    background:#000;
}

/* SECTION */

.section-title{
    margin:20px 2px 10px;

    color:#777;

    font-size:10px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:.8px;
}

/* MENU */

.menu{
    border-radius:19px;

    background:var(--card);

    border:1px solid var(--border);

    overflow:hidden;
}

.menu-item{
    width:100%;

    min-height:62px;

    padding:10px 15px;

    display:flex;
    align-items:center;

    gap:12px;

    background:none;

    border:0;

    border-bottom:1px solid #242424;

    color:#fff;

    text-align:left;
}

.menu-item:last-child{
    border-bottom:0;
}

.menu-icon{
    width:37px;
    height:37px;

    flex:none;

    border-radius:12px;

    background:#1b1b1b;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:16px;
}

.menu-content{
    flex:1;
}

.menu-title{
    font-size:11px;
    font-weight:900;
}

.menu-sub{
    margin-top:3px;

    color:#777;

    font-size:9px;
}

.menu-arrow{
    color:#666;
    font-size:16px;
}

/* VEHICLE */

.vehicle{
    padding:16px;

    border-radius:19px;

    background:var(--card);

    border:1px solid var(--border);
}

.vehicle-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.vehicle-icon{
    width:48px;
    height:48px;

    border-radius:15px;

    background:#211f00;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--yellow);

    font-size:22px;
}

.vehicle-info{
    flex:1;
}

.vehicle-name{
    font-size:13px;
    font-weight:1000;
}

.vehicle-number{
    margin-top:4px;

    color:#888;

    font-size:10px;
}

.vehicle-status{
    padding:6px 9px;

    border-radius:999px;

    background:#08200f;

    border:1px solid #14532d;

    color:var(--green);

    font-size:8px;

    font-weight:900;
}

/* LOGOUT */

.logout{
    width:100%;
    height:50px;

    margin-top:18px;

    border-radius:15px;

    background:#1d0b0b;

    border:1px solid #4b1919;

    color:#ff7777;

    font-size:12px;

    font-weight:900;
}

/* FOOTER */

.footer{
    padding:20px 5px 5px;

    text-align:center;

    color:#555;

    font-size:9px;
}

/* LOADING */

.loading{
    padding:70px 20px;

    text-align:center;

    color:#777;
}

.loader{
    width:34px;
    height:34px;

    margin:0 auto 15px;

    border-radius:50%;

    border:3px solid #292929;
    border-top-color:var(--yellow);

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TOAST */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:translate(-50%,20px);

    max-width:90%;

    padding:11px 14px;

    border-radius:13px;

    background:#222;

    border:1px solid #3b3b3b;

    font-size:11px;
    font-weight:700;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:100;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

@media(max-width:370px){

    .container{
        padding:10px;
    }

    .profile-card{
        padding:16px;
    }

    .profile-name{
        font-size:17px;
    }

}

</style>

</head>


<body>


<header class="header">

    <button
        class="back"
        id="backBtn"
        type="button"
    >
        ‹
    </button>


    <div class="header-title">

        <h1>
            My Profile
        </h1>

        <p>
            RiderX rider account
        </p>

    </div>


    <button
        class="settings"
        id="settingsBtn"
        type="button"
    >
        ⚙
    </button>

</header>


<main
    class="container"
    id="content"
>

    <div class="loading">

        <div class="loader"></div>

        Loading profile...

    </div>

</main>


<div
    class="toast"
    id="toast"
></div>


<script type="module">

import {
    auth,
    db,
    doc,
    getDoc,
    updateDoc,
    onAuthStateChanged,
    signOut
} from "../firebase/firebase-config.js";


const content =
    document.getElementById("content");

const backBtn =
    document.getElementById("backBtn");

const settingsBtn =
    document.getElementById("settingsBtn");

const toast =
    document.getElementById("toast");


let currentUser = null;
let riderData = {};


/* --------------------------------
   HELPERS
-------------------------------- */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function pick(data,keys,fallback=""){

    for(const key of keys){

        if(
            data &&
            data[key] !== undefined &&
            data[key] !== null &&
            data[key] !== ""
        ){

            return data[key];

        }

    }

    return fallback;

}


function money(value){

    return "₹" +
        Number(value || 0)
        .toLocaleString(
            "en-IN",
            {
                maximumFractionDigits:0
            }
        );

}


function showToast(message){

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(
        () =>
            toast.classList.remove("show"),
        2200
    );

}


/* --------------------------------
   LOAD PROFILE
-------------------------------- */

async function loadProfile(user){

    currentUser =
        user;


    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    user.uid
                )
            );


        if(snap.exists()){

            riderData =
                snap.data();

        }
        else{

            /*
             * Fallback for projects where
             * user information is stored
             * in users collection.
             */

            const userSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if(userSnap.exists()){

                riderData =
                    userSnap.data();

            }

        }


        renderProfile();

    }
    catch(error){

        console.error(
            "Profile error:",
            error
        );


        /*
         * Still show profile using
         * Firebase Auth data.
         */

        riderData = {};

        renderProfile();

        showToast(
            "Some profile data could not load."
        );

    }

}


/* --------------------------------
   RENDER PROFILE
-------------------------------- */

function renderProfile(){

    const user =
        currentUser;


    const name =
        pick(
            riderData,
            [
                "name",
                "fullName",
                "displayName"
            ],
            user?.displayName ||
            "Rider"
        );


    const phone =
        pick(
            riderData,
            [
                "phone",
                "mobile",
                "phoneNumber"
            ],
            user?.phoneNumber ||
            "Mobile number not added"
        );


    const email =
        pick(
            riderData,
            [
                "email"
            ],
            user?.email ||
            ""
        );


    const rating =
        pick(
            riderData,
            [
                "rating",
                "averageRating"
            ],
            "5.0"
        );


    const totalRides =
        pick(
            riderData,
            [
                "totalRides",
                "completedRides",
                "rides"
            ],
            0
        );


    const earnings =
        pick(
            riderData,
            [
                "totalEarnings",
                "earnings"
            ],
            0
        );


    const vehicle =
        pick(
            riderData,
            [
                "vehicleType",
                "vehicle"
            ],
            "Bike"
        );


    const vehicleNumber =
        pick(
            riderData,
            [
                "vehicleNumber",
                "bikeNumber",
                "registrationNumber",
                "plateNumber"
            ],
            "Vehicle number not added"
        );


    const online =
        Boolean(
            riderData.isOnline ??
            riderData.online ??
            false
        );


    const photo =
        pick(
            riderData,
            [
                "photoURL",
                "profileImage",
                "photo",
                "image"
            ],
            user?.photoURL ||
            ""
        );


    const initial =
        name
            .trim()
            .charAt(0)
            .toUpperCase() ||
            "R";


    content.innerHTML = `

        <section class="profile-card">

            <div class="profile-top">

                <div class="avatar">

                    <span
                        id="avatarInitial"
                        ${photo ? 'style="display:none"' : ''}
                    >
                        ${escapeHtml(initial)}
                    </span>

                    <img
                        id="avatarImage"
                        src="${escapeHtml(photo)}"
                        alt="Rider profile"
                        ${photo ? '' : 'style="display:none"'}
                    >

                    <span
                        class="online-dot"
                        id="onlineDot"
                        style="
                            background:
                            ${online
                                ? "var(--green)"
                                : "#666"
                            };
                        "
                    ></span>

                </div>


                <div class="profile-info">

                    <div class="profile-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="profile-phone">
                        ${escapeHtml(phone)}
                    </div>

                    ${
                        email
                        ?
                        `
                        <div class="profile-phone">
                            ${escapeHtml(email)}
                        </div>
                        `
                        :
                        ""
                    }

                    <div class="verified">
                        ✓ Verified Rider
                    </div>

                </div>

            </div>


            <button
                class="edit-btn"
                id="editBtn"
                type="button"
            >
                ✎ Edit Profile
            </button>

        </section>


        <section class="stats">

            <div class="stat">

                <div class="stat-value yellow">
                    ★ ${escapeHtml(rating)}
                </div>

                <div class="stat-label">
                    Rating
                </div>

            </div>


            <div class="stat">

                <div class="stat-value">
                    ${escapeHtml(totalRides)}
                </div>

                <div class="stat-label">
                    Trips
                </div>

            </div>


            <div class="stat">

                <div class="stat-value yellow">
                    ${money(earnings)}
                </div>

                <div class="stat-label">
                    Earnings
                </div>

            </div>

        </section>


        <section class="online-card">

            <div class="online-icon">
                ●
            </div>

            <div class="online-info">

                <div class="online-title">
                    Rider Availability
                </div>

                <div
                    class="online-sub"
                    id="onlineText"
                >
                    ${
                        online
                        ? "You are online and can receive rides."
                        : "You are offline and won't receive rides."
                    }
                </div>

            </div>


            <button
                class="toggle ${online ? "active" : ""}"
                id="onlineToggle"
                type="button"
                aria-label="Toggle online status"
            >
                <span></span>
            </button>

        </section>


        <div class="section-title">
            Vehicle
        </div>


        <section class="vehicle">

            <div class="vehicle-row">

                <div class="vehicle-icon">
                    ${
                        String(vehicle)
                            .toLowerCase()
                            .includes("car")
                        ? "🚗"
                        : "🏍"
                    }
                </div>


                <div class="vehicle-info">

                    <div class="vehicle-name">
                        ${escapeHtml(vehicle)}
                    </div>

                    <div class="vehicle-number">
                        ${escapeHtml(vehicleNumber)}
                    </div>

                </div>


                <div class="vehicle-status">
                    ACTIVE
                </div>

            </div>

        </section>


        <div class="section-title">
            Account
        </div>


        <section class="menu">

            <button
                class="menu-item"
                id="documentsBtn"
                type="button"
            >

                <div class="menu-icon">
                    📄
                </div>

                <div class="menu-content">

                    <div class="menu-title">
                        Documents
                    </div>

                    <div class="menu-sub">
                        Driving licence & vehicle documents
                    </div>

                </div>

                <div class="menu-arrow">
                    ›
                </div>

            </button>


            <button
                class="menu-item"
                id="paymentBtn"
                type="button"
            >

                <div class="menu-icon">
                    💳
                </div>

                <div class="menu-content">

                    <div class="menu-title">
                        Payment & Bank
                    </div>

                    <div class="menu-sub">
                        Earnings and payout settings
                    </div>

                </div>

                <div class="menu-arrow">
                    ›
                </div>

            </button>


            <button
                class="menu-item"
                id="notificationBtn"
                type="button"
            >

                <div class="menu-icon">
                    🔔
                </div>

                <div class="menu-content">

                    <div class="menu-title">
                        Notifications
                    </div>

                    <div class="menu-sub">
                        Ride alerts and updates
                    </div>

                </div>

                <div class="menu-arrow">
                    ›
                </div>

            </button>


            <button
                class="menu-item"
                id="settingsItem"
                type="button"
            >

                <div class="menu-icon">
                    ⚙
                </div>

                <div class="menu-content">

                    <div class="menu-title">
                        Settings
                    </div>

                    <div class="menu-sub">
                        App preferences and account settings
                    </div>

                </div>

                <div class="menu-arrow">
                    ›
                </div>

            </button>

        </section>


        <button
            class="logout"
            id="logoutBtn"
            type="button"
        >
            Log Out
        </button>


        <div class="footer">
            RiderX • Rider Partner
        </div>

    `;


    bindActions();

}


/* --------------------------------
   ACTIONS
-------------------------------- */

function bindActions(){

    document
        .getElementById("editBtn")
        ?.addEventListener(
            "click",
            () => {

                window.location.href =
                    "edit-profile.html";

            }
        );


    document
        .getElementById("onlineToggle")
        ?.addEventListener(
            "click",
            toggleOnline
        );


    document
        .getElementById("documentsBtn")
        ?.addEventListener(
            "click",
            () => {

                window.location.href =
                    "documents.html";

            }
        );


    document
        .getElementById("paymentBtn")
        ?.addEventListener(
            "click",
            () => {

                window.location.href =
                    "wallet.html";

            }
        );


    document
        .getElementById("notificationBtn")
        ?.addEventListener(
            "click",
            () => {

                window.location.href =
                    "notifications.html";

            }
        );


    document
        .getElementById("settingsItem")
        ?.addEventListener(
            "click",
            openSettings
        );


    document
        .getElementById("logoutBtn")
        ?.addEventListener(
            "click",
            logout
        );

}


/* --------------------------------
   ONLINE TOGGLE
-------------------------------- */

async function toggleOnline(){

    const button =
        document.getElementById(
            "onlineToggle"
        );


    if(!button || !currentUser){
        return;
    }


    const current =
        Boolean(
            riderData.isOnline ??
            riderData.online ??
            false
        );


    button.disabled = true;


    try{

        const newStatus =
            !current;


        await updateDoc(
            doc(
                db,
                "riders",
                currentUser.uid
            ),
            {
                isOnline:newStatus,
                online:newStatus
            }
        );


        riderData.isOnline =
            newStatus;

        riderData.online =
            newStatus;


        const onlineText =
            document.getElementById(
                "onlineText"
            );

        const onlineDot =
            document.getElementById(
                "onlineDot"
            );


        if(newStatus){

            button.classList.add(
                "active"
            );

            onlineText.textContent =
                "You are online and can receive rides.";

            if(onlineDot){

                onlineDot.style.background =
                    "var(--green)";

            }

            showToast(
                "You are now online."
            );

        }
        else{

            button.classList.remove(
                "active"
            );

            onlineText.textContent =
                "You are offline and won't receive rides.";

            if(onlineDot){

                onlineDot.style.background =
                    "#666";

            }

            showToast(
                "You are now offline."
            );

        }

    }
    catch(error){

        console.error(
            "Online update error:",
            error
        );

        showToast(
            "Unable to change online status."
        );

    }
    finally{

        button.disabled =
            false;

    }

}


/* --------------------------------
   SETTINGS
-------------------------------- */

function openSettings(){

    /*
     * If rider/settings.html exists,
     * open it. Otherwise use menu.
     */

    window.location.href =
        "settings.html";

}


/* --------------------------------
   LOGOUT
-------------------------------- */

async function logout(){

    const confirmed =
        window.confirm(
            "Are you sure you want to log out?"
        );


    if(!confirmed){
        return;
    }


    try{

        await signOut(auth);


        window.location.replace(
            "../auth/login.html"
        );

    }
    catch(error){

        console.error(
            "Logout error:",
            error
        );

        showToast(
            "Logout failed. Please try again."
        );

    }

}


/* --------------------------------
   HEADER ACTIONS
-------------------------------- */

backBtn.addEventListener(
    "click",
    () => {

        if(history.length > 1){

            history.back();

        }
        else{

            window.location.href =
                "dashboard.html";

        }

    }
);


settingsBtn.addEventListener(
    "click",
    openSettings
);


/* --------------------------------
   AUTH
-------------------------------- */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            window.location.replace(
                "../auth/login.html"
            );

            return;

        }

        loadProfile(user);

    }
);

</script>

</body>
