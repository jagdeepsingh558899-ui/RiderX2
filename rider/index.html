<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiderX - Rider Console</title>
  
  <link rel="stylesheet" href="../css/app.css">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../firebase/firebase-config.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: #FFF;
      font-family: sans-serif;
      padding: 15px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
    }
    .status-toggle {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .status-online { background-color: #28a745; color: #FFF; }
    .status-offline { background-color: #dc3545; color: #FFF; }
    .ride-card {
      background-color: #1E1E1E;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      border-left: 5px solid #FFC107;
    }
    .btn-accept {
      background-color: #FFC107;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Rider Dashboard</h2>
    <button id="statusBtn" class="status-toggle status-offline" onclick="toggleStatus()">OFFLINE</button>
  </div>

  <h3>Available Ride Requests</h3>
  <div id="requestsContainer">
    <p>Go ONLINE to receive nearby requests.</p>
  </div>

  <script>
    let isOnline = false;
    let unsubscribeRides = null;

    function toggleStatus() {
      isOnline = !isOnline;
      const btn = document.getElementById('statusBtn');
      if (isOnline) {
        btn.innerText = "ONLINE";
        btn.className = "status-toggle status-online";
        listenForRides();
      } else {
        btn.innerText = "OFFLINE";
        btn.className = "status-toggle status-offline";
        if (unsubscribeRides) unsubscribeRides();
        document.getElementById('requestsContainer').innerHTML = "<p>Go ONLINE to receive nearby requests.</p>";
      }
    }

    function listenForRides() {
      const container = document.getElementById('requestsContainer');
      container.innerHTML = "<p>Listening for active ride requests...</p>";

      unsubscribeRides = db.collection('rides')
        .where('status', '==', 'SEARCHING')
        .onSnapshot((snapshot) => {
          if (snapshot.empty) {
            container.innerHTML = "<p>No rides available in your area right now.</p>";
            return;
          }

          container.innerHTML = "";
          snapshot.forEach((doc) => {
            const ride = doc.data();
            const card = document.createElement('div');
            card.className = 'ride-card';
            card.innerHTML = `
              <strong>Service: ${ride.serviceType.toUpperCase()}</strong>
              <p>Pickup: ${ride.pickup.address}</p>
              <p>Drop: ${ride.drop.address}</p>
              <p><strong>Fare: ₹${ride.fare}</strong> (${ride.distanceKm} km)</p>
              <button class="btn-accept" onclick="acceptRide('${doc.id}')">Accept Ride</button>
            `;
            container.appendChild(card);
          });
        });
    }

    function acceptRide(rideId) {
      const user = auth.currentUser;
      if (!user) {
        alert("Please log in as a rider.");
        return;
      }

      db.collection('rides').doc(rideId).update({
        riderId: user.uid,
        status: 'ACCEPTED',
        acceptedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("Ride accepted successfully!");
      }).catch(err => {
        console.error("Acceptance error: ", err);
      });
    }
  </script>
</body>
</html>
