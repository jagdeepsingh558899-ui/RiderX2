<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Rider Profile</title>


<link rel="stylesheet" href="../css/style.css">


</head>


<body>


<div class="topbar">

<h2>
👤 Rider Profile
</h2>

</div>







<div class="container">







<div class="card profile-card">



<img

id="profileImage"

src="../assets/user.png"

class="profile-img"

>



<h3>

Rider Profile

</h3>


</div>









<div class="card">



<input

id="name"

class="input"

placeholder="Full Name"

>




<input

id="phone"

class="input"

placeholder="Mobile Number"

readonly

>




<input

id="email"

class="input"

placeholder="Email"

readonly

>





<select

id="vehicleType"

class="input"

>


<option value="Bike">

🏍 Bike

</option>


<option value="Taxi">

🚕 Taxi

</option>



<option value="Cab">

🚗 Cab

</option>



</select>







<input

id="vehicleNumber"

class="input"

placeholder="Vehicle Number"

>







<button

id="saveProfile"

class="btn">

💾 Save Profile

</button>





</div>









<div class="card">


<button

class="btn-outline"

onclick="location.href='Settings.html'">

⚙️ Settings

</button>



</div>








</div>








<div class="bottom-nav">


<a href="Home.html">

🏠
<br>
Home

</a>


<a href="Rides.html">

🚕

<br>

Rides

</a>



<a class="active">

👤

<br>

Profile

</a>



<a href="Settings.html">

⚙️

<br>

Settings

</a>



</div>








<script type="module" src="../js/Profile.js"></script>


</body>

</html>
