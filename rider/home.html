<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Rider Dashboard</title>


<link rel="stylesheet" href="../css/style.css">



<style>


body{

margin:0;

background:#000;

color:white;

font-family:Arial,sans-serif;

padding-bottom:80px;

}



.header{

background:#111;

padding:20px;

border-bottom-left-radius:25px;

border-bottom-right-radius:25px;

}



.brand{

color:#FFD600;

font-size:28px;

font-weight:900;

}



.welcome{

margin-top:15px;

}



.container{

padding:20px;

}



.online-card{

background:#111;

padding:20px;

border-radius:20px;

}



.toggle{

background:#333;

padding:15px;

border-radius:15px;

text-align:center;

color:#FFD600;

font-weight:bold;

cursor:pointer;

}



.stats{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

margin-top:20px;

}



.stat{

background:#111;

padding:20px;

border-radius:20px;

text-align:center;

}



.value{

font-size:28px;

color:#FFD600;

font-weight:bold;

}



.requests{

background:#111;

padding:20px;

border-radius:20px;

margin-top:20px;

}



.request{

background:#222;

padding:15px;

border-radius:15px;

margin-top:10px;

}



.bottom{

position:fixed;

bottom:0;

left:0;

width:100%;

height:70px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

}



.bottom div{

text-align:center;

font-size:13px;

}



.active{

color:#FFD600;

}


</style>


</head>



<body>



<div class="header">


<div class="brand">

🏍 RiderX

</div>



<div class="welcome">

Welcome Rider 👋

</div>


</div>






<div class="container">





<div class="online-card">


<h3>

Ride Status

</h3>



<div class="toggle" id="statusBtn">

OFFLINE

</div>


</div>







<div class="stats">


<div class="stat">

Today's Ride

<div class="value">

0

</div>

</div>




<div class="stat">

Earnings

<div class="value">

₹0

</div>

</div>



</div>







<div class="requests">


<h3>

New Ride Requests

</h3>


<div id="rideRequests">


No requests available

</div>


</div>







</div>








<div class="bottom">


<div class="active">

🏠

<br>

Home

</div>



<div onclick="location.href='rides.html'">

🚦

<br>

Rides

</div>



<div onclick="location.href='wallet.html'">

💰

<br>

Wallet

</div>



<div onclick="location.href='profile.html'">

👤

<br>

Profile

</div>



</div>






<script type="module" src="../js/rider.js"></script>



</body>

</html>
