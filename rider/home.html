<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RiderX Rider Dashboard</title>

<link
    rel="stylesheet"
    href="../assets/app.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<meta
    name="theme-color"
    content="#000000"
>


<style>

:root{
    --yellow:#FFD600;
    --black:#000;
    --dark:#111;
    --dark2:#171717;
    --border:#2c2c2c;
    --gray:#999;
    --green:#00c853;
    --red:#ff3333;
}


/* ============================================================
   RESET
============================================================ */

*{
    box-sizing:border-box;
}


html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}


body{

    margin:0;

    padding-bottom:90px;

    background:var(--black);

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* ============================================================
   HEADER
============================================================ */

.header{

    height:70px;

    background:var(--dark);

    border-bottom:
        1px solid #222;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 18px;

    position:sticky;

    top:0;

    z-index:100;

}


.logo{

    font-size:28px;

    font-weight:900;

    letter-spacing:-1px;

}


.logo span{

    color:var(--yellow);

}


.profile-button{

    width:42px;

    height:42px;

    border-radius:50%;

    background:#222;

    border:1px solid #444;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    font-size:18px;

}


/* ============================================================
   MAIN
============================================================ */

.container{

    width:100%;

    max-width:700px;

    margin:0 auto;

    padding:
        15px;

}


/* ============================================================
   WELCOME
============================================================ */

.welcome{

    margin-top:8px;

    margin-bottom:15px;

}


.welcome h2{

    margin:0;

    font-size:24px;

}


.welcome p{

    margin:
        5px 0 0;

    color:var(--gray);

    font-size:13px;

}


/* ============================================================
   ONLINE BUTTON
============================================================ */

.online-btn{

    width:100%;

    margin:
        0 0 15px;

    padding:16px;

    background:var(--yellow);

    color:#000;

    border:none;

    border-radius:15px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

}


.online-btn:active{

    transform:scale(.98);

}


.online-btn.offline{

    background:var(--red);

    color:#fff;

}


/* ============================================================
   EARNING
============================================================ */

.earning{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:var(--dark);

    border:
        1px solid var(--border);

    margin:
        0 0 15px;

    padding:20px;

    border-radius:20px;

}


.earning-title{

    color:#aaa;

    font-size:14px;

}


.amount{

    color:var(--yellow);

    font-size:26px;

    font-weight:bold;

}


/* ============================================================
   CARDS
============================================================ */

.card{

    background:var(--dark);

    border:
        1px solid var(--border);

    margin:
        15px 0;

    padding:20px;

    border-radius:20px;

}


.card h3{

    color:var(--yellow);

    margin:
        0 0 15px;

    font-size:18px;

}


.card p{

    color:#ccc;

    font-size:14px;

    line-height:1.5;

}


.card strong{

    color:#fff;

}


/* ============================================================
   RIDE REQUEST
============================================================ */

.ride-info{

    background:#080808;

    border:
        1px solid #292929;

    border-radius:14px;

    padding:14px;

    margin-bottom:14px;

}


.ride-row{

    display:flex;

    justify-content:space-between;

    gap:15px;

    padding:8px 0;

    border-bottom:
        1px solid #222;

}


.ride-row:last-child{

    border-bottom:none;

}


.ride-label{

    color:#888;

    font-size:13px;

}


.ride-value{

    color:#fff;

    text-align:right;

    font-size:13px;

    word-break:break-word;

}


.fare-value{

    color:var(--yellow);

    font-size:18px;

    font-weight:bold;

}


/* ============================================================
   BUTTONS
============================================================ */

.ride-buttons{

    display:flex;

    gap:10px;

}


button{

    cursor:pointer;

    font-family:inherit;

}


.accept{

    flex:1;

    padding:14px;

    background:var(--yellow);

    color:#000;

    border:none;

    border-radius:12px;

    font-weight:bold;

    font-size:15px;

}


.reject{

    flex:1;

    padding:14px;

    background:#222;

    color:white;

    border:
        1px solid #555;

    border-radius:12px;

    font-size:15px;

}


/* ============================================================
   INPUT
============================================================ */

.input{

    width:100%;

    padding:14px;

    background:#000;

    color:white;

    border:
        1px solid #555;

    border-radius:12px;

    margin-top:10px;

    outline:none;

    font-size:16px;

}


.input:focus{

    border-color:var(--yellow);

}


/* ============================================================
   START BUTTON
============================================================ */

.start{

    width:100%;

    padding:15px;

    background:var(--yellow);

    color:#000;

    border:none;

    border-radius:15px;

    font-weight:bold;

    margin-top:10px;

    font-size:16px;

}


/* ============================================================
   COMPLETE
============================================================ */

.complete{

    width:100%;

    padding:15px;

    background:var(--green);

    color:white;

    border:none;

    border-radius:15px;

    font-weight:bold;

    margin-top:10px;

    font-size:16px;

}


/* ============================================================
   DISABLED
============================================================ */

button:disabled{

    opacity:.5;

    cursor:not-allowed;

}


/* ============================================================
   STATUS
============================================================ */

.status-box{

    text-align:center;

    padding:15px;

    background:#080808;

    border:
        1px solid #292929;

    border-radius:15px;

    color:#aaa;

}


.status-dot{

    display:inline-block;

    width:9px;

    height:9px;

    border-radius:50%;

    background:#777;

    margin-right:6px;

}


.status-dot.online{

    background:var(--green);

    box-shadow:
        0 0 10px rgba(0,200,83,.7);

}


/* ============================================================
   LOADING
============================================================ */

.loading{

    text-align:center;

    padding:25px 10px;

    color:#999;

}


.loading i{

    color:var(--yellow);

    font-size:24px;

    margin-bottom:10px;

}


/* ============================================================
   NO RIDES
============================================================ */

.no-rides{

    text-align:center;

    padding:25px 10px;

    color:#888;

}


.no-rides i{

    font-size:32px;

    color:#555;

    margin-bottom:10px;

}


/* ============================================================
   ACTIVE RIDE
============================================================ */

.active-ride{

    border:
        1px solid var(--green);

    background:#07140c;

}


.active-title{

    color:var(--green);

    font-size:19px;

    font-weight:bold;

    margin-bottom:12px;

}


/* ============================================================
   HIDDEN
============================================================ */

.hidden{

    display:none !important;

}


/* ============================================================
   BOTTOM NAV
============================================================ */

.bottom{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    background:#111;

    border-top:
        1px solid #292929;

    display:flex;

    justify-content:space-around;

    padding:
        10px 0;

    z-index:200;

}


.bottom button{

    background:none;

    border:none;

    color:#888;

    text-align:center;

    font-size:11px;

    min-width:65px;

}


.bottom button i{

    display:block;

    font-size:18px;

    margin-bottom:5px;

}


.bottom button.active{

    color:var(--yellow);

}


/* ============================================================
   TOAST
============================================================ */

.toast{

    position:fixed;

    left:50%;

    bottom:85px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 30px);

    max-width:500px;

    background:#222;

    border:
        1px solid #444;

    color:#fff;

    padding:14px;

    border-radius:12px;

    text-align:center;

    z-index:500;

    display:none;

}


.toast.show{

    display:block;

}


/* ============================================================
   SECURITY SCREEN
============================================================ */

.security-screen{

    position:fixed;

    inset:0;

    z-index:1000;

    background:#000;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.security-card{

    width:100%;

    max-width:380px;

    background:#111;

    border:
        1px solid #292929;

    border-radius:22px;

    padding:30px 20px;

    text-align:center;

}


.security-logo{

    font-size:34px;

    font-weight:900;

    margin-bottom:18px;

}


.security-logo span{

    color:var(--yellow);

}


.security-spinner{

    color:var(--yellow);

    font-size:28px;

    margin-bottom:15px;

}


.security-text{

    color:#999;

    font-size:14px;

}


/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:500px){

    .container{

        padding:
            12px;

    }


    .header{

        padding:
            0 14px;

    }


    .logo{

        font-size:25px;

    }


    .welcome h2{

        font-size:22px;

    }


    .card{

        padding:16px;

    }


    .ride-buttons{

        flex-direction:column;

    }


    .accept,
    .reject{

        width:100%;

    }

}

</style>

</head>

<!-- ============================================================
     PAGE CONTROLLER
============================================================ -->

<script type="module">

import {
    auth,
    db,
    doc,
    getDoc,
    collection,
    query,
    where,
    onSnapshot
} from "../firebase/firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


const $ =
    id => document.getElementById(id);


let currentUser = null;

let riderProfile = null;

let activeRideId = null;

let earningUnsubscribe = null;

let rideUnsubscribe = null;


// ============================================================
// SECURITY
// ============================================================

function isApproved(data){

    if(!data){
        return false;
    }


    const status =
        String(
            data.status ??
            data.approvalStatus ??
            data.riderStatus ??
            data.accountStatus ??
            ""
        )
        .trim()
        .toLowerCase();


    return (
        data.approved === true ||
        data.isApproved === true ||
        data.adminApproved === true ||
        [
            "approved",
            "active",
            "verified"
        ].includes(status)
    );

}


function showSecurity(text){

    const screen =
        $("securityScreen");

    const label =
        $("securityText");


    if(label){
        label.textContent = text;
    }


    if(screen){
        screen.style.display = "flex";
    }

}


function hideSecurity(){

    const screen =
        $("securityScreen");


    if(screen){
        screen.style.display = "none";
    }

}


// ============================================================
// TOAST
// ============================================================

function toast(text){

    const box =
        $("toast");


    if(!box){
        return;
    }


    box.textContent =
        text;


    box.classList.add(
        "show"
    );


    setTimeout(
        () => {

            box.classList.remove(
                "show"
            );

        },
        2500
    );

}


// ============================================================
// RIDER PROFILE
// ============================================================

async function loadRiderProfile(user){

    const riderRef =
        doc(
            db,
            "riders",
            user.uid
        );


    const riderSnap =
        await getDoc(riderRef);


    if(
        riderSnap.exists()
    ){

        return riderSnap.data();

    }


    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    const userSnap =
        await getDoc(userRef);


    if(
        userSnap.exists()
    ){

        return userSnap.data();

    }


    return null;

}


// ============================================================
// PROFILE UI
// ============================================================

function updateProfileUI(){

    if(!riderProfile){
        return;
    }


    const name =
        riderProfile.name ||
        riderProfile.fullName ||
        riderProfile.displayName ||
        "Rider";


    $("riderGreeting").textContent =
        "Hello, " + name + " 👋";


    $("riderName").textContent =
        "Welcome back to RiderX";


}


// ============================================================
// AUTH
// ============================================================

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            showSecurity(
                "Login required. Opening Rider login..."
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "../auth/login.html?role=rider"
                    );

                },
                500
            );


            return;
        }


        currentUser =
            user;


        try{

            showSecurity(
                "Loading rider profile..."
            );


            riderProfile =
                await loadRiderProfile(
                    user
                );


            if(
                !riderProfile
            ){

                showSecurity(
                    "Rider profile not found."
                );


                setTimeout(
                    () => {

                        window.location.replace(
                            "../auth/login.html?role=rider"
                        );

                    },
                    800
                );


                return;
            }


            if(
                !isApproved(
                    riderProfile
                )
            ){

                showSecurity(
                    "Rider account is waiting for admin approval."
                );


                setTimeout(
                    () => {

                        window.location.replace(
                            "../auth/login.html?role=rider"
                        );

                    },
                    1200
                );


                return;
            }


            updateProfileUI();


            hideSecurity();


            startEarningListener();

        }catch(error){

            console.error(
                "Rider Home error:",
                error
            );


            showSecurity(
                "Unable to load rider account."
            );

        }

    }
);


// ============================================================
// EARNINGS
// ============================================================

function startEarningListener(){

    if(
        !currentUser
    ){
        return;
    }


    if(
        typeof earningUnsubscribe ===
        "function"
    ){

        earningUnsubscribe();

    }


    const ridesRef =
        collection(
            db,
            "rides"
        );


    const riderQuery =
        query(
            ridesRef,
            where(
                "riderId",
                "==",
                currentUser.uid
            )
        );


    earningUnsubscribe =
        onSnapshot(
            riderQuery,
            snapshot => {

                let total =
                    0;


                const today =
                    new Date();


                snapshot.forEach(
                    rideDoc => {

                        const ride =
                            rideDoc.data();


                        const status =
                            String(
                                ride.status ||
                                ""
                            )
                            .trim()
                            .toLowerCase();


                        if(
                            ![
                                "completed",
                                "complete",
                                "finished",
                                "success"
                            ].includes(
                                status
                            )
                        ){

                            return;

                        }


                        const timestamp =
                            ride.completedAt ||
                            ride.createdAt;


                        let date = null;


                        if(
                            typeof timestamp?.toDate ===
                            "function"
                        ){

                            date =
                                timestamp.toDate();

                        }


                        if(
                            !date &&
                            timestamp
                        ){

                            date =
                                new Date(
                                    timestamp
                                );

                        }


                        if(!date){
                            return;
                        }


                        if(
                            date.getDate() ===
                                today.getDate() &&
                            date.getMonth() ===
                                today.getMonth() &&
                            date.getFullYear() ===
                                today.getFullYear()
                        ){

                            total +=
                                Number(
                                    ride.fare ??
                                    ride.amount ??
                                    ride.totalFare ??
                                    0
                                ) || 0;

                        }

                    }
                );


                $("earningAmount").textContent =
                    "₹" +
                    total.toLocaleString(
                        "en-IN"
                    );

            },
            error => {

                console.warn(
                    "Earning listener:",
                    error
                );

            }
        );

}


// ============================================================
// PROFILE BUTTON
// ============================================================

$("profileButton")
.addEventListener(
    "click",
    () => {

        window.location.href =
            "Profile.html";

    }
);


// ============================================================
// BOTTOM NAV
// ============================================================

$("homeNav")
.addEventListener(
    "click",
    () => {

        window.location.href =
            "Home.html";

    }
);


$("ridesNav")
.addEventListener(
    "click",
    () => {

        window.location.href =
            "Rides.html";

    }
);


$("walletNav")
.addEventListener(
    "click",
    () => {

        window.location.href =
            "Wallet.html";

    }
);


$("profileNav")
.addEventListener(
    "click",
    () => {

        window.location.href =
            "Profile.html";

    }
);


// ============================================================
// START RIDE BUTTON
// ============================================================

$("startRide")
.addEventListener(
    "click",
    () => {

        const otp =
            $("otpInput").value
                .trim();


        if(
            !otp
        ){

            toast(
                "Please enter customer OTP."
            );

            return;

        }


        if(
            !/^\d{4,6}$/.test(
                otp
            )
        ){

            toast(
                "Please enter a valid OTP."
            );

            return;

        }


        if(
            !activeRideId
        ){

            toast(
                "No active ride found."
            );

            return;

        }


        // Actual ride update is handled
        // below using modular Firebase.

        startRideWithOtp(
            activeRideId,
            otp
        );

    }
);


// ============================================================
// START RIDE WITH OTP
// ============================================================

async function startRideWithOtp(
    rideId,
    otp
){

    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const rideSnap =
            await getDoc(
                rideRef
            );


        if(
            !rideSnap.exists()
        ){

            toast(
                "Ride not found."
            );

            return;

        }


        const ride =
            rideSnap.data();


        const correctOtp =
            String(
                ride.otp ??
                ride.customerOtp ??
                ride.startOtp ??
                ""
            );


        if(
            correctOtp &&
            correctOtp !== otp
        ){

            toast(
                "Incorrect customer OTP."
            );

            return;

        }


        const {
            updateDoc,
            serverTimestamp
        } =
            await import(
                "../firebase/firebase-config.js"
            );


        await updateDoc(
            rideRef,
            {
                status:"STARTED",
                rideStatus:"STARTED",
                startedAt:
                    serverTimestamp()
            }
        );


        $("otpCard")
            .classList.add(
                "hidden"
            );


        $("activeRideCard")
            .classList.remove(
                "hidden"
            );


        toast(
            "Ride started successfully."
        );

    }catch(error){

        console.error(
            "Start ride error:",
            error
        );


        toast(
            "Unable to start ride: " +
            error.message
        );

    }

}

document.addEventListener(
    "DOMContentLoaded",
    () => {

        console.log(
            "RiderX Home loaded."
        );

    }
);

</script>
