<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>RiderX Rider</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:Poppins,Arial,sans-serif;
}

/* =====================================================
   MAP
===================================================== */

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.leaflet-control-zoom{
    margin-top:90px!important;
}

.leaflet-control-zoom a{
    background:#111!important;
    color:#FFD600!important;
    border-color:#333!important;
}

.leaflet-control-attribution{
    background:rgba(0,0,0,.65)!important;
    color:#aaa!important;
}

.leaflet-control-attribution a{
    color:#FFD600!important;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:2000;
    padding:14px;
    pointer-events:none;
}

.topbar-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    pointer-events:auto;
    background:#101010;
    border:1px solid #303030;
    border-radius:15px;
    padding:9px 15px;
    font-size:19px;
    font-weight:900;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.logo span{
    color:#FFD600;
}

.top-btn{
    pointer-events:auto;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:#111;
    border:1px solid #333;
    color:#fff;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
}


/* =====================================================
   ONLINE CONTROL
===================================================== */

.online-control{
    position:absolute;
    top:76px;
    left:14px;
    right:14px;
    z-index:1900;

    background:rgba(12,12,12,.94);
    border:1px solid #303030;
    border-radius:18px;

    padding:12px 14px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.online-status{
    display:flex;
    align-items:center;
    gap:10px;
}

.status-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#777;
}

.status-dot.online{
    background:#22c55e;
    box-shadow:0 0 15px rgba(34,197,94,.8);
}

.status-text strong{
    display:block;
    font-size:14px;
}

.status-text small{
    display:block;
    color:#888;
    font-size:10px;
    margin-top:2px;
}

.online-btn{
    border:none;
    border-radius:11px;
    padding:10px 15px;
    background:#FFD600;
    color:#000;
    font-size:12px;
    font-weight:900;
}

.online-btn.offline{
    background:#ef4444;
    color:#fff;
}


/* =====================================================
   RIDER LOCATION BUTTON
===================================================== */

.location-btn{
    position:absolute;
    right:14px;
    bottom:290px;
    z-index:1500;

    width:48px;
    height:48px;

    border:none;
    border-radius:50%;

    background:#111;
    color:#FFD600;

    border:1px solid #333;

    font-size:18px;

    box-shadow:0 5px 20px rgba(0,0,0,.45);
}


/* =====================================================
   REQUEST CARD
===================================================== */

.request-panel{
    position:absolute;
    left:10px;
    right:10px;
    bottom:10px;

    z-index:1800;

    background:#090909;
    border:1px solid #333;
    border-radius:24px;

    padding:15px;

    box-shadow:
        0 -5px 35px rgba(0,0,0,.55);

    display:none;

    max-height:54vh;
    overflow-y:auto;
}

.request-panel.show{
    display:block;
}

.handle{
    width:42px;
    height:4px;
    background:#555;
    border-radius:10px;
    margin:0 auto 13px;
}

.request-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.request-title{
    font-size:17px;
    font-weight:900;
}

.new-badge{
    background:#FFD600;
    color:#000;
    border-radius:8px;
    padding:5px 8px;
    font-size:9px;
    font-weight:900;
}

.service{
    display:inline-flex;
    align-items:center;
    gap:7px;

    background:#1c1a00;
    border:1px solid #665b00;
    color:#FFD600;

    border-radius:10px;
    padding:7px 9px;

    font-size:10px;
    font-weight:900;

    margin-bottom:12px;
}


/* =====================================================
   LOCATION
===================================================== */

.location-box{
    background:#111;
    border:1px solid #292929;
    border-radius:15px;
    padding:12px;
}

.location-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.location-row + .location-row{
    margin-top:13px;
}

.location-icon{
    width:29px;
    height:29px;
    min-width:29px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
}

.pickup{
    background:#12351f;
    color:#22c55e;
}

.drop{
    background:#3b3500;
    color:#FFD600;
}

.location-label{
    color:#777;
    font-size:9px;
    text-transform:uppercase;
    font-weight:700;
}

.location-address{
    color:#fff;
    font-size:11px;
    line-height:1.4;
    margin-top:2px;
    word-break:break-word;
}


/* =====================================================
   RIDE DETAILS
===================================================== */

.details-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:10px;
}

.detail{
    background:#111;
    border:1px solid #292929;
    border-radius:12px;
    padding:10px 5px;
    text-align:center;
}

.detail small{
    display:block;
    color:#777;
    font-size:8px;
    margin-bottom:3px;
}

.detail strong{
    display:block;
    color:#fff;
    font-size:12px;
}

.detail.fare strong{
    color:#FFD600;
    font-size:18px;
}


/* =====================================================
   CUSTOMER
===================================================== */

.customer-box{
    display:flex;
    align-items:center;
    gap:10px;

    margin-top:10px;

    background:#111;
    border:1px solid #292929;
    border-radius:13px;

    padding:10px;
}

.customer-avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#FFD600;
    color:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
}

.customer-name{
    font-size:12px;
    font-weight:800;
}

.customer-label{
    color:#777;
    font-size:9px;
}


/* =====================================================
   BUTTONS
===================================================== */

.action-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:11px;
}

.action-btn{
    border:none;
    border-radius:13px;
    padding:14px 8px;

    font-size:12px;
    font-weight:900;
}

.accept{
    background:#FFD600;
    color:#000;
}

.reject{
    background:#222;
    border:1px solid #444;
    color:#fff;
}

.navigation{
    width:100%;
    margin-top:8px;

    background:#222;
    border:1px solid #444;
    color:#fff;
}

.start{
    width:100%;
    margin-top:8px;
    background:#22c55e;
    color:#000;
}

.complete{
    width:100%;
    margin-top:8px;
    background:#FFD600;
    color:#000;
}


/* =====================================================
   SEARCHING
===================================================== */

.searching{
    position:absolute;
    top:140px;
    left:50%;
    transform:translateX(-50%);

    z-index:1600;

    background:#111;
    border:1px solid #333;

    padding:8px 13px;
    border-radius:20px;

    font-size:10px;
    color:#aaa;

    display:none;
}

.searching.show{
    display:block;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;

    transform:translate(-50%,20px);

    z-index:5000;

    background:#171717;
    border:1px solid #444;

    padding:11px 16px;
    border-radius:12px;

    font-size:11px;

    opacity:0;
    pointer-events:none;

    transition:.25s;

    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.success{
    border-color:#22c55e;
}

.toast.error{
    border-color:#ef4444;
}


/* =====================================================
   MAP MARKERS
===================================================== */

.rider-marker{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#FFD600;
    border:4px solid #000;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#000;

    font-size:17px;

    box-shadow:0 0 0 6px rgba(255,214,0,.2);
}

.pickup-marker{
    width:38px;
    height:38px;

    border-radius:50% 50% 50% 0;

    transform:rotate(-45deg);

    background:#22c55e;
    border:3px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;
}

.pickup-marker i{
    transform:rotate(45deg);
    color:#fff;
}

.drop-marker{
    width:38px;
    height:38px;

    border-radius:50% 50% 50% 0;

    transform:rotate(-45deg);

    background:#FFD600;
    border:3px solid #000;

    display:flex;
    align-items:center;
    justify-content:center;
}

.drop-marker i{
    transform:rotate(45deg);
    color:#000;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:420px){

    .request-panel{
        max-height:57vh;
    }

    .location-address{
        font-size:10px;
    }

    .action-btn{
        padding:13px 6px;
    }

}

</style>
</head>

<body>


<div id="map"></div>


<!-- =====================================================
     HEADER
===================================================== -->

<div class="topbar">

    <div class="topbar-inner">

        <button
            class="top-btn"
            onclick="goBack()">

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div class="logo">
            RIDER<span>X</span>
        </div>


        <button
            class="top-btn"
            onclick="goProfile()">

            <i class="fa-solid fa-user"></i>

        </button>

    </div>

</div>


<!-- =====================================================
     ONLINE
===================================================== -->

<div class="online-control">

    <div class="online-status">

        <div
            id="statusDot"
            class="status-dot">
        </div>

        <div class="status-text">

            <strong id="statusText">
                Offline
            </strong>

            <small id="statusSub">
                Go online to receive rides
            </small>

        </div>

    </div>


    <button
        id="onlineBtn"
        class="online-btn"
        onclick="toggleOnline()">

        Go Online

    </button>

</div>


<!-- =====================================================
     SEARCHING
===================================================== -->

<div
    id="searching"
    class="searching">

    <i class="fa-solid fa-satellite-dish"></i>

    Searching for nearby rides...

</div>


<!-- =====================================================
     CURRENT LOCATION
===================================================== -->

<button
    class="location-btn"
    onclick="centerOnRider()">

    <i class="fa-solid fa-location-crosshairs"></i>

</button>


<!-- =====================================================
     REQUEST / ACTIVE PANEL
===================================================== -->

<div
    id="requestPanel"
    class="request-panel">

    <div class="handle"></div>

    <div id="rideContent"></div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="toast"
    class="toast">
</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script type="module">

import {
    auth,
    db
}
from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let map = null;

let riderMarker = null;

let pickupMarker = null;

let dropMarker = null;

let routeLine = null;

let gpsWatchId = null;

let rideListener = null;

let activeRideListener = null;

let currentRideId = null;

let currentRide = null;

let isOnline = false;

let currentLat = null;

let currentLng = null;

let knownRideIds = new Set();

let soundContext = null;


/* =====================================================
   ELEMENTS
===================================================== */

const onlineBtn =
    document.getElementById("onlineBtn");

const statusDot =
    document.getElementById("statusDot");

const statusText =
    document.getElementById("statusText");

const statusSub =
    document.getElementById("statusSub");

const requestPanel =
    document.getElementById("requestPanel");

const rideContent =
    document.getElementById("rideContent");

const searching =
    document.getElementById("searching");


/* =====================================================
   MAP INIT
===================================================== */

function initMap(){

    if(map){
        return;
    }


    map =
        L.map("map",{
            zoomControl:true,
            attributionControl:true
        });


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);


    map.setView(
        [30.7333,76.7794],
        13
    );

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async(user)=>{

        if(!user){

            location.replace(
                "../auth/login.html?role=rider"
            );

            return;
        }


        currentUser = user;

        initMap();

        await loadRider();

    }
);


/* =====================================================
   LOAD RIDER
===================================================== */

async function loadRider(){

    try{

        const userSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                )
            );


        if(!userSnap.exists()){

            showToast(
                "Rider profile not found.",
                "error"
            );

            return;
        }


        const userData =
            userSnap.data();


        if(
            String(userData.role || "")
            .toLowerCase() !== "rider"
        ){

            showToast(
                "This account is not a rider.",
                "error"
            );

            return;
        }


        const riderSnap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                )
            );


        const riderData =
            riderSnap.exists()
                ? riderSnap.data()
                : {};


        const approved =
            userData.adminApproved === true ||
            riderData.adminApproved === true ||
            userData.approved === true ||
            riderData.approved === true ||
            String(userData.status || "").toLowerCase() === "active" ||
            String(riderData.status || "").toLowerCase() === "active";


        if(!approved){

            location.replace(
                "pending.html"
            );

            return;
        }


        isOnline =
            userData.isOnline === true ||
            riderData.isOnline === true;


        updateOnlineUI();


        if(isOnline){

            startOnlineMode();

        }


        findActiveRide();

    }
    catch(error){

        console.error(error);

        showToast(
            "Unable to load rider.",
            "error"
        );

    }

}


/* =====================================================
   ONLINE UI
===================================================== */

function updateOnlineUI(){

    if(isOnline){

        statusDot.classList.add("online");

        statusText.textContent =
            "Online";

        statusSub.textContent =
            "Receiving nearby ride requests";

        onlineBtn.textContent =
            "Go Offline";

        onlineBtn.classList.add(
            "offline"
        );

    }
    else{

        statusDot.classList.remove("online");

        statusText.textContent =
            "Offline";

        statusSub.textContent =
            "Go online to receive rides";

        onlineBtn.textContent =
            "Go Online";

        onlineBtn.classList.remove(
            "offline"
        );

    }

}


/* =====================================================
   TOGGLE ONLINE
===================================================== */

window.toggleOnline =
async function(){

    if(!currentUser){

        showToast(
            "Please login first.",
            "error"
        );

        return;
    }


    const newStatus =
        !isOnline;


    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                isOnline:newStatus,
                updatedAt:serverTimestamp()
            }
        );


        try{

            await updateDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                ),
                {
                    isOnline:newStatus,
                    updatedAt:serverTimestamp()
                }
            );

        }
        catch(e){

            console.warn(
                "Rider document update:",
                e
            );

        }


        isOnline =
            newStatus;


        updateOnlineUI();


        if(isOnline){

            startOnlineMode();

            showToast(
                "You are now online.",
                "success"
            );

        }
        else{

            stopOnlineMode();

            showToast(
                "You are now offline.",
                "success"
            );

        }

    }
    catch(error){

        console.error(error);

        showToast(
            "Unable to change online status.",
            "error"
        );

    }

};


/* =====================================================
   ONLINE MODE
===================================================== */

function startOnlineMode(){

    initMap();

    startGPS();

    listenForRideRequests();

}


/* =====================================================
   OFFLINE MODE
===================================================== */

function stopOnlineMode(){

    stopGPS();

    stopRideListener();


    searching.classList.remove(
        "show"
    );


    if(
        !currentRideId
    ){

        requestPanel.classList.remove(
            "show"
        );

        clearRideMarkers();

    }

}


/* =====================================================
   GPS
===================================================== */

function startGPS(){

    if(
        !navigator.geolocation
    ){

        showToast(
            "GPS is not supported on this device.",
            "error"
        );

        return;
    }


    if(
        gpsWatchId !== null
    ){

        return;

    }


    gpsWatchId =
        navigator.geolocation.watchPosition(
            async(position)=>{

                currentLat =
                    position.coords.latitude;

                currentLng =
                    position.coords.longitude;


                updateRiderMarker();


                await saveRiderLocation();

            },
            (error)=>{

                console.error(
                    "GPS:",
                    error
                );


                if(error.code === 1){

                    showToast(
                        "Please allow location permission.",
                        "error"
                    );

                }

            },
            {
                enableHighAccuracy:true,
                maximumAge:5000,
                timeout:15000
            }
        );

}


/* =====================================================
   STOP GPS
===================================================== */

function stopGPS(){

    if(
        gpsWatchId !== null
    ){

        navigator.geolocation.clearWatch(
            gpsWatchId
        );

        gpsWatchId =
            null;

    }

}


/* =====================================================
   RIDER MARKER
===================================================== */

function updateRiderMarker(){

    if(
        currentLat === null ||
        currentLng === null
    ){

        return;

    }


    const icon =
        L.divIcon({
            className:"",
            html:`
                <div class="rider-marker">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
            `,
            iconSize:[42,42],
            iconAnchor:[21,21]
        });


    if(!riderMarker){

        riderMarker =
            L.marker(
                [
                    currentLat,
                    currentLng
                ],
                {
                    icon:icon,
                    zIndexOffset:1000
                }
            )
            .addTo(map);

        map.setView(
            [
                currentLat,
                currentLng
            ],
            16
        );

    }
    else{

        riderMarker.setLatLng(
            [
                currentLat,
                currentLng
            ]
        );

    }

}


/* =====================================================
   SAVE RIDER GPS
===================================================== */

async function saveRiderLocation(){

    if(
        !currentUser ||
        currentLat === null ||
        currentLng === null
    ){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "riders",
                currentUser.uid
            ),
            {
                isOnline:true,
                lat:currentLat,
                lng:currentLng,
                location:{
                    lat:currentLat,
                    lng:currentLng
                },
                updatedAt:serverTimestamp()
            }
        );

    }
    catch(error){

        console.warn(
            "Rider location update:",
            error
        );

    }

}


/* =====================================================
   CENTER RIDER
===================================================== */

window.centerOnRider =
function(){

    if(
        currentLat === null ||
        currentLng === null
    ){

        showToast(
            "Waiting for GPS location.",
            "error"
        );

        return;
    }


    map.setView(
        [
            currentLat,
            currentLng
        ],
        17,
        {
            animate:true
        }
    );

};


/* =====================================================
   RIDE REQUEST LISTENER
===================================================== */

function listenForRideRequests(){

    stopRideListener();


    if(!isOnline){

        return;
    }


    searching.classList.add(
        "show"
    );


    const q =
        query(
            collection(db,"rides"),
            where(
                "status",
                "==",
                "searching"
            )
        );


    rideListener =
        onSnapshot(
            q,
            (snapshot)=>{

                if(!isOnline){

                    return;
                }


                const rides = [];


                snapshot.forEach(
                    snap=>{

                        const ride =
                            snap.data();


                        /*
                         * Do not show ride already
                         * assigned to another rider.
                         */

                        if(
                            ride.riderId &&
                            ride.riderId !== currentUser.uid
                        ){

                            return;
                        }


                        rides.push({
                            id:snap.id,
                            ...ride
                        });


                        if(
                            !knownRideIds.has(
                                snap.id
                            )
                        ){

                            knownRideIds.add(
                                snap.id
                            );

                            playNewRideSound();

                        }

                    }
                );


                if(
                    currentRideId
                ){

                    searching.classList.remove(
                        "show"
                    );

                    return;
                }


                if(
                    rides.length === 0
                ){

                    searching.classList.add(
                        "show"
                    );

                    requestPanel.classList.remove(
                        "show"
                    );

                    clearRideMarkers();

                    return;
                }


                searching.classList.remove(
                    "show"
                );


                /*
                 * Show nearest/latest request.
                 */

                const ride =
                    rides[0];


                showRideRequest(
                    ride.id,
                    ride
                );


                showRideOnMap(
                    ride
                );

            },
            (error)=>{

                console.error(
                    "Ride listener:",
                    error
                );


                showToast(
                    "Ride requests could not be loaded.",
                    "error"
                );

            }
        );

}

/* =====================================================
   NEW RIDE SOUND
===================================================== */

function playNewRideSound(){

    try{

        if(!soundContext){

            soundContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(
            soundContext.state === "suspended"
        ){

            soundContext.resume();

        }


        const now =
            soundContext.currentTime;


        [0,0.18,0.36].forEach(
            (delay,index)=>{

                const oscillator =
                    soundContext.createOscillator();

                const gain =
                    soundContext.createGain();


                oscillator.type =
                    "sine";


                oscillator.frequency.value =
                    index === 1
                        ? 880
                        : 660;


                gain.gain.setValueAtTime(
                    0.0001,
                    now + delay
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.45,
                    now + delay + 0.03
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + delay + 0.15
                );


                oscillator.connect(gain);

                gain.connect(
                    soundContext.destination
                );


                oscillator.start(
                    now + delay
                );


                oscillator.stop(
                    now + delay + 0.17
                );

            }
        );

    }
    catch(error){

        console.warn(
            "Ride sound:",
            error
        );

    }

}

window.acceptRide =
async function(
    rideId
){

    if(!currentUser){

        return;

    }


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const snap =
            await getDoc(
                rideRef
            );


        if(!snap.exists()){

            showToast(
                "Ride no longer exists.",
                "error"
            );

            return;

        }


        const ride =
            snap.data();


        if(
            ride.status !== "searching"
        ){

            showToast(
                "Ride already accepted by another rider.",
                "error"
            );

            return;

        }


        /*
         * This update requires the Firestore rule
         * supplied below.
         */

        await updateDoc(
            rideRef,
            {

                status:"ACCEPTED",

                riderId:
                    currentUser.uid,

                acceptedAt:
                    serverTimestamp()

            }
        );


        currentRideId =
            rideId;


        currentRide =
            {
                ...ride,
                status:"ACCEPTED",
                riderId:currentUser.uid
            };


        stopRideListener();


        searching.classList.remove(
            "show"
        );


        showActiveRide(
            rideId,
            currentRide
        );


        listenActiveRide(
            rideId
        );


        showToast(
            "Ride accepted. Navigate to pickup.",
            "success"
        );


        showPickupRoute(
            currentRide
        );

    }
    catch(error){

        console.error(
            "Accept ride:",
            error
        );


        showToast(
            "Unable to accept ride: " +
            error.message,
            "error"
        );

    }

};

===================================================== */

function listenActiveRide(
    rideId
){

    if(activeRideListener){

        activeRideListener();

    }


    activeRideListener =
        onSnapshot(
            doc(
                db,
                "rides",
                rideId
            ),
            (snapshot)=>{

                if(!snapshot.exists()){

                    currentRideId =
                        null;

                    currentRide =
                        null;

                    requestPanel.classList.remove(
                        "show"
                    );

                    return;

                }


                const ride =
                    snapshot.data();


                if(
                    ride.riderId !==
                    currentUser.uid
                ){

                    return;

                }


                currentRide =
                    ride;


                if(
                    ride.status ===
                    "ACCEPTED"
                ){

                    showActiveRide(
                        rideId,
                        ride
                    );


                    showPickupRoute(
                        ride
                    );

                }


                else if(
                    ride.status ===
                    "STARTED"
                ){

                    showActiveRide(
                        rideId,
                        ride
                    );


                    showDropRoute(
                        ride
                    );

                }


                else if(
                    ride.status ===
                    "COMPLETED"
                ){

                    showToast(
                        "Ride completed successfully.",
                        "success"
                    );


                    currentRideId =
                        null;

                    currentRide =
                        null;


                    if(activeRideListener){

                        activeRideListener();

                        activeRideListener =
                            null;

                    }


                    clearRideMarkers();


                    requestPanel.classList.remove(
                        "show"
                    );


                    if(isOnline){

                        listenForRideRequests();

                    }

                }

            },
            (error)=>{

                console.error(
                    "Active ride:",
                    error
                );

            }
        );

}

/* =====================================================
   GOOGLE MAPS NAVIGATION
===================================================== */

function navigateToLocation(
    location,
    openGoogle
){

    if(
        !location ||
        location.lat == null ||
        location.lng == null
    ){

        showToast(
            "Location coordinates unavailable.",
            "error"
        );

        return;

    }


    const lat =
        Number(location.lat);

    const lng =
        Number(location.lng);


    /*
     * First show route on RiderX map.
     */

    if(
        currentLat !== null &&
        currentLng !== null
    ){

        drawOSRMRoute(
            currentLat,
            currentLng,
            lat,
            lng
        );

    }


    if(openGoogle){

        const url =
            "https://www.google.com/maps/dir/?api=1" +
            "&origin=" +
            encodeURIComponent(
                currentLat !== null
                    ? currentLat + "," + currentLng
                    : ""
            ) +
            "&destination=" +
            encodeURIComponent(
                lat + "," + lng
            ) +
            "&travelmode=driving";


        window.open(
            url,
            "_blank"
        );

    }

}

/* =====================================================
   OSRM ROUTE
===================================================== */

async function drawOSRMRoute(
    startLat,
    startLng,
    endLat,
    endLng
){

    try{

        const url =
            "https://router.project-osrm.org/route/v1/driving/" +
            startLng + "," +
            startLat +
            ";" +
            endLng + "," +
            endLat +
            "?overview=full&geometries=geojson";


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "Route service unavailable"
            );

        }


        const data =
            await response.json();


        if(
            !data.routes ||
            !data.routes.length
        ){

            return;

        }


        const geometry =
            data.routes[0].geometry;


        clearRouteOnly();


        routeLine =
            L.geoJSON(
                geometry,
                {
                    style:{
                        color:"#FFD600",
                        weight:6,
                        opacity:.9
                    }
                }
            )
            .addTo(map);


        map.fitBounds(
            routeLine.getBounds(),
            {
                padding:[80,180]
            }
        );

    }
    catch(error){

        console.warn(
            "OSRM:",
            error
        );

    }

}


/* =====================================================
   FIND ACTIVE RIDE
===================================================== */

async function findActiveRide(){

    if(!currentUser){

        return;

    }


    try{

        const q =
            query(
                collection(db,"rides"),
                where(
                    "riderId",
                    "==",
                    currentUser.uid
                )
            );


        onSnapshot(
            q,
            (snapshot)=>{

                let found = null;


                snapshot.forEach(
                    snap=>{

                        const ride =
                            snap.data();


                        if(
                            ride.status === "ACCEPTED" ||
                            ride.status === "STARTED"
                        ){

                            found = {
                                id:snap.id,
                                ...ride
                            };

                        }

                    }
                );


                if(found){

                    currentRideId =
                        found.id;

                    currentRide =
                        found;


                    listenActiveRide(
                        found.id
                    );


                    showActiveRide(
                        found.id,
                        found
                    );


                    if(
                        found.status === "STARTED"
                    ){

                        showDropRoute(
                            found
                        );

                    }
                    else{

                        showPickupRoute(
                            found
                        );

                    }

                }

            },
            (error)=>{

                console.error(
                    "Active ride search:",
                    error
                );

            }
        );

    }
    catch(error){

        console.error(
            error
        );

    }

}

}


/* =====================================================
   DISTANCE
===================================================== */

function calculateDistanceBetween(
    a,
    b
){

    if(
        !a ||
        !b ||
        a.lat == null ||
        a.lng == null ||
        b.lat == null ||
        b.lng == null
    ){

        return 0;

    }


    const R =
        6371;


    const dLat =
        (
            Number(b.lat) -
            Number(a.lat)
        ) *
        Math.PI /
        180;


    const dLon =
        (
            Number(b.lng) -
            Number(a.lng)
        ) *
        Math.PI /
        180;


    const x =
        Math.sin(dLat/2) *
        Math.sin(dLat/2)
        +
        Math.cos(
            Number(a.lat) *
            Math.PI /
            180
        )
        *
        Math.cos(
            Number(b.lat) *
            Math.PI /
            180
        )
        *
        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    return (
        R *
        2 *
        Math.atan2(
            Math.sqrt(x),
            Math.sqrt(1-x)
        )
    );

}


/* =====================================================
   LOCATION TEXT
===================================================== */

function getLocationText(
    location
){

    if(!location){

        return "Location unavailable";

    }


    if(
        typeof location ===
        "string"
    ){

        return location;

    }


    return (
        location.address ||
        location.name ||
        location.location ||
        (
            location.lat != null &&
            location.lng != null
                ?
                `${location.lat}, ${location.lng}`
                :
                "Location unavailable"
        )
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

===================================================== */

document.addEventListener(
    "click",
    ()=>{
        try{

            if(!soundContext){

                soundContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

            }


            if(
                soundContext.state ===
                "suspended"
            ){

                soundContext.resume();

            }

        }
        catch(e){}

    },
    {
        once:true
    }
);
