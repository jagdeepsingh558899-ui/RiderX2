<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>


<link rel="stylesheet" href="../assets/app.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

body{
margin:0;
background:#000;
color:white;
font-family:Arial,sans-serif;
}


.header{
height:70px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}


.logo{
font-size:30px;
font-weight:900;
}

.logo span{
color:#FFD600;
}



.online-btn{

width:90%;
margin:20px 5%;
padding:16px;
background:#FFD600;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;

}



.card{

background:#111;
margin:15px;
padding:20px;
border-radius:20px;
border:1px solid #333;

}


.card h3{

color:#FFD600;

}



.ride-buttons{

display:flex;
gap:10px;

}



button{

cursor:pointer;

}



.accept{

flex:1;
padding:14px;
background:#FFD600;
border:none;
border-radius:12px;
font-weight:bold;

}


.reject{

flex:1;
padding:14px;
background:#222;
color:white;
border:1px solid #555;
border-radius:12px;

}



.input{

width:100%;
padding:14px;
background:#000;
color:white;
border:1px solid #555;
border-radius:12px;
margin-top:10px;

}



.start{

width:100%;
padding:15px;
background:#FFD600;
border:none;
border-radius:15px;
font-weight:bold;
margin-top:10px;

}



.complete{

width:100%;
padding:15px;
background:#00c853;
color:white;
border:none;
border-radius:15px;
font-weight:bold;
margin-top:10px;

}



.earning{

display:flex;
justify-content:space-between;
background:#111;
margin:15px;
padding:20px;
border-radius:20px;

}


.amount{

color:#FFD600;
font-size:25px;
font-weight:bold;

}



.bottom{

position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 0;

}



.bottom div{

text-align:center;
font-size:12px;
color:#aaa;

}

</style>


</head>


<body>


<header class="header">

<div class="logo">

RID<span>ERX</span>

</div>


<i class="fa-solid fa-user"></i>

</header>





<button id="onlineBtn" class="online-btn">

🟢 Go Online

</button>







<div class="earning">

<div>

Today's Earning

</div>


<div id="earningAmount" class="amount">

₹0

</div>


</div>








<div class="card">


<h3>

New Ride Request

</h3>


<p id="customerName">

Customer: Waiting...

</p>


<p id="pickupText">

Pickup:-

</p>


<p id="dropText">

Drop:-

</p>


<p id="fareText">

Fare:-

</p>




<div class="ride-buttons">


<button id="acceptRide" class="accept">

Accept

</button>


<button id="rejectRide" class="reject">

Reject

</button>


</div>


</div>








<div class="card">


<h3>

OTP Verification

</h3>


<p>

Customer OTP

</p>


<input 
id="otpInput"
class="input"
placeholder="Enter OTP">


<button 
id="startRide"
class="start">

Start Ride

</button>


</div>








<div class="card">


<h3>

Ride Status

</h3>


<h2 id="rideStatus">

Waiting

</h2>



<button 
id="completeRide"
class="complete">

Complete Ride

</button>


</div>








<div class="bottom">


<div>

<i class="fa-solid fa-house"></i>

<br>

Home

</div>


<div>

<i class="fa-solid fa-clock"></i>

<br>

Rides

</div>


<div>

<i class="fa-solid fa-wallet"></i>

<br>

Wallet

</div>


<div>

<i class="fa-solid fa-user"></i>

<br>

Profile

</div>


</div>







<script type="module" src="js/rider.js"></script>


</body>

</html>
