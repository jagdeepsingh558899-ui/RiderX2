/* ============================================================
   HEADER
============================================================ */

.header{

============================================================ */

    border-radius:20px;

.card h3{

/* ============================================================
   RIDE REQUEST
============================================================ */

.ride-request{

    border-radius:16px;

}

.ride-service{
    color:#FFD600;

    font-weight:bold;

}

.ride-info{
    color:#ccc;

    font-weight:bold;

.ride-actions{

    color:#000;

    border-radius:12px;

/* ============================================================

============================================================ */

.active-box{

    border:1px solid #20c968;

}

.active-title{

    font-size:19px;

/* ============================================================
   INPUT
============================================================ */

.input{
    width:100%;

    padding:14px;

    color:#fff;

    border-radius:12px;

    font-size:16px;

    outline:none;

    margin-top:8px;
}

.input:focus{
    border-color:#FFD600;
}


/* ============================================================
   BUTTONS
============================================================ */

.start-btn,
.complete-btn{

    width:100%;

    padding:15px;

    border:0;

    border-radius:14px;

    font-weight:bold;

    font-size:16px;

    cursor:pointer;
}

}

/* ============================================================
   EMPTY
============================================================ */

.empty{

/* ============================================================

.message{

.message.show{

.message.error{

}

.message.success{

/* ============================================================

.bottom{

<script type="module">

import {
    auth,
    db
} from "../firebase/firebase-config.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    doc,
    getDoc,
    updateDoc,
    collection,
    query,
    where,
    onSnapshot,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* ============================================================
   ELEMENTS
============================================================ */

const security =
    document.getElementById("security");

const securityText =
    document.getElementById("securityText");

const onlineBtn =
    document.getElementById("onlineBtn");

const statusPill =
    document.getElementById("statusPill");

const riderName =
    document.getElementById("riderName");

const rideRequests =
    document.getElementById("rideRequests");

const activeRide =
    document.getElementById("activeRide");

const earningAmount =
    document.getElementById("earningAmount");

const message =
    document.getElementById("message");

const logoutBtn =
    document.getElementById("logoutBtn");


let currentUser = null;

let riderData = null;

let isOnline = false;

let activeRideId = null;

let unsubscribeRides = null;


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
    text,
    type = "success"
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

    setTimeout(
        () => {

            message.className =
                "message";

        },
        4000
    );

}


/* ============================================================
   SECURITY REDIRECT
============================================================ */

function goLogin(){

    window.location.replace(
        "../auth/login.html?role=rider"
    );

}


/* ============================================================
   APPROVAL
============================================================ */

function isApproved(
    userData,
    riderData
){

    const statuses = [

        userData?.status,

        userData?.approvalStatus,

        userData?.riderStatus,

        userData?.verificationStatus,

        riderData?.status,

        riderData?.approvalStatus,

        riderData?.riderStatus,

        riderData?.verificationStatus

    ]
    .map(
        value =>
            String(
                value || ""
            )
            .trim()
            .toLowerCase()
    );


    return (

        userData?.approved === true ||

        userData?.isApproved === true ||

        userData?.adminApproved === true ||

        riderData?.approved === true ||

        riderData?.isApproved === true ||

        riderData?.adminApproved === true ||

        statuses.includes("approved") ||

        statuses.includes("active") ||

        statuses.includes("verified")

    );

}


/* ============================================================
   LOAD RIDER PROFILE
============================================================ */

async function loadRider(){

    const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );

    const userSnap =
        await getDoc(
            userRef
        );


    if(!userSnap.exists()){

        throw new Error(
            "Rider profile not found."
        );

    }


    const userData =
        userSnap.data();


    if(
        String(
            userData.role ||
            userData.userType ||
            userData.type ||
            ""
        )
        .trim()
        .toLowerCase()
        !== "rider"
    ){

        throw new Error(
            "This account is not a Rider account."
        );

    }


    const riderRef =
        doc(
            db,
            "riders",
            currentUser.uid
        );


    const riderSnap =
        await getDoc(
            riderRef
        );


    riderData =
        riderSnap.exists()
            ? riderSnap.data()
            : {};


    if(
        !isApproved(
            userData,
            riderData
        )
    ){

        window.location.replace(
            "./pending.html"
        );

        return false;

    }


    const name =
        userData.name ||
        userData.fullName ||
        userData.displayName ||
        riderData.name ||
        riderData.fullName ||
        "Rider";


    riderName.textContent =
        name;


    isOnline =
        riderData.isOnline === true ||
        riderData.online === true ||
        userData.isOnline === true ||
        userData.online === true;


    updateOnlineUI();


    return true;

}


/* ============================================================
   ONLINE UI
============================================================ */

function updateOnlineUI(){

    if(isOnline){

        onlineBtn.textContent =
            "🔴 Go Offline";

        onlineBtn.classList.add(
            "offline"
        );

        statusPill.textContent =
            "ONLINE";

        statusPill.classList.add(
            "online"
        );

    }else{

        onlineBtn.textContent =
            "🟢 Go Online";

        onlineBtn.classList.remove(
            "offline"
        );

        statusPill.textContent =
            "OFFLINE";

        statusPill.classList.remove(
            "online"
        );

    }

}


/* ============================================================
   TOGGLE ONLINE
============================================================ */

async function toggleOnline(){

    if(!currentUser){
        return;
    }


    const newStatus =
        !isOnline;


    onlineBtn.disabled =
        true;


    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                isOnline:newStatus,
                online:newStatus,
                updatedAt:
                    serverTimestamp()
            }
        );


        try{

            await updateDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                ),
                {
                    isOnline:newStatus,
                    online:newStatus,
                    updatedAt:
                        serverTimestamp()
                }
            );

        }catch(riderError){

            console.warn(
                "Rider online status update:",
                riderError
            );

        }


        isOnline =
            newStatus;


        updateOnlineUI();


        if(isOnline){

            listenForRides();

            showMessage(
                "You are now online and ready to receive rides."
            );

        }else{

            stopRideListener();

            rideRequests.innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-power-off"></i>
                    <br>
                    You are currently offline.
                </div>
            `;

            showMessage(
                "You are now offline."
            );

        }

    }catch(error){

        console.error(
            "Online status error:",
            error
        );


        showMessage(
            "Unable to change online status: " +
            error.message,
            "error"
        );

    }


    onlineBtn.disabled =
        false;

}


/* ============================================================
   LISTEN FOR RIDES
============================================================ */

function listenForRides(){

    stopRideListener();


    if(!isOnline){
        return;
    }


    rideRequests.innerHTML = `
        <div class="empty">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <br>
            Searching for ride requests...
        </div>
    `;


    const ridesRef =
        collection(
            db,
            "rides"
        );


    const ridesQuery =
        query(
            ridesRef,
            where(
                "status",
                "in",
                [
                    "REQUESTED",
                    "requested",
                    "PENDING",
                    "pending"
                ]
            )
        );


    unsubscribeRides =
        onSnapshot(
            ridesQuery,
            snapshot => {

                if(!isOnline){
                    return;
                }


                if(
                    snapshot.empty
                ){

                    rideRequests.innerHTML = `
                        <div class="empty">
                            <i class="fa-solid fa-car-side"></i>
                            <br>
                            No ride requests right now.
                        </div>
                    `;

                    return;

                }


                rideRequests.innerHTML =
                    "";


                snapshot.forEach(
                    rideDoc => {

                        const ride =
                            rideDoc.data();

                        const id =
                            rideDoc.id;


                        const service =
                            String(
                                ride.serviceType ||
                                ride.service ||
                                "Ride"
                            )
                            .toUpperCase();


                        const pickup =
                            ride.pickupLocation ||
                            ride.pickupAddress ||
                            ride.pickup ||
                            "Pickup not provided";


                        const drop =
                            ride.dropoffLocation ||
                            ride.dropoffAddress ||
                            ride.drop ||
                            ride.destination ||
                            "Drop not provided";


                        const fare =
                            Number(
                                ride.fare ||
                                ride.amount ||
                                ride.totalFare ||
                                0
                            );


                        const payment =
                            ride.paymentMethod ||
                            ride.payment ||
                            "Cash";


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "ride-request";


                        card.innerHTML = `

                            <div class="ride-service">
                                <i class="fa-solid fa-motorcycle"></i>
                                ${escapeHtml(service)} RIDE
                            </div>

                            <div class="ride-info">

                                <b>Pickup:</b>
                                ${escapeHtml(pickup)}

                                <br>

                                <b>Drop:</b>
                                ${escapeHtml(drop)}

                                <br>

                                <b>Payment:</b>
                                ${escapeHtml(payment)}

                            </div>

                            <div class="ride-fare">
                                ₹${fare.toLocaleString("en-IN")}
                            </div>

                            <div class="ride-actions">

                                <button
                                    class="accept"
                                    data-ride-id="${id}"
                                >
                                    Accept
                                </button>

                                <button
                                    class="reject"
                                    data-reject-id="${id}"
                                >
                                    Reject
                                </button>

                            </div>
                        `;


                        rideRequests.appendChild(
                            card
                        );

                    }
                );

            },
            error => {

                console.error(
                    "Ride listener error:",
                    error
                );


                rideRequests.innerHTML = `
                    <div class="empty">
                        Unable to load ride requests.
                        <br><br>
                        Please check Firestore Rules.
                    </div>
                `;

            }
        );

}


/* ============================================================
   STOP LISTENER
============================================================ */

function stopRideListener(){

    if(
        typeof unsubscribeRides ===
        "function"
    ){

        unsubscribeRides();

        unsubscribeRides =
            null;

    }

}


/* ============================================================
   ACCEPT RIDE
============================================================ */

async function acceptRide(
    rideId
){

    if(!currentUser){
        return;
    }


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        await runTransaction(
            db,
            async transaction => {

                const snap =
                    await transaction.get(
                        rideRef
                    );


                if(
                    !snap.exists()
                ){

                    throw new Error(
                        "Ride no longer exists."
                    );

                }


                const ride =
                    snap.data();


                const status =
                    String(
                        ride.status || ""
                    )
                    .trim()
                    .toLowerCase();


                if(
                    ![
                        "requested",
                        "pending"
                    ].includes(status)
                ){

                    throw new Error(
                        "This ride has already been accepted by another rider."
                    );

                }


                transaction.update(
                    rideRef,
                    {

                        status:"ACCEPTED",

                        rideStatus:"accepted",

                        riderId:
                            currentUser.uid,

                        riderUid:
                            currentUser.uid,

                        acceptedAt:
                            serverTimestamp()

                    }
                );

            }
        );


        activeRideId =
            rideId;


        stopRideListener();


        renderActiveRide(
            rideId
        );


        showMessage(
            "Ride accepted successfully."
        );


    }catch(error){

        console.error(
            "Accept ride error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to accept ride.",
            "error"
        );

    }

}


/* ============================================================
   REJECT RIDE
============================================================ */

async function rejectRide(
    rideId
){

    const card =
        document.querySelector(
            `[data-reject-id="${rideId}"]`
        )?.closest(
            ".ride-request"
        );


    if(card){

        card.remove();

    }

    showMessage(
        "Ride request rejected."
    );

}


/* ============================================================
   ACTIVE RIDE
============================================================ */

function renderActiveRide(
    rideId
){

    activeRide.innerHTML = `

        <div class="active-box">

            <div class="active-title">

                <i class="fa-solid fa-route"></i>

                Ride Accepted

            </div>

            <p>
                Ride ID:
                <b>${escapeHtml(rideId)}</b>
            </p>

            <p>
                Enter the customer's OTP to start the ride.
            </p>

            <input
                id="otpInput"
                class="input"
                maxlength="6"
                inputmode="numeric"
                placeholder="Enter customer OTP"
            >

            <button
                id="startRideBtn"
                class="start-btn"
            >
                Start Ride
            </button>

            <button
                id="completeRideBtn"
                class="complete-btn"
                style="display:none"
            >
                Complete Ride
            </button>

        </div>

    `;


    document
        .getElementById(
            "startRideBtn"
        )
        .addEventListener(
            "click",
            () =>
                startRide(
                    rideId
                )
        );


    document
        .getElementById(
            "completeRideBtn"
        )
        .addEventListener(
            "click",
            () =>
                completeRide(
                    rideId
                )
        );

}


/* ============================================================
   START RIDE
============================================================ */

async function startRide(
    rideId
){

    const input =
        document.getElementById(
            "otpInput"
        );


    const otp =
        input?.value.trim();


    if(!otp){

        showMessage(
            "Please enter customer OTP.",
            "error"
        );

        return;

    }


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const snap =
            await getDoc(
                rideRef
            );


        if(!snap.exists()){

            throw new Error(
                "Ride not found."
            );

        }


        const ride =
            snap.data();


        const rideOtp =
            String(
                ride.otp ||
                ride.customerOtp ||
                ride.rideOtp ||
                ""
            )
            .trim();


        /*
         * If OTP exists in ride document,
         * verify it.
         */

        if(
            rideOtp &&
            rideOtp !== otp
        ){

            showMessage(
                "Incorrect OTP.",
                "error"
            );

            return;

        }


        await updateDoc(
            rideRef,
            {

                status:"STARTED",

                rideStatus:"started",

                startedAt:
                    serverTimestamp()

            }
        );


        const startButton =
            document.getElementById(
                "startRideBtn"
            );

        const otpInput =
            document.getElementById(
                "otpInput"
            );

        const completeButton =
            document.getElementById(
                "completeRideBtn"
            );


        if(startButton){
            startButton.style.display =
                "none";
        }


        if(otpInput){
            otpInput.style.display =
                "none";
        }


        if(completeButton){
            completeButton.style.display =
                "block";
        }


        showMessage(
            "Ride started successfully."
        );


    }catch(error){

        console.error(
            "Start ride error:",
            error
        );


        showMessage(
            "Unable to start ride: " +
            error.message,
            "error"
        );

    }

}


/* ============================================================
   COMPLETE RIDE
============================================================ */

async function completeRide(
    rideId
){

    try{

        await updateDoc(
            doc(
                db,
                "rides",
                rideId
            ),
            {

                status:"COMPLETED",

                rideStatus:"completed",

                completedAt:
                    serverTimestamp()

            }
        );


        activeRideId =
            null;


        activeRide.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-circle-check"></i>

                <br>

                Ride completed successfully.

            </div>

        `;


        if(isOnline){

            listenForRides();

        }


        showMessage(
            "Ride completed successfully."
        );


        loadTodayEarning();


    }catch(error){

        console.error(
            "Complete ride error:",
            error
        );


        showMessage(
            "Unable to complete ride: " +
            error.message,
            "error"
        );

    }

}


/* ============================================================
   TODAY EARNING
============================================================ */

async function loadTodayEarning(){

    /*
     * Keep the dashboard lightweight.
     * The main earning value can be updated from rider profile
     * when available.
     */

    try{

        const riderSnap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                )
            );


        if(
            riderSnap.exists()
        ){

            const data =
                riderSnap.data();


            const earning =
                Number(
                    data.todayEarning ||
                    data.dailyEarning ||
                    data.earningsToday ||
                    0
                );


            earningAmount.textContent =
                "₹" +
                earning.toLocaleString(
                    "en-IN"
                );

        }

    }catch(error){

        console.warn(
            "Earning load:",
            error
        );

    }

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char])
    );

}


/* ============================================================
   RIDE BUTTON EVENTS
============================================================ */

rideRequests.addEventListener(
    "click",
    event => {

        const accept =
            event.target.closest(
                "[data-ride-id]"
            );


        if(accept){

            acceptRide(
                accept.dataset.rideId
            );

            return;

        }


        const reject =
            event.target.closest(
                "[data-reject-id]"
            );


        if(reject){

            rejectRide(
                reject.dataset.rejectId
            );

        }

    }
);


/* ============================================================
   ONLINE BUTTON
============================================================ */

onlineBtn.addEventListener(
    "click",
    toggleOnline
);


/* ============================================================
   LOGOUT
============================================================ */

logoutBtn.addEventListener(
    "click",
    async () => {

        const confirmed =
            confirm(
                "Logout from RiderX?"
            );


        if(!confirmed){
            return;
        }


        try{

            if(currentUser){

                try{

                    await updateDoc(
                        doc(
                            db,
                            "users",
                            currentUser.uid
                        ),
                        {
                            isOnline:false,
                            online:false
                        }
                    );

                }catch{}

            }


            stopRideListener();


            await signOut(
                auth
            );


            goLogin();

        }catch(error){

            console.error(
                "Logout error:",
                error
            );

        }

    }
);


/* ============================================================
   AUTH STATE
============================================================ */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            securityText.textContent =
                "Login required. Redirecting...";

            setTimeout(
                goLogin,
                500
            );

            return;

        }


        currentUser =
            user;


        try{

            securityText.textContent =
                "Verifying rider approval...";


            const verified =
                await loadRider();


            if(!verified){
                return;
            }


            securityText.textContent =
                "Rider verified.";


            security.classList.add(
                "hidden"
            );


            await loadTodayEarning();


            if(isOnline){

                listenForRides();

            }

        }catch(error){

            console.error(
                "Rider home verification:",
                error
            );


            securityText.textContent =
                "Unable to verify rider account.";


            setTimeout(
                async () => {

                    try{
                        await signOut(auth);
                    }catch{}

                    goLogin();

                },
                1200
            );

        }

    }
);


/* ============================================================
   PAGE CACHE PROTECTION
============================================================ */

window.addEventListener(
    "pageshow",
    event => {

        if(event.persisted){

            window.location.reload();

        }

    }
);

</script>
