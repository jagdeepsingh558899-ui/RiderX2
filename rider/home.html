<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><title>RiderX | Rider Home</title><link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"><style>
:root{
    --yellow:#FFD600;
    --yellow2:#ffe500;
    --black:#050505;
    --dark:#0b0b0b;
    --card:#151515;
    --card2:#1c1c1c;
    --border:#2d2d2d;
    --muted:#888;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;
    --white:#fff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Poppins,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:fixed;
    inset:0;
    z-index:1;
    background:#ddd;
}

.leaflet-control-zoom{
    margin-top:145px!important;
    margin-right:10px!important;
}

.leaflet-control-zoom a{
    background:#111!important;
    color:var(--yellow)!important;
    border-color:#333!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:fixed;
    left:0;
    right:0;
    top:0;
    z-index:1500;
    padding:
        max(10px,env(safe-area-inset-top))
        12px
        0;
    pointer-events:none;
}

.toprow{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    background:rgba(8,8,8,.95);
    border:1px solid #333;
    border-radius:15px;
    padding:8px 16px;
    font-size:19px;
    font-weight:900;
    letter-spacing:-.8px;
    box-shadow:0 8px 28px rgba(0,0,0,.45);
    backdrop-filter:blur(12px);
}

.logo span{
    color:var(--yellow);
}

.top-actions{
    display:flex;
    gap:8px;
}

.top-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid #333;
    background:rgba(8,8,8,.95);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:auto;
    box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.top-btn:active{
    transform:scale(.92);
}

.notification-wrap{
    position:relative;
}

.notification-dot{
    position:absolute;
    right:3px;
    top:2px;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--red);
    border:2px solid #080808;
    display:none;
}

/* =========================================================
   ONLINE CONTROL
========================================================= */

.online-control{
    position:fixed;
    left:12px;
    right:12px;
    top:calc(max(10px,env(safe-area-inset-top)) + 58px);
    z-index:1400;

    max-width:500px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    padding:10px 12px;

    background:rgba(7,7,7,.96);
    border:1px solid #333;
    border-radius:18px;

    box-shadow:0 9px 30px rgba(0,0,0,.45);
    backdrop-filter:blur(14px);
}

.online-info{
    display:flex;
    align-items:center;
    gap:9px;
}

.online-dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#666;
    flex-shrink:0;
}

.online-dot.online{
    background:var(--green);
    box-shadow:0 0 14px rgba(34,197,94,.9);
}

.online-title{
    font-size:12px;
    font-weight:900;
}

.online-sub{
    margin-top:1px;
    color:#777;
    font-size:8px;
}

.online-btn{
    border:0;
    border-radius:11px;
    padding:9px 13px;
    background:var(--yellow);
    color:#000;
    font-size:9px;
    font-weight:900;
}

.online-btn.offline{
    background:var(--red);
    color:#fff;
}

/* =========================================================
   LOCATION
========================================================= */

.location-btn{
    position:fixed;
    right:13px;
    bottom:calc(28vh + 82px);
    z-index:1300;

    width:47px;
    height:47px;

    border:1px solid #444;
    border-radius:50%;

    background:#111;
    color:var(--yellow);

    box-shadow:0 8px 25px rgba(0,0,0,.5);
}

.location-btn:active{
    transform:scale(.92);
}

/* =========================================================
   NAVIGATION BANNER
========================================================= */

.navigation-banner{
    position:fixed;
    left:12px;
    right:12px;
    top:calc(max(10px,env(safe-area-inset-top)) + 115px);
    z-index:1350;

    display:none;

    padding:11px 13px;

    background:rgba(7,7,7,.97);
    border:1px solid var(--yellow);
    border-radius:17px;

    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.navigation-banner.show{
    display:block;
}

.nav-title{
    color:var(--yellow);
    font-size:9px;
    font-weight:900;
}

.nav-distance{
    margin-top:1px;
    font-size:20px;
    font-weight:900;
}

.nav-sub{
    color:#888;
    font-size:8px;
}

/* =========================================================
   BOTTOM SHEET
========================================================= */

.sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:68px;
    z-index:1200;

    max-height:43vh;
    overflow-y:auto;

    padding:8px 13px 15px;

    background:rgba(7,7,7,.98);
    border-top:1px solid #292929;
    border-radius:24px 24px 0 0;

    box-shadow:0 -13px 38px rgba(0,0,0,.55);

    -webkit-overflow-scrolling:touch;
}

.handle{
    width:43px;
    height:4px;
    margin:0 auto 10px;
    border-radius:20px;
    background:#444;
}

/* =========================================================
   SHEET HEADER
========================================================= */

.sheet-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:9px;
}

.sheet-title{
    font-size:16px;
    font-weight:900;
}

.request-count{
    color:#777;
    font-size:8px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    padding:20px 14px;
    text-align:center;

    background:#111;
    border:1px solid #252525;
    border-radius:17px;

    color:#777;
    font-size:10px;
}

.empty i{
    display:block;
    margin-bottom:8px;
    color:var(--yellow);
    font-size:25px;
}

/* =========================================================
   REQUEST CARD
========================================================= */

.request-card{
    margin-bottom:9px;
    padding:12px;

    background:#131313;
    border:1px solid #393939;
    border-radius:18px;
}

.request-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
}

.badge{
    padding:4px 8px;
    border-radius:8px;
    background:var(--yellow);
    color:#000;
    font-size:7px;
    font-weight:900;
}

.new-badge{
    color:var(--green);
    font-size:8px;
    font-weight:900;
}

.customer-name{
    margin-bottom:8px;
    font-size:14px;
    font-weight:800;
}

.route{
    padding:9px;
    background:#080808;
    border:1px solid #222;
    border-radius:13px;
}

.route-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
}

.route-row + .route-row{
    margin-top:8px;
}

.route-icon{
    width:23px;
    height:23px;
    min-width:23px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:8px;
}

.pick-icon{
    background:#12351f;
    color:var(--green);
}

.drop-icon{
    background:#3a3200;
    color:var(--yellow);
}

.route-label{
    color:#666;
    font-size:7px;
    text-transform:uppercase;
}

.route-address{
    color:#eee;
    font-size:9px;
    line-height:1.35;
    word-break:break-word;
}

.request-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:8px;
}

.request-info-box{
    padding:7px;
    text-align:center;

    background:#0a0a0a;
    border:1px solid #222;
    border-radius:9px;
}

.request-info-box small{
    display:block;
    color:#666;
    font-size:6px;
    margin-bottom:2px;
}

.request-info-box strong{
    font-size:9px;
}

.earning-box{
    margin-top:8px;
    padding:9px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#1c1800;
    border:1px solid #4c4300;
    border-radius:13px;
}

.earning-label{
    color:#aaa;
    font-size:8px;
}

.earning{
    color:var(--yellow);
    font-size:21px;
    font-weight:900;
}

.request-actions{
    display:grid;
    grid-template-columns:1fr 2fr;
    gap:7px;
    margin-top:8px;
}

.reject-btn,
.accept{
    border-radius:11px;
    padding:11px 6px;
    font-size:10px;
    font-weight:900;
}

.reject-btn{
    border:1px solid #552222;
    background:#291010;
    color:#ff6666;
}

.accept{
    border:0;
    background:var(--yellow);
    color:#000;
}

/* =========================================================
   ACTIVE RIDE
========================================================= */

.active-card{
    padding:12px;
    background:#111;
    border:1px solid var(--green);
    border-radius:18px;
}

.active-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:9px;
}

.active-title{
    color:var(--green);
    font-size:13px;
    font-weight:900;
}

.active-status{
    padding:4px 8px;
    border-radius:8px;
    background:#12351f;
    color:var(--green);
    font-size:7px;
    font-weight:900;
}

.customer-box{
    display:flex;
    align-items:center;
    gap:10px;

    margin-bottom:8px;
    padding:9px;

    background:#0b0b0b;
    border:1px solid #222;
    border-radius:13px;
}

.customer-avatar{
    width:40px;
    height:40px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#222;
    color:var(--yellow);
}

.customer-info{
    flex:1;
    min-width:0;
}

.customer-info strong{
    display:block;
    font-size:11px;
}

.customer-info small{
    color:#777;
    font-size:7px;
}

.contact-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:8px;
}

.contact-btn{
    padding:10px;
    border-radius:11px;
    font-size:9px;
    font-weight:900;
}

.call-btn{
    border:1px solid #244f34;
    background:#12351f;
    color:var(--green);
}

.chat-btn{
    border:1px solid #4c4300;
    background:#181800;
    color:var(--yellow);
}

.active-route{
    padding:9px;
    background:#080808;
    border:1px solid #222;
    border-radius:13px;
}

.active-fare{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:8px;
    padding:9px;

    background:#1c1800;
    border:1px solid #4c4300;
    border-radius:13px;
}

.active-fare strong{
    color:var(--yellow);
    font-size:21px;
}

.active-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:8px;
}

.action-btn{
    border:0;
    border-radius:11px;
    padding:11px 6px;
    font-size:9px;
    font-weight:900;
}

.nav-btn{
    background:#222;
    border:1px solid #444;
    color:#fff;
}

.start-btn,
.complete-btn{
    background:var(--green);
    color:#000;
}

.complete-btn{
    grid-column:1/-1;
}

.cancel-btn{
    background:#291010;
    border:1px solid #552222;
    color:#ff6666;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:2000;

    height:68px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    background:rgba(8,8,8,.99);
    border-top:1px solid #292929;

    box-shadow:0 -8px 25px rgba(0,0,0,.5);
}

.nav-item{
    border:0;
    background:transparent;
    color:#777;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;

    font-size:8px;
    font-weight:700;
}

.nav-item i{
    font-size:18px;
}

.nav-item.active{
    color:var(--yellow);
}

.nav-item:active{
    transform:scale(.94);
}

/* =========================================================
   CHAT
========================================================= */

.chat-overlay{
    position:fixed;
    inset:0;
    z-index:5000;

    display:none;
    align-items:flex-end;

    background:rgba(0,0,0,.74);
}

.chat-overlay.show{
    display:flex;
}

.chat-box{
    width:100%;
    height:82vh;

    display:flex;
    flex-direction:column;

    background:#0b0b0b;
    border-top:1px solid #333;
    border-radius:24px 24px 0 0;
}

.chat-header{
    display:flex;
    align-items:center;
    gap:10px;

    padding:12px 14px;
    border-bottom:1px solid #292929;
}

.chat-back{
    width:37px;
    height:37px;
    border-radius:50%;
    border:1px solid #333;
    background:#151515;
    color:#fff;
}

.chat-person{
    flex:1;
}

.chat-person strong{
    display:block;
    font-size:12px;
}

.chat-person small{
    color:#777;
    font-size:7px;
}

.chat-call{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#12351f;
    color:var(--green);
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:13px;
}

.chat-empty{
    padding-top:30px;
    text-align:center;
    color:#666;
    font-size:10px;
}

.message{
    max-width:78%;
    margin-bottom:8px;
    padding:8px 10px;

    border-radius:13px;

    font-size:10px;
    line-height:1.4;
    word-break:break-word;
}

.message.mine{
    margin-left:auto;
    background:#3a3200;
    border-bottom-right-radius:4px;
}

.message.theirs{
    margin-right:auto;
    background:#1b1b1b;
    border-bottom-left-radius:4px;
}

.message-time{
    display:block;
    margin-top:3px;
    color:#777;
    font-size:6px;
}

.chat-input-row{
    display:flex;
    gap:7px;

    padding:9px;
    border-top:1px solid #292929;
}

.chat-input{
    flex:1;
    min-width:0;

    padding:10px;

    border:1px solid #333;
    border-radius:13px;
    outline:none;

    background:#151515;
    color:#fff;

    font-size:10px;
}

.chat-send{
    width:43px;
    border:0;
    border-radius:13px;
    background:var(--yellow);
    color:#000;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    z-index:7000;

    max-width:90%;

    padding:9px 14px;

    border:1px solid #444;
    border-radius:12px;

    background:#222;

    font-size:10px;
    text-align:center;

    opacity:0;
    pointer-events:none;

    transform:translate(-50%,20px);
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.success{
    border-color:var(--green);
}

.toast.error{
    border-color:var(--red);
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;
    inset:0;
    z-index:8000;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.68);
}

.loading.show{
    display:flex;
}

.loading-box{
    padding:24px 32px;
    text-align:center;

    background:#111;
    border:1px solid #333;
    border-radius:18px;
}

.loading-box i{
    margin-bottom:9px;
    color:var(--yellow);
    font-size:24px;
}

.loading-box p{
    color:#aaa;
    font-size:10px;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .sheet{
        left:50%;
        right:auto;
        width:450px;
        transform:translateX(-50%);
    }

    .bottom-nav{
        left:50%;
        right:auto;
        width:450px;
        transform:translateX(-50%);
        border-radius:20px 20px 0 0;
    }

    .online-control{
        max-width:450px;
    }

    .chat-box{
        width:450px;
        margin:auto;
    }
}

function updateRiderMarker(
    lat,
    lng,
    accuracy=0
){

    riderLocation = {
        lat:Number(lat),
        lng:Number(lng)
    };

    const icon =
        L.divIcon({
            className:"",
            html:`
                <div style="
                    width:46px;
                    height:46px;
                    border-radius:50%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#FFD600;
                    color:#000;
                    border:4px solid #fff;
                    box-shadow:0 5px 18px rgba(0,0,0,.45);
                    font-size:20px;
                ">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
            `,
            iconSize:[46,46],
            iconAnchor:[23,23]
        });

    if(!riderMarker){

        riderMarker =
            L.marker(
                [lat,lng],
                {
                    icon,
                    zIndexOffset:1000
                }
            ).addTo(map);

    }else{

        riderMarker.setLatLng(
            [lat,lng]
        );

    }


    if(accuracy){

        if(!accuracyCircle){

            accuracyCircle =
                L.circle(
                    [lat,lng],
                    {
                        radius:accuracy,
                        color:"#FFD600",
                        fillColor:"#FFD600",
                        fillOpacity:.08,
                        weight:1
                    }
                ).addTo(map);

        }else{

            accuracyCircle.setLatLng(
                [lat,lng]
            );

            accuracyCircle.setRadius(
                accuracy
            );

        }

    }

}


/* =========================================================
   GPS
========================================================= */

function startLocationWatch(){

    if(!navigator.geolocation){

        showToast(
            "GPS is not available.",
            "error"
        );

        return;

    }


    if(locationWatchId !== null){

        navigator.geolocation.clearWatch(
            locationWatchId
        );

    }


    locationWatchId =
        navigator.geolocation.watchPosition(

            async position => {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;

                updateRiderMarker(
                    lat,
                    lng,
                    position.coords.accuracy
                );


                if(
                    isOnline &&
                    currentUser
                ){

                    await updateRiderLocation(
                        lat,
                        lng
                    );

                }


                if(
                    navigationTarget
                ){

                    updateNavigationDistance();

                }

            },

            error => {

                console.warn(
                    "GPS:",
                    error
                );

                if(error.code === 1){

                    showToast(
                        "Please allow location permission.",
                        "error"
                    );

                }

            },

            {
                enableHighAccuracy:true,
                maximumAge:3000,
                timeout:15000
            }

        );

}


function stopLocationWatch(){

    if(locationWatchId !== null){

        navigator.geolocation.clearWatch(
            locationWatchId
        );

        locationWatchId = null;

    }

}

/* =========================================================
   REQUEST LISTENER
========================================================= */

function listenForRequests(){

    stopRequestListener();

    if(!currentUser){
        return;
    }


    const ridesQuery =
        query(
            collection(db,"rides"),
            where(
                "status",
                "==",
                "searching"
            )
        );


    requestListener =
        onSnapshot(
            ridesQuery,

            snapshot => {

                const rides = [];


                snapshot.forEach(
                    snap => {

                        const ride =
                            snap.data();


                        if(
                            ride.riderId &&
                            ride.riderId !==
                            currentUser.uid
                        ){

                            return;

                        }


                        if(
                            rejectedRideIds.has(
                                snap.id
                            )
                        ){

                            return;

                        }


                        rides.push({
                            ...ride,
                            id:snap.id
                        });

                    }
                );


                rides.sort(
                    (a,b) => {

                        const aTime =
                            a.createdAt?.seconds ||
                            0;

                        const bTime =
                            b.createdAt?.seconds ||
                            0;

                        return bTime-aTime;

                    }
                );


                renderRequests(
                    rides
                );

            },

            error => {

                console.error(
                    "Ride request listener:",
                    error
                );

                showToast(
                    "Ride requests unavailable.",
                    "error"
                );

            }

        );

}


function stopRequestListener(){

    if(
        requestListener
    ){

        requestListener();

        requestListener = null;

    }

}


function showOfflineState(){

    requestCount.textContent =

/* =========================================================

========================================================= */

function renderRequests(

){

    }


    requestCount.textContent =
        `${rides.length} request${rides.length === 1 ? "" : "s"}`;


    requestsContainer.innerHTML =
        rides.map(
            ride => renderRequestCard(
                ride
            )
        ).join("");


    rides.forEach(
        ride => {

            document
                .getElementById(
                    `accept-${ride.id}`
                )
                ?.addEventListener(
                    "click",
                    () => acceptRide(
                        ride.id
                    )
                );


            document
                .getElementById(
                    `reject-${ride.id}`
                )
                ?.addEventListener(
                    "click",
                    () => rejectRide(
                        ride.id
                    )
                );

        }
    );

}

function rejectRide(
    rideId
){

        rideId

/* =========================================================
   ACCEPT RIDE
========================================================= */

async function acceptRide(
    rideId
){

    if(
        !currentUser ||
        !rideId
    ){
        return;
    }


    showLoading(
        "Accepting ride..."
    );


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        let acceptedRide = null;


        await runTransaction(
            db,
            async transaction => {

                const snap =
                    await transaction.get(
                        rideRef
                    );


                if(!snap.exists()){

                    throw new Error(
                        "RIDE_NOT_FOUND"
                    );

                }


                const ride =
                    snap.data();


                const status =
                    String(
                        ride.status || ""
                    ).toLowerCase();


                if(
                    status !== "searching"
                ){

                    throw new Error(
                        "RIDE_ALREADY_TAKEN"
                    );

                }


                if(
                    ride.riderId &&
                    ride.riderId !==
                    currentUser.uid
                ){

                    throw new Error(
                        "RIDE_ALREADY_ASSIGNED"
                    );

                }


                const riderName =
                    userData?.name ||
                    userData?.fullName ||
                    riderData?.name ||
                    currentUser.displayName ||
                    "Rider";


                const riderPhone =
                    userData?.phone ||
                    riderData?.phone ||
                    currentUser.phoneNumber ||
                    "";


                transaction.update(
                    rideRef,
                    {

                        status:"ACCEPTED",

                        riderId:
                            currentUser.uid,

                        riderName,

                        riderPhone,

                        acceptedAt:
                            serverTimestamp()

                    }
                );


                acceptedRide = {
                    ...ride,
                    id:rideId,
                    status:"ACCEPTED",
                    riderId:
                        currentUser.uid,
                    riderName,
                    riderPhone
                };

            }
        );


        activeRideId =
            rideId;

        activeRide =
            acceptedRide;


        stopRequestListener();

        clearRequestMarkers();

        hideLoading();

        showToast(
            "Ride accepted!",
            "success"
        );


        showActiveRide();

        listenActiveRide();

        startNavigation(
            "pickup"
        );


    }catch(error){

        hideLoading();

        console.error(
            "Accept ride:",
            error
        );


        if(
            error.message ===
            "RIDE_ALREADY_TAKEN"
        ){

            showToast(
                "Another rider accepted this ride.",
                "error"
            );

        }else if(
            error.message ===
            "RIDE_NOT_FOUND"
        ){

            showToast(
                "Ride no longer exists.",
                "error"
            );

        }else{

            showToast(
                "Unable to accept ride.",
                "error"
            );

        }

    }

}


/* =========================================================
   ACTIVE RIDE LISTENER
========================================================= */

function listenActiveRide(){

    if(
        activeRideListener
    ){

        activeRideListener();

        activeRideListener =
            null;

    }


    if(!activeRideId){
        return;
    }


    activeRideListener =
        onSnapshot(

            doc(
                db,
                "rides",
                activeRideId
            ),

            snapshot => {

                if(!snapshot.exists()){

                    activeRide = null;

                    activeRideId = null;

                    showRequests();

                    return;

                }


                activeRide = {
                    ...snapshot.data(),
                    id:snapshot.id
                };


                showActiveRide();

            },

            error => {

                console.error(
                    "Active ride:",
                    error
                );

            }

        );

}

========================================================= */

function showRequests(){

    requestsArea.style.display =
        "block";

    activeArea.style.display =
        "none";

}


/* =========================================================
   START RIDE
========================================================= */

async function startRide(){

    if(
        !activeRideId ||
        !currentUser
    ){
        return;
    }


    showLoading(
        "Starting ride..."
    );


    try{

        await updateDoc(
            doc(
                db,
                "rides",
                activeRideId
            ),
            {
                status:"STARTED",
                startedAt:
                    serverTimestamp()
            }
        );


        hideLoading();

        showToast(
            "Ride started.",
            "success"
        );


        startNavigation(
            "drop"
        );

    }catch(error){

        hideLoading();

        console.error(error);

        showToast(
            "Unable to start ride.",
            "error"
        );

    }

}


/* =========================================================
   COMPLETE RIDE
========================================================= */

async function completeRide(){

    if(
        !activeRideId ||
        !currentUser
    ){
        return;
    }


    const confirmed =
        window.confirm(
            "Complete this ride?"
        );


    if(!confirmed){
        return;
    }


    showLoading(
        "Completing ride..."
    );


    try{

        await updateDoc(
            doc(
                db,
                "rides",
                activeRideId
            ),
            {
                status:"COMPLETED",
                completedAt:
                    serverTimestamp()
            }
        );


        stopNavigation();

        activeRideId = null;

        activeRide = null;


        if(activeRideListener){

            activeRideListener();

            activeRideListener =
                null;

        }


        hideLoading();

        showRequests();

        showToast(
            "Ride completed successfully.",
            "success"
        );


        if(isOnline){

            listenForRequests();

        }

    }catch(error){

        hideLoading();

        console.error(error);

        showToast(
            "Unable to complete ride.",
            "error"
        );

    }

}

function getCustomerPhone(){

    return (
        activeRide?.customerPhone ||
        activeRide?.userPhone ||

    );

}


function callCustomer(){

    const phone =
        getCustomerPhone();

/* =========================================================
   CHAT
========================================================= */

function openChat(){

    if(!activeRideId){

        showToast(
            "No active ride.",
            "error"
        );

        return;

    }


    const customer =
        activeRide?.customerName ||
        activeRide?.userName ||
        "Customer";


    chatCustomerName.textContent =
        customer;


    chatOverlay.classList.add(
        "show"
    );


    listenChat();

}


function closeChat(){

    chatOverlay.classList.remove(
        "show"
    );


    if(chatListener){

        chatListener();

        chatListener =
            null;

    }

}


chatBack.addEventListener(
    "click",
    closeChat
);


chatCall.addEventListener(
    "click",
    callCustomer
);


chatSend.addEventListener(
    "click",
    sendMessage
);


chatInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


function listenChat(){

    if(chatListener){

        chatListener();

        chatListener =
            null;

    }


    if(!activeRideId){
        return;
    }


    const messagesQuery =
        query(
            collection(
                db,
                "rides",
                activeRideId,
                "messages"
            ),
            orderBy(
                "createdAt",
                "asc"
            )
        );


    chatListener =
        onSnapshot(
            messagesQuery,

            snapshot => {

                if(snapshot.empty){

                    chatMessages.innerHTML = `
                        <div class="chat-empty">
                            Start conversation with customer.
                        </div>
                    `;

                    return;

                }


                chatMessages.innerHTML =
                    snapshot.docs
                        .map(
                            snap => {

                                const message =
                                    snap.data();


                                const mine =
                                    message.senderId ===
                                    currentUser?.uid;


                                const time =
                                    message.createdAt
                                        ?.toDate
                                        ?.()
                                        ?.toLocaleTimeString(
                                            [],
                                            {
                                                hour:"2-digit",
                                                minute:"2-digit"
                                            }
                                        ) || "";


                                return `

                                    <div class="
                                        message
                                        ${mine ? "mine" : "theirs"}
                                    ">

                                        ${escapeHtml(
                                            message.text
                                        )}

                                        <span class="message-time">
                                            ${escapeHtml(time)}
                                        </span>

                                    </div>

                                `;

                            }
                        )
                        .join("");


                chatMessages.scrollTop =
                    chatMessages.scrollHeight;

            },

            error => {

                console.error(
                    "Chat listener:",
                    error
                );

            }

        );

}


async function sendMessage(){

    const text =
        chatInput.value.trim();


    if(
        !text ||
        !activeRideId ||
        !currentUser
    ){
        return;
    }


    chatInput.value = "";


    try{

        await addDoc(
            collection(
                db,
                "rides",
                activeRideId,
                "messages"
            ),
            {

                text,

                senderId:
                    currentUser.uid,

                senderRole:
                    "rider",

                senderName:
                    userData?.name ||
                    riderData?.name ||
                    "Rider",

                createdAt:
                    serverTimestamp()

            }
        );

    }catch(error){

        console.error(
            "Send message:",
            error
        );

        chatInput.value =
            text;

        showToast(
            "Message could not be sent.",
            "error"
        );

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

async function startNavigation(
    type
){

    if(
        !activeRide ||
        !riderLocation
    ){

        if(!riderLocation){

            requestLocationOnce();

        }

        showToast(
            "Waiting for your location.",
            "error"
        );

        return;

    }


    const source =
        type === "pickup"
            ? (
                activeRide.pickup ||
                activeRide.pickupLocation
              )
            : (
                activeRide.dropoff ||
                activeRide.dropoffLocation ||
                activeRide.destination
              );


    const target =
        getLocation(
            source
        );


    if(
        target.lat === null ||
        target.lng === null
    ){

        showToast(
            "Destination coordinates unavailable.",
            "error"
        );

        return;

    }


    navigationTarget = {
        lat:Number(target.lat),
        lng:Number(target.lng)
    };


    navigationTitle.textContent =
        type === "pickup"
            ? "GO TO PICKUP"
            : "GO TO DROP";


    navigationSub.textContent =
        target.text ||
        "Destination";


    navigationBanner.classList.add(
        "show"
    );


    if(targetMarker){

        map.removeLayer(
            targetMarker
        );

    }


    targetMarker =
        L.marker(
            [
                navigationTarget.lat,
                navigationTarget.lng
            ],
            {
                icon:
                    L.divIcon({
                        className:"",
                        html:`
                            <div style="
                                width:40px;
                                height:40px;
                                border-radius:50%;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                background:#000;
                                color:#FFD600;
                                border:3px solid #FFD600;
                                box-shadow:0 5px 18px rgba(0,0,0,.4);
                                font-size:16px;
                            ">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                        `,
                        iconSize:[40,40],
                        iconAnchor:[20,20]
                    }),
                zIndexOffset:900
            }
        )
        .addTo(map);


    await drawRoute();


    updateNavigationDistance();

}


/* =========================================================
   ROUTE
========================================================= */

async function drawRoute(){

    if(
        !riderLocation ||
        !navigationTarget ||
        !map
    ){
        return;
    }


    if(navigationLine){

        map.removeLayer(
            navigationLine
        );

        navigationLine =
            null;

    }


    try{

        const url =
            `https://router.project-osrm.org/route/v1/driving/` +
            `${riderLocation.lng},${riderLocation.lat};` +
            `${navigationTarget.lng},${navigationTarget.lat}` +
            `?overview=full&geometries=geojson`;


        const response =
            await fetch(url);


        if(!response.ok){
            throw new Error(
                "Routing failed"
            );
        }


        const data =
            await response.json();


        const route =
            data.routes?.[0];


        if(!route){
            throw new Error(
                "No route"
            );
        }


        const coordinates =
            route.geometry.coordinates.map(
                point => [
                    point[1],
                    point[0]
                ]
            );


        navigationLine =
            L.polyline(
                coordinates,
                {
                    color:"#FFD600",
                    weight:6,
                    opacity:.9
                }
            ).addTo(map);


        map.fitBounds(
            navigationLine.getBounds(),
            {
                padding:[80,80],
                maxZoom:17
            }
        );


        navigationDistance.textContent =
            `${(
                route.distance / 1000
            ).toFixed(1)} km`;


    }catch(error){

        console.warn(
            "OSRM:",
            error
        );


        drawStraightLine();

    }

}


function drawStraightLine(){

    if(
        !map ||
        !navigationTarget ||
        !riderLocation
    ){
        return;
    }


    if(navigationLine){

        map.removeLayer(
            navigationLine
        );

    }


    navigationLine =
        L.polyline(
            [
                [
                    riderLocation.lat,
                    riderLocation.lng
                ],
                [
                    navigationTarget.lat,
                    navigationTarget.lng
                ]
            ],
            {
                color:"#FFD600",
                weight:6,
                opacity:.9,
                dashArray:"12 8"
            }
        ).addTo(map);


    map.fitBounds(
        navigationLine.getBounds(),
        {
            padding:[70,70],
            maxZoom:16
        }
    );

}


function updateNavigationDistance(){

    if(
        !navigationTarget ||
        !riderLocation
    ){
        return;
    }


    const distance =
        calculateDistance(
            riderLocation.lat,
            riderLocation.lng,
            navigationTarget.lat,
            navigationTarget.lng
        );


    navigationDistance.textContent =
        `${distance.toFixed(1)} km`;

}


function stopNavigation(){

    navigationTarget = null;


    if(navigationLine){

        map.removeLayer(
            navigationLine
        );

        navigationLine =
            null;

    }


    if(targetMarker){

        map.removeLayer(
            targetMarker
        );

        targetMarker =
            null;

    }


    navigationBanner.classList.remove(
        "show"
    );


    clearInterval(
        navigationTimer
    );

}


/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371;


    const dLat =
        (lat2-lat1) *
        Math.PI / 180;


    const dLon =
        (lon2-lon1) *
        Math.PI / 180;


    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2)
        +
        Math.cos(
            lat1 *
            Math.PI / 180
        )
        *
        Math.cos(
            lat2 *
            Math.PI / 180
        )
        *
        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;

}


/* =========================================================
   LOCATION DATA
========================================================= */

function getLocation(
    value
){

    if(!value){

        return {
            text:"Location unavailable",
            lat:null,
            lng:null
        };

    }


    if(typeof value === "string"){

        return {
            text:value,
            lat:null,
            lng:null
        };

    }


    const lat =
        value.lat ??
        value.latitude ??
        value.coordinates?.lat ??
        null;


    const lng =
        value.lng ??
        value.longitude ??
        value.coordinates?.lng ??
        null;


    const text =
        value.address ||
        value.name ||
        value.text ||
        value.label ||
        value.formattedAddress ||
        "Location";


    return {
        text,
        lat:
            lat !== null
                ? Number(lat)
                : null,
        lng:
            lng !== null
                ? Number(lng)
                : null
    };

}

/* =========================================================
   SOUND
========================================================= */

function playRequestSound(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }


        const now =
            audioContext.currentTime;


        [0,.18,.36].forEach(
            (offset,index) => {

                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();


                oscillator.type =
                    "sine";


                oscillator.frequency.value =
                    index === 1
                        ? 880
                        : 660;


                gain.gain.setValueAtTime(
                    .0001,
                    now + offset
                );


                gain.gain.exponentialRampToValueAtTime(
                    .18,
                    now + offset + .03
                );


                gain.gain.exponentialRampToValueAtTime(
                    .0001,
                    now + offset + .15
                );


                oscillator.connect(
                    gain
                );


                gain.connect(
                    audioContext.destination
                );


                oscillator.start(
                    now + offset
                );


                oscillator.stop(
                    now + offset + .16
                );

            }
        );

    }catch(error){

        console.warn(
            "Sound:",
            error
        );

    }

}

/* =========================================================
   RESTORE ONLINE
========================================================= */

async function restoreOnlineStatus(){

    const online =
        Boolean(
            riderData?.isOnline ||
            userData?.isOnline
        );


    if(
        online &&
        !activeRideId
    ){

        isOnline = true;

        updateOnlineUI();

        listenForRequests();

        requestLocationOnce();

    }else{

        isOnline = false;

        updateOnlineUI();

        showOfflineState();

    }


    await restoreActiveRide();

}


/* =========================================================
   RESTORE ACTIVE RIDE
========================================================= */

async function restoreActiveRide(){

    if(!currentUser){
        return;
    }


    try{

        const ridesQuery =
            query(
                collection(db,"rides"),
                where(
                    "riderId",
                    "==",
                    currentUser.uid
                )
            );


        onSnapshot(
            ridesQuery,
            snapshot => {

                let found = null;


                snapshot.forEach(
                    snap => {

                        const ride =
                            snap.data();


                        const status =
                            String(
                                ride.status ||
                                ""
                            ).toLowerCase();


                        if(
                            [
                                "accepted",
                                "arriving",
                                "started",
                                "in_progress",
                                "ongoing"
                            ].includes(
                                status
                            )
                        ){

                            found = {
                                ...ride,
                                id:snap.id
                            };

                        }

                    }
                );


                if(found){

                    activeRideId =
                        found.id;

                    activeRide =
                        found;

                    showActiveRide();

                    listenActiveRide();

                }

            },
            error => {

                console.warn(
                    "Active ride restore:",
                    error
                );

            }
        );

    }catch(error){

        console.warn(
            "Restore active ride:",
            error
        );

    }

}
