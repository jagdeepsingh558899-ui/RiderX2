/* =========================================================
   SOUND
========================================================= */

function playRequestSound(){

    try{

        if(
            !audioContext
        ){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }


        const now =
            audioContext.currentTime;


        [0, .18, .36].forEach(
            (offset,index)=>{

                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();


                oscillator.type =
                    "sine";


                oscillator.frequency.value =
                    index === 1
                        ? 880
                        : 660;


                gain.gain.setValueAtTime(
                    .0001,
                    now + offset
                );

                gain.gain.exponentialRampToValueAtTime(
                    .20,
                    now + offset + .02
                );

                gain.gain.exponentialRampToValueAtTime(
                    .0001,
                    now + offset + .16
                );


                oscillator.connect(
                    gain
                );

                gain.connect(
                    audioContext.destination
                );


                oscillator.start(
                    now + offset
                );

                oscillator.stop(
                    now + offset + .18
                );

            }
        );


    }
    catch(error){

        console.warn(
            "Request sound unavailable:",
            error
        );

    }


    try{

        if(
            navigator.vibrate
        ){

            navigator.vibrate(
                [150,80,150]
            );

        }

    }
    catch(error){}

}


/* =========================================================
   MAP INIT
========================================================= */

function initMap(){

    if(map)
        return;


    /*
     * Chandigarh default.
     * Once GPS is available the map moves
     * to rider's real location.
     */

    map =
        L.map(
            "map",
            {
                zoomControl:true,
                attributionControl:true
            }
        )
        .setView(
            [30.7333,76.7794],
            13
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap"
        }
    )
    .addTo(map);


    setTimeout(
        ()=>{
            map.invalidateSize();
        },
        500
    );

}


/* =========================================================
   RIDER MARKER
========================================================= */

function updateRiderMarker(
    lat,
    lng,
    accuracy=0
){

    if(!map)
        return;


    const icon =
        L.divIcon({
            className:"",
            html:
                `
                <div class="rider-marker">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
                `,
            iconSize:[48,48],
            iconAnchor:[24,24]
        });


    if(!riderMarker){

        riderMarker =
            L.marker(
                [lat,lng],
                {
                    icon:icon,
                    zIndexOffset:1000
                }
            )
            .addTo(map);

    }
    else{

        riderMarker.setLatLng(
            [lat,lng]
        );

    }


    if(
        accuracy &&
        accuracy < 500
    ){

        if(!accuracyCircle){

            accuracyCircle =
                L.circle(
                    [lat,lng],
                    {
                        radius:accuracy,
                        color:"#FFD600",
                        fillColor:"#FFD600",
                        fillOpacity:.08,
                        weight:1
                    }
                )
                .addTo(map);

        }
        else{

            accuracyCircle.setLatLng(
                [lat,lng]
            );

            accuracyCircle.setRadius(
                accuracy
            );

        }

    }


    riderLocation = {
        lat,
        lng
    };

}


/* =========================================================
   GPS
========================================================= */

function startLocationTracking(){

    if(
        !navigator.geolocation
    ){

        showToast(
            "GPS is not supported on this device.",
            "error"
        );

        return;

    }


    navigator.geolocation.watchPosition(
        async(position)=>{

            const {
                latitude,
                longitude,
                accuracy
            } =
                position.coords;


            updateRiderMarker(
                latitude,
                longitude,
                accuracy
            );


            if(
                isOnline &&
                currentUser
            ){

                await updateRiderLocation(
                    latitude,
                    longitude
                );

            }

            updateNavigationDistance();

        },
        (error)=>{

            console.warn(
                "GPS error:",
                error
            );

            if(
                error.code ===
                1
            ){

                showToast(
                    "Location permission is required.",
                    "error"
                );

/* =========================================================
   SAVE RIDER LOCATION
========================================================= */

async function updateRiderLocation(
    lat,
    lng
){

    if(!currentUser)
        return;


    const location = {
        lat:lat,
        lng:lng
    };


    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                isOnline:true,
                location:location,
                lat:lat,
                lng:lng,
                updatedAt:
                    serverTimestamp()
            }
        );

    }
    catch(error){

        console.warn(
            "User location update:",
            error
        );

    }


    try{

        await updateDoc(
            doc(
                db,
                "riders",
                currentUser.uid
            ),
            {
                isOnline:true,
                location:location,
                lat:lat,
                lng:lng,
                updatedAt:
                    serverTimestamp()
            }
        );

    }
    catch(error){

        console.warn(

        );

   CENTER LOCATION
========================================================= */

document
    .getElementById("locationBtn")
    .addEventListener(
        "click",
        ()=>{

            if(
                riderLocation
            ){

                map.setView(
                    [
                        riderLocation.lat,
                        riderLocation.lng
                    ],
                    16,
                    {
                        animate:true
                    }
                );

            }
            else{

                requestLocation();

            }

        }
    );


function requestLocation(){

    if(
        !navigator.geolocation
    ){

        showToast(
            "GPS not available.",
            "error"
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(
        position=>{

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            updateRiderMarker(
                lat,
                lng,
                position.coords.accuracy
            );


            map.setView(
                [lat,lng],
                16
            );

        },
        ()=>{
            showToast(
                "Please allow location permission.",
                "error"
            );
        },
        {
            enableHighAccuracy:true,
            timeout:15000
        }
    );

}

/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadRiderProfile(){

    try{

        const userSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                )
            );


        if(!userSnap.exists()){

            showToast(
                "Rider profile not found.",
                "error"
            );

            return;

        }


        userData =
            userSnap.data();


        const role =
            String(
                userData.role || ""
            )
            .trim()
            .toLowerCase();


        if(role !== "rider"){

            showToast(
                "This is not a rider account.",
                "error"
            );

            return;

        }


        const riderSnap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                )
            );


        riderData =
            riderSnap.exists()
                ? riderSnap.data()
                : {};


        const approved =
            userData.adminApproved === true ||
            riderData.adminApproved === true ||
            userData.approved === true ||
            riderData.approved === true ||
            String(
                userData.status || ""
            ).toLowerCase() === "active" ||
            String(
                riderData.status || ""
            ).toLowerCase() === "active";


        if(!approved){

            location.replace(
                "pending.html"
            );

            return;

        }


        const blocked =
            [
                userData.status,
                riderData.status
            ]
            .some(
                status=>
                    [
                        "blocked",
                        "disabled"
                    ]
                    .includes(
                        String(
                            status || ""
                        ).toLowerCase()
                    )
            );


        if(blocked){

            showToast(
                "Your rider account is disabled.",
                "error"
            );

            return;

        }


        isOnline =
            userData.isOnline === true ||
            riderData.isOnline === true;


        updateOnlineUI();


        if(isOnline){

            listenForRequests();

        }
        else{

            showOfflineState();

        }


        findActiveRide();

    }
    catch(error){

        console.error(
            error
        );

        showToast(
            "Unable to load rider profile.",
            "error"
        );

    }

}

onlineBtn.addEventListener(
    "click",

                "Please login first.",
                "error"
            );

        }

        onlineBtn.disabled =
            true;


        try{

            const locationData =
                riderLocation
                    ? {
                        lat:riderLocation.lat,
                        lng:riderLocation.lng
                    }
                    : null;


            const userUpdate = {
                isOnline:next,
                updatedAt:
                    serverTimestamp()
            };


            if(locationData){

                    locationData;

                userUpdate.lat =
                    locationData.lat;

                userUpdate.lng =
                    locationData.lng;

            }


            await updateDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                userUpdate
            );


            const riderUpdate = {
                isOnline:next,
                updatedAt:

            };

                    locationData;

                riderUpdate.lat =

/* =========================================================
   REQUEST LISTENER
========================================================= */

function listenForRequests(){

    stopRequestListener();

    clearRequestMarkers();


    const ridesQuery =
        query(
            collection(db,"rides"),
            where(
                "status",
                "==",
                "searching"
            )
        );


    requestListener =
        onSnapshot(
            ridesQuery,
            snapshot=>{

                const rides = [];


                snapshot.forEach(
                    snap=>{

                        const ride =
                            snap.data();


                        /*
                         * Don't show rides already
                         * assigned to another rider.
                         */

                        if(
                            ride.riderId &&
                            ride.riderId !==
                            currentUser.uid
                        ){

                            return;

                        }


                        rides.push({
                            id:snap.id,
                            ...ride
                        });

                    }
                );


                renderRequests(
                    rides
                );


            },
            error=>{

                console.error(
                    "Ride request listener:",
                    error
                );


                showToast(
                    "Unable to load ride requests. Check Firestore rules.",
                    "error"
                );

            }
        );

}


/* =========================================================
   STOP REQUEST LISTENER
========================================================= */

function stopRequestListener(){

    if(
        requestListener
    ){

        requestListener();

        requestListener =
            null;

    }

}


/* =========================================================
   RENDER REQUESTS
========================================================= */

function renderRequests(
    rides
){

    clearRequestMarkers();


    if(!rides.length){

        requestCount.textContent =
            "0 requests";


        requestsContainer.innerHTML =
            `
            <div class="empty">
                <i class="fa-solid fa-motorcycle"></i>
                Waiting for new ride requests...
            </div>
            `;

        return;

    }


    requestCount.textContent =
        rides.length +
        (
            rides.length === 1
                ? " request"
                : " requests"
        );


    requestsContainer.innerHTML =
        "";


    rides.forEach(
        ride=>{

            if(
                !seenRideIds.has(
                    ride.id
                )
            ){

                seenRideIds.add(
                    ride.id
                );

                playRequestSound();

            }


            requestsContainer.appendChild(
                createRequestCard(
                    ride
                )
            );


            addRequestMarker(
                ride
            );

        }
    );


}

function addRequestMarker(

){

    if(
        !ride.pickup ||
        ride.pickup.lat == null ||

    ){

        return;

    }


    const icon =
        L.divIcon({
            className:"",

                    border-radius:50%;

                ">
                    <i class="fa-solid fa-location-dot"></i>

                `,

            iconAnchor:[21,21]
        });


    const marker =
        L.marker(
            [
                ride.pickup.lat,
                ride.pickup.lng
            ],
            {
                icon:icon,
                zIndexOffset:500
            }
        )
        .addTo(map);


    const fare =

        );


    const distance =
        Number(
            ride.distance || 0
        );


    marker.bindPopup(

                    border:0;
                    border-radius:8px;
                    font-weight:bold;

                ACCEPT

        </div>
        `
    );


    marker.on(

        }
    );


    requestMarkers.set(
        ride.id,
        marker
    );

}


/* =========================================================

========================================================= */

function clearRequestMarkers(){

    requestMarkers.forEach(
        marker=>{

    requestMarkers.clear();

}


/* =========================================================
   ACCEPT RIDE
========================================================= */

window.acceptRide = async function(
    rideId
){

    if(!currentUser){

        showToast(
            "Please login again.",
            "error"
        );

        return;

    }


    showLoading(
        "Accepting ride..."
    );


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const snap =
            await getDoc(
                rideRef
            );


        if(!snap.exists()){

            hideLoading();

            showToast(
                "Ride is no longer available.",
                "error"
            );

            return;

        }


        const ride =
            snap.data();


        if(
            ride.status !==
            "searching"
        ){

            hideLoading();

            showToast(
                "Another rider already accepted this ride.",
                "error"
            );

            return;

        }


        if(
            ride.riderId &&
            ride.riderId !==
            currentUser.uid
        ){

            hideLoading();

            showToast(
                "Ride is already assigned.",
                "error"
            );

            return;

        }


        await updateDoc(
            rideRef,
            {
                status:"ACCEPTED",

                riderId:
                    currentUser.uid,

                acceptedAt:
                    serverTimestamp()
            }
        );


        activeRideId =
            rideId;


        activeRide =
            {
                ...ride,
                id:rideId,
                status:"ACCEPTED",
                riderId:currentUser.uid
            };


        stopRequestListener();

        clearRequestMarkers();


        hideLoading();


        showToast(
            "Ride accepted!",
            "success"
        );


        showActiveRide();


        listenActiveRide();


        startNavigation(
            "pickup"
        );

    }
    catch(error){

        hideLoading();

        console.error(
            "Accept ride:",
            error
        );


        showToast(
            "Unable to accept ride: " +
            error.message,
            "error"
        );

    }

};


/* =========================================================
   ACTIVE RIDE LISTENER
========================================================= */

function listenActiveRide(){

    if(
        activeRideListener
    ){

        activeRideListener();

    }


    if(
        !activeRideId
    )
        return;


    activeRideListener =
        onSnapshot(
            doc(
                db,
                "rides",
                activeRideId
            ),
            snapshot=>{

                if(
                    !snapshot.exists()
                ){

                    clearActiveRide();

                    return;

                }


                const ride =
                    snapshot.data();


                if(
                    ride.riderId !==
                    currentUser.uid
                ){

                    return;

                }


                activeRide =
                    {
                        ...ride,
                        id:activeRideId
                    };


                if(
                    ride.status ===
                    "COMPLETED"
                ){

                    clearActiveRide();

                    showToast(
                        "Ride completed.",
                        "success"
                    );

                    if(isOnline){

                        listenForRequests();

                    }

                    return;

                }


                showActiveRide();


                if(
                    ride.status ===
                    "ACCEPTED"
                ){

                    startNavigation(
                        "pickup"
                    );

                }


                if(
                    ride.status ===
                    "STARTED"
                ){

                    startNavigation(
                        "drop"
                    );

                }

            },
            error=>{

                console.error(
                    "Active ride listener:",
                    error
                );

            }
        );

}

window.startRide = async function(){

    if(
        !activeRideId ||
        !currentUser
    ){

        return;

    }


    try{

        showLoading(
            "Starting ride..."
        );


        const ref =
            doc(
                db,
                "rides",
                activeRideId
            );


        const snap =
            await getDoc(
                ref
            );


        if(
            !snap.exists()
        ){

            hideLoading();

            return;

        }


        const ride =
            snap.data();


        if(
            ride.riderId !==
            currentUser.uid
        ){

            hideLoading();

            showToast(
                "This ride is not assigned to you.",
                "error"
            );

            return;

        }


        await updateDoc(
            ref,
            {
                status:"STARTED",

                startedAt:
                    serverTimestamp()
            }
        );


        hideLoading();


        showToast(
            "Ride started. Navigate to customer drop.",
            "success"
        );


        startNavigation(
            "drop"
        );

    }
    catch(error){

        hideLoading();

        console.error(
            error
        );

        showToast(
            "Unable to start ride.",
            "error"
        );

    }

};


/* =========================================================
   COMPLETE RIDE
========================================================= */

window.completeRide = async function(){

    if(
        !activeRideId ||
        !currentUser
    ){

        return;

    }


    if(
        !confirm(
            "Are you sure you want to complete this ride?"
        )
    ){

        return;

    }


    try{

        showLoading(
            "Completing ride..."
        );


        const ref =
            doc(
                db,
                "rides",
                activeRideId
            );


        const snap =
            await getDoc(
                ref
            );


        if(
            !snap.exists()
        ){

            hideLoading();

            return;

        }


        const ride =
            snap.data();


        if(
            ride.riderId !==
            currentUser.uid
        ){

            hideLoading();

            showToast(
                "This ride is not assigned to you.",
                "error"
            );

            return;

        }


        await updateDoc(
            ref,
            {
                status:"COMPLETED",

                completedAt:
                    serverTimestamp()
            }
        );


        hideLoading();


        stopNavigation();


        showToast(
            "Ride completed successfully.",
            "success"
        );

    }
    catch(error){

        hideLoading();

        console.error(
            error
        );

        showToast(
            "Unable to complete ride.",
            "error"
        );

    }

};


/* =========================================================
   FIND ACTIVE RIDE
========================================================= */

async function findActiveRide(){

    if(!currentUser)
        return;


    try{

        const q =
            query(
                collection(db,"rides"),
                where(
                    "riderId",
                    "==",
                    currentUser.uid
                )
            );


        onSnapshot(
            q,
            snapshot=>{

                let found =
                    null;


                snapshot.forEach(
                    snap=>{

                        const ride =
                            snap.data();


                        if(
                            ride.status ===
                                "ACCEPTED" ||
                            ride.status ===
                                "STARTED"
                        ){

                            found = {
                                id:snap.id,
                                ...ride
                            };

                        }

                    }
                );


                if(found){

                    activeRideId =
                        found.id;

                    activeRide =
                        found;

                    showActiveRide();

                    listenActiveRide();

                }
                else{

                    clearActiveRide();

                }

            },
            error=>{

                console.error(
                    "Active ride search:",
                    error
                );

            }
        );

    }
    catch(error){

        console.error(
            error
        );

    }

}


/* =========================================================
   CLEAR ACTIVE RIDE
========================================================= */

function clearActiveRide(){

    activeRideId =
        null;

    activeRide =
        null;


    if(
        activeRideListener
    ){

        activeRideListener();

        activeRideListener =
            null;

    }


    stopNavigation();


    activeArea.style.display =
        "none";


    document.getElementById(
        "requestsArea"
    ).style.display =
        "block";

}


/* =========================================================
   NAVIGATION
========================================================= */

window.startNavigation = async function(
    type
){

    if(!activeRide){

        showToast(
            "Active ride not found.",
            "error"
        );

        return;

    }


    const destination =
        type === "pickup"
            ? activeRide.pickup
            : activeRide.drop;


    if(
        !destination ||
        destination.lat == null ||
        destination.lng == null
    ){

        showToast(
            "Destination coordinates are missing.",
            "error"
        );

        /*
         * Fallback to external maps.
         */

        openExternalNavigation(
            destination
        );

        return;

    }


    navigationTarget = {
        lat:Number(
            destination.lat
        ),
        lng:Number(
            destination.lng
        ),
        type:type
    };


    navigationTitle.textContent =
        type === "pickup"
            ? "NAVIGATING TO CUSTOMER PICKUP"
            : "NAVIGATING TO CUSTOMER DROP";


    navigationSub.textContent =
        type === "pickup"
            ? "Follow the map to customer pickup"
            : "Follow the map to customer destination";


    navigationBanner.classList.add(
        "show"
    );


    drawNavigationLine();


    updateNavigationDistance();


    if(
        riderLocation
    ){

        fitNavigationView();

    }
    else{

        map.setView(
            [
                navigationTarget.lat,
                navigationTarget.lng
            ],
            15
        );

    }


    if(
        navigationWatch
    ){

        clearInterval(
            navigationWatch
        );

    }


    navigationWatch =
        setInterval(
            ()=>{
                drawNavigationLine();
                updateNavigationDistance();
            },
            5000
        );

};


/* =========================================================
   DRAW NAVIGATION LINE
========================================================= */

function drawNavigationLine(){

    if(
        !map ||
        !navigationTarget
    )
        return;


    if(
        navigationLine
    ){

        map.removeLayer(
            navigationLine
        );

    }


    if(
        !riderLocation
    )
        return;


    navigationLine =
        L.polyline(
            [
                [
                    riderLocation.lat,
                    riderLocation.lng
                ],
                [
                    navigationTarget.lat,
                    navigationTarget.lng
                ]
            ],
            {
                color:"#FFD600",
                weight:6,
                opacity:.9,
                dashArray:"12 8"
            }
        )
        .addTo(map);


    const targetIcon =
        L.divIcon({
            className:"",
            html:
                `
                <div style="
                    width:40px;
                    height:40px;
                    border-radius:50%;
                    background:#22c55e;
                    border:3px solid #fff;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#000;
                    box-shadow:0 4px 15px rgba(0,0,0,.4);
                ">
                    <i class="fa-solid fa-flag"></i>
                </div>
                `,
            iconSize:[40,40],
            iconAnchor:[20,20]
        });


    if(
        window.riderxTargetMarker
    ){

        map.removeLayer(
            window.riderxTargetMarker
        );

    }


    window.riderxTargetMarker =
        L.marker(
            [
                navigationTarget.lat,
                navigationTarget.lng
            ],
            {
                icon:targetIcon,
                zIndexOffset:900
            }
        )
        .addTo(map);

}


/* =========================================================
   NAVIGATION DISTANCE
========================================================= */

function updateNavigationDistance(){

    if(
        !navigationTarget ||
        !riderLocation
    ){

        return;

    }


    const distance =
        calculateDistance(
            riderLocation.lat,
            riderLocation.lng,
            navigationTarget.lat,
            navigationTarget.lng
        );


    navigationDistance.textContent =
        distance < 1
            ? Math.round(
                distance * 1000
              ) +
              " m"
            :
              distance.toFixed(1) +
              " km";


    if(
        distance < .05
    ){

        navigationSub.textContent =
            "You have reached the destination.";

    }

}


/* =========================================================
   FIT NAVIGATION
========================================================= */

function fitNavigationView(){

    if(
        !riderLocation ||
        !navigationTarget
    )
        return;


    const bounds =
        L.latLngBounds(
            [
                riderLocation.lat,
                riderLocation.lng
            ],
            [
                navigationTarget.lat,
                navigationTarget.lng
            ]
        );


    map.fitBounds(
        bounds,
        {
            padding:[
                60,
                60
            ],
            maxZoom:16
        }
    );

}


/* =========================================================
   STOP NAVIGATION
========================================================= */

function stopNavigation(){

    navigationTarget =
        null;


    navigationBanner.classList.remove(
        "show"
    );


    if(
        navigationLine
    ){

        map.removeLayer(
            navigationLine
        );

        navigationLine =
            null;

    }


    if(
        window.riderxTargetMarker
    ){

        map.removeLayer(
            window.riderxTargetMarker
        );

        window.riderxTargetMarker =
            null;

    }


    if(
        navigationWatch
    ){

        clearInterval(
            navigationWatch
        );

        navigationWatch =
            null;

    }

}


/* =========================================================
   EXTERNAL NAVIGATION FALLBACK
========================================================= */

function openExternalNavigation(
    destination
){

    if(
        !destination ||
        destination.lat == null ||
        destination.lng == null
    ){

        return;

    }


    const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" +
        encodeURIComponent(
            destination.lat +
            "," +
            destination.lng
        );


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371;


    const dLat =
        (lat2-lat1) *
        Math.PI / 180;


    const dLon =
        (lon2-lon1) *
        Math.PI / 180;


    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2)
        +
        Math.cos(
            lat1 *
            Math.PI /
            180
        )
        *
        Math.cos(
            lat2 *
            Math.PI /
            180
        )
        *
        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;

}


/* =========================================================
   LOCATION DATA
========================================================= */

function locationData(
    value
){

    if(!value){

        return {
            text:"Location not available",
            lat:null,
            lng:null
        };

    }


    if(
        typeof value ===
        "string"
    ){

        return {
            text:value,
            lat:null,
            lng:null
        };

    }


    return {
        text:
            value.address ||
            value.name ||
            value.location ||
            (
                value.lat != null &&
                value.lng != null
                    ?
                    `${value.lat}, ${value.lng}`
                    :
                    "Location not available"
            ),

        lat:
            value.lat != null
                ? Number(value.lat)
                : null,

        lng:
            value.lng != null
                ? Number(value.lng)
                : null
    };

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    async()=>{

        stopRequestListener();

        if(
            activeRideListener
        ){

            activeRideListener();

        }


        stopNavigation();


        /*
         * If rider closes the page while online,
         * don't immediately force offline here because
         * browser unload may not complete Firebase write.
         */

    }
);
