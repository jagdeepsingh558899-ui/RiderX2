<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>RiderX | Rider Home</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

:root{
    --yellow:#ffe500;
    --black:#050505;
    --dark:#0b0b0b;
    --card:#141414;
    --card2:#191919;
    --border:#2d2d2d;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#38bdf8;
    --text:#fff;
    --muted:#999;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Poppins,sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#050505;
    color:#fff;
}

body{
    padding-bottom:82px;
}

button{
    font-family:inherit;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    z-index:3000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    background:rgba(5,5,5,.94);
    backdrop-filter:blur(12px);

    border-bottom:1px solid #252525;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:var(--yellow);
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;

    border:1px solid #333;
    border-radius:50%;

    background:#171717;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.icon-btn:active{
    transform:scale(.95);
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:fixed;
    top:64px;
    left:0;
    right:0;
    bottom:0;

    z-index:1;

    background:#111;
}

.leaflet-control-zoom{
    margin-top:15px!important;
}

.leaflet-control-zoom a{
    background:#111!important;
    color:var(--yellow)!important;
    border-color:#333!important;
}

.leaflet-control-attribution{
    background:rgba(0,0,0,.65)!important;
    color:#aaa!important;
}

.leaflet-control-attribution a{
    color:#ffe500!important;
}

/* =========================================================
   RIDER MARKER
========================================================= */

.rider-marker{
    width:48px;
    height:48px;

    border-radius:50%;

    background:var(--yellow);

    border:4px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#000;

    box-shadow:
        0 0 0 6px rgba(255,229,0,.18),
        0 4px 15px rgba(0,0,0,.5);

    font-size:20px;
}

/* =========================================================
   MAP TOP STATUS
========================================================= */

.map-status{
    position:fixed;

    top:76px;
    left:50%;

    transform:translateX(-50%);

    z-index:2500;

    background:rgba(10,10,10,.94);

    border:1px solid #333;

    border-radius:30px;

    padding:8px 14px;

    font-size:11px;

    white-space:nowrap;

    display:flex;
    align-items:center;
    gap:7px;
}

.map-status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#777;
}

.map-status-dot.online{
    background:var(--green);
    box-shadow:0 0 10px rgba(34,197,94,.8);
}

/* =========================================================
   ONLINE TOGGLE
========================================================= */

.online-panel{
    position:fixed;

    left:12px;
    right:12px;
    bottom:94px;

    z-index:2600;

    background:rgba(12,12,12,.96);

    border:1px solid #303030;

    border-radius:18px;

    padding:12px;

    backdrop-filter:blur(12px);
}

.online-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.online-info{
    display:flex;
    align-items:center;
    gap:10px;
}

.online-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#666;
}

.online-dot.online{
    background:var(--green);
    box-shadow:0 0 12px rgba(34,197,94,.8);
}

.online-info strong{
    display:block;
    font-size:14px;
}

.online-info small{
    display:block;
    color:#888;
    font-size:10px;
    margin-top:2px;
}

.online-btn{
    border:0;
    border-radius:12px;

    background:var(--yellow);
    color:#000;

    padding:11px 16px;

    font-size:12px;
    font-weight:800;

    cursor:pointer;
}

.online-btn.offline{
    background:#ef4444;
    color:#fff;
}

/* =========================================================
   REQUESTS PANEL
========================================================= */

.requests-panel{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:2700;

    max-height:58vh;

    background:#090909;

    border-radius:25px 25px 0 0;

    border-top:1px solid #333;

    transform:translateY(calc(100% - 66px));

    transition:transform .3s ease;

    overflow:hidden;

    box-shadow:0 -15px 40px rgba(0,0,0,.5);
}

.requests-panel.open{
    transform:translateY(0);
}

.panel-handle{
    width:45px;
    height:5px;

    border-radius:10px;

    background:#555;

    margin:10px auto;
}

.panel-header{
    padding:4px 15px 12px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.panel-header h3{
    font-size:17px;
}

.panel-header span{
    color:#888;
    font-size:11px;
}

.requests-content{
    overflow-y:auto;
    max-height:calc(58vh - 58px);
    padding:0 12px 15px;
}

/* =========================================================
   REQUEST CARD
========================================================= */

.request-card{
    background:#151515;

    border:1px solid #333;

    border-radius:18px;

    padding:14px;

    margin-bottom:10px;
}

.request-top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:12px;
}

.service-badge{
    background:var(--yellow);
    color:#000;

    border-radius:8px;

    padding:6px 9px;

    font-size:10px;
    font-weight:900;
}

.request-status{
    color:var(--green);
    font-size:10px;
    font-weight:800;
}

.customer-name{
    font-size:14px;
    font-weight:700;

    margin-bottom:10px;
}

.route-box{
    background:#080808;

    border:1px solid #252525;

    border-radius:14px;

    padding:11px;

    margin-bottom:10px;
}

.route-row{
    display:flex;
    gap:9px;
    align-items:flex-start;
}

.route-row + .route-row{
    margin-top:12px;
}

.route-icon{
    width:27px;
    height:27px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
}

.pickup{
    background:#12351f;
    color:var(--green);
}

.drop{
    background:#3b3500;
    color:var(--yellow);
}

.route-text{
    min-width:0;
}

.route-label{
    color:#777;
    font-size:9px;
    text-transform:uppercase;
    margin-bottom:2px;
}

.route-address{
    font-size:12px;
    line-height:1.4;
    word-break:break-word;
}

.request-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;

    margin-bottom:10px;
}

.info-box{
    background:#080808;
    border:1px solid #252525;
    border-radius:11px;

    padding:9px 5px;

    text-align:center;
}

.info-box small{
    display:block;
    color:#777;
    font-size:8px;
    margin-bottom:3px;
}

.info-box strong{
    font-size:12px;
}

.earn-box{
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#1c1900;

    border:1px solid #514800;

    border-radius:13px;

    padding:11px;

    margin-bottom:10px;
}

.earn-box small{
    color:#aaa;
    font-size:10px;
}

.earn-amount{
    color:var(--yellow);
    font-size:23px;
    font-weight:900;
}

.accept-btn{
    width:100%;

    border:0;

    background:var(--yellow);
    color:#000;

    border-radius:13px;

    padding:13px;

    font-size:14px;
    font-weight:900;

    cursor:pointer;
}

.accept-btn:disabled{
    opacity:.5;
}

/* =========================================================
   ACTIVE RIDE PANEL
========================================================= */

.active-panel{
    position:fixed;

    left:10px;
    right:10px;
    bottom:94px;

    z-index:2800;

    background:rgba(10,10,10,.97);

    border:1px solid #22c55e;

    border-radius:20px;

    padding:14px;

    display:none;

    max-height:65vh;

    overflow-y:auto;

    box-shadow:0 0 25px rgba(34,197,94,.1);
}

.active-panel.show{
    display:block;
}

.active-title{
    color:var(--green);

    font-size:16px;
    font-weight:900;

    margin-bottom:12px;
}

.active-status{
    background:#12351f;
    color:var(--green);

    display:inline-block;

    border-radius:8px;

    padding:5px 8px;

    font-size:9px;
    font-weight:900;

    margin-bottom:10px;
}

.active-customer{
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
}

.active-route{
    background:#080808;
    border:1px solid #292929;
    border-radius:14px;
    padding:11px;
}

.active-route-row{
    display:flex;
    gap:9px;
}

.active-route-row + .active-route-row{
    margin-top:11px;
}

.active-route-row i{
    width:25px;
    height:25px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.active-route-row div{
    min-width:0;
}

.active-route-row small{
    display:block;
    color:#777;
    font-size:9px;
}

.active-route-row span{
    display:block;
    font-size:11px;
    line-height:1.4;
    word-break:break-word;
}

.active-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;

    margin:10px 0;
}

.active-stat{
    background:#080808;
    border:1px solid #292929;
    border-radius:11px;
    padding:9px 4px;
    text-align:center;
}

.active-stat small{
    display:block;
    color:#777;
    font-size:8px;
}

.active-stat strong{
    color:#fff;
    font-size:12px;
}

.active-fare{
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#1c1900;
    border:1px solid #514800;

    border-radius:13px;

    padding:10px 12px;

    margin-bottom:10px;
}

.active-fare small{
    color:#aaa;
    font-size:10px;
}

.active-fare strong{
    color:var(--yellow);
    font-size:22px;
}

.active-actions{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
}

.action-btn{
    width:100%;

    border:0;
    border-radius:12px;

    padding:13px;

    font-size:13px;
    font-weight:800;

    cursor:pointer;
}

.navigate-btn{
    background:#222;
    border:1px solid #444;
    color:#fff;
}

.start-btn{
    background:var(--yellow);
    color:#000;
}

.complete-btn{
    background:var(--green);
    color:#000;
}

.cancel-btn{
    background:#2a1111;
    color:#ff5555;
    border:1px solid #552222;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    z-index:3500;

    background:#111;

    border-top:1px solid #292929;

    display:flex;
    justify-content:space-around;
    align-items:center;
}

.bottom-item{
    color:#777;

    text-align:center;

    font-size:10px;

    cursor:pointer;
}

.bottom-item i{
    display:block;
    font-size:18px;
    margin-bottom:4px;
}

.bottom-item.active{
    color:var(--yellow);
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;
    inset:0;

    z-index:6000;

    background:rgba(0,0,0,.72);

    display:none;

    align-items:center;
    justify-content:center;

    backdrop-filter:blur(4px);
}

.loading.show{
    display:flex;
}

.loading-box{
    background:#151515;

    border:1px solid #333;

    border-radius:18px;

    padding:25px 30px;

    text-align:center;
}

.loading-box i{
    color:var(--yellow);
    font-size:30px;
    margin-bottom:10px;
}

.loading-box p{
    font-size:13px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;

    bottom:82px;

    z-index:7000;

    transform:translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:#222;

    border:1px solid #444;

    border-radius:12px;

    padding:11px 16px;

    max-width:90%;

    font-size:12px;

    text-align:center;

    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.success{
    border-color:var(--green);
}

.toast.error{
    border-color:var(--red);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(min-width:700px){

    .online-panel{
        left:auto;
        width:380px;
        right:20px;
    }

    .active-panel{
        width:400px;
        left:auto;
        right:20px;
    }

    .requests-panel{
        width:430px;
        left:auto;
        right:20px;
        border-radius:25px;
        bottom:94px;
        transform:translateY(calc(100% - 66px));
    }

}

</style>

</head>

<script

<!-- =======================================================
     FIREBASE
======================================================== -->

<script type="module">

import {
    auth,
    db
}
from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;

let riderData = null;

let userData = null;

let isOnline = false;

let map = null;

let riderMarker = null;

let accuracyCircle = null;

let watchId = null;

let riderLat = null;

let riderLng = null;

let requestUnsub = null;

let activeRideUnsub = null;

let userProfileUnsub = null;

let activeRideId = null;

let activeRideData = null;

let routeLine = null;

let routePoints = [];

let selectingNavigation = false;


/* =========================================================
   ELEMENTS
========================================================= */

const onlineBtn =
    document.getElementById("onlineBtn");

const onlineDot =
    document.getElementById("onlineDot");

const onlineText =
    document.getElementById("onlineText");

const onlineSubText =
    document.getElementById("onlineSubText");

const mapStatusDot =
    document.getElementById("mapStatusDot");

const mapStatusText =
    document.getElementById("mapStatusText");

const requestsPanel =
    document.getElementById("requestsPanel");

const requestsContent =
    document.getElementById("requestsContent");

const rideCount =
    document.getElementById("rideCount");

const activePanel =
    document.getElementById("activePanel");

const activeRideContent =
    document.getElementById("activeRideContent");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");


/* =========================================================
   TOAST
========================================================= */

function showToast(
    text,
    type="success"
){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        text;

    toast.className =
        "toast show " + type;

    clearTimeout(
        window.riderXToastTimer
    );

    window.riderXToastTimer =
        setTimeout(
            ()=>{
                toast.className =
                    "toast";
            },
            3000
        );

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(
    text="Please wait..."
){

    loadingText.textContent =
        text;

    loading.classList.add(
        "show"
    );

}


function hideLoading(){

    loading.classList.remove(
        "show"
    );

}


/* =========================================================
   PROFILE
========================================================= */

window.goProfile =
function(){

    location.href =
        "profile.html";

};


/* =========================================================
   MAP INITIALIZATION
========================================================= */

function initMap(){

    if(map)
        return;


    map =
        L.map(
            "map",
            {
                zoomControl:true,
                attributionControl:true
            }
        )
        .setView(
            [30.7333,76.7794],
            13
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    document
        .getElementById(
            "centerMapBtn"
        )
        .addEventListener(
            "click",
            centerOnRider
        );


    setTimeout(
        ()=>{
            map.invalidateSize();
        },
        400
    );

}


/* =========================================================
   RIDER MARKER
========================================================= */

function createRiderMarker(
    lat,
    lng
){

    if(!map)
        return;


    const icon =
        L.divIcon({

            className:"",

            html:`
                <div class="rider-marker">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
            `,

            iconSize:[48,48],

            iconAnchor:[24,24]

        });


    riderMarker =
        L.marker(
            [lat,lng],
            {
                icon:icon,
                zIndexOffset:1000
            }
        )
        .addTo(map);


    accuracyCircle =
        L.circle(
            [lat,lng],
            {
                radius:30,
                color:"#ffe500",
                fillColor:"#ffe500",
                fillOpacity:.12,
                weight:1
            }
        )
        .addTo(map);

}


/* =========================================================
   UPDATE RIDER LOCATION
========================================================= */

function updateRiderLocation(
    position
){

    riderLat =
        position.coords.latitude;

    riderLng =
        position.coords.longitude;


    const accuracy =
        position.coords.accuracy || 30;


    if(!riderMarker){

        createRiderMarker(
            riderLat,
            riderLng
        );

        if(map){

            map.setView(
                [riderLat,riderLng],
                15
            );

        }

    }
    else{

        riderMarker.setLatLng(
            [riderLat,riderLng]
        );

    }


    if(accuracyCircle){

        accuracyCircle.setLatLng(
            [riderLat,riderLng]
        );

        accuracyCircle.setRadius(
            Math.min(
                Math.max(
                    accuracy,
                    15
                ),
                150
            )
        );

    }


    /* Save rider location */

    updateRiderLocationInFirebase();


    /* Update navigation */

    if(
        activeRideData &&
        (
            activeRideData.status === "ACCEPTED" ||
            activeRideData.status === "STARTED"
        )
    ){

        drawNavigationRoute();

    }

}


/* =========================================================
   FIREBASE RIDER LOCATION
========================================================= */

let locationUpdateTimer = null;

async function updateRiderLocationInFirebase(){

    if(
        !currentUser ||
        riderLat == null ||
        riderLng == null
    )
        return;


    clearTimeout(
        locationUpdateTimer
    );


    locationUpdateTimer =
        setTimeout(
            async()=>{

                try{

                    const location = {

                        lat:riderLat,

                        lng:riderLng,

                        updatedAt:
                            serverTimestamp()

                    };


                    await updateDoc(
                        doc(
                            db,
                            "users",
                            currentUser.uid
                        ),
                        {
                            currentLocation:
                                location
                        }
                    );


                    try{

                        await updateDoc(
                            doc(
                                db,
                                "riders",
                                currentUser.uid
                            ),
                            {
                                currentLocation:
                                    location
                            }
                        );

                    }
                    catch(e){

                        console.warn(
                            "Rider location rider doc:",
                            e
                        );

                    }

                }
                catch(error){

                    console.warn(
                        "Location update:",
                        error
                    );

                }

            },
            2500
        );

}


/* =========================================================
   START LOCATION TRACKING
========================================================= */

function startLocationTracking(){

    if(!navigator.geolocation){

        showToast(
            "Location is not supported on this device.",
            "error"
        );

        return;

    }


    stopLocationTracking();


    watchId =
        navigator.geolocation.watchPosition(
            updateRiderLocation,
            (error)=>{

                console.error(
                    "GPS error:",
                    error
                );


                if(
                    error.code === 1
                ){

                    showToast(
                        "Location permission is required.",
                        "error"
                    );

                }
                else{

                    showToast(
                        "Unable to get live location.",
                        "error"
                    );

                }

            },
            {
                enableHighAccuracy:true,
                maximumAge:3000,
                timeout:15000
            }
        );

}


/* =========================================================
   STOP LOCATION
========================================================= */

function stopLocationTracking(){

    if(
        watchId !== null
    ){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId =
            null;

    }

}

/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadRiderProfile(){

    try{

        const userSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                )
            );


        if(!userSnap.exists()){

            showToast(
                "Rider profile not found.",
                "error"
            );

            return;

        }


        userData =
            userSnap.data();


        const role =
            String(
                userData.role || ""
            )
            .trim()
            .toLowerCase();


        if(role !== "rider"){

            showToast(
                "This account is not a rider account.",
                "error"
            );

            setTimeout(
                ()=>{
                    location.replace(
                        "../auth/login.html?role=rider"
                    );
                },
                1200
            );

            return;

        }


        const riderSnap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                )
            );


        riderData =
            riderSnap.exists()
                ? riderSnap.data()
                : {};


        /* APPROVAL */

        const approved =
            userData.adminApproved === true ||
            riderData.adminApproved === true ||
            userData.approved === true ||
            riderData.approved === true ||
            String(
                userData.status || ""
            ).toLowerCase() === "active" ||
            String(
                riderData.status || ""
            ).toLowerCase() === "active";


        if(!approved){

            showToast(
                "Waiting for admin approval.",
                "error"
            );

            setTimeout(
                ()=>{
                    location.replace(
                        "pending.html"
                    );
                },
                1000
            );

            return;

        }


        /* NAME */

        const name =
            userData.name ||
            userData.fullName ||
            userData.displayName ||
            riderData.name ||
            riderData.fullName ||
            "Rider";


        /* LOAD ONLINE */

        isOnline =
            userData.isOnline === true ||
            riderData.isOnline === true;


        updateOnlineUI();


        /* ACTIVE RIDE */

        listenForActiveRide();


        /* ONLINE */

        if(isOnline){

            startLocationTracking();

            listenForRideRequests();

            setTimeout(
                ()=>{
                    openRequestsPanel();
                },
                500
            );

        }
        else{

            showOfflineMapState();

        }


        /* PROFILE LIVE UPDATE */

        listenToRiderProfile();


    }
    catch(error){

        console.error(
            "Profile load error:",
            error
        );

        showToast(
            "Unable to load rider profile.",
            "error"
        );

    }

}


/* =========================================================
   PROFILE LIVE LISTENER
========================================================= */

function listenToRiderProfile(){

    if(userProfileUnsub)
        userProfileUnsub();


    userProfileUnsub =
        onSnapshot(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            (snapshot)=>{

                if(!snapshot.exists())
                    return;


                const data =
                    snapshot.data();


                userData =
                    data;


                const newOnline =
                    data.isOnline === true;


                if(
                    newOnline !==
                    isOnline
                ){

                    isOnline =
                        newOnline;


                    updateOnlineUI();


                    if(isOnline){

                        startLocationTracking();

                        listenForRideRequests();

                    }
                    else{

                        stopLocationTracking();

                        stopRideRequests();

                    }

                }

            },
            (error)=>{

                console.warn(
                    "Profile listener:",
                    error
                );

            }
        );

}

/* =========================================================
   REQUEST LISTENER
========================================================= */

function listenForRideRequests(){

    stopRideRequests();


    requestsContent.innerHTML = `

        <div style="
            text-align:center;
            color:#777;
            padding:25px;
        ">

            <i
                class="fa-solid fa-spinner fa-spin"
                style="
                    color:#ffe500;
                    font-size:25px;
                    margin-bottom:8px;
                ">
            </i>

            <p>
                Searching for ride requests...
            </p>

        </div>

    `;


    const searchingQuery =
        query(
            collection(
                db,
                "rides"
            ),
            where(
                "status",
                "==",
                "searching"
            )
        );


    const requestedQuery =
        query(
            collection(
                db,
                "rides"
            ),
            where(
                "status",
                "==",
                "REQUESTED"
            )
        );


    const rides =
        new Map();


    function render(){

        requestsContent.innerHTML =
            "";


        if(rides.size === 0){

            requestsContent.innerHTML = `

                <div style="
                    text-align:center;
                    color:#777;
                    padding:25px 10px;
                ">

                    <i
                        class="fa-solid fa-car-side"
                        style="
                            color:#ffe500;
                            font-size:27px;
                            margin-bottom:8px;
                        ">
                    </i>

                    <p>
                        No ride requests right now.
                    </p>

                </div>

            `;

            rideCount.textContent =
                "0 requests";

            return;

        }


        rideCount.textContent =
            rides.size +
            (
                rides.size === 1
                    ? " request"
                    : " requests"
            );


        rides.forEach(
            (ride,id)=>{

                if(
                    ride.status !== "searching" &&
                    ride.status !== "REQUESTED"
                )
                    return;


                requestsContent.appendChild(
                    createRequestCard(
                        id,
                        ride
                    )
                );

            }
        );

    }


    const unsub1 =
        onSnapshot(
            searchingQuery,
            snapshot=>{

                snapshot.forEach(
                    snap=>{

                        rides.set(
                            snap.id,
                            snap.data()
                        );

                    }
                );


                const ids =
                    new Set(
                        snapshot.docs.map(
                            d=>d.id
                        )
                    );


                [...rides.keys()]
                    .forEach(
                        id=>{

                            if(
                                !ids.has(id) &&
                                rides.get(id)?.status === "searching"
                            ){

                                rides.delete(id);

                            }

                        }
                    );


                render();

                updateRequestMapMarkers(
                    rides
                );

            },
            error=>{

                console.error(
                    "Searching listener:",
                    error
                );

            }
        );


    const unsub2 =
        onSnapshot(
            requestedQuery,
            snapshot=>{

                snapshot.forEach(
                    snap=>{

                        rides.set(
                            snap.id,
                            snap.data()
                        );

                    }
                );


                const ids =
                    new Set(
                        snapshot.docs.map(
                            d=>d.id
                        )
                    );


                [...rides.keys()]
                    .forEach(
                        id=>{

                            if(
                                !ids.has(id) &&
                                rides.get(id)?.status === "REQUESTED"
                            ){

                                rides.delete(id);

                            }

                        }
                    );


                render();

                updateRequestMapMarkers(
                    rides
                );

            },
            error=>{

                console.error(
                    "Requested listener:",
                    error
                );

            }
        );


    requestUnsub =
        ()=>{
            unsub1();
            unsub2();
        };

}

/* =========================================================

========================================================= */

let requestMarkers = new Map();


function clearRequestMapMarkers(){

    requestMarkers.forEach(
        marker=>{
            map.removeLayer(
                marker
            );
        }
    );


    requestMarkers.clear();

}


function updateRequestMapMarkers(
    rides
){

    if(!map)
        return;


    clearRequestMapMarkers();


    rides.forEach(
        (ride,id)=>{

            if(
                ride.status !== "searching" &&
                ride.status !== "REQUESTED"
            )
                return;


            const pickup =
                ride.pickup;


            if(
                !pickup ||
                pickup.lat == null ||
                pickup.lng == null
            )
                return;


            const marker =
                L.circleMarker(
                    [
                        Number(pickup.lat),
                        Number(pickup.lng)
                    ],
                    {
                        radius:9,
                        color:"#fff",
                        weight:2,
                        fillColor:"#22c55e",
                        fillOpacity:.9
                    }
                )
                .addTo(map);


            marker.bindPopup(
                `
                <div style="
                    color:#111;
                    min-width:180px;
                    font-family:Poppins,Arial;
                ">

                    <strong>
                        RiderX Ride Request
                    </strong>

                    <br><br>

                    <b>Pickup:</b>
                    ${escapeHtml(
                        getLocationText(
                            ride.pickup
                        )
                    )}

                    <br><br>

                    <b>Drop:</b>
                    ${escapeHtml(
                        getLocationText(
                            ride.drop
                        )
                    )}

                    <br><br>

                    <b>Fare:</b>
                    ₹${Number(
                        ride.fare || 0
                    )}

                    <br><br>

                    <button
                        onclick="acceptRide('${id}')"
                        style="
                            width:100%;
                            padding:8px;
                            background:#ffe500;
                            border:0;
                            border-radius:8px;
                            font-weight:800;
                        "
                    >
                        Accept Ride
                    </button>

                </div>
                `
            );


            requestMarkers.set(
                id,
                marker
            );

        }
    );

}

/* =========================================================
   ACCEPT RIDE
========================================================= */

window.acceptRide =
async function(
    rideId
){

    if(!currentUser){

        showToast(
            "Please login again.",
            "error"
        );

        return;

    }


    showLoading(
        "Accepting ride..."
    );


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        /*
         * Transaction prevents two riders
         * accepting the same ride.
         */

        await runTransaction(
            db,
            async(transaction)=>{

                const snap =
                    await transaction.get(
                        rideRef
                    );


                if(!snap.exists()){

                    throw new Error(
                        "Ride no longer exists."
                    );

                }


                const ride =
                    snap.data();


                if(
                    ride.status !== "searching" &&
                    ride.status !== "REQUESTED"
                ){

                    throw new Error(
                        "This ride has already been accepted."
                    );

                }


                transaction.update(
                    rideRef,
                    {

                        status:"ACCEPTED",

                        riderId:
                            currentUser.uid,

                        acceptedAt:
                            serverTimestamp(),

                        riderLocation:
                            riderLat != null
                                ?
                                {
                                    lat:riderLat,
                                    lng:riderLng
                                }
                                :
                                null

                    }
                );

            }
        );


        activeRideId =
            rideId;


        stopRideRequests();


        closeRequestsPanel();


        showToast(
            "Ride accepted!",
            "success"
        );


        await loadActiveRide(
            rideId
        );


        openNavigationToPickup();


    }
    catch(error){

        console.error(
            "Accept ride:",
            error
        );


        showToast(
            error.message ||
            "Unable to accept ride.",
            "error"
        );

    }
    finally{

        hideLoading();

    }

};


/* =========================================================
   ACTIVE RIDE LISTENER
========================================================= */

function listenForActiveRide(){

    if(activeRideUnsub){

        activeRideUnsub();

    }


    const q =
        query(
            collection(
                db,
                "rides"
            ),
            where(
                "riderId",
                "==",
                currentUser.uid
            )
        );


    activeRideUnsub =
        onSnapshot(
            q,
            snapshot=>{

                let activeFound =
                    false;


                snapshot.forEach(
                    snap=>{

                        const ride =
                            snap.data();


                        if(
                            ride.status === "ACCEPTED" ||
                            ride.status === "STARTED"
                        ){

                            activeFound =
                                true;


                            activeRideId =
                                snap.id;


                            activeRideData =
                                ride;


                            showActiveRide(
                                snap.id,
                                ride
                            );


                            drawNavigationRoute();

                        }

                    }
                );


                if(!activeFound){

                    activeRideId =
                        null;

                    activeRideData =
                        null;

                    activePanel.classList.remove(
                        "show"
                    );


                    clearRoute();

                }

            },
            error=>{

                console.error(
                    "Active ride listener:",
                    error
                );

            }
        );

}

   LOAD ACTIVE RIDE

async function loadActiveRide(
    rideId
){

    const snap =
        await getDoc(
            doc(
                db,
                "rides",
                rideId
            )
        );


    if(!snap.exists()){

        showToast(
            "Ride not found.",
            "error"
        );

        return;

    }


    activeRideData =
        snap.data();


    activeRideId =
        rideId;


    showActiveRide(
        rideId,
        activeRideData
    );


    drawNavigationRoute();

}


/* =========================================================
   SHOW ACTIVE RIDE
========================================================= */

function showActiveRide(
    rideId,
    ride
){

    activePanel.classList.add(
        "show"
    );


    const service =
        String(
            ride.serviceType ||
            ride.service ||
            "bike"
        ).toUpperCase();


    const customer =
        ride.customerName ||
        ride.customer?.name ||
        "RiderX Customer";


    const pickup =
        getLocationText(
            ride.pickup
        );


    const drop =
        getLocationText(
            ride.drop
        );


    const fare =
        Number(
            ride.riderFare ??
            ride.driverFare ??
            ride.earnings ??
            ride.fare ??
            0
        );


    const distance =
        Number(
            ride.distance ||
            ride.estimatedDistance ||
            0
        );


    const pickupKm =
        riderLat != null &&
        riderLng != null &&
        ride.pickup?.lat != null &&
        ride.pickup?.lng != null

        ?

        calculateDistance(
            riderLat,
            riderLng,
            Number(ride.pickup.lat),
            Number(ride.pickup.lng)
        )

        :

        0;


    const status =
        String(
            ride.status || ""
        ).toUpperCase();


    const started =
        status === "STARTED";


    activeRideContent.innerHTML = `

        <div class="active-status">

            ${started
                ? "RIDE IN PROGRESS"
                : "GOING TO PICKUP"
            }

        </div>


        <div class="active-customer">

            <i
                class="fa-solid fa-user"
                style="color:#ffe500;margin-right:5px">
            </i>

            ${escapeHtml(customer)}

            <div
                style="
                    color:#777;
                    font-size:9px;
                    margin-top:2px;
                "
            >
                ${escapeHtml(service)} Ride
            </div>

        </div>


        <div class="active-route">

            <div class="active-route-row">

                <i
                    style="
                        background:#12351f;
                        color:#22c55e;
                    "
                >
                    <i class="fa-solid fa-location-dot"></i>
                </i>

                <div>

                    <small>
                        PICKUP
                    </small>

                    <span>
                        ${escapeHtml(pickup)}
                    </span>

                </div>

            </div>


            <div class="active-route-row">

                <i
                    style="
                        background:#3b3500;
                        color:#ffe500;
                    "
                >
                    <i class="fa-solid fa-flag-checkered"></i>
                </i>

                <div>

                    <small>
                        DROP
                    </small>

                    <span>
                        ${escapeHtml(drop)}
                    </span>

                </div>

            </div>

        </div>


        <div class="active-stats">

            <div class="active-stat">

                <small>
                    Pickup
                </small>

                <strong>
                    ${pickupKm.toFixed(1)} KM
                </strong>

            </div>


            <div class="active-stat">

                <small>
                    Ride
                </small>

                <strong>
                    ${distance.toFixed(1)} KM
                </strong>

            </div>


            <div class="active-stat">

                <small>
                    Status
                </small>

                <strong>
                    ${started
                        ? "STARTED"
                        : "PICKUP"
                    }
                </strong>

            </div>

        </div>


        <div class="active-fare">

            <div>

                <small>
                    Your Earning
                </small>

                <div
                    style="
                        color:#aaa;
                        font-size:9px;
                    "
                >
                    ${escapeHtml(
                        String(
                            ride.paymentMethod ||
                            "Cash"
                        ).toUpperCase()
                    )}
                </div>

            </div>

            <strong>
                ₹${fare}
            </strong>

        </div>


        <div class="active-actions">

            <button
                class="action-btn navigate-btn"
                onclick="openCurrentNavigation('${rideId}')"
            >

                <i class="fa-solid fa-location-arrow"></i>

                ${
                    started
                        ? "Navigate to Drop"
                        : "Navigate to Pickup"
                }

            </button>


            ${
                !started
                ?

                `
                <button
                    class="action-btn start-btn"
                    onclick="startRide('${rideId}')"
                >

                    <i class="fa-solid fa-play"></i>

                    Start Ride

                </button>
                `

                :

                `
                <button
                    class="action-btn complete-btn"
                    onclick="completeRide('${rideId}')"
                >

                    <i class="fa-solid fa-check-double"></i>

                    Complete Ride

                </button>
                `
            }

        </div>

    `;

}


/* =========================================================
   START RIDE
========================================================= */

window.startRide =
async function(
    rideId
){

    if(!currentUser)
        return;


    if(
        !activeRideData ||
        activeRideId !== rideId
    ){

        await loadActiveRide(
            rideId
        );

    }


    showLoading(
        "Starting ride..."
    );


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const snap =
            await getDoc(
                rideRef
            );


        if(!snap.exists()){

            throw new Error(
                "Ride not found."
            );

        }


        const ride =
            snap.data();


        if(
            ride.riderId !==
            currentUser.uid
        ){

            throw new Error(
                "This ride is not assigned to you."
            );

        }


        if(
            ride.status !== "ACCEPTED"
        ){

            throw new Error(
                "Ride cannot be started now."
            );

        }


        await updateDoc(
            rideRef,
            {

                status:"STARTED",

                startedAt:
                    serverTimestamp(),

                riderLocation:
                    riderLat != null
                    ?
                    {
                        lat:riderLat,
                        lng:riderLng
                    }
                    :
                    null

            }
        );


        showToast(
            "Ride started. Navigate to drop.",
            "success"
        );


        activeRideData = {

            ...ride,

            status:"STARTED"

        };


        showActiveRide(
            rideId,
            activeRideData
        );


        drawNavigationRoute();


        setTimeout(
            ()=>{
                openNavigationToDrop();
            },
            500
        );


    }
    catch(error){

        console.error(
            "Start ride:",
            error
        );


        showToast(
            error.message ||
            "Unable to start ride.",
            "error"
        );

    }
    finally{

        hideLoading();

    }

};


/* =========================================================
   COMPLETE RIDE
========================================================= */

window.completeRide =
async function(
    rideId
){

    if(!currentUser)
        return;


    const confirmed =
        confirm(
            "Complete this ride?"
        );


    if(!confirmed)
        return;


    showLoading(
        "Completing ride..."
    );


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const snap =
            await getDoc(
                rideRef
            );


        if(!snap.exists()){

            throw new Error(
                "Ride not found."
            );

        }


        const ride =
            snap.data();


        if(
            ride.riderId !==
            currentUser.uid
        ){

            throw new Error(
                "This ride is not assigned to you."
            );

        }


        if(
            ride.status !== "STARTED"
        ){

            throw new Error(
                "Start the ride before completing it."
            );

        }


        await updateDoc(
            rideRef,
            {

                status:"COMPLETED",

                completedAt:
                    serverTimestamp(),

                finalRiderLocation:
                    riderLat != null
                    ?
                    {
                        lat:riderLat,
                        lng:riderLng
                    }
                    :
                    null

            }
        );


        clearRoute();


        activeRideId =
            null;

        activeRideData =
            null;


        activePanel.classList.remove(
            "show"
        );


        showToast(
            "Ride completed successfully!",
            "success"
        );


        if(isOnline){

            listenForRideRequests();

            setTimeout(
                ()=>{
                    openRequestsPanel();
                },
                500
            );

        }


    }
    catch(error){

        console.error(
            "Complete ride:",
            error
        );


        showToast(
            error.message ||
            "Unable to complete ride.",
            "error"
        );

    }
    finally{

        hideLoading();

    }

};


/* =========================================================
   NAVIGATION - PICKUP
========================================================= */

function openNavigationToPickup(){

    if(
        !activeRideData ||
        !activeRideData.pickup
    ){

        showToast(
            "Pickup location unavailable.",
            "error"
        );

        return;

    }


    openExternalNavigation(
        activeRideData.pickup
    );

}


/* =========================================================
   NAVIGATION - DROP
========================================================= */

function openNavigationToDrop(){

    if(
        !activeRideData ||
        !activeRideData.drop
    ){

        showToast(
            "Drop location unavailable.",
            "error"
        );

        return;

    }


    openExternalNavigation(
        activeRideData.drop
    );

}


/* =========================================================
   CURRENT NAVIGATION
========================================================= */

window.openCurrentNavigation =
function(
    rideId
){

    if(
        !activeRideData ||
        activeRideId !== rideId
    ){

        showToast(
            "Loading ride...",
            "error"
        );

        return;

    }


    const status =
        String(
            activeRideData.status || ""
        ).toUpperCase();


    if(status === "STARTED"){

        openNavigationToDrop();

    }
    else{

        openNavigationToPickup();

    }

};


/* =========================================================
   EXTERNAL GOOGLE MAP NAVIGATION
========================================================= */

function openExternalNavigation(
    location
){

    if(
        !location ||
        location.lat == null ||
        location.lng == null
    ){

        showToast(
            "Navigation coordinates unavailable.",
            "error"
        );

        return;

    }


    let origin = "";


    if(
        riderLat != null &&
        riderLng != null
    ){

        origin =
            riderLat +
            "," +
            riderLng;

    }


    const destination =
        Number(location.lat) +
        "," +
        Number(location.lng);


    const url =
        "https://www.google.com/maps/dir/?api=1" +
        (
            origin
                ? "&origin=" +
                    encodeURIComponent(origin)
                : ""
        ) +
        "&destination=" +
        encodeURIComponent(destination) +
        "&travelmode=driving";


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   IN-APP ROUTE
   OSRM
========================================================= */

async function drawNavigationRoute(){

    if(
        !map ||
        !activeRideData
    )
        return;


    const status =
        String(
            activeRideData.status || ""
        ).toUpperCase();


    const destination =
        status === "STARTED"
            ? activeRideData.drop
            : activeRideData.pickup;


    if(
        !destination ||
        destination.lat == null ||
        destination.lng == null ||
        riderLat == null ||
        riderLng == null
    )
        return;


    try{

        const url =
            "https://router.project-osrm.org/route/v1/driving/" +

            riderLng +
            "," +
            riderLat +
            ";" +

            Number(destination.lng) +
            "," +
            Number(destination.lat) +

            "?overview=full&geometries=geojson";


        const response =
            await fetch(
                url
            );


        if(!response.ok)
            return;


        const data =
            await response.json();


        if(
            !data.routes ||
            !data.routes.length
        )
            return;


        const coordinates =
            data.routes[0]
                .geometry
                .coordinates
                .map(
                    point=>[
                        point[1],
                        point[0]
                    ]
                );


        routePoints =
            coordinates;


        if(routeLine){

            map.removeLayer(
                routeLine
            );

        }


        routeLine =
            L.polyline(
                coordinates,
                {
                    color:"#ffe500",
                    weight:6,
                    opacity:.85
                }
            ).addTo(map);


        if(
            coordinates.length
        ){

            map.fitBounds(
                routeLine.getBounds(),
                {
                    padding:[
                        70,
                        70
                    ]
                }
            );

        }

    }
    catch(error){

        console.warn(
            "OSRM route error:",
            error
        );

    }

}


/* =========================================================
   CLEAR ROUTE
========================================================= */

function clearRoute(){

    if(
        routeLine &&
        map
    ){

        map.removeLayer(
            routeLine
        );

    }


    routeLine =
        null;

    routePoints =
        [];

}


/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371;


    const dLat =
        (lat2-lat1) *
        Math.PI /
        180;


    const dLon =
        (lon2-lon1) *
        Math.PI /
        180;


    const a =
        Math.sin(
            dLat/2
        ) *
        Math.sin(
            dLat/2
        )

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(
            dLon/2
        ) *
        Math.sin(
            dLon/2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;

}


/* =========================================================
   LOCATION TEXT
========================================================= */

function getLocationText(
    location
){

    if(!location)
        return "Location unavailable";


    if(
        typeof location ===
        "string"
    ){

        return location;

    }


    return (

        location.address ||

        location.name ||

        location.location ||

        (
            location.lat != null &&
            location.lng != null

                ?

                `${location.lat}, ${location.lng}`

                :

                "Location unavailable"
        )

    );

}


/* =========================================================
   REQUEST PANEL CONTROLS
========================================================= */

function openRequestsPanel(){

    if(
        activeRideData &&
        (
            activeRideData.status === "ACCEPTED" ||
            activeRideData.status === "STARTED"
        )
    )
        return;


    requestsPanel.classList.add(
        "open"
    );

}


function closeRequestsPanel(){

    requestsPanel.classList.remove(
        "open"
    );

}


document
    .querySelector(
        ".panel-handle"
    )
    .addEventListener(
        "click",
        ()=>{

            if(
                requestsPanel.classList.contains(
                    "open"
                )
            ){

                closeRequestsPanel();

            }
            else{

                openRequestsPanel();

            }

        }
    );


document
    .querySelector(
        ".panel-header"
    )
    .addEventListener(
        "click",
        ()=>{

            if(
                requestsPanel.classList.contains(
                    "open"
                )
            ){

                closeRequestsPanel();

            }
            else{

                openRequestsPanel();

            }

        }
    );


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        stopLocationTracking();

        stopRideRequests();


        if(activeRideUnsub){

            activeRideUnsub();

        }


        if(userProfileUnsub){

            userProfileUnsub();

        }

    }
);


/* =========================================================
   INITIAL MAP
========================================================= */

initMap();

</script>
