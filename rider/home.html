<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>


<link rel="stylesheet" href="../assets/app.css">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>


body{

margin:0;
background:#000;
color:white;
font-family:Arial,sans-serif;

}



.header{

height:70px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;

}



.logo{

font-size:30px;
font-weight:900;

}


.logo span{

color:#FFD600;

}



.status{

padding:20px;

}



.online-btn{

width:100%;
padding:16px;
border-radius:15px;
border:none;
font-size:18px;
font-weight:bold;
background:#FFD600;
color:#000;

}



.card{

background:#111;
margin:15px;
padding:20px;
border-radius:20px;
border:1px solid #333;

}



.card h3{

color:#FFD600;

}



.ride-buttons{

display:flex;
gap:10px;

}



.accept{

flex:1;
background:#FFD600;
color:#000;
padding:14px;
border:none;
border-radius:12px;
font-weight:bold;

}



.reject{

flex:1;
background:#222;
color:white;
border:1px solid #555;
border-radius:12px;

}



.earning{

display:flex;
justify-content:space-between;
background:#111;
margin:15px;
padding:20px;
border-radius:20px;

}



.amount{

color:#FFD600;
font-size:25px;
font-weight:bold;

}



.bottom{

position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 0;

}



.bottom div{

text-align:center;
font-size:12px;
color:#aaa;

}



</style>


</head>



<body>



<header class="header">


<div class="logo">

RID<span>ERX</span>

</div>


<i class="fa-solid fa-user"></i>


</header>







<div class="status">


<button id="onlineBtn" class="online-btn">

🟢 Go Online

</button>


</div>







<div class="earning">


<div>

Today's Earning

</div>


<div class="amount">

₹0

</div>


</div>








<div class="card">


<h3>

New Ride Request

</h3>


<p>

Customer: Waiting...

</p>


<p>

Pickup: Chandigarh

</p>


<p>

Drop: Destination

</p>


<p>

Fare: ₹120

</p>




<div class="ride-buttons">


<button class="accept" id="acceptRide">

Accept

</button>


<button class="reject">

Reject

</button>



</div>



</div>








<div class="card">


<h3>

Ride OTP

</h3>


<p>

Customer OTP:

<strong>

0000

</strong>

</p>


</div>







<div class="bottom">


<div>

<i class="fa-solid fa-house"></i>

<br>

Home

</div>



<div>

<i class="fa-solid fa-clock"></i>

<br>

Rides

</div>




<div>

<i class="fa-solid fa-wallet"></i>

<br>

Wallet

</div>




<div>

<i class="fa-solid fa-user"></i>

<br>

Profile

</div>



</div>







<script>


let online=false;



document
.getElementById("onlineBtn")
.onclick=function(){


online=!online;



if(online){


this.innerHTML="🔴 Go Offline";

alert(
"You are Online. Waiting for rides..."
);


}

else{


this.innerHTML="🟢 Go Online";


}



};





document
.getElementById("acceptRide")
.onclick=function(){


alert(
"Ride Accepted. Start OTP verification."
);


};





</script>




</body>

</html>
