<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RiderX | Rider Home</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
 --y:#ffd600;--g:#22c55e;--r:#ef4444;--bg:#050505;--card:#111;
 --border:#2d2d2d;--muted:#777;--white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff}
button,input{font:inherit}button{cursor:pointer}
button:disabled{opacity:.55}
#map{position:fixed;inset:0;z-index:1;background:#111}
.leaflet-control-zoom{margin-top:145px!important;margin-right:10px!important}
.leaflet-control-zoom a{background:#111!important;color:var(--y)!important;border-color:#333!important}
.leaflet-control-attribution{font-size:8px!important}

.topbar{position:fixed;top:0;left:0;right:0;z-index:1500;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none}
.toprow{display:flex;justify-content:space-between;align-items:center}
.logo{background:#080808f5;border:1px solid #333;border-radius:15px;padding:8px 16px;font-size:19px;font-weight:900}
.logo span{color:var(--y)}
.top-actions{display:flex;gap:8px}
.top-btn{width:44px;height:44px;border:1px solid #333;border-radius:50%;background:#080808f5;color:#fff;pointer-events:auto}
.notification-wrap{position:relative}
.notification-dot{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--r);display:none}

.online-control{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 58px);left:12px;right:12px;z-index:1400;max-width:500px;margin:auto;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;background:#070707f5;border:1px solid #333;border-radius:18px;box-shadow:0 9px 30px #0008}
.online-info{display:flex;align-items:center;gap:9px}
.online-dot{width:11px;height:11px;border-radius:50%;background:#666}
.online-dot.online{background:var(--g);box-shadow:0 0 14px #22c55ecc}
.online-title{font-size:12px;font-weight:900}
.online-sub{font-size:8px;color:#777}
.online-btn{border:0;border-radius:11px;padding:9px 13px;background:var(--y);color:#000;font-size:9px;font-weight:900}
.online-btn.offline{background:var(--r);color:#fff}

.location-btn{position:fixed;right:13px;bottom:calc(28vh + 82px);z-index:1300;width:47px;height:47px;border:1px solid #444;border-radius:50%;background:#111;color:var(--y)}
.navigation-banner{position:fixed;left:12px;right:12px;top:calc(max(10px,env(safe-area-inset-top)) + 115px);z-index:1350;display:none;padding:11px 13px;background:#070707f7;border:1px solid var(--y);border-radius:17px}
.navigation-banner.show{display:block}
.nav-title{color:var(--y);font-size:9px;font-weight:900}
.nav-distance{font-size:20px;font-weight:900}
.nav-sub{font-size:8px;color:#888}

.sheet{position:fixed;left:0;right:0;bottom:68px;z-index:1200;max-height:43vh;overflow:auto;padding:8px 13px 15px;background:#070707fa;border-top:1px solid #292929;border-radius:24px 24px 0 0}
.handle{width:43px;height:4px;margin:0 auto 10px;background:#444;border-radius:20px}
.sheet-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.sheet-title{font-size:16px;font-weight:900}
.request-count{font-size:8px;color:#777}
.empty{padding:20px 14px;text-align:center;background:#111;border:1px solid #252525;border-radius:17px;color:#777;font-size:10px}
.empty i{display:block;margin-bottom:8px;color:var(--y);font-size:25px}

.request-card,.active-card{margin-bottom:9px;padding:12px;background:#131313;border:1px solid #393939;border-radius:18px}
.request-top,.active-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge{padding:4px 8px;border-radius:8px;background:var(--y);color:#000;font-size:7px;font-weight:900}
.new-badge{color:var(--g);font-size:8px;font-weight:900}
.customer-name{margin-bottom:8px;font-size:14px;font-weight:800}
.route,.active-route{padding:9px;background:#080808;border:1px solid #222;border-radius:13px}
.route-row{display:flex;gap:9px;align-items:flex-start}
.route-row+.route-row{margin-top:8px}
.route-icon{width:23px;height:23px;min-width:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px}
.pick-icon{background:#12351f;color:var(--g)}
.drop-icon{background:#3a3200;color:var(--y)}
.route-label{font-size:7px;color:#666;text-transform:uppercase}
.route-address{font-size:9px;color:#eee;line-height:1.35;word-break:break-word}
.request-info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.request-info-box{padding:7px;text-align:center;background:#0a0a0a;border:1px solid #222;border-radius:9px}
.request-info-box small{display:block;color:#666;font-size:6px}
.request-info-box strong{font-size:9px}
.earning-box,.active-fare{margin-top:8px;padding:9px;display:flex;align-items:center;justify-content:space-between;background:#1c1800;border:1px solid #4c4300;border-radius:13px}
.earning-label{font-size:8px;color:#aaa}
.earning,.active-fare strong{font-size:21px;font-weight:900;color:var(--y)}
.request-actions,.active-actions,.contact-actions{display:grid;grid-template-columns:1fr 2fr;gap:7px;margin-top:8px}
.reject-btn,.accept,.action-btn,.contact-btn{padding:11px 6px;border-radius:11px;font-size:9px;font-weight:900}
.reject-btn{border:1px solid #552222;background:#291010;color:#f66}
.accept{border:0;background:var(--y);color:#000}
.active-card{border-color:var(--g)}
.active-title{color:var(--g);font-size:13px;font-weight:900}
.active-status{padding:4px 8px;border-radius:8px;background:#12351f;color:var(--g);font-size:7px;font-weight:900}
.customer-box{display:flex;align-items:center;gap:10px;padding:9px;background:#0b0b0b;border:1px solid #222;border-radius:13px}
.customer-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#222;color:var(--y)}
.customer-info{flex:1}
.customer-info strong{display:block;font-size:11px}
.customer-info small{font-size:7px;color:#777}
.contact-actions{grid-template-columns:1fr 1fr}
.call-btn{border:1px solid #244f34;background:#12351f;color:var(--g)}
.chat-btn{border:1px solid #4c4300;background:#181800;color:var(--y)}
.active-actions{grid-template-columns:1fr 1fr}
.nav-btn{background:#222;color:#fff;border:1px solid #444}
.start-btn{background:var(--g);color:#000;border:0}
.complete-btn{grid-column:1/-1;background:var(--g);color:#000;border:0}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;z-index:2000;display:grid;grid-template-columns:repeat(4,1fr);background:#080808fa;border-top:1px solid #292929}
.nav-item{border:0;background:transparent;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:8px;font-weight:700}
.nav-item i{font-size:18px}.nav-item.active{color:var(--y)}

.chat-overlay{position:fixed;inset:0;z-index:5000;display:none;align-items:flex-end;background:#000b}
.chat-overlay.show{display:flex}
.chat-box{width:100%;height:82vh;display:flex;flex-direction:column;background:#0b0b0b;border-radius:24px 24px 0 0}
.chat-header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #292929}
.chat-back{width:37px;height:37px;border-radius:50%;border:1px solid #333;background:#151515;color:#fff}
.chat-person{flex:1}.chat-person strong{display:block;font-size:12px}.chat-person small{font-size:7px;color:#777}
.chat-call{width:38px;height:38px;border:0;border-radius:50%;background:#12351f;color:var(--g)}
.chat-messages{flex:1;overflow:auto;padding:13px}.chat-empty{text-align:center;padding-top:30px;color:#666;font-size:10px}
.message{max-width:78%;margin-bottom:8px;padding:8px 10px;border-radius:13px;font-size:10px;word-break:break-word}
.message.mine{margin-left:auto;background:#3a3200}.message.theirs{background:#1b1b1b}
.message-time{display:block;margin-top:3px;color:#777;font-size:6px}
.chat-input-row{display:flex;gap:7px;padding:9px;border-top:1px solid #292929}
.chat-input{flex:1;padding:10px;border:1px solid #333;border-radius:13px;background:#151515;color:#fff;outline:0;font-size:10px}
.chat-send{width:43px;border:0;border-radius:13px;background:var(--y);color:#000}

.toast{position:fixed;left:50%;bottom:82px;z-index:7000;max-width:90%;padding:9px 14px;border:1px solid #444;border-radius:12px;background:#222;font-size:10px;text-align:center;opacity:0;transform:translate(-50%,20px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.success{border-color:var(--g)}.toast.error{border-color:var(--r)}
.loading{position:fixed;inset:0;z-index:8000;display:none;align-items:center;justify-content:center;background:#000b}
.loading.show{display:flex}.loading-box{padding:24px 32px;text-align:center;background:#111;border:1px solid #333;border-radius:18px}
.loading-box i{color:var(--y);font-size:24px}.loading-box p{color:#aaa;font-size:10px;margin-top:9px}
@media(min-width:700px){
 .sheet,.bottom-nav{left:50%;right:auto;width:450px;transform:translateX(-50%)}
 .online-control{max-width:450px}.chat-box{width:450px;margin:auto}
}
</style>
</head>

<body>
<div id="map"></div>

<div class="topbar">
 <div class="toprow">
  <div class="logo">RIDER<span>X</span></div>
  <div class="top-actions">
   <button id="notificationBtn" class="top-btn"><span class="notification-wrap"><i class="fa-solid fa-bell"></i><span id="notificationDot" class="notification-dot"></span></span></button>
   <button id="profileTopBtn" class="top-btn"><i class="fa-solid fa-user"></i></button>
  </div>
 </div>
</div>

<div class="online-control">
 <div class="online-info">
  <div id="onlineDot" class="online-dot"></div>
  <div><div id="onlineTitle" class="online-title">Offline</div><div id="onlineSub" class="online-sub">Go online to receive rides</div></div>
 </div>
 <button id="onlineBtn" class="online-btn" type="button">GO ONLINE</button>
</div>

<div id="navigationBanner" class="navigation-banner">
 <div id="navigationTitle" class="nav-title">NAVIGATING</div>
 <div id="navigationDistance" class="nav-distance">--</div>
 <div id="navigationSub" class="nav-sub">--</div>
</div>

<button id="locationBtn" class="location-btn"><i class="fa-solid fa-location-crosshairs"></i></button>

<section class="sheet">
 <div class="handle"></div>

 <div id="requestsArea">
  <div class="sheet-title-row">
   <div class="sheet-title">Ride Requests</div>
   <div id="requestCount" class="request-count">0 requests</div>
  </div>
  <div id="requestsContainer"></div>
 </div>

 <div id="activeArea" style="display:none">
  <div class="sheet-title-row">
   <div class="sheet-title">Active Ride</div>
   <div class="request-count">Current trip</div>
  </div>
  <div id="activeContainer"></div>
 </div>
</section>

<nav class="bottom-nav">
 <button class="nav-item active" id="homeNav"><i class="fa-solid fa-house"></i><span>Home</span></button>
 <button class="nav-item" id="ridesNav"><i class="fa-solid fa-route"></i><span>Rides</span></button>
 <button class="nav-item" id="walletNav"><i class="fa-solid fa-wallet"></i><span>Wallet</span></button>
 <button class="nav-item" id="profileNav"><i class="fa-solid fa-user"></i><span>Profile</span></button>
</nav>

<div id="chatOverlay" class="chat-overlay">
 <div class="chat-box">
  <div class="chat-header">
   <button id="chatBack" class="chat-back"><i class="fa-solid fa-arrow-left"></i></button>
   <div class="chat-person"><strong id="chatCustomerName">Customer</strong><small>RiderX customer</small></div>
   <button id="chatCall" class="chat-call"><i class="fa-solid fa-phone"></i></button>
  </div>
  <div id="chatMessages" class="chat-messages"></div>
  <div class="chat-input-row">
   <input id="chatInput" class="chat-input" maxlength="500" placeholder="Type message..." autocomplete="off">
   <button id="chatSend" class="chat-send"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
 </div>
</div>

<div id="toast" class="toast"></div>
<div id="loading" class="loading"><div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i><p id="loadingText">Please wait...</p></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import {auth,db} from "../firebase/firebase-config.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
 collection,query,where,onSnapshot,doc,getDoc,updateDoc,setDoc,
 serverTimestamp,addDoc,orderBy,runTransaction
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* ---------------- STATE ---------------- */
let user=null,userData={},riderData={};
let map=null,riderMarker=null,accuracyCircle=null;
let riderLocation=null,watchId=null,isOnline=false;
let requestUnsub=null,activeUnsub=null,restoreUnsub=null,chatUnsub=null;
let activeRideId=null,activeRide=null;
let rejected=new Set(),requestMarkers=new Map(),previousIds=new Set();
let target=null,targetMarker=null,routeLine=null,routeTimer=null;
let audio=null;

/* ---------------- HELPERS ---------------- */
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const status=v=>String(v||"").trim().toLowerCase();

function toast(t,type="success"){
 $("toast").textContent=t;
 $("toast").className=`toast show ${type}`;
 clearTimeout(toast.t);
 toast.t=setTimeout(()=>$("toast").className="toast",3000);
}
function loading(v,t="Please wait..."){
 $("loadingText").textContent=t;
 $("loading").classList.toggle("show",v);
}
function go(p){location.href=p}

function locationData(v){
 if(!v)return {text:"Location unavailable",lat:null,lng:null};
 if(typeof v==="string")return {text:v,lat:null,lng:null};
 const lat=v.lat??v.latitude??v.coordinates?.lat??v.location?.lat??null;
 const lng=v.lng??v.longitude??v.coordinates?.lng??v.location?.lng??null;
 return {
  text:v.address||v.name||v.text||v.label||v.formattedAddress||"Location",
  lat:lat!==null?Number(lat):null,lng:lng!==null?Number(lng):null
 };
}

/* ---------------- MAP ---------------- */
function initMap(){
 if(map)return;
 map=L.map("map",{zoomControl:true,attributionControl:true});
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,attribution:"© OpenStreetMap"
 }).addTo(map);

 /*
   IMPORTANT:
   No Chandigarh/default coordinate is used here.
   Map remains neutral until real GPS is received.
 */
 map.setView([20,78],5);
}

function riderIcon(){
 return L.divIcon({
  className:"",
  html:`<div style="width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffd600;color:#000;border:4px solid #fff;box-shadow:0 5px 18px #0007;font-size:20px"><i class="fa-solid fa-motorcycle"></i></div>`,
  iconSize:[46,46],iconAnchor:[23,23]
 });
}

function updateRiderMarker(lat,lng,accuracy=0,center=false){
 lat=Number(lat);lng=Number(lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lng))return;

 const first=!riderLocation;
 riderLocation={lat,lng};

 if(!riderMarker)
  riderMarker=L.marker([lat,lng],{icon:riderIcon(),zIndexOffset:1000}).addTo(map);
 else riderMarker.setLatLng([lat,lng]);

 if(accuracy>0){
  if(!accuracyCircle)
   accuracyCircle=L.circle([lat,lng],{radius:accuracy,color:"#ffd600",fillColor:"#ffd600",fillOpacity:.08,weight:1}).addTo(map);
  else{
   accuracyCircle.setLatLng([lat,lng]);
   accuracyCircle.setRadius(accuracy);
  }
 }

 /* First valid GPS fixes the map to the rider, not Chandigarh. */
 if(first||center){
  map.setView([lat,lng],16,{animate:true});
 }
 if(target) updateNavigationDistance();
}

function gpsOnce(center=true){
 if(!navigator.geolocation)return toast("GPS is not available.","error");
 navigator.geolocation.getCurrentPosition(
  p=>updateRiderMarker(p.coords.latitude,p.coords.longitude,p.coords.accuracy,center),
  e=>toast(e.code===1?"Please allow location permission.":"Unable to get your location.","error"),
  {enableHighAccuracy:true,maximumAge:3000,timeout:15000}
 );
}

function startGPS(){
 if(!navigator.geolocation)return toast("GPS is not available.","error");
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);

 watchId=navigator.geolocation.watchPosition(async p=>{
  updateRiderMarker(p.coords.latitude,p.coords.longitude,p.coords.accuracy,false);
  if(isOnline&&user)await saveLocation(p.coords.latitude,p.coords.longitude);
 },e=>{
  if(e.code===1)toast("Please allow location permission.","error");
 },{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
}

function stopGPS(){
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 watchId=null;
}

async function saveLocation(lat,lng){
 const location={lat:Number(lat),lng:Number(lng)};
 for(const path of ["users","riders"]){
  try{
   await setDoc(doc(db,path,user.uid),{
    location,lat:location.lat,lng:location.lng,
    isOnline:true,updatedAt:serverTimestamp()
   },{merge:true});
  }catch(e){console.warn(path,e)}
 }
}

/* ---------------- ONLINE ---------------- */
async function setOnline(v){
 if(!user)throw Error("NO_USER");
 const payload={isOnline:v,updatedAt:serverTimestamp()};
 await setDoc(doc(db,"users",user.uid),payload,{merge:true});
 await setDoc(doc(db,"riders",user.uid),{...payload,uid:user.uid},{merge:true});
}

function onlineUI(){
 $("onlineDot").classList.toggle("online",isOnline);
 $("onlineTitle").textContent=isOnline?"Online":"Offline";
 $("onlineSub").textContent=isOnline?"You can receive ride requests":"Go online to receive ride requests";
 $("onlineBtn").textContent=isOnline?"GO OFFLINE":"GO ONLINE";
 $("onlineBtn").classList.toggle("offline",isOnline);
}

$("onlineBtn").onclick=async()=>{
 if(!user)return toast("Please login first.","error");
 $("onlineBtn").disabled=true;
 try{
  loading(true,isOnline?"Going offline...":"Going online...");
  if(isOnline){
   isOnline=false;stopRequests();clearRequestMarkers();
   await setOnline(false);onlineUI();showOffline();
  }else{
   await setOnline(true);isOnline=true;onlineUI();
   startGPS();gpsOnce(false);listenRequests();
  }
  toast(isOnline?"You are now ONLINE.":"You are now OFFLINE.");
 }catch(e){console.error(e);toast("Unable to change online status.","error")}
 finally{loading(false);$("onlineBtn").disabled=false}
};

function showOffline(){
 $("requestCount").textContent="0 requests";
 $("requestsContainer").innerHTML=`<div class="empty"><i class="fa-solid fa-power-off"></i>Go online to receive ride requests.</div>`;
}

/* ---------------- REQUESTS ---------------- */
function stopRequests(){
 if(requestUnsub){requestUnsub();requestUnsub=null}
 previousIds.clear();
}

function listenRequests(){
 stopRequests();
 if(!user||!isOnline||activeRideId)return;

 requestUnsub=onSnapshot(
  query(collection(db,"rides"),where("status","==","searching")),
  snap=>{
   const rides=[];
   const ids=new Set();

   snap.forEach(s=>{
    const r=s.data();
    if(r.riderId&&r.riderId!==user.uid)return;
    if(rejected.has(s.id))return;
    rides.push({...r,id:s.id});ids.add(s.id);
   });

   rides.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));

   const fresh=rides.some(r=>!previousIds.has(r.id));
   previousIds=ids;
   renderRequests(rides);
   if(fresh)requestSound();
  },
  e=>{console.error(e);toast("Ride requests unavailable.","error")}
 );
}

function renderRequests(rides){
 $("requestCount").textContent=`${rides.length} request${rides.length===1?"":"s"}`;
 if(!rides.length){
  $("requestsContainer").innerHTML=`<div class="empty"><i class="fa-solid fa-motorcycle"></i>Waiting for ride requests...</div>`;
  clearRequestMarkers();return;
 }

 $("requestsContainer").innerHTML=rides.map(requestCard).join("");

 rides.forEach(r=>{
  $(`accept-${r.id}`)?.addEventListener("click",()=>acceptRide(r.id));
  $(`reject-${r.id}`)?.addEventListener("click",()=>rejectRide(r.id));
 });
 renderRequestMarkers(rides);
}

function requestCard(r){
 const customer=r.customerName||r.userName||r.name||"Customer";
 const p=locationData(r.pickup||r.pickupLocation);
 const d=locationData(r.dropoff||r.dropoffLocation||r.destination);
 const fare=Number(r.fare??r.estimatedFare??r.amount??0);
 const distance=Number(r.distance??r.distanceKm??0);
 const service=String(r.serviceType||r.service||"Bike");
 const payment=String(r.paymentMethod||"cash").toUpperCase();

 return `<div class="request-card">
  <div class="request-top"><span class="badge">${esc(service)}</span><span class="new-badge">NEW RIDE</span></div>
  <div class="customer-name">${esc(customer)}</div>
  <div class="route">
   <div class="route-row"><div class="route-icon pick-icon"><i class="fa-solid fa-circle"></i></div><div><div class="route-label">Pickup</div><div class="route-address">${esc(p.text)}</div></div></div>
   <div class="route-row"><div class="route-icon drop-icon"><i class="fa-solid fa-location-dot"></i></div><div><div class="route-label">Drop</div><div class="route-address">${esc(d.text)}</div></div></div>
  </div>
  <div class="request-info">
   <div class="request-info-box"><small>DISTANCE</small><strong>${Number.isFinite(distance)?distance.toFixed(1):"0.0"} KM</strong></div>
   <div class="request-info-box"><small>SERVICE</small><strong>${esc(service)}</strong></div>
   <div class="request-info-box"><small>PAYMENT</small><strong>${esc(payment)}</strong></div>
  </div>
  <div class="earning-box"><div class="earning-label">Estimated earning</div><div class="earning">₹${fare.toFixed(0)}</div></div>
  <div class="request-actions">
   <button id="reject-${esc(r.id)}" class="reject-btn">REJECT</button>
   <button id="accept-${esc(r.id)}" class="accept">ACCEPT RIDE</button>
  </div>
 </div>`;
}

function rejectRide(id){
 rejected.add(id);
 const m=requestMarkers.get(id);
 if(m){map.removeLayer(m);requestMarkers.delete(id)}
 toast("Ride rejected.");
}

function renderRequestMarkers(rides){
 const active=new Set();
 rides.forEach(r=>{
  const p=locationData(r.pickup||r.pickupLocation);
  if(p.lat===null||p.lng===null)return;
  active.add(r.id);
  if(requestMarkers.has(r.id)){
   requestMarkers.get(r.id).setLatLng([p.lat,p.lng]);return;
  }
  const m=L.marker([p.lat,p.lng],{
   icon:L.divIcon({
    className:"",
    html:`<div style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#111;color:#ffd600;border:3px solid #ffd600"><i class="fa-solid fa-user"></i></div>`,
    iconSize:[38,38],iconAnchor:[19,19]
   })
  }).addTo(map);
  m.bindPopup(`<strong>Ride Request</strong><br>${esc(r.customerName||r.userName||"Customer")}`);
  requestMarkers.set(r.id,m);
 });
 requestMarkers.forEach((m,id)=>{
  if(!active.has(id)){map.removeLayer(m);requestMarkers.delete(id)}
 });
}

function clearRequestMarkers(){
 requestMarkers.forEach(m=>{try{map.removeLayer(m)}catch(e){}});
 requestMarkers.clear();
}

/* ---------------- ACCEPT ---------------- */
async function acceptRide(id){
 if(!user||activeRideId)return;
 loading(true,"Accepting ride...");
 try{
  const ref=doc(db,"rides",id);
  let accepted=null;

  await runTransaction(db,async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists())throw Error("NOT_FOUND");
   const r=snap.data();
   if(status(r.status)!=="searching")throw Error("TAKEN");
   if(r.riderId&&r.riderId!==user.uid)throw Error("TAKEN");

   const name=userData.name||userData.fullName||riderData.name||user.displayName||"Rider";
   const phone=userData.phone||riderData.phone||user.phoneNumber||"";

   tx.update(ref,{
    status:"accepted",riderId:user.uid,riderName:name,riderPhone:phone,
    acceptedAt:serverTimestamp()
   });
   accepted={...r,id,status:"accepted",riderId:user.uid,riderName:name,riderPhone:phone};
  });

  activeRideId=id;activeRide=accepted;
  stopRequests();clearRequestMarkers();showActive();listenActive();
  toast("Ride accepted!");
  startNavigation("pickup");
 }catch(e){
  console.error(e);
  toast(e.message==="TAKEN"?"Another rider accepted this ride.":"Unable to accept ride.","error");
 }finally{loading(false)}
}

/* ---------------- ACTIVE RIDE ---------------- */
function stopActive(){
 if(activeUnsub){activeUnsub();activeUnsub=null}
}

function listenActive(){
 stopActive();
 if(!activeRideId)return;
 activeUnsub=onSnapshot(doc(db,"rides",activeRideId),snap=>{
  if(!snap.exists()){finishLocal();return}
  activeRide={...snap.data(),id:snap.id};
  const s=status(activeRide.status);
  if(["completed","cancelled","canceled"].includes(s)){finishLocal(s==="completed");return}
  showActive();
 },e=>console.error(e));
}

function showActive(){
 if(!activeRide){showRequests();return}
 $("requestsArea").style.display="none";
 $("activeArea").style.display="block";

 const c=activeRide.customerName||activeRide.userName||"Customer";
 const p=locationData(activeRide.pickup||activeRide.pickupLocation);
 const d=locationData(activeRide.dropoff||activeRide.dropoffLocation||activeRide.destination);
 const fare=Number(activeRide.fare??activeRide.estimatedFare??activeRide.amount??0);
 const s=status(activeRide.status||"accepted");

 let buttons=`<button id="pickupNavBtn" class="action-btn nav-btn"><i class="fa-solid fa-route"></i> PICKUP</button>
 <button id="dropNavBtn" class="action-btn nav-btn"><i class="fa-solid fa-location-arrow"></i> DROP</button>`;

 if(["accepted","arriving"].includes(s))
  buttons+=`<button id="startRideBtn" class="action-btn start-btn"><i class="fa-solid fa-play"></i> START RIDE</button>`;
 if(["started","in_progress","ongoing"].includes(s))
  buttons+=`<button id="completeRideBtn" class="action-btn complete-btn"><i class="fa-solid fa-flag-checkered"></i> COMPLETE RIDE</button>`;

 $("activeContainer").innerHTML=`<div class="active-card">
  <div class="active-header"><div class="active-title">Active Ride</div><div class="active-status">${esc(s.toUpperCase())}</div></div>
  <div class="customer-box"><div class="customer-avatar"><i class="fa-solid fa-user"></i></div><div class="customer-info"><strong>${esc(c)}</strong><small>RiderX customer</small></div></div>
  <div class="contact-actions">
   <button id="callCustomerBtn" class="contact-btn call-btn"><i class="fa-solid fa-phone"></i> CALL</button>
   <button id="chatCustomerBtn" class="contact-btn chat-btn"><i class="fa-solid fa-message"></i> CHAT</button>
  </div>
  <div class="active-route">
   <div class="route-row"><div class="route-icon pick-icon"><i class="fa-solid fa-circle"></i></div><div><div class="route-label">Pickup</div><div class="route-address">${esc(p.text)}</div></div></div>
   <div class="route-row"><div class="route-icon drop-icon"><i class="fa-solid fa-location-dot"></i></div><div><div class="route-label">Drop</div><div class="route-address">${esc(d.text)}</div></div></div>
  </div>
  <div class="active-fare"><div class="earning-label">Ride Fare</div><strong>₹${fare.toFixed(0)}</strong></div>
  <div class="active-actions">${buttons}</div>
 </div>`;

 $("callCustomerBtn").onclick=callCustomer;
 $("chatCustomerBtn").onclick=openChat;
 $("pickupNavBtn").onclick=()=>startNavigation("pickup");
 $("dropNavBtn").onclick=()=>startNavigation("drop");
 $("startRideBtn")?.addEventListener("click",startRide);
 $("completeRideBtn")?.addEventListener("click",completeRide);
}

function showRequests(){
 $("requestsArea").style.display="block";
 $("activeArea").style.display="none";
}

/*
  START RIDE:
  This updates ride state only.
  Customer OTP verification can be added here if the customer
  booking flow stores a ride-start OTP.
*/
async function startRide(){
 if(!activeRideId)return;
 loading(true,"Starting ride...");
 try{
  await updateDoc(doc(db,"rides",activeRideId),{
   status:"started",startedAt:serverTimestamp()
  });
  toast("Ride started!");
  startNavigation("drop");
 }catch(e){console.error(e);toast("Unable to start ride.","error")}
 finally{loading(false)}
}

async function completeRide(){
 if(!activeRideId)return;
 if(!confirm("Complete this ride?"))return;
 loading(true,"Completing ride...");
 try{
  await updateDoc(doc(db,"rides",activeRideId),{
   status:"completed",completedAt:serverTimestamp()
  });
  finishLocal(true);
 }catch(e){console.error(e);toast("Unable to complete ride.","error")}
 finally{loading(false)}
}

function finishLocal(completed=false){
 stopNavigation();stopActive();
 activeRide=null;activeRideId=null;
 showRequests();
 if(isOnline)listenRequests();
 if(completed)toast("Ride completed successfully!");
}

/* ---------------- CALL / CHAT ---------------- */
function customerPhone(){
 return activeRide?.customerPhone||activeRide?.userPhone||activeRide?.phone||activeRide?.customer?.phone||"";
}
function callCustomer(){
 const p=customerPhone();
 if(!p)return toast("Customer phone number unavailable.","error");
 location.href=`tel:${p}`;
}
function openChat(){
 if(!activeRideId)return toast("No active ride.","error");
 $("chatCustomerName").textContent=activeRide.customerName||activeRide.userName||"Customer";
 $("chatOverlay").classList.add("show");
 listenChat();
}
function closeChat(){
 $("chatOverlay").classList.remove("show");
 if(chatUnsub){chatUnsub();chatUnsub=null}
}
$("chatBack").onclick=closeChat;
$("chatCall").onclick=callCustomer;

function listenChat(){
 if(chatUnsub)chatUnsub();
 chatUnsub=onSnapshot(
  query(collection(db,"rides",activeRideId,"messages"),orderBy("createdAt","asc")),
  snap=>{
   if(snap.empty){
    $("chatMessages").innerHTML=`<div class="chat-empty">Start conversation with customer.</div>`;return;
   }
   $("chatMessages").innerHTML=snap.docs.map(s=>{
    const m=s.data(),mine=m.senderId===user.uid;
    const time=m.createdAt?.toDate?.().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})||"";
    return `<div class="message ${mine?"mine":"theirs"}">${esc(m.text)}<span class="message-time">${esc(time)}</span></div>`;
   }).join("");
   $("chatMessages").scrollTop=$("chatMessages").scrollHeight;
  },
  e=>console.error(e)
 );
}

async function sendMessage(){
 const input=$("chatInput"),text=input.value.trim();
 if(!text||!activeRideId||!user)return;
 input.value="";
 try{
  await addDoc(collection(db,"rides",activeRideId,"messages"),{
   text,senderId:user.uid,senderRole:"rider",
   senderName:userData.name||riderData.name||"Rider",
   createdAt:serverTimestamp()
  });
 }catch(e){input.value=text;toast("Message could not be sent.","error")}
}
$("chatSend").onclick=sendMessage;
$("chatInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}};

/* ---------------- NAVIGATION ---------------- */
function distance(a,b,c,d){
 const R=6371,rad=Math.PI/180;
 const x=(c-a)*rad,y=(d-b)*rad;
 const z=Math.sin(x/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(y/2)**2;
 return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z));
}

async function startNavigation(type){
 if(!activeRide)return toast("No active ride.","error");
 if(!riderLocation){gpsOnce(false);return toast("Waiting for your location...","error")}

 const v=type==="pickup"?(activeRide.pickup||activeRide.pickupLocation):(activeRide.dropoff||activeRide.dropoffLocation||activeRide.destination);
 const t=locationData(v);
 if(t.lat===null||t.lng===null)return toast("Destination coordinates unavailable.","error");

 target={lat:t.lat,lng:t.lng,text:t.text,type};
 $("navigationTitle").textContent=type==="pickup"?"GO TO PICKUP":"GO TO DROP";
 $("navigationSub").textContent=t.text||"Destination";
 $("navigationBanner").classList.add("show");

 if(targetMarker)map.removeLayer(targetMarker);
 targetMarker=L.marker([t.lat,t.lng],{
  icon:L.divIcon({
   className:"",
   html:`<div style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#000;color:#ffd600;border:3px solid #ffd600;font-size:16px"><i class="fa-solid fa-location-dot"></i></div>`,
   iconSize:[40,40],iconAnchor:[20,20]
  }),zIndexOffset:900
 }).addTo(map);

 await drawRoute();
 updateNavigationDistance();

 clearInterval(routeTimer);
 routeTimer=setInterval(()=>{if(target&&riderLocation){drawRoute();updateNavigationDistance()}},15000);
}

async function drawRoute(){
 if(!target||!riderLocation)return;
 if(routeLine){map.removeLayer(routeLine);routeLine=null}

 try{
  const u=`https://router.project-osrm.org/route/v1/driving/${riderLocation.lng},${riderLocation.lat};${target.lng},${target.lat}?overview=full&geometries=geojson`;
  const r=await fetch(u);
  if(!r.ok)throw Error("route");
  const data=await r.json(),route=data.routes?.[0];
  if(!route)throw Error("route");

  const coords=route.geometry.coordinates.map(x=>[x[1],x[0]]);
  routeLine=L.polyline(coords,{color:"#ffd600",weight:6,opacity:.9}).addTo(map);
  map.fitBounds(routeLine.getBounds(),{padding:[80,80],maxZoom:17});
  $("navigationDistance").textContent=`${(route.distance/1000).toFixed(1)} km`;
 }catch(e){
  routeLine=L.polyline([[riderLocation.lat,riderLocation.lng],[target.lat,target.lng]],{
   color:"#ffd600",weight:6,opacity:.9,dashArray:"12 8"
  }).addTo(map);
  map.fitBounds(routeLine.getBounds(),{padding:[70,70],maxZoom:16});
 }
}

function updateNavigationDistance(){
 if(!target||!riderLocation)return;
 $("navigationDistance").textContent=`${distance(riderLocation.lat,riderLocation.lng,target.lat,target.lng).toFixed(1)} km`;
}
function stopNavigation(){
 target=null;clearInterval(routeTimer);
 if(routeLine){try{map.removeLayer(routeLine)}catch(e){}routeLine=null}
 if(targetMarker){try{map.removeLayer(targetMarker)}catch(e){}targetMarker=null}
 $("navigationBanner").classList.remove("show");
}

/* ---------------- SOUND ---------------- */
function requestSound(){
 try{
  audio??=new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const n=audio.currentTime;
  [0,.18,.36].forEach((o,i)=>{
   const osc=audio.createOscillator(),g=audio.createGain();
   osc.frequency.value=i===1?880:660;osc.type="sine";
   g.gain.setValueAtTime(.0001,n+o);
   g.gain.exponentialRampToValueAtTime(.18,n+o+.03);
   g.gain.exponentialRampToValueAtTime(.0001,n+o+.15);
   osc.connect(g);g.connect(audio.destination);
   osc.start(n+o);osc.stop(n+o+.16);
  });
 }catch(e){}
}

/* ---------------- RESTORE ---------------- */
async function loadUser(){
 userData={};riderData={};
 try{
  const s=await getDoc(doc(db,"users",user.uid));
  if(s.exists())userData=s.data();
 }catch(e){}
 try{
  const s=await getDoc(doc(db,"riders",user.uid));
  if(s.exists())riderData=s.data();
 }catch(e){}
}

async function restoreActive(){
 if(restoreUnsub)restoreUnsub();
 restoreUnsub=onSnapshot(
  query(collection(db,"rides"),where("riderId","==",user.uid)),
  snap=>{
   let found=null,best=-1;
   snap.forEach(s=>{
    const r=s.data(),st=status(r.status);
    if(!["accepted","arriving","started","in_progress","ongoing"].includes(st))return;
    const sec=r.acceptedAt?.seconds||r.startedAt?.seconds||r.createdAt?.seconds||0;
    if(sec>=best){best=sec;found={...r,id:s.id}}
   });

   if(found){
    const changed=activeRideId!==found.id;
    activeRideId=found.id;activeRide=found;
    stopRequests();showActive();
    if(changed)listenActive();
   }else if(!activeRideId){
    showRequests();if(isOnline)listenRequests();
   }
  },
  e=>console.warn("restore",e)
 );
}

/* ---------------- BUTTONS ---------------- */
$("locationBtn").onclick=()=>riderLocation?map.setView([riderLocation.lat,riderLocation.lng],16,{animate:true}):gpsOnce(true);
$("homeNav").onclick=()=>riderLocation&&map.setView([riderLocation.lat,riderLocation.lng],16,{animate:true});
$("ridesNav").onclick=()=>go("rides.html");
$("walletNav").onclick=()=>go("wallet.html");
$("profileNav").onclick=()=>go("profile.html");
$("profileTopBtn").onclick=()=>go("profile.html");
$("notificationBtn").onclick=()=>{ $("notificationDot").style.display="none";go("notifications.html") };

/* ---------------- AUTH ---------------- */
onAuthStateChanged(auth,async u=>{
 if(!u){location.href="../auth/login.html";return}
 user=u;
 try{
  initMap();
  await loadUser();

  isOnline=Boolean(userData.isOnline||riderData.isOnline);
  onlineUI();

  /*
    GPS starts for both online/offline so the map always follows
    the rider's real location. Firebase publishing happens only online.
  */
  startGPS();
  gpsOnce(true);

  await restoreActive();

  if(isOnline)listenRequests();
  else showOffline();

 }catch(e){
  console.error("Rider home:",e);
  toast("Unable to load rider account.","error");
 }
});

/* ---------------- INITIAL ---------------- */
initMap();
onlineUI();
showOffline();

window.addEventListener("beforeunload",()=>{
 stopGPS();stopRequests();stopActive();
 if(restoreUnsub)restoreUnsub();
 if(chatUnsub)chatUnsub();
 clearInterval(routeTimer);
});
</script>
