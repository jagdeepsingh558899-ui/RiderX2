<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>RiderX | Rider Home</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
 --y:#ffd600;
 --g:#22c55e;
 --r:#ef4444;
 --bg:#050505;
 --card:#111;
 --border:#2d2d2d;
 --muted:#777;
 --white:#fff;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Poppins,Arial,sans-serif;
 -webkit-tap-highlight-color:transparent;
}

html,
body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--bg);
 color:#fff;
}

button,
input{
 font:inherit;
}

button{
 cursor:pointer;
}

button:disabled{
 opacity:.55;
 cursor:not-allowed;
}

#map{
 position:fixed;
 inset:0;
 z-index:1;
 background:#111;
}

.leaflet-control-zoom{
 margin-top:145px!important;
 margin-right:10px!important;
}

.leaflet-control-zoom a{
 background:#111!important;
 color:var(--y)!important;
 border-color:#333!important;
}

.leaflet-control-attribution{
 font-size:8px!important;
}

.topbar{
 position:fixed;
 top:0;
 left:0;
 right:0;
 z-index:1500;
 padding:max(10px,env(safe-area-inset-top)) 12px 0;
 pointer-events:none;
}

.toprow{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.logo{
 background:#080808f5;
 border:1px solid #333;
 border-radius:15px;
 padding:8px 16px;
 font-size:19px;
 font-weight:900;
}

.logo span{
 color:var(--y);
}

.top-actions{
 display:flex;
 gap:8px;
}

.top-btn{
 width:44px;
 height:44px;
 border:1px solid #333;
 border-radius:50%;
 background:#080808f5;
 color:#fff;
 pointer-events:auto;
}

.notification-wrap{
 position:relative;
 display:inline-flex;
}

.notification-dot{
 position:absolute;
 right:-3px;
 top:-3px;
 width:9px;
 height:9px;
 border-radius:50%;
 background:var(--r);
 display:none;
}

.online-control{
 position:fixed;
 top:calc(max(10px,env(safe-area-inset-top)) + 58px);
 left:12px;
 right:12px;
 z-index:1400;
 max-width:500px;
 margin:auto;
 padding:10px 12px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:#070707f5;
 border:1px solid #333;
 border-radius:18px;
 box-shadow:0 9px 30px #0008;
}

.online-info{
 display:flex;
 align-items:center;
 gap:9px;
}

.online-dot{
 width:11px;
 height:11px;
 border-radius:50%;
 background:#666;
}

.online-dot.online{
 background:var(--g);
 box-shadow:0 0 14px #22c55ecc;
}

.online-title{
 font-size:12px;
 font-weight:900;
}

.online-sub{
 font-size:8px;
 color:#777;
}

.online-btn{
 border:0;
 border-radius:11px;
 padding:9px 13px;
 background:var(--y);
 color:#000;
 font-size:9px;
 font-weight:900;
}

.online-btn.offline{
 background:var(--r);
 color:#fff;
}

.location-btn{
 position:fixed;
 right:13px;
 bottom:calc(28vh + 82px);
 z-index:1300;
 width:47px;
 height:47px;
 border:1px solid #444;
 border-radius:50%;
 background:#111;
 color:var(--y);
}

.navigation-banner{
 position:fixed;
 left:12px;
 right:12px;
 top:calc(max(10px,env(safe-area-inset-top)) + 115px);
 z-index:1350;
 display:none;
 padding:11px 13px;
 background:#070707f7;
 border:1px solid var(--y);
 border-radius:17px;
}

.navigation-banner.show{
 display:block;
}

.nav-title{
 color:var(--y);
 font-size:9px;
 font-weight:900;
}

.nav-distance{
 font-size:20px;
 font-weight:900;
}

.nav-sub{
 font-size:8px;
 color:#888;
}

.sheet{
 position:fixed;
 left:0;
 right:0;
 bottom:68px;
 z-index:1200;
 max-height:43vh;
 overflow:auto;
 padding:8px 13px 15px;
 background:#070707fa;
 border-top:1px solid #292929;
 border-radius:24px 24px 0 0;
}

.handle{
 width:43px;
 height:4px;
 margin:0 auto 10px;
 background:#444;
 border-radius:20px;
}

.sheet-title-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:9px;
}

.sheet-title{
 font-size:16px;
 font-weight:900;
}

.request-count{
 font-size:8px;
 color:#777;
}

.empty{
 padding:20px 14px;
 text-align:center;
 background:#111;
 border:1px solid #252525;
 border-radius:17px;
 color:#777;
 font-size:10px;
}

.empty i{
 display:block;
 margin-bottom:8px;
 color:var(--y);
 font-size:25px;
}

.request-card,
.active-card{
 margin-bottom:9px;
 padding:12px;
 background:#131313;
 border:1px solid #393939;
 border-radius:18px;
}

.request-top,
.active-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:8px;
}

.badge{
 padding:4px 8px;
 border-radius:8px;
 background:var(--y);
 color:#000;
 font-size:7px;
 font-weight:900;
}

.new-badge{
 color:var(--g);
 font-size:8px;
 font-weight:900;
}

.customer-name{
 margin-bottom:8px;
 font-size:14px;
 font-weight:800;
}

.route,
.active-route{
 padding:9px;
 background:#080808;
 border:1px solid #222;
 border-radius:13px;
}

.route-row{
 display:flex;
 gap:9px;
 align-items:flex-start;
}

.route-row+.route-row{
 margin-top:8px;
}

.route-icon{
 width:23px;
 height:23px;
 min-width:23px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:8px;
}

.pick-icon{
 background:#12351f;
 color:var(--g);
}

.drop-icon{
 background:#3a3200;
 color:var(--y);
}

.route-label{
 font-size:7px;
 color:#666;
 text-transform:uppercase;
}

.route-address{
 font-size:9px;
 color:#eee;
 line-height:1.35;
 word-break:break-word;
}

.request-info{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 margin-top:8px;
}

.request-info-box{
 padding:7px;
 text-align:center;
 background:#0a0a0a;
 border:1px solid #222;
 border-radius:9px;
}

.request-info-box small{
 display:block;
 color:#666;
 font-size:6px;
}

.request-info-box strong{
 font-size:9px;
}

.earning-box,
.active-fare{
 margin-top:8px;
 padding:9px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:#1c1800;
 border:1px solid #4c4300;
 border-radius:13px;
}

.earning-label{
 font-size:8px;
 color:#aaa;
}

.earning,
.active-fare strong{
 font-size:21px;
 font-weight:900;
 color:var(--y);
}

.request-actions,
.active-actions,
.contact-actions{
 display:grid;
 grid-template-columns:1fr 2fr;
 gap:7px;
 margin-top:8px;
}

.reject-btn,
.accept,
.action-btn,
.contact-btn{
 padding:11px 6px;
 border-radius:11px;
 font-size:9px;
 font-weight:900;
}

.reject-btn{
 border:1px solid #552222;
 background:#291010;
 color:#f66;
}

.accept{
 border:0;
 background:var(--y);
 color:#000;
}

.active-card{
 border-color:var(--g);
}

.active-title{
 color:var(--g);
 font-size:13px;
 font-weight:900;
}

.active-status{
 padding:4px 8px;
 border-radius:8px;
 background:#12351f;
 color:var(--g);
 font-size:7px;
 font-weight:900;
}

.customer-box{
 display:flex;
 align-items:center;
 gap:10px;
 padding:9px;
 background:#0b0b0b;
 border:1px solid #222;
 border-radius:13px;
}

.customer-avatar{
 width:40px;
 height:40px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#222;
 color:var(--y);
}

.customer-info{
 flex:1;
}

.customer-info strong{
 display:block;
 font-size:11px;
}

.customer-info small{
 font-size:7px;
 color:#777;
}

.contact-actions{
 grid-template-columns:1fr 1fr;
}

.call-btn{
 border:1px solid #244f34;
 background:#12351f;
 color:var(--g);
}

.chat-btn{
 border:1px solid #4c4300;
 background:#181800;
 color:var(--y);
}

.active-actions{
 grid-template-columns:1fr 1fr;
}

.nav-btn{
 background:#222;
 color:#fff;
 border:1px solid #444;
}

.start-btn{
 background:var(--g);
 color:#000;
 border:0;
}

.complete-btn{
 grid-column:1/-1;
 background:var(--g);
 color:#000;
 border:0;
}

.bottom-nav{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 height:68px;
 z-index:2000;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 background:#080808fa;
 border-top:1px solid #292929;
}

.nav-item{
 border:0;
 background:transparent;
 color:#777;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:4px;
 font-size:8px;
 font-weight:700;
}

.nav-item i{
 font-size:18px;
}

.nav-item.active{
 color:var(--y);
}

.chat-overlay{
 position:fixed;
 inset:0;
 z-index:5000;
 display:none;
 align-items:flex-end;
 background:#000b;
}

.chat-overlay.show{
 display:flex;
}

.chat-box{
 width:100%;
 height:82vh;
 display:flex;
 flex-direction:column;
 background:#0b0b0b;
 border-radius:24px 24px 0 0;
}

.chat-header{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px 14px;
 border-bottom:1px solid #292929;
}

.chat-back{
 width:37px;
 height:37px;
 border-radius:50%;
 border:1px solid #333;
 background:#151515;
 color:#fff;
}

.chat-person{
 flex:1;
}

.chat-person strong{
 display:block;
 font-size:12px;
}

.chat-person small{
 font-size:7px;
 color:#777;
}

.chat-call{
 width:38px;
 height:38px;
 border:0;
 border-radius:50%;
 background:#12351f;
 color:var(--g);
}

.chat-messages{
 flex:1;
 overflow:auto;
 padding:13px;
}

.chat-empty{
 text-align:center;
 padding-top:30px;
 color:#666;
 font-size:10px;
}

.message{
 max-width:78%;
 margin-bottom:8px;
 padding:8px 10px;
 border-radius:13px;
 font-size:10px;
 word-break:break-word;
}

.message.mine{
 margin-left:auto;
 background:#3a3200;
}

.message.theirs{
 background:#1b1b1b;
}

.message-time{
 display:block;
 margin-top:3px;
 color:#777;
 font-size:6px;
}

.chat-input-row{
 display:flex;
 gap:7px;
 padding:9px;
 border-top:1px solid #292929;
 padding-bottom:max(9px,env(safe-area-inset-bottom));
}

.chat-input{
 flex:1;
 padding:10px;
 border:1px solid #333;
 border-radius:13px;
 background:#151515;
 color:#fff;
 outline:0;
 font-size:10px;
}

.chat-send{
 width:43px;
 border:0;
 border-radius:13px;
 background:var(--y);
 color:#000;
}

.toast{
 position:fixed;
 left:50%;
 bottom:82px;
 z-index:7000;
 max-width:90%;
 padding:9px 14px;
 border:1px solid #444;
 border-radius:12px;
 background:#222;
 font-size:10px;
 text-align:center;
 opacity:0;
 transform:translate(-50%,20px);
 transition:.25s;
 pointer-events:none;
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

.toast.success{
 border-color:var(--g);
}

.toast.error{
 border-color:var(--r);
}

.loading{
 position:fixed;
 inset:0;
 z-index:8000;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000b;
}

.loading.show{
 display:flex;
}

.loading-box{
 padding:24px 32px;
 text-align:center;
 background:#111;
 border:1px solid #333;
 border-radius:18px;
}

.loading-box i{
 color:var(--y);
 font-size:24px;
}

.loading-box p{
 color:#aaa;
 font-size:10px;
 margin-top:9px;
}

@media(min-width:700px){
 .sheet,
 .bottom-nav{
  left:50%;
  right:auto;
  width:450px;
  transform:translateX(-50%);
 }

 .online-control{
  max-width:450px;
 }

 .chat-box{
  width:450px;
  margin:auto;
 }
}
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

/* ============================================================
   RIDERX 2.0
   RIDER HOME
   ============================================================

   FINAL RESPONSIBILITIES

   - Firebase Authentication
   - Rider profile loading
   - Rider online/offline state
   - Live GPS
   - Firestore ride requests
   - Atomic ride acceptance
   - Active ride restoration
   - Accepted / started / completed ride states
   - Firestore -> RTDB ride-state synchronization
   - Customer call
   - Ride chat
   - Leaflet map
   - OSRM navigation
   - Ride request sound
   - Route cleanup
   - Navigation cleanup

   IMPORTANT

   This file does not initialize Firebase itself.

   It uses the existing:
       ../firebase/firebase-config.js

   The existing Firebase app is reused for:
       Auth
       Firestore
       Realtime Database
   ============================================================ */


import {
 auth,
 db
} from "../firebase/firebase-config.js";


import {
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
 collection,
 query,
 where,
 onSnapshot,
 doc,
 getDoc,
 updateDoc,
 setDoc,
 serverTimestamp,
 addDoc,
 orderBy,
 runTransaction
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {
 getDatabase,
 ref as rtdbRef,
 update as rtdbUpdate
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* ============================================================
   STATE
   ============================================================ */

let user=null;

let userData={};
let riderData={};

let map=null;

let riderMarker=null;
let accuracyCircle=null;

let riderLocation=null;

let watchId=null;

let isOnline=false;

let requestUnsub=null;
let activeUnsub=null;
let restoreUnsub=null;
let chatUnsub=null;

let activeRideId=null;
let activeRide=null;

let rejected=new Set();

let requestMarkers=new Map();

let previousIds=new Set();

let target=null;
let targetMarker=null;
let routeLine=null;
let routeTimer=null;

let audio=null;

let realtimeDb=null;

/*
  GPS can fire every few seconds. Throttle database location
  writes and keep the frequent location channel in RTDB.
 */
let lastLocationWriteAt=0;
let locationWritePromise=null;
const LOCATION_WRITE_INTERVAL=10000;

let navigationToken=0;

let booted=false;


/* ============================================================
   DOM HELPER
   ============================================================ */

const $=id=>
 document.getElementById(id);


/* ============================================================
   TEXT ESCAPE
   ============================================================ */

function esc(value){

 return String(value??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* ============================================================
   STATUS NORMALIZATION
   ============================================================ */

function status(value){

 return String(value||"")
  .trim()
  .toLowerCase();

}


/* ============================================================
   TOAST
   ============================================================ */

function toast(message,type="success"){

 const el=$("toast");

 if(!el)return;

 el.textContent=message;

 el.className=
  `toast show ${type}`;

 clearTimeout(toast.timer);

 toast.timer=
  setTimeout(()=>{
   el.className="toast";
  },3000);

}


/* ============================================================
   LOADING
   ============================================================ */

function loading(show,message="Please wait..."){

 const el=$("loading");

 if(!el)return;

 $("loadingText").textContent=
  message;

 el.classList.toggle(
  "show",
  Boolean(show)
 );

}


/* ============================================================
   NAVIGATION
   ============================================================ */

function go(path){

 if(!path)return;

 location.href=path;

}


/* ============================================================
   LOCATION NORMALIZER
   ============================================================ */

function locationData(value){

 /*
   Normalize all location shapes used by RiderX:
   nested coordinates, pickup/destination coordinate
   fields, and plain address objects.
 */

 if(value===null || value===undefined){

  return {
   text:"Location unavailable",
   lat:null,
   lng:null
  };

 }

 if(typeof value==="string"){

  return {
   text:value,
   lat:null,
   lng:null
  };

 }

 if(typeof value!=="object"){

  return {
   text:String(value),
   lat:null,
   lng:null
  };

 }

 const latValue=[
  value.lat,
  value.latitude,
  value.coordinates?.lat,
  value.coordinates?.latitude,
  value.location?.lat,
  value.location?.latitude,
  value.pickupLat,
  value.pickupLatitude,
  value.destinationLat,
  value.destinationLatitude,
  value.dropoffLat,
  value.dropoffLatitude
 ].find(
  candidate=>
   candidate!==null &&
   candidate!==undefined &&
   candidate!==""
 );

 const lngValue=[
  value.lng,
  value.longitude,
  value.coordinates?.lng,
  value.coordinates?.longitude,
  value.location?.lng,
  value.location?.longitude,
  value.pickupLng,
  value.pickupLongitude,
  value.destinationLng,
  value.destinationLongitude,
  value.dropoffLng,
  value.dropoffLongitude
 ].find(
  candidate=>
   candidate!==null &&
   candidate!==undefined &&
   candidate!==""
 );

 const lat=Number(latValue);
 const lng=Number(lngValue);

 return {

  text:
   value.address ||
   value.name ||
   value.text ||
   value.label ||
   value.formattedAddress ||
   value.pickupAddress ||
   value.destinationAddress ||
   value.dropoffAddress ||
   "Location",

  lat:
   Number.isFinite(lat)
    ?lat
    :null,

  lng:
   Number.isFinite(lng)
    ?lng
    :null

 };

}


/* ============================================================
   FIREBASE APP / RTDB
   ============================================================ */

function initRealtimeDatabase(){

 if(realtimeDb){

  return realtimeDb;

 }


 try{

  /*
    Firebase Auth exposes the Firebase App
    through auth.app.

    This prevents creating a second Firebase app.
  */

  realtimeDb=
   getDatabase(auth.app);

  return realtimeDb;

 }catch(error){

  console.error(
   "RiderX RTDB initialization failed:",
   error
  );

  realtimeDb=null;

  return null;

 }

}

/* ============================================================
   FIRESTORE -> RTDB RIDE SYNCHRONIZATION
   ============================================================ */

async function syncRideToRealtime(
 rideId,
 payload={}
){

 if(!rideId){

  return false;

 }


 const realtime=
  initRealtimeDatabase();


 if(!realtime){

  console.warn(
   "RiderX RTDB unavailable."
  );

  return false;

 }


 try{

  const clean={};


  Object.entries(payload||{})
   .forEach(
    ([key,value])=>{

     /*
       RTDB does not accept undefined.
     */

     if(value!==undefined){

      clean[key]=value;

     }

    }
   );


  clean.rideId=
   String(rideId);


  clean.updatedAt=
   Date.now();


  await rtdbUpdate(
   rtdbRef(
    realtime,
    `rides/${rideId}`
   ),
   clean
  );


  return true;


 }catch(error){

  console.error(
   "RiderX RTDB ride sync failed:",
   error
  );

  return false;

 }

}

/* ============================================================
   UPDATE RIDER LOCATION
   ============================================================ */

function updateRiderMarker(
 lat,
 lng,
 accuracy=0,
 center=false
){

 lat=Number(lat);
 lng=Number(lng);

 if(
  !Number.isFinite(lat) ||
  !Number.isFinite(lng)
 ){

  return;

 }


 const first=
  !riderLocation;


 riderLocation={
  lat,
  lng
 };


 if(!riderMarker){

  riderMarker=
   L.marker(
    [lat,lng],
    {
     icon:riderIcon(),
     zIndexOffset:1000
    }
   ).addTo(map);

 }else{

  riderMarker.setLatLng(
   [lat,lng]
  );

 }


 if(
  Number.isFinite(
   Number(accuracy)
  ) &&
  Number(accuracy)>0
 ){

  if(!accuracyCircle){

   accuracyCircle=
    L.circle(
     [lat,lng],
     {
      radius:Number(accuracy),
      color:"#ffd600",
      fillColor:"#ffd600",
      fillOpacity:.08,
      weight:1
     }
    ).addTo(map);

  }else{

   accuracyCircle.setLatLng(
    [lat,lng]
   );

   accuracyCircle.setRadius(
    Number(accuracy)
   );

  }

 }


 if(first||center){

  map.setView(
   [lat,lng],
   16,
   {
    animate:true
   }
  );

 }


 if(target){

  updateNavigationDistance();

 }

}


/* ============================================================
   ONE-TIME GPS
   ============================================================ */

function gpsOnce(center=true){

 if(!navigator.geolocation){

  toast(
   "GPS is not available.",
   "error"
  );

  return;

 }


 navigator.geolocation.getCurrentPosition(

  position=>{

   updateRiderMarker(
    position.coords.latitude,
    position.coords.longitude,
    position.coords.accuracy,
    center
   );

  },

  error=>{

   console.warn(
    "GPS:",
    error
   );


   if(error.code===1){

    toast(
     "Please allow location permission.",
     "error"
    );

   }else{

    toast(
     "Unable to get your location.",
     "error"
    );

   }

  },

  {
   enableHighAccuracy:true,
   maximumAge:3000,
   timeout:15000
  }

 );

}


/* ============================================================
   START GPS WATCH
   ============================================================ */

function startGPS(){

 if(!navigator.geolocation){

  return;

 }


 if(watchId!==null){

  navigator.geolocation.clearWatch(
   watchId
  );

 }


 watchId=
  navigator.geolocation.watchPosition(

   async position=>{

    updateRiderMarker(
     position.coords.latitude,
     position.coords.longitude,
     position.coords.accuracy,
     false
    );


    if(
     isOnline &&
     user
    ){

     await saveLocation(
      position.coords.latitude,
      position.coords.longitude
     );

    }

   },

   error=>{

    console.warn(
     "GPS watch:",
     error
    );

   },

   {
    enableHighAccuracy:true,
    maximumAge:3000,
    timeout:15000
   }

  );

}


/* ============================================================
   STOP GPS
   ============================================================ */

function stopGPS(){

 if(watchId!==null){

  navigator.geolocation.clearWatch(
   watchId
  );

 }

 watchId=null;

}


/* ============================================================
   SAVE RIDER LOCATION
   ============================================================ */

async function saveLocation(
 lat,
 lng,
 force=false
){

 if(!user)return false;

 const latitude=Number(lat);
 const longitude=Number(lng);

 if(
  !Number.isFinite(latitude) ||
  !Number.isFinite(longitude) ||
  latitude < -90 ||
  latitude > 90 ||
  longitude < -180 ||
  longitude > 180
 ){
  return false;
 }

 const now=Date.now();

 if(
  !force &&
  now-lastLocationWriteAt<LOCATION_WRITE_INTERVAL
 ){
  return true;
 }

 if(locationWritePromise){
  return locationWritePromise;
 }

 const location={
  lat:latitude,
  lng:longitude
 };

 locationWritePromise=(async()=>{

  let firestoreSuccess=false;

  try{

   await setDoc(
    doc(db,"users",user.uid),
    {
     location,
     lat:location.lat,
     lng:location.lng,
     isOnline:true,
     updatedAt:serverTimestamp()
    },
    {merge:true}
   );

   firestoreSuccess=true;

  }catch(error){

   console.warn(
    "users location update:",
    error
   );

  }

  try{

   await setDoc(
    doc(db,"riders",user.uid),
    {
     uid:user.uid,
     location,
     lat:location.lat,
     lng:location.lng,
     isOnline:true,
     updatedAt:serverTimestamp()
    },
    {merge:true}
   );

  }catch(error){

   console.warn(
    "riders location update:",
    error
   );

  }

  const realtime=initRealtimeDatabase();

  if(realtime){

   try{

    await rtdbUpdate(
     rtdbRef(
      realtime,
      `riders/${user.uid}`
     ),
     {
      riderId:user.uid,
      riderUid:user.uid,
      lat:location.lat,
      lng:location.lng,
      isOnline:Boolean(isOnline),
      updatedAt:Date.now()
     }
    );

   }catch(error){

    console.warn(
     "RTDB rider location update:",
     error
    );

   }

  }

  lastLocationWriteAt=Date.now();

  return firestoreSuccess;

 })();

 try{

  return await locationWritePromise;

 }finally{

  locationWritePromise=null;

 }

}

/* ============================================================

   ============================================================ */

$("onlineBtn").onclick=
 async()=>{

  if(!user){

   toast(
    "Please login first.",
    "error"
   );

   return;

  }


  const previous=
   isOnline;


  $("onlineBtn").disabled=true;


  try{

   loading(
    true,
    previous
     ?"Going offline..."
     :"Going online..."
   );


   if(previous){

    /*
      Change local state only after the database
      operation succeeds.
    */

    await setOnline(false);

    isOnline=false;

    stopRequests();

    clearRequestMarkers();

    onlineUI();

    showOffline();


   }else{

    await setOnline(true);

    isOnline=true;

    onlineUI();

    startGPS();

    gpsOnce(false);

    /*
      Only request rides when there is no active ride.
    */

    if(!activeRideId){

     listenRequests();

    }

   }


   toast(
    isOnline
     ?"You are now ONLINE."
     :"You are now OFFLINE."
   );


  }catch(error){

   console.error(
    "Online state:",
    error
   );


   isOnline=previous;

   onlineUI();


   toast(
    "Unable to change online status.",
    "error"
   );


  }finally{

   loading(false);

   $("onlineBtn").disabled=false;

  }

 };


/* ============================================================
   STOP REQUEST LISTENER
   ============================================================ */

function stopRequests(){

 if(requestUnsub){

  requestUnsub();

  requestUnsub=null;

 }

 previousIds.clear();

}


/* ============================================================
   RIDE REQUEST LISTENER
   ============================================================ */

function listenRequests(){

 stopRequests();


 if(
  !user ||
  !isOnline ||
  activeRideId
 ){

  return;

 }


 requestUnsub=
  onSnapshot(

   query(
    collection(
     db,
     "rides"
    ),
    where(
     "status",
     "==",
     "searching"
    )
   ),

   snapshot=>{

    const rides=[];
    const ids=new Set();


    snapshot.forEach(
     rideSnapshot=>{

      const ride=
       rideSnapshot.data();


      /*
        If a request has already been reserved
        for another rider, hide it.

        If riderId is empty/missing, it is open.
      */

      if(
       ride.riderId &&
       ride.riderId!==user.uid
      ){

       return;

      }


      if(
       rejected.has(
        rideSnapshot.id
       )
      ){

       return;

      }


      rides.push({

       ...ride,

       id:rideSnapshot.id

      });


      ids.add(
       rideSnapshot.id
      );

     }
    );


    rides.sort(
     (a,b)=>{

      const aTime=
       a.createdAt?.seconds||
       a.createdAt?.toMillis?.()||
       0;


      const bTime=
       b.createdAt?.seconds||
       b.createdAt?.toMillis?.()||
       0;


      return bTime-aTime;

     }
    );


    const fresh=
     rides.some(
      ride=>
       !previousIds.has(
        ride.id
       )
     );


    previousIds=ids;


    renderRequests(
     rides
    );


    if(fresh){

     requestSound();

    }

   },

   error=>{

    console.error(
     "Ride request listener:",
     error
    );


    toast(
     "Ride requests unavailable.",
     "error"
    );

   }

  );

}

    Waiting for ride requests...

  clearRequestMarkers();

 $("requestsContainer").innerHTML=
  rides
   .map(requestCard)
   .join("");


 rides.forEach(
  ride=>{

    $(`accept-${ride.id}`);


   const reject=
    $(`reject-${ride.id}`);


   accept?.addEventListener(
    "click",
    ()=>acceptRide(
     ride.id
    )
   );


   reject?.addEventListener(
    "click",
    ()=>rejectRide(
     ride.id
    )
   );

  }
 );


 renderRequestMarkers(
  rides
 );

}

  requestMarkers.get(id);


 if(marker){

  try{

   map.removeLayer(
    marker
   );

  }catch(error){}


  requestMarkers.delete(
   id
  );

 }

  document.getElementById(
   `reject-${id}`
  )?.closest(

/* ============================================================
   ACCEPT RIDE
   ============================================================ */

async function acceptRide(id){

 if(
  !user||
  activeRideId||
  !id
 ){

  return;

 }


 loading(
  true,
  "Accepting ride..."
 );


 try{

  const rideRef=
   doc(
    db,
    "rides",
    id
   );


  let acceptedRide=null;


  /*
    Atomic transaction.

    Only one rider can change:
        searching -> accepted
  */

  await runTransaction(
   db,
   async transaction=>{

    const snapshot=
     await transaction.get(
      rideRef
     );


    if(!snapshot.exists()){

     throw new Error(
      "NOT_FOUND"
     );

    }


    const ride=
     snapshot.data();


    if(
     status(
      ride.status
     )!=="searching"
    ){

     throw new Error(
      "TAKEN"
     );

    }


    if(
     ride.riderId &&
     ride.riderId!==user.uid
    ){

     throw new Error(
      "TAKEN"
     );

    }


    const rider=
     getCurrentRiderInfo();


    transaction.update(
     rideRef,
     {
      status:"accepted",
      rideStatus:"accepted",

      riderId:rider.riderId,
      riderUid:rider.riderUid,

      riderName:rider.riderName,
      riderPhone:rider.riderPhone,

      acceptedAt:
       serverTimestamp(),

      updatedAt:
       serverTimestamp()
     }
    );


    acceptedRide={
     ...ride,

     id,

     status:"accepted",
     rideStatus:"accepted",

     riderId:rider.riderId,
     riderUid:rider.riderUid,

     riderName:rider.riderName,
     riderPhone:rider.riderPhone
    };

   }
  );


  /*
    Firestore succeeded.

    Mirror the exact important state to RTDB.
  */

  const rider=
   getCurrentRiderInfo();


  const realtimeSynced=
   await syncRideToRealtime(
    id,
    {

     riderId:rider.riderId,

      acceptedRide?.customerUid||
      acceptedRide?.userId||
      acceptedRide?.customer?.id||
      null,

     acceptedAt:Date.now()
    }
  );


  activeRideId=id;

   "error"

/* ============================================================
   ACTIVE RIDE LISTENER
   ============================================================ */

function listenActive(){

 stopActive();


 if(!activeRideId){

  return;

 }


 const rideId=
  activeRideId;


 activeUnsub=
  onSnapshot(

   doc(
    db,
    "rides",
    rideId
   ),

   snapshot=>{

    /*
      Ignore stale listener callbacks after a new
      ride has been selected.
    */

    if(
     activeRideId!==rideId
    ){

     return;

    }


    if(!snapshot.exists()){

     finishLocal(false);

     return;

    }


    activeRide={
     ...snapshot.data(),
     id:snapshot.id
    };


    const currentStatus=
     status(
      activeRide.status||
      activeRide.rideStatus
     );


    if(
     [
      "completed",
      "cancelled",
      "canceled"
     ].includes(
      currentStatus
     )
    ){

     finishLocal(
      currentStatus==="completed"
     );

     return;

    }


    showActive();

   },

   error=>{

    console.error(
     "Active ride listener:",
     error
    );

   }

  );

}

 );

  activeRideId;


 try{

   doc(

    rideId
   ),
   {
    status:"started",
    rideStatus:"started",

    startedAt:
     serverTimestamp(),

    updatedAt:
     serverTimestamp()
   }
  );

  */

  await syncRideToRealtime(
   rideId,
   {

   }
  );

   activeRide &&

/* ============================================================
   DISTANCE
   ============================================================ */

function distance(
 lat1,
 lng1,
 lat2,
 lng2
){

 const R=6371;

 const rad=
  Math.PI/180;


 const x=
  (lat2-lat1)*
  rad;


 const y=
  (lng2-lng1)*
  rad;


 const a=
  Math.sin(x/2)**2+
  Math.cos(lat1*rad)*
  Math.cos(lat2*rad)*
  Math.sin(y/2)**2;


 return R*
  2*
  Math.atan2(
   Math.sqrt(a),
   Math.sqrt(1-a)
  );

}

     ],

      20,

     ]

    }),

    zIndexOffset:900

   }
  ).addTo(map);


 await drawRoute();

 updateNavigationDistance();


 clearInterval(
  routeTimer
 );


 routeTimer=

    ){

  );

/* ============================================================
   DRAW ROUTE
   ============================================================ */

async function drawRoute(){

 const currentNavigationToken=
  navigationToken;

 const routeTarget=
  target;

 const routeOrigin=
  riderLocation;

 if(
  !routeTarget||
  !routeOrigin
 ){

  return;

 }


 if(routeLine){

  try{

   map.removeLayer(
    routeLine
   );

  }catch(error){}


  routeLine=null;

 }


 try{

  const url=
   `https://router.project-osrm.org/route/v1/driving/`+
   `${routeOrigin.lng},${routeOrigin.lat};`+
   `${routeTarget.lng},${routeTarget.lat}`+
   `?overview=full&geometries=geojson`;


  const response=
   await fetch(
    url,
    {
     method:"GET"
    }
   );


  if(!response.ok){

   throw new Error(
    "ROUTE_HTTP"
   );

  }


  const data=
   await response.json();


  if(
   currentNavigationToken!==navigationToken ||
   target!==routeTarget
  ){
   return;
  }

  const route=
   data.routes?.[0];


  if(!route){

   throw new Error(
    "ROUTE_EMPTY"
   );

  }


  const coordinates=
   route.geometry.coordinates
    .map(
     point=>[
      point[1],
      point[0]
     ]
    );


  routeLine=
   L.polyline(
    coordinates,
    {
     color:"#ffd600",
     weight:6,
     opacity:.9
    }
   ).addTo(map);


  map.fitBounds(
   routeLine.getBounds(),
   {
    padding:[
     80,
     80
    ],
    maxZoom:17
   }
  );


  $("navigationDistance").textContent=
   `${(
    route.distance/1000
   ).toFixed(1)} km`;


 }catch(error){

  if(
   currentNavigationToken!==navigationToken ||
   target!==routeTarget
  ){
   return;
  }

  console.warn(
   "OSRM route unavailable:",
   error
  );


  /*
    Fallback straight line.
  */

  routeLine=
   L.polyline(
    [
     [
      routeOrigin.lat,
      routeOrigin.lng
     ],
     [
      routeTarget.lat,
      routeTarget.lng
     ]
    ],
    {
     color:"#ffd600",
     weight:6,
     opacity:.9,
     dashArray:"12 8"
    }
   ).addTo(map);


  map.fitBounds(
   routeLine.getBounds(),
   {
    padding:[
     70,
     70
    ],
    maxZoom:16
   }
  );

 }

}

 const km=

/* ============================================================
   REQUEST SOUND
   ============================================================ */

function requestSound(){

 try{

  const AudioContext=
   window.AudioContext||
   window.webkitAudioContext;


  if(!AudioContext){

   return;

  }


  audio??=
   new AudioContext();


  if(
   audio.state==="suspended"
  ){

   audio.resume();

  }


  const start=
   audio.currentTime;


  [0,.18,.36]
   .forEach(
    (offset,index)=>{

     const oscillator=
      audio.createOscillator();


     const gain=
      audio.createGain();


     oscillator.frequency.value=
      index===1
       ?880
       :660;


     oscillator.type=
      "sine";


     gain.gain.setValueAtTime(
      .0001,
      start+offset
     );


     gain.gain.exponentialRampToValueAtTime(
      .18,
      start+offset+.03
     );


     gain.gain.exponentialRampToValueAtTime(
      .0001,
      start+offset+.15
     );


     oscillator.connect(
      gain
     );


     gain.connect(
      audio.destination
     );


     oscillator.start(
      start+offset
     );


     oscillator.stop(
      start+offset+.16
     );

    }
   );

 }catch(error){

  console.warn(
   "Ride sound:",
   error
  );

 }

}

   RESTORE ACTIVE RIDE
   ============================================================ */

function stopRestore(){

  restoreUnsub();

  restoreUnsub=null;

 }

}


/* ============================================================
   RESTORE ACTIVE RIDE
   ============================================================ */

function restoreActive(){

 stopRestore();


 if(!user){

  return;

 }


 restoreUnsub=
  onSnapshot(

   query(
    collection(
     db,
     "rides"
    ),
    where(
     "riderId",
     "==",
     user.uid
    )
   ),

   snapshot=>{

    /*
      Select the newest ride that is genuinely active.
    */

    let found=null;

    let best=-1;


    snapshot.forEach(
     rideSnapshot=>{

      const ride=
       rideSnapshot.data();


      const rideStatus=
       status(
        ride.status||
        ride.rideStatus
       );


      if(
       ![
        "accepted",
        "arriving",
        "started",
        "in_progress",
        "ongoing"
       ].includes(
        rideStatus
       )
      ){

       return;

      }


      const seconds=Math.max(
       ride.acceptedAt?.seconds||0,
       ride.startedAt?.seconds||0,
       ride.completedAt?.seconds||0,
       ride.updatedAt?.seconds||0,
       ride.createdAt?.seconds||0
      );


      if(seconds>=best){

       best=seconds;


       found={
        ...ride,
        id:rideSnapshot.id
       };

      }

     }
    );


    /*
      ACTIVE RIDE FOUND
    */

    if(found){

     const changed=
      activeRideId!==found.id;


     activeRideId=
      found.id;


     activeRide=
      found;


     stopRequests();

     showActive();


     if(changed){

      listenActive();

     }


     return;

    }


    /*
      NO ACTIVE RIDE FOUND.

      If a previous ride was active locally, clear it.
    */

    if(activeRideId){

     stopActive();

     stopNavigation();

     activeRideId=null;

     activeRide=null;

    }


    showRequests();


    if(isOnline){

     listenRequests();

    }else{

     showOffline();

    }

   },

   error=>{

    console.warn(
     "Restore active ride:",
     error
    );

   }

  );

}

/* ============================================================
   AUTH STATE
   ============================================================ */

onAuthStateChanged(
 auth,
 async authenticatedUser=>{

  if(!authenticatedUser){

   location.href=
    "../auth/login.html";

   return;

  }


  user=
   authenticatedUser;


  if(booted){

   return;

  }


  booted=true;


  try{

   /*
     Initialize shared Firebase services.
   */

   initRealtimeDatabase();


   initMap();


   await loadUser();


   /*
     Restore online state from the rider profile.
   */

   isOnline=
    Boolean(
     userData.isOnline||
     riderData.isOnline
    );


   onlineUI();

   /*
     Re-establish backend presence after a reload if the
     rider was previously online.
   */
   if(isOnline){

    try{

     await setOnline(true);

    }catch(error){

     console.warn(
      "Rider online-state restore:",
      error
     );

    }

   }


   /*
     GPS can run even while offline so the map
     can still show the rider's actual position.

     Database publishing is restricted to online mode.
   */

   startGPS();

   gpsOnce(true);


   /*
     Restore active ride first.

     The listener itself will decide whether request
     listening should start.
   */

   restoreActive();


  }catch(error){

   console.error(
    "Rider home boot:",
    error
   );


   toast(
    "Unable to load rider account.",
    "error"
   );

  }

 });


/* ============================================================
   INITIAL UI
   ============================================================ */

initMap();

onlineUI();

showOffline();


/* ============================================================
   PAGE VISIBILITY
   ============================================================ */

document.addEventListener(
 "visibilitychange",
 ()=>{

  if(
   document.visibilityState==="visible" &&
   user
  ){

   /*
     Refresh GPS when returning to the app.
   */

   gpsOnce(false);

   /*
     Recover listeners if necessary.
   */

   if(
    !activeRideId &&
    isOnline &&
    !requestUnsub
   ){

    listenRequests();

   }

  }

 }
);


/* ============================================================
   CLEANUP
   ============================================================ */

window.addEventListener(
 "beforeunload",
 ()=>{

  stopGPS();

  stopRequests();

  stopActive();

  stopRestore();

  closeChat();

  clearInterval(
   routeTimer
  );

 }
);
