<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>RiderX Rider Home</title><link rel="stylesheet"

      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    padding-bottom:85px;
}

/* =========================================================
   HEADER
========================================================= */

.header{

    position:sticky;
    top:0;
    z-index:3000;

    height:65px;

    background:#111;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;

    border-bottom:1px solid #292929;

}

.logo{

    font-size:27px;
    font-weight:900;

}

.logo span{

    color:#FFD600;

}

.profile-btn{

    width:42px;
    height:42px;

    border-radius:50%;

    border:1px solid #333;

    background:#191919;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

}

/* =========================================================
   MAP
========================================================= */

#riderMap{

    width:100%;
    height:46vh;

    min-height:300px;

    background:#111;

}

.leaflet-control-zoom a{

    background:#111 !important;
    color:#FFD600 !important;
    border-color:#333 !important;

}

.map-overlay{

    position:absolute;

    top:78px;
    right:12px;

    z-index:1000;

}

.location-btn{

    width:45px;
    height:45px;

    border:none;
    border-radius:50%;

    background:#111;
    color:#FFD600;

    font-size:18px;

    box-shadow:0 4px 15px rgba(0,0,0,.4);

}

/* =========================================================
   ONLINE CARD
========================================================= */

.container{

    width:100%;
    max-width:760px;

    margin:auto;

    padding:15px;

}

.online-card{

    margin-top:15px;

    background:#111;

    border:1px solid #292929;

    border-radius:20px;

    padding:17px;

}

.online-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

}

.online-info{

    display:flex;

    align-items:center;

    gap:12px;

}

.online-dot{

    width:14px;
    height:14px;

    border-radius:50%;

    background:#666;

}

.online-dot.online{

    background:#22c55e;

    box-shadow:
        0 0 8px #22c55e,
        0 0 16px rgba(34,197,94,.5);

}

.online-text strong{

    display:block;
    font-size:16px;

}

.online-text small{

    display:block;

    color:#888;

    margin-top:4px;

    font-size:11px;

}

.online-btn{

    border:none;

    border-radius:12px;

    padding:12px 16px;

    background:#FFD600;

    color:#000;

    font-weight:900;

    cursor:pointer;

}

.online-btn.offline{

    background:#ff3333;
    color:#fff;

}

/* =========================================================
   SECTIONS
========================================================= */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:22px 0 12px;

}

.section-title h3{

    font-size:18px;

}

.section-title span{

    color:#888;

    font-size:12px;

}

/* =========================================================
   MESSAGE
========================================================= */

.message{

    background:#111;

    border:1px solid #292929;

    border-radius:17px;

    padding:24px 15px;

    text-align:center;

    color:#888;

}

.message i{

    display:block;

    font-size:30px;

    color:#FFD600;

    margin-bottom:10px;

}

/* =========================================================
   RIDE CARD
========================================================= */

.ride-card{

    background:#111;

    border:1px solid #303030;

    border-radius:20px;

    padding:16px;

    margin-bottom:14px;

}

.ride-card.active{

    border-color:#22c55e;

}

.ride-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:14px;

}

.service-badge{

    background:#FFD600;

    color:#000;

    padding:7px 10px;

    border-radius:9px;

    font-size:11px;

    font-weight:900;

}

.status{

    color:#22c55e;

    font-size:11px;

    font-weight:900;

}

.customer{

    margin-bottom:13px;

}

.customer strong{

    display:block;

    font-size:16px;

}

.customer small{

    color:#888;

}

/* =========================================================
   LOCATIONS
========================================================= */

.location-box{

    background:#080808;

    border:1px solid #242424;

    border-radius:15px;

    padding:13px;

    margin-bottom:13px;

}

.location-row{

    display:flex;

    gap:10px;

    align-items:flex-start;

}

.location-row + .location-row{

    margin-top:14px;

    padding-top:14px;

    border-top:1px solid #242424;

}

.location-icon{

    width:29px;
    height:29px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

}

.pickup-icon{

    background:#12351f;
    color:#22c55e;

}

.drop-icon{

    background:#3b3500;
    color:#FFD600;

}

.location-label{

    color:#777;

    font-size:10px;

    text-transform:uppercase;

    margin-bottom:3px;

}

.location-address{

    color:#fff;

    font-size:13px;

    line-height:1.4;

    word-break:break-word;

}

/* =========================================================
   INFO GRID
========================================================= */

.info-grid{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;

    margin-bottom:13px;

}

.info{

    background:#080808;

    border:1px solid #242424;

    border-radius:12px;

    padding:10px 5px;

    text-align:center;

}

.info small{

    display:block;

    color:#777;

    font-size:9px;

    margin-bottom:4px;

}

.info strong{

    font-size:13px;

}

/* =========================================================
   FARE
========================================================= */

.fare-box{

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:#181500;

    border:1px solid #554a00;

    border-radius:15px;

    padding:14px;

    margin-bottom:13px;

}

.fare-label{

    color:#aaa;

    font-size:11px;

}

.payment{

    color:#888;

    font-size:10px;

    margin-top:3px;

    text-transform:uppercase;

}

.fare{

    color:#FFD600;

    font-size:25px;

    font-weight:900;

}

/* =========================================================
   BUTTONS
========================================================= */

.actions{

    display:grid;

    grid-template-columns:1fr;

    gap:9px;

}

.btn{

    width:100%;

    border:none;

    border-radius:13px;

    padding:14px;

    font-size:15px;

    font-weight:900;

    cursor:pointer;

}

.accept-btn{

    background:#FFD600;

    color:#000;

}

.navigate-btn{

    background:#242424;

    color:#fff;

    border:1px solid #444;

}

.start-btn{

    background:#22c55e;

    color:#000;

}

.complete-btn{

    background:#FFD600;

    color:#000;

}

.cancel-btn{

    background:#222;

    color:#ff4444;

    border:1px solid #444;

}

/* =========================================================
   BOTTOM
========================================================= */

.bottom{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:72px;

    background:#111;

    border-top:1px solid #292929;

    display:flex;

    justify-content:space-around;

    align-items:center;

    z-index:5000;

}

.bottom-item{

    color:#777;

    text-align:center;

    font-size:11px;

    cursor:pointer;

}

.bottom-item i{

    display:block;

    font-size:19px;

    margin-bottom:4px;

}

.bottom-item.active{

    color:#FFD600;

}

/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#222;

    border:1px solid #444;

    color:#fff;

    padding:12px 17px;

    border-radius:12px;

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:10000;

    max-width:92%;

    text-align:center;

}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);

}

.toast.success{

    border-color:#22c55e;

}

.toast.error{

    border-color:#ff3333;

}

/* =========================================================
   MAP RIDE PANEL
========================================================= */

.map-ride-panel{

    position:absolute;

    left:10px;
    right:10px;

    bottom:12px;

    z-index:1000;

    background:#111;

    border:1px solid #333;

    border-radius:17px;

    padding:12px;

    box-shadow:0 5px 25px rgba(0,0,0,.6);

    display:none;

}

.map-ride-panel.show{

    display:block;

}

.map-ride-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:8px;

}

.map-fare{

    color:#FFD600;

    font-size:20px;

    font-weight:900;

}

.map-route{

    font-size:11px;

    color:#aaa;

    line-height:1.5;

}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:420px){

    .container{

        padding:12px;

    }

    #riderMap{

        height:43vh;

    }

    .info strong{

        font-size:12px;

    }

}

</script><script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
}
from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let isOnline = false;

let riderLocation = null;

let riderMarker = null;

let pickupMarker = null;

let dropMarker = null;

let routeLine = null;

let map = null;

let rideListener = null;

let activeRideListener = null;

let activeRideId = null;

let currentNavigationTarget = null;


/* =========================================================
   ELEMENTS
========================================================= */

const onlineBtn =
document.getElementById("onlineBtn");

const onlineText =
document.getElementById("onlineText");

const onlineSubText =
document.getElementById("onlineSubText");

const onlineDot =
document.getElementById("onlineDot");

const ridesContainer =
document.getElementById("ridesContainer");

const rideCount =
document.getElementById("rideCount");

const activeSection =
document.getElementById("activeSection");

const activeRideContainer =
document.getElementById("activeRideContainer");

const welcomeName =
document.getElementById("welcomeName");

const mapRidePanel =
document.getElementById("mapRidePanel");

const mapRideFare =
document.getElementById("mapRideFare");

const mapRideRoute =
document.getElementById("mapRideRoute");

const mapRideStatus =
document.getElementById("mapRideStatus");


/* =========================================================
   TOAST
========================================================= */

window.showToast =
function(text,type="success"){

    const toast =
    document.getElementById("toast");

    toast.textContent = text;

    toast.className =
    "toast show " + type;

    setTimeout(
        ()=>{
            toast.className="toast";
        },
        3000
    );

};


/* =========================================================
   PROFILE
========================================================= */

window.goProfile =
function(){

    location.href =
    "profile.html";

};


/* =========================================================
   MAP INITIALIZE
========================================================= */

function initMap(){

    if(map)
    return;


    map =
    L.map("riderMap",{
        zoomControl:true
    })
    .setView(
        [30.7333,76.7794],
        13
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);


    setTimeout(
        ()=>{
            map.invalidateSize();
        },
        300
    );

}


/* =========================================================
   RIDER LOCATION
========================================================= */

function startRiderLocation(){

    if(!navigator.geolocation){

        showToast(
            "Location is not supported on this device.",
            "error"
        );

        return;

    }


    navigator.geolocation.watchPosition(
        position=>{

            riderLocation = {

                lat:
                position.coords.latitude,

                lng:
                position.coords.longitude

            };


            updateRiderMarker();


            if(
                currentNavigationTarget
            ){

                drawNavigationLine();

            }

        },

        error=>{

            console.error(
                "GPS error:",
                error
            );

            showToast(
                "Please allow location permission.",
                "error"
            );

        },

        {
            enableHighAccuracy:true,
            maximumAge:5000,
            timeout:15000
        }
    );

}


/* =========================================================
   RIDER MARKER
========================================================= */

function updateRiderMarker(){

    if(!map || !riderLocation)
    return;


    if(!riderMarker){

        riderMarker =
        L.marker(
            [
                riderLocation.lat,
                riderLocation.lng
            ]
        )
        .addTo(map)
        .bindPopup(
            "You are here"
        );

    }
    else{

        riderMarker.setLatLng(
            [
                riderLocation.lat,
                riderLocation.lng
            ]
        );

    }

}


/* =========================================================
   CENTER RIDER
========================================================= */

window.centerOnRider =
function(){

    if(
        !map ||
        !riderLocation
    ){

        showToast(
            "Current location not available.",
            "error"
        );

        return;

    }


    map.setView(
        [
            riderLocation.lat,
            riderLocation.lng
        ],
        16
    );

};


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async(user)=>{

        if(!user){

            location.replace(
                "../auth/login.html?role=rider"
            );

            return;

        }


        currentUser = user;

        initMap();

        startRiderLocation();

        await loadRiderProfile();

    }
);


/* =========================================================
   LOAD RIDER
========================================================= */

async function loadRiderProfile(){

    try{

        const userRef =
        doc(
            db,
            "users",
            currentUser.uid
        );


        const userSnap =
        await getDoc(userRef);


        if(!userSnap.exists()){

            showToast(
                "Rider profile not found.",
                "error"
            );

            return;

        }


        const userData =
        userSnap.data();


        const riderRef =
        doc(
            db,
            "riders",
            currentUser.uid
        );


        const riderSnap =
        await getDoc(riderRef);


        const riderData =
        riderSnap.exists()
        ? riderSnap.data()
        : {};


        const role =
        String(
            userData.role ||
            riderData.role ||
            ""
        )
        .trim()
        .toLowerCase();


        if(role !== "rider"){

            showToast(
                "This account is not a rider account.",
                "error"
            );

            return;

        }


        const approved =
        userData.adminApproved === true ||
        riderData.adminApproved === true ||
        userData.approved === true ||
        riderData.approved === true ||
        String(
            userData.status || ""
        ).toLowerCase() === "active" ||
        String(
            riderData.status || ""
        ).toLowerCase() === "active";


        if(!approved){

            location.replace(
                "pending.html"
            );

            return;

        }


        welcomeName.textContent =
        "Hello, " +
        (
            userData.name ||
            userData.fullName ||
            riderData.name ||
            riderData.fullName ||
            "Rider"
        );


        isOnline =
        userData.isOnline === true ||
        riderData.isOnline === true;


        updateOnlineUI();


        if(isOnline){

            listenForRideRequests();

        }


        findActiveRide();

    }
    catch(error){

        console.error(
            "Rider profile:",
            error
        );

        showToast(
            "Unable to load rider profile.",
            "error"
        );

    }

}


/* =========================================================
   ONLINE UI
========================================================= */

function updateOnlineUI(){

    if(isOnline){

        onlineText.textContent =
        "Online";

        onlineSubText.textContent =
        "You are receiving ride requests";

        onlineDot.classList.add(
            "online"
        );

        onlineBtn.textContent =
        "Go Offline";

        onlineBtn.classList.add(
            "offline"
        );

    }
    else{

        onlineText.textContent =
        "Offline";

        onlineSubText.textContent =
        "Go online to receive ride requests";

        onlineDot.classList.remove(
            "online"
        );

        onlineBtn.textContent =
        "Go Online";

        onlineBtn.classList.remove(
            "offline"
        );

    }

}


/* =========================================================
   TOGGLE ONLINE
========================================================= */

window.toggleOnline =
async function(){

    if(!currentUser){

        showToast(
            "Please login again.",
            "error"
        );

        return;

    }


    const newStatus =
    !isOnline;


    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                isOnline:newStatus,
                updatedAt:serverTimestamp()
            }
        );


        try{

            await updateDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                ),
                {
                    isOnline:newStatus,
                    updatedAt:serverTimestamp()
                }
            );

        }
        catch(error){

            console.warn(
                "Rider sync:",
                error
            );

        }


        isOnline =
        newStatus;


        updateOnlineUI();


        if(isOnline){

            showToast(
                "You are now ONLINE.",
                "success"
            );

            listenForRideRequests();

        }
        else{

            stopRideListener();

            clearRideMap();

            ridesContainer.innerHTML =
            `
            <div class="message">

                <i class="fa-solid fa-power-off"></i>

                <p>
                    You are offline.
                </p>

            </div>
            `;

            rideCount.textContent =
            "0 requests";

        }

    }
    catch(error){

        console.error(
            "Online error:",
            error
        );

        showToast(
            "Unable to change online status: " +
            error.message,
            "error"
        );

    }

};


/* =========================================================
   REQUEST LISTENER
========================================================= */

function listenForRideRequests(){

    stopRideListener();


    ridesContainer.innerHTML =
    `
    <div class="message">

        <i class="fa-solid fa-spinner fa-spin"></i>

        <p>
            Searching for ride requests...
        </p>

    </div>
    `;


    const q1 =
    query(
        collection(db,"rides"),
        where("status","==","searching")
    );


    const q2 =
    query(
        collection(db,"rides"),
        where("status","==","REQUESTED")
    );


    let searching =
    new Map();

    let requested =
    new Map();


    function render(){

        const combined =
        new Map([
            ...searching,
            ...requested
        ]);


        ridesContainer.innerHTML =
        "";


        if(combined.size === 0){

            ridesContainer.innerHTML =
            `
            <div class="message">

                <i class="fa-solid fa-car-side"></i>

                <p>
                    No ride requests right now.
                </p>

            </div>
            `;

            rideCount.textContent =
            "0 requests";

            clearRideMap();

            return;

        }


        rideCount.textContent =
        combined.size +
        (
            combined.size === 1
            ? " request"
            : " requests"
        );


        let firstRide = null;


        combined.forEach(
            (ride,id)=>{

                if(
                    ride.status !== "searching" &&
                    ride.status !== "REQUESTED"
                )
                return;


                if(!firstRide){

                    firstRide = {
                        id,
                        data:ride
                    };

                }


                ridesContainer.appendChild(
                    createRideCard(
                        id,
                        ride
                    )
                );

            }
        );


        if(firstRide){

            showRideOnMap(
                firstRide.id,
                firstRide.data
            );

        }

    }


    const unsub1 =
    onSnapshot(
        q1,
        snapshot=>{

            searching =
            new Map();

            snapshot.forEach(
                snap=>{

                    searching.set(
                        snap.id,
                        snap.data()
                    );

                }
            );

            render();

        },
        error=>{

            console.error(
                "searching listener:",
                error
            );

            showToast(
                "Ride requests permission denied. Check Firestore rules.",
                "error"
            );

        }
    );


    const unsub2 =
    onSnapshot(
        q2,
        snapshot=>{

            requested =
            new Map();

            snapshot.forEach(
                snap=>{

                    requested.set(
                        snap.id,
                        snap.data()
                    );

                }
            );

            render();

        },
        error=>{

            console.error(
                "REQUESTED listener:",
                error
            );

        }
    );


    rideListener =
    ()=>{
        unsub1();
        unsub2();
    };

}

function stopRideListener(){

    if(rideListener){

        rideListener();

        rideListener = null;

}

/* =========================================================
   RIDE ON MAP
========================================================= */

function showRideOnMap(
    rideId,
    ride
){

    if(!map)
    return;


    clearRideMap();


    const pickup =
    normalizeLocation(
        ride.pickup
    );


    const drop =
    normalizeLocation(
        ride.drop
    );


    if(!pickup)
    return;


    pickupMarker =
    L.marker(
        [
            pickup.lat,
            pickup.lng
        ]
    )
    .addTo(map)
    .bindPopup(
        "Pickup"
    );


    if(drop){

        dropMarker =
        L.marker(
            [
                drop.lat,
                drop.lng
            ]
        )
        .addTo(map)
        .bindPopup(
            "Drop"
        );


        routeLine =
        L.polyline(
            [
                [
                    pickup.lat,
                    pickup.lng
                ],
                [
                    drop.lat,
                    drop.lng
                ]
            ],
            {
                weight:5
            }
        )
        .addTo(map);


        map.fitBounds(
            routeLine.getBounds(),
            {
                padding:[40,40]
            }
        );

    }
    else{

        map.setView(
            [
                pickup.lat,
                pickup.lng
            ],
            15
        );

    }


    mapRidePanel.classList.add(
        "show"
    );


    mapRideStatus.textContent =
    "Ride Request";


    mapRideFare.textContent =
    "₹" +
    Number(
        ride.fare || 0
    );


    mapRideRoute.textContent =
    getLocationText(
        ride.pickup
    ) +
    " → " +
    getLocationText(
        ride.drop
    );

}


/* =========================================================
   CLEAR MAP
========================================================= */

function clearRideMap(){

    if(pickupMarker){

        map.removeLayer(
            pickupMarker
        );

        pickupMarker = null;

    }


    if(dropMarker){

        map.removeLayer(
            dropMarker
        );

        dropMarker = null;

    }


    if(routeLine){

        map.removeLayer(
            routeLine
        );

        routeLine = null;

    }


    mapRidePanel.classList.remove(
        "show"
    );

}

/* =========================================================
   NAVIGATION
========================================================= */

function startNavigationTo(
    location,
    type
){

    const target =
    normalizeLocation(
        location
    );


    if(!target){

        showToast(
            "Navigation coordinates unavailable.",
            "error"
        );

        return;

    }


    currentNavigationTarget =
    target;


    if(map){

        map.setView(
            [
                target.lat,
                target.lng
            ],
            15
        );

    }


    drawNavigationLine();


    /*
     * Open Google Maps navigation.
     * This is turn-by-turn navigation
     * using the phone's Maps application.
     */

    const url =
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(
        target.lat +
        "," +
        target.lng
    ) +
    "&travelmode=driving";


    /*
     * We do not force external navigation
     * automatically every time.
     * Rider can use the map inside RiderX.
     */

    console.log(
        "Navigation:",
        type,
        url
    );

}

/* =========================================================
   DRAW NAVIGATION LINE
========================================================= */

function drawNavigationLine(){

    if(
        !map ||
        !riderLocation ||
        !currentNavigationTarget
    )
    return;


    if(routeLine){

        map.removeLayer(
            routeLine
        );

    }


    routeLine =
    L.polyline(
        [
            [
                riderLocation.lat,
                riderLocation.lng
            ],
            [
                currentNavigationTarget.lat,
                currentNavigationTarget.lng
            ]
        ],
        {
            weight:5
        }
    ).addTo(map);


    const bounds =
    L.latLngBounds(
        [
            riderLocation.lat,
            riderLocation.lng
        ],
        [
            currentNavigationTarget.lat,
            currentNavigationTarget.lng
        ]
    );


    map.fitBounds(
        bounds,
        {
            padding:[50,50]
        }
    );

}

/* =========================================================
   FIND ACTIVE RIDE
========================================================= */

function findActiveRide(){

    if(!currentUser)
    return;


    const q =
    query(
        collection(db,"rides"),
        where(
            "riderId",
            "==",
            currentUser.uid
        )
    );


    onSnapshot(
        q,
        snapshot=>{

            let found = false;


            snapshot.forEach(
                snap=>{

                    const ride =
                    snap.data();


                    if(
                        ride.status === "ACCEPTED" ||
                        ride.status === "STARTED" ||
                        ride.status === "ONGOING" ||
                        ride.status === "IN_PROGRESS"
                    ){

                        found = true;

                        activeRideId =
                        snap.id;


                        showActiveRide(
                            snap.id,
                            ride
                        );


                        listenToActiveRide(
                            snap.id
                        );

                    }

                }
            );


            if(!found){

                activeSection.style.display =
                "none";

            }

        },
        error=>{

            console.error(
                "Active ride query:",
                error
            );

        }
    );

}


/* =========================================================
   PICKUP DISTANCE
========================================================= */

function getPickupDistance(
    ride
){

    const pickup =
    normalizeLocation(
        ride.pickup
    );


    if(
        !pickup ||
        !riderLocation
    ){

        return 0;

    }


    return calculateDistance(
        riderLocation.lat,
        riderLocation.lng,
        pickup.lat,
        pickup.lng
    );

}


/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
    lat1,
    lng1,
    lat2,
    lng2
){

    const R =
    6371;


    const dLat =
    (lat2-lat1) *
    Math.PI / 180;


    const dLng =
    (lng2-lng1) *
    Math.PI / 180;


    const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2)
    +
    Math.cos(
        lat1 *
        Math.PI/180
    )
    *
    Math.cos(
        lat2 *
        Math.PI/180
    )
    *
    Math.sin(dLng/2)
    *
    Math.sin(dLng/2);


    return (
        R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        )
    );

}


/* =========================================================
   NORMALIZE LOCATION
========================================================= */

function normalizeLocation(
    location
){

    if(!location)
    return null;


    const lat =
    Number(
        location.lat
    );


    const lng =
    Number(
        location.lng
    );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return null;

    }


    return {
        lat,
        lng
    };

}


/* =========================================================
   LOCATION TEXT
========================================================= */

function getLocationText(
    location
){

    if(!location)
    return "Location not available";


    if(
        typeof location ===
        "string"
    ){

        return location;

    }


    return (
        location.address ||
        location.name ||
        location.location ||
        (
            location.lat != null &&
            location.lng != null
            ?
            `${location.lat}, ${location.lng}`
            :
            "Location not available"
        )
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        stopRideListener();


        if(activeRideListener){

            activeRideListener();

        }

    }
);

</script></body></html>
