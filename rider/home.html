<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>RiderX Rider Home</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    padding-bottom:80px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:3000;
    height:65px;
    background:#111;
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
}

.logo{
    font-size:27px;
    font-weight:900;
}

.logo span{
    color:#FFD600;
}

.profile-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #333;
    background:#1b1b1b;
    color:#fff;
}

/* MAP */

#riderMap{
    width:100%;
    height:43vh;
    min-height:300px;
    display:none;
}

.map-wrapper{
    position:relative;
}

.map-status{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:2000;
    background:#111;
    border:1px solid #333;
    border-radius:30px;
    padding:9px 15px;
    font-size:12px;
    white-space:nowrap;
}

.leaflet-control-zoom a{
    background:#111!important;
    color:#FFD600!important;
}

/* MAIN */

.container{
    max-width:750px;
    margin:auto;
    padding:15px;
}

/* WELCOME */

.welcome{
    margin-bottom:15px;
}

.welcome h2{
    font-size:22px;
}

.welcome p{
    margin-top:4px;
    color:#888;
    font-size:13px;
}

/* ONLINE */

.online-card{
    background:#111;
    border:1px solid #292929;
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
}

.online-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.online-info{
    display:flex;
    align-items:center;
    gap:10px;
}

.online-dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:#777;
}

.online-dot.online{
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
}

.online-text strong{
    display:block;
}

.online-text small{
    color:#888;
}

.online-btn{
    border:0;
    border-radius:12px;
    padding:11px 15px;
    font-weight:800;
    background:#FFD600;
    color:#000;
}

.online-btn.offline{
    background:#ff3333;
    color:#fff;
}

/* SECTIONS */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0 10px;
}

.section-title h3{
    font-size:18px;
}

.section-title span{
    color:#888;
    font-size:12px;
}

/* MESSAGE */

.message{
    background:#111;
    border:1px solid #292929;
    border-radius:16px;
    padding:25px 15px;
    text-align:center;
    color:#888;
}

.message i{
    display:block;
    color:#FFD600;
    font-size:30px;
    margin-bottom:10px;
}

/* RIDE CARD */

.ride-card{
    background:#111;
    border:1px solid #333;
    border-radius:20px;
    padding:16px;
    margin-bottom:14px;
}

.active-card{
    border-color:#22c55e;
}

.ride-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.service-badge{
    background:#FFD600;
    color:#000;
    padding:7px 10px;
    border-radius:9px;
    font-size:11px;
    font-weight:900;
}

.ride-status{
    color:#22c55e;
    font-size:11px;
    font-weight:900;
}

.customer{
    margin-bottom:13px;
}

.customer strong{
    display:block;
    font-size:16px;
}

.customer small{
    color:#888;
}

/* LOCATIONS */

.location-box{
    background:#080808;
    border:1px solid #222;
    border-radius:14px;
    padding:13px;
    margin-bottom:13px;
}

.location-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.location-row + .location-row{
    margin-top:13px;
    padding-top:13px;
    border-top:1px solid #222;
}

.location-icon{
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.pickup-icon{
    background:#12351f;
    color:#22c55e;
}

.drop-icon{
    background:#3b3500;
    color:#FFD600;
}

.location-label{
    color:#777;
    font-size:10px;
    text-transform:uppercase;
    margin-bottom:3px;
}

.location-address{
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

/* INFO */

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:13px;
}

.info{
    background:#080808;
    border:1px solid #222;
    border-radius:12px;
    padding:10px 5px;
    text-align:center;
}

.info small{
    display:block;
    color:#777;
    font-size:9px;
    margin-bottom:4px;
}

.info strong{
    font-size:13px;
}

/* FARE */

.fare-box{
    background:#181500;
    border:1px solid #554a00;
    border-radius:15px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.fare-label{
    color:#aaa;
    font-size:12px;
}

.payment{
    color:#888;
    font-size:10px;
    margin-top:3px;
    text-transform:uppercase;
}

.fare{
    color:#FFD600;
    font-size:25px;
    font-weight:900;
}

/* BUTTONS */

.actions{
    display:grid;
    gap:9px;
}

.btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:13px;
    font-size:15px;
    font-weight:900;
}

.accept-btn{
    background:#FFD600;
    color:#000;
}

.navigate-btn{
    background:#222;
    color:#fff;
    border:1px solid #444;
}

.start-btn{
    background:#22c55e;
    color:#000;
}

.complete-btn{
    background:#FFD600;
    color:#000;
}

.cancel-btn{
    background:#ff3333;
    color:#fff;
}

/* NAVIGATION INFO */

.navigation-box{
    background:#102619;
    border:1px solid #1c7137;
    border-radius:14px;
    padding:13px;
    margin-bottom:13px;
    display:none;
}

.navigation-box strong{
    color:#22c55e;
}

.navigation-box small{
    display:block;
    color:#aaa;
    margin-top:4px;
}

/* BOTTOM */

.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:70px;
    background:#111;
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:4000;
}

.bottom-item{
    color:#777;
    text-align:center;
    font-size:11px;
}

.bottom-item i{
    display:block;
    font-size:19px;
    margin-bottom:4px;
}

.bottom-item.active{
    color:#FFD600;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    border:1px solid #444;
    color:#fff;
    padding:12px 18px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:6000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.success{
    border-color:#22c55e;
}

.toast.error{
    border-color:#ff3333;
}

@media(max-width:420px){

    .info strong{
        font-size:11px;
    }

    .online-btn{
        padding:10px 11px;
        font-size:12px;
    }

}

</style>
</head>

<body>

<header class="header">

    <div class="logo">
        RID<span>ERX</span>
    </div>

    <button class="profile-btn"
            onclick="goProfile()">
        <i class="fa-solid fa-user"></i>
    </button>

</header>


<!-- MAP -->

<div class="map-wrapper">

    <div id="riderMap"></div>

    <div id="mapStatus"
         class="map-status"
         style="display:none;">
        Waiting for location...
    </div>

</div>


<main class="container">

    <div class="welcome">

        <h2 id="welcomeName">
            Rider
        </h2>

        <p>
            Go online to receive RiderX ride requests.
        </p>

    </div>


    <!-- ONLINE -->

    <div class="online-card">

        <div class="online-row">

            <div class="online-info">

                <div id="onlineDot"
                     class="online-dot">
                </div>

                <div class="online-text">

                    <strong id="onlineText">

                    </strong>

                    <small id="onlineSubText">

                    </small>

            </span>

        <div id="activeRideContainer"></div>

    </section>


    <!-- REQUESTS -->

    <section id="requestedSection">

        <div class="section-title">

            <h3>
                Requested Rides
            </h3>

            <span id="rideCount">
                0 requests
            </span>

        <div id="ridesContainer">

            <div class="message">

                </p>

            </div>

        </div>

    </section>

</main>


<nav class="bottom">

    <div class="bottom-item active"
         onclick="location.href='home.html'">

        <i class="fa-solid fa-house"></i>
        Home

    </div>


    <div class="bottom-item"
         onclick="location.href='rides.html'">

        <i class="fa-solid fa-route"></i>
        Rides

    </div>


    <div class="bottom-item"
         onclick="location.href='wallet.html'">

        <i class="fa-solid fa-wallet"></i>
        Wallet

    </div>


    <div class="bottom-item"
         onclick="goProfile()">

        <i class="fa-solid fa-user"></i>
        Profile

    </div>

</nav>


<div id="toast"
     class="toast">
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">

import {
    auth,
    db
}
from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    runTransaction,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let riderData = {};

let isOnline = false;

let riderMap = null;

let riderMarker = null;

let pickupMarker = null;

let dropMarker = null;

let routeLine = null;

let locationWatchId = null;

let requestUnsubscribe = null;

let activeRideUnsubscribe = null;

let currentActiveRide = null;

let selectedNavigationMode = "pickup";


/* =========================================================
   ELEMENTS
========================================================= */

const riderMapEl =
    document.getElementById("riderMap");

const mapStatus =
    document.getElementById("mapStatus");

const onlineBtn =
    document.getElementById("onlineBtn");

const onlineText =
    document.getElementById("onlineText");

const onlineSubText =
    document.getElementById("onlineSubText");

const onlineDot =
    document.getElementById("onlineDot");

const ridesContainer =
    document.getElementById("ridesContainer");

const rideCount =
    document.getElementById("rideCount");

const activeSection =
    document.getElementById("activeSection");

const activeRideContainer =
    document.getElementById("activeRideContainer");

const welcomeName =
    document.getElementById("welcomeName");


/* =========================================================
   TOAST
========================================================= */

window.showToast = function(
    text,
    type = "success"
){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.className =
        "toast show " + type;

    setTimeout(
        ()=>{
            toast.className = "toast";
        },
        3500
    );

};


/* =========================================================
   PROFILE
========================================================= */

window.goProfile = function(){

    location.href =
        "profile.html";

};


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async(user)=>{

        if(!user){

            location.replace(
                "../auth/login.html?role=rider"
            );

            return;
        }

        currentUser =
            user;

        await loadRider();

    }
);


/* =========================================================
   LOAD RIDER
========================================================= */

async function loadRider(){

    try{

        const userSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                )
            );


        if(!userSnap.exists()){

            showToast(
                "Rider profile not found.",
                "error"
            );

            return;
        }


        const userData =
            userSnap.data();


        const role =
            String(
                userData.role ||
                ""
            )
            .toLowerCase()
            .trim();


        if(role !== "rider"){

            showToast(
                "This is not a rider account.",
                "error"
            );

            return;
        }


        const riderSnap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                )
            );


        riderData =
            riderSnap.exists()
                ? riderSnap.data()
                : {};


        const approved =
            userData.adminApproved === true ||
            riderData.adminApproved === true ||
            userData.approved === true ||
            riderData.approved === true ||
            String(userData.status || "").toLowerCase() === "active" ||
            String(riderData.status || "").toLowerCase() === "active";


        if(!approved){

            location.replace(
                "pending.html"
            );

            return;
        }


        welcomeName.textContent =
            "Hello, " +
            (
                userData.name ||
                userData.fullName ||
                riderData.name ||
                riderData.fullName ||
                currentUser.displayName ||
                "Rider"
            );


        isOnline =
            userData.isOnline === true ||
            riderData.isOnline === true;


        updateOnlineUI();


        initMap();


        if(isOnline){

            startRiderLocation();

            listenForRideRequests();

        }


        findActiveRide();

    }

    catch(error){

        console.error(
            "Rider load error:",
            error
        );

        showToast(
            "Unable to load rider.",
            "error"
        );

    }

}


/* =========================================================
   MAP
========================================================= */

function initMap(){

    if(riderMap)
        return;


    riderMap =
        L.map(
            "riderMap",
            {
                zoomControl:true
            }
        )
        .setView(
            [
                30.7046,
                76.7179
            ],
            13
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(riderMap);

}


/* =========================================================
   SHOW MAP
========================================================= */

function showMap(){

    riderMapEl.style.display =
        "block";

    setTimeout(
        ()=>{
            if(riderMap){
                riderMap.invalidateSize();
            }
        },
        300
    );

}


/* =========================================================
   RIDER LOCATION
========================================================= */

function startRiderLocation(){

    showMap();

    mapStatus.style.display =
        "block";

    mapStatus.textContent =
        "Getting your location...";


    if(!navigator.geolocation){

        mapStatus.textContent =
            "Location not supported";

        return;
    }


    if(locationWatchId !== null){

        navigator.geolocation.clearWatch(
            locationWatchId
        );

    }


    locationWatchId =
        navigator.geolocation.watchPosition(
            async(position)=>{

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;


                const point =
                    [lat,lng];


                if(!riderMarker){

                    riderMarker =
                        L.marker(
                            point,
                            {
                                title:"Your Location"
                            }
                        )
                        .addTo(riderMap)
                        .bindPopup(
                            "You are here"
                        );

                    riderMap.setView(
                        point,
                        15
                    );

                }
                else{

                    riderMarker.setLatLng(
                        point
                    );

                }


                mapStatus.textContent =
                    isOnline
                        ? "You are online"
                        : "You are offline";


                /*
                 * Keep rider location in Firebase.
                 *
                 * This is written to riders only.
                 */

                if(
                    currentUser &&
                    isOnline
                ){

                    try{

                        await updateDoc(
                            doc(
                                db,
                                "riders",
                                currentUser.uid
                            ),
                            {
                                latitude:lat,
                                longitude:lng,
                                location:{
                                    lat:lat,
                                    lng:lng
                                },
                                updatedAt:
                                    serverTimestamp()
                            }
                        );

                    }
                    catch(error){

                        console.warn(
                            "Location update:",
                            error
                        );

                    }

                }


                /*
                 * If active ride exists,
                 * redraw navigation route.
                 */

                if(currentActiveRide){

                    drawNavigationRoute(
                        currentActiveRide
                    );

                }

            },
            (error)=>{

                console.error(
                    "GPS error:",
                    error
                );

                mapStatus.textContent =
                    "Allow location permission";

                showToast(
                    "Please allow location access.",
                    "error"
                );

            },
            {
                enableHighAccuracy:true,
                maximumAge:5000,
                timeout:15000
            }
        );

}


/* =========================================================
   ONLINE UI
========================================================= */

function updateOnlineUI(){

    if(isOnline){

        onlineText.textContent =
            "Online";

        onlineSubText.textContent =
            "You are receiving ride requests";

        onlineDot.classList.add(
            "online"
        );

        onlineBtn.textContent =
            "Go Offline";

        onlineBtn.classList.add(
            "offline"
        );

    }
    else{

        onlineText.textContent =
            "Offline";

        onlineSubText.textContent =
            "Go online to receive rides";

        onlineDot.classList.remove(
            "online"
        );

        onlineBtn.textContent =
            "Go Online";

        onlineBtn.classList.remove(
            "offline"
        );

    }

}


/* =========================================================
   TOGGLE ONLINE
========================================================= */

window.toggleOnline = async function(){

    if(!currentUser){

        showToast(
            "Please login first.",
            "error"
        );

        return;
    }


    const newStatus =
        !isOnline;


    onlineBtn.disabled =
        true;


    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                isOnline:newStatus,
                updatedAt:
                    serverTimestamp()
            }
        );


        /*
         * Rider document is updated separately.
         */

        await updateDoc(
            doc(
                db,
                "riders",
                currentUser.uid
            ),
            {
                isOnline:newStatus,
                updatedAt:
                    serverTimestamp()
            }
        );


        isOnline =
            newStatus;


        updateOnlineUI();


        if(isOnline){

            showMap();

            startRiderLocation();

            listenForRideRequests();

            showToast(
                "You are now ONLINE.",
                "success"
            );

        }
        else{

            stopRideRequests();

            mapStatus.textContent =
                "You are offline";

            showToast(
                "You are now OFFLINE.",
                "success"
            );

        }

    }
    catch(error){

        console.error(
            "Online error:",
            error
        );

        showToast(
            "Online status failed: " +
            error.message,
            "error"
        );

    }
    finally{

        onlineBtn.disabled =
            false;

    }

};


/* =========================================================
   RIDE REQUEST LISTENER
========================================================= */

function listenForRideRequests(){

    stopRideRequests();


    ridesContainer.innerHTML =
        `
        <div class="message">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p>Searching for ride requests...</p>
        </div>
        `;


    const q =
        query(
            collection(db,"rides"),
            where(
                "status",
                "==",
                "searching"
            )
        );


    requestUnsubscribe =
        onSnapshot(
            q,
            (snapshot)=>{

                ridesContainer.innerHTML =
                    "";


                if(snapshot.empty){

                    rideCount.textContent =
                        "0 requests";


                    ridesContainer.innerHTML =
                        `
                        <div class="message">

                            <i class="fa-solid fa-car-side"></i>

                            <p>
                                No ride requests right now.
                            </p>

                        </div>
                        `;

                    return;

                }


                rideCount.textContent =
                    snapshot.size +
                    (
                        snapshot.size === 1
                            ? " request"
                            : " requests"
                    );


                snapshot.forEach(
                    snap=>{

                        const card =
                            createRideCard(
                                snap.id,
                                snap.data()
                            );

                        ridesContainer.appendChild(
                            card
                        );

                    }
                );

            },
            (error)=>{

                console.error(
                    "Ride request permission/listener:",
                    error
                );


                ridesContainer.innerHTML =
                    `
                    <div class="message">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                        <p>
                            Unable to load ride requests.
                        </p>

                        <small>
                            Check Firestore rules.
                        </small>

                    </div>
                    `;

            }
        );

}


/* =========================================================
   STOP REQUESTS
========================================================= */

function stopRideRequests(){

    if(requestUnsubscribe){

        requestUnsubscribe();

        requestUnsubscribe =
            null;

    }

}


/* =========================================================
   CREATE REQUEST CARD
========================================================= */

/* =========================================================
   ACCEPT RIDE
========================================================= */

window.acceptRide = async function(
    rideId
){

    if(!currentUser){

        showToast(
            "Please login again.",
            "error"
        );

        return;
    }


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        /*
         * TRANSACTION prevents
         * two riders accepting same ride.
         */

        let acceptedRide = null;


        await runTransaction(
            db,
            async(transaction)=>{

                const snap =
                    await transaction.get(
                        rideRef
                    );


                if(!snap.exists()){

                    throw new Error(
                        "Ride not found."
                    );

                }


                const ride =
                    snap.data();


                if(
                    ride.status !==
                    "searching"
                ){

                    throw new Error(
                        "Ride already accepted."
                    );

                }


                acceptedRide = {
                    ...ride
                };


                transaction.update(
                    rideRef,
                    {
                        status:"accepted",
                        riderId:
                            currentUser.uid,
                        riderName:
                            riderData.name ||
                            riderData.fullName ||
                            "Rider",
                        acceptedAt:
                            serverTimestamp()
                    }
                );

            }
        );


        stopRideRequests();


        currentActiveRide =
            {
                id:rideId,
                ...acceptedRide,
                status:"accepted",
                riderId:
                    currentUser.uid
            };


        showActiveRide(
            currentActiveRide
        );


        selectedNavigationMode =
            "pickup";


        drawNavigationRoute(
            currentActiveRide
        );


        showToast(
            "Ride accepted!",
            "success"
        );

    }
    catch(error){

        console.error(
            "Accept ride:",
            error
        );


        showToast(
            error.message ||
            "Unable to accept ride.",
            "error"
        );

    }

};

/* =========================================================
   START RIDE
========================================================= */

window.startRide = async function(
    rideId
){

    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const snap =
            await getDoc(
                rideRef
            );


        if(!snap.exists()){

            showToast(
                "Ride not found.",
                "error"
            );

            return;
        }


        const ride =
            snap.data();


        if(
            ride.riderId !==
            currentUser.uid
        ){

            showToast(
                "This ride is not assigned to you.",
                "error"
            );

            return;
        }


        if(
            ride.status !==
            "accepted"
        ){

            showToast(
                "Ride cannot be started.",
                "error"
            );

            return;
        }


        await updateDoc(
            rideRef,
            {
                status:"started",
                startedAt:
                    serverTimestamp()
            }
        );


        selectedNavigationMode =
            "drop";


        currentActiveRide =
            {
                ...ride,
                id:rideId,
                status:"started"
            };


        showActiveRide(
            currentActiveRide
        );


        drawNavigationRoute(
            currentActiveRide
        );


        openGoogleNavigation();


        showToast(
            "Ride started. Navigate to drop.",
            "success"
        );

    }
    catch(error){

        console.error(
            "Start ride:",
            error
        );

        showToast(
            "Unable to start ride: " +
            error.message,
            "error"
        );

    }

};


/* =========================================================
   COMPLETE RIDE
========================================================= */

window.completeRide = async function(
    rideId
){

    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const snap =
            await getDoc(
                rideRef
            );


        if(!snap.exists()){

            showToast(
                "Ride not found.",
                "error"
            );

            return;
        }


        const ride =
            snap.data();


        if(
            ride.riderId !==
            currentUser.uid
        ){

            showToast(
                "This ride is not yours.",
                "error"
            );

            return;
        }


        if(
            ride.status !==
            "started"
        ){

            showToast(
                "Start the ride first.",
                "error"
            );

            return;
        }


        await updateDoc(
            rideRef,
            {
                status:"completed",
                completedAt:
                    serverTimestamp()
            }
        );


        currentActiveRide =
            null;


        activeSection.style.display =
            "none";


        clearMapRoute();


        showToast(
            "Ride completed successfully.",
            "success"
        );


        if(isOnline){

            setTimeout(
                ()=>{
                    listenForRideRequests();
                },
                500
            );

        }

    }
    catch(error){

        console.error(
            "Complete ride:",
            error
        );

        showToast(
            "Unable to complete ride: " +
            error.message,
            "error"
        );

    }

};


/* =========================================================
   ACTIVE RIDE LISTENER
========================================================= */

function listenToActiveRide(
    rideId
){

    if(activeRideUnsubscribe){

        activeRideUnsubscribe();

    }


    activeRideUnsubscribe =
        onSnapshot(
            doc(
                db,
                "rides",
                rideId
            ),
            snapshot=>{

                if(!snapshot.exists()){

                    activeSection.style.display =
                        "none";

                    currentActiveRide =
                        null;

                    return;

                }


                const ride =
                    {
                        id:rideId,
                        ...snapshot.data()
                    };


                if(
                    ride.riderId !==
                    currentUser.uid
                ){

                    return;

                }


                if(
                    ride.status ===
                    "completed"
                ){

                    activeSection.style.display =
                        "none";

                    currentActiveRide =
                        null;

                    clearMapRoute();

                    return;

                }


                currentActiveRide =
                    ride;


                selectedNavigationMode =
                    ride.status === "started"
                        ? "drop"
                        : "pickup";


                showActiveRide(
                    ride
                );


                drawNavigationRoute(
                    ride
                );

            },
            error=>{

                console.error(
                    "Active ride listener:",
                    error
                );

            }
        );

}


/* =========================================================
   FIND ACTIVE RIDE
========================================================= */

function findActiveRide(){

    if(!currentUser)
        return;


    const q =
        query(
            collection(db,"rides"),
            where(
                "riderId",
                "==",
                currentUser.uid
            )
        );


    onSnapshot(
        q,
        snapshot=>{

            let found =
                null;


            snapshot.forEach(
                snap=>{

                    const data =
                        snap.data();


                    if(
                        data.status === "accepted" ||
                        data.status === "started"
                    ){

                        found =
                            {
                                id:snap.id,
                                ...data
                            };

                    }

                }
            );


            if(found){

                currentActiveRide =
                    found;


                selectedNavigationMode =
                    found.status === "started"
                        ? "drop"
                        : "pickup";


                showActiveRide(
                    found
                );


                listenToActiveRide(
                    found.id
                );


                drawNavigationRoute(
                    found
                );

            }
            else{

                activeSection.style.display =
                    "none";

            }

        },
        error=>{

            console.error(
                "Active ride query:",
                error
            );

        }
    );

}


/* =========================================================
   DRAW NAVIGATION ROUTE
========================================================= */

async function drawNavigationRoute(
    ride
){

    if(
        !riderMarker ||
        !ride
    ){

        return;

    }


    const riderPoint =
        riderMarker.getLatLng();


    const destination =
        ride.status === "started"
            ? ride.drop
            : ride.pickup;


    if(
        !destination ||
        destination.lat == null ||
        destination.lng == null
    ){

        return;

    }


    const start =
        riderPoint.lat +
        "," +
        riderPoint.lng;


    const end =
        destination.lat +
        "," +
        destination.lng;


    try{

        const url =
            "https://router.project-osrm.org/route/v1/driving/" +
            encodeURIComponent(start) +
            ";" +
            encodeURIComponent(end) +
            "?overview=full&geometries=geojson";


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(
            !data.routes ||
            !data.routes[0]
        ){

            return;

        }


        const coordinates =
            data.routes[0]
                .geometry
                .coordinates
                .map(
                    point=>[
                        point[1],
                        point[0]
                    ]
                );


        clearRouteOnly();


        routeLine =
            L.polyline(
                coordinates,
                {
                    color:"#FFD600",
                    weight:6,
                    opacity:.9
                }
            )
            .addTo(riderMap);


        if(
            pickupMarker
        ){

            riderMap.removeLayer(
                pickupMarker
            );

        }


        if(
            dropMarker
        ){

            riderMap.removeLayer(
                dropMarker
            );

        }


        pickupMarker =
            L.marker(
                [
                    ride.pickup.lat,
                    ride.pickup.lng
                ]
            )
            .addTo(riderMap)
            .bindPopup(
                "Customer Pickup"
            );


        dropMarker =
            L.marker(
                [
                    ride.drop.lat,
                    ride.drop.lng
                ]
            )
            .addTo(riderMap)
            .bindPopup(
                "Customer Drop"
            );


        riderMap.fitBounds(
            routeLine.getBounds(),
            {
                padding:[40,40]
            }
        );

    }
    catch(error){

        console.error(
            "Route error:",
            error
        );

    }

}


/* =========================================================
   GOOGLE NAVIGATION
========================================================= */

window.openGoogleNavigation =
function(){

    if(
        !currentActiveRide
    ){

        showToast(
            "No active ride.",
            "error"
        );

        return;

    }


    const destination =
        currentActiveRide.status === "started"
            ? currentActiveRide.drop
            : currentActiveRide.pickup;


    if(
        !destination ||
        destination.lat == null ||
        destination.lng == null
    ){

        showToast(
            "Destination coordinates unavailable.",
            "error"
        );

        return;

    }


    const url =
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" +
        encodeURIComponent(
            destination.lat +
            "," +
            destination.lng
        ) +
        "&travelmode=driving";


    window.open(
        url,
        "_blank"
    );

};


/* =========================================================
   CLEAR ROUTE
========================================================= */

function clearRouteOnly(){

    if(routeLine){

        riderMap.removeLayer(
            routeLine
        );

        routeLine =
            null;

    }

}


function clearMapRoute(){

    clearRouteOnly();


    if(pickupMarker){

        riderMap.removeLayer(
            pickupMarker
        );

        pickupMarker =
            null;

    }


    if(dropMarker){

        riderMap.removeLayer(
            dropMarker
        );

        dropMarker =
            null;

    }

}


/* =========================================================
   LOCATION TEXT
========================================================= */

function getLocationText(
    location
){

    if(!location)
        return "Location unavailable";


    if(
        typeof location ===
        "string"
    ){

        return location;

    }


    return (
        location.address ||
        location.name ||
        location.location ||
        (
            location.lat != null &&
            location.lng != null
                ?
                `${location.lat}, ${location.lng}`
                :
                "Location unavailable"
        )
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        stopRideRequests();


        if(activeRideUnsubscribe){

            activeRideUnsubscribe();

        }


        if(
            locationWatchId !== null
        ){

            navigator.geolocation.clearWatch(
                locationWatchId
            );

        }

    }
);
