*{

html,
body{

body{

/* ================= HEADER ================= */

.header{

}

/* ================= PAGE ================= */

/* ================= WELCOME ================= */

.welcome{

}

.welcome h2{
    font-size:22px;
    margin-bottom:5px;
}

.welcome p{
    color:#888;
    font-size:13px;
}

/* ================= ONLINE CARD ================= */

.online-card{
    background:#111;
    border:1px solid #292929;
    border-radius:20px;
    padding:18px;
    margin-bottom:18px;
}

.online-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.online-info{
    display:flex;
    align-items:center;

}

.online-dot{

    height:13px;
    border-radius:50%;

}

.online-dot.online{

    box-shadow:0 0 12px rgba(34,197,94,.7);
}

.online-text strong{
    display:block;
    font-size:16px;
}

.online-text small{

    display:block;
    margin-top:3px;
}

.online-btn{

    border-radius:12px;

}

/* ================= SECTION ================= */

.section-title{

    justify-content:space-between;

}

.section-title h3{

.section-title span{

}

.customer{

}

/* ================= LOCATION ================= */

.location-box{

}

.location-row{

}

.location-row + .location-row{

}

.location-icon{

    border-radius:50%;

    justify-content:center;

}

.location-content{

}

.location-label{

}

}

}

.btn{

.accept-btn{

}

.complete-btn{

}

.navigate-btn{

    color:#fff;
    border:1px solid #444;
}

/* ================= ACTIVE ================= */

.active-card{
    border:1px solid #22c55e;

}

    font-weight:900;

}

.bottom{
    position:fixed;

    background:#111;

    color:#777;

.bottom-item i{

/* ================= TOAST ================= */

.toast{

    border:1px solid #444;

    pointer-events:none;

    transition:.25s;

    z-index:5000;

    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.success{
    border-color:#22c55e;
}

.toast.error{

/* ================= RESPONSIVE ================= */

    }

    }

        grid-template-columns:repeat(3,1fr);
    }

</div><!-- ================= FIREBASE ================= --><script type="module">

import {
    auth,
    db
}
from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let isOnline = false;

let rideUnsubscribe = null;

let activeRideUnsubscribe = null;

let activeRideId = null;


/* =========================================================
   ELEMENTS
========================================================= */

const onlineBtn =
    document.getElementById("onlineBtn");

const onlineText =
    document.getElementById("onlineText");

const onlineSubText =
    document.getElementById("onlineSubText");

const onlineDot =
    document.getElementById("onlineDot");

const ridesContainer =
    document.getElementById("ridesContainer");

const rideCount =
    document.getElementById("rideCount");

const activeSection =
    document.getElementById("activeSection");

const activeRideContainer =
    document.getElementById("activeRideContainer");

const welcomeName =
    document.getElementById("welcomeName");


/* =========================================================
   TOAST
========================================================= */

window.showToast = function(
    text,
    type="success"
){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.className =
        "toast show " + type;

    setTimeout(
        ()=>{
            toast.className = "toast";
        },
        3000
    );
};


/* =========================================================
   PROFILE
========================================================= */

window.goProfile = function(){

    location.href =
        "Profile.html";

};


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async(user)=>{

        if(!user){

            localStorage.removeItem(
                "riderx_user"
            );

            location.replace(
                "../auth/login.html?role=rider"
            );

            return;
        }


        currentUser = user;


        localStorage.setItem(
            "riderx_user",
            JSON.stringify({
                uid:user.uid,
                email:user.email
            })
        );


        await loadRiderProfile();

    }
);


/* =========================================================
   LOAD RIDER PROFILE
========================================================= */

async function loadRiderProfile(){

    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const userSnap =
            await getDoc(userRef);


        if(!userSnap.exists()){

            showToast(
                "Rider profile not found.",
                "error"
            );

            return;
        }


        const userData =
            userSnap.data();


        const role =
            String(
                userData.role ||
                ""
            )
            .trim()
            .toLowerCase();


        if(role !== "rider"){

            showToast(
                "This account is not a rider account.",
                "error"
            );

            return;
        }


        /* ================= APPROVAL ================= */

        const riderRef =
            doc(
                db,
                "riders",
                currentUser.uid
            );


        const riderSnap =
            await getDoc(riderRef);


        const riderData =
            riderSnap.exists()
                ? riderSnap.data()
                : {};


        const approved =
            userData.adminApproved === true ||
            riderData.adminApproved === true ||
            userData.approved === true ||
            riderData.approved === true ||
            String(userData.status || "").toLowerCase() === "active" ||
            String(riderData.status || "").toLowerCase() === "active";


        if(!approved){

            showToast(
                "Your rider account is waiting for admin approval.",
                "error"
            );

            setTimeout(
                ()=>{
                    location.replace(
                        "pending.html"
                    );
                },
                1200
            );

            return;
        }


        /* ================= NAME ================= */

        welcomeName.textContent =
            "Hello, " +
            (
                userData.name ||
                userData.fullName ||
                riderData.name ||
                riderData.fullName ||
                "Rider"
            );


        /* ================= ONLINE ================= */

        isOnline =
            userData.isOnline === true ||
            riderData.isOnline === true;


        updateOnlineUI();


        if(isOnline){

            listenForRideRequests();

        }


        /* ================= ACTIVE RIDE ================= */

        findActiveRide();

    }

    catch(error){

        console.error(
            "Rider profile error:",
            error
        );

        showToast(
            "Unable to load rider profile.",
            "error"
        );

    }

}


/* =========================================================
   ONLINE UI
========================================================= */

function updateOnlineUI(){

    if(isOnline){

        onlineText.textContent =
            "Online";

        onlineSubText.textContent =
            "You are receiving ride requests";

        onlineDot.classList.add(
            "online"
        );

        onlineBtn.textContent =
            "Go Offline";

        onlineBtn.classList.add(
            "offline"
        );

    }

    else{

        onlineText.textContent =
            "Offline";

        onlineSubText.textContent =
            "Go online to receive rides";

        onlineDot.classList.remove(
            "online"
        );

        onlineBtn.textContent =
            "Go Online";

        onlineBtn.classList.remove(
            "offline"
        );

    }

}


/* =========================================================
   TOGGLE ONLINE
========================================================= */

window.toggleOnline = async function(){

    if(!currentUser){

        showToast(
            "Please login first.",
            "error"
        );

        return;
    }


    isOnline =
        !isOnline;


    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                isOnline:isOnline,
                updatedAt:serverTimestamp()
            }
        );


        /* Keep riders collection synchronized */

        const riderRef =
            doc(
                db,
                "riders",
                currentUser.uid
            );


        try{

            await updateDoc(
                riderRef,
                {
                    isOnline:isOnline,
                    updatedAt:serverTimestamp()
                }
            );

        }
        catch(riderError){

            console.warn(
                "Rider collection update skipped:",
                riderError
            );

        }


        updateOnlineUI();


        if(isOnline){

            showToast(
                "You are now online.",
                "success"
            );

            listenForRideRequests();

        }

        else{

            stopRideListener();

            ridesContainer.innerHTML =
                `
                <div class="message">

                    <i class="fa-solid fa-power-off"></i>

                    <p>
                        You are offline.
                    </p>

                </div>
                `;

            rideCount.textContent =
                "0 requests";


            showToast(
                "You are now offline.",
                "success"
            );

        }

    }

    catch(error){

        console.error(
            "Online status error:",
            error
        );

        isOnline =
            !isOnline;

        updateOnlineUI();

        showToast(
            "Unable to change online status: " +
            error.message,
            "error"
        );

    }

};


/* =========================================================
   LISTEN FOR REQUESTED RIDES
========================================================= */

function listenForRideRequests(){

    stopRideListener();


    ridesContainer.innerHTML =
        `
        <div class="message">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <p>
                Searching for ride requests...
            </p>

        </div>
        `;


    /*
     * Customer booking code currently creates:
     *
     * status: "searching"
     *
     * Older code may create:
     *
     * status: "REQUESTED"
     *
     * We listen to BOTH.
     */


    const searchingQuery =
        query(
            collection(db,"rides"),
            where("status","==","searching")
        );


    const requestedQuery =
        query(
            collection(db,"rides"),
            where("status","==","REQUESTED")
        );


    let searchingRides = new Map();

    let requestedRides = new Map();


    function renderCombined(){

        const allRides =
            new Map([
                ...searchingRides,
                ...requestedRides
            ]);


        ridesContainer.innerHTML = "";


        if(allRides.size === 0){

            ridesContainer.innerHTML =
                `
                <div class="message">

                    <i class="fa-solid fa-car-side"></i>

                    <p>
                        No active ride requests right now.
                    </p>

                </div>
                `;

            rideCount.textContent =
                "0 requests";

            return;
        }


        rideCount.textContent =
            allRides.size +
            (
                allRides.size === 1
                    ? " request"
                    : " requests"
            );


        allRides.forEach(
            (ride,rideId)=>{

                /*
                 * If another rider already accepted
                 * the ride, don't show it.
                 */

                if(
                    ride.status !== "searching" &&
                    ride.status !== "REQUESTED"
                ){

                    return;
                }


                ridesContainer.appendChild(
                    createRideCard(
                        rideId,
                        ride
                    )
                );

            }
        );

    }


    const unsubscribeSearching =
        onSnapshot(
            searchingQuery,
            (snapshot)=>{

                searchingRides =
                    new Map();

                snapshot.forEach(
                    (snap)=>{

                        searchingRides.set(
                            snap.id,
                            snap.data()
                        );

                    }
                );

                renderCombined();

            },
            (error)=>{

                console.error(
                    "Searching rides listener:",
                    error
                );

                /*
                 * Permission errors should not break
                 * the REQUESTED listener.
                 */

            }
        );


    const unsubscribeRequested =
        onSnapshot(
            requestedQuery,
            (snapshot)=>{

                requestedRides =
                    new Map();

                snapshot.forEach(
                    (snap)=>{

                        requestedRides.set(
                            snap.id,
                            snap.data()
                        );

                    }
                );

                renderCombined();

            },
            (error)=>{

                console.error(
                    "Requested rides listener:",
                    error
                );

            }
        );


    rideUnsubscribe = ()=>{

        unsubscribeSearching();
        unsubscribeRequested();

    };

}


/* =========================================================
   STOP RIDE LISTENER
========================================================= */

function stopRideListener(){

    if(rideUnsubscribe){

        rideUnsubscribe();

        rideUnsubscribe =
            null;

    }

}


/* =========================================================
   CREATE RIDE CARD
========================================================= */

function createRideCard(
    rideId,
    ride
){

    const card =
        document.createElement("div");


    card.className =
        "ride-card";


    const service =
        String(
            ride.serviceType ||
            ride.service ||
            "bike"
        ).toUpperCase();


    const customerName =
        ride.customerName ||
        ride.customer?.name ||
        "RiderX Customer";


    const pickup =
        getLocationText(
            ride.pickup
        );


    const drop =
        getLocationText(
            ride.drop
        );


    const fare =
        Number(
            ride.fare ||
            0
        );


    const distance =
        Number(
            ride.distance ||
            0
        );


    const payment =
        ride.paymentMethod ||
        "Cash";


    card.innerHTML = `

        <div class="ride-header">

            <div class="service-badge">
                ${escapeHtml(service)} RIDE
            </div>

            <div class="ride-status">
                REQUESTED
            </div>

        </div>


        <div class="customer">

            <strong>
                ${escapeHtml(customerName)}
            </strong>

            <small>
                Customer
            </small>

        </div>


        <div class="location-box">

            <div class="location-row">

                <div class="location-icon pickup-icon">

                    <i class="fa-solid fa-location-dot"></i>

                </div>

                <div class="location-content">

                    <div class="location-label">
                        Pickup
                    </div>

                    <div class="location-address">
                        ${escapeHtml(pickup)}
                    </div>

                </div>

            </div>


            <div class="location-row">

                <div class="location-icon drop-icon">

                    <i class="fa-solid fa-location-dot"></i>

                </div>

                <div class="location-content">

                    <div class="location-label">
                        Drop
                    </div>

                    <div class="location-address">
                        ${escapeHtml(drop)}
                    </div>

                </div>

            </div>

        </div>


        <div class="info-grid">

            <div class="info">

                <small>
                    Distance
                </small>

                <strong>
                    ${distance.toFixed(1)} KM
                </strong>

            </div>


            <div class="info">

                <small>
                    Payment
                </small>

                <strong>
                    ${escapeHtml(

            <div class="info">

                <small>
                    Ride
                </small>

                <strong>
                    ${escapeHtml(service)}

        </div>


        <div class="fare-box">

            </button>

    `;

}


/* =========================================================
   ACCEPT RIDE
========================================================= */

window.acceptRide = async function(
    rideId
){

    if(!currentUser){

        showToast(
            "Please login again.",
            "error"
        );

        return;
    }


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const rideSnap =
            await getDoc(
                rideRef
            );


        if(!rideSnap.exists()){

            showToast(
                "Ride no longer exists.",
                "error"
            );

            return;
        }


        const ride =
            rideSnap.data();


        /*
         * Prevent two riders from accepting
         * the same ride.
         */

        if(
            ride.status !== "searching" &&
            ride.status !== "REQUESTED"
        ){

            showToast(
                "This ride has already been accepted.",
                "error"
            );

            return;
        }


        await updateDoc(
            rideRef,
            {

                status:"ACCEPTED",

                riderId:
                    currentUser.uid,

                acceptedAt:
                    serverTimestamp()

            }
        );


        activeRideId =
            rideId;


        stopRideListener();


        showToast(
            "Ride accepted successfully!",
            "success"
        );


        showActiveRide(
            rideId,
            {
                ...ride,
                status:"ACCEPTED",
                riderId:currentUser.uid
            }
        );


        listenToActiveRide(
            rideId
        );

    }

    catch(error){

        console.error(
            "Accept ride error:",
            error
        );


        showToast(
            "Unable to accept ride: " +
            error.message,
            "error"
        );

    }

};


/* =========================================================
   ACTIVE RIDE LISTENER
========================================================= */

function listenToActiveRide(
    rideId
){

    if(activeRideUnsubscribe){

        activeRideUnsubscribe();

    }


    activeRideUnsubscribe =
        onSnapshot(
            doc(
                db,
                "rides",
                rideId
            ),
            (snapshot)=>{

                if(!snapshot.exists()){

                    activeSection.style.display =
                        "none";

                    activeRideId =
                        null;

                    return;

                }


                const ride =
                    snapshot.data();


                if(
                    ride.status === "COMPLETED"
                ){

                    activeSection.style.display =
                        "none";

                    activeRideId =
                        null;

                    if(isOnline){

                        listenForRideRequests();

                    }

                    showToast(
                        "Ride completed.",
                        "success"
                    );

                    return;

                }


                if(
                    ride.riderId ===
                    currentUser.uid
                ){

                    showActiveRide(
                        rideId,
                        ride
                    );

                }

            },
            (error)=>{

                console.error(
                    "Active ride listener:",
                    error
                );

            }
        );

}

                    </div>

                </div>


                <div class="location-row">

                    <div class="location-icon drop-icon">

                        <i class="fa-solid fa-flag-checkered"></i>

                    </div>

                    <div class="location-content">

                        <div class="location-label">
                            Drop
                        </div>

                        <div class="location-address">
                            ${escapeHtml(drop)}

                    </div>

                </div>

            </div>


            <div class="info-grid">

                <div class="info">

                    <small>
                        Distance
                    </small>

                    <strong>
                        ${distance.toFixed(1)} KM
                    </strong>

                </div>


                <div class="info">

                    <small>
                        Payment
                    </small>

                    <strong>
                        ${escapeHtml(
                            String(payment).toUpperCase()
                        )}
                    </strong>

                </div>


                <div class="info">

                    <small>
                        Status
                    </small>

                    <strong>
                        ACCEPTED
                    </strong>

                </div>

            </div>


            <div class="fare-box">

                <div>

                    <div class="fare-label">

/* =========================================================
   COMPLETE RIDE
========================================================= */

window.completeRide = async function(
    rideId
){

    if(!currentUser){

        showToast(
            "Please login again.",
            "error"
        );

        return;
    }


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const rideSnap =
            await getDoc(
                rideRef
            );


        if(!rideSnap.exists()){

            showToast(
                "Ride not found.",
                "error"
            );

            return;
        }


        const ride =
            rideSnap.data();


        if(
            ride.riderId !==
            currentUser.uid
        ){

            showToast(
                "This ride does not belong to you.",
                "error"
            );

            return;
        }


        await updateDoc(
            rideRef,
            {

                status:"COMPLETED",

                completedAt:
                    serverTimestamp()

            }
        );


        activeRideId =
            null;


        if(activeRideUnsubscribe){

            activeRideUnsubscribe();

            activeRideUnsubscribe =
                null;

        }


        activeSection.style.display =
            "none";


        showToast(
            "Ride completed successfully!",
            "success"
        );


        if(isOnline){

            setTimeout(
                ()=>{
                    listenForRideRequests();
                },
                500
            );

        }

    }

    catch(error){

        console.error(
            "Complete ride error:",
            error
        );


        showToast(
            "Unable to complete ride: " +
            error.message,
            "error"
        );

    }

};


/* =========================================================
   ACTIVE RIDE SEARCH
========================================================= */

async function findActiveRide(){

    if(!currentUser)
        return;


    try{

        const ridesQuery =
            query(
                collection(db,"rides"),
                where(
                    "riderId",
                    "==",
                    currentUser.uid
                )
            );


        onSnapshot(
            ridesQuery,
            (snapshot)=>{

                let found = false;


                snapshot.forEach(
                    (snap)=>{

                        const ride =
                            snap.data();


                        if(
                            ride.status ===
                            "ACCEPTED"
                        ){

                            found = true;

                            activeRideId =
                                snap.id;


                            showActiveRide(
                                snap.id,
                                ride
                            );


                            listenToActiveRide(
                                snap.id
                            );

                        }

                    }
                );


                if(!found){

                    activeSection.style.display =
                        "none";

                }

            },
            (error)=>{

                console.error(
                    "Active ride search:",
                    error
                );

            }
        );

    }

    catch(error){

        console.error(
            "Find active ride error:",
            error
        );

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

window.openNavigation = async function(
    rideId
){

    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "rides",
                    rideId
                )
            );


        if(!snap.exists()){

            showToast(
                "Ride not found.",
                "error"
            );

            return;
        }


        const ride =
            snap.data();


        const pickup =
            ride.pickup;


        if(
            !pickup ||
            pickup.lat == null ||
            pickup.lng == null
        ){

            showToast(
                "Pickup coordinates are not available.",
                "error"
            );

            return;
        }


        const url =
            "https://www.google.com/maps/dir/?api=1" +
            "&destination=" +
            encodeURIComponent(
                pickup.lat +
                "," +
                pickup.lng
            );


        window.open(
            url,
            "_blank"
        );

    }

    catch(error){

        console.error(
            error
        );

        showToast(
            "Unable to open navigation.",
            "error"
        );

    }

};


/* =========================================================
   LOCATION TEXT
========================================================= */

function getLocationText(
    location
){

    if(!location)
        return "Location not available";


    if(typeof location === "string")
        return location;


    return (
        location.address ||
        location.name ||
        location.location ||
        (
            location.lat != null &&
            location.lng != null
                ?
                `${location.lat}, ${location.lng}`
                :
                "Location not available"
        )
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{
        stopRideListener();

        if(activeRideUnsubscribe){

            activeRideUnsubscribe();

        }

    }
);
