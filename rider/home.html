<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RiderX | Rider</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
    --yellow:#FFD600;
    --black:#050505;
    --dark:#0d0d0d;
    --card:#151515;
    --border:#292929;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;
    --text:#fff;
    --muted:#888;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Poppins,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:fixed;
    inset:0;
    z-index:1;
}

.leaflet-control-zoom{
    margin-top:145px!important;
    margin-right:10px!important;
}

.leaflet-control-zoom a{
    background:#111!important;
    color:var(--yellow)!important;
    border-color:#333!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
}

/* =========================================================
   TOP HEADER
========================================================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1200;
    padding:10px 12px;
    pointer-events:none;
}

.topbar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    background:rgba(8,8,8,.94);
    border:1px solid #333;
    border-radius:15px;
    padding:8px 15px;
    font-size:20px;
    font-weight:900;
    letter-spacing:-1px;
    box-shadow:0 7px 25px rgba(0,0,0,.4);
    backdrop-filter:blur(12px);
}

.logo span{
    color:var(--yellow);
}

.top-btn{
    width:43px;
    height:43px;
    border-radius:50%;
    border:1px solid #333;
    background:rgba(10,10,10,.94);
    color:#fff;
    font-size:16px;
    pointer-events:auto;
    box-shadow:0 7px 25px rgba(0,0,0,.4);
}

.top-btn:active{
    transform:scale(.94);
}

/* =========================================================
   ONLINE BAR
========================================================= */

.online-control{
    position:fixed;
    top:67px;
    left:12px;
    right:12px;
    z-index:1150;
    max-width:500px;
    margin:auto;

    background:rgba(8,8,8,.95);
    border:1px solid #333;
    border-radius:18px;
    padding:10px 12px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    box-shadow:0 8px 28px rgba(0,0,0,.4);
    backdrop-filter:blur(14px);
}

.online-info{
    display:flex;
    align-items:center;
    gap:9px;
}

.online-dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#666;
}

.online-dot.online{
    background:var(--green);
    box-shadow:0 0 14px rgba(34,197,94,.9);
}

.online-title{
    font-size:13px;
    font-weight:900;
}

.online-sub{
    font-size:8px;
    color:#777;
}

.online-btn{
    border:0;
    border-radius:11px;
    padding:9px 13px;
    background:var(--yellow);
    color:#000;
    font-size:10px;
    font-weight:900;
}

.online-btn.offline{
    background:var(--red);
    color:#fff;
}

/* =========================================================
   LOCATION BUTTON
========================================================= */

.location-btn{
    position:fixed;
    right:13px;
    bottom:205px;
    z-index:1050;

    width:46px;
    height:46px;

    border-radius:50%;
    border:1px solid #444;
    background:#111;
    color:var(--yellow);

    font-size:17px;
    box-shadow:0 7px 22px rgba(0,0,0,.45);
}

.location-btn:active{
    transform:scale(.94);
}

/* =========================================================
   NAVIGATION BANNER
========================================================= */

.navigation-banner{
    position:fixed;
    left:12px;
    right:12px;
    top:130px;
    z-index:1100;

    display:none;

    background:rgba(8,8,8,.96);
    border:1px solid var(--yellow);
    border-radius:17px;
    padding:10px 13px;

    box-shadow:0 8px 28px rgba(0,0,0,.45);
}

.navigation-banner.show{
    display:block;
}

.nav-title{
    color:var(--yellow);
    font-size:10px;
    font-weight:900;
}

.nav-distance{
    font-size:21px;
    font-weight:900;
    line-height:1.2;
}

.nav-sub{
    color:#888;
    font-size:8px;
}

/* =========================================================
   BOTTOM SHEET
========================================================= */

.sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:68px;
    z-index:1100;

    background:rgba(7,7,7,.98);
    border-top:1px solid #292929;
    border-radius:23px 23px 0 0;

    max-height:42vh;
    overflow-y:auto;

    padding:8px 13px 14px;

    box-shadow:0 -12px 35px rgba(0,0,0,.5);
}

.handle{
    width:40px;
    height:4px;
    background:#444;
    border-radius:10px;
    margin:0 auto 10px;
}

.sheet-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:9px;
}

.sheet-title{
    font-size:16px;
    font-weight:900;
}

.request-count{
    color:#777;
    font-size:9px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    background:#111;
    border:1px solid #252525;
    border-radius:16px;
    padding:17px;
    text-align:center;
    color:#777;
    font-size:11px;
}

.empty i{
    display:block;
    color:var(--yellow);
    font-size:24px;
    margin-bottom:7px;
}

/* =========================================================
   REQUEST CARD
========================================================= */

.request-card{
    background:#131313;
    border:1px solid #393939;
    border-radius:18px;
    padding:12px;
    margin-bottom:9px;
}

.request-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.badge{
    background:var(--yellow);
    color:#000;
    border-radius:8px;
    padding:4px 8px;
    font-size:8px;
    font-weight:900;
}

.new-badge{
    color:var(--green);
    font-size:8px;
    font-weight:900;
}

.customer-name{
    font-size:14px;
    font-weight:800;
    margin-bottom:8px;
}

.route{
    background:#080808;
    border:1px solid #222;
    border-radius:13px;
    padding:9px;
}

.route-row{
    display:flex;
    gap:9px;
    align-items:flex-start;
}

.route-row + .route-row{
    margin-top:8px;
}

.route-icon{
    width:23px;
    height:23px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-size:8px;
}

.pick-icon{
    background:#12351f;
    color:var(--green);
}

.drop-icon{
    background:#3a3200;
    color:var(--yellow);
}

.route-label{
    color:#666;
    font-size:7px;
    text-transform:uppercase;
}

.route-address{
    color:#eee;
    font-size:9px;
    line-height:1.35;
    word-break:break-word;
}

.route-line{
    width:1px;
    height:7px;
    background:#444;
    margin-left:11px;
}

.request-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-top:8px;
}

.request-info-box{
    background:#0a0a0a;
    border:1px solid #222;
    border-radius:9px;
    padding:7px;
    text-align:center;
}

.request-info-box small{
    display:block;
    color:#666;
    font-size:6px;
    margin-bottom:2px;
}

.request-info-box strong{
    font-size:9px;
}

.earning-box{
    margin-top:8px;
    background:#1c1800;
    border:1px solid #4c4300;
    border-radius:13px;
    padding:9px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.earning-label{
    color:#aaa;
    font-size:8px;
}

.earning{
    color:var(--yellow);
    font-size:21px;
    font-weight:900;
}

.request-actions{
    display:grid;
    grid-template-columns:1fr 2fr;
    gap:7px;
    margin-top:8px;
}

.reject-btn{
    border:1px solid #552222;
    border-radius:11px;
    background:#291010;
    color:#ff6666;
    padding:11px 5px;
    font-size:10px;
    font-weight:900;
}

.accept{
    border:0;
    border-radius:11px;
    padding:11px;
    background:var(--yellow);
    color:#000;
    font-size:11px;
    font-weight:900;
}

/* =========================================================
   ACTIVE RIDE
========================================================= */

.active-card{
    background:#111;
    border:1px solid var(--green);
    border-radius:18px;
    padding:12px;
}

.active-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:9px;
}

.active-title{
    color:var(--green);
    font-size:13px;
    font-weight:900;
}

.active-status{
    background:#12351f;
    color:var(--green);
    padding:4px 8px;
    border-radius:8px;
    font-size:7px;
    font-weight:900;
}

.customer-box{
    display:flex;
    align-items:center;
    gap:10px;
    background:#0b0b0b;
    border:1px solid #222;
    border-radius:13px;
    padding:9px;
    margin-bottom:8px;
}

.customer-avatar{
    width:39px;
    height:39px;
    border-radius:50%;
    background:#222;
    color:var(--yellow);
    display:flex;
    align-items:center;
    justify-content:center;
}

.customer-info{
    flex:1;
}

.customer-info strong{
    display:block;
    font-size:11px;
}

.customer-info small{
    color:#777;
    font-size:7px;
}

.contact-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:8px;
}

.contact-btn{
    border:1px solid #333;
    border-radius:11px;
    padding:10px;
    font-size:10px;
    font-weight:900;
}

.call-btn{
    background:#12351f;
    color:var(--green);
}

.chat-btn{
    background:#181800;
    color:var(--yellow);
}

.active-route{
    background:#080808;
    border:1px solid #222;
    border-radius:13px;
    padding:9px;
}

.active-fare{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    padding:9px;
    background:#1c1800;
    border:1px solid #4c4300;
    border-radius:13px;
}

.active-fare strong{
    color:var(--yellow);
    font-size:21px;
}

.active-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:8px;
}

.action-btn{
    border:0;
    border-radius:11px;
    padding:11px 6px;
    font-size:9px;
    font-weight:900;
}

.nav-btn{
    background:#222;
    color:#fff;
    border:1px solid #444;
}

.start-btn{
    background:var(--green);
    color:#000;
}

.complete-btn{
    background:var(--green);
    color:#000;
    grid-column:1/-1;
}

.cancel-btn{
    background:#291010;
    color:#ff6666;
    border:1px solid #552222;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    z-index:1500;

    background:rgba(8,8,8,.98);
    border-top:1px solid #292929;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    box-shadow:0 -8px 25px rgba(0,0,0,.45);
}

.nav-item{
    border:0;
    background:transparent;
    color:#777;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;

    font-size:8px;
    font-weight:700;
}

.nav-item i{
    font-size:18px;
}

.nav-item.active{
    color:var(--yellow);
}

.nav-item:active{
    transform:scale(.94);
}

/* =========================================================
   CHAT MODAL
========================================================= */

.chat-overlay{
    position:fixed;
    inset:0;
    z-index:5000;

    display:none;
    background:rgba(0,0,0,.72);
}

.chat-overlay.show{
    display:flex;
    align-items:flex-end;
}

.chat-box{
    width:100%;
    height:82vh;
    background:#0b0b0b;
    border-radius:24px 24px 0 0;
    border-top:1px solid #333;

    display:flex;
    flex-direction:column;
}

.chat-header{
    padding:12px 14px;
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    gap:10px;
}

.chat-back{
    width:37px;
    height:37px;
    border-radius:50%;
    border:1px solid #333;
    background:#151515;
    color:#fff;
}

.chat-person{
    flex:1;
}

.chat-person strong{
    display:block;
    font-size:12px;
}

.chat-person small{
    color:#777;
    font-size:7px;
}

.chat-call{
    width:38px;
    height:38px;
    border-radius:50%;
    border:0;
    background:#12351f;
    color:var(--green);
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:13px;
}

.chat-empty{
    text-align:center;
    color:#666;
    font-size:10px;
    padding-top:30px;
}

.message{
    max-width:78%;
    padding:8px 10px;
    border-radius:13px;
    margin-bottom:8px;
    font-size:10px;
    line-height:1.4;
    word-break:break-word;
}

.message.mine{
    margin-left:auto;
    background:#3a3200;
    color:#fff;
    border-bottom-right-radius:4px;
}

.message.theirs{
    margin-right:auto;
    background:#1b1b1b;
    color:#eee;
    border-bottom-left-radius:4px;
}

.message-time{
    display:block;
    margin-top:3px;
    color:#777;
    font-size:6px;
}

.chat-input-row{
    padding:9px;
    border-top:1px solid #292929;
    display:flex;
    gap:7px;
}

.chat-input{
    flex:1;
    border:1px solid #333;
    border-radius:13px;
    background:#151515;
    color:#fff;
    padding:10px;
    outline:none;
    font-size:10px;
}

.chat-send{
    width:43px;
    border:0;
    border-radius:13px;
    background:var(--yellow);
    color:#000;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:82px;
    transform:translate(-50%,20px);

    z-index:7000;

    background:#222;
    border:1px solid #444;
    border-radius:12px;
    padding:9px 14px;

    font-size:10px;
    opacity:0;
    pointer-events:none;
    transition:.25s;

    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.success{
    border-color:var(--green);
}

.toast.error{
    border-color:var(--red);
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;
    inset:0;
    z-index:8000;

    background:rgba(0,0,0,.68);

    display:none;
    align-items:center;
    justify-content:center;
}

.loading.show{
    display:flex;
}

.loading-box{
    background:#111;
    border:1px solid #333;
    border-radius:18px;
    padding:24px 32px;
    text-align:center;
}

.loading-box i{
    color:var(--yellow);
    font-size:24px;
    margin-bottom:9px;
}

.loading-box p{
    color:#aaa;
    font-size:10px;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .sheet{
        left:50%;
        right:auto;
        width:450px;
        transform:translateX(-50%);
    }

    .bottom-nav{
        left:50%;
        transform:translateX(-50%);
        width:450px;
        border-radius:20px 20px 0 0;
    }

    .online-control{
        max-width:450px;
    }

    .chat-box{
        width:450px;
        margin-left:auto;
        margin-right:auto;
    }
}
</style>
</head>

<body>

<!-- MAP -->
<div id="map"></div>

<!-- TOP BAR -->
<div class="topbar">
    <div class="topbar-row">

        <div class="logo">
            RIDER<span>X</span>
        </div>

        <button class="top-btn" id="profileTopBtn">
            <i class="fa-solid fa-user"></i>
        </button>

    </div>
</div>

<!-- ONLINE -->
<div class="online-control">

    <div class="online-info">

        <div id="onlineDot" class="online-dot"></div>

        <div>
            <div id="onlineTitle" class="online-title">
                Offline
            </div>

            <div id="onlineSub" class="online-sub">
                Go online to receive rides
            </div>
        </div>

    </div>

    <button id="onlineBtn" class="online-btn">
        GO ONLINE
    </button>

</div>

<!-- NAVIGATION -->
<div id="navigationBanner" class="navigation-banner">

    <div id="navigationTitle" class="nav-title">
        NAVIGATING
    </div>

    <div id="navigationDistance" class="nav-distance">
        --
    </div>

    <div id="navigationSub" class="nav-sub">
        --
    </div>

</div>

<!-- LOCATION -->
<button id="locationBtn" class="location-btn">
    <i class="fa-solid fa-location-crosshairs"></i>
</button>

<!-- BOTTOM SHEET -->
<section class="sheet">

    <div class="handle"></div>

    <!-- REQUESTS -->
    <div id="requestsArea">

        <div class="sheet-title-row">

            <div class="sheet-title">
                Ride Requests
            </div>

            <div id="requestCount" class="request-count">
                0 requests
            </div>

        </div>

        <div id="requestsContainer">

            <div class="empty">

                <i class="fa-solid fa-power-off"></i>

                Go online to receive ride requests.

            </div>

        </div>

    </div>

    <!-- ACTIVE RIDE -->
    <div id="activeArea" style="display:none;">

        <div class="sheet-title-row">

            <div class="sheet-title">
                Active Ride
            </div>

            <div class="request-count">
                Current trip
            </div>

        </div>

        <div id="activeContainer"></div>

    </div>

</section>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">

    <button class="nav-item active" id="homeNav">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </button>

    <button class="nav-item" id="ridesNav">
        <i class="fa-solid fa-motorcycle"></i>
        <span>Rides</span>
    </button>

    <button class="nav-item" id="walletNav">
        <i class="fa-solid fa-wallet"></i>
        <span>Wallet</span>
    </button>

    <button class="nav-item" id="profileNav">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
    </button>

</nav>

<!-- CHAT -->
<div id="chatOverlay" class="chat-overlay">

    <div class="chat-box">

        <div class="chat-header">

            <button id="chatBack" class="chat-back">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <div class="chat-person">

                <strong id="chatCustomerName">
                    Customer
                </strong>

                <small>
                    RiderX Active Ride
                </small>

            </div>

            <button id="chatCall" class="chat-call">
                <i class="fa-solid fa-phone"></i>
            </button>

        </div>

        <div id="chatMessages" class="chat-messages">

            <div class="chat-empty">
                Start conversation with customer.
            </div>

        </div>

        <div class="chat-input-row">

            <input
                id="chatInput"
                class="chat-input"
                type="text"
                maxlength="500"
                placeholder="Type message..."
            >

            <button id="chatSend" class="chat-send">
                <i class="fa-solid fa-paper-plane"></i>
            </button>

        </div>

    </div>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- LOADING -->
<div id="loading" class="loading">

    <div class="loading-box">

        <i class="fa-solid fa-spinner fa-spin"></i>

        <p id="loadingText">
            Please wait...
        </p>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import {
    auth,
    db
} from "../firebase/firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp,
    addDoc,
    orderBy,
    runTransaction
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let userData = null;
let riderData = null;

let isOnline = false;

let map = null;
let riderMarker = null;
let accuracyCircle = null;

/* =========================================================
   SOUND
========================================================= */

function playRequestSound(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        if(audioContext.state === "suspended"){
            audioContext.resume();
        }

        const now =
            audioContext.currentTime;

        [0,.18,.36].forEach((offset,index)=>{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = "sine";

            oscillator.frequency.value =
                index === 1 ? 880 : 660;

            gain.gain.setValueAtTime(
                .0001,
                now + offset
            );

            gain.gain.exponentialRampToValueAtTime(
                .20,
                now + offset + .02
            );

            gain.gain.exponentialRampToValueAtTime(
                .0001,
                now + offset + .16
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start(now + offset);
            oscillator.stop(now + offset + .18);

        });

    }
    catch(error){
        console.warn(error);
    }

    try{
        if(navigator.vibrate){
            navigator.vibrate([150,80,150]);
        }
    }
    catch(error){}

}

/* =========================================================
   RIDER MARKER
========================================================= */

function updateRiderMarker(lat,lng,accuracy=0){

    if(!map) return;

    const icon =
        L.divIcon({
            className:"",
            html:`
                <div style="
                    width:48px;
                    height:48px;
                    border-radius:50%;
                    background:#111;
                    border:4px solid #FFD600;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#FFD600;
                    box-shadow:0 0 0 5px rgba(255,214,0,.16),0 5px 20px rgba(0,0,0,.5);
                    font-size:19px;
                ">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
            `,
            iconSize:[48,48],
            iconAnchor:[24,24]
        });

    if(!riderMarker){

        riderMarker =
            L.marker(
                [lat,lng],
                {
                    icon,
                    zIndexOffset:1000
                }
            ).addTo(map);

    }
    else{

        riderMarker.setLatLng([lat,lng]);
    }

    if(accuracy && accuracy < 500){

        if(!accuracyCircle){

            accuracyCircle =
                L.circle(
                    [lat,lng],
                    {
                        radius:accuracy,
                        color:"#FFD600",
                        fillColor:"#FFD600",
                        fillOpacity:.08,
                        weight:1
                    }
                ).addTo(map);

        }
        else{

            accuracyCircle.setLatLng([lat,lng]);
            accuracyCircle.setRadius(accuracy);
        }
    }

    riderLocation = {
        lat,
        lng
    };
}

/* =========================================================
   GPS
========================================================= */

function startLocationTracking(){

    if(!navigator.geolocation){

        showToast(
            "GPS is not supported on this device.",
            "error"
        );

        return;
    }

    if(locationWatchId !== null){

        navigator.geolocation.clearWatch(
            locationWatchId
        );
    }

    locationWatchId =
        navigator.geolocation.watchPosition(
            async position => {

                const {
                    latitude,
                    longitude,
                    accuracy
                } = position.coords;

                updateRiderMarker(
                    latitude,
                    longitude,
                    accuracy
                );

                if(isOnline && currentUser){

                    await updateRiderLocation(
                        latitude,
                        longitude
                    );
                }

                updateNavigationDistance();

            },
            error => {

                console.warn(
                    "GPS error:",
                    error
                );

                if(error.code === 1){

                    showToast(
                        "Please allow location permission.",
                        "error"
                    );
                }

            },
            {
                enableHighAccuracy:true,
                maximumAge:3000,
                timeout:15000
            }
        );
}

async function updateRiderLocation(lat,lng){

    if(!currentUser) return;

    const location = {
        lat:Number(lat),

    };

    try{

        await updateDoc(
            doc(db,"users",currentUser.uid),
            {
                isOnline:true,
                location,
                lat:location.lat,
                lng:location.lng,
                updatedAt:serverTimestamp()
            }
        );

    }
    catch(error){

        console.warn(
            "users location:",
            error
        );
    }

    try{

        await updateDoc(
            doc(db,"riders",currentUser.uid),
            {
                isOnline:true,
                location,
                lat:location.lat,
                lng:location.lng,
                updatedAt:serverTimestamp()
            }
        );

    }
    catch(error){

        console.warn(
            "riders location:",
            error
        );

function requestLocation(){

    if(!navigator.geolocation){

        showToast(
            "GPS not available.",
            "error"
        );

        return;
    }

    navigator.geolocation.getCurrentPosition(
        position => {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;

            updateRiderMarker(
                lat,
                lng,
                position.coords.accuracy
            );

            map.setView(
                [lat,lng],
                16,
                {animate:true}
            );

        },
        ()=>{
            showToast(
                "Please allow location permission.",
                "error"
            );
        },
        {
            enableHighAccuracy:true,
            timeout:15000
        }
    );
}

/* =========================================================
   PROFILE
========================================================= */

async function loadRiderProfile(){

    try{

        const userSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                )
            );

        if(!userSnap.exists()){

            showToast(
                "Rider profile not found.",
                "error"
            );

            return;
        }

        userData =
            userSnap.data();

        const role =
            String(
                userData.role || ""
            )
            .trim()
            .toLowerCase();

        if(role !== "rider"){

            showToast(
                "This is not a rider account.",
                "error"
            );

            return;
        }

        const riderSnap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                )
            );

        riderData =
            riderSnap.exists()
                ? riderSnap.data()
                : {};

        const approved =
            userData.adminApproved === true ||
            riderData.adminApproved === true ||
            userData.approved === true ||
            riderData.approved === true ||
            String(userData.status || "").toLowerCase() === "active" ||
            String(riderData.status || "").toLowerCase() === "active";

        if(!approved){

            location.replace("pending.html");
            return;
        }

        const blocked =
            [
                userData.status,
                riderData.status
            ].some(status =>
                [
                    "blocked",
                    "disabled",
                    "suspended"
                ].includes(
                    String(status || "").toLowerCase()
                )
            );

        if(blocked){

            showToast(
                "Your rider account is disabled.",
                "error"
            );

            return;
        }

        isOnline =
            userData.isOnline === true ||
            riderData.isOnline === true;

        updateOnlineUI();

        if(isOnline){

            listenForRequests();
            requestLocation();

        }
        else{

            showOfflineState();
        }

        findActiveRide();

    }
    catch(error){

        console.error(error);

        showToast(
            "Unable to load rider profile.",
            "error"
        );
    }
}

/* =========================================================
   ONLINE TOGGLE
========================================================= */

onlineBtn.addEventListener(
    "click",
    async()=>{

        if(!currentUser){

            showToast(
                "Please login first.",
                "error"
            );

            return;
        }

        const next =
            !isOnline;

        onlineBtn.disabled = true;

        try{

            const locationData =
                riderLocation
                    ? {
                        lat:riderLocation.lat,
                        lng:riderLocation.lng
                    }
                    : null;

            const userUpdate = {
                isOnline:next,
                updatedAt:serverTimestamp()
            };

            const riderUpdate = {
                isOnline:next,
                updatedAt:serverTimestamp()
            };

            if(locationData){

                userUpdate.location =
                    locationData;

                userUpdate.lat =
                    locationData.lat;

                userUpdate.lng =
                    locationData.lng;

                riderUpdate.location =
                    locationData;

                riderUpdate.lat =
                    locationData.lat;

                riderUpdate.lng =
                    locationData.lng;
            }

            await updateDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                userUpdate
            );

            await updateDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                ),
                riderUpdate
            );

            isOnline = next;

            updateOnlineUI();

            if(isOnline){

                showToast(
                    "You are now ONLINE.",
                    "success"
                );

                listenForRequests();
                requestLocation();

            }
            else{

                stopRequestListener();
                clearRequestMarkers();
                showOfflineState();

                showToast(
                    "You are now OFFLINE.",
                    "success"
                );
            }

        }
        catch(error){

            console.error(
                "Online toggle:",
                error
            );

            showToast(
                "Unable to change online status.",
                "error"
            );
        }

        onlineBtn.disabled = false;
    }
);

/* =========================================================
   REQUEST LISTENER
========================================================= */

function listenForRequests(){

    stopRequestListener();
    clearRequestMarkers();

    const ridesQuery =
        query(
            collection(db,"rides"),
            where(
                "status",
                "==",
                "searching"
            )
        );

    requestListener =
        onSnapshot(
            ridesQuery,
            snapshot => {

                const rides = [];

                snapshot.forEach(
                    snap => {

                        const ride =
                            snap.data();

                        if(
                            ride.riderId &&
                            ride.riderId !== currentUser.uid
                        ){
                            return;
                        }

                        if(
                            rejectedRideIds.has(snap.id)
                        ){
                            return;
                        }

                        rides.push({
                            id:snap.id,
                            ...ride
                        });
                    }
                );

                renderRequests(rides);
            },
            error => {

                console.error(
                    "Ride requests:",
                    error
                );

                showToast(
                    "Ride requests could not be loaded. Check Firestore rules.",
                    "error"
                );
            }
        );
}

function stopRequestListener(){

    if(requestListener){

        requestListener();
        requestListener = null;
    }
}

/* =========================================================
   RENDER REQUESTS
========================================================= */

function renderRequests(rides){

    clearRequestMarkers();

    if(!rides.length){

        requestCount.textContent =
            "0 requests";

        requestsContainer.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-motorcycle"></i>
                ${
                    isOnline
                        ? "Waiting for new ride requests..."
                        : "Go online to receive ride requests."
                }
            </div>
        `;

        return;
    }

    requestCount.textContent =
        rides.length +
        (
            rides.length === 1
                ? " request"
                : " requests"
        );

    requestsContainer.innerHTML = "";

    rides.forEach(ride => {

        if(!seenRideIds.has(ride.id)){

            seenRideIds.add(ride.id);
            playRequestSound();
        }

        requestsContainer.appendChild(
            createRequestCard(ride)
        );

        addRequestMarker(ride);
    });
}

        return;
    }

    const icon =
        L.divIcon({
            className:"",
            html:`
                <div style="
                    width:42px;
                    height:42px;
                    border-radius:50%;
                    background:#FFD600;
                    border:3px solid #111;
                    display:flex;
                    align-items:center;

                    color:#000;

                    <i class="fa-solid fa-location-dot"></i>

            iconSize:[42,42],
            iconAnchor:[21,21]
        });

    const marker =
        L.marker(
            [pickup.lat,pickup.lng],

    const fare =
        Number(ride.fare || 0);

    const distance =
        Number(ride.distance || 0);

    marker.bindPopup(`
        <div style="
            color:#111;
            min-width:170px;
            font-family:Arial;
        ">

            <strong>RiderX New Ride</strong>

            <br><br>

            <b>Fare:</b>
            ₹${fare.toFixed(0)}

            <br>

            <b>Trip:</b>
            ${distance.toFixed(1)} KM

            <br><br>

            <button
                id="popupAccept"
                style="
                    width:100%;
                    padding:9px;
                    background:#FFD600;
                    border:0;
                    border-radius:8px;
                    font-weight:bold;
                ">
                ACCEPT
            </button>

        const button =
            document.getElementById("popupAccept");

                acceptRide(ride.id);
            };
        }
    });

    requestMarkers.set(
        ride.id,
        marker
    );
}

/* =========================================================
   CLEAR REQUEST MARKERS
========================================================= */

function clearRequestMarkers(){

    requestMarkers.forEach(marker=>{

        if(map){
            map.removeLayer(marker);
        }
    });

    requestMarkers.clear();
}

/* =========================================================
   ACCEPT RIDE
   TRANSACTION = prevents two riders accepting same ride
========================================================= */

async function acceptRide(rideId){

    if(!currentUser){

        showToast(
            "Please login again.",
            "error"
        );

        return;
    }

    showLoading("Accepting ride...");

    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );

        let acceptedRide = null;

        await runTransaction(
            db,
            async transaction => {

                const snap =
                    await transaction.get(
                        rideRef
                    );

                if(!snap.exists()){

                    throw new Error(
                        "RIDE_NOT_FOUND"
                    );
                }

                const ride =
                    snap.data();

                if(
                    String(ride.status || "").toLowerCase()
                    !== "searching"
                ){

                    throw new Error(
                        "RIDE_ALREADY_TAKEN"
                    );
                }

                if(
                    ride.riderId &&
                    ride.riderId !== currentUser.uid
                ){

                    throw new Error(
                        "RIDE_ALREADY_ASSIGNED"
                    );
                }

                transaction.update(
                    rideRef,
                    {
                        status:"ACCEPTED",
                        riderId:currentUser.uid,
                        riderName:
                            userData?.name ||
                            userData?.fullName ||
                            currentUser.displayName ||
                            "Rider",
                        riderPhone:
                            userData?.phone ||
                            currentUser.phoneNumber ||
                            "",
                        acceptedAt:
                            serverTimestamp()
                    }
                );

                acceptedRide = {
                    ...ride,
                    id:rideId,
                    status:"ACCEPTED",
                    riderId:currentUser.uid
                };
            }
        );

        activeRideId = rideId;
        activeRide = acceptedRide;

        stopRequestListener();
        clearRequestMarkers();

        hideLoading();

        showToast(
            "Ride accepted!",
            "success"
        );

        showActiveRide();
        listenActiveRide();

        startNavigation("pickup");

    }
    catch(error){

        hideLoading();

        console.error(
            "Accept ride:",
            error
        );

        if(error.message === "RIDE_ALREADY_TAKEN"){

            showToast(
                "Another rider already accepted this ride.",
                "error"
            );

        }
        else if(error.message === "RIDE_NOT_FOUND"){

            );
        }
    }
}

========================================================= */

async function findActiveRide(){

    if(!currentUser) return;

    try{

        const q =
            query(
                collection(db,"rides"),
                where(
                    "riderId",
                    "==",
                    currentUser.uid
                )
            );

        allRidesListener =
            onSnapshot(
                q,
                snapshot => {

                    let found = null;

                    snapshot.forEach(
                        snap => {

                            const ride =
                                snap.data();

                            const status =
                                String(
                                    ride.status || ""
                                ).toUpperCase();

                            if(
                                status === "ACCEPTED" ||
                                status === "STARTED"
                            ){

                                found = {
                                    id:snap.id,
                                    ...ride
                                };
                            }
                        }
                    );

                    if(found){

                        activeRideId =
                            found.id;

                        activeRide =
                            found;

                        showActiveRide();

                        listenActiveRide();

                    }
                    else if(!activeRideId){

                        clearActiveRide();
                    }
                },
                error => {

                    console.error(
                        "Active ride search:",
                        error
                    );
                }
            );

    }
    catch(error){

        console.error(error);
    }
}

/* =========================================================
   ACTIVE RIDE LISTENER
========================================================= */

function listenActiveRide(){

    if(activeRideListener){

        activeRideListener();
        activeRideListener = null;
    }

    if(!activeRideId) return;

    activeRideListener =
        onSnapshot(
            doc(
                db,
                "rides",
                activeRideId
            ),
            snapshot => {

                if(!snapshot.exists()){

                    clearActiveRide();
                    return;
                }

                const ride =
                    snapshot.data();

                if(
                    ride.riderId !==
                    currentUser.uid
                ){
                    return;
                }

                activeRide = {
                    ...ride,
                    id:activeRideId
                };

                const status =
                    String(
                        ride.status || ""
                    ).toUpperCase();

                if(status === "COMPLETED"){

                    clearActiveRide();

                    showToast(
                        "Ride completed.",
                        "success"
                    );

                    if(isOnline){
                        listenForRequests();
                    }

                    return;
                }

                showActiveRide();

                if(status === "ACCEPTED"){

                    startNavigation("pickup");
                }

                if(status === "STARTED"){

                    startNavigation("drop");
                }
            },
            error => {

                console.error(
                    "Active ride listener:",
                    error
                );
            }
        );
}

/* =========================================================
   ROUTING / NAVIGATION
========================================================= */

async function startNavigation(type){

    if(!activeRide){

        showToast(
            "Active ride not found.",
            "error"
        );

        return;
    }

    const destination =
        type === "pickup"
            ? locationData(activeRide.pickup)
            : locationData(activeRide.drop);

    if(
        destination.lat == null ||
        destination.lng == null
    ){

        showToast(
            "Destination coordinates are missing.",
            "error"
        );

        openExternalNavigation(
            destination
        );

        return;
    }

    navigationTarget = {
        lat:destination.lat,
        lng:destination.lng,
        type
    };

    navigationTitle.textContent =
        type === "pickup"
            ? "NAVIGATING TO CUSTOMER"
            : "NAVIGATING TO DROP";

    navigationSub.textContent =
        type === "pickup"
            ? "Follow the road to customer pickup"
            : "Follow the road to customer destination";

    navigationBanner.classList.add("show");

    await drawRoadRoute();

    updateNavigationDistance();

    if(navigationTimer){
        clearInterval(navigationTimer);
    }

    navigationTimer =
        setInterval(
            ()=>{
                drawRoadRoute();
                updateNavigationDistance();
            },
            10000
        );
}

/* =========================================================
   ROAD ROUTE USING OSRM
========================================================= */

async function drawRoadRoute(){

    if(
        !map ||
        !navigationTarget ||
        !riderLocation
    ){
        return;
    }

    const start =
        `${riderLocation.lng},${riderLocation.lat}`;

    const end =
        `${navigationTarget.lng},${navigationTarget.lat}`;

    const url =
        "https://router.project-osrm.org/route/v1/driving/" +
        start +
        ";" +
        end +
        "?overview=full&geometries=geojson";

    try{

        const response =
            await fetch(url);

        if(!response.ok){
            throw new Error("Routing unavailable");
        }

        const data =
            await response.json();

        if(
            !data.routes ||
            !data.routes.length
        ){
            throw new Error("No route");
        }

        const route =
            data.routes[0];

        const coordinates =
            route.geometry.coordinates.map(
                point =>
                    [
                        point[1],
                        point[0]
                    ]
            );

        if(navigationLine){

            map.removeLayer(
                navigationLine
            );
        }

        navigationLine =
            L.polyline(
                coordinates,
                {
                    color:"#FFD600",
                    weight:6,
                    opacity:.95
                }
            ).addTo(map);

        const distanceKm =
            route.distance / 1000;

        navigationDistance.textContent =
            distanceKm < 1
                ? Math.round(
                    route.distance
                ) + " m"
                : distanceKm.toFixed(1) + " km";

        if(targetMarker){

            map.removeLayer(
                targetMarker
            );
        }

        targetMarker =
            L.marker(
                [
                    navigationTarget.lat,
                    navigationTarget.lng
                ],
                {
                    icon:
                        L.divIcon({
                            className:"",
                            html:`
                                <div style="
                                    width:40px;
                                    height:40px;
                                    border-radius:50%;
                                    background:#22c55e;
                                    border:3px solid #fff;
                                    display:flex;
                                    align-items:center;
                                    justify-content:center;
                                    color:#000;
                                    box-shadow:0 4px 15px rgba(0,0,0,.4);
                                ">
                                    <i class="fa-solid fa-flag"></i>
                                </div>
                            `,
                            iconSize:[40,40],
                            iconAnchor:[20,20]
                        }),
                    zIndexOffset:900
                }
            ).addTo(map);

        const bounds =
            L.latLngBounds(
                coordinates
            );

        map.fitBounds(
            bounds,
            {
                padding:[70,70],
                maxZoom:16
            }
        );

    }
    catch(error){

        console.warn(
            "OSRM routing:",
            error
        );

        drawStraightLine();
    }
}

/* =========================================================
   FALLBACK STRAIGHT LINE
========================================================= */

function drawStraightLine(){

    if(
        !map ||
        !navigationTarget ||
        !riderLocation
    ){
        return;
    }

    if(navigationLine){

        map.removeLayer(
            navigationLine
        );
    }

    navigationLine =
        L.polyline(
            [
                [
                    riderLocation.lat,
                    riderLocation.lng
                ],
                [
                    navigationTarget.lat,
                    navigationTarget.lng
                ]
            ],
            {
                color:"#FFD600",
                weight:6,
                opacity:.9,
                dashArray:"12 8"
            }
        ).addTo(map);
}

/* =========================================================
   DISTANCE
========================================================= */

function updateNavigationDistance(){

    if(
        !navigationTarget ||
        !riderLocation
    ){
        return;
    }

    const distance =
        calculateDistance(
            riderLocation.lat,
            riderLocation.lng,
            navigationTarget.lat,
            navigationTarget.lng
        );

    navigationDistance.textContent =
        distance < 1
            ? Math.round(distance * 1000) + " m"
            : distance.toFixed(1) + " km";

    if(distance < .05){

        navigationSub.textContent =
            "You have reached the destination.";
    }
}

/* =========================================================
   STOP NAVIGATION
========================================================= */

function stopNavigation(){

    navigationTarget = null;

    navigationBanner.classList.remove("show");

    if(navigationLine){

        map.removeLayer(
            navigationLine
        );

        navigationLine = null;
    }

    if(targetMarker){

        map.removeLayer(
            targetMarker
        );

        targetMarker = null;
    }

    if(navigationTimer){

        clearInterval(
            navigationTimer
        );

        navigationTimer = null;
    }
}

function openExternalNavigation(destination){

    if(
        !destination ||
        destination.lat == null ||

    const url =

        "&destination=" +

    );
}

/* =========================================================
   DISTANCE CALCULATOR
========================================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;

    const dLat =
        (lat2-lat1) *
        Math.PI / 180;

    const dLon =
        (lon2-lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2)
        +
        Math.cos(
            lat1 *
            Math.PI /
            180
        )
        *
        Math.cos(
            lat2 *
            Math.PI /
            180
        )
        *
        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;
}

/* =========================================================
   LOCATION DATA
========================================================= */

function locationData(value){

    if(!value){

        return {
            text:"Location not available",
            lat:null,
            lng:null
        };
    }

    if(typeof value === "string"){

        return {
            text:value,
            lat:null,
            lng:null
        };
    }

    const lat =
        value.lat ??
        value.latitude ??
        value.coordinates?.lat ??
        null;

    const lng =
        value.lng ??
        value.longitude ??
        value.coordinates?.lng ??
        null;

    return {

        text:
            value.address ||
            value.name ||
            value.location ||
            value.formattedAddress ||
            (
                lat != null &&
                lng != null
                    ? `${lat}, ${lng}`
                    : "Location not available"
            ),

        lat:
            lat != null
                ? Number(lat)
                : null,

        lng:
            lng != null
                ? Number(lng)
                : null
    };
}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

window.addEventListener(
    "beforeunload",
    ()=>{
        stopRequestListener();

        if(activeRideListener){
            activeRideListener();
        }

        if(allRidesListener){
            allRidesListener();
        }

        if(chatListener){
            chatListener();
        }

        if(locationWatchId !== null){

            navigator.geolocation?.clearWatch(
                locationWatchId
            );
        }

        stopNavigation();
    }
);

</script>
