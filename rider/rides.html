<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX - Rider Rides</title>


<link rel="stylesheet" href="../css/Style.css">

</head>


<body>


<div class="dashboard-wrapper">



<div class="card">


<h2>
Rider Status
</h2>


<p id="riderStatus">
Offline
</p>


<button 
id="onlineBtn"
class="btn">

Go Online

</button>


</div>







<div class="card">


<h2>
New Ride Requests
</h2>



<div id="rideList">


<p>
Waiting for rides...
</p>


</div>


</div>





</div>






<script type="module">


import { database } 
from "../firebase/Firebase-config.js";


import {

ref,
onValue,
update

}

from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





let riderOnline=false;


const riderId =
localStorage.getItem("userId");





const statusText =
document.getElementById("riderStatus");


const onlineBtn =
document.getElementById("onlineBtn");


const rideList =
document.getElementById("rideList");







// Online Toggle


onlineBtn.onclick = ()=>{


riderOnline = !riderOnline;



if(riderOnline){


statusText.innerHTML="Online";


onlineBtn.innerHTML="Go Offline";



update(

ref(database,
"riders/"+riderId),

{

online:true,

status:"available"

}


);



}

else{


statusText.innerHTML="Offline";


onlineBtn.innerHTML="Go Online";



update(

ref(database,
"riders/"+riderId),

{

online:false,

status:"offline"

}


);


}



};









// Listen New Rides


const ridesRef =
ref(database,"rides");





onValue(ridesRef,(snapshot)=>{


rideList.innerHTML="";



snapshot.forEach((child)=>{


const ride =
child.val();



const rideId =
child.key;





if(
ride.status==="searching_rider"
&& riderOnline
){



rideList.innerHTML += `

<div class="card">


<h3>
New Ride
</h3>


<p>
Pickup:
${ride.pickup.address}
</p>


<p>
Drop:
${ride.drop.address}
</p>


<p>
Fare:
₹${ride.fare}
</p>



<button 
class="btn"
onclick="acceptRide('${rideId}')">

Accept

</button>


</div>


`;



}



});


});








// Accept Ride


window.acceptRide =
async function(rideId){


await update(

ref(database,
"rides/"+rideId),

{


riderId:riderId,


status:"rider_found"


}


);



alert(
"Ride Accepted"
);


}





</script>


</body>

</html>
