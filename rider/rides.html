<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RiderX - My Rides</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Dashboard.css">
<link rel="stylesheet" href="../css/Responsive.css">

<style>

:root{
    --yellow:#FFD400;
    --black:#080808;
    --dark:#111;
    --card:#181818;
    --border:#2b2b2b;
    --muted:#858585;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#60a5fa;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.rides-page{
    min-height:100vh;
    min-height:100dvh;
    max-width:650px;
    margin:auto;
    background:#0d0d0d;
    padding-bottom:25px;
}

/* HEADER */

.page-header{
    height:68px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:#111;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:30;
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:25px;
    cursor:pointer;
}

.header-info{
    flex:1;
}

.header-info h1{
    font-size:18px;
    font-weight:900;
}

.header-info p{
    color:#777;
    font-size:10px;
    margin-top:3px;
}

.refresh-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.refresh-btn.loading{
    animation:rotate .8s linear infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:13px 14px 3px;
}

.summary-card{
    background:#181818;
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 5px;
    text-align:center;
}

.summary-value{
    font-size:17px;
    font-weight:900;
}

.summary-label{
    color:#666;
    font-size:8px;
    margin-top:4px;
}

/* FILTER */

.filter-row{
    display:flex;
    gap:7px;
    padding:11px 14px 5px;
    overflow-x:auto;
}

.filter-row::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    white-space:nowrap;
    border:1px solid #292929;
    background:#171717;
    color:#aaa;
    padding:8px 13px;
    border-radius:20px;
    font-size:11px;
    cursor:pointer;
}

.filter-btn.active{
    background:var(--yellow);
    color:#000;
    border-color:var(--yellow);
    font-weight:800;
}

/* LIST */

.rides-list{
    padding:9px 14px 20px;
}

/* RIDE CARD */

.ride-card{
    background:#181818;
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:11px;
}

.ride-head{
    display:flex;
    align-items:center;
    padding:13px 14px;
    border-bottom:1px solid #292929;
}

.service-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    background:var(--yellow);
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    margin-right:10px;
}

.ride-main{
    flex:1;
    min-width:0;
}

.ride-title{
    font-size:14px;
    font-weight:800;
}

.ride-date{
    color:#777;
    font-size:9px;
    margin-top:4px;
}

.ride-fare{
    text-align:right;
}

.fare-value{
    font-size:17px;
    font-weight:900;
}

.status{
    display:inline-block;
    margin-top:4px;
    padding:4px 7px;
    border-radius:7px;
    font-size:8px;
    font-weight:800;
    text-transform:uppercase;
}

.status.completed{
    background:rgba(34,197,94,.12);
    color:var(--green);
}

.status.cancelled{
    background:rgba(239,68,68,.12);
    color:var(--red);
}

.status.pending{
    background:rgba(255,212,0,.12);
    color:var(--yellow);
}

.status.accepted,
.status.ongoing{
    background:rgba(96,165,250,.12);
    color:var(--blue);
}

/* ROUTE */

.route{
    padding:13px 14px;
}

.route-row{
    display:flex;
    gap:10px;
    position:relative;
}

.route-row:first-child{
    padding-bottom:15px;
}

.route-row:first-child::after{
    content:"";
    position:absolute;
    left:6px;
    top:16px;
    bottom:-2px;
    width:2px;
    background:#333;
}

.route-dot{
    width:13px;
    height:13px;
    min-width:13px;
    border-radius:50%;
    margin-top:2px;
    position:relative;
    z-index:2;
}

.pickup{
    background:var(--yellow);
}

.drop{
    background:var(--green);
}

.route-content{
    min-width:0;
}

.route-label{
    color:#777;
    font-size:8px;
    text-transform:uppercase;
    margin-bottom:3px;
}

.route-address{
    color:#ddd;
    font-size:11px;
    line-height:1.4;
}

/* DETAILS */

.ride-details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    padding:0 14px 13px;
}

.detail{
    background:#101010;
    border:1px solid #242424;
    border-radius:10px;
    text-align:center;
    padding:9px 4px;
}

.detail-value{
    font-size:11px;
    font-weight:800;
}

.detail-label{
    color:#666;
    font-size:8px;
    margin-top:3px;
}

/* FOOTER */

.ride-footer{
    border-top:1px solid #292929;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:8px;
}

.payment{
    flex:1;
    color:#888;
    font-size:9px;
}

.payment strong{
    color:#ddd;
    font-size:10px;
}

.view-btn{
    height:35px;
    padding:0 13px;
    border:0;
    border-radius:9px;
    background:#292929;
    color:#fff;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
}

/* EMPTY */

.empty-state{
    display:none;
    text-align:center;
    padding:65px 25px;
}

.empty-icon{
    width:75px;
    height:75px;
    border-radius:50%;
    background:#181818;
    border:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:30px;
}

.empty-state h2{
    font-size:18px;
    margin-bottom:7px;
}

.empty-state p{
    color:#777;
    font-size:11px;
    line-height:1.5;
}

/* LOADING */

.loading-state{
    text-align:center;
    padding:45px 20px;
    color:#777;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #303030;
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    width:calc(100% - 30px);
    max-width:600px;
    background:#202020;
    border:1px solid #333;
    border-radius:12px;
    padding:12px 14px;
    text-align:center;
    color:#fff;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.error{
    border-color:rgba(239,68,68,.45);
}

.toast.success{
    border-color:rgba(34,197,94,.45);
}

/* RESPONSIVE */

@media(max-width:390px){

    .summary{
        gap:5px;
    }

    .summary-value{
        font-size:15px;
    }

    .ride-details{
        gap:4px;
    }

}

</style>
</head>

<body>

<div class="rides-page">

    <!-- HEADER -->

    <header class="page-header">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ‹
        </button>

        <div class="header-info">

            <h1>My Rides</h1>

            <p id="rideCount">
                Loading ride history...
            </p>

        </div>

        <button
            class="refresh-btn"
            id="refreshBtn"
            onclick="loadRides()"
        >
            ↻
        </button>

    </header>


    <!-- SUMMARY -->

    <section class="summary">

        <div class="summary-card">

            <div
                class="summary-value"
                id="totalRides"
            >
                0
            </div>

            <div class="summary-label">
                Total Rides
            </div>

        </div>


        <div class="summary-card">

            <div
                class="summary-value"
                id="completedRides"
            >
                0
            </div>

            <div class="summary-label">
                Completed
            </div>

        </div>


        <div class="summary-card">

            <div
                class="summary-value"
                id="totalEarnings"
            >
                ₹0
            </div>

            <div class="summary-label">
                Earnings
            </div>

        </div>

    </section>


    <!-- FILTER -->

    <div class="filter-row">

        <button
            class="filter-btn active"
            onclick="setFilter('all',this)"
        >
            All
        </button>

        <button
            class="filter-btn"
            onclick="setFilter('completed',this)"
        >
            Completed
        </button>

        <button
            class="filter-btn"
            onclick="setFilter('ongoing',this)"
        >
            Ongoing
        </button>

        <button
            class="filter-btn"
            onclick="setFilter('cancelled',this)"
        >
            Cancelled
        </button>

    </div>


    <!-- LIST -->

    <main
        class="rides-list"
        id="ridesList"
    >

        <div
            class="loading-state"
            id="loadingState"
        >

            <div class="spinner"></div>

            Loading your rides...

        </div>


        <div
            class="empty-state"
            id="emptyState"
        >

            <div class="empty-icon">
                🏍
            </div>

            <h2>No rides found</h2>

            <p>
                Your ride history will appear here
                after you complete a ride.
            </p>

        </div>

    </main>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>
/* ==========================================
   RIDERX RIDES
========================================== */

const $ = id => document.getElementById(id);

let allRides = [];
let currentFilter = "all";
let toastTimer;


/* BACK */

function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        window.location.href = "home.html";

    }

}


/* TOAST */

function showToast(message,type=""){

    const toast = $("toast");

    toast.textContent = message;

    toast.className =
        "toast show " + type;

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.className = "toast";

    },3000);

}


/* FILTER */

function setFilter(filter,button){

    currentFilter = filter;

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });

    button.classList.add("active");

    renderRides();

}


/* NORMALIZE */

function normalizeRide(ride,index=0){

    const status =
        String(
            ride.status ||
            ride.rideStatus ||
            "completed"
        ).toLowerCase();


    const fare =
        ride.fare ??
        ride.amount ??
        ride.earnings ??
        ride.totalFare ??
        ride.price ??
        0;


    return {

        ...ride,

        id:
            ride.id ||
            ride.rideId ||
            String(index),

        status:status,

        customerName:
            ride.customerName ||
            ride.userName ||
            ride.customer?.name ||
            "Customer",

        serviceType:
            ride.serviceType ||
            ride.rideType ||
            ride.service ||
            "Bike",

        fare:Number(fare) || 0,

        pickupAddress:
            ride.pickupAddress ||
            ride.pickup?.address ||
            ride.from ||
            "Pickup location",

        dropAddress:
            ride.dropAddress ||
            ride.destinationAddress ||
            ride.drop?.address ||
            ride.to ||
            "Drop-off location",

        distance:
            ride.distance ??
            ride.distanceKm ??
            0,

        duration:
            ride.duration ??
            ride.durationMin ??
            0,

        paymentMethod:
            ride.paymentMethod ||
            ride.payment ||
            "Cash",

        createdAt:
            ride.createdAt ||
            ride.timestamp ||
            ride.date ||
            null

    };

}


/* LOAD RIDES */

async function loadRides(){

    const refresh =
        $("refreshBtn");

    refresh.classList.add("loading");


    $("loadingState").style.display =
        "block";

    $("emptyState").style.display =
        "none";


    try{

        let rides = null;


        if(typeof window.getRiderRides === "function"){

            rides =
                await window.getRiderRides();

        }else if(typeof window.getRideHistory === "function"){

            rides =
                await window.getRideHistory();

        }else if(typeof window.loadRiderRides === "function"){

            rides =
                await window.loadRiderRides();

        }


        if(Array.isArray(rides)){

            allRides =
                rides.map(normalizeRide);

        }else if(
            rides &&
            typeof rides === "object"
        ){

            allRides =
                Object.entries(rides)
                .map(([id,data]) =>
                    normalizeRide({
                        ...data,
                        id:id
                    })
                );

        }else{

            document.dispatchEvent(
                new CustomEvent(
                    "riderxRidesPageReady"
                )
            );

        }


        sortRides();

        updateSummary();

        renderRides();


    }catch(error){

        console.error(
            "Load rides error:",
            error
        );

        $("loadingState").style.display =
            "none";

        showToast(
            "Unable to load rides.",
            "error"
        );

    }finally{

        refresh.classList.remove(
            "loading"
        );

    }

}


/* SORT */

function sortRides(){

    allRides.sort(
        (a,b) => {

            const dateA =
                getDateValue(a.createdAt);

            const dateB =
                getDateValue(b.createdAt);

            return dateB - dateA;

        }
    );

}


/* DATE VALUE */

function getDateValue(value){

    if(!value)
        return 0;

    if(
        typeof value === "object" &&
        typeof value.toMillis === "function"
    ){

        return value.toMillis();

    }

    if(
        typeof value === "object" &&
        value.seconds
    ){

        return value.seconds * 1000;

    }

    const date =
        new Date(value);

    return isNaN(date.getTime())
        ? 0
        : date.getTime();

}


/* DATE FORMAT */

function formatDate(value){

    const timestamp =
        getDateValue(value);

    if(!timestamp)
        return "Recent ride";

    const date =
        new Date(timestamp);

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ) +
    " · " +
    date.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* STATUS */

function normalizeStatus(status){

    const value =
        String(status || "")
        .toLowerCase();

    if(
        value.includes("cancel")
    )
        return "cancelled";

    if(
        value.includes("complete") ||
        value.includes("finish") ||
        value === "done"
    )
        return "completed";

    if(
        value.includes("ongoing") ||
        value.includes("started") ||
        value.includes("progress")
    )
        return "ongoing";

    if(
        value.includes("accept")
    )
        return "accepted";

    return "pending";

}


/* STATUS LABEL */

function statusLabel(status){

    const normalized =
        normalizeStatus(status);

    if(normalized === "completed")
        return "Completed";

    if(normalized === "cancelled")
        return "Cancelled";

    if(normalized === "ongoing")
        return "Ongoing";

    if(normalized === "accepted")
        return "Accepted";

    return "Pending";

}


/* SERVICE ICON */

function serviceIcon(service){

    const value =
        String(service || "")
        .toLowerCase();

    if(value.includes("bike"))
        return "🏍";

    if(
        value.includes("cab") ||
        value.includes("car")
    )
        return "🚕";

    if(value.includes("parcel"))
        return "📦";

    if(value.includes("food"))
        return "🍔";

    return "🚕";

}


/* UPDATE SUMMARY */

function updateSummary(){

    const total =
        allRides.length;

    const completed =
        allRides.filter(
            ride =>
                normalizeStatus(
                    ride.status
                ) === "completed"
        ).length;

    const earnings =
        allRides
        .filter(
            ride =>
                normalizeStatus(
                    ride.status
                ) === "completed"
        )
        .reduce(
            (sum,ride) =>
                sum + Number(
                    ride.fare || 0
                ),
            0
        );


    $("totalRides").textContent =
        total;

    $("completedRides").textContent =
        completed;

    $("totalEarnings").textContent =
        "₹" +
        earnings.toFixed(0);

}


/* RENDER */

function renderRides(){

    const list =
        $("ridesList");

    const loading =
        $("loadingState");

    const empty =
        $("emptyState");


    list
        .querySelectorAll(".ride-card")
        .forEach(card => card.remove());


    loading.style.display =
        "none";


    const filtered =
        allRides.filter(ride => {

            if(currentFilter === "all")
                return true;

            return normalizeStatus(
                ride.status
            ) === currentFilter;

        });


    $("rideCount").textContent =
        `${filtered.length} ${
            filtered.length === 1
                ? "ride"
                : "rides"
        }`;


    if(filtered.length === 0){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(ride => {

        list.appendChild(
            createRideCard(ride)
        );

    });

}


/* CARD */

function createRideCard(ride){

    const card =
        document.createElement("article");

    card.className =
        "ride-card";


    const status =
        normalizeStatus(
            ride.status
        );


    const payment =
        ride.paymentMethod ||
        "Cash";


    card.innerHTML = `

        <div class="ride-head">

            <div class="service-icon">
                ${serviceIcon(ride.serviceType)}
            </div>

            <div class="ride-main">

                <div class="ride-title">
                    ${escapeHTML(
                        ride.customerName
                    )}
                </div>

                <div class="ride-date">
                    ${formatDate(
                        ride.createdAt
                    )}
                </div>

            </div>

            <div class="ride-fare">

                <div class="fare-value">
                    ₹${Number(
                        ride.fare || 0
                    ).toFixed(0)}
                </div>

                <div class="status ${status}">
                    ${statusLabel(
                        ride.status
                    )}
                </div>

            </div>

        </div>


        <div class="route">

            <div class="route-row">

                <div class="route-dot pickup"></div>

                <div class="route-content">

                    <div class="route-label">
                        Pickup
                    </div>

                    <div class="route-address">
                        ${escapeHTML(
                            ride.pickupAddress
                        )}
                    </div>

                </div>

            </div>


            <div class="route-row">

                <div class="route-dot drop"></div>

                <div class="route-content">

                    <div class="route-label">
                        Drop-off
                    </div>

                    <div class="route-address">
                        ${escapeHTML(
                            ride.dropAddress
                        )}
                    </div>

                </div>

            </div>

        </div>


        <div class="ride-details">

            <div class="detail">

                <div class="detail-value">
                    ${escapeHTML(
                        String(
                            ride.distance || "--"
                        )
                    )} km
                </div>

                <div class="detail-label">
                    Distance
                </div>

            </div>


            <div class="detail">

                <div class="detail-value">
                    ${escapeHTML(
                        String(
                            ride.duration || "--"
                        )
                    )} min
                </div>

                <div class="detail-label">
                    Duration
                </div>

            </div>


            <div class="detail">

                <div class="detail-value">
                    ${escapeHTML(
                        String(payment)
                    )}
                </div>

                <div class="detail-label">
                    Payment
                </div>

            </div>

        </div>


        <div class="ride-footer">

            <div class="payment">
                Service:
                <strong>
                    ${escapeHTML(
                        String(
                            ride.serviceType ||
                            "Ride"
                        )
                    )}
                </strong>
            </div>

            <button
                class="view-btn"
                data-id="${escapeHTML(
                    String(ride.id)
                )}"
            >
                View Details
            </button>

        </div>

    `;


    card
        .querySelector(".view-btn")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "ride-details.html?rideId=" +
                    encodeURIComponent(
                        ride.id
                    );

            }
        );


    return card;

}


/* ESCAPE */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* REALTIME */

document.addEventListener(
    "riderxRidesUpdated",
    function(event){

        if(!event.detail)
            return;

        const rides =
            Array.isArray(event.detail)
                ? event.detail
                : Object.entries(event.detail)
                    .map(([id,data]) => ({
                        ...data,
                        id:id
                    }));

        allRides =
            rides.map(normalizeRide);

        sortRides();

        updateSummary();

        renderRides();

    }
);


/* NEW RIDE */

document.addEventListener(
    "riderxRideCompleted",
    function(event){

        if(!event.detail)
            return;

        const ride =
            normalizeRide(
                event.detail
            );

        const existing =
            allRides.findIndex(
                item =>
                    item.id === ride.id
            );

        if(existing >= 0){

            allRides[existing] =
                ride;

        }else{

            allRides.unshift(
                ride
            );

        }

        sortRides();

        updateSummary();

        renderRides();

    }
);


/* READY */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadRides();

    }
);


/* AUTO REFRESH */

setInterval(() => {

    if(
        document.visibilityState ===
        "visible"
    ){

        loadRides();

    }

},60000);

</script>

</body>
</html>
