<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Requests</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

.header{
    background:#ffcc00;
    color:#000;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.request-card{

    background:#1d1d1d;
    padding:18px;
    margin:15px 0;
    border-radius:15px;
    border:1px solid #333;

}

.request-card h3{
    color:#ffcc00;
}


button{

padding:12px 18px;
border:none;
border-radius:10px;
margin:5px;
font-weight:bold;
cursor:pointer;

}


.accept{

background:#00cc66;

}


.reject{

background:#ff3333;

}


.back{

display:block;
margin-top:20px;
background:#ffcc00;
color:#000;
padding:12px;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">
🚦 Ride Requests
</div>


<div class="container">


<div id="requestList">
Loading requests...
</div>


<a class="back" href="dashboard.html">
⬅ Back Dashboard
</a>


</div>



<script type="module">

import { db } from "../firebase/config.js";


import {

collection,
getDocs,
updateDoc,
doc

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



async function loadRequests(){


let box=document.getElementById("requestList");


try{


const snapshot = await getDocs(collection(db,"rides"));


box.innerHTML="";


if(snapshot.empty){

box.innerHTML="<p>No ride requests available</p>";

return;

}



snapshot.forEach((ride)=>{


let data=ride.data();


box.innerHTML += `

<div class="request-card">


<h3>
🚕 New Ride
</h3>


<p>
📍 Pickup: ${data.pickup || "N/A"}
</p>


<p>
📍 Drop: ${data.drop || "N/A"}
</p>


<p>
💰 Fare: ₹${data.fare || "0"}
</p>


<button class="accept" onclick="acceptRide('${ride.id}')">
Accept
</button>


<button class="reject" onclick="rejectRide('${ride.id}')">
Reject
</button>


</div>

`;

});


}

catch(error){

box.innerHTML="Error loading requests";
console.log(error);

}


}



window.acceptRide = async function(id){

await updateDoc(doc(db,"rides",id),{

status:"Accepted"

});

alert("Ride Accepted");

loadRequests();

}



window.rejectRide = async function(id){

await updateDoc(doc(db,"rides",id),{

status:"Rejected"

});

alert("Ride Rejected");

loadRequests();

}



loadRequests();


</script>


</body>

</html>
