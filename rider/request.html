<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RiderX - Ride Request</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Dashboard.css">
<link rel="stylesheet" href="../css/Responsive.css">

<style>

:root{
    --yellow:#FFD400;
    --black:#080808;
    --dark:#111;
    --card:#181818;
    --border:#2b2b2b;
    --muted:#969696;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.request-page{
    min-height:100vh;
    min-height:100dvh;
    max-width:650px;
    margin:auto;
    background:#0d0d0d;
    padding-bottom:30px;
}

/* HEADER */

.page-header{
    height:65px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:#111;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:25px;
    cursor:pointer;
}

.header-title{
    flex:1;
}

.header-title h1{
    font-size:18px;
    font-weight:800;
}

.header-title p{
    color:#777;
    font-size:11px;
    margin-top:3px;
}

/* REQUEST CARD */

.request-wrapper{
    padding:15px;
}

.request-card{
    background:#171717;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
}

/* REQUEST TOP */

.request-top{
    padding:18px 16px;
    background:
        linear-gradient(135deg,rgba(255,212,0,.09),transparent 60%),
        #171717;
    border-bottom:1px solid var(--border);
}

.request-label{
    color:var(--yellow);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.7px;
    margin-bottom:7px;
}

.request-price{
    font-size:31px;
    font-weight:900;
    color:#fff;
}

.request-price span{
    color:#777;
    font-size:12px;
    font-weight:500;
}

/* CUSTOMER */

.customer-section{
    padding:16px;
    border-bottom:1px solid var(--border);
}

.section-heading{
    color:#888;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:11px;
}

.customer-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.customer-avatar{
    width:50px;
    height:50px;
    min-width:50px;
    border-radius:50%;
    background:var(--yellow);
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:900;
}

.customer-info{
    flex:1;
    min-width:0;
}

.customer-name{
    font-size:16px;
    font-weight:800;
}

.customer-rating{
    color:#aaa;
    font-size:11px;
    margin-top:4px;
}

.customer-rating b{
    color:var(--yellow);
}

/* LOCATION */

.location-section{
    padding:17px 16px;
    border-bottom:1px solid var(--border);
}

.location{
    display:flex;
    gap:12px;
    position:relative;
}

.location-line{
    position:absolute;
    left:7px;
    top:20px;
    bottom:-14px;
    width:2px;
    background:#333;
}

.location:last-child .location-line{
    display:none;
}

.location-dot{
    width:16px;
    height:16px;
    min-width:16px;
    border-radius:50%;
    margin-top:2px;
    position:relative;
    z-index:2;
}

.pickup-dot{
    background:var(--yellow);
    box-shadow:0 0 0 4px rgba(255,212,0,.12);
}

.drop-dot{
    background:var(--green);
    box-shadow:0 0 0 4px rgba(34,197,94,.10);
}

.location-content{
    flex:1;
    min-width:0;
    padding-bottom:17px;
}

.location-label{
    font-size:10px;
    color:#888;
    text-transform:uppercase;
    margin-bottom:4px;
}

.location-address{
    font-size:14px;
    line-height:1.35;
    color:#eee;
}

/* RIDE INFO */

.info-section{
    padding:16px;
    border-bottom:1px solid var(--border);
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.info-item{
    background:#101010;
    border:1px solid #242424;
    border-radius:12px;
    padding:11px 7px;
    text-align:center;
}

.info-icon{
    font-size:18px;
    margin-bottom:5px;
}

.info-value{
    font-size:13px;
    font-weight:800;
}

.info-label{
    color:#777;
    font-size:9px;
    margin-top:3px;
}

/* PAYMENT */

.payment-section{
    padding:16px;
    border-bottom:1px solid var(--border);
}

.payment-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.payment-label{
    color:#888;
    font-size:11px;
}

.payment-value{
    font-size:13px;
    font-weight:800;
}

.cash{
    color:var(--green);
}

.online{
    color:#60a5fa;
}

/* NOTES */

.note-section{
    padding:16px;
}

.note-box{
    background:#101010;
    border:1px solid #252525;
    border-radius:12px;
    padding:12px;
    color:#bbb;
    font-size:12px;
    line-height:1.45;
}

/* ACTIONS */

.action-area{
    padding:0 15px 18px;
}

.action-row{
    display:flex;
    gap:10px;
}

.action-btn{
    height:52px;
    border:0;
    border-radius:14px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
}

.reject-btn{
    width:35%;
    background:#252525;
    color:#fff;
    border:1px solid #353535;
}

.accept-btn{
    flex:1;
    background:var(--yellow);
    color:#000;
}

.action-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* LOADING */

.loading-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.loading-box{
    width:180px;
    background:#191919;
    border:1px solid #303030;
    border-radius:18px;
    padding:22px;
    text-align:center;
}

.spinner{
    width:32px;
    height:32px;
    border:3px solid #333;
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 12px;
}

.loading-box p{
    color:#aaa;
    font-size:12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    width:calc(100% - 30px);
    max-width:600px;
    background:#202020;
    border:1px solid #333;
    border-radius:12px;
    padding:12px 14px;
    color:#fff;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.success{
    border-color:rgba(34,197,94,.45);
}

.toast.error{
    border-color:rgba(239,68,68,.45);
}

/* MOBILE */

@media(max-width:400px){

    .request-wrapper{
        padding:10px;
    }

    .info-grid{
        gap:5px;
    }

    .info-item{
        padding:9px 4px;
    }

    .request-price{
        font-size:27px;
    }

}

</style>
</head>

<body>

<div class="request-page">

    <!-- HEADER -->

    <header class="page-header">

        <button
            class="back-btn"
            onclick="goBack()"
            aria-label="Back"
        >
            ‹
        </button>

        <div class="header-title">

            <h1>Ride Request</h1>

            <p id="requestStatus">
                New ride request
            </p>

        </div>

    </header>


    <!-- REQUEST -->

    <main class="request-wrapper">

        <div class="request-card">

            <!-- PRICE -->

            <section class="request-top">

                <div class="request-label">
                    Estimated Earnings
                </div>

                <div class="request-price">
                    ₹<span id="fareAmount">--</span>
                </div>

            </section>


            <!-- CUSTOMER -->

            <section class="customer-section">

                <div class="section-heading">
                    Customer
                </div>

                <div class="customer-row">

                    <div
                        class="customer-avatar"
                        id="customerAvatar"
                    >
                        C
                    </div>

                    <div class="customer-info">

                        <div
                            class="customer-name"
                            id="customerName"
                        >
                            Customer
                        </div>

                        <div class="customer-rating">

                            ★
                            <b id="customerRating">
                                5.0
                            </b>

                            · RiderX Customer

                        </div>

                    </div>

                </div>

            </section>


            <!-- LOCATIONS -->

            <section class="location-section">

                <div class="location">

                    <div class="location-dot pickup-dot"></div>

                    <div class="location-line"></div>

                    <div class="location-content">

                        <div class="location-label">
                            Pickup
                        </div>

                        <div
                            class="location-address"
                            id="pickupAddress"
                        >
                            Pickup location
                        </div>

                    </div>

                </div>


                <div class="location">

                    <div class="location-dot drop-dot"></div>

                    <div class="location-content">

                        <div class="location-label">
                            Drop-off
                        </div>

                        <div
                            class="location-address"
                            id="dropAddress"
                        >
                            Drop-off location
                        </div>

                    </div>

                </div>

            </section>


            <!-- RIDE INFO -->

            <section class="info-section">

                <div class="info-grid">

                    <div class="info-item">

                        <div class="info-icon">
                            📍
                        </div>

                        <div
                            class="info-value"
                            id="distance"
                        >
                            -- km
                        </div>

                        <div class="info-label">
                            Distance
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="info-icon">
                            ⏱
                        </div>

                        <div
                            class="info-value"
                            id="duration"
                        >
                            -- min
                        </div>

                        <div class="info-label">
                            Duration
                        </div>

                    </div>


                    <div class="info-item">

                        <div class="info-icon">
                            🚕
                        </div>

                        <div
                            class="info-value"
                            id="serviceType"
                        >
                            Ride
                        </div>

                        <div class="info-label">
                            Service
                        </div>

                    </div>

                </div>

            </section>


            <!-- PAYMENT -->

            <section class="payment-section">

                <div class="payment-row">

                    <div class="payment-label">
                        Payment Method
                    </div>

                    <div
                        class="payment-value cash"
                        id="paymentMethod"
                    >
                        Cash
                    </div>

                </div>

            </section>


            <!-- NOTE -->

            <section class="note-section">

                <div class="section-heading">
                    Customer Note
                </div>

                <div
                    class="note-box"
                    id="customerNote"
                >
                    No special instructions.
                </div>

            </section>

        </div>

    </main>


    <!-- ACTIONS -->

    <section class="action-area">

        <div class="action-row">

            <button
                class="action-btn reject-btn"
                id="rejectBtn"
                onclick="rejectRide()"
            >
                Reject
            </button>

            <button
                class="action-btn accept-btn"
                id="acceptBtn"
                onclick="acceptRide()"
            >
                Accept Ride
            </button>

        </div>

    </section>

</div>


<!-- LOADING -->

<div
    class="loading-overlay"
    id="loadingOverlay"
>

    <div class="loading-box">

        <div class="spinner"></div>

        <p id="loadingText">
            Processing ride...
        </p>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script>
/* ==========================================
   RIDERX REQUEST PAGE
========================================== */

const $ = id => document.getElementById(id);

let currentRide = null;


/* BACK */

function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        window.location.href = "requests.html";

    }

}


/* TOAST */

let toastTimer;

function showToast(message,type=""){

    const toast = $("toast");

    toast.textContent = message;

    toast.className = "toast show " + type;

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.className = "toast";

    },3000);

}


/* LOADING */

function setLoading(show,text="Processing ride..."){

    $("loadingText").textContent = text;

    $("loadingOverlay").style.display =
        show ? "flex" : "none";

    $("acceptBtn").disabled = show;
    $("rejectBtn").disabled = show;

}


/* SAFE TEXT */

function setText(id,value,fallback="--"){

    const element = $(id);

    if(element){

        element.textContent =
            value !== undefined &&
            value !== null &&
            value !== ""
                ? value
                : fallback;

    }

}


/* URL DATA */

function getRideId(){

    const params =
        new URLSearchParams(window.location.search);

    return (
        params.get("rideId") ||
        params.get("id") ||
        params.get("requestId") ||
        ""
    );

}


/* LOAD RIDE */

async function loadRide(){

    const rideId = getRideId();

    if(!rideId){

        showToast(
            "Ride request ID is missing.",
            "error"
        );

        $("acceptBtn").disabled = true;

        return;

    }

    /*
      Existing RiderX Firebase/ride JS can listen
      to this custom event and provide ride data.
    */

    document.dispatchEvent(
        new CustomEvent("riderxRequestPageReady",{
            detail:{
                rideId:rideId
            }
        })
    );

    /*
      If a global loader already exists in the
      project, use it.
    */

    try{

        if(typeof window.getRideById === "function"){

            const ride =
                await window.getRideById(rideId);

            if(ride){

                renderRide(ride);

                return;

            }

        }

        if(typeof window.loadRideRequest === "function"){

            const ride =
                await window.loadRideRequest(rideId);

            if(ride){

                renderRide(ride);

                return;

            }

        }

    }catch(error){

        console.error(
            "Unable to load ride:",
            error
        );

    }

    /*
      Do not create fake Firebase data.
      Keep the UI usable if the request is supplied
      later by the existing listener.
    */

}


/* RENDER */

function renderRide(ride){

    currentRide = ride;

    const customer =
        ride.customerName ||
        ride.userName ||
        ride.customer?.name ||
        ride.user?.name ||
        "Customer";

    const fare =
        ride.fare ??
        ride.amount ??
        ride.estimatedFare ??
        ride.price;

    const pickup =
        ride.pickupAddress ||
        ride.pickup?.address ||
        ride.pickupLocation ||
        ride.from ||
        "Pickup location";

    const drop =
        ride.dropAddress ||
        ride.destinationAddress ||
        ride.drop?.address ||
        ride.dropLocation ||
        ride.to ||
        "Drop-off location";

    const distance =
        ride.distance ??
        ride.distanceKm;

    const duration =
        ride.duration ??
        ride.durationMin;

    const service =
        ride.serviceType ||
        ride.rideType ||
        ride.service ||
        "Ride";

    const payment =
        ride.paymentMethod ||
        ride.payment ||
        "Cash";

    const note =
        ride.note ||
        ride.customerNote ||
        ride.instructions ||
        "No special instructions.";


    setText(
        "customerName",
        customer
    );

    setText(
        "customerAvatar",
        customer.charAt(0).toUpperCase()
    );

    setText(
        "fareAmount",
        fare !== undefined &&
        fare !== null
            ? Number(fare).toFixed(0)
            : "--"
    );

    setText(
        "pickupAddress",
        pickup
    );

    setText(
        "dropAddress",
        drop
    );

    setText(
        "distance",
        distance !== undefined
            ? `${distance} km`
            : "-- km"
    );

    setText(
        "duration",
        duration !== undefined
            ? `${duration} min`
            : "-- min"
    );

    setText(
        "serviceType",
        formatService(service)
    );

    setText(
        "paymentMethod",
        formatPayment(payment)
    );

    setText(
        "customerNote",
        note
    );


    if(ride.customerRating){

        setText(
            "customerRating",
            ride.customerRating
        );

    }


    if(ride.status){

        setText(
            "requestStatus",
            formatStatus(ride.status)
        );

    }

}


/* SERVICE */

function formatService(service){

    const value =
        String(service).toLowerCase();

    if(value.includes("bike"))
        return "Bike";

    if(value.includes("cab") ||
       value.includes("car"))
        return "Cab";

    if(value.includes("parcel"))
        return "Parcel";

    if(value.includes("food"))
        return "Food";

    return service || "Ride";

}


/* PAYMENT */

function formatPayment(payment){

    const value =
        String(payment).toLowerCase();

    if(value.includes("online") ||
       value.includes("upi"))
        return "Online";

    if(value.includes("cash"))
        return "Cash";

    return payment || "Cash";

}


/* STATUS */

function formatStatus(status){

    const value =
        String(status).toLowerCase();

    if(value === "pending")
        return "New ride request";

    if(value === "accepted")
        return "Ride accepted";

    if(value === "cancelled")
        return "Ride cancelled";

    if(value === "completed")
        return "Ride completed";

    return status;

}


/* ACCEPT */

async function acceptRide(){

    const rideId = getRideId();

    if(!rideId){

        showToast(
            "Ride request ID is missing.",
            "error"
        );

        return;

    }

    setLoading(
        true,
        "Accepting ride..."
    );


    try{

        let result = false;

        if(typeof window.acceptRideRequest === "function"){

            result =
                await window.acceptRideRequest(
                    rideId,
                    currentRide
                );

        }else if(typeof window.acceptRide === "function"){

            result =
                await window.acceptRide(
                    rideId,
                    currentRide
                );

        }else{

            document.dispatchEvent(
                new CustomEvent("riderxAcceptRide",{
                    detail:{
                        rideId:rideId,
                        ride:currentRide
                    }
                })
            );

            /*
              Wait briefly for an existing listener.
            */

            await new Promise(resolve =>
                setTimeout(resolve,500)
            );

            result = true;

        }


        if(result === false){

            throw new Error(
                "Ride acceptance was rejected."
            );

        }


        setText(
            "requestStatus",
            "Ride accepted"
        );

        showToast(
            "Ride accepted successfully.",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "ride-details.html?rideId=" +
                encodeURIComponent(rideId);

        },800);


    }catch(error){

        console.error(
            "Accept ride error:",
            error
        );

        showToast(
            error.message ||
            "Unable to accept ride.",
            "error"
        );

        setLoading(false);

        return;

    }

}


/* REJECT */

async function rejectRide(){

    const rideId = getRideId();

    if(!rideId){

        showToast(
            "Ride request ID is missing.",
            "error"
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to reject this ride?"
        );

    if(!confirmed) return;


    setLoading(
        true,
        "Rejecting ride..."
    );


    try{

        let result = false;

        if(typeof window.rejectRideRequest === "function"){

            result =
                await window.rejectRideRequest(
                    rideId,
                    currentRide
                );

        }else if(typeof window.rejectRide === "function"){

            result =
                await window.rejectRide(
                    rideId,
                    currentRide
                );

        }else{

            document.dispatchEvent(
                new CustomEvent("riderxRejectRide",{
                    detail:{
                        rideId:rideId,
                        ride:currentRide
                    }
                })
            );

            await new Promise(resolve =>
                setTimeout(resolve,400)
            );

            result = true;

        }


        if(result === false){

            throw new Error(
                "Ride rejection was unsuccessful."
            );

        }


        showToast(
            "Ride request rejected.",
            "success"
        );


        setTimeout(() => {

            window.location.href =
                "requests.html";

        },700);


    }catch(error){

        console.error(
            "Reject ride error:",
            error
        );

        showToast(
            error.message ||
            "Unable to reject ride.",
            "error"
        );

        setLoading(false);

    }

}


/* INITIALIZE */

document.addEventListener(
    "DOMContentLoaded",
    loadRide
);


/*
  Allows existing Firebase listeners to push
  a ride object into this page.
*/

document.addEventListener(
    "riderxRideRequestLoaded",
    function(event){

        if(event.detail){

            renderRide(
                event.detail
            );

        }

    }
);

</script>

</body>
    </html>
