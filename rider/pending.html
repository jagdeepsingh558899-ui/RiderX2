<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RiderX - Approval Pending</title>

<meta
    name="theme-color"
    content="#050505"
>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#050505;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:min(440px,100%);
    background:#111;
    border:1px solid #292929;
    border-radius:24px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.logo{
    font-size:38px;
    font-weight:900;
}

.logo span{
    color:#FFE500;
}

.icon{
    margin:30px 0 20px;
    font-size:55px;
    color:#FFE500;
}

h1{
    font-size:24px;
    margin-bottom:10px;
}

p{
    color:#999;
    line-height:1.6;
    font-size:14px;
}

.status{
    margin-top:25px;
    padding:15px;
    background:#181500;
    border:1px solid #5e5200;
    border-radius:14px;
    color:#FFE500;
    font-weight:bold;
}

.btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#FFE500;
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.logout{
    background:#222;
    color:#fff;
    border:1px solid #444;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        RID<span>ERX</span>
    </div>

    <div class="icon">
        ⏳
    </div>

    <h1>
        Approval Pending
    </h1>

    <p>
        Your RiderX rider registration has been
        submitted successfully.
    </p>

    <p>
        Our Admin team will review your rider
        application before activation.
    </p>

    <div
        id="status"
        class="status"
    >
        Checking application status...
    </div>

    <button
        id="refreshBtn"
        class="btn"
    >
        Check Approval Status
    </button>

    <button
        id="logoutBtn"
        class="btn logout"
    >
        Logout
    </button>

</div>


<script type="module">

import {
    auth,
    db,
    doc,
    getDoc,
    signOut,
    onAuthStateChanged
} from "../firebase/firebase-config.js";


const status =
    document.getElementById(
        "status"
    );


const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


function isApproved(data){

    const value =
        String(
            data?.status ??
            data?.approvalStatus ??
            data?.riderStatus ??
            data?.verificationStatus ??
            ""
        )
        .trim()
        .toLowerCase();


    return (
        data?.approved === true ||
        data?.isApproved === true ||
        [
            "approved",
            "active",
            "verified"
        ].includes(value)
    );

}


async function checkStatus(){

    const user =
        auth.currentUser;


    if(!user){

        window.location.replace(
            "../auth/login.html"
        );

        return;

    }


    try{

        status.textContent =
            "Checking application status...";


        const snap =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );


        if(
            !snap.exists()
        ){

            status.textContent =
                "Rider profile not found.";

            return;

        }


        const data =
            snap.data();


        if(
            isApproved(data)
        ){

            status.textContent =
                "✅ Approved! Opening Rider Dashboard...";


            setTimeout(
                () => {

                    window.location.replace(
                        "./Home.html"
                    );

                },
                700
            );


            return;

        }


        const currentStatus =
            data.status ||
            data.approvalStatus ||
            "pending";


        status.textContent =
            "⏳ Application status: " +
            currentStatus;

    }catch(error){

        console.error(
            error
        );

        status.textContent =
            "Unable to check status. Please try again.";

    }

}


onAuthStateChanged(
    auth,
    user => {

        if(!user){

            window.location.replace(
                "../auth/login.html"
            );

            return;

        }

        checkStatus();

    }
);


refreshBtn.addEventListener(
    "click",
    checkStatus
);


document
.getElementById(
    "logoutBtn"
)
.addEventListener(
    "click",
    async () => {

        await signOut(auth);

        window.location.replace(
            "../auth/login.html"
        );

    }
);

</script>

</body>

</html>
