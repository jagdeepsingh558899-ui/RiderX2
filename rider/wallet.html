<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RiderX - Wallet</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Dashboard.css">
<link rel="stylesheet" href="../css/Responsive.css">

<style>

:root{
    --yellow:#FFD400;
    --black:#080808;
    --dark:#111;
    --card:#181818;
    --border:#2b2b2b;
    --muted:#888;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#60a5fa;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.wallet-page{
    min-height:100vh;
    min-height:100dvh;
    max-width:650px;
    margin:auto;
    background:#0d0d0d;
    padding-bottom:25px;
}

/* HEADER */

.page-header{
    height:68px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:#111;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:30;
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:25px;
    cursor:pointer;
}

.header-info{
    flex:1;
}

.header-info h1{
    font-size:18px;
    font-weight:900;
}

.header-info p{
    color:#777;
    font-size:10px;
    margin-top:3px;
}

.refresh-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.refresh-btn.loading{
    animation:rotate .8s linear infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

/* BALANCE */

.balance-card{
    margin:14px;
    background:linear-gradient(
        135deg,
        #1c1c1c,
        #111
    );
    border:1px solid #333;
    border-radius:22px;
    padding:20px;
    position:relative;
    overflow:hidden;
}

.balance-card::after{
    content:"";
    position:absolute;
    width:160px;
    height:160px;
    right:-70px;
    top:-70px;
    border-radius:50%;
    border:25px solid rgba(255,212,0,.06);
}

.balance-label{
    color:#888;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.balance{
    margin-top:7px;
    font-size:38px;
    font-weight:900;
    letter-spacing:-1px;
}

.balance span{
    color:#aaa;
    font-size:17px;
}

.balance-bottom{
    margin-top:15px;
    padding-top:12px;
    border-top:1px solid #292929;
    display:flex;
    align-items:center;
}

.balance-status{
    flex:1;
    color:#777;
    font-size:9px;
}

.balance-status strong{
    color:var(--green);
}

.withdraw-btn{
    border:0;
    background:var(--yellow);
    color:#000;
    border-radius:10px;
    padding:9px 13px;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:0 14px;
}

.stat{
    background:#181818;
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 5px;
    text-align:center;
}

.stat-value{
    font-size:15px;
    font-weight:900;
}

.stat-label{
    color:#666;
    font-size:8px;
    margin-top:4px;
}

/* SECTION */

.section{
    padding:17px 14px 0;
}

.section-title{
    display:flex;
    align-items:center;
    margin-bottom:9px;
}

.section-title h2{
    flex:1;
    font-size:14px;
}

.section-title span{
    color:#666;
    font-size:9px;
}

/* QUICK ACTIONS */

.quick-actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}

.quick-btn{
    background:#181818;
    border:1px solid var(--border);
    border-radius:14px;
    min-height:54px;
    color:#fff;
    display:flex;
    align-items:center;
    padding:10px 12px;
    cursor:pointer;
}

.quick-icon{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#252525;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    margin-right:9px;
}

.quick-text{
    text-align:left;
}

.quick-title{
    font-size:11px;
    font-weight:800;
}

.quick-sub{
    color:#666;
    font-size:8px;
    margin-top:3px;
}

/* TRANSACTIONS */

.transaction-list{
    background:#181818;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}

.transaction{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 13px;
    border-bottom:1px solid #292929;
}

.transaction:last-child{
    border-bottom:0;
}

.transaction-icon{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.transaction-icon.earning{
    background:rgba(34,197,94,.10);
}

.transaction-icon.withdraw{
    background:rgba(239,68,68,.10);
}

.transaction-icon.bonus{
    background:rgba(255,212,0,.10);
}

.transaction-info{
    flex:1;
    min-width:0;
}

.transaction-title{
    font-size:11px;
    font-weight:800;
}

.transaction-date{
    color:#666;
    font-size:8px;
    margin-top:4px;
}

.transaction-amount{
    text-align:right;
    font-size:12px;
    font-weight:900;
}

.transaction-amount.credit{
    color:var(--green);
}

.transaction-amount.debit{
    color:var(--red);
}

/* EMPTY */

.empty-transactions{
    padding:30px 15px;
    text-align:center;
    color:#666;
    font-size:10px;
}

/* PAYOUT INFO */

.info-card{
    background:#181818;
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
}

.info-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.info-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    background:#252525;
    display:flex;
    align-items:center;
    justify-content:center;
}

.info-content{
    flex:1;
}

.info-title{
    font-size:11px;
    font-weight:800;
}

.info-sub{
    color:#666;
    font-size:8px;
    margin-top:3px;
}

.manage-btn{
    border:0;
    border-radius:9px;
    background:#292929;
    color:#fff;
    padding:8px 10px;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px;
    color:#666;
    font-size:10px;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #303030;
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:650px;
    background:#181818;
    border:1px solid #333;
    border-radius:22px 22px 0 0;
    padding:18px 15px calc(18px + env(safe-area-inset-bottom));
    animation:slideUp .25s ease;
}

@keyframes slideUp{
    from{
        transform:translateY(100%);
    }
    to{
        transform:translateY(0);
    }
}

.modal-head{
    display:flex;
    align-items:center;
    margin-bottom:15px;
}

.modal-head h2{
    flex:1;
    font-size:17px;
}

.modal-close{
    width:34px;
    height:34px;
    border:0;
    border-radius:50%;
    background:#292929;
    color:#fff;
    font-size:19px;
}

.withdraw-balance{
    background:#101010;
    border:1px solid #292929;
    border-radius:12px;
    padding:12px;
    margin-bottom:11px;
    text-align:center;
}

.withdraw-balance small{
    display:block;
    color:#666;
    font-size:9px;
}

.withdraw-balance strong{
    display:block;
    font-size:21px;
    margin-top:4px;
}

.amount-input{
    width:100%;
    height:48px;
    border:1px solid #333;
    border-radius:11px;
    background:#101010;
    color:#fff;
    padding:0 13px;
    outline:none;
    font-size:15px;
}

.amount-input:focus{
    border-color:var(--yellow);
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.modal-btn{
    flex:1;
    height:46px;
    border:0;
    border-radius:11px;
    font-size:11px;
    font-weight:900;
}

.modal-cancel{
    background:#292929;
    color:#fff;
}

.modal-submit{
    background:var(--yellow);
    color:#000;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    width:calc(100% - 30px);
    max-width:600px;
    background:#202020;
    border:1px solid #333;
    border-radius:12px;
    padding:12px 14px;
    text-align:center;
    color:#fff;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.success{
    border-color:rgba(34,197,94,.45);
}

.toast.error{
    border-color:rgba(239,68,68,.45);
}

/* RESPONSIVE */

@media(max-width:390px){

    .balance{
        font-size:34px;
    }

    .stats{
        gap:5px;
    }

    .quick-actions{
        gap:6px;
    }

}

</style>
</head>

<body>

<div class="wallet-page">

    <!-- HEADER -->

    <header class="page-header">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ‹
        </button>

        <div class="header-info">

            <h1>Wallet</h1>

            <p>
                Manage your RiderX earnings
            </p>

        </div>

        <button
            class="refresh-btn"
            id="refreshBtn"
            onclick="loadWallet()"
        >
            ↻
        </button>

    </header>


    <!-- BALANCE -->

    <section class="balance-card">

        <div class="balance-label">
            Available Balance
        </div>

        <div class="balance">
            ₹<span id="balance">0</span>
        </div>

        <div class="balance-bottom">

            <div class="balance-status">
                Wallet status:
                <strong id="walletStatus">
                    Active
                </strong>
            </div>

            <button
                class="withdraw-btn"
                onclick="openWithdraw()"
            >
                Withdraw
            </button>

        </div>

    </section>


    <!-- STATS -->

    <section class="stats">

        <div class="stat">

            <div
                class="stat-value"
                id="todayEarnings"
            >
                ₹0
            </div>

            <div class="stat-label">
                Today
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-value"
                id="weekEarnings"
            >
                ₹0
            </div>

            <div class="stat-label">
                This Week
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-value"
                id="monthEarnings"
            >
                ₹0
            </div>

            <div class="stat-label">
                This Month
            </div>

        </div>

    </section>


    <!-- QUICK ACTIONS -->

    <section class="section">

        <div class="section-title">

            <h2>
                Quick Actions
            </h2>

        </div>


        <div class="quick-actions">

            <button
                class="quick-btn"
                onclick="openWithdraw()"
            >

                <div class="quick-icon">
                    💸
                </div>

                <div class="quick-text">

                    <div class="quick-title">
                        Withdraw
                    </div>

                    <div class="quick-sub">
                        Transfer earnings
                    </div>

                </div>

            </button>


            <button
                class="quick-btn"
                onclick="openPaymentMethod()"
            >

                <div class="quick-icon">
                    🏦
                </div>

                <div class="quick-text">

                    <div class="quick-title">
                        Payout Account
                    </div>

                    <div class="quick-sub">
                        Bank / UPI details
                    </div>

                </div>

            </button>

        </div>

    </section>


    <!-- TRANSACTIONS -->

    <section class="section">

        <div class="section-title">

            <h2>
                Recent Transactions
            </h2>

            <span id="transactionCount">
                0 transactions
            </span>

        </div>


        <div
            class="transaction-list"
            id="transactionList"
        >

            <div
                class="loading"
                id="transactionLoading"
            >

                <div class="spinner"></div>

                Loading transactions...

            </div>

        </div>

    </section>


    <!-- PAYOUT -->

    <section class="section">

        <div class="section-title">

            <h2>
                Payout Account
            </h2>

        </div>


        <div class="info-card">

            <div class="info-row">

                <div class="info-icon">
                    🏦
                </div>

                <div class="info-content">

                    <div
                        class="info-title"
                        id="accountTitle"
                    >
                        No payout account
                    </div>

                    <div
                        class="info-sub"
                        id="accountSub"
                    >
                        Add your bank account or UPI
                    </div>

                </div>

                <button
                    class="manage-btn"
                    onclick="openPaymentMethod()"
                >
                    Manage
                </button>

            </div>

        </div>

    </section>

</div>


<!-- WITHDRAW MODAL -->

<div
    class="modal"
    id="withdrawModal"
    onclick="closeWithdrawOutside(event)"
>

    <div class="modal-card">

        <div class="modal-head">

            <h2>
                Withdraw Earnings
            </h2>

            <button
                class="modal-close"
                onclick="closeWithdraw()"
            >
                ×
            </button>

        </div>


        <div class="withdraw-balance">

            <small>
                Available Balance
            </small>

            <strong>
                ₹<span id="withdrawBalance">
                    0
                </span>
            </strong>

        </div>


        <input
            type="number"
            id="withdrawAmount"
            class="amount-input"
            placeholder="Enter amount"
            min="1"
            inputmode="decimal"
        >


        <div class="modal-actions">

            <button
                class="modal-btn modal-cancel"
                onclick="closeWithdraw()"
            >
                Cancel
            </button>

            <button
                class="modal-btn modal-submit"
                onclick="submitWithdraw()"
            >
                Withdraw
            </button>

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script>
/* ==========================================
   RIDERX WALLET
========================================== */

const $ = id => document.getElementById(id);

let walletData = {
    balance:0,
    today:0,
    week:0,
    month:0
};

let transactions = [];
let toastTimer;


/* BACK */

function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        window.location.href =
            "home.html";

    }

}


/* TOAST */

function showToast(message,type=""){

    const toast =
        $("toast");

    toast.textContent =
        message;

    toast.className =
        "toast show " + type;

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.className =
                "toast";

        },3000);

}


/* NUMBER */

function number(value){

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


/* FORMAT MONEY */

function money(value){

    return number(value)
        .toLocaleString(
            "en-IN",
            {
                maximumFractionDigits:0
            }
        );

}


/* RENDER BALANCE */

function renderWallet(){

    $("balance").textContent =
        money(walletData.balance);

    $("withdrawBalance").textContent =
        money(walletData.balance);

    $("todayEarnings").textContent =
        "₹" + money(
            walletData.today
        );

    $("weekEarnings").textContent =
        "₹" + money(
            walletData.week
        );

    $("monthEarnings").textContent =
        "₹" + money(
            walletData.month
        );

}


/* LOAD WALLET */

async function loadWallet(){

    const refresh =
        $("refreshBtn");

    refresh.classList.add(
        "loading"
    );


    try{

        let data = null;


        if(typeof window.getRiderWallet === "function"){

            data =
                await window.getRiderWallet();

        }else if(typeof window.loadRiderWallet === "function"){

            data =
                await window.loadRiderWallet();

        }else if(typeof window.getWalletData === "function"){

            data =
                await window.getWalletData();

        }


        if(data){

            walletData = {

                ...walletData,

                ...data,

                balance:number(
                    data.balance ??
                    data.availableBalance
                ),

                today:number(
                    data.today ??
                    data.todayEarnings
                ),

                week:number(
                    data.week ??
                    data.weekEarnings
                ),

                month:number(
                    data.month ??
                    data.monthEarnings
                )

            };

        }


        renderWallet();

        await loadTransactions();


        document.dispatchEvent(
            new CustomEvent(
                "riderxWalletPageReady"
            )
        );


    }catch(error){

        console.error(
            "Wallet loading error:",
            error
        );

        showToast(
            "Unable to load wallet.",
            "error"
        );

    }finally{

        refresh.classList.remove(
            "loading"
        );

    }

}


/* LOAD TRANSACTIONS */

async function loadTransactions(){

    const loading =
        $("transactionLoading");

    loading.style.display =
        "block";


    try{

        let data = null;


        if(typeof window.getWalletTransactions === "function"){

            data =
                await window.getWalletTransactions();

        }else if(typeof window.getRiderTransactions === "function"){

            data =
                await window.getRiderTransactions();

        }else if(typeof window.loadWalletTransactions === "function"){

            data =
                await window.loadWalletTransactions();

        }


        if(Array.isArray(data)){

            transactions =
                data;

        }else if(
            data &&
            typeof data === "object"
        ){

            transactions =
                Object.entries(data)
                .map(([id,value]) => ({
                    ...value,
                    id:id
                }));

        }


        renderTransactions();


    }catch(error){

        console.error(
            "Transaction loading error:",
            error
        );

        renderTransactions();

    }finally{

        loading.style.display =
            "none";

    }

}


/* TRANSACTION TYPE */

function transactionType(transaction){

    const value =
        String(
            transaction.type ||
            transaction.category ||
            ""
        ).toLowerCase();

    if(
        value.includes("withdraw") ||
        value.includes("debit")
    )
        return "withdraw";

    if(
        value.includes("bonus") ||
        value.includes("reward")
    )
        return "bonus";

    return "earning";

}


/* DATE */

function transactionDate(value){

    if(!value)
        return "Recent";

    let timestamp = 0;


    if(
        typeof value === "object" &&
        typeof value.toMillis === "function"
    ){

        timestamp =
            value.toMillis();

    }else if(
        typeof value === "object" &&
        value.seconds
    ){

        timestamp =
            value.seconds * 1000;

    }else{

        timestamp =
            new Date(value).getTime();

    }


    if(!timestamp ||
       Number.isNaN(timestamp))
        return "Recent";


    return new Date(
        timestamp
    ).toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* RENDER TRANSACTIONS */

function renderTransactions(){

    const list =
        $("transactionList");


    list
        .querySelectorAll(".transaction")
        .forEach(
            item => item.remove()
        );


    if(!transactions.length){

        const empty =
            document.createElement("div");

        empty.className =
            "empty-transactions";

        empty.textContent =
            "No transactions yet.";

        list.appendChild(
            empty
        );

        $("transactionCount").textContent =
            "0 transactions";

        return;

    }


    $("transactionCount").textContent =
        `${transactions.length} ${
            transactions.length === 1
                ? "transaction"
                : "transactions"
        }`;


    transactions
        .sort(
            (a,b) => {

                const dateA =
                    new Date(
                        a.createdAt ||
                        a.timestamp ||
                        a.date ||
                        0
                    ).getTime();

                const dateB =
                    new Date(
                        b.createdAt ||
                        b.timestamp ||
                        b.date ||
                        0
                    ).getTime();

                return dateB - dateA;

            }
        )
        .slice(0,10)
        .forEach(transaction => {

            const type =
                transactionType(
                    transaction
                );


            const amount =
                number(
                    transaction.amount ??
                    transaction.value ??
                    transaction.fare
                );


            const title =
                transaction.title ||
                transaction.description ||
                (
                    type === "withdraw"
                        ? "Withdrawal"
                        : type === "bonus"
                            ? "Bonus / Reward"
                            : "Ride Earnings"
                );


            const icon =
                type === "withdraw"
                    ? "💸"
                    : type === "bonus"
                        ? "🎁"
                        : "💰";


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "transaction";


            div.innerHTML = `

                <div class="transaction-icon ${type}">
                    ${icon}
                </div>

                <div class="transaction-info">

                    <div class="transaction-title">
                        ${escapeHTML(title)}
                    </div>

                    <div class="transaction-date">
                        ${transactionDate(
                            transaction.createdAt ||
                            transaction.timestamp ||
                            transaction.date
                        )}
                    </div>

                </div>

                <div class="transaction-amount ${
                    type === "withdraw"
                        ? "debit"
                        : "credit"
                }">

                    ${
                        type === "withdraw"
                            ? "-"
                            : "+"
                    }₹${money(amount)}

                </div>

            `;


            list.appendChild(
                div
            );

        });

}


/* WITHDRAW */

function openWithdraw(){

    $("withdrawBalance").textContent =
        money(
            walletData.balance
        );

    $("withdrawAmount").value =
        "";

    $("withdrawModal")
        .classList.add(
            "show"
        );

}


function closeWithdraw(){

    $("withdrawModal")
        .classList.remove(
            "show"
        );

}


function closeWithdrawOutside(event){

    if(
        event.target ===
        $("withdrawModal")
    ){

        closeWithdraw();

    }

}


/* SUBMIT WITHDRAW */

async function submitWithdraw(){

    const amount =
        number(
            $("withdrawAmount").value
        );


    if(amount <= 0){

        showToast(
            "Enter a valid withdrawal amount.",
            "error"
        );

        return;

    }


    if(amount > walletData.balance){

        showToast(
            "Insufficient wallet balance.",
            "error"
        );

        return;

    }


    try{

        let result = true;


        if(typeof window.requestWithdrawal === "function"){

            result =
                await window.requestWithdrawal(
                    amount
                );

        }else if(typeof window.withdrawWallet === "function"){

            result =
                await window.withdrawWallet(
                    amount
                );

        }else{

            document.dispatchEvent(
                new CustomEvent(
                    "riderxWithdrawRequest",
                    {
                        detail:{
                            amount:amount
                        }
                    }
                )
            );

        }


        if(result === false){

            throw new Error(
                "Withdrawal request failed."
            );

        }


        closeWithdraw();


        showToast(
            "Withdrawal request submitted.",
            "success"
        );


        await loadWallet();


    }catch(error){

        console.error(
            "Withdrawal error:",
            error
        );

        showToast(
            error.message ||
            "Unable to submit withdrawal.",
            "error"
        );

    }

}


/* PAYMENT METHOD */

function openPaymentMethod(){

    if(
        typeof window.openRiderPayoutSettings ===
        "function"
    ){

        window.openRiderPayoutSettings();

        return;

    }


    if(
        typeof window.openPaymentSettings ===
        "function"
    ){

        window.openPaymentSettings();

        return;

    }


    window.location.href =
        "settings.html";

}


/* WALLET UPDATE */

document.addEventListener(
    "riderxWalletUpdated",
    function(event){

        if(!event.detail)
            return;

        walletData = {

            ...walletData,

            ...event.detail,

            balance:number(
                event.detail.balance ??
                walletData.balance
            )

        };

        renderWallet();

    }
);


/* NEW TRANSACTION */

document.addEventListener(
    "riderxWalletTransaction",
    function(event){

        if(!event.detail)
            return;

        transactions.unshift(
            event.detail
        );

        renderTransactions();

        if(event.detail.amount){

            walletData.balance +=
                number(
                    event.detail.amount
                );

            renderWallet();

        }

    }
);


/* ESCAPE */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* INIT */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadWallet();

    }
);


/* AUTO REFRESH */

setInterval(() => {

    if(
        document.visibilityState ===
        "visible"
    ){

        loadWallet();

    }

},60000);

</script>
