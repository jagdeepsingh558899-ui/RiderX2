<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Requests</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
background:#000;
color:white;
font-family:Arial;
}


.header{

background:#111;
padding:20px;
font-size:22px;
font-weight:bold;
border-bottom:2px solid #FFD600;

}


.container{

padding:20px;

}



.request-card{

background:#111;
padding:20px;
border-radius:18px;
margin-bottom:15px;
border:1px solid #333;

}



button{

width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#FFD600;
font-weight:bold;

}



.reject{

background:white;

}


</style>


</head>


<body>


<div class="header">

📩 New Ride Requests

</div>



<div class="container">


<div id="requestList">

Loading...

</div>



</div>




<script type="module">


import { auth, db } from "../firebase/config.js";


import {

collection,
query,
where,
getDocs,
doc,
updateDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let riderId=null;




auth.onAuthStateChanged((user)=>{

if(user){

riderId=user.uid;

loadRequests();

}

});






async function loadRequests(){


let box=document.getElementById("requestList");


const q=query(

collection(db,"rides"),

where("status","==","Pending")

);



const snapshot=await getDocs(q);



box.innerHTML="";



if(snapshot.empty){

box.innerHTML="<p>No ride requests</p>";

return;

}





snapshot.forEach((ride)=>{


let data=ride.data();



box.innerHTML += `

<div class="request-card">


<h2>
🏍 ${data.service}
</h2>


<p>
📍 Pickup:
${data.pickup}
</p>


<p>
📍 Drop:
${data.drop}
</p>


<p>
💰 Fare:
₹${data.fare}
</p>



<button onclick="acceptRide('${ride.id}')">

Accept Ride

</button>


<button class="reject" onclick="rejectRide('${ride.id}')">

Reject

</button>



</div>

`;



});



}





window.acceptRide=async(id)=>{


await updateDoc(

doc(db,"rides",id),

{


status:"Accepted",


riderId:riderId,


acceptedAt:serverTimestamp()


}

);



alert(
"Ride Accepted ✅"
);


loadRequests();


};






window.rejectRide=async(id)=>{


await updateDoc(

doc(db,"rides",id),

{


status:"Rejected"

}

);



loadRequests();


};




setInterval(loadRequests,10000);


</script>



</body>

</html>
