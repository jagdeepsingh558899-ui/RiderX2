<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Requests</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body{
margin:0;
background:#000;
color:white;
font-family:Arial;
}


.header{

padding:20px;
background:#111;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:2px solid #FFD600;

}


#map{

height:45vh;
width:100%;

}


.container{

padding:15px;

}



.card{

background:#111;
padding:18px;
border-radius:18px;
margin-top:15px;
border:1px solid #333;

}


button{

width:100%;
padding:14px;
margin-top:12px;
background:#FFD600;
border:none;
border-radius:12px;
font-weight:bold;

}


</style>

</head>


<body>


<div class="header">

🏍 Rider Requests

</div>



<div id="map"></div>



<div class="container">

<div id="requestList">

Loading Rides...

</div>

</div>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>




<script type="module">


import {auth,db} from "../firebase/config.js";


import {

collection,
query,
where,
getDocs,
doc,
updateDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let map;



let riderMarker=null;


let markers=[];




map=L.map("map").setView(

[30.7333,76.7794],

13

);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);







function riderLocation(){



navigator.geolocation.watchPosition(

(pos)=>{


let lat=pos.coords.latitude;

let lng=pos.coords.longitude;



if(riderMarker){


riderMarker.setLatLng([lat,lng]);


}

else{


riderMarker=L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup("🏍 You");


}




}

);



}








async function loadRequests(){



let box=document.getElementById("requestList");


box.innerHTML="";




markers.forEach(m=>{

map.removeLayer(m);

});


markers=[];






let q=query(

collection(db,"rides"),

where("status","==","Pending")

);





let snap=await getDocs(q);






if(snap.empty){


box.innerHTML=

"<h3>No Ride Available</h3>";

return;

}





snap.forEach((ride)=>{



let data=ride.data();






if(data.pickupCoords){


let marker=L.marker(

[

data.pickupCoords.lat,

data.pickupCoords.lng

]

)

.addTo(map)

.bindPopup(

"📍 Customer Pickup"

);



markers.push(marker);


}





box.innerHTML +=`


<div class="card">


<h2>

${data.service || "Ride"}

</h2>



<p>

📍 Pickup:

<br>

${data.pickup}

</p>



<p>

🏁 Drop:

<br>

${data.drop}

</p>



<p>

💰 Fare:

₹${data.fare}

</p>



<button onclick="acceptRide('${ride.id}')">

Accept Ride

</button>



</div>


`;



});



}








window.acceptRide=async function(id){



let user=auth.currentUser;



if(!user){

alert("Login Required");

return;

}





await updateDoc(

doc(db,"rides",id),

{


status:"Accepted",


riderId:user.uid,


acceptedAt:serverTimestamp()



}

);





localStorage.setItem(

"rideId",

id

);



alert("Ride Accepted ✅");



location.href="live.html";



};






riderLocation();


loadRequests();



setInterval(

loadRequests,

10000

);



</script>


</body>

</html>
