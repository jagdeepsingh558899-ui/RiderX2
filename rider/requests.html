</style></head><body><header class="header"><div class="logo">

</div>

<div class="online">

    <div class="online-dot"></div>

    ONLINE

</div>

</header><div id="map"></div><main class="container"><div class="notice">

    New RiderX requests automatically appear here.
    Accepting a ride will open the live ride screen.

</div>


<button
    id="refreshBtn"
    class="refresh"
>
    🔄 Refresh Requests
</button>


<div class="title-row">

    <div class="title">
        Ride Requests
    </div>

    <div
        id="requestCount"
        class="count"
    >
        0
    </div>

</div>


<div id="requestList">

    <div class="loading">

</main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">

import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


// =========================================================
// STATE
// =========================================================

let currentUser = null;

let map = null;

let riderMarker = null;

let pickupMarkers = [];

let unsubscribeListeners = [];

let rides = new Map();

let accepting = false;


// =========================================================
// DOM
// =========================================================

const requestList =
    document.getElementById(
        "requestList"
    );

const requestCount =
    document.getElementById(
        "requestCount"
    );

const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


// =========================================================
// MAP
// =========================================================

function initMap(){

    map =
        L.map("map")
        .setView(
            [30.7333,76.7794],
            13
        );


    L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap"
        }
    ).addTo(map);


    if(
        navigator.geolocation
    ){

        navigator.geolocation.watchPosition(

            position => {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;


                if(!riderMarker){

                    riderMarker =
                        L.marker(
                            [lat,lng]
                        )
                        .addTo(map)
                        .bindPopup(
                            "🏍️ You"
                        );

                }else{

                    riderMarker.setLatLng(
                        [lat,lng]
                    );

                }

            },

            error => {

                console.log(
                    "GPS:",
                    error.message
                );

            },

            {
                enableHighAccuracy:true,
                maximumAge:5000,
                timeout:15000
            }

        );

    }

}


// =========================================================
// CLEAR PICKUP MARKERS
// =========================================================

function clearMarkers(){

    pickupMarkers.forEach(
        marker => {

            try{

                map.removeLayer(
                    marker
                );

            }catch(e){}

        }
    );

    pickupMarkers = [];

}


// =========================================================
// LOCATION TEXT
// =========================================================

function locationText(
    value
){

    if(!value){

        return "Location unavailable";

    }


    if(
        typeof value ===
        "string"
    ){

        return value;

    }


    if(
        typeof value ===
        "object"
    ){

        if(value.address){

            return value.address;

        }

        if(value.name){

            return value.name;

        }

        if(
            value.lat !== undefined &&
            value.lng !== undefined
        ){

            return (
                Number(value.lat).toFixed(5)
                +
                ", "
                +
                Number(value.lng).toFixed(5)
            );

        }

    }


    return "Location";

}


// =========================================================
// COORDINATES
// =========================================================

function coordinates(
    value
){

    if(
        !value ||
        typeof value !== "object"
    ){

        return null;

    }


    const lat =
        Number(
            value.lat ??
            value.latitude
        );

    const lng =
        Number(
            value.lng ??
            value.longitude
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return null;

    }


    return {
        lat,
        lng
    };

}


// =========================================================
// NORMALIZE STATUS
// =========================================================

function isAvailableRide(
    data
){

    const status =
        String(
            data.status ||
            ""
        )
        .trim()
        .toUpperCase();


    return (
        status === "REQUESTED" ||
        status === "PENDING" ||
        status === "SEARCHING"
    );

}


// =========================================================
// LOAD REQUEST LISTENERS
// =========================================================

function startListeners(){

    stopListeners();


    const statuses = [
        "REQUESTED",
        "PENDING",
        "searching"
    ];


    statuses.forEach(
        status => {

            const q =
                query(
                    collection(
                        db,
                        "rides"
                    ),
                    where(
                        "status",
                        "==",
                        status
                    )
                );


            const unsubscribe =
                onSnapshot(

                    q,

                    snapshot => {

                        snapshot.docChanges()
                            .forEach(
                                change => {

                                    const id =
                                        change.doc.id;

                                    const data =
                                        change.doc.data();


                                    if(
                                        change.type ===
                                        "removed"
                                    ){

                                        rides.delete(
                                            id
                                        );

                                    }else{

                                        if(
                                            isAvailableRide(
                                                data
                                            )
                                        ){

                                            rides.set(
                                                id,
                                                {
                                                    id,
                                                    ...data
                                                }
                                            );

                                        }else{

                                            rides.delete(
                                                id
                                            );

                                        }

                                    }

                                }
                            );


                        renderRequests();

                    },

                    error => {

                        console.error(
                            "Request listener:",
                            error
                        );


                        requestList.innerHTML = `

                            <div class="error">

                                Unable to load ride requests.

                                <br><br>

                                ${escapeHtml(
                                    error.message
                                )}

                            </div>

                        `;

                    }

                );


            unsubscribeListeners.push(
                unsubscribe
            );

        }
    );

}


// =========================================================
// STOP LISTENERS
// =========================================================

function stopListeners(){

    unsubscribeListeners.forEach(
        unsubscribe => {

            try{

                unsubscribe();

            }catch(e){}

        }
    );

    unsubscribeListeners = [];

}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// =========================================================
// RENDER
// =========================================================

function renderRequests(){

    clearMarkers();


    const list =
        Array.from(
            rides.values()
        );


    list.sort(
        (a,b) => {

            const aTime =
                a.createdAt?.seconds ||
                0;

            const bTime =
                b.createdAt?.seconds ||
                0;

            return bTime - aTime;

        }
    );


    requestCount.innerText =
        list.length;


    if(!list.length){

        requestList.innerHTML = `

            <div class="empty">

                <strong>
                    No ride requests
                </strong>

                New ride requests will appear
                automatically.

            </div>

        `;

        return;

    }


    requestList.innerHTML = "";


    list.forEach(
        ride => {

            renderRide(
                ride
            );

        }
    );

}


// =========================================================
// RENDER SINGLE RIDE
// =========================================================

function renderRide(
    ride
){

    const pickup =
        locationText(
            ride.pickup
        );


    const drop =
        locationText(
            ride.drop
        );


    const pickupCoords =
        coordinates(
            ride.pickupCoords
        )
        ||
        coordinates(
            ride.pickup
        );


    const fare =
        Number(
            ride.fare || 0
        );


    const distance =
        Number(
            ride.distance || 0
        );


    const service =
        ride.serviceType ||
        ride.service ||
        ride.rideType ||
        "Bike Taxi";


    if(pickupCoords){

        const marker =
            L.marker(
                [
                    pickupCoords.lat,
                    pickupCoords.lng
                ]
            )
            .addTo(map)
            .bindPopup(
                "📍 Customer Pickup"
            );


        pickupMarkers.push(
            marker
        );

    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    card.dataset.rideId =
        ride.id;


    card.innerHTML = `

        <div class="card-top">

            <div>

                <div class="service">

                    ${escapeHtml(
                        service
                    )}

                </div>

                <div class="service-small">

                    RiderX ride request

                </div>

            </div>

            <div class="fare">

                ₹${fare}

            </div>

        </div>


        <div class="route">

            <div class="route-row">

                <div class="route-icon">
                    📍
                </div>

                <div>

                    <div class="route-label">
                        Pickup
                    </div>

                    <div class="route-value">

                        ${escapeHtml(
                            pickup
                        )}

                    </div>

                </div>

            </div>


            <div class="route-row">

                <div class="route-icon">
                    🏁
                </div>

                <div>

                    <div class="route-label">
                        Drop
                    </div>

                    <div class="route-value">

                        ${escapeHtml(
                            drop
                        )}

                    </div>

                </div>

            </div>

        </div>


        <div class="meta">

            <div class="meta-box">

                <div class="meta-label">
                    Distance
                </div>

                <div class="meta-value">

                    ${distance.toFixed(1)}
                    KM

                </div>

            </div>


            <div class="meta-box">

                <div class="meta-label">
                    Payment
                </div>

                <div class="meta-value">

                    ${escapeHtml(
                        ride.paymentMethod ||
                        ride.payment ||
                        "Cash"
                    )}

                </div>

            </div>


            <div class="meta-box">

                <div class="meta-label">
                    Status
                </div>

                <div class="meta-value">

                    ${escapeHtml(
                        String(
                            ride.status ||
                            "REQUESTED"
                        ).toUpperCase()
                    )}

                </div>

            </div>

        </div>


        <div class="buttons">

            <button
                class="accept"
                data-action="accept"
                data-id="${escapeHtml(
                    ride.id
                )}"
            >
                ✓ Accept Ride
            </button>


            <button
                class="reject"
                data-action="reject"
                data-id="${escapeHtml(
                    ride.id
                )}"
            >
                ✕ Reject
            </button>

        </div>

    `;


    requestList.appendChild(
        card
    );

}


// =========================================================
// ACCEPT RIDE
// =========================================================

async function acceptRide(
    rideId
){

    if(
        accepting
    ){

        return;

    }


    if(!currentUser){

        alert(
            "Rider login required."
        );

        return;

    }


    const ride =
        rides.get(
            rideId
        );


    if(!ride){

        alert(
            "Ride no longer available."
        );

        return;

    }


    accepting = true;


    const buttons =
        document.querySelectorAll(
            `[data-id="${CSS.escape(
                rideId
            )}"]`
        );


    buttons.forEach(
        button => {

            button.disabled = true;

        }
    );


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        await updateDoc(
            rideRef,
            {

                riderId:
                    currentUser.uid,

                status:
                    "ACCEPTED",

                acceptedAt:
                    serverTimestamp()

            }
        );


        localStorage.setItem(
            "rideId",
            rideId
        );


        localStorage.setItem(
            "activeRideId",
            rideId
        );


        localStorage.setItem(
            "riderx_active_ride",
            rideId
        );


        window.location.href =
            "live.html?rideId=" +
            encodeURIComponent(
                rideId
            );


    }catch(error){

        console.error(
            "Accept Ride Error:",
            error
        );


        accepting = false;


        buttons.forEach(
            button => {

                button.disabled =
                    false;

            }
        );


        alert(
            "Ride accept nahi hui:\n\n" +
            error.message
        );

    }

}


// =========================================================
// REJECT RIDE
// =========================================================

async function rejectRide(
    rideId
){

    if(!currentUser){

        alert(
            "Rider login required."
        );

        return;

    }


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        await updateDoc(
            rideRef,
            {

                status:
                    "REJECTED",

                rejectedBy:
                    currentUser.uid,

                rejectedAt:
                    serverTimestamp()

            }
        );


        rides.delete(
            rideId
        );


        renderRequests();


    }catch(error){

        console.error(
            "Reject Ride Error:",
            error
        );


        alert(
            "Ride reject nahi hui:\n\n" +
            error.message
        );

    }

}


// =========================================================
// CLICK HANDLER
// =========================================================

requestList.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                "button[data-action]"
            );


        if(!button){

            return;

        }


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        if(
            action ===
            "accept"
        ){

            acceptRide(
                id
            );

        }


        if(
            action ===
            "reject"
        ){

            rejectRide(
                id
            );

        }

    }
);


// =========================================================
// REFRESH
// =========================================================

refreshBtn.onclick =
    function(){

        rides.clear();

        renderRequests();

        startListeners();

    };


// =========================================================
// AUTH
// =========================================================

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            requestList.innerHTML = `

                <div class="error">

                    <strong>
                        Login Required
                    </strong>

                    Please login as rider
                    to receive ride requests.

                </div>

            `;

            return;

        }


        currentUser =
            user;


        startListeners();

    }
);


// =========================================================
// INIT
// =========================================================

initMap();

</script></body></html>
