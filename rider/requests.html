</main><div
    id="toast"
    class="toast"
></div><script type="module">

import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


// =========================================================
// STATE
// =========================================================

let currentUser = null;

let rides = [];

let unsubscribe =
    null;

let acceptingRide =
    false;


// =========================================================
// DOM
// =========================================================

const loading =
    document.getElementById(
        "loading"
    );

const requestList =
    document.getElementById(
        "requestList"
    );

const empty =
    document.getElementById(
        "empty"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const requestCount =
    document.getElementById(
        "requestCount"
    );

const todayCount =
    document.getElementById(
        "todayCount"
    );


// =========================================================
// TOAST
// =========================================================

function toast(
    message
){

    const el =
        document.getElementById(
            "toast"
        );


    el.innerText =
        message;


    el.style.display =
        "block";


    clearTimeout(
        window.__toastTimer
    );


    window.__toastTimer =
        setTimeout(
            () => {

                el.style.display =
                    "none";

            },
            2500
        );

}


// =========================================================
// ERROR
// =========================================================

function showError(
    message
){

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


// =========================================================
// CLEAR ERROR
// =========================================================

function clearError(){

    errorBox.innerText =
        "";

    errorBox.style.display =
        "none";

}


// =========================================================
// STATUS
// =========================================================

function normalizeStatus(
    status
){

    return String(
        status || ""
    )
    .trim()
    .toUpperCase();

}


// =========================================================
// OPEN LIVE
// =========================================================

function openLive(
    rideId
){

    localStorage.setItem(
        "activeRideId",
        rideId
    );

    localStorage.setItem(
        "rideId",
        rideId
    );

    localStorage.setItem(
        "riderx_active_ride",
        rideId
    );


    window.location.href =
        "live.html?rideId=" +
        encodeURIComponent(
            rideId
        );

}


// =========================================================
// SERVICE ICON
// =========================================================

function serviceIcon(
    service
){

    const value =
        String(
            service || ""
        )
        .toLowerCase();


    if(
        value.includes(
            "cab"
        )
    ){

        return "🚕";

    }


    if(
        value.includes(
            "parcel"
        )
    ){

        return "📦";

    }


    if(
        value.includes(
            "food"
        )
    ){

        return "🍔";

    }


    return "🏍️";

}


// =========================================================
// SERVICE NAME
// =========================================================

function serviceName(
    ride
){

    return (
        ride.serviceType
        ||
        ride.service
        ||
        ride.rideType
        ||
        "Bike Taxi"
    );

}


// =========================================================
// LOCATION TEXT
// =========================================================

function locationText(
    value,
    fallback
){

    if(
        typeof value ===
        "string"
    ){

        return value;

    }


    if(
        value &&
        typeof value ===
        "object"
    ){

        return (
            value.address
            ||
            value.name
            ||
            value.label
            ||
            (
                value.lat !==
                undefined
                ?
                Number(
                    value.lat
                ).toFixed(5)
                +
                ", " +
                Number(
                    value.lng
                ).toFixed(5)
                :
                fallback
            )
        );

    }


    return fallback;

}


// =========================================================
// PICKUP
// =========================================================

function pickupText(
    ride
){

    return (
        locationText(
            ride.pickupAddress,
            ""
        )
        ||
        locationText(
            ride.pickupLocation,
            ""
        )
        ||
        locationText(
            ride.pickup,
            ""
        )
        ||
        ride.pickupText
        ||
        "Pickup location"
    );

}


// =========================================================
// DROP
// =========================================================

function dropText(
    ride
){

    return (
        locationText(
            ride.dropAddress,
            ""
        )
        ||
        locationText(
            ride.dropLocation,
            ""
        )
        ||
        locationText(
            ride.drop,
            ""
        )
        ||
        ride.destination
        ||
        ride.dropText
        ||
        "Destination"
    );

}


// =========================================================
// FORMAT TIME
// =========================================================

function formatTime(
    value
){

    if(!value){

        return "Just now";

    }


    try{

        let date;


        if(
            value.toDate
        ){

            date =
                value.toDate();

        }else if(
            value instanceof Date
        ){

            date =
                value;

        }else{

            date =
                new Date(
                    value
                );

        }


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "Just now";

        }


        return date.toLocaleTimeString(
            [],
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }catch{

        return "Just now";

    }

}


// =========================================================
// FARE
// =========================================================

function fareValue(
    ride
){

    const fare =
        Number(
            ride.fare
            ??
            ride.estimatedFare
            ??
            ride.amount
            ??
            0
        );


    return "₹" +
        (
            Number.isFinite(
                fare
            )
            ?
            Math.round(
                fare
            )
            :
            0
        );

}


// =========================================================
// DISTANCE
// =========================================================

function distanceValue(
    ride
){

    const distance =
        Number(
            ride.distance
            ??
            ride.estimatedDistance
            ??
            0
        );


    if(
        !Number.isFinite(
            distance
        )
        ||
        distance <= 0
    ){

        return "—";

    }


    return distance.toFixed(
        1
    ) + " km";

}


// =========================================================
// PAYMENT
// =========================================================

function paymentValue(
    ride
){

    return (
        ride.paymentMethod
        ||
        ride.payment
        ||
        "Cash"
    );

}


// =========================================================
// REQUEST CARD
// =========================================================

function createCard(
    ride
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "request-card";


    card.dataset.id =
        ride.id;


    card.innerHTML = `

        <div class="request-top">

            <div class="service-icon">
                ${serviceIcon(
                    serviceName(ride)
                )}
            </div>

            <div class="request-main">

                <div class="service-name">
                    ${escapeHtml(
                        serviceName(ride)
                    )}
                </div>

                <div class="request-time">
                    ${formatTime(
                        ride.createdAt
                    )}
                </div>

            </div>

            <div class="fare">

                <strong>
                    ${fareValue(ride)}
                </strong>

                <span>
                    estimated fare
                </span>

            </div>

        </div>


        <div class="route">

            <div class="route-row">

                <div class="route-dot"></div>

                <div class="route-label">
                    Pickup
                </div>

                <div class="route-address">
                    ${escapeHtml(
                        pickupText(ride)
                    )}
                </div>

            </div>


            <div class="route-row">

                <div class="route-dot drop"></div>

                <div class="route-label">
                    Drop
                </div>

                <div class="route-address">
                    ${escapeHtml(
                        dropText(ride)
                    )}
                </div>

            </div>

        </div>


        <div class="meta">

            <div class="meta-box">

                <span>
                    Distance
                </span>

                <strong>
                    ${distanceValue(ride)}
                </strong>

            </div>


            <div class="meta-box">

                <span>
                    Payment
                </span>

                <strong>
                    ${escapeHtml(
                        paymentValue(ride)
                    )}
                </strong>

            </div>


            <div class="meta-box">

                <span>
                    Customer
                </span>

                <strong>
                    ${escapeHtml(
                        ride.customerName
                        ||
                        ride.userName
                        ||
                        "Customer"
                    )}
                </strong>

            </div>

        </div>


        <div class="actions">

            <button
                class="btn btn-details"
                data-action="details"
            >
                View Details
            </button>

            <button
                class="btn btn-accept"
                data-action="accept"
            >
                Accept Ride
            </button>

        </div>

    `;


    card
        .querySelector(
            '[data-action="details"]'
        )
        .addEventListener(
            "click",
            () => {

                saveRide(
                    ride.id
                );


                window.location.href =
                    "request.html?rideId=" +
                    encodeURIComponent(
                        ride.id
                    );

            }
        );


    card
        .querySelector(
            '[data-action="accept"]'
        )
        .addEventListener(
            "click",
            event => {

                acceptRide(
                    ride,
                    event.currentTarget
                );

            }
        );


    return card;

}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// =========================================================
// RENDER
// =========================================================

function render(){

    requestList.innerHTML =
        "";


    const active =
        rides.filter(
            ride => {

                const status =
                    normalizeStatus(
                        ride.status
                    );


                return (

                    status ===
                    "SEARCHING"

                    ||

                    status ===
                    "REQUESTED"

                    ||

                    status ===
                    "PENDING"

                );

            }
        );


    requestCount.innerText =
        active.length;


    if(
        active.length === 0
    ){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    active.forEach(
        ride => {

            requestList.appendChild(
                createCard(
                    ride
                )
            );

        }
    );

}


// =========================================================
// SAVE RIDE
// =========================================================

function saveRide(
    rideId
){

    localStorage.setItem(
        "activeRideId",
        rideId
    );

    localStorage.setItem(
        "rideId",
        rideId
    );

    localStorage.setItem(
        "riderx_active_ride",
        rideId
    );

}


// =========================================================
// ACCEPT RIDE
// =========================================================

async function acceptRide(
    ride,
    button
){

    if(
        acceptingRide
    ){

        return;

    }


    if(
        !currentUser
    ){

        alert(
            "Please login as rider."
        );

        return;

    }


    acceptingRide =
        true;


    button.disabled =
        true;


    button.innerText =
        "Accepting...";


    try{

        const rideRef =
            doc(
                db,
                "rides",
                ride.id
            );


        const snapshot =
            await getDoc(
                rideRef
            );


        if(
            !snapshot.exists()
        ){

            throw new Error(
                "Ride no longer exists."
            );

        }


        const latest =
            snapshot.data();


        const status =
            normalizeStatus(
                latest.status
            );


        // Another rider already accepted it.

        if(
            status !==
            "SEARCHING"
            &&
            status !==
            "REQUESTED"
            &&
            status !==
            "PENDING"
        ){

            toast(
                "Ye ride already accept ho chuki hai."
            );

            return;

        }


        // If another riderId exists,
        // don't overwrite it.

        if(
            latest.riderId
            &&
            latest.riderId !==
            currentUser.uid
        ){

            toast(
                "Ride kisi aur rider ko assign ho chuki hai."
            );

            return;

        }


        await updateDoc(

            rideRef,

            {

                status:
                    "ACCEPTED",

                riderId:
                    currentUser.uid,

                riderUid:
                    currentUser.uid,

                riderName:
                    currentUser.displayName
                    ||
                    "Rider",

                riderEmail:
                    currentUser.email
                    ||
                    "",

                acceptedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }

        );


        saveRide(
            ride.id
        );


        toast(
            "Ride accepted!"
        );


        // Give Firestore a moment to commit
        // before navigation.

        setTimeout(
            () => {

                openLive(
                    ride.id
                );

            },
            350
        );


    }catch(error){

        console.error(
            "Accept ride error:",
            error
        );


        showError(
            "Ride accept nahi hui: " +
            error.message
        );


        button.disabled =
            false;


        button.innerText =
            "Accept Ride";

    }finally{

        acceptingRide =
            false;

    }

}


// =========================================================
// LISTENER
// =========================================================

function startListener(){

    clearError();


    /*
     * We intentionally do not depend on a composite
     * Firestore index here.
     *
     * This keeps the page working on a fresh Firebase
     * project without requiring manual index creation.
     */

    const ridesRef =
        collection(
            db,
            "rides"
        );


    const q =
        query(
            ridesRef,
            where(
                "status",
                "in",
                [
                    "SEARCHING",
                    "REQUESTED",
                    "PENDING"
                ]
            )
        );


    unsubscribe =
        onSnapshot(

            q,

            snapshot => {

                loading.style.display =
                    "none";


                rides =
                    snapshot.docs.map(
                        item => ({

                            id:
                                item.id,

                            ...item.data()

                        })
                    );


                rides.sort(
                    (
                        a,
                        b
                    ) => {

                        const aTime =
                            a.createdAt
                            ?.toMillis
                            ?
                            a.createdAt.toMillis()
                            :
                            0;


                        const bTime =
                            b.createdAt
                            ?.toMillis
                            ?
                            b.createdAt.toMillis()
                            :
                            0;


                        return bTime -
                            aTime;

                    }
                );


                render();

            },

            error => {

                console.error(
                    "Requests listener:",
                    error
                );


                loading.style.display =
                    "none";


                showError(
                    "Ride requests load nahi ho rahi: " +
                    error.message
                );

            }

        );

}


// =========================================================
// TODAY'S RIDES
// =========================================================

async function loadTodayCount(){

    /*
     * Keep this lightweight.
     * The main request list remains realtime.
     */

    try{

        const stored =
            Number(
                localStorage.getItem(
                    "riderx_today_rides"
                )
                ||
                0
            );


        todayCount.innerText =
            stored;

    }catch{

        todayCount.innerText =
            "0";

    }

}

// REFRESH
// =========================================================

document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        () => {

            toast(
                "Requests realtime update ho rahi hain."
            );


            render();

        }
    );


// =========================================================
// BACK
// =========================================================

document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "home.html";

        }
    );


// =========================================================
// AUTH
// =========================================================

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            loading.style.display =
                "none";


            showError(
                "Please login as rider to see ride requests."
            );


            return;

        }


        currentUser =
            user;


        await loadTodayCount();


        startListener();

    }
);


// =========================================================
// CLEANUP
// =========================================================

window.addEventListener(
    "beforeunload",
    () => {

        if(
            unsubscribe
        ){

            unsubscribe();

        }

    }
);
