<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RiderX - Ride Requests</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

:root{
    --yellow:#FFD400;
    --black:#080808;
    --dark:#111;
    --card:#171717;
    --border:#2b2b2b;
    --muted:#909090;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#60a5fa;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.requests-page{
    min-height:100vh;
    min-height:100dvh;
    max-width:650px;
    margin:auto;
    background:#0d0d0d;
    padding-bottom:25px;
}

/* HEADER */

.page-header{
    height:68px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    background:#111;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:30;
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:25px;
    cursor:pointer;
}

.header-info{
    flex:1;
}

.header-info h1{
    font-size:18px;
    font-weight:900;
}

.header-info p{
    color:#777;
    font-size:11px;
    margin-top:3px;
}

.refresh-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#202020;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.refresh-btn.loading{
    animation:rotate .8s linear infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

/* ONLINE BAR */

.online-bar{
    margin:12px 14px 4px;
    background:#171717;
    border:1px solid var(--border);
    border-radius:14px;
    padding:11px 13px;
    display:flex;
    align-items:center;
    gap:9px;
}

.online-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 4px rgba(34,197,94,.10);
}

.online-text{
    flex:1;
    font-size:12px;
    color:#bbb;
}

.online-text strong{
    color:#fff;
}

.online-toggle{
    width:42px;
    height:24px;
    border:0;
    border-radius:20px;
    background:#333;
    position:relative;
    cursor:pointer;
}

.online-toggle::after{
    content:"";
    position:absolute;
    top:3px;
    left:3px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#777;
    transition:.2s;
}

.online-toggle.active{
    background:var(--yellow);
}

.online-toggle.active::after{
    left:21px;
    background:#000;
}

/* FILTER */

.filter-row{
    display:flex;
    gap:7px;
    padding:11px 14px 4px;
    overflow-x:auto;
}

.filter-row::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    white-space:nowrap;
    border:1px solid #292929;
    background:#171717;
    color:#aaa;
    padding:8px 13px;
    border-radius:20px;
    font-size:11px;
    cursor:pointer;
}

.filter-btn.active{
    background:var(--yellow);
    color:#000;
    border-color:var(--yellow);
    font-weight:800;
}

/* REQUEST LIST */

.requests-list{
    padding:10px 14px 20px;
}

.request-card{
    background:#171717;
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:11px;
    transition:.2s;
}

.request-card:active{
    transform:scale(.99);
}

.request-head{
    display:flex;
    align-items:center;
    padding:13px 14px;
    border-bottom:1px solid #292929;
}

.service-icon{
    width:40px;
    height:40px;
    border-radius:12px;
    background:var(--yellow);
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    margin-right:10px;
}

.request-main{
    flex:1;
    min-width:0;
}

.request-title{
    font-size:14px;
    font-weight:800;
}

.request-time{
    color:#777;
    font-size:10px;
    margin-top:3px;
}

.request-fare{
    text-align:right;
}

.fare-value{
    font-size:18px;
    font-weight:900;
}

.fare-label{
    color:#777;
    font-size:9px;
    margin-top:2px;
}

/* ROUTE */

.route{
    padding:14px;
}

.route-row{
    display:flex;
    gap:10px;
    position:relative;
}

.route-row:first-child{
    padding-bottom:14px;
}

.route-row:first-child::after{
    content:"";
    position:absolute;
    left:6px;
    top:16px;
    bottom:-2px;
    width:2px;
    background:#333;
}

.route-dot{
    width:13px;
    height:13px;
    min-width:13px;
    border-radius:50%;
    margin-top:2px;
    position:relative;
    z-index:2;
}

.pickup{
    background:var(--yellow);
}

.drop{
    background:var(--green);
}

.route-content{
    min-width:0;
}

.route-label{
    font-size:9px;
    color:#777;
    text-transform:uppercase;
    margin-bottom:3px;
}

.route-address{
    color:#eee;
    font-size:12px;
    line-height:1.35;
}

/* DETAILS */

.request-details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    padding:0 14px 13px;
}

.detail{
    background:#101010;
    border:1px solid #242424;
    border-radius:10px;
    text-align:center;
    padding:9px 4px;
}

.detail-value{
    font-size:11px;
    font-weight:800;
}

.detail-label{
    color:#666;
    font-size:8px;
    margin-top:3px;
}

/* ACTIONS */

.request-actions{
    display:flex;
    gap:8px;
    padding:0 14px 14px;
}

.action-btn{
    height:43px;
    border:0;
    border-radius:11px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.details-btn{
    width:30%;
    background:#242424;
    color:#fff;
}

.accept-btn{
    flex:1;
    background:var(--yellow);
    color:#000;
}

.reject-btn{
    width:25%;
    background:#292929;
    color:#ddd;
}

/* EMPTY */

.empty-state{
    display:none;
    text-align:center;
    padding:70px 25px;
}

.empty-icon{
    width:75px;
    height:75px;
    border-radius:50%;
    background:#181818;
    border:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:30px;
}

.empty-state h2{
    font-size:18px;
    margin-bottom:7px;
}

.empty-state p{
    color:#777;
    font-size:12px;
    line-height:1.5;
}

/* LOADING */

.loading-state{
    text-align:center;
    padding:45px 20px;
    color:#777;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #303030;
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    width:calc(100% - 30px);
    max-width:600px;
    background:#202020;
    border:1px solid #333;
    border-radius:12px;
    padding:12px 14px;
    text-align:center;
    color:#fff;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.success{
    border-color:rgba(34,197,94,.45);
}

.toast.error{
    border-color:rgba(239,68,68,.45);
}

/* RESPONSIVE */

@media(max-width:390px){

    .request-details{
        gap:4px;
    }

    .request-actions{
        gap:5px;
    }

    .details-btn{
        width:28%;
    }

    .reject-btn{
        width:23%;
    }

}

</style>
</head>

<body>

<div class="requests-page">

    <!-- HEADER -->

    <header class="page-header">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ‹
        </button>

        <div class="header-info">

            <h1>Ride Requests</h1>

            <p id="requestCount">
                Checking for new rides...
            </p>

        </div>

        <button
            class="refresh-btn"
            id="refreshBtn"
            onclick="loadRequests()"
        >
            ↻
        </button>

    </header>


    <!-- ONLINE -->

    <div class="online-bar">

        <div class="online-dot"></div>

        <div class="online-text">

            <strong id="onlineStatus">
                You're Online
            </strong>

            <br>

            <span>
                New ride requests will appear here
            </span>

        </div>

        <button
            class="online-toggle active"
            id="onlineToggle"
            onclick="toggleOnline()"
        ></button>

    </div>


    <!-- FILTER -->

    <div class="filter-row">

        <button
            class="filter-btn active"
            data-filter="all"
            onclick="setFilter('all',this)"
        >
            All
        </button>

        <button
            class="filter-btn"
            data-filter="bike"
            onclick="setFilter('bike',this)"
        >
            🏍 Bike
        </button>

        <button
            class="filter-btn"
            data-filter="cab"
            onclick="setFilter('cab',this)"
        >
            🚕 Cab
        </button>

        <button
            class="filter-btn"
            data-filter="parcel"
            onclick="setFilter('parcel',this)"
        >
            📦 Parcel
        </button>

        <button
            class="filter-btn"
            data-filter="food"
            onclick="setFilter('food',this)"
        >
            🍔 Food
        </button>

    </div>


    <!-- LIST -->

    <main
        class="requests-list"
        id="requestsList"
    >

        <div
            class="loading-state"
            id="loadingState"
        >

            <div class="spinner"></div>

            Loading ride requests...

        </div>


        <div
            class="empty-state"
            id="emptyState"
        >

            <div class="empty-icon">
                🚕
            </div>

            <h2>No ride requests</h2>

            <p>
                Stay online and new ride requests
                will appear here automatically.
            </p>

        </div>

    </main>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script>
/* ==========================================
   RIDERX REQUESTS
========================================== */

const $ = id => document.getElementById(id);

let allRequests = [];
let currentFilter = "all";
let isOnline = true;
let toastTimer;


/* BACK */

function goBack(){

    if(history.length > 1){

        history.back();

    }else{

        window.location.href = "home.html";

    }

}


/* TOAST */

function showToast(message,type=""){

    const toast = $("toast");

    toast.textContent = message;

    toast.className =
        "toast show " + type;

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {

        toast.className = "toast";

    },3000);

}


/* FILTER */

function setFilter(filter,button){

    currentFilter = filter;

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    button.classList.add("active");

    renderRequests();

}


/* ONLINE */

async function toggleOnline(){

    const nextStatus = !isOnline;

    try{

        if(typeof window.setRiderOnlineStatus === "function"){

            const result =
                await window.setRiderOnlineStatus(
                    nextStatus
                );

            if(result === false){

                return;

            }

        }else{

            document.dispatchEvent(
                new CustomEvent(
                    "riderxOnlineStatusChange",
                    {
                        detail:{
                            online:nextStatus
                        }
                    }
                )
            );

        }

        isOnline = nextStatus;

        updateOnlineUI();

        if(isOnline){

            loadRequests();

        }else{

            allRequests = [];

            renderRequests();

        }

    }catch(error){

        console.error(
            "Online status error:",
            error
        );

        showToast(
            "Unable to change online status.",
            "error"
        );

    }

}


/* ONLINE UI */

function updateOnlineUI(){

    const toggle =
        $("onlineToggle");

    const status =
        $("onlineStatus");

    toggle.classList.toggle(
        "active",
        isOnline
    );

    status.textContent =
        isOnline
            ? "You're Online"
            : "You're Offline";

}


/* SERVICE ICON */

function serviceIcon(service){

    const value =
        String(service || "")
        .toLowerCase();

    if(value.includes("bike"))
        return "🏍";

    if(value.includes("cab") ||
       value.includes("car"))
        return "🚕";

    if(value.includes("parcel"))
        return "📦";

    if(value.includes("food"))
        return "🍔";

    return "🚕";

}


/* SERVICE TYPE */

function serviceType(service){

    const value =
        String(service || "")
        .toLowerCase();

    if(value.includes("bike"))
        return "Bike";

    if(value.includes("cab") ||
       value.includes("car"))
        return "Cab";

    if(value.includes("parcel"))
        return "Parcel";

    if(value.includes("food"))
        return "Food";

    return "Ride";

}


/* NORMALIZE RIDE */

function normalizeRide(ride,index=0){

    const customer =
        ride.customerName ||
        ride.userName ||
        ride.customer?.name ||
        ride.user?.name ||
        "Customer";

    const service =
        ride.serviceType ||
        ride.rideType ||
        ride.service ||
        "Ride";

    const fare =
        ride.fare ??
        ride.amount ??
        ride.estimatedFare ??
        ride.price ??
        0;

    const pickup =
        ride.pickupAddress ||
        ride.pickup?.address ||
        ride.pickupLocation ||
        ride.from ||
        "Pickup location";

    const drop =
        ride.dropAddress ||
        ride.destinationAddress ||
        ride.drop?.address ||
        ride.dropLocation ||
        ride.to ||
        "Drop-off location";

    const distance =
        ride.distance ??
        ride.distanceKm ??
        0;

    const duration =
        ride.duration ??
        ride.durationMin ??
        0;

    const payment =
        ride.paymentMethod ||
        ride.payment ||
        "Cash";

    return {

        ...ride,

        id:
            ride.id ||
            ride.rideId ||
            ride.requestId ||
            String(index),

        customerName:customer,

        serviceType:service,

        fare:Number(fare) || 0,

        pickupAddress:pickup,

        dropAddress:drop,

        distance:distance,

        duration:duration,

        paymentMethod:payment

    };

}


/* LOAD REQUESTS */

async function loadRequests(){

    const refresh =
        $("refreshBtn");

    refresh.classList.add("loading");

    $("loadingState").style.display = "block";
    $("emptyState").style.display = "none";

    try{

        let requests = null;


        if(typeof window.getPendingRideRequests === "function"){

            requests =
                await window.getPendingRideRequests();

        }else if(typeof window.loadRideRequests === "function"){

            requests =
                await window.loadRideRequests();

        }else if(typeof window.getRideRequests === "function"){

            requests =
                await window.getRideRequests();

        }


        if(Array.isArray(requests)){

            allRequests =
                requests.map(normalizeRide);

        }else if(requests && typeof requests === "object"){

            allRequests =
                Object.entries(requests)
                .map(([id,data]) =>
                    normalizeRide({
                        ...data,
                        id:id
                    })
                );

        }else{

            /*
              Existing Firebase listener can provide
              requests later through the event below.
            */

            document.dispatchEvent(
                new CustomEvent(
                    "riderxRequestsPageReady"
                )
            );

        }


        renderRequests();


    }catch(error){

        console.error(
            "Load requests error:",
            error
        );

        showToast(
            "Unable to load ride requests.",
            "error"
        );

        $("loadingState").style.display =
            "none";

    }finally{

        refresh.classList.remove("loading");

    }

}


/* RENDER */

function renderRequests(){

    const list =
        $("requestsList");

    const loading =
        $("loadingState");

    const empty =
        $("emptyState");


    list
        .querySelectorAll(".request-card")
        .forEach(card => card.remove());


    loading.style.display = "none";


    if(!isOnline){

        empty.style.display = "block";

        empty.querySelector("h2").textContent =
            "You're Offline";

        empty.querySelector("p").textContent =
            "Go online to receive new ride requests.";

        updateCount(0);

        return;

    }


    const filtered =
        allRequests.filter(ride => {

            if(currentFilter === "all")
                return true;

            return serviceType(
                ride.serviceType
            ).toLowerCase() ===
            currentFilter;

        });


    if(filtered.length === 0){

        empty.style.display = "block";

        empty.querySelector("h2").textContent =
            "No ride requests";

        empty.querySelector("p").textContent =
            "Stay online and new ride requests will appear here automatically.";

        updateCount(0);

        return;

    }


    empty.style.display = "none";

    updateCount(filtered.length);


    filtered.forEach(ride => {

        list.appendChild(
            createRequestCard(ride)
        );

    });

}


/* COUNT */

function updateCount(count){

    $("requestCount").textContent =
        count === 0
            ? "No new requests"
            : `${count} new ${count === 1 ? "request" : "requests"}`;

}


/* CREATE CARD */

function createRequestCard(ride){

    const card =
        document.createElement("article");

    card.className = "request-card";

    const service =
        serviceType(
            ride.serviceType
        );

    const payment =
        String(
            ride.paymentMethod || "Cash"
        );

    card.innerHTML = `

        <div class="request-head">

            <div class="service-icon">
                ${serviceIcon(ride.serviceType)}
            </div>

            <div class="request-main">

                <div class="request-title">
                    ${escapeHTML(ride.customerName)}
                </div>

                <div class="request-time">
                    ${service} · ${escapeHTML(payment)}
                </div>

            </div>

            <div class="request-fare">

                <div class="fare-value">
                    ₹${Number(ride.fare || 0).toFixed(0)}
                </div>

                <div class="fare-label">
                    Estimated
                </div>

            </div>

        </div>


        <div class="route">

            <div class="route-row">

                <div class="route-dot pickup"></div>

                <div class="route-content">

                    <div class="route-label">
                        Pickup
                    </div>

                    <div class="route-address">
                        ${escapeHTML(ride.pickupAddress)}
                    </div>

                </div>

            </div>


            <div class="route-row">

                <div class="route-dot drop"></div>

                <div class="route-content">

                    <div class="route-label">
                        Drop-off
                    </div>

                    <div class="route-address">
                        ${escapeHTML(ride.dropAddress)}
                    </div>

                </div>

            </div>

        </div>


        <div class="request-details">

            <div class="detail">

                <div class="detail-value">
                    ${escapeHTML(String(ride.distance || "--"))} km
                </div>

                <div class="detail-label">
                    Distance
                </div>

            </div>


            <div class="detail">

                <div class="detail-value">
                    ${escapeHTML(String(ride.duration || "--"))} min
                </div>

                <div class="detail-label">
                    Duration
                </div>

            </div>


            <div class="detail">

                <div class="detail-value">
                    ${escapeHTML(payment)}
                </div>

                <div class="detail-label">
                    Payment
                </div>

            </div>

        </div>


        <div class="request-actions">

            <button
                class="action-btn details-btn"
                data-id="${escapeHTML(String(ride.id))}"
            >
                Details
            </button>

            <button
                class="action-btn reject-btn"
                data-id="${escapeHTML(String(ride.id))}"
            >
                Reject
            </button>

            <button
                class="action-btn accept-btn"
                data-id="${escapeHTML(String(ride.id))}"
            >
                Accept
            </button>

        </div>

    `;


    card
        .querySelector(".details-btn")
        .addEventListener(
            "click",
            () => openRequest(ride.id)
        );


    card
        .querySelector(".accept-btn")
        .addEventListener(
            "click",
            () => acceptRequest(ride)
        );


    card
        .querySelector(".reject-btn")
        .addEventListener(
            "click",
            () => rejectRequest(ride)
        );


    return card;

}


/* ESCAPE */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* OPEN REQUEST */

function openRequest(id){

    window.location.href =
        "request.html?rideId=" +
        encodeURIComponent(id);

}


/* ACCEPT */

async function acceptRequest(ride){

    const confirmed =
        confirm(
            `Accept this ride for ₹${Number(ride.fare || 0).toFixed(0)}?`
        );

    if(!confirmed) return;


    try{

        let result = false;


        if(typeof window.acceptRideRequest === "function"){

            result =
                await window.acceptRideRequest(
                    ride.id,
                    ride
                );

        }else if(typeof window.acceptRide === "function"){

            result =
                await window.acceptRide(
                    ride.id,
                    ride
                );

        }else{

            document.dispatchEvent(
                new CustomEvent(
                    "riderxAcceptRide",
                    {
                        detail:{
                            rideId:ride.id,
                            ride:ride
                        }
                    }
                )
            );

            await new Promise(
                resolve => setTimeout(resolve,400)
            );

            result = true;

        }


        if(result === false){

            throw new Error(
                "Ride could not be accepted."
            );

        }


        showToast(
            "Ride accepted successfully.",
            "success"
        );


        allRequests =
            allRequests.filter(
                item => item.id !== ride.id
            );


        renderRequests();


        setTimeout(() => {

            window.location.href =
                "ride-details.html?rideId=" +
                encodeURIComponent(ride.id);

        },700);


    }catch(error){

        console.error(
            "Accept request error:",
            error
        );

        showToast(
            error.message ||
            "Unable to accept ride.",
            "error"
        );

    }

}


/* REJECT */

async function rejectRequest(ride){

    const confirmed =
        confirm(
            "Reject this ride request?"
        );

    if(!confirmed) return;


    try{

        let result = false;


        if(typeof window.rejectRideRequest === "function"){

            result =
                await window.rejectRideRequest(
                    ride.id,
                    ride
                );

        }else if(typeof window.rejectRide === "function"){

            result =
                await window.rejectRide(
                    ride.id,
                    ride
                );

        }else{

            document.dispatchEvent(
                new CustomEvent(
                    "riderxRejectRide",
                    {
                        detail:{
                            rideId:ride.id,
                            ride:ride
                        }
                    }
                )
            );

            await new Promise(
                resolve => setTimeout(resolve,300)
            );

            result = true;

        }


        if(result === false){

            throw new Error(
                "Ride could not be rejected."
            );

        }


        allRequests =
            allRequests.filter(
                item => item.id !== ride.id
            );

        renderRequests();

        showToast(
            "Ride request rejected.",
            "success"
        );


    }catch(error){

        console.error(
            "Reject request error:",
            error
        );

        showToast(
            error.message ||
            "Unable to reject ride.",
            "error"
        );

    }

}


/* REALTIME REQUEST EVENT */

document.addEventListener(
    "riderxNewRideRequest",
    function(event){

        if(!event.detail) return;

        const ride =
            normalizeRide(
                event.detail
            );

        const exists =
            allRequests.some(
                item => item.id === ride.id
            );

        if(!exists){

            allRequests.unshift(ride);

            if(isOnline){

                renderRequests();

                showToast(
                    "New ride request received.",
                    "success"
                );

            }

        }

    }
);


/* BULK REQUEST EVENT */

document.addEventListener(
    "riderxRideRequestsLoaded",
    function(event){

        if(!event.detail) return;

        const data =
            Array.isArray(event.detail)
                ? event.detail
                : Object.entries(event.detail)
                    .map(([id,ride]) => ({
                        ...ride,
                        id:id
                    }));

        allRequests =
            data.map(normalizeRide);

        renderRequests();

    }
);


/* INITIALIZE */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        updateOnlineUI();

        loadRequests();

    }
);


/* AUTO REFRESH */

setInterval(() => {

    if(
        document.visibilityState === "visible" &&
        isOnline
    ){

        loadRequests();

    }

},30000);

</script>
