<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Requests</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">
📩 New Ride Requests
</div>



<div class="container">


<div id="requestList">

Loading...

</div>



<a class="back" href="dashboard.html">
⬅ Back Dashboard
</a>


</div>





<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
getDocs,
query,
where,
doc,
updateDoc,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






async function loadRequests(){


let box =
document.getElementById("requestList");



const q=query(

collection(db,"rides"),

where("status","==","Pending")

);



const snapshot =
await getDocs(q);



box.innerHTML="";



if(snapshot.empty){


box.innerHTML=
"<p>No requests available</p>";

return;

}





snapshot.forEach((ride)=>{


let data=ride.data();



box.innerHTML += `


<div class="request-card">


<h3>
🏍 ${data.service}
</h3>


<p>
📍 Pickup:
${data.pickup}
</p>


<p>
📍 Drop:
${data.drop}
</p>


<p>
💰 Fare:
${data.fare}
</p>



<button onclick="acceptRide('${ride.id}')">

Accept Ride

</button>



<button onclick="rejectRide('${ride.id}')">

Reject

</button>



</div>


`;



});



}







window.acceptRide = async function(id){


await updateDoc(

doc(db,"rides",id),

{


status:"Accepted",

acceptedAt:serverTimestamp()


}

);



alert("Ride Accepted ✅");


loadRequests();


}






window.rejectRide = async function(id){


await updateDoc(

doc(db,"rides",id),

{


status:"Rejected"


}

);



loadRequests();


}




loadRequests();



setInterval(

loadRequests,

10000

);


</script>



</body>

</html>
