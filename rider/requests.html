<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#050505"
>

<title>RiderX - Ride Requests</title>


<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;
    padding:0;

    min-height:100%;

    background:#050505;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body{

    padding-bottom:
        30px;

}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:sticky;

    top:0;

    z-index:1000;

    padding:
        calc(12px + env(safe-area-inset-top))
        14px
        12px;

    background:
        rgba(5,5,5,.94);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

}

.header-row{

    display:flex;

    align-items:center;

    gap:10px;

}

.back{

    width:42px;
    height:42px;

    border:0;

    border-radius:13px;

    background:#1b1b1b;

    color:#fff;

    font-size:22px;

    cursor:pointer;

}

.logo{

    flex:1;

}

.logo strong{

    display:block;

    font-size:20px;

    font-weight:900;

}

.logo strong span{

    color:#FFD600;

}

.logo small{

    display:block;

    margin-top:2px;

    color:#777;

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:.5px;

}

.online-pill{

    display:flex;

    align-items:center;

    gap:6px;

    padding:8px 10px;

    border-radius:20px;

    background:
        rgba(54,220,117,.10);

    color:#36dc75;

    font-size:8px;

    font-weight:900;

}

.online-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#36dc75;

}


/* =========================================================
   CONTENT
========================================================= */

.container{

    width:100%;

    max-width:680px;

    margin:0 auto;

    padding:14px;

}


/* =========================================================
   SUMMARY
========================================================= */

.summary{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:9px;

    margin-bottom:14px;

}

.summary-card{

    padding:14px;

    border-radius:17px;

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.07);

}

.summary-label{

    color:#777;

    font-size:8px;

    font-weight:900;

    text-transform:uppercase;

}

.summary-value{

    margin-top:6px;

    color:#FFD600;

    font-size:24px;

    font-weight:900;

}


/* =========================================================
   TITLE
========================================================= */

.section-title{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin:
        8px 2px
        10px;

}

.section-title strong{

    font-size:17px;

    font-weight:900;

}

.refresh{

    border:0;

    border-radius:10px;

    padding:8px 10px;

    background:#1c1c1c;

    color:#FFD600;

    font-size:10px;

    font-weight:900;

    cursor:pointer;

}


/* =========================================================
   REQUEST CARD
========================================================= */

.request-card{

    position:relative;

    margin-bottom:12px;

    padding:15px;

    border-radius:21px;

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.28);

    overflow:hidden;

}

.request-card.new{

    border-color:
        rgba(255,214,0,.45);

    box-shadow:
        0 12px 40px
        rgba(255,214,0,.08);

}

.new-badge{

    position:absolute;

    top:10px;

    right:10px;

    padding:5px 8px;

    border-radius:8px;

    background:#FFD600;

    color:#000;

    font-size:7px;

    font-weight:900;

}

.request-top{

    display:flex;

    align-items:center;

    gap:10px;

}

.service-icon{

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:#1c1c1c;

    font-size:23px;

}

.request-main{

    flex:1;

    min-width:0;

}

.service-name{

    font-size:15px;

    font-weight:900;

}

.request-time{

    margin-top:4px;

    color:#777;

    font-size:9px;

}

.fare{

    text-align:right;

}

.fare strong{

    display:block;

    color:#FFD600;

    font-size:20px;

    font-weight:900;

}

.fare span{

    display:block;

    margin-top:2px;

    color:#777;

    font-size:8px;

}


/* =========================================================
   CUSTOMER
========================================================= */

.customer-row{

    display:flex;

    align-items:center;

    gap:9px;

    margin-top:13px;

    padding:9px 10px;

    border-radius:12px;

    background:#181818;

}

.customer-avatar{

    width:34px;
    height:34px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#2a2a2a;

    font-size:15px;

}

.customer-info{

    flex:1;

    min-width:0;

}

.customer-info strong{

    display:block;

    color:#eee;

    font-size:10px;

}

.customer-info span{

    display:block;

    margin-top:2px;

    color:#666;

    font-size:8px;

}


/* =========================================================
   ROUTE
========================================================= */

.route{

    position:relative;

    margin:
        15px 0
        13px;

    padding-left:20px;

}

.route:before{

    content:"";

    position:absolute;

    left:5px;

    top:8px;

    bottom:8px;

    width:2px;

    background:#333;

}

.route-row{

    position:relative;

    min-height:42px;

}

.route-row + .route-row{

    margin-top:5px;

}

.route-dot{

    position:absolute;

    left:-20px;

    top:5px;

    width:12px;
    height:12px;

    border-radius:50%;

    background:#FFD600;

    border:
        3px solid
        #111;

}

.route-dot.drop{

    background:#fff;

}

.route-label{

    color:#777;

    font-size:8px;

    font-weight:900;

    text-transform:uppercase;

}

.route-address{

    margin-top:3px;

    color:#eee;

    font-size:11px;

    line-height:1.35;

    word-break:break-word;

}


/* =========================================================
   META
========================================================= */

.meta{

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    gap:7px;

    margin-bottom:12px;

}

.meta-box{

    padding:9px;

    border-radius:12px;

    background:#191919;

    text-align:center;

}

.meta-box span{

    display:block;

    color:#666;

    font-size:7px;

    font-weight:900;

    text-transform:uppercase;

}

.meta-box strong{

    display:block;

    margin-top:4px;

    color:#eee;

    font-size:10px;

}


/* =========================================================
   TIMER
========================================================= */

.timer{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:10px;

    padding:9px 11px;

    border-radius:11px;

    background:
        rgba(255,214,0,.07);

    border:
        1px solid
        rgba(255,214,0,.12);

}

.timer-label{

    color:#888;

    font-size:8px;

    font-weight:900;

    text-transform:uppercase;

}

.timer-value{

    color:#FFD600;

    font-size:12px;

    font-weight:900;

}

.timer-value.danger{

    color:#ff5f5f;

}


/* =========================================================
   ACTIONS
========================================================= */

.actions{

    display:grid;

    grid-template-columns:
        .8fr
        1.2fr;

    gap:8px;

}

.btn{

    min-height:47px;

    border:0;

    border-radius:13px;

    font-size:12px;

    font-weight:900;

    cursor:pointer;

}

.btn-details{

    background:#202020;

    color:#fff;

}

.btn-reject{

    background:#202020;

    color:#ff7d7d;

}

.btn-accept{

    background:#FFD600;

    color:#000;

}

.btn:disabled{

    opacity:.45;

    cursor:not-allowed;

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    display:none;

    padding:
        45px 20px;

    text-align:center;

    border-radius:21px;

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.07);

}

.empty-icon{

    font-size:42px;

}

.empty-title{

    margin-top:12px;

    font-size:18px;

    font-weight:900;

}

.empty-text{

    margin-top:7px;

    color:#777;

    font-size:10px;

    line-height:1.5;

}


/* =========================================================
   ERROR
========================================================= */

.error{

    display:none;

    margin-bottom:12px;

    padding:12px;

    border-radius:14px;

    background:
        rgba(120,30,30,.25);

    border:
        1px solid
        rgba(255,80,80,.25);

    color:#ff9d9d;

    font-size:10px;

    line-height:1.5;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    min-height:220px;

    color:#777;

    font-size:10px;

}

.spinner{

    width:30px;
    height:30px;

    margin-bottom:12px;

    border:
        3px solid
        #222;

    border-top-color:#FFD600;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:14px;
    right:14px;

    bottom:
        calc(14px + env(safe-area-inset-bottom));

    z-index:5000;

    display:none;

    padding:13px 15px;

    border-radius:14px;

    background:#222;

    border:
        1px solid
        #333;

    color:#fff;

    text-align:center;

    font-size:10px;

    font-weight:900;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.5);

}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .container{

        padding-top:20px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

<script type="module">


/* =========================================================
   RIDERX CENTRAL FIREBASE
========================================================= */

import {

    auth,
    db,

    doc,
    getDoc,
    collection,
    query,
    where,
    onSnapshot

} from "../firebase/firebase-config.js";


/* =========================================================
   AUTH
========================================================= */

import {

    onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


/* =========================================================
   MATCHING ENGINE
========================================================= */

import {

    acceptRideRequest,
    rejectRideRequest

} from "../js/matching.js";


/* =========================================================
   STATE
========================================================= */

let currentUser =
    null;

let riderProfile =
    null;

let requests =
    [];

let unsubscribe =
    null;

let acceptingRide =
    false;

const timers =
    new Map();


/* =========================================================
   DOM
========================================================= */

const loading =
    document.getElementById(
        "loading"
    );

const requestList =
    document.getElementById(
        "requestList"
    );

const empty =
    document.getElementById(
        "empty"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const requestCount =
    document.getElementById(
        "requestCount"
    );

const todayCount =
    document.getElementById(
        "todayCount"
    );


/* =========================================================
   TOAST
========================================================= */

function toast(
    message
){

    const el =
        document.getElementById(
            "toast"
        );


    el.innerText =
        message;


    el.style.display =
        "block";


    clearTimeout(
        window.__riderxToastTimer
    );


    window.__riderxToastTimer =
        setTimeout(

            () => {

                el.style.display =
                    "none";

            },

            2800

        );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
){

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


/* =========================================================
   CLEAR ERROR
========================================================= */

function clearError(){

    errorBox.innerText =
        "";

    errorBox.style.display =
        "none";

}


/* =========================================================
   STATUS
========================================================= */

function normalizeStatus(
    status
){

    return String(
        status || ""
    )
    .trim()
    .toUpperCase();

}


/* =========================================================
   OPEN LIVE RIDE
========================================================= */

function openLive(
    rideId
){

    saveRide(
        rideId
    );


    window.location.href =
        "live.html?rideId=" +
        encodeURIComponent(
            rideId
        );

}


/* =========================================================
   SAVE ACTIVE RIDE
========================================================= */

function saveRide(
    rideId
){

    localStorage.setItem(
        "activeRideId",
        String(
            rideId
        )
    );

    localStorage.setItem(
        "rideId",
        String(
            rideId
        )
    );

    localStorage.setItem(
        "riderx_active_ride",
        String(
            rideId
        )
    );

}


/* =========================================================
   SERVICE ICON
========================================================= */

function serviceIcon(
    service
){

    const value =
        String(
            service || ""
        )
        .toLowerCase();


    if(
        value.includes(
            "cab"
        )
        ||
        value.includes(
            "car"
        )
    ){

        return "🚕";

    }


    if(
        value.includes(
            "parcel"
        )
    ){

        return "📦";

    }


    if(
        value.includes(
            "food"
        )
    ){

        return "🍔";

    }


    return "🏍️";

}


/* =========================================================
   SERVICE NAME
========================================================= */

function serviceName(
    ride
){

    return (

        ride.serviceType

        ||

        ride.service

        ||

        ride.rideType

        ||

        "Bike Taxi"

    );

}


/* =========================================================
   LOCATION TEXT
========================================================= */

function locationText(
    value,
    fallback
){

    if(
        typeof value ===
        "string"
    ){

        return value;

    }


    if(
        value &&
        typeof value ===
        "object"
    ){

        return (

            value.address

            ||

            value.name

            ||

            value.label

            ||

            (

                value.lat !==
                undefined

                &&

                value.lng !==
                undefined

                ?

                Number(
                    value.lat
                ).toFixed(5)

                +

                ", "

                +

                Number(
                    value.lng
                ).toFixed(5)

                :

                fallback

            )

        );

    }


    return fallback;

}


/* =========================================================
   PICKUP
========================================================= */

function pickupText(
    ride
){

    return (

        locationText(
            ride.pickupAddress,
            ""
        )

        ||

        locationText(
            ride.pickupLocation,
            ""
        )

        ||

        locationText(
            ride.pickup,
            ""
        )

        ||

        ride.pickupText

        ||

        "Pickup location"

    );

}


/* =========================================================
   DROP
========================================================= */

function dropText(
    ride
){

    return (

        locationText(
            ride.dropAddress,
            ""
        )

        ||

        locationText(
            ride.dropLocation,
            ""
        )

        ||

        locationText(
            ride.drop,
            ""
        )

        ||

        ride.destination

        ||

        ride.dropText

        ||

        "Destination"

    );

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
    value
){

    if(
        !value
    ){

        return "Just now";

    }


    try{

        let date;


        if(
            value &&
            typeof value.toDate ===
            "function"
        ){

            date =
                value.toDate();

        }

        else if(
            value instanceof Date
        ){

            date =
                value;

        }

        else if(
            typeof value ===
            "number"
        ){

            date =
                new Date(
                    value
                );

        }

        else{

            date =
                new Date(
                    value
                );

        }


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "Just now";

        }


        return date.toLocaleTimeString(

            [],

            {

                hour:
                    "numeric",

                minute:
                    "2-digit"

            }

        );

    }

    catch{

        return "Just now";

    }

}


/* =========================================================
   FARE
========================================================= */

function fareValue(
    ride
){

    const fare =
        Number(

            ride.fare

            ??

            ride.estimatedFare

            ??

            ride.amount

            ??

            0

        );


    return (

        "₹" +

        (

            Number.isFinite(
                fare
            )

            ?

            Math.round(
                fare
            )

            :

            0

        )

    );

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceValue(
    ride
){

    const distance =
        Number(

            ride.distance

            ??

            ride.estimatedDistance

            ??

            0

        );


    if(
        !Number.isFinite(
            distance
        )
        ||
        distance <= 0
    ){

        return "—";

    }


    return (

        distance.toFixed(
            1
        )

        +

        " km"

    );

}


/* =========================================================
   PAYMENT
========================================================= */

function paymentValue(
    ride
){

    return (

        ride.paymentMethod

        ||

        ride.payment

        ||

        "Cash"

    );

}


/* =========================================================
   CUSTOMER NAME
========================================================= */

function customerName(
    ride
){

    return (

        ride.customerName

        ||

        ride.userName

        ||

        ride.customerDisplayName

        ||

        "Customer"

    );

}


/* =========================================================
   REQUEST EXPIRY
========================================================= */

function getExpiry(
    ride
){

    if(
        typeof ride.expiresAt ===
        "number"
    ){

        return ride.expiresAt;

    }


    if(
        ride.expiresAt &&
        typeof ride.expiresAt.toMillis ===
        "function"
    ){

        return ride.expiresAt.toMillis();

    }


    if(
        ride.createdAt &&
        typeof ride.createdAt.toMillis ===
        "function"
    ){

        return (

            ride.createdAt.toMillis()

            +

            15000

        );

    }


    return (

        Date.now()

        +

        15000

    );

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(
    rideId,
    element,
    expiresAt
){

    stopTimer(
        rideId
    );


    function update(){

        const remaining =
            Math.max(

                0,

                expiresAt -
                Date.now()

            );


        const seconds =
            Math.ceil(
                remaining / 1000
            );


        element.innerText =
            seconds +
            "s";


        if(
            seconds <= 5
        ){

            element.classList.add(
                "danger"
            );

        }


        if(
            remaining <= 0
        ){

            stopTimer(
                rideId
            );


            const card =
                document.querySelector(
                    `[data-id="${CSS.escape(
                        String(
                            rideId
                        )
                    )}"]`
                );


            if(
                card
            ){

                card.remove();

            }


            updateSummary();

        }

    }


    update();


    const timer =
        setInterval(
            update,
            500
        );


    timers.set(
        String(
            rideId
        ),
        timer
    );

}


/* =========================================================
   STOP TIMER
========================================================= */

function stopTimer(
    rideId
){

    const key =
        String(
            rideId
        );


    const timer =
        timers.get(
            key
        );


    if(
        timer
    ){

        clearInterval(
            timer
        );

        timers.delete(
            key
        );

    }

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(
    ride
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "request-card new";


    card.dataset.id =
        ride.id;

                        )

                </strong>

                        ||

                        )
                    )}
                </div>

        <div class="meta">

            <div class="meta-box">

                <span>
                    Distance
                </span>

                <strong>
                    ${distanceValue(
                        ride
                    )}
                </strong>

            </div>

                <span>

                </span>

                <strong>
                    ${escapeHtml(

                        )

                </strong>

            <div class="meta-box">

                <span>
                    Service
                </span>

                <strong>

                );

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ??
        ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   FILTER VALID REQUESTS
========================================================= */

function validRequests(){

    return requests.filter(

        request => {

            const status =
                normalizeStatus(
                    request.status
                );


            return (

                status ===
                "PENDING"

                &&

                String(
                    request.riderId
                )
                ===
                String(
                    currentUser?.uid
                )

            );

        }

    );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    requestList.innerHTML =
        "";


    timers.forEach(
        timer => {

            clearInterval(
                timer
            );

        }
    );


    timers.clear();


    const active =
        validRequests();


    requestCount.innerText =
        active.length;


    if(
        active.length === 0
    ){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    active.forEach(

        ride => {

            requestList.appendChild(

                createCard(
                    ride
                )

            );

        }

    );

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

    const active =
        validRequests();


    requestCount.innerText =
        active.length;


    if(
        active.length === 0
    ){

        empty.style.display =
            "block";

    }

    else{

        empty.style.display =
            "none";

    }

}


/* =========================================================
   ACCEPT RIDE
========================================================= */

async function acceptRide(
    ride,
    button
){

    if(
        acceptingRide
    ){

        return;

    }


    if(
        !currentUser
    ){

        toast(
            "Please login as rider."
        );

        return;

    }


    acceptingRide =
        true;


    button.disabled =
        true;


    button.innerText =
        "Accepting...";


    try{

        /*
         * FIRST:
         * Confirm request still belongs
         * to this rider.
         */

        const requestRef =
            doc(

                db,

                "rideRequests",

                `${ride.id}_${currentUser.uid}`

            );


        const requestSnapshot =
            await getDoc(
                requestRef
            );


        if(
            !requestSnapshot.exists()
        ){

            throw new Error(
                "Ride request expire ho chuki hai."
            );

        }


        const request =
            requestSnapshot.data();


        if(
            normalizeStatus(
                request.status
            )
            !==
            "PENDING"
        ){

            throw new Error(
                "Ride request already closed hai."
            );

        }


        /*
         * ATOMIC ACCEPTANCE
         *
         * matching.js transaction makes
         * sure only ONE rider wins.
         */

        const accepted =
            await acceptRideRequest(

                ride.id,

                currentUser.uid

            );


        if(
            !accepted
        ){

            throw new Error(
                "Ride kisi aur rider ne accept kar li ya request expire ho gayi."
            );

        }


        saveRide(
            ride.id
        );


        /*
         * Update today's counter.
         */

        const todayKey =
            getTodayKey();


        const counterKey =
            "riderx_today_rides_" +
            currentUser.uid +
            "_" +
            todayKey;


        const currentCount =
            Number(
                localStorage.getItem(
                    counterKey
                )
                ||
                0
            );


        localStorage.setItem(

            counterKey,

            String(
                currentCount +
                1
            )

        );


        todayCount.innerText =
            currentCount +
            1;


        toast(
            "✓ Ride accepted! Customer ko notify kar diya."
        );


        /*
         * Remove accepted request.
         */

        requests =
            requests.filter(

                item =>
                    item.id !==
                    ride.id

            );


        render();


        /*
         * Open rider live ride page.
         */

        setTimeout(

            () => {

                openLive(
                    ride.id
                );

            },

            500

        );

    }

    catch(error){

        console.error(
            "RiderX accept error:",
            error
        );


        button.disabled =
            false;


        button.innerText =
            "✓ Accept Ride";


        toast(
            error.message ||
            "Ride accept nahi hui."
        );

    }

    finally{

        acceptingRide =
            false;

    }

}


/* =========================================================
   REJECT RIDE
========================================================= */

async function rejectRide(
    ride,
    button
){

    if(
        !currentUser
    ){

        return;

    }


    button.disabled =
        true;


    button.innerText =
        "Rejecting...";


    try{

        const success =
            await rejectRideRequest(

                ride.id,

                currentUser.uid

            );


        if(
            !success
        ){

            throw new Error(
                "Request reject nahi hui."
            );

        }


        requests =
            requests.filter(

                item =>
                    item.id !==
                    ride.id

            );


        stopTimer(
            ride.id
        );


        render();


        toast(
            "Ride request rejected."
        );

    }

    catch(error){

        console.error(
            "Reject ride:",
            error
        );


        button.disabled =
            false;


        button.innerText =
            "Reject";


        toast(
            error.message ||
            "Reject failed."
        );

    }

}


/* =========================================================
   TODAY KEY
========================================================= */

function getTodayKey(){

    const date =
        new Date();


    return (

        date.getFullYear()

        +

        "-" +

        String(
            date.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        )

        +

        "-" +

        String(
            date.getDate()
        )
        .padStart(
            2,
            "0"
        )

    );

}


/* =========================================================
   LOAD TODAY COUNT
========================================================= */

function loadTodayCount(){

    if(
        !currentUser
    ){

        todayCount.innerText =
            "0";

        return;

    }


    const key =
        "riderx_today_rides_" +

        currentUser.uid +

        "_" +

        getTodayKey();


    todayCount.innerText =
        Number(
            localStorage.getItem(
                key
            )
            ||
            0
        );

}


/* =========================================================
   PLAY REQUEST SOUND
========================================================= */

function playRequestSound(){

    try{

        const audio =
            new Audio(
                "../assets/sounds/ride-request.mp3"
            );


        audio.volume =
            1;


        audio.play()
            .catch(
                () => {}
            );

    }

    catch(error){

        console.warn(
            "Ride request sound unavailable:",
            error
        );

    }

}


/* =========================================================
   REQUEST NOTIFICATION
========================================================= */

async function showBrowserNotification(
    request
){

    try{

        if(
            !("Notification" in window)
        ){

            return;

        }


        if(
            Notification.permission ===
            "default"
        ){

            await Notification.requestPermission();

        }


        if(
            Notification.permission !==
            "granted"
        ){

            return;

        }


        new Notification(
            "RiderX - New Ride Request",
            {

                body:
                    `${serviceName(
                        request
                    )} • ${fareValue(
                        request
                    )}`,

                icon:
                    "../assets/images/logo.png",

                tag:
                    "riderx-ride-" +
                    request.id

            }
        );

    }

    catch(error){

        console.warn(
            "Notification:",
            error
        );

    }

}


/* =========================================================
   START REQUEST LISTENER
========================================================= */

function startListener(){

    clearError();


    if(
        unsubscribe
    ){

        unsubscribe();

        unsubscribe =
            null;

    }


    if(
        !currentUser
    ){

        return;

    }


    /*
     * IMPORTANT:
     *
     * We listen to rideRequests,
     * NOT the complete rides collection.
     *
     * This means rider only receives
     * requests specifically assigned
     * to that rider.
     */

    const requestsRef =
        collection(

            db,

            "rideRequests"

        );


    const requestQuery =
        query(

            requestsRef,

            where(
                "riderId",
                "==",
                currentUser.uid
            ),

            where(
                "status",
                "==",
                "PENDING"
            )

        );


    unsubscribe =
        onSnapshot(

            requestQuery,

            snapshot => {

                loading.style.display =
                    "none";


                const previousIds =
                    new Set(

                        requests.map(
                            item =>
                                String(
                                    item.id
                                )
                        )

                    );


                requests =
                    snapshot.docs.map(

                        item => ({

                            id:
                                item.id,

                            ...item.data()

                        })

                    );


                /*
                 * New request detection.
                 */

                const newRequests =
                    requests.filter(

                        request =>
                            !previousIds.has(
                                String(
                                    request.id
                                )
                            )

                    );


                if(
                    newRequests.length
                ){

                    playRequestSound();


                    newRequests.forEach(

                        request => {

                            showBrowserNotification(
                                request
                            );

                        }

                    );


                    toast(
                        "🔔 New ride request received!"
                    );

                }


                /*
                 * Newest first.
                 */

                requests.sort(

                    (
                        a,
                        b
                    ) => {

                        const aTime =
                            getMillis(
                                a.createdAt
                            );


                        const bTime =
                            getMillis(
                                b.createdAt
                            );


                        return (
                            bTime -
                            aTime
                        );

                    }

                );


                render();

            },

            error => {

                console.error(
                    "RiderX request listener:",
                    error
                );


                loading.style.display =
                    "none";


                showError(

                    "Ride requests load nahi ho rahi: " +

                    error.message

                );

            }

        );

}


/* =========================================================
   MILLIS
========================================================= */

function getMillis(
    value
){

    if(
        value &&
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        value instanceof Date
    ){

        return value.getTime();

    }


    const numeric =
        Number(
            value
        );


    if(
        Number.isFinite(
            numeric
        )
    ){

        return numeric;

    }


    return 0;

}


/* =========================================================
   REFRESH
========================================================= */

document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(

        "click",

        () => {

            if(
                currentUser
            ){

                startListener();

                toast(
                    "Requests refreshed."
                );

            }

        }

    );


/* =========================================================
   BACK
========================================================= */

document
    .getElementById(
        "backBtn"
    )
    .addEventListener(

        "click",

        () => {

            window.location.href =
                "home.html";

        }

    );


/* =========================================================
   GLOBAL CLICK
   Handles dynamically-created buttons
========================================================= */

requestList.addEventListener(

    "click",

    event => {

        const rejectButton =
            event.target.closest(
                '[data-action="reject"]'
            );


        if(
            !rejectButton
        ){

            return;

        }


        const card =
            rejectButton.closest(
                ".request-card"
            );


        if(
            !card
        ){

            return;

        }


        const ride =
            requests.find(

                item =>
                    String(
                        item.id
                    )
                    ===
                    String(
                        card.dataset.id
                    )

            );


        if(
            ride
        ){

            rejectRide(
                ride,
                rejectButton
            );

        }

    }

);


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(

    auth,

    async user => {

        if(
            !user
        ){

            currentUser =
                null;


            loading.style.display =
                "none";


            showError(
                "Please login as rider to see ride requests."
            );


            return;

        }


        currentUser =
            user;


        /*
         * Load rider profile.
         */

        try{

            const riderRef =
                doc(

                    db,

                    "riders",

                    user.uid

                );


            const riderSnapshot =
                await getDoc(
                    riderRef
                );


            if(
                riderSnapshot.exists()
            ){

                riderProfile =
                    riderSnapshot.data();

            }

        }

        catch(error){

            console.warn(
                "Rider profile:",
                error
            );

        }


        loadTodayCount();


        startListener();

    }

);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(

    "beforeunload",

    () => {

        if(
            unsubscribe
        ){

            unsubscribe();

        }


        timers.forEach(

            timer => {

                clearInterval(
                    timer
                );

            }

        );

    }

);


/* =========================================================
   GLOBAL RIDERX API
========================================================= */

window.RiderXRequests = {

    refresh:
        startListener,

    getRequests:
        () =>
            [
                ...requests
            ]

};


</script>
