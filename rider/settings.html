<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Rider Settings</title>


<link rel="stylesheet" href="../css/Style.css">

<link rel="stylesheet" href="../css/Responsive.css">


</head>


<body>


<nav class="navbar">


<div class="logo">


<img src="../assets/logo.png" alt="RiderX">


<span>
RiderX
</span>


</div>


</nav>







<div class="dashboard-wrapper page">



<div class="card">


<h2>

⚙ Rider Settings

</h2>


<br>






<!-- Install App -->


<div class="card">


<h3>

📲 Install RiderX App

</h3>


<p>

Install app for fast ride requests

</p>


<br>


<button id="installBtn" class="btn">

Install App

</button>


</div>








<!-- Language -->


<div class="card">


<h3>

🌐 Language

</h3>


<br>


<select id="language" class="input-box">


<option>

English

</option>


<option>

Hindi

</option>


</select>


</div>








<!-- Dark Mode -->


<div class="card">


<h3>

🌙 Dark Mode

</h3>


<br>


<button id="darkBtn" class="btn">

Enable Dark Mode

</button>


</div>








<!-- Profile -->


<div class="card">


<h3>

👤 Rider Profile

</h3>


<p>

Manage vehicle and personal details

</p>


<br>


<a href="Profile.html" class="btn">

Edit Profile

</a>


</div>






</div>


</div>








<script>


// =====================
// Install App
// =====================


let deferredPrompt;



const installBtn =
document.getElementById("installBtn");





window.addEventListener(

"beforeinstallprompt",

(e)=>{


e.preventDefault();


deferredPrompt=e;


});







installBtn.onclick=async()=>{


if(deferredPrompt){


deferredPrompt.prompt();


await deferredPrompt.userChoice;


deferredPrompt=null;


}


};








// =====================
// Dark Mode
// =====================


const darkBtn =
document.getElementById("darkBtn");



darkBtn.onclick=()=>{


document.body.classList.toggle("dark-mode");


localStorage.setItem(

"riderDarkMode",

"enabled"

);


};






if(localStorage.getItem("riderDarkMode")){


document.body.classList.add("dark-mode");


}



</script>



</body>

</html>
