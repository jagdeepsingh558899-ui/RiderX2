<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>RiderX | Live Map</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<style>

    :root {
        --yellow: #ffe500;
        --black: #000;
        --dark: #0b0b0b;
        --card: #151515;
        --green: #22c55e;
        --red: #ef4444;
        --white: #fff;
        --muted: #888;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Poppins, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    body {
        position: relative;
    }

    button {
        font: inherit;
    }

    #map {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        background: #ddd;
    }

    .leaflet-control-zoom {
        display: none !important;
    }

    .leaflet-control-attribution {
        font-size: 8px !important;
        padding: 2px 4px !important;
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        padding:
            max(12px, env(safe-area-inset-top))
            14px
            0;
        pointer-events: none;
    }

    .topbar-inner {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .icon-btn {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: rgba(10, 10, 10, .94);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, .35);
        pointer-events: auto;
        cursor: pointer;
    }

    .icon-btn:active {
        transform: scale(.92);
    }

    .logo {
        padding: 9px 17px;
        border-radius: 15px;
        background: rgba(10, 10, 10, .94);
        color: #fff;
        font-size: 17px;
        font-weight: 900;
        box-shadow: 0 5px 20px rgba(0, 0, 0, .35);
    }

    .logo span {
        color: var(--yellow);
    }

    /* =====================================================
       STATUS
    ===================================================== */

    .status {
        position: fixed;
        top:
            calc(
                max(12px, env(safe-area-inset-top))
                + 63px
            );
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        padding: 8px 15px;
        border-radius: 30px;
        background: rgba(10, 10, 10, .94);
        color: #aaa;
        font-size: 10px;
        white-space: nowrap;
        box-shadow: 0 5px 20px rgba(0, 0, 0, .3);
        pointer-events: none;
    }

    .status.online {
        color: var(--green);
    }

    .status.offline {
        color: #ff6b6b;
    }

    /* =====================================================
       MAP CONTROLS
    ===================================================== */

    .map-controls {
        position: fixed;
        right: 14px;
        bottom: 170px;
        z-index: 900;
        display: flex;
        flex-direction: column;
        gap: 9px;
    }

    .map-btn {
        width: 48px;
        height: 48px;
        border: 0;
        border-radius: 50%;
        background: #111;
        color: #fff;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
        font-size: 17px;
        cursor: pointer;
    }

    .map-btn.location {
        color: var(--yellow);
    }

    .map-btn:active {
        transform: scale(.92);
    }

    /* =====================================================
       BOTTOM PANEL
    ===================================================== */

    .panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;
        padding:
            12px
            14px
            max(15px, env(safe-area-inset-bottom));
        background: rgba(8, 8, 8, .97);
        border-radius: 25px 25px 0 0;
        box-shadow: 0 -10px 35px rgba(0, 0, 0, .45);
    }

    .handle {
        width: 45px;
        height: 5px;
        margin: 0 auto 13px;
        border-radius: 10px;
        background: #4b4b4b;
    }

    .panel-title {
        font-size: 17px;
        font-weight: 800;
    }

    .panel-subtitle {
        margin-top: 4px;
        color: #777;
        font-size: 10px;
    }

    .info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 13px;
    }

    .info {
        background: #151515;
        border: 1px solid #252525;
        border-radius: 14px;
        padding: 11px 6px;
        text-align: center;
    }

    .info i {
        color: var(--yellow);
        font-size: 14px;
        margin-bottom: 6px;
    }

    .info-value {
        font-size: 12px;
        font-weight: 800;
    }

    .info-label {
        margin-top: 3px;
        color: #666;
        font-size: 8px;
    }

    .online-btn {
        width: 100%;
        min-height: 52px;
        margin-top: 12px;
        border: 0;
        border-radius: 15px;
        background: var(--yellow);
        color: #000;
        font-size: 15px;
        font-weight: 900;
        cursor: pointer;
    }

    .online-btn.offline {
        background: #252525;
        color: #fff;
    }

    .online-btn:active {
        transform: scale(.985);
    }

    .online-btn:disabled {
        opacity: .55;
        cursor: not-allowed;
    }

    .ride-status {
        display: none;
        margin-top: 11px;
        padding: 11px;
        border-radius: 13px;
        background: #141414;
        border: 1px solid #252525;
        color: #aaa;
        text-align: center;
        font-size: 10px;
    }

    .ride-status.show {
        display: block;
    }

    /* =====================================================
       RIDER MARKER
    ===================================================== */

    .rider-marker {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--yellow);
        border: 4px solid #000;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000;
        font-size: 19px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, .4);
    }

    /* =====================================================
       DESTINATION MARKER
    ===================================================== */

    .destination-marker {
        width: 42px;
        height: 42px;
        border-radius: 50% 50% 50% 0;
        background: #111;
        border: 3px solid var(--yellow);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--yellow);
        transform: rotate(-45deg);
    }

    .destination-marker i {
        transform: rotate(45deg);
    }

    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (min-width: 700px) {

        .panel {
            left: 50%;
            right: auto;
            width: 500px;
            transform: translateX(-50%);
            border-radius: 25px 25px 0 0;
        }

    }

</style>

</head><body><div id="map"></div>

     TOP BAR
===================================================== -->

    <div class="topbar-inner">

        <button
            id="backBtn"
            class="icon-btn"
            type="button"
            aria-label="Go back"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>


        <div class="logo">
            RIDER<span>X</span>
        </div>


        <button
            id="notificationBtn"
            class="icon-btn"

        >

</div>


<!-- =====================================================

<div

>

</div>

<div class="map-controls">

    <button
        id="centerBtn"
        class="map-btn location"

        aria-label="My location"

<!-- =====================================================
     PANEL
===================================================== -->

<div class="panel">

    <div class="handle"></div>


    <div class="panel-title">
        Live Rider Location
    </div>


    <div
        id="panelSubtitle"
        class="panel-subtitle"
    >
        Your live GPS location
    </div>


    <div class="info-grid">

        <div class="info">

            <i class="fa-solid fa-signal"></i>

            <div
                id="gpsAccuracy"
                class="info-value"
            >
                --
            </div>

            <div class="info-label">
                GPS Accuracy
            </div>

        </div>


        <div class="info">

            <i class="fa-solid fa-gauge-high"></i>

            <div
                id="speed"
                class="info-value"
            >
                0 km/h
            </div>

            <div class="info-label">
                Speed
            </div>

        </div>


        <div class="info">

            <i class="fa-solid fa-location-dot"></i>

            <div
                id="coordinates"
                class="info-value"
            >
                --
            </div>

            <div class="info-label">
                Location
            </div>

        </div>

    </div>


    <button
        id="onlineBtn"
        class="online-btn"

    >
        <i class="fa-solid fa-power-off"></i>

    >

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">

    /*
    ============================================================
    RIDERX 2.0
    LIVE MAP
    File: rider/live-map.html
    FINAL
    ============================================================
    */

    import {
        auth,
        db
    } from "../firebase/firebase-config.js";


    import {
        doc,
        setDoc,
        deleteDoc,
        getDoc,
        onSnapshot,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    /* ========================================================
       DOM
    ======================================================== */

    const statusEl =
        document.getElementById("status");

    const onlineBtn =
        document.getElementById("onlineBtn");

    const gpsAccuracy =
        document.getElementById("gpsAccuracy");

    const speedEl =
        document.getElementById("speed");

    const coordinates =
        document.getElementById("coordinates");

    const rideStatus =
        document.getElementById("rideStatus");

    const panelSubtitle =
        document.getElementById("panelSubtitle");


    /* ========================================================
       MAP
    ======================================================== */

    const defaultCenter = [
        30.7333,
        76.7794
    ];

    const map =
        L.map(
            "map",
            {
                zoomControl: false,
                attributionControl: true
            }
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "© OpenStreetMap"
        }
    ).addTo(map);


    map.setView(
        defaultCenter,
        13
    );


    /* ========================================================
       ICON
    ======================================================== */

    const riderIcon =
        L.divIcon({

            className: "",

            html: `
                <div class="rider-marker">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
            `,

            iconSize: [46, 46],

            iconAnchor: [23, 23]

        });


    /* ========================================================
       STATE
    ======================================================== */

    let currentUser = null;

    let riderMarker = null;

    let watchId = null;

    let isOnline = false;

    let currentPosition = null;

    let userMovedMap = false;

    let activeRideUnsubscribe = null;

    let onlineStateLoading = true;

    let lastLocationSave = 0;

    let locationSaveInProgress = false;

    const LOCATION_SAVE_INTERVAL = 4000;


    /* ========================================================
       STATUS
    ======================================================== */

    function setStatus(
        text,
        type = ""
    ) {

        statusEl.textContent =
            text;

        statusEl.classList.remove(
            "online",
            "offline"
        );


        if (type) {

            statusEl.classList.add(
                type
            );

        }

    }


    function setRideStatus(
        text,
        show = true
    ) {

        rideStatus.textContent =
            text;

        rideStatus.classList.toggle(
            "show",
            show
        );

    }


    /* ========================================================
       UPDATE POSITION
    ======================================================== */

    function updatePosition(
        position
    ) {

        currentPosition =
            position;


        const lat =
            Number(
                position.coords.latitude
            );


        const lng =
            Number(
                position.coords.longitude
            );


        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
        ) {

            return;

        }


        const accuracy =
            Math.round(
                Number(
                    position.coords.accuracy || 0
                )
            );


        const speed =
            Number(
                position.coords.speed
            );


        gpsAccuracy.textContent =
            accuracy > 0
                ? `${accuracy} m`
                : "--";


        speedEl.textContent =
            Number.isFinite(speed) &&
            speed >= 0
                ? `${Math.round(speed * 3.6)} km/h`
                : "0 km/h";


        coordinates.textContent =
            `${lat.toFixed(4)}, ${lng.toFixed(4)}`;


        /* ----------------------------------------------------
           RIDER MARKER
        ---------------------------------------------------- */

        if (!riderMarker) {

            riderMarker =
                L.marker(
                    [lat, lng],
                    {
                        icon: riderIcon,
                        zIndexOffset: 1000
                    }
                )
                .addTo(map);

        }
        else {

            riderMarker.setLatLng(
                [lat, lng]
            );

        }


        /* ----------------------------------------------------
           CENTER MAP
        ---------------------------------------------------- */

        if (!userMovedMap) {

            map.setView(
                [lat, lng],
                Math.max(
                    map.getZoom(),
                    15
                ),
                {
                    animate: true
                }
            );

        }


        /* ----------------------------------------------------
           LIVE DATABASE UPDATE
        ---------------------------------------------------- */

        if (
            isOnline &&
            currentUser
        ) {

            saveLiveLocation(
                lat,
                lng,
                accuracy,
                position
            );

        }


        if (
            !isOnline &&
            !onlineStateLoading
        ) {

            setStatus(
                "GPS ready",
                ""
            );

        }

    }


    /* ========================================================
       GPS ERROR
    ======================================================== */

    function gpsError(
        error
    ) {

        console.error(
            "RiderX GPS error:",
            error
        );


        let message =
            "Location unavailable";


        if (
            error &&
            error.code === 1
        ) {

            message =
                "Allow location permission";

        }
        else if (
            error &&
            error.code === 2
        ) {

            message =
                "GPS location unavailable";

        }
        else if (
            error &&
            error.code === 3
        ) {

            message =
                "GPS request timed out";

        }


        setStatus(
            message,
            "offline"
        );

    }


    /* ========================================================
       GET CURRENT POSITION
    ======================================================== */

    function getCurrentPosition() {

        return new Promise(
            (
                resolve,
                reject
            ) => {

                if (
                    !navigator.geolocation
                ) {

                    reject(
                        new Error(
                            "GPS is not supported on this device."
                        )
                    );

                    return;

                }


                navigator.geolocation.getCurrentPosition(
                    resolve,
                    error => {

                        let message =
                            "Unable to get your location.";


                        if (
                            error.code === 1
                        ) {

                            message =
                                "Location permission denied. Enable GPS permission.";

                        }
                        else if (
                            error.code === 2
                        ) {

                            message =
                                "GPS location unavailable. Turn on location services.";

                        }
                        else if (
                            error.code === 3
                        ) {

                            message =
                                "GPS request timed out. Try again.";

                        }


                        reject(
                            new Error(message)
                        );

                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 3000,
                        timeout: 15000
                    }
                );

            }
        );

    }


    /* ========================================================
       START GPS
    ======================================================== */

    function startGPS() {

        if (
            !navigator.geolocation
        ) {

            gpsError({
                code: 2,
                message: "Geolocation unavailable"
            });

            return;

        }


        if (
            watchId !== null
        ) {

            return;

        }


        setStatus(
            "Getting live location..."
        );


        watchId =
            navigator.geolocation.watchPosition(
                updatePosition,
                gpsError,
                {
                    enableHighAccuracy: true,
                    maximumAge: 3000,
                    timeout: 15000
                }
            );

    }


    /* ========================================================
       STOP GPS
    ======================================================== */

    function stopGPS() {

        if (
            watchId === null
        ) {

            return;

        }


        if (
            navigator.geolocation
        ) {

            navigator.geolocation.clearWatch(
                watchId
            );

        }


        watchId = null;

    }


    /* ========================================================
       SAVE RIDER DATA
    ======================================================== */

    async function saveLiveLocation(
        lat,
        lng,
        accuracy,
        position
    ) {

        if (
            !currentUser ||
            !isOnline
        ) {

            return;

        }


        const now =
            Date.now();


        if (
            locationSaveInProgress ||
            now - lastLocationSave <
                LOCATION_SAVE_INTERVAL
        ) {

            return;

        }


        locationSaveInProgress =
            true;

        lastLocationSave =
            now;


        const heading =
            Number(
                position?.coords?.heading
            );


        const speed =
            Number(
                position?.coords?.speed
            );


        try {

            const locationData = {

                riderId:
                    currentUser.uid,

                lat:
                    Number(lat),

                lng:
                    Number(lng),

                accuracy:
                    Number(accuracy || 0),

                heading:
                    Number.isFinite(heading)
                        ? heading
                        : null,

                speed:
                    Number.isFinite(speed)
                        ? speed
                        : null,

                online:
                    true,

                updatedAt:
                    serverTimestamp()

            };


            /*
            ----------------------------------------------------
            RIDER LOCATIONS
            ----------------------------------------------------
            */

            await setDoc(
                doc(
                    db,
                    "riderLocations",
                    currentUser.uid
                ),
                locationData,
                {
                    merge: true
                }
            );


            /*
            ----------------------------------------------------
            RIDER PROFILE / ONLINE STATE
            ----------------------------------------------------
            */

            await setDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                ),
                {

                    online:
                        true,

                    isOnline:
                        true,

                    lat:
                        Number(lat),

                    lng:
                        Number(lng),

                    location: {
                        lat:
                            Number(lat),

                        lng:
                            Number(lng)
                    },

                    locationUpdatedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge: true
                }
            );

        }
        catch (error) {

            console.error(
                "RiderX live location save error:",
                error
            );

        }
        finally {

            locationSaveInProgress =
                false;

        }

    }


    /* ========================================================
       SET ONLINE
    ======================================================== */

    function setOnlineUI() {

        onlineBtn.disabled =
            false;

        onlineBtn.classList.add(
            "offline"
        );

        onlineBtn.innerHTML =
            `
            <i class="fa-solid fa-power-off"></i>
            Go Offline
            `;

        setStatus(
            "You are Online 🟢",
            "online"
        );

        panelSubtitle.textContent =
            "Your live GPS location is being shared";

        setRideStatus(
            "Waiting for ride requests...",
            true
        );

    }


    /* ========================================================
       SET OFFLINE
    ======================================================== */

    function setOfflineUI() {

        onlineBtn.disabled =
            false;

        onlineBtn.classList.remove(
            "offline"
        );

        onlineBtn.innerHTML =
            `
            <i class="fa-solid fa-power-off"></i>
            Go Online
            `;

        setStatus(
            "You are Offline",
            "offline"
        );

        panelSubtitle.textContent =
            "Your live GPS location";

        setRideStatus(
            "You are offline",
            true
        );

    }


    /* ========================================================
       GO ONLINE
    ======================================================== */

    async function goOnline() {

        if (
            !currentUser
        ) {

            return;

        }


        if (
            !navigator.geolocation
        ) {

            setStatus(
                "GPS is not supported",
                "offline"
            );

            return;

        }


        onlineBtn.disabled =
            true;


        setStatus(
            "Getting GPS location..."
        );


        try {

            let position =
                currentPosition;


            /*
            ----------------------------------------------------
            GET FRESH GPS IF NEEDED
            ----------------------------------------------------
            */

            if (
                !position ||
                (
                    Date.now() -
                    (
                        position.timestamp || 0
                    )
                ) > 10000
            ) {

                position =
                    await getCurrentPosition();

                updatePosition(
                    position
                );

            }


            const lat =
                Number(
                    position.coords.latitude
                );


            const lng =
                Number(
                    position.coords.longitude
                );


            const accuracy =
                Number(
                    position.coords.accuracy || 0
                );


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ) {

                throw new Error(
                    "Invalid GPS coordinates."
                );

            }


            /*
            ----------------------------------------------------
            MARK ONLINE BEFORE SAVING
            ----------------------------------------------------
            */

            isOnline =
                true;


            await saveLiveLocation(
                lat,
                lng,
                accuracy,
                position
            );


            /*
            ----------------------------------------------------
            FORCE RIDER STATE
            ----------------------------------------------------
            */

            await setDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                ),
                {

                    online:
                        true,

                    isOnline:
                        true,

                    lat:
                        lat,

                    lng:
                        lng,

                    location: {
                        lat:
                            lat,

                        lng:
                            lng
                    },

                    locationUpdatedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge: true
                }
            );


            /*
            ----------------------------------------------------
            FORCE LOCATION STATE
            ----------------------------------------------------
            */

            await setDoc(
                doc(
                    db,
                    "riderLocations",
                    currentUser.uid
                ),
                {

                    riderId:
                        currentUser.uid,

                    lat:
                        lat,

                    lng:
                        lng,

                    accuracy:
                        accuracy,

                    online:
                        true,

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge: true
                }
            );


            setOnlineUI();

            startGPS();


        }
        catch (error) {

            console.error(
                "RiderX go online error:",
                error
            );


            isOnline =
                false;


            setOfflineUI();


            setStatus(
                error.message ||
                "Could not go online",
                "offline"
            );

        }
        finally {

            onlineBtn.disabled =
                false;

        }

    }


    /* ========================================================
       GO OFFLINE
    ======================================================== */

    async function goOffline() {

        if (
            !currentUser
        ) {

            return;

        }


        onlineBtn.disabled =
            true;


        setStatus(
            "Going offline..."
        );


        isOnline =
            false;


        stopGPS();


        try {

            /*
            ----------------------------------------------------
            RIDER PROFILE
            ----------------------------------------------------
            */

            await setDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                ),
                {

                    online:
                        false,

                    isOnline:
                        false,

                    updatedAt:
                        serverTimestamp(),

                    locationUpdatedAt:
                        serverTimestamp()

                },
                {
                    merge: true
                }
            );


            /*
            ----------------------------------------------------
            RIDER LOCATION
            ----------------------------------------------------
            */

            await setDoc(
                doc(
                    db,
                    "riderLocations",
                    currentUser.uid
                ),
                {

                    riderId:
                        currentUser.uid,

                    online:
                        false,

                    updatedAt:
                        serverTimestamp()

                },
                {
                    merge: true
                }
            );


            setOfflineUI();

        }
        catch (error) {

            console.error(
                "RiderX offline error:",
                error
            );


            /*
            Even if the remote update fails,
            local UI must not remain falsely online.
            */

            setOfflineUI();

            setStatus(
                "You are offline",
                "offline"
            );

        }
        finally {

            onlineBtn.disabled =
                false;

        }

    }


    /* ========================================================
       ONLINE BUTTON
    ======================================================== */

    onlineBtn.addEventListener(
        "click",
        async () => {

            if (
                onlineBtn.disabled
            ) {

                return;

            }


            if (
                isOnline
            ) {

                await goOffline();

            }
            else {

                await goOnline();

            }

        }
    );


    /* ========================================================
       CENTER MAP
    ======================================================== */

    document
        .getElementById("centerBtn")
        .addEventListener(
            "click",
            async () => {

                userMovedMap =
                    false;


                if (
                    currentPosition
                ) {

                    map.setView(
                        [
                            currentPosition.coords.latitude,
                            currentPosition.coords.longitude
                        ],
                        16,
                        {
                            animate: true
                        }
                    );

                    return;

                }


                try {

                    setStatus(
                        "Getting live location..."
                    );


                    const position =
                        await getCurrentPosition();


                    updatePosition(
                        position
                    );


                    map.setView(
                        [
                            position.coords.latitude,
                            position.coords.longitude
                        ],
                        16,
                        {
                            animate: true
                        }
                    );

                }
                catch (error) {

                    setStatus(
                        error.message,
                        "offline"
                    );

                }

            }
        );


    /* ========================================================
       ZOOM
    ======================================================== */

    document
        .getElementById("zoomIn")
        .addEventListener(
            "click",
            () => {

                map.zoomIn();

            }
        );


    document
        .getElementById("zoomOut")
        .addEventListener(
            "click",
            () => {

                map.zoomOut();

            }
        );


    /* ========================================================
       MAP MOVEMENT
    ======================================================== */

    map.on(
        "dragstart",
        () => {

            userMovedMap =
                true;

        }
    );


    /* ========================================================
       BACK
    ======================================================== */

    document
        .getElementById("backBtn")
        .addEventListener(
            "click",
            () => {

                if (
                    history.length > 1
                ) {

                    history.back();

                }
                else {

                    location.href =
                        "home.html";

                }

            }
        );


    /* ========================================================
       NOTIFICATIONS
    ======================================================== */

    document
        .getElementById("notificationBtn")
        .addEventListener(
            "click",
            () => {

                location.href =
                    "notifications.html";

            }
        );


    /* ========================================================
       ACTIVE RIDE LISTENER
    ======================================================== */

    function listenForActiveRide(
        user
    ) {

        if (
            activeRideUnsubscribe
        ) {

            activeRideUnsubscribe();

            activeRideUnsubscribe =
                null;

        }


        if (
            !user
        ) {

            return;

        }


        const activeRef =
            doc(
                db,
                "riders",
                user.uid
            );


        activeRideUnsubscribe =
            onSnapshot(
                activeRef,
                snapshot => {

                    if (
                        !snapshot.exists()
                    ) {

                        if (
                            isOnline
                        ) {

                            setRideStatus(
                                "Waiting for ride requests...",
                                true
                            );

                        }

                        return;

                    }


                    const data =
                        snapshot.data() || {};


                    const rideId =
                        data.activeRideId;


                    if (
                        rideId
                    ) {

                        setRideStatus(
                            `Active ride: ${rideId}`,
                            true
                        );

                    }
                    else if (
                        isOnline
                    ) {

                        setRideStatus(
                            "Waiting for ride requests...",
                            true
                        );

                    }
                    else {

                        setRideStatus(
                            "You are offline",
                            true
                        );

                    }

                },
                error => {

                    console.warn(
                        "RiderX active ride listener:",
                        error
                    );

                }
            );

    }


    /* ========================================================
       AUTH
    ======================================================== */

    onAuthStateChanged(
        auth,
        async user => {

            if (
                !user
            ) {

                stopGPS();


                if (
                    activeRideUnsubscribe
                ) {

                    activeRideUnsubscribe();

                    activeRideUnsubscribe =
                        null;

                }


                currentUser =
                    null;

                isOnline =
                    false;


                location.replace(
                    "../auth/login.html?role=rider"
                );

                return;

            }


            currentUser =
                user;


            startGPS();


            try {

                /*
                ------------------------------------------------
                FIRST CHECK RIDER PROFILE
                ------------------------------------------------
                */

                const riderSnap =
                    await getDoc(
                        doc(
                            db,
                            "riders",
                            user.uid
                        )
                    );


                /*
                ------------------------------------------------
                CHECK RIDER LOCATION
                ------------------------------------------------
                */

                const locationSnap =
                    await getDoc(
                        doc(
                            db,
                            "riderLocations",
                            user.uid
                        )
                    );


                const riderData =
                    riderSnap.exists()
                        ? riderSnap.data() || {}
                        : {};


                const locationData =
                    locationSnap.exists()
                        ? locationSnap.data() || {}
                        : {};


                const riderOnline =
                    riderData.online === true ||
                    riderData.isOnline === true;


                const locationOnline =
                    locationData.online === true;


                /*
                ------------------------------------------------
                EITHER SOURCE CAN RESTORE ONLINE STATE
                ------------------------------------------------
                */

                isOnline =
                    riderOnline ||
                    locationOnline;


                if (
                    isOnline
                ) {

                    setOnlineUI();

                }
                else {

                    setOfflineUI();

                }

            }
            catch (error) {

                console.error(
                    "RiderX online state error:",
                    error
                );


                isOnline =
                    false;

                setOfflineUI();

            }
            finally {

                onlineStateLoading =
                    false;

            }


            listenForActiveRide(
                user
            );

        }
    );


    /* ========================================================
       PAGE VISIBILITY
    ======================================================== */

    document.addEventListener(
        "visibilitychange",
        () => {

            if (
                document.hidden
            ) {

                return;

            }


            if (
                currentUser
            ) {

                startGPS();


                if (
                    isOnline &&
                    currentPosition
                ) {

                    updatePosition(
                        currentPosition
                    );

                }

            }

        }
    );


    /* ========================================================
       PAGE SHOW
    ======================================================== */

    window.addEventListener(
        "pageshow",
        () => {

            setTimeout(
                () => {

                    map.invalidateSize();

                },
                250
            );


            if (
                currentUser
            ) {

                startGPS();

            }

        }
    );


    /* ========================================================
       CLEANUP
    ======================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (
                watchId !== null &&
                navigator.geolocation
            ) {

                navigator.geolocation.clearWatch(
                    watchId
                );

            }

        }
    );


    /* ========================================================
       INITIAL MAP SIZE
    ======================================================== */

    setTimeout(
        () => {

            map.invalidateSize();

        },
        500
    );

</script>

</body></html>
