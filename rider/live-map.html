<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Live Tracking</title>


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>


body{

margin:0;

background:#000;

color:white;

font-family:Arial,sans-serif;

}



.header{

background:#111;

padding:20px;

color:#FFD600;

font-size:25px;

font-weight:bold;

}



.container{

padding:15px;

}



#map{

height:70vh;

border-radius:20px;

}



.card{

background:#111;

padding:15px;

border-radius:20px;

margin-top:15px;

}



.status{

color:#FFD600;

font-weight:bold;

}



button{

width:100%;

padding:15px;

background:#FFD600;

border:none;

border-radius:15px;

font-weight:bold;

margin-top:10px;

}



</style>


</head>



<body>



<div class="header">

🏍 RiderX Live Ride

</div>





<div class="container">



<div id="map"></div>





<div class="card">


<div>

Ride Status:

<span class="status" id="rideStatus">

Searching

</span>

</div>



<button id="startRide">

Start Ride

</button>



<button id="completeRide">

Complete Ride

</button>



</div>



</div>







<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script type="module" src="../js/live-tracking.js"></script>



</body>

</html>
