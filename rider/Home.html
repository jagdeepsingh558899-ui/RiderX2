<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


</head>


<body>


<!-- TOP BAR -->

<div class="topbar">

<h2>🏍 RiderX</h2>

<img src="../assets/logo.png">

</div>





<div class="container">



<!-- RIDER STATUS -->


<div class="card">


<h3>Rider Status</h3>


<p id="riderStatus">

You are Offline

</p>


<button id="onlineBtn" class="btn">

Go Online

</button>


</div>







<!-- MAP -->


<div class="map-container">

<div id="map"></div>

</div>







<!-- NEW RIDE REQUEST -->


<div class="card">


<h3>
New Ride Request
</h3>



<div id="rideRequest" style="display:none;">



<div class="booking-row">

<span>Pickup</span>

<b id="requestPickup">-</b>


</div>



<div class="booking-row">

<span>Drop</span>

<b id="requestDrop">-</b>


</div>




<div class="booking-row">

<span>Fare</span>

<b id="requestFare">

₹0

</b>


</div>




<button id="acceptBtn" class="btn">

Accept Ride

</button>



<button id="rejectBtn" class="btn-outline">

Reject

</button>



</div>



<p id="noRide">

Waiting for rides...

</p>



</div>









<!-- ACTIVE RIDE -->


<div class="card">


<h3>
Active Ride
</h3>



<div id="activeRide" style="display:none;">



<div class="booking-row">

<span>Status</span>

<b id="rideStatus">

-

</b>

</div>




<div class="booking-row">

<span>Customer</span>

<b id="customerName">

-

</b>


</div>




<div class="booking-row">

<span>Fare</span>

<b id="activeFare">

₹0

</b>


</div>






<button id="callCustomer" class="btn">

📞 Call Customer

</button>




<button id="chatCustomer" class="btn-outline">

💬 Chat Customer

</button>






<button id="arrivedBtn" class="btn">

📍 Arrived Pickup

</button>




<button id="startRideBtn" class="btn">

🏍 Start Ride

</button>




<button id="completeRideBtn" class="btn">

✅ Complete Ride

</button>



</div>



</div>







<!-- EARNING -->


<div class="card">


<h3>
Today's Earnings
</h3>


<h1 style="color:#FFD600">

₹<span id="earning">

0

</span>

</h1>


</div>




</div>







<!-- BOTTOM NAV -->


<div class="bottom-nav">


<a class="active">

🏠
<br>
Home

</a>


<a>

💰
<br>
Wallet

</a>



<a>

👤
<br>
Profile

</a>



</div>









<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/rider.js"></script>


</body>

</html>
<button id="installApp" class="btn" style="display:none; margin-top:15px;">

📲 Install RiderX App

</button>
