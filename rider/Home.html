<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body{
background:#000;
color:white;
}

.container{
padding:15px;
}


.card{

background:#111;
padding:20px;
border-radius:20px;
margin-top:15px;

}


.online{

background:#00c853;
color:white;

}


.offline{

background:#d50000;
color:white;

}


button{

width:100%;
padding:15px;
border-radius:15px;
border:none;
font-weight:bold;
margin-top:10px;

}


#map{

height:300px;
border-radius:20px;

}


.ride{

display:none;

background:#222;
padding:15px;
border-radius:15px;

}


</style>

</head>


<body>


<div class="header">

🏍 RiderX Rider

</div>



<div class="container">



<div class="card">

<h2 id="riderName">
Rider
</h2>


<button id="onlineBtn" class="offline">

Offline

</button>


</div>





<div id="map"></div>





<div class="card">

<h3>
New Ride Request
</h3>


<div id="rideBox" class="ride">


<p>
Pickup:
<span id="pickup">
-
</span>
</p>


<p>
Drop:
<span id="drop">
-
</span>
</p>


<p>
Fare:
₹<span id="fare">
0
</span>
</p>


<button id="acceptBtn">

Accept Ride

</button>



<button id="rejectBtn">

Reject

</button>


</div>


</div>





<div class="card">


<h3>
Today's Earnings
</h3>


<h1>
₹<span id="earning">

0

</span>
</h1>


</div>



</div>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/rider.js"></script>


</body>

</html>
