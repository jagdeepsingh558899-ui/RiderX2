<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Trip</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body{
margin:0;
background:#000;
color:white;
font-family:Arial;
}

.header{
padding:18px;
background:#111;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:2px solid #FFD600;
}

#map{
height:55vh;
width:100%;
}

.box{
padding:15px;
}

.card{
background:#111;
padding:20px;
border-radius:18px;
}

input,button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;
}

button{
background:#FFD600;
font-weight:bold;
}

#completeBtn{
display:none;
background:white;
}

</style>

</head>


<body>


<div class="header">
🏍 RiderX Trip
</div>


<div id="map"></div>


<div class="box">

<div class="card">


<h2 id="status">
Going Pickup 📍
</h2>


<p id="distance">
Distance: -
</p>


<p id="eta">
ETA: -
</p>


<input id="otp" placeholder="Enter Customer OTP">


<button id="startBtn">
Start Ride
</button>


<button id="completeBtn">
Complete Ride
</button>


<p id="msg"></p>


</div>

</div>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module">


import {db,auth} from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc,
setDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {

drawRoute,
clearRoute

}

from "../js/route.js";


import {

completeRide

}

from "../js/ride-complete.js";





let rideId = localStorage.getItem("rideId");



let map = L.map("map")

.setView(

[30.7333,76.7794],

13

);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png"

)

.addTo(map);





let riderMarker=null;

let pickupMarker=null;

let dropMarker=null;

let ride=null;

let started=false;





async function loadRide(){


let snap=await getDoc(

doc(db,"rides",rideId)

);



if(!snap.exists()) return;


ride=snap.data();





if(ride.pickupCoords){


pickupMarker=L.marker(

[

ride.pickupCoords.lat,

ride.pickupCoords.lng

]

)

.addTo(map)

.bindPopup("📍 Pickup");


}



if(ride.dropCoords){


dropMarker=L.marker(

[

ride.dropCoords.lat,

ride.dropCoords.lng

]

)

.addTo(map)

.bindPopup("🏁 Drop");


}



}





loadRide();








navigator.geolocation.watchPosition(

async(position)=>{


let lat=position.coords.latitude;

let lng=position.coords.longitude;





if(riderMarker){


riderMarker.setLatLng(

[lat,lng]

);


}

else{


riderMarker=L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup("🏍 Rider");


}





let riderPoint={

lat,

lng

};





if(!started && ride?.pickupCoords){



let result=

await drawRoute(

map,

riderPoint,

ride.pickupCoords

);




if(result){


distance.innerHTML=

"Distance: "+result.distance+" KM";


eta.innerHTML=

"ETA: "+result.time+" Minutes";


}



}





if(started && ride?.dropCoords){



let result=

await drawRoute(

map,

riderPoint,

ride.dropCoords

);



if(result){


distance.innerHTML=

"Distance: "+result.distance+" KM";


eta.innerHTML=

"ETA: "+result.time+" Minutes";


}



}





await setDoc(

doc(db,"riderLocations",auth.currentUser.uid),

{


lat,

lng,

rideId,

status: started ? "On Trip":"Going Pickup",

updatedAt:serverTimestamp()


}

);



}

);









document.getElementById("startBtn").onclick=async()=>{


let otp=

document.getElementById("otp").value;



let snap=

await getDoc(

doc(db,"rides",rideId)

);



let data=snap.data();




if(String(data.otp)!==String(otp)){


msg.innerHTML="Wrong OTP ❌";

return;

}




await updateDoc(

doc(db,"rides",rideId),

{


status:"Started",

startedAt:serverTimestamp()


}

);



started=true;



clearRoute(map);



status.innerHTML="Trip Started 🏁";


msg.innerHTML="Ride Started ✅";


otp.style.display="none";

startBtn.style.display="none";


completeBtn.style.display="block";


};








completeBtn.onclick=async()=>{


let done=

await completeRide(rideId);



if(done){


alert("Ride Completed ✅");


location.href="../customer/receipt.html";


}



};





</script>


</body>

</html>
