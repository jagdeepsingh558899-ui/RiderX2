<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Trip</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{

margin:0;
background:#000;
color:white;
font-family:Arial;

}


.header{

padding:18px;
background:#111;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:2px solid #FFD600;

}



#map{

height:45vh;
width:100%;

}



.box{

padding:20px;

}



.card{

background:#111;
padding:20px;
border-radius:18px;
margin-top:15px;

}



input,button{

width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;

}


button{

background:#FFD600;
font-weight:bold;

}


#completeBtn{

display:none;

background:#fff;

}



</style>

</head>


<body>


<div class="header">

🏍 RiderX Trip

</div>



<div id="map"></div>



<div class="box">


<div class="card">


<h2 id="status">

Go To Pickup Location

</h2>


<p id="info">

Loading...

</p>



<input id="otp" placeholder="Enter Customer OTP">


<button id="startBtn">

Start Ride

</button>


<button id="completeBtn">

Complete Ride

</button>



<p id="msg"></p>



</div>


</div>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module">


import {db,auth} from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc,
setDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {

completeRide

}

from "../js/ride-complete.js";






let rideId =
localStorage.getItem("rideId");



let map=L.map("map")

.setView(

[30.7333,76.7794],

13

);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png"

)

.addTo(map);





let riderMarker=null;

let pickupMarker=null;

let dropMarker=null;

let routeLine=null;


let rideData=null;

let started=false;






async function loadRide(){



let snap=

await getDoc(

doc(db,"rides",rideId)

);



if(!snap.exists()) return;



rideData=snap.data();





if(rideData.pickupCoords){



pickupMarker=L.marker(

[

rideData.pickupCoords.lat,

rideData.pickupCoords.lng

]

)

.addTo(map)

.bindPopup("📍 Pickup");



}




if(rideData.dropCoords){



dropMarker=L.marker(

[

rideData.dropCoords.lat,

rideData.dropCoords.lng

]

)

.addTo(map)

.bindPopup("🏁 Drop");


}



}



loadRide();








function startLocation(){



let riderId=auth.currentUser.uid;




navigator.geolocation.watchPosition(

async(pos)=>{



let lat=pos.coords.latitude;

let lng=pos.coords.longitude;




if(riderMarker){


riderMarker.setLatLng(

[lat,lng]

);


}

else{


riderMarker=L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup("🏍 You");


}




map.setView(

[lat,lng],

15

);





await setDoc(

doc(db,"riderLocations",riderId),

{


lat,

lng,

rideId,

status: started ? "On Trip":"Going Pickup",

updatedAt:serverTimestamp()


}

);



}

);



}







document.getElementById("startBtn").onclick=async()=>{



let otp=

document.getElementById("otp").value;





let snap=

await getDoc(

doc(db,"rides",rideId)

);



let data=snap.data();






if(String(data.otp)!==String(otp)){


document.getElementById("msg").innerHTML=

"Wrong OTP ❌";


return;

}




await updateDoc(

doc(db,"rides",rideId),

{


status:"Started",

startedAt:serverTimestamp()

}

);



started=true;



document.getElementById("status").innerHTML=

"Trip Started 🏁";



document.getElementById("msg").innerHTML=

"Ride Started ✅";



document.getElementById("otp").style.display="none";

document.getElementById("startBtn").style.display="none";


document.getElementById("completeBtn").style.display="block";



};







document.getElementById("completeBtn").onclick=async()=>{



let done=

await completeRide(rideId);



if(done){


alert("Ride Completed ✅");


location.href="../customer/receipt.html";


}



};






startLocation();



</script>


</body>

</html>
