<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Trip</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#000;
color:white;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}



.box{

width:90%;
max-width:380px;

background:#111;

padding:25px;

border-radius:20px;

border:2px solid #FFD600;

text-align:center;

}



h1 span{

color:#FFD600;

}



input{

width:100%;

padding:15px;

margin-top:20px;

border-radius:12px;

border:none;

font-size:18px;

text-align:center;

}



button{

width:100%;

padding:15px;

margin-top:15px;

background:#FFD600;

border:none;

border-radius:12px;

font-weight:bold;

}



.complete{

background:white;

}


#completeBtn{

display:none;

}



#msg{

margin-top:15px;

}



</style>


</head>


<body>



<div class="box">


<h1>

RIDER<span>X</span>

</h1>


<h2 id="title">

Enter Customer OTP

</h2>



<input 
id="otpInput"
placeholder="4 Digit OTP">



<button id="verifyBtn">

Start Ride

</button>



<button id="completeBtn" class="complete">

Complete Ride

</button>



<p id="msg"></p>



</div>






<script type="module">


import { db } from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {

completeRide

}

from "../js/ride-complete.js";





let rideId =

localStorage.getItem("rideId");




const verifyBtn =
document.getElementById("verifyBtn");


const completeBtn =
document.getElementById("completeBtn");


const msg =
document.getElementById("msg");





verifyBtn.onclick=async()=>{


let otp =
document.getElementById("otpInput").value;




if(!otp){

msg.innerHTML="OTP enter karo";

return;

}




const rideRef =
doc(db,"rides",rideId);



const snap =
await getDoc(rideRef);



if(!snap.exists()){

msg.innerHTML="Ride not found";

return;

}




let data=snap.data();





if(String(data.otp) === String(otp)){



await updateDoc(

rideRef,

{


status:"Started",


startedAt:serverTimestamp()


}

);



msg.innerHTML="Ride Started ✅";



verifyBtn.style.display="none";

document.getElementById("otpInput").style.display="none";


document.getElementById("title").innerHTML=
"Trip Running 🏍️";


completeBtn.style.display="block";



}

else{


msg.innerHTML="Wrong OTP ❌";


}



};







completeBtn.onclick=async()=>{


let done = await completeRide(rideId);



if(done){


msg.innerHTML="Ride Completed ✅";



setTimeout(()=>{


window.location.href="dashboard.html";


},1500);



}


};



</script>



</body>

</html>
