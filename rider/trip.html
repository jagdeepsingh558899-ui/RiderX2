<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Trip</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#000;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}


.box{

width:90%;
max-width:380px;
background:#111;
padding:25px;
border-radius:20px;
border:2px solid #FFD600;
text-align:center;

}


h1 span{

color:#FFD600;

}


input,button{

width:100%;
padding:15px;
margin-top:15px;
border-radius:12px;
border:none;

}


button{

background:#FFD600;
font-weight:bold;

}


#completeBtn{

display:none;
background:white;

}


#msg{

margin-top:15px;

}

</style>


</head>


<body>



<div class="box">


<h1>

RIDER<span>X</span>

</h1>



<h2 id="title">

Enter Customer OTP

</h2>



<input id="otpInput" placeholder="4 Digit OTP">



<button id="verifyBtn">

Start Ride

</button>



<button id="completeBtn">

Complete Ride

</button>



<p id="msg"></p>



</div>







<script type="module">


import {db,auth} from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc,
serverTimestamp,
setDoc

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {

completeRide

}

from "../js/ride-complete.js";





let rideId=

localStorage.getItem("rideId");



let verifyBtn=
document.getElementById("verifyBtn");


let completeBtn=
document.getElementById("completeBtn");


let msg=
document.getElementById("msg");






// OTP VERIFY


verifyBtn.onclick=async()=>{



let otp=

document.getElementById("otpInput").value;



if(!otp){

msg.innerHTML="OTP enter karo";

return;

}





let rideRef=

doc(db,"rides",rideId);



let snap=

await getDoc(rideRef);



if(!snap.exists()) return;



let data=snap.data();





if(String(data.otp)===String(otp)){



await updateDoc(

rideRef,

{


status:"Started",

startedAt:serverTimestamp()

}

);





msg.innerHTML="Ride Started ✅";



verifyBtn.style.display="none";

document.getElementById("otpInput").style.display="none";


document.getElementById("title").innerHTML=

"Trip Running 🏍️";



completeBtn.style.display="block";



startLiveLocation();



}

else{


msg.innerHTML="Wrong OTP ❌";


}


};








// RIDER LIVE LOCATION


function startLiveLocation(){



let riderId=

auth.currentUser.uid;



navigator.geolocation.watchPosition(

async(position)=>{


let lat=

position.coords.latitude;



let lng=

position.coords.longitude;





await setDoc(

doc(db,"riderLocations",riderId),

{


lat,

lng,

status:"On Trip",

rideId,

updatedAt:serverTimestamp()


}

);



}

);



}







completeBtn.onclick=async()=>{



let done=

await completeRide(rideId);



if(done){


msg.innerHTML="Ride Completed ✅";



setTimeout(()=>{


location.href="dashboard.html";


},1500);


}



};



</script>



</body>

</html>
