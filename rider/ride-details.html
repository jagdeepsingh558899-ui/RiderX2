<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Details</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.card{
background:#111;
padding:20px;
border-radius:20px;
margin:20px;
}

button{

width:90%;
margin:10px 5%;
padding:15px;
background:#FFD600;
border:none;
border-radius:12px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

🏍 Ride Details

</div>



<div class="card">


<h2 id="service">
Ride
</h2>


<p id="pickup">
📍 Pickup:
</p>


<p id="drop">
🏁 Drop:
</p>


<p id="distance">
📏 Distance:
</p>


<p id="fare">
💰 Fare:
</p>


<p id="status">
Status:
</p>



</div>



<button onclick="startRide()">

▶ Start Ride

</button>



<button onclick="completeRide()">

🏁 Complete Ride

</button>







<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let rideId = localStorage.getItem("rideId");





async function loadRide(){


const snap = await getDoc(

doc(db,"rides",rideId)

);



if(!snap.exists()) return;



let data=snap.data();




document.getElementById("service").innerHTML=

"🏍 "+data.service;



document.getElementById("pickup").innerHTML=

"📍 Pickup: "+data.pickup;



document.getElementById("drop").innerHTML=

"🏁 Drop: "+data.drop;



document.getElementById("distance").innerHTML=

"📏 Distance: "+(data.distance || 0)+" KM";



document.getElementById("fare").innerHTML=

"💰 Fare: ₹"+data.fare;



document.getElementById("status").innerHTML=

"Status: "+data.status;



}






window.startRide=async()=>{


await updateDoc(

doc(db,"rides",rideId),

{

status:"Started",

startedAt:serverTimestamp()

}

);



alert("Ride Started 🏍");

loadRide();


};







window.completeRide=async()=>{


await updateDoc(

doc(db,"rides",rideId),

{

status:"Completed",

completedAt:serverTimestamp()

}

);



alert("Ride Completed ✅");



location.href="../customer/receipt.html";



};





loadRide();



</script>


</body>

</html>
