<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Details</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">

🏍 Ride Details

</div>



<div class="container">


<div class="card">


<h3 id="service">

Ride

</h3>


<p id="pickup">

📍 Pickup:

</p>


<p id="drop">

🏁 Drop:

</p>


<p id="distance">

📏 Distance:

</p>


<p id="fare">

💰 Fare:

</p>


<p id="status">

Status:

</p>


</div>



<button onclick="startRide()">

▶ Start Ride

</button>



<button onclick="completeRide()">

🏁 Complete Ride

</button>



</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let rideId = localStorage.getItem("rideId");






async function loadRide(){


let snap=await getDoc(

doc(db,"rides",rideId)

);



let data=snap.data();



document.getElementById("service").innerHTML=

data.service;



document.getElementById("pickup").innerHTML=

"📍 Pickup: "+data.pickupLat+","+data.pickupLng;



document.getElementById("drop").innerHTML=

"🏁 Drop: "+data.dropLat+","+data.dropLng;



document.getElementById("distance").innerHTML=

"📏 Distance: "+data.distance+" KM";



document.getElementById("fare").innerHTML=

"💰 Fare: "+data.fare;



document.getElementById("status").innerHTML=

"Status: "+data.status;



}





window.startRide=async function(){



await updateDoc(

doc(db,"rides",rideId),

{


status:"Started"

}

);



alert("Ride Started 🏍");


loadRide();


}







window.completeRide=async function(){


await updateDoc(

doc(db,"rides",rideId),

{

status:"Completed"

}

);



localStorage.setItem(

"rideId",

rideId

);



alert("Ride Completed ✅");



window.completeRide=async function(){


await updateDoc(

doc(db,"rides",rideId),

{

status:"Completed"

}

);



localStorage.setItem(

"rideId",

rideId

);



alert("Ride Completed ✅");



window.location.href=

"../customer/payment.html";


}
