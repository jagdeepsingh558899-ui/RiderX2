</div><script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script><script type="module">


import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    doc,
    onSnapshot,
    updateDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


// =========================================================
// STATE
// =========================================================

let currentUser =
    null;

let rideId =
    null;

let rideData =
    null;

let unsubscribeRide =
    null;

let watchId =
    null;

let map =
    null;

let riderMarker =
    null;

let customerMarker =
    null;

let pickupMarker =
    null;

let dropMarker =
    null;

let currentPosition =
    null;


// =========================================================
// URL
// =========================================================

const params =
    new URLSearchParams(
        window.location.search
    );


rideId =
    params.get(
        "rideId"
    )
    ||
    params.get(
        "id"
    )
    ||
    localStorage.getItem(
        "activeRideId"
    )
    ||
    localStorage.getItem(
        "rideId"
    );


// =========================================================
// DOM
// =========================================================

const loading =
    document.getElementById(
        "loading"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const primaryBtn =
    document.getElementById(
        "primaryBtn"
    );

const completeBtn =
    document.getElementById(
        "completeBtn"
    );


// =========================================================
// ERROR
// =========================================================

function showError(
    message
){

    loading.style.display =
        "none";

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


// =========================================================
// MAP INIT
// =========================================================

function initMap(
    lat = 30.7333,
    lng = 76.7794
){

    map =
        L.map(
            "map",
            {
                zoomControl:true,
                attributionControl:true
            }
        )
        .setView(
            [
                lat,
                lng
            ],
            15
        );


    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom:19,

            attribution:
                '&copy; OpenStreetMap contributors'

        }

    ).addTo(
        map
    );


    const riderIcon =
        L.divIcon(

            {

                className:"",

                html:
                    '<div class="rider-marker">🏍️</div>',

                iconSize:[
                    46,
                    46
                ],

                iconAnchor:[
                    23,
                    23
                ]

            }

        );


    riderMarker =
        L.marker(

            [
                lat,
                lng
            ],

            {
                icon:riderIcon
            }

        )
        .addTo(
            map
        );


    setTimeout(
        () => {

            map.invalidateSize();

        },
        300
    );

}


// =========================================================
// LOCATION PARSER
// =========================================================

function extractCoords(
    value
){

    if(
        !value
        ||
        typeof value !==
        "object"
    ){

        return null;

    }


    const lat =
        Number(
            value.lat
            ??
            value.latitude
        );


    const lng =
        Number(
            value.lng
            ??
            value.lon
            ??
            value.longitude
        );


    if(
        !Number.isFinite(
            lat
        )
        ||
        !Number.isFinite(
            lng
        )
    ){

        return null;

    }


    return {
        lat,
        lng
    };

}


// =========================================================
// PICKUP COORDINATES
// =========================================================

function getPickupCoords(
    ride
){

    return (
        extractCoords(
            ride.pickupLocation
        )
        ||
        extractCoords(
            ride.pickup
        )
        ||
        extractCoords(
            ride.pickupCoords
        )
    );

}


// =========================================================
// DROP COORDINATES
// =========================================================

function getDropCoords(
    ride
){

    return (
        extractCoords(
            ride.dropLocation
        )
        ||
        extractCoords(
            ride.drop
        )
        ||
        extractCoords(
            ride.destinationCoords
        )
    );

}


// =========================================================
// ADDRESS
// =========================================================

function locationText(
    value,
    fallback
){

    if(
        typeof value ===
        "string"
    ){

        return value;

    }


    if(
        value &&
        typeof value ===
        "object"
    ){

        return (
            value.address
            ||
            value.name
            ||
            value.label
            ||
            "Location"
        );

    }


    return fallback;

}


function pickupText(
    ride
){

    return (
        locationText(
            ride.pickupAddress,
            ""
        )
        ||
        locationText(
            ride.pickupLocation,
            ""
        )
        ||
        locationText(
            ride.pickup,
            ""
        )
        ||
        ride.pickupText
        ||
        "Pickup location"
    );

}


function dropText(
    ride
){

    return (
        locationText(
            ride.dropAddress,
            ""
        )
        ||
        locationText(
            ride.dropLocation,
            ""
        )
        ||
        locationText(
            ride.drop,
            ""
        )
        ||
        ride.destination
        ||
        ride.dropText
        ||
        "Destination"
    );

}


// =========================================================
// ADD ROUTE MARKERS
// =========================================================

function renderRouteMarkers(
    ride
){

    const pickup =
        getPickupCoords(
            ride
        );


    const drop =
        getDropCoords(
            ride
        );


    const customerIcon =
        L.divIcon(

            {

                className:"",

                html:
                    '<div class="customer-marker"></div>',

                iconSize:[
                    24,
                    24
                ],

                iconAnchor:[
                    12,
                    12
                ]

            }

        );


    if(
        pickup
    ){

        if(
            pickupMarker
        ){

            pickupMarker.setLatLng(
                [
                    pickup.lat,
                    pickup.lng
                ]
            );

        }else{

            pickupMarker =
                L.marker(

                    [
                        pickup.lat,
                        pickup.lng
                    ],

                    {
                        icon:customerIcon
                    }

                )
                .addTo(
                    map
                );

        }

    }


    if(
        drop
    ){

        if(
            dropMarker
        ){

            dropMarker.setLatLng(
                [
                    drop.lat,
                    drop.lng
                ]
            );

        }else{

            dropMarker =
                L.marker(

                    [
                        drop.lat,
                        drop.lng
                    ]

                )
                .addTo(
                    map
                );

        }

    }


    const points = [];


    if(
        pickup
    ){

        points.push(
            [
                pickup.lat,
                pickup.lng
            ]
        );

    }


    if(
        drop
    ){

        points.push(
            [
                drop.lat,
                drop.lng
            ]
        );

    }


    if(
        currentPosition
    ){

        points.push(
            [
                currentPosition.lat,
                currentPosition.lng
            ]
        );

    }


    if(
        points.length >= 2
    ){

        map.fitBounds(
            points,
            {
                padding:[
                    60,
                    220
                ]
            }
        );

    }

}


// =========================================================
// GPS
// =========================================================

function startGPS(){

    if(
        !navigator.geolocation
    ){

        document.getElementById(
            "gpsText"
        ).innerText =
            "GPS UNSUPPORTED";

        return;

    }


    document.getElementById(
        "gpsText"
    ).innerText =
        "GPS STARTING";


    watchId =
        navigator.geolocation.watchPosition(

            async position => {

                const lat =
                    position.coords.latitude;

                const lng =
                    position.coords.longitude;


                currentPosition = {

                    lat,
                    lng

                };


                document
                    .querySelector(
                        ".gps"
                    )
                    .classList.add(
                        "active"
                    );


                document.getElementById(
                    "gpsText"
                ).innerText =
                    "GPS LIVE";


                if(
                    riderMarker
                ){

                    riderMarker.setLatLng(
                        [
                            lat,
                            lng
                        ]
                    );

                }


                await saveRiderLocation(
                    lat,
                    lng
                );


                renderRouteMarkers(
                    rideData
                );

            },

            error => {

                console.warn(
                    "GPS:",
                    error
                );


                document.getElementById(
                    "gpsText"
                ).innerText =
                    "GPS ERROR";

            },

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    3000,

                timeout:
                    10000

            }

        );

}


// =========================================================
// SAVE RIDER LOCATION
// =========================================================

async function saveRiderLocation(
    lat,
    lng
){

    if(
        !currentUser
    ){

        return;

    }


    try{

        await setDoc(

            doc(
                db,
                "riderLocations",
                currentUser.uid
            ),

            {

                riderId:
                    currentUser.uid,

                lat:
                    lat,

                lng:
                    lng,

                rideId:
                    rideId,

                updatedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );


        /*
         * Also keep the latest rider position on the ride
         * document. This gives customer-side code another
         * reliable source if needed.
         */

        await updateDoc(

            doc(
                db,
                "rides",
                rideId
            ),

            {

                riderLocation:{
                    lat,
                    lng
                },

                riderLat:
                    lat,

                riderLng:
                    lng,

                locationUpdatedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }

        );

    }catch(err){

        console.warn(
            "Location save:",
            err
        );

    }

}


// =========================================================
// STATUS UI
// =========================================================

function updateStatusUI(
    status
){

    const normalized =
        String(
            status || ""
        )
        .toUpperCase();


    const title =
        document.getElementById(
            "statusTitle"
        );

    const subtitle =
        document.getElementById(
            "statusSubtitle"
        );

    const icon =
        document.getElementById(
            "statusIcon"
        );

    const badge =
        document.getElementById(
            "rideBadge"
        );


    primaryBtn.style.display =
        "block";

    completeBtn.style.display =
        "none";

    document.getElementById(
        "cancelBtn"
    ).style.display =
        "block";


    if(
        normalized ===
        "ACCEPTED"
        ||
        normalized ===
        "ASSIGNED"
        ||
        normalized ===
        "SEARCHING"
    ){

        icon.innerText =
            "🧭";

        title.innerText =
            "Head to pickup";

        subtitle.innerText =
            "Customer ko pickup karne ke liye location par jayein.";

        badge.innerText =
            "ON THE WAY";

        primaryBtn.innerText =
            "Arrived at Pickup";

        primaryBtn.disabled =
            false;

        document.getElementById(
            "tripTitle"
        ).innerText =
            "Navigate to pickup";

    }


    else if(
        normalized ===
        "ARRIVED"
        ||
        normalized ===
        "RIDER_ARRIVED"
        ||
        normalized ===
        "AT_PICKUP"
    ){

        icon.innerText =
            "📍";

        title.innerText =
            "Customer pickup par hai";

        subtitle.innerText =
            "Customer ko pickup karein aur ride start karein.";

        badge.innerText =
            "ARRIVED";

        primaryBtn.innerText =
            "Start Ride";

        primaryBtn.disabled =
            false;

        document.getElementById(
            "tripTitle"
        ).innerText =
            "Customer pickup";

    }


    else if(
        normalized ===
        "STARTED"
        ||
        normalized ===
        "ONGOING"
        ||
        normalized ===
        "IN_PROGRESS"
        ||
        normalized ===
        "RIDE_STARTED"
    ){

        icon.innerText =
            "🚕";

        title.innerText =
            "Ride in progress";

        subtitle.innerText =
            "Customer ko destination par le ja rahe hain.";

        badge.innerText =
            "ON RIDE";

        primaryBtn.style.display =
            "none";

        completeBtn.style.display =
            "block";

        document.getElementById(
            "tripTitle"
        ).innerText =
            "Navigate to destination";

    }


    else if(
        normalized ===
        "COMPLETED"
        ||
        normalized ===
        "FINISHED"
    ){

        icon.innerText =
            "✓";

        title.innerText =
            "Ride completed";

        subtitle.innerText =
            "Ride successfully complete ho gayi.";

        badge.innerText =
            "COMPLETED";

        primaryBtn.style.display =
            "none";

        completeBtn.style.display =
            "none";

        document.getElementById(
            "cancelBtn"
        ).style.display =
            "none";

        document.getElementById(
            "headerStatus"
        ).innerHTML =
            '<span class="status-dot"></span> DONE';

    }


    else if(
        normalized ===
        "CANCELLED"
        ||
        normalized ===
        "CANCELED"
    ){

        icon.innerText =
            "✕";

        title.innerText =
            "Ride cancelled";

        subtitle.innerText =
            "This ride has been cancelled.";

        badge.innerText =
            "CANCELLED";

        primaryBtn.style.display =
            "none";

        completeBtn.style.display =
            "none";

        document.getElementById(
            "cancelBtn"
        ).style.display =
            "none";

    }

}


// =========================================================
// RENDER RIDE
// =========================================================

function renderRide(
    ride
){

    rideData =
        ride;


    document.getElementById(
        "pickup"
    ).innerText =
        pickupText(
            ride
        );


    document.getElementById(
        "drop"
    ).innerText =
        dropText(
            ride
        );


    const status =
        String(
            ride.status ||
            ""
        ).toUpperCase();


    updateStatusUI(
        status
    );


    const target =
        (
            status ===
            "STARTED"
            ||
            status ===
            "ONGOING"
            ||
            status ===
            "IN_PROGRESS"
            ||
            status ===
            "RIDE_STARTED"
        )
        ?
        dropText(
            ride
        )
        :
        pickupText(
            ride
        );


    document.getElementById(
        "tripAddress"
    ).innerText =
        target;


    renderRouteMarkers(
        ride
    );

}


// =========================================================
// LISTEN RIDE
// =========================================================

function listenRide(){

    const rideRef =
        doc(
            db,
            "rides",
            rideId
        );


    unsubscribeRide =
        onSnapshot(

            rideRef,

            snapshot => {

                if(
                    !snapshot.exists()
                ){

                    showError(
                        "Ride record nahi mila."
                    );

                    return;

                }


                rideData =
                    snapshot.data();


                renderRide(
                    rideData
                );


                localStorage.setItem(
                    "activeRideId",
                    rideId
                );

                localStorage.setItem(
                    "rideId",
                    rideId
                );

            },

            err => {

                console.error(
                    "Ride listener:",
                    err
                );


                showError(
                    "Ride realtime connection failed: " +
                    err.message
                );

            }

        );

}


// =========================================================
// UPDATE RIDE STATUS
// =========================================================

async function updateRideStatus(
    newStatus
){

    if(
        !currentUser
        ||
        !rideId
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "rides",
                rideId
            ),

            {

                status:
                    newStatus,

                riderId:
                    currentUser.uid,

                riderUid:
                    currentUser.uid,

                updatedAt:
                    serverTimestamp(),

                ...(newStatus ===
                    "ARRIVED"
                    ?
                    {
                        arrivedAt:
                            serverTimestamp()
                    }
                    :
                    {}),

                ...(newStatus ===
                    "STARTED"
                    ?
                    {
                        startedAt:
                            serverTimestamp()
                    }
                    :
                    {}),

                ...(newStatus ===
                    "COMPLETED"
                    ?
                    {
                        completedAt:
                            serverTimestamp()
                    }
                    :
                    {})

            }

        );

    }catch(err){

        console.error(
            "Status update:",
            err
        );


        alert(
            "Ride status update nahi hua:\n" +
            err.message
        );

    }

}


// =========================================================
// PRIMARY BUTTON
// =========================================================

primaryBtn.addEventListener(
    "click",
    async () => {

        const status =
            String(
                rideData?.status ||
                ""
            ).toUpperCase();


        if(
            status ===
            "ACCEPTED"
            ||
            status ===
            "ASSIGNED"
            ||
            status ===
            "SEARCHING"
        ){

            primaryBtn.disabled =
                true;

            primaryBtn.innerText =
                "Updating...";


            await updateRideStatus(
                "ARRIVED"
            );


            primaryBtn.disabled =
                false;

            return;

        }


        if(
            status ===
            "ARRIVED"
            ||
            status ===
            "RIDER_ARRIVED"
            ||
            status ===
            "AT_PICKUP"
        ){

            primaryBtn.disabled =
                true;

            primaryBtn.innerText =
                "Starting...";


            await updateRideStatus(
                "STARTED"
            );


            primaryBtn.disabled =
                false;

        }

    }
);


// =========================================================
// COMPLETE
// =========================================================

completeBtn.addEventListener(
    "click",
    async () => {

        const confirmed =
            window.confirm(
                "Kya customer ko destination par pahucha diya hai?"
            );


        if(
            !confirmed
        ){

            return;

        }


        completeBtn.disabled =
            true;

        completeBtn.innerText =
            "Completing...";


        await updateRideStatus(
            "COMPLETED"
        );


        completeBtn.disabled =
            false;

    }
);


// =========================================================
// CANCEL
// =========================================================

document
    .getElementById(
        "cancelBtn"
    )
    .addEventListener(
        "click",
        async () => {

            const confirmed =
                window.confirm(
                    "Kya aap ye ride cancel karna chahte hain?"
                );


            if(
                !confirmed
            ){

                return;

            }


            await updateRideStatus(
                "CANCELLED"
            );

        }
    );


// =========================================================
// NAVIGATE
// =========================================================

document
    .getElementById(
        "navigateBtn"
    )
    .addEventListener(
        "click",
        () => {

            if(
                !rideData
            ){

                return;

            }


            const status =
                String(
                    rideData.status ||
                    ""
                ).toUpperCase();


            const destination =
                (
                    status ===
                    "STARTED"
                    ||
                    status ===
                    "ONGOING"
                    ||
                    status ===
                    "IN_PROGRESS"
                    ||
                    status ===
                    "RIDE_STARTED"
                )
                ?
                getDropCoords(
                    rideData
                )
                :
                getPickupCoords(
                    rideData
                );


            if(
                destination
            ){

                const url =
                    "https://www.google.com/maps/dir/?api=1" +
                    "&destination=" +
                    encodeURIComponent(
                        destination.lat +
                        "," +
                        destination.lng
                    ) +
                    "&travelmode=driving";


                window.open(
                    url,
                    "_blank"
                );

            }else{

                toast(
                    "Destination coordinates available nahi hain."
                );

            }

        }
    );


// =========================================================
// BACK
// =========================================================

document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "home.html";

        }
    );


// =========================================================
// AUTH
// =========================================================

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            showError(
                "Please login as rider first."
            );

            return;

        }


        currentUser =
            user;


        if(
            !rideId
        ){

            showError(
                "Active ride nahi mili."
            );

            return;

        }


        try{

            initMap();

            listenRide();

            startGPS();


            loading.style.display =
                "none";

            document.getElementById(
                "mapTop"
            ).style.display =
                "block";


        }catch(err){

            console.error(
                err
            );

            showError(
                err.message
            );

        }

    }
);


// =========================================================
// CLEANUP
// =========================================================

window.addEventListener(
    "beforeunload",
    () => {

        if(
            watchId !==
            null
        ){

            navigator.geolocation.clearWatch(
                watchId
            );

        }


        if(
            unsubscribeRide
        ){

            unsubscribeRide();

        }

    }
);
