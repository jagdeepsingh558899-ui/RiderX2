<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#000000">

<title>RiderX | Live Ride</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<style>

:root{
    --yellow:#ffe500;
    --black:#000;
    --dark:#090909;
    --card:#151515;
    --card2:#202020;
    --white:#fff;
    --muted:#888;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#38bdf8;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Poppins,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
}

body{
    overscroll-behavior:none;
}

button{
    font-family:inherit;
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}

#map{
    position:fixed;
    inset:0;
    z-index:1;
    width:100%;
    height:100%;
    background:#ddd;
}

.leaflet-control-zoom{
    display:none!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
    padding:2px 4px!important;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:
        max(12px,env(safe-area-inset-top))
        14px
        0;
    pointer-events:none;
}

.topbar-inner{
    height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:rgba(10,10,10,.94);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
    pointer-events:auto;
}

.top-btn:active{
    transform:scale(.92);
}

.logo{
    padding:9px 17px;
    border-radius:15px;
    background:rgba(10,10,10,.94);
    font-size:17px;
    font-weight:900;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.logo span{
    color:var(--yellow);
}


/* =========================================================
   STATUS
========================================================= */

.status-pill{
    position:fixed;
    top:
        calc(
            max(12px,env(safe-area-inset-top))
            + 63px
        );
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    max-width:90%;
    padding:8px 16px;
    border-radius:30px;
    background:rgba(10,10,10,.95);
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.status-pill.searching{
    color:var(--yellow);
}

.status-pill.accepted{
    color:var(--green);
}

.status-pill.completed{
    color:var(--blue);
}

.status-pill.cancelled{
    color:#ff7070;
}


/* =========================================================
   MAP CONTROLS
========================================================= */

.map-controls{
    position:fixed;
    right:14px;
    bottom:330px;
    z-index:900;
    display:flex;
    flex-direction:column;
    gap:9px;
}

.map-btn{
    width:47px;
    height:47px;
    border:0;
    border-radius:50%;
    background:#111;
    color:#fff;
    box-shadow:0 5px 20px rgba(0,0,0,.45);
    font-size:17px;
}

.map-btn.location{
    color:var(--yellow);
}

.map-btn:active{
    transform:scale(.92);
}


/* =========================================================
   BOTTOM SHEET
========================================================= */

.sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1000;
    max-height:62vh;
    overflow-y:auto;
    padding:
        10px
        14px
        max(
            15px,
            env(safe-area-inset-bottom)
        );
    background:rgba(8,8,8,.98);
    border-radius:27px 27px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,.55);
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
}

.handle{
    width:46px;
    height:5px;
    margin:0 auto 13px;
    border-radius:10px;
    background:#555;
}


/* =========================================================
   CUSTOMER
========================================================= */

.customer-card{
    display:flex;
    align-items:center;
    gap:9px;
    padding:13px;
    background:#151515;
    border:1px solid #292929;
    border-radius:17px;
}

.avatar{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    background:#242424;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--yellow);
    font-size:20px;
}

.customer-info{
    min-width:0;
    flex:1;
}

.customer-name{
    font-size:15px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.customer-meta{
    margin-top:4px;
    color:#888;
    font-size:10px;
}

.rating{
    margin-top:4px;
    color:var(--yellow);
    font-size:10px;
}

.call-btn,
.chat-btn{
    width:45px;
    height:45px;
    min-width:45px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.call-btn{
    background:var(--green);
    color:#000;
}

.chat-btn{
    background:#292929;
    color:#fff;
}


/* =========================================================
   ROUTE
========================================================= */

.route-card{
    margin-top:11px;
    padding:13px;
    background:#151515;
    border:1px solid #292929;
    border-radius:17px;
}

.route-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
}

.route-icon{
    width:28px;
    height:28px;
    min-width:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

.pickup{
    background:#12351f;
    color:var(--green);
}

.dropoff{
    background:#3a3300;
    color:var(--yellow);
}

.route-text{
    min-width:0;
    flex:1;
}

.route-label{
    color:#777;
    font-size:9px;
}

.route-address{
    margin-top:3px;
    font-size:12px;
    line-height:1.4;
}

.route-line{
    height:18px;
    margin-left:13px;
    border-left:1px dashed #555;
}


/* =========================================================
   RIDE INFO
========================================================= */

.ride-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:11px;
}

.info{
    padding:11px 5px;
    background:#151515;
    border-radius:14px;
    border:1px solid #252525;
    text-align:center;
}

.info i{
    color:var(--yellow);
    font-size:14px;
    margin-bottom:5px;
}

.info-value{
    font-size:12px;
    font-weight:800;
}

.info-label{
    margin-top:3px;
    color:#666;
    font-size:8px;
}


/* =========================================================
   BUTTONS
========================================================= */

.primary-btn{
    width:100%;
    min-height:52px;
    margin-top:12px;
    border:0;
    border-radius:15px;
    background:var(--yellow);
    color:#000;
    font-size:15px;
    font-weight:900;
}

.primary-btn:disabled{
    background:#3b3b3b;
    color:#888;
}

.secondary-btn{
    width:100%;
    min-height:48px;
    margin-top:9px;
    border:1px solid #343434;
    border-radius:14px;
    background:#151515;
    color:#fff;
    font-size:13px;
    font-weight:700;
}

.cancel-btn{
    width:100%;
    min-height:46px;
    margin-top:9px;
    border:1px solid #402020;
    border-radius:14px;
    background:#180909;
    color:#ff7777;
    font-size:12px;
    font-weight:700;
}


/* =========================================================
   COMPLETE
========================================================= */

.complete-box{
    display:none;
    margin-top:12px;
    padding:16px;
    text-align:center;
    background:#151515;
    border-radius:17px;
}

.complete-box.show{
    display:block;
}

.complete-icon{
    width:55px;
    height:55px;
    margin:0 auto 9px;
    border-radius:50%;
    background:#12351f;
    color:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.complete-title{
    font-size:17px;
    font-weight:900;
}

.complete-text{
    margin-top:5px;
    color:#888;
    font-size:10px;
}


/* =========================================================
   NO RIDE
========================================================= */

.no-ride{
    position:fixed;
    inset:0;
    z-index:800;
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
    pointer-events:none;
}

.no-ride.show{
    display:flex;
}

.no-ride-box{
    padding:20px;
    border-radius:20px;
    background:rgba(10,10,10,.92);
}

.no-ride-box i{
    color:var(--yellow);
    font-size:35px;
    margin-bottom:12px;
}

.no-ride-box h3{
    font-size:17px;
}

.no-ride-box p{
    margin-top:6px;
    color:#888;
    font-size:10px;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .sheet{
        left:50%;
        right:auto;
        width:520px;
        transform:translateX(-50%);
    }

    .map-controls{
        right:calc(50% - 330px);
    }

}

</style>

</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
} from "../firebase/firebase-config.js";

import {
    doc,
    getDoc,
    updateDoc,
    setDoc,
    serverTimestamp,
    onSnapshot,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================================================
   ELEMENTS
========================================================= */

const statusPill =
    document.getElementById("statusPill");

const noRide =
    document.getElementById("noRide");

const customerName =
    document.getElementById("customerName");

const customerPhone =
    document.getElementById("customerPhone");

const customerRating =
    document.getElementById("customerRating");

const pickupAddress =
    document.getElementById("pickupAddress");

const dropoffAddress =
    document.getElementById("dropoffAddress");

const distanceEl =
    document.getElementById("distance");

const fareEl =
    document.getElementById("fare");

const paymentEl =
    document.getElementById("payment");

const mainAction =
    document.getElementById("mainAction");

const arrivedBtn =
    document.getElementById("arrivedBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const completeBox =
    document.getElementById("completeBox");

const completeText =
    document.getElementById("completeText");


/* =========================================================
   CONSTANTS
========================================================= */

const ACTIVE_STATUSES = [
    "ACCEPTED",
    "ASSIGNED",
    "ARRIVING",
    "DRIVER_ARRIVING",
    "ARRIVED",
    "STARTED",
    "IN_PROGRESS",
    "ONGOING"
];

const CANCELLED_STATUSES = [
    "CANCELLED",
    "CANCELED"
];

const COMPLETED_STATUSES = [
    "COMPLETED",
    "COMPLETE"
];


/* =========================================================
   MAP
========================================================= */

const map =
    L.map(
        "map",
        {
            zoomControl:false,
            attributionControl:true
        }
    );

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap"
    }
).addTo(map);

map.setView(
    [30.7333,76.7794],
    13
);


/* =========================================================
   STATE
========================================================= */

let riderMarker = null;
let pickupMarker = null;
let dropoffMarker = null;
let routeLine = null;

let currentPosition = null;
let watchId = null;

let currentUser = null;
let currentRideId = null;
let currentRideData = null;

let rideUnsubscribe = null;

let statusUpdating = false;


/* =========================================================
   ICONS
========================================================= */

const riderIcon =
    L.divIcon({

        className:"",

        html:`
            <div style="
                width:46px;
                height:46px;
                border-radius:50%;
                background:#ffe500;
                border:4px solid #000;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#000;
                font-size:19px;
                box-shadow:0 4px 15px rgba(0,0,0,.45);
            ">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
        `,

        iconSize:[46,46],
        iconAnchor:[23,23]

    });


const pickupIcon =
    L.divIcon({

        className:"",

        html:`
            <div style="
                width:38px;
                height:38px;
                border-radius:50%;
                background:#22c55e;
                border:4px solid #000;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#000;
                font-size:12px;
            ">
                <i class="fa-solid fa-user"></i>
            </div>
        `,

        iconSize:[38,38],
        iconAnchor:[19,19]

    });


const dropoffIcon =
    L.divIcon({

        className:"",

        html:`
            <div style="
                width:40px;
                height:40px;
                border-radius:50% 50% 50% 0;
                background:#111;
                border:3px solid #ffe500;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#ffe500;
                font-size:14px;
                transform:rotate(-45deg);
            ">
                <i
                    class="fa-solid fa-location-dot"
                    style="transform:rotate(45deg)"
                ></i>
            </div>
        `,

        iconSize:[40,40],
        iconAnchor:[14,34]

    });


/* =========================================================
   NUMBER HELPER
========================================================= */

function getNumber(value){

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : null;

}


/* =========================================================
   COORDINATE HELPER
========================================================= */

function getCoords(data,type){

    if(!data){
        return null;
    }

    let lat = null;
    let lng = null;

    if(type === "pickup"){

        lat =
            getNumber(
                data.pickupLat ??
                data.pickupLatitude ??
                data.fromLat ??
                data.from?.lat ??
                data.pickup?.lat ??
                data.pickup?.latitude
            );

        lng =
            getNumber(
                data.pickupLng ??
                data.pickupLongitude ??
                data.fromLng ??
                data.from?.lng ??
                data.pickup?.lng ??
                data.pickup?.longitude
            );

    }

    if(type === "dropoff"){

        lat =
            getNumber(
                data.dropoffLat ??
                data.dropLatitude ??
                data.destinationLat ??
                data.toLat ??
                data.dropoff?.lat ??
                data.destination?.lat ??
                data.to?.lat ??
                data.destination?.latitude
            );

        lng =
            getNumber(
                data.dropoffLng ??
                data.dropLongitude ??
                data.destinationLng ??
                data.toLng ??
                data.dropoff?.lng ??
                data.destination?.lng ??
                data.to?.lng ??
                data.destination?.longitude
            );

    }

    if(
        lat === null ||
        lng === null ||
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
    ){
        return null;
    }

    return [lat,lng];
}


/* =========================================================
   CLEAR MAP RIDE DATA
========================================================= */

function clearRideMap(){

    if(pickupMarker){

        map.removeLayer(
            pickupMarker
        );

        pickupMarker = null;

    }

    if(dropoffMarker){

        map.removeLayer(
            dropoffMarker
        );

        dropoffMarker = null;

    }

    if(routeLine){

        map.removeLayer(
            routeLine
        );

        routeLine = null;

    }

}


/* =========================================================
   FIT MAP
========================================================= */

function fitRideMap(){

    const points = [];

    if(currentPosition){

        points.push([
            currentPosition.coords.latitude,
            currentPosition.coords.longitude
        ]);

    }

    if(pickupMarker){

        points.push(
            pickupMarker.getLatLng()
        );

    }

    if(dropoffMarker){

        points.push(
            dropoffMarker.getLatLng()
        );

    }

    if(points.length >= 2){

        map.fitBounds(
            L.latLngBounds(points),
            {
                padding:[55,110],
                maxZoom:16
            }
        );

        return;

    }

    if(points.length === 1){

        map.setView(
            points[0],
            16
        );

    }

}


/* =========================================================
   DISPLAY RIDE
========================================================= */

function displayRide(data){

    currentRideData = data || {};

    const ride =
        currentRideData;


    customerName.innerText =
        ride.customerName ||
        ride.customer?.name ||
        ride.riderName ||
        "Customer";


    customerPhone.innerText =
        ride.customerPhone ||
        ride.customer?.phone ||
        "RiderX customer";


    const rating =
        getNumber(
            ride.customerRating ??
            ride.rating ??
            ride.customer?.rating ??
            5
        ) ?? 5;


    customerRating.innerText =
        `★ ${rating.toFixed(1)}`;


    pickupAddress.innerText =
        ride.pickupAddress ||
        ride.pickupLocation ||
        ride.fromAddress ||
        (
            typeof ride.from === "string"
                ? ride.from
                : "Pickup location"
        );


    dropoffAddress.innerText =
        ride.dropoffAddress ||
        ride.dropoffLocation ||
        ride.destinationAddress ||
        ride.toAddress ||
        (
            typeof ride.destination === "string"
                ? ride.destination
                : "Destination"
        );


    const distance =
        getNumber(
            ride.distance ??
            ride.estimatedDistance ??
            ride.distanceKm ??
            ride.estimatedDistanceKm
        );


    distanceEl.innerText =
        distance !== null
            ? `${distance.toFixed(1)} km`
            : "-- km";


    const fare =
        getNumber(
            ride.fare ??
            ride.estimatedFare ??
            ride.price ??
            ride.totalFare ??
            0
        ) ?? 0;


    fareEl.innerText =
        `₹${fare.toFixed(0)}`;


    paymentEl.innerText =
        String(
            ride.paymentMethod ||
            ride.payment ||
            ride.paymentType ||
            "Cash"
        );


    clearRideMap();


    const pickup =
        getCoords(
            ride,
            "pickup"
        );


    const dropoff =
        getCoords(
            ride,
            "dropoff"
        );


    if(pickup){

        pickupMarker =
            L.marker(
                pickup,
                {
                    icon:pickupIcon
                }
            ).addTo(map);

        pickupMarker.bindPopup(
            "Customer Pickup"
        );

    }


    if(dropoff){

        dropoffMarker =
            L.marker(
                dropoff,
                {
                    icon:dropoffIcon
                }
            ).addTo(map);

        dropoffMarker.bindPopup(
            "Destination"
        );

    }


    if(
        pickup &&
        dropoff
    ){

        routeLine =
            L.polyline(
                [
                    pickup,
                    dropoff
                ],
                {
                    color:"#ffe500",
                    weight:5,
                    opacity:.75,
                    dashArray:"10 8"
                }
            ).addTo(map);

    }


    updateRideUI(
        ride.status
    );


    fitRideMap();

}


/* =========================================================
   RIDE UI
========================================================= */

function updateRideUI(status){

    const normalized =
        String(
            status || "ACCEPTED"
        ).trim()
        .toUpperCase();


    statusPill.className =
        "status-pill";


    mainAction.style.display =
        "block";

    arrivedBtn.style.display =
        "none";

    cancelBtn.style.display =
        "block";

    completeBox.classList.remove(
        "show"
    );


    /* SEARCHING */

    if([
        "SEARCHING",
        "REQUESTED",
        "PENDING"
    ].includes(normalized)){

        statusPill.classList.add(
            "searching"
        );

        statusPill.innerText =
            "Waiting for ride confirmation";

        mainAction.disabled =
            true;

        mainAction.innerHTML =
            `
                <i class="fa-solid fa-clock"></i>
                Waiting...
            `;

        cancelBtn.style.display =
            "block";

        return;

    }


    /* ACCEPTED / ASSIGNED */

    if([
        "ACCEPTED",
        "ASSIGNED"
    ].includes(normalized)){

        statusPill.classList.add(
            "accepted"
        );

        statusPill.innerText =
            "Ride accepted • Go to pickup";

        mainAction.disabled =
            false;

        mainAction.innerHTML =
            `
                <i class="fa-solid fa-location-arrow"></i>
                Start Ride
            `;

        arrivedBtn.style.display =
            "block";

        arrivedBtn.innerHTML =
            `
                <i class="fa-solid fa-flag-checkered"></i>
                Mark Arrived
            `;

        return;

    }


    /* ARRIVING */

    if([
        "ARRIVING",
        "DRIVER_ARRIVING"
    ].includes(normalized)){

        statusPill.classList.add(
            "accepted"
        );

        statusPill.innerText =
            "Heading to customer";

        mainAction.disabled =
            true;

        mainAction.innerHTML =
            `
                <i class="fa-solid fa-location-arrow"></i>
                Arriving...
            `;

        arrivedBtn.style.display =
            "block";

        arrivedBtn.innerHTML =
            `
                <i class="fa-solid fa-flag-checkered"></i>
                Mark Arrived
            `;

        return;

    }


    /* ARRIVED */

    if(normalized === "ARRIVED"){

        statusPill.classList.add(
            "accepted"
        );

        statusPill.innerText =
            "You have arrived • Start ride";

        mainAction.disabled =
            false;

        mainAction.innerHTML =
            `
                <i class="fa-solid fa-play"></i>
                Start Ride
            `;

        arrivedBtn.style.display =
            "none";

        return;

    }


    /* STARTED */

    if([
        "STARTED",
        "IN_PROGRESS",
        "ONGOING"
    ].includes(normalized)){

        statusPill.classList.add(
            "accepted"
        );

        statusPill.innerText =
            "Ride in progress";

        mainAction.disabled =
            false;

        mainAction.innerHTML =
            `
                <i class="fa-solid fa-flag-checkered"></i>
                Complete Ride
            `;

        arrivedBtn.style.display =
            "none";

        return;

    }


    /* COMPLETED */

    if(
        COMPLETED_STATUSES.includes(
            normalized
        )
    ){

        statusPill.classList.add(
            "completed"
        );

        statusPill.innerText =
            "Ride completed";

        mainAction.style.display =
            "none";

        arrivedBtn.style.display =
            "none";

        cancelBtn.style.display =
            "none";

        completeBox.classList.add(
            "show"
        );


        const fare =
            getNumber(
                currentRideData?.fare ??
                currentRideData?.estimatedFare ??
                currentRideData?.price ??
                0
            ) ?? 0;


        completeText.innerText =
            `Fare ₹${fare.toFixed(0)} completed successfully.`;

        return;

    }


    /* CANCELLED */

    if(
        CANCELLED_STATUSES.includes(
            normalized
        )
    ){

        statusPill.classList.add(
            "cancelled"
        );

        statusPill.innerText =
            "Ride cancelled";

        mainAction.style.display =
            "none";

        arrivedBtn.style.display =
            "none";

        cancelBtn.style.display =
            "none";

        return;

    }


    /* UNKNOWN */

    statusPill.classList.add(
        "searching"
    );

    statusPill.innerText =
        "Ride status updating...";

}


/* =========================================================
   CLEAN RIDER ACTIVE RIDE
========================================================= */

async function clearRiderActiveRide(){

    if(!currentUser){
        return;
    }

    try{

        const riderRef =
            doc(
                db,
                "riders",
                currentUser.uid
            );


        const riderSnap =
            await getDoc(
                riderRef
            );


        if(riderSnap.exists()){

            const riderData =
                riderSnap.data();


            if(
                riderData.activeRideId ===
                currentRideId
            ){

                await updateDoc(
                    riderRef,
                    {
                        activeRideId:null,
                        updatedAt:
                            serverTimestamp()
                    }
                );

            }

        }

    }catch(error){

        console.warn(
            "Clear active ride:",
            error
        );

    }

}


/* =========================================================
   UPDATE RIDE STATUS
========================================================= */

async function updateRideStatus(status){

    if(
        !currentRideId ||
        !currentUser ||
        statusUpdating
    ){

        return false;

    }


    statusUpdating =
        true;


    const normalized =
        String(
            status
        ).toUpperCase();


    try{

        const rideRef =
            doc(
                db,
                "rides",
                currentRideId
            );


        const updateData = {
            status:normalized,

            riderId:
                currentUser.uid,

            updatedAt:
                serverTimestamp()
        };


        if(normalized === "STARTED"){

            updateData.startedAt =
                serverTimestamp();

        }


        if(normalized === "COMPLETED"){

            updateData.completedAt =
                serverTimestamp();

        }


        if(
            normalized === "ARRIVED"
        ){

            updateData.arrivedAt =
                serverTimestamp();

        }


        if(
            CANCELLED_STATUSES.includes(
                normalized
            )
        ){

            updateData.cancelledAt =
                serverTimestamp();

            updateData.cancelledBy =
                "rider";

        }


        await updateDoc(
            rideRef,
            updateData
        );


        if(
            normalized === "COMPLETED" ||
            CANCELLED_STATUSES.includes(
                normalized
            )
        ){

            await clearRiderActiveRide();

        }


        return true;

    }catch(error){

        console.error(
            "Ride status update:",
            error
        );


        alert(
            error?.message ||
            "Unable to update ride."
        );


        return false;

    }finally{

        statusUpdating =
            false;

    }

}


/* =========================================================
   MAIN ACTION
========================================================= */

mainAction.addEventListener(
    "click",
    async () => {

        if(
            !currentRideData ||
            !currentRideId
        ){
            return;
        }


        const status =
            String(
                currentRideData.status ||
                ""
            )
            .trim()
            .toUpperCase();


        /*
         * ACCEPTED / ASSIGNED
         *
         * Rider should first travel to pickup.
         * Do not directly mark ride STARTED.
         */

        if([
            "ACCEPTED",
            "ASSIGNED"
        ].includes(status)){

            await updateRideStatus(
                "ARRIVING"
            );

            return;

        }


        /*
         * ARRIVED
         */

        if(status === "ARRIVED"){

            const confirmed =
                confirm(
                    "Customer is ready and you are at the pickup location. Start ride?"
                );


            if(!confirmed){
                return;
            }


            await updateRideStatus(
                "STARTED"
            );

            return;

        }


        /*
         * STARTED / IN PROGRESS
         */

        if([
            "STARTED",
            "IN_PROGRESS",
            "ONGOING"
        ].includes(status)){

            const confirmed =
                confirm(
                    "Complete this ride?"
                );


            if(!confirmed){
                return;
            }


            await updateRideStatus(
                "COMPLETED"
            );

        }

    }
);


/* =========================================================
   MARK ARRIVED
========================================================= */

arrivedBtn.addEventListener(
    "click",
    async () => {

        if(
            !currentRideData ||
            !currentRideId
        ){
            return;
        }


        const status =
            String(
                currentRideData.status ||
                ""
            )
            .trim()
            .toUpperCase();


        if([
            "ACCEPTED",
            "ASSIGNED",
            "ARRIVING",
            "DRIVER_ARRIVING"
        ].includes(status)){

            await updateRideStatus(
                "ARRIVED"
            );

        }

    }
);


/* =========================================================
   CANCEL
========================================================= */

cancelBtn.addEventListener(
    "click",
    async () => {

        if(
            !currentRideId ||
            !currentRideData
        ){
            return;
        }


        const status =
            String(
                currentRideData.status ||
                ""
            )
            .trim()
            .toUpperCase();


        if(

            );


        if(!confirmed){

   CALL

document

/* =========================================================
   GPS
========================================================= */

function startGPS(){

    if(
        !navigator.geolocation
    ){

        console.warn(
            "Geolocation is not supported."
        );

        return;

    }


    if(
        watchId !== null
    ){

        return;

    }


    watchId =
        navigator.geolocation.watchPosition(
            updateGPS,

            error => {

                console.warn(
                    "GPS error:",
                    error
                );

            },

            {
                enableHighAccuracy:true,
                maximumAge:3000,
                timeout:15000
            }
        );

}


/* =========================================================
   UPDATE GPS
========================================================= */

async function updateGPS(position){

    currentPosition =
        position;


    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;


    const coords = [
        lat,
        lng
    ];


    if(!riderMarker){

        riderMarker =
            L.marker(
                coords,
                {
                    icon:riderIcon,
                    zIndexOffset:1000
                }
            ).addTo(map);

    }else{

        riderMarker.setLatLng(
            coords
        );

    }


    /*
     * Save live rider location only when
     * the rider has an active ride.
     */

    if(
        currentUser &&
        currentRideId
    ){

        try{

            await setDoc(
                doc(
                    db,
                    "riderLocations",
                    currentUser.uid
                ),
                {
                    riderId:
                        currentUser.uid,

                    rideId:
                        currentRideId,

                    lat:
                        lat,

                    lng:
                        lng,

                    accuracy:
                        Number.isFinite(
                            Number(
                                position.coords.accuracy
                            )
                        )
                        ? Number(
                            position.coords.accuracy
                        )
                        : null,

                    speed:
                        Number.isFinite(
                            Number(
                                position.coords.speed
                            )
                        )
                        ? Number(
                            position.coords.speed
                        )
                        : 0,

                    heading:
                        Number.isFinite(
                            Number(
                                position.coords.heading
                            )
                        )
                        ? Number(
                            position.coords.heading
                        )
                        : null,

                    online:true,

                    updatedAt:
                        serverTimestamp()
                },
                {
                    merge:true
                }
            );

        }catch(error){

            console.warn(
                "Live location update:",
                error
            );

        }

    }

}


/* =========================================================
   FIND ACTIVE RIDE
========================================================= */

async function findActiveRide(uid){

    try{

        /*
         * First use rider.activeRideId.
         * This is the fastest and safest lookup.
         */

        const riderSnap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    uid
                )
            );


        if(riderSnap.exists()){

            const riderData =
                riderSnap.data();


            const activeRideId =
                riderData.activeRideId;


            if(activeRideId){

                const activeRideSnap =
                    await getDoc(
                        doc(
                            db,
                            "rides",
                            activeRideId
                        )
                    );


                if(
                    activeRideSnap.exists()
                ){

                    const activeData =
                        activeRideSnap.data();


                    const activeStatus =
                        String(
                            activeData.status ||
                            ""
                        )
                        .trim()
                        .toUpperCase();


                    if(
                        ACTIVE_STATUSES.includes(
                            activeStatus
                        )
                    ){

                        return activeRideId;

                    }

                }

            }

        }


        /*
         * Fallback: find an active ride
         * belonging to this rider.
         */

        const ridesQuery =
            query(
                collection(
                    db,
                    "rides"
                ),
                where(
                    "riderId",
                    "==",
                    uid
                )
            );


        const snap =
            await getDocs(
                ridesQuery
            );


        let latestRide = null;


        snap.forEach(
            rideSnap => {

                const data =
                    rideSnap.data();


                const status =
                    String(
                        data.status ||
                        ""
                    )
                    .trim()
                    .toUpperCase();


                if(
                    !ACTIVE_STATUSES.includes(
                        status
                    )
                ){
                    return;
                }


                const timestamp =
                    data.updatedAt?.toMillis?.() ||
                    data.createdAt?.toMillis?.() ||
                    0;


                if(
                    !latestRide ||
                    timestamp >=
                    latestRide.timestamp
                ){

                    latestRide = {
                        id:
                            rideSnap.id,

                        timestamp:
                            timestamp
                    };

                }

            }
        );


        return latestRide?.id || null;

    }catch(error){

        console.error(
            "Find active ride:",
            error
        );

        return null;

    }

}


/* =========================================================
   LISTEN TO RIDE
========================================================= */

function listenRide(rideId){

    if(
        rideUnsubscribe
    ){

        rideUnsubscribe();

        rideUnsubscribe =
            null;

    }


    currentRideId =
        rideId;


    const rideRef =
        doc(
            db,
            "rides",
            rideId
        );


    rideUnsubscribe =
        onSnapshot(

            rideRef,

            snapshot => {

                if(
                    !snapshot.exists()
                ){

                    currentRideData =
                        null;

                    clearRideMap();

                    noRide.classList.add(
                        "show"
                    );

                    statusPill.className =
                        "status-pill cancelled";

                    statusPill.innerText =
                        "Ride no longer available";

                    mainAction.style.display =
                        "none";

                    arrivedBtn.style.display =
                        "none";

                    cancelBtn.style.display =
                        "none";

                    return;

                }


                noRide.classList.remove(
                    "show"
                );


                const data =
                    snapshot.data();


                displayRide(
                    data
                );

            },

            error => {

                console.error(
                    "Ride listener:",
                    error
                );

                statusPill.className =
                    "status-pill cancelled";

                statusPill.innerText =
                    "Unable to load ride";

            }
        );

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            location.replace(
                "../auth/login.html?role=rider"
            );

            return;

        }


        currentUser =
            user;


        startGPS();


        const params =
            new URLSearchParams(
                location.search
            );


        const urlRideId =
            params.get(
                "rideId"
            );


        const rideId =
            urlRideId ||
            await findActiveRide(
                user.uid
            );


        if(!rideId){

            currentRideId =
                null;

            currentRideData =
                null;

            noRide.classList.add(
                "show"
            );

            statusPill.className =
                "status-pill"
            ;

            statusPill.innerText =
                "No active ride";

            mainAction.style.display =
                "none";

            arrivedBtn.style.display =
                "none";

            cancelBtn.style.display =
                "none";

            return;

        }


        noRide.classList.remove(
            "show"
        );


        listenRide(
            rideId
        );

    }
);

   BACK

document
.getElementById("backBtn")
.addEventListener(

    () => {

        const status =
            String(
                currentRideData?.status ||
                ""
            )
            .trim()
            .toUpperCase();


        if([
            "STARTED",
            "IN_PROGRESS",
            "ONGOING"

    }
);

   NOTIFICATIONS
========================================================= */

document
.getElementById("notificationBtn")

/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(
            watchId !== null &&
            navigator.geolocation
        ){

            navigator.geolocation.clearWatch(
                watchId
            );

            watchId =
                null;

        }


        if(
            rideUnsubscribe
        ){

            rideUnsubscribe();

            rideUnsubscribe =
                null;

        }

    }
);

   MAP RESIZE
========================================================= */

setTimeout(
    () => {

        map.invalidateSize();

    },
    500
);
