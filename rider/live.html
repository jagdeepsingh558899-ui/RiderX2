import {

    db
} from "../firebase/firebase-config.js";

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let rideId = null;

let rideData = null;

let unsubscribeRide = null;

let watchId = null;

let map = null;

let riderMarker = null;

let customerMarker = null;

let pickupMarker = null;

let dropMarker = null;

let routeLine = null;

let currentPosition = null;

let lastLocationWrite = 0;

let mapInitialized = false;


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


rideId =
    params.get("rideId")
    ||
    params.get("id")
    ||
    localStorage.getItem("activeRideId")
    ||
    localStorage.getItem("rideId");


/* =========================================================
   DOM
========================================================= */

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const primaryBtn =
    document.getElementById("primaryBtn");

const completeBtn =
    document.getElementById("completeBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const navigateBtn =
    document.getElementById("navigateBtn");

const gps =
    document.getElementById("gps");

const gpsText =
    document.getElementById("gpsText");


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    loading.style.display =
        "none";

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    let el =
        document.getElementById(
            "toastLiveRide"
        );

    if(!el){

        el =
            document.createElement(
                "div"
            );

        el.id =
            "toastLiveRide";

        el.style.position =
            "fixed";

        el.style.left =
            "14px";

        el.style.right =
            "14px";

        el.style.bottom =
            "calc(250px + env(safe-area-inset-bottom))";

        el.style.zIndex =
            "7000";

        el.style.padding =
            "13px";

        el.style.borderRadius =
            "14px";

        el.style.background =
            "#222";

        el.style.border =
            "1px solid #333";

        el.style.color =
            "#fff";

        el.style.textAlign =
            "center";

        el.style.fontSize =
            "10px";

        el.style.fontWeight =
            "900";

        document.body.appendChild(
            el
        );

    }

    el.innerText =
        message;

    el.style.display =
        "block";

    clearTimeout(
        window.__liveToast
    );

    window.__liveToast =
        setTimeout(
            () => {

                el.style.display =
                    "none";

            },
            2500
        );

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeStatus(status){

    return String(
        status || ""
    )
    .trim()
    .toUpperCase();

}


/* =========================================================
   LOCATION HELPERS
========================================================= */

function locationText(
    value,
    fallback
){

    if(
        typeof value ===
        "string"
    ){

        return value;

    }

    if(
        value &&
        typeof value ===
        "object"
    ){

        return (
            value.address
            ||
            value.name
            ||
            value.label
            ||
            fallback
        );

    }

    return fallback;

}


function getPoint(value){

    if(
        !value
        ||
        typeof value !==
        "object"
    ){

        return null;

    }


    const lat =
        Number(
            value.lat
            ??
            value.latitude
        );


    const lng =
        Number(
            value.lng
            ??
            value.lon
            ??
            value.longitude
        );


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lng)
    ){

        return null;

    }


    return {
        lat,
        lng
    };

}


function getPickupPoint(ride){

    return (
        getPoint(
            ride.pickupLocation
        )
        ||
        getPoint(
            ride.pickup
        )
        ||
        getPoint(
            ride.pickupCoords
        )
        ||
        getPoint(
            ride.pickupCoordinates
        )
        ||
        (
            Number.isFinite(
                Number(
                    ride.pickupLat
                )
            )
            &&
            Number.isFinite(
                Number(
                    ride.pickupLng
                )
            )
            ?
            {
                lat:
                    Number(
                        ride.pickupLat
                    ),
                lng:
                    Number(
                        ride.pickupLng
                    )
            }
            :
            null
        )
    );

}


function getDropPoint(ride){

    return (
        getPoint(
            ride.dropLocation
        )
        ||
        getPoint(
            ride.drop
        )
        ||
        getPoint(
            ride.destinationLocation
        )
        ||
        getPoint(
            ride.dropCoords
        )
        ||
        getPoint(
            ride.dropCoordinates
        )
        ||
        (
            Number.isFinite(
                Number(
                    ride.dropLat
                )
            )
            &&
            Number.isFinite(
                Number(
                    ride.dropLng
                )
            )
            ?
            {
                lat:
                    Number(
                        ride.dropLat
                    ),
                lng:
                    Number(
                        ride.dropLng
                    )
            }
            :
            null
        )
    );

}


function pickupText(ride){

    return (
        locationText(
            ride.pickupAddress,
            ""
        )
        ||
        locationText(
            ride.pickupLocation,
            ""
        )
        ||
        locationText(
            ride.pickup,
            ""
        )
        ||
        ride.pickupText
        ||
        "Pickup location"
    );

}


function dropText(ride){

    return (
        locationText(
            ride.dropAddress,
            ""
        )
        ||
        locationText(
            ride.dropLocation,
            ""
        )
        ||
        locationText(
            ride.drop,
            ""
        )
        ||
        locationText(
            ride.destination,
            ""
        )
        ||
        ride.dropText
        ||
        "Destination"
    );

}


/* =========================================================
   MAP
========================================================= */

function initMap(){

    if(mapInitialized){

        return;

    }


    map =
        L.map(
            "map",
            {
                zoomControl:true,
                attributionControl:true
            }
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(
        map
    );


    map.setView(
        [30.7333,76.7794],
        13
    );


    mapInitialized =
        true;

}


/* =========================================================
   ICONS
========================================================= */

const riderIcon =
    L.divIcon({

        className:"",

        html:
            '<div class="rider-marker">🏍️</div>',

        iconSize:
            [48,48],

        iconAnchor:
            [24,24]

    });


const customerIcon =
    L.divIcon({

        className:"",

        html:
            '<div class="customer-marker"></div>',

        iconSize:
            [24,24],

        iconAnchor:
            [12,12]

    });


const pickupIcon =
    L.divIcon({

        className:"",

        html:
            '<div class="pickup-marker">P</div>',

        iconSize:
            [25,25],

        iconAnchor:
            [12,12]

    });


const dropIcon =
    L.divIcon({

        className:"",

        html:
            '<div class="drop-marker">D</div>',

        iconSize:
            [25,25],

        iconAnchor:
            [12,12]

    });


/* =========================================================
   RENDER MAP
========================================================= */

function renderRideMap(ride){

    initMap();


    const pickup =
        getPickupPoint(
            ride
        );


    const drop =
        getDropPoint(
            ride
        );


    if(
        pickup
    ){

        if(
            !pickupMarker
        ){

            pickupMarker =
                L.marker(
                    [
                        pickup.lat,
                        pickup.lng
                    ],
                    {
                        icon:
                            pickupIcon
                    }
                )
                .addTo(
                    map
                );

        }else{

            pickupMarker.setLatLng(
                [
                    pickup.lat,
                    pickup.lng
                ]
            );

        }

    }


    if(
        drop
    ){

        if(
            !dropMarker
        ){

            dropMarker =
                L.marker(
                    [
                        drop.lat,
                        drop.lng
                    ],
                    {
                        icon:
                            dropIcon
                    }
                )
                .addTo(
                    map
                );

        }else{

            dropMarker.setLatLng(
                [
                    drop.lat,
                    drop.lng
                ]
            );

        }

    }


    if(
        pickup
        &&
        drop
    ){

        const bounds =
            L.latLngBounds(
                [
                    [
                        pickup.lat,
                        pickup.lng
                    ],
                    [
                        drop.lat,
                        drop.lng
                    ]
                ]
            );


        map.fitBounds(
            bounds,
            {
                padding:
                    [80,120]
            }
        );

    }


    if(
        currentPosition
    ){

        updateRiderMarker(
            currentPosition.lat,
            currentPosition.lng,
            false
        );

    }

}


/* =========================================================
   RIDER MARKER
========================================================= */

function updateRiderMarker(
    lat,
    lng,
    center = true
){

    initMap();


    if(
        !riderMarker
    ){

        riderMarker =
            L.marker(
                [
                    lat,
                    lng
                ],
                {
                    icon:
                        riderIcon,
                    zIndexOffset:
                        1000
                }
            )
            .addTo(
                map
            );

    }else{

        riderMarker.setLatLng(
            [
                lat,
                lng
            ]
        );

    }


    if(
        center
    ){

        map.setView(
            [
                lat,
                lng
            ],
            Math.max(
                map.getZoom(),
                15
            )
        );

    }

}


/* =========================================================
   ROUTE LINE
========================================================= */

function updateRouteLine(){

    if(
        !map
        ||
        !currentPosition
    ){

        return;

    }


    const pickup =
        getPickupPoint(
            rideData
        );


    const drop =
        getDropPoint(
            rideData
        );


    const status =
        normalizeStatus(
            rideData?.status
        );


    let destination =
        null;


    if(
        status === "ACCEPTED"
        ||
        status === "ASSIGNED"
        ||
        status === "ARRIVED"
        ||
        status === "RIDER_ARRIVED"
        ||
        status === "AT_PICKUP"
    ){

        destination =
            pickup;

    }else if(
        status === "STARTED"
        ||
        status === "ONGOING"
        ||
        status === "IN_PROGRESS"
        ||
        status === "RIDE_STARTED"
    ){

        destination =
            drop;

    }


    if(
        !destination
    ){

        if(routeLine){

            map.removeLayer(
                routeLine
            );

            routeLine =
                null;

        }

        return;

    }


    const points = [

        [
            currentPosition.lat,
            currentPosition.lng
        ],

        [
            destination.lat,
            destination.lng
        ]

    ];


    if(
        routeLine
    ){

        routeLine.setLatLngs(
            points
        );

    }else{

        routeLine =
            L.polyline(
                points,
                {
                    color:"#FFD600",
                    weight:5,
                    opacity:.75,
                    dashArray:"10 8"
                }
            )
            .addTo(
                map
            );

    }

}


/* =========================================================
   STATUS UI
========================================================= */

function updateStatusUI(status){

    const normalized =
        normalizeStatus(
            status
        );


    const icon =
        document.getElementById(
            "statusIcon"
        );

    const title =
        document.getElementById(
            "statusTitle"
        );

    const subtitle =
        document.getElementById(
            "statusSubtitle"
        );

    const badge =
        document.getElementById(
            "rideBadge"
        );

    const headerStatus =
        document.getElementById(
            "headerStatus"
        );


    if(
        normalized ===
        "ACCEPTED"
        ||
        normalized ===
        "ASSIGNED"
    ){

        icon.innerText =
            "🏍️";

        title.innerText =
            "Ride Accepted";

        subtitle.innerText =
            "Navigate to the customer's pickup location.";

        badge.innerText =
            "TO PICKUP";

        headerStatus.innerHTML =
            '<span class="status-dot"></span> TO PICKUP';

        primaryBtn.style.display =
            "block";

        primaryBtn.innerText =
            "Arrived at Pickup";

        completeBtn.style.display =
            "none";

        document.getElementById(
            "tripTitle"
        ).innerText =
            "Navigate to pickup";

        document.getElementById(
            "tripAddress"
        ).innerText =
            pickupText(
                rideData
            );

    }


    else if(
        normalized ===
        "ARRIVED"
        ||
        normalized ===
        "RIDER_ARRIVED"
        ||
        normalized ===
        "AT_PICKUP"
    ){

        icon.innerText =
            "📍";

        title.innerText =
            "Arrived at Pickup";

        subtitle.innerText =
            "Customer ko pickup point par collect karein.";

        badge.innerText =
            "AT PICKUP";

        headerStatus.innerHTML =
            '<span class="status-dot"></span> AT PICKUP';

        primaryBtn.style.display =
            "block";

        primaryBtn.innerText =
            "Start Ride";

        completeBtn.style.display =
            "none";

        document.getElementById(
            "tripTitle"
        ).innerText =
            "Pickup customer";

        document.getElementById(
            "tripAddress"
        ).innerText =
            pickupText(
                rideData
            );

    }


    else if(
        normalized ===
        "STARTED"
        ||
        normalized ===
        "ONGOING"
        ||
        normalized ===
        "IN_PROGRESS"
        ||
        normalized ===
        "RIDE_STARTED"
    ){

        icon.innerText =
            "🚕";

        title.innerText =
            "Ride in Progress";

        subtitle.innerText =
            "Customer ko destination tak le ja rahe hain.";

        badge.innerText =
            "ON RIDE";

        headerStatus.innerHTML =
            '<span class="status-dot"></span> ON RIDE';

        primaryBtn.style.display =
            "none";

        completeBtn.style.display =

        document.getElementById(
            "tripTitle"
        ).innerText =
            "Navigate to destination";

        document.getElementById(
            "tripAddress"
        ).innerText =
            dropText(
                rideData
            );

    }


    else if(
        normalized ===
        "COMPLETED"
        ||
        normalized ===
        "COMPLETE"
        ||
        normalized ===
        "FINISHED"
    ){

        icon.innerText =
            "✓";

        title.innerText =
            "Ride Completed";

        subtitle.innerText =
            "Ride successfully completed.";

        badge.innerText =
            "COMPLETED";

        headerStatus.innerHTML =
            '<span class="status-dot"></span> COMPLETED';

        primaryBtn.style.display =
            "none";

        completeBtn.style.display =
            "none";

            "none";

            () => {

    else if(
        normalized ===

        normalized ===

/* =========================================================
   RENDER RIDE
========================================================= */

function renderRide(ride){

    rideData =
        ride;


    loading.style.display =
        "none";


    document.getElementById(
        "mapTop"
    ).style.display =
        "block";


    document.getElementById(
        "pickup"
    ).innerText =
        pickupText(
            ride
        );


    document.getElementById(
        "drop"
    ).innerText =
        dropText(
            ride
        );


    document.getElementById(
        "customerName"
    ).innerText =
        ride.customerName
        ||
        ride.customer?.name
        ||
        "Customer";


    document.getElementById(
        "customerPhone"
    ).innerText =
        ride.customerPhone
        ||
        ride.customerMobile
        ||
        ride.phone
        ||
        "Phone unavailable";


    updateStatusUI(
        ride.status
    );


    renderRideMap(
        ride
    );


    updateRouteLine();

}


/* =========================================================
   RIDE LISTENER
========================================================= */

function listenRide(){

    if(
        !rideId
    ){

        showError(
            "Ride ID nahi mila."
        );

        return;

    }


    const rideRef =
        doc(
            db,
            "rides",
            rideId
        );


    unsubscribeRide =
        onSnapshot(

            rideRef,

            snapshot => {

                if(
                    !snapshot.exists()
                ){

                    showError(
                        "Ride record nahi mila."
                    );

                    stopLocationTracking();

                    return;

                }


                const data =
                    snapshot.data();


                renderRide(
                    data
                );


                localStorage.setItem(
                    "activeRideId",
                    rideId
                );

                localStorage.setItem(
                    "rideId",
                    rideId
                );


                const status =
                    normalizeStatus(
                        data.status
                    );


                if(
                    status ===
                    "ACCEPTED"
                    ||
                    status ===
                    "ASSIGNED"
                    ||
                    status ===
                    "ARRIVED"
                    ||
                    status ===
                    "RIDER_ARRIVED"
                    ||
                    status ===
                    "AT_PICKUP"
                    ||
                    status ===
                    "STARTED"
                    ||
                    status ===
                    "ONGOING"
                    ||
                    status ===
                    "IN_PROGRESS"
                    ||
                    status ===
                    "RIDE_STARTED"
                ){

                    startLocationTracking();

                }

            },

            error => {

                console.error(
                    "Ride listener:",
                    error
                );

                showError(
                    "Ride status load nahi ho raha: "
                    +
                    error.message
                );

            }

        );

}


/* =========================================================
   UPDATE RIDE STATUS
========================================================= */

async function updateRideStatus(
    newStatus
){

    if(
        !rideId
        ||
        !currentUser
    ){

        return;

    }


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        await updateDoc(

            rideRef,

            {

                status:
                    newStatus,

                updatedAt:
                    serverTimestamp()

            }

        );


        toast(
            newStatus === "ARRIVED"
            ?
            "Customer pickup location par aa gaya."
            :
            newStatus === "STARTED"
            ?
            "Ride started."
            :
            newStatus === "COMPLETED"
            ?
            "Ride completed."
            :
            "Ride updated."
        );


    }catch(error){

        console.error(
            "Status update:",
            error
        );

        toast(
            "Status update nahi hua: "
            +
            error.message
        );

    }

}


/* =========================================================
   PRIMARY ACTION
========================================================= */

primaryBtn.addEventListener(
    "click",
    async () => {

        const status =
            normalizeStatus(
                rideData?.status
            );


        if(
            status ===
            "ACCEPTED"
            ||
            status ===
            "ASSIGNED"
        ){

            await updateRideStatus(
                "ARRIVED"
            );

            return;

        }


        if(
            status ===
            "ARRIVED"
            ||
            status ===
            "RIDER_ARRIVED"
            ||
            status ===
            "AT_PICKUP"
        ){

            await updateRideStatus(
                "STARTED"
            );

        }

    }
);


/* =========================================================
   COMPLETE
========================================================= */

completeBtn.addEventListener(
    "click",
    async () => {

        const confirmed =
            window.confirm(
                "Kya aap ride complete karna chahte hain?"
            );


        if(
            !confirmed
        ){

            return;

        }


        await updateRideStatus(
            "COMPLETED"
        );

    }
);


/* =========================================================
   CANCEL
========================================================= */

cancelBtn.addEventListener(
    "click",
    async () => {

        const confirmed =
            window.confirm(
                "Kya aap ride cancel karna chahte hain?"
            );


        if(
            !confirmed
        ){

            return;

        }


        try{

            const rideRef =
                doc(
                    db,
                    "rides",
                    rideId
                );


            await updateDoc(

                rideRef,

                {

                    status:
                        "CANCELLED",

                    cancelledBy:
                        "rider",

                    cancelledAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }

            );


            stopLocationTracking();

            toast(
                "Ride cancelled."
            );


            setTimeout(
                () => {

                    window.location.href =
                        "home.html";

                },
                800
            );


        }catch(error){

            console.error(
                error
            );

            toast(
                "Ride cancel nahi hui: "
                +
                error.message
            );

        }

    }
);


/* =========================================================
   CALL CUSTOMER
========================================================= */

document
    .getElementById(
        "callBtn"
    )
    .addEventListener(
        "click",
        () => {

            const phone =
                rideData?.customerPhone
                ||
                rideData?.customerMobile
                ||
                rideData?.phone
                ||
                "";


            if(
                phone
            ){

                window.location.href =

            }else{

                toast(
                    "Customer phone available nahi hai."
                );

            }

    );


/* =========================================================
   NAVIGATION
========================================================= */

navigateBtn.addEventListener(
    "click",
    () => {

        if(
            !rideData
        ){

            return;

        }


        const status =
            normalizeStatus(
                rideData.status
            );


        const destination =
            (
                status === "STARTED"
                ||
                status === "ONGOING"
                ||
                status === "IN_PROGRESS"
                ||
                status === "RIDE_STARTED"
            )
            ?
            getDropPoint(
                rideData
            )
            :
            getPickupPoint(
                rideData
            );


        if(
            !destination
        ){

            toast(
                "Navigation coordinates available nahi hain."
            );

            return;

        }


        const url =
            "https://www.google.com/maps/dir/?api=1"
            +
            "&destination="
            +
            encodeURIComponent(
                destination.lat
                +
                ","
                +
                destination.lng
            );


        window.open(
            url,
            "_blank"
        );

    }
);


/* =========================================================
   GPS LOCATION
========================================================= */

function startLocationTracking(){

    if(
        watchId !== null
    ){

        return;

    }


    if(
        !navigator.geolocation
    ){

        gpsText.innerText =
            "GPS UNSUPPORTED";

        return;

    }


    gpsText.innerText =
        "GPS STARTING";


    watchId =
        navigator.geolocation.watchPosition(

            position => {

                const lat =
                    Number(
                        position.coords.latitude
                    );

                const lng =
                    Number(
                        position.coords.longitude
                    );


                const accuracy =
                    Number(
                        position.coords.accuracy
                    );


                if(
                    !Number.isFinite(lat)
                    ||
                    !Number.isFinite(lng)
                ){

                    return;

                }


                currentPosition = {

                    lat,
                    lng,
                    accuracy

                };


                gps.classList.add(
                    "active"
                );


                gpsText.innerText =
                    "GPS LIVE";


                updateRiderMarker(
                    lat,
                    lng,
                    false
                );


                updateRouteLine();


                writeRiderLocation(
                    lat,
                    lng,
                    accuracy
                );

            },

            error => {

                console.warn(
                    "GPS:",
                    error
                );


                gps.classList.remove(
                    "active"
                );


                if(
                    error.code ===
                    1
                ){

                    gpsText.innerText =
                        "GPS PERMISSION";

                }else{

                    gpsText.innerText =
                        "GPS ERROR";

                }

            },

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    3000,

                timeout:
                    15000

            }

        );

}


function stopLocationTracking(){

    if(
        watchId !== null
    ){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId =
            null;

    }


    gps.classList.remove(
        "active"
    );

    gpsText.innerText =
        "GPS OFF";

}


/* =========================================================
   WRITE RIDER LOCATION
========================================================= */

async function writeRiderLocation(
    lat,
    lng,
    accuracy
){

    if(
        !currentUser
    ){

        return;

    }


    const now =
        Date.now();


    /*
     * Avoid writing to Firestore
     * on every GPS event.
     */

    if(
        now -
        lastLocationWrite
        <
        2500
    ){

        return;

    }


    lastLocationWrite =
        now;


    try{

        const locationRef =
            doc(
                db,
                "riderLocations",
                currentUser.uid
            );


        await setDoc(

            locationRef,

            {

                riderId:
                    currentUser.uid,

                rideId:
                    rideId,

                lat:
                    lat,

                lng:
                    lng,

                accuracy:
                    accuracy,

                online:
                    true,

                active:
                    true,

                updatedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );


        /*
         * Also keep live location inside
         * the ride document so the customer
         * can read it from the ride itself.
         */

        if(
            rideId
        ){

            const rideRef =
                doc(
                    db,
                    "rides",
                    rideId
                );


            await updateDoc(

                rideRef,

                {

                    riderLat:
                        lat,

                    riderLng:
                        lng,

                    riderLocation:{

                        lat:
                            lat,

                        lng:
                            lng

                    },

                    riderLocationUpdatedAt:
                        serverTimestamp()

                }

            );

        }


    }catch(error){

        console.warn(
            "Location write:",
            error
        );

    }

}


/* =========================================================
   BACK
========================================================= */

document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        () => {

            stopLocationTracking();

            window.location.href =
                "home.html";

        }
    );


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        if(
            !user
        ){

            stopLocationTracking();

            showError(
                "Please rider login karein."
            );

            return;

        }


        currentUser =
            user;


        initMap();


        if(
            !rideId
        ){

            showError(
                "Active ride nahi mili."
            );

            return;

        }


        localStorage.setItem(
            "activeRideId",
            rideId
        );


        localStorage.setItem(
            "rideId",
            rideId
        );


        listenRide();

    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        stopLocationTracking();


        if(
            unsubscribeRide
        ){

            unsubscribeRide();

        }

    }
);
