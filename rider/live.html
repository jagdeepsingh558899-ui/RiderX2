<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>RiderX - Live Ride</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        #map {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 14px 16px;

            background: rgba(0, 0, 0, 0.90);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(255, 214, 0, 0.35);
        }

        .brand {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: #FFD600;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 7px;

            font-size: 12px;
            font-weight: 800;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #777;
        }

        .live-dot.active {
            background: #20d66b;
            box-shadow: 0 0 10px rgba(32, 214, 107, 0.8);
        }

        .ride-card {
            position: fixed;

            left: 12px;
            right: 12px;
            bottom: 12px;

            z-index: 1000;

            background: rgba(15, 15, 15, 0.96);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 22px;

            padding: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.55);
        }

        .ride-status {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 14px;
        }

        .status-title {
            font-size: 17px;
            font-weight: 900;
        }

        .status-badge {
            background: rgba(255, 214, 0, 0.13);
            color: #FFD600;

            border: 1px solid rgba(255, 214, 0, 0.25);

            padding: 7px 11px;

            border-radius: 999px;

            font-size: 11px;
            font-weight: 900;
        }

        .route {
            display: grid;
            gap: 12px;

            margin-bottom: 16px;
        }

        .location-row {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .location-icon {
            width: 30px;
            height: 30px;

            flex: 0 0 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #222;

            font-size: 14px;
        }

        .location-text {
            min-width: 0;
        }

        .location-label {
            color: #888;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .location-value {
            font-size: 13px;
            line-height: 1.35;

            color: #eee;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            gap: 8px;

            margin-bottom: 14px;
        }

        .info-box {
            background: #1b1b1b;
            border-radius: 13px;

            padding: 10px;

            text-align: center;
        }

        .info-label {
            color: #777;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .info-value {
            margin-top: 4px;

            font-size: 14px;
            font-weight: 900;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        button {
            border: none;
            outline: none;

            min-height: 50px;

            border-radius: 14px;

            font-size: 14px;
            font-weight: 900;

            cursor: pointer;
        }

        #shareBtn {
            background: #FFD600;
            color: #000;
        }

        #stopBtn {
            background: #292929;
            color: #fff;

            border: 1px solid #444;
        }

        #startRideBtn {
            width: 100%;

            margin-top: 10px;

            background: #20d66b;
            color: #000;
        }

        #completeRideBtn {
            width: 100%;

            margin-top: 10px;

            background: #fff;
            color: #000;

            display: none;
        }

        .message {
            margin-top: 10px;

            text-align: center;

            font-size: 11px;
            line-height: 1.4;

            color: #888;
        }

        .leaflet-control-zoom {
            border: none !important;
        }

        .leaflet-control-zoom a {
            background: #111 !important;
            color: #fff !important;
            border-color: #333 !important;
        }

        .rider-marker {
            width: 46px;
            height: 46px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #FFD600;

            border: 4px solid #000;

            font-size: 23px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.5);
        }

    </style>

</head>


<body>

    <div id="map"></div>


    <div class="topbar">

        <div class="brand">
            Rider<span>X</span>
        </div>

        <div class="live-indicator">

            <div
                id="liveDot"
                class="live-dot"
            ></div>

            <span id="liveText">
                OFFLINE
            </span>

        </div>

    </div>


    <div class="ride-card">

        <div class="ride-status">

            <div class="status-title">
                Live Ride
            </div>

            <div
                id="statusBadge"
                class="status-badge"
            >
                CONNECTING
            </div>

        </div>


        <div class="route">

            <div class="location-row">

                <div class="location-icon">
                    📍
                </div>

                <div class="location-text">

                    <div class="location-label">
                        Pickup
                    </div>

                    <div
                        id="pickupText"
                        class="location-value"
                    >
                        Loading...
                    </div>

                </div>

            </div>


            <div class="location-row">

                <div class="location-icon">
                    🏁
                </div>

                <div class="location-text">

                    <div class="location-label">
                        Drop
                    </div>

                    <div
                        id="dropText"
                        class="location-value"
                    >
                        Loading...
                    </div>

                </div>

            </div>

        </div>


        <div class="info-row">

            <div class="info-box">

                <div class="info-label">
                    Fare
                </div>

                <div
                    id="fareText"
                    class="info-value"
                >
                    ₹0
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Distance
                </div>

                <div
                    id="distanceText"
                    class="info-value"
                >
                    0 KM
                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    Ride ID
                </div>

                <div
                    id="rideIdText"
                    class="info-value"
                >
                    ----
                </div>

            </div>

        </div>


        <div class="buttons">

            <button id="shareBtn">
                🟢 Start Sharing
            </button>

            <button id="stopBtn">
                ⛔ Stop
            </button>

        </div>


        <button id="startRideBtn">
            🚗 Start Ride
        </button>


        <button id="completeRideBtn">
            ✅ Complete Ride
        </button>


        <div
            id="message"
            class="message"
        >
            Waiting for GPS permission...
        </div>

    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script type="module">

        import {
            auth,
            db
        } from "../firebase/firebase-config.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


        import {
            doc,
            getDoc,
            updateDoc,
            serverTimestamp,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        // =====================================================
        // STATE
        // =====================================================

        let map = null;

        let riderMarker = null;

        let watchId = null;

        let rideId = null;

        let currentUser = null;

        let rideData = null;

        let sharing = false;


        // =====================================================
        // DOM
        // =====================================================

        const liveDot =
            document.getElementById("liveDot");

        const liveText =
            document.getElementById("liveText");

        const statusBadge =
            document.getElementById("statusBadge");

        const message =
            document.getElementById("message");

        const shareBtn =
            document.getElementById("shareBtn");

        const stopBtn =
            document.getElementById("stopBtn");

        const startRideBtn =
            document.getElementById("startRideBtn");

        const completeRideBtn =
            document.getElementById("completeRideBtn");


        // =====================================================
        // GET RIDE ID
        // =====================================================

        function getRideId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const fromUrl =
                params.get("rideId");

            const fromStorage =
                localStorage.getItem("rideId");

            const fromActiveRide =
                localStorage.getItem(
                    "activeRideId"
                );

            return (
                fromUrl ||
                fromStorage ||
                fromActiveRide ||
                null
            );

        }


        // =====================================================
        // INIT MAP
        // =====================================================

        function initMap() {

            map =
                L.map("map", {
                    zoomControl: true
                }).setView(
                    [30.7333, 76.7794],
                    13
                );


            L.tileLayer(
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,
                    attribution:
                        "&copy; OpenStreetMap"
                }
            ).addTo(map);

        }


        // =====================================================
        // RIDER ICON
        // =====================================================

        function createRiderIcon() {

            return L.divIcon({

                className: "",

                html:
                    '<div class="rider-marker">🏍️</div>',

                iconSize: [46, 46],

                iconAnchor: [23, 23]

            });

        }


        // =====================================================
        // LOAD RIDE
        // =====================================================

        async function loadRide() {

            if (!rideId) {

                statusBadge.innerText =
                    "NO RIDE";

                message.innerText =
                    "Ride ID nahi mila. Pehle ride accept karo.";

                shareBtn.disabled = true;

                startRideBtn.disabled = true;

                return;

            }


            document.getElementById(
                "rideIdText"
            ).innerText =
                rideId.slice(0, 8);


            try {

                const rideRef =
                    doc(
                        db,
                        "rides",
                        rideId
                    );


                const snap =
                    await getDoc(
                        rideRef
                    );


                if (!snap.exists()) {

                    statusBadge.innerText =
                        "NOT FOUND";

                    message.innerText =
                        "Ride document nahi mila.";

                    return;

                }


                rideData =
                    snap.data();


                updateRideUI(
                    rideData
                );


                listenToRide();


            } catch (error) {

                console.error(
                    "Ride Load Error:",
                    error
                );

                statusBadge.innerText =
                    "ERROR";

                message.innerText =
                    error.message;

            }

        }


        // =====================================================
        // LISTEN TO RIDE
        // =====================================================

        function listenToRide() {

            if (!rideId) return;


            const rideRef =
                doc(
                    db,
                    "rides",
                    rideId
                );


            onSnapshot(
                rideRef,
                (snap) => {

                    if (!snap.exists()) return;

                    rideData =
                        snap.data();

                    updateRideUI(
                        rideData
                    );

                },
                (error) => {

                    console.error(
                        "Ride Listener Error:",
                        error
                    );

                }
            );

        }


        // =====================================================
        // UPDATE RIDE UI
        // =====================================================

        function updateRideUI(
            data
        ) {

            const pickup =
                data.pickup;

            const drop =
                data.drop;


            document.getElementById(
                "pickupText"
            ).innerText =
                typeof pickup === "object"
                    ? (
                        pickup.address ||
                        pickup.name ||
                        `${pickup.lat}, ${pickup.lng}`
                    )
                    : (
                        pickup ||
                        "Pickup"
                    );


            document.getElementById(
                "dropText"
            ).innerText =
                typeof drop === "object"
                    ? (
                        drop.address ||
                        drop.name ||
                        `${drop.lat}, ${drop.lng}`
                    )
                    : (
                        drop ||
                        "Drop"
                    );


            document.getElementById(
                "fareText"
            ).innerText =
                "₹" +
                (
                    Number(
                        data.fare || 0
                    )
                );


            document.getElementById(
                "distanceText"
            ).innerText =
                (
                    Number(
                        data.distance || 0
                    )
                ).toFixed(1) +
                " KM";


            const status =
                String(
                    data.status ||
                    "REQUESTED"
                ).toUpperCase();


            statusBadge.innerText =
                status;


            if (
                status === "STARTED" ||
                status === "IN_PROGRESS"
            ) {

                completeRideBtn.style.display =
                    "block";

            }

        }


        // =====================================================
        // UPDATE LOCATION
        // =====================================================

        async function updateLiveLocation(
            position
        ) {

            if (
                !currentUser ||
                !rideId
            ) {

                return;

            }


            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy || 0;


            // -----------------------------------------------
            // MAP MARKER
            // -----------------------------------------------

            if (!riderMarker) {

                riderMarker =
                    L.marker(
                        [lat, lng],
                        {
                            icon:
                                createRiderIcon()
                        }
                    )
                    .addTo(map)
                    .bindPopup(
                        "You are here"
                    );

            } else {

                riderMarker.setLatLng(
                    [lat, lng]
                );

            }


            map.setView(
                [lat, lng],
                16
            );


            // -----------------------------------------------
            // FIRESTORE
            // -----------------------------------------------

            try {

                await updateDoc(
                    doc(
                        db,
                        "rides",
                        rideId
                    ),
                    {

                        riderId:
                            currentUser.uid,

                        riderLocation: {

                            lat: lat,

                            lng: lng,

                            accuracy:
                                accuracy,

                            updatedAt:
                                new Date()

                        },

                        riderLocationUpdatedAt:
                            serverTimestamp()

                    }
                );


                // Compatibility with
                // existing RiderX location system

                await updateDoc(
                    doc(
                        db,
                        "riderLocations",
                        currentUser.uid
                    ),
                    {

                        lat: lat,

                        lng: lng,

                        rideId: rideId,

                        online: true,

                        updatedAt:
                            serverTimestamp()

                    }
                ).catch(
                    () => {}
                );


                message.innerText =
                    "Live location customer ko send ho rahi hai.";

            } catch (error) {

                console.error(
                    "Location Update Error:",
                    error
                );

                message.innerText =
                    "Location update failed: " +
                    error.message;

            }

        }


        // =====================================================
        // START GPS
        // =====================================================

        function startSharing() {

            if (sharing) return;


            if (!navigator.geolocation) {

                alert(
                    "Is device me GPS available nahi hai."
                );

                return;

            }


            if (!currentUser) {

                alert(
                    "Please login first."
                );

                return;

            }


            if (!rideId) {

                alert(
                    "Ride ID missing."
                );

                return;

            }


            sharing = true;


            liveDot.classList.add(
                "active"
            );

            liveText.innerText =
                "LIVE";


            statusBadge.innerText =
                "LIVE";


            shareBtn.innerText =
                "🟢 Sharing Live";


            message.innerText =
                "GPS location start ho rahi hai...";


            watchId =
                navigator.geolocation.watchPosition(

                    updateLiveLocation,

                    (error) => {

                        console.error(
                            "GPS Error:",
                            error
                        );


                        message.innerText =
                            "GPS permission allow karo.";


                        sharing = false;


                        liveDot.classList.remove(
                            "active"
                        );

                        liveText.innerText =
                            "OFFLINE";

                    },

                    {

                        enableHighAccuracy:
                            true,

                        timeout:
                            15000,

                        maximumAge:
                            2000

                    }

                );

        }


        // =====================================================
        // STOP GPS
        // =====================================================

        function stopSharing() {

            if (
                watchId !== null
            ) {

                navigator.geolocation.clearWatch(
                    watchId
                );

                watchId = null;

            }


            sharing = false;


            liveDot.classList.remove(
                "active"
            );

            liveText.innerText =
                "OFFLINE";


            shareBtn.innerText =
                "🟢 Start Sharing";


            statusBadge.innerText =
                "PAUSED";


            message.innerText =
                "Live location paused.";

        }


        // =====================================================
        // START RIDE
        // =====================================================

        startRideBtn.onclick =
            async function () {

                if (!rideId) return;


                try {

                    await updateDoc(
                        doc(
                            db,
                            "rides",
                            rideId
                        ),
                        {

                            status:
                                "STARTED",

                            startedAt:
                                serverTimestamp(),

                            riderId:
                                currentUser.uid

                        }
                    );


                    statusBadge.innerText =
                        "STARTED";


                    completeRideBtn.style.display =
                        "block";


                    startRideBtn.style.display =
                        "none";


                    if (!sharing) {

                        startSharing();

                    }

                } catch (error) {

                    console.error(
                        error
                    );

                    alert(
                        "Ride start nahi hui: " +
                        error.message
                    );

                }

            };


        // =====================================================
        // COMPLETE RIDE
        // =====================================================

        completeRideBtn.onclick =
            async function () {

                if (!rideId) return;


                const ok =
                    confirm(
                        "Kya aap ride complete karna chahte ho?"
                    );


                if (!ok) return;


                try {

                    await updateDoc(
                        doc(
                            db,
                            "rides",
                            rideId
                        ),
                        {

                            status:
                                "COMPLETED",

                            completedAt:
                                serverTimestamp()

                        }
                    );


                    stopSharing();


                    statusBadge.innerText =
                        "COMPLETED";


                    completeRideBtn.style.display =
                        "none";


                    message.innerText =
                        "Ride successfully completed.";


                } catch (error) {

                    console.error(
                        error
                    );

                    alert(
                        "Ride complete nahi hui: " +
                        error.message
                    );

                }

            };


        // =====================================================
        // BUTTONS
        // =====================================================

        shareBtn.onclick =
            startSharing;


        stopBtn.onclick =
            stopSharing;


        // =====================================================
        // AUTH
        // =====================================================

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    statusBadge.innerText =
                        "LOGIN REQUIRED";

                    message.innerText =
                        "Rider login required.";

                    return;

                }


                currentUser =
                    user;


                rideId =
                    getRideId();


                await loadRide();

            }
        );


        // =====================================================
        // INIT
        // =====================================================

        initMap();

    </script>

</body>

</html>
