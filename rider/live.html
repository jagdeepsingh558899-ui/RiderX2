<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#050505">

<title>RiderX - Live Ride</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    padding-bottom:
        calc(
            20px +
            env(safe-area-inset-bottom)
        );
}

button{
    font-family:inherit;
    cursor:pointer;
}

.header{

    position:sticky;
    top:0;
    z-index:3000;

    padding:
        calc(
            12px +
            env(safe-area-inset-top)
        )
        14px
        12px;

    background:
        rgba(5,5,5,.95);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

}

.header-row{

    display:flex;
    align-items:center;
    gap:10px;

}

.back{

    width:42px;
    height:42px;

    border:0;
    border-radius:13px;

    background:#1b1b1b;
    color:#fff;

    font-size:25px;

}

.logo{
    flex:1;
}

.logo strong{

    display:block;

    font-size:20px;
    font-weight:900;

}

.logo strong span{
    color:#FFD600;
}

.logo small{

    display:block;

    margin-top:2px;

    color:#777;

    font-size:8px;

    font-weight:800;

    text-transform:uppercase;

}

.online-pill{

    display:flex;
    align-items:center;
    gap:6px;

    padding:8px 10px;

    border-radius:20px;

    background:
        rgba(54,220,117,.10);

    color:#36dc75;

    font-size:8px;
    font-weight:900;

}

.online-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#36dc75;

    box-shadow:
        0 0 10px
        rgba(54,220,117,.8);

}

.container{

    width:100%;
    max-width:720px;

    margin:auto;

    padding:12px;

}

.ride-card{

    margin-bottom:12px;

    padding:15px;

    border-radius:20px;

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.08);

}

.ride-card-top{

    display:flex;
    align-items:center;
    gap:10px;

}

.ride-icon{

    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:#1d1d1d;

    font-size:23px;

}

.ride-info{
    flex:1;
}

.ride-title{

    font-size:16px;
    font-weight:900;

}

.ride-subtitle{

    margin-top:4px;

    color:#777;

    font-size:9px;

}

.status{

    padding:7px 9px;

    border-radius:10px;

    background:
        rgba(255,214,0,.12);

    color:#FFD600;

    font-size:8px;
    font-weight:900;

}

#map{

    width:100%;
    height:52vh;
    min-height:360px;

    border-radius:22px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:#111;

}

.leaflet-control-zoom a{

    background:#111 !important;
    color:#fff !important;

    border-color:#333 !important;

}

.leaflet-control-attribution{

    background:
        rgba(0,0,0,.65) !important;

    color:#aaa !important;

}

.leaflet-control-attribution a{
    color:#FFD600 !important;
}

.location-panel{

    margin-top:12px;

    padding:15px;

    border-radius:20px;

    background:#111;

    border:
        1px solid
        rgba(255,255,255,.08);

}

.location-row{

    display:flex;
    align-items:flex-start;

    gap:12px;

}

.location-row + .location-row{
    margin-top:15px;
}

.location-marker{

    width:14px;
    height:14px;

    margin-top:3px;

    flex:none;

    border-radius:50%;

    background:#FFD600;

    box-shadow:
        0 0 0 5px
        rgba(255,214,0,.10);

}

.location-marker.drop{

    background:#fff;

    box-shadow:
        0 0 0 5px
        rgba(255,255,255,.08);

}

.location-content{
    flex:1;
}

.location-label{

    color:#777;

    font-size:8px;
    font-weight:900;

    text-transform:uppercase;

}

.location-text{

    margin-top:4px;

    color:#eee;

    font-size:11px;

    line-height:1.4;

}

.action-grid{

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:9px;

    margin-top:12px;

}

.action-btn{

    min-height:48px;

    border:0;
    border-radius:14px;

    background:#202020;

    color:#fff;

    font-size:10px;
    font-weight:900;

}

.action-btn.primary{

    background:#FFD600;
    color:#000;

}

.action-btn.green{

    background:#36dc75;
    color:#000;

}

.action-btn.red{

    background:
        rgba(150,30,30,.25);

    color:#ff8f8f;

    border:
        1px solid
        rgba(255,80,80,.25);

}

.action-btn:disabled{

    opacity:.45;
    cursor:not-allowed;

}

.location-status{

    margin-top:12px;

    padding:13px;

    border-radius:14px;

    background:#181818;

    color:#aaa;

    font-size:9px;

    line-height:1.5;

}

.location-status strong{
    color:#fff;
}

.loading{

    position:fixed;
    inset:0;

    z-index:5000;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:#050505;

}

.spinner{

    width:36px;
    height:36px;

    margin-bottom:13px;

    border:
        3px solid
        #222;

    border-top-color:#FFD600;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}

.loading-text{

    color:#777;

    font-size:10px;
    font-weight:800;

}

.error{

    display:none;

    margin:12px;

    padding:14px;

    border-radius:15px;

    background:
        rgba(120,30,30,.25);

    border:
        1px solid
        rgba(255,80,80,.25);

    color:#ff9d9d;

    font-size:10px;

    line-height:1.5;

}

.toast{

    position:fixed;

    left:14px;
    right:14px;

    bottom:
        calc(
            14px +
            env(safe-area-inset-bottom)
        );

    z-index:6000;

    display:none;

    padding:13px 15px;

    border-radius:14px;

    background:#222;

    border:
        1px solid
        #333;

    color:#fff;

    text-align:center;

    font-size:10px;
    font-weight:900;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

@media(max-width:420px){

    #map{
        height:48vh;
        min-height:320px;
    }

}

</style>

</head>

<body>


<!-- ======================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="header-row">

        <button
            id="backBtn"
            class="back"
            type="button"
        >
            ‹
        </button>

        <div class="logo">

            <strong>
                Rider<span>X</span>
            </strong>

            <small>
                Rider Live Ride
            </small>

        </div>

        <div
            id="onlinePill"
            class="online-pill"
        >

            <span class="online-dot"></span>

            ONLINE

        </div>

    </div>

</header>


<!-- ======================================================
     LOADING
====================================================== -->

<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    <div class="loading-text">
        RiderX Live Ride loading...
    </div>

</div>


<!-- ======================================================
     ERROR
====================================================== -->

<div
    id="error"
    class="error"
></div>


<!-- ======================================================
     MAIN
====================================================== -->

<main
    id="main"
    class="container"
    style="display:none;"
>


    <!-- RIDE INFO -->

    <section class="ride-card">

        <div class="ride-card-top">

            <div class="ride-icon">
                🏍️
            </div>

            <div class="ride-info">

                <div
                    id="rideTitle"
                    class="ride-title"
                >
                    RiderX Ride
                </div>

                <div
                    id="rideSubtitle"
                    class="ride-subtitle"
                >
                    Waiting for ride information
                </div>

            </div>

            <div
                id="rideStatus"
                class="status"
            >
                OFFLINE
            </div>

        </div>

    </section>


    <!-- MAP -->

    <div id="map"></div>


    <!-- LOCATIONS -->

    <section class="location-panel">

        <div class="location-row">

            <div class="location-marker"></div>

            <div class="location-content">

                <div class="location-label">
                    Pickup
                </div>

                <div
                    id="pickup"
                    class="location-text"
                >
                    —
                </div>

            </div>

        </div>


        <div class="location-row">

            <div class="location-marker drop"></div>

            <div class="location-content">

                <div class="location-label">
                    Drop
                </div>

                <div
                    id="drop"
                    class="location-text"
                >
                    —
                </div>

            </div>

        </div>

    </section>


    <!-- ACTIONS -->

    <div class="action-grid">

        <button
            id="startSharingBtn"
            class="action-btn primary"
            type="button"
        >
            📍 Start Location
        </button>

        <button
            id="centerBtn"
            class="action-btn"
            type="button"
        >
            🎯 My Location
        </button>

    </div>


    <div class="action-grid">

        <button
            id="arrivedBtn"
            class="action-btn"
            type="button"
        >
            📍 Arrived
        </button>

        <button
            id="startRideBtn"
            class="action-btn green"
            type="button"
        >
            🚕 Start Ride
        </button>

    </div>


    <div class="action-grid">

        <button
            id="completeBtn"
            class="action-btn green"
            type="button"
        >
            ✓ Complete Ride
        </button>

        <button
            id="cancelBtn"
            class="action-btn red"
            type="button"
        >
            ✕ Cancel Ride
        </button>

    </div>


    <!-- LOCATION STATUS -->

    <div
        id="locationStatus"
        class="location-status"
    >

        <strong>Location:</strong>
        Waiting for GPS permission...

    </div>

</main>


<div
    id="toast"
    class="toast"
></div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script type="module">

import {
    auth,
    db
} from "../firebase/firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    doc,
    getDoc,
    onSnapshot,
    setDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


// ============================================================
// STATE
// ============================================================

let currentUser = null;

let rideId = null;

let rideData = null;

let watchId = null;

let rideUnsubscribe = null;

let riderMarker = null;

let accuracyCircle = null;

let currentLat = null;

let currentLng = null;


// ============================================================
// GET RIDE ID
// ============================================================

const params =
    new URLSearchParams(
        window.location.search
    );

rideId =
    params.get("rideId")
    ||
    params.get("id")
    ||
    localStorage.getItem("activeRideId")
    ||
    localStorage.getItem("rideId");


// ============================================================
// DOM
// ============================================================

const loading =
    document.getElementById("loading");

const main =
    document.getElementById("main");

const errorBox =
    document.getElementById("error");

const rideStatus =
    document.getElementById("rideStatus");

const rideTitle =
    document.getElementById("rideTitle");

const rideSubtitle =
    document.getElementById("rideSubtitle");

const pickup =
    document.getElementById("pickup");

const drop =
    document.getElementById("drop");

const locationStatus =
    document.getElementById("locationStatus");

const startSharingBtn =
    document.getElementById("startSharingBtn");

const centerBtn =
    document.getElementById("centerBtn");

const arrivedBtn =
    document.getElementById("arrivedBtn");

const startRideBtn =
    document.getElementById("startRideBtn");

const completeBtn =
    document.getElementById("completeBtn");

const cancelBtn =
    document.getElementById("cancelBtn");


// ============================================================
// MAP
// ============================================================

const defaultCenter = [
    30.7333,
    76.7794
];

const map =
    L.map("map", {
        zoomControl:true,
        attributionControl:true
    }).setView(
        defaultCenter,
        13
    );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);


// ============================================================
// TOAST
// ============================================================

function toast(message){

    const el =
        document.getElementById("toast");

    el.innerText =
        message;

    el.style.display =
        "block";

    clearTimeout(
        window.__toastTimer
    );

    window.__toastTimer =
        setTimeout(
            () => {

                el.style.display =
                    "none";

            },
            2500
        );

}


// ============================================================
// ERROR
// ============================================================

function showError(message){

    loading.style.display =
        "none";

    main.style.display =
        "none";

    errorBox.innerText =
        message;

    errorBox.style.display =
        "block";

}


// ============================================================
// LOCATION TEXT
// ============================================================

function locationText(
    value,
    fallback
){

    if(
        typeof value ===
        "string"
    ){

        return value;

    }

    if(
        value &&
        typeof value ===
        "object"
    ){

        return (
            value.address
            ||
            value.name
            ||
            value.label
            ||
            (
                value.lat !== undefined
                &&
                value.lng !== undefined
                ?
                Number(value.lat).toFixed(5)
                +
                ", "
                +
                Number(value.lng).toFixed(5)
                :
                fallback
            )
        );

    }

    return fallback;

}


function getPickup(ride){

    return (
        locationText(
            ride.pickupAddress,
            ""
        )
        ||
        locationText(
            ride.pickupLocation,
            ""
        )
        ||
        locationText(
            ride.pickup,
            ""
        )
        ||
        ride.pickupText
        ||
        "Pickup location"
    );

}


function getDrop(ride){

    return (
        locationText(
            ride.dropAddress,
            ""
        )
        ||
        locationText(
            ride.dropLocation,
            ""
        )
        ||
        locationText(
            ride.drop,
            ""
        )
        ||
        ride.destination
        ||
        ride.dropText
        ||
        "Destination"
    );

}


// ============================================================
// STATUS
// ============================================================

function normalizeStatus(status){

    return String(
        status || ""
    )
    .trim()
    .toUpperCase();

}


// ============================================================
// RENDER RIDE
// ============================================================

function renderRide(ride){

    rideData =
        ride;

    pickup.innerText =
        getPickup(ride);

    drop.innerText =
        getDrop(ride);

    const status =
        normalizeStatus(
            ride.status
        );

    rideStatus.innerText =
        status ||
        "WAITING";

    rideTitle.innerText =
        ride.customerName
        ||
        ride.customer?.name
        ||
        "RiderX Customer";

    rideSubtitle.innerText =
        ride.serviceType
        ||
        ride.vehicleType
        ||
        "RiderX Ride";

    updateButtons(
        status
    );

}


// ============================================================
// BUTTON STATE
// ============================================================

function updateButtons(status){

    arrivedBtn.disabled =
        !(
            status === "ACCEPTED"
            ||
            status === "ASSIGNED"
        );

    startRideBtn.disabled =
        !(
            status === "ARRIVED"
            ||
            status === "RIDER_ARRIVED"
            ||
            status === "AT_PICKUP"
        );

    completeBtn.disabled =
        !(
            status === "STARTED"
            ||
            status === "ONGOING"
            ||
            status === "IN_PROGRESS"
            ||
            status === "RIDE_STARTED"
        );

    cancelBtn.disabled =
        (
            status === "COMPLETED"
            ||
            status === "FINISHED"
            ||
            status === "CANCELLED"
            ||
            status === "CANCELED"
        );

}


// ============================================================
// RIDE STATUS UPDATE
// ============================================================

async function updateRideStatus(
    newStatus
){

    if(
        !currentUser
    ){

        toast(
            "Please login first."
        );

        return;

    }

    if(
        !rideId
    ){

        toast(
            "Ride ID nahi mila."
        );

        return;

    }


    try{

        const rideRef =
            doc(
                db,
                "rides",
                rideId
            );


        const updateData = {

            status:
                newStatus,

            updatedAt:
                serverTimestamp(),

            riderId:
                currentUser.uid

        };


        if(
            newStatus ===
            "ARRIVED"
        ){

            updateData.riderArrivedAt =
                serverTimestamp();

        }


        if(
            newStatus ===
            "STARTED"
        ){

            updateData.startedAt =
                serverTimestamp();

        }


        if(
            newStatus ===
            "COMPLETED"
        ){

            updateData.completedAt =
                serverTimestamp();

        }


        if(
            newStatus ===
            "CANCELLED"
        ){

            updateData.cancelledBy =
                "rider";

            updateData.cancelledAt =
                serverTimestamp();

        }


        await updateDoc(
            rideRef,
            updateData
        );


        toast(
            "Ride status updated."
        );


    }catch(error){

        console.error(
            "Ride status update:",
            error
        );

        toast(
            "Status update failed: "
            +
            error.message
        );

    }

}


// ============================================================
// START LOCATION SHARING
// ============================================================

function startLocationSharing(){

    if(
        !currentUser
    ){

        toast(
            "Please login first."
        );

        return;

    }


    if(
        !navigator.geolocation
    ){

        toast(
            "GPS is not supported."
        );

        return;

    }


    if(
        watchId !== null
    ){

        toast(
            "Live location already running."
        );

        return;

    }


    startSharingBtn.disabled =
        true;

    startSharingBtn.innerText =
        "📡 Sharing Live Location";


    locationStatus.innerHTML =
        "<strong>Location:</strong> GPS starting...";


    watchId =
        navigator.geolocation.watchPosition(

            handlePosition,

            handleLocationError,

            {

                enableHighAccuracy:true,

                maximumAge:3000,

                timeout:15000

            }

        );

}


// ============================================================
// GPS POSITION
// ============================================================

async function handlePosition(
    position
){

    const coords =
        position.coords;

    currentLat =
        Number(
            coords.latitude
        );

    currentLng =
        Number(
            coords.longitude
        );


    if(
        !Number.isFinite(
            currentLat
        )
        ||
        !Number.isFinite(
            currentLng
        )
    ){

        return;

    }


    const accuracy =
        Number(
            coords.accuracy
        );


    updateMap(
        currentLat,
        currentLng,
        accuracy
    );


    locationStatus.innerHTML =
        "<strong>Location:</strong> Live &nbsp;•&nbsp; "
        +
        currentLat.toFixed(6)
        +
        ", "
        +
        currentLng.toFixed(6);


    await publishLocation(
        currentLat,
        currentLng,
        accuracy
    );

}


// ============================================================
// GPS ERROR
// ============================================================

function handleLocationError(
    error
){

    console.error(
        "GPS:",
        error
    );


    startSharingBtn.disabled =
        false;

    startSharingBtn.innerText =
        "📍 Start Location";


    let message =
        "Location access nahi mil rahi.";

    if(
        error.code ===
        1
    ){

        message =
            "Location permission allow karo.";

    }

    if(
        error.code ===
        2
    ){

        message =
            "Current location unavailable.";

    }

    if(
        error.code ===
        3
    ){

        message =
            "GPS timeout. Dobara try karo.";

    }


    locationStatus.innerHTML =
        "<strong>Location:</strong> "
        +
        message;

    toast(
        message
    );

}


// ============================================================
// UPDATE MAP
// ============================================================

function updateMap(
    lat,
    lng,
    accuracy
){

    const point =
        [
            lat,
            lng
        ];


    if(
        !riderMarker
    ){

        riderMarker =
            L.marker(
                point,
                {
                    title:
                        "RiderX Rider"
                }
            )
            .addTo(map)
            .bindPopup(
                "🏍️ You are here"
            );

    }else{

        riderMarker.setLatLng(
            point
        );

    }


    if(
        !accuracyCircle
    ){

        accuracyCircle =
            L.circle(
                point,
                {
                    radius:
                        Number.isFinite(
                            accuracy
                        )
                        ?
                        accuracy
                        :
                        20,

                    color:
                        "#FFD600",

                    fillColor:
                        "#FFD600",

                    fillOpacity:
                        .10,

                    weight:1
                }
            ).addTo(map);

    }else{

        accuracyCircle.setLatLng(
            point
        );

        if(
            Number.isFinite(
                accuracy
            )
        ){

            accuracyCircle.setRadius(
                accuracy
            );

        }

    }

}


// ============================================================
// PUBLISH RIDER LOCATION
// ============================================================

async function publishLocation(
    lat,
    lng,
    accuracy
){

    if(
        !currentUser
    ){

        return;

    }


    try{

        const riderLocationRef =
            doc(
                db,
                "riderLocations",
                currentUser.uid
            );


        await setDoc(

            riderLocationRef,

            {

                riderId:
                    currentUser.uid,

                lat:
                    lat,

                lng:
                    lng,

                accuracy:
                    Number.isFinite(
                        accuracy
                    )
                    ?
                    accuracy
                    :
                    null,

                online:
                    true,

                activeRideId:
                    rideId
                    ||
                    null,

                updatedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );


        /*
         * Also publish the rider position inside
         * the current ride document.
         *
         * customer/ride-status.html can therefore
         * follow the same ride directly.
         */

        if(
            rideId
        ){

            const rideRef =
                doc(
                    db,
                    "rides",
                    rideId
                );


            await updateDoc(

                rideRef,

                {

                    riderId:
                        currentUser.uid,

                    riderLat:
                        lat,

                    riderLng:
                        lng,

                    riderLocationUpdatedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }

            );

        }


    }catch(error){

        console.error(
            "Publish location:",
            error
        );

        locationStatus.innerHTML =
            "<strong>Location:</strong> GPS active, "
            +
            "but Firebase update failed.";

    }

}


// ============================================================
// LOAD RIDE
// ============================================================

async function loadRide(){

    if(
        !rideId
    ){

        showError(
            "Active ride nahi mili. Ride accept karne ke baad Live Ride open karo."
        );

        return;

    }


    localStorage.setItem(
        "activeRideId",
        rideId
    );

    localStorage.setItem(
        "rideId",
        rideId
    );


    const rideRef =
        doc(
            db,
            "rides",
            rideId
        );


    try{

        const snapshot =
            await getDoc(
                rideRef
            );


        if(
            !snapshot.exists()
        ){

            showError(
                "Ride record nahi mila."
            );

            return;

        }


        renderRide(
            snapshot.data()
        );


        listenRide(
            rideRef
        );


        loading.style.display =
            "none";

        main.style.display =
            "block";


        setTimeout(
            () => {

                map.invalidateSize();

            },
            250
        );


    }catch(error){

        console.error(
            "Load ride:",
            error
        );

        showError(
            "Ride load nahi ho rahi: "
            +
            error.message
        );

    }

}


// ============================================================
// REALTIME RIDE LISTENER
// ============================================================

function listenRide(
    rideRef
){

    if(
        rideUnsubscribe
    ){

        rideUnsubscribe();

    }


    rideUnsubscribe =
        onSnapshot(

            rideRef,

            snapshot => {

                if(
                    !snapshot.exists()
                ){

                    showError(
                        "Ride delete ho gayi."
                    );

                    return;

                }


                renderRide(
                    snapshot.data()
                );

            },

            error => {

                console.error(
                    "Ride listener:",
                    error
                );

                toast(
                    "Ride realtime connection error."
                );

            }

        );

}
