<div class="card">


<button id="installApp" class="btn">

📲 Install RiderX App

</button>


</div>









<div class="card">


<h3>
🌙 Appearance
</h3>



<div class="booking-row">

<span>

Dark Mode

</span>


<input 

type="checkbox"

id="darkMode"

checked

>


</div>



</div>









<div class="card">


<h3>
🔔 Notifications
</h3>



<div class="booking-row">

<span>

Ride Notifications

</span>


<input

type="checkbox"

id="notifications"

checked

>


</div>



</div>









<div class="card">


<h3>
🌐 Language
</h3>



<select id="language" class="input">


<option value="English">

English

</option>



<option value="Hindi">

हिंदी

</option>


</select>



</div>









<div class="card">


<button class="btn-outline">

📞 Help & Support

id="logout"

class="btn-outline">
