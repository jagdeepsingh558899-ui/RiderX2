<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.card{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


button{

width:100%;
padding:12px;
margin-top:10px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

🏍 RiderX Rider

</div>



<div class="container">


<div class="card">


<h3 id="name">
Rider
</h3>


<p id="status">
Offline
</p>


<button onclick="goOnline()">
🟢 Go Online
</button>


<button onclick="goOffline()">
🔴 Go Offline
</button>


</div>




<h3>
My Current Ride
</h3>


<div id="currentRide">

No Ride

</div>



<h3>
Available Rides
</h3>


<div id="rides">

Go Online

</div>



</div>







<script type="module">


import {auth,db} from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc,
collection,
query,
where,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let uid;

let currentRideId=null;



auth.onAuthStateChanged(async(user)=>{


if(!user){

location.href="../auth/login.html";

return;

}


uid=user.uid;


let u=await getDoc(

doc(db,"users",uid)

);


document.getElementById("name").innerHTML=

u.data().name || "Rider";


});








window.goOnline=async function(){



await updateDoc(

doc(db,"users",uid),

{

online:true

}

);


document.getElementById("status").innerHTML=

"🟢 Online";


loadRides();



}








window.goOffline=async function(){



await updateDoc(

doc(db,"users",uid),

{

online:false

}

);



document.getElementById("status").innerHTML=

"🔴 Offline";


}





async function loadRides(){


let q=query(

collection(db,"rides"),

where("status","==","Pending")

);



let snap=await getDocs(q);


let box=document.getElementById("rides");


box.innerHTML="";



snap.forEach((r)=>{


let data=r.data();



box.innerHTML +=`


<div class="card">


<h3>${data.service}</h3>


<p>
💰 ${data.fare}
</p>


<p>
📍 ${data.pickupLat},${data.pickupLng}
</p>


<button onclick="acceptRide('${r.id}')">

Accept

</button>


</div>


`;



});



}








window.acceptRide=async function(id){



await updateDoc(

doc(db,"rides",id),

{

status:"Accepted",

riderId:uid

}

);



currentRideId=id;


localStorage.setItem(

"rideId",

id

);



loadCurrentRide();



}







async function loadCurrentRide(){



if(!currentRideId)return;



let r=await getDoc(

doc(db,"rides",currentRideId)

);



let box=document.getElementById("currentRide");



let data=r.data();



box.innerHTML=`

<div class="card">


Status: ${data.status}


<button onclick="changeStatus('Arriving')">

🚗 Arriving

</button>


<button onclick="changeStatus('Started')">

▶️ Start Ride

</button>


<button onclick="changeStatus('Completed')">

✅ Complete Ride

</button>


</div>

`;



}








window.changeStatus=async function(status){



await updateDoc(

doc(db,"rides",currentRideId),

{

status:status

}

);



alert("Ride "+status+" ✅");


loadCurrentRide();



}





</script>


</body>

</html>
