<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

#map{

height:450px;
width:100%;
border-radius:15px;
margin-top:15px;

}

button{

width:100%;
padding:14px;
margin-top:10px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

.ride{

background:#1d1d1d;
padding:15px;
border-radius:12px;
margin-top:10px;

}

</style>

</head>


<body>


<div class="header">

🏍 RiderX Rider

</div>



<div class="container">



<div class="card">

<h2>
Rider Status
</h2>


<h3 id="status">

⚫ Offline

</h3>


<button onclick="goOnline()">

🟢 Go Online

</button>



<button onclick="goOffline()">

⚫ Go Offline

</button>


</div>





<div id="map"></div>




<h2>
Nearby Rides
</h2>



<div id="rideList">

No rides

</div>



<a href="earnings.html">

💰 Earnings

</a>


<a href="profile.html">

👤 Profile

</a>



</div>




<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>




<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
getDocs,
query,
where,
doc,
updateDoc,
setDoc

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let map;

let riderMarker;




function initMap(){


map=L.map("map").setView(

[26.9124,75.7873],

13

);



L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:"OpenStreetMap"

}

).addTo(map);


}





window.goOnline=function(){



document.getElementById("status").innerHTML=

"🟢 Online";



navigator.geolocation.watchPosition(

async(position)=>{


let lat=position.coords.latitude;

let lng=position.coords.longitude;



if(riderMarker){

map.removeLayer(riderMarker);

}



riderMarker=L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup("🏍 You")

.openPopup();



map.setView(

[lat,lng],

15

);





await setDoc(

doc(db,"locations","rider"),

{

latitude:lat,

longitude:lng,

status:"online"

}

);



loadRides();



}



);



}







window.goOffline=function(){


document.getElementById("status").innerHTML=

"⚫ Offline";


}








async function loadRides(){



let box=document.getElementById("rideList");



let q=query(

collection(db,"rides"),

where("status","==","Pending")

);



let snap=await getDocs(q);



box.innerHTML="";



snap.forEach((ride)=>{


let data=ride.data();



box.innerHTML +=`


<div class="ride">


📍 Pickup:

<br>

${data.pickup}


<br><br>


🏁 Drop:

<br>

${data.drop}


<br><br>


💰 Price:

${data.fare}


<br><br>


<button onclick="acceptRide('${ride.id}')">

Accept Ride

</button>



</div>


`;



});


}





window.acceptRide=async function(id){


await updateDoc(

doc(db,"rides",id),

{


status:"Accepted",

rider:"rider"

}

);



alert("Ride Accepted ✅");


loadRides();


}







initMap();



</script>



</body>

</html>
