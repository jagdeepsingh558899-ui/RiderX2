<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

#map{

height:400px;
width:100%;
border-radius:15px;
margin-top:15px;

}


button{

width:100%;
padding:14px;
margin-top:10px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

🏍 RiderX Rider

</div>




<div class="container">



<div class="card">


<h2>

Rider Control

</h2>



<p id="status">

⚫ Offline

</p>



<button onclick="goOnline()">

🟢 Go Online

</button>


<button onclick="goOffline()">

⚫ Go Offline

</button>


</div>




<div class="card">


<h3>

Nearby Rides

</h3>


<div id="rideList">

Waiting...

</div>


</div>




<div id="map"></div>




<a href="earnings.html">

💰 Earnings

</a>



<a href="profile.html">

👤 Profile

</a>


</div>





<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
getDocs,
query,
where,
doc,
setDoc

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let map;

let riderMarker;



function initMap(){


map=L.map("map").setView(

[26.9124,75.7873],

13

);



L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"

).addTo(map);


}





window.goOnline=async function(){


document.getElementById("status").innerHTML=

"🟢 Online";



navigator.geolocation.watchPosition(

async(pos)=>{


let lat=pos.coords.latitude;

let lng=pos.coords.longitude;




if(riderMarker){

map.removeLayer(riderMarker);

}




riderMarker=L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup("🏍 You")

.openPopup();



map.setView([lat,lng],15);




await setDoc(

doc(db,"riders","current"),

{

latitude:lat,

longitude:lng,

status:"online"

}

);




loadRides();



}

);



}







window.goOffline=function(){


document.getElementById("status").innerHTML=

"⚫ Offline";


}







async function loadRides(){


let box=document.getElementById("rideList");



let q=query(

collection(db,"rides"),

where("status","==","Pending")

);



let snap=await getDocs(q);



box.innerHTML="";



snap.forEach((ride)=>{


let data=ride.data();



box.innerHTML +=`


<div class="card">


📍 ${data.pickup}

<br>

🏁 ${data.drop}

<br>

💰 ${data.fare}


<button>

Accept Ride

</button>


</div>


`;


});


}





initMap();



</script>



</body>

</html>
