<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
background:#000;
color:white;
font-family:Arial;
}


.header{

background:#111;
padding:20px;
border-bottom:2px solid #FFD600;
display:flex;
justify-content:space-between;

}


.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#FFD600;

}


.container{

padding:20px;

}


.box{

background:#111;
padding:20px;
border-radius:20px;
margin-bottom:15px;

}


.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}


.card{

background:#111;
padding:20px;
border-radius:18px;
text-align:center;

}


.number{

font-size:30px;
color:#FFD600;
font-weight:bold;

}


button,a{

width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#FFD600;
color:#000;
font-weight:bold;
text-decoration:none;
display:block;
text-align:center;

}


</style>

</head>


<body>


<div class="header">

<div class="logo">
RIDER<span>X</span>
</div>

<div>
🏍️
</div>

</div>




<div class="container">



<div class="box">

<h2>
Welcome Rider
</h2>

<p id="status">
Loading...
</p>


<button onclick="goOnline()">
🟢 Go Online
</button>


</div>





<div class="grid">


<div class="card">

<h3>
Trips
</h3>

<div class="number" id="trips">
0
</div>

</div>




<div class="card">

<h3>
Earnings
</h3>

<div class="number">

₹<span id="earnings">
0
</span>

</div>

</div>





<div class="card">

<h3>
Pending
</h3>

<div class="number" id="pending">
0
</div>

</div>




<div class="card">

<h3>
Completed
</h3>

<div class="number" id="completed">
0
</div>

</div>



</div>






<div class="box">


<h2>
Quick Menu
</h2>


<a href="online.html">
🟢 Online Map
</a>


<a href="requests.html">
📩 Ride Requests
</a>


<a href="trip.html">
🏍 Current Trip
</a>


<a href="earnings.html">
💰 Earnings
</a>


<a href="wallet.html">
💳 Wallet
</a>


<a href="profile.html">
👤 Profile
</a>



</div>



</div>







<script type="module">


import {auth,db} from "../firebase/config.js";


import {

collection,
getDocs,
query,
where

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";






onAuthStateChanged(auth,(user)=>{


if(user){

loadDashboard(user.uid);

}

else{

location.href="../auth/login.html";

}


});







async function loadDashboard(uid){



let q=query(

collection(db,"rides"),

where("riderId","==",uid)

);



let snap=await getDocs(q);



let trips=0;

let completed=0;

let pending=0;

let earnings=0;




snap.forEach((ride)=>{


let data=ride.data();


trips++;



if(data.status==="Completed"){


completed++;

earnings += Number(data.fare || 0);


}



if(data.status==="Pending"){


pending++;


}



});





document.getElementById("trips").innerHTML=trips;


document.getElementById("completed").innerHTML=completed;


document.getElementById("pending").innerHTML=pending;


document.getElementById("earnings").innerHTML=earnings;


document.getElementById("status").innerHTML=

"Online Ready 🟢";



}







window.goOnline=()=>{

location.href="online.html";

};



</script>


</body>

</html>
