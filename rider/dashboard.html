<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#000;
color:white;

}



.header{

background:#111;

padding:20px;

border-bottom:2px solid #FFD600;

display:flex;

justify-content:space-between;

}



.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#FFD600;

}



.container{

padding:20px;

}



.status{

background:#111;

padding:20px;

border-radius:20px;

margin-bottom:20px;

}



.status button{

margin-top:15px;

padding:12px;

width:100%;

border:none;

border-radius:12px;

background:#FFD600;

font-weight:bold;

}



.card{

background:#111;

padding:20px;

border-radius:20px;

margin-top:15px;

}



.card button{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:12px;

background:#FFD600;

font-weight:bold;

}



</style>

</head>


<body>



<div class="header">

<div class="logo">

RIDER<span>X</span>

</div>


<div>

🏍️

</div>


</div>





<div class="container">



<div class="status">


<h2>

Rider Dashboard

</h2>


<p>

Online / Offline

</p>


<button>

Go Online

</button>


</div>




<div class="card">


<h3>

New Ride Requests

</h3>


<p>

No new rides

</p>



<button onclick="openRequests()">

View Requests

</button>


</div>




</div>




<script>


function openRequests(){

window.location.href="rides.html";

}


</script>




</body>

</html>
