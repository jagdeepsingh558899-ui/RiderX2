<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Dashboard</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.card{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


button{

width:100%;
padding:12px;
margin-top:10px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

🏍 RiderX Rider

</div>


<div class="container">



<div class="card">


<h3 id="name">

Rider

</h3>


<p id="status">

Status: Offline

</p>



<button onclick="goOnline()">

🟢 Online

</button>


<button onclick="goOffline()">

🔴 Offline

</button>


</div>





<h3>
Available Rides
</h3>



<div id="rideList">

Go Online to see rides

</div>



</div>







<script type="module">


import {auth,db} from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc,
collection,
getDocs,
query,
where

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let uid;



auth.onAuthStateChanged(async(user)=>{


if(!user){

location.href="../auth/login.html";

return;

}


uid=user.uid;



let userDoc=await getDoc(

doc(db,"users",uid)

);


document.getElementById("name").innerHTML=

userDoc.data().name || "Rider";


});







window.goOnline=async function(){


await updateDoc(

doc(db,"users",uid),

{

online:true

}

);


document.getElementById("status").innerHTML=

"Status: 🟢 Online";


loadRides();


}






window.goOffline=async function(){


await updateDoc(

doc(db,"users",uid),

{

online:false

}

);



document.getElementById("status").innerHTML=

"Status: 🔴 Offline";



document.getElementById("rideList").innerHTML=

"Go Online to see rides";


}








async function loadRides(){



let box=

document.getElementById("rideList");



let q=query(

collection(db,"rides"),

where("status","==","Pending")

);



let snap=await getDocs(q);



box.innerHTML="";



if(snap.empty){


box.innerHTML="No rides available";


return;


}



snap.forEach((ride)=>{



let data=ride.data();



box.innerHTML += `


<div class="card">


<h3>

${data.service}

</h3>



<p>

📍 Pickup:
<br>
${data.pickupLat},
${data.pickupLng}

</p>



<p>

🏁 Drop:
<br>
${data.dropLat},
${data.dropLng}

</p>



<p>

💰 ${data.fare}

</p>



<button onclick="acceptRide('${ride.id}')">

Accept Ride

</button>



</div>



`;



});



}








window.acceptRide=async function(id){


await updateDoc(

doc(db,"rides",id),

{

status:"Accepted",

riderId:uid

}

);



localStorage.setItem(

"rideId",

id

);



alert("Ride Accepted ✅");



window.location.href="map.html";



}
