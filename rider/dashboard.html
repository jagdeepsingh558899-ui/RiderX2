<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.box{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


button{

width:100%;
padding:14px;
margin-top:10px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

🏍 Rider Dashboard

</div>



<div class="container">


<div class="box">


<h3 id="name">

Rider

</h3>


<p id="approval">

Checking approval...

</p>



<p id="status">

Status: Offline

</p>



<button onclick="goOnline()">

🟢 Go Online

</button>



<button onclick="goOffline()">

🔴 Go Offline

</button>



</div>



</div>





<script type="module">


import {auth,db} from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






let uid;


let locationWatch;






auth.onAuthStateChanged(async(user)=>{


if(!user){

window.location.href="../auth/login.html";

return;

}


uid=user.uid;



let snap=await getDoc(

doc(db,"users",uid)

);



let data=snap.data();



document.getElementById("name").innerHTML=

data.name || "Rider";




if(data.approved!=true){


document.getElementById("approval").innerHTML=

"⏳ Waiting For Admin Approval";


return;


}



document.getElementById("approval").innerHTML=

"✅ Approved";


});









window.goOnline=async function(){



let user=await getDoc(

doc(db,"users",uid)

);



if(user.data().approved!=true){


alert("Admin approval required");

return;


}




await updateDoc(

doc(db,"users",uid),

{


online:true,

lastOnline:serverTimestamp()


}

);





navigator.geolocation.watchPosition(

async(pos)=>{



await updateDoc(

doc(db,"users",uid),

{


lat:pos.coords.latitude,

lng:pos.coords.longitude


}

);



}

);





document.getElementById("status").innerHTML=

"Status: 🟢 Online";



}









window.goOffline=async function(){



await updateDoc(

doc(db,"users",uid),

{


online:false


}

);



document.getElementById("status").innerHTML=

"Status: 🔴 Offline";



}



</script>


</body>

</html>
