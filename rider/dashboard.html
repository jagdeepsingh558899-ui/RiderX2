<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
}

.header{
background:#ffcc00;
color:#000;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#1d1d1d;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#ffcc00;
font-weight:bold;
}

a{
display:block;
background:#ffcc00;
color:#000;
padding:14px;
margin-top:15px;
text-align:center;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

</style>

</head>


<body>


<div class="header">

🏍 RiderX Rider

</div>


<div class="container">


<div class="card">

<h2>
Welcome Rider
</h2>

<p id="status">
⚫ Offline
</p>


<button onclick="goOnline()">
Go Online
</button>


<button onclick="goOffline()">
Go Offline
</button>


</div>



<div class="card">

<h3>
📩 Ride Requests
</h3>


<a href="requests.html">
View Requests
</a>


</div>




<div class="card">

<h3>
💰 Earnings
</h3>


<a href="earnings.html">
My Earnings
</a>


</div>




<div class="card">

<a href="profile.html">
👤 Profile
</a>

</div>



</div>



<script type="module">

import {

goOnline,
goOffline

} from "../js/rider.js";


window.goOnline=goOnline;

window.goOffline=goOffline;


</script>


</body>

</html>
