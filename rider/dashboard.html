<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Dashboard</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

#map{
height:450px;
width:100%;
border-radius:15px;
margin-top:15px;
}

.ride{
background:#1d1d1d;
padding:15px;
margin-top:10px;
border-radius:12px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
background:#ffcc00;
border:0;
border-radius:10px;
font-weight:bold;
}

</style>

</head>


<body>


<div class="header">

🏍 RiderX Rider

</div>


<div class="container">


<h2 id="status">
⚫ Offline
</h2>


<button onclick="goOnline()">
🟢 Go Online
</button>


<button onclick="goOffline()">
⚫ Go Offline
</button>



<div id="map"></div>


<h2>
Nearby Rides
</h2>


<div id="rideList">

Waiting...

</div>


</div>




<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script type="module">


  import {db, auth} from "../firebase/config.js";


import {

collection,
getDocs,
query,
where,
doc,
updateDoc,
setDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let map;

let riderMarker;

let rideMarkers=[];





function initMap(){


map=L.map("map").setView(

[26.9124,75.7873],

13

);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:"OpenStreetMap"

}

).addTo(map);


}





function clearMarkers(){


rideMarkers.forEach(m=>{

map.removeLayer(m);

});


rideMarkers=[];


}





window.goOnline=function(){


document.getElementById("status").innerHTML="🟢 Online";


navigator.geolocation.watchPosition(async(pos)=>{


let lat=pos.coords.latitude;

let lng=pos.coords.longitude;



if(riderMarker){

map.removeLayer(riderMarker);

}



riderMarker=L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup("🏍 You");



map.setView([lat,lng],15);



await setDoc(

doc(db,"locations",auth.currentUser.uid)

{

latitude:lat,

longitude:lng,

status:"online"

}

);



loadRides();



});



}





window.goOffline=function(){


document.getElementById("status").innerHTML="⚫ Offline";


}








async function loadRides(){


clearMarkers();


let box=document.getElementById("rideList");


box.innerHTML="";



let q=query(

collection(db,"rides"),

where("status","==","Pending")

);



let snap=await getDocs(q);



snap.forEach((ride)=>{


let data=ride.data();



if(data.pickupLat && data.pickupLng){



let marker=L.marker(

[

data.pickupLat,

data.pickupLng

]

)

.addTo(map);



marker.bindPopup(`

📍 Pickup

<br>

💰 ${data.fare}

<br>

🏁 ${data.drop}

<br>

<button onclick="acceptRide('${ride.id}')">

Accept

</button>

`);



rideMarkers.push(marker);


}




box.innerHTML +=`

<div class="ride">

📍 ${data.pickup}

<br>

🏁 ${data.drop}

<br>

💰 ${data.fare}


<button onclick="acceptRide('${ride.id}')">

Accept Ride

</button>


</div>

`;



});



}
window.acceptRide=async function(id){


await updateDoc(

doc(db,"rides",id),

{

status:"Accepted",

riderId:"rider"

}

);



localStorage.setItem(
"rideId",
id
);



window.location.href =
"ride-details.html";


}
