<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Live Route</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{

margin:0;
background:#000;
color:white;
font-family:Arial;

}


.header{

padding:20px;
background:#111;
text-align:center;
font-size:22px;
border-bottom:2px solid #FFD600;

}


#map{

height:75vh;
width:100%;

}


.info{

padding:15px;
background:#111;

}


</style>

</head>


<body>



<div class="header">

🏍 Rider Navigation

</div>



<div class="info" id="info">

Loading Ride...

</div>



<div id="map"></div>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module">


import {db,auth} from "../firebase/config.js";


import {

doc,
getDoc,
onSnapshot

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId=

localStorage.getItem("rideId");



let map=L.map("map");



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);




let riderMarker=null;

let pickupMarker=null;

let dropMarker=null;

let route=null;





async function loadRide(){



let snap=

await getDoc(

doc(db,"rides",rideId)

);



if(!snap.exists()) return;




let data=snap.data();





let pickup=data.pickupCoords;

let drop=data.dropCoords;





document.getElementById("info").innerHTML=

`

🏍 ${data.service}

<br>

💰 Fare ₹${data.fare}

<br>

📍 Pickup → ${data.pickup}

<br>

🏁 Drop → ${data.drop}

`;





pickupMarker=L.marker(

[pickup.lat,pickup.lng]

)

.addTo(map)

.bindPopup("📍 Customer Pickup");





dropMarker=L.marker(

[drop.lat,drop.lng]

)

.addTo(map)

.bindPopup("🏁 Drop Location");





route=L.polyline(

[

[pickup.lat,pickup.lng],

[drop.lat,drop.lng]

]

)

.addTo(map);





map.fitBounds(

route.getBounds()

);





startRiderTracking();



}







function startRiderTracking(){



let riderId=

auth.currentUser.uid;



onSnapshot(

doc(db,"riderLocations",riderId),

(snap)=>{


if(!snap.exists()) return;




let data=snap.data();




if(riderMarker){


riderMarker.setLatLng(

[data.lat,data.lng]

);


}

else{


riderMarker=L.marker(

[data.lat,data.lng]

)

.addTo(map)

.bindPopup(

"🏍 You"

)

.openPopup();


}




}

);



}




loadRide();



</script>



</body>

</html>
