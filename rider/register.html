}

html,
body{

}

body{

    text-decoration:none;

.register-btn{
    width:100%;

    border:0;
    border-radius:13px;
    background:var(--yellow);
    color:#000;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

}

@media(max-width:430px){

@media(min-width:700px){

    .register-page{
        padding-top:40px;
    }

    .register-card{

</style></head><body><div class="register-page"><div class="register-container"><div class="logo-area">

</div>

<div class="register-card">

    </div>

    <div class="progress">

</div></div><script type="module">

import {
    auth,
    db,
    storage,
    createUserWithEmailAndPassword,
    updateProfile,
    setDoc,
    doc,
    signOut,
    storageRef,
    uploadBytes,
    getDownloadURL
} from "../firebase/firebase-config.js";


const $ = id =>
    document.getElementById(id);


/* =========================================================
   UI
========================================================= */

window.togglePassword = function(id,button){

    const input = $(id);

    if(!input){
        return;
    }

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁";

    }

};


function showMessage(message,type="error"){

    const box = $("formMessage");

    box.textContent = message;

    box.className =
        "form-message " + type;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function clearMessage(){

    const box = $("formMessage");

    box.textContent = "";

    box.className =
        "form-message";

}


function setLoading(loading){

    $("registerBtn").disabled =
        loading;

    $("registerText").style.display =
        loading ? "none" : "inline";

    $("registerLoader").style.display =
        loading ? "block" : "none";

}


/* =========================================================
   VALIDATION
========================================================= */

function validateFile(file){

    if(!file){
        return "Please upload both required documents.";
    }

    const maxSize =
        5 * 1024 * 1024;

    if(file.size > maxSize){

        return (
            file.name +
            " is larger than 5 MB."
        );

    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "application/pdf"
    ];

    const validType =
        allowedTypes.includes(
            file.type
        );

    const validExtension =
        /\.(jpg|jpeg|png|webp|pdf)$/i
            .test(file.name);

    if(!validType && !validExtension){

        return (
            "Invalid document format: " +
            file.name
        );

    }

    return null;

}


function validateForm(){

    const name =
        $("fullName").value.trim();

    const phone =
        $("phone").value.trim();

    const email =
        $("email").value.trim();

    const password =
        $("password").value;

    const confirmPassword =
        $("confirmPassword").value;

    const vehicleType =
        $("vehicleType").value;

    const vehicleModel =
        $("vehicleModel").value.trim();

    const vehicleNumber =
        $("vehicleNumber").value.trim();

    const license =
        $("license").files[0];

    const vehicleDocument =
        $("vehicleDocument").files[0];

    if(name.length < 2){

        showMessage(
            "Please enter your full name."
        );

        $("fullName").focus();

        return false;

    }

    if(!/^[0-9]{10}$/.test(phone)){

        showMessage(
            "Please enter a valid 10 digit mobile number."
        );

        $("phone").focus();

        return false;

    }

    if(
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
    ){

        showMessage(
            "Please enter a valid email address."
        );

        $("email").focus();

        return false;

    }

    if(password.length < 6){

        showMessage(
            "Password must contain at least 6 characters."
        );

        $("password").focus();

        return false;

    }

    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match."
        );

        $("confirmPassword").focus();

        return false;

    }

    if(!vehicleType){

        showMessage(
            "Please select your vehicle type."
        );

        $("vehicleType").focus();

        return false;

    }

    if(vehicleModel.length < 2){

        showMessage(
            "Please enter your vehicle model."
        );

        $("vehicleModel").focus();

        return false;

    }

    if(vehicleNumber.length < 4){

        showMessage(
            "Please enter your vehicle registration number."
        );

        $("vehicleNumber").focus();

        return false;

    }

    const licenseError =
        validateFile(license);

    if(licenseError){

        showMessage(
            licenseError
        );

        return false;

    }

    const vehicleError =
        validateFile(vehicleDocument);

    if(vehicleError){

        showMessage(
            vehicleError
        );

        return false;

    }

    if(!$("terms").checked){

        showMessage(
            "Please accept the Terms & Conditions and Privacy Policy."
        );

        return false;

    }

    return true;

}


/* =========================================================
   DOCUMENT UPLOAD
========================================================= */

async function uploadDocument(
    uid,
    file,
    type
){

    const safeName =
        file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );

    const path =
        "rider-documents/" +
        uid +
        "/" +
        type +
        "_" +
        Date.now() +
        "_" +
        safeName;

    const fileRef =
        storageRef(
            storage,
            path
        );

    await uploadBytes(
        fileRef,
        file,
        {
            contentType:
                file.type ||
                "application/octet-stream"
        }
    );

    const url =
        await getDownloadURL(
            fileRef
        );

    return {
        path,
        url,
        name:
            file.name,
        type:
            file.type,
        size:
            file.size
    };

}


/* =========================================================
   REGISTER RIDER
========================================================= */

window.registerRider =
async function(){

    clearMessage();

    if(!validateForm()){
        return;
    }

    setLoading(true);

    let createdUser = null;

    try{

        const name =
            $("fullName").value.trim();

        const phone =
            $("phone").value.trim();

        const email =
            $("email").value
                .trim()
                .toLowerCase();

        const password =
            $("password").value;

        const vehicleType =
            $("vehicleType").value;

        const vehicleModel =
            $("vehicleModel").value.trim();

        const vehicleNumber =
            $("vehicleNumber").value
                .trim()
                .toUpperCase();

        const licenseFile =
            $("license").files[0];

        const vehicleDocumentFile =
            $("vehicleDocument").files[0];


        /*
         * 1. CREATE FIREBASE AUTH ACCOUNT
         */

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        createdUser =
            result.user;


        /*
         * 2. UPDATE AUTH DISPLAY NAME
         */

        await updateProfile(
            createdUser,
            {
                displayName:
                    name
            }
        );


        /*
         * 3. UPLOAD DOCUMENTS
         */

        const license =
            await uploadDocument(
                createdUser.uid,
                licenseFile,
                "driving_license"
            );

        const vehicleDocument =
            await uploadDocument(
                createdUser.uid,
                vehicleDocumentFile,
                "vehicle_document"
            );


        /*
         * 4. CREATE RIDER PROFILE
         *
         * PENDING IS THE IMPORTANT PART.
         *
         * Admin must approve this account.
         */

        const now =
            Date.now();

        const riderProfile = {

            uid:
                createdUser.uid,

            id:
                createdUser.uid,

            role:
                "rider",

            userRole:
                "rider",

            accountType:
                "rider",

            status:
                "pending",

            applicationStatus:
                "pending",

            online:
                false,

            busy:
                false,

            blocked:
                false,

            name:
                name,

            fullName:
                name,

            displayName:
                name,

            email:
                email,

            phone:
                phone,

            phoneNumber:
                "+91" + phone,

            vehicleType:
                vehicleType,

            vehicleModel:
                vehicleModel,

            vehicleNumber:
                vehicleNumber,

            documents:{

                drivingLicense:
                    license,

                vehicleDocument:
                    vehicleDocument

            },

            city:
                "Chandigarh",

            rating:
                5,

            totalRides:
                0,

            completedRides:
                0,

            cancelledRides:
                0,

            walletBalance:
                0,

            createdAt:
                now,

            applicationSubmittedAt:
                now,

            updatedAt:
                now

        };


        /*
         * 5. SAVE TO FIRESTORE
         */

        await setDoc(
            doc(
                db,
                "users",
                createdUser.uid
            ),
            riderProfile,
            {
                merge:
                    true
            }
        );


        /*
         * 6. SIGN OUT
         *
         * Rider is pending and should not enter
         * the rider dashboard before approval.
         */

        try{

            await signOut(
                auth
            );

        }catch(signOutError){

            console.warn(
                "RiderX sign-out after registration failed:",
                signOutError
            );

        }


        /*
         * 7. APPROVAL PENDING SCREEN
         */

        showMessage(
            "Your RiderX rider application has been submitted successfully. Our team is reviewing your documents and profile.",
            "success"
        );

        setTimeout(
            function(){

                window.location.href =
                    "../auth/login.html?pending=1";

            },
            1800
        );


    }catch(error){

        console.error(
            "Rider registration error:",
            error
        );


        /*
         * If Auth was created but Firestore/storage
         * failed, sign out. We intentionally do not
         * expose the password anywhere.
         */

        if(createdUser){

            try{

                await signOut(
                    auth
                );

            }catch(cleanupError){

                console.warn(
                    "Registration cleanup failed:",
                    cleanupError
                );

            }

        }


        let message =
            "Registration failed. Please try again.";


        const code =
            String(
                error?.code || ""
            ).toLowerCase();


        if(
            code.includes(
                "email-already-in-use"
            )
        ){

            message =
                "This email is already registered.";

        }
        else if(
            code.includes(
                "weak-password"
            )
        ){

            message =
                "Password is too weak.";

        }
        else if(
            code.includes(
                "invalid-email"
            )
        ){

            message =
                "Please enter a valid email address.";

        }
        else if(
            code.includes(
                "permission-denied"
            )
        ){

            message =
                "Firebase permission denied. Please check Firestore/Storage rules.";

        }
        else if(
            code.includes(
                "storage"
            )
        ){

            message =
                "Document upload failed. Please check Firebase Storage rules.";

        }
        else if(
            code.includes(
                "network"
            )
        ){

            message =
                "Network error. Please check your internet connection.";

        }
        else if(error?.message){

            message =
                error.message;

        }


        showMessage(
            message,
            "error"
        );

    }finally{

        setLoading(false);

    }

};


/* =========================================================
   TERMS / PRIVACY
========================================================= */

window.showTerms =
function(event){

    event.preventDefault();

    alert(
        "RiderX Terms & Conditions\n\n" +
        "By registering as a RiderX rider, you agree to follow RiderX ride, safety, payment and service policies."
    );

};


window.showPrivacy =
function(event){

    event.preventDefault();

    alert(
        "RiderX Privacy Policy\n\n" +
        "RiderX may use your account, vehicle and ride information to provide rider services and maintain platform security."
    );

};


/* =========================================================
   INPUT FORMATTING
========================================================= */

$("phone").addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,10);

    }
);


$("vehicleNumber").addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .toUpperCase()
                .replace(
                    /[^A-Z0-9 -]/g,
                    ""
                )
                .slice(0,15);

    }
);


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            const active =
                document.activeElement;

            if(
                active &&
                (
                    active.tagName ===
                    "INPUT" ||
                    active.tagName ===
                    "SELECT"
                )
            ){

                event.preventDefault();

                window.registerRider();

            }

        }

    }
);
