<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX Rider Registration</title>


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;

}


body{

background:#000;
color:white;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}



.box{

width:90%;
max-width:400px;

background:#111;

padding:25px;

border-radius:20px;

border:2px solid #FFD600;

text-align:center;

}



.logo{

width:100px;

}



h1{

margin:15px 0;

}



h1 span{

color:#FFD600;

}



input{

width:100%;

padding:14px;

margin-top:12px;

border:none;

border-radius:12px;

font-size:16px;

}



button{

width:100%;

padding:15px;

margin-top:20px;

background:#FFD600;

border:none;

border-radius:12px;

font-weight:bold;

font-size:16px;

}



#message{

margin-top:15px;

}



</style>


</head>



<body>



<div class="box">


<img src="../assets/logo.png" class="logo">


<h1>
RIDER<span>X</span>
</h1>



<h2>
Rider Registration
</h2>



<input id="name"
placeholder="Full Name">



<input id="bike"
placeholder="Bike Model">



<input id="number"
placeholder="Vehicle Number">



<input id="license"
placeholder="Driving Licence Number">



<button id="registerBtn">

Submit Details

</button>



<p id="message"></p>



</div>




<script type="module" src="../js/rider-register.js"></script>



</body>

</html>
