<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Menu</title>

<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;
color:white;
font-family:Arial;

}


.header{

background:#111;
padding:20px;
text-align:center;
font-size:26px;
font-weight:bold;
border-bottom:2px solid #FFD600;

}


.container{

padding:20px;

}



.menu-card{

background:#111;
padding:18px;
margin-top:15px;
border-radius:15px;
border-left:4px solid #FFD600;
font-size:18px;
cursor:pointer;

}



.menu-card:hover{

background:#222;

}



.logout{

background:#ff3333;

}



.logo{

color:#FFD600;

}

</style>


</head>


<body>



<div class="header">

<span class="logo">RIDER</span>X Menu

</div>




<div class="container">



<div class="menu-card" onclick="go('dashboard.html')">

🏍 Dashboard

</div>



<div class="menu-card" onclick="go('requests.html')">

📩 Ride Requests

</div>



<div class="menu-card" onclick="go('trip.html')">

🚕 Current Trip

</div>



<div class="menu-card" onclick="go('earnings.html')">

💰 Earnings

</div>



<div class="menu-card" onclick="go('wallet.html')">

💳 Wallet

</div>



<div class="menu-card" onclick="go('profile.html')">

👤 Profile

</div>



<div class="menu-card" onclick="go('notifications.html')">

🔔 Notifications

</div>



<div class="menu-card logout" onclick="logout()">

🚪 Logout

</div>



</div>







<script type="module">


import {auth} from "../firebase/config.js";


import {

signOut

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";





window.go=function(page){

location.href=page;

};





window.logout=async function(){


await signOut(auth);


location.href="../auth/login.html";


};



</script>


</body>

</html>
