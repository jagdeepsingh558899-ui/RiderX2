<!DOCTYPE html>
<html lang="en">

>

    name="description"
    content="RiderX rider notifications"
>

<title>RiderX | Notifications</title>

>

<link

<style>

:root{
    --yellow:#ffe500;
    --black:#000;
    --dark:#0a0a0a;
    --card:#151515;
    --card2:#202020;
    --white:#fff;
    --muted:#8b8b8b;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#60a5fa;
    --orange:#ffb020;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Poppins,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
}

body{
    min-height:100vh;
    padding-bottom:
        max(25px,env(safe-area-inset-bottom));
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:100;

    min-height:68px;

    padding:
        max(10px,env(safe-area-inset-top))
        14px
        10px;

    display:flex;
    align-items:center;
    gap:12px;

    background:rgba(0,0,0,.97);

    border-bottom:1px solid #292929;

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.back-btn,
.header-icon{
    width:42px;
    height:42px;
    min-width:42px;

    border:0;
    border-radius:50%;

    background:#171717;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}

.back-btn:active,
.header-icon:active{
    transform:scale(.91);
}

.header-title{
    flex:1;
    min-width:0;
}

.header-title h1{
    font-size:19px;
    font-weight:800;
    line-height:1.1;
}

.header-title p{
    margin-top:4px;
    color:#777;
    font-size:10px;
}

.header-icon{
    position:relative;
    color:var(--yellow);
}


/* =========================================================
   UNREAD BADGE
========================================================= */

.unread-badge{
    position:absolute;

    top:-3px;
    right:-3px;

    min-width:18px;
    height:18px;

    padding:0 4px;

    border-radius:20px;

    background:var(--red);
    color:#fff;

    font-size:9px;
    font-weight:800;

    display:none;
    align-items:center;
    justify-content:center;

    border:2px solid #000;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions{
    display:flex;
    gap:9px;

    padding:14px;
}

.action-btn{
    flex:1;

    min-height:43px;

    border:1px solid #292929;
    border-radius:12px;

    background:#111;
    color:#bbb;

    font-size:11px;
    font-weight:700;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}

.action-btn:active{
    transform:scale(.97);
}

.action-btn i{
    margin-right:5px;
}

.action-btn.primary{
    color:var(--yellow);
}

.action-btn.danger{
    color:#ff6b6b;
}

.action-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

.notifications{
    padding:0 14px;
}

.notification{
    position:relative;

    display:flex;
    align-items:flex-start;

    gap:12px;

    padding:14px;

    margin-bottom:10px;

    background:var(--card);

    border:1px solid #242424;
    border-radius:17px;

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
}

.notification.unread{
    border-color:rgba(255,229,0,.30);
    background:#171700;
}

.notification:active{
    transform:scale(.985);
}


/* =========================================================
   NOTIFICATION ICON
========================================================= */

.icon{
    width:43px;
    height:43px;
    min-width:43px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#242424;
    color:var(--yellow);

    font-size:16px;
}

.icon.ride{
    color:var(--green);
}

.icon.warning{
    color:var(--orange);
}

.icon.danger{
    color:#ff6262;
}

.icon.wallet{
    color:var(--blue);
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    flex:1;
    min-width:0;
}

.notification-title{
    font-size:13px;
    font-weight:800;
    color:#fff;

    display:flex;
    align-items:center;
    gap:7px;

    line-height:1.3;
}

.notification-body{
    margin-top:5px;

    color:#999;

    font-size:11px;
    line-height:1.5;

    word-break:break-word;
}

.time{
    margin-top:7px;

    color:#666;
    font-size:9px;
}

.dot{
    width:7px;
    height:7px;

    min-width:7px;

    border-radius:50%;

    background:var(--yellow);

    display:none;
}

.notification.unread .dot{
    display:inline-block;
}


/* =========================================================
   DELETE BUTTON
========================================================= */

.delete-one{
    width:30px;
    height:30px;
    min-width:30px;

    border:0;
    border-radius:50%;

    background:#202020;
    color:#666;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    cursor:pointer;
}

.delete-one:active{
    background:#351414;
    color:#ff6b6b;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    display:none;

    text-align:center;

    padding:65px 20px;
}

.empty-icon{
    width:75px;
    height:75px;

    margin:0 auto 17px;

    border-radius:50%;

    background:#151515;
    color:#555;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:29px;
}

.empty h2{
    font-size:17px;
}

.empty p{
    margin-top:7px;

    color:#777;
    font-size:11px;
    line-height:1.5;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    padding:60px 20px;

    text-align:center;

    color:#777;

    font-size:12px;
}

.spinner{
    width:28px;
    height:28px;

    margin:0 auto 12px;

    border:3px solid #333;
    border-top-color:var(--yellow);

    border-radius:50%;

    animation:
        riderxSpin .8s linear infinite;
}

@keyframes riderxSpin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   ERROR
========================================================= */

.error-box{
    display:none;

    margin:20px 14px;
    padding:18px;

    text-align:center;

    background:#180909;

    border:1px solid #402020;

    border-radius:17px;
}

.error-box.show{
    display:block;
}

.error-box i{
    color:#ff6262;
    font-size:25px;
}

.error-box h3{
    margin-top:9px;
    font-size:14px;
}

.error-box p{
    margin-top:5px;
    color:#888;
    font-size:10px;
    line-height:1.5;
}

.retry-btn{
    margin-top:13px;

    min-height:40px;

    padding:0 18px;

    border:0;
    border-radius:11px;

    background:var(--yellow);
    color:#000;

    font-size:11px;
    font-weight:800;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:
        max(25px,env(safe-area-inset-bottom));

    transform:translate(-50%,20px);

    z-index:999;

    width:max-content;
    max-width:90%;

    padding:12px 17px;

    border-radius:13px;

    background:#222;
    color:#fff;

    font-size:11px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s ease,
        transform .25s ease;

    box-shadow:
        0 8px 30px rgba(0,0,0,.45);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

    .actions{
        padding:12px 10px;
    }

    .notifications{
        padding:0 10px;
    }

    .notification{
        padding:12px;
    }

    .icon{
        width:40px;
        height:40px;
        min-width:40px;
    }

}

</style>

</head>

     TOAST

<script type="module">

/* =========================================================
   RIDERX
   NOTIFICATIONS
   File: rider/notifications.html

   Handles:
   - Firebase authentication
   - Real-time notifications
   - Read / unread state
   - Mark all read
   - Delete notification
   - Clear all notifications
   - Notification count
   - Ride notification navigation
   - Safe HTML rendering
   - Firestore query fallback
========================================================= */


/* =========================================================
   FIREBASE CONFIG
========================================================= */

import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    writeBatch,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================================================
   ELEMENTS
========================================================= */

const notificationContainer =
    document.getElementById(
        "notifications"
    );


const loading =
    document.getElementById(
        "loading"
    );


const empty =
    document.getElementById(
        "empty"
    );


const countText =
    document.getElementById(
        "notificationCount"
    );


const badge =
    document.getElementById(
        "unreadBadge"
    );


const toast =
    document.getElementById(
        "toast"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const errorText =
    document.getElementById(
        "errorText"
    );


const retryButton =
    document.getElementById(
        "retryButton"
    );


const markAllReadButton =
    document.getElementById(
        "markAllRead"
    );


const deleteAllButton =
    document.getElementById(
        "deleteAll"
    );


const refreshButton =
    document.getElementById(
        "refreshButton"
    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let unsubscribe =
    null;

let notificationData =
    [];

let listenerStarted =
    false;


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    toast.textContent =
        String(message || "");


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.riderXToastTimer
    );


    window.riderXToastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   ERROR UI
========================================================= */

function showError(message){

    loading.style.display =
        "none";


    errorText.textContent =
        message ||
        "Unable to load notifications.";


    errorBox.classList.add(
        "show"
    );

}


function hideError(){

    errorBox.classList.remove(
        "show"
    );

}


/* =========================================================
   BACK
========================================================= */

document
.getElementById("backButton")
.addEventListener(
    "click",
    () => {

        if(
            history.length > 1
        ){

            history.back();

        }else{

            location.replace(
                "home.html"
            );

        }

    }
);


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(timestamp){

    if(!timestamp){

        return "Just now";

    }


    let date;


    try{

        if(
            typeof timestamp.toDate ===
            "function"
        ){

            date =
                timestamp.toDate();

        }else if(
            typeof timestamp.toMillis ===
            "function"
        ){

            date =
                new Date(
                    timestamp.toMillis()
                );

        }else{

            date =
                new Date(timestamp);

        }

    }catch{

        return "Just now";

    }


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Just now";

    }


    const diff =
        Date.now() -
        date.getTime();


    if(diff < 0){

        return "Just now";

    }


    if(diff < 60000){

        return "Just now";

    }


    if(diff < 3600000){

        const minutes =
            Math.floor(
                diff / 60000
            );

        return `${minutes} min ago`;

    }


    if(diff < 86400000){

        const hours =
            Math.floor(
                diff / 3600000
            );

        return `${hours} hr ago`;

    }


    if(diff < 604800000){

        const days =
            Math.floor(
                diff / 86400000
            );

        return `${days} day${days === 1 ? "" : "s"} ago`;

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   ICON
========================================================= */

function getNotificationIcon(data){

    const type =
        String(
            data.type ||
            data.category ||
            data.notificationType ||
            ""
        ).toLowerCase();


    const title =
        String(
            data.title ||
            data.heading ||
            ""
        ).toLowerCase();


    const text =
        `${type} ${title}`;


    if(
        text.includes("ride") ||
        text.includes("request") ||
        text.includes("pickup") ||
        text.includes("driver")
    ){

        return {
            icon:"fa-motorcycle",
            className:"ride"
        };

    }


    if(
        text.includes("wallet") ||
        text.includes("payment") ||
        text.includes("earning") ||
        text.includes("fare")
    ){

        return {
            icon:"fa-wallet",
            className:"wallet"
        };

    }


    if(
        text.includes("warning") ||
        text.includes("alert")
    ){

        return {
            icon:"fa-triangle-exclamation",
            className:"warning"
        };

    }


    if(
        text.includes("cancel") ||
        text.includes("danger") ||
        text.includes("failed")
    ){

        return {
            icon:"fa-circle-exclamation",
            className:"danger"
        };

    }


    return {
        icon:"fa-bell",
        className:""
    };

}


/* =========================================================
   SAFE TEXT
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   READ STATE
========================================================= */

function isUnread(data){

    return (
        data.read !== true &&
        data.isRead !== true
    );

}


/* =========================================================
   SORT
========================================================= */

function getTimestampValue(timestamp){

    if(!timestamp){

        return 0;

    }


    try{

        if(
            typeof timestamp.toMillis ===
            "function"
        ){

            return timestamp.toMillis();

        }


        if(
            typeof timestamp.toDate ===
            "function"
        ){

            return timestamp
                .toDate()
                .getTime();

        }


        const value =
            new Date(timestamp)
            .getTime();


        return Number.isFinite(value)
            ? value
            : 0;

    }catch{

        return 0;

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderNotifications(){

    loading.style.display =
        "none";


    hideError();


    notificationContainer
        .querySelectorAll(
            ".notification"
        )
        .forEach(
            element =>
                element.remove()
        );


    if(
        !notificationData.length
    ){

        empty.style.display =
            "block";


        countText.textContent =
            "No notifications";


        badge.style.display =
            "none";


        markAllReadButton.disabled =
            true;


        deleteAllButton.disabled =
            true;


        return;

    }


    empty.style.display =
        "none";


    markAllReadButton.disabled =
        false;


    deleteAllButton.disabled =
        false;


    const unread =
        notificationData.filter(
            item =>
                isUnread(
                    item.data
                )
        ).length;


    countText.textContent =
        `${notificationData.length} notification${
            notificationData.length === 1
                ? ""
                : "s"
        }`;


    if(unread > 0){

        badge.textContent =
            unread > 99
                ? "99+"
                : String(unread);


        badge.style.display =
            "flex";

    }else{

        badge.style.display =
            "none";

    }


    notificationData.forEach(
        item => {

            const data =
                item.data || {};


            const icon =
                getNotificationIcon(
                    data
                );


            const title =
                data.title ||
                data.heading ||
                "RiderX Notification";


            const body =
                data.body ||
                data.message ||
                data.description ||
                "You have a new notification.";


            const unreadState =
                isUnread(
                    data
                );


            const element =
                document.createElement(
                    "article"
                );


            element.className =
                "notification" +
                (
                    unreadState
                        ? " unread"
                        : ""
                );


            element.dataset.id =
                item.id;


            element.innerHTML = `

                <div class="icon ${escapeHTML(
                    icon.className
                )}">
                    <i class="fa-solid ${escapeHTML(
                        icon.icon
                    )}"></i>
                </div>

                <div class="content">

                    <div class="notification-title">

                        ${escapeHTML(title)}

                        <span class="dot"></span>

                    </div>

                    <div class="notification-body">
                        ${escapeHTML(body)}
                    </div>

                    <div class="time">
                        ${escapeHTML(
                            formatTime(
                                data.createdAt ||
                                data.timestamp
                            )
                        )}
                    </div>

                </div>

                <button
                    class="delete-one"
                    type="button"
                    aria-label="Delete notification"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            `;


            /* =========================================
               OPEN NOTIFICATION
            ========================================= */

            element.addEventListener(
                "click",
                async event => {

                    if(
                        event.target.closest(
                            ".delete-one"
                        )
                    ){

                        return;

                    }


                    await markAsRead(
                        item.id
                    );


                    openNotification(
                        data
                    );

                }
            );


            /* =========================================
               DELETE
            ========================================= */

            const deleteButton =
                element.querySelector(
                    ".delete-one"
                );


            deleteButton.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();


                    await deleteNotification(
                        item.id
                    );

                }
            );


            notificationContainer
                .appendChild(
                    element
                );

        }
    );

}


/* =========================================================
   OPEN NOTIFICATION
========================================================= */

function openNotification(data){

    const rideId =
        data.rideId ||
        data.rideID ||
        data.ride;


    if(rideId){

        try{

            sessionStorage.setItem(
                "riderx_selected_ride",
                String(rideId)
            );

            sessionStorage.setItem(
                "riderx_active_ride_id",
                String(rideId)
            );

        }catch{}

        /*
         * Open live ride screen when
         * notification belongs to a ride.
         */

        location.href =
            `live.html?rideId=${encodeURIComponent(
                String(rideId)
            )}`;

        return;

    }


    const actionUrl =
        data.actionUrl ||
        data.url;


    if(
        actionUrl &&
        typeof actionUrl === "string"
    ){

        /*
         * Only allow same-origin
         * relative navigation.
         */

        if(
            actionUrl.startsWith("/") ||
            actionUrl.startsWith("./") ||
            actionUrl.startsWith("../")
        ){

            location.href =
                actionUrl;

            return;

        }

    }

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            currentUser =
                null;


            if(unsubscribe){

                unsubscribe();

                unsubscribe =
                    null;

            }


            notificationData =
                [];


            location.replace(
                "../auth/login.html?role=rider"
            );


            return;

        }


        currentUser =
            user;


        listenNotifications(
            user.uid
        );

    }
);


/* =========================================================
   LISTEN NOTIFICATIONS
========================================================= */

function listenNotifications(uid){

    if(!uid){

        return;

    }


    if(unsubscribe){

        unsubscribe();

        unsubscribe =
            null;

    }


    listenerStarted =
        true;


    loading.style.display =
        "block";


    empty.style.display =
        "none";


    hideError();


    const notificationsRef =
        collection(
            db,
            "notifications"
        );


    /*
     * IMPORTANT:
     *
     * First try the normal indexed query.
     * If the Firestore index is missing,
     * automatically fall back to userId-only
     * query so the notification screen still
     * works.
     */


    const primaryQuery =
        query(
            notificationsRef,
            where(
                "userId",
                "==",
                uid
            ),
            orderBy(
                "createdAt",
                "desc"
            )
        );


    unsubscribe =
        onSnapshot(
            primaryQuery,

            snapshot => {

                processSnapshot(
                    snapshot
                );

            },

            error => {

                console.warn(
                    "Primary notification query failed:",
                    error
                );


                /*
                 * Missing-index / query failure
                 * fallback.
                 */

                listenNotificationsFallback(
                    uid
                );

            }
        );

}


/* =========================================================
   FALLBACK LISTENER
========================================================= */

function listenNotificationsFallback(uid){

    if(unsubscribe){

        unsubscribe();

        unsubscribe =
            null;

    }


    const notificationsRef =
        collection(
            db,
            "notifications"
        );


    const fallbackQuery =
        query(
            notificationsRef,
            where(
                "userId",
                "==",
                uid
            )
        );


    unsubscribe =
        onSnapshot(
            fallbackQuery,

            snapshot => {

                processSnapshot(
                    snapshot
                );

            },

            error => {

                console.error(
                    "Notification fallback error:",
                    error
                );


                showError(
                    error.message ||
                    "Unable to load notifications."
                );

            }
        );

}


/* =========================================================
   PROCESS SNAPSHOT
========================================================= */

function processSnapshot(snapshot){

    notificationData =
        snapshot.docs.map(
            item => ({

                id:
                    item.id,

                data:
                    item.data() || {}

            })
        );


    notificationData.sort(
        (a,b) => {

            const aTime =
                getTimestampValue(
                    a.data.createdAt ||
                    a.data.timestamp
                );


            const bTime =
                getTimestampValue(
                    b.data.createdAt ||
                    b.data.timestamp
                );


            return bTime - aTime;

        }
    );


    renderNotifications();

}


/* =========================================================
   MARK ONE READ
========================================================= */

async function markAsRead(id){

    if(
        !currentUser ||
        !id
    ){

        return;

    }


    const item =
        notificationData.find(
            notification =>
                notification.id === id
        );


    if(
        !item ||
        !isUnread(item.data)
    ){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "notifications",
                id
            ),
            {
                read:true,
                isRead:true,
                readAt:
                    serverTimestamp()
            }
        );

    }catch(error){

        console.error(
            "Mark notification read:",
            error
        );

    }

}


/* =========================================================
   MARK ALL READ
========================================================= */

markAllReadButton.addEventListener(
    "click",
    async () => {

        if(!currentUser){

            showToast(
                "Please login first"
            );

            return;

        }


        const unread =
            notificationData.filter(
                item =>
                    isUnread(
                        item.data
                    )
            );


        if(!unread.length){

            showToast(
                "All notifications are already read"
            );

            return;

        }


        markAllReadButton.disabled =
            true;


        try{

            const batch =
                writeBatch(
                    db
                );


            unread.forEach(
                item => {

                    batch.update(
                        doc(
                            db,
                            "notifications",
                            item.id
                        ),
                        {
                            read:true,
                            isRead:true,
                            readAt:
                                serverTimestamp()
                        }
                    );

                }
            );


            await batch.commit();


            showToast(
                "All notifications marked as read"
            );

        }catch(error){

            console.error(
                "Mark all read:",
                error
            );


            showToast(
                "Unable to update notifications"
            );

        }finally{

            markAllReadButton.disabled =
                false;

        }

    }
);


/* =========================================================
   DELETE ONE
========================================================= */

async function deleteNotification(id){

    if(!id){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "notifications",
                id
            )
        );


        showToast(
            "Notification deleted"
        );

    }catch(error){

        console.error(
            "Delete notification:",
            error
        );


        showToast(
            "Unable to delete notification"
        );

    }

}


/* =========================================================
   DELETE ALL
========================================================= */

deleteAllButton.addEventListener(
    "click",
    async () => {

        if(!currentUser){

            showToast(
                "Please login first"
            );

            return;

        }


        if(
            !notificationData.length
        ){

            showToast(
                "No notifications to clear"
            );

            return;

        }


        const confirmed =
            confirm(
                "Clear all notifications?"
            );


        if(!confirmed){

            return;

        }


        deleteAllButton.disabled =
            true;


        try{

            /*
             * Firestore batch supports a maximum
             * of 500 operations.
             *
             * Process notifications in chunks
             * so the button also works when the
             * user has many notifications.
             */

            const chunkSize =
                450;


            for(
                let i = 0;
                i < notificationData.length;
                i += chunkSize
            ){

                const chunk =
                    notificationData.slice(
                        i,
                        i + chunkSize
                    );


                const batch =
                    writeBatch(
                        db
                    );


                chunk.forEach(
                    item => {

                        batch.delete(
                            doc(
                                db,
                                "notifications",
                                item.id
                            )
                        );

                    }
                );


                await batch.commit();

            }


            showToast(
                "All notifications cleared"
            );

        }catch(error){

            console.error(
                "Delete all notifications:",
                error
            );


            showToast(
                "Unable to clear notifications"
            );

        }finally{

            deleteAllButton.disabled =
                false;

        }

    }
);


/* =========================================================
   REFRESH
========================================================= */

refreshButton.addEventListener(
    "click",
    () => {

        if(
            !currentUser
        ){

            showToast(
                "Please login first"
            );

            return;

        }


        const icon =
            refreshButton.querySelector(
                "i"
            );


        icon.classList.add(
            "fa-spin"
        );


        refreshButton.disabled =
            true;


        /*
         * Re-create listener so that refresh
         * also recovers from a stale listener.
         */

        listenNotifications(
            currentUser.uid
        );


        setTimeout(
            () => {

                icon.classList.remove(
                    "fa-spin"
                );


                refreshButton.disabled =
                    false;


                showToast(
                    "Notifications refreshed"
                );

            },
            700
        );

    }
);


/* =========================================================
   RETRY
========================================================= */

retryButton.addEventListener(
    "click",
    () => {

        if(
            !currentUser
        ){

            location.replace(
                "../auth/login.html?role=rider"
            );

            return;

        }


        listenNotifications(
            currentUser.uid
        );

    }
);


/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        if(unsubscribe){

            unsubscribe();

            unsubscribe =
                null;

        }

    }
);


/* =========================================================
   INITIAL UI
========================================================= */

markAllReadButton.disabled =
    true;

deleteAllButton.disabled =
    true;

</script>
