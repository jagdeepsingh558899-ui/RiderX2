<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#000000"
>

<meta
    name="description"
    content="RiderX rider notifications"
>

<title>RiderX | Notifications</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<link

    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<style>

:root{
    --yellow:#ffe500;
    --black:#000;
    --dark:#0a0a0a;
    --card:#151515;
    --card2:#202020;
    --white:#fff;
    --muted:#8b8b8b;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#60a5fa;
    --orange:#ffb020;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Poppins,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
}

body{
    min-height:100vh;
    padding-bottom:max(25px,env(safe-area-inset-bottom));
}

button{
    font-family:inherit;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:100;

    min-height:68px;

    padding:
        max(10px,env(safe-area-inset-top))
        14px
        10px;

    display:flex;
    align-items:center;
    gap:12px;

    background:rgba(0,0,0,.97);

    border-bottom:1px solid #292929;

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.back-btn,
.header-icon{
    width:42px;
    height:42px;
    min-width:42px;

    border:0;
    border-radius:50%;

    background:#171717;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}

.back-btn:active,
.header-icon:active{
    transform:scale(.91);
}

.header-title{
    flex:1;
    min-width:0;
}

.header-title h1{
    font-size:19px;
    font-weight:800;
    line-height:1.1;
}

.header-title p{
    margin-top:4px;
    color:#777;
    font-size:10px;
}

.header-icon{
    position:relative;
    color:var(--yellow);
}


/* =========================================================
   UNREAD BADGE
========================================================= */

.unread-badge{
    position:absolute;

    top:-3px;
    right:-3px;

    min-width:18px;
    height:18px;

    padding:0 4px;

    border-radius:20px;

    background:var(--red);
    color:#fff;

    font-size:9px;
    font-weight:800;

    display:none;
    align-items:center;
    justify-content:center;

    border:2px solid #000;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions{
    display:flex;
    gap:9px;

    padding:14px;
}

.action-btn{
    flex:1;

    min-height:43px;

    border:1px solid #292929;
    border-radius:12px;

    background:#111;
    color:#bbb;

    font-size:11px;
    font-weight:700;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease;
}

.action-btn:active{
    transform:scale(.97);
}

.action-btn i{
    margin-right:5px;
}

.action-btn.primary{
    color:var(--yellow);
}

.action-btn.danger{
    color:#ff6b6b;
}

.action-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

.notifications{
    padding:0 14px;
}

.notification{
    position:relative;

    display:flex;
    align-items:flex-start;

    gap:12px;

    padding:14px;

    margin-bottom:10px;

    background:var(--card);

    border:1px solid #242424;
    border-radius:17px;

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
}

.notification.unread{
    border-color:rgba(255,229,0,.30);
    background:#171700;
}

.notification:active{
    transform:scale(.985);
}


/* =========================================================
   NOTIFICATION ICON
========================================================= */

.icon{
    width:43px;
    height:43px;
    min-width:43px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#242424;
    color:var(--yellow);

    font-size:16px;
}

.icon.ride{
    color:var(--green);
}

.icon.warning{
    color:var(--orange);
}

.icon.danger{
    color:#ff6262;
}

.icon.wallet{
    color:var(--blue);
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    flex:1;
    min-width:0;
}

.notification-title{
    font-size:13px;
    font-weight:800;
    color:#fff;

    display:flex;
    align-items:center;
    gap:7px;

    line-height:1.3;
}

.notification-body{
    margin-top:5px;

    color:#999;

    font-size:11px;
    line-height:1.5;

    word-break:break-word;
}

.time{
    margin-top:7px;

    color:#666;
    font-size:9px;
}

.dot{
    width:7px;
    height:7px;

    min-width:7px;

    border-radius:50%;

    background:var(--yellow);

    display:none;
}

.notification.unread .dot{
    display:inline-block;
}


/* =========================================================
   DELETE BUTTON
========================================================= */

.delete-one{
    width:30px;
    height:30px;
    min-width:30px;

    border:0;
    border-radius:50%;

    background:#202020;
    color:#666;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    cursor:pointer;
}

.delete-one:active{
    background:#351414;
    color:#ff6b6b;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    display:none;

    text-align:center;

    padding:65px 20px;
}

.empty-icon{
    width:75px;
    height:75px;

    margin:0 auto 17px;

    border-radius:50%;

    background:#151515;
    color:#555;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:29px;
}

.empty h2{
    font-size:17px;
}

.empty p{
    margin-top:7px;

    color:#777;
    font-size:11px;
    line-height:1.5;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    padding:60px 20px;

    text-align:center;

    color:#777;

    font-size:12px;
}

.spinner{
    width:28px;
    height:28px;

    margin:0 auto 12px;

    border:3px solid #333;
    border-top-color:var(--yellow);

    border-radius:50%;

    animation:
        riderxSpin .8s linear infinite;
}

@keyframes riderxSpin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

.error-box{
    display:none;

    margin:20px 14px;
    padding:18px;

    text-align:center;

    background:#180909;

    border:1px solid #402020;

    border-radius:17px;
}

.error-box.show{
    display:block;
}

.error-box i{
    color:#ff6262;
    font-size:25px;
}

.error-box h3{
    margin-top:9px;
    font-size:14px;
}

.error-box p{
    margin-top:5px;
    color:#888;
    font-size:10px;
    line-height:1.5;
}

.retry-btn{
    margin-top:13px;

    min-height:40px;

    padding:0 18px;

    border:0;
    border-radius:11px;

    background:var(--yellow);
    color:#000;

    font-size:11px;
    font-weight:800;

    cursor:pointer;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;

    bottom:max(25px,env(safe-area-inset-bottom));

    transform:translate(-50%,20px);

    z-index:999;

    width:max-content;
    max-width:90%;

    padding:12px 17px;

    border-radius:13px;

    background:#222;
    color:#fff;

    font-size:11px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s ease,
        transform .25s ease;

    box-shadow:
        0 8px 30px rgba(0,0,0,.45);
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

    .actions{
        padding:12px 10px;
    }

    .notifications{
        padding:0 10px;
    }

    .notification{
        padding:12px;
    }

    .icon{
        width:40px;
        height:40px;
        min-width:40px;
    }

}

</style>

</head>


<body>

<!-- =======================================================
     TOAST
======================================================= -->

<div
    id="toast"

<script type="module">

"use strict";


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    writeBatch,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================================================
   CONSTANTS
========================================================= */

const BATCH_SIZE = 450;


/* =========================================================
   ELEMENTS
========================================================= */

const notificationContainer =
    document.getElementById(
        "notifications"
    );


const loading =
    document.getElementById(
        "loading"
    );


const empty =
    document.getElementById(
        "empty"
    );


const countText =
    document.getElementById(
        "notificationCount"
    );


const badge =
    document.getElementById(
        "unreadBadge"
    );


const toast =
    document.getElementById(
        "toast"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const errorText =
    document.getElementById(
        "errorText"
    );


const retryButton =
    document.getElementById(
        "retryButton"
    );


const markAllReadButton =
    document.getElementById(
        "markAllRead"
    );


const deleteAllButton =
    document.getElementById(
        "deleteAll"
    );


const refreshButton =
    document.getElementById(
        "refreshButton"
    );


/* =========================================================
   STATE
========================================================= */

let currentUser =
    null;


let unsubscribe =
    null;


let notificationData =
    [];


let listenerGeneration =
    0;


let toastTimer =
    null;


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    toast.textContent =
        String(
            message || ""
        );


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   ERROR UI
========================================================= */

function showError(message){

    loading.style.display =
        "none";


    empty.style.display =
        "none";


    errorText.textContent =
        message ||
        "Unable to load notifications.";


    errorBox.classList.add(
        "show"
    );


    markAllReadButton.disabled =
        true;


    deleteAllButton.disabled =
        true;

}


function hideError(){

    errorBox.classList.remove(
        "show"
    );

}


/* =========================================================
   LOADING UI
========================================================= */

function showLoading(){

    loading.style.display =
        "block";


    empty.style.display =
        "none";


    hideError();

}


/* =========================================================
   BACK
========================================================= */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        function(){

            const fallback =
                "home.html";


            if(
                document.referrer &&
                document.referrer.startsWith(
                    window.location.origin
                )
            ){

                history.back();

                return;

            }


            location.replace(
                fallback
            );

        }
    );


/* =========================================================
   TIME VALUE
========================================================= */

function getTimestampValue(
    timestamp
){

    if(!timestamp){

        return 0;

    }


    try{

        if(
            typeof timestamp.toMillis ===
            "function"
        ){

            return timestamp.toMillis();

        }


        if(
            typeof timestamp.toDate ===
            "function"
        ){

            return timestamp
                .toDate()
                .getTime();

        }


        if(
            typeof timestamp ===
            "number"
        ){

            return Number.isFinite(
                timestamp
            )
                ? timestamp
                : 0;

        }


        if(
            typeof timestamp ===
            "object" &&
            typeof timestamp.seconds ===
            "number"
        ){

            return (
                timestamp.seconds *
                1000
            ) +
            Math.floor(
                Number(
                    timestamp.nanoseconds ||
                    0
                ) /
                1000000
            );

        }


        const date =
            new Date(
                timestamp
            );


        const time =
            date.getTime();


        return Number.isFinite(
            time
        )
            ? time
            : 0;

    }catch{

        return 0;

    }

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(
    timestamp
){

    const time =
        getTimestampValue(
            timestamp
        );


    if(!time){

        return "Just now";

    }


    const diff =
        Date.now() -
        time;


    if(
        diff <= 0 ||
        diff < 60000
    ){

        return "Just now";

    }


    if(
        diff < 3600000
    ){

        const minutes =
            Math.floor(
                diff /
                60000
            );


        return (
            minutes +
            " min ago"
        );

    }


    if(
        diff < 86400000
    ){

        const hours =
            Math.floor(
                diff /
                3600000
            );


        return (
            hours +
            " hr ago"
        );

    }


    if(
        diff < 604800000
    ){

        const days =
            Math.floor(
                diff /
                86400000
            );


        return (
            days +
            " day" +
            (
                days === 1
                    ? ""
                    : "s"
            ) +
            " ago"
        );

    }


    const date =
        new Date(
            time
        );


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   ICON
========================================================= */

function getNotificationIcon(
    data
){

    const type =
        String(
            data.type ||
            data.category ||
            data.notificationType ||
            ""
        )
        .toLowerCase();


    const title =
        String(
            data.title ||
            data.heading ||
            ""
        )
        .toLowerCase();


    const text =
        type +
        " " +
        title;


    if(
        text.includes("ride") ||
        text.includes("request") ||
        text.includes("pickup") ||
        text.includes("driver")
    ){

        return {
            icon:"fa-motorcycle",
            className:"ride"
        };

    }


    if(
        text.includes("wallet") ||
        text.includes("payment") ||
        text.includes("earning") ||
        text.includes("fare")
    ){

        return {
            icon:"fa-wallet",
            className:"wallet"
        };

    }


    if(
        text.includes("warning") ||
        text.includes("alert")
    ){

        return {
            icon:"fa-triangle-exclamation",
            className:"warning"
        };

    }


    if(
        text.includes("cancel") ||
        text.includes("danger") ||
        text.includes("failed")
    ){

        return {
            icon:"fa-circle-exclamation",
            className:"danger"
        };

    }


    return {
        icon:"fa-bell",
        className:""
    };

}


/* =========================================================
   SAFE TEXT
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   READ STATE
========================================================= */

function isUnread(
    data
){

    return (
        data.read !== true &&
        data.isRead !== true
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderNotifications(){

    loading.style.display =
        "none";


    hideError();


    notificationContainer
        .querySelectorAll(
            ".notification"
        )
        .forEach(
            function(element){

                element.remove();

            }
        );


    if(
        !notificationData.length
    ){

        empty.style.display =
            "block";


        countText.textContent =
            "No notifications";


        badge.style.display =
            "none";


        markAllReadButton.disabled =
            true;


        deleteAllButton.disabled =
            true;


        return;

    }


    empty.style.display =
        "none";


    markAllReadButton.disabled =
        false;


    deleteAllButton.disabled =
        false;


    const unread =
        notificationData.filter(
            function(item){

                return isUnread(
                    item.data
                );

            }
        ).length;


    countText.textContent =
        notificationData.length +
        " notification" +
        (
            notificationData.length === 1
                ? ""
                : "s"
        );


    if(
        unread > 0
    ){

        badge.textContent =
            unread > 99
                ? "99+"
                : String(unread);


        badge.style.display =
            "flex";

    }else{

        badge.style.display =
            "none";

    }


    notificationData.forEach(
        function(item){

            const data =
                item.data || {};


            const icon =
                getNotificationIcon(
                    data
                );


            const title =
                data.title ||
                data.heading ||
                "RiderX Notification";


            const body =
                data.body ||
                data.message ||
                data.description ||
                "You have a new notification.";


            const unreadState =
                isUnread(
                    data
                );


            const element =
                document.createElement(
                    "article"
                );


            element.className =
                "notification" +
                (
                    unreadState
                        ? " unread"
                        : ""
                );


            element.dataset.id =
                item.id;


            element.innerHTML = `

                <div class="icon ${escapeHTML(
                    icon.className
                )}">
                    <i class="fa-solid ${escapeHTML(
                        icon.icon
                    )}"></i>
                </div>

                <div class="content">

                    <div class="notification-title">

                        ${escapeHTML(title)}

                        <span class="dot"></span>

                    </div>

                    <div class="notification-body">
                        ${escapeHTML(body)}
                    </div>

                    <div class="time">
                        ${escapeHTML(
                            formatTime(
                                data.createdAt ||
                                data.timestamp ||
                                data.sentAt
                            )
                        )}
                    </div>

                </div>

                <button
                    class="delete-one"
                    type="button"
                    aria-label="Delete notification"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            `;


            /* =========================================
               OPEN
            ========================================= */

            element.addEventListener(
                "click",
                async function(event){

                    if(
                        event.target.closest(
                            ".delete-one"
                        )
                    ){

                        return;

                    }


                    await markAsRead(
                        item.id
                    );


                    openNotification(
                        data
                    );

                }
            );


            /* =========================================
               DELETE
            ========================================= */

            const deleteButton =
                element.querySelector(
                    ".delete-one"
                );


            if(deleteButton){

                deleteButton.addEventListener(
                    "click",
                    async function(event){

                        event.stopPropagation();


                        await deleteNotification(
                            item.id
                        );

                    }
                );

            }


            notificationContainer
                .appendChild(
                    element
                );

        }
    );

}


/* =========================================================
   OPEN NOTIFICATION
========================================================= */

function openNotification(
    data
){

    const rideId =
        data.rideId ||
        data.rideID ||
        data.ride;


    if(rideId){

        try{

            sessionStorage.setItem(
                "riderx_selected_ride",
                String(rideId)
            );


            sessionStorage.setItem(
                "riderx_active_ride_id",
                String(rideId)
            );

        }catch{

            /* Ignore sessionStorage errors. */

        }


        location.href =
            "live.html?rideId=" +
            encodeURIComponent(
                String(rideId)
            );


        return;

    }


    const actionUrl =
        data.actionUrl ||
        data.url;


    if(
        typeof actionUrl ===
        "string"
    ){

        const value =
            actionUrl.trim();


        if(
            value.startsWith("/") ||
            value.startsWith("./") ||
            value.startsWith("../")
        ){

            try{

                const target =
                    new URL(
                        value,
                        window.location.href
                    );


                if(
                    target.origin ===
                    window.location.origin
                ){

                    location.href =
                        target.href;

                    return;

                }

            }catch{

                /* Ignore invalid URL. */

            }

        }

    }

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    function(user){

        currentUser =
            user || null;


        if(!user){

            stopNotificationListener();


            notificationData =
                [];


            renderNotifications();


            location.replace(
                "../auth/login.html?role=rider"
            );


            return;

        }


        listenNotifications(
            user.uid
        );

    }
);


/* =========================================================
   STOP LISTENER
========================================================= */

function stopNotificationListener(){

    listenerGeneration++;


    if(
        typeof unsubscribe ===
        "function"
    ){

        try{

            unsubscribe();

        }catch(error){

            console.warn(
                "Unable to unsubscribe notifications:",
                error
            );

        }

    }


    unsubscribe =
        null;

}


/* =========================================================
   LISTEN NOTIFICATIONS
========================================================= */

function listenNotifications(
    uid
){

    if(!uid){

        return;

    }


    stopNotificationListener();


    const generation =
        listenerGeneration;


    showLoading();


    const notificationsRef =
        collection(
            db,
            "notifications"
        );


    const primaryQuery =
        query(
            notificationsRef,
            where(
                "userId",
                "==",
                uid
            ),
            orderBy(
                "createdAt",
                "desc"
            )
        );


    unsubscribe =
        onSnapshot(
            primaryQuery,

            function(snapshot){

                if(
                    generation !==
                    listenerGeneration
                ){

                    return;

                }


                processSnapshot(
                    snapshot
                );

            },

            function(error){

                if(
                    generation !==
                    listenerGeneration
                ){

                    return;

                }


                console.warn(
                    "Primary notification query failed:",
                    error
                );


                /*
                 * Re-create using a simple
                 * userId-only query.
                 */

                listenNotificationsFallback(
                    uid,
                    generation
                );

            }
        );

}


/* =========================================================
   FALLBACK LISTENER
========================================================= */

function listenNotificationsFallback(
    uid,
    parentGeneration
){

    if(
        parentGeneration !==
        listenerGeneration
    ){

        return;

    }


    if(
        typeof unsubscribe ===
        "function"
    ){

        try{

            unsubscribe();

        }catch{

            /* Ignore unsubscribe error. */

        }

    }


    unsubscribe =
        null;


    const notificationsRef =
        collection(
            db,
            "notifications"
        );


    const fallbackQuery =
        query(
            notificationsRef,
            where(
                "userId",
                "==",
                uid
            )
        );


    unsubscribe =
        onSnapshot(
            fallbackQuery,

            function(snapshot){

                if(
                    parentGeneration !==
                    listenerGeneration
                ){

                    return;

                }


                processSnapshot(
                    snapshot
                );

            },

            function(error){

                if(
                    parentGeneration !==
                    listenerGeneration
                ){

                    return;

                }


                console.error(
                    "Notification fallback error:",
                    error
                );


                notificationData =
                    [];


                showError(
                    getFirebaseErrorMessage(
                        error
                    )
                );

            }
        );

}


/* =========================================================
   FIREBASE ERROR MESSAGE
========================================================= */

function getFirebaseErrorMessage(
    error
){

    const code =
        String(
            error?.code ||
            ""
        );


    if(
        code ===
        "permission-denied"
    ){

        return (
            "You do not have permission to read notifications."
        );

    }


    if(
        code ===
        "unauthenticated"
    ){

        return (
            "Your login session has expired. Please login again."
        );

    }


    if(
        code ===
        "failed-precondition"
    ){

        return (
            "Notification query needs a Firestore index or configuration."
        );

    }


    if(
        code ===
        "unavailable"
    ){

        return (
            "Firebase is temporarily unavailable. Please try again."
        );

    }


    return (
        error?.message ||
        "Unable to load notifications."
    );

}


/* =========================================================
   PROCESS SNAPSHOT
========================================================= */

function processSnapshot(
    snapshot
){

    notificationData =
        snapshot.docs.map(
            function(item){

                return {

                    id:
                        item.id,

                    data:
                        item.data() || {}

                };

            }
        );


    notificationData.sort(
        function(a,b){

            const aTime =
                getTimestampValue(
                    a.data.createdAt ||
                    a.data.timestamp ||
                    a.data.sentAt
                );


            const bTime =
                getTimestampValue(
                    b.data.createdAt ||
                    b.data.timestamp ||
                    b.data.sentAt
                );


            return bTime - aTime;

        }
    );


    renderNotifications();

}


/* =========================================================
   MARK ONE READ
========================================================= */

async function markAsRead(
    id
){

    if(
        !currentUser ||
        !id
    ){

        return;

    }


    const item =
        notificationData.find(
            function(notification){

                return (
                    notification.id ===
                    id
                );

            }
        );


    if(
        !item ||
        !isUnread(item.data)
    ){

        return;

    }


    /*
     * Optimistically update local state.
     * The realtime listener will confirm the
     * Firestore result afterwards.
     */

    item.data.read =
        true;

    item.data.isRead =
        true;


    renderNotifications();


    try{

        await updateDoc(
            doc(
                db,
                "notifications",
                id
            ),
            {
                read:true,
                isRead:true,
                readAt:
                    serverTimestamp()
            }
        );

    }catch(error){

        console.error(
            "Mark notification read:",
            error
        );


        /*
         * Revert optimistic state if
         * Firestore update failed.
         */

        item.data.read =
            false;

        item.data.isRead =
            false;


        renderNotifications();

    }

}


/* =========================================================
   MARK ALL READ
========================================================= */

markAllReadButton.addEventListener(
    "click",
    async function(){

        if(!currentUser){

            showToast(
                "Please login first"
            );

            return;

        }


        const unread =
            notificationData.filter(
                function(item){

                    return isUnread(
                        item.data
                    );

                }
            );


        if(
            !unread.length
        ){

            showToast(
                "All notifications are already read"
            );

            return;

        }


        markAllReadButton.disabled =
            true;


        try{

            for(
                let start = 0;
                start < unread.length;
                start += BATCH_SIZE
            ){

                const chunk =
                    unread.slice(
                        start,
                        start +
                        BATCH_SIZE
                    );


                const batch =
                    writeBatch(
                        db
                    );


                let operations =
                    0;


                chunk.forEach(
                    function(item){

                        if(!item.id){

                            return;

                        }


                        batch.update(
                            doc(
                                db,
                                "notifications",
                                item.id
                            ),
                            {
                                read:true,
                                isRead:true,
                                readAt:
                                    serverTimestamp()
                            }
                        );


                        operations++;

                    }
                );


                if(
                    operations > 0
                ){

                    await batch.commit();

                }

            }


            showToast(
                "All notifications marked as read"
            );

        }catch(error){

            console.error(
                "Mark all read:",
                error
            );


            showToast(
                getFirebaseErrorMessage(
                    error
                )
            );

        }finally{

            markAllReadButton.disabled =
                false;

        }

    }
);


/* =========================================================
   DELETE ONE
========================================================= */

async function deleteNotification(
    id
){

    if(
        !currentUser ||
        !id
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "notifications",
                id
            )
        );


        showToast(
            "Notification deleted"
        );

    }catch(error){

        console.error(
            "Delete notification:",
            error
        );


        showToast(
            getFirebaseErrorMessage(
                error
            )
        );

    }

}


/* =========================================================
   DELETE ALL
========================================================= */

deleteAllButton.addEventListener(
    "click",
    async function(){

        if(!currentUser){

            showToast(
                "Please login first"
            );

            return;

        }


        if(
            !notificationData.length
        ){

            showToast(
                "No notifications to clear"
            );

            return;

        }


        const confirmed =
            window.confirm(
                "Clear all notifications?"
            );


        if(!confirmed){

            return;

        }


        deleteAllButton.disabled =
            true;


        try{

            for(
                let start = 0;
                start < notificationData.length;
                start += BATCH_SIZE
            ){

                const chunk =
                    notificationData.slice(
                        start,
                        start +
                        BATCH_SIZE
                    );


                const batch =
                    writeBatch(
                        db
                    );


                let operations =
                    0;


                chunk.forEach(
                    function(item){

                        if(!item.id){

                            return;

                        }


                        batch.delete(
                            doc(
                                db,
                                "notifications",
                                item.id
                            )
                        );


                        operations++;

                    }
                );


                if(
                    operations > 0
                ){

                    await batch.commit();

                }

            }


            showToast(
                "All notifications cleared"
            );

        }catch(error){

            console.error(
                "Delete all notifications:",
                error
            );


            showToast(
                getFirebaseErrorMessage(
                    error
                )
            );

        }finally{

            deleteAllButton.disabled =
                false;

        }

    }
);


/* =========================================================
   REFRESH
========================================================= */

refreshButton.addEventListener(
    "click",
    function(){

        if(!currentUser){

            showToast(
                "Please login first"
            );

            return;

        }


        const icon =
            refreshButton.querySelector(
                "i"
            );


        if(icon){

            icon.classList.add(
                "fa-spin"
            );

        }


        refreshButton.disabled =
            true;


        listenNotifications(
            currentUser.uid
        );


        setTimeout(
            function(){

                if(icon){

                    icon.classList.remove(
                        "fa-spin"
                    );

                }


                refreshButton.disabled =
                    false;


                showToast(
                    "Notifications refreshed"
                );

            },
            700
        );

    }
);


/* =========================================================
   RETRY
========================================================= */

retryButton.addEventListener(
    "click",
    function(){

        if(!currentUser){

            location.replace(
                "../auth/login.html?role=rider"
            );

            return;

        }


        listenNotifications(
            currentUser.uid
        );

    }
);


/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
    "pagehide",
    function(){

        stopNotificationListener();

    }
);


/* =========================================================
   INITIAL UI
========================================================= */

markAllReadButton.disabled =
    true;


deleteAllButton.disabled =
    true;

</script>
