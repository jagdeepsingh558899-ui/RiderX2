<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rider Earnings</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

.header{
    background:#ffcc00;
    color:#000;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    padding:20px;
}


.box{

background:#1d1d1d;
padding:25px;
border-radius:15px;
text-align:center;
margin-bottom:20px;

}


.amount{

font-size:35px;
color:#ffcc00;
font-weight:bold;

}


.card{

background:#1d1d1d;
padding:15px;
margin:15px 0;
border-radius:12px;
border:1px solid #333;

}


.back{

display:block;
background:#ffcc00;
color:#000;
padding:12px;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">
💰 RiderX Earnings
</div>



<div class="container">


<div class="box">

<p>Total Earnings</p>

<div class="amount" id="total">
₹0
</div>

</div>



<h2>Ride Payments</h2>


<div id="earningList">
Loading earnings...
</div>



<a class="back" href="dashboard.html">
⬅ Back Dashboard
</a>


</div>



<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
getDocs

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



async function loadEarnings(){


let list=document.getElementById("earningList");

let total=0;


try{


const snapshot=await getDocs(collection(db,"rides"));


list.innerHTML="";


if(snapshot.empty){

list.innerHTML="<p>No earnings found</p>";

return;

}



snapshot.forEach((ride)=>{


let data=ride.data();


if(data.status=="Completed"){


let fare=Number(data.fare || 0);

total += fare;


list.innerHTML += `

<div class="card">

<h3>
🚕 Ride Completed
</h3>

<p>
📍 ${data.pickup || "N/A"} ➡ ${data.drop || "N/A"}
</p>

<p>
💰 Earned: ₹${fare}
</p>

</div>

`;

}


});


document.getElementById("total").innerHTML="₹"+total;


}

catch(error){

list.innerHTML="Error loading earnings";
console.log(error);

}


}



loadEarnings();


</script>


</body>

</html>
