<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Earnings</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.card{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


.number{

font-size:30px;
color:#ffcc00;
font-weight:bold;

}

</style>


</head>


<body>


<div class="header">

💰 My Earnings

</div>


<div class="container">



<div class="card">

<h3>
Completed Rides
</h3>

<div class="number" id="rides">
0
</div>

</div>



<div class="card">

<h3>
Total Fare
</h3>

<div class="number" id="total">
₹0
</div>

</div>




<div class="card">

<h3>
My Earning
</h3>

<div class="number" id="earning">
₹0
</div>

</div>



</div>






<script type="module">


import {auth,db} from "../firebase/config.js";


import {

collection,
query,
where,
getDocs,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






async function load(){



let user=auth.currentUser;



if(!user)return;




let rides=await getDocs(

query(

collection(db,"rides"),

where("riderId","==",user.uid),

where("status","==","Completed")

)

);





let total=0;



rides.forEach((r)=>{


total += Number(

String(r.data().fare)

.replace("₹","")

);


});






let commission=

await getDoc(

doc(db,"settings","commission")

);



let percent=80;



if(commission.exists()){


percent=

commission.data().riderCommission || 80;


}





let earning=

total*percent/100;





document.getElementById("rides").innerHTML=

rides.size;



document.getElementById("total").innerHTML=

"₹"+total;



document.getElementById("earning").innerHTML=

"₹"+Math.round(earning);



}





load();



</script>


</body>

</html>
