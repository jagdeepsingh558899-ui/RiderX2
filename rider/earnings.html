<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Earnings</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.box{

background:#1d1d1d;
padding:25px;
border-radius:15px;
margin:15px 0;

}


.amount{

font-size:35px;
color:#ffcc00;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

💰 Rider Earnings

</div>



<div class="container">


<div class="box">

<h3>
Total Earnings
</h3>


<div class="amount" id="earning">

₹0

</div>


</div>



<div class="box">

<h3>
Completed Rides
</h3>


<h2 id="rides">

0

</h2>


</div>



<a href="dashboard.html">

⬅ Back Dashboard

</a>


</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs,
query,
where

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function loadEarnings(){



let q=query(

collection(db,"rides"),

where("status","==","Completed")

);



let snap=await getDocs(q);



let total=0;

let count=0;



snap.forEach((ride)=>{


let data=ride.data();



let price=

Number(

String(data.fare)

.replace("₹","")

);



total += price;

count++;



});



document.getElementById("earning").innerHTML=

"₹"+total;



document.getElementById("rides").innerHTML=

count;



}





loadEarnings();



</script>


</body>

</html>
