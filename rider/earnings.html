<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Earnings</title>

<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;
color:white;
font-family:Arial;

}


.header{

background:#111;
padding:20px;
font-size:22px;
border-bottom:2px solid #FFD600;

}



.container{

padding:20px;

}



.total{

background:#FFD600;
color:#000;
padding:20px;
border-radius:20px;
font-size:25px;
font-weight:bold;
margin-bottom:20px;

}



.card{

background:#111;
padding:20px;
border-radius:18px;
margin-bottom:15px;

border:1px solid #333;

}


</style>

</head>


<body>



<div class="header">

💰 Rider Earnings

</div>




<div class="container">



<div class="total">

Total: ₹<span id="total">

0

</span>


</div>



<div id="rideList">

Loading...

</div>



</div>







<script type="module">


import { auth, db } from "../firebase/config.js";


import {

collection,
query,
where,
getDocs

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





auth.onAuthStateChanged(async(user)=>{


if(user){

loadEarnings(user.uid);

}


});






async function loadEarnings(uid){



let list=document.getElementById("rideList");



const q=query(

collection(db,"rides"),

where("riderId","==",uid),

where("status","==","Completed")

);





const snap=

await getDocs(q);





let total=0;



list.innerHTML="";





if(snap.empty){

list.innerHTML=

"<p>No completed rides</p>";

return;

}





snap.forEach((ride)=>{


let data=ride.data();



total += Number(data.fare || 0);




list.innerHTML += `


<div class="card">


<h3>

${data.service || "Ride"}

</h3>


<p>

📍 ${data.pickup || "-"}

</p>


<p>

🏁 ${data.drop || "-"}

</p>



<p>

💰 Fare:

₹${data.fare || 0}

</p>



<p>

Payment:

${data.paymentStatus || "Pending"}

</p>



</div>


`;



});





document.getElementById("total").innerHTML=

total;



}





</script>



</body>

</html>
