<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta name="theme-color" content="#000000">

<title>RiderX | Nearby Rides</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<link
    rel="stylesheet"
    href="../css/style.css"
/>

<style>

:root{
    --yellow:#ffe500;
    --black:#000;
    --dark:#090909;
    --card:#151515;
    --card2:#202020;
    --white:#fff;
    --muted:#888;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
}

body{
    padding-bottom:25px;
}


/* =========================================
   HEADER
========================================= */

.header{

    position:sticky;

    top:0;

    z-index:1000;

    height:64px;

    padding:
        10px
        14px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        rgba(0,0,0,.96);

    border-bottom:
        1px solid
        #292929;

    backdrop-filter:
        blur(14px);

}

.header-left{

    display:flex;

    align-items:center;

    gap:11px;

}

.back-btn{

    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    background:#181818;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:17px;

}

.logo{

    font-size:21px;

    font-weight:900;

}

.logo span{

    color:var(--yellow);

}

.header-location{

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        8px
        11px;

    border-radius:20px;

    background:#171717;

    color:#aaa;

    font-size:10px;

}

.header-location i{

    color:var(--yellow);

}


/* =========================================
   MAP
========================================= */

.map-wrap{

    position:relative;

    width:100%;

    height:42vh;

    min-height:300px;

    background:#ddd;

}

#map{

    width:100%;
    height:100%;

}

.leaflet-control-zoom{

    display:none!important;

}

.leaflet-control-attribution{

    font-size:8px!important;

}


/* =========================================
   MAP OVERLAY
========================================= */

.map-status{

    position:absolute;

    top:14px;

    left:14px;

    right:14px;

    z-index:500;

    display:flex;

    align-items:center;

    justify-content:space-between;

    pointer-events:none;

}

.status-pill{

    padding:
        8px
        12px;

    border-radius:20px;

    background:
        rgba(10,10,10,.92);

    color:#fff;

    font-size:10px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.3);

}

.status-pill i{

    color:var(--green);

    margin-right:5px;

}

.location-btn{

    pointer-events:auto;

    width:44px;
    height:44px;

    border:0;

    border-radius:50%;

    background:#111;

    color:var(--yellow);

    font-size:16px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.4);

}


/* =========================================
   CONTENT
========================================= */

.container{

    width:100%;

    max-width:700px;

    margin:auto;

    padding:
        17px
        14px
        30px;

}

.title-row{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:10px;

    margin-bottom:13px;

}

.title{

    font-size:19px;

    font-weight:800;

}

.subtitle{

    margin-top:4px;

    color:#777;

    font-size:10px;

}

.refresh-btn{

    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    background:#191919;

    color:var(--yellow);

    font-size:15px;

}

.refresh-btn.loading i{

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================
   FILTERS
========================================= */

.filters{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:4px;

    scrollbar-width:none;

}

.filters::-webkit-scrollbar{

    display:none;

}

.filter{

    flex:0 0 auto;

    padding:
        9px
        13px;

    border:
        1px solid
        #303030;

    border-radius:20px;

    background:#141414;

    color:#999;

    font-size:10px;

    font-weight:700;

}

.filter.active{

    background:var(--yellow);

    color:#000;

    border-color:
        var(--yellow);

}


/* =========================================
   RIDE CARDS
========================================= */

#ridesList{

    margin-top:14px;

}

.ride-card{

    padding:15px;

    margin-bottom:10px;

    background:
        linear-gradient(
            145deg,
            #191919,
            #111
        );

    border:
        1px solid
        #292929;

    border-radius:19px;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.2);

}

.ride-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}

.customer{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;

}

.customer-avatar{

    width:43px;
    height:43px;

    min-width:43px;

    border-radius:50%;

    background:
        var(--yellow);

    color:#000;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:900;

    font-size:16px;

}

.customer-name{

    font-size:13px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.service{

    margin-top:4px;

    color:#777;

    font-size:10px;

}

.distance-badge{

    padding:
        7px
        9px;

    border-radius:12px;

    background:#222;

    color:var(--yellow);

    font-size:10px;

    font-weight:800;

    white-space:nowrap;

}

.route{

    margin-top:14px;

    padding:
        12px;

    background:#101010;

    border-radius:14px;

}

.route-row{

    display:flex;

    align-items:flex-start;

    gap:10px;

}

.route-row + .route-row{

    margin-top:10px;

}

.route-icon{

    width:24px;
    height:24px;

    min-width:24px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:9px;

}

.pickup{

    background:#12351f;

    color:#45db78;

}

.drop{

    background:#3a3300;

    color:var(--yellow);

}

.route-text{

    flex:1;

    min-width:0;

}

.route-label{

    color:#666;

    font-size:9px;

    margin-bottom:3px;

}

.route-address{

    color:#ddd;

    font-size:11px;

    line-height:1.4;

}

.ride-bottom{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-top:13px;

    padding-top:12px;

    border-top:1px solid #292929;

}

.fare{

    color:var(--yellow);

    font-size:18px;

    font-weight:900;

}

.payment{

    margin-top:3px;

    color:#777;

    font-size:9px;

}

.accept-btn{

    min-width:110px;

    padding:
        12px
        15px;

    border:0;

    border-radius:13px;

    background:var(--yellow);

    color:#000;

    font-size:11px;

    font-weight:900;

}

.accept-btn:active{

    transform:scale(.97);

}

.accept-btn:disabled{

    background:#444;

    color:#888;

}


/* =========================================
   EMPTY / LOADING
========================================= */

.state{

    padding:
        38px
        18px;

    text-align:center;

    background:#111;

    border:
        1px solid
        #222;

    border-radius:18px;

}

.state-icon{

    width:58px;
    height:58px;

    margin:
        0
        auto
        13px;

    border-radius:50%;

    background:#1c1c1c;

    color:var(--yellow);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

}

.state h3{

    font-size:14px;

}

.state p{

    margin-top:6px;

    color:#777;

    font-size:10px;

    line-height:1.5;

}

.retry-btn{

    margin-top:14px;

    padding:
        10px
        18px;

    border:0;

    border-radius:12px;

    background:var(--yellow);

    color:#000;

    font-size:11px;

    font-weight:800;

}


/* =========================================
   RESPONSIVE
========================================= */

@media(min-width:700px){

    .map-wrap{

        height:480px;

    }

    .container{

        padding-top:24px;

    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-btn"
            type="button"
            aria-label="Back"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="logo">
            RIDER<span>X</span>
        </div>

    </div>


    <div class="header-location">

        <i class="fa-solid fa-location-dot"></i>

        <span>Nearby</span>

    </div>

</header>


<section class="map-wrap">

    <div id="map"></div>

    <div class="map-status">

        <div class="status-pill">

            <i class="fa-solid fa-circle"></i>

            <span id="mapStatus">
                Finding nearby rides...
            </span>

        </div>


        <button
            id="locationButton"
            class="location-btn"
            type="button"
            aria-label="My location"
        >

            <i class="fa-solid fa-location-crosshairs"></i>

        </button>

    </div>

</section>


<main class="container">


    <div class="title-row">

        <div>

            <div class="title">
                Nearby Ride Requests
            </div>

            <div
                id="rideCount"
                class="subtitle"
            >
                Searching for rides around you...
            </div>

        </div>


        <button
            id="refreshButton"
            class="refresh-btn"
            type="button"
            aria-label="Refresh"
        >

            <i class="fa-solid fa-rotate"></i>

        </button>

    </div>


    <div class="filters">

        <button
            class="filter active"
            data-filter="all"
            type="button"
        >
            All
        </button>

        <button
            class="filter"
            data-filter="bike"
            type="button"
        >
            Bike
        </button>

        <button
            class="filter"
            data-filter="cab"
            type="button"
        >
            Cab
        </button>

        <button
            class="filter"
            data-filter="parcel"
            type="button"
        >
            Parcel
        </button>

        <button
            class="filter"
            data-filter="food"
            type="button"
        >
            Food
        </button>

    </div>


    <div id="ridesList">

        <div class="state">

            <div class="state-icon">

                <i class="fa-solid fa-spinner fa-spin"></i>

            </div>

            <h3>
                Finding nearby rides
            </h3>

            <p>
                We're checking for available RiderX requests near your location.
            </p>

        </div>

    </div>


</main>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script type="module">

import {
    auth,
    db
} from "../firebase/config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    collection,
    query,
    where,
    onSnapshot,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const ridesList =
    document.getElementById("ridesList");

const rideCount =
    document.getElementById("rideCount");

const refreshButton =
    document.getElementById("refreshButton");

const mapStatus =
    document.getElementById("mapStatus");

const locationButton =
    document.getElementById("locationButton");

const backButton =
    document.getElementById("backButton");


let currentUser = null;

let currentFilter = "all";

let allRides = [];

let unsubscribeRides = null;

let riderLocation = null;

let riderMarker = null;

let rideMarkers = [];

let map = null;


/* =========================================
   BACK
========================================= */

backButton?.addEventListener(
    "click",
    () => {

        history.back();

    }
);


/* =========================================
   MAP
========================================= */

function initMap(){

    map =
        L.map("map",{
            zoomControl:false
        }).setView(
            [30.7333,76.7794],
            13
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);


    setTimeout(
        () => map.invalidateSize(),
        300
    );

}


initMap();


/* =========================================
   CURRENT LOCATION
========================================= */

function locateRider(){

    if(!navigator.geolocation){

        mapStatus.textContent =
            "Location unavailable";

        return;

    }


    mapStatus.textContent =
        "Getting your location...";


    navigator.geolocation.getCurrentPosition(

        position => {

            riderLocation = {

                lat:
                    position.coords.latitude,

                lng:
                    position.coords.longitude

            };


            if(riderMarker){

                riderMarker.setLatLng([
                    riderLocation.lat,
                    riderLocation.lng
                ]);

            }else{

                riderMarker =
                    L.marker([
                        riderLocation.lat,
                        riderLocation.lng
                    ])
                    .addTo(map)
                    .bindPopup(
                        "Your location"
                    );

            }


            map.setView(
                [
                    riderLocation.lat,
                    riderLocation.lng
                ],
                14
            );


            mapStatus.textContent =
                "Nearby rides";

        },

        error => {

            console.warn(
                "Location error:",
                error
            );

            mapStatus.textContent =
                "Location permission needed";

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:30000
        }

    );

}


locationButton?.addEventListener(
    "click",
    locateRider
);


locateRider();


/* =========================================
   DISTANCE
========================================= */

function distanceKm(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;

    const dLat =
        (lat2-lat1) *
        Math.PI / 180;

    const dLon =
        (lon2-lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat/2) ** 2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2) ** 2;

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;

}


/* =========================================
   FORMAT
========================================= */

function formatService(service){

    const value =
        String(service || "bike")
        .toLowerCase();

    if(value === "cab")
        return "Cab";

    if(value === "parcel")
        return "Parcel";

    if(value === "food")
        return "Food";

    return "Bike";

}


function customerName(data){

    return (
        data.customerName ||
        data.userName ||
        data.name ||
        "Customer"
    );

}


function getRideLat(data){

    return Number(
        data.pickupLat ??
        data.pickupLatitude ??
        data.fromLat ??
        data.customerLat ??
        NaN
    );

}


function getRideLng(data){

    return Number(
        data.pickupLng ??
        data.pickupLongitude ??
        data.fromLng ??
        data.customerLng ??
        NaN
    );

}


function pickupText(data){

    return (
        data.pickupAddress ||
        data.pickupLocation ||
        data.from ||
        "Pickup location"
    );

}


function dropText(data){

    return (
        data.dropoffAddress ||
        data.dropoffLocation ||
        data.destination ||
        data.to ||
        "Destination"
    );

}


function rideFare(data){

    return Number(
        data.fare ??
        data.estimatedFare ??
        data.amount ??
        0
    );

}


function paymentText(data){

    const method =
        String(
            data.paymentMethod ||
            "cash"
        ).toLowerCase();

    if(method === "online")
        return "UPI / Online";

    if(method === "wallet")
        return "RiderX Wallet";

    return "Cash";

}


/* =========================================
   FILTER
========================================= */

document
    .querySelectorAll(".filter")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".filter")
                    .forEach(
                        item =>
                            item.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                currentFilter =
                    button.dataset.filter ||
                    "all";


                renderRides();

            }
        );

    });


/* =========================================
   RIDE MARKERS
========================================= */

function clearRideMarkers(){

    rideMarkers.forEach(
        marker => map.removeLayer(marker)
    );

    rideMarkers = [];

}


function renderMarkers(rides){

    clearRideMarkers();


    rides.forEach(
        ride => {

            const data =
                ride.data;

            const lat =
                getRideLat(data);

            const lng =
                getRideLng(data);


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ){

                return;

            }


            const marker =
                L.marker([
                    lat,
                    lng
                ])
                .addTo(map);


            marker.bindPopup(
                `
                <strong>RiderX Ride</strong><br>
                ${pickupText(data)}
                `
            );


            rideMarkers.push(
                marker
            );

        }
    );

}


/* =========================================
   RENDER RIDES
========================================= */

function renderRides(){

    let rides =
        [...allRides];


    if(currentFilter !== "all"){

        rides =
            rides.filter(
                ride => {

                    const service =
                        String(
                            ride.data.service ||
                            ride.data.serviceType ||
                            "bike"
                        )
                        .toLowerCase();

                    return (
                        service ===
                        currentFilter
                    );

                }
            );

    }


    rideCount.textContent =
        `${rides.length} ride${rides.length === 1 ? "" : "s"} available nearby`;


    if(!rides.length){

        ridesList.innerHTML =
            `
            <div class="state">

                <div class="state-icon">
                    <i class="fa-solid fa-route"></i>
                </div>

                <h3>
                    No nearby rides
                </h3>

                <p>
                    No ride requests match your current filter.
                    Try again in a few moments.
                </p>

                <button
                    class="retry-btn"
                    id="emptyRefresh"
                    type="button"
                >
                    Refresh
                </button>

            </div>
            `;


        document
            .getElementById("emptyRefresh")
            ?.addEventListener(
                "click",
                loadRides
            );


        renderMarkers([]);

        return;

    }


    ridesList.innerHTML =
        rides
        .map(
            ride => {

                const data =
                    ride.data;

                const name =
                    customerName(data);

                const service =
                    formatService(
                        data.service ||
                        data.serviceType
                    );

                const fare =
                    rideFare(data);

                const payment =
                    paymentText(data);

                const lat =
                    getRideLat(data);

                const lng =
                    getRideLng(data);


                let distanceText =
                    "Nearby";


                if(
                    riderLocation &&
                    Number.isFinite(lat) &&
                    Number.isFinite(lng)
                ){

                    const km =
                        distanceKm(
                            riderLocation.lat,
                            riderLocation.lng,
                            lat,
                            lng
                        );


                    distanceText =
                        km < 1
                            ? `${Math.round(km*1000)} m`
                            : `${km.toFixed(1)} km`;

                }


                const initial =
                    name
                        .trim()
                        .charAt(0)
                        .toUpperCase() ||
                    "C";


                return `

                <article
                    class="ride-card"
                    data-id="${ride.id}"
                >

                    <div class="ride-top">

                        <div class="customer">

                            <div class="customer-avatar">
                                ${initial}
                            </div>

                            <div>

                                <div class="customer-name">
                                    ${escapeHtml(name)}
                                </div>

                                <div class="service">
                                    ${service} Ride
                                </div>

                            </div>

                        </div>


                        <div class="distance-badge">
                            ${distanceText}
                        </div>

                    </div>


                    <div class="route">

                        <div class="route-row">

                            <div class="route-icon pickup">
                                <i class="fa-solid fa-circle"></i>
                            </div>

                            <div class="route-text">

                                <div class="route-label">
                                    PICKUP
                                </div>

                                <div class="route-address">
                                    ${escapeHtml(
                                        pickupText(data)
                                    )}
                                </div>

                            </div>

                        </div>


                        <div class="route-row">

                            <div class="route-icon drop">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>

                            <div class="route-text">

                                <div class="route-label">
                                    DESTINATION
                                </div>

                                <div class="route-address">
                                    ${escapeHtml(
                                        dropText(data)
                                    )}
                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="ride-bottom">

                        <div>

                            <div class="fare">
                                ₹${fare.toFixed(0)}
                            </div>

                            <div class="payment">
                                ${payment}
                            </div>

                        </div>


                        <button
                            class="accept-btn"
                            data-ride-id="${ride.id}"
                            type="button"
                        >
                            Accept Ride
                        </button>

                    </div>

                </article>

                `;

            }
        )
        .join("");


    document
        .querySelectorAll(".accept-btn")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        acceptRide(
                            button.dataset.rideId,
                            button
                        );

                    }
                );

            }
        );


    renderMarkers(rides);

}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================
   ACCEPT RIDE
========================================= */

async function acceptRide(
    rideId,
    button
){

    if(!currentUser){

        alert(
            "Please login first."
        );

        return;

    }


    const ride =
        allRides.find(
            item =>
                item.id === rideId
        );


    if(!ride){

        alert(
            "Ride is no longer available."
        );

        return;

    }


    const data =
        ride.data;


    const status =
        String(
            data.status ||
            "searching"
        )
        .toLowerCase();


    if(
        ![
            "searching",
            "requested",
            "pending"
        ].includes(status)
    ){

        alert(
            "This ride is no longer available."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Accepting...";


    try{

        await updateDoc(
            doc(
                db,
                "rides",
                rideId
            ),
            {
                riderId:
                    currentUser.uid,

                riderAcceptedAt:
                    serverTimestamp(),

                status:
                    "ACCEPTED",

                updatedAt:
                    serverTimestamp()
            }
        );


        button.textContent =
            "Accepted ✓";


        setTimeout(
            () => {

                location.href =
                    `ride-request.html?id=${encodeURIComponent(rideId)}`;

            },
            500
        );


    }catch(error){

        console.error(
            "Accept ride error:",
            error
        );


        button.disabled = false;

        button.textContent =
            "Accept Ride";


        alert(
            "Ride could not be accepted. It may already have been accepted by another rider."
        );

    }

}


/* =========================================
   FIRESTORE RIDES
========================================= */

function subscribeRides(){

    if(unsubscribeRides){

        unsubscribeRides();

        unsubscribeRides = null;

    }


    const ridesQuery =
        query(
            collection(
                db,
                "rides"
            ),
            where(
                "status",
                "in",
                [
                    "searching",
                    "SEARCHING",
                    "REQUESTED",
                    "PENDING"
                ]
            )
        );


    unsubscribeRides =
        onSnapshot(
            ridesQuery,

            snapshot => {

                allRides =
                    snapshot.docs
                    .map(
                        item => ({
                            id:item.id,
                            data:item.data()
                        })
                    )
                    .filter(
                        ride => {

                            const data =
                                ride.data;


                            /*
                             * Do not show rides
                             * already assigned to
                             * another rider.
                             */

                            const riderId =
                                data.riderId;


                            return (
                                !riderId ||
                                riderId === "" ||
                                riderId === null ||
                                riderId === currentUser?.uid
                            );

                        }
                    );


                renderRides();

            },

            error => {

                console.error(
                    "Ride listener error:",
                    error
                );


                ridesList.innerHTML =
                    `
                    <div class="state">

                        <div class="state-icon">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                        </div>

                        <h3>
                            Unable to load rides
                        </h3>

                        <p>
                            Please check your connection and try again.
                        </p>

                        <button
                            class="retry-btn"
                            id="errorRefresh"
                            type="button"
                        >
                            Try Again
                        </button>

                    </div>
                    `;


                document
                    .getElementById("errorRefresh")
                    ?.addEventListener(
                        "click",
                        loadRides
                    );

            }
        );

}


/* =========================================
   LOAD
========================================= */

function loadRides(){

    refreshButton?.classList.add(
        "loading"
    );


    mapStatus.textContent =
        "Refreshing rides...";


    if(currentUser){

        subscribeRides();

    }


    locateRider();


    setTimeout(
        () => {

            refreshButton?.classList.remove(
                "loading"
            );

            mapStatus.textContent =
                "Nearby rides";

        },
        800
    );

}


refreshButton?.addEventListener(
    "click",
    loadRides
);


/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            location.href =
                "../auth/login.html";

            return;

        }


        currentUser =
            user;


        subscribeRides();

    }
);


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(unsubscribeRides){

            unsubscribeRides();

        }

    }
);

</script>
