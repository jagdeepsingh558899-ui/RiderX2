<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<meta
    name="theme-color"
    content="#000000"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<title>RiderX | Online</title>


<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
    rel="stylesheet"
    href="../css/style.css"
>


<style>

:root{
    --yellow:#ffe500;
    --black:#000;
    --dark:#090909;
    --card:#151515;
    --green:#22c55e;
    --red:#ef4444;
    --muted:#888;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Poppins,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
}

body{
    position:fixed;
    inset:0;
}


/* =========================================================
   MAP
========================================================= */

#map{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    background:#ddd;
}

.leaflet-control-zoom{
    display:none!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
    padding:2px 4px!important;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:fixed;

    top:0;
    left:0;
    right:0;

    z-index:1000;

    padding:
        max(12px,env(safe-area-inset-top))
        14px
        0;

    pointer-events:none;
}

.topbar-inner{
    height:52px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-btn{
    width:45px;
    height:45px;

    border:0;
    border-radius:50%;

    background:rgba(10,10,10,.95);
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;

    box-shadow:
        0 6px 22px rgba(0,0,0,.4);

    pointer-events:auto;

    cursor:pointer;
}

.top-btn:active{
    transform:scale(.92);
}

.logo{
    padding:8px 17px;

    border-radius:15px;

    background:rgba(10,10,10,.95);

    font-size:17px;
    font-weight:900;

    box-shadow:
        0 6px 22px rgba(0,0,0,.4);
}

.logo span{
    color:var(--yellow);
}


/* =========================================================
   STATUS
========================================================= */

.status-pill{
    position:fixed;

    top:
        calc(
            max(12px,env(safe-area-inset-top))
            + 61px
        );

    left:50%;

    transform:translateX(-50%);

    z-index:1000;

    padding:8px 16px;

    max-width:90%;

    border-radius:30px;

    background:rgba(10,10,10,.95);

    color:#aaa;

    font-size:11px;

    white-space:nowrap;

    box-shadow:
        0 5px 20px rgba(0,0,0,.35);
}

.status-pill.online{
    color:var(--green);
}

.status-pill.offline{
    color:#aaa;
}


/* =========================================================
   LOCATION BUTTON
========================================================= */

.location-btn{
    position:fixed;

    right:15px;

    bottom:305px;

    z-index:900;

    width:48px;
    height:48px;

    border:0;
    border-radius:50%;

    background:#111;
    color:var(--yellow);

    font-size:18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.45);

    cursor:pointer;
}

.location-btn:active{
    transform:scale(.92);
}

.location-btn:disabled{
    opacity:.55;
}


/* =========================================================
   BOTTOM PANEL
========================================================= */

.panel{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:1000;

    padding:
        12px
        14px
        max(16px,env(safe-area-inset-bottom));

    background:rgba(9,9,9,.98);

    border-radius:
        27px
        27px
        0
        0;

    box-shadow:
        0 -12px 40px rgba(0,0,0,.55);
}


/* =========================================================
   HANDLE
========================================================= */

.handle{
    width:48px;
    height:5px;

    margin:0 auto 13px;

    border-radius:10px;

    background:#555;
}


/* =========================================================
   STATUS CARD
========================================================= */

.status-card{
    display:flex;

    align-items:center;

    gap:12px;

    padding:13px;

    background:#151515;

    border:1px solid #242424;

    border-radius:17px;
}

.status-icon{
    width:45px;
    height:45px;

    min-width:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:#242424;

    color:#777;

    font-size:19px;
}

.status-card.online .status-icon{
    color:var(--green);
    background:#102517;
}

.status-info{
    flex:1;
    min-width:0;
}

.status-title{
    font-size:14px;
    font-weight:800;
}

.status-description{
    margin-top:4px;

    color:#777;

    font-size:10px;

    line-height:1.4;
}

.status-light{
    width:11px;
    height:11px;

    min-width:11px;

    border-radius:50%;

    background:#555;

    box-shadow:
        0 0 0 4px #242424;
}

.status-card.online .status-light{
    background:var(--green);

    box-shadow:
        0 0 0 4px #12351f;
}


/* =========================================================
   ONLINE BUTTON
========================================================= */

.online-btn{
    width:100%;

    min-height:55px;

    margin-top:12px;

    border:0;
    border-radius:16px;

    background:var(--yellow);
    color:#000;

    font-size:15px;
    font-weight:900;

    box-shadow:
        0 6px 22px
        rgba(255,229,0,.12);

    transition:
        transform .15s ease,
        background .2s ease,
        opacity .2s ease;

    cursor:pointer;
}

.online-btn:active{
    transform:scale(.985);
}

.online-btn.offline{
    background:#262626;
    color:#fff;

    box-shadow:none;
}

.online-btn:disabled{
    opacity:.55;
    cursor:wait;
}


/* =========================================================
   INFO ROW
========================================================= */

.info-row{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    margin-top:10px;
}

.info{
    padding:10px 7px;

    background:#121212;

    border-radius:13px;

    text-align:center;

    min-width:0;
}

.info-label{
    color:#666;
    font-size:8px;
}

.info-value{
    margin-top:4px;

    color:#fff;

    font-size:11px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav-row{
    display:flex;

    gap:8px;

    margin-top:10px;
}

.nav-btn{
    flex:1;

    min-height:42px;

    border:1px solid #292929;

    border-radius:13px;

    background:#151515;

    color:#aaa;

    font-size:10px;
    font-weight:700;

    cursor:pointer;
}

.nav-btn i{
    margin-right:4px;
}

.nav-btn:active{
    transform:scale(.97);
}


/* =========================================================
   ERROR
========================================================= */

.error-box{
    display:none;

    margin-top:9px;

    padding:10px;

    border-radius:12px;

    background:#210d0d;

    color:#ff7777;

    font-size:10px;

    text-align:center;

    line-height:1.4;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .panel{
        left:50%;
        right:auto;

        width:520px;

        transform:translateX(-50%);

        border-radius:
            27px
            27px
            0
            0;
    }

}


/* =========================================================
   SMALL DEVICES
========================================================= */

@media(max-height:680px){

    .panel{
        padding-top:8px;
    }

    .handle{
        margin-bottom:8px;
    }

    .status-card{
        padding:9px;
    }

    .status-icon{
        width:38px;
        height:38px;
        min-width:38px;
    }

    .online-btn{
        min-height:48px;
    }

    .info{
        padding:7px 5px;
    }

    .nav-btn{
        min-height:38px;
    }

}

</style>

</head>


<body>

     MAP

<div class="topbar">

        <button

<!-- =======================================================

<div
    id="statusPill"

>

<!-- =======================================================
     LOCATION BUTTON

<button
    id="locationButton"

    type="button"
    aria-label="My location"
>

<div class="panel">

        <div class="status-icon">

<!-- =======================================================
     LEAFLET
======================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- =======================================================
     FIREBASE
======================================================== -->

<script type="module">

"use strict";


/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    auth,
    db
} from "firebase/firebase-config.js";

import {
    doc,
    setDoc,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================================================
   CONSTANTS
========================================================= */

const DEFAULT_LOCATION = [
    30.7333,
    76.7794
];

const DEFAULT_ZOOM = 13;

const RIDER_ZOOM = 16;

const LOCATION_SAVE_INTERVAL = 4000;

const GPS_TIMEOUT = 15000;

const GPS_MAXIMUM_AGE = 5000;

const WATCH_MAXIMUM_AGE = 3000;


/* =========================================================
   ELEMENTS
========================================================= */

const statusPill =
    document.getElementById("statusPill");

const statusCard =
    document.getElementById("statusCard");

const statusIcon =
    document.getElementById("statusIcon");

const statusTitle =
    document.getElementById("statusTitle");

const statusDescription =
    document.getElementById("statusDescription");

const onlineButton =
    document.getElementById("onlineButton");

const onlineButtonText =
    document.getElementById("onlineButtonText");

const gpsValue =
    document.getElementById("gpsValue");

const latValue =
    document.getElementById("latValue");

const lngValue =
    document.getElementById("lngValue");

const errorBox =
    document.getElementById("errorBox");

const locationButton =
    document.getElementById("locationButton");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let isOnline = false;

let watchId = null;

let riderMarker = null;

let accuracyCircle = null;

let map = null;

let lastPosition = null;

let lastSavedAt = 0;

let authReady = false;

let toggleInProgress = false;

let pageActive = true;


/* =========================================================
   MAP INITIALIZATION
========================================================= */

function initializeMap(){

    if(
        typeof L === "undefined"
    ){

        console.error(
            "Leaflet failed to load."
        );

        showError(
            "Map failed to load. Please check your internet connection."
        );

        return;

    }


    map =
        L.map(
            "map",
            {
                zoomControl:false,
                attributionControl:true
            }
        );


    map.setView(
        DEFAULT_LOCATION,
        DEFAULT_ZOOM
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"&copy; OpenStreetMap"
        }
    ).addTo(map);


    setTimeout(
        () => {

            if(map){

                map.invalidateSize();

            }

        },
        300
    );

}


initializeMap();


/* =========================================================
   RIDER MAP ICON
========================================================= */

const riderIcon =
    L.divIcon({

        className:"rider-location-marker",

        html:`

            <div style="
                width:44px;
                height:44px;
                border-radius:50%;
                background:#ffe500;
                border:4px solid #000;
                display:flex;
                align-items:center;
                justify-content:center;
                box-shadow:0 5px 18px rgba(0,0,0,.45);
                color:#000;
                font-size:19px;
            ">

                <i class="fa-solid fa-motorcycle"></i>

            </div>

        `,

        iconSize:[
            44,
            44
        ],

        iconAnchor:[
            22,
            22
        ]

    });


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        authReady = true;


        if(!user){

            currentUser = null;

            isOnline = false;

            stopLocationTracking();

            updateUI();

            location.href =
                "../auth/login.html";

            return;

        }


        currentUser =
            user;


        try{

            await loadRiderStatus(
                user.uid
            );

        }catch(error){

            console.error(
                "Authentication rider load error:",
                error
            );

            isOnline = false;

            updateUI();

            showError(
                "Unable to load rider account."
            );

        }

    }
);


/* =========================================================
   LOAD RIDER STATUS
========================================================= */

async function loadRiderStatus(uid){

    if(!uid){

        throw new Error(
            "Invalid rider ID."
        );

    }


    const riderSnap =
        await getDoc(
            doc(
                db,
                "riders",
                uid
            )
        );


    if(
        !riderSnap.exists()
    ){

        isOnline = false;

        updateUI();

        return;

    }


    const data =
        riderSnap.data() || {};


    /*
     * Support both fields because
     * older RiderX records may contain
     * either one.
     */

    const onlineValue =
        data.online === true ||
        data.isOnline === true;


    isOnline =
        onlineValue;


    updateUI();


    if(isOnline){

        /*
         * Existing online rider must
         * resume GPS tracking.
         */

        startLocationTracking();

    }else{

        stopLocationTracking();

    }

}


/* =========================================================
   UI UPDATE
========================================================= */

function updateUI(){

    if(isOnline){

        statusPill.textContent =
            "● Online";

        statusPill.className =
            "status-pill online";


        statusCard.classList.add(
            "online"
        );


        statusIcon.className =
            "fa-solid fa-circle-check";


        statusTitle.textContent =
            "You're Online";


        statusDescription.textContent =
            "You're ready to receive RiderX ride requests.";


        onlineButton.classList.add(
            "offline"
        );


        onlineButtonText.textContent =
            "Go Offline";


    }else{

        statusPill.textContent =
            "Offline";

        statusPill.className =
            "status-pill offline";


        statusCard.classList.remove(
            "online"
        );


        statusIcon.className =
            "fa-solid fa-power-off";


        statusTitle.textContent =
            "You're Offline";


        statusDescription.textContent =
            "Go online to receive RiderX ride requests.";


        onlineButton.classList.remove(
            "offline"
        );


        onlineButtonText.textContent =
            "Go Online";

    }

}


/* =========================================================
   ONLINE / OFFLINE BUTTON
========================================================= */

onlineButton.addEventListener(
    "click",
    async () => {

        if(
            !currentUser ||
            !authReady ||
            toggleInProgress
        ){

            return;

        }


        hideError();


        toggleInProgress =
            true;


        onlineButton.disabled =
            true;


        if(isOnline){

            onlineButtonText.textContent =
                "Going Offline...";

        }else{

            onlineButtonText.textContent =
                "Getting GPS...";

        }


        try{

            if(isOnline){

                await setRiderOffline();

            }else{

                await setRiderOnline();

            }

        }catch(error){

            console.error(
                "Online toggle error:",
                error
            );


            showError(
                error?.message ||
                "Unable to change online status."
            );

        }finally{

            toggleInProgress =
                false;

            onlineButton.disabled =
                false;

            updateUI();

        }

    }
);


/* =========================================================
   GO ONLINE
========================================================= */

async function setRiderOnline(){

    if(!currentUser){

        throw new Error(
            "Authentication session expired. Please login again."
        );

    }


    if(!navigator.geolocation){

        throw new Error(
            "GPS is not supported on this device."
        );

    }


    gpsValue.textContent =
        "Locating...";


    const position =
        await getCurrentPosition();


    if(!position){

        throw new Error(
            "Unable to determine your location."
        );

    }


    const coordinates =
        getValidCoordinates(
            position
        );


    if(!coordinates){

        throw new Error(
            "Invalid GPS coordinates received."
        );

    }


    const {
        lat,
        lng
    } =
        coordinates;


    lastPosition =
        position;


    /*
     * Write rider status and first
     * valid GPS position.
     */

    await setDoc(
        doc(
            db,
            "riders",
            currentUser.uid
        ),
        {
            online:true,

            isOnline:true,

            lat:lat,

            lng:lng,

            location:{
                lat:lat,
                lng:lng
            },

            accuracy:
                getAccuracy(
                    position
                ),

            heading:
                getHeading(
                    position
                ),

            speed:
                getSpeed(
                    position
                ),

            locationUpdatedAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp()

        },
        {
            merge:true
        }
    );


    /*
     * Active rider location.
     */

    try{

        await setDoc(
            doc(
                db,
                "riderLocations",
                currentUser.uid
            ),
            {
                riderId:
                    currentUser.uid,

                lat:lat,

                lng:lng,

                accuracy:
                    getAccuracy(
                        position
                    ),

                heading:
                    getHeading(
                        position
                    ),

                speed:
                    getSpeed(
                        position
                    ),

                online:true,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );

    }catch(error){

        /*
         * Roll back rider status if
         * active-location creation fails.
         */

        try{

            await setDoc(
                doc(
                    db,
                    "riders",
                    currentUser.uid
                ),
                {
                    online:false,
                    isOnline:false,
                    updatedAt:
                        serverTimestamp()
                },
                {
                    merge:true
                }
            );

        }catch(rollbackError){

            console.error(
                "Online rollback error:",
                rollbackError
            );

        }


        throw new Error(
            "Unable to publish your location. Please check your internet connection and try again."
        );

    }


    isOnline =
        true;


    lastSavedAt =
        Date.now();


    updatePosition(
        position,
        true
    );


    updateUI();


    startLocationTracking();


    showToast(
        "You're now online"
    );

}


/* =========================================================
   GO OFFLINE
========================================================= */

async function setRiderOffline(){

    if(!currentUser){

        return;

    }


    /*
     * Stop GPS immediately so new
     * location updates are not created.
     */

    stopLocationTracking();


    const uid =
        currentUser.uid;


    /*
     * Keep previous state until both
     * Firestore operations succeed.
     */

    try{

        await setDoc(
            doc(
                db,
                "riders",
                uid
            ),
            {
                online:false,

                isOnline:false,

                locationUpdatedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        await setDoc(
            doc(
                db,
                "riderLocations",
                uid
            ),
            {
                riderId:
                    uid,

                online:false,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        isOnline =
            false;


        lastSavedAt =
            0;


        updateUI();


        showToast(
            "You're now offline"
        );

    }catch(error){

        /*
         * Firestore failed. Restore GPS
         * tracking because rider may still
         * be online in Firestore.
         */

        isOnline =
            true;


        startLocationTracking();


        throw new Error(
            "Unable to go offline. Please check your internet connection and try again."
        );

    }

}


/* =========================================================
   GET CURRENT POSITION
========================================================= */

function getCurrentPosition(){

    return new Promise(
        (resolve,reject) => {

            if(
                !navigator.geolocation
            ){

                reject(
                    new Error(
                        "GPS is not supported on this device."
                    )
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                position => {

                    if(
                        !position ||
                        !getValidCoordinates(
                            position
                        )
                    ){

                        reject(
                            new Error(
                                "Invalid GPS location received."
                            )
                        );

                        return;

                    }


                    resolve(
                        position
                    );

                },

                error => {

                    let message =
                        "Unable to get your location.";


                    if(
                        error?.code ===
                        error.PERMISSION_DENIED
                    ){

                        message =
                            "Location permission denied. Please allow location permission for RiderX.";

                    }else if(
                        error?.code ===
                        error.POSITION_UNAVAILABLE
                    ){

                        message =
                            "Location unavailable. Please turn on GPS and try again.";

                    }else if(
                        error?.code ===
                        error.TIMEOUT
                    ){

                        message =
                            "GPS request timed out. Please try again.";

                    }


                    reject(
                        new Error(
                            message
                        )
                    );

                },

                {
                    enableHighAccuracy:true,

                    timeout:
                        GPS_TIMEOUT,

                    maximumAge:
                        GPS_MAXIMUM_AGE

                }

            );

        }
    );

}


/* =========================================================
   VALID COORDINATES
========================================================= */

function getValidCoordinates(
    position
){

    if(!position?.coords){

        return null;

    }


    const lat =
        Number(
            position.coords.latitude
        );

    const lng =
        Number(
            position.coords.longitude
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return null;

    }


    if(
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
    ){

        return null;

    }


    return {
        lat,
        lng
    };

}


/* =========================================================
   POSITION HELPERS
========================================================= */

function getAccuracy(
    position
){

    const value =
        Number(
            position?.coords?.accuracy
        );


    return Number.isFinite(value) &&
        value >= 0
        ? value
        : null;

}


function getHeading(
    position
){

    const value =
        Number(
            position?.coords?.heading
        );


    return Number.isFinite(value)
        ? value
        : null;

}


function getSpeed(
    position
){

    const value =
        Number(
            position?.coords?.speed
        );


    return Number.isFinite(value)
        ? value
        : null;

}


/* =========================================================
   START LIVE LOCATION TRACKING
========================================================= */

function startLocationTracking(){

    if(
        !navigator.geolocation ||
        !currentUser ||
        !isOnline
    ){

        return;

    }


    /*
     * Prevent duplicate watchers.
     */

    if(
        watchId !== null
    ){

        return;

    }


    watchId =
        navigator.geolocation.watchPosition(

            position => {

                if(
                    !isOnline ||
                    !currentUser
                ){

                    return;

                }


                if(
                    !getValidCoordinates(
                        position
                    )
                ){

                    return;

                }


                lastPosition =
                    position;


                updatePosition(
                    position,
                    false
                );


                saveLiveLocation(
                    position
                );

            },

            error => {

                console.warn(
                    "GPS watch error:",
                    error
                );


                if(
                    error?.code ===
                    error.PERMISSION_DENIED
                ){

                    gpsValue.textContent =
                        "Permission";

                    showError(
                        "Location permission is required while you are online."
                    );

                }else if(
                    error?.code ===
                    error.POSITION_UNAVAILABLE
                ){

                    gpsValue.textContent =
                        "Unavailable";

                }else if(
                    error?.code ===
                    error.TIMEOUT
                ){

                    gpsValue.textContent =
                        "Timeout";

                }else{

                    gpsValue.textContent =
                        "GPS Error";

                }

            },

            {
                enableHighAccuracy:true,

                timeout:
                    GPS_TIMEOUT,

                maximumAge:
                    WATCH_MAXIMUM_AGE

            }

        );

}


/* =========================================================
   STOP LIVE LOCATION TRACKING
========================================================= */

function stopLocationTracking(){

    if(
        watchId !== null &&
        navigator.geolocation
    ){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId =
            null;

    }

}


/* =========================================================
   UPDATE MAP POSITION
========================================================= */

function updatePosition(
    position,
    centerMap
){

    if(!position){

        return;

    }


    const coordinates =
        getValidCoordinates(
            position
        );


    if(!coordinates){

        return;

    }


    const lat =
        coordinates.lat;

    const lng =
        coordinates.lng;


    const accuracy =
        Math.max(
            0,
            getAccuracy(
                position
            ) || 0
        );


    lastPosition =
        position;


    latValue.textContent =
        lat.toFixed(5);


    lngValue.textContent =
        lng.toFixed(5);


    gpsValue.textContent =
        accuracy > 0
            ? `${Math.round(accuracy)}m`
            : "Active";


    const latLng =
        [
            lat,
            lng
        ];


    /*
     * Rider marker.
     */

    if(!riderMarker){

        if(!map){

            return;

        }


        riderMarker =
            L.marker(
                latLng,
                {
                    icon:riderIcon,
                    keyboard:false
                }
            ).addTo(map);

    }else{

        riderMarker.setLatLng(
            latLng
        );

    }


    /*
     * Accuracy circle.
     */

    if(
        map &&
        accuracy > 0 &&
        accuracy < 1000
    ){

        if(!accuracyCircle){

            accuracyCircle =
                L.circle(
                    latLng,
                    {
                        radius:accuracy,

                        color:"#ffe500",

                        fillColor:"#ffe500",

                        fillOpacity:.08,

                        weight:1
                    }
                ).addTo(map);

        }else{

            accuracyCircle.setLatLng(
                latLng
            );

            accuracyCircle.setRadius(
                accuracy
            );

        }

    }


    /*
     * Center map only when explicitly
     * requested or when first GPS lock
     * is obtained.
     */

    if(
        centerMap &&
        map
    ){

        map.setView(
            latLng,
            RIDER_ZOOM,
            {
                animate:true
            }
        );

    }

}


/* =========================================================
   SAVE LIVE LOCATION
========================================================= */

async function saveLiveLocation(
    position
){

    if(
        !currentUser ||
        !isOnline ||
        !position
    ){

        return;

    }


    const coordinates =
        getValidCoordinates(
            position
        );


    if(!coordinates){

        return;

    }


    const now =
        Date.now();


    /*
     * Limit Firestore writes.
     */

    if(
        now - lastSavedAt <
        LOCATION_SAVE_INTERVAL
    ){

        return;

    }


    const lat =
        coordinates.lat;

    const lng =
        coordinates.lng;


    /*
     * Only update timestamp after
     * successful Firestore writes.
     */

    const locationData = {

        riderId:
            currentUser.uid,

        lat:lat,

        lng:lng,

        accuracy:
            getAccuracy(
                position
            ),

        heading:
            getHeading(
                position
            ),

        speed:
            getSpeed(
                position
            ),

        online:true,

        updatedAt:
            serverTimestamp()

    };


    try{

        /*
         * Active rider location.
         */

        await setDoc(
            doc(
                db,
                "riderLocations",
                currentUser.uid
            ),
            locationData,
            {
                merge:true
            }
        );


        /*
         * Rider profile/status.
         */

        await setDoc(
            doc(
                db,
                "riders",
                currentUser.uid
            ),
            {
                online:true,

                isOnline:true,

                lat:lat,

                lng:lng,

                location:{
                    lat:lat,
                    lng:lng
                },

                accuracy:
                    getAccuracy(
                        position
                    ),

                heading:
                    getHeading(
                        position
                    ),

                speed:
                    getSpeed(
                        position
                    ),

                locationUpdatedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        lastSavedAt =
            now;

    }catch(error){

        console.error(
            "Live location save error:",
            error
        );

        /*
         * Do not mark rider offline on
         * temporary network failure.
         */

    }

}


/* =========================================================
   MY LOCATION BUTTON
========================================================= */

locationButton.addEventListener(
    "click",
    async () => {

        if(
            !currentUser ||
            !authReady
        ){

            showError(
                "Please wait for authentication."
            );

            return;

        }


        hideError();


        locationButton.disabled =
            true;


        const previousText =
            gpsValue.textContent;


        gpsValue.textContent =
            "Locating...";


        try{

            const position =
                await getCurrentPosition();


            lastPosition =
                position;


            updatePosition(
                position,
                true
            );


            if(isOnline){

                await saveLiveLocation(
                    position
                );

            }

        }catch(error){

            gpsValue.textContent =
                previousText;


            showError(
                error?.message ||
                "Unable to get your location."
            );

        }finally{

            locationButton.disabled =
                false;

        }

    }
);

/* =========================================================
   ERROR
========================================================= */

function showError(
    message
){

    errorBox.textContent =
        String(
            message ||
            "Something went wrong."
        );


    errorBox.style.display =
        "block";

}


function hideError(){

    errorBox.textContent =
        "";

    errorBox.style.display =
        "none";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message
){

    const existing =
        document.getElementById(
            "riderxToast"
        );


    if(existing){

        existing.remove();

    }


    const toast =
        document.createElement(
            "div"
        );


    toast.id =
        "riderxToast";


    toast.textContent =
        String(
            message ||
            ""
        );


    toast.style.position =
        "fixed";

    toast.style.left =
        "50%";

    toast.style.bottom =
        "300px";

    toast.style.transform =
        "translateX(-50%)";

    toast.style.zIndex =
        "2000";

    toast.style.padding =
        "11px 17px";

    toast.style.borderRadius =
        "13px";

    toast.style.background =
        "#222";

    toast.style.color =
        "#fff";

    toast.style.fontSize =
        "11px";

    toast.style.fontWeight =
        "700";

    toast.style.boxShadow =
        "0 8px 30px rgba(0,0,0,.4)";

    toast.style.pointerEvents =
        "none";


    document.body.appendChild(
        toast
    );


    setTimeout(
        () => {

            if(
                toast.isConnected
            ){

                toast.remove();

            }

        },
        2200
    );

}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        pageActive =
            document.visibilityState ===
            "visible";


        if(pageActive){

            setTimeout(
                () => {

                    if(map){

                        map.invalidateSize();

                    }

                },
                150
            );


            /*
             * Resume watcher if browser
             * stopped it while hidden.
             */

            if(
                isOnline &&
                currentUser &&
                watchId === null
            ){

                startLocationTracking();

            }

        }

    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        setTimeout(
            () => {

                if(map){

                    map.invalidateSize();

                }

            },
            200
        );

    }
);


/* =========================================================
   PAGE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        stopLocationTracking();

    }
);


/* =========================================================
   INITIAL MAP SIZE
========================================================= */

setTimeout(
    () => {

        if(map){

            map.invalidateSize();

        }

    },
    500
);
