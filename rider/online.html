</script><!-- =======================================================
     FIREBASE
======================================================== --><script type="module">

import {
    auth,
    db
} from "../firebase/config.js";

import {
    doc,
    setDoc,
    updateDoc,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================================================
   ELEMENTS
========================================================= */

const statusPill =
    document.getElementById("statusPill");

const statusCard =
    document.getElementById("statusCard");

const statusIcon =
    document.getElementById("statusIcon");

const statusTitle =
    document.getElementById("statusTitle");

const statusDescription =
    document.getElementById("statusDescription");

const onlineButton =
    document.getElementById("onlineButton");

const onlineButtonText =
    document.getElementById("onlineButtonText");

const gpsValue =
    document.getElementById("gpsValue");

const latValue =
    document.getElementById("latValue");

const lngValue =
    document.getElementById("lngValue");

const errorBox =
    document.getElementById("errorBox");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let isOnline = false;

let watchId = null;

let riderMarker = null;

let map = null;

let lastPosition = null;


/* =========================================================
   MAP
========================================================= */

function initializeMap(){

    /*
     * Chandigarh default.
     * Actual rider GPS replaces this immediately.
     */

    map =
        L.map(
            "map",
            {
                zoomControl:false,
                attributionControl:true
            }
        ).setView(
            [30.7333,76.7794],
            13
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                '&copy; OpenStreetMap'
        }
    ).addTo(map);

}


initializeMap();


/* =========================================================
   RIDER ICON
========================================================= */

const riderIcon =
    L.divIcon({

        className:"rider-location-marker",

        html:`

            <div style="
                width:44px;
                height:44px;
                border-radius:50%;
                background:#ffe500;
                border:4px solid #000;
                display:flex;
                align-items:center;
                justify-content:center;
                box-shadow:0 5px 18px rgba(0,0,0,.45);
                color:#000;
                font-size:19px;
            ">

                <i class="fa-solid fa-motorcycle"></i>

            </div>

        `,

        iconSize:[44,44],

        iconAnchor:[22,22]

    });


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            stopLocationTracking();

            location.href =
                "../auth/login.html";

            return;
        }


        currentUser =
            user;


        await loadRiderStatus(
            user.uid
        );

    }
);


/* =========================================================
   LOAD STATUS
========================================================= */

async function loadRiderStatus(uid){

    try{

        const riderSnap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    uid
                )
            );


        if(
            riderSnap.exists() &&
            riderSnap.data().online === true
        ){

            isOnline = true;

            updateUI();

            startLocationTracking();

        }else{

            isOnline = false;

            updateUI();

        }

    }catch(error){

        console.error(
            "Rider status error:",
            error
        );

        /*
         * If rider document is unavailable,
         * default to offline.
         */

        isOnline = false;

        updateUI();

    }

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    if(isOnline){

        statusPill.textContent =
            "● Online";

        statusPill.className =
            "status-pill online";


        statusCard.classList.add(
            "online"
        );


        statusIcon.className =
            "fa-solid fa-circle-check";


        statusTitle.textContent =
            "You're Online";


        statusDescription.textContent =
            "You're ready to receive RiderX ride requests.";


        onlineButton.classList.add(
            "offline"
        );


        onlineButtonText.textContent =
            "Go Offline";


    }else{

        statusPill.textContent =
            "Offline";

        statusPill.className =
            "status-pill offline";


        statusCard.classList.remove(
            "online"
        );


        statusIcon.className =
            "fa-solid fa-power-off";


        statusTitle.textContent =
            "You're Offline";


        statusDescription.textContent =
            "Go online to receive RiderX ride requests.";


        onlineButton.classList.remove(
            "offline"
        );


        onlineButtonText.textContent =
            "Go Online";

    }

}


/* =========================================================
   ONLINE / OFFLINE
========================================================= */

onlineButton.addEventListener(
    "click",
    async()=>{

        if(!currentUser){
            return;
        }


        hideError();


        onlineButton.disabled = true;


        try{

            if(isOnline){

                await setRiderOffline();

            }else{

                await setRiderOnline();

            }

        }catch(error){

            console.error(
                "Online toggle error:",
                error
            );

            showError(
                error.message ||
                "Unable to change online status."
            );

        }finally{

            onlineButton.disabled = false;

        }

    }
);


/* =========================================================
   GO ONLINE
========================================================= */

async function setRiderOnline(){

    if(!navigator.geolocation){

        throw new Error(
            "GPS is not supported on this device."
        );

    }


    /*
     * Request location first.
     * Rider is marked online only after
     * valid GPS position is received.
     */

    gpsValue.textContent =
        "Locating...";


    const position =
        await getCurrentPosition();


    lastPosition =
        position;


    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;


    await setDoc(
        doc(
            db,
            "riders",
            currentUser.uid
        ),
        {
            online:true,
            isOnline:true,

            lat:lat,
            lng:lng,

            location:{
                lat:lat,
                lng:lng
            },

            locationUpdatedAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp()
        },
        {
            merge:true
        }
    );


    await setDoc(
        doc(
            db,
            "riderLocations",
            currentUser.uid
        ),
        {
            riderId:
                currentUser.uid,

            lat:lat,
            lng:lng,

            online:true,

            updatedAt:
                serverTimestamp()
        },
        {
            merge:true
        }
    );


    isOnline = true;

    updatePosition(
        position,
        true
    );

    updateUI();

    startLocationTracking();


    showToast(
        "You're now online"
    );

}


/* =========================================================
   GO OFFLINE
========================================================= */

async function setRiderOffline(){

    stopLocationTracking();


    await setDoc(
        doc(
            db,
            "riders",
            currentUser.uid
        ),
        {
            online:false,
            isOnline:false,

            locationUpdatedAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp()
        },
        {
            merge:true
        }
    );


    await setDoc(
        doc(
            db,
            "riderLocations",
            currentUser.uid
        ),
        {
            riderId:
                currentUser.uid,

            online:false,

            updatedAt:
                serverTimestamp()
        },
        {
            merge:true
        }
    );


    isOnline = false;

    updateUI();

    showToast(
        "You're now offline"
    );

}


/* =========================================================
   GET CURRENT POSITION
========================================================= */

function getCurrentPosition(){

    return new Promise(
        (resolve,reject)=>{

            navigator.geolocation.getCurrentPosition(
                resolve,
                error => {

                    let message =
                        "Unable to get your location.";

                    if(
                        error.code ===
                        error.PERMISSION_DENIED
                    ){

                        message =
                            "Location permission denied. Please enable GPS permission.";

                    }else if(
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ){

                        message =
                            "Location unavailable. Please turn on GPS.";

                    }else if(
                        error.code ===
                        error.TIMEOUT
                    ){

                        message =
                            "GPS request timed out. Try again.";

                    }

                    reject(
                        new Error(message)
                    );

                },
                {
                    enableHighAccuracy:true,
                    timeout:15000,
                    maximumAge:5000
                }
            );

        }
    );

}


/* =========================================================
   START LIVE LOCATION
========================================================= */

function startLocationTracking(){

    if(!navigator.geolocation){
        return;
    }


    if(watchId !== null){

        navigator.geolocation.clearWatch(
            watchId
        );

    }


    watchId =
        navigator.geolocation.watchPosition(
            position => {

                if(!isOnline){
                    return;
                }


                lastPosition =
                    position;


                updatePosition(
                    position,
                    false
                );


                saveLiveLocation(
                    position
                );

            },
            error => {

                console.warn(
                    "GPS watch error:",
                    error
                );

                gpsValue.textContent =
                    "GPS Error";

            },
            {
                enableHighAccuracy:true,
                timeout:15000,
                maximumAge:3000
            }
        );

}


/* =========================================================
   STOP LIVE LOCATION
========================================================= */

function stopLocationTracking(){

    if(
        watchId !== null &&
        navigator.geolocation
    ){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

    }

}


/* =========================================================
   UPDATE MAP POSITION
========================================================= */

function updatePosition(
    position,
    centerMap
){

    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;

    const accuracy =
        Math.round(
            position.coords.accuracy || 0
        );


    latValue.textContent =
        lat.toFixed(5);

    lngValue.textContent =
        lng.toFixed(5);


    gpsValue.textContent =
        accuracy
        ? `${accuracy}m`
        : "Active";


    const latLng =
        [lat,lng];


    if(!riderMarker){

        riderMarker =
            L.marker(
                latLng,
                {
                    icon:riderIcon
                }
            ).addTo(map);

    }else{

        riderMarker.setLatLng(
            latLng
        );

    }


    if(centerMap){

        map.setView(
            latLng,
            16,
            {
                animate:true
            }
        );

    }

}


/* =========================================================
   SAVE LIVE LOCATION
========================================================= */

let lastSavedAt = 0;

async function saveLiveLocation(
    position
){

    if(
        !currentUser ||
        !isOnline
    ){
        return;
    }


    /*
     * Prevent excessive Firestore writes.
     * Maximum approximately one update
     * every 4 seconds.
     */

    const now =
        Date.now();

    if(
        now - lastSavedAt < 4000
    ){
        return;
    }


    lastSavedAt =
        now;


    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;


    try{

        await setDoc(
            doc(
                db,
                "riderLocations",
                currentUser.uid
            ),
            {
                riderId:
                    currentUser.uid,

                lat:lat,
                lng:lng,

                accuracy:
                    position.coords.accuracy || null,

                heading:
                    position.coords.heading || null,

                speed:
                    position.coords.speed || null,

                online:true,

                updatedAt:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );


        await setDoc(
            doc(
                db,
                "riders",
                currentUser.uid
            ),
            {
                online:true,
                isOnline:true,

                lat:lat,
                lng:lng,

                location:{
                    lat:lat,
                    lng:lng
                },

                locationUpdatedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );

    }catch(error){

        console.error(
            "Live location save error:",
            error
        );

    }

}


/* =========================================================
   MY LOCATION BUTTON
========================================================= */

document
.getElementById("locationButton")
.addEventListener(
    "click",
    async()=>{

        try{

            const position =
                await getCurrentPosition();


            lastPosition =
                position;


            updatePosition(
                position,
                true
            );


            if(isOnline){

                await saveLiveLocation(
                    position
                );

            }

        }catch(error){

            showError(
                error.message
            );

        }

    }
);

/* =========================================================
   ERROR
========================================================= */

function showError(message){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function hideError(){

    errorBox.style.display =
        "none";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.createElement("div");

    toast.textContent =
        message;

    toast.style.position =
        "fixed";

    toast.style.left =
        "50%";

    toast.style.bottom =
        "300px";

    toast.style.transform =
        "translateX(-50%)";

    toast.style.zIndex =
        "2000";

    toast.style.padding =
        "11px 17px";

    toast.style.borderRadius =
        "13px";

    toast.style.background =
        "#222";

    toast.style.color =
        "#fff";

    toast.style.fontSize =
        "11px";

    toast.style.boxShadow =
        "0 8px 30px rgba(0,0,0,.4)";

    document.body.appendChild(
        toast
    );


    setTimeout(
        ()=>{
            toast.remove();
        },
        2200
    );

}


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(
            document.visibilityState ===
            "visible"
        ){

            if(
                isOnline &&
                watchId === null
            ){

                startLocationTracking();

            }

        }

    }
);
