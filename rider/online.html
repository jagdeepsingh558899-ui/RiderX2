<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Online</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{

margin:0;
background:#000;
color:white;
font-family:Arial;

}


.header{

padding:20px;
background:#111;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:2px solid #FFD600;

}


#map{

height:55vh;
width:100%;

}


button{

width:90%;
margin:15px 5%;
padding:15px;
border:none;
border-radius:15px;
background:#FFD600;
font-weight:bold;

}


.card{

background:#111;
margin:15px;
padding:15px;
border-radius:15px;
border:1px solid #333;

}


.accept{

background:#FFD600;
padding:10px;
border:none;
border-radius:10px;
width:100%;
font-weight:bold;

}


</style>

</head>


<body>



<div class="header">

🏍 RiderX Rider Online

</div>



<div id="map"></div>



<button id="onlineBtn">

🟢 Go Online

</button>



<div id="rides">

No rides nearby

</div>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module">


import {auth,db} from "../firebase/config.js";


import {

doc,
setDoc,
collection,
query,
where,
getDocs,
updateDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let map=L.map("map")

.setView(

[30.7333,76.7794],

13

);





L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png"

)

.addTo(map);





let marker=null;

let riderLat=null;

let riderLng=null;

let online=false;





let btn=document.getElementById("onlineBtn");







btn.onclick=()=>{


online=true;


btn.innerHTML=

"🟢 Rider Online";





navigator.geolocation.watchPosition(

async(position)=>{


riderLat=

position.coords.latitude;


riderLng=

position.coords.longitude;





if(marker){


marker.setLatLng(

[riderLat,riderLng]

);


}

else{


marker=L.marker(

[riderLat,riderLng]

)

.addTo(map)

.bindPopup(

"🟢 You Online"

)

.openPopup();



}





map.setView(

[riderLat,riderLng],

16

);






let user=

auth.currentUser;



if(user){



await setDoc(

doc(db,"riderLocations",user.uid),

{


lat:riderLat,

lng:riderLng,

status:"Online",

updatedAt:serverTimestamp()


}

);



}




loadNearbyRides();



},

()=>{


alert(

"Location permission allow karo"

);

},


{

enableHighAccuracy:true

}



);


};









// =====================
// LOAD RIDES
// =====================


async function loadNearbyRides(){



if(!online)

return;




let q=query(

collection(db,"rides"),

where(

"status",

"==",

"Pending"

)

);





let snap=

await getDocs(q);





let box=

document.getElementById("rides");



box.innerHTML="";





if(snap.empty){


box.innerHTML=

"<p>No nearby rides</p>";

return;


}






snap.forEach((ride)=>{


let data=

ride.data();





let card=

document.createElement("div");



card.className="card";





card.innerHTML=

`

<h3>

🏍 ${data.service}

</h3>


<p>

📍 Pickup:

${data.pickup}

</p>


<p>

🏁 Drop:

${data.drop}

</p>


<p>

💰 ₹${data.fare}

</p>



<button class="accept">

Accept Ride

</button>

`;






card.querySelector("button")

.onclick=

async()=>{





let user=

auth.currentUser;





await updateDoc(

doc(db,"rides",ride.id),

{


status:"Accepted",

riderId:user.uid,

acceptedAt:serverTimestamp()


}

);





localStorage.setItem(

"rideId",

ride.id

);



alert(

"Ride Accepted ✅"

);



location.href="trip.html";



};





box.appendChild(card);



});



}






setInterval(()=>{


if(online)

loadNearbyRides();


},10000);



</script>



</body>

</html>
