<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<meta
    name="theme-color"
    content="#000000"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<title>RiderX | Online</title>


<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"

<style>

:root{
    --yellow:#ffe500;
    --black:#000;
    --dark:#090909;
    --card:#151515;
    --green:#22c55e;
    --red:#ef4444;
    --muted:#888;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Poppins,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
}

body{
    position:fixed;
    inset:0;
}


/* =========================================================
   MAP
========================================================= */

#map{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    background:#ddd;
}

.leaflet-control-zoom{
    display:none!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
    padding:2px 4px!important;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:fixed;

    top:0;
    left:0;
    right:0;

    z-index:1000;

    padding:
        max(12px,env(safe-area-inset-top))
        14px
        0;

    pointer-events:none;
}

.topbar-inner{
    height:52px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-btn{
    width:45px;
    height:45px;

    border:0;
    border-radius:50%;

    background:rgba(10,10,10,.95);
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;

    box-shadow:
        0 6px 22px rgba(0,0,0,.4);

    pointer-events:auto;

    cursor:pointer;
}

.top-btn:active{
    transform:scale(.92);
}

.logo{
    padding:8px 17px;

    border-radius:15px;

    background:rgba(10,10,10,.95);

    font-size:17px;
    font-weight:900;

    box-shadow:
        0 6px 22px rgba(0,0,0,.4);
}

.logo span{
    color:var(--yellow);
}


/* =========================================================
   STATUS
========================================================= */

.status-pill{
    position:fixed;

    top:
        calc(
            max(12px,env(safe-area-inset-top))
            + 61px
        );

    left:50%;

    transform:translateX(-50%);

    z-index:1000;

    padding:8px 16px;

    max-width:90%;

    border-radius:30px;

    background:rgba(10,10,10,.95);

    color:#aaa;

    font-size:11px;

    white-space:nowrap;

    box-shadow:
        0 5px 20px rgba(0,0,0,.35);
}

.status-pill.online{
    color:var(--green);
}

.status-pill.offline{
    color:#aaa;
}


/* =========================================================
   LOCATION BUTTON
========================================================= */

.location-btn{
    position:fixed;

    right:15px;

    bottom:305px;

    z-index:900;

    width:48px;
    height:48px;

    border:0;
    border-radius:50%;

    background:#111;
    color:var(--yellow);

    font-size:18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.45);

    cursor:pointer;
}

.location-btn:active{
    transform:scale(.92);
}

.location-btn:disabled{
    opacity:.55;
}


/* =========================================================
   BOTTOM PANEL
========================================================= */

.panel{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:1000;

    padding:
        12px
        14px
        max(16px,env(safe-area-inset-bottom));

    background:rgba(9,9,9,.98);

    border-radius:
        27px
        27px
        0
        0;

    box-shadow:
        0 -12px 40px rgba(0,0,0,.55);
}


/* =========================================================
   HANDLE
========================================================= */

.handle{
    width:48px;
    height:5px;

    margin:0 auto 13px;

    border-radius:10px;

    background:#555;
}


/* =========================================================
   STATUS CARD
========================================================= */

.status-card{
    display:flex;

    align-items:center;

    gap:12px;

    padding:13px;

    background:#151515;

    border:1px solid #242424;

    border-radius:17px;
}

.status-icon{
    width:45px;
    height:45px;

    min-width:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:#242424;

    color:#777;

    font-size:19px;
}

.status-card.online .status-icon{
    color:var(--green);
    background:#102517;
}

.status-info{
    flex:1;
    min-width:0;
}

.status-title{
    font-size:14px;
    font-weight:800;
}

.status-description{
    margin-top:4px;

    color:#777;

    font-size:10px;

    line-height:1.4;
}

.status-light{
    width:11px;
    height:11px;

    min-width:11px;

    border-radius:50%;

    background:#555;

    box-shadow:
        0 0 0 4px #242424;
}

.status-card.online .status-light{
    background:var(--green);

    box-shadow:
        0 0 0 4px #12351f;
}


/* =========================================================
   ONLINE BUTTON
========================================================= */

.online-btn{
    width:100%;

    min-height:55px;

    margin-top:12px;

    border:0;
    border-radius:16px;

    background:var(--yellow);
    color:#000;

    font-size:15px;
    font-weight:900;

    box-shadow:
        0 6px 22px
        rgba(255,229,0,.12);

    transition:
        transform .15s ease,
        background .2s ease,
        opacity .2s ease;

    cursor:pointer;
}

.online-btn:active{
    transform:scale(.985);
}

.online-btn.offline{
    background:#262626;
    color:#fff;

    box-shadow:none;
}

.online-btn:disabled{
    opacity:.55;
    cursor:wait;
}


/* =========================================================
   INFO ROW
========================================================= */

.info-row{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    margin-top:10px;
}

.info{
    padding:10px 7px;

    background:#121212;

    border-radius:13px;

    text-align:center;

    min-width:0;
}

.info-label{
    color:#666;
    font-size:8px;
}

.info-value{
    margin-top:4px;

    color:#fff;

    font-size:11px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav-row{
    display:flex;

    gap:8px;

    margin-top:10px;
}

.nav-btn{
    flex:1;

    min-height:42px;

    border:1px solid #292929;

    border-radius:13px;

    background:#151515;

    color:#aaa;

    font-size:10px;
    font-weight:700;

    cursor:pointer;
}

.nav-btn i{
    margin-right:4px;
}

.nav-btn:active{
    transform:scale(.97);
}


/* =========================================================
   ERROR
========================================================= */

.error-box{
    display:none;

    margin-top:9px;

    padding:10px;

    border-radius:12px;

    background:#210d0d;

    color:#ff7777;

    font-size:10px;

    text-align:center;

    line-height:1.4;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .panel{
        left:50%;
        right:auto;

        width:520px;

        transform:translateX(-50%);

        border-radius:
            27px
            27px
            0
            0;
    }

}


/* =========================================================
   SMALL DEVICES
========================================================= */

@media(max-height:680px){

    .panel{
        padding-top:8px;
    }

    .handle{
        margin-bottom:8px;
    }

    .status-card{
        padding:9px;
    }

    .status-icon{
        width:38px;
        height:38px;
        min-width:38px;
    }

    .online-btn{
        min-height:48px;
    }

    .info{
        padding:7px 5px;
    }

    .nav-btn{
        min-height:38px;
    }

}

</style>

</head>


<body>

     MAP

<div id="map"></div>

<div

>

<!-- =======================================================
     LEAFLET
======================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- =======================================================
     FIREBASE
======================================================== -->

<script type="module">

import {
    auth,
    db
} from "../firebase/config.js";

import {
    doc,
    setDoc,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================================================
   CONSTANTS
========================================================= */

const CHANDIGARH = [
    30.7333,
    76.7794
];

const DEFAULT_ZOOM = 13;

const RIDER_ZOOM = 16;

const LOCATION_SAVE_INTERVAL = 4000;


/* =========================================================
   ELEMENTS
========================================================= */

const statusPill =
    document.getElementById("statusPill");

const statusCard =
    document.getElementById("statusCard");

const statusIcon =
    document.getElementById("statusIcon");

const statusTitle =
    document.getElementById("statusTitle");

const statusDescription =
    document.getElementById("statusDescription");

const onlineButton =
    document.getElementById("onlineButton");

const onlineButtonText =
    document.getElementById("onlineButtonText");

const gpsValue =
    document.getElementById("gpsValue");

const latValue =
    document.getElementById("latValue");

const lngValue =
    document.getElementById("lngValue");

const errorBox =
    document.getElementById("errorBox");

const locationButton =
    document.getElementById("locationButton");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let isOnline = false;

let watchId = null;

let riderMarker = null;

let accuracyCircle = null;

let map = null;

let lastPosition = null;

let lastSavedAt = 0;

let authReady = false;

let toggleInProgress = false;


/* =========================================================
   MAP
========================================================= */

function initializeMap(){

    map = L.map(
        "map",
        {
            zoomControl:false,
            attributionControl:true
        }
    ).setView(
        CHANDIGARH,
        DEFAULT_ZOOM
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"&copy; OpenStreetMap"
        }
    ).addTo(map);

}


initializeMap();


/* =========================================================
   RIDER ICON
========================================================= */

const riderIcon =
    L.divIcon({

        className:"rider-location-marker",

        html:`

            <div style="
                width:44px;
                height:44px;
                border-radius:50%;
                background:#ffe500;
                border:4px solid #000;
                display:flex;
                align-items:center;
                justify-content:center;
                box-shadow:0 5px 18px rgba(0,0,0,.45);
                color:#000;
                font-size:19px;
            ">

                <i class="fa-solid fa-motorcycle"></i>

            </div>

        `,

        iconSize:[44,44],

        iconAnchor:[22,22]

    });


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        authReady = true;

        if(!user){

            currentUser = null;

            isOnline = false;

            stopLocationTracking();

            location.href =
                "../auth/login.html";

            return;

        }


        currentUser = user;


        await loadRiderStatus(
            user.uid
        );

    }
);


/* =========================================================
   LOAD RIDER STATUS
========================================================= */

async function loadRiderStatus(uid){

    try{

        const riderSnap =
            await getDoc(
                doc(
                    db,
                    "riders",
                    uid
                )
            );


        if(
            riderSnap.exists() &&
            riderSnap.data().online === true
        ){

            isOnline = true;

            updateUI();

            startLocationTracking();

        }else{

            isOnline = false;

            updateUI();

        }

    }catch(error){

        console.error(
            "Rider status error:",
            error
        );

        isOnline = false;

        updateUI();

        showError(
            "Unable to load rider status. Please try again."
        );

    }

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    if(isOnline){

        statusPill.textContent =
            "● Online";

        statusPill.className =
            "status-pill online";


        statusCard.classList.add(
            "online"
        );


        statusIcon.className =
            "fa-solid fa-circle-check";


        statusTitle.textContent =
            "You're Online";


        statusDescription.textContent =
            "You're ready to receive RiderX ride requests.";


        onlineButton.classList.add(
            "offline"
        );


        onlineButtonText.textContent =
            "Go Offline";


    }else{

        statusPill.textContent =
            "Offline";

        statusPill.className =
            "status-pill offline";


        statusCard.classList.remove(
            "online"
        );


        statusIcon.className =
            "fa-solid fa-power-off";


        statusTitle.textContent =
            "You're Offline";


        statusDescription.textContent =
            "Go online to receive RiderX ride requests.";


        onlineButton.classList.remove(
            "offline"
        );


        onlineButtonText.textContent =
            "Go Online";

    }

}


/* =========================================================
   ONLINE / OFFLINE TOGGLE
========================================================= */

onlineButton.addEventListener(
    "click",
    async () => {

        if(
            !currentUser ||
            !authReady ||
            toggleInProgress
        ){
            return;
        }


        hideError();


        toggleInProgress = true;

        onlineButton.disabled = true;

        onlineButtonText.textContent =
            isOnline
                ? "Going Offline..."
                : "Getting GPS...";


        try{

            if(isOnline){

                await setRiderOffline();

            }else{

                await setRiderOnline();

            }

        }catch(error){

            console.error(
                "Online toggle error:",
                error
            );

            showError(
                error.message ||
                "Unable to change online status."
            );

            updateUI();

        }finally{

            toggleInProgress = false;

            onlineButton.disabled = false;

            updateUI();

        }

    }
);


/* =========================================================
   GO ONLINE
========================================================= */

async function setRiderOnline(){

    if(!navigator.geolocation){

        throw new Error(
            "GPS is not supported on this device."
        );

    }


    gpsValue.textContent =
        "Locating...";


    const position =
        await getCurrentPosition();


    if(!currentUser){

        throw new Error(
            "Authentication session expired. Please login again."
        );

    }


    lastPosition =
        position;


    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;


    /*
     * Save rider's first valid GPS position.
     */

    await setDoc(
        doc(
            db,
            "riders",
            currentUser.uid
        ),
        {
            online:true,
            isOnline:true,

            lat:lat,
            lng:lng,

            location:{
                lat:lat,
                lng:lng
            },

            accuracy:
                position.coords.accuracy || null,

            heading:
                position.coords.heading || null,

            speed:
                position.coords.speed || null,

            locationUpdatedAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp()
        },
        {
            merge:true
        }
    );


    /*
     * Public/active rider location.
     */

    await setDoc(
        doc(
            db,
            "riderLocations",
            currentUser.uid
        ),
        {
            riderId:
                currentUser.uid,

            lat:lat,
            lng:lng,

            accuracy:
                position.coords.accuracy || null,

            heading:
                position.coords.heading || null,

            speed:
                position.coords.speed || null,

            online:true,

            updatedAt:
                serverTimestamp()
        },
        {
            merge:true
        }
    );


    isOnline = true;

    lastSavedAt =
        Date.now();


    updatePosition(
        position,
        true
    );


    updateUI();


    startLocationTracking();


    showToast(
        "You're now online"
    );

}


/* =========================================================
   GO OFFLINE
========================================================= */

async function setRiderOffline(){

    stopLocationTracking();


    if(!currentUser){
        return;
    }


    /*
     * Mark rider unavailable.
     */

    await setDoc(
        doc(
            db,
            "riders",
            currentUser.uid
        ),
        {
            online:false,
            isOnline:false,

            locationUpdatedAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp()
        },
        {
            merge:true
        }
    );


    /*
     * Keep location document but mark it
     * unavailable instead of deleting it.
     */

    await setDoc(
        doc(
            db,
            "riderLocations",
            currentUser.uid
        ),
        {
            riderId:
                currentUser.uid,

            online:false,

            updatedAt:
                serverTimestamp()
        },
        {
            merge:true
        }
    );


    isOnline = false;

    lastSavedAt = 0;


    updateUI();


    showToast(
        "You're now offline"
    );

}


/* =========================================================
   GET CURRENT POSITION
========================================================= */

function getCurrentPosition(){

    return new Promise(
        (resolve,reject) => {

            navigator.geolocation.getCurrentPosition(
                resolve,
                error => {

                    let message =
                        "Unable to get your location.";


                    if(
                        error.code ===
                        error.PERMISSION_DENIED
                    ){

                        message =
                            "Location permission denied. Please allow location permission for RiderX.";

                    }else if(
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ){

                        message =
                            "Location unavailable. Please turn on GPS and try again.";

                    }else if(
                        error.code ===
                        error.TIMEOUT
                    ){

                        message =
                            "GPS request timed out. Please try again.";

                    }


                    reject(
                        new Error(message)
                    );

                },
                {
                    enableHighAccuracy:true,
                    timeout:15000,
                    maximumAge:5000
                }
            );

        }
    );

}


/* =========================================================
   START LIVE LOCATION
========================================================= */

function startLocationTracking(){

    if(
        !navigator.geolocation ||
        !currentUser ||
        !isOnline
    ){
        return;
    }


    /*
     * Never create two GPS watchers.
     */

    if(watchId !== null){

        return;

    }


    watchId =
        navigator.geolocation.watchPosition(
            position => {

                if(
                    !isOnline ||
                    !currentUser
                ){

                    return;

                }


                lastPosition =
                    position;


                updatePosition(
                    position,
                    false
                );


                saveLiveLocation(
                    position
                );

            },
            error => {

                console.warn(
                    "GPS watch error:",
                    error
                );


                if(
                    error.code ===
                    error.PERMISSION_DENIED
                ){

                    gpsValue.textContent =
                        "Permission";

                }else if(
                    error.code ===
                    error.POSITION_UNAVAILABLE
                ){

                    gpsValue.textContent =
                        "Unavailable";

                }else{

                    gpsValue.textContent =
                        "GPS Error";

                }

            },
            {
                enableHighAccuracy:true,
                timeout:15000,
                maximumAge:3000
            }
        );

}


/* =========================================================
   STOP LIVE LOCATION
========================================================= */

function stopLocationTracking(){

    if(
        watchId !== null &&
        navigator.geolocation
    ){

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

    }

}


/* =========================================================
   UPDATE MAP POSITION
========================================================= */

function updatePosition(
    position,
    centerMap
){

    if(!position){
        return;
    }


    const lat =
        Number(
            position.coords.latitude
        );

    const lng =
        Number(
            position.coords.longitude
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    const accuracy =
        Math.max(
            0,
            Number(
                position.coords.accuracy || 0
            )
        );


    lastPosition =
        position;


    latValue.textContent =
        lat.toFixed(5);

    lngValue.textContent =
        lng.toFixed(5);


    gpsValue.textContent =
        accuracy
            ? `${Math.round(accuracy)}m`
            : "Active";


    const latLng =
        [
            lat,
            lng
        ];


    /*
     * Rider marker.
     */

    if(!riderMarker){

        riderMarker =
            L.marker(
                latLng,
                {
                    icon:riderIcon,
                    keyboard:false
                }
            ).addTo(map);

    }else{

        riderMarker.setLatLng(
            latLng
        );

    }


    /*
     * GPS accuracy circle.
     */

    if(
        accuracy > 0 &&
        accuracy < 1000
    ){

        if(!accuracyCircle){

            accuracyCircle =
                L.circle(
                    latLng,
                    {
                        radius:accuracy,
                        color:"#ffe500",
                        fillColor:"#ffe500",
                        fillOpacity:.08,
                        weight:1
                    }
                ).addTo(map);

        }else{

            accuracyCircle.setLatLng(
                latLng
            );

            accuracyCircle.setRadius(
                accuracy
            );

        }

    }


    /*
     * Center only when explicitly requested.
     */

    if(centerMap){

        map.setView(
            latLng,
            RIDER_ZOOM,
            {
                animate:true
            }
        );

    }

}


/* =========================================================
   SAVE LIVE LOCATION
========================================================= */

async function saveLiveLocation(
    position
){

    if(
        !currentUser ||
        !isOnline ||
        !position
    ){

        return;

    }


    const now =
        Date.now();


    /*
     * Limit Firestore writes.
     */

    if(
        now - lastSavedAt <
        LOCATION_SAVE_INTERVAL
    ){

        return;

    }


    lastSavedAt =
        now;


    const lat =
        Number(
            position.coords.latitude
        );

    const lng =
        Number(
            position.coords.longitude
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    const locationData = {

        riderId:
            currentUser.uid,

        lat:lat,

        lng:lng,

        accuracy:
            position.coords.accuracy || null,

        heading:
            position.coords.heading ?? null,

        speed:
            position.coords.speed ?? null,

        online:true,

        updatedAt:
            serverTimestamp()

    };


    try{

        /*
         * Active location document.
         */

        await setDoc(
            doc(
                db,
                "riderLocations",
                currentUser.uid
            ),
            locationData,
            {
                merge:true
            }
        );


        /*
         * Rider profile/status document.
         */

        await setDoc(
            doc(
                db,
                "riders",
                currentUser.uid
            ),
            {
                online:true,
                isOnline:true,

                lat:lat,
                lng:lng,

                location:{
                    lat:lat,
                    lng:lng
                },

                accuracy:
                    position.coords.accuracy || null,

                heading:
                    position.coords.heading ?? null,

                speed:
                    position.coords.speed ?? null,

                locationUpdatedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );

    }catch(error){

        console.error(
            "Live location save error:",
            error
        );

        /*
         * Do not automatically mark rider
         * offline because of a temporary
         * Firestore/network failure.
         */

    }

}


/* =========================================================
   MY LOCATION BUTTON
========================================================= */

locationButton.addEventListener(
    "click",
    async () => {

        if(
            !currentUser ||
            !authReady
        ){

            return;

        }


        hideError();


        locationButton.disabled =
            true;


        try{

            const position =
                await getCurrentPosition();


            lastPosition =
                position;


            updatePosition(
                position,
                true
            );


            if(isOnline){

                await saveLiveLocation(
                    position
                );

            }


        }catch(error){

            showError(
                error.message ||
                "Unable to get your location."
            );

        }finally{

            locationButton.disabled =
                false;

        }

    }
);

/* =========================================================

========================================================= */

function showError(message){

    errorBox.textContent =
        String(
            message ||
            "Something went wrong."
        );

    errorBox.style.display =
        "block";

}


function hideError(){

    errorBox.textContent =
        "";

    errorBox.style.display =
        "none";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const existing =
        document.getElementById(
            "riderxToast"
        );


    if(existing){

        existing.remove();

    }


    const toast =
        document.createElement(
            "div"
        );


    toast.id =
        "riderxToast";


    toast.textContent =
        message;


    toast.style.position =
        "fixed";

    toast.style.left =
        "50%";

    toast.style.bottom =
        "300px";

    toast.style.transform =
        "translateX(-50%)";

    toast.style.zIndex =
        "2000";

    toast.style.padding =
        "11px 17px";

    toast.style.borderRadius =
        "13px";

    toast.style.background =
        "#222";

    toast.style.color =
        "#fff";

    toast.style.fontSize =
        "11px";

    toast.style.fontWeight =
        "700";

    toast.style.boxShadow =
        "0 8px 30px rgba(0,0,0,.4)";


    document.body.appendChild(
        toast
    );


    setTimeout(
        () => {

            if(toast.isConnected){

                toast.remove();

            }

        },
        2200
    );

}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            setTimeout(
                () => {

                    if(map){

                        map.invalidateSize();

                    }

                },
                150
            );


            if(
                isOnline &&
                watchId === null
            ){

                startLocationTracking();

            }

        }

    }
);
