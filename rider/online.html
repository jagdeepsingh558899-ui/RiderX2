<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Online</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{

margin:0;
background:#000;
color:white;
font-family:Arial;

}


.header{

padding:20px;
background:#111;
text-align:center;
font-size:22px;
font-weight:bold;
border-bottom:2px solid #FFD600;

}


#map{

height:75vh;
width:100%;

}



button{

width:90%;
margin:20px 5%;
padding:15px;
border:none;
border-radius:15px;
background:#FFD600;
font-weight:bold;

}


</style>


</head>


<body>



<div class="header">

🏍 RiderX Rider Map

</div>



<div id="map"></div>



<button id="onlineBtn">

🟢 Go Online

</button>






<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module">


import {auth,db} from "../firebase/config.js";


import {

doc,
setDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






let map =
L.map("map").setView(

[30.7333,76.7794],

13

);





L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);





let marker=null;





const btn =
document.getElementById("onlineBtn");





btn.onclick=()=>{



navigator.geolocation.watchPosition(

async(position)=>{


let lat =
position.coords.latitude;


let lng =
position.coords.longitude;





if(marker){


marker.setLatLng(

[lat,lng]

);


}

else{


marker=L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup(

"You are Online 🟢"

)

.openPopup();



}




map.setView(

[lat,lng],

16

);





let user =
auth.currentUser;



if(user){



await setDoc(

doc(db,"riderLocations",user.uid),

{


lat,

lng,

status:"Online",

updatedAt:serverTimestamp()


}

);



}





},


(error)=>{


alert(
"Location permission allow karo"
);


},


{

enableHighAccuracy:true

}


);



btn.innerHTML=

"🟢 Rider Online";



};




</script>



</body>

</html>
