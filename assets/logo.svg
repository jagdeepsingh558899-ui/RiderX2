<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 512 512"
width="512"
height="512"
role="img"
aria-labelledby="title desc"

«»

<title id="title">RiderX Logo</title>

<desc id="desc">
    Premium black and yellow RiderX logo
</desc>


<defs>

    <linearGradient
        id="yellowGradient"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >

        <stop
            offset="0%"
            stop-color="#FFE04A"
        />

        <stop
            offset="100%"
            stop-color="#FFD400"
        />

    </linearGradient>


    <filter
        id="shadow"
        x="-30%"
        y="-30%"
        width="160%"
        height="160%"
    >

        <feDropShadow
            dx="0"
            dy="12"
            stdDeviation="14"
            flood-color="#FFD400"
            flood-opacity=".16"
        />

    </filter>

</defs>


<!-- Background -->

<rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="112"
    fill="#070707"
/>


<!-- Yellow outer frame -->

<rect
    x="38"
    y="38"
    width="436"
    height="436"
    rx="96"
    fill="none"
    stroke="url(#yellowGradient)"
    stroke-width="14"
    filter="url(#shadow)"
/>


<!-- RiderX symbol -->

<path
    d="M142 157
       H304
       C352 157 384 183 384 225
       C384 261 364 282 333 292
       L389 365
       H330
       L279 300
       H201
       V365
       H142
       Z

       M201 205
       V253
       H292
       C311 253 324 243 324 229
       C324 214 311 205 292 205
       Z"
    fill="url(#yellowGradient)"
/>


<!-- X -->

<path
    d="M286 315
       L329 315
       L352 343
       L375 315
       H418
       L374 365
       L418 415
       H375
       L352 387
       L329 415
       H286
       L330 365
       Z"
    fill="#ffffff"
/>


<!-- Small road line -->

<path
    d="M126 415
       H259"
    fill="none"
    stroke="#FFD400"
    stroke-width="10"
    stroke-linecap="round"
/>


<circle
    cx="110"
    cy="415"
    r="6"
    fill="#FFD400"
/>

</svg>
