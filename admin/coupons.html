<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX Coupon Management</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

*{
box-sizing:border-box;
font-family:Arial;
}


body{

margin:0;
background:#050505;
color:white;

}


.header{

background:#111;
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:20px;

}


.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#FFE500;

}



.container{

padding:20px;

}



.card{

background:#111;
border:1px solid #333;
border-radius:20px;
padding:20px;
margin-bottom:20px;

}



input,
select{

width:100%;
padding:14px;
margin:8px 0;
background:#000;
border:1px solid #444;
border-radius:12px;
color:white;

}



button{

width:100%;
padding:14px;
background:#FFE500;
border:0;
border-radius:12px;
font-weight:bold;

}



.coupon{

background:#0c0c0c;
border:1px solid #333;
border-radius:15px;
padding:15px;
margin-top:15px;

}



.yellow{

color:#FFE500;

}



.delete{

background:#ff3333;
color:white;
margin-top:10px;

}



</style>


</head>


<body>



<div class="header">


<div class="logo">

RID<span>ERX</span>

</div>


<a href="dashboard.html"
style="color:#FFE500">

⬅

</a>


</div>






<div class="container">


<h2>

Coupon & Referral

</h2>





<div class="card">


<h3 class="yellow">

Create Coupon

</h3>



<input id="code"
placeholder="Coupon Code">


<select id="type">


<option value="flat">

Flat Discount ₹

</option>


<option value="percent">

Percentage %

</option>


</select>



<input id="discount"
type="number"
placeholder="Discount Value">



<input id="minimum"
type="number"
placeholder="Minimum Ride Amount">



<input id="expiry"
type="date">



<input id="limit"
type="number"
placeholder="Usage Limit">



<button id="saveBtn">

Create Coupon

</button>



</div>





<h3>

Active Coupons

</h3>



<div id="couponList">

Loading...

</div>




</div>








<script type="module">


import {

db

}

from "../firebase/firebase-config.js";



import {

collection,
addDoc,
getDocs,
deleteDoc,
doc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";







const list =
document.getElementById("couponList");







async function loadCoupons(){


list.innerHTML="";



const snap =
await getDocs(
collection(db,"coupons")
);



if(snap.empty){


list.innerHTML="No Coupons";


return;


}





snap.forEach(item=>{


let c=item.data();



let div=document.createElement("div");



div.className="coupon";



div.innerHTML=`


<h3 class="yellow">

${c.code}

</h3>



<p>

Discount:
${c.discount}
${c.type==="percent"?"%":"₹"}

</p>



<p>

Minimum:
₹${c.minimum}

</p>



<p>

Expiry:
${c.expiry}

</p>



<p>

Limit:
${c.limit}

</p>



<button class="delete">

Delete

</button>


`;




div.querySelector(".delete")
.onclick=async()=>{


await deleteDoc(
doc(db,"coupons",item.id)
);



loadCoupons();


};




list.appendChild(div);



});



}








saveBtn.onclick=async()=>{



if(!code.value){


alert("Enter Coupon Code");

return;

}





await addDoc(

collection(db,"coupons"),

{


code:code.value.toUpperCase(),

type:type.value,

discount:Number(discount.value),

minimum:Number(minimum.value),

expiry:expiry.value,

limit:Number(limit.value),

active:true,

createdAt:serverTimestamp()


}

);




alert("Coupon Created");



code.value="";
discount.value="";
minimum.value="";
expiry.value="";
limit.value="";



loadCoupons();


};






loadCoupons();



</script>



</body>

</html>
