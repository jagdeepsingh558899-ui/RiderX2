<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Pricing Control</title>


<link rel="stylesheet" href="../css/style.css">



<style>


body{

margin:0;

background:#000;

color:white;

font-family:Arial,sans-serif;

}



.header{

background:#111;

padding:20px;

font-size:25px;

font-weight:bold;

color:#FFD600;

}



.container{

padding:20px;

}



.card{

background:#111;

padding:20px;

border-radius:20px;

margin-bottom:20px;

}



input{

width:100%;

padding:15px;

margin:8px 0;

background:#222;

border:none;

border-radius:12px;

color:white;

font-size:16px;

box-sizing:border-box;

}



button{

width:100%;

padding:16px;

background:#FFD600;

color:#000;

border:none;

border-radius:15px;

font-weight:bold;

font-size:17px;

}



.title{

color:#FFD600;

font-size:20px;

font-weight:bold;

}



</style>


</head>



<body>



<div class="header">

💰 Pricing Control

</div>




<div class="container">



<div class="card">


<div class="title">

Bike Taxi

</div>


<input id="bikeRate" placeholder="Day Rate Per KM">


<input id="bikeLongRate" placeholder="Above 10 KM Rate">


<input id="bikeNightRate" placeholder="Night Rate">


</div>







<div class="card">


<div class="title">

Cab

</div>


<input id="cabRate" placeholder="Cab Rate Per KM">


</div>







<div class="card">


<div class="title">

Other Services

</div>


<input id="parcelRate" placeholder="Parcel Starting Charge">


<input id="foodRate" placeholder="Food Delivery Charge">


</div>








<div class="card">


<div class="title">

Commission

</div>


<input id="platformCommission" placeholder="Platform Commission %">


<input id="riderCommission" placeholder="Rider Commission %">


</div>







<div class="card">


<div class="title">

Minimum Fare

</div>


<input id="minimumFare" placeholder="Minimum Fare">


</div>







<button id="savePricing">

Save Pricing

</button>





</div>







<script type="module" src="../js/pricing.js"></script>



</body>

</html>
