<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin - Supports</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Dashboard.css">
<link rel="stylesheet" href="../css/Responsive.css">

<style>

:root{
    --yellow:#FFD400;
    --bg:#080808;
    --card:#151515;
    --card2:#1d1d1d;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#60a5fa;
    --orange:#f59e0b;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
    background:var(--bg);
}

body{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
}


/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:50;

    display:flex;
    align-items:center;
    gap:10px;

    padding:12px;

    background:#0c0c0c;
    border-bottom:1px solid #292929;
}

.back-btn{
    width:40px;
    height:40px;

    border:1px solid #363636;
    border-radius:11px;

    background:#1b1b1b;
    color:#fff;

    font-size:20px;
}

.logo{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:var(--yellow);
    color:#000;

    font-size:9px;
    font-weight:900;
}

.header-info{
    flex:1;
}

.header-title{
    font-size:10px;
    font-weight:900;
}

.header-subtitle{
    margin-top:3px;
    color:#777;
    font-size:5px;
}


/* MAIN */

.main{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:15px;
}


/* TOP */

.page-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    margin-bottom:13px;
}

.page-title{
    font-size:14px;
    font-weight:900;
}

.page-description{
    margin-top:4px;
    color:#777;
    font-size:6px;
}

.refresh-btn{
    height:38px;
    padding:0 13px;

    border:1px solid #5d5200;
    border-radius:10px;

    background:#1c1900;
    color:var(--yellow);

    font-size:6px;
    font-weight:900;
}


/* STATS */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:9px;

    margin-bottom:12px;
}

.stat{
    padding:13px;

    border:1px solid var(--border);
    border-radius:14px;

    background:var(--card);
}

.stat-label{
    color:#777;
    font-size:5px;
    font-weight:800;
}

.stat-value{
    margin-top:6px;
    font-size:16px;
    font-weight:900;
}


/* LAYOUT */

.content{
    display:grid;

    grid-template-columns:
        1.15fr .85fr;

    gap:12px;
}


/* TICKET LIST */

.ticket-panel,
.detail-panel{
    border:1px solid var(--border);
    border-radius:16px;

    background:var(--card);

    overflow:hidden;
}

.panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:13px;

    border-bottom:1px solid #292929;
}

.panel-title{
    font-size:8px;
    font-weight:900;
}

.panel-count{
    padding:5px 7px;

    border-radius:20px;

    background:#272300;
    color:var(--yellow);

    font-size:4.5px;
    font-weight:900;
}


/* SEARCH */

.search-box{
    padding:10px;
    border-bottom:1px solid #292929;
}

.search{
    width:100%;
    height:36px;

    padding:0 10px;

    border:1px solid #383838;
    border-radius:9px;

    outline:none;

    background:#101010;
    color:#fff;

    font-size:6px;
}

.search:focus{
    border-color:#766800;
}


/* FILTERS */

.filters{
    display:flex;
    gap:6px;

    padding:9px;

    overflow-x:auto;

    border-bottom:1px solid #292929;
}

.filter{
    flex-shrink:0;

    padding:7px 10px;

    border:1px solid #353535;
    border-radius:20px;

    background:#202020;
    color:#aaa;

    font-size:5px;
    font-weight:800;
}

.filter.active{
    border-color:#665a00;
    background:#282400;
    color:var(--yellow);
}


/* TICKET */

.ticket-list{
    max-height:600px;
    overflow-y:auto;
}

.ticket{
    padding:12px;

    border-bottom:1px solid #292929;

    cursor:pointer;

    transition:.15s;
}

.ticket:last-child{
    border-bottom:0;
}

.ticket:hover{
    background:#1b1b1b;
}

.ticket.selected{
    background:#211e00;
    border-left:3px solid var(--yellow);
}

.ticket-top{
    display:flex;
    align-items:center;
    gap:9px;
}

.ticket-avatar{
    width:34px;
    height:34px;
    min-width:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#292929;
    color:var(--yellow);

    font-size:8px;
    font-weight:900;
}

.ticket-info{
    flex:1;
    min-width:0;
}

.ticket-name{
    font-size:6.5px;
    font-weight:900;
}

.ticket-subject{
    margin-top:3px;

    overflow:hidden;

    color:#777;

    font-size:5px;

    text-overflow:ellipsis;
    white-space:nowrap;
}

.ticket-status{
    padding:5px 7px;

    border-radius:20px;

    font-size:4px;
    font-weight:900;
}

.status-open{
    background:#2c2500;
    color:var(--yellow);
}

.status-progress{
    background:#14233a;
    color:var(--blue);
}

.status-resolved{
    background:#102719;
    color:var(--green);
}

.status-closed{
    background:#252525;
    color:#888;
}

.ticket-bottom{
    display:flex;
    justify-content:space-between;

    margin-top:8px;

    color:#555;

    font-size:4.5px;
}


/* DETAIL */

.detail-body{
    min-height:500px;
}

.no-ticket{
    min-height:500px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    color:#666;

    text-align:center;

    font-size:6px;
}

.customer{
    display:flex;
    align-items:center;
    gap:10px;

    padding:13px;

    border-bottom:1px solid #292929;
}

.customer-avatar{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#282828;
    color:var(--yellow);

    font-size:10px;
    font-weight:900;
}

.customer-info{
    flex:1;
}

.customer-name{
    font-size:7px;
    font-weight:900;
}

.customer-contact{
    margin-top:4px;
    color:#777;
    font-size:5px;
}


/* CONVERSATION */

.messages{
    max-height:350px;

    padding:13px;

    overflow-y:auto;
}

.message{
    max-width:82%;

    padding:9px 10px;

    margin-bottom:8px;

    border-radius:11px;

    font-size:5.5px;
    line-height:1.5;
}

.message:last-child{
    margin-bottom:0;
}

.message.user{
    margin-right:auto;

    background:#242424;
    color:#ddd;

    border-bottom-left-radius:3px;
}

.message.admin{
    margin-left:auto;

    background:#332d00;
    color:#fff;

    border-bottom-right-radius:3px;
}

.message-time{
    margin-top:4px;

    color:#666;

    font-size:4px;
}


/* DETAIL CONTROLS */

.detail-controls{
    padding:11px;

    border-top:1px solid #292929;
    border-bottom:1px solid #292929;
}

.control-row{
    display:flex;
    gap:7px;
}

.select{
    flex:1;

    height:36px;

    padding:0 8px;

    border:1px solid #383838;
    border-radius:8px;

    outline:none;

    background:#111;
    color:#fff;

    font-size:5.5px;
}

.control-btn{
    height:36px;

    padding:0 11px;

    border:1px solid #5f5300;
    border-radius:8px;

    background:#292400;
    color:var(--yellow);

    font-size:5px;
    font-weight:900;
}


/* REPLY */

.reply{
    padding:11px;
}

.reply textarea{
    width:100%;
    min-height:75px;

    padding:9px;

    resize:vertical;

    border:1px solid #383838;
    border-radius:9px;

    outline:none;

    background:#101010;
    color:#fff;

    font-size:5.5px;
    line-height:1.5;
}

.reply textarea:focus{
    border-color:#766800;
}

.reply-actions{
    display:flex;
    justify-content:flex-end;

    gap:7px;

    margin-top:7px;
}

.send-btn{
    height:36px;

    padding:0 14px;

    border:1px solid #635700;
    border-radius:9px;

    background:var(--yellow);
    color:#000;

    font-size:5.5px;
    font-weight:900;
}


/* EMPTY */

.empty{
    padding:45px 15px;

    color:#666;

    text-align:center;

    font-size:6px;
}


/* TOAST */

.toast{
    position:fixed;

    left:50%;
    bottom:20px;

    z-index:150;

    width:calc(100% - 30px);
    max-width:450px;

    padding:11px;

    border:1px solid #383838;
    border-radius:11px;

    background:#222;
    color:#fff;

    text-align:center;

    font-size:6px;

    opacity:0;
    pointer-events:none;

    transform:translate(-50%,20px);

    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* RESPONSIVE */

@media(max-width:850px){

    .content{
        grid-template-columns:1fr;
    }

    .detail-panel{
        min-height:400px;
    }

}

@media(max-width:600px){

    .stats{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .main{
        padding:11px;
    }

}

</style>

</head>


<body>

<div class="app">


<header class="header">

    <button
        class="back-btn"
        onclick="goBack()"
        aria-label="Back"
    >
        ‹
    </button>

    <div class="logo">
        RX
    </div>

    <div class="header-info">

        <div class="header-title">
            RiderX Support
        </div>

        <div class="header-subtitle">
            Customer and rider support tickets
        </div>

    </div>

</header>


<main class="main">


<section class="page-top">

    <div>

        <div class="page-title">
            Support Center
        </div>

        <div class="page-description">
            Manage support requests and respond to users.
        </div>

    </div>

    <button
        class="refresh-btn"
        onclick="loadTickets()"
    >
        ↻ REFRESH
    </button>

</section>


<section class="stats">

    <div class="stat">

        <div class="stat-label">
            OPEN
        </div>

        <div
            class="stat-value"
            id="openCount"
            style="color:#FFD400"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            IN PROGRESS
        </div>

        <div
            class="stat-value"
            id="progressCount"
            style="color:#60a5fa"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            RESOLVED
        </div>

        <div
            class="stat-value"
            id="resolvedCount"
            style="color:#22c55e"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            TOTAL
        </div>

        <div
            class="stat-value"
            id="totalCount"
        >
            0
        </div>

    </div>

</section>


<section class="content">


<!-- TICKET LIST -->

<div class="ticket-panel">

    <div class="panel-head">

        <div class="panel-title">
            Support Tickets
        </div>

        <div
            class="panel-count"
            id="ticketCount"
        >
            0
        </div>

    </div>


    <div class="search-box">

        <input
            class="search"
            id="searchInput"
            type="search"
            placeholder="Search tickets, names or subjects..."
            oninput="renderTickets()"
        >

    </div>


    <div class="filters">

        <button
            class="filter active"
            data-filter="all"
            onclick="setFilter('all',this)"
        >
            ALL
        </button>

        <button
            class="filter"
            data-filter="open"
            onclick="setFilter('open',this)"
        >
            OPEN
        </button>

        <button
            class="filter"
            data-filter="progress"
            onclick="setFilter('progress',this)"
        >
            IN PROGRESS
        </button>

        <button
            class="filter"
            data-filter="resolved"
            onclick="setFilter('resolved',this)"
        >
            RESOLVED
        </button>

    </div>


    <div
        class="ticket-list"
        id="ticketList"
    >

        <div class="empty">
            Loading support tickets...
        </div>

    </div>

</div>


<!-- DETAIL -->

<div class="detail-panel">

    <div class="panel-head">

        <div class="panel-title">
            Ticket Details
        </div>

    </div>


    <div
        class="detail-body"
        id="detailBody"
    >

        <div class="no-ticket">
            Select a support ticket to view the conversation.
        </div>

    </div>

</div>


</section>


</main>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

const STORAGE_KEY =
    "riderxSupportTickets";


let tickets = [];

let selectedId = null;

let currentFilter = "all";

let toastTimer;


/* =========================================
   DEFAULT DATA
========================================= */

const DEFAULT_TICKETS = [

    {
        id:"RX-SUP-1001",
        name:"Customer",
        phone:"",
        role:"customer",
        subject:"Ride payment issue",
        status:"open",
        priority:"high",
        createdAt:new Date().toISOString(),
        messages:[
            {
                sender:"user",
                text:"I completed my ride but I am having an issue with the payment.",
                time:"Recently"
            }
        ]
    },

    {
        id:"RX-SUP-1002",
        name:"Rider",
        phone:"",
        role:"rider",
        subject:"Unable to go online",
        status:"progress",
        priority:"normal",
        createdAt:new Date().toISOString(),
        messages:[
            {
                sender:"user",
                text:"My rider account is approved but I cannot go online.",
                time:"Recently"
            },
            {
                sender:"admin",
                text:"We are checking your account status.",
                time:"Recently"
            }
        ]
    }

];


/* =========================================
   LOAD
========================================= */

function loadTickets(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(raw){

            const parsed =
                JSON.parse(
                    raw
                );


            if(
                Array.isArray(
                    parsed
                )
            ){

                tickets =
                    parsed;

            }

        }

    }catch(error){

        console.log(
            "Support load error:",
            error
        );

    }


    if(
        !Array.isArray(
            tickets
        )
    ){

        tickets = [];

    }


    renderStats();

    renderTickets();

    if(selectedId){

        selectTicket(
            selectedId
        );

    }

}


/* =========================================
   SAVE
========================================= */

function saveTickets(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                tickets
            )
        );

    }catch(error){

        console.log(error);

    }

}


/* =========================================
   STATS
========================================= */

function renderStats(){

    const open =
        tickets.filter(
            t =>
                normalizeStatus(t.status)
                === "open"
        ).length;


    const progress =
        tickets.filter(
            t =>
                normalizeStatus(t.status)
                === "progress"
        ).length;


    const resolved =
        tickets.filter(
            t =>
                normalizeStatus(t.status)
                === "resolved"
        ).length;


    setText(
        "openCount",
        open
    );

    setText(
        "progressCount",
        progress
    );

    setText(
        "resolvedCount",
        resolved
    );

    setText(
        "totalCount",
        tickets.length
    );

}


/* =========================================
   RENDER TICKETS
========================================= */

function renderTickets(){

    const list =
        document.getElementById(
            "ticketList"
        );


    if(!list){
        return;
    }


    const search =
        String(
            document.getElementById(
                "searchInput"
            )?.value || ""
        )
        .toLowerCase()
        .trim();


    let filtered =
        tickets.filter(
            function(ticket){

                const status =
                    normalizeStatus(
                        ticket.status
                    );


                if(
                    currentFilter !==
                    "all" &&
                    status !==
                    currentFilter
                ){

                    return false;

                }


                if(!search){
                    return true;
                }


                const text =
                    [
                        ticket.id,
                        ticket.name,
                        ticket.subject,
                        ticket.role,
                        ticket.phone
                    ]
                    .join(" ")
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    document.getElementById(
        "ticketCount"
    ).textContent =
        filtered.length;


    list.innerHTML = "";


    if(!filtered.length){

        list.innerHTML = `

            <div class="empty">

                No support tickets found.

            </div>

        `;

        return;

    }


    filtered.forEach(
        function(ticket){

            list.appendChild(
                createTicket(
                    ticket
                )
            );

        }
    );

}


/* =========================================
   CREATE TICKET
========================================= */

function createTicket(
    ticket
){

    const element =
        document.createElement(
            "div"
        );


    const status =
        normalizeStatus(
            ticket.status
        );


    const name =
        ticket.name ||
        ticket.userName ||
        "User";


    const initial =
        String(
            name
        )
        .charAt(0)
        .toUpperCase();


    element.className =
        "ticket" +
        (
            selectedId &&
            String(selectedId) ===
            String(ticket.id)
                ? " selected"
                : ""
        );


    element.onclick =
        function(){

            selectTicket(
                ticket.id
            );

        };


    element.innerHTML = `

        <div class="ticket-top">

            <div class="ticket-avatar">
                ${escapeHtml(initial)}
            </div>

            <div class="ticket-info">

                <div class="ticket-name">
                    ${escapeHtml(name)}
                </div>

                <div class="ticket-subject">
                    ${escapeHtml(
                        ticket.subject ||
                        "Support request"
                    )}
                </div>

            </div>

            <div class="
                ticket-status
                ${statusClass(status)}
            ">
                ${escapeHtml(
                    statusLabel(status)
                )}
            </div>

        </div>


        <div class="ticket-bottom">

            <span>
                ${escapeHtml(
                    ticket.id ||
                    "—"
                )}
            </span>

            <span>
                ${escapeHtml(
                    formatDate(
                        ticket.createdAt
                    )
                )}
            </span>

        </div>

    `;


    return element;

}


/* =========================================
   SELECT TICKET
========================================= */

function selectTicket(
    id
){

    const ticket =
        tickets.find(
            function(item){

                return String(
                    item.id
                ) ===
                String(id);

            }
        );


    if(!ticket){

        return;

    }


    selectedId =
        id;


    renderTickets();

    renderDetail(
        ticket
    );

}


/* =========================================
   DETAIL
========================================= */

function renderDetail(
    ticket
){

    const body =
        document.getElementById(
            "detailBody"
        );


    if(!body){
        return;
    }


    const name =
        ticket.name ||
        ticket.userName ||
        "User";


    const initial =
        String(
            name
        )
        .charAt(0)
        .toUpperCase();


    const messages =
        Array.isArray(
            ticket.messages
        )
            ? ticket.messages
            : [];


    body.innerHTML = `

        <div class="customer">

            <div class="customer-avatar">
                ${escapeHtml(initial)}
            </div>

            <div class="customer-info">

                <div class="customer-name">
                    ${escapeHtml(name)}
                </div>

                <div class="customer-contact">
                    ${escapeHtml(
                        ticket.role ||
                        "user"
                    )}
                    ${ticket.phone
                        ? " • " +
                          escapeHtml(
                              ticket.phone
                          )
                        : ""}
                </div>

            </div>

        </div>


        <div
            class="messages"
            id="messages"
        >

            ${
                messages.length
                    ? messages.map(
                        createMessage
                      ).join("")
                    : `
                        <div class="empty">
                            No messages yet.
                        </div>
                    `
            }

        </div>


        <div class="detail-controls">

            <div class="control-row">

                <select
                    class="select"
                    id="statusSelect"
                >

                    <option
                        value="open"
                        ${
                            normalizeStatus(
                                ticket.status
                            ) === "open"
                                ? "selected"
                                : ""
                        }
                    >
                        Open
                    </option>

                    <option
                        value="progress"
                        ${
                            normalizeStatus(
                                ticket.status
                            ) === "progress"
                                ? "selected"
                                : ""
                        }
                    >
                        In Progress
                    </option>

                    <option
                        value="resolved"
                        ${
                            normalizeStatus(
                                ticket.status
                            ) === "resolved"
                                ? "selected"
                                : ""
                        }
                    >
                        Resolved
                    </option>

                    <option
                        value="closed"
                        ${
                            normalizeStatus(
                                ticket.status
                            ) === "closed"
                                ? "selected"
                                : ""
                        }
                    >
                        Closed
                    </option>

                </select>


                <button
                    class="control-btn"
                    onclick="updateStatus()"
                >
                    UPDATE
                </button>

            </div>

        </div>


        <div class="reply">

            <textarea
                id="replyText"
                placeholder="Write a reply to the user..."
            ></textarea>


            <div class="reply-actions">

                <button
                    class="send-btn"
                    onclick="sendReply()"
                >
                    SEND REPLY
                </button>

            </div>

        </div>

    `;


    const messagesBox =
        document.getElementById(
            "messages"
        );


    if(messagesBox){

        messagesBox.scrollTop =
            messagesBox.scrollHeight;

    }

}


/* =========================================
   MESSAGE
========================================= */

function createMessage(
    message
){

    const sender =
        message.sender ===
        "admin"
            ? "admin"
            : "user";


    return `

        <div
            class="message ${sender}"
        >

            ${escapeHtml(
                message.text ||
                ""
            )}

            <div class="message-time">

                ${escapeHtml(
                    message.time ||
                    "Now"
                )}

            </div>

        </div>

    `;

}


/* =========================================
   SEND REPLY
========================================= */

function sendReply(){

    const ticket =
        getSelectedTicket();


    if(!ticket){

        showToast(
            "Please select a ticket first."
        );

        return;

    }


    const input =
        document.getElementById(
            "replyText"
        );


    if(!input){
        return;
    }


    const text =
        input.value.trim();


    if(!text){

        showToast(
            "Write a reply first."
        );

        input.focus();

        return;

    }


    if(
        !Array.isArray(
            ticket.messages
        )
    ){

        ticket.messages = [];

    }


    ticket.messages.push({

        sender:"admin",

        text:text,

        time:new Date()
            .toLocaleString()

    });


    ticket.status =
        "progress";


    saveTickets();

    renderStats();

    renderTickets();

    renderDetail(
        ticket
    );


    showToast(
        "Reply sent successfully."
    );

}


/* =========================================
   UPDATE STATUS
========================================= */

function updateStatus(){

    const ticket =
        getSelectedTicket();


    if(!ticket){

        showToast(
            "Please select a ticket first."
        );

        return;

    }


    const select =
        document.getElementById(
            "statusSelect"
        );


    if(!select){
        return;
    }


    ticket.status =
        normalizeStatus(
            select.value
        );


    ticket.updatedAt =
        new Date().toISOString();


    saveTickets();

    renderStats();

    renderTickets();

    renderDetail(
        ticket
    );


    showToast(
        "Ticket status updated."
    );

}


/* =========================================
   FILTER
========================================= */

function setFilter(
    filter,
    button
){

    currentFilter =
        filter;


    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            function(item){

                item.classList.remove(
                    "active"
                );

            }
        );


    if(button){

        button.classList.add(
            "active"
        );

    }


    renderTickets();

}


/* =========================================
   SELECTED
========================================= */

function getSelectedTicket(){

    if(!selectedId){

        return null;

    }


    return tickets.find(
        function(ticket){

            return String(
                ticket.id
            ) ===
            String(
                selectedId
            );

        }
    ) || null;

}


/* =========================================
   STATUS
========================================= */

function normalizeStatus(
    status
){

    const value =
        String(
            status ||
            "open"
        )
        .toLowerCase();


    if(
        value ===
        "in_progress" ||
        value ===
        "in-progress" ||
        value ===
        "pending"
    ){

        return "progress";

    }


    if(
        value ===
        "done"
    ){

        return "resolved";

    }


    return value;

}


function statusLabel(
    status
){

    const labels = {

        open:"Open",

        progress:"In Progress",

        resolved:"Resolved",

        closed:"Closed"

    };


    return labels[
        status
    ] || "Open";

}


function statusClass(
    status
){

    if(
        status ===
        "progress"
    ){

        return "status-progress";

    }


    if(
        status ===
        "resolved"
    ){

        return "status-resolved";

    }


    if(
        status ===
        "closed"
    ){

        return "status-closed";

    }


    return "status-open";

}


/* =========================================
   NAVIGATION
========================================= */

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ){

        history.back();

    }
    else{

        window.location.href =
            "dashboard.html";

    }

}


/* =========================================
   HELPERS
========================================= */

function setText(
    id,
    value
){

    const element =
        document.getElementById(
            id
        );


    if(element){

        element.textContent =
            value;

    }

}


function formatDate(
    value
){

    if(!value){

        return "—";

    }


    try{

        return new Date(
            value
        ).toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short"
            }
        );

    }catch(error){

        return "—";

    }

}


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   TOAST
========================================= */

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){
        return;
    }


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================
   INIT
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadTickets();

    }
);

</script>
