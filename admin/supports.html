<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Support</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.card{

background:#111;
padding:20px;
border-radius:18px;
margin:15px 0;
border:1px solid #333;

}


button{

width:100%;
padding:14px;
margin-top:10px;
background:#FFD600;
border:none;
border-radius:12px;
font-weight:bold;

}


.status{

color:#FFD600;

}


</style>

</head>


<body>


<div class="header">

🛠 RiderX Support

</div>



<div class="container">


<h2>
Support Requests
</h2>


<div id="supportList">

Loading...

</div>


</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs,
doc,
updateDoc,
orderBy,
query

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function loadSupport(){



const box =
document.getElementById("supportList");



const q=query(

collection(db,"supports"),

orderBy("createdAt","desc")

);



const snap =
await getDocs(q);



box.innerHTML="";





if(snap.empty){


box.innerHTML=

"<p>No Support Requests</p>";


return;

}





snap.forEach((item)=>{


let data=item.data();



box.innerHTML += `


<div class="card">


<h3>

${data.subject || "Support"}

</h3>


<p>

👤 User:

${data.userId || "-"}

</p>



<p>

📝 Message:

<br>

${data.message || "-"}

</p>



<p class="status">

Status:

${data.status || "Pending"}

</p>



<button onclick="closeTicket('${item.id}')">

✅ Resolve

</button>



</div>


`;



});


}








window.closeTicket=async(id)=>{


await updateDoc(

doc(db,"supports",id),

{

status:"Resolved"

}

);



alert("Ticket Resolved ✅");


loadSupport();


};





loadSupport();



</script>


</body>

</html>
