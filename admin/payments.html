<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFD400"><title>RiderX Admin - Payments</title><link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css"><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    min-height:100vh;
    padding-bottom:70px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:#111;
    border-bottom:1px solid #292929;
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.back-btn{
    width:40px;
    height:40px;
    border:1px solid #333;
    border-radius:10px;
    background:#1b1b1b;
    color:#fff;
    cursor:pointer;
    font-size:20px;
}

.title{
    font-size:17px;
    font-weight:900;
}

.title span{
    color:#FFD400;
}

.logo{
    color:#FFD400;
    font-size:18px;
    font-weight:1000;
}

.content{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:18px;
}

.hero{
    margin-bottom:16px;
    padding:18px;
    border:1px solid #292929;
    border-radius:18px;
    background:linear-gradient(145deg,#181818,#101010);
}

.hero h1{
    margin:0;
    font-size:23px;
}

.hero p{
    margin:7px 0 0;
    color:#888;
    font-size:12px;
    line-height:1.5;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:16px;
}

.stat{
    padding:15px;
    border:1px solid #292929;
    border-radius:14px;
    background:#141414;
}

.stat-label{
    color:#777;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.stat-value{
    margin-top:7px;
    font-size:20px;
    font-weight:1000;
}

.stat-value.yellow{
    color:#FFD400;
}

.stat-value.green{
    color:#63e78a;
}

.stat-value.red{
    color:#ff7777;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:210px;
    height:43px;
    padding:0 13px;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
    background:#171717;
    color:#fff;
}

.search:focus{
    border-color:#FFD400;
}

.filter{
    height:43px;
    padding:0 12px;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
    background:#171717;
    color:#fff;
}

.table-wrap{
    overflow-x:auto;
    border:1px solid #292929;
    border-radius:15px;
    background:#121212;
}

table{
    width:100%;
    min-width:950px;
    border-collapse:collapse;
}

th{
    padding:13px;
    text-align:left;
    color:#777;
    background:#171717;
    border-bottom:1px solid #292929;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
    white-space:nowrap;
}

td{
    padding:13px;
    border-bottom:1px solid #242424;
    font-size:11px;
    vertical-align:middle;
}

tr:last-child td{
    border-bottom:0;
}

.payment-id{
    color:#FFD400;
    font-size:9px;
    font-weight:900;
}

.user{
    font-weight:900;
}

.sub{
    margin-top:3px;
    color:#666;
    font-size:9px;
}

.amount{
    font-size:13px;
    font-weight:1000;
}

.method{
    display:inline-flex;
    padding:5px 8px;
    border-radius:6px;
    background:#242424;
    color:#aaa;
    font-size:8px;
    font-weight:900;
}

.badge{
    display:inline-flex;
    padding:5px 8px;
    border-radius:6px;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
}

.badge.success{
    background:#17351f;
    color:#63e78a;
}

.badge.pending{
    background:#332b0d;
    color:#FFD400;
}

.badge.failed{
    background:#321919;
    color:#ff7777;
}

.badge.refunded{
    background:#242b35;
    color:#8db8ff;
}

.actions{
    display:flex;
    gap:6px;
}

.action{
    height:30px;
    padding:0 9px;
    border:1px solid #333;
    border-radius:7px;
    background:#1c1c1c;
    color:#aaa;
    cursor:pointer;
    font-size:9px;
    font-weight:800;
}

.action:hover{
    border-color:#FFD400;
    color:#FFD400;
}

.empty{
    display:none;
    padding:45px 20px;
    text-align:center;
    color:#777;
}

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:rgba(0,0,0,.78);
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    padding:20px;
    border:1px solid #333;
    border-radius:18px;
    background:#131313;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.modal-head h2{
    margin:0;
    font-size:18px;
}

.close{
    width:35px;
    height:35px;
    border:1px solid #333;
    border-radius:9px;
    background:#1e1e1e;
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.detail{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.detail-item{
    padding:12px;
    border:1px solid #292929;
    border-radius:10px;
    background:#191919;
}

.detail-label{
    color:#666;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
}

.detail-value{
    margin-top:5px;
    color:#fff;
    font-size:12px;
    font-weight:800;
    word-break:break-word;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:17px;
}

.secondary{
    height:42px;
    padding:0 13px;
    border:1px solid #333;
    border-radius:9px;
    background:#1d1d1d;
    color:#aaa;
    cursor:pointer;
    font-weight:800;
}

.primary{
    height:42px;
    padding:0 13px;
    border:0;
    border-radius:9px;
    background:#FFD400;
    color:#111;
    cursor:pointer;
    font-weight:900;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    z-index:2000;
    transform:translate(-50%,120px);
    opacity:0;
    padding:11px 16px;
    border-radius:10px;
    background:#17351f;
    color:#65e58b;
    font-size:11px;
    font-weight:800;
    transition:.25s;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

@media(max-width:750px){

    .content{
        padding:12px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:500px){

    .detail{
        grid-template-columns:1fr;
    }

}

</style></head><body><div class="page"><header class="topbar"><div class="top-left">

    <button
        class="back-btn"
        type="button"
        onclick="history.back()"
    >
        ←
    </button>

    <div class="title">
        <span>RiderX</span> Payments
    </div>

</div>

<div class="logo">
    RX
</div>

</header><main class="content"><section class="hero"><h1>
    Payments
</h1>

<p>
    Monitor customer payments, rider earnings,
    transaction status and refunds.
</p>

</section><section class="stats"><div class="stat">

    <div class="stat-label">
        Total Volume
    </div>

    <div
        class="stat-value yellow"
        id="totalVolume"
    >
        ₹0
    </div>

</div>


<div class="stat">

    <div class="stat-label">
        Successful
    </div>

    <div
        class="stat-value green"
        id="successVolume"
    >
        ₹0
    </div>

</div>


<div class="stat">

    <div class="stat-label">
        Pending
    </div>

    <div
        class="stat-value"
        id="pendingVolume"
    >
        ₹0
    </div>

</div>


<div class="stat">

    <div class="stat-label">
        Failed / Refund
    </div>

    <div
        class="stat-value red"
        id="failedVolume"
    >
        ₹0
    </div>

</div>

</section><section class="toolbar"><input
    type="search"
    id="search"
    class="search"
    placeholder="Search payment, user or ride..."
>


<select
    id="statusFilter"
    class="filter"
>

    <option value="all">
        All Status
    </option>

    <option value="success">
        Success
    </option>

    <option value="pending">
        Pending
    </option>

    <option value="failed">
        Failed
    </option>

    <option value="refunded">
        Refunded
    </option>

</select>


<select
    id="methodFilter"
    class="filter"
>

    <option value="all">
        All Methods
    </option>

    <option value="upi">
        UPI
    </option>

    <option value="card">
        Card
    </option>

    <option value="wallet">
        Wallet
    </option>

    <option value="cash">
        Cash
    </option>

</select>

</section><section class="table-wrap"><table><thead><tr><th>
    Payment
</th>

<th>
    User
</th>

<th>
    Ride
</th>

<th>
    Amount
</th>

<th>
    Method
</th>

<th>
    Date
</th>

<th>
    Status
</th>

<th>
    Action
</th>

</tr></thead><tbody
    id="paymentTable"
></tbody></table><div
    class="empty"
    id="empty"
>
    No payments found.
</div></section></main></div><div
    class="modal"
    id="modal"
><div class="modal-card"><div class="modal-head">

    <h2>
        Payment Details
    </h2>

    <button
        type="button"
        class="close"
        id="closeBtn"
    >
        ×
    </button>

</div>


<div
    class="detail"
    id="details"
></div>


<div class="modal-actions">

    <button
        type="button"
        class="secondary"
        id="closeDetails"
    >
        Close
    </button>

</div>

</div></div><div
    class="toast"
    id="toast"
></div><script>

"use strict";


const STORAGE_KEY =
    "riderx_admin_payments";


const DEFAULT_PAYMENTS = [

    {
        id:"RX-PAY-1001",
        user:"Jagdeep",
        phone:"98******21",
        ride:"RX-RIDE-501",
        amount:180,
        method:"upi",
        status:"success",
        date:"2026-08-09 10:24"
    },

    {
        id:"RX-PAY-1002",
        user:"Aman",
        phone:"97******44",
        ride:"RX-RIDE-502",
        amount:245,
        method:"card",
        status:"success",
        date:"2026-08-09 09:58"
    },

    {
        id:"RX-PAY-1003",
        user:"Simran",
        phone:"88******31",
        ride:"RX-RIDE-503",
        amount:120,
        method:"wallet",
        status:"pending",
        date:"2026-08-09 09:32"
    },

    {
        id:"RX-PAY-1004",
        user:"Rahul",
        phone:"90******75",
        ride:"RX-RIDE-504",
        amount:310,
        method:"cash",
        status:"success",
        date:"2026-08-08 22:14"
    },

    {
        id:"RX-PAY-1005",
        user:"Neha",
        phone:"86******17",
        ride:"RX-RIDE-505",
        amount:195,
        method:"upi",
        status:"refunded",
        date:"2026-08-08 20:42"
    },

    {
        id:"RX-PAY-1006",
        user:"Karan",
        phone:"91******62",
        ride:"RX-RIDE-506",
        amount:90,
        method:"card",
        status:"failed",
        date:"2026-08-08 18:20"
    }

];


let payments = [];


const table =
    document.getElementById(
        "paymentTable"
    );

const empty =
    document.getElementById(
        "empty"
    );

const search =
    document.getElementById(
        "search"
    );

const statusFilter =
    document.getElementById(
        "statusFilter"
    );

const methodFilter =
    document.getElementById(
        "methodFilter"
    );

const modal =
    document.getElementById(
        "modal"
    );

const details =
    document.getElementById(
        "details"
    );

const toast =
    document.getElementById(
        "toast"
    );



document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadPayments();

        render();

    }
);



function loadPayments(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(saved){

            const parsed =
                JSON.parse(
                    saved
                );


            if(
                Array.isArray(
                    parsed
                )
            ){

                payments =
                    parsed;

                return;

            }

        }

    }catch(error){

        console.error(
            "Payment load error:",
            error
        );

    }


    payments =
        [...DEFAULT_PAYMENTS];

    savePayments();

}



function savePayments(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            payments
        )
    );

}



function render(){

    updateStats();


    const query =
        search.value
            .trim()
            .toLowerCase();


    const status =
        statusFilter.value;


    const method =
        methodFilter.value;


    const filtered =
        payments.filter(
            function(payment){

                if(
                    status !== "all" &&
                    payment.status !== status
                ){

                    return false;

                }


                if(
                    method !== "all" &&
                    payment.method !== method
                ){

                    return false;

                }


                if(!query){

                    return true;

                }


                return (

                    payment.id
                        .toLowerCase()
                        .includes(query)

                    ||

                    payment.user
                        .toLowerCase()
                        .includes(query)

                    ||

                    payment.ride
                        .toLowerCase()
                        .includes(query)

                );

            }
        );


    table.innerHTML =
        "";


    filtered.forEach(
        function(payment){

            table.appendChild(
                createRow(
                    payment
                )
            );

        }
    );


    empty.style.display =
        filtered.length
            ? "none"
            : "block";

}



function createRow(
    payment
){

    const tr =
        document.createElement(
            "tr"
        );


    tr.innerHTML = `

        <td>

            <div class="payment-id">
                ${escapeHtml(payment.id)}
            </div>

        </td>


        <td>

            <div class="user">
                ${escapeHtml(payment.user)}
            </div>

            <div class="sub">
                ${escapeHtml(payment.phone)}
            </div>

        </td>


        <td>

            <div class="payment-id">
                ${escapeHtml(payment.ride)}
            </div>

        </td>


        <td>

            <div class="amount">
                ₹${formatMoney(payment.amount)}
            </div>

        </td>


        <td>

            <span class="method">
                ${escapeHtml(
                    payment.method.toUpperCase()
                )}
            </span>

        </td>


        <td>
            ${escapeHtml(payment.date)}
        </td>


        <td>

            <span class="badge ${escapeHtml(payment.status)}">
                ${escapeHtml(payment.status)}
            </span>

        </td>


        <td>

            <div class="actions">

                <button
                    type="button"
                    class="action"
                    data-id="${escapeHtml(payment.id)}"
                >
                    View
                </button>

            </div>

        </td>

    `;


    return tr;

}



table.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "button[data-id]"
            );


        if(!button){

            return;

        }


        openDetails(
            button.dataset.id
        );

    }
);



function openDetails(
    id
){

    const payment =
        payments.find(
            function(item){

                return item.id ===
                    id;

            }
        );


    if(!payment){

        return;

    }


    details.innerHTML = `

        <div class="detail-item">

            <div class="detail-label">
                Payment ID
            </div>

            <div class="detail-value">
                ${escapeHtml(payment.id)}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                Ride ID
            </div>

            <div class="detail-value">
                ${escapeHtml(payment.ride)}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                Customer
            </div>

            <div class="detail-value">
                ${escapeHtml(payment.user)}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                Phone
            </div>

            <div class="detail-value">
                ${escapeHtml(payment.phone)}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                Amount
            </div>

            <div class="detail-value">
                ₹${formatMoney(payment.amount)}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                Payment Method
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    payment.method.toUpperCase()
                )}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                Status
            </div>

            <div class="detail-value">
                ${escapeHtml(payment.status)}
            </div>

        </div>


        <div class="detail-item">

            <div class="detail-label">
                Date
            </div>

            <div class="detail-value">
                ${escapeHtml(payment.date)}
            </div>

        </div>

    `;


    modal.classList.add(
        "show"
    );

}



function closeModal(){

    modal.classList.remove(
        "show"
    );

}



document
    .getElementById(
        "closeBtn"
    )
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById(
        "closeDetails"
    )
    .addEventListener(
        "click",
        closeModal
    );


modal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            modal
        ){

            closeModal();

        }

    }
);



search.addEventListener(
    "input",
    render
);


statusFilter.addEventListener(
    "change",
    render
);


methodFilter.addEventListener(
    "change",
    render
);



function updateStats(){

    let total =
        0;

    let success =
        0;

    let pending =
        0;

    let failed =
        0;


    payments.forEach(
        function(payment){

            const amount =
                Number(
                    payment.amount
                ) || 0;


            total +=
                amount;


            if(
                payment.status ===
                "success"
            ){

                success +=
                    amount;

            }


            if(
                payment.status ===
                "pending"
            ){

                pending +=
                    amount;

            }


            if(
                payment.status ===
                "failed" ||
                payment.status ===
                "refunded"
            ){

                failed +=
                    amount;

            }

        }
    );


    document
        .getElementById(
            "totalVolume"
        )
        .textContent =
        "₹" +
        formatMoney(total);


    document
        .getElementById(
            "successVolume"
        )
        .textContent =
        "₹" +
        formatMoney(success);


    document
        .getElementById(
            "pendingVolume"
        )
        .textContent =
        "₹" +
        formatMoney(pending);


    document
        .getElementById(
            "failedVolume"
        )
        .textContent =
        "₹" +
        formatMoney(failed);

}



function formatMoney(
    value
){

    return Number(
        value || 0
    ).toLocaleString(
        "en-IN",
        {
            maximumFractionDigits:2
        }
    );

}



function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



function showToast(
    message
){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.paymentToast
    );

    window.paymentToast =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}

</script></body></html>
