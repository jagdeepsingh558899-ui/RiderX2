<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin - Payments</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

.header{
    background:#ffcc00;
    color:#000;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    padding:20px;
}


.payment-card{

    background:#1d1d1d;
    padding:15px;
    margin:15px 0;
    border-radius:12px;
    border:1px solid #333;

}


.payment-card h3{
    color:#ffcc00;
}


.back{

display:inline-block;
margin-top:20px;
background:#ffcc00;
color:#000;
padding:12px 20px;
border-radius:10px;
text-decoration:none;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">
💰 RiderX Payments
</div>


<div class="container">


<h2>Payment Records</h2>


<div id="paymentList">
Loading payments...
</div>


<a class="back" href="dashboard.html">
⬅ Back Dashboard
</a>


</div>



<script type="module">

import { db } from "../firebase/config.js";


import {

collection,
getDocs

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



async function loadPayments(){


let box=document.getElementById("paymentList");


try{


const snapshot=await getDocs(collection(db,"payments"));


box.innerHTML="";


if(snapshot.empty){

box.innerHTML="<p>No payments found</p>";

return;

}



snapshot.forEach((doc)=>{


let data=doc.data();


box.innerHTML += `

<div class="payment-card">


<h3>
💳 Payment ID: ${doc.id}
</h3>


<p>
👤 Customer: ${data.customer || "N/A"}
</p>


<p>
💰 Amount: ₹${data.amount || "0"}
</p>


<p>
📌 Method: ${data.method || "Cash"}
</p>


<p>
Status: ${data.status || "Pending"}
</p>


</div>

`;

});


}


catch(error){

box.innerHTML="Error loading payments";
console.log(error);

}


}



loadPayments();


</script>


</body>

</html>
