<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFD400"><title>RiderX Admin - Offers</title><link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Dashboard.css">
<link rel="stylesheet" href="../css/Responsive.css"><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    min-height:100vh;
    padding-bottom:70px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:#111;
    border-bottom:1px solid #292929;
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.back-btn{
    width:40px;
    height:40px;
    border:1px solid #333;
    border-radius:10px;
    background:#1b1b1b;
    color:#fff;
    cursor:pointer;
    font-size:20px;
}

.title{
    font-size:17px;
    font-weight:900;
}

.title span{
    color:#FFD400;
}

.logo{
    color:#FFD400;
    font-size:18px;
    font-weight:1000;
}

.content{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:16px;
    padding:18px;
    border:1px solid #292929;
    border-radius:18px;
    background:linear-gradient(145deg,#181818,#101010);
}

.hero h1{
    margin:0;
    font-size:23px;
}

.hero p{
    margin:7px 0 0;
    color:#888;
    font-size:12px;
    line-height:1.5;
}

.primary{
    height:44px;
    padding:0 15px;
    border:0;
    border-radius:10px;
    background:#FFD400;
    color:#111;
    cursor:pointer;
    font-size:12px;
    font-weight:1000;
    white-space:nowrap;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:16px;
}

.stat{
    padding:14px;
    border:1px solid #292929;
    border-radius:14px;
    background:#141414;
}

.stat-label{
    color:#777;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.stat-value{
    margin-top:7px;
    font-size:21px;
    font-weight:1000;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:220px;
    height:43px;
    padding:0 13px;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
    background:#171717;
    color:#fff;
}

.search:focus{
    border-color:#FFD400;
}

.filter{
    height:43px;
    padding:0 12px;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
    background:#171717;
    color:#fff;
}

.table-wrap{
    overflow-x:auto;
    border:1px solid #292929;
    border-radius:15px;
    background:#121212;
}

table{
    width:100%;
    min-width:850px;
    border-collapse:collapse;
}

th{
    padding:13px;
    text-align:left;
    color:#777;
    background:#171717;
    border-bottom:1px solid #292929;
    font-size:9px;
    text-transform:uppercase;
    white-space:nowrap;
}

td{
    padding:13px;
    border-bottom:1px solid #242424;
    font-size:11px;
    vertical-align:middle;
}

tr:last-child td{
    border-bottom:0;
}

.offer-name{
    font-weight:900;
}

.offer-code{
    margin-top:4px;
    color:#FFD400;
    font-size:9px;
    font-weight:900;
}

.badge{
    display:inline-flex;
    padding:5px 8px;
    border-radius:6px;
    background:#242424;
    color:#aaa;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
}

.badge.active{
    background:#17351f;
    color:#63e78a;
}

.badge.paused{
    background:#332b0d;
    color:#FFD400;
}

.badge.expired{
    background:#321919;
    color:#ff7777;
}

.actions{
    display:flex;
    gap:6px;
}

.action{
    height:30px;
    padding:0 9px;
    border:1px solid #333;
    border-radius:7px;
    background:#1c1c1c;
    color:#aaa;
    cursor:pointer;
    font-size:9px;
    font-weight:800;
}

.action:hover{
    border-color:#FFD400;
    color:#FFD400;
}

.empty{
    display:none;
    padding:45px 20px;
    text-align:center;
    color:#777;
}

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:rgba(0,0,0,.78);
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:560px;
    max-height:92vh;
    overflow-y:auto;
    padding:20px;
    border:1px solid #333;
    border-radius:18px;
    background:#131313;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.modal-head h2{
    margin:0;
    font-size:18px;
}

.close{
    width:35px;
    height:35px;
    border:1px solid #333;
    border-radius:9px;
    background:#1e1e1e;
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    margin-bottom:6px;
    color:#999;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.field input,
.field select{
    width:100%;
    height:43px;
    padding:0 11px;
    border:1px solid #333;
    border-radius:9px;
    outline:none;
    background:#1b1b1b;
    color:#fff;
    font-size:12px;
}

.field input:focus,
.field select:focus{
    border-color:#FFD400;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:17px;
}

.secondary{
    height:43px;
    padding:0 13px;
    border:1px solid #333;
    border-radius:9px;
    background:#1d1d1d;
    color:#aaa;
    cursor:pointer;
    font-weight:800;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    z-index:2000;
    transform:translate(-50%,120px);
    opacity:0;
    padding:11px 16px;
    border-radius:10px;
    background:#17351f;
    color:#65e58b;
    font-size:11px;
    font-weight:800;
    transition:.25s;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

@media(max-width:750px){

    .content{
        padding:12px;
    }

    .hero{
        align-items:flex-start;
        flex-direction:column;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:480px){

    .row{
        grid-template-columns:1fr;
    }

}

</style></head><body><div class="page"><header class="topbar"><div class="top-left">

    <button
        class="back-btn"
        type="button"
        onclick="history.back()"
    >
        ←
    </button>

    <div class="title">
        <span>RiderX</span> Offers
    </div>

</div>

<div class="logo">
    RX
</div>

</header><main class="content"><section class="hero"><div>

    <h1>
        Offers
    </h1>

    <p>
        Create and manage promotional offers for
        RiderX customers and riders.
    </p>

</div>


<button
    type="button"
    class="primary"
    id="addBtn"
>
    + Create Offer
</button>

</section><section class="stats"><div class="stat">

    <div class="stat-label">
        Total Offers
    </div>

    <div
        class="stat-value"
        id="totalCount"
    >
        0
    </div>

</div>


<div class="stat">

    <div class="stat-label">
        Active
    </div>

    <div
        class="stat-value"
        id="activeCount"
    >
        0
    </div>

</div>


<div class="stat">

    <div class="stat-label">
        Paused
    </div>

    <div
        class="stat-value"
        id="pausedCount"
    >
        0
    </div>

</div>


<div class="stat">

    <div class="stat-label">
        Expired
    </div>

    <div
        class="stat-value"
        id="expiredCount"
    >
        0
    </div>

</div>

</section><section class="toolbar"><input
    type="search"
    id="search"
    class="search"
    placeholder="Search offer or code..."
>


<select
    id="statusFilter"
    class="filter"
>

    <option value="all">
        All Status
    </option>

    <option value="active">
        Active
    </option>

    <option value="paused">
        Paused
    </option>

    <option value="expired">
        Expired
    </option>

</select>

</section><section class="table-wrap"><table><thead><tr><th>
    Offer
</th>

<th>
    Discount
</th>

<th>
    Service
</th>

<th>
    Validity
</th>

<th>
    Usage
</th>

<th>
    Status
</th>

<th>
    Actions
</th>

</tr></thead><tbody
    id="offerTable"
></tbody></table><div
    class="empty"
    id="empty"
>
    No offers found.
</div></section></main></div><div
    class="modal"
    id="modal"
><div class="modal-card"><div class="modal-head">

    <h2 id="modalTitle">
        Create Offer
    </h2>

    <button
        type="button"
        class="close"
        id="closeBtn"
    >
        ×
    </button>

</div>


<form id="offerForm">

    <input
        type="hidden"
        id="editId"
    >


    <div class="field">

        <label>
            Offer Name
        </label>

        <input
            id="offerName"
            maxlength="70"
            placeholder="Example: First Ride Offer"
            required
        >

    </div>


    <div class="row">

        <div class="field">

            <label>
                Coupon Code
            </label>

            <input
                id="offerCode"
                maxlength="30"
                placeholder="RIDERX50"
                required
            >

        </div>


        <div class="field">

            <label>
                Discount Type
            </label>

            <select id="discountType">

                <option value="percentage">
                    Percentage
                </option>

                <option value="flat">
                    Flat Amount
                </option>

            </select>

        </div>

    </div>


    <div class="row">

        <div class="field">

            <label>
                Discount Value
            </label>

            <input
                id="discountValue"
                type="number"
                min="1"
                step="0.01"
                placeholder="50"
                required
            >

        </div>


        <div class="field">

            <label>
                Maximum Discount
            </label>

            <input
                id="maxDiscount"
                type="number"
                min="0"
                step="0.01"
                placeholder="100"
            >

        </div>

    </div>


    <div class="row">

        <div class="field">

            <label>
                Service
            </label>

            <select id="service">

                <option value="all">
                    All Services
                </option>

                <option value="bike">
                    Bike Taxi
                </option>

                <option value="cab">
                    Cab
                </option>

                <option value="parcel">
                    Parcel
                </option>

                <option value="food">
                    Food Delivery
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Status
            </label>

            <select id="status">

                <option value="active">
                    Active
                </option>

                <option value="paused">
                    Paused
                </option>

            </select>

        </div>

    </div>


    <div class="row">

        <div class="field">

            <label>
                Start Date
            </label>

            <input
                id="startDate"
                type="date"
                required
            >

        </div>


        <div class="field">

            <label>
                End Date
            </label>

            <input
                id="endDate"
                type="date"
                required
            >

        </div>

    </div>


    <div class="row">

        <div class="field">

            <label>
                Usage Limit
            </label>

            <input
                id="usageLimit"
                type="number"
                min="0"
                placeholder="1000"
            >

        </div>


        <div class="field">

            <label>
                Minimum Fare
            </label>

            <input
                id="minFare"
                type="number"
                min="0"
                step="0.01"
                placeholder="100"
            >

        </div>

    </div>


    <div class="modal-actions">

        <button
            type="button"
            class="secondary"
            id="cancelBtn"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="primary"
        >
            Save Offer
        </button>

    </div>

</form>

</div></div><div
    class="toast"
    id="toast"
></div><script>

"use strict";


const STORAGE_KEY =
    "riderx_admin_offers";


const DEFAULT_OFFERS = [

    {
        id:"offer_001",
        name:"Welcome Ride",
        code:"WELCOME50",
        discountType:"percentage",
        discountValue:50,
        maxDiscount:100,
        service:"all",
        startDate:"2026-08-01",
        endDate:"2026-08-31",
        usageLimit:1000,
        used:127,
        minFare:100,
        status:"active"
    },

    {
        id:"offer_002",
        name:"Bike Taxi Special",
        code:"BIKE30",
        discountType:"percentage",
        discountValue:30,
        maxDiscount:75,
        service:"bike",
        startDate:"2026-08-01",
        endDate:"2026-08-20",
        usageLimit:500,
        used:94,
        minFare:60,
        status:"active"
    },

    {
        id:"offer_003",
        name:"Flat Fare Offer",
        code:"RIDE100",
        discountType:"flat",
        discountValue:100,
        maxDiscount:100,
        service:"cab",
        startDate:"2026-07-01",
        endDate:"2026-07-31",
        usageLimit:300,
        used:300,
        minFare:250,
        status:"expired"
    }

];


let offers = [];


const table =
    document.getElementById(
        "offerTable"
    );

const empty =
    document.getElementById(
        "empty"
    );

const search =
    document.getElementById(
        "search"
    );

const statusFilter =
    document.getElementById(
        "statusFilter"
    );

const modal =
    document.getElementById(
        "modal"
    );

const offerForm =
    document.getElementById(
        "offerForm"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const toast =
    document.getElementById(
        "toast"
    );



document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadOffers();

        render();

    }
);



function loadOffers(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(saved){

            const parsed =
                JSON.parse(
                    saved
                );


            if(
                Array.isArray(
                    parsed
                )
            ){

                offers =
                    parsed;

                return;

            }

        }

    }catch(error){

        console.error(
            error
        );

    }


    offers =
        [...DEFAULT_OFFERS];

    saveOffers();

}



function saveOffers(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            offers
        )
    );

}



function render(){

    updateStats();


    const query =
        search.value
            .trim()
            .toLowerCase();


    const filter =
        statusFilter.value;


    const filtered =
        offers.filter(
            function(offer){

                if(
                    filter !== "all" &&
                    offer.status !== filter
                ){

                    return false;

                }


                if(!query){

                    return true;

                }


                return (

                    offer.name
                        .toLowerCase()
                        .includes(
                            query
                        )

                    ||

                    offer.code
                        .toLowerCase()
                        .includes(
                            query
                        )

                );

            }
        );


    table.innerHTML =
        "";


    filtered.forEach(
        function(offer){

            table.appendChild(
                createRow(
                    offer
                )
            );

        }
    );


    empty.style.display =
        filtered.length
            ? "none"
            : "block";

}



function createRow(
    offer
){

    const tr =
        document.createElement(
            "tr"
        );


    const discount =
        offer.discountType ===
        "percentage"
            ? offer.discountValue + "%"
            : "₹" + offer.discountValue;


    const service =
        serviceName(
            offer.service
        );


    const usage =
        offer.usageLimit
            ? offer.used + " / " + offer.usageLimit
            : offer.used + " used";


    tr.innerHTML = `

        <td>
            <div class="offer-name">
                ${escapeHtml(offer.name)}
            </div>
            <div class="offer-code">
                ${escapeHtml(offer.code)}
            </div>
        </td>

        <td>
            <strong>${escapeHtml(discount)}</strong>
        </td>

        <td>
            ${escapeHtml(service)}
        </td>

        <td>
            ${escapeHtml(offer.startDate)}
            <br>
            <span style="color:#666">
                to ${escapeHtml(offer.endDate)}
            </span>
        </td>

        <td>
            ${escapeHtml(usage)}
        </td>

        <td>
            <span class="badge ${escapeHtml(offer.status)}">
                ${escapeHtml(offer.status)}
            </span>
        </td>

        <td>

            <div class="actions">

                <button
                    class="action"
                    data-action="edit"
                    data-id="${escapeHtml(offer.id)}"
                >
                    Edit
                </button>

                <button
                    class="action"
                    data-action="toggle"
                    data-id="${escapeHtml(offer.id)}"
                >
                    ${offer.status === "active"
                        ? "Pause"
                        : "Activate"}
                </button>

                <button
                    class="action"
                    data-action="delete"
                    data-id="${escapeHtml(offer.id)}"
                >
                    Delete
                </button>

            </div>

        </td>

    `;


    return tr;

}



table.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "button[data-action]"
            );


        if(!button){

            return;

        }


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        if(action === "edit"){

            editOffer(
                id
            );

        }


        if(action === "toggle"){

            toggleOffer(
                id
            );

        }


        if(action === "delete"){

            deleteOffer(
                id
            );

        }

    }
);



document
    .getElementById(
        "addBtn"
    )
    .addEventListener(
        "click",
        function(){

            openModal();

        }
    );



document
    .getElementById(
        "closeBtn"
    )
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById(
        "cancelBtn"
    )
    .addEventListener(
        "click",
        closeModal
    );


modal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            modal
        ){

            closeModal();

        }

    }
);



search.addEventListener(
    "input",
    render
);


statusFilter.addEventListener(
    "change",
    render
);



offerForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const id =
            document
                .getElementById(
                    "editId"
                )
                .value;


        const data = {

            id:
                id ||
                "offer_" +
                Date.now(),

            name:
                document
                    .getElementById(
                        "offerName"
                    )
                    .value
                    .trim(),

            code:
                document
                    .getElementById(
                        "offerCode"
                    )
                    .value
                    .trim()
                    .toUpperCase(),

            discountType:
                document
                    .getElementById(
                        "discountType"
                    )
                    .value,

            discountValue:
                Number(
                    document
                        .getElementById(
                            "discountValue"
                        )
                        .value
                ),

            maxDiscount:
                Number(
                    document
                        .getElementById(
                            "maxDiscount"
                        )
                        .value
                ) || 0,

            service:
                document
                    .getElementById(
                        "service"
                    )
                    .value,

            status:
                document
                    .getElementById(
                        "status"
                    )
                    .value,

            startDate:
                document
                    .getElementById(
                        "startDate"
                    )
                    .value,

            endDate:
                document
                    .getElementById(
                        "endDate"
                    )
                    .value,

            usageLimit:
                Number(
                    document
                        .getElementById(
                            "usageLimit"
                        )
                        .value
                ) || 0,

            minFare:
                Number(
                    document
                        .getElementById(
                            "minFare"
                        )
                        .value
                ) || 0

        };


        if(
            !data.name ||
            !data.code
        ){

            showToast(
                "Offer name and code are required."
            );

            return;

        }


        if(
            data.discountValue <= 0
        ){

            showToast(
                "Discount value must be greater than 0."
            );

            return;

        }


        if(
            data.startDate &&
            data.endDate &&
            data.endDate <
            data.startDate
        ){

            showToast(
                "End date cannot be before start date."
            );

            return;

        }


        const existing =
            offers.findIndex(
                function(offer){

                    return offer.id ===
                        data.id;

                }
            );


        if(existing >= 0){

            data.used =
                offers[existing].used ||
                0;

            offers[existing] =
                data;

            showToast(
                "Offer updated successfully."
            );

        }else{

            data.used =
                0;

            offers.unshift(
                data
            );

            showToast(
                "Offer created successfully."
            );

        }


        saveOffers();

        closeModal();

        render();

    }
);



function openModal(
    offer = null
){

    offerForm.reset();


    document
        .getElementById(
            "editId"
        )
        .value =
        offer?.id || "";


    modalTitle.textContent =
        offer
            ? "Edit Offer"
            : "Create Offer";


    if(offer){

        document
            .getElementById(
                "offerName"
            )
            .value =
            offer.name || "";


        document
            .getElementById(
                "offerCode"
            )
            .value =
            offer.code || "";


        document
            .getElementById(
                "discountType"
            )
            .value =
            offer.discountType ||
            "percentage";


        document
            .getElementById(
                "discountValue"
            )
            .value =
            offer.discountValue || "";


        document
            .getElementById(
                "maxDiscount"
            )
            .value =
            offer.maxDiscount || "";


        document
            .getElementById(
                "service"
            )
            .value =
            offer.service ||
            "all";


        document
            .getElementById(
                "status"
            )
            .value =
            offer.status ||
            "active";


        document
            .getElementById(
                "startDate"
            )
            .value =
            offer.startDate || "";


        document
            .getElementById(
                "endDate"
            )
            .value =
            offer.endDate || "";


        document
            .getElementById(
                "usageLimit"
            )
            .value =
            offer.usageLimit || "";


        document
            .getElementById(
                "minFare"
            )
            .value =
            offer.minFare || "";

    }


    modal.classList.add(
        "show"
    );


    setTimeout(
        function(){

            document
                .getElementById(
                    "offerName"
                )
                .focus();

        },
        100
    );

}



function closeModal(){

    modal.classList.remove(
        "show"
    );

}



function editOffer(
    id
){

    const offer =
        offers.find(
            function(item){

                return item.id ===
                    id;

            }
        );


    if(offer){

        openModal(
            offer
        );

    }

}



function toggleOffer(
    id
){

    const offer =
        offers.find(
            function(item){

                return item.id ===
                    id;

            }
        );


    if(!offer){

        return;

    }


    offer.status =
        offer.status === "active"
            ? "paused"
            : "active";


    saveOffers();

    render();

    showToast(
        offer.status === "active"
            ? "Offer activated."
            : "Offer paused."
    );

}



function deleteOffer(
    id
){

    const offer =
        offers.find(
            function(item){

                return item.id ===
                    id;

            }
        );


    if(!offer){

        return;

    }


    if(
        !confirm(
            "Delete offer " +
            offer.code +
            "?"
        )
    ){

        return;

    }


    offers =
        offers.filter(
            function(item){

                return item.id !==
                    id;

            }
        );


    saveOffers();

    render();

    showToast(
        "Offer deleted."
    );

}



function updateStats(){

    const active =
        offers.filter(
            function(item){

                return item.status ===
                    "active";

            }
        ).length;


    const paused =
        offers.filter(
            function(item){

                return item.status ===
                    "paused";

            }
        ).length;


    const expired =
        offers.filter(
            function(item){

                return item.status ===
                    "expired";

            }
        ).length;


    document
        .getElementById(
            "totalCount"
        )
        .textContent =
        offers.length;


    document
        .getElementById(
            "activeCount"
        )
        .textContent =
        active;


    document
        .getElementById(
            "pausedCount"
        )
        .textContent =
        paused;


    document
        .getElementById(
            "expiredCount"
        )
        .textContent =
        expired;

}



function serviceName(
    service
){

    const names = {

        all:"All Services",

        bike:"Bike Taxi",

        cab:"Cab",

        parcel:"Parcel",

        food:"Food Delivery"

    };


    return names[service] ||
        service;

}



function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



function showToast(
    message
){

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.riderXOfferToast
    );


    window.riderXOfferToast =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}

</script></body></html>
