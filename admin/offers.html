<!DOCTYPE html>
<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Offers</title>


<link rel="stylesheet" href="../css/style.css">



<style>


body{

margin:0;

background:#000;

color:white;

font-family:Arial,sans-serif;

}



.header{

background:#111;

padding:20px;

font-size:25px;

font-weight:bold;

color:#FFD600;

}



.container{

padding:20px;

}



.card{

background:#111;

padding:20px;

border-radius:20px;

margin-bottom:20px;

}



input,select{

width:100%;

padding:15px;

margin:8px 0;

background:#222;

border:none;

border-radius:12px;

color:white;

box-sizing:border-box;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:#FFD600;

color:#000;

font-weight:bold;

font-size:16px;

}



.offer{

background:#222;

padding:15px;

border-radius:15px;

margin-top:10px;

}



</style>


</head>



<body>



<div class="header">

🎁 Offer Management

</div>






<div class="container">



<div class="card">


<h3>

Create New Offer

</h3>



<input id="code"

placeholder="Coupon Code (WELCOME50)">





<input id="discount"

placeholder="Discount Amount">





<select id="type">


<option value="flat">

Flat Discount

</option>



<option value="percent">

Percentage Discount

</option>



</select>






<input id="expiry"

type="date">





<select id="status">


<option value="active">

Active

</option>


<option value="inactive">

Inactive

</option>


</select>





<button id="saveOffer">

Create Offer

</button>



</div>







<div class="card">


<h3>

All Offers

</h3>



<div id="offers">

Loading...

</div>



</div>





</div>






<script type="module" src="../js/offers.js"></script>



</body>

</html>
