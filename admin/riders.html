<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX Admin Riders</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>


body{

margin:0;
background:#050505;
color:white;
font-family:Arial;

}


.header{

background:#111;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;

}


.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#FFE500;

}



.container{

padding:20px;

}



.card{

background:#111;
border:1px solid #333;
border-radius:20px;
padding:20px;
margin-bottom:15px;

}



.name{

font-size:20px;
font-weight:bold;

}



.info{

color:#aaa;
margin:8px 0;

}



.status{

color:#FFE500;
font-weight:bold;

}



.btn{

padding:12px;
border:0;
border-radius:12px;
font-weight:bold;
margin:5px;

}



.approve{

background:#FFE500;
color:#000;

}


.reject{

background:#ff3333;
color:white;

}



a{

color:#FFE500;

}



</style>

</head>


<body>


<div class="header">


<div class="logo">

RID<span>ERX</span>

</div>


<a href="dashboard.html">

<i class="fa-solid fa-arrow-left"></i>

</a>


</div>




<div class="container">


<h2>

Rider Management

</h2>


<div id="riderList">


Loading...

</div>


</div>








<script type="module">


import {

db

}

from "../firebase/firebase-config.js";



import {

collection,
getDocs,
doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";






const riderList =
document.getElementById("riderList");





async function loadRiders(){


riderList.innerHTML="";



const snap =
await getDocs(
collection(db,"users")
);



snap.forEach((item)=>{


const rider =
item.data();



if(rider.role==="rider"){



let box =
document.createElement("div");



box.className="card";



box.innerHTML=`

<div class="name">

${rider.fullName || "Rider"}

</div>


<div class="info">

Phone:
${rider.phone || "-"}

</div>



<div class="info">

Vehicle:
${rider.vehicleType || "-"}

</div>



<div class="info">

Number:
${rider.vehicleNumber || "-"}

</div>




<div class="status">

Status:
${rider.status || "pending"}

</div>




<br>


<a target="_blank"
href="${rider.rc || '#'}">

View RC

</a>


&nbsp;


<a target="_blank"
href="${rider.license || '#'}">

View License

</a>


<br><br>



<button class="btn approve">

Approve

</button>


<button class="btn reject">

Reject

</button>



`;





box.querySelector(".approve")
.onclick=()=>approveRider(item.id);



box.querySelector(".reject")
.onclick=()=>rejectRider(item.id);




riderList.appendChild(box);



}



});


}





async function approveRider(id){


await updateDoc(

doc(db,"users",id),

{


approved:true,

status:"active"


}

);



alert("Rider Approved");


loadRiders();


}






async function rejectRider(id){


await updateDoc(

doc(db,"users",id),

{


approved:false,

status:"rejected"


}

);



alert("Rider Rejected");


loadRiders();


}







loadRiders();



</script>


</body>

</html>
