import {
    auth,
    db,
    collection,
    query,
    where,
    onSnapshot,
    doc,
    updateDoc,
    getDoc,
    onAuthStateChanged
} from "../firebase/firebase-config.js";


let riders = [];

let filteredRiders = [];

let currentPage = 1;

const PAGE_SIZE = 10;

let confirmAction = null;

let toastTimer = null;

let unsubscribeRiders = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


function clean(value){

    return String(
        value ?? ""
    ).trim();

}


function lower(value){

    return clean(
        value
    ).toLowerCase();

}


function escapeHtml(value){

    return clean(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function capitalize(value){

    const text =
        clean(value);

    return (
        text.charAt(0)
            .toUpperCase() +
        text.slice(1)
    );

}


function getStatus(rider){

    const status =
        lower(
            rider.status ||
            rider.applicationStatus ||
            "offline"
        );

    if(
        rider.blocked === true ||
        status === "blocked"
    ){

        return "blocked";

    }

    if(
        status === "pending" ||
        status === "under_review" ||
        status === "waiting"
    ){

        return "pending";

    }

    if(
        status === "rejected"
    ){

        return "rejected";

    }

    if(
        status === "approved" ||
        status === "active"
    ){

        if(
            rider.busy === true ||
            status === "busy"
        ){

            return "busy";

        }

        if(
            rider.online === true
        ){

            return "online";

        }

        return "offline";

    }

    if(
        status === "online"
    ){

        return "online";

    }

    if(
        status === "busy"
    ){

        return "busy";

    }

    return "offline";

}


/* =========================================================
   AUTHORIZATION
========================================================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            showToast(
                "Admin login required.",
                true
            );

            setTimeout(
                function(){

                    window.location.href =
                        "../auth/login.html";

                },
                1000
            );

            return;

        }

        try{

            const snapshot =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );

            if(!snapshot.exists()){

                throw new Error(
                    "Admin profile not found."
                );

            }

            const profile =
                snapshot.data() || {};

            const role =
                lower(
                    profile.role ||
                    profile.userRole ||
                    profile.accountType
                );

            if(
                role !== "admin" &&
                role !== "superadmin"
            ){

                throw new Error(
                    "You do not have admin permission."
                );

            }

            startRiderListener();

        }catch(error){

            console.error(
                "Admin authorization failed:",
                error
            );

            showToast(
                error.message ||
                "Admin access denied.",
                true
            );

            setTimeout(
                function(){

                    window.location.href =
                        "../auth/login.html";

                },
                1200
            );

        }

    }
);


/* =========================================================
   FIRESTORE RIDER LISTENER
========================================================= */

function startRiderListener(){

    if(unsubscribeRiders){

        unsubscribeRiders();

        unsubscribeRiders =
            null;

    }


    const usersRef =
        collection(
            db,
            "users"
        );


    /*
     * We intentionally query only by role.
     *
     * No orderBy is used so a Firestore composite
     * index is not required.
     */

    const riderQuery =
        query(
            usersRef,
            where(
                "role",
                "==",
                "rider"
            )
        );


    unsubscribeRiders =
        onSnapshot(
            riderQuery,

            function(snapshot){

                riders =
                    snapshot.docs
                        .map(
                            function(item){

                                return {
                                    id:
                                        item.id,

                                    ...item.data()

                                };

                            }
                        );


                riders.sort(
                    function(a,b){

                        return (
                            Number(
                                b.createdAt ||
                                b.applicationSubmittedAt ||
                                0
                            ) -
                            Number(
                                a.createdAt ||
                                a.applicationSubmittedAt ||
                                0
                            )
                        );

                    }
                );


                setConnection(
                    true
                );

                applyFilters();

            },

            function(error){

                console.error(
                    "Rider Firebase listener failed:",
                    error
                );

                setConnection(
                    false
                );

                $("riderList").innerHTML = `
                    <div class="empty">
                        Unable to load riders from Firebase.<br>
                        <small>${escapeHtml(
                            error.message ||
                            "Permission denied"
                        )}</small>
                    </div>
                `;

                showToast(
                    "Firebase rider read failed. Check Firestore rules.",
                    true
                );

            }
        );

}


/* =========================================================
   FILTERS
========================================================= */

function applyFilters(){

    const search =
        lower(
            $("searchInput").value
        );

    const filter =
        lower(
            $("statusFilter").value
        );


    filteredRiders =
        riders.filter(
            function(rider){

                const name =
                    lower(
                        rider.name ||
                        rider.fullName ||
                        rider.displayName
                    );

                const phone =
                    lower(
                        rider.phone ||
                        rider.phoneNumber ||
                        rider.mobile
                    );

                const vehicle =
                    lower(
                        rider.vehicleNumber ||
                        rider.vehicleNo ||
                        rider.vehicleModel
                    );

                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    phone.includes(search) ||
                    vehicle.includes(search);

                const status =
                    getStatus(rider);

                const matchesFilter =
                    filter === "all" ||
                    status === filter;

                return (
                    matchesSearch &&
                    matchesFilter
                );

            }
        );


    currentPage = 1;

    render();

}


/* =========================================================
   STATS
========================================================= */

function renderStats(){

    let pending = 0;

    let online = 0;

    let busy = 0;

    let blocked = 0;

    let offline = 0;


    riders.forEach(
        function(rider){

            const status =
                getStatus(rider);

            if(status === "pending"){
                pending++;
            }

            else if(status === "online"){
                online++;
            }

            else if(status === "busy"){
                busy++;
            }

            else if(status === "blocked"){
                blocked++;
            }

            else{
                offline++;
            }

        }
    );


    $("totalRiders")
        .textContent =
        riders.length;

    $("pendingRiders")
        .textContent =
        pending;

    $("onlineRiders")
        .textContent =
        online;

    $("offlineRiders")
        .textContent =
        offline;

    $("busyRiders")
        .textContent =
        busy;

    $("blockedRiders")
        .textContent =
        blocked;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    renderStats();

    renderList();

}


function renderList(){

    const container =
        $("riderList");


    const total =
        filteredRiders.length;


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                total /
                PAGE_SIZE
            )
        );


    if(
        currentPage >
        totalPages
    ){

        currentPage =
            totalPages;

    }


    const start =
        (
            currentPage -
            1
        ) *
        PAGE_SIZE;


    const visible =
        filteredRiders.slice(
            start,
            start +
            PAGE_SIZE
        );


    container.innerHTML = "";


    if(!visible.length){

        container.innerHTML = `
            <div class="empty">
                No riders found.
            </div>
        `;

    }else{

        visible.forEach(
            function(rider){

                container.appendChild(
                    createRiderRow(
                        rider
                    )
                );

            }
        );

    }


    $("resultCount")
        .textContent =
        total +
        " rider" +
        (
            total === 1
                ? ""
                : "s"
        );


    const end =
        Math.min(
            start +
            visible.length,
            total
        );


    $("pageInfo")
        .textContent =
        total
            ? (
                "Showing " +
                (start + 1) +
                "-" +
                end +
                " of " +
                total
            )
            : "Showing 0 riders";


    $("pageNumber")
        .textContent =
        currentPage;

}


/* =========================================================
   RIDER ROW
========================================================= */

function createRiderRow(rider){

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "rider-row";


    const name =
        rider.name ||
        rider.fullName ||
        rider.displayName ||
        "Rider";


    const phone =
        rider.phone ||
        rider.phoneNumber ||
        rider.mobile ||
        "—";


    const vehicle =
        rider.vehicleNumber ||
        rider.vehicleNo ||
        "—";


    const rides =
        Number(
            rider.totalRides ||
            rider.rides ||
            0
        );


    const rating =
        Number(
            rider.rating ||
            0
        );


    const status =
        getStatus(rider);


    const initial =
        clean(name)
            .charAt(0)
            .toUpperCase();


    let actionHtml = `
        <button
            class="action view"
            title="View rider"
            onclick="viewRider('${escapeJs(rider.id)}')"
        >
            👁
        </button>
    `;


    if(status === "pending"){

        actionHtml += `
            <button
                class="action approve"
                title="Approve rider"
                onclick="approveRider('${escapeJs(rider.id)}')"
            >
                ✓
            </button>

            <button
                class="action reject"
                title="Reject rider"
                onclick="rejectRider('${escapeJs(rider.id)}')"
            >
                ✕
            </button>
        `;

    }
    else if(
        status === "blocked"
    ){

        actionHtml += `
            <button
                class="action approve"
                title="Unblock rider"
                onclick="unblockRider('${escapeJs(rider.id)}')"
            >
                ✓
            </button>
        `;

    }
    else{

        actionHtml += `
            <button
                class="action danger"
                title="Block rider"
                onclick="blockRider('${escapeJs(rider.id)}')"
            >
                ⊘
            </button>
        `;

    }


    row.innerHTML = `

        <div class="rider-info">

            <div class="avatar">
                ${escapeHtml(initial)}
            </div>

            <div class="rider-details">

                <div class="rider-name">
                    ${escapeHtml(name)}
                </div>

                <div class="rider-phone">
                    ${escapeHtml(phone)}
                </div>

            </div>

        </div>


        <div class="cell vehicle-cell">

            <strong>
                ${escapeHtml(vehicle)}
            </strong>

        </div>


        <div class="cell rides-cell">

            <strong>
                ${rides}
            </strong>

            rides

        </div>


        <div class="cell rating-cell">

            <strong>
                ${
                    rating
                        ? rating.toFixed(1)
                        : "—"
                }
            </strong>

            ⭐

        </div>


        <div>

            <span class="status ${escapeHtml(status)}">
                ${escapeHtml(
                    capitalize(status)
                )}
            </span>

        </div>


        <div class="actions">

            ${actionHtml}

        </div>

    `;


    return row;

}


/* =========================================================
   APPROVAL
========================================================= */

window.approveRider =
function(id){

    const rider =
        riders.find(
            function(item){

                return String(
                    item.id
                ) ===
                String(id);

            }
        );


    if(!rider){

        showToast(
            "Rider not found.",
            true
        );

        return;

    }


    const name =
        rider.name ||
        rider.fullName ||
        "this rider";


    openConfirm(
        "Approve Rider",

        "Approve " +
        name +
        "? This rider will be allowed to use the RiderX rider account.",

        async function(){

            await updateRiderStatus(
                id,
                {
                    status:
                        "approved",

                    applicationStatus:
                        "approved",

                    blocked:
                        false,

                    approvedAt:
                        Date.now(),

                    updatedAt:
                        Date.now()
                },

                "Rider approved successfully."
            );

        }
    );

};

/* =========================================================
   FIRESTORE UPDATE
========================================================= */

async function updateRiderStatus(
    id,
    data,
    successMessage
){

    try{

        await updateDoc(
            doc(
                db,
                "users",
                id
            ),
            data
        );


        showToast(
            successMessage,
            false
        );


    }catch(error){

        console.error(
            "Rider update failed:",
            error
        );

        showToast(
            "Unable to update rider. Check Firestore rules.",
            true
        );

    }

}


/* =========================================================
   VIEW RIDER
========================================================= */

window.viewRider =
function(id){

    const rider =
        riders.find(
            function(item){

                return String(
                    item.id
                ) ===
                String(id);

            }
        );


    if(!rider){

        showToast(
            "Rider not found.",
            true
        );

        return;

    }


    const name =
        rider.name ||
        rider.fullName ||
        rider.displayName ||
        "Rider";


    $("detailTitle")
        .textContent =
        name;


    $("detailStatus")
        .textContent =
        "Current status: " +
        capitalize(
            getStatus(rider)
        );


    const fields = [

        [
            "Phone",
            rider.phone ||
            rider.phoneNumber ||
            "—"
        ],

        [
            "Email",
            rider.email ||
            "—"
        ],

        [
            "Vehicle Type",
            rider.vehicleType ||
            "—"
        ],

        [
            "Vehicle Model",
            rider.vehicleModel ||
            "—"
        ],

        [
            "Vehicle Number",
            rider.vehicleNumber ||
            rider.vehicleNo ||
            "—"
        ],

        [
            "City",
            rider.city ||
            "Chandigarh"
        ],

        [
            "Rating",
            rider.rating ??
            "—"
        ],

        [
            "Total Rides",
            rider.totalRides ??
            0
        ],

        [
            "UID",
            rider.uid ||
            rider.id
        ],

        [
            "Application",
            rider.applicationStatus ||
            rider.status ||
            "—"
        ]

    ];


    $("detailGrid")
        .innerHTML =
        fields.map(
            function(field){

                return `
                    <div class="detail">

                        <div class="detail-label">
                            ${escapeHtml(field[0])}
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(field[1])}
                        </div>

                    </div>
                `;

            }
        ).join("");


    const links = [];


    const license =
        rider.documents?.drivingLicense;

    const vehicle =
        rider.documents?.vehicleDocument;


    if(
        license?.url
    ){

        links.push(`
            <a
                class="document-link"
                href="${escapeHtml(license.url)}"
                target="_blank"
                rel="noopener"
            >
                📄 View Driving License
            </a>
        `);

    }


    if(
        vehicle?.url
    ){

        links.push(`
            <a
                class="document-link"
                href="${escapeHtml(vehicle.url)}"
                target="_blank"
                rel="noopener"
            >
                📄 View RC / Vehicle Document
            </a>
        `);

    }


    $("documentLinks")
        .innerHTML =
        links.length
            ? links.join("")
            : `
                <div class="detail">
                    <div class="detail-value">
                        No documents found.
                    </div>
                </div>
            `;


    $("detailModal")
        .classList.add(
            "show"
        );

};


window.closeDetails =
function(){

    $("detailModal")
        .classList.remove(
            "show"
        );

};


/* =========================================================
   PENDING BUTTON
========================================================= */

window.showPending =
function(){

    $("statusFilter").value =
        "pending";

    applyFilters();

};


/* =========================================================
   CONFIRM MODAL
========================================================= */

function openConfirm(
    title,
    text,
    action,
    danger=false
){

    $("confirmTitle")
        .textContent =
        title;

    $("confirmText")
        .textContent =
        text;

    const button =
        $("confirmButton");

    button.textContent =
        danger
            ? "CONFIRM"
            : "CONFIRM";

    button.className =
        danger
            ? "modal-btn reject-btn"
            : "modal-btn confirm-btn";


    confirmAction =
        action;


    $("confirmModal")
        .classList.add(
            "show"
        );

}


window.closeConfirm =
function(){

    $("confirmModal")
        .classList.remove(
            "show"
        );

    confirmAction =
        null;

};


window.executeConfirm =
async function(){

    const action =
        confirmAction;

    closeConfirm();

    if(
        typeof action ===
        "function"
    ){

        await action();

    }

};


/* =========================================================
   PAGINATION
========================================================= */

window.previousPage =
function(){

    if(
        currentPage >
        1
    ){

        currentPage--;

        renderList();

    }

};


window.nextPage =
function(){

    const pages =
        Math.max(
            1,
            Math.ceil(
                filteredRiders.length /
                PAGE_SIZE
            )
        );


    if(
        currentPage <
        pages
    ){

        currentPage++;

        renderList();

    }

};


/* =========================================================
   CONNECTION
========================================================= */

function setConnection(
    online
){

    const box =
        $("connectionStatus");

    const text =
        $("connectionText");


    if(online){

        box.classList.add(
            "live"
        );

        text.textContent =
            "Live";

    }else{

        box.classList.remove(
            "live"
        );

        text.textContent =
            "Offline";

    }

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    error=false
){

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.className =
        "toast " +
        (
            error
                ? "error"
                : "success"
        ) +
        " show";


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJs(value){

    return clean(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =========================================================
   BACK
========================================================= */

window.goBack =
function(){

    if(
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ){

        history.back();

    }else{

        window.location.href =
            "dashboard.html";

    }

};


/* =========================================================
   EVENTS
========================================================= */

$("searchInput")
    .addEventListener(
        "input",
        applyFilters
    );


$("statusFilter")
    .addEventListener(
        "change",
        applyFilters
    );


$("confirmModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeConfirm();

            }

        }
    );


$("detailModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeDetails();

            }

        }
    );
