<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Riders</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.card{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


button{

width:100%;
padding:12px;
margin-top:10px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

🏍 Rider Approval

</div>



<div class="container">


<div id="list">

Loading...

</div>


</div>






<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs,
doc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






async function loadRiders(){



let snap=await getDocs(

collection(db,"users")

);



let box=document.getElementById("list");

box.innerHTML="";





snap.forEach((user)=>{


let data=user.data();



if(data.role=="rider"){



box.innerHTML += `


<div class="card">


<h3>

🏍 ${data.name || "Rider"}

</h3>



<p>

📧 ${data.email || ""}

</p>



<p>

Status:

${data.approved ? "Approved ✅" : "Pending ⏳"}

</p>



<button onclick="approve('${user.id}')">

Approve Rider

</button>



<button onclick="reject('${user.id}')">

Reject Rider

</button>



</div>



`;



}



});



}







window.approve=async function(id){



await updateDoc(

doc(db,"users",id),

{


approved:true

}


);



alert("Rider Approved ✅");


loadRiders();



}







window.reject=async function(id){



await updateDoc(

doc(db,"users",id),

{


approved:false

}


);



alert("Rider Rejected ❌");


loadRiders();



}





loadRiders();



</script>


</body>

</html>
