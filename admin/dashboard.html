<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin</title>


<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;
color:white;
font-family:Arial;

}


.header{

background:#111;
padding:20px;
border-bottom:2px solid #FFD600;
font-size:24px;
font-weight:bold;

}



.container{

padding:20px;

}



.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}



.card{

background:#111;
padding:20px;
border-radius:18px;
text-align:center;
border:1px solid #333;

}



.number{

font-size:30px;
color:#FFD600;
font-weight:bold;

}


a{

text-decoration:none;
color:white;

}



</style>


</head>


<body>



<div class="header">

⚡ RiderX Admin Panel

</div>



<div class="container">



<div class="grid">



<div class="card">

<h3>Customers</h3>

<div class="number" id="customers">

0

</div>

</div>




<div class="card">

<h3>Riders</h3>

<div class="number" id="riders">

0

</div>

</div>




<div class="card">

<h3>Rides</h3>

<div class="number" id="rides">

0

</div>

</div>




<div class="card">

<h3>Completed</h3>

<div class="number" id="completed">

0

</div>

</div>



</div>



</div>







<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
getDocs,
query,
where

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function loadAdmin(){



let users =
await getDocs(collection(db,"users"));



let riders =
await getDocs(collection(db,"riders"));



let rides =
await getDocs(collection(db,"rides"));





let complete=0;



rides.forEach((r)=>{


if(r.data().status==="Completed"){

complete++;

}

});





document.getElementById("customers").innerHTML=

users.size;



document.getElementById("riders").innerHTML=

riders.size;



document.getElementById("rides").innerHTML=

rides.size;



document.getElementById("completed").innerHTML=

complete;



}



loadAdmin();



</script>



</body>

</html>
