<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:#050505;
color:white;
padding-bottom:30px;
}


.header{

height:70px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:1px solid #333;

}


.logo{

font-size:26px;
font-weight:900;

}

.logo span{

color:#FFD600;

}


.logout{

background:#ff3333;
color:white;
border:0;
padding:10px 16px;
border-radius:12px;
font-weight:bold;

}



.container{

padding:20px;

}



.title{

font-size:26px;
font-weight:800;
margin-bottom:20px;

}




.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}



.card{

background:#151515;
border:1px solid #292929;
border-radius:20px;
padding:18px;

}



.card i{

font-size:28px;
color:#FFD600;

}



.value{

font-size:30px;
font-weight:800;
margin-top:12px;

}


.name{

color:#aaa;
margin-top:5px;

}





.revenue{

margin-top:20px;
background:#151515;
border-radius:20px;
padding:20px;
border:1px solid #292929;

}



.revenue h3{

color:#FFD600;
margin-bottom:15px;

}



.money{

font-size:35px;
font-weight:900;

}





.quick{

margin-top:20px;

}


.quick h3{

margin-bottom:15px;

}


.action{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;

}



.action a{

background:#151515;
border:1px solid #333;
padding:16px;
border-radius:15px;
text-decoration:none;
color:white;

}



.action i{

color:#FFD600;
margin-right:8px;

}





.live{

margin-top:25px;
background:#151515;
padding:20px;
border-radius:20px;
border:1px solid #333;

}


.live h3{

color:#FFD600;

}


.status{

margin-top:15px;
padding:15px;
background:#000;
border-radius:12px;
color:#aaa;

}





</style>

</head>


<body>


<header class="header">


<div class="logo">

RID<span>ERX</span> ADMIN

</div>


<button class="logout"
onclick="logoutAdmin()">

Logout

</button>


</header>






<div class="container">


<div class="title">

Dashboard Overview

</div>





<div class="grid">



<div class="card">

<i class="fa-solid fa-users"></i>

<div class="value" id="customers">

0

</div>

<div class="name">

Customers

</div>

</div>




<div class="card">

<i class="fa-solid fa-motorcycle"></i>

<div class="value" id="riders">

0

</div>

<div class="name">

Total Riders

</div>

</div>





<div class="card">

<i class="fa-solid fa-circle-check"></i>

<div class="value" id="onlineRiders">

0

</div>

<div class="name">

Online Riders

</div>

</div>





<div class="card">

<i class="fa-solid fa-user-clock"></i>

<div class="value" id="pending">

0

</div>

<div class="name">

Pending Approval

</div>

</div>




<div class="card">

<i class="fa-solid fa-route"></i>

<div class="value" id="rides">

0

</div>

<div class="name">

Total Rides

</div>

</div>




<div class="card">

<i class="fa-solid fa-car-side"></i>

<div class="value" id="activeRides">

0

</div>

<div class="name">

Active Rides

</div>

</div>



</div>






<div class="revenue">


<h3>

Revenue

</h3>


<div class="money"
id="revenue">

₹0

</div>


</div>






<div class="quick">


<h3>

Quick Actions

</h3>


<div class="action">


<a href="riders.html">

<i class="fa-solid fa-user-check"></i>

Approve Riders

</a>



<a href="fare.html">

<i class="fa-solid fa-indian-rupee-sign"></i>

Manage Fare

</a>




<a href="coupons.html">

<i class="fa-solid fa-ticket"></i>

Coupons

</a>



<a href="settings.html">

<i class="fa-solid fa-gear"></i>

App Settings

</a>



<a href="customers.html">

<i class="fa-solid fa-users"></i>

Customers

</a>



<a href="notifications.html">

<i class="fa-solid fa-bell"></i>

Notifications

</a>



</div>


</div>








<div class="live">


<h3>

Live Ride Monitoring

</h3>


<div class="status"
id="liveStatus">

No Active Ride

</div>


</div>





</div>





<script type="module"
src="../js/admin.js"></script>


</body>

</html>
