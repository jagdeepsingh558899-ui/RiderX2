<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Dashboard</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.card{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


.title{

color:#ffcc00;
font-size:22px;
font-weight:bold;

}


.item{

background:#222;
padding:12px;
margin-top:10px;
border-radius:10px;

}

</style>


</head>


<body>


<div class="header">

⚙️ RiderX Admin

</div>



<div class="container">


<div class="card">

<div class="title">
Users
</div>

<div id="users">

Loading...

</div>

</div>




<div class="card">

<div class="title">
Riders
</div>

<div id="riders">

Loading...

</div>

</div>





<div class="card">

<div class="title">
All Rides
</div>

<div id="rides">

Loading...

</div>

</div>



</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






async function loadAdmin(){



let userBox =
document.getElementById("users");


let riderBox =
document.getElementById("riders");


let rideBox =
document.getElementById("rides");





let users = await getDocs(

collection(db,"users")

);



userBox.innerHTML="";

riderBox.innerHTML="";



users.forEach((user)=>{


let data=user.data();



let html=`

<div class="item">

👤 ${data.name || "User"}

<br>

📧 ${data.email || ""}

</div>

`;



userBox.innerHTML += html;



if(data.role=="rider"){


riderBox.innerHTML += html;


}



});





let rides = await getDocs(

collection(db,"rides")

);



rideBox.innerHTML="";



rides.forEach((ride)=>{


let data=ride.data();



rideBox.innerHTML += `

<div class="item">


🚕 ${data.service || "Ride"}

<br>

📍 ${data.pickupLat || ""}

<br>

🏁 ${data.dropLat || ""}

<br>

💰 ${data.fare || ""}

<br>

Status: ${data.status}


</div>

`;



});




}



loadAdmin();



</script>


</body>

</html>
