<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Dashboard</title>

<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;
color:white;
font-family:Arial;

}


.header{

background:#111;
padding:20px;
border-bottom:2px solid #FFD600;
font-size:24px;
font-weight:bold;

}



.container{

padding:20px;

}



.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}



.card{

background:#111;
padding:20px;
border-radius:18px;
border:1px solid #333;
text-align:center;

}



.number{

font-size:32px;
color:#FFD600;
font-weight:bold;

}



.menu{

margin-top:25px;

}



.menu a{

display:block;
background:#111;
padding:15px;
margin-top:10px;
border-radius:12px;
color:white;
text-decoration:none;
border-left:4px solid #FFD600;

}


</style>


</head>


<body>



<div class="header">

⚡ RiderX Admin Panel

</div>




<div class="container">


<div class="grid">



<div class="card">

<h3>Customers</h3>

<div class="number" id="customers">
0
</div>

</div>



<div class="card">

<h3>Riders</h3>

<div class="number" id="riders">
0
</div>

</div>




<div class="card">

<h3>Total Rides</h3>

<div class="number" id="rides">
0
</div>

</div>




<div class="card">

<h3>Revenue</h3>

<div class="number">

₹<span id="revenue">0</span>

</div>

</div>




<div class="card">

<h3>Pending</h3>

<div class="number" id="pending">
0
</div>

</div>




<div class="card">

<h3>Completed</h3>

<div class="number" id="completed">
0
</div>

</div>



</div>





<div class="menu">


<h2>

Admin Controls

</h2>


<a href="fare-settings.html">
💰 Fare Settings
</a>


<a href="rider-approval.html">
🏍 Rider Approval
</a>


<a href="customers.html">
👥 Customers
</a>


<a href="riders.html">
🚴 Riders
</a>


<a href="rides.html">
📋 All Rides
</a>


<a href="payments.html">
💳 Payments
</a>


</div>



</div>







<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






async function loadAdmin(){



let users=

await getDocs(

collection(db,"users")

);



let riders=

await getDocs(

collection(db,"riders")

);



let rides=

await getDocs(

collection(db,"rides")

);





let completed=0;

let pending=0;

let revenue=0;






rides.forEach((ride)=>{


let data=ride.data();



if(data.status==="Completed"){

completed++;

}



if(data.status==="Pending"){

pending++;

}



if(data.paymentStatus==="Paid"){

revenue += Number(data.fare || 0);

}



});






document.getElementById("customers").innerHTML=

users.size;



document.getElementById("riders").innerHTML=

riders.size;



document.getElementById("rides").innerHTML=

rides.size;



document.getElementById("completed").innerHTML=

completed;



document.getElementById("pending").innerHTML=

pending;



document.getElementById("revenue").innerHTML=

revenue;



}



loadAdmin();



</script>



</body>

</html>
