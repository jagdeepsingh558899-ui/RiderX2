<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Dashboard</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.card{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


.number{

font-size:30px;
color:#ffcc00;
font-weight:bold;

}

</style>


</head>


<body>


<div class="header">

⚙️ RiderX Admin Dashboard

</div>



<div class="container">



<div class="card">

<h3>
👥 Users
</h3>

<div class="number" id="users">
0
</div>

</div>



<div class="card">

<h3>
🏍 Riders
</h3>

<div class="number" id="riders">
0
</div>

</div>




<div class="card">

<h3>
🚕 Total Rides
</h3>

<div class="number" id="rides">
0
</div>

</div>




<div class="card">

<h3>
✅ Completed Rides
</h3>

<div class="number" id="completed">
0
</div>

</div>




<div class="card">

<h3>
💰 Earnings
</h3>

<div class="number" id="earning">
₹0
</div>

</div>




</div>







<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";








async function loadDashboard(){



let users=

await getDocs(

collection(db,"users")

);



let riders=0;


users.forEach((u)=>{


if(u.data().role=="rider"){

riders++;

}


});





document.getElementById("users").innerHTML=

users.size;



document.getElementById("riders").innerHTML=

riders;







let rides=

await getDocs(

collection(db,"rides")

);



let completed=0;

let earning=0;



rides.forEach((r)=>{


let data=r.data();



if(data.status=="Completed"){


completed++;



earning += Number(

String(data.fare)

.replace("₹","")

);


}



});





document.getElementById("rides").innerHTML=

rides.size;



document.getElementById("completed").innerHTML=

completed;



document.getElementById("earning").innerHTML=

"₹"+earning;



}






loadDashboard();



</script>


</body>

</html>
