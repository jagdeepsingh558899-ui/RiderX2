<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Admin Dashboard</title>


<link rel="stylesheet" href="../css/style.css">


<style>


body{

margin:0;

background:#000;

color:white;

font-family:Arial,sans-serif;

}



.header{

background:#111;

padding:20px;

font-size:28px;

font-weight:bold;

color:#FFD600;

}



.container{

padding:20px;

}



.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}



.card{

background:#111;

padding:20px;

border-radius:20px;

}



.value{

font-size:30px;

font-weight:bold;

color:#FFD600;

}



.menu{

background:#111;

margin-top:20px;

padding:20px;

border-radius:20px;

}



.option{

background:#222;

padding:15px;

margin:10px 0;

border-radius:15px;

cursor:pointer;

}



.option:hover{

background:#FFD600;

color:#000;

}



</style>

</head>



<body>



<div class="header">

⚡ RiderX Admin

</div>





<div class="container">



<div class="grid">



<div class="card">

Customers

<div class="value" id="customers">

0

</div>

</div>



<div class="card">

Riders

<div class="value" id="riders">

0

</div>

</div>



<div class="card">

Live Rides

<div class="value" id="rides">

0

</div>

</div>



<div class="card">

Revenue

<div class="value" id="revenue">

₹0

</div>

</div>



</div>








<div class="menu">


<h3>

Management

</h3>



<div class="option"
onclick="location.href='riders.html'">

🏍 Manage Riders

</div>



<div class="option"
onclick="location.href='customers.html'">

👥 Manage Customers

</div>



<div class="option"
onclick="location.href='pricing.html'">

💰 Fare & Commission

</div>



<div class="option"
onclick="location.href='offers.html'">

🎁 Offers & Coupons

</div>



<div class="option"
onclick="location.href='settings.html'">

⚙ App Settings

</div>



</div>





</div>





<script type="module" src="../js/admin.js"></script>



</body>

</html>
