<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiderX - Admin Operations Console</title>

  <link rel="stylesheet" href="../css/app.css">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../firebase/firebase-config.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #FFF;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    .metric-card {
      background: #1E1E1E;
      padding: 20px;
      border-radius: 10px;
      border-bottom: 4px solid #FFC107;
    }
    .metric-card h3 { margin: 0; font-size: 28px; }
    .metric-card p { margin: 5px 0 0 0; color: #AAA; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1E1E1E;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th { background: #2A2A2A; color: #FFC107; }
  </style>
</head>
<body>

  <h1>RiderX Central Command</h1>

  <div class="metrics">
    <div class="metric-card">
      <h3 id="totalRides">0</h3>
      <p>Total Rides Requested</p>
    </div>
    <div class="metric-card">
      <h3 id="activeRiders">0</h3>
      <p>Active Riders</p>
    </div>
    <div class="metric-card">
      <h3 id="totalRevenue">₹0</h3>
      <p>Estimated Revenue</p>
    </div>
  </div>

  <h2>Recent Transactions</h2>
  <table>
    <thead>
      <tr>
        <th>Ride ID</th>
        <th>Service</th>
        <th>Fare</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="ridesTableBody">
      <tr><td colspan="4">Loading system data...</td></tr>
    </tbody>
  </table>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      db.collection('rides').onSnapshot((snapshot) => {
        let count = snapshot.size;
        let revenue = 0;
        const tbody = document.getElementById('ridesTableBody');
        tbody.innerHTML = "";

        snapshot.forEach((doc) => {
          const data = doc.data();
          if (data.fare) revenue += Number(data.fare);

          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${doc.id}</td>
            <td>${data.serviceType || 'Bike'}</td>
            <td>₹${data.fare || 0}</td>
            <td><span style="color:${data.status === 'ACCEPTED' ? '#28a745' : '#FFC107'}">${data.status}</span></td>
          `;
          tbody.appendChild(row);
        });

        document.getElementById('totalRides').innerText = count;
        document.getElementById('totalRevenue').innerText = `₹${revenue}`;
      });
    });
  </script>
</body>
</html>
