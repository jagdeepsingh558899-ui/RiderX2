<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX Admin Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

:root{
--yellow:#FFE500;
--black:#050505;
--card:#111;
--gray:#999;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{
background:var(--black);
color:white;
padding-bottom:70px;
}


.header{

height:70px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;

}


.logo{

font-size:28px;
font-weight:900;

}


.logo span{
color:var(--yellow);
}


.logout{

color:#ff4444;
font-size:22px;
cursor:pointer;

}


.container{

padding:20px;

}


.welcome{

font-size:22px;
font-weight:bold;
margin-bottom:20px;

}


.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}


.card{

background:var(--card);
border:1px solid #222;
border-radius:20px;
padding:18px;

}


.card i{

font-size:27px;
color:var(--yellow);

}


.number{

font-size:28px;
font-weight:bold;
margin-top:10px;

}


.title{

color:var(--gray);
font-size:14px;

}



.menu{

margin-top:25px;

}


.menu button{

width:100%;
padding:16px;
margin-bottom:12px;
background:#111;
border:1px solid #333;
border-radius:15px;
color:white;
font-size:16px;
text-align:left;

}


.menu i{

color:var(--yellow);
width:35px;

}



@media(max-width:600px){

.grid{

grid-template-columns:repeat(2,1fr);

}

}

</style>


</head>


<body>


<header class="header">

<div class="logo">
RID<span>ERX</span>
</div>


<i onclick="logout()"
class="fa-solid fa-right-from-bracket logout"></i>


</header>




<div class="container">


<div class="welcome">
Admin Dashboard
</div>



<div class="grid">


<div class="card">
<i class="fa-solid fa-users"></i>
<div id="customers" class="number">0</div>
<div class="title">Customers</div>
</div>



<div class="card">
<i class="fa-solid fa-motorcycle"></i>
<div id="riders" class="number">0</div>
<div class="title">Riders</div>
</div>



<div class="card">
<i class="fa-solid fa-clock"></i>
<div id="pending" class="number">0</div>
<div class="title">Pending Riders</div>
</div>



<div class="card">
<i class="fa-solid fa-signal"></i>
<div id="online" class="number">0</div>
<div class="title">Online Riders</div>
</div>



<div class="card">
<i class="fa-solid fa-route"></i>
<div id="rides" class="number">0</div>
<div class="title">Total Rides</div>
</div>



<div class="card">
<i class="fa-solid fa-spinner"></i>
<div id="active" class="number">0</div>
<div class="title">Active Rides</div>
</div>



<div class="card">
<i class="fa-solid fa-circle-check"></i>
<div id="completed" class="number">0</div>
<div class="title">Completed</div>
</div>



<div class="card">
<i class="fa-solid fa-xmark"></i>
<div id="cancelled" class="number">0</div>
<div class="title">Cancelled</div>
</div>



<div class="card">
<i class="fa-solid fa-indian-rupee-sign"></i>
<div id="revenue" class="number">₹0</div>
<div class="title">Revenue</div>
</div>



<div class="card">
<i class="fa-solid fa-calendar-day"></i>
<div id="todayRevenue" class="number">₹0</div>
<div class="title">Today Revenue</div>
</div>



<div class="card">
<i class="fa-solid fa-percent"></i>
<div id="commission" class="number">₹0</div>
<div class="title">Commission</div>
</div>



<div class="card">
<i class="fa-solid fa-wallet"></i>
<div id="riderEarn" class="number">₹0</div>
<div class="title">Rider Earnings</div>
</div>


</div>





<div class="menu">


<button onclick="openPage('riders.html')">
<i class="fa-solid fa-motorcycle"></i>
Manage Riders
</button>


<button onclick="openPage('customers.html')">
<i class="fa-solid fa-users"></i>
Manage Customers
</button>


<button onclick="openPage('rides.html')">
<i class="fa-solid fa-route"></i>
Manage Rides
</button>


<button onclick="openPage('fare-settings.html')">
<i class="fa-solid fa-money-bill"></i>
Fare Settings
</button>


<button onclick="openPage('commission.html')">
<i class="fa-solid fa-percent"></i>
Commission Settings
</button>


<button onclick="openPage('settings.html')">
<i class="fa-solid fa-gear"></i>
App Settings
</button>


</div>



</div>






<script type="module">


import {
auth,
db
}
from "../firebase/firebase-config.js";


import {

onAuthStateChanged,
signOut

}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {

collection,
getDocs,
doc,
getDoc

}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";






onAuthStateChanged(auth,async(user)=>{


try{


if(!user){

location.href="../auth/login.html";
return;

}



// ADMIN CHECK

const admin =
await getDoc(
doc(db,"users",user.uid)
);



if(!admin.exists() ||
admin.data().role!=="admin"){

alert("Access Denied");

location.href="../customer/home.html";

return;

}




// USERS

const users =
await getDocs(
collection(db,"users")
);



let customers=0;
let riders=0;
let pending=0;
let online=0;



users.forEach((u)=>{


let data=u.data();



if(data.role==="customer")
customers++;



if(data.role==="rider"){


riders++;


if(data.status==="pending")
pending++;


if(data.online===true)
online++;


}


});



customersEl.innerText=customers;
ridersEl.innerText=riders;
pendingEl.innerText=pending;
onlineEl.innerText=online;







// RIDES


const rides =
await getDocs(
collection(db,"rides")
);



let active=0;
let completed=0;
let cancelled=0;
let revenue=0;
let today=0;



let date =
new Date();

date.setHours(0,0,0,0);





rides.forEach((r)=>{


let data=r.data();



if(
data.status==="searching" ||
data.status==="accepted" ||
data.status==="arriving" ||
data.status==="started"
)

active++;




if(data.status==="completed"){


completed++;


let fare =
Number(data.fare || 0);


revenue += fare;



if(
data.createdAt &&
data.createdAt.toDate() >= date
){

today += fare;

}


}




if(data.status==="cancelled")
cancelled++;



});




ridesEl.innerText=rides.size;
activeEl.innerText=active;
completedEl.innerText=completed;
cancelledEl.innerText=cancelled;

revenueEl.innerText="₹"+revenue;

todayRevenueEl.innerText="₹"+today;






// COMMISSION


let percent=20;



const commission =
await getDoc(
doc(db,"settings","commission")
);



if(commission.exists()){

percent =
commission.data().percent || 20;

}




let adminMoney =
(revenue*percent)/100;


let riderMoney =
revenue-adminMoney;



commissionEl.innerText =
"₹"+adminMoney.toFixed(0);



riderEarnEl.innerText =
"₹"+riderMoney.toFixed(0);




}

catch(error){

console.log(error);

}



});





const customersEl=document.getElementById("customers");
const ridersEl=document.getElementById("riders");
const pendingEl=document.getElementById("pending");
const onlineEl=document.getElementById("online");

const ridesEl=document.getElementById("rides");
const activeEl=document.getElementById("active");
const completedEl=document.getElementById("completed");
const cancelledEl=document.getElementById("cancelled");

const revenueEl=document.getElementById("revenue");
const todayRevenueEl=document.getElementById("todayRevenue");

const commissionEl=document.getElementById("commission");
const riderEarnEl=document.getElementById("riderEarn");



window.logout=async()=>{

await signOut(auth);

location.href="../auth/login.html";

};



window.openPage=(page)=>{

location.href=page;

};


</script>


</body>
</html>
