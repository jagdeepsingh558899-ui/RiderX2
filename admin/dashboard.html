<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RiderX Admin Dashboard</title><link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>

:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111;
    --border:#252525;
    --gray:#999;
    --red:#ff4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:var(--black);
    color:white;
    min-height:100vh;
    padding-bottom:50px;
}

.header{
    height:70px;
    background:#111;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:900;
}

.logo span{
    color:var(--yellow);
}

.header-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.admin-badge{
    font-size:12px;
    background:#1c1c1c;
    border:1px solid #333;
    padding:7px 10px;
    border-radius:20px;
    color:var(--yellow);
}

.logout{
    font-size:22px;
    color:var(--red);
    cursor:pointer;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.welcome{
    font-size:25px;
    font-weight:bold;
    margin-bottom:6px;
}

.subtitle{
    color:var(--gray);
    font-size:14px;
    margin-bottom:20px;
}

.loading{
    text-align:center;
    color:var(--yellow);
    margin:15px 0;
    font-size:14px;
}

.error{
    display:none;
    background:#210d0d;
    border:1px solid #662222;
    color:#ff7777;
    padding:14px;
    border-radius:12px;
    margin-bottom:18px;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    min-height:125px;
}

.card i{
    font-size:25px;
    color:var(--yellow);
}

.number{
    font-size:29px;
    font-weight:bold;
    margin-top:12px;
}

.title{
    font-size:13px;
    color:var(--gray);
    margin-top:4px;
}

.menu{
    margin-top:25px;
}

.menu-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.menu button{
    width:100%;
    padding:16px;
    background:#111;
    border:1px solid #333;
    border-radius:15px;
    color:white;
    font-size:16px;
    text-align:left;
    cursor:pointer;
}

.menu button:hover{
    border-color:var(--yellow);
    background:#171717;
}

.menu i{
    width:35px;
    color:var(--yellow);
}

.footer{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:30px;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:650px){

    .header{
        padding:0 15px;
    }

    .logo{
        font-size:24px;
    }

    .admin-badge{
        display:none;
    }

    .container{
        padding:15px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .card{
        padding:15px;
        min-height:110px;
    }

    .number{
        font-size:24px;
    }

    .menu-grid{
        grid-template-columns:1fr;
    }

}

</style></head><body><header class="header"><div class="logo">
    RID<span>ERX</span>
</div>

<div class="header-right">

    <div class="admin-badge">
        <i class="fa-solid fa-shield-halved"></i>
        ADMIN
    </div>

    <i
        class="fa-solid fa-right-from-bracket logout"
        id="logoutBtn"
        title="Logout">
    </i>

</div>

</header><div class="container"><div class="welcome">
    Admin Dashboard
</div>

<div class="subtitle">
    RiderX management & statistics
</div>

<div id="loading" class="loading">
    Checking admin access...
</div>

<div id="error" class="error"></div>


<div class="grid">

    <div class="card">
        <i class="fa-solid fa-users"></i>
        <div id="customers" class="number">0</div>
        <div class="title">Customers</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-motorcycle"></i>
        <div id="riders" class="number">0</div>
        <div class="title">Riders</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-clock"></i>
        <div id="pending" class="number">0</div>
        <div class="title">Pending Riders</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-signal"></i>
        <div id="online" class="number">0</div>
        <div class="title">Online Riders</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-route"></i>
        <div id="rides" class="number">0</div>
        <div class="title">Total Rides</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-spinner"></i>
        <div id="active" class="number">0</div>
        <div class="title">Active Rides</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-circle-check"></i>
        <div id="completed" class="number">0</div>
        <div class="title">Completed</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-xmark"></i>
        <div id="cancelled" class="number">0</div>
        <div class="title">Cancelled</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-indian-rupee-sign"></i>
        <div id="revenue" class="number">₹0</div>
        <div class="title">Revenue</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-calendar-day"></i>
        <div id="todayRevenue" class="number">₹0</div>
        <div class="title">Today Revenue</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-percent"></i>
        <div id="commission" class="number">₹0</div>
        <div class="title">Admin Commission</div>
    </div>

    <div class="card">
        <i class="fa-solid fa-wallet"></i>
        <div id="riderEarn" class="number">₹0</div>
        <div class="title">Rider Earnings</div>
    </div>

</div>


<div class="menu">

    <div class="menu-title">
        Management
    </div>

    <div class="menu-grid">

        <button onclick="openPage('riders.html')">
            <i class="fa-solid fa-motorcycle"></i>
            Manage Riders
        </button>

        <button onclick="openPage('customers.html')">
            <i class="fa-solid fa-users"></i>
            Manage Customers
        </button>

        <button onclick="openPage('rides.html')">
            <i class="fa-solid fa-route"></i>
            Manage Rides
        </button>

        <button onclick="openPage('fare-settings.html')">
            <i class="fa-solid fa-money-bill"></i>
            Fare Settings
        </button>

        <button onclick="openPage('commission.html')">
            <i class="fa-solid fa-percent"></i>
            Commission Settings
        </button>

        <button onclick="openPage('settings.html')">
            <i class="fa-solid fa-gear"></i>
            App Settings
        </button>

    </div>

</div>


<div class="footer">
    RiderX Admin Panel
</div>

</div><script type="module">

import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    getDocs,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");


const customersEl =
    document.getElementById("customers");

const ridersEl =
    document.getElementById("riders");

const pendingEl =
    document.getElementById("pending");

const onlineEl =
    document.getElementById("online");

const ridesEl =
    document.getElementById("rides");

const activeEl =
    document.getElementById("active");

const completedEl =
    document.getElementById("completed");

const cancelledEl =
    document.getElementById("cancelled");

const revenueEl =
    document.getElementById("revenue");

const todayRevenueEl =
    document.getElementById("todayRevenue");

const commissionEl =
    document.getElementById("commission");

const riderEarnEl =
    document.getElementById("riderEarn");

const logoutBtn =
    document.getElementById("logoutBtn");


function money(value){

    return "₹" +
        (Number(value) || 0)
        .toLocaleString("en-IN");

}


function roleOf(data){

    return String(
        data?.role ||
        data?.userType ||
        data?.type ||
        ""
    ).toLowerCase();

}


function isAdmin(data){

    return (
        roleOf(data) === "admin" ||
        roleOf(data) === "administrator" ||
        data?.isAdmin === true
    );

}


function showError(message){

    errorBox.style.display = "block";

    errorBox.textContent = message;

}


function hideLoading(){

    loading.style.display = "none";

}


/*
    Important:
    Collection error hone par dashboard rukega nahi.
*/

async function safeGetCollection(name){

    try{

        const result =
            await getDocs(
                collection(db,name)
            );

        return result.docs.map(
            d => ({
                id:d.id,
                ...d.data()
            })
        );

    }catch(error){

        console.warn(
            "Cannot read collection:",
            name,
            error
        );

        return [];

    }

}


function statusOf(data){

    return String(
        data?.status ||
        data?.rideStatus ||
        ""
    ).toLowerCase();

}


function amountOf(data){

    return Number(
        data?.fare ??
        data?.amount ??
        data?.price ??
        data?.totalFare ??
        data?.totalAmount ??
        0
    ) || 0;

}


function isToday(data){

    const value =
        data?.createdAt ||
        data?.timestamp ||
        data?.date;

    if(!value){

        return false;

    }

    let date = null;

    try{

        if(
            typeof value === "object" &&
            typeof value.toDate === "function"
        ){

            date = value.toDate();

        }else if(
            typeof value === "object" &&
            value.seconds
        ){

            date =
                new Date(
                    value.seconds * 1000
                );

        }else{

            date =
                new Date(value);

        }

    }catch(e){

        return false;

    }

    if(
        !date ||
        Number.isNaN(date.getTime())
    ){

        return false;

    }

    const now =
        new Date();

    return (
        date.getDate() === now.getDate() &&
        date.getMonth() === now.getMonth() &&
        date.getFullYear() === now.getFullYear()
    );

}


async function loadStatistics(){

    /*
        Default values are already 0.
        So even if Firestore rules deny
        a collection, dashboard will open.
    */

    const users =
        await safeGetCollection("users");


    let customers = 0;
    let riders = 0;
    let pending = 0;
    let online = 0;


    users.forEach(user => {

        const role =
            roleOf(user);


        if(
            role === "customer" ||
            role === "user"
        ){

            customers++;

        }


        if(role === "rider"){

            riders++;


            const status =
                String(
                    user.status ||
                    user.riderStatus ||
                    ""
                ).toLowerCase();


            if(
                status === "pending" ||
                status === "pending_approval" ||
                status === "pending-approval"
            ){

                pending++;

            }


            if(
                user.online === true ||
                user.isOnline === true ||
                status === "online"
            ){

                online++;

            }

        }

    });


    /*
        If separate riders collection exists,
        use it for rider statistics.
    */

    const riderData =
        await safeGetCollection("riders");


    if(riderData.length > 0){

        riders =
            riderData.length;


        pending =
            riderData.filter(
                rider => {

                    const status =
                        String(
                            rider.status ||
                            rider.approvalStatus ||
                            ""
                        ).toLowerCase();

                    return (
                        status === "pending" ||
                        status === "pending_approval" ||
                        status === "pending-approval"
                    );

                }
            ).length;


        online =
            riderData.filter(
                rider => {

                    const status =
                        String(
                            rider.status || ""
                        ).toLowerCase();

                    return (
                        rider.online === true ||
                        rider.isOnline === true ||
                        status === "online"
                    );

                }
            ).length;

    }


    customersEl.textContent =
        customers.toLocaleString("en-IN");

    ridersEl.textContent =
        riders.toLocaleString("en-IN");

    pendingEl.textContent =
        pending.toLocaleString("en-IN");

    onlineEl.textContent =
        online.toLocaleString("en-IN");


    /*
        Rides
    */

    const rides =
        await safeGetCollection("rides");


    let active = 0;
    let completed = 0;
    let cancelled = 0;

    let revenue = 0;
    let todayRevenue = 0;


    rides.forEach(ride => {

        const status =
            statusOf(ride);

        const amount =
            amountOf(ride);


        if(
            [
                "accepted",
                "ongoing",
                "started",
                "arriving",
                "in_progress",
                "in-progress",
                "active"
            ].includes(status)
        ){

            active++;

        }


        if(
            [
                "completed",
                "complete",
                "finished",
                "success"
            ].includes(status)
        ){

            completed++;

            revenue += amount;


            if(isToday(ride)){

                todayRevenue += amount;

            }

        }


        if(
            [
                "cancelled",
                "canceled",
                "rejected"
            ].includes(status)
        ){

            cancelled++;

        }

    });


    ridesEl.textContent =
        rides.length.toLocaleString("en-IN");

    activeEl.textContent =
        active.toLocaleString("en-IN");

    completedEl.textContent =
        completed.toLocaleString("en-IN");

    cancelledEl.textContent =
        cancelled.toLocaleString("en-IN");


    revenueEl.textContent =
        money(revenue);


    todayRevenueEl.textContent =
        money(todayRevenue);


    /*
        Temporary default commission.
        Later we will connect this to
        admin commission settings.
    */

    const commissionRate = 20;

    const adminCommission =
        revenue *
        commissionRate /
        100;


    const riderEarnings =
        revenue -
        adminCommission;


    commissionEl.textContent =
        money(adminCommission);

    riderEarnEl.textContent =
        money(riderEarnings);

}


/*
    Admin authentication
*/

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        loading.textContent =
            "Verifying admin account...";


        try{

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(userRef);


            /*
                Firebase Firestore security
                error should NOT leave infinite
                loading.
            */

            if(!userSnap.exists()){

                hideLoading();

                showError(
                    "Admin profile nahi mila. Firestore users collection me is UID ka document banayein aur role = admin rakhein."
                );

                return;

            }


            const data =
                userSnap.data();


            if(!isAdmin(data)){

                hideLoading();

                showError(
                    "Access denied. Is account ke users document me role = admin hona chahiye."
                );

                await signOut(auth);

                setTimeout(
                    () => {
                        window.location.href =
                            "login.html";
                    },
                    1800
                );

                return;

            }


            loading.textContent =
                "Loading dashboard data...";


            /*
                Dashboard statistics ko separate
                error handling ke saath load karo.
            */

            try{

                await loadStatistics();

            }catch(statError){

                console.error(
                    "Statistics error:",
                    statError
                );

                showError(
                    "Admin dashboard open ho gaya hai, lekin kuch statistics Firebase rules ki wajah se load nahi ho paayi."
                );

            }


            hideLoading();


        }catch(error){

            console.error(
                "Admin verification error:",
                error
            );


            hideLoading();


            showError(
                "Firebase se admin verify nahi ho pa raha. Firestore rules aur firebase-config.js check karein."
            );

        }

    }
);


/*
    Navigation
*/

window.openPage =
function(page){

    window.location.href =
        page;

};


/*
    Logout
*/

logoutBtn.addEventListener(
    "click",
    async () => {

        const ok =
            confirm(
                "Are you sure you want to logout?"
            );


        if(!ok){

            return;

        }


        try{

            await signOut(auth);

            window.location.href =
                "login.html";

        }catch(error){

            console.error(
                "Logout error:",
                error
            );

            alert(
                "Logout failed. Please try again."
            );

        }

    }
);

</script></body></html>
