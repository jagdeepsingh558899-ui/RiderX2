<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Dashboard</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

:root{
--yellow:#FFE500;
--black:#050505;
--card:#111;
--border:#222;
--gray:#999;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:var(--black);
color:white;
min-height:100vh;
padding-bottom:80px;
}



.header{

height:70px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;

}



.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:var(--yellow);

}



.logout{

font-size:22px;
color:#ff4444;
cursor:pointer;

}



.container{

padding:20px;

}



.welcome{

font-size:24px;
font-weight:bold;
margin-bottom:20px;

}



.loading{

text-align:center;
color:var(--yellow);
margin-bottom:20px;

}



.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}



.card{

background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:18px;

}



.card i{

font-size:28px;
color:var(--yellow);

}



.number{

font-size:30px;
font-weight:bold;
margin-top:10px;

}



.title{

font-size:14px;
color:var(--gray);

}



.menu{

margin-top:25px;

}



.menu button{

width:100%;
padding:16px;
margin-bottom:12px;
background:#111;
border:1px solid #333;
border-radius:15px;
color:white;
font-size:16px;
text-align:left;
cursor:pointer;

}



.menu i{

width:35px;
color:var(--yellow);

}



.error{

text-align:center;
color:red;
margin-top:15px;

}



@media(max-width:600px){

.grid{

grid-template-columns:repeat(2,1fr);

}

}

</style>

</head>


<body>


<header class="header">

<div class="logo">

RID<span>ERX</span>

</div>


<i onclick="logout()"
class="fa-solid fa-right-from-bracket logout"></i>


</header>



<div class="container">


<div class="welcome">

Admin Dashboard

</div>


<div id="loading"
class="loading">

Loading Dashboard...

</div>



<div id="error"
class="error"></div>



<div class="grid">


<div class="card">
<i class="fa-solid fa-users"></i>
<div id="customers" class="number">0</div>
<div class="title">Customers</div>
</div>


<div class="card">
<i class="fa-solid fa-motorcycle"></i>
<div id="riders" class="number">0</div>
<div class="title">Riders</div>
</div>


<div class="card">
<i class="fa-solid fa-clock"></i>
<div id="pending" class="number">0</div>
<div class="title">Pending Riders</div>
</div>


<div class="card">
<i class="fa-solid fa-signal"></i>
<div id="online" class="number">0</div>
<div class="title">Online Riders</div>
</div>


<div class="card">
<i class="fa-solid fa-route"></i>
<div id="rides" class="number">0</div>
<div class="title">Total Rides</div>
</div>


<div class="card">
<i class="fa-solid fa-spinner"></i>
<div id="active" class="number">0</div>
<div class="title">Active Rides</div>
</div>


<div class="card">
<i class="fa-solid fa-circle-check"></i>
<div id="completed" class="number">0</div>
<div class="title">Completed</div>
</div>


<div class="card">
<i class="fa-solid fa-xmark"></i>
<div id="cancelled" class="number">0</div>
<div class="title">Cancelled</div>
</div>


<div class="card">
<i class="fa-solid fa-indian-rupee-sign"></i>
<div id="revenue" class="number">₹0</div>
<div class="title">Revenue</div>
</div>


<div class="card">
<i class="fa-solid fa-percent"></i>
<div id="commission" class="number">₹0</div>
<div class="title">Admin Commission</div>
</div>


<div class="card">
<i class="fa-solid fa-wallet"></i>
<div id="riderEarn" class="number">₹0</div>
<div class="title">Rider Earnings</div>
</div>


</div>


<div class="menu">


<button onclick="openPage('riders.html')">
<i class="fa-solid fa-motorcycle"></i>
Manage Riders
</button>


<button onclick="openPage('customers.html')">
<i class="fa-solid fa-users"></i>
Manage Customers
</button>


<button onclick="openPage('rides.html')">
<i class="fa-solid fa-route"></i>
Manage Rides
</button>


<button onclick="openPage('fare-settings.html')">
<i class="fa-solid fa-money-bill"></i>
Fare Settings
</button>


<button onclick="openPage('commission.html')">
<i class="fa-solid fa-percent"></i>
Commission Settings
</button>


<button onclick="openPage('settings.html')">
<i class="fa-solid fa-gear"></i>
App Settings
</button>


</div>


</div>
<script type="module">


import {

auth,
db

}

from "../firebase/firebase-config.js";



import {

onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";



import {

collection,
getDocs,
doc,
getDoc

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";





const customersEl =
document.getElementById("customers");

const ridersEl =
document.getElementById("riders");

const pendingEl =
document.getElementById("pending");

const onlineEl =
document.getElementById("online");

const ridesEl =
document.getElementById("rides");

const activeEl =
document.getElementById("active");

const completedEl =
document.getElementById("completed");

const cancelledEl =
document.getElementById("cancelled");

const revenueEl =
document.getElementById("revenue");

const commissionEl =
document.getElementById("commission");

const riderEarnEl =
document.getElementById("riderEarn");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");





// ===============================
// ADMIN AUTH
// ===============================


onAuthStateChanged(

auth,

async(user)=>{


try{


if(!user){

location.href="../auth/login.html";

return;

}



const adminSnap =
await getDoc(

doc(
db,
"users",
user.uid

)

);



if(

!adminSnap.exists()

||

adminSnap.data().role !== "admin"

){


alert("Admin Access Denied");


location.href="../customer/home.html";


return;

}



loadDashboard();



setInterval(

loadDashboard,

30000

);



}

catch(error){


showError(error.message);


}



});







// ===============================
// DASHBOARD LOAD
// ===============================


async function loadDashboard(){


try{


errorBox.innerHTML="";




// USERS


const usersSnap =
await getDocs(

collection(
db,
"users"

)

);



let customers=0;
let riders=0;
let pending=0;
let online=0;



usersSnap.forEach((u)=>{


const data=u.data();



if(data.role==="customer"){

customers++;

}



if(data.role==="rider"){


riders++;



if(data.status==="pending"){

pending++;

}



if(data.online===true){

online++;

}



}



});




customersEl.innerText=customers;

ridersEl.innerText=riders;

pendingEl.innerText=pending;

onlineEl.innerText=online;







// RIDES


const ridesSnap =
await getDocs(

collection(
db,
"rides"

)

);



let active=0;
let completed=0;
let cancelled=0;

let revenue=0;




ridesSnap.forEach((r)=>{


const ride=r.data();



if(

[
"searching",
"accepted",
"arriving",
"started"

].includes(
ride.status

)

){

active++;

}




if(
ride.status==="completed"

){


completed++;


revenue +=

Number(
ride.fare || 0

);



}



if(
ride.status==="cancelled"

){

cancelled++;

}



});






ridesEl.innerText =
ridesSnap.size;


activeEl.innerText =
active;


completedEl.innerText =
completed;


cancelledEl.innerText =
cancelled;


revenueEl.innerText =
"₹"+revenue;







// COMMISSION


let percent=20;



const commissionSnap =
await getDoc(

doc(
db,
"settings",
"commission"

)

);



if(
commissionSnap.exists()

){


percent =

Number(

commissionSnap.data().percent || 20

);


}



const adminMoney =

(revenue * percent)/100;



const riderMoney =

revenue-adminMoney;




commissionEl.innerText =

"₹"+adminMoney.toFixed(0);



riderEarnEl.innerText =

"₹"+riderMoney.toFixed(0);





loading.style.display="none";



}

catch(error){


showError(error.message);



}



}







function showError(msg){


loading.innerHTML =
"Dashboard Error";


errorBox.innerHTML =
"❌ "+msg;


console.log(msg);


}







// ===============================
// LOGOUT
// ===============================


window.logout =
async()=>{


await signOut(auth);


location.href="../auth/login.html";


};






window.openPage =
(page)=>{


location.href=page;


};



</script>


</body>

</html>
