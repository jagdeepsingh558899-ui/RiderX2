<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX Admin Dashboard</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

:root{

--yellow:#FFE500;
--black:#050505;
--card:#111;
--gray:#999;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;

}



body{

background:var(--black);
color:white;
padding-bottom:80px;

}



.header{

height:70px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;

}



.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:var(--yellow);

}


.logout{

color:#ff4444;
font-size:22px;

}





.container{

padding:20px;

}



.welcome{

font-size:22px;
margin-bottom:20px;

}



.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}




.card{

background:var(--card);
border:1px solid #222;
border-radius:20px;
padding:20px;

}



.card i{

font-size:28px;
color:var(--yellow);

}



.number{

font-size:30px;
font-weight:bold;
margin-top:10px;

}



.title{

color:var(--gray);
font-size:14px;

}





.menu{

margin-top:25px;

}



.menu button{

width:100%;
padding:16px;
margin-bottom:12px;
background:#111;
border:1px solid #333;
border-radius:15px;
color:white;
text-align:left;
font-size:16px;

}



.menu i{

color:var(--yellow);
width:35px;

}



</style>

</head>


<body>



<header class="header">


<div class="logo">

RID<span>ERX</span>

</div>


<i onclick="logout()"
class="fa-solid fa-right-from-bracket logout"></i>


</header>





<div class="container">


<div class="welcome">

Admin Dashboard

</div>



<div class="grid">



<div class="card">

<i class="fa-solid fa-users"></i>

<div id="customers"
class="number">

0

</div>

<div class="title">

Customers

</div>

</div>




<div class="card">

<i class="fa-solid fa-motorcycle"></i>

<div id="riders"
class="number">

0

</div>

<div class="title">

Total Riders

</div>

</div>





<div class="card">

<i class="fa-solid fa-user-clock"></i>

<div id="pending"
class="number">

0

</div>

<div class="title">

Pending Approval

</div>

</div>





<div class="card">

<i class="fa-solid fa-route"></i>

<div id="rides"
class="number">

0

</div>

<div class="title">

Total Rides

</div>

</div>





<div class="card">

<i class="fa-solid fa-indian-rupee-sign"></i>

<div id="revenue"
class="number">

₹0

</div>

<div class="title">

Revenue

</div>

</div>



<div class="card">

<i class="fa-solid fa-signal"></i>

<div id="online"
class="number">

0

</div>

<div class="title">

Riders Online

</div>

</div>



</div>







<div class="menu">


<button onclick="openPage('riders.html')">

<i class="fa-solid fa-motorcycle"></i>

Manage Riders

</button>



<button onclick="openPage('customers.html')">

<i class="fa-solid fa-users"></i>

Manage Customers

</button>



<button onclick="openPage('rides.html')">

<i class="fa-solid fa-route"></i>

Manage Rides

</button>



<button onclick="openPage('fare.html')">

<i class="fa-solid fa-money-bill"></i>

Fare Settings

</button>



<button onclick="openPage('settings.html')">

<i class="fa-solid fa-gear"></i>

App Settings

</button>



</div>



</div>







<script type="module">


import {

auth,
db

}

from "../firebase/firebase-config.js";



import {

onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";



import {

collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";







onAuthStateChanged(auth,async(user)=>{


if(!user){

location.href="../auth/login.html";

return;

}



const snap =
await getDocs(
collection(db,"users")
);



let customers=0;
let riders=0;



snap.forEach(doc=>{


let data=doc.data();



if(data.role==="customer")
customers++;


if(data.role==="rider")
riders++;



});



document.getElementById("customers").innerText=customers;

document.getElementById("riders").innerText=riders;




const rideSnap =
await getDocs(
collection(db,"rides")
);



document.getElementById("rides").innerText=
rideSnap.size;



});








window.logout=async()=>{


await signOut(auth);

location.href="../auth/login.html";


}





window.openPage=(page)=>{


location.href=page;


}



</script>



</body>

</html>
