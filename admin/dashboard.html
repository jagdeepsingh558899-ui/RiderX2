<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Dashboard</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111;
    --border:#252525;
    --gray:#999;
    --red:#ff4444;
    --green:#19d36b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:var(--black);
    color:white;
    min-height:100vh;
    padding-bottom:50px;
}

/* HEADER */

.header{
    height:70px;
    background:#111;
    border-bottom:1px solid #222;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:var(--yellow);
}

.header-right{
    display:flex;
    align-items:center;
    gap:18px;
}

.admin-badge{
    font-size:12px;
    background:#1c1c1c;
    border:1px solid #333;
    padding:7px 10px;
    border-radius:20px;
    color:var(--yellow);
}

.logout{
    font-size:22px;
    color:var(--red);
    cursor:pointer;
}

.logout:active{
    transform:scale(.9);
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.welcome{
    font-size:25px;
    font-weight:bold;
    margin-bottom:6px;
}

.subtitle{
    color:var(--gray);
    font-size:14px;
    margin-bottom:20px;
}

/* STATUS */

.status{
    background:#101010;
    border:1px solid #252525;
    border-radius:14px;
    padding:12px 15px;
    margin-bottom:20px;

    display:flex;
    align-items:center;
    gap:10px;

    font-size:14px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--yellow);
    flex-shrink:0;
}

.status.success .status-dot{
    background:var(--green);
}

.status.error .status-dot{
    background:var(--red);
}

.status-text{
    color:#ccc;
}

/* ERROR */

.error{
    display:none;

    background:#210d0d;
    border:1px solid #662222;
    color:#ff7777;

    padding:14px;
    border-radius:12px;

    margin-bottom:18px;

    font-size:14px;
    line-height:1.5;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;

    padding:18px;

    min-height:125px;
}

.card i{
    font-size:25px;
    color:var(--yellow);
}

.number{
    font-size:29px;
    font-weight:bold;
    margin-top:12px;
    word-break:break-word;
}

.title{
    font-size:13px;
    color:var(--gray);
    margin-top:4px;
}

/* MANAGEMENT */

.menu{
    margin-top:30px;
}

.menu-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.menu button{
    width:100%;

    padding:16px;

    background:#111;

    border:1px solid #333;
    border-radius:15px;

    color:white;

    font-size:16px;
    text-align:left;

    cursor:pointer;

    transition:.2s;
}

.menu button:hover{
    border-color:var(--yellow);
    background:#171717;
}

.menu button:active{
    transform:scale(.98);
}

.menu i{
    width:35px;
    color:var(--yellow);
}

/* FOOTER */

.footer{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:30px;
}

/* RESPONSIVE */

@media(max-width:1000px){

    .grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:700px){

    .header{
        padding:0 15px;
    }

    .logo{
        font-size:24px;
    }

    .admin-badge{
        display:none;
    }

    .container{
        padding:15px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .card{
        padding:15px;
        min-height:110px;
    }

    .number{
        font-size:24px;
    }

    .menu-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:380px){

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .number{
        font-size:21px;
    }

}

</style>

</head>


<body>


<header class="header">

<div class="container">

<script type="module">


/* =========================================================
   FIREBASE
========================================================= */


import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    getDocs,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



/* =========================================================
   ELEMENTS
========================================================= */


const statusBox =
    document.getElementById("statusBox");

const statusText =
    document.getElementById("statusText");

const errorBox =
    document.getElementById("errorBox");

const logoutBtn =
    document.getElementById("logoutBtn");



const customersEl =
    document.getElementById("customers");

const ridersEl =
    document.getElementById("riders");

const pendingEl =
    document.getElementById("pending");

const onlineEl =
    document.getElementById("online");

const ridesEl =
    document.getElementById("rides");

const activeEl =
    document.getElementById("active");

const completedEl =
    document.getElementById("completed");

const cancelledEl =
    document.getElementById("cancelled");

const revenueEl =
    document.getElementById("revenue");

const todayRevenueEl =
    document.getElementById("todayRevenue");

const commissionEl =
    document.getElementById("commission");

const riderEarnEl =
    document.getElementById("riderEarn");



/* =========================================================
   STATUS
========================================================= */


function setStatus(text,type=""){

    statusText.textContent = text;

    statusBox.className =
        "status " + type;

}


function showError(text){

    errorBox.style.display = "block";

    errorBox.textContent = text;

}


function hideError(){

    errorBox.style.display = "none";

}



/* =========================================================
   HELPERS
========================================================= */


function money(value){

    const number =
        Number(value) || 0;

    return "₹" +
        number.toLocaleString("en-IN");

}


function roleOf(data){

    return String(

        data?.role ??

        data?.userType ??

        data?.type ??

        ""

    ).trim().toLowerCase();

}


function isAdmin(data){

    return (

        roleOf(data) === "admin" ||

        roleOf(data) === "administrator" ||

        data?.isAdmin === true

    );

}


function statusOf(data){

    return String(

        data?.status ??

        data?.rideStatus ??

        ""

    ).trim().toLowerCase();

}


function amountOf(data){

    return Number(

        data?.fare ??

        data?.amount ??

        data?.price ??

        data?.totalFare ??

        data?.totalAmount ??

        0

    ) || 0;

}



/* =========================================================
   DATE
========================================================= */


function convertDate(value){

    if(!value){

        return null;

    }


    try{

        if(
            typeof value === "object" &&
            typeof value.toDate === "function"
        ){

            return value.toDate();

        }


        if(
            typeof value === "object" &&
            typeof value.seconds === "number"
        ){

            return new Date(
                value.seconds * 1000
            );

        }


        const date =
            new Date(value);


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return null;

        }


        return date;

    }catch(error){

        return null;

    }

}



function isToday(data){

    const value =

        data?.createdAt ??

        data?.timestamp ??

        data?.date ??

        data?.createdDate ??

        null;


    const date =
        convertDate(value);


    if(!date){

        return false;

    }


    const now =
        new Date();


    return (

        date.getDate() === now.getDate() &&

        date.getMonth() === now.getMonth() &&

        date.getFullYear() === now.getFullYear()

    );

}



/* =========================================================
   SAFE COLLECTION
========================================================= */


async function safeCollection(name){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    name
                )
            );


        return snapshot.docs.map(
            item => ({

                id:item.id,

                ...item.data()

            })
        );

    }catch(error){

        console.warn(
            "Firestore collection error:",
            name,
            error
        );


        return [];

    }

}



/* =========================================================
   LOAD STATISTICS
========================================================= */


async function loadStatistics(){

    let users = [];

    let ridersData = [];

    let rides = [];


    /*
        Each collection is loaded separately.
        One failed collection cannot freeze dashboard.
    */


    users =
        await safeCollection(
            "users"
        );


    ridersData =
        await safeCollection(
            "riders"
        );


    rides =
        await safeCollection(
            "rides"
        );



    /* USERS */

    let customers = 0;

    let riders = 0;

    let pending = 0;

    let online = 0;


    users.forEach(
        user => {

            const role =
                roleOf(user);


            if(

                role === "customer" ||

                role === "user"

            ){

                customers++;

            }


            if(
                role === "rider"
            ){

                riders++;


                const status =
                    String(

                        user.status ??

                        user.riderStatus ??

                        ""

                    ).toLowerCase();


                if(

                    status === "pending" ||

                    status === "pending_approval" ||

                    status === "pending-approval"

                ){

                    pending++;

                }


                if(

                    user.online === true ||

                    user.isOnline === true ||

                    status === "online"

                ){

                    online++;

                }

            }

        }
    );



    /*
        Prefer separate riders collection
        if your project uses it.
    */


    if(
        ridersData.length > 0
    ){

        riders =
            ridersData.length;


        pending =
            ridersData.filter(
                rider => {

                    const status =
                        String(

                            rider.status ??

                            rider.approvalStatus ??

                            ""

                        ).toLowerCase();


                    return (

                        status === "pending" ||

                        status === "pending_approval" ||

                        status === "pending-approval"

                    );

                }
            ).length;


        online =
            ridersData.filter(
                rider => {

                    const status =
                        String(

                            rider.status ??

                            ""

                        ).toLowerCase();


                    return (

                        rider.online === true ||

                        rider.isOnline === true ||

                        status === "online"

                    );

                }
            ).length;

    }



    /* RIDES */

    let active = 0;

    let completed = 0;

    let cancelled = 0;

    let revenue = 0;

    let todayRevenue = 0;


    rides.forEach(
        ride => {

            const status =
                statusOf(ride);


            const amount =
                amountOf(ride);



            if(

                [

                    "accepted",

                    "ongoing",

                    "started",

                    "arriving",

                    "in_progress",

                    "in-progress",

                    "active"

                ].includes(status)

            ){

                active++;

            }



            if(

                [

                    "completed",

                    "complete",

                    "finished",

                    "success"

                ].includes(status)

            ){

                completed++;


                revenue +=
                    amount;


                if(
                    isToday(ride)
                ){

                    todayRevenue +=
                        amount;

                }

            }



            if(

                [

                    "cancelled",

                    "canceled",

                    "rejected"

                ].includes(status)

            ){

                cancelled++;

            }

        }
    );



    /* UPDATE UI */


    customersEl.textContent =
        customers.toLocaleString(
            "en-IN"
        );


    ridersEl.textContent =
        riders.toLocaleString(
            "en-IN"
        );


    pendingEl.textContent =
        pending.toLocaleString(
            "en-IN"
        );


    onlineEl.textContent =
        online.toLocaleString(
            "en-IN"
        );


    ridesEl.textContent =
        rides.length.toLocaleString(
            "en-IN"
        );


    activeEl.textContent =
        active.toLocaleString(
            "en-IN"
        );


    completedEl.textContent =
        completed.toLocaleString(
            "en-IN"
        );


    cancelledEl.textContent =
        cancelled.toLocaleString(
            "en-IN"
        );


    revenueEl.textContent =
        money(revenue);


    todayRevenueEl.textContent =
        money(todayRevenue);



    /*
        Default commission.
        This can later be connected
        to commission settings.
    */


    const commissionRate = 20;


    const adminCommission =

        revenue *
        commissionRate /
        100;


    const riderEarnings =

        revenue -
        adminCommission;


    commissionEl.textContent =
        money(
            adminCommission
        );


    riderEarnEl.textContent =
        money(
            riderEarnings
        );

}



/* =========================================================
   AUTHENTICATION
========================================================= */


/*
    IMPORTANT:

    Do NOT redirect immediately when auth
    is initially null.

    Firebase may still be restoring the
    existing session.

    onAuthStateChanged gives the final state.
*/


let authCheckFinished = false;


const unsubscribe =
    onAuthStateChanged(
        auth,
        async user => {

            if(authCheckFinished){

                return;

            }


            /*
                No user = not logged in.
            */


            if(!user){

                authCheckFinished =
                    true;


                setStatus(
                    "Admin login required."
                );


                /*
                    Small delay prevents
                    Firebase initialization
                    race conditions.
                */


                setTimeout(
                    () => {

                        window.location.replace(
                            "login.html"
                        );

                    },
                    300
                );


                return;

            }



            /*
                USER FOUND
            */


            setStatus(
                "Verifying admin account..."
            );


            try{

                /*
                    Check users/{uid}
                */


                const adminRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const adminSnap =
                    await getDoc(
                        adminRef
                    );



                /*
                    PROFILE NOT FOUND
                */


                if(
                    !adminSnap.exists()
                ){

                    authCheckFinished =
                        true;


                    setStatus(
                        "Admin profile not found.",
                        "error"
                    );


                    showError(

                        "Admin profile nahi mila. Firebase Firestore ke users collection me is logged-in account ke UID ka document hona chahiye aur usme role = admin hona chahiye."

                    );


                    /*
                        Do not keep loading.
                    */


                    return;

                }



                const adminData =
                    adminSnap.data();



                /*
                    ADMIN CHECK
                */


                if(
                    !isAdmin(
                        adminData
                    )
                ){

                    authCheckFinished =
                        true;


                    setStatus(
                        "Access denied.",
                        "error"
                    );


                    showError(

                        "Access denied. Is account ke users document me role field ka value exactly admin hona chahiye."

                    );


                    try{

                        await signOut(
                            auth
                        );

                    }catch(e){

                        console.warn(
                            e
                        );

                    }


                    setTimeout(
                        () => {

                            window.location.replace(
                                "login.html"
                            );

                        },
                        1500
                    );


                    return;

                }



                /*
                    ADMIN VERIFIED
                */


                authCheckFinished =
                    true;


                setStatus(
                    "Admin verified • Dashboard ready",
                    "success"
                );


                hideError();



                /*
                    Statistics should NEVER
                    prevent dashboard opening.
                */


                try{

                    await loadStatistics();

                }catch(statError){

                    console.error(
                        "Statistics error:",
                        statError
                    );


                    showError(

                        "Dashboard open ho gaya hai. Kuch statistics Firebase Firestore rules ya collection structure ki wajah se load nahi ho paayi."

                    );

                }


            }catch(error){

                console.error(
                    "Admin verification error:",
                    error
                );


                authCheckFinished =
                    true;


                setStatus(
                    "Admin verification failed.",
                    "error"
                );


                showError(

                    "Firebase se admin verify nahi ho pa raha. firebase-config.js aur Firestore rules check karein."

                );

            }

        }
    );



/* =========================================================
   NAVIGATION
========================================================= */


window.openPage =
function(page){

    window.location.href =
        page;

};



/* =========================================================
   LOGOUT
========================================================= */


logoutBtn.addEventListener(
    "click",
    async () => {

        const confirmLogout =
            confirm(
                "Are you sure you want to logout?"
            );


        if(!confirmLogout){

            return;

        }


        try{

            await signOut(
                auth
            );


            window.location.replace(
                "login.html"
            );


        }catch(error){

            console.error(
                "Logout error:",
                error
            );


            alert(
                "Logout failed. Please try again."
            );

        }

    }
);

</script>
