<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX Commission Settings</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

:root{
--yellow:#FFE500;
--black:#050505;
--card:#111;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#050505;
color:white;

}



.header{

height:70px;
background:#111;
display:flex;
align-items:center;
padding:0 20px;

}



.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#FFE500;

}



.container{

padding:20px;

}



.card{

background:#111;
border:1px solid #222;
border-radius:20px;
padding:25px;
margin-top:20px;

}



.title{

font-size:22px;
font-weight:bold;
margin-bottom:20px;

}



label{

display:block;
margin-bottom:10px;
color:#aaa;

}



input{

width:100%;
padding:15px;
background:#000;
border:1px solid #333;
border-radius:12px;
color:white;
font-size:18px;

}



button{

margin-top:20px;
width:100%;
padding:16px;
background:#FFE500;
border:none;
border-radius:15px;
font-size:17px;
font-weight:bold;

}



.status{

margin-top:20px;
text-align:center;

}



.back{

margin-top:20px;
background:#111;
color:white;
border:1px solid #333;

}


</style>


</head>


<body>


<header class="header">

<div class="logo">
RID<span>ERX</span>
</div>

</header>




<div class="container">


<div class="card">


<div class="title">

Commission Settings

</div>



<label>
Admin Commission Percentage (%)
</label>


<input 
id="commissionPercent"
type="number"
placeholder="Example: 20">



<button id="saveCommission">

Save Commission

</button>



<div id="status"
class="status">

</div>



<button class="back"
onclick="history.back()">

Back

</button>



</div>



</div>



<script type="module"
src="./js/commission.js"></script>


</body>

</html>
