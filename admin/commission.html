<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Commission Settings</title>


<style>

:root{

--yellow:#FFE500;
--black:#050505;
--card:#111;

}



*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;

}



body{

background:var(--black);
color:white;
padding:20px;

}



.logo{

font-size:28px;
font-weight:900;
margin-bottom:25px;

}


.logo span{

color:var(--yellow);

}



.card{

background:var(--card);
border:1px solid #333;
border-radius:20px;
padding:20px;

}



h2{

margin-bottom:20px;

}



label{

display:block;
margin-bottom:8px;
color:#999;

}



input{

width:100%;
padding:15px;
background:#222;
border:1px solid #444;
border-radius:12px;
color:white;
font-size:18px;

}



button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:var(--yellow);
font-weight:bold;
font-size:16px;

}



#status{

margin-top:15px;
color:#00ff66;
text-align:center;

}



.back{

background:#222;
color:white;

}


</style>


</head>



<body>


<div class="logo">

RID<span>ERX</span>

</div>



<button class="back"
onclick="history.back()">

← Back

</button>




<div class="card">


<h2>

Commission Settings

</h2>



<label>

Admin Commission %

</label>



<input

id="percent"

type="number"

placeholder="Enter commission %"



>



<button id="save">

Save Commission

</button>



<div id="status"></div>



</div>





<script type="module"
src="./js/commission.js"></script>



</body>

</html>
