<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Users</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.card{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


button{

width:100%;
padding:12px;
margin-top:10px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

👥 User Management

</div>



<div class="container">


<div id="users">

Loading...

</div>


</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs,
doc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






async function loadUsers(){



let snap=await getDocs(

collection(db,"users")

);



let box=document.getElementById("users");


box.innerHTML="";





snap.forEach((user)=>{


let data=user.data();



box.innerHTML += `


<div class="card">


<h3>

👤 ${data.name || "User"}

</h3>



<p>

📧 ${data.email || ""}

</p>



<p>

Role: ${data.role || "customer"}

</p>



<p>

Status:

${data.blocked ? "Blocked 🚫" : "Active ✅"}

</p>




<button onclick="blockUser('${user.id}')">

🚫 Block

</button>



<button onclick="unblockUser('${user.id}')">

✅ Unblock

</button>



</div>


`;



});



}








window.blockUser=async function(id){



await updateDoc(

doc(db,"users",id),

{


blocked:true

}

);



alert("User Blocked 🚫");


loadUsers();


}







window.unblockUser=async function(id){



await updateDoc(

doc(db,"users",id),

{


blocked:false

}

);



alert("User Unblocked ✅");


loadUsers();



}





loadUsers();



</script>


</body>

</html>
