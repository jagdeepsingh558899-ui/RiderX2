<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>RiderX Admin - Users</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

<style>

:root{
    --yellow:#FFD400;
    --bg:#080808;
    --card:#151515;
    --border:#303030;
    --green:#22c55e;
    --red:#ef4444;
    --orange:#f59e0b;
    --muted:#777;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
    background:var(--bg);
}

body{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;

.app{
    min-height:100vh;

/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:50;

    display:flex;
    align-items:center;
    gap:10px;

    padding:12px;

    background:#0c0c0c;
    border-bottom:1px solid #292929;
}

.back-btn{
    width:40px;
    height:40px;

    border:1px solid #363636;
    border-radius:11px;

    background:#1b1b1b;
    color:#fff;

    font-size:20px;
}

.back-btn:active{
    transform:scale(.96);
}

.logo{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:var(--yellow);
    color:#000;

    font-size:9px;
    font-weight:900;
}

.header-info{
    flex:1;
}

.header-title{
    font-size:10px;
    font-weight:900;
}

.header-subtitle{
    margin-top:3px;

    color:#777;

    font-size:5px;
}


/* =========================================================
   MAIN
========================================================= */

.main{
    width:100%;
    max-width:1200px;

    margin:auto;

    padding:15px;
}


/* =========================================================
   PAGE TOP
========================================================= */

.page-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;

    margin-bottom:13px;
}

.page-title{
    font-size:14px;
    font-weight:900;
}

.page-description{
    margin-top:4px;

    color:#777;

    font-size:6px;
}

.refresh-btn{
    height:38px;

    padding:0 14px;

    border:1px solid #5d5200;
    border-radius:10px;

    background:#1c1900;
    color:var(--yellow);

    font-size:6px;
    font-weight:900;
}

.refresh-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:9px;

    margin-bottom:12px;
}

.stat{
    padding:13px;

    border:1px solid var(--border);
    border-radius:14px;

    background:var(--card);
}

.stat-label{
    color:#777;

    font-size:5px;
    font-weight:800;
}

.stat-value{
    margin-top:6px;

    font-size:16px;
    font-weight:900;
}


/* =========================================================
   CARD
========================================================= */

.card{
    border:1px solid var(--border);
    border-radius:16px;

    background:var(--card);

    overflow:hidden;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    display:flex;
    align-items:center;

    gap:8px;

    padding:11px;

    border-bottom:1px solid #292929;
}

.search{
    flex:1;

    height:37px;

    padding:0 10px;

    border:1px solid #383838;
    border-radius:9px;

    outline:none;

    background:#101010;
    color:#fff;

    font-size:6px;
}

.search::placeholder{
    color:#555;
}

.search:focus{
    border-color:#766800;
}

.select{
    width:150px;

    height:37px;

    padding:0 9px;

    border:1px solid #383838;
    border-radius:9px;

    outline:none;

    background:#101010;
    color:#fff;

    font-size:5.5px;
}


/* =========================================================
   TABLE
========================================================= */

.table-wrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:850px;

    border-collapse:collapse;
}

th{
    padding:11px;

    background:#111;

    color:#777;

    font-size:5px;
    font-weight:900;

    text-align:left;

    white-space:nowrap;
}

td{
    padding:11px;

    border-top:1px solid #292929;

    font-size:5.5px;

    vertical-align:middle;
}

tr:hover td{
    background:#191919;
}


/* =========================================================
   USER
========================================================= */

.user-cell{
    display:flex;
    align-items:center;

    gap:8px;
}

.avatar{
    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    border-radius:10px;

    background:#292929;
    color:var(--yellow);

    font-size:8px;
    font-weight:900;
}

.user-name{
    font-size:6px;
    font-weight:900;
}

.user-email{
    margin-top:3px;

    color:#666;

    font-size:4.5px;

/* =========================================================
   BADGES
========================================================= */

.badge{

    align-items:center;

    padding:5px 8px;

    border-radius:20px;

    font-size:4.5px;
    font-weight:900;
}

.badge-customer{
    background:#24243a;
    color:#a5b4fc;
}

.badge-rider{
    background:#2d2500;
    color:var(--yellow);
}

.badge-active{
    background:#102719;
    color:var(--green);
}

.badge-blocked{
    background:#321717;
    color:#ff7373;
}

.badge-pending{
    background:#2e230f;
    color:var(--orange);
}


/* =========================================================
   ACTIONS
========================================================= */

.row-actions{
    display:flex;
    gap:5px;
}

.small-btn{
    height:29px;

    padding:0 8px;

    border:1px solid #383838;
    border-radius:7px;

    background:#202020;
    color:#aaa;

    font-size:4.5px;
    font-weight:800;
}

.small-btn:hover{
    border-color:#665a00;
    color:var(--yellow);
}

.small-btn.danger{
    color:#ff7777;

    border-color:#512525;

}

.small-btn.success{
    color:#55df82;

    border-color:#235a35;

    background:#112116;
}

.small-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}


/* =========================================================
   EMPTY / LOADING / ERROR
========================================================= */

.empty{
    padding:50px 15px;

    text-align:center;

}

.loading-spinner{

    border-radius:50%;

@keyframes spin{

}

.error-box{
    padding:18px;

    color:#ff8585;

    text-align:center;

    font-size:6px;
}

.retry-btn{
    margin-top:10px;

    height:32px;

    padding:0 12px;

    border:1px solid #5d5200;
    border-radius:8px;

    background:#292400;
    color:var(--yellow);

    font-size:5px;
    font-weight:900;

   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;
    align-items:center;
    justify-content:center;

    padding:15px;

    background:rgba(0,0,0,.78);
}

.modal.show{

}

.modal-card{

    overflow-y:auto;

    border-radius:17px;

    background:#151515;

}

.modal-head{

    align-items:center;
    justify-content:space-between;

    padding:14px;

    border-bottom:1px solid #292929;
}

.modal-title{
    font-size:8px;
    font-weight:900;
}

.close-btn{
    width:31px;
    height:31px;

    border:1px solid #383838;
    border-radius:8px;

    background:#222;
    color:#fff;

    font-size:15px;
}

.modal-body{
    padding:14px;
}

.detail-row{
    display:flex;
    justify-content:space-between;

    gap:10px;

    padding:9px 0;

    border-bottom:1px solid #272727;

    font-size:5.5px;
}

.detail-row:last-child{
    border-bottom:0;
}

.detail-label{
    color:#777;
}

.detail-value{

    text-align:right;

}

.modal-actions{

    border-top:1px solid #292929;
}

.modal-action{
    flex:1;

    height:37px;

    border:1px solid #3b3b3b;
    border-radius:9px;

    background:#222;
    color:#fff;

    font-weight:900;
}

.modal-action.primary{
    border-color:#635700;

    background:var(--yellow);
    color:#000;
}

.modal-action.danger{
    border-color:#602828;

    background:#241414;
    color:#ff7777;

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:20px;

    z-index:150;

    width:calc(100% - 30px);
    max-width:450px;

    padding:11px;

    border:1px solid #383838;
    border-radius:11px;

    background:#222;
    color:#fff;

    text-align:center;

    font-size:6px;

    opacity:0;
    pointer-events:none;

    transform:translate(-50%,20px);

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:translate(-50%,0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    }

    }

    .page-top{
        align-items:flex-start;
    }

    .refresh-btn{
        padding:0 10px;
    }

<!-- =======================================================
     FIREBASE + PAGE LOGIC
======================================================= -->

<script type="module">

/*
 * RiderX Admin Users
 *
 * Canonical file:
 * admin/users.html
 *
 * Uses the existing RiderX Firebase configuration.
 *
 * Primary data:
 *   Firestore / users
 *   Firestore / riders
 *
 * LocalStorage is NOT used as the primary user database.
 */

import {
    db
} from "../firebase/firebase-config.js";

import {
    collection,
    getDocs,
    doc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   STATE
========================================================= */

let users = [];

let selectedUserId = null;

let selectedUser = null;

let toastTimer = null;

let loading = false;


/* =========================================================
   DOM
========================================================= */

const usersTable =
    document.getElementById(
        "usersTable"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const roleFilter =
    document.getElementById(
        "roleFilter"
    );

const statusFilter =
    document.getElementById(
        "statusFilter"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const userModal =
    document.getElementById(
        "userModal"
    );

const modalBody =
    document.getElementById(
        "modalBody"
    );

const closeModalButton =
    document.getElementById(
        "closeModalButton"
    );

const modalCloseAction =
    document.getElementById(
        "modalCloseAction"
    );

const modalStatusButton =
    document.getElementById(
        "modalStatusButton"
    );


/* =========================================================
   NORMALIZE ROLE
========================================================= */

function normalizeRole(value){

    const role =
        String(
            value || ""
        )
        .trim()
        .toLowerCase();


    if(
        role === "rider" ||
        role === "driver" ||
        role === "captain"
    ){

        return "rider";

    }


    if(
        role === "customer" ||
        role === "user" ||
        role === "passenger"
    ){

        return "customer";

    }


    return "customer";

}


/* =========================================================
   NORMALIZE STATUS
========================================================= */

function normalizeStatus(value){

    const status =
        String(
            value || ""
        )
        .trim()
        .toLowerCase();


    if(
        status === "blocked" ||
        status === "disabled" ||
        status === "suspended"
    ){

        return "blocked";

    }


    if(
        status === "pending" ||
        status === "waiting"
    ){

        return "pending";

    }


    if(
        status === "offline"
    ){

        return "active";

    }


    return "active";

}


/* =========================================================
   NORMALIZE FIRESTORE DATE
========================================================= */

function normalizeDate(value){

    if(!value){

        return "";

    }


    if(
        typeof value.toDate ===
        "function"
    ){

        try{

            return value.toDate();

        }catch(error){

            return "";

        }

    }


    if(
        value instanceof Date
    ){

        return value;

    }


    if(
        typeof value ===
        "number"
    ){

        const date =
            new Date(value);

        return isNaN(
            date.getTime()
        )
            ? ""
            : date;

    }


    if(
        typeof value ===
        "string"
    ){

        const date =
            new Date(value);

        return isNaN(
            date.getTime()
        )
            ? ""
            : date;

    }


    return "";

}


/* =========================================================
   NORMALIZE USER
========================================================= */

function normalizeUser(
    data,
    id,
    forcedRole = ""
){

    const role =
        normalizeRole(
            forcedRole ||
            data.role ||
            data.userType ||
            data.type
        );


    const status =
        normalizeStatus(
            data.status ||
            data.accountStatus ||
            data.account_status
        );


    const joinedAt =
        data.joinedAt ||
        data.createdAt ||
        data.created ||
        data.registrationDate ||
        "";


    return {

        id:
            String(
                data.uid ||
                data.userId ||
                id ||
                ""
            ),

        name:
            String(
                data.name ||
                data.fullName ||
                data.displayName ||
                data.firstName ||
                "RiderX User"
            ),

        email:
            String(
                data.email ||
                ""
            ),

        phone:
            String(
                data.phone ||
                data.phoneNumber ||
                data.mobile ||
                ""
            ),

        role,

        status,

        joinedAt,

        raw:data

    };

}


/* =========================================================
   DUPLICATE CHECK
========================================================= */

function addUser(
    list,
    user
){

    if(
        !user ||
        !user.id
    ){

        return;

    }


    const exists =
        list.some(
            item =>
                String(item.id) ===
                String(user.id)
        );


    if(!exists){

        list.push(
            user
        );

    }

}


/* =========================================================
   FIRESTORE COLLECTION LOADER
========================================================= */

async function loadCollection(
    collectionName,
    forcedRole
){

    const result = [];


    const snapshot =
        await getDocs(
            collection(
                db,
                collectionName
            )
        );


    snapshot.forEach(
        documentSnapshot => {

            const data =
                documentSnapshot.data() ||
                {};


            addUser(
                result,
                normalizeUser(
                    data,
                    documentSnapshot.id,
                    forcedRole
                )
            );

        }
    );


    return result;

}


/* =========================================================
   LOAD USERS
========================================================= */

async function loadUsers(){

    if(loading){

        return;

    }


    loading = true;

    setRefreshState(
        true
    );

    showLoading();


    try{

        const result = [];


        /*
         * Main users collection.
         */
        try{

            const customerUsers =
                await loadCollection(
                    "users",
                    "customer"
                );


            customerUsers.forEach(
                user =>
                    addUser(
                        result,
                        user
                    )
            );

        }catch(error){

            console.warn(
                "users collection could not be loaded:",
                error
            );

        }


        /*
         * Rider collection.
         *
         * Riders are kept separate in the
         * existing RiderX architecture.
         */
        try{

            const riderUsers =
                await loadCollection(
                    "riders",
                    "rider"
                );


            riderUsers.forEach(
                user =>
                    addUser(
                        result,
                        user
                    )
            );

        }catch(error){

            console.warn(
                "riders collection could not be loaded:",
                error
            );

        }


        users =
            result.sort(
                function(a,b){

                    const dateA =
                        normalizeDate(
                            a.joinedAt
                        );

                    const dateB =
                        normalizeDate(
                            b.joinedAt
                        );


                    if(
                        !dateA &&
                        !dateB
                    ){

                        return a.name.localeCompare(
                            b.name
                        );

                    }


                    if(!dateA){

                        return 1;

                    }


                    if(!dateB){

                        return -1;

                    }


                    return dateB.getTime() -
                        dateA.getTime();

                }
            );


        renderStats();

        renderUsers();


        if(!users.length){

            showToast(
                "No users found in Firebase."
            );

        }

    }catch(error){

        console.error(
            "Firebase users load error:",
            error
        );


        showError(
            "Unable to load users from Firebase."
        );


        showToast(
            "Firebase users could not be loaded."
        );

    }finally{

        loading = false;

        setRefreshState(
            false
        );

    }

}


/* =========================================================
   RENDER STATS
========================================================= */

function renderStats(){

    const customers =
        users.filter(
            user =>
                user.role ===
                "customer"
        ).length;


    const riders =
        users.filter(
            user =>
                user.role ===
                "rider"
        ).length;


    const active =
        users.filter(
            user =>
                user.status ===
                "active"
        ).length;


    setText(
        "totalUsers",
        users.length
    );

    setText(
        "customerCount",
        customers
    );

    setText(
        "riderCount",
        riders
    );

    setText(
        "activeCount",
        active
    );

}


/* =========================================================
   FILTER
========================================================= */

function getFilteredUsers(){

    const search =
        String(
            searchInput?.value ||
            ""
        )
        .toLowerCase()
        .trim();


    const role =
        roleFilter?.value ||
        "all";


    const status =
        statusFilter?.value ||
        "all";


    return users.filter(
        function(user){

            if(
                role !== "all" &&
                user.role !== role
            ){

                return false;

            }


            if(
                status !== "all" &&
                user.status !== status
            ){

                return false;

            }


            if(!search){

                return true;

            }


            const searchable =
                [
                    user.id,
                    user.name,
                    user.email,
                    user.phone,
                    user.role,
                    user.status
                ]
                .join(" ")
                .toLowerCase();


            return searchable.includes(
                search
            );

        }
    );

}


/* =========================================================
   RENDER USERS
========================================================= */

function renderUsers(){

    if(!usersTable){

        return;

    }


    const filtered =
        getFilteredUsers();


    usersTable.innerHTML = "";


    if(!filtered.length){

        usersTable.innerHTML = `

            <tr>

                <td colspan="6">

                    <div class="empty">
                        No users found.
                    </div>

                </td>

            </tr>

        `;

        return;

    }


    filtered.forEach(
        user => {

            usersTable.appendChild(
                createUserRow(
                    user
                )
            );

        }
    );

}


/* =========================================================
   CREATE ROW
========================================================= */

function createUserRow(
    user
){

    const tr =
        document.createElement(
            "tr"
        );


    const name =
        user.name ||
        "RiderX User";


    const initial =
        name
        .trim()
        .charAt(0)
        .toUpperCase() ||
        "R";


    const roleClass =
        user.role === "rider"
            ? "badge-rider"
            : "badge-customer";


    const roleLabel =
        user.role === "rider"
            ? "Rider"
            : "Customer";


    const statusClassName =
        getStatusClass(
            user.status
        );


    const statusText =
        getStatusLabel(
            user.status
        );


    tr.innerHTML = `

        <td>

            <div class="user-cell">

                <div class="avatar">
                    ${escapeHtml(initial)}
                </div>

                <div>

                    <div class="user-name">
                        ${escapeHtml(name)}
                    </div>

                    <div class="user-email">
                        ${escapeHtml(
                            user.email ||
                            "No email"
                        )}
                    </div>

                </div>

            </div>

        </td>


        <td>

            <span class="badge ${roleClass}">
                ${roleLabel}
            </span>

        </td>


        <td>
            ${escapeHtml(
                user.phone ||
                "—"
            )}
        </td>


        <td>

            <span class="
                badge
                ${statusClassName}
            ">
                ${statusText}
            </span>

        </td>


        <td>
            ${escapeHtml(
                formatDate(
                    user.joinedAt
                )
            )}
        </td>


        <td>

            <div class="row-actions">

                <button
                    class="small-btn"
                    type="button"
                    data-action="view"
                    data-id="${escapeHtml(user.id)}"
                >
                    VIEW
                </button>


                <button
                    class="
                        small-btn
                        ${
                            user.status === "blocked"
                                ? "success"
                                : "danger"
                        }
                    "
                    type="button"
                    data-action="status"
                    data-id="${escapeHtml(user.id)}"
                >

                    ${
                        user.status === "blocked"
                            ? "UNBLOCK"
                            : "BLOCK"
                    }

                </button>

            </div>

        </td>

    `;


    return tr;

}


/* =========================================================
   TABLE ACTIONS
========================================================= */

usersTable?.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                "button[data-action]"
            );


        if(!button){

            return;

        }


        const id =
            button.dataset.id;


        if(
            button.dataset.action ===
            "view"
        ){

            viewUser(
                id
            );

            return;

        }


        if(
            button.dataset.action ===
            "status"
        ){

            toggleUserStatus(
                id
            );

        }

    }
);


/* =========================================================
   VIEW USER
========================================================= */

function viewUser(
    id
){

    const user =
        users.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!user){

        showToast(
            "User not found."
        );

        return;

    }


    selectedUserId =
        user.id;

    selectedUser =
        user;


    const name =
        user.name ||
        "RiderX User";


    const initial =
        name
        .trim()
        .charAt(0)
        .toUpperCase() ||
        "R";


    modalBody.innerHTML = `

        <div
            style="
                display:flex;
                align-items:center;
                gap:10px;
                padding-bottom:12px;
                margin-bottom:5px;
                border-bottom:1px solid #292929;
            "
        >

            <div class="avatar">
                ${escapeHtml(initial)}
            </div>

            <div>

                <div class="user-name">
                    ${escapeHtml(name)}
                </div>

                <div class="user-email">
                    ${escapeHtml(
                        user.email ||
                        "No email"
                    )}
                </div>

            </div>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                User ID
            </span>

            <span class="detail-value">
                ${escapeHtml(user.id)}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                Role
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    user.role === "rider"
                        ? "Rider"
                        : "Customer"
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                Email
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    user.email ||
                    "—"
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                Phone
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    user.phone ||
                    "—"
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                Status
            </span>

            <span class="detail-value">
                ${getStatusLabel(
                    user.status
                )}
            </span>

        </div>


        <div class="detail-row">

            <span class="detail-label">
                Joined
            </span>

            <span class="detail-value">
                ${escapeHtml(
                    formatDateLong(
                        user.joinedAt
                    )
                )}
            </span>

        </div>

    `;


    modalStatusButton.textContent =
        user.status === "blocked"
            ? "UNBLOCK USER"
            : "BLOCK USER";


    modalStatusButton.className =
        "modal-action " +
        (
            user.status === "blocked"
                ? "primary"
                : "danger"
        );


    userModal.classList.add(
        "show"
    );


    userModal.setAttribute(
        "aria-hidden",
        "false"
    );

}


/* =========================================================
   TOGGLE USER STATUS
========================================================= */

async function toggleUserStatus(
    id
){

    const user =
        users.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!user){

        showToast(
            "User not found."
        );

        return;

    }


    const newStatus =
        user.status === "blocked"
            ? "active"
            : "blocked";


    const collectionName =
        user.role === "rider"
            ? "riders"
            : "users";


    try{

        showToast(
            newStatus === "blocked"
                ? "Blocking user..."
                : "Unblocking user..."
        );


        await updateDoc(
            doc(
                db,
                collectionName,
                user.id
            ),
            {
                status:newStatus,
                updatedAt:serverTimestamp()
            }
        );


        user.status =
            newStatus;


        user.raw =
            {
                ...(user.raw || {}),
                status:newStatus
            };


        renderStats();

        renderUsers();


        if(
            selectedUserId &&
            String(
                selectedUserId
            ) ===
            String(
                user.id
            )
        ){

            viewUser(
                user.id
            );

        }


        showToast(
            newStatus === "blocked"
                ? "User blocked successfully."
                : "User unblocked successfully."
        );

    }catch(error){

        console.error(
            "User status update error:",
            error
        );


        showToast(
            "Unable to update user status."
        );

    }

}


/* =========================================================
   MODAL STATUS BUTTON
========================================================= */

modalStatusButton?.addEventListener(
    "click",
    function(){

        if(!selectedUserId){

            return;

        }


        toggleUserStatus(
            selectedUserId
        );

    }
);


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    userModal.classList.remove(
        "show"
    );


    userModal.setAttribute(
        "aria-hidden",
        "true"
    );


    selectedUserId =
        null;

    selectedUser =
        null;

}


closeModalButton?.addEventListener(
    "click",
    closeModal
);


modalCloseAction?.addEventListener(
    "click",
    closeModal
);


userModal?.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            userModal
        ){

            closeModal();

        }

    }
);


/* =========================================================
   FILTER EVENTS
========================================================= */

searchInput?.addEventListener(
    "input",
    renderUsers
);


roleFilter?.addEventListener(
    "change",
    renderUsers
);


statusFilter?.addEventListener(
    "change",
    renderUsers
);


/* =========================================================
   REFRESH
========================================================= */

refreshButton?.addEventListener(
    "click",
    loadUsers
);


/* =========================================================
   BACK
========================================================= */

backButton?.addEventListener(
    "click",
    function(){

        if(
            document.referrer &&
            document.referrer.includes(
                window.location.host
            )
        ){

            window.history.back();

        }else{

            window.location.href =
                "dashboard.html";

        }

    }
);


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

    if(!usersTable){

        return;

    }


    usersTable.innerHTML = `

        <tr>

            <td colspan="6">

                <div class="empty">

                    <div class="loading-spinner"></div>

                    Loading users from Firebase...

                </div>

            </td>

        </tr>

    `;

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
){

    if(!usersTable){

        return;

    }


    usersTable.innerHTML = `

        <tr>

            <td colspan="6">

                <div class="error-box">

                    ${escapeHtml(message)}

                    <br>

                    <button
                        class="retry-btn"
                        type="button"
                        id="inlineRetryButton"
                    >
                        RETRY
                    </button>

                </div>

            </td>

        </tr>

    `;


    document
        .getElementById(
            "inlineRetryButton"
        )
        ?.addEventListener(
            "click",
            loadUsers
        );

}


/* =========================================================
   REFRESH STATE
========================================================= */

function setRefreshState(
isLoading
){

    if(!refreshButton){

        return;

    }


    refreshButton.disabled =
        isLoading;


    refreshButton.textContent =
        isLoading
            ? "↻ LOADING..."
            : "↻ REFRESH";

}


/* =========================================================
   STATUS HELPERS
========================================================= */

function getStatusLabel(
status
){

    if(status === "blocked"){

        return "Blocked";

    }


    if(status === "pending"){

        return "Pending";

    }


    return "Active";

}


function getStatusClass(
status
){

    if(status === "blocked"){

        return "badge-blocked";

    }


    if(status === "pending"){

        return "badge-pending";

    }


    return "badge-active";

}


/* =========================================================
   TEXT
========================================================= */

function setText(
id,
value
){

    const element =
        document.getElementById(
            id
        );


    if(element){

        element.textContent =
            value;

    }

}


/* =========================================================
   DATE
========================================================= */

function formatDate(
value
){

    const date =
        normalizeDate(
            value
        );


    if(!date){

        return "—";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


function formatDateLong(
value
){

    const date =
        normalizeDate(
            value
        );


    if(!date){

        return "—";

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
message
){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){

        return;

    }


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2800
        );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closeModal();

        }

    }
);


/* =========================================================
   INIT
========================================================= */

loadUsers();

</script>
