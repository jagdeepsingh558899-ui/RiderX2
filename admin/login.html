<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Login</title>

<meta name="theme-color" content="#000000">

<style>
:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111111;
    --border:#292929;
    --gray:#999999;
    --red:#ff5555;
    --green:#22d66b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:var(--black);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:25px;
    padding:30px 25px;
    box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    margin-bottom:8px;
}

.logo span{
    color:var(--yellow);
}

.subtitle{
    text-align:center;
    color:var(--gray);
    font-size:14px;
    margin-bottom:20px;
}

.security{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-bottom:25px;
}

.security span{
    color:var(--green);
}

label{
    display:block;
    color:#ccc;
    font-size:14px;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
    margin-bottom:18px;
}

input{
    width:100%;
    padding:15px;
    background:#050505;
    border:1px solid #333;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:var(--yellow);
    box-shadow:0 0 0 2px rgba(255,229,0,.08);
}

.password-input{
    padding-right:55px;
}

.password-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:0;
    color:#888;
    font-size:18px;
    padding:8px;
    cursor:pointer;
}

.login-btn{
    width:100%;
    padding:16px;
    background:var(--yellow);
    color:#000;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.loading{
    display:none;
    text-align:center;
    color:var(--yellow);
    margin-top:16px;
    font-size:14px;
}

.message{
    min-height:22px;
    margin-top:16px;
    text-align:center;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

.message.error{
    color:#ff7777;
}

.message.success{
    color:var(--green);
}

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:#666;
    font-size:13px;
    text-decoration:none;
}

.back:hover{
    color:#fff;
}

@media(max-width:480px){

    body{
        padding:12px;
    }

    .login-box{
        padding:27px 20px;
    }

    .logo{
        font-size:34px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        RID<span>ERX</span>
    </div>

    <div class="subtitle">
        Administrator Control Panel
    </div>

    <div class="security">
        🔒 <span>Secure administrator access</span>
    </div>

    <label for="email">
        Admin Email
    </label>

    <div class="input-wrap">
        <input
            id="email"
            type="email"
            autocomplete="username"
            inputmode="email"
            placeholder="Enter admin email"
        >
    </div>

    <label for="password">
        Admin Password
    </label>

    <div class="input-wrap">

        <input
            id="password"
            class="password-input"
            type="password"
            autocomplete="current-password"
            placeholder="Enter admin password"
        >

        <button
            id="togglePassword"
            class="password-toggle"
            type="button"
            aria-label="Show password">
            👁
        </button>

    </div>

    <button
        id="loginBtn"
        class="login-btn"
        type="button">
        Admin Login
    </button>

    <div
        id="loading"
        class="loading">
        Verifying administrator...
    </div>

    <div
        id="message"
        class="message">
    </div>

    <a
        href="../index.html"
        class="back">
        ← Back to RiderX
    </a>

</div>

<script type="module">

import {
    auth,
    db
} from "../firebase/firebase-config.js";

import {
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* ============================================================
   ELEMENTS
============================================================ */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loading =
    document.getElementById("loading");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");


let busy = false;


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
    text,
    type = ""
){

    message.textContent =
        text || "";

    message.className =
        "message " + type;
}


/* ============================================================
   LOADING
============================================================ */

function setLoading(
    active,
    text = "Verifying administrator..."
){

    busy =
        active;

    loginBtn.disabled =
        active;

    emailInput.disabled =
        active;

    passwordInput.disabled =
        active;

    loading.style.display =
        active ? "block" : "none";

    loading.textContent =
        text;
}


/* ============================================================
   ADMIN CHECK
============================================================ */

function checkAdminProfile(data){

    if(!data){
        return false;
    }

    const role =
        String(
            data.role ??
            data.userType ??
            data.type ??
            ""
        )
        .trim()
        .toLowerCase();

    return (
        role === "admin" ||
        role === "administrator" ||
        data.isAdmin === true
    );
}


/* ============================================================
   PASSWORD SHOW/HIDE
============================================================ */

togglePassword.addEventListener(
    "click",
    () => {

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "🙈";

        }else{

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "👁";

        }

    }
);


/* ============================================================
   ADMIN LOGIN
============================================================ */

async function adminLogin(){

    if(busy){
        return;
    }

    const email =
        emailInput.value
            .trim()
            .toLowerCase();

    const password =
        passwordInput.value;


    if(!email){

        showMessage(
            "Please enter admin email.",
            "error"
        );

        emailInput.focus();

        return;
    }


    if(!password){

        showMessage(
            "Please enter admin password.",
            "error"
        );

        passwordInput.focus();

        return;
    }


    setLoading(
        true,
        "Signing in..."
    );

    showMessage("");


    try{

        /* ====================================================
           FIREBASE AUTHENTICATION
        ==================================================== */

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            result.user;


        if(!user){

            throw new Error(
                "Authentication failed."
            );
        }


        /* ====================================================
           FIRESTORE ADMIN VERIFICATION
        ==================================================== */

        setLoading(
            true,
            "Verifying administrator..."
        );


        const adminRef =
            doc(
                db,
                "users",
                user.uid
            );


        const adminSnap =
            await getDoc(
                adminRef
            );


        if(!adminSnap.exists()){

            await signOut(auth);

            throw new Error(
                "Admin profile not found."
            );
        }


        const adminData =
            adminSnap.data();


        console.log(
            "RiderX Admin Verification:",
            {
                uid:user.uid,
                email:user.email,
                role:adminData.role,
                isAdmin:adminData.isAdmin
            }
        );


        /* ====================================================
           ADMIN ONLY
        ==================================================== */

        if(
            !checkAdminProfile(
                adminData
            )
        ){

            await signOut(auth);

            throw new Error(
                "Access denied. This account is not an administrator."
            );
        }


        /* ====================================================
           ADMIN VERIFIED
        ==================================================== */

        showMessage(
            "✓ Admin verified successfully.",
            "success"
        );


        setLoading(
            true,
            "Opening Admin Dashboard..."
        );


        /*
           Small delay only for UI.
           Authentication is already complete.
        */

        setTimeout(
            () => {

                window.location.replace(
                    "./dashboard.html"
                );

            },
            350
        );


    }catch(error){

        console.error(
            "RiderX Admin Login Error:",
            error
        );


        let text =
            "Login failed.";


        switch(error.code){

            case "auth/invalid-credential":

                text =
                    "Email or password is incorrect.";

                break;

            case "auth/user-not-found":

                text =
                    "Admin account was not found.";

                break;

            case "auth/wrong-password":

                text =
                    "Incorrect password.";

                break;

            case "auth/invalid-email":

                text =
                    "Please enter a valid email address.";

                break;

            case "auth/user-disabled":

                text =
                    "This Firebase account has been disabled.";

                break;

            case "auth/too-many-requests":

                text =
                    "Too many attempts. Please try again later.";

                break;

            case "auth/network-request-failed":

                text =
                    "Network error. Check your internet connection.";

                break;

            case "permission-denied":

                text =
                    "Firestore permission denied.";

                break;

            default:

                if(
                    error.message
                        ?.toLowerCase()
                        .includes(
                            "permission"
                        )
                ){

                    text =
                        "Firestore permission denied.";

                }else if(error.message){

                    text =
                        error.message;

                }

        }


        setLoading(
            false
        );


        showMessage(
            "❌ " + text,
            "error"
        );

    }
}


/* ============================================================
   BUTTON
============================================================ */

loginBtn.addEventListener(
    "click",
    adminLogin
);


/* ============================================================
   ENTER KEY
============================================================ */

[emailInput,passwordInput]
.forEach(
    input => {

        input.addEventListener(
            "keydown",
            event => {

                if(
                    event.key === "Enter"
                ){

                    event.preventDefault();

                    adminLogin();

                }

            }
        );

    }
);


/* ============================================================
   EXISTING SESSION CHECK
============================================================ */

/*
   If an admin is already logged in,
   open dashboard directly.

   If a customer/rider is logged in,
   verify role first.
*/

onAuthStateChanged(
    auth,
    async user => {

        if(!user){
            return;
        }


        if(busy){
            return;
        }


        try{

            const snap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if(
                snap.exists() &&
                checkAdminProfile(
                    snap.data()
                )
            ){

                window.location.replace(
                    "./dashboard.html"
                );

            }

        }catch(error){

            console.warn(
                "Existing admin session check failed:",
                error
            );

        }

    }
);


/* ============================================================
   AUTO FOCUS
============================================================ */

setTimeout(
    () => {

        emailInput.focus();

    },
    200
);

</script>

</body>
</html>
