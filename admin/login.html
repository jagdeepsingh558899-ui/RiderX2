<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Login</title>

<meta
    name="theme-color"
    content="#000000"
>

<style>

:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111111;
    --border:#292929;
    --gray:#999999;
    --red:#ff5555;
    --green:#22d66b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:var(--black);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:390px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:25px;
    padding:30px 25px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:36px;
    font-weight:900;
    margin-bottom:8px;
}

.logo span{
    color:var(--yellow);
}

.subtitle{
    text-align:center;
    color:var(--gray);
    font-size:14px;
    margin-bottom:25px;
}

.security{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:#777;
    font-size:11px;
    margin-bottom:22px;
}

.security i{
    color:var(--green);
}

label{
    display:block;
    font-size:14px;
    color:#ccc;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
    margin-bottom:18px;
}

input{
    width:100%;
    padding:15px;
    background:#050505;
    border:1px solid #333;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:var(--yellow);
}

.password-input{
    padding-right:50px;
}

.password-toggle{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:0;
    color:#777;
    padding:8px;
    cursor:pointer;
}

.login-btn{
    width:100%;
    padding:16px;
    background:var(--yellow);
    color:#000;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.loading{
    display:none;
    text-align:center;
    color:var(--yellow);
    margin-top:16px;
    font-size:14px;
}

.message{
    min-height:22px;
    margin-top:16px;
    text-align:center;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

.message.error{
    color:#ff7777;
}

.message.success{
    color:var(--green);
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#666;
    font-size:12px;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        RID<span>ERX</span>
    </div>

    <div class="subtitle">
        Admin Panel Login
    </div>

    <div class="security">
        <i>🔒</i>
        Authorized administrators only
    </div>


    <label for="email">
        Admin Email
    </label>

    <div class="input-wrap">

        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="Enter admin email">

    </div>


    <label for="password">
        Admin Password
    </label>

    <div class="input-wrap">

        <input
            id="password"
            class="password-input"
            type="password"
            autocomplete="current-password"
            placeholder="Enter admin password">


        <button
            id="togglePassword"
            class="password-toggle"
            type="button">

            👁

        </button>

    </div>


    <button
        id="loginBtn"
        class="login-btn"
        type="button">

        Admin Login

    </button>


    <div
        id="loading"
        class="loading">

        Checking Admin Account...

    </div>


    <div
        id="message"
        class="message">
    </div>


    <a
        href="../index.html"
        class="back">

        ← Back to RiderX

    </a>

</div>


<script type="module">

import {

    auth,
    db

} from "../firebase/firebase-config.js";


import {

    signInWithEmailAndPassword,
    signOut

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {

    doc,
    getDoc

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loading =
    document.getElementById("loading");

const message =
    document.getElementById("message");

const toggle =
    document.getElementById("togglePassword");


let busy = false;


function showMessage(
    text,
    type = ""
){

    message.textContent =
        text || "";

    message.className =
        "message " + type;

}


function setLoading(
    active,
    text = "Checking Admin Account..."
){

    busy =
        active;

    loginBtn.disabled =
        active;

    email.disabled =
        active;

    password.disabled =
        active;

    loading.style.display =
        active ? "block" : "none";

    loading.textContent =
        text;

}


toggle.addEventListener(
    "click",
    function(){

        if(
            password.type ===
            "password"
        ){

            password.type =
                "text";

            toggle.textContent =
                "🙈";

        }
        else{

            password.type =
                "password";

            toggle.textContent =
                "👁";

        }

    }
);


async function adminLogin(){

    if(busy){
        return;
    }


    const emailValue =
        email.value
            .trim()
            .toLowerCase();

    const passwordValue =
        password.value;


    if(!emailValue){

        showMessage(
            "Please enter admin email.",
            "error"
        );

        email.focus();

        return;

    }


    if(!passwordValue){

        showMessage(
            "Please enter admin password.",
            "error"
        );

        password.focus();

        return;

    }


    setLoading(
        true,
        "Signing in..."
    );

    showMessage("");


    try{

        /*
         * Firebase Authentication
         */

        const result =
            await signInWithEmailAndPassword(
                auth,
                emailValue,
                passwordValue
            );


        const user =
            result.user;


        if(!user){

            throw new Error(
                "Firebase user was not returned."
            );

        }


        /*
         * Firestore admin profile
         */

        setLoading(
            true,
            "Verifying administrator..."
        );


        const adminSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    user.uid
                )
            );


        if(!adminSnap.exists()){

            await signOut(auth);

            throw new Error(
                "Admin profile not found for this Firebase UID."
            );

        }


        const data =
            adminSnap.data();


        const role =
            String(
                data.role ||
                data.userType ||
                data.type ||
                ""
            )
            .trim()
            .toLowerCase();


        const isAdmin =
            role === "admin" ||
            role === "administrator" ||
            data.isAdmin === true;


        if(!isAdmin){

            await signOut(auth);

            throw new Error(
                "Access denied. This Firebase account is not an administrator."
            );

        }


        /*
         * ADMIN VERIFIED
         */

        showMessage(
            "Admin login successful.",
            "success"
        );


        setLoading(
            true,
            "Opening Admin Dashboard..."
        );


        setTimeout(
            function(){

                window.location.replace(
                    "./dashboard.html"
                );

            },
            400
        );

    }
    catch(error){

        console.error(
            "RiderX Admin Login Error:",
            error
        );


        let msg =
            "Login failed.";


        switch(error.code){

            case "auth/invalid-credential":

                msg =
                    "Email or password is incorrect.";

                break;

            case "auth/user-not-found":

                msg =
                    "Admin Firebase account not found.";

                break;

            case "auth/wrong-password":

                msg =
                    "Wrong password.";

                break;

            case "auth/invalid-email":

                msg =
                    "Invalid email address.";

                break;

            case "auth/user-disabled":

                msg =
                    "This Firebase account is disabled.";

                break;

            case "auth/too-many-requests":

                msg =
                    "Too many attempts. Try again later.";

                break;

            case "auth/network-request-failed":

                msg =
                    "Network error. Check your internet connection.";

                break;

            case "permission-denied":

                msg =
                    "Firestore permission denied.";

                break;

            default:

                if(
                    error.message
                    &&
                    error.message.includes(
                        "Missing or insufficient permissions"
                    )
                ){

                    msg =
                        "Firestore permission denied.";

                }
                else if(error.message){

                    msg =
                        error.message;

                }

        }


        setLoading(false);

        showMessage(
            "❌ " + msg,
            "error"
        );

    }

}


loginBtn.addEventListener(
    "click",
    adminLogin
);


email.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            adminLogin();

        }

    }
);


password.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            adminLogin();

        }

    }
);

</script>

</body>
</html>
