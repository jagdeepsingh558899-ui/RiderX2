<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Login</title>


<style>

:root{
--yellow:#FFE500;
--black:#050505;
--card:#111;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#050505;
color:white;
height:100vh;
display:flex;
align-items:center;
justify-content:center;

}



.login-box{

width:90%;
max-width:380px;
background:#111;
padding:30px;
border-radius:25px;
border:1px solid #222;

}



.logo{

text-align:center;
font-size:35px;
font-weight:900;
margin-bottom:30px;

}


.logo span{

color:#FFE500;

}



input{

width:100%;
padding:15px;
margin-bottom:15px;
background:#050505;
border:1px solid #333;
border-radius:12px;
color:white;
font-size:16px;

}



button{

width:100%;
padding:15px;
background:#FFE500;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;

}



#message{

margin-top:15px;
text-align:center;
font-size:14px;

}



</style>

</head>


<body>


<div class="login-box">


<div class="logo">

RID<span>ERX</span>

</div>


<input 
type="email"
id="email"
placeholder="Admin Email">


<input 
type="password"
id="password"
placeholder="Password">



<button id="loginBtn">

Admin Login

</button>



<div id="message"></div>


</div>





<script type="module">


import {
auth,
db
}
from "../firebase/firebase-config.js";



import {

signInWithEmailAndPassword

}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";



import {

doc,
getDoc

}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";





const email =
document.getElementById("email");


const password =
document.getElementById("password");


const btn =
document.getElementById("loginBtn");


const message =
document.getElementById("message");






btn.onclick = async()=>{


try{


message.innerHTML="Checking...";



const result =
await signInWithEmailAndPassword(

auth,

email.value.trim(),

password.value

);



const user =
result.user;




const adminSnap =
await getDoc(

doc(
db,
"users",
user.uid

)

);





if(!adminSnap.exists()){


await auth.signOut();


message.innerHTML =
"❌ Admin account not found";


return;

}




const data =
adminSnap.data();





if(data.role !== "admin"){


await auth.signOut();


message.innerHTML =
"❌ Access Denied";


return;


}





message.innerHTML =
"✅ Login Successful";



setTimeout(()=>{


location.href="dashboard.html";


},1000);





}

catch(error){


message.innerHTML =
"❌ "+error.message;


}



};



</script>


</body>

</html>
