<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Login</title>

<style>
:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111111;
    --border:#292929;
    --gray:#999999;
    --red:#ff5555;
    --green:#22d66b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:var(--black);
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:390px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:25px;
    padding:30px 25px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:36px;
    font-weight:900;
    margin-bottom:8px;
    letter-spacing:-1px;
}

.logo span{
    color:var(--yellow);
}

.subtitle{
    text-align:center;
    color:var(--gray);
    font-size:14px;
    margin-bottom:30px;
}

.security{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:#777;
    font-size:11px;
    margin-bottom:22px;
}

.security i{
    color:var(--green);
}

label{
    display:block;
    font-size:14px;
    color:#ccc;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
    margin-bottom:18px;
}

.input-wrap input{
    margin-bottom:0;
    padding-right:48px;
}

input{
    width:100%;
    padding:15px;
    background:#050505;
    border:1px solid #333;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:var(--yellow);
    box-shadow:0 0 0 2px rgba(255,229,0,.08);
}

input::placeholder{
    color:#666;
}

.password-toggle{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:transparent;
    border:0;
    color:#777;
    width:auto;
    padding:8px;
    font-size:16px;
    cursor:pointer;
}

.password-toggle:hover{
    color:var(--yellow);
}

.login-btn{
    width:100%;
    padding:16px;
    background:var(--yellow);
    color:#000;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    filter:brightness(1.05);
}

.login-btn:active{
    transform:scale(.99);
}

.login-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.loading{
    display:none;
    text-align:center;
    color:var(--yellow);
    margin-top:16px;
    font-size:14px;
}

.message{
    min-height:22px;
    margin-top:16px;
    text-align:center;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

.message.error{
    color:#ff7777;
}

.message.success{
    color:var(--green);
}

.small-note{
    text-align:center;
    color:#666;
    font-size:11px;
    line-height:1.5;
    margin-top:22px;
}

@media(max-width:420px){

    .login-box{
        padding:27px 20px;
        border-radius:22px;
    }

    .logo{
        font-size:32px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        RID<span>ERX</span>
    </div>

    <div class="subtitle">
        Admin Panel Login
    </div>

    <div class="security">
        <i>🔒</i>
        Authorized administrators only
    </div>

    <label for="email">
        Admin Email
    </label>

    <div class="input-wrap">
        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="username"
            inputmode="email"
        >
    </div>


    <label for="password">
        Password
    </label>

    <div class="input-wrap">

        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            autocomplete="current-password"
        >

        <button
            type="button"
            id="togglePassword"
            class="password-toggle"
            aria-label="Show password">
            👁
        </button>

    </div>


    <button
        id="loginBtn"
        class="login-btn"
        type="button">

        Admin Login

    </button>


    <div
        id="loading"
        class="loading">

        Checking Admin Account...

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div class="small-note">
        RiderX secure administration panel
    </div>

</div>


<script type="module">

/*
============================================================
RIDERX ADMIN LOGIN
Firebase v10 Modular SDK
============================================================
*/

import {
    auth,
    db
} from "../firebase/firebase-config.js";

import {
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   ELEMENTS
========================================================= */

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const loading =
    document.getElementById("loading");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");


/* =========================================================
   STATE
========================================================= */

let loginInProgress = false;


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type = ""){

    message.textContent =
        text || "";

    message.className =
        "message " + type;
}


/* =========================================================
   LOADING
========================================================= */

function setLoading(
    active,
    text = "Checking Admin Account..."
){

    if(active){

        loading.style.display =
            "block";

        loading.textContent =
            text;

        loginBtn.disabled =
            true;

        emailInput.disabled =
            true;

        passwordInput.disabled =
            true;

    }else{

        loading.style.display =
            "none";

        loginBtn.disabled =
            false;

        emailInput.disabled =
            false;

        passwordInput.disabled =
            false;

    }
}


/* =========================================================
   PASSWORD SHOW/HIDE
========================================================= */

togglePassword.addEventListener(
    "click",
    () => {

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "🙈";

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );

        }else{

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "👁";

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );
        }
    }
);


/* =========================================================
   LOGIN BUTTON
========================================================= */

loginBtn.addEventListener(
    "click",
    loginAdmin
);


/* =========================================================
   ENTER KEY
========================================================= */

emailInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            loginAdmin();
        }
    }
);


passwordInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            loginAdmin();
        }
    }
);


/* =========================================================
   ADMIN LOGIN
========================================================= */

async function loginAdmin(){

    if(loginInProgress){
        return;
    }

    const email =
        emailInput.value
            .trim()
            .toLowerCase();

    const password =
        passwordInput.value;


    /* -----------------------------------------------------
       VALIDATION
    ----------------------------------------------------- */

    if(!email){

        showMessage(
            "❌ Please enter admin email.",
            "error"
        );

        emailInput.focus();

        return;
    }


    if(!email.includes("@")){

        showMessage(
            "❌ Please enter a valid email address.",
            "error"
        );

        emailInput.focus();

        return;
    }


    if(!password){

        showMessage(
            "❌ Please enter password.",
            "error"
        );

        passwordInput.focus();

        return;
    }


    /* -----------------------------------------------------
       START
    ----------------------------------------------------- */

    loginInProgress =
        true;

    showMessage("");

    setLoading(
        true,
        "Signing in..."
    );


    try{

        /* =================================================
           FIREBASE AUTHENTICATION
        ================================================= */

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            result.user;


        if(!user){

            throw new Error(
                "Firebase did not return a user account."
            );
        }


        /* =================================================
           VERIFY FIRESTORE ADMIN PROFILE
        ================================================= */

        setLoading(
            true,
            "Verifying admin access..."
        );


        const adminRef =
            doc(
                db,
                "users",
                user.uid
            );


        const adminSnap =
            await getDoc(
                adminRef
            );


        /* -------------------------------------------------
           ADMIN DOCUMENT DOES NOT EXIST
        ------------------------------------------------- */

        if(!adminSnap.exists()){

            await signOut(auth);

            throw new Error(
                "Admin profile not found. Firebase Auth UID ke naam se users collection me document nahi mila."
            );
        }


        const data =
            adminSnap.data();


        /* =================================================
           ADMIN ROLE CHECK
        ================================================= */

        const role =
            String(
                data.role ||
                data.userType ||
                data.type ||
                ""
            )
            .trim()
            .toLowerCase();


        const isAdmin =
            role === "admin" ||
            role === "administrator" ||
            data.isAdmin === true;


        /* -------------------------------------------------
           ACCESS DENIED
        ------------------------------------------------- */

        if(!isAdmin){

            await signOut(auth);

            throw new Error(
                "Access denied. Is account ke users document me admin role nahi hai."
            );
        }


        /* =================================================
           SUCCESS
        ================================================= */

        showMessage(
            "✅ Admin Login Successful",
            "success"
        );


        setLoading(
            true,
            "Opening Admin Dashboard..."
        );


        /*
           Small delay gives the user time
           to see successful login message.
        */

        setTimeout(
            () => {

                window.location.replace(
                    "dashboard.html"
                );

            },
            300
        );


    }catch(error){

        console.error(
            "RiderX Admin Login Error:",
            error
        );


        let msg =
            "❌ Login failed.";


        switch(error.code){

            case "auth/invalid-credential":

                msg =
                    "❌ Email or password is incorrect.";

                break;


            case "auth/user-not-found":

                msg =
                    "❌ Admin account not found in Firebase Authentication.";

                break;


            case "auth/wrong-password":

                msg =
                    "❌ Wrong password.";

                break;


            case "auth/invalid-email":

                msg =
                    "❌ Invalid email address.";

                break;


            case "auth/user-disabled":

                msg =
                    "❌ This Firebase account has been disabled.";

                break;


            case "auth/too-many-requests":

                msg =
                    "❌ Too many login attempts. Please try again later.";

                break;


            case "auth/network-request-failed":

                msg =
                    "❌ Network error. Check your internet connection.";

                break;


            case "permission-denied":

                msg =
                    "❌ Firestore permission denied. Check Firestore rules.";

                break;


            default:

                if(
                    error.message &&
                    error.message.includes(
                        "Missing or insufficient permissions"
                    )
                ){

                    msg =
                        "❌ Firestore permission denied. Check Firestore rules.";

                }else{

                    msg =
                        "❌ " +
                        (
                            error.message ||
                            "Login failed."
                        );
                }
        }


        setLoading(
            false
        );

        loginInProgress =
            false;

        showMessage(
            msg,
            "error"
        );
    }
}


/* =========================================================
   OPTIONAL SESSION CHECK
=========================================================

   If an admin is already logged in and directly opens
   login.html, verify the account before redirecting.

   Normal users are NOT redirected.
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){
            return;
        }


        /*
           Do not interfere while the user is
           currently pressing Login.
        */

        if(loginInProgress){
            return;
        }


        try{

            const adminRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const adminSnap =
                await getDoc(
                    adminRef
                );


            if(!adminSnap.exists()){

                return;
            }


            const data =
                adminSnap.data();


            const role =
                String(
                    data.role ||
                    data.userType ||
                    data.type ||
                    ""
                )
                .trim()
                .toLowerCase();


            const isAdmin =
                role === "admin" ||
                role === "administrator" ||
                data.isAdmin === true;


            if(isAdmin){

                showMessage(
                    "✅ Admin session found. Opening dashboard...",
                    "success"
                );


                setLoading(
                    true,
                    "Opening Admin Dashboard..."
                );


                setTimeout(
                    () => {

                        window.location.replace(
                            "dashboard.html"
                        );

                    },
                    300
                );
            }

        }catch(error){

            console.warn(
                "Existing admin session check failed:",
                error
            );
        }
    }
);

</script>

</body>
</html>
