<body>

<div class="wrap">

    <div class="top">

        <div class="logo">
            RID<span>ERX</span> ADMIN
        </div>

        <a
            class="back"
            href="dashboard.html">
            ← Dashboard
        </a>

    </div>


    <h1>
        Rider Approval
    </h1>

    <div class="sub">
        Review rider registration requests. Approve a rider only after
        checking the submitted registration details.
    </div>


    <div id="statusBox" class="status"></div>


    <div class="box">

        <div class="head">

            <div class="head-title">
                🏍️ Pending Rider Requests
            </div>

            <span
                id="count"
                class="badge">
                0 pending
            </span>

        </div>


        <div
            id="list"
            class="load">
            Checking rider registrations...
        </div>

    </div>


    <button
        id="refreshBtn"
        class="refresh">
        🔄 Refresh Requests
    </button>

</div>


<!-- DETAILS MODAL -->

<div
    id="detailsModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-title">
            Rider Registration Details
        </div>

        <div
            id="details"
            class="details">
        </div>

        <button
            id="closeModal"
            class="close">
            Close
        </button>

    </div>

</div>


<script type="module">

import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================
   ELEMENTS
========================= */

const list =
    document.getElementById("list");

const count =
    document.getElementById("count");

const statusBox =
    document.getElementById("statusBox");

const refreshBtn =
    document.getElementById("refreshBtn");

const detailsModal =
    document.getElementById("detailsModal");

const details =
    document.getElementById("details");

const closeModal =
    document.getElementById("closeModal");


/* =========================
   HELPERS
========================= */

function roleOf(data){

    return String(
        data?.role ??
        data?.userType ??
        data?.type ??
        ""
    )
    .trim()
    .toLowerCase();

}


function statusOf(data){

    return String(
        data?.status ??
        data?.approvalStatus ??
        data?.riderStatus ??
        data?.verificationStatus ??
        ""
    )
    .trim()
    .toLowerCase();

}


function isAdmin(data){

    return (
        roleOf(data) === "admin" ||
        roleOf(data) === "administrator" ||
        data?.isAdmin === true
    );

}


function escapeHtml(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char])
    );

}


function showStatus(
    message,
    type="success"
){

    statusBox.className =
        "status " + type;

    statusBox.textContent =
        message;

}


function hideStatus(){

    statusBox.className =
        "status";

    statusBox.textContent =
        "";

}


async function getCollection(
    collectionName
){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    collectionName
                )
            );

        return snapshot.docs.map(
            item => ({
                id:item.id,
                ...item.data()
            })
        );

    }catch(error){

        console.error(
            "Collection error:",
            collectionName,
            error
        );

        return [];

    }

}


/* =========================
   FIND USER ID
========================= */

function getPossibleUserIds(rider){

    const ids = new Set();

    if(rider.id){
        ids.add(String(rider.id));
    }

    const possible = [

        rider.uid,

        rider.userId,

        rider.userUID,

        rider.authUid,

        rider.authUID,

        rider.ownerId,

        rider.accountId

    ];

    possible.forEach(
        value => {

            if(value){
                ids.add(
                    String(value)
                );
            }

        }
    );

    return [...ids];

}


/* =========================
   LOAD RIDER REQUESTS
========================= */

let allRiders = [];


async function loadRiderRequests(){

    list.innerHTML =
        '<div class="load">Loading rider requests...</div>';

    try{

        const [
            riders,
            users
        ] = await Promise.all([

            getCollection("riders"),

            getCollection("users")

        ]);


        /*
         * Riders collection ko primary source
         */

        const riderMap =
            new Map();


        riders.forEach(
            rider => {

                riderMap.set(
                    rider.id,
                    {
                        ...rider,
                        source:"riders"
                    }
                );

            }
        );


        /*
         * Users collection me rider accounts
         * agar riders collection me nahi hain
         */

        users
        .filter(
            user =>
                roleOf(user) === "rider"
        )
        .forEach(
            user => {

                if(
                    !riderMap.has(user.id)
                ){

                    riderMap.set(
                        user.id,
                        {
                            ...user,
                            source:"users"
                        }
                    );

                }

            }
        );


        allRiders =
            [...riderMap.values()];


        /*
         * Sirf pending requests
         */

        const pending =
            allRiders.filter(
                rider => {

                    const status =
                        statusOf(rider);


                    const approved =
                        rider.approved === true ||
                        rider.isApproved === true;


                    const rejected =
                        status === "rejected" ||
                        status === "declined";


                    if(
                        approved ||
                        rejected
                    ){

                        return false;

                    }


                    /*
                     * Blank status ko bhi pending
                     * maana jayega.
                     */

                    return (

                        status === "" ||

                        status === "pending" ||

                        status === "pending_approval" ||

                        status === "pending-approval" ||

                        status === "under_review" ||

                        status === "under-review" ||

                        status === "verifying" ||

                        status === "submitted" ||

                        status === "application_submitted"

                    );

                }
            );


        count.textContent =
            pending.length +
            " pending";


        if(!pending.length){

            list.innerHTML = `
                <div class="empty">
                    <div style="font-size:30px;">✓</div>
                    No pending rider registration requests.
                </div>
            `;

            return;

        }


        list.innerHTML = "";


        pending.forEach(
            rider => {

                const name =
                    rider.name ||
                    rider.fullName ||
                    rider.displayName ||
                    (
                        rider.firstName
                        ? (
                            rider.firstName +
                            " " +
                            (
                                rider.lastName ||
                                ""
                            )
                        ).trim()
                        : "Rider"
                    );


                const phone =
                    rider.phone ||
                    rider.mobile ||
                    rider.phoneNumber ||
                    "No phone";


                const email =
                    rider.email ||
                    "No email";


                const vehicle =
                    rider.vehicleType ||
                    rider.vehicle ||
                    rider.bikeModel ||
                    "Not provided";


                const currentStatus =
                    statusOf(rider) ||
                    "pending";


                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "row";


                row.innerHTML = `

                    <div class="info">

                        <div class="name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="meta">

                            Rider ID:
                            ${escapeHtml(rider.id)}

                            <br>

                            📱 ${escapeHtml(phone)}

                            <br>

                            ✉️ ${escapeHtml(email)}

                            <br>

                            🏍️ ${escapeHtml(vehicle)}

                        </div>

                        <span class="status-pill">
                            ${escapeHtml(currentStatus)}
                        </span>

                    </div>


                    <div class="actions">

                        <button
                            class="btn view"
                            data-action="view"
                            data-id="${escapeHtml(rider.id)}">

                            View

                        </button>


                        <button
                            class="btn approve"
                            data-action="approve"
                            data-id="${escapeHtml(rider.id)}">

                            ✓ Approve

                        </button>


                        <button
                            class="btn reject"
                            data-action="reject"
                            data-id="${escapeHtml(rider.id)}">

                            ✕ Reject

                        </button>

                    </div>

                `;


                list.appendChild(row);

            }
        );


    }catch(error){

        console.error(
            "Load riders error:",
            error
        );


        list.innerHTML = `
            <div class="empty">
                Failed to load rider requests.
                <br><br>
                Check Firebase Firestore connection and rules.
            </div>
        `;

        showStatus(
            "Firebase se rider requests load nahi ho paayi.",
            "error"
        );

    }

}


/* =========================
   FIND RIDER
========================= */

function findRiderById(id){

    return allRiders.find(
        rider =>
            String(rider.id) ===
            String(id)
    );

}


/* =========================
   VIEW DETAILS
========================= */

function showDetails(rider){

    if(!rider){
        return;
    }


    const ignored = [
        "source"
    ];


    details.innerHTML = "";


    const entries =
        Object.entries(rider)
        .filter(
            ([key]) =>
                !ignored.includes(key)
        );


    entries.forEach(
        ([key,value]) => {

            let displayValue;


            if(
                value &&
                typeof value === "object"
            ){

                try{

                    displayValue =
                        JSON.stringify(
                            value,
                            null,
                            2
                        );

                }catch{

                    displayValue =
                        String(value);

                }

            }else{

                displayValue =
                    String(
                        value ?? ""
                    );

            }


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "detail";


            item.innerHTML = `

                <div class="detail-label">
                    ${escapeHtml(key)}
                </div>

                <div class="detail-value">
                    ${escapeHtml(displayValue)}
                </div>

            `;


            details.appendChild(item);

        }
    );


    detailsModal.classList.add(
        "show"
    );

}


/* =========================
   UPDATE RIDER
========================= */

async function updateRiderStatus(
    rider,
    action
){

    if(!rider){
        throw new Error(
            "Rider not found"
        );
    }


    const approved =
        action === "approve";


    const payload =
        approved
        ?

        {

            role:"rider",

            status:"approved",

            approvalStatus:"approved",

            riderStatus:"approved",

            verificationStatus:"approved",

            approved:true,

            isApproved:true,

            online:false,

            isOnline:false,

            canGoOnline:true,

            accountStatus:"active",

            approvedAt:
                serverTimestamp(),

            rejectedAt:null

        }

        :

        {

            role:"rider",

            status:"rejected",

            approvalStatus:"rejected",

            riderStatus:"rejected",

            verificationStatus:"rejected",

            approved:false,

            isApproved:false,

            online:false,

            isOnline:false,

            canGoOnline:false,

            accountStatus:"rejected",

            rejectedAt:
                serverTimestamp()

        };


    /*
     * Rider document IDs
     */

    const possibleIds =
        getPossibleUserIds(
            rider
        );


    let updatedCount = 0;


    /*
     * 1. riders collection
     */

    for(
        const id of possibleIds
    ){

        try{

            const riderRef =
                doc(
                    db,
                    "riders",
                    id
                );


            const riderSnap =
                await getDoc(
                    riderRef
                );


            if(
                riderSnap.exists()
            ){

                await updateDoc(
                    riderRef,
                    payload
                );


                updatedCount++;

                break;

            }

        }catch(error){

            console.warn(
                "Rider update failed:",
                error
            );

        }

    }


    /*
     * 2. users collection
     */

    /*
     * Pehle known IDs try
     */

    for(
        const id of possibleIds
    ){

        try{

            const userRef =
                doc(
                    db,
                    "users",
                    id
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(
                userSnap.exists()
            ){

                const userData =
                    userSnap.data();


                /*
                 * Agar rider account hai
                 * tab update karein
                 */

                if(
                    roleOf(userData) === "rider" ||
                    id === rider.id
                ){

                    await updateDoc(
                        userRef,
                        payload
                    );


                    updatedCount++;

                    break;

                }

            }

        }catch(error){

            console.warn(
                "User update failed:",
                error
            );

        }

    }


    /*
     * Agar riders document ID alag hai,
     * users me matching UID/email se search
     */

    if(
        updatedCount === 0 ||
        (
            rider.source === "riders"
        )
    ){

        try{

            const users =
                await getCollection(
                    "users"
                );


            const matchingUsers =
                users.filter(
                    user => {

                        if(
                            roleOf(user) !==
                            "rider"
                        ){

                            return false;

                        }


                        const riderUid =
                            rider.uid ||
                            rider.userId ||
                            rider.userUID;


                        if(
                            riderUid &&
                            (
                                user.id ===
                                riderUid
                            )
                        ){

                            return true;

                        }


                        if(
                            rider.email &&
                            user.email &&
                            String(
                                rider.email
                            ).toLowerCase() ===
                            String(
                                user.email
                            ).toLowerCase()
                        ){

                            return true;

                        }


                        const riderPhone =
                            rider.phone ||
                            rider.mobile ||
                            rider.phoneNumber;


                        const userPhone =
                            user.phone ||
                            user.mobile ||
                            user.phoneNumber;


                        if(
                            riderPhone &&
                            userPhone &&
                            String(
                                riderPhone
                            ) ===
                            String(
                                userPhone
                            )
                        ){

                            return true;

                        }


                        return false;

                    }
                );


            for(
                const user of matchingUsers
            ){

                try{

                    await updateDoc(
                        doc(
                            db,
                            "users",
                            user.id
                        ),
                        payload
                    );


                    updatedCount++;

                }catch(error){

                    console.warn(
                        "Matching user update failed:",
                        error
                    );

                }

            }

        }catch(error){

            console.warn(
                "User matching failed:",
                error
            );

        }

    }


    if(
        updatedCount === 0
    ){

        throw new Error(
            "Rider document not found or Firestore permission denied."
        );

    }

}


/* =========================
   BUTTON ACTIONS
========================= */

list.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                "button[data-action]"
            );


        if(!button){
            return;
        }


        const action =
            button.dataset.action;


        const id =
            button.dataset.id;


        const rider =
            findRiderById(id);


        if(!rider){

            alert(
                "Rider request nahi mili. Refresh karke dobara try karein."
            );

            return;

        }


        /*
         * VIEW
         */

        if(
            action === "view"
        ){

            showDetails(
                rider
            );

            return;

        }


        /*
         * APPROVE / REJECT
         */

        const name =
            rider.name ||
            rider.fullName ||
            rider.displayName ||
            "this rider";


        const message =
            action === "approve"

            ?

            `Kya aap ${name} ko APPROVE karna chahte hain?`

            :

            `Kya aap ${name} ko REJECT karna chahte hain?`;


        if(
            !confirm(message)
        ){

            return;

        }


        /*
         * Disable all action buttons
         */

        const row =
            button.closest(
                ".row"
            );


        const buttons =
            row.querySelectorAll(
                "button"
            );


        buttons.forEach(
            btn => {

                btn.disabled =
                    true;

            }
        );


        const oldText =
            button.textContent;


        button.textContent =
            action === "approve"
            ? "Approving..."
            : "Rejecting...";


        try{

            await updateRiderStatus(
                rider,
                action
            );


            showStatus(
                action === "approve"

                ?

                "Rider successfully approved. Ab rider account active hai aur rider app approval detect kar sakti hai."

                :

                "Rider registration rejected.",

                "success"
            );


            await loadRiderRequests();


        }catch(error){

            console.error(
                "Approval action error:",
                error
            );


            showStatus(
                "Action failed. Firestore Rules ya rider/user document permissions check karein.",
                "error"
            );


            buttons.forEach(
                btn => {

                    btn.disabled =
                        false;

                }
            );


            button.textContent =
                oldText;

        }

    }
);


/* =========================
   REFRESH
========================= */

refreshBtn.addEventListener(
    "click",
    async () => {

        hideStatus();

        await loadRiderRequests();

    }
);


/* =========================
   MODAL
========================= */

closeModal.addEventListener(
    "click",
    () => {

        detailsModal.classList.remove(
            "show"
        );

    }
);


detailsModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            detailsModal
        ){

            detailsModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================
   ADMIN AUTH
========================= */

let authFinished =
    false;


onAuthStateChanged(
    auth,
    async user => {

        if(
            authFinished
        ){

            return;

        }


        if(
            !user
        ){

            authFinished =
                true;

            location.replace(
                "login.html"
            );

            return;

        }


        try{

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(
                !userSnap.exists()
            ){

                authFinished =
                    true;

                showStatus(
                    "Admin profile nahi mila.",
                    "error"
                );

                setTimeout(
                    () => {

                        location.replace(
                            "login.html"
                        );

                    },
                    1000
                );

                return;

            }


            const adminData =
                userSnap.data();


            if(
                !isAdmin(
                    adminData
                )
            ){

                authFinished =
                    true;

                showStatus(
                    "Access denied. Ye account admin nahi hai.",
                    "error"
                );

                setTimeout(
                    () => {

                        location.replace(
                            "login.html"
                        );

                    },
                    1000
                );

                return;

            }


            authFinished =
                true;


            await loadRiderRequests();


        }catch(error){

            console.error(
                "Admin authentication error:",
                error
            );


            authFinished =
                true;


            showStatus(
                "Firebase admin verification failed. firebase-config.js aur Firestore Rules check karein.",
                "error"
            );

        }

    }
);

</script>
