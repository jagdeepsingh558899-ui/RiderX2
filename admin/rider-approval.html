<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin - Rider Approval</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

:root{
    --yellow:#FFD400;
    --bg:#080808;
    --card:#151515;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#60a5fa;
    --orange:#f59e0b;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
    background:var(--bg);
}

body{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    background:var(--bg);
}


/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:50;

    display:flex;
    align-items:center;
    gap:10px;

    padding:12px;

    background:#0c0c0c;
    border-bottom:1px solid #292929;
}

.back-btn{
    width:40px;
    height:40px;

    border:1px solid #363636;
    border-radius:11px;

    background:#1b1b1b;
    color:#fff;

    font-size:20px;
}

.logo{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:var(--yellow);
    color:#000;

    font-size:9px;
    font-weight:900;
}

.header-info{
    flex:1;
    min-width:0;
}

.header-title{
    font-size:10px;
    font-weight:900;
}

.header-subtitle{
    margin-top:3px;
    color:#777;
    font-size:5px;
}


/* MAIN */

.main{
    width:100%;
    max-width:1200px;

    margin:auto;

    padding:15px;
}


/* PAGE TOP */

.page-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    margin-bottom:13px;
}

.page-title{
    font-size:14px;
    font-weight:900;
}

.page-description{
    margin-top:4px;
    color:#777;
    font-size:6px;
}

.refresh-btn{
    height:38px;

    padding:0 13px;

    border:1px solid #5b4f00;
    border-radius:10px;

    background:#1d1a00;
    color:var(--yellow);

    font-size:6px;
    font-weight:900;
}


/* STATS */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:9px;

    margin-bottom:12px;
}

.stat{
    padding:13px;

    border:1px solid var(--border);
    border-radius:14px;

    background:var(--card);
}

.stat-label{
    color:#777;
    font-size:5px;
    font-weight:700;
}

.stat-value{
    margin-top:6px;
    font-size:16px;
    font-weight:900;
}

.yellow{
    color:var(--yellow);
}

.green{
    color:var(--green);
}

.red{
    color:#ff7070;
}

.blue{
    color:var(--blue);
}


/* APPLICATION GRID */

.application-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:12px;
}


/* APPLICATION CARD */

.application{
    overflow:hidden;

    border:1px solid var(--border);
    border-radius:16px;

    background:var(--card);
}

.application-header{
    display:flex;
    align-items:center;
    gap:10px;

    padding:13px;

    border-bottom:1px solid #292929;
}

.avatar{
    width:42px;
    height:42px;
    min-width:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#262626;
    color:var(--yellow);

    font-size:11px;
    font-weight:900;
}

.applicant-info{
    flex:1;
    min-width:0;
}

.applicant-name{
    overflow:hidden;

    font-size:8px;
    font-weight:900;

    text-overflow:ellipsis;
    white-space:nowrap;
}

.applicant-phone{
    margin-top:4px;
    color:#666;
    font-size:5px;
}

.pending-badge{
    padding:5px 7px;

    border-radius:20px;

    background:#292500;
    color:var(--yellow);

    font-size:4.5px;
    font-weight:900;
}


/* BODY */

.application-body{
    padding:13px;
}

.details{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:8px;
}

.detail{
    padding:9px;

    border:1px solid #2e2e2e;
    border-radius:10px;

    background:#1c1c1c;
}

.detail-label{
    color:#666;
    font-size:4.5px;
    font-weight:800;
}

.detail-value{
    margin-top:4px;

    overflow:hidden;

    color:#fff;

    font-size:6px;
    font-weight:800;

    text-overflow:ellipsis;
    white-space:nowrap;
}


/* DOCUMENTS */

.documents{
    margin-top:11px;
}

.documents-title{
    margin-bottom:7px;

    color:#777;

    font-size:5px;
    font-weight:800;
}

.document-grid{
    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:6px;
}

.document{
    min-height:54px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    border:1px solid #333;
    border-radius:9px;

    background:#202020;

    color:#aaa;

    font-size:5px;
}

.document span{
    font-size:13px;
}


/* ACTIONS */

.actions{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:7px;

    margin-top:12px;
}

.action-btn{
    height:38px;

    border-radius:9px;

    font-size:5.5px;
    font-weight:900;
}

.approve{
    border:1px solid #17672f;
    background:#102517;
    color:var(--green);
}

.reject{
    border:1px solid #612020;
    background:#291414;
    color:#ff7070;
}

.view{
    grid-column:1 / -1;

    border:1px solid #373737;
    background:#202020;
    color:#fff;
}


/* EMPTY */

.empty{
    padding:50px 15px;

    border:1px solid var(--border);
    border-radius:16px;

    background:var(--card);

    color:#666;

    text-align:center;

    font-size:6px;
}


/* MODAL */

.modal{
    position:fixed;
    inset:0;

    z-index:100;

    display:none;
    align-items:center;
    justify-content:center;

    padding:15px;

    background:rgba(0,0,0,.8);
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:470px;

    padding:18px;

    border:1px solid #393939;
    border-radius:17px;

    background:#171717;
}

.modal-icon{
    width:45px;
    height:45px;

    margin-bottom:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#292500;
    color:var(--yellow);

    font-size:18px;
}

.modal-title{
    font-size:10px;
    font-weight:900;
}

.modal-text{
    margin-top:7px;

    color:#777;

    font-size:6px;
    line-height:1.6;
}

.modal-actions{
    display:flex;
    gap:8px;

    margin-top:15px;
}

.modal-btn{
    flex:1;
    height:40px;

    border-radius:10px;

    font-size:6px;
    font-weight:900;
}

.cancel-btn{
    border:1px solid #383838;
    background:#222;
    color:#fff;
}

.confirm-btn{
    border:1px solid #5d5100;
    background:var(--yellow);
    color:#000;
}

.confirm-btn.danger{
    border-color:#6b2525;
    background:#c93636;
    color:#fff;
}


/* TOAST */

.toast{
    position:fixed;

    left:50%;
    bottom:20px;

    z-index:150;

    width:calc(100% - 30px);
    max-width:450px;

    padding:11px;

    border:1px solid #373737;
    border-radius:11px;

    background:#222;
    color:#fff;

    text-align:center;

    font-size:6px;

    opacity:0;
    pointer-events:none;

    transform:translate(-50%,20px);

    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* RESPONSIVE */

@media(max-width:800px){

    .application-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

@media(max-width:520px){

    .main{
        padding:11px;
    }

    .page-top{
        align-items:flex-start;
    }

    .details{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

</style>

</head>


<body>

<div class="app">


<header class="header">

    <button
        class="back-btn"
        onclick="goBack()"
        aria-label="Back"
    >
        ‹
    </button>

    <div class="logo">
        RX
    </div>

    <div class="header-info">

        <div class="header-title">
            Rider Approval
        </div>

        <div class="header-subtitle">
            Review and approve rider applications
        </div>

    </div>

</header>


<main class="main">


<section class="page-top">

    <div>

        <div class="page-title">
            Rider Applications
        </div>

        <div class="page-description">
            Verify rider information and approve or reject applications.
        </div>

    </div>

    <button
        class="refresh-btn"
        onclick="loadApplications()"
    >
        ↻ REFRESH
    </button>

</section>


<section class="stats">

    <div class="stat">

        <div class="stat-label">
            PENDING
        </div>

        <div
            class="stat-value yellow"
            id="pendingCount"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            APPROVED
        </div>

        <div
            class="stat-value green"
            id="approvedCount"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            REJECTED
        </div>

        <div
            class="stat-value red"
            id="rejectedCount"
        >
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            TOTAL APPLICATIONS
        </div>

        <div
            class="stat-value blue"
            id="totalCount"
        >
            0
        </div>

    </div>

</section>


<div
    class="application-grid"
    id="applicationGrid"
>

    <div class="empty">
        Loading applications...
    </div>

</div>


</main>

</div>


<!-- CONFIRM MODAL -->

<div
    class="modal"
    id="confirmModal"
>

    <div class="modal-card">

        <div class="modal-icon">
            ⚠
        </div>

        <div
            class="modal-title"
            id="confirmTitle"
        >
            Confirm action
        </div>

        <div
            class="modal-text"
            id="confirmText"
        >
            Are you sure?
        </div>

        <div class="modal-actions">

            <button
                class="modal-btn cancel-btn"
                onclick="closeConfirm()"
            >
                CANCEL
            </button>

            <button
                class="modal-btn confirm-btn"
                id="confirmButton"
                onclick="executeConfirm()"
            >
                CONFIRM
            </button>

        </div>

    </div>

</div>


<!-- VIEW MODAL -->

<div
    class="modal"
    id="viewModal"
>

    <div class="modal-card">

        <div class="modal-icon">
            🛵
        </div>

        <div
            class="modal-title"
            id="viewTitle"
        >
            Rider Details
        </div>

        <div
            class="modal-text"
            id="viewText"
        >
            Rider information
        </div>

        <div class="modal-actions">

            <button
                class="modal-btn cancel-btn"
                onclick="closeView()"
            >
                CLOSE
            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

const STORAGE_KEY =
    "riderxAdminRiderApplications";

let applications = [];

let confirmAction = null;

let toastTimer;


/* =========================================
   LOAD
========================================= */

function loadApplications(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(raw){

            const data =
                JSON.parse(
                    raw
                );


            if(
                Array.isArray(data)
            ){

                applications =
                    data;

            }

        }

    }catch(error){

        console.log(
            "Approval data error:",
            error
        );

    }


    if(
        !Array.isArray(
            applications
        )
    ){

        applications = [];

    }


    render();

}


/* =========================================
   SAVE
========================================= */

function saveApplications(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                applications
            )
        );

    }catch(error){

        console.log(error);

    }

}


/* =========================================
   RENDER
========================================= */

function render(){

    renderStats();

    renderApplications();

}


/* =========================================
   STATS
========================================= */

function renderStats(){

    const pending =
        applications.filter(
            function(item){

                return getStatus(
                    item
                ) ===
                "pending";

            }
        ).length;


    const approved =
        applications.filter(
            function(item){

                return getStatus(
                    item
                ) ===
                "approved";

            }
        ).length;


    const rejected =
        applications.filter(
            function(item){

                return getStatus(
                    item
                ) ===
                "rejected";

            }
        ).length;


    setText(
        "pendingCount",
        pending
    );

    setText(
        "approvedCount",
        approved
    );

    setText(
        "rejectedCount",
        rejected
    );

    setText(
        "totalCount",
        applications.length
    );

}


/* =========================================
   APPLICATIONS
========================================= */

function renderApplications(){

    const grid =
        document.getElementById(
            "applicationGrid"
        );


    if(!grid){
        return;
    }


    grid.innerHTML = "";


    if(
        !applications.length
    ){

        grid.innerHTML = `

            <div class="empty">

                <div
                    style="
                    font-size:25px;
                    margin-bottom:10px;
                    "
                >
                    ✓
                </div>

                No rider applications available.

            </div>

        `;

        return;

    }


    const pending =
        applications.filter(
            function(item){

                return getStatus(
                    item
                ) ===
                "pending";

            }
        );


    const list =
        pending.length
            ? pending
            : applications;


    list.forEach(
        function(application){

            grid.appendChild(
                createApplication(
                    application
                )
            );

        }
    );

}


/* =========================================
   CREATE CARD
========================================= */

function createApplication(
    application
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "application";


    const name =
        application.name ||
        application.displayName ||
        "Rider";


    const phone =
        application.phone ||
        application.mobile ||
        "—";


    const vehicle =
        application.vehicleNumber ||
        application.vehicleNo ||
        application.vehicle ||
        "—";


    const type =
        application.vehicleType ||
        application.service ||
        "Bike";


    const city =
        application.city ||
        "Chandigarh";


    const license =
        application.licenseNumber ||
        application.license ||
        "Not provided";


    const status =
        getStatus(
            application
        );


    const initial =
        String(
            name
        )
        .charAt(0)
        .toUpperCase();


    card.innerHTML = `

        <div class="application-header">

            <div class="avatar">
                ${escapeHtml(initial)}
            </div>

            <div class="applicant-info">

                <div class="applicant-name">
                    ${escapeHtml(name)}
                </div>

                <div class="applicant-phone">
                    ${escapeHtml(phone)}
                </div>

            </div>

            <div class="pending-badge">
                ${escapeHtml(
                    capitalize(status)
                )}
            </div>

        </div>


        <div class="application-body">

            <div class="details">

                <div class="detail">

                    <div class="detail-label">
                        VEHICLE
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(type)}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        VEHICLE NUMBER
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(vehicle)}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        CITY
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(city)}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        LICENSE
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(license)}
                    </div>

                </div>

            </div>


            <div class="documents">

                <div class="documents-title">
                    DOCUMENTS
                </div>

                <div class="document-grid">

                    <div class="document">
                        <span>🪪</span>
                        License
                    </div>

                    <div class="document">
                        <span>📄</span>
                        RC
                    </div>

                    <div class="document">
                        <span>📷</span>
                        Photo
                    </div>

                </div>

            </div>


            <div class="actions">

                ${
                    status === "pending"
                    ? `

                        <button
                            class="action-btn approve"
                            onclick="approveRider('${escapeJs(
                                application.id || ""
                            )}')"
                        >
                            ✓ APPROVE
                        </button>

                        <button
                            class="action-btn reject"
                            onclick="rejectRider('${escapeJs(
                                application.id || ""
                            )}')"
                        >
                            ✕ REJECT
                        </button>

                    `
                    : `
                        <button
                            class="action-btn view"
                            onclick="viewApplication('${escapeJs(
                                application.id || ""
                            )}')"
                        >
                            👁 VIEW DETAILS
                        </button>
                    `
                }


                ${
                    status === "pending"
                    ? `
                        <button
                            class="action-btn view"
                            onclick="viewApplication('${escapeJs(
                                application.id || ""
                            )}')"
                        >
                            👁 VIEW DETAILS
                        </button>
                    `
                    : ""
                }

            </div>

        </div>

    `;


    return card;

}


/* =========================================
   STATUS
========================================= */

function getStatus(
    application
){

    return String(
        application.status ||
        "pending"
    )
    .toLowerCase();

}


/* =========================================
   APPROVE
========================================= */

function approveRider(
    id
){

    const application =
        findApplication(
            id
        );


    if(!application){

        showToast(
            "Application not found."
        );

        return;

    }


    openConfirm(
        "Approve rider",
        "This rider will be approved and can continue with the RiderX rider flow.",
        function(){

            application.status =
                "approved";

            application.approvedAt =
                new Date().toISOString();


            saveApplications();

            render();


            showToast(
                "Rider approved successfully."
            );

        }
    );

}


/* =========================================
   REJECT
========================================= */

function rejectRider(
    id
){

    const application =
        findApplication(
            id
        );


    if(!application){

        showToast(
            "Application not found."
        );

        return;

    }


    openConfirm(
        "Reject rider",
        "This rider application will be marked as rejected.",
        function(){

            application.status =
                "rejected";

            application.rejectedAt =
                new Date().toISOString();


            saveApplications();

            render();


            showToast(
                "Rider application rejected."
            );

        }
    );


    const button =
        document.getElementById(
            "confirmButton"
        );


    if(button){

        button.classList.add(
            "danger"
        );

    }

}


/* =========================================
   VIEW
========================================= */

function viewApplication(
    id
){

    const application =
        findApplication(
            id
        );


    if(!application){

        showToast(
            "Application not found."
        );

        return;

    }


    const name =
        application.name ||
        application.displayName ||
        "Rider";


    const email =
        application.email ||
        "—";


    const phone =
        application.phone ||
        application.mobile ||
        "—";


    const vehicle =
        application.vehicleNumber ||
        application.vehicleNo ||
        "—";


    const license =
        application.licenseNumber ||
        application.license ||
        "—";


    const city =
        application.city ||
        "Chandigarh";


    const status =
        getStatus(
            application
        );


    document.getElementById(
        "viewTitle"
    ).textContent =
        name;


    document.getElementById(
        "viewText"
    ).innerHTML = `

        <strong>Phone:</strong>
        ${escapeHtml(phone)}
        <br><br>

        <strong>Email:</strong>
        ${escapeHtml(email)}
        <br><br>

        <strong>City:</strong>
        ${escapeHtml(city)}
        <br><br>

        <strong>Vehicle:</strong>
        ${escapeHtml(vehicle)}
        <br><br>

        <strong>License:</strong>
        ${escapeHtml(license)}
        <br><br>

        <strong>Status:</strong>
        ${escapeHtml(
            capitalize(status)
        )}

    `;


    document.getElementById(
        "viewModal"
    ).classList.add(
        "show"
    );

}


function closeView(){

    document.getElementById(
        "viewModal"
    ).classList.remove(
        "show"
    );

}


/* =========================================
   FIND
========================================= */

function findApplication(
    id
){

    return applications.find(
        function(item){

            return String(
                item.id || ""
            ) ===
            String(id);

        }
    );

}


/* =========================================
   CONFIRM
========================================= */

function openConfirm(
    title,
    text,
    action
){

    const button =
        document.getElementById(
            "confirmButton"
        );


    if(button){

        button.classList.remove(
            "danger"
        );

    }


    document.getElementById(
        "confirmTitle"
    ).textContent =
        title;


    document.getElementById(
        "confirmText"
    ).textContent =
        text;


    confirmAction =
        action;


    document.getElementById(
        "confirmModal"
    ).classList.add(
        "show"
    );

}


function closeConfirm(){

    document.getElementById(
        "confirmModal"
    ).classList.remove(
        "show"
    );

    confirmAction =
        null;

}


function executeConfirm(){

    const action =
        confirmAction;

    closeConfirm();


    if(
        typeof action ===
        "function"
    ){

        action();

    }

}


/* =========================================
   NAVIGATION
========================================= */

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ){

        history.back();

    }
    else{

        window.location.href =
            "riders.html";

    }

}


/* =========================================
   UTILITIES
========================================= */

function setText(
    id,
    value
){

    const element =
        document.getElementById(
            id
        );

    if(element){

        element.textContent =
            value;

    }

}


function capitalize(
    value
){

    const text =
        String(
            value ||
            ""
        );

    return text.charAt(0).toUpperCase() +
        text.slice(1);

}


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJs(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* =========================================
   MODAL EVENTS
========================================= */

document.getElementById(
    "confirmModal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closeConfirm();

        }

    }
);


document.getElementById(
    "viewModal"
).addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closeView();

        }

    }
);


/* =========================================
   TOAST
========================================= */

function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){
        return;
    }


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================
   INIT
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadApplications();

    }
);

</script>
