>

<link

>

<link

>

<link
    rel="stylesheet"
    href="../css/responsive.css"

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.page{
    min-height:100vh;
    padding-bottom:70px;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;

    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;

    background:#111;
    border-bottom:1px solid #292929;
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.back-btn{
    width:40px;
    height:40px;

    border:1px solid #333;
    border-radius:10px;

    background:#1b1b1b;
    color:#fff;

    cursor:pointer;
    font-size:20px;
}

.title{
    font-size:17px;
    font-weight:900;
}

.title span{
    color:#FFD400;
}

.logo{
    color:#FFD400;
    font-size:18px;
    font-weight:1000;
}

.content{
    width:100%;
    max-width:1100px;

    margin:auto;
    padding:18px;
}

.hero{
    padding:18px;
    margin-bottom:16px;

    border:1px solid #292929;
    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #181818,
            #101010
        );
}

.hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.hero h1{
    margin:0;
    font-size:23px;
}

.hero p{
    margin:7px 0 0;

    color:#888;

    font-size:12px;
    line-height:1.5;
}

.unread{
    min-width:45px;

    padding:8px 10px;

    border-radius:10px;

    background:#FFD400;
    color:#111;

    text-align:center;

    font-size:14px;
    font-weight:1000;
}

.toolbar{
    display:flex;
    align-items:center;

    gap:10px;

    margin-bottom:15px;

    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:220px;

    height:44px;

    padding:0 13px;

    border:1px solid #333;
    border-radius:10px;

    outline:none;

    background:#171717;
    color:#fff;
}

.search:focus{
    border-color:#FFD400;
}

.filter{
    height:44px;

    padding:0 12px;

    border:1px solid #333;
    border-radius:10px;

    background:#171717;
    color:#fff;

    outline:none;
}

.btn{
    height:44px;

    padding:0 14px;

    border:1px solid #333;
    border-radius:10px;

    background:#1b1b1b;
    color:#fff;

    cursor:pointer;

    font-weight:800;
}

.btn.primary{
    border-color:#FFD400;
    background:#FFD400;
    color:#111;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.notification-list{
    display:flex;
    flex-direction:column;

    gap:10px;
}

.notification{
    display:flex;
    align-items:flex-start;

    gap:13px;

    padding:15px;

    border:1px solid #292929;
    border-radius:14px;

    background:#141414;

    transition:.18s;
}

.notification.unread-item{
    border-color:#4c4308;
    background:#171707;
}

.notification:hover{
    border-color:#444;
}

.notification-icon{
    width:43px;
    height:43px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#242424;

    font-size:19px;
}

.notification.unread-item .notification-icon{
    background:#FFD400;
    color:#111;
}

.notification-body{
    flex:1;
    min-width:0;
}

.notification-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.notification-title{
    font-size:13px;
    font-weight:900;
}

.notification-time{
    color:#666;
    font-size:9px;

    white-space:nowrap;
}

.notification-message{
    margin-top:6px;

    color:#888;

    font-size:11px;
    line-height:1.5;
}

.notification-meta{

    align-items:center;

    gap:7px;

    margin-top:9px;

    flex-wrap:wrap;
}

.tag{
    padding:4px 7px;

    background:#242424;
    color:#aaa;

    font-size:8px;
    font-weight:900;

    text-transform:uppercase;
}

.target-tag{

}

.dot{

    height:7px;

    border-radius:50%;

    background:#FFD400;
}

.notification-actions{
    display:flex;
    gap:6px;

    margin-top:9px;
}

.small-btn{
    height:30px;

    padding:0 9px;

    border:1px solid #333;
    border-radius:7px;

    background:#1c1c1c;
    color:#aaa;

    cursor:pointer;

    font-size:9px;
    font-weight:800;
}

.small-btn:hover{
    color:#FFD400;
    border-color:#5b5000;
}

.empty{
    display:none;

    padding:45px 20px;

    border:1px dashed #333;
    border-radius:15px;

    color:#777;
}

.empty-icon{
    font-size:32px;
    margin-bottom:10px;
}

.empty strong{
    display:block;

    color:#aaa;

    font-size:14px;
}

.empty p{
    margin:6px 0 0;

    font-size:11px;
}

.modal{
    position:fixed;
    inset:0;

    z-index:999;

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;

}

.modal.show{

}

.modal-card{

    border-radius:18px;

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    font-size:18px;

.field label{

    color:#999;

    font-weight:900;

    text-transform:uppercase;
}

.field input,
.field textarea,
.field select{

    border:1px solid #333;
    border-radius:9px;

    background:#1b1b1b;
    color:#fff;

    padding:11px;

    font-size:12px;
}

.field input{
    height:43px;
}

.field textarea{
    min-height:105px;

.field input:focus,

.target-info{

    border-radius:9px;

    color:#aaa;

}

.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:8px;

    margin-top:16px;
}

.toast{

    color:#65e58b;

    font-weight:800;

    opacity:0;

    transition:.25s;
}

        <option value="payment">

        </option>

<script type="module">

"use strict";


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db,
    onAuthStateChanged,
    collection,
    query,
    where,
    getDocs,
    getDoc,
    addDoc,
    doc,
    deleteDoc,
    writeBatch,
    serverTimestamp
} from "../firebase/firebase-config.js";


/* =========================================================
   CONSTANTS
========================================================= */

const LOCAL_KEY =
    "riderx_admin_notifications";

const MAX_BATCH_OPERATIONS =
    450;


/* =========================================================
   ELEMENTS
========================================================= */

const list =
    document.getElementById(
        "notificationList"
    );

const empty =
    document.getElementById(
        "emptyState"
    );

const unreadCount =
    document.getElementById(
        "unreadCount"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const filterSelect =
    document.getElementById(
        "filterSelect"
    );

const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );

const createBtn =
    document.getElementById(
        "createBtn"
    );

const createModal =
    document.getElementById(
        "createModal"
    );

const closeModal =
    document.getElementById(
        "closeModal"
    );

const cancelModal =
    document.getElementById(
        "cancelModal"
    );

const notificationForm =
    document.getElementById(
        "notificationForm"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const targetInfo =
    document.getElementById(
        "targetInfo"
    );

const sendStatus =
    document.getElementById(
        "sendStatus"
    );

const toast =
    document.getElementById(
        "toast"
    );

const backBtn =
    document.getElementById(
        "backBtn"
    );


/* =========================================================
   STATE
========================================================= */

let currentAdmin =
    null;

let notifications =
    [];

let adminHistory =
    [];

let adminReady =
    false;

let toastTimer =
    null;


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        bindEvents();

        loadLocalHistory();

        render();

        watchAdmin();

    }
);


/* =========================================================
   EVENTS
========================================================= */

function bindEvents(){

    searchInput.addEventListener(
        "input",
        render
    );


    filterSelect.addEventListener(
        "change",
        render
    );


    refreshBtn.addEventListener(
        "click",
        function(){

            loadFirebaseHistory();

        }
    );


    createBtn.addEventListener(
        "click",
        openModal
    );


    closeModal.addEventListener(
        "click",
        closeCreateModal
    );


    cancelModal.addEventListener(
        "click",
        closeCreateModal
    );


    backBtn.addEventListener(
        "click",
        goBack
    );


    createModal.addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                createModal
            ){

                closeCreateModal();

            }

        }
    );


    notificationForm.addEventListener(
        "submit",
        sendNotification
    );


    document
        .getElementById("newTarget")
        .addEventListener(
            "change",
            updateTargetInfo
        );


    document.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Escape" &&
                createModal.classList.contains("show")
            ){

                closeCreateModal();

            }

        }
    );

}


/* =========================================================
   ADMIN AUTHORIZATION
========================================================= */

function watchAdmin(){

    onAuthStateChanged(
        auth,
        async function(user){

            currentAdmin =
                user || null;


            if(!user){

                adminReady =
                    false;

                createBtn.disabled =
                    true;

                showToast(
                    "Admin login required.",
                    true
                );

                return;

            }


            try{

                /*
                 * Canonical RiderX user profile:
                 *
                 * users/{uid}
                 *
                 * This is more efficient than querying
                 * __name__ with getDocs().
                 */

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userSnapshot =
                    await getDoc(
                        userRef
                    );


                let role =
                    "";


                if(
                    userSnapshot.exists()
                ){

                    const data =
                        userSnapshot.data() ||
                        {};


                    role =
                        String(
                            data.role ||
                            data.userRole ||
                            data.accountType ||
                            ""
                        )
                        .trim()
                        .toLowerCase();

                }


                /*
                 * If a profile explicitly identifies
                 * a non-admin user, deny notification sending.
                 */

                if(
                    role &&
                    role !== "admin" &&
                    role !== "superadmin"
                ){

                    adminReady =
                        false;

                    createBtn.disabled =
                        true;

                    showToast(
                        "Admin permission required.",
                        true
                    );

                    return;

                }


                /*
                 * If the profile does not contain a role,
                 * existing application-level admin protection
                 * may still be responsible for this page.
                 *
                 * Firebase Security Rules remain authoritative.
                 */

                adminReady =
                    true;

                createBtn.disabled =
                    false;

                await loadFirebaseHistory();

            }catch(error){

                console.error(
                    "RiderX admin authorization check:",
                    error
                );


                /*
                 * Do not automatically turn an unknown
                 * authorization error into admin access.
                 *
                 * The page stays read-only until the
                 * authorization state is known.
                 */

                adminReady =
                    false;

                createBtn.disabled =
                    true;

                showToast(
                    "Unable to verify admin permission.",
                    true
                );

            }

        }
    );

}


/* =========================================================
   LOCAL HISTORY
========================================================= */

function loadLocalHistory(){

    try{

        const raw =
            localStorage.getItem(
                LOCAL_KEY
            );


        if(!raw){

            notifications =
                [];

            return;

        }


        const parsed =
            JSON.parse(
                raw
            );


        notifications =
            Array.isArray(parsed)
                ? parsed
                : [];

    }catch(error){

        console.warn(
            "RiderX local notification history:",
            error
        );

        notifications =
            [];

    }

}


/* =========================================================
   SAVE LOCAL HISTORY
========================================================= */

function saveLocalHistory(){

    try{

        localStorage.setItem(
            LOCAL_KEY,
            JSON.stringify(
                notifications
            )
        );

    }catch(error){

        console.warn(
            "RiderX unable to save local history:",
            error
        );

    }

}


/* =========================================================
   FIREBASE ADMIN HISTORY
========================================================= */

async function loadFirebaseHistory(){

    if(
        !currentAdmin ||
        !currentAdmin.uid
    ){

        return;

    }


    try{

        /*
         * Only documents created by this admin are read.
         *
         * Recipient notifications contain userId/recipientId,
         * therefore they are collapsed into broadcast summaries
         * below instead of being displayed one-by-one.
         */

        const snapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "notifications"
                    ),
                    where(
                        "senderId",
                        "==",
                        currentAdmin.uid
                    )
                )
            );


        const recipientDocs =
            snapshot.docs
                .map(
                    function(item){

                        return {
                            id:item.id,
                            ...(
                                item.data() || {}
                            ),
                            source:"firebase"
                        };

                    }
                )
                .filter(
                    function(item){

                        return Boolean(
                            item.userId ||
                            item.recipientId
                        );

                    }
                );


        adminHistory =
            buildBroadcastHistory(
                recipientDocs
            );


        mergeAndRender();

    }catch(error){

        console.warn(
            "Firebase notification history:",
            error
        );

        adminHistory =
            [];

        mergeAndRender();

    }

}


/* =========================================================
   BUILD BROADCAST HISTORY
   ---------------------------------------------------------
   One admin broadcast can create many recipient documents.
   We group those documents so the admin does not see
   hundreds of duplicate cards.
========================================================= */

function buildBroadcastHistory(
    items
){

    const groups =
        new Map();


    items.forEach(
        function(item){

            const title =
                String(
                    item.title ||
                    ""
                );

            const message =
                String(
                    item.message ||
                    ""
                );

            const category =
                String(
                    item.category ||
                    "system"
                );

            const target =
                String(
                    item.target ||
                    "all"
                );

            const timestamp =
                getTime(
                    item.createdAt ||
                    item.sentAt
                );


            /*
             * Timestamps from serverTimestamp may not
             * be resolved immediately. Use content + target
             * as fallback grouping data.
             */

            const timeBucket =
                timestamp
                    ? Math.floor(
                        timestamp /
                        5000
                    )
                    : "unknown";


            const key =
                [
                    title,
                    message,
                    category,
                    target,
                    timeBucket
                ]
                .join("|");


            if(
                !groups.has(key)
            ){

                groups.set(
                    key,
                    {
                        id:
                            "firebase_" +
                            key,

                        title,

                        message,

                        category,

                        target,

                        recipientCount:
                            0,

                        createdAt:
                            item.createdAt ||
                            item.sentAt ||
                            timestamp,

                        time:
                            timestamp,

                        source:
                            "firebase",

                        recipientIds:
                            []

                    }
                );

            }


            const group =
                groups.get(
                    key
                );


            group.recipientCount++;


            const recipientId =
                item.userId ||
                item.recipientId;


            if(
                recipientId
            ){

                group.recipientIds.push(
                    recipientId
                );

            }

        }
    );


    return Array.from(
        groups.values()
    );

}


/* =========================================================
   MERGE HISTORY
========================================================= */

function mergeAndRender(){

    const map =
        new Map();


    notifications.forEach(
        function(item){

            if(
                item?.id
            ){

                map.set(
                    String(item.id),
                    item
                );

            }

        }
    );


    adminHistory.forEach(
        function(item){

            if(
                item?.id
            ){

                map.set(
                    String(item.id),
                    item
                );

            }

        }
    );


    notifications =
        Array.from(
            map.values()
        );


    notifications.sort(
        function(a,b){

            return (
                getTime(
                    b.createdAt ||
                    b.time
                ) -
                getTime(
                    a.createdAt ||
                    a.time
                )
            );

        }
    );


    saveLocalHistory();

    render();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const filter =
        filterSelect.value;


    const filtered =
        notifications.filter(
            function(item){

                const category =
                    String(
                        item.category ||
                        "system"
                    )
                    .trim()
                    .toLowerCase();


                if(
                    filter !== "all" &&
                    category !== filter
                ){

                    return false;

                }


                if(!search){

                    return true;

                }


                const text =
                    [
                        item.title,
                        item.message,
                        item.category,
                        item.target
                    ]
                    .join(" ")
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    list.innerHTML =
        "";


    filtered.forEach(
        function(item){

            list.appendChild(
                createNotificationElement(
                    item
                )
            );

        }
    );


    empty.style.display =
        filtered.length
            ? "none"
            : "block";


    /*
     * This counter represents sent notification
     * broadcasts, not unread notifications.
     */

    unreadCount.textContent =
        String(
            notifications.length
        );

}


/* =========================================================

        );


    const body =

            "div"
        );


    body.className =

            "div"
        );


    head.className =
        "notification-head";

        document.createElement(
            "div"
        );

        );

    );


    const message =

        );


    message.className =

    message.textContent =
        item.message ||
        "";


    const meta =
        document.createElement(
            "div"
        );


    meta.className =
        "notification-meta";


    const categoryTag =
        document.createElement(
            "span"
        );


    categoryTag.className =
        "tag";


    categoryTag.textContent =
        item.category ||
        "system";


    meta.appendChild(
        categoryTag
    );


    const targetTag =
        document.createElement(
            "span"
        );


    targetTag.className =
        "tag target-tag";

        "Sent: " +
        formatTarget(
            item.target
        );

    );

        Number(
            item.recipientCount
        ) > 0
    ){

        const countTag =

        countTag.textContent =

                item.recipientCount
            ) +

                ) === 1
                    ? ""
                    : "s"
            );

        );

    }


    const actions =

        );

    body.appendChild(

    body.appendChild(

    );

    body.appendChild(

    );

    body.appendChild(

    );


    article.appendChild(

    );

    article.appendChild(

    );


    return article;

}


/* =========================================================
   DELETE
========================================================= */

async function deleteNotification(
    item
){

    if(
        !item ||
        !item.id
    ){

        return;

    }


    const confirmed =
        window.confirm(
            "Delete this admin notification history?"
        );


    if(!confirmed){

        return;

    }


    try{

        /*
         * For Firebase history, delete only the individual
         * recipient document if this is a real document ID.
         *
         * Broadcast summary IDs start with firebase_ and
         * are intentionally not passed to deleteDoc().
         */

        if(
            item.source === "firebase" &&
            !String(
                item.id
            ).startsWith(
                "firebase_"
            )
        ){

            await deleteDoc(
                doc(
                    db,
                    "notifications",
                    item.id
                )
            );

        }


        notifications =
            notifications.filter(
                function(notification){

                    return String(
                        notification.id
                    ) !==
                    String(
                        item.id
                    );

                }
            );


        adminHistory =
            adminHistory.filter(
                function(notification){

                    return String(
                        notification.id
                    ) !==
                    String(
                        item.id
                    );

                }
            );


        saveLocalHistory();

        render();

        showToast(
            "Notification history deleted."
        );


        /*
         * Reload Firebase summaries after deleting.
         */

        setTimeout(
            function(){

                loadFirebaseHistory();

            },
            250
        );

    }catch(error){

        console.error(
            "Delete notification:",
            error
        );

        showToast(
            "Unable to delete notification.",
            true
        );

    }

}

/* =========================================================
   TARGET INFO
========================================================= */

function updateTargetInfo(){

    const target =
        document.getElementById(
            "newTarget"
        ).value;


    if(
        target === "riders"
    ){

        targetInfo.textContent =
            "Notification will be sent to all RiderX riders.";

        return;

    }


    if(
        target === "customers"
    ){

        return;

    }


    targetInfo.textContent =

/* =========================================================
   SEND NOTIFICATION
========================================================= */

async function sendNotification(
    event
){

    event.preventDefault();


    if(!adminReady){

        showToast(
            "Admin permission required.",
            true
        );

        return;

    }


    if(
        !currentAdmin ||
        !currentAdmin.uid
    ){

        showToast(
            "Admin session not available.",
            true
        );

        return;

    }


    const title =
        document
            .getElementById(
                "newTitle"
            )
            .value
            .trim();


    const message =
        document
            .getElementById(
                "newMessage"
            )
            .value
            .trim();


    const category =
        document
            .getElementById(
                "newCategory"
            )
            .value;


    const target =
        document
            .getElementById(
                "newTarget"
            )
            .value;


    if(
        !title ||
        !message
    ){

        showToast(
            "Title and message are required.",
            true
        );

        return;

    }


    sendBtn.disabled =
        true;


    refreshBtn.disabled =
        true;


    sendStatus.classList.add(
        "show"
    );


    sendStatus.textContent =
        "Finding recipients...";


    try{

        const users =
            await findRecipients(
                target
            );


        if(
            !users.length
        ){

            throw new Error(
                "No matching customers or riders found."
            );

        }


        sendStatus.textContent =
            "Sending to " +
            users.length +
            " user(s)...";


        const sent =
            await createRecipientNotifications(
                users,
                {
                    title,
                    message,
                    category,
                    target
                }
            );


        if(
            sent <= 0
        ){

            throw new Error(
                "No notifications were created."
            );

        }


        /*
         * Save local admin history.
         *
         * This is a broadcast summary, not one entry
         * per recipient.
         */

        const historyItem = {

            id:
                "admin_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .slice(2,8),

            title,

            message,

            category,

            target,

            recipientCount:
                sent,

            time:
                Date.now(),

            createdAt:
                Date.now(),

            source:
                "local"

        };


        notifications.unshift(
            historyItem
        );


        saveLocalHistory();

        render();


        notificationForm.reset();

        updateTargetInfo();

        closeCreateModal();


        showToast(
            "Notification sent to " +
            sent +
            " user(s)."
        );


        /*
         * Refresh Firebase history.
         */

        setTimeout(
            function(){

                loadFirebaseHistory();

            },
            500
        );

    }catch(error){

        console.error(
            "RiderX send notification:",
            error
        );


        sendStatus.textContent =
            error &&
            error.message
                ? error.message
                : "Unable to send notification.";


        showToast(
            error &&
            error.message
                ? error.message
                : "Unable to send notification.",
            true
        );

    }finally{

        sendBtn.disabled =
            false;

        refreshBtn.disabled =
            false;

    }

}


/* =========================================================
   FIND RECIPIENTS
========================================================= */

async function findRecipients(
    target
){

    const roles = [];


    if(
        target === "riders"
    ){

        roles.push(
            "rider"
        );

    }
    else if(
        target === "customers"
    ){

        roles.push(
            "customer"
        );

    }
    else{

        roles.push(
            "rider",
            "customer"
        );

    }


    const users =
        new Map();


    /*
     * Compatibility with older RiderX profiles.
     */

    const fieldNames = [
        "role",
        "userRole",
        "accountType"
    ];


    for(
        const role of roles
    ){

        for(
            const fieldName of fieldNames
        ){

            try{

                const snapshot =
                    await getDocs(
                        query(
                            collection(
                                db,
                                "users"
                            ),
                            where(
                                fieldName,
                                "==",
                                role
                            )
                        )
                    );


                snapshot.forEach(
                    function(userDoc){

                        const data =
                            userDoc.data() ||
                            {};


                        const uid =
                            userDoc.id;


                        if(!uid){

                            return;

                        }


                        users.set(
                            uid,
                            {
                                uid,
                                ...data
                            }
                        );

                    }
                );

            }catch(error){

                /*
                 * A failed compatibility query should not
                 * prevent other role fields from being checked.
                 */

                console.warn(
                    "Recipient role query failed:",
                    fieldName,
                    role,
                    error
                );

            }

        }

    }


    return Array.from(
        users.values()
    );

}


/* =========================================================
   CREATE FIRESTORE NOTIFICATIONS
========================================================= */

async function createRecipientNotifications(
    users,
    payload
){

    let sent =
        0;


    /*
     * Firestore writeBatch limit is 500 operations.
     * We intentionally use 450.
     */

    for(
        let start = 0;
        start < users.length;
        start += MAX_BATCH_OPERATIONS
    ){

        const chunk =
            users.slice(
                start,
                start +
                MAX_BATCH_OPERATIONS
            );


        const batch =
            writeBatch(
                db
            );


        chunk.forEach(
            function(user){

                if(
                    !user ||
                    !user.uid
                ){

                    return;

                }


                const notificationRef =
                    doc(
                        collection(
                            db,
                            "notifications"
                        )
                    );


                batch.set(
                    notificationRef,
                    {

                        /*
                         * Recipient
                         */

                        userId:
                            user.uid,

                        recipientId:
                            user.uid,


                        /*
                         * Notification content
                         */

                        title:
                            payload.title,

                        message:
                            payload.message,

                        category:
                            payload.category,


                        /*
                         * Target
                         */

                        target:
                            payload.target,

                        targetRole:
                            normalizeTargetRole(
                                payload.target,
                                user
                            ),


                        /*
                         * Read state
                         */

                        read:
                            false,

                        isRead:
                            false,


                        /*
                         * Sender
                         */

                        senderId:
                            currentAdmin.uid,

                        senderRole:
                            "admin",

                        senderEmail:
                            currentAdmin.email ||
                            "",


                        /*
                         * Source
                         */

                        source:
                            "admin",

                        type:
                            "admin",


                        /*
                         * Optional navigation
                         */

                        rideId:
                            "",

                        bookingId:
                            "",

                        action:
                            "",

                        url:
                            "",


                        /*
                         * Timestamps
                         */

                        createdAt:
                            serverTimestamp(),

                        sentAt:
                            serverTimestamp(),

                        readAt:
                            null

                    }
                );


                sent++;

            }
        );


        if(
            chunk.length > 0
        ){

            await batch.commit();

        }

    }


    return sent;

}


/* =========================================================
   NORMALIZE TARGET ROLE
========================================================= */

function normalizeTargetRole(
    target,
    user
){

    const role =
        String(
            user?.role ||
            user?.userRole ||
            user?.accountType ||
            ""
        )
        .trim()
        .toLowerCase();


    if(
        role === "rider"
    ){

        return "rider";

    }


    if(
        role === "customer"
    ){

        return "customer";

    }


    if(
        target === "riders"
    ){

        return "rider";

    }


    if(
        target === "customers"
    ){

        return "customer";

    }


    return role;

}


/* =========================================================
   ICON
========================================================= */

function getIcon(
    category
){

    switch(
        String(
            category ||
            ""
        )
        .trim()
        .toLowerCase()
    ){

        case "ride":
            return "🛵";

        case "rider":
            return "🧑‍✈️";

        case "customer":
            return "👤";

        case "payment":
            return "💳";

        default:
            return "🔔";

    }

}


/* =========================================================
   TARGET FORMAT
========================================================= */

function formatTarget(
    target
){

    switch(
        String(
            target ||
            ""
        )
        .toLowerCase()
    ){

        case "riders":
            return "Riders";

        case "customers":
            return "Customers";

        case "all":
            return "All Users";

        default:
            return target ||
                "Users";

    }

}


/* =========================================================
   TIME
========================================================= */

function getTime(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    try{

        if(
            typeof value.toMillis ===
            "function"
        ){

            return value.toMillis();

        }


        if(
            typeof value.toDate ===
            "function"
        ){

            return value
                .toDate()
                .getTime();

        }


        if(
            typeof value.seconds ===
            "number"
        ){

            return (
                value.seconds *
                1000
            );

        }


        const number =
            Number(
                value
            );


        if(
            Number.isFinite(
                number
            ) &&
            number > 0
        ){

            return number;

        }


        const date =
            new Date(
                value
            );


        return Number.isNaN(
            date.getTime()
        )
            ? 0
            : date.getTime();

    }catch(error){

        return 0;

    }

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    value
){

    const timestamp =
        getTime(
            value
        );


    if(!timestamp){

        return "Recently";

    }


    const diff =
        Math.max(
            0,
            Date.now() -
            timestamp
        );


    const minute =
        60 *
        1000;


    const hour =
        60 *
        minute;


    const day =
        24 *
        hour;


    if(
        diff <
        minute
    ){

        return "Just now";

    }


    if(
        diff <
        hour
    ){

        return (
            Math.floor(
                diff /
                minute
            ) +
            " min ago"
        );

    }


    if(
        diff <
        day
    ){

        return (
            Math.floor(
                diff /
                hour
            ) +
            " hr ago"
        );

    }


    const days =
        Math.floor(
            diff /
            day
        );


    return (
        days +
        (
            days === 1
                ? " day ago"
                : " days ago"
        )
    );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    error = false
){

    toast.textContent =
        String(
            message ||
            ""
        );


    toast.classList.toggle(
        "error",
        Boolean(
            error
        )
    );


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3500
        );

}

   NAVIGATION
========================================================= */

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ){

        history.back();

        return;

    }


    window.location.href =
        "dashboard.html";

}
