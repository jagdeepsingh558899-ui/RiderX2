<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX Fare Settings</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

:root{

--yellow:#FFE500;
--bg:#050505;
--card:#111;

}


*{

box-sizing:border-box;
font-family:Arial;

}


body{

margin:0;
background:var(--bg);
color:white;

}



.header{

height:70px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;

}



.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:var(--yellow);

}



.container{

padding:20px;

}



.card{

background:var(--card);
border:1px solid #333;
border-radius:20px;
padding:20px;

}



h2{

margin-top:0;

}



.group{

margin-bottom:15px;

}



label{

display:block;
color:#aaa;
margin-bottom:7px;

}



input{

width:100%;
padding:14px;
background:#000;
border:1px solid #444;
border-radius:12px;
color:white;
font-size:16px;

}



.section-title{

color:var(--yellow);
font-size:18px;
margin:20px 0 10px;

}



button{

width:100%;
padding:15px;
border:0;
border-radius:15px;
background:var(--yellow);
font-size:17px;
font-weight:bold;

}



.status{

margin-top:15px;
text-align:center;
color:#aaa;

}


</style>

</head>


<body>


<div class="header">


<div class="logo">

RID<span>ERX</span>

</div>


<a href="dashboard.html"
style="color:#FFE500;font-size:22px">

<i class="fa-solid fa-arrow-left"></i>

</a>


</div>





<div class="container">


<h2>

Fare Settings

</h2>



<div class="card">



<div class="section-title">

Bike Taxi

</div>



<div class="group">

<label>
Day Fare Per KM
</label>

<input id="bikeDay"
type="number">

</div>



<div class="group">

<label>
After 10 KM Fare
</label>

<input id="bikeAfter10"
type="number">

</div>






<div class="section-title">

Cab

</div>


<div class="group">

<label>
Cab Per KM

</label>

<input id="cab"
type="number">

</div>







<div class="section-title">

Parcel / Food

</div>



<div class="group">

<label>
Parcel Per KM
</label>

<input id="parcel"
type="number">

</div>



<div class="group">

<label>
Food Delivery Charge
</label>

<input id="food"
type="number">

</div>







<div class="section-title">

Night Fare

</div>



<div class="group">

<label>
Night Per KM (10 PM - 6 AM)

</label>


<input id="night"
type="number">

</div>





<div class="section-title">

General

</div>



<div class="group">

<label>
Minimum Fare

</label>

<input id="minimum"
type="number">

</div>




<button id="saveBtn">

<i class="fa-solid fa-save"></i>

Save Fare Settings

</button>



<div id="status"
class="status">

</div>



</div>



</div>







<script type="module">


import {

db

}

from "../firebase/firebase-config.js";



import {

doc,
getDoc,
setDoc

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";





const fareRef =
doc(
db,
"settings",
"fare"
);







async function loadSettings(){


const snap =
await getDoc(fareRef);



if(snap.exists()){


const data=snap.data();



bikeDay.value=data.bikeDay ?? 8;

bikeAfter10.value=data.bikeAfter10 ?? 9;

cab.value=data.cab ?? 12;

parcel.value=data.parcel ?? 8;

food.value=data.food ?? 30;

night.value=data.night ?? 11;

minimum.value=data.minimum ?? 20;



}

else{


bikeDay.value=8;

bikeAfter10.value=9;

cab.value=12;

parcel.value=8;

food.value=30;

night.value=11;

minimum.value=20;


}



}







saveBtn.onclick=async()=>{


await setDoc(

fareRef,

{


bikeDay:Number(bikeDay.value),

bikeAfter10:Number(bikeAfter10.value),

cab:Number(cab.value),

parcel:Number(parcel.value),

food:Number(food.value),

night:Number(night.value),

minimum:Number(minimum.value),


updatedAt:new Date()


}

);



status.innerHTML=
"✅ Fare Settings Updated Successfully";


};






loadSettings();



</script>



</body>

</html>
