<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Fare Settings</title>

<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;
color:white;
font-family:Arial;

}


.header{

background:#111;
padding:20px;
font-size:24px;
font-weight:bold;
border-bottom:2px solid #FFD600;

}



.container{

padding:20px;

}



.box{

background:#111;
padding:20px;
border-radius:20px;

}



input{

width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;

}



button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:#FFD600;
font-weight:bold;

}



h3{

color:#FFD600;

}


</style>


</head>


<body>


<div class="header">

⚙️ Fare Settings

</div>



<div class="container">


<div class="box">



<h3>
Bike Taxi
</h3>

<input id="bike" placeholder="Bike ₹ per KM">



<h3>
Cab
</h3>

<input id="cab" placeholder="Cab ₹ per KM">



<h3>
Parcel
</h3>

<input id="parcel" placeholder="Parcel Charge">



<h3>
Food
</h3>

<input id="food" placeholder="Food Charge">



<h3>
Night Charge
</h3>

<input id="night" placeholder="Night Extra Charge">





<button id="saveBtn">

Save Fare Settings

</button>




<p id="msg"></p>



</div>


</div>






<script type="module">


import { db } from "../firebase/config.js";


import {

doc,
setDoc,
getDoc

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





const ref = doc(db,"settings","fare");





async function loadFare(){


const snap = await getDoc(ref);



if(snap.exists()){


let data=snap.data();


bike.value=data.bike || 8;

cab.value=data.cab || 15;

parcel.value=data.parcel || 80;

food.value=data.food || 60;

night.value=data.night || 3;


}

else{


bike.value=8;

cab.value=15;

parcel.value=80;

food.value=60;

night.value=3;


}



}




saveBtn.onclick=async()=>{


await setDoc(

ref,

{


bike:Number(bike.value),

cab:Number(cab.value),

parcel:Number(parcel.value),

food:Number(food.value),

night:Number(night.value)


}

);



msg.innerHTML="Fare Updated Successfully ✅";



};




loadFare();



</script>



</body>

</html>
