<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Fare Settings</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
--yellow:#FFD600;
--black:#050505;
--card:#111;
--border:#333;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:var(--black);
color:white;
padding-bottom:40px;

}


.header{

display:flex;
justify-content:space-between;
align-items:center;
padding:20px;

background:#111;
border-bottom:1px solid #222;

}


.logo{

font-size:30px;
font-weight:900;

}

.logo span{

color:var(--yellow);

}



.container{

padding:20px;

}


.card{

background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:20px;
margin-bottom:20px;

}



.card h2{

color:var(--yellow);
margin-bottom:15px;

}



.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}



.input-box{

display:flex;
flex-direction:column;
gap:6px;

}


label{

color:#aaa;
font-size:14px;

}



input,select{

padding:13px;
background:#000;
color:white;
border:1px solid #444;
border-radius:12px;
outline:none;

}



input:focus{

border-color:var(--yellow);

}



.service-title{

font-size:20px;
font-weight:bold;
margin-bottom:15px;

}



.save-btn{

width:100%;
padding:16px;
border:none;
border-radius:15px;
background:var(--yellow);
font-size:17px;
font-weight:bold;
cursor:pointer;

}



.status{

margin-top:15px;
text-align:center;
color:var(--yellow);

}



@media(max-width:600px){

.grid{

grid-template-columns:1fr;

}

}


</style>

</head>


<body>


<header class="header">


<div class="logo">

RID<span>ERX</span>

</div>


<i class="fa-solid fa-gear"></i>


</header>




<div class="container">



<div class="card">


<h2>
<i class="fa-solid fa-money-bill"></i>
Fare Settings
</h2>


<div class="grid">


<div class="input-box">

<label>Service</label>

<select id="service">

<option value="bike">
Bike Taxi
</option>

<option value="cab">
Cab
</option>

<option value="parcel">
Parcel
</option>

<option value="food">
Food
</option>

</select>


</div>


</div>


</div>






<div class="card">


<div class="service-title">

Fare Configuration

</div>



<div class="grid">


<div class="input-box">

<label>Base Fare ₹</label>

<input id="baseFare"
type="number"
placeholder="20">

</div>




<div class="input-box">

<label>Day Per KM ₹ (8AM - 10PM)</label>

<input id="dayRate"
type="number"
placeholder="8">

</div>




<div class="input-box">

<label>After 10 KM Per KM ₹</label>

<input id="extraRate"
type="number"
placeholder="9">

</div>




<div class="input-box">

<label>Night Per KM ₹ (10PM - 6AM)</label>

<input id="nightRate"
type="number"
placeholder="11">

</div>



</div>


</div>







<button class="save-btn" id="saveFare">

<i class="fa-solid fa-save"></i>

Save Fare Settings

</button>



<div class="status" id="status"></div>




</div>





<script type="module" src="../js/admin-fare.js"></script>


</body>

</html>
