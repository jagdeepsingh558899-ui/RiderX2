<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Fare Settings</title>


<style>

:root{

--yellow:#FFE500;
--black:#050505;
--card:#111;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;

}



body{

background:var(--black);
color:white;
padding:20px;

}



.logo{

font-size:28px;
font-weight:900;
margin-bottom:25px;

}



.logo span{

color:var(--yellow);

}



.card{

background:var(--card);
border:1px solid #333;
border-radius:20px;
padding:20px;

}



label{

display:block;
margin-top:15px;
margin-bottom:8px;
color:#999;

}



select,
input{

width:100%;
padding:14px;
background:#222;
color:white;
border:1px solid #444;
border-radius:12px;
font-size:16px;

}



button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:var(--yellow);
font-weight:bold;

}



.back{

background:#222;
color:white;

}



#status{

margin-top:15px;
text-align:center;
color:#00ff66;

}



</style>

</head>



<body>



<div class="logo">

RID<span>ERX</span>

</div>




<button class="back"
onclick="history.back()">

← Back

</button>





<div class="card">


<h2>

Fare Settings

</h2>




<label>

Service Type

</label>


<select id="service">


<option value="bike">

Bike Taxi

</option>


<option value="cab">

Cab

</option>


<option value="auto">

Auto

</option>


<option value="parcel">

Parcel

</option>


<option value="food">

Food Delivery

</option>


</select>






<label>

Base Fare ₹

</label>


<input id="baseFare"
type="number"
placeholder="Base Fare">





<label>

Day Rate ₹ / KM

</label>


<input id="dayRate"
type="number"
placeholder="Day Per KM">





<label>

Extra KM Rate ₹ / KM

</label>


<input id="extraRate"
type="number"
placeholder="After 10 KM">






<label>

Night Rate ₹ / KM

</label>


<input id="nightRate"
type="number"
placeholder="Night Rate">






<button id="saveFare">

Save Fare

</button>




<div id="status"></div>



</div>






<script type="module"
src="./js/fare-settings.js"></script>



</body>

</html>
