<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Fare Settings</title>

<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;
color:white;
font-family:Arial;

}


.header{

background:#111;
padding:20px;
font-size:24px;
font-weight:bold;
border-bottom:2px solid #FFD600;

}


.container{

padding:20px;

}


.box{

background:#111;
padding:25px;
border-radius:20px;
border:1px solid #333;

}



label{

color:#FFD600;
display:block;
margin-top:15px;

}



input{

width:100%;
padding:14px;
margin-top:8px;
border-radius:12px;
border:none;
font-size:16px;

}



button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:#FFD600;
font-weight:bold;

}



#msg{

margin-top:15px;
color:#FFD600;

}


</style>


</head>


<body>



<div class="header">

⚙️ RiderX Fare Settings

</div>




<div class="container">


<div class="box">



<label>
Base Fare
</label>

<input id="base" type="number">





<label>
🏍 Bike Taxi Per KM
</label>

<input id="bike" type="number">





<label>
🚕 Cab Per KM
</label>

<input id="cab" type="number">





<label>
📦 Parcel Starting Charge
</label>

<input id="parcel" type="number">





<label>
🍔 Food Delivery Charge
</label>

<input id="food" type="number">





<label>
🌙 Night Extra Charge
</label>

<input id="night" type="number">






<button id="saveBtn">

Save Fare Settings

</button>



<p id="msg"></p>



</div>


</div>







<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
setDoc,
getDoc

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let ref=

doc(db,"settings","fare");







async function loadFare(){



let snap=

await getDoc(ref);



if(snap.exists()){



let data=snap.data();



base.value=data.base || 50;

bike.value=data.bike || 8;

cab.value=data.cab || 15;

parcel.value=data.parcel || 80;

food.value=data.food || 60;

night.value=data.night || 3;



}

else{


base.value=50;

bike.value=8;

cab.value=15;

parcel.value=80;

food.value=60;

night.value=3;


}


}








saveBtn.onclick=async()=>{



await setDoc(

ref,

{


base:Number(base.value),

bike:Number(bike.value),

cab:Number(cab.value),

parcel:Number(parcel.value),

food:Number(food.value),

night:Number(night.value)



}

);





msg.innerHTML=

"Fare Settings Updated ✅";



};






loadFare();



</script>



</body>

</html>
