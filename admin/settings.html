<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Settings</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.box{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


input{

width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:none;

}


button{

width:100%;
padding:14px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

⚙️ Admin Control Panel

</div>



<div class="container">


<div class="box">


<h3>💰 Fare Settings</h3>


<input id="bikeBase" placeholder="Bike Base Fare">

<input id="bikeKm" placeholder="Bike Per KM">



<input id="cabBase" placeholder="Cab Base Fare">

<input id="cabKm" placeholder="Cab Per KM">





<h3>🎁 Coupon</h3>


<input id="coupon" placeholder="Coupon Code">


<input id="discount" placeholder="Discount %">





<h3>🚦 Services Control</h3>



<label>

<input type="checkbox" id="bike">

🏍 Bike Taxi

</label>


<br><br>


<label>

<input type="checkbox" id="cab">

🚕 Cab

</label>


<br><br>


<label>

<input type="checkbox" id="parcel">

📦 Parcel

</label>


<br><br>


<label>

<input type="checkbox" id="food">

🍔 Food

</label>





<button onclick="saveSettings()">

Save All Settings

</button>



</div>


</div>






<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
setDoc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";







async function load(){


let snap=

await getDoc(

doc(db,"settings","app")

);



if(snap.exists()){


let d=snap.data();



bikeBase.value=d.bikeBase || "";

bikeKm.value=d.bikeKm || "";

cabBase.value=d.cabBase || "";

cabKm.value=d.cabKm || "";

coupon.value=d.coupon || "";

discount.value=d.discount || "";



bike.checked=d.bike ?? true;

cab.checked=d.cab ?? true;

parcel.checked=d.parcel ?? true;

food.checked=d.food ?? true;


}


}






window.saveSettings=async function(){



await setDoc(

doc(db,"settings","app"),

{


bikeBase:Number(bikeBase.value),

bikeKm:Number(bikeKm.value),


cabBase:Number(cabBase.value),

cabKm:Number(cabKm.value),



coupon:coupon.value,

discount:Number(discount.value),



bike:bike.checked,

cab:cab.checked,

parcel:parcel.checked,

food:food.checked



}

);



alert("All Settings Saved ✅");


}





load();



</script>


</body>

</html>
