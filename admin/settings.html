<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX Admin Settings</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

:root{

--yellow:#FFE500;
--bg:#050505;
--card:#111;

}


*{

box-sizing:border-box;
font-family:Arial;

}


body{

margin:0;
background:var(--bg);
color:white;

}



.header{

height:70px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;

}



.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:var(--yellow);

}



.container{

padding:20px;

}



.card{

background:var(--card);
border:1px solid #333;
border-radius:20px;
padding:20px;

}



.group{

margin-bottom:15px;

}



label{

display:block;
color:#aaa;
margin-bottom:7px;

}



input,
select{

width:100%;
padding:14px;
background:#000;
color:white;
border:1px solid #444;
border-radius:12px;
font-size:15px;

}



.switch{

display:flex;
justify-content:space-between;
align-items:center;
background:#000;
padding:15px;
border-radius:12px;

}



button{

width:100%;
padding:15px;
background:#FFE500;
color:#000;
border:0;
border-radius:15px;
font-weight:bold;
font-size:16px;

}



#msg{

text-align:center;
margin-top:15px;
color:#FFE500;

}



</style>

</head>


<body>


<header class="header">


<div class="logo">

RID<span>ERX</span>

</div>



<a href="dashboard.html"
style="color:#FFE500;font-size:22px">

<i class="fa-solid fa-arrow-left"></i>

</a>



</header>





<div class="container">


<h2>

App Settings

</h2>



<div class="card">



<div class="group">

<label>
App Name
</label>

<input id="appName">

</div>




<div class="group">

<label>
Logo URL
</label>

<input id="logo">

</div>




<div class="group">

<label>
Theme Color
</label>

<input id="themeColor"
placeholder="#FFE500">

</div>





<div class="group">

<label>
Support Number
</label>

<input id="supportNumber"
type="tel">

</div>





<div class="group">

<label>
Support Email
</label>

<input id="supportEmail"
type="email">

</div>





<div class="group">

<label>
App Version

</label>

<input id="version">

</div>






<div class="group">

<label>
Default Language

</label>


<select id="language">


<option value="en">
English
</option>


<option value="hi">
Hindi
</option>


</select>


</div>






<div class="switch">


<span>
Maintenance Mode
</span>


<input id="maintenance"
type="checkbox">


</div>






<br>



<button id="saveBtn">

<i class="fa-solid fa-save"></i>

Save Settings

</button>



<div id="msg"></div>




</div>



</div>







<script type="module">


import {

db

}

from "../firebase/firebase-config.js";


import {

doc,
getDoc,
setDoc

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";





const settingsRef =
doc(
db,
"settings",
"app"
);







async function loadSettings(){


const snap =
await getDoc(settingsRef);



if(snap.exists()){


let data=snap.data();



appName.value=data.appName || "RiderX";

logo.value=data.logo || "";

themeColor.value=data.themeColor || "#FFE500";

supportNumber.value=data.supportNumber || "";

supportEmail.value=data.supportEmail || "";

version.value=data.version || "1.0.0";

language.value=data.language || "en";

maintenance.checked=data.maintenance || false;


}


}




saveBtn.onclick=async()=>{


await setDoc(

settingsRef,

{


appName:appName.value,

logo:logo.value,

themeColor:themeColor.value,

supportNumber:supportNumber.value,

supportEmail:supportEmail.value,

version:version.value,

language:language.value,

maintenance:maintenance.checked,


updatedAt:new Date()


}

);



msg.innerHTML=
"✅ Settings Saved Successfully";


};





loadSettings();



</script>


</body>

</html>
