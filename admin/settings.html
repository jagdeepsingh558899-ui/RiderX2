<!DOCTYPE html>
<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Settings</title>


<link rel="stylesheet" href="../css/style.css">



<style>


body{

margin:0;

background:#000;

color:white;

font-family:Arial,sans-serif;

}



.header{

background:#111;

padding:20px;

font-size:25px;

font-weight:bold;

color:#FFD600;

}



.container{

padding:20px;

}



.card{

background:#111;

padding:20px;

border-radius:20px;

margin-bottom:20px;

}



input,select{

width:100%;

padding:15px;

margin:10px 0;

background:#222;

border:none;

border-radius:12px;

color:white;

box-sizing:border-box;

}



button{

width:100%;

padding:16px;

background:#FFD600;

border:none;

border-radius:15px;

font-weight:bold;

font-size:17px;

}



.title{

font-size:20px;

color:#FFD600;

font-weight:bold;

}



</style>


</head>



<body>



<div class="header">

⚙ App Settings

</div>






<div class="container">





<div class="card">


<div class="title">

App Information

</div>



<input id="appName"

placeholder="App Name">



<input id="supportNumber"

placeholder="Support Number">



</div>








<div class="card">


<div class="title">

Services

</div>



<select id="bikeService">


<option value="on">

Bike Taxi ON

</option>


<option value="off">

Bike Taxi OFF

</option>


</select>




<select id="cabService">


<option value="on">

Cab ON

</option>


<option value="off">

Cab OFF

</option>


</select>





<select id="parcelService">


<option value="on">

Parcel ON

</option>


<option value="off">

Parcel OFF

</option>


</select>






<select id="foodService">


<option value="on">

Food ON

</option>


<option value="off">

Food OFF

</option>


</select>



</div>







<div class="card">


<div class="title">

Payment

</div>



<select id="cashPayment">


<option value="on">

Cash Enabled

</option>


<option value="off">

Cash Disabled

</option>


</select>





<select id="onlinePayment">


<option value="on">

Online Payment Enabled

</option>


<option value="off">

Online Payment Disabled

</option>


</select>



</div>







<div class="card">


<div class="title">

System

</div>



<select id="maintenance">


<option value="off">

Maintenance OFF

</option>


<option value="on">

Maintenance ON

</option>


</select>



</div>






<button id="saveSettings">

Save Settings

</button>





</div>







<script type="module" src="../js/settings.js"></script>



</body>

</html>
