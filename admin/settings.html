<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX App Settings</title>


<style>

:root{

--yellow:#FFE500;
--black:#050505;
--card:#111;

}



*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;

}



body{

background:var(--black);
color:white;
padding:20px;

}



.logo{

font-size:28px;
font-weight:900;
margin-bottom:25px;

}


.logo span{

color:var(--yellow);

}



.card{

background:var(--card);
border:1px solid #333;
border-radius:20px;
padding:20px;

}



label{

display:block;
margin-top:15px;
margin-bottom:7px;
color:#999;

}



input{

width:100%;
padding:14px;
border-radius:12px;
border:1px solid #444;
background:#222;
color:white;

}



.switch{

display:flex;
justify-content:space-between;
align-items:center;
background:#222;
padding:12px;
border-radius:12px;
margin-top:10px;

}



input[type="checkbox"]{

width:25px;
height:25px;

}



button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:var(--yellow);
font-weight:bold;

}



.back{

background:#222;
color:white;

}



#status{

margin-top:15px;
text-align:center;
color:#00ff66;

}


</style>


</head>



<body>



<div class="logo">

RID<span>ERX</span>

</div>



<button class="back"
onclick="history.back()">

← Back

</button>




<div class="card">


<h2>

App Settings

</h2>



<label>

App Name

</label>


<input id="appName"
placeholder="RiderX">





<label>

Support Number

</label>


<input id="support"
placeholder="Support Number">





<label>

Referral Bonus

</label>


<input id="referral"
type="number"
placeholder="Referral Amount">






<div class="switch">

Bike Taxi

<input id="bike"
type="checkbox">

</div>



<div class="switch">

Cab Service

<input id="cab"
type="checkbox">

</div>



<div class="switch">

Parcel Service

<input id="parcel"
type="checkbox">

</div>



<div class="switch">

Food Delivery

<input id="food"
type="checkbox">

</div>



<div class="switch">

Maintenance Mode

<input id="maintenance"
type="checkbox">

</div>




<button id="save">

Save Settings

</button>



<div id="status"></div>



</div>






<script type="module"
src="./js/settings.js"></script>



</body>

</html>
