<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Settings</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.box{

background:#111;
padding:20px;
border-radius:20px;
margin:15px 0;

}


input{

width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:none;

}


button{

width:100%;
padding:14px;
background:#FFD600;
border:none;
border-radius:12px;
font-weight:bold;

}


h3{

color:#FFD600;

}


</style>

</head>


<body>


<div class="header">

⚙️ RiderX Admin Settings

</div>


<div class="container">


<div class="box">


<h3>💰 Fare Settings</h3>


<input id="bike" placeholder="Bike ₹ Per KM">


<input id="cab" placeholder="Cab ₹ Per KM">


<input id="parcel" placeholder="Parcel Charge">


<input id="food" placeholder="Food Charge">


<input id="night" placeholder="Night Extra Charge">



<h3>🚦 Services</h3>


<label>

<input type="checkbox" id="bikeService">

🏍 Bike Taxi

</label>


<br>


<label>

<input type="checkbox" id="cabService">

🚕 Cab

</label>


<br>


<label>

<input type="checkbox" id="parcelService">

📦 Parcel

</label>


<br>


<label>

<input type="checkbox" id="foodService">

🍔 Food

</label>



<button id="save">

Save Settings

</button>



<p id="msg"></p>



</div>


</div>






<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc,
setDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let fareRef =
doc(db,"settings","fare");


let serviceRef =
doc(db,"settings","services");






async function load(){



let fare =
await getDoc(fareRef);



if(fare.exists()){


let d=fare.data();


bike.value=d.bike || 8;

cab.value=d.cab || 15;

parcel.value=d.parcel || 80;

food.value=d.food || 60;

night.value=d.night || 3;


}





let services =
await getDoc(serviceRef);



if(services.exists()){


let d=services.data();


bikeService.checked=d.bike ?? true;

cabService.checked=d.cab ?? true;

parcelService.checked=d.parcel ?? true;

foodService.checked=d.food ?? true;


}


}




save.onclick=async()=>{



await setDoc(

fareRef,

{


bike:Number(bike.value),

cab:Number(cab.value),

parcel:Number(parcel.value),

food:Number(food.value),

night:Number(night.value)


}

);





await setDoc(

serviceRef,

{


bike:bikeService.checked,

cab:cabService.checked,

parcel:parcelService.checked,

food:foodService.checked


}

);



msg.innerHTML="Settings Updated ✅";


};





load();



</script>


</body>

</html>
