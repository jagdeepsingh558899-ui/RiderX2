<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Manage Rides</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

:root{

--yellow:#FFE500;
--black:#050505;
--card:#111;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;

}



body{

background:var(--black);
color:white;
padding-bottom:50px;

}



.header{

height:70px;
background:#111;
display:flex;
align-items:center;
padding:0 20px;

}



.logo{

font-size:28px;
font-weight:900;

}



.logo span{

color:var(--yellow);

}



.container{

padding:20px;

}



.back{

width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#222;
color:white;
margin-bottom:20px;

}



.title{

font-size:24px;
font-weight:bold;
margin-bottom:20px;

}



.ride-card{

background:var(--card);
border:1px solid #333;
border-radius:18px;
padding:18px;
margin-bottom:15px;

}



.row{

margin-bottom:8px;

}



.label{

color:#999;

}



.status{

font-weight:bold;
color:var(--yellow);

}



button{

width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:var(--yellow);
font-weight:bold;

}



.cancel{

background:#ff3333;
color:white;

}



</style>

</head>



<body>



<header class="header">


<div class="logo">

RID<span>ERX</span>

</div>


</header>




<div class="container">



<button class="back"
onclick="history.back()">

← Back

</button>




<div class="title">

Manage Rides

</div>




<div id="rideList">

Loading Rides...

</div>




</div>




<script type="module"
src="./js/rides.js"></script>



</body>

</html>
