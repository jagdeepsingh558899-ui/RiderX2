<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Rides</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.card{

background:#111;
padding:20px;
border-radius:18px;
margin:15px 0;
border:1px solid #333;

}


button{

width:100%;
padding:12px;
margin-top:10px;
background:#FFD600;
border:none;
border-radius:12px;
font-weight:bold;

}


.status{

color:#FFD600;
font-weight:bold;

}


</style>

</head>


<body>


<div class="header">

🚕 RiderX Manage Rides

</div>



<div class="container">


<div id="rides">

Loading...

</div>


</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs,
doc,
updateDoc,
orderBy,
query

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function loadRides(){


let box=document.getElementById("rides");


box.innerHTML="Loading...";



const q=query(

collection(db,"rides"),

orderBy("createdAt","desc")

);



const snap=await getDocs(q);



box.innerHTML="";



if(snap.empty){

box.innerHTML="<p>No rides found</p>";

return;

}




snap.forEach((ride)=>{


let data=ride.data();



box.innerHTML += `


<div class="card">


<h3>

🏍 ${data.service || "Ride"}

</h3>



<p>

📍 Pickup:

<br>

${data.pickup || "-"}

</p>



<p>

🏁 Drop:

<br>

${data.drop || "-"}

</p>




<p>

📏 Distance:

${data.distance || 0} KM

</p>



<p>

💰 Fare:

₹${data.fare || 0}

</p>



<p class="status">

Status:

${data.status || "Pending"}

</p>



<p>

Customer:

${data.customerId || "-"}

</p>



<p>

Rider:

${data.riderId || "Not Assigned"}

</p>




<button onclick="cancelRide('${ride.id}')">

❌ Cancel Ride

</button>


</div>


`;



});



}






window.cancelRide=async(id)=>{


await updateDoc(

doc(db,"rides",id),

{


status:"Cancelled"

}

);



alert("Ride Cancelled ❌");



loadRides();


};




loadRides();



</script>


</body>

</html>
