<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Admin Rides</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.card{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin:15px 0;

}


button{

width:100%;
padding:12px;
margin-top:10px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

🚕 Manage Rides

</div>



<div class="container">


<div id="rides">

Loading...

</div>


</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs,
doc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";







async function loadRides(){



let snap = await getDocs(

collection(db,"rides")

);



let box=document.getElementById("rides");


box.innerHTML="";



snap.forEach((ride)=>{


let data=ride.data();



box.innerHTML += `


<div class="card">


<h3>

${data.service || "Ride"}

</h3>



<p>

💰 Fare: ${data.fare || "-"}

</p>



<p>

📍 Pickup:

${data.pickupLat},

${data.pickupLng}

</p>



<p>

🏁 Drop:

${data.dropLat},

${data.dropLng}

</p>



<p>

Status:

${data.status}

</p>



<p>

Rider:

${data.riderId || "Not Assigned"}

</p>



<button onclick="cancelRide('${ride.id}')">

❌ Cancel Ride

</button>


</div>


`;



});


}







window.cancelRide=async function(id){



await updateDoc(

doc(db,"rides",id),

{

status:"Cancelled"

}

);



alert("Ride Cancelled ❌");


loadRides();



}





loadRides();



</script>


</body>

</html>
