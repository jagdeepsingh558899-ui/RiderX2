<title>RiderX</title><link
    rel="manifest"
    href="./manifest.json"
><link
    rel="stylesheet"
    href="./css/Style.css"
><style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    margin:0;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}


.splash{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#070707;
    transition:
        opacity .45s ease,
        visibility .45s ease;
}


.splash.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


.splash-content{
    width:100%;
    max-width:360px;
    padding:25px;
    text-align:center;
}


.logo{
    width:88px;
    height:88px;
    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:25px;

    background:#FFD400;
    color:#080808;

    font-size:29px;
    font-weight:1000;

    box-shadow:
        0 15px 45px rgba(255,212,0,.14);

    animation:
        logoIn .7s ease both;
}


.brand{
    margin:0;

    font-size:31px;
    line-height:1;

    font-weight:1000;
    letter-spacing:-1px;

    animation:
        textIn .7s .12s ease both;
}


.brand span{
    color:#FFD400;
}


.tagline{
    margin:10px 0 0;

    color:#777;

    font-size:10px;

    animation:
        textIn .7s .22s ease both;
}


.loader-wrap{
    margin-top:32px;

    animation:
        textIn .7s .3s ease both;
}


.loader{
    width:34px;
    height:34px;

    margin:0 auto;

    border:3px solid #292929;
    border-top-color:#FFD400;

    border-radius:50%;

    animation:
        spin .75s linear infinite;
}


.loading-text{
    margin-top:11px;

    color:#555;

    font-size:8px;
}


.status{
    min-height:15px;

    margin-top:13px;

    color:#666;

    font-size:8px;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


@keyframes logoIn{

    from{
        opacity:0;
        transform:
            translateY(20px)
            scale(.8);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}


@keyframes textIn{

    from{
        opacity:0;
        transform:
            translateY(10px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }

}


.fallback{
    display:none;

    position:fixed;
    inset:0;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:#070707;
}


.fallback.show{
    display:flex;
}


.fallback-card{
    width:100%;
    max-width:390px;

    padding:25px;

    border:1px solid #292929;
    border-radius:18px;

    background:#111;

    text-align:center;
}


.fallback-card h2{
    margin:0 0 8px;

    font-size:18px;
}


.fallback-card p{
    margin:0;

    color:#777;

    font-size:10px;

    line-height:1.6;
}


.fallback-btn{
    width:100%;
    height:46px;

    margin-top:17px;

    border:0;
    border-radius:10px;

    background:#FFD400;
    color:#111;

    cursor:pointer;

    font-size:11px;
    font-weight:1000;
}


</style></head><body><div
    class="splash"
    id="splash"
><div class="splash-content">


    <div class="logo">
        RX
    </div>


    <h1 class="brand">
        Rider<span>X</span>
    </h1>


    <p class="tagline">
        Your ride. Your journey. Your choice.
    </p>


    <div class="loader-wrap">

        <div class="loader"></div>

        <div class="loading-text">
            Starting RiderX...
        </div>

        <div
            class="status"
            id="status"
        >
            Checking your session
        </div>

    </div>


</div>

</div><div
    class="fallback"
    id="fallback"
><div class="fallback-card">

    <h2>
        RiderX
    </h2>

    <p>
        RiderX could not complete the automatic redirect.
        Please continue manually.
    </p>

    <button
        class="fallback-btn"
        id="fallbackBtn"
    >
        Continue to RiderX
    </button>

</div>

</div><script>

"use strict";


const splash =
    document.getElementById(
        "splash"
    );


const fallback =
    document.getElementById(
        "fallback"
    );


const statusText =
    document.getElementById(
        "status"
    );


const fallbackBtn =
    document.getElementById(
        "fallbackBtn"
    );



let redirectStarted =
    false;



function setStatus(
    text
){

    if(statusText){

        statusText.textContent =
            text;

    }

}



function getStoredUser(){

    const keys = [

        "riderx_user",
        "riderx_customer",
        "riderx_rider"

    ];


    for(
        const key of keys
    ){

        try{

            const raw =
                localStorage.getItem(
                    key
                );


            if(!raw){

                continue;

            }


            const user =
                JSON.parse(
                    raw
                );


            if(
                user &&
                typeof user ===
                "object"
            ){

                return user;

            }

        }catch(error){

            console.warn(
                "Invalid stored session:",
                key
            );

        }

    }


    return null;

}



function getRole(){

    const user =
        getStoredUser();


    if(
        user &&
        user.role
    ){

        return normalizeRole(
            user.role
        );

    }


    const role =
        localStorage.getItem(
            "userRole"
        );


    if(role){

        return normalizeRole(
            role
        );

    }


    const selected =
        localStorage.getItem(
            "riderx_selected_role"
        );


    if(selected){

        return normalizeRole(
            selected
        );

    }


    return "";

}



function normalizeRole(
    role
){

    const value =
        String(
            role || ""
        )
        .trim()
        .toLowerCase();


    if(
        value === "driver"
    ){

        return "rider";

    }


    if(
        value === "customer" ||
        value === "rider" ||
        value === "admin"
    ){

        return value;

    }


    return "";

}



function getLoginState(){

    const user =
        getStoredUser();


    if(!user){

        return false;

    }


    if(
        user.status &&
        [
            "blocked",
            "suspended",
            "disabled"
        ].includes(
            String(
                user.status
            ).toLowerCase()
        )
    ){

        return false;

    }


    return true;

}



function getDestination(){

    const loggedIn =
        getLoginState();


    const role =
        getRole();


    if(loggedIn){

        if(
            role ===
            "admin"
        ){

            return "./admin/dashboard.html";

        }


        if(
            role ===
            "rider"
        ){

            return "./rider/home.html";

        }


        if(
            role ===
            "customer"
        ){

            return "./customer/home.html";

        }

    }


    return "./auth/role.html";

}



function redirect(){

    if(
        redirectStarted
    ){

        return;

    }


    redirectStarted =
        true;


    const destination =
        getDestination();


    setStatus(
        "Opening RiderX..."
    );


    setTimeout(
        function(){

            window.location.replace(
                destination
            );

        },
        180
    );


}



function startApp(){

    setStatus(
        "Checking your session"
    );


    setTimeout(
        function(){

            const user =
                getStoredUser();


            if(user){

                setStatus(
                    "Restoring your RiderX account"
                );

            }else{

                setStatus(
                    "Preparing account selection"
                );

            }


            setTimeout(
                redirect,
                450
            );

        },
        450
    );

}



fallbackBtn.addEventListener(
    "click",
    function(){

        window.location.href =
            "./auth/role.html";

    }
);



window.addEventListener(
    "error",
    function(){

        if(
            !redirectStarted
        ){

            splash.classList.add(
                "hide"
            );

            fallback.classList.add(
                "show"
            );

        }

    }
);



/*
 * Service Worker registration.
 * Failure here must never block the app.
 */

if(
    "serviceWorker" in
    navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register(
                    "./sw.js"
                )
                .catch(
                    function(error){

                        console.warn(
                            "Service worker registration failed:",
                            error
                        );

                    }
                );

        }
    );

}



startApp();

</script></body></html>
