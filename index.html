<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX</title>

<link rel="manifest" href="manifest.json">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#000;
height:100vh;
color:white;

}



#splash{

position:fixed;
top:0;
left:0;

width:100%;
height:100vh;

background:#000;

display:flex;
justify-content:center;
align-items:center;

z-index:9999;

animation:hideSplash 1s ease 3s forwards;

}



.logo-box{

text-align:center;

animation:logoAnimation 2s ease;

}



.logo{

width:170px;
height:170px;

object-fit:contain;

filter:drop-shadow(0 0 20px #FFD600);

animation:pulse 1.5s infinite;

}



.logo-text{

font-size:38px;
font-weight:900;

margin-top:15px;

letter-spacing:3px;

}



.logo-text span{

color:#FFD600;

}




@keyframes logoAnimation{

0%{

transform:scale(0);

opacity:0;

}

70%{

transform:scale(1.15);

opacity:1;

}

100%{

transform:scale(1);

}

}



@keyframes pulse{

50%{

transform:scale(1.08);

}

}



@keyframes hideSplash{

to{

opacity:0;
visibility:hidden;

}

}




#app{

height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:20px;

}



h1{

font-size:40px;

}



h1 span{

color:#FFD600;

}



p{

margin-top:10px;

color:#ccc;

}



.buttons{

width:100%;
max-width:350px;

margin-top:40px;

}



button{

width:100%;

padding:16px;

margin-top:15px;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

background:#FFD600;

color:#000;

}



.rider{

background:white;

}



</style>


</head>



<body>



<div id="splash">


<div class="logo-box">


<img src="assets/logo.png" class="logo">


<div class="logo-text">

RIDER<span>X</span>

</div>


</div>


</div>






<div id="app">


<h1>

Welcome To RIDER<span>X</span>

</h1>


<p>

Bike Taxi • Cab • Parcel • Food Delivery

</p>



<div class="buttons">


<button onclick="joinCustomer()">

🚕 Join As Customer

</button>



<button class="rider" onclick="joinRider()">

🏍 Join As Rider

</button>



</div>


</div>






<script>


function joinCustomer(){

localStorage.setItem(
"role",
"customer"
);


window.location.href="auth/login.html";


}



function joinRider(){

localStorage.setItem(
"role",
"rider"
);


window.location.href="rider/register.html";


}



</script>




<script type="module" src="js/app.js"></script>



</body>

</html>
