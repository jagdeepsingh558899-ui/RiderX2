<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX - Move Faster</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#000000">

<link rel="stylesheet" href="assets/app.css">

<link rel="stylesheet" href="assets/animation.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:#000;
color:#fff;
height:100vh;
overflow:hidden;
}


.splash{

position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;

}


.logo-animation{

font-size:45px;
font-weight:900;
letter-spacing:3px;

}


.logo-animation span,
.brand span{

color:#FFD600;

}



.main{

height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:25px;

}



.brand{

font-size:42px;
font-weight:900;

}



.tagline{

margin-top:15px;
color:#aaa;
text-align:center;

}



.buttons{

width:100%;
margin-top:50px;

}



.btn{

width:100%;
padding:17px;
margin:12px 0;
border-radius:15px;
border:none;
font-size:18px;
font-weight:bold;

}



.customer{

background:#FFD600;
color:#000;

}



.rider{

background:#111;
border:2px solid #FFD600;
color:#FFD600;

}



.footer{

position:absolute;
bottom:30px;
color:#777;

}



</style>

</head>


<body>


<div class="splash">

<div class="logo-animation">

RID<span>ERX</span>

</div>

</div>



<div class="main">


<div class="brand">

RID<span>ERX</span>

</div>


<p class="tagline">

India's Premium Bike Taxi, Cab, Parcel & Food Platform

</p>



<div class="buttons">


<button class="btn customer" onclick="joinCustomer()">

Join as Customer

</button>



<button class="btn rider" onclick="joinRider()">

Join as Rider

</button>


</div>



<div class="footer">

Fast • Safe • Reliable

</div>


</div>





<script type="module">

import {
auth,
db,
onAuthStateChanged,
doc,
getDoc
}
from "./firebase/firebase-config.js";



onAuthStateChanged(auth, async(user)=>{


if(!user) return;



try{


const snap =
await getDoc(
doc(db,"users",user.uid)
);



if(!snap.exists()) return;



const data =
snap.data();



if(data.role==="admin"){

location.href="admin/dashboard.html";

}

else if(data.role==="rider"){

location.href="rider/home.html";

}

else{

location.href="customer/home.html";

}


}
catch(e){

console.log(e);

}


});





</script>




<script>


function joinCustomer(){

location.href="auth/login.html?role=customer";

}



function joinRider(){

location.href="auth/login.html?role=rider";

}



if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}


</script>



</body>

</html>
