<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5c400"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="RiderX"
    >

    <meta
        name="description"
        content="RiderX - Bike, Taxi, Cab, Parcel and Delivery"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        href="./assets/logo.png"
    >

    <title>RiderX</title>


    <style>

        :root {
            --rx-yellow: #f5c400;
            --rx-black: #050505;
            --rx-text: #ffffff;
            --rx-muted: #8d8d8d;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-width: 100%;
            min-height: 100%;
            background: var(--rx-black);
        }


        body {
            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(245, 196, 0, 0.12),
                    transparent 38%
                ),
                var(--rx-black);

            color: var(--rx-text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;
        }


        button {
            font: inherit;

            -webkit-tap-highlight-color:
                transparent;
        }


        #riderx-loader {
            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(245, 196, 0, 0.10),
                    transparent 42%
                ),
                #050505;

            transition:
                opacity 0.35s ease,
                visibility 0.35s ease;
        }


        #riderx-loader.hidden {
            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        .loader-content {
            width: min(90vw, 360px);

            text-align: center;
        }


        .logo-wrap {
            width: 92px;

            height: 92px;

            margin: 0 auto 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                2px solid
                rgba(245, 196, 0, 0.35);

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #090909
                );

            box-shadow:
                0 0 0 8px
                rgba(245, 196, 0, 0.03),

                0 20px 60px
                rgba(0, 0, 0, 0.55);
        }


        .logo-wrap img {
            width: 68px;

            height: 68px;

            object-fit: contain;

            border-radius: 18px;
        }


        .brand {
            font-size: 34px;

            line-height: 1;

            font-weight: 900;

            letter-spacing: -1.5px;
        }


        .brand span {
            color: var(--rx-yellow);
        }


        .tagline {
            margin-top: 10px;

            color: var(--rx-muted);

            font-size: 13px;

            letter-spacing: 0.3px;
        }


        .progress {
            width: 150px;

            height: 4px;

            margin: 28px auto 0;

            overflow: hidden;

            border-radius: 99px;

            background:
                rgba(255, 255, 255, 0.08);
        }


        .progress::after {
            content: "";

            display: block;

            width: 45%;

            height: 100%;

            border-radius: inherit;

            background:
                var(--rx-yellow);

            animation:
                rx-progress 1.15s
                ease-in-out infinite;
        }


        .status {
            min-height: 18px;

            margin-top: 14px;

            color: #858585;

            font-size: 11px;

            line-height: 1.45;
        }


        .fallback {
            display: none;

            margin-top: 24px;
        }


        .fallback.visible {
            display: block;
        }


        .fallback button {
            border: 0;

            border-radius: 12px;

            padding: 12px 20px;

            background:
                var(--rx-yellow);

            color: #080808;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;
        }


        .fallback button:active {
            transform:
                scale(0.97);
        }


        @keyframes rx-progress {

            0% {
                transform:
                    translateX(-180%);
            }

            50% {
                transform:
                    translateX(100%);
            }

            100% {
                transform:
                    translateX(350%);
            }

        }


        @media (
            prefers-reduced-motion: reduce
        ) {

            .progress::after {
                animation: none;
            }


            #riderx-loader {
                transition: none;
            }

        }

    </style>

</head>


<body>


<main
    id="riderx-loader"
    aria-label="RiderX loading"
>


    <div class="loader-content">


        <div class="logo-wrap">

            <img
                src="./assets/logo.png"
                alt="RiderX"
                onerror="
                    this.style.display='none';
                "
            >

        </div>


        <div class="brand">

            Rider<span>X</span>

        </div>


        <div class="tagline">

            Ride. Deliver. Move.

        </div>


        <div
            id="riderx-status"
            class="status"
            aria-live="polite"
            aria-atomic="true"
        >
            Starting RiderX...
        </div>


        <div
            class="progress"
            aria-hidden="true"
        ></div>


        <div
            id="riderx-fallback"
            class="fallback"
        >

            <button
                id="riderx-retry"
                type="button"
            >
                Retry Connection
            </button>

        </div>


    </div>


</main>


<script>

"use strict";


/* ============================================================
   RIDERX 2.0
   ROOT ENTRY / SPLASH ROUTER
   File: index.html

   IMPORTANT:
   Firebase is loaded dynamically so module/CDN/configuration
   failures can be handled instead of silently leaving the
   splash screen stuck forever.
============================================================ */


/* ============================================================
   FIREBASE REFERENCES
============================================================ */

let auth = null;

let db = null;

let onAuthStateChanged = null;

let doc = null;

let getDoc = null;


/* ============================================================
   DOM
============================================================ */

const loader =
    document.getElementById(
        "riderx-loader"
    );


const statusElement =
    document.getElementById(
        "riderx-status"
    );


const fallback =
    document.getElementById(
        "riderx-fallback"
    );


const retryButton =
    document.getElementById(
        "riderx-retry"
    );


/* ============================================================
   ROUTES
============================================================ */

const ROUTES = Object.freeze({

    role:
        "./auth/role.html",

    customer:
        "./customer/home.html",

    rider:
        "./rider/home.html",

    admin:
        "./admin/dashboard.html"

});


/* ============================================================
   TIMING
============================================================ */

const CONFIG = Object.freeze({

    AUTH_TIMEOUT:
        15000,

    FIRESTORE_TIMEOUT:
        10000,

    REDIRECT_DELAY:
        120

});


/* ============================================================
   ROLE CONSTANTS
============================================================ */

const ROLES = Object.freeze({

    ADMIN:
        "admin",

    RIDER:
        "rider",

    CUSTOMER:
        "customer"

});


/* ============================================================
   STATE
============================================================ */

let authResolved =
    false;


let routingStarted =
    false;


let redirectStarted =
    false;


let fallbackShown =
    false;


let authUnsubscribe =
    null;


/* ============================================================
   STATUS
============================================================ */

function setStatus(text) {

    if (!statusElement) {
        return;
    }


    statusElement.textContent =
        String(text || "");

}


/* ============================================================
   LOADER
============================================================ */

function hideLoader() {

    if (!loader) {
        return;
    }


    loader.classList.add(
        "hidden"
    );

}


function showFallback() {

    if (fallbackShown) {
        return;
    }


    fallbackShown =
        true;


    if (fallback) {

        fallback.classList.add(
            "visible"
        );

    }

}


/* ============================================================
   REDIRECT
============================================================ */

function redirectTo(route) {

    if (
        !route ||
        redirectStarted
    ) {
        return;
    }


    redirectStarted =
        true;


    hideLoader();


    try {

        window.location.replace(
            route
        );

    } catch (error) {

        console.error(
            "RiderX: redirect failed:",
            error
        );


        redirectStarted =
            false;


        showFallback();

    }

}


function delayedRedirect(
    route,
    statusText
) {

    if (redirectStarted) {
        return;
    }


    if (statusText) {

        setStatus(
            statusText
        );

    }


    window.setTimeout(
        function () {

            redirectTo(
                route
            );

        },
        CONFIG.REDIRECT_DELAY
    );

}


/* ============================================================
   ROLE NORMALIZATION
============================================================ */

function normalizeRole(value) {

    if (
        typeof value !== "string" &&
        typeof value !== "number"
    ) {

        return "";

    }


    const role =
        String(value)
            .trim()
            .toLowerCase()
            .replace(
                /[\s-]+/g,
                "_"
            );


    if (
        [
            "admin",
            "administrator",
            "superadmin",
            "super_admin"
        ].includes(role)
    ) {

        return ROLES.ADMIN;

    }


    if (
        [
            "rider",
            "riders",
            "driver",
            "drivers",
            "captain",
            "partner",
            "partners",
            "driver_partner",
            "driverpartner"
        ].includes(role)
    ) {

        return ROLES.RIDER;

    }


    if (
        [
            "customer",
            "customers",
            "user",
            "users",
            "passenger",
            "client"
        ].includes(role)
    ) {

        return ROLES.CUSTOMER;

    }


    return "";

}


/* ============================================================
   BOOLEAN NORMALIZATION
============================================================ */

function isTruthyApprovalValue(value) {

    if (value === true) {
        return true;
    }


    if (
        typeof value === "number"
    ) {

        return value === 1;

    }


    const normalized =
        String(
            value ?? ""
        )
        .trim()
        .toLowerCase();


    return [
        "true",
        "1",
        "yes",
        "approved",
        "active",
        "verified"
    ].includes(
        normalized
    );

}


function isFalseApprovalValue(value) {

    if (value === false) {
        return true;
    }


    if (
        typeof value === "number"
    ) {

        return value === 0;

    }


    const normalized =
        String(
            value ?? ""
        )
        .trim()
        .toLowerCase();


    return [
        "false",
        "0",
        "no",
        "rejected",
        "blocked",
        "disabled",
        "suspended"
    ].includes(
        normalized
    );

}


/* ============================================================
   TIMEOUT HELPER
============================================================ */

function withTimeout(
    promise,
    timeout,
    label
) {

    let timer = null;


    const timeoutPromise =
        new Promise(
            function (_, reject) {

                timer =
                    window.setTimeout(
                        function () {

                            const error =
                                new Error(
                                    label ||
                                    "Operation timed out."
                                );


                            error.code =
                                "riderx/timeout";


                            reject(
                                error
                            );

                        },
                        timeout
                    );

            }
        );


    return Promise.race([

        Promise.resolve(
            promise
        ),

        timeoutPromise

    ]).finally(

        function () {

            if (
                timer !== null
            ) {

                window.clearTimeout(
                    timer
                );

            }

        }

    );

}


/* ============================================================
   LOCAL STORAGE HELPERS
============================================================ */

function safeGetStorage(key) {

    try {

        return localStorage.getItem(
            key
        );

    } catch (error) {

        return null;

    }

}


function safeSetStorage(
    key,
    value
) {

    try {

        localStorage.setItem(
            key,
            String(value)
        );

        return true;

    } catch (error) {

        console.warn(
            "RiderX: localStorage write failed:",
            error
        );


        return false;

    }

}


function safeRemoveStorage(key) {

    try {

        localStorage.removeItem(
            key
        );

    } catch (error) {

        /*
         * Ignore restricted/private
         * browser storage.
         */

    }

}


/* ============================================================
   SESSION CACHE
============================================================ */

function saveSessionCache(
    user,
    role
) {

    if (
        !user ||
        !user.uid ||
        !role
    ) {

        return;

    }


    const normalizedRole =
        normalizeRole(
            role
        );


    if (!normalizedRole) {
        return;
    }


    const session = {

        uid:
            user.uid,

        role:
            normalizedRole,

        email:
            user.email || "",

        displayName:
            user.displayName || "",

        photoURL:
            user.photoURL || "",

        updatedAt:
            Date.now()

    };


    try {

        localStorage.setItem(
            "riderx_session",
            JSON.stringify(
                session
            )
        );

    } catch (error) {

        console.warn(
            "RiderX: session cache unavailable:",
            error
        );

    }


    safeSetStorage(
        "riderx_uid",
        user.uid
    );


    safeSetStorage(
        "riderx_role",
        normalizedRole
    );


    safeSetStorage(
        "riderx_selected_role",
        normalizedRole
    );


    if (
        normalizedRole ===
        ROLES.CUSTOMER
    ) {

        safeSetStorage(
            "riderx_customer_id",
            user.uid
        );


        safeRemoveStorage(
            "riderx_rider_id"
        );

    }


    if (
        normalizedRole ===
        ROLES.RIDER
    ) {

        safeSetStorage(
            "riderx_rider_id",
            user.uid
        );


        safeRemoveStorage(
            "riderx_customer_id"
        );

    }

}


/* ============================================================
   CLEAR AUTH CACHE
============================================================ */

function clearAuthCache() {

    const keys = [

        "riderx_user",

        "riderx_customer",

        "riderx_rider",

        "riderx_role",

        "riderx_selected_role",

        "riderx_customer_id",

        "riderx_rider_id",

        "riderx_uid",

        "riderx_session"

    ];


    for (
        const key of keys
    ) {

        safeRemoveStorage(
            key
        );

    }

}


/* ============================================================
   GET USER PROFILE
============================================================ */

async function getUserProfile(
    user
) {

    if (
        !user ||
        !user.uid
    ) {

        return null;

    }


    if (
        typeof doc !== "function" ||
        typeof getDoc !== "function"
    ) {

        throw new Error(
            "Firestore functions are unavailable."
        );

    }


    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    const snapshot =
        await withTimeout(

            getDoc(
                userRef
            ),

            CONFIG.FIRESTORE_TIMEOUT,

            "User profile lookup timed out."

        );


    if (
        !snapshot.exists()
    ) {

        return null;

    }


    return (
        snapshot.data() ||
        {}
    );

}


/* ============================================================
   ROLE FROM PROFILE
============================================================ */

function getRoleFromProfile(
    data
) {

    if (
        !data ||
        typeof data !== "object"
    ) {

        return "";

    }


    const possibleRoles = [

        data.role,

        data.userRole,

        data.accountType,

        data.account_type,

        data.userType,

        data.user_type,

        data.type,

        data.accountRole,

        data.account_role

    ];


    for (
        const value of possibleRoles
    ) {

        const role =
            normalizeRole(
                value
            );


        if (role) {

            return role;

        }

    }


    return "";

}


/* ============================================================
   GET USER ROLE
============================================================ */

async function getUserRole(
    user
) {

    if (
        !user ||
        !user.uid
    ) {

        return "";

    }


    try {

        const profile =
            await getUserProfile(
                user
            );


        const profileRole =
            getRoleFromProfile(
                profile
            );


        if (profileRole) {

            return profileRole;

        }


        try {

            const tokenResult =
                await withTimeout(

                    user.getIdTokenResult(),

                    CONFIG.FIRESTORE_TIMEOUT,

                    "Authentication token lookup timed out."

                );


            const claims =
                tokenResult?.claims ||
                {};


            const claimRole =
                getRoleFromProfile(
                    claims
                );


            if (claimRole) {

                return claimRole;

            }

        } catch (claimError) {

            console.warn(
                "RiderX: custom claim lookup failed:",
                claimError
            );

        }


        return "";

    } catch (error) {

        console.error(
            "RiderX: Firestore role lookup failed:",
            error
        );


        throw error;

    }

}


/* ============================================================
   RIDER APPROVAL CHECK
============================================================ */

async function checkRiderAccess(
    user
) {

    if (
        !user ||
        !user.uid
    ) {

        return false;

    }


    if (
        typeof doc !== "function" ||
        typeof getDoc !== "function"
    ) {

        throw new Error(
            "Firestore functions are unavailable."
        );

    }


    const riderRef =
        doc(
            db,
            "riders",
            user.uid
        );


    const snapshot =
        await withTimeout(

            getDoc(
                riderRef
            ),

            CONFIG.FIRESTORE_TIMEOUT,

            "Rider approval lookup timed out."

        );


    if (
        !snapshot.exists()
    ) {

        return false;

    }


    const data =
        snapshot.data() ||
        {};


    if (
        isTruthyApprovalValue(
            data.disabled
        ) ||
        isTruthyApprovalValue(
            data.blocked
        ) ||
        isTruthyApprovalValue(
            data.suspended
        )
    ) {

        return false;

    }


    const approvalStatus =
        String(
            data.approvalStatus ??
            ""
        )
        .trim()
        .toLowerCase();


    const status =
        String(
            data.status ??
            ""
        )
        .trim()
        .toLowerCase();


    const riderStatus =
        String(
            data.riderStatus ??
            ""
        )
        .trim()
        .toLowerCase();


    const verificationStatus =
        String(
            data.verificationStatus ??
            ""
        )
        .trim()
        .toLowerCase();


    const rejectedStates = [

        "rejected",

        "declined",

        "blocked",

        "disabled",

        "suspended",

        "banned"

    ];


    if (
        rejectedStates.includes(
            approvalStatus
        ) ||
        rejectedStates.includes(
            status
        ) ||
        rejectedStates.includes(
            riderStatus
        ) ||
        rejectedStates.includes(
            verificationStatus
        )
    ) {

        return false;

    }


    if (
        isTruthyApprovalValue(
            data.approved
        ) ||
        isTruthyApprovalValue(
            data.isApproved
        ) ||
        isTruthyApprovalValue(
            data.adminApproved
        ) ||
        isTruthyApprovalValue(
            data.admin_approved
        ) ||
        isTruthyApprovalValue(
            data.verified
        ) ||
        isTruthyApprovalValue(
            data.isVerified
        )
    ) {

        return true;

    }


    const approvedStates = [

        "approved",

        "active",

        "verified",

        "accepted",

        "enabled"

    ];


    if (
        approvedStates.includes(
            approvalStatus
        ) ||
        approvedStates.includes(
            status
        ) ||
        approvedStates.includes(
            riderStatus
        ) ||
        approvedStates.includes(
            verificationStatus
        )
    ) {

        return true;

    }


    return false;

}


/* ============================================================
   SERVICE WORKER
============================================================ */

async function registerServiceWorker() {

    if (
        !(
            "serviceWorker" in
            navigator
        )
    ) {

        return;

    }


    try {

        await navigator.serviceWorker.register(

            "./sw.js",

            {
                scope:
                    "./"
            }

        );

    } catch (error) {

        /*
         * Service worker failure must NEVER prevent
         * Firebase authentication or routing.
         */

        console.warn(
            "RiderX: service worker registration failed:",
            error
        );

    }

}


/* ============================================================
   LOGGED OUT ROUTE
============================================================ */

function routeLoggedOut() {

    clearAuthCache();


    delayedRedirect(

        ROUTES.role,

        "Welcome to RiderX..."

    );

}


/* ============================================================
   LOGGED-IN ROUTER
============================================================ */

async function routeLoggedIn(
    user
) {

    if (
        !user ||
        !user.uid
    ) {

        routeLoggedOut();

        return;

    }


    setStatus(
        "Checking your RiderX account..."
    );


    let role = "";


    try {

        role =
            await getUserRole(
                user
            );

    } catch (error) {

        console.error(
            "RiderX: account role check failed:",
            error
        );


        setStatus(
            "Network error while checking your profile."
        );


        showFallback();


        routingStarted =
            false;


        return;

    }


    if (!role) {

        safeRemoveStorage(
            "riderx_role"
        );


        safeRemoveStorage(
            "riderx_selected_role"
        );


        delayedRedirect(

            ROUTES.role,

            "Please select your account type..."

        );


        return;

    }


    if (
        role ===
        ROLES.ADMIN
    ) {

        saveSessionCache(
            user,
            ROLES.ADMIN
        );


        delayedRedirect(

            ROUTES.admin,

            "Opening admin dashboard..."

        );


        return;

    }


    if (
        role ===
        ROLES.RIDER
    ) {

        setStatus(
            "Checking rider approval..."
        );


        let approved =
            false;


        try {

            approved =
                await checkRiderAccess(
                    user
                );

        } catch (error) {

            console.error(
                "RiderX: rider approval check failed:",
                error
            );


            setStatus(
                "Network error while checking rider approval."
            );


            showFallback();


            routingStarted =
                false;


            return;

        }


        if (!approved) {

            safeRemoveStorage(
                "riderx_rider_id"
            );


            safeRemoveStorage(
                "riderx_role"
            );


            safeSetStorage(

                "riderx_selected_role",

                ROLES.RIDER

            );


            delayedRedirect(

                ROUTES.role,

                "Your rider account is pending approval."

            );


            return;

        }


        saveSessionCache(
            user,
            ROLES.RIDER
        );


        delayedRedirect(

            ROUTES.rider,

            "Opening rider dashboard..."

        );


        return;

    }


    if (
        role ===
        ROLES.CUSTOMER
    ) {

        saveSessionCache(
            user,
            ROLES.CUSTOMER
        );


        delayedRedirect(

            ROUTES.customer,

            "Opening customer dashboard..."

        );


        return;

    }


    clearAuthCache();


    delayedRedirect(

        ROUTES.role,

        "Please select your account type..."

    );

}


/* ============================================================
   AUTH STATE HANDLER
============================================================ */

async function handleAuthState(
    user
) {

    if (
        routingStarted ||
        redirectStarted
    ) {

        return;

    }


    routingStarted =
        true;


    authResolved =
        true;


    try {

        if (user) {

            await routeLoggedIn(
                user
            );

        } else {

            routeLoggedOut();

        }

    } catch (error) {

        console.error(
            "RiderX: entry routing error:",
            error
        );


        routingStarted =
            false;


        setStatus(
            "Unable to load RiderX."
        );


        showFallback();

    }

}


/* ============================================================
   RETRY
============================================================ */

if (retryButton) {

    retryButton.addEventListener(

        "click",

        function () {

            if (
                redirectStarted
            ) {

                return;

            }


            retryButton.disabled =
                true;


            setStatus(
                "Restarting RiderX..."
            );


            window.setTimeout(

                function () {

                    window.location.reload();

                },

                150

            );

        }

    );

}


/* ============================================================
   START RIDERX
============================================================ */

(async function startRiderX() {

    setStatus(
        "Starting RiderX..."
    );


    /*
     * Service worker is deliberately started without
     * blocking authentication.
     */

    void registerServiceWorker();


    /*
     * Dynamically load Firebase so module/CDN/configuration
     * failures can be displayed instead of leaving the
     * splash screen permanently stuck.
     */

    setStatus(
        "Loading RiderX services..."
    );


    let firebaseModule;


    try {

        firebaseModule =
            await import(
                "./firebase/firebase-config.js"
            );


        auth =
            firebaseModule.auth;


        db =
            firebaseModule.db;


        onAuthStateChanged =
            firebaseModule.onAuthStateChanged;


        doc =
            firebaseModule.doc;


        getDoc =
            firebaseModule.getDoc;


    } catch (error) {

        console.error(
            "RiderX: Firebase module failed to load:",
            error
        );


        setStatus(
            "Unable to load RiderX services."
        );


        showFallback();


        return;

    }


    /*
     * Validate Firebase objects before subscribing.
     */

    if (
        !auth ||
        !db ||
        typeof onAuthStateChanged !==
            "function" ||
        typeof doc !==
            "function" ||
        typeof getDoc !==
            "function"
    ) {

        console.error(
            "RiderX: Firebase module loaded but required exports are missing."
        );


        setStatus(
            "RiderX services are incomplete."
        );


        showFallback();


        return;

    }


    try {

        authUnsubscribe =
            onAuthStateChanged(

                auth,

                handleAuthState,

                function (error) {

                    console.error(
                        "RiderX: auth state listener error:",
                        error
                    );


                    if (
                        routingStarted ||
                        redirectStarted
                    ) {

                        return;

                    }


                    setStatus(
                        "Authentication service unavailable."
                    );


                    showFallback();


                    routingStarted =
                        false;

                }

            );

    } catch (error) {

        console.error(
            "RiderX: Firebase Auth listener failed:",
            error
        );


        setStatus(
            "Authentication service unavailable."
        );


        showFallback();


        return;

    }


    /*
     * Safety timeout.
     *
     * This does NOT force logout.
     * It only exposes Retry when Firebase Auth takes
     * longer than expected.
     */

    window.setTimeout(

        function () {

            if (
                !authResolved &&
                !routingStarted &&
                !redirectStarted
            ) {

                setStatus(
                    "Authentication is taking longer than expected."
                );


                showFallback();

            }

        },

        CONFIG.AUTH_TIMEOUT

    );

})();


/* ============================================================
   DEBUG / COMPATIBILITY API
============================================================ */

window.RiderXEntry =
    Object.freeze({

        routes:
            ROUTES,

        normalizeRole,

        getUserRole,

        checkRiderAccess,

        saveSessionCache,

        clearAuthCache,

        registerServiceWorker

    });


/* ============================================================
   PAGE CLEANUP
============================================================ */

window.addEventListener(

    "pagehide",

    function () {

        if (
            typeof authUnsubscribe ===
            "function"
        ) {

            try {

                authUnsubscribe();

            } catch (error) {

                console.warn(
                    "RiderX: auth listener cleanup failed:",
                    error
                );

            }


            authUnsubscribe =
                null;

        }

    },

    {
        once: true
    }

);

</script>
