<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX - Ride Anywhere</title>

<link rel="manifest" href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#111;
color:white;

}


.hero{

min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;

}


.box{

max-width:420px;
width:100%;
background:#1d1d1d;
padding:35px;
border-radius:25px;
box-shadow:0 0 20px #000;

}


.logo{

width:120px;
height:120px;
margin:auto;
display:block;

}


h1{

font-size:45px;
color:#ffcc00;
margin:15px 0;

}


p{

color:#ddd;
margin-bottom:25px;

}


.btn{

display:block;
padding:15px;
margin:15px 0;
border-radius:12px;
text-decoration:none;
font-weight:bold;
font-size:18px;

}


.login{

background:#ffcc00;
color:#000;

}


.register{

border:2px solid #ffcc00;
color:#ffcc00;

}



.services{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:25px;

}


.service{

background:#111;
padding:15px;
border-radius:12px;
font-size:14px;

}

</style>


</head>


<body>



<div class="hero">


<div class="box">


<img src="assets/logo.svg" class="logo">



<h1>
RiderX
</h1>


<p>
Your Premium Ride Partner
</p>



<a class="btn login" href="auth/login.html">
Login
</a>



<a class="btn register" href="auth/register.html">
Create Account
</a>



<div class="services">


<div class="service">
🏍 Bike Taxi
</div>


<div class="service">
🚕 Cab
</div>


<div class="service">
📦 Parcel
</div>


<div class="service">
🍔 Food
</div>


</div>



</div>


</div>

<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register("sw.js")
.then(()=>{

console.log("RiderX App Ready");

})
.catch((error)=>{

console.log("Service Worker Error",error);

});

});

}

</script>

</body>

</html>
