<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#FFD400"
    >

    <meta
        name="description"
        content="RiderX - Chandigarh Bike Taxi, Cab, Parcel and Food Delivery"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="RiderX"
    >

    <title>RiderX</title>

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background: #070707;
            color: #ffffff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        /* =====================================================
           SPLASH
        ===================================================== */

        .splash {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #070707;

            transition:
                opacity .35s ease,
                visibility .35s ease;
        }

        .splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-content {
            width: 100%;
            max-width: 360px;
            padding: 25px;

            text-align: center;
        }

        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            width: 88px;
            height: 88px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 25px;

            background: #FFD400;
            color: #080808;

            font-size: 29px;
            font-weight: 1000;

            box-shadow:
                0 15px 45px rgba(255, 212, 0, .16);

            animation:
                logoIn .65s ease both;
        }

        .brand {
            margin: 0;

            font-size: 31px;
            line-height: 1;

            font-weight: 1000;
            letter-spacing: -1px;

            animation:
                textIn .65s .08s ease both;
        }

        .brand span {
            color: #FFD400;
        }

        .tagline {
            margin: 10px 0 0;

            color: #777777;

            font-size: 10px;

            animation:
                textIn .65s .15s ease both;
        }

        /* =====================================================
           LOADER
        ===================================================== */

        .loader-wrap {
            margin-top: 32px;

            animation:
                textIn .65s .22s ease both;
        }

        .loader {
            width: 34px;
            height: 34px;

            margin: 0 auto;

            border: 3px solid #292929;
            border-top-color: #FFD400;

            border-radius: 50%;

            animation:
                spin .75s linear infinite;
        }

        .loading-text {
            margin-top: 11px;

            color: #555555;

            font-size: 8px;
        }

        .status {
            min-height: 15px;

            margin-top: 13px;

            color: #666666;

            font-size: 8px;
        }

        /* =====================================================
           ANIMATIONS
        ===================================================== */

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        @keyframes logoIn {

            from {
                opacity: 0;
                transform:
                    translateY(20px)
                    scale(.8);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }

        }

        @keyframes textIn {

            from {
                opacity: 0;
                transform:
                    translateY(10px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }

        }

        /* =====================================================
           FALLBACK
        ===================================================== */

        .fallback {
            display: none;

            position: fixed;
            inset: 0;

            z-index: 100000;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: #070707;
        }

        .fallback.show {
            display: flex;
        }

        .fallback-card {
            width: 100%;
            max-width: 390px;

            padding: 25px;

            border: 1px solid #292929;
            border-radius: 18px;

            background: #111111;

            text-align: center;
        }

        .fallback-card h2 {
            margin: 0 0 8px;

            font-size: 20px;
        }

        .fallback-card p {
            margin: 0;

            color: #777777;

            font-size: 11px;
            line-height: 1.6;
        }

        .fallback-btn {
            width: 100%;
            min-height: 48px;

            margin-top: 17px;

            border: 0;
            border-radius: 12px;

            background: #FFD400;
            color: #111111;

            cursor: pointer;

            font-size: 13px;
            font-weight: 800;
        }

        .fallback-btn:active {
            transform: scale(.98);
        }

    </style>

</head>


<body>

    <!-- =====================================================
         SPLASH
    ===================================================== -->

    <div
        class="splash"
        id="splash"
    >

        <div class="splash-content">

            <div class="logo">
                RX
            </div>

            <h1 class="brand">
                Rider<span>X</span>
            </h1>

            <p class="tagline">
                Your ride. Your journey. Your choice.
            </p>

            <div class="loader-wrap">

                <div class="loader"></div>

                <div class="loading-text">
                    Starting RiderX...
                </div>

                <div
                    class="status"
                    id="status"
                >
                    Preparing RiderX
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         FALLBACK
    ===================================================== -->

    <div
        class="fallback"
        id="fallback"
    >

        <div class="fallback-card">

            <h2>
                RiderX
            </h2>

            <p>
                We could not open the RiderX account screen
                automatically.
            </p>

            <button
                type="button"
                class="fallback-btn"
                id="fallbackBtn"
            >
                Continue to RiderX
            </button>

        </div>

    </div>


    <script>

        "use strict";


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const splash =
            document.getElementById("splash");

        const fallback =
            document.getElementById("fallback");

        const statusText =
            document.getElementById("status");

        const fallbackBtn =
            document.getElementById("fallbackBtn");


        let redirectStarted = false;


        /* =====================================================
           STATUS
        ===================================================== */

        function setStatus(text) {

            if (statusText) {

                statusText.textContent =
                    text;

            }

        }


        /* =====================================================
           SAFE JSON
        ===================================================== */

        function readJSON(key) {

            try {

                const raw =
                    localStorage.getItem(key);

                if (!raw) {
                    return null;
                }

                const parsed =
                    JSON.parse(raw);

                if (
                    parsed &&
                    typeof parsed === "object"
                ) {

                    return parsed;

                }

            } catch (error) {

                console.warn(
                    "RiderX invalid storage:",
                    key
                );

            }

            return null;

        }


        /* =====================================================
           GET SAVED USER
        ===================================================== */

        function getStoredUser() {

            const keys = [

                "riderx_user",
                "riderx_customer",
                "riderx_rider"

            ];

            for (
                const key of keys
            ) {

                const user =
                    readJSON(key);

                if (
                    user &&
                    typeof user === "object"
                ) {

                    return user;

                }

            }

            return null;

        }


        /* =====================================================
           NORMALIZE ROLE
        ===================================================== */

        function normalizeRole(role) {

            const value =
                String(role || "")
                    .trim()
                    .toLowerCase();

            if (value === "driver") {
                return "rider";
            }

            if (
                value === "customer" ||
                value === "rider" ||
                value === "admin"
            ) {

                return value;

            }

            return "";

        }


        /* =====================================================
           GET USER ROLE
        ===================================================== */

        function getUserRole(user) {

            if (
                user &&
                user.role
            ) {

                const role =
                    normalizeRole(user.role);

                if (role) {
                    return role;
                }

            }


            const userRole =
                normalizeRole(
                    localStorage.getItem("userRole")
                );

            if (userRole) {
                return userRole;
            }


            return "";

        }


        /* =====================================================
           CHECK ACTIVE SESSION
        ===================================================== */

        function hasValidSession(user) {

            if (!user) {
                return false;
            }


            const status =
                String(
                    user.status || ""
                )
                .trim()
                .toLowerCase();


            if (
                status === "blocked" ||
                status === "suspended" ||
                status === "disabled"
            ) {

                return false;

            }


            /*
             * Do not treat an old selected role
             * as a logged-in session.
             */

            const loggedFlags = [

                user.loggedIn,
                user.isLoggedIn,
                user.authenticated

            ];


            /*
             * If any explicit login flag exists,
             * respect it.
             */

            for (
                const flag of loggedFlags
            ) {

                if (
                    typeof flag === "boolean"
                ) {

                    return flag;

                }

            }


            /*
             * Existing stored user is considered
             * an active session for compatibility
             * with the current RiderX project.
             */

            return true;

        }


        /* =====================================================
           DESTINATION
        ===================================================== */

        function getDestination() {

            const user =
                getStoredUser();

            const role =
                getUserRole(user);


            /*
             * Only redirect to dashboard when
             * there is a real stored user.
             */

            if (
                user &&
                hasValidSession(user)
            ) {

                if (
                    role === "admin"
                ) {

                    return "./admin/dashboard.html";

                }


                if (
                    role === "rider"
                ) {

                    return "./rider/home.html";

                }


                if (
                    role === "customer"
                ) {

                    return "./customer/home.html";

                }

            }


            /*
             * New users always go to
             * Customer/Rider selection.
             */

            return "./auth/role.html";

        }


        /* =====================================================
           CHECK PAGE
        ===================================================== */

        function pageExistsPath(path) {

            return (
                typeof path === "string" &&
                path.length > 0
            );

        }


        /* =====================================================
           REDIRECT
        ===================================================== */

        function redirectToRiderX() {

            if (redirectStarted) {
                return;
            }

            redirectStarted = true;


            const destination =
                getDestination();


            if (
                !pageExistsPath(destination)
            ) {

                showFallback();

                return;

            }


            setStatus(
                "Opening RiderX..."
            );


            /*
             * Small delay allows the splash
             * animation to complete cleanly.
             */

            window.setTimeout(
                function () {

                    window.location.replace(
                        destination
                    );

                },
                250
            );

        }


        /* =====================================================
           FALLBACK
        ===================================================== */

        function showFallback() {

            if (splash) {

                splash.classList.add(
                    "hide"
                );

            }

            if (fallback) {

                fallback.classList.add(
                    "show"
                );

            }

        }


        /* =====================================================
           MANUAL CONTINUE
        ===================================================== */

        if (fallbackBtn) {

            fallbackBtn.addEventListener(
                "click",
                function () {

                    window.location.href =
                        "./auth/role.html";

                }
            );

        }


        /* =====================================================
           GLOBAL ERROR HANDLING
        ===================================================== */

        window.addEventListener(
            "error",
            function (event) {

                console.error(
                    "RiderX startup error:",
                    event.error || event.message
                );

                /*
                 * Do not leave the user stuck
                 * on an infinite splash.
                 */

                if (!redirectStarted) {

                    showFallback();

                }

            }
        );


        window.addEventListener(
            "unhandledrejection",
            function (event) {

                console.error(
                    "RiderX startup rejection:",
                    event.reason
                );

                if (!redirectStarted) {

                    showFallback();

                }

            }
        );


        /* =====================================================
           SERVICE WORKER
        ===================================================== */

        /*
         * Service worker failure must NEVER
         * block RiderX navigation.
         */

        if (
            "serviceWorker" in navigator
        ) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker
                        .register("./sw.js")
                        .then(
                            function () {

                                console.log(
                                    "RiderX service worker ready."
                                );

                            }
                        )
                        .catch(
                            function (error) {

                                console.warn(
                                    "Service worker registration failed:",
                                    error
                                );

                            }
                        );

                }
            );

        }


        /* =====================================================
           START RIDERX
        ===================================================== */

        function startRiderX() {

            setStatus(
                "Preparing account selection"
            );


            /*
             * Give the browser enough time
             * to initialize localStorage and
             * the page itself.
             */

            window.setTimeout(
                function () {

                    const user =
                        getStoredUser();


                    if (
                        user &&
                        hasValidSession(user)
                    ) {

                        setStatus(
                            "Restoring your RiderX account"
                        );

                    } else {

                        setStatus(
                            "Opening Customer / Rider"
                        );

                    }


                    window.setTimeout(
                        redirectToRiderX,
                        300
                    );

                },
                300
            );

        }


        /* =====================================================
           START
        ===================================================== */

        startRiderX();

    </script>

</body>

</html>
