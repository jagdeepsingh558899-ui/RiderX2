<title>RiderX</title><!-- =======================================================
     PWA
======================================================= --><link
    rel="manifest"
    href="./manifest.json"
><!-- =======================================================
     MAIN CSS
======================================================= --><link
    rel="stylesheet"
    href="./css/style.css"
><!-- =======================================================
     APPLE ICON
======================================================= --><link
    rel="apple-touch-icon"
    href="./assets/logo.png"
><!-- =======================================================
     FAVICON
======================================================= --><link
    rel="icon"
    type="image/png"
    href="./assets/logo.png"
><style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}


html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}


body{
    overflow:hidden;

    background:#070707;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   SPLASH
========================================================= */

.splash{

    position:fixed;
    inset:0;

    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#070707;

    transition:
        opacity .35s ease,
        visibility .35s ease;

}


.splash.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;

}


/* =========================================================
   SPLASH CONTENT
========================================================= */

.splash-content{

    width:100%;
    max-width:360px;

    padding:25px;

    text-align:center;

}


/* =========================================================
   RIDERX LOGO
========================================================= */

.logo{

    position:relative;

    width:96px;
    height:96px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:25px;

    background:#FFD400;

    box-shadow:
        0 15px 45px rgba(255,212,0,.16);

    animation:
        logoIn .65s ease both;

}


/*
 * Actual RiderX logo image.
 *
 * File:
 * assets/logo.png
 */

.logo img{

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    padding:5px;

}


/*
 * If logo.png cannot be loaded,
 * RX text will be displayed.
 */

.logo-fallback{

    display:none;

    align-items:center;
    justify-content:center;

    width:100%;
    height:100%;

    color:#080808;

    font-size:29px;
    font-weight:1000;

}


/* =========================================================
   BRAND
========================================================= */

.brand{

    margin:0;

    font-size:31px;
    line-height:1;

    font-weight:1000;

    letter-spacing:-1px;

    animation:
        textIn .65s .08s ease both;

}


.brand span{

    color:#FFD400;

}


/* =========================================================
   TAGLINE
========================================================= */

.tagline{

    margin:10px 0 0;

    color:#777;

    font-size:10px;

    animation:
        textIn .65s .15s ease both;

}


/* =========================================================
   LOADER
========================================================= */

.loader-wrap{

    margin-top:32px;

    animation:
        textIn .65s .22s ease both;

}


.loader{

    width:34px;
    height:34px;

    margin:0 auto;

    border:3px solid #292929;

    border-top-color:#FFD400;

    border-radius:50%;

    animation:
        spin .75s linear infinite;

}


.loading-text{

    margin-top:11px;

    color:#555;

    font-size:8px;

}


.status{

    min-height:15px;

    margin-top:13px;

    color:#666;

    font-size:8px;

}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes spin{

    to{

        transform:
            rotate(360deg);

    }

}


@keyframes logoIn{

    from{

        opacity:0;

        transform:
            translateY(20px)
            scale(.8);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes textIn{

    from{

        opacity:0;

        transform:
            translateY(10px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   FALLBACK
========================================================= */

.fallback{

    display:none;

    position:fixed;
    inset:0;

    z-index:100000;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:#070707;

}


.fallback.show{

    display:flex;

}


.fallback-card{

    width:100%;
    max-width:390px;

    padding:25px;

    border:1px solid #292929;

    border-radius:18px;

    background:#111;

    text-align:center;

}


.fallback-card h2{

    margin:0 0 8px;

    font-size:20px;

}


.fallback-card p{

    margin:0;

    color:#777;

    font-size:11px;

    line-height:1.6;

}


.fallback-btn{

    width:100%;
    min-height:48px;

    margin-top:17px;

    border:0;

    border-radius:12px;

    background:#FFD400;

    color:#111;

    cursor:pointer;

    font-size:13px;

    font-weight:800;

}


.fallback-btn:active{

    transform:scale(.98);

}


/* =========================================================
   SMALL SCREENS
========================================================= */

@media(max-height:600px){

    .logo{

        width:76px;
        height:76px;

        margin-bottom:14px;

        border-radius:20px;

    }


    .brand{

        font-size:27px;

    }


    .loader-wrap{

        margin-top:22px;

    }

}

</style></head><body><!-- =======================================================
     RIDERX SPLASH SCREEN
======================================================= --><div
    class="splash"
    id="splash"
><div class="splash-content">


    <!-- =================================================
         REAL RIDERX LOGO
    ================================================== -->

    <div
        class="logo"
        id="logoBox"
    >

        <img
            id="riderxLogo"
            src="./assets/logo.png"
            alt="RiderX"
            draggable="false"
        >

        <div
            class="logo-fallback"
            id="logoFallback"
        >
            RX
        </div>

    </div>


    <!-- =================================================
         BRAND
    ================================================== -->

    <h1 class="brand">
        Rider<span>X</span>
    </h1>


    <!-- =================================================
         TAGLINE
    ================================================== -->

    <p class="tagline">
        Your ride. Your journey. Your choice.
    </p>


    <!-- =================================================
         LOADING
    ================================================== -->

    <div class="loader-wrap">

        <div class="loader"></div>

        <div class="loading-text">
            Starting RiderX...
        </div>

        <div
            class="status"
            id="status"
        >
            Preparing RiderX
        </div>

    </div>

</div>

</div><!-- =======================================================
     STARTUP FALLBACK
======================================================= --><div
    class="fallback"
    id="fallback"
><div class="fallback-card">

    <h2>
        RiderX
    </h2>

    <p>
        We could not open the RiderX account screen
        automatically.
    </p>

    <button
        type="button"
        class="fallback-btn"
        id="fallbackBtn"
    >
        Continue to RiderX
    </button>

</div>

</div><script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const splash =
    document.getElementById(
        "splash"
    );


const fallback =
    document.getElementById(
        "fallback"
    );


const statusText =
    document.getElementById(
        "status"
    );


const fallbackBtn =
    document.getElementById(
        "fallbackBtn"
    );


const riderxLogo =
    document.getElementById(
        "riderxLogo"
    );


const logoFallback =
    document.getElementById(
        "logoFallback"
    );


let redirectStarted =
    false;


/* =========================================================
   LOGO ERROR FALLBACK
========================================================= */

if(riderxLogo){

    riderxLogo.addEventListener(
        "error",
        function(){

            console.warn(
                "RiderX logo.png could not be loaded."
            );


            riderxLogo.style.display =
                "none";


            if(logoFallback){

                logoFallback.style.display =
                    "flex";

            }

        }
    );


    riderxLogo.addEventListener(
        "load",
        function(){

            console.log(
                "RiderX logo loaded successfully."
            );

        }
    );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text
){

    if(statusText){

        statusText.textContent =
            text;

    }

}


/* =========================================================
   READ JSON
========================================================= */

function readJSON(
    key
){

    try{

        const raw =
            localStorage.getItem(
                key
            );


        if(!raw){

            return null;

        }


        const parsed =
            JSON.parse(
                raw
            );


        if(
            parsed &&
            typeof parsed ===
            "object"
        ){

            return parsed;

        }

    }catch(error){

        console.warn(
            "RiderX storage read failed:",
            key,
            error
        );

    }


    return null;

}


/* =========================================================
   AUTHENTICATED USER
========================================================= */

function getAuthenticatedUser(){

    const user =
        readJSON(
            "riderx_user"
        );


    if(
        !user ||
        typeof user !==
        "object"
    ){

        return null;

    }


    const loggedIn =
        user.loggedIn === true;


    const authenticated =
        user.authenticated === true;


    if(
        !loggedIn &&
        !authenticated
    ){

        return null;

    }


    const status =
        String(
            user.status ||
            "active"
        )
        .trim()
        .toLowerCase();


    if(
        [
            "blocked",
            "suspended",
            "disabled"
        ].includes(
            status
        )
    ){

        return null;

    }


    const role =
        normalizeRole(
            user.role
        );


    if(
        ![
            "customer",
            "rider",
            "admin"
        ].includes(
            role
        )
    ){

        return null;

    }


    return user;

}


/* =========================================================
   NORMALIZE ROLE
========================================================= */

function normalizeRole(
    role
){

    const value =
        String(
            role || ""
        )
        .trim()
        .toLowerCase();


    if(
        value ===
        "driver"
    ){

        return "rider";

    }


    if(
        value ===
        "superadmin" ||
        value ===
        "super_admin"
    ){

        return "admin";

    }


    if(
        [
            "customer",
            "rider",
            "admin"
        ].includes(
            value
        )
    ){

        return value;

    }


    return "";

}


/* =========================================================
   DESTINATION
========================================================= */

function getDestination(){

    const user =
        getAuthenticatedUser();


    /*
     * No valid local session:
     * open role selection.
     */

    if(!user){

        return "./auth/role.html";

    }


    const role =
        normalizeRole(
            user.role
        );


    if(
        role ===
        "admin"
    ){

        return "./admin/dashboard.html";

    }


    if(
        role ===
        "rider"
    ){

        return "./rider/home.html";

    }


    if(
        role ===
        "customer"
    ){

        return "./customer/home.html";

    }


    return "./auth/role.html";

}


/* =========================================================
   REDIRECT
========================================================= */

function redirectToRiderX(){

    if(redirectStarted){

        return;

    }


    redirectStarted =
        true;


    const destination =
        getDestination();


    setStatus(

        destination ===
        "./auth/role.html"

            ? "Opening account selection..."

            : "Restoring your RiderX account..."

    );


    window.setTimeout(
        function(){

            window.location.replace(
                destination
            );

        },
        250
    );

}


/* =========================================================
   FALLBACK
========================================================= */

function showFallback(){

    if(splash){

        splash.classList.add(
            "hide"
        );

    }


    if(fallback){

        fallback.classList.add(
            "show"
        );

    }

}


/* =========================================================
   MANUAL CONTINUE
========================================================= */

if(fallbackBtn){

    fallbackBtn.addEventListener(
        "click",
        function(){

            window.location.replace(
                "./auth/role.html"
            );

        }
    );

}


/* =========================================================
   GLOBAL ERROR HANDLING
========================================================= */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "RiderX startup error:",
            event.error ||
            event.message
        );


        if(!redirectStarted){

            showFallback();

        }

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "RiderX startup rejection:",
            event.reason
        );


        if(!redirectStarted){

            showFallback();

        }

    }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
    "serviceWorker" in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register(
                    "./sw.js"
                )
                .then(
                    function(){

                        console.log(
                            "RiderX service worker ready."
                        );

                    }
                )
                .catch(
                    function(error){

                        console.warn(
                            "Service worker registration failed:",
                            error
                        );

                    }
                );

        }
    );

}


/* =========================================================
   START
========================================================= */

function startRiderX(){

    setStatus(
        "Checking RiderX session..."
    );


    window.setTimeout(
        function(){

            const user =
                getAuthenticatedUser();


            if(user){

                setStatus(
                    "Restoring your RiderX account..."
                );

            }else{

                setStatus(
                    "Opening Customer / Rider..."
                );

            }


            window.setTimeout(
                redirectToRiderX,
                300
            );

        },
        350
    );

}


/* =========================================================
   START RIDERX
========================================================= */

startRiderX();

</script></body></html>
