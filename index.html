<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5c400"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="RiderX"
    >

    <meta
        name="description"
        content="RiderX - Bike,Taxi,Cab,Parcel and Delivery"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        href="./assets/logo.png"
    >

    <title>RiderX</title>

    <style>
        :root {
            --rx-yellow: #f5c400;
            --rx-yellow-dark: #d9a900;
            --rx-black: #070707;
            --rx-card: #111111;
            --rx-text: #ffffff;
            --rx-muted: #a7a7a7;
            --rx-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(245, 196, 0, 0.12),
                    transparent 38%
                ),
                var(--rx-black);
            color: var(--rx-text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        #riderx-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(245, 196, 0, 0.10),
                    transparent 42%
                ),
                #050505;

            transition:
                opacity 0.35s ease,
                visibility 0.35s ease;
        }

        #riderx-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            width: min(90vw, 360px);
            text-align: center;
        }

        .logo-wrap {
            width: 92px;
            height: 92px;
            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid rgba(245, 196, 0, 0.35);
            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #090909
                );

            box-shadow:
                0 0 0 8px rgba(245, 196, 0, 0.03),
                0 20px 60px rgba(0, 0, 0, 0.55);
        }

        .logo-wrap img {
            width: 68px;
            height: 68px;
            object-fit: contain;
            border-radius: 18px;
        }

        .brand {
            font-size: 34px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .brand span {
            color: var(--rx-yellow);
        }

        .tagline {
            margin-top: 10px;
            color: var(--rx-muted);
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        .progress {
            width: 150px;
            height: 4px;
            margin: 28px auto 0;

            overflow: hidden;

            border-radius: 99px;
            background: rgba(255, 255, 255, 0.08);
        }

        .progress::after {
            content: "";

            display: block;

            width: 45%;
            height: 100%;

            border-radius: inherit;
            background: var(--rx-yellow);

            animation:
                rx-progress 1.15s ease-in-out infinite;
        }

        .status {
            min-height: 18px;
            margin-top: 14px;

            color: #858585;
            font-size: 11px;
        }

        .fallback {
            display: none;
            margin-top: 24px;
        }

        .fallback.visible {
            display: block;
        }

        .fallback button {
            border: 0;
            border-radius: 12px;

            padding: 12px 20px;

            background: var(--rx-yellow);
            color: #080808;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
        }

        @keyframes rx-progress {
            0% {
                transform: translateX(-180%);
            }

            50% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(350%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .progress::after {
                animation: none;
            }

            #riderx-loader {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main
        id="riderx-loader"
        aria-label="RiderX loading"
    >

        <div class="loader-content">

            <div class="logo-wrap">
                <img
                    src="./assets/logo.png"
                    alt="RiderX"
                    onerror="this.style.display='none';"
                >
            </div>

            <div class="brand">
                Rider<span>X</span>
            </div>

            <div class="tagline">
                Ride. Deliver. Move.
            </div>

            <div
                id="riderx-status"
                class="status"
                aria-live="polite"
            >
                Starting RiderX...
            </div>

            <div
                class="progress"
                aria-hidden="true"
            ></div>

            <div
                id="riderx-fallback"
                class="fallback"
            >
                <button
                    id="riderx-retry"
                    type="button"
                >
                    Continue
                </button>
            </div>

        </div>

    </main>


    <script type="module">

        /* =====================================================
           RIDERX ENTRY ROUTER
        ===================================================== */

        "use strict";


        /* =====================================================
           FIREBASE
        ===================================================== */

        import {
            auth,
            db,
            onAuthStateChanged,
            doc,
            getDoc
        } from "./firebase/firebase-config.js";


        /* =====================================================
           DOM
        ===================================================== */

        const loader =
            document.getElementById(
                "riderx-loader"
            );

        const statusElement =
            document.getElementById(
                "riderx-status"
            );

        const fallback =
            document.getElementById(
                "riderx-fallback"
            );

        const retryButton =
            document.getElementById(
                "riderx-retry"
            );


        /* =====================================================
           CONSTANTS
        ===================================================== */

        const REDIRECT_TIMEOUT =
            15000;

        const ROUTES = Object.freeze({

            auth:
                "./auth/role.html",

            customer:
                "./customer/home.html",

            rider:
                "./rider/home.html",

            admin:
                "./admin/dashboard.html"

        });


        /* =====================================================
           STATUS
        ===================================================== */

        function setStatus(
            message
        ) {

            if (
                statusElement
            ) {

                statusElement.textContent =
                    message;

            }

        }


        /* =====================================================
           LOADER
        ===================================================== */

        function hideLoader() {

            if (
                loader
            ) {

                loader.classList.add(
                    "hidden"
                );

            }

        }


        function showFallback() {

            if (
                fallback
            ) {

                fallback.classList.add(
                    "visible"
                );

            }

        }


        /* =====================================================
           SAFE REDIRECT
        ===================================================== */

        function redirectTo(
            path
        ) {

            if (
                !path
            ) {

                return;

            }


            window.location.replace(
                path
            );

        }


        /* =====================================================
           ROLE NORMALIZATION
        ===================================================== */

        function normalizeRole(
            value
        ) {

            if (
                typeof value !== "string"
            ) {

                return "";

            }


            const role =
                value
                    .trim()
                    .toLowerCase();


            if (
                [
                    "admin",
                    "administrator",
                    "superadmin"
                ].includes(role)
            ) {

                return "admin";

            }


            if (
                [
                    "rider",
                    "driver",
                    "captain"
                ].includes(role)
            ) {

                return "rider";

            }


            if (
                [
                    "customer",
                    "user",
                    "passenger"
                ].includes(role)
            ) {

                return "customer";

            }


            return "";

        }


        /* =====================================================
           GET ROLE FROM FIRESTORE
        ===================================================== */

        async function getUserRole(
            user
        ) {

            if (
                !user
                ||
                !user.uid
            ) {

                return "";

            }


            try {

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const snapshot =
                    await getDoc(
                        userRef
                    );


                if (
                    !snapshot.exists()
                ) {

                    return "";

                }


                const data =
                    snapshot.data() || {};


                /*
                 * Role priority:
                 *
                 * role
                 * userRole
                 * accountType
                 * userType
                 */

                return (
                    normalizeRole(
                        data.role
                    )

                    ||

                    normalizeRole(
                        data.userRole
                    )

                    ||

                    normalizeRole(
                        data.accountType
                    )

                    ||

                    normalizeRole(
                        data.userType
                    )
                );

            } catch (error) {

                console.error(
                    "RiderX: unable to read user role.",
                    error
                );

                return "";

            }

        }


        /* =====================================================
           RIDER APPROVAL CHECK
        ===================================================== */

        async function isRiderAllowed(
            user
        ) {

            if (
                !user
                ||
                !user.uid
            ) {

                return false;

            }


            try {

                const riderRef =
                    doc(
                        db,
                        "riders",
                        user.uid
                    );


                const snapshot =
                    await getDoc(
                        riderRef
                    );


                /*
                 * No rider profile means the account is not
                 * ready for rider dashboard.
                 */

                if (
                    !snapshot.exists()
                ) {

                    return false;

                }


                const data =
                    snapshot.data() || {};


                if (
                    data.disabled === true
                    ||
                    data.blocked === true
                    ||
                    data.suspended === true
                ) {

                    return false;

                }


                return (
                    data.approved === true

                    ||

                    data.isApproved === true

                    ||

                    data.adminApproved === true

                    ||

                    data.approvalStatus === "approved"

                    ||

                    data.status === "approved"

                    ||

                    data.riderStatus === "approved"
                );

            } catch (error) {

                console.error(
                    "RiderX: rider approval check failed.",
                    error
                );

                return false;

            }

        }


        /* =====================================================
           CLEAN OLD SESSION FLAGS
           -----------------------------------------------------
           These values are NOT trusted for authentication.
           They are removed so stale role/session data cannot
           bypass Firebase Auth.
        ===================================================== */

        function cleanLegacySession() {

            const legacyKeys = [

                "riderx_user",

                "riderx_customer",

                "riderx_rider",

                "riderx_role",

                "riderx_selected_role",

                "riderx_customer_id",

                "riderx_rider_id",

                "riderx_uid"

            ];


            /*
             * Do not blindly remove active ride/booking data.
             *
             * Those keys can be useful after a valid login.
             */

            for (
                const key of legacyKeys
            ) {

                try {

                    localStorage.removeItem(
                        key
                    );

                } catch (error) {

                    /*
                     * Ignore storage errors.
                     */

                }

            }

        }


        /* =====================================================
           STORE NON-AUTH SESSION INFO
        ===================================================== */

        function storeSessionInfo(
            user,
            role
        ) {

            try {

                const session =
                    {

                        uid:
                            user.uid,

                        role,

                        email:
                            user.email || "",

                        displayName:
                            user.displayName || "",

                        photoURL:
                            user.photoURL || "",

                        updatedAt:
                            Date.now()

                    };


                /*
                 * This is only a UI/session cache.
                 *
                 * Firebase Auth remains the authority.
                 */

                localStorage.setItem(
                    "riderx_session",
                    JSON.stringify(
                        session
                    )
                );


                /*
                 * Keep role-specific identifiers for
                 * compatibility with existing RiderX modules.
                 */

                if (
                    role === "customer"
                ) {

                    localStorage.setItem(
                        "riderx_customer_id",
                        user.uid
                    );

                }


                if (
                    role === "rider"
                ) {

                    localStorage.setItem(
                        "riderx_rider_id",
                        user.uid
                    );

                }


                localStorage.setItem(
                    "riderx_uid",
                    user.uid
                );

                localStorage.setItem(
                    "riderx_role",
                    role
                );

            } catch (error) {

                console.warn(
                    "RiderX: session cache could not be saved.",
                    error
                );

            }

        }


        /* =====================================================
           REGISTER SERVICE WORKER
        ===================================================== */

        async function registerServiceWorker() {

            if (
                !("serviceWorker" in navigator)
            ) {

                return null;

            }


            try {

                return await navigator.serviceWorker
                    .register(
                        "./sw.js",
                        {
                            scope: "./"
                        }
                    );

            } catch (error) {

                console.warn(
                    "RiderX: service worker registration failed.",
                    error
                );

                return null;

            }

        }


        /* =====================================================
           ROUTE AUTHENTICATED USER
        ===================================================== */

        async function routeAuthenticatedUser(
            user
        ) {

            setStatus(
                "Checking your RiderX account..."
            );


            const role =
                await getUserRole(
                    user
                );


            /*
             * No Firestore role:
             *
             * Do NOT trust localStorage.
             * Send user to role selection.
             */

            if (
                !role
            ) {

                cleanLegacySession();

                setStatus(
                    "Account setup required..."
                );


                setTimeout(
                    function () {

                        redirectTo(
                            ROUTES.auth
                        );

                    },
                    250
                );


                return;

            }


            /*
             * Admin.
             */

            if (
                role === "admin"
            ) {

                storeSessionInfo(
                    user,
                    role
                );


                setStatus(
                    "Opening admin dashboard..."
                );


                setTimeout(
                    function () {

                        redirectTo(
                            ROUTES.admin
                        );

                    },
                    150
                );


                return;

            }


            /*
             * Rider.
             */

            if (
                role === "rider"
            ) {

                const approved =
                    await isRiderAllowed(
                        user
                    );


                storeSessionInfo(
                    user,
                    role
                );


                if (
                    approved
                ) {

                    setStatus(
                        "Opening rider dashboard..."
                    );


                    setTimeout(
                        function () {

                            redirectTo(
                                ROUTES.rider
                            );

                        },
                        150
                    );

                } else {

                    /*
                     * Keep rider account authenticated,
                     * but do not allow an unapproved rider
                     * into the operational dashboard.
                     *
                     * Use existing registration/login route
                     * rather than inventing rider/rejected.html.
                     */

                    setStatus(
                        "Rider account is awaiting approval..."
                    );


                    setTimeout(
                        function () {

                            redirectTo(
                                "./rider/pending.html"
                            );

                        },
                        250
                    );

                }


                return;

            }


            /*
             * Customer.
             */

            if (
                role === "customer"
            ) {

                storeSessionInfo(
                    user,
                    role
                );


                setStatus(
                    "Opening customer dashboard..."
                );


                setTimeout(
                    function () {

                        redirectTo(
                            ROUTES.customer
                        );

                    },
                    150
                );


                return;

            }


            /*
             * Unknown role.
             */

            cleanLegacySession();

            setStatus(
                "Please select your account type..."
            );


            setTimeout(
                function () {

                    redirectTo(
                        ROUTES.auth
                    );

                },
                250
            );

        }


        /* =====================================================
           ROUTE UNAUTHENTICATED USER
        ===================================================== */

        function routeUnauthenticatedUser() {

            cleanLegacySession();

            setStatus(
                "Welcome to RiderX..."
            );


            setTimeout(
                function () {

                    redirectTo(
                        ROUTES.auth
                    );

                },
                250
            );

        }


        /* =====================================================
           AUTH STATE
        ===================================================== */

        let authResolved =
            false;

        let routingStarted =
            false;


        async function handleAuthState(
            user
        ) {

            if (
                routingStarted
            ) {

                return;

            }


            routingStarted =
                true;


            try {

                authResolved =
                    true;


                if (
                    user
                ) {

                    await routeAuthenticatedUser(
                        user
                    );

                } else {

                    routeUnauthenticatedUser();

                }

            } catch (error) {

                console.error(
                    "RiderX: entry routing failed.",
                    error
                );


                routingStarted =
                    false;


                setStatus(
                    "Unable to load RiderX. Please try again."
                );


                showFallback();

            }

        }


        /* =====================================================
           RETRY
        ===================================================== */

        if (
            retryButton
        ) {

            retryButton.addEventListener(
                "click",
                function () {

                    window.location.reload();

                }
            );

        }


        /* =====================================================
           STARTUP
        ===================================================== */

        (async function startRiderX() {

            setStatus(
                "Starting RiderX..."
            );


            /*
             * Register PWA service worker in parallel.
             * It must never block authentication routing.
             */

            registerServiceWorker();


            /*
             * Firebase Auth is the source of truth.
             */

            try {

                onAuthStateChanged(
                    auth,
                    handleAuthState
                );

            } catch (error) {

                console.error(
                    "RiderX: Firebase Auth listener failed.",
                    error
                );


                setStatus(
                    "Authentication service unavailable."
                );


                showFallback();

                return;

            }


            /*
             * Safety timeout.
             *
             * Do not redirect to a dashboard based on stale
             * localStorage if Firebase has not resolved.
             */

            setTimeout(
                function () {

                    if (
                        !authResolved
                        &&
                        !routingStarted
                    ) {

                        setStatus(
                            "Authentication is taking longer than expected."
                        );

                        showFallback();

                    }

                },
                REDIRECT_TIMEOUT
            );

        })();

    </script>

</body>
</html>
