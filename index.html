<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX</title>


<link rel="manifest" href="manifest.json">


<meta name="theme-color" content="#FFD600">


<link rel="stylesheet" href="css/style.css">


</head>


<body>





<div class="splash" id="splash">


<img

src="assets/logo.png"

class="splash-logo"

>


<div class="splash-title">

Rider<span>X</span>

</div>



<div class="loading">

<span></span>

</div>


</div>









<div class="container" style="display:none;" id="main">





<div class="logo">


<img src="assets/logo.png">


<h1>

Rider<span>X</span>

</h1>



<p>

Ride • Parcel • Food

</p>



</div>








<div class="card">


<h2>

Welcome to RiderX

</h2>


<p>

Your smart city ride and delivery app

</p>



<button

class="btn"

onclick="location.href='auth/login.html'">

Login

</button>




<button

class="btn-outline"

onclick="location.href='auth/register.html'">

Create Account

</button>



</div>








</div>










<script>


// Splash


window.onload=()=>{


setTimeout(()=>{


document.getElementById("splash")

.classList.add("hide");



document.getElementById("main")

.style.display="block";


},2000);



};








// Service Worker


if(

"serviceWorker" in navigator

){


window.addEventListener(

"load",

()=>{


navigator.serviceWorker.register(

"sw.js"

)

.then(()=>{


console.log(

"RiderX PWA Ready"

);


})


.catch((err)=>{


console.log(err);


});


});


}



</script>





</body>

</html>
