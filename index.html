<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX - Premium Ride</title>

<link rel="manifest" href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#111;
color:white;

}


.container{

min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;

}


.card{

width:100%;
max-width:420px;
background:#1d1d1d;
padding:35px;
border-radius:25px;
text-align:center;

}


.logo{

width:120px;
height:120px;

}


h1{

font-size:45px;
color:#ffcc00;
margin:15px 0;

}


p{

color:#ddd;
margin-bottom:25px;

}


.btn{

display:block;
padding:15px;
margin:12px 0;
border-radius:12px;
text-decoration:none;
font-weight:bold;

}


.login{

background:#ffcc00;
color:#000;

}


.register{

border:2px solid #ffcc00;
color:#ffcc00;

}



.services{

display:grid;
grid-template-columns:1fr 1fr;
gap:12px;

}


.service{

background:#111;
padding:15px;
border-radius:12px;

}


</style>


</head>


<body>



<div class="container">


<div class="card">



<img src="assets/logo.svg" class="logo">



<h1>

RiderX

</h1>



<p>

Your Premium Ride Partner

</p>



<a class="btn login" href="auth/login.html">

Login

</a>



<a class="btn register" href="auth/register.html">

Create Account

</a>




<div class="services">


<div class="service">

🏍 Bike Taxi

</div>


<div class="service">

🚕 Cab

</div>


<div class="service">

📦 Parcel

</div>


<div class="service">

🍔 Food

</div>


</div>



</div>


</div>




<script>


if("serviceWorker" in navigator){


navigator.serviceWorker.register("sw.js");


}


</script>



</body>

</html>
