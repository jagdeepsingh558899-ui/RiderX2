<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX - Move Faster</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#000000">


<link rel="stylesheet" href="assets/app.css">

<link rel="stylesheet" href="assets/animation.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#000;
color:white;
height:100vh;
overflow:hidden;

}



.splash{

position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:#000;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;

animation:hideSplash 3s forwards;

}



.logo-animation{

font-size:45px;
font-weight:900;
letter-spacing:3px;
animation:logoZoom 2s infinite;

}


.logo-animation span{

color:#FFD600;

}



@keyframes logoZoom{

0%{
transform:scale(.7);
opacity:0;
}

50%{
transform:scale(1.1);
opacity:1;
}

100%{
transform:scale(1);
}

}



@keyframes hideSplash{

0%,80%{
opacity:1;
}

100%{
opacity:0;
visibility:hidden;
}

}





.main{

height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:25px;

}



.brand{

font-size:42px;
font-weight:900;

}


.brand span{

color:#FFD600;

}



.tagline{

margin-top:15px;
color:#aaa;
text-align:center;

}



.buttons{

width:100%;
margin-top:50px;

}



.btn{

width:100%;
padding:17px;
margin:12px 0;
border-radius:15px;
border:none;
font-size:18px;
font-weight:bold;
cursor:pointer;

}



.customer{

background:#FFD600;
color:#000;

}



.rider{

background:#111;
border:2px solid #FFD600;
color:#FFD600;

}



.lang{

position:absolute;
top:25px;
right:20px;

}



.lang button{

background:#FFD600;
border:none;
padding:8px 15px;
border-radius:20px;
font-weight:bold;

}


.footer{

position:absolute;
bottom:30px;
color:#777;
font-size:13px;

}


</style>

</head>



<body>



<!-- SPLASH -->


<div class="splash">


<div class="logo-animation">

RID<span>ERX</span>

</div>


</div>






<!-- HOME -->


<div class="main">



<div class="lang">

<button id="languageBtn">

HI / EN

</button>

</div>




<div class="brand">

RID<span>ERX</span>

</div>



<p class="tagline">

India's Premium Bike Taxi, Cab, Parcel & Food Platform

</p>





<div class="buttons">


<button class="btn customer" onclick="joinCustomer()">

<i class="fa-solid fa-user"></i>

Join as Customer

</button>




<button class="btn rider" onclick="joinRider()">

<i class="fa-solid fa-motorcycle"></i>

Join as Rider

</button>



</div>






<div class="footer">

Fast • Safe • Reliable

</div>



</div>







<script>


function joinCustomer(){

window.location.href="auth/login.html?role=customer";

}



function joinRider(){

window.location.href="auth/login.html?role=rider";

}




document.getElementById("languageBtn").onclick=function(){

alert("Language Changed / भाषा बदली गई");

}



</script>





<script>


if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}


</script>



</body>

</html>
