<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>RiderX - Premium Ride Hailing</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="assets/app.css">

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

<div class="app-viewport">

<!-- HEADER -->
<header class="rx-header">

<div class="brand-logo">
<i class="fa-solid fa-bolt"></i>
RIDER<span>X</span>
</div>


<div class="header-actions">

<button id="langToggleBtn" class="btn-yellow">
HI / EN
</button>


<button id="userAuthBtn" class="rx-badge">
<i class="fa-solid fa-user"></i>
Login
</button>

</div>

</header>



<!-- MAP -->

<div id="map"></div>



<!-- BOOKING PANEL -->

<div class="bottom-sheet">


<div class="service-grid">


<div class="service-card active" data-service="bike">
<i class="fa-solid fa-motorcycle"></i>
<span id="txtBike">Bike Taxi</span>
</div>


<div class="service-card" data-service="cab">
<i class="fa-solid fa-car"></i>
<span id="txtCab">Cab Ride</span>
</div>


<div class="service-card" data-service="parcel">
<i class="fa-solid fa-box"></i>
<span id="txtParcel">Parcel</span>
</div>


<div class="service-card" data-service="food">
<i class="fa-solid fa-utensils"></i>
<span id="txtFood">Food</span>
</div>


</div>




<div class="location-inputs">


<div class="input-group">

<i class="fa-solid fa-circle-dot"></i>

<input 
id="pickupInput"
class="rx-input"
type="text"
placeholder="Pickup Location"
value="Chandigarh">

</div>



<div class="input-group">

<i class="fa-solid fa-location-dot"></i>

<input 
id="dropInput"
class="rx-input"
type="text"
placeholder="Where to go?">

</div>


</div>





<div class="fare-box">


<div>

<p id="txtFareEst">
Estimated Fare
</p>


<h3 id="fareDisplay">
₹ 0.00
</h3>


</div>



<select id="paymentMethod" class="rx-input">

<option value="cash">
💵 Cash
</option>

<option value="wallet">
💳 RiderX Wallet
</option>


<option value="online">
📱 UPI / Online
</option>


</select>


</div>






<button id="bookRideBtn" class="btn-yellow pulse-yellow">

<i class="fa-solid fa-paper-plane"></i>

<span id="txtBookNow">
Book Ride Now
</span>

</button>



</div>

</div>





<!-- LOGIN MODAL -->


<div id="authModal" class="modal-overlay">


<div class="modal-card">


<h2 id="txtAuthTitle">
Login to RiderX
</h2>



<input 
id="authEmail"
class="rx-input"
type="email"
placeholder="Email Address">



<input 
id="authPassword"
class="rx-input"
type="password"
placeholder="Password">



<button id="loginSubmitBtn" class="btn-yellow">
Login
</button>



<button id="registerSubmitBtn" class="btn-yellow btn-secondary">
Create Account
</button>



<button id="closeAuthBtn" class="close-btn">
Cancel
</button>



</div>

</div>







<!-- RIDE TRACKING -->


<div id="trackingModal" class="modal-overlay">


<div class="modal-card tracking-card">


<i class="fa-solid fa-spinner fa-spin loader"></i>



<h3 id="rideStatusText">
Searching Nearby Riders...
</h3>



<p id="rideSubText">
Connecting you to nearest rider.
</p>




<div id="driverDetails" class="driver-box">


<h4 id="driverName">
Driver Name
</h4>



<p id="driverVehicle">
Vehicle Details
</p>



<p>
Start OTP:
<strong id="otpCode">
0000
</strong>
</p>



</div>





<button id="cancelRideBtn" class="btn-yellow btn-secondary">
Cancel Ride
</button>




</div>

</div>





<!-- SCRIPTS -->


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="customer/js/customer.js"></script>



<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register("./sw.js")
.then(()=>{
console.log("RiderX App Ready");
})
.catch(err=>{
console.log("SW Error",err);
});

});

}

</script>



</body>
</html>
