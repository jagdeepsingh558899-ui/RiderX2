*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#070707;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.splash{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#070707;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

.splash.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.splash-content{
    width:100%;
    max-width:360px;
    padding:25px;
    text-align:center;
}

.logo{
    position:relative;

    width:96px;
    height:96px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:25px;

    background:#FFD400;

    box-shadow:
        0 15px 45px rgba(255,212,0,.16);

    animation:
        logoIn .65s ease both;
}

.logo img{
    display:block;

    width:100%;
    height:100%;

    object-fit:contain;
    padding:5px;
}

.logo-fallback{
    display:none;

    align-items:center;
    justify-content:center;

    width:100%;
    height:100%;

    color:#080808;

    font-size:29px;
    font-weight:1000;
}

.brand{
    margin:0;

    font-size:31px;
    line-height:1;

    font-weight:1000;
    letter-spacing:-1px;

    animation:
        textIn .65s .08s ease both;
}

.brand span{
    color:#FFD400;
}

.tagline{
    margin:10px 0 0;

    color:#777;

    font-size:10px;

    animation:
        textIn .65s .15s ease both;
}

.loader-wrap{
    margin-top:32px;

    animation:
        textIn .65s .22s ease both;
}

.loader{
    width:34px;
    height:34px;

    margin:0 auto;

    border:3px solid #292929;
    border-top-color:#FFD400;

    border-radius:50%;

    animation:
        spin .75s linear infinite;
}

.loading-text{
    margin-top:11px;

    color:#555;
    font-size:8px;
}

.status{
    min-height:15px;

    margin-top:13px;

    color:#666;
    font-size:8px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes logoIn{

    from{
        opacity:0;
        transform:
            translateY(20px)
            scale(.8);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

@keyframes textIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.fallback{
    display:none;

    position:fixed;
    inset:0;

    z-index:100000;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:#070707;
}

.fallback.show{
    display:flex;
}

.fallback-card{
    width:100%;
    max-width:390px;

    padding:25px;

    border:1px solid #292929;
    border-radius:18px;

    background:#111;

    text-align:center;
}

.fallback-card h2{
    margin:0 0 8px;
    font-size:20px;
}

.fallback-card p{
    margin:0;

    color:#777;

    font-size:11px;
    line-height:1.6;
}

.fallback-btn{
    width:100%;
    min-height:48px;

    margin-top:17px;

    border:0;
    border-radius:12px;

    background:#FFD400;
    color:#111;

    cursor:pointer;

    font-size:13px;
    font-weight:800;
}

.fallback-btn:active{
    transform:scale(.98);
}

@media(max-height:600px){

    .logo{
        width:76px;
        height:76px;

        margin-bottom:14px;
        border-radius:20px;
    }

    .brand{
        font-size:27px;

    .loader-wrap{

</style></head><body><div
    class="splash"
    id="splash"
><div class="splash-content">

    <div

</div>

</div><div
    class="fallback"
    id="fallback"
><div class="fallback-card">

    <h2>
        RiderX
    </h2>

    <p>
        We could not open the RiderX account screen automatically.
    </p>

    <button
        type="button"
        class="fallback-btn"
        id="fallbackBtn"
    >
        Continue to RiderX
    </button>

</div>

</div><script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const splash =
    document.getElementById("splash");

const fallback =
    document.getElementById("fallback");

const statusText =
    document.getElementById("status");

const fallbackBtn =
    document.getElementById("fallbackBtn");

const riderxLogo =
    document.getElementById("riderxLogo");

const logoFallback =
    document.getElementById("logoFallback");


let redirectStarted = false;


/* =========================================================
   LOGO FALLBACK
========================================================= */

if(riderxLogo){

    riderxLogo.addEventListener(
        "error",
        function(){

            riderxLogo.style.display = "none";

            if(logoFallback){
                logoFallback.style.display = "flex";
            }

        }
    );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

    if(statusText){
        statusText.textContent = text || "";
    }

}


/* =========================================================
   SAFE STORAGE
========================================================= */

function readJSON(key){

    try{

        const raw =
            localStorage.getItem(key);

        if(!raw){
            return null;
        }

        const parsed =
            JSON.parse(raw);

        if(
            parsed &&
            typeof parsed === "object"
        ){
            return parsed;
        }

    }catch(error){

        console.warn(
            "RiderX storage read failed:",
            key,
            error
        );

    }

    return null;

}


/* =========================================================
   ROLE NORMALIZATION
========================================================= */

function normalizeRole(role){

    const value =
        String(role || "")
            .trim()
            .toLowerCase()
            .replace(
                /[\s-]+/g,
                "_"
            );

    if(
        [
            "customer",
            "user",
            "users"
        ].includes(value)
    ){
        return "customer";
    }

    if(
        [
            "rider",
            "driver",
            "partner",
            "riders",
            "drivers"
        ].includes(value)
    ){
        return "rider";
    }

    if(
        [
            "admin",
            "administrator",
            "superadmin",
            "super_admin"
        ].includes(value)
    ){
        return "admin";
    }

    return "";
}


/* =========================================================
   AUTHENTICATED USER
   ---------------------------------------------------------
   IMPORTANT:
   Role/localStorage preference alone is NOT authentication.

   A user must have an explicit authenticated session flag.
========================================================= */

function getAuthenticatedUser(){

    const user =
        readJSON("riderx_user");

    if(
        !user ||
        typeof user !== "object"
    ){
        return null;
    }


    const loggedIn =
        user.loggedIn === true;

    const authenticated =
        user.authenticated === true;

    const isAuthenticated =
        user.isAuthenticated === true;

    const sessionActive =
        user.sessionActive === true;


    /*
     * Do not trust:
     * riderx_role
     * riderx_selected_role
     * riderx_customer
     * riderx_rider
     *
     * Those are not authentication credentials.
     */

    if(
        !loggedIn &&
        !authenticated &&
        !isAuthenticated &&
        !sessionActive
    ){
        return null;
    }


    const role =
        normalizeRole(user.role);


    if(
        ![
            "customer",
            "rider",
            "admin"
        ].includes(role)
    ){
        return null;
    }


    const status =
        String(
            user.status || "active"
        )
        .trim()
        .toLowerCase();


    if(
        [
            "blocked",
            "suspended",
            "disabled",
            "banned"
        ].includes(status)
    ){
        return null;
    }


    /*
     * A real logged-in user should have
     * at least one identity field.
     *
     * This prevents an accidental object such as:
     * { loggedIn:true, role:"customer" }
     * from becoming a permanent anonymous session.
     */

    const hasIdentity =
        Boolean(
            user.uid ||
            user.userId ||
            user.id ||
            user.email ||
            user.phone ||
            user.mobile ||
            user.phoneNumber
        );


    if(!hasIdentity){
        return null;
    }


    return {
        ...user,
        role:role
    };

}


/* =========================================================
   DESTINATION
========================================================= */

function getDestination(){

    const user =
        getAuthenticatedUser();


    /*
     * NO AUTHENTICATED USER
     * ALWAYS GO TO ROLE SELECTION.
     */

    if(!user){
        return "./auth/role.html";
    }


    if(user.role === "admin"){
        return "./admin/dashboard.html";
    }


    if(user.role === "rider"){
        return "./rider/home.html";
    }


    if(user.role === "customer"){
        return "./customer/home.html";
    }


    return "./auth/role.html";

}


/* =========================================================
   REDIRECT
========================================================= */

function redirectToRiderX(){

    if(redirectStarted){
        return;
    }


    redirectStarted = true;


    const destination =
        getDestination();


    if(
        destination === "./auth/role.html"
    ){

        setStatus(
            "Opening account selection..."
        );

    }else{

        setStatus(
            "Restoring your RiderX account..."
        );

    }


    window.setTimeout(
        function(){

            window.location.replace(
                destination
            );

        },
        250
    );

}


/* =========================================================
   FALLBACK
========================================================= */

function showFallback(){

    if(splash){
        splash.classList.add("hide");
    }

    if(fallback){
        fallback.classList.add("show");
    }

}


/* =========================================================
   MANUAL CONTINUE
========================================================= */

if(fallbackBtn){

    fallbackBtn.addEventListener(
        "click",
        function(){

            window.location.replace(
                "./auth/role.html"
            );

        }
    );

}


/* =========================================================
   SERVICE WORKER
========================================================= */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register("./sw.js")
                .then(
                    function(){

                        console.log(
                            "RiderX service worker ready."
                        );

                    }
                )
                .catch(
                    function(error){

                        console.warn(
                            "Service worker registration failed:",
                            error
                        );

                    }
                );

        }
    );

}


/* =========================================================
   GLOBAL ERROR HANDLING
========================================================= */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "RiderX startup error:",
            event.error || event.message
        );


        if(!redirectStarted){
            showFallback();
        }

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "RiderX startup rejection:",
            event.reason
        );


        if(!redirectStarted){
            showFallback();
        }

    }
);


/* =========================================================
   START
========================================================= */

function startRiderX(){

    setStatus(
        "Checking RiderX session..."
    );


    window.setTimeout(
        function(){

            const user =
                getAuthenticatedUser();


            if(user){

                setStatus(
                    "Restoring your RiderX account..."
                );

            }else{

                setStatus(
                    "Opening account selection..."
                );

            }


            window.setTimeout(
                redirectToRiderX,
                300
            );

        },
        350
    );

}


/* =========================================================
   START RIDERX
========================================================= */

startRiderX();

</script></body></html>
