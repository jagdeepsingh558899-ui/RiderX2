<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX | Premium Mobility</title>

<link rel="stylesheet" href="css/style.css">

<link rel="manifest" href="manifest.json">

<!-- Icons -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<!-- =========================
RiderX Splash Screen
========================= -->

<div class="splash" id="splash">


<div class="logo-glow">

<img 
src="assets/logo.png"
class="splash-logo"
alt="RiderX">

</div>


<h2>RiderX</h2>

<p>Move Faster. Live Better.</p>


</div>




<!-- =========================
Welcome Screen
========================= -->


<section class="welcome-screen" id="welcome">


<div class="welcome-box">


<img 
src="assets/Logo/RiderX-logo.png"
class="welcome-logo"
alt="RiderX Logo">


<h1>
Welcome to <span>RiderX</span>
</h1>


<p>
India's next generation mobility platform.
Bike Taxi • Cab • Parcel • Food Delivery
</p>



<div class="join-buttons">


<a href="auth/customer-login.html"
class="join-btn customer">

<i class="fa-solid fa-user"></i>

Join as Customer

</a>



<a href="auth/rider-login.html"
class="join-btn rider">

<i class="fa-solid fa-motorcycle"></i>

Join as Rider

</a>



</div>


</div>


</section>





<!-- =========================
Firebase Scripts
========================= -->


<script type="module"
src="js/App.js">
</script>



<script>


// Splash Control

window.addEventListener("load",()=>{


setTimeout(()=>{


document
.getElementById("splash")
.classList.add("splash-hide");



document
.getElementById("welcome")
.classList.add("show");


},2500);



});



</script>



</body>

</html>
