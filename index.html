<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX - Move Faster</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
    overflow:hidden;
}

.splash{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    animation:hideSplash .7s ease 1.2s forwards;
}

.logo-animation{
    font-size:45px;
    font-weight:900;
    letter-spacing:3px;
}

.logo-animation span{
    color:#FFD600;
}

.main{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.brand{
    font-size:42px;
    font-weight:900;
}

.brand span{
    color:#FFD600;
}

.tagline{
    margin-top:15px;
    color:#aaa;
    text-align:center;
    line-height:1.5;
    max-width:500px;
}

.buttons{
    width:100%;
    max-width:400px;
    margin-top:50px;
}

.btn{
    width:100%;
    padding:17px;
    margin:12px 0;
    border-radius:15px;
    border:none;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.customer{
    background:#FFD600;
    color:#000;
}

.rider{
    background:#111;
    border:2px solid #FFD600;
    color:#FFD600;
}

.btn:active{
    transform:scale(.98);
}

.footer{
    position:absolute;
    bottom:30px;
    color:#777;
    font-size:13px;
}

@keyframes hideSplash{

    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }

}

@media(max-width:420px){

    .brand{
        font-size:36px;
    }

    .logo-animation{
        font-size:40px;
    }

}

</style>

</head>

<body>

<div class="splash">

    <div class="logo-animation">
        RID<span>ERX</span>
    </div>

</div>


<div class="main">

    <div class="brand">
        RID<span>ERX</span>
    </div>

    <p class="tagline">
        India's Premium Bike Taxi, Cab, Parcel & Food Platform
    </p>


    <div class="buttons">

        <button
            class="btn customer"
            id="customerBtn"
            type="button">

            Join as Customer

        </button>


        <button
            class="btn rider"
            id="riderBtn"
            type="button">

            Join as Rider

        </button>

    </div>


    <div class="footer">
        Fast • Safe • Reliable
    </div>

</div>


<script>

document.getElementById("customerBtn")
.addEventListener("click", function(){

    window.location.href =
        "auth/login.html?role=customer";

});


document.getElementById("riderBtn")
.addEventListener("click", function(){

    window.location.href =
        "auth/login.html?role=rider";

});


/*
 IMPORTANT:
 Root page does NOT automatically redirect
 based on Firebase session.

 This prevents an old/stale Firebase session
 from sending the user directly to rider/customer
 pages when the main website opens.
*/


if("serviceWorker" in navigator){

    window.addEventListener("load", function(){

        navigator.serviceWorker.register("sw.js")
        .catch(function(error){

            console.warn(
                "Service Worker registration failed:",
                error
            );

        });

    });

}

</script>

</body>
</html>
