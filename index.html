<!DOCTYPE html>
<html lang="en">
<head>
      
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#000000">

<meta name="description"
      content="RiderX - India's Premium Bike Taxi, Cab, Parcel & Food Platform">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="apple-mobile-web-app-title"
      content="RiderX">

<link rel="manifest" href="./manifest.json">

<link rel="icon"
      href="./assets/Icons/icon-192.png">

<title>RiderX - Move Faster</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
}

body{
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
}


/* =========================================================
   SPLASH SCREEN
========================================================= */

.splash{
    position:fixed;
    inset:0;

    width:100%;
    height:100vh;
    height:100dvh;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:99999;

    animation:
        splashOut .5s ease 1.4s forwards;
}

.logo-animation{
    font-size:45px;

    font-weight:900;

    letter-spacing:3px;

    animation:
        logoPulse 1.2s ease;
}

.logo-animation span{
    color:#FFD600;
}


/* =========================================================
   SPLASH ANIMATION
========================================================= */

@keyframes logoPulse{

    0%{
        opacity:0;
        transform:scale(.75);
    }

    60%{
        opacity:1;
        transform:scale(1.08);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}


@keyframes splashOut{

    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }

}


/* =========================================================
   MAIN
========================================================= */

.main{

    min-height:100vh;
    min-height:100dvh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:25px 20px 100px;

    text-align:center;

    position:relative;

}


/* =========================================================
   BRAND
========================================================= */

.brand{

    font-size:44px;

    font-weight:900;

    letter-spacing:-2px;

    line-height:1;
}

.brand span{
    color:#FFD600;
}


/* =========================================================
   TAGLINE
========================================================= */

.tagline{

    margin-top:17px;

    color:#aaa;

    max-width:520px;

    line-height:1.6;

    font-size:15px;

}

.tagline strong{
    color:#FFD600;
}


/* =========================================================
   SERVICE BADGES
========================================================= */

.services{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:8px;

    margin-top:22px;

    max-width:500px;
}

.service{

    padding:7px 11px;

    border-radius:30px;

    background:#111;

    border:1px solid #292929;

    color:#ccc;

    font-size:11px;

    font-weight:700;

}

.service i{
    color:#FFD600;
    margin-right:5px;
}


/* =========================================================
   BUTTON AREA
========================================================= */

.buttons{

    width:100%;

    max-width:390px;

    margin-top:30px;

}


/* =========================================================
   COMMON BUTTON
========================================================= */

.btn{

    width:100%;

    padding:17px;

    margin:8px 0;

    border-radius:15px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;

    -webkit-tap-highlight-color:transparent;

    text-decoration:none;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

}


.btn:active{

    transform:scale(.97);

}


/* =========================================================
   CUSTOMER
========================================================= */

.customer{

    background:#FFD600;

    color:#000;

    border:2px solid #FFD600;

}


.customer:hover{

    filter:brightness(1.06);

}


/* =========================================================
   RIDER
========================================================= */

.rider{

    background:#111;

    border:2px solid #FFD600;

    color:#FFD600;

}


.rider:hover{

    background:#181800;

}


/* =========================================================
   INSTALL APP
========================================================= */

.install-btn{

    display:none;

    width:100%;

    padding:15px;

    margin-top:12px;

    border-radius:15px;

    background:#171717;

    border:1px solid #FFD600;

    color:#FFD600;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;

    align-items:center;

    justify-content:center;

    gap:9px;

}


.install-btn.show{

    display:flex;

}


.install-btn:active{

    transform:scale(.97);

}


/* =========================================================
   INSTALL MESSAGE
========================================================= */

.install-message{

    display:none;

    margin-top:12px;

    color:#777;

    font-size:12px;

    line-height:1.5;

    max-width:350px;

}


.install-message.show{

    display:block;

}


/* =========================================================
   ADMIN
========================================================= */

.admin-link{

    position:fixed;

    bottom:58px;

    left:50%;

    transform:translateX(-50%);

    color:#555;

    font-size:11px;

    text-decoration:none;

    padding:8px 15px;

    z-index:10;

}


.admin-link:hover{

    color:#FFD600;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    position:fixed;

    bottom:18px;

    left:0;

    right:0;

    text-align:center;

    color:#555;

    font-size:11px;

    z-index:5;

}


/* =========================================================
   VERSION
========================================================= */

.version{

    position:absolute;

    top:18px;

    right:18px;

    color:#333;

    font-size:9px;

}


/* =========================================================
   DECORATION
========================================================= */

.glow{

    position:absolute;

    width:220px;

    height:220px;

    border-radius:50%;

    background:#FFD600;

    opacity:.045;

    filter:blur(70px);

    pointer-events:none;

}


.glow.one{

    top:10%;

    left:-100px;

}


.glow.two{

    bottom:10%;

    right:-100px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:420px){

    .main{

        padding-left:18px;

        padding-right:18px;

    }

    .brand{

        font-size:37px;

    }

    .logo-animation{

        font-size:38px;

    }

    .tagline{

        font-size:13px;

    }

    .buttons{

        margin-top:27px;

    }

    .btn{

        font-size:16px;

        padding:16px;

    }

    .services{

        gap:6px;

    }

    .service{

        font-size:10px;

        padding:6px 9px;

    }

}


/* =========================================================
   STANDALONE APP
========================================================= */

@media(display-mode:standalone){

    .admin-link{

        bottom:65px;

    }

    .footer{

        bottom:22px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     SPLASH
======================================================= -->

<div class="splash">

    <div class="logo-animation">

        RIDER<span>X</span>

    </div>

</div>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


    <div class="glow one"></div>

    <div class="glow two"></div>


    <div class="version">

        RiderX

    </div>


    <!-- BRAND -->

    <div class="brand">

        RIDER<span>X</span>

    </div>


    <!-- TAGLINE -->

    <div class="tagline">

        India's Premium

        <strong>Bike Taxi, Cab, Parcel & Food</strong>

        Platform

        <br>

        <span style="color:#777;">

            Fast • Safe • Reliable

        </span>

    </div>


    <!-- SERVICES -->

    <div class="services">


        <div class="service">

            <i class="fa-solid fa-motorcycle"></i>

            Bike Taxi

        </div>


        <div class="service">

            <i class="fa-solid fa-car"></i>

            Cab

        </div>


        <div class="service">

            <i class="fa-solid fa-box"></i>

            Parcel

        </div>


        <div class="service">

            <i class="fa-solid fa-utensils"></i>

            Food

        </div>


    </div>


    <!-- BUTTONS -->

    <div class="buttons">


        <!-- CUSTOMER -->

        <a
            href="./auth/login.html?role=customer"
            class="btn customer">

            <i class="fa-solid fa-user"></i>

            Join as Customer

        </a>


        <!-- RIDER -->

        <a
            href="./auth/login.html?role=rider"
            class="btn rider">

            <i class="fa-solid fa-motorcycle"></i>

            Join as Rider

        </a>


        <!-- INSTALL -->

        <button
            id="installBtn"
            class="install-btn">

            <i class="fa-solid fa-download"></i>

            Install RiderX App

        </button>


        <div
            id="installMessage"
            class="install-message">

            To install RiderX on Android:

            tap the browser menu

            <strong>⋮</strong>

            and choose

            <strong>Add to Home screen</strong>

            or

            <strong>Install app</strong>.

        </div>


    </div>


</main>


<!-- =======================================================
     ADMIN
======================================================= -->

<a
    href="./admin/login.html"
    class="admin-link">

    Admin

</a>


<!-- =======================================================
     FOOTER
======================================================= -->

<div class="footer">

    RiderX • Move Faster

</div>


<!-- =======================================================
     FONT AWESOME
======================================================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js">
</script>


<!-- =======================================================
     PWA INSTALL
======================================================= -->

<script>

let deferredPrompt = null;

const installBtn =
    document.getElementById("installBtn");

const installMessage =
    document.getElementById("installMessage");


/* =========================================================
   CHECK STANDALONE
========================================================= */

function isStandalone(){

    return (
        window.matchMedia(
            "(display-mode: standalone)"
        ).matches
        ||
        window.navigator.standalone === true
    );

}


/* =========================================================
   BEFORE INSTALL PROMPT
========================================================= */

window.addEventListener(
    "beforeinstallprompt",
    function(event){

        event.preventDefault();

        deferredPrompt = event;

        if(!isStandalone()){

            installBtn.classList.add("show");

        }

    }
);


/* =========================================================
   INSTALL BUTTON
========================================================= */

installBtn.addEventListener(
    "click",
    async function(){

        if(deferredPrompt){

            deferredPrompt.prompt();

            const result =
                await deferredPrompt.userChoice;

            if(
                result.outcome === "accepted"
            ){

                console.log(
                    "RiderX installation accepted"
                );

            }

            deferredPrompt = null;

            installBtn.classList.remove(
                "show"
            );

            return;

        }


        /*
         * If browser does not provide
         * automatic install prompt.
         */

        installMessage.classList.add(
            "show"
        );

    }
);


/* =========================================================
   INSTALLED
========================================================= */

window.addEventListener(
    "appinstalled",
    function(){

        installBtn.classList.remove(
            "show"
        );

        installMessage.classList.remove(
            "show"
        );

        console.log(
            "RiderX installed successfully"
        );

    }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
    "serviceWorker" in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register(
                    "./sw.js"
                )
                .then(
                    function(registration){

                        console.log(
                            "RiderX Service Worker registered:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    function(error){

                        console.warn(
                            "Service Worker registration failed:",
                            error
                        );

                    }
                );

        }
    );

}


/* =========================================================
   IOS INSTALL MESSAGE
========================================================= */

const isIOS =
    /iphone|ipad|ipod/i.test(
        navigator.userAgent
    );

if(
    isIOS &&
    !isStandalone()
){

    installBtn.classList.add(
        "show"
    );

}

</script>


</body>

</html>
