<!DOCTYPE html>
<html lang="en">
    
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RiderX - Move Faster</title>

<link
    rel="manifest"
    href="manifest.json"
>

<meta
    name="theme-color"
    content="#000000"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#000;

    color:#fff;

    min-height:100vh;

    overflow:hidden;
}


/* =========================================================
   SPLASH
========================================================= */

.splash{

    position:fixed;

    inset:0;

    width:100%;

    height:100vh;

    background:#000;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:9999;

    animation:
        splashOut .5s ease 1.3s forwards;
}

.logo-animation{

    font-size:45px;

    font-weight:900;

    letter-spacing:3px;

    animation:
        logoPulse 1.2s ease;
}

.logo-animation span,
.brand span{

    color:#FFD600;
}

@keyframes logoPulse{

    0%{
        opacity:0;
        transform:scale(.8);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes splashOut{

    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }
}


/* =========================================================
   MAIN
========================================================= */

.main{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:25px;

    text-align:center;
}

.brand{

    font-size:42px;

    font-weight:900;
}

.tagline{

    margin-top:15px;

    color:#aaa;

    max-width:500px;

    line-height:1.5;
}


/* =========================================================
   BUTTONS
========================================================= */

.buttons{

    width:100%;

    max-width:390px;

    margin-top:45px;
}

.btn{

    width:100%;

    padding:17px;

    margin:10px 0;

    border-radius:15px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.btn:active{

    transform:scale(.98);
}

.customer{

    background:#FFD600;

    color:#000;

    border:2px solid #FFD600;
}

.customer:hover{

    filter:brightness(1.05);
}

.rider{

    background:#111;

    border:2px solid #FFD600;

    color:#FFD600;
}

.rider:hover{

    background:#191900;
}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    position:absolute;

    bottom:30px;

    color:#666;

    font-size:13px;
}


/* =========================================================
   SESSION MESSAGE
========================================================= */

.session-box{

    position:fixed;

    left:50%;

    bottom:75px;

    transform:translateX(-50%);

    background:#111;

    border:1px solid #333;

    border-radius:12px;

    padding:12px 18px;

    color:#aaa;

    font-size:12px;

    display:none;

    z-index:10000;
}


@media(max-width:420px){

    .brand{
        font-size:36px;
    }

    .logo-animation{
        font-size:38px;
    }

    .tagline{
        font-size:14px;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     SPLASH
======================================================== -->

<div
    id="splash"
    class="splash">

    <div class="logo-animation">

        RID<span>ERX</span>

    </div>

</div>


<!-- =======================================================
     MAIN
======================================================== -->

<div class="main">


    <div class="brand">

        RID<span>ERX</span>

    </div>


    <p class="tagline">

        India's Premium Bike Taxi, Cab, Parcel & Food Platform

    </p>


    <div class="buttons">


        <button
            id="customerBtn"
            class="btn customer"
            type="button">

            Join as Customer

        </button>


        <button
            id="riderBtn"
            class="btn rider"
            type="button">

            Join as Rider

        </button>


    </div>


</div>


<div class="footer">

    Fast • Safe • Reliable

</div>


<div
    id="sessionBox"
    class="session-box">

    Checking session...

</div>


<!-- =======================================================
     FIREBASE SESSION CHECK
======================================================== -->

<script type="module">

import {
    auth
} from "./firebase/firebase-config.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


// ==========================================================
// BUTTONS
// ==========================================================

const customerBtn =
    document.getElementById("customerBtn");

const riderBtn =
    document.getElementById("riderBtn");


// ==========================================================
// CUSTOMER
// ==========================================================

customerBtn.addEventListener(
    "click",
    () => {

        window.location.href =
            "auth/login.html?role=customer";

    }
);


// ==========================================================
// RIDER
// ==========================================================

riderBtn.addEventListener(
    "click",
    () => {

        window.location.href =
            "auth/login.html?role=rider";

    }
);


// ==========================================================
// IMPORTANT
//
// ROOT PAGE DOES NOT REDIRECT LOGGED-IN USERS.
//
// This prevents:
//
// Rider session
//      ↓
// index.html
//      ↓
// rider/home.html
//      ↓
// book ride page
//
// Admin session also remains here until the
// user intentionally opens the admin login/dashboard.
//
// ==========================================================

onAuthStateChanged(
    auth,
    (user) => {

        if (user) {

            console.log(
                "RiderX Firebase session detected:",
                user.email
            );

            /*
             * DO NOT REDIRECT HERE.
             *
             * Role-based redirects are handled by
             * login.js and protected dashboard pages.
             */

        } else {

            console.log(
                "RiderX: No active Firebase session."
            );
        }

    }
);


// ==========================================================
// SERVICE WORKER
// ==========================================================

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("./sw.js")
                .then(
                    registration => {

                        console.log(
                            "RiderX Service Worker registered:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    error => {

                        console.warn(
                            "Service Worker registration failed:",
                            error
                        );

                    }
                );

        }
    );
}

</script>

</body>

</html>
