<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX - Premium Ride Service</title>

<meta name="theme-color" content="#FFD600">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="css/style.css">

<link rel="icon" href="assets/logo.svg">


<style>

body{
    margin:0;
    background:#000;
    overflow:hidden;
}


#splash{

position:fixed;
top:0;
left:0;
width:100%;
height:100vh;

background:#000;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

z-index:9999;

}


.logo{

width:130px;
height:130px;

animation:
logoScale 1.8s infinite alternate;

}


.title{

color:#FFD600;

font-size:35px;

font-weight:900;

letter-spacing:2px;

margin-top:20px;

animation:
fadeIn 2s;

}


.loader{

width:50px;
height:50px;

border:5px solid #333;

border-top:5px solid #FFD600;

border-radius:50%;

margin-top:35px;

animation:spin 1s linear infinite;

}



.status{

color:white;

margin-top:20px;

font-size:14px;

}



@keyframes spin{

100%{
transform:rotate(360deg);
}

}


@keyframes logoScale{

from{
transform:scale(.8);
}

to{
transform:scale(1);
}

}



@keyframes fadeIn{

from{
opacity:0;
}

to{
opacity:1;
}

}


</style>


</head>



<body>


<!-- Splash Screen -->


<div id="splash">


<img src="assets/logo.svg" class="logo">


<div class="title">
RiderX
</div>


<div class="loader"></div>


<div class="status" id="status">
Starting RiderX...
</div>


</div>





<!-- Main App -->


<div id="app" style="display:none;">


</div>





<script type="module">


// Firebase Import

import { initializeApp }
from 
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import { getAuth,onAuthStateChanged }
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";



import { firebaseConfig }
from "./firebase/config.js";





// Firebase Start


let firebaseReady=false;


try{


const app = initializeApp(firebaseConfig);

const auth=getAuth(app);


firebaseReady=true;


console.log(
"Firebase Connected"
);



onAuthStateChanged(auth,(user)=>{


if(user){


console.log(
"User Logged In",
user.email
);


// future dashboard redirect


}

else{


console.log(
"No User Login"
);


}



});



}

catch(error){


console.log(
"Firebase Error",
error
);


}







// Status Update Function


function updateStatus(text){

document.getElementById("status").innerHTML=text;

}







// Internet Check


function checkInternet(){


if(navigator.onLine){

updateStatus(
"Internet Connected ✓"
);


}

else{

updateStatus(
"No Internet Connection"
);


}


}






// GPS Permission Check


function checkGPS(){


if(
navigator.geolocation
){



navigator.geolocation.getCurrentPosition(

()=>{


updateStatus(
"Location Ready ✓"
);


},


()=>{


updateStatus(
"Location Permission Required"
);


}


);



}

else{


updateStatus(
"GPS Not Supported"
);


}



}







// PWA Install


let installPrompt;



window.addEventListener(
"beforeinstallprompt",
(e)=>{


e.preventDefault();

installPrompt=e;


console.log(
"PWA Ready"
);



});








// App Start Sequence



async function startRiderX(){



updateStatus(
"Checking Internet..."
);


checkInternet();



await new Promise(
r=>setTimeout(r,1000)
);



updateStatus(
"Checking Location..."
);


checkGPS();



await new Promise(
r=>setTimeout(r,1000)
);



if(firebaseReady){


updateStatus(
"Firebase Connected ✓"
);



}

else{


updateStatus(
"Firebase Failed"
);


}



await new Promise(
r=>setTimeout(r,1500)
);



document.getElementById(
"splash"
).style.display="none";



document.getElementById(
"app"
).style.display="block";



window.location.href="auth/login.html";



}





startRiderX();






// Service Worker


if(
"serviceWorker" in navigator
){


navigator.serviceWorker.register(
"sw.js"
)

.then(()=>{

console.log(
"Service Worker Active"
);

})

.catch(err=>{

console.log(err);

});


}



</script>



</body>

</html>
