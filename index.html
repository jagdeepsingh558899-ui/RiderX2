<!DOCTYPE html>
<html lang="en">
    
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RiderX - Move Faster</title>

<link
    rel="manifest"
    href="manifest.json"
>

<meta
    name="theme-color"
    content="#000000"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
    overflow:hidden;
}
    

/* ==============================
   SPLASH
============================== */

.splash{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    animation:splashOut .5s ease 1.3s forwards;
}

.logo-animation{
    font-size:45px;
    font-weight:900;
    letter-spacing:3px;
    animation:logoPulse 1.2s ease;
}

.logo-animation span,
.brand span{
    color:#FFD600;
}

@keyframes logoPulse{

    0%{
        opacity:0;
        transform:scale(.8);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}

@keyframes splashOut{

    to{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
    }

}


/* ==============================
   MAIN
============================== */

.main{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:25px;
    text-align:center;
}

.brand{
    font-size:42px;
    font-weight:900;
}

.tagline{
    margin-top:15px;
    color:#aaa;
    max-width:500px;
    line-height:1.5;
}


/* ==============================
   BUTTONS
============================== */

.buttons{
    width:100%;
    max-width:390px;
    margin-top:45px;
}

.btn{
    width:100%;
    padding:17px;
    margin:10px 0;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn:active{
    transform:scale(.98);
}

.customer{
    background:#FFD600;
    color:#000;
    border:2px solid #FFD600;
}

.customer:hover{
    filter:brightness(1.05);
}

.rider{
    background:#111;
    border:2px solid #FFD600;
    color:#FFD600;
}

.rider:hover{
    background:#191900;
}


/* ==============================
   ADMIN LINK
============================== */

.admin-link{
    position:fixed;
    bottom:58px;
    left:50%;
    transform:translateX(-50%);
    color:#555;
    font-size:11px;
    text-decoration:none;
}

.admin-link:hover{
    color:#FFD600;
}


/* ==============================
   FOOTER
============================== */

.footer{
    position:absolute;
    bottom:25px;
    color:#666;
    font-size:13px;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:420px){

    .brand{
        font-size:36px;
    }

    .logo-animation{
        font-size:38px;
    }

    .tagline{
        font-size:14px;
    }

}

</style>

</head>


<body>


<!-- ==============================
     SPLASH
============================== -->

<div
    id="splash"
    class="splash">

    <div class="logo-animation">

        RID<span>ERX</span>

    </div>

</div>


<!-- ==============================
     MAIN
============================== -->

<div class="main">

    <div class="brand">

        RID<span>ERX</span>

    </div>


    <p class="tagline">

        India's Premium Bike Taxi, Cab, Parcel & Food Platform

    </p>


    <div class="buttons">

        <button
            id="customerBtn"
            class="btn customer"
            type="button">

            Join as Customer

        </button>


        <button
            id="riderBtn"
            class="btn rider"
            type="button">

            Join as Rider

        </button>

    </div>

</div>


<!-- ==============================
     ADMIN LOGIN
============================== -->

<a
    href="admin/login.html"
    class="admin-link">

    Admin

</a>


<div class="footer">

    Fast • Safe • Reliable

</div>


<script>

/*
===========================================================
RIDERX ROOT PAGE

IMPORTANT:

This page NEVER checks Firebase authentication.

It NEVER redirects to:

admin/dashboard.html
admin/login.html
customer/home.html
rider/home.html

The root URL must always remain the RiderX landing page.

===========================================================
*/


/* ==============================
   CUSTOMER
============================== */

document
    .getElementById("customerBtn")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "auth/login.html?role=customer";

        }
    );


/* ==============================
   RIDER
============================== */

document
    .getElementById("riderBtn")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "auth/login.html?role=rider";

        }
    );


/* ==============================
   SERVICE WORKER CLEANUP

   This removes an old Service Worker
   that may be incorrectly serving the
   Admin Dashboard for the "/" URL.
============================== */

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        async function(){

            try{

                const registrations =
                    await navigator
                        .serviceWorker
                        .getRegistrations();

                for(
                    const registration
                    of registrations
                ){

                    await registration.unregister();

                    console.log(
                        "Old RiderX Service Worker removed."
                    );

                }


                if("caches" in window){

                    const cacheNames =
                        await caches.keys();

                    for(
                        const cacheName
                        of cacheNames
                    ){

                        await caches.delete(
                            cacheName
                        );

                    }

                    console.log(
                        "Old RiderX caches cleared."
                    );

                }

            }
            catch(error){

                console.warn(
                    "Cache cleanup failed:",
                    error
                );

            }

        }
    );

}

</script>


</body>

</html>
