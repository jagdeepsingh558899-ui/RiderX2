<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5c400"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="RiderX"
    >

    <meta
        name="description"
        content="RiderX - Bike, Taxi, Cab, Parcel and Delivery"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        href="./assets/logo.png"
    >

    <title>RiderX</title>

    <style>
        :root {
            --rx-yellow: #f5c400;
            --rx-black: #050505;
            --rx-text: #ffffff;
            --rx-muted: #8d8d8d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--rx-black);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    rgba(245, 196, 0, 0.12),
                    transparent 38%
                ),
                var(--rx-black);

            color: var(--rx-text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        #riderx-loader {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(245, 196, 0, 0.10),
                    transparent 42%
                ),
                #050505;

            transition:
                opacity 0.35s ease,
                visibility 0.35s ease;
        }

        #riderx-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-content {
            width: min(90vw, 360px);
            text-align: center;
        }

        .logo-wrap {
            width: 92px;
            height: 92px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid
                rgba(245, 196, 0, 0.35);

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #090909
                );

            box-shadow:
                0 0 0 8px
                rgba(245, 196, 0, 0.03),
                0 20px 60px
                rgba(0, 0, 0, 0.55);
        }

        .logo-wrap img {
            width: 68px;
            height: 68px;

            object-fit: contain;

            border-radius: 18px;
        }

        .brand {
            font-size: 34px;
            line-height: 1;

            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .brand span {
            color: var(--rx-yellow);
        }

        .tagline {
            margin-top: 10px;

            color: var(--rx-muted);

            font-size: 13px;
            letter-spacing: 0.3px;
        }

        .progress {
            width: 150px;
            height: 4px;

            margin: 28px auto 0;

            overflow: hidden;

            border-radius: 99px;

            background:
                rgba(255, 255, 255, 0.08);
        }

        .progress::after {
            content: "";

            display: block;

            width: 45%;
            height: 100%;

            border-radius: inherit;

            background:
                var(--rx-yellow);

            animation:
                rx-progress 1.15s
                ease-in-out infinite;
        }

        .status {
            min-height: 18px;

            margin-top: 14px;

            color: #858585;

            font-size: 11px;
        }

        .fallback {
            display: none;

            margin-top: 24px;
        }

        .fallback.visible {
            display: block;
        }

        .fallback button {
            border: 0;
            border-radius: 12px;

            padding: 12px 20px;

            background:
                var(--rx-yellow);

            color: #080808;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
        }

        @keyframes rx-progress {
            0% {
                transform: translateX(-180%);
            }

            50% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(350%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .progress::after {
                animation: none;
            }

            #riderx-loader {
                transition: none;
            }
        }
    </style>
</head>

<body>

<main
    id="riderx-loader"
    aria-label="RiderX loading"
>

    <div class="loader-content">

        <div class="logo-wrap">

            <img
                src="./assets/logo.png"
                alt="RiderX"
                onerror="this.style.display='none';"
            >

        </div>

        <div class="brand">
            Rider<span>X</span>
        </div>

        <div class="tagline">
            Ride. Deliver. Move.
        </div>

        <div
            id="riderx-status"
            class="status"
            aria-live="polite"
        >
            Starting RiderX...
        </div>

        <div
            class="progress"
            aria-hidden="true"
        ></div>

        <div
            id="riderx-fallback"
            class="fallback"
        >

            <button
                id="riderx-retry"
                type="button"
            >
                Continue
            </button>

        </div>

    </div>

</main>


<script type="module">

"use strict";


/* ============================================================
   RIDERX ENTRY ROUTER
   File: index.html

   FLOW:

   FIRST VISIT / LOGGED OUT
       ↓
   auth/role.html

   CUSTOMER
       ↓
   customer/home.html

   APPROVED RIDER
       ↓
   rider/home.html

   ADMIN
       ↓
   admin/dashboard.html

   IMPORTANT:
   - Firebase Auth is the authentication authority.
   - Firestore users/{uid} is the role authority.
   - localStorage is NEVER trusted for authentication.
   - Old role flags cannot force rider/customer dashboard.
   ============================================================ */


/* ============================================================
   FIREBASE
============================================================ */

import {
    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc
} from "./firebase/firebase-config.js";


/* ============================================================
   DOM
============================================================ */

const loader =
    document.getElementById(
        "riderx-loader"
    );

const statusElement =
    document.getElementById(
        "riderx-status"
    );

const fallback =
    document.getElementById(
        "riderx-fallback"
    );

const retryButton =
    document.getElementById(
        "riderx-retry"
    );


/* ============================================================
   ROUTES
============================================================ */

const ROUTES = Object.freeze({

    role:
        "./auth/role.html",

    customer:
        "./customer/home.html",

    rider:
        "./rider/home.html",

    admin:
        "./admin/dashboard.html"

});


/* ============================================================
   CONFIG
============================================================ */

const AUTH_TIMEOUT = 15000;

const REDIRECT_DELAY = 120;


/* ============================================================
   STATE
============================================================ */

let authResolved = false;

let routingStarted = false;

let redirectStarted = false;


/* ============================================================
   STATUS
============================================================ */

function setStatus(text) {

    if (
        statusElement
    ) {

        statusElement.textContent =
            text;

    }

}


/* ============================================================
   HIDE LOADER
============================================================ */

function hideLoader() {

    if (
        loader
    ) {

        loader.classList.add(
            "hidden"
        );

    }

}


/* ============================================================
   FALLBACK
============================================================ */

function showFallback() {

    if (
        fallback
    ) {

        fallback.classList.add(
            "visible"
        );

    }

}


/* ============================================================
   REDIRECT
============================================================ */

function redirectTo(route) {

    if (
        !route
        ||
        redirectStarted
    ) {

        return;

    }


    redirectStarted =
        true;


    window.location.replace(
        route
    );

}


/* ============================================================
   DELAYED REDIRECT
============================================================ */

function delayedRedirect(
    route,
    message
) {

    if (
        message
    ) {

        setStatus(
            message
        );

    }


    window.setTimeout(
        function () {

            redirectTo(
                route
            );

        },
        REDIRECT_DELAY
    );

}


/* ============================================================
   ROLE NORMALIZATION
============================================================ */

function normalizeRole(value) {

    if (
        typeof value !== "string"
    ) {

        return "";

    }


    const role =
        value
            .trim()
            .toLowerCase()
            .replace(
                /[\s-]+/g,
                "_"
            );


    if (
        [
            "admin",
            "administrator",
            "superadmin"
        ].includes(role)
    ) {

        return "admin";

    }


    if (
        [
            "rider",
            "driver",
            "captain",
            "partner",
            "driver_partner",
            "driverpartner"
        ].includes(role)
    ) {

        return "rider";

    }


    if (
        [
            "customer",
            "user",
            "passenger"
        ].includes(role)
    ) {

        return "customer";

    }


    return "";

}


/* ============================================================
   FIRESTORE ROLE
============================================================ */

async function getUserRole(user) {

    if (
        !user
        ||
        !user.uid
    ) {

        return "";

    }


    try {

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );


        const snapshot =
            await getDoc(
                userRef
            );


        if (
            !snapshot.exists()
        ) {

            return "";

        }


        const data =
            snapshot.data() || {};


        /*
         * RiderX supports multiple existing role field names.
         */

        return (

            normalizeRole(
                data.role
            )

            ||

            normalizeRole(
                data.userRole
            )

            ||

            normalizeRole(
                data.accountType
            )

            ||

            normalizeRole(
                data.userType
            )

        );

    } catch (error) {

        console.error(
            "RiderX: Firestore role lookup failed:",
            error
        );


        return "";

    }

}


/* ============================================================
   RIDER APPROVAL CHECK
============================================================ */

async function checkRiderAccess(user) {

    if (
        !user
        ||
        !user.uid
    ) {

        return false;

    }


    try {

        const riderRef =
            doc(
                db,
                "riders",
                user.uid
            );


        const snapshot =
            await getDoc(
                riderRef
            );


        if (
            !snapshot.exists()
        ) {

            return false;

        }


        const data =
            snapshot.data() || {};


        /*
         * Blocked / disabled / suspended riders
         * must never enter the rider dashboard.
         */

        if (
            data.disabled === true
            ||
            data.blocked === true
            ||
            data.suspended === true
        ) {

            return false;

        }


        /*
         * Supported approval formats.
         */

        if (
            data.approved === true
            ||
            data.isApproved === true
            ||
            data.adminApproved === true
        ) {

            return true;

        }


        const approvalStatus =
            String(
                data.approvalStatus ??
                ""
            )
                .trim()
                .toLowerCase();


        const status =
            String(
                data.status ??
                ""
            )
                .trim()
                .toLowerCase();


        const riderStatus =
            String(
                data.riderStatus ??
                ""
            )
                .trim()
                .toLowerCase();


        return (
            approvalStatus === "approved"
            ||
            status === "approved"
            ||
            riderStatus === "approved"
        );

    } catch (error) {

        console.error(
            "RiderX: rider access check failed:",
            error
        );


        return false;

    }

}


/* ============================================================
   STALE NAVIGATION CLEANUP
============================================================ */

function clearStaleNavigationState() {

    /*
     * These keys are ONLY navigation/cache values.
     *
     * Firebase Auth remains untouched.
     */

    const keys = [

        "riderx_user",

        "riderx_customer",

        "riderx_rider",

        "riderx_role",

        "riderx_selected_role",

        "riderx_customer_id",

        "riderx_rider_id",

        "riderx_uid"

    ];


    for (
        const key of keys
    ) {

        try {

            localStorage.removeItem(
                key
            );

        } catch (
            error
        ) {

            /*
             * Ignore restricted storage.
             */

        }

    }

}


/* ============================================================
   SESSION CACHE
============================================================ */

function saveSessionCache(
    user,
    role
) {

    if (
        !user
        ||
        !role
    ) {

        return;

    }


    try {

        const session = {

            uid:
                user.uid,

            role:
                role,

            email:
                user.email || "",

            displayName:
                user.displayName || "",

            photoURL:
                user.photoURL || "",

            updatedAt:
                Date.now()

        };


        /*
         * Compatibility cache.
         *
         * This does NOT authenticate the user.
         */

        localStorage.setItem(
            "riderx_session",
            JSON.stringify(
                session
            )
        );


        localStorage.setItem(
            "riderx_uid",
            user.uid
        );


        localStorage.setItem(
            "riderx_role",
            role
        );


        if (
            role === "customer"
        ) {

            localStorage.setItem(
                "riderx_customer_id",
                user.uid
            );

        }


        if (
            role === "rider"
        ) {

            localStorage.setItem(
                "riderx_rider_id",
                user.uid
            );

        }

    } catch (error) {

        console.warn(
            "RiderX: session cache unavailable:",
            error
        );

    }

}


/* ============================================================
   SERVICE WORKER
============================================================ */

async function registerServiceWorker() {

    if (
        !("serviceWorker" in navigator)
    ) {

        return;

    }


    try {

        await navigator.serviceWorker.register(
            "./sw.js",
            {
                scope: "./"
            }
        );

    } catch (error) {

        console.warn(
            "RiderX: service worker registration failed:",
            error
        );

    }

}


/* ============================================================
   LOGGED OUT
============================================================ */

function routeLoggedOut() {

    /*
     * IMPORTANT:
     *
     * No Firebase user means this is a first-time visitor
     * OR a logged-out visitor.
     *
     * We do NOT use old localStorage role values here.
     */

    clearStaleNavigationState();


    delayedRedirect(
        ROUTES.role,
        "Welcome to RiderX..."
    );

}


/* ============================================================
   LOGGED IN
============================================================ */

async function routeLoggedIn(user) {

    if (
        !user
    ) {

        routeLoggedOut();

        return;

    }


    setStatus(
        "Checking your RiderX account..."
    );


    /*
     * Firebase Auth has confirmed the user.
     *
     * Now Firestore determines the account role.
     */

    const role =
        await getUserRole(
            user
        );


    /*
     * If there is no valid role, do not guess.
     *
     * Send user to role selection.
     */

    if (
        !role
    ) {

        clearStaleNavigationState();


        delayedRedirect(
            ROUTES.role,
            "Please select your account type..."
        );


        return;

    }


    /* ========================================================
       ADMIN
    ======================================================== */

    if (
        role === "admin"
    ) {

        saveSessionCache(
            user,
            role
        );


        delayedRedirect(
            ROUTES.admin,
            "Opening admin dashboard..."
        );


        return;

    }


    /* ========================================================
       RIDER
    ======================================================== */

    if (
        role === "rider"
    ) {

        setStatus(
            "Checking rider approval..."
        );


        const approved =
            await checkRiderAccess(
                user
            );


        if (
            !approved
        ) {

            /*
             * Do NOT open rider dashboard.
             *
             * Do NOT use a fake pending page.
             */

            clearStaleNavigationState();


            delayedRedirect(
                ROUTES.role,
                "Your rider account is not approved yet."
            );


            return;

        }


        saveSessionCache(
            user,
            role
        );


        delayedRedirect(
            ROUTES.rider,
            "Opening rider dashboard..."
        );


        return;

    }


    /* ========================================================
       CUSTOMER
    ======================================================== */

    if (
        role === "customer"
    ) {

        saveSessionCache(
            user,
            role
        );


        delayedRedirect(
            ROUTES.customer,
            "Opening customer dashboard..."
        );


        return;

    }


    /* ========================================================
       SAFETY FALLBACK
    ======================================================== */

    clearStaleNavigationState();


    delayedRedirect(
        ROUTES.role,
        "Please select your account type..."
    );

}


/* ============================================================
   AUTH STATE
============================================================ */

async function handleAuthState(user) {

    /*
     * Firebase may theoretically emit multiple states.
     * Only the first routing decision controls entry.
     */

    if (
        routingStarted
    ) {

        return;

    }


    routingStarted =
        true;


    authResolved =
        true;


    try {

        if (
            user
        ) {

            await routeLoggedIn(
                user
            );

        } else {

            routeLoggedOut();

        }

    } catch (error) {

        console.error(
            "RiderX: entry routing error:",
            error
        );


        routingStarted =
            false;


        setStatus(
            "Unable to load RiderX."
        );


        showFallback();

    }

}


/* ============================================================
   RETRY
============================================================ */

retryButton?.addEventListener(
    "click",
    function () {

        window.location.reload();

    }
);


/* ============================================================
   START
============================================================ */

(async function startRiderX() {

    setStatus(
        "Starting RiderX..."
    );


    /*
     * Service worker is independent from authentication.
     */

    registerServiceWorker();


    /*
     * Firebase Auth is the ONLY source of truth for
     * whether the user is logged in.
     */

    try {

        onAuthStateChanged(
            auth,
            handleAuthState
        );

    } catch (error) {

        console.error(
            "RiderX: Firebase Auth listener failed:",
            error
        );


        setStatus(
            "Authentication service unavailable."
        );


        showFallback();


        return;

    }


    /*
     * Safety timeout.
     *
     * It NEVER opens a dashboard.
     */

    window.setTimeout(
        function () {

            if (
                !authResolved
                &&
                !routingStarted
            ) {

                setStatus(
                    "Authentication is taking longer than expected."
                );


                showFallback();

            }

        },
        AUTH_TIMEOUT
    );

})();


/* ============================================================
   DEBUG API
   ------------------------------------------------------------
   Only for browser console debugging.
   Does not control routing.
============================================================ */

window.RiderXEntry =
    Object.freeze({

        routes:
            ROUTES,

        normalizeRole,

        getUserRole,

        checkRiderAccess,

        clearStaleNavigationState

    });

</script>

</body>
</html>
