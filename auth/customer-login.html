><div class="field"><label for="phone">

import {

    db,

    signInWithEmailAndPassword,
    sendPasswordResetEmail,

    collection,
    query,
    where,
    getDocs

} from "../firebase/firebase-config.js";


"use strict";


const form =
    document.getElementById(
        "loginForm"
    );

const phone =
    document.getElementById(
        "phone"
    );

const password =
    document.getElementById(
        "password"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const successBox =
    document.getElementById(
        "successBox"
    );


function normalizePhone(value){

    return String(value || "")
        .replace(/\D/g,"")
        .slice(-10);

}


function showError(message){

    successBox.classList.remove("show");

    errorBox.textContent =
        message;

    errorBox.classList.add("show");

}


function showSuccess(message){

    errorBox.classList.remove("show");

    successBox.textContent =
        message;

    successBox.classList.add("show");

}


function clearMessages(){

    errorBox.classList.remove("show");

    successBox.classList.remove("show");

}


function setLoading(loading){

    loginBtn.disabled =
        loading;

    if(loading){

        loginBtn.innerHTML =
            '<span class="loader"></span>Logging in...';

    }else{

        loginBtn.textContent =
            "Login";

    }

}


async function findCustomerByPhone(mobile){

    const phone10 =
        normalizePhone(
            mobile
        );

    const possibleValues = [
        phone10,
        "+91" + phone10,
        "91" + phone10
    ];


    for(
        const value of possibleValues
    ){

        const usersRef =
            collection(
                db,
                "users"
            );

        const q =
            query(
                usersRef,
                where(
                    "phone",
                    "==",
                    value
                )
            );

        const snapshot =
            await getDocs(q);


        if(!snapshot.empty){

            const docSnap =
                snapshot.docs[0];

            return {
                uid:docSnap.id,
                ...docSnap.data()
            };

        }

    }


    /*
     * Some older RiderX builds may store
     * customers in a separate collection.
     */

    for(
        const value of possibleValues
    ){

        const ref =
            collection(
                db,
                "customers"
            );

        const q =
            query(
                ref,
                where(
                    "phone",
                    "==",
                    value
                )
            );

        const snapshot =
            await getDocs(q);


        if(!snapshot.empty){

            const docSnap =
                snapshot.docs[0];

            return {
                uid:docSnap.id,
                ...docSnap.data()
            };

        }

    }


    return null;

}


function saveSession(customer){

    const session = {

        uid:
            customer.uid ||
            "",

        name:
            customer.name ||
            customer.displayName ||
            "RiderX Customer",

        phone:
            normalizePhone(
                customer.phone
            ),

        email:
            customer.email ||
            "",

        role:
            "customer",

        status:
            customer.status ||
            "active",

        loginAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "riderx_user",
        JSON.stringify(session)
    );

    localStorage.setItem(
        "riderx_customer",
        JSON.stringify(session)
    );

    localStorage.setItem(
        "userRole",
        "customer"
    );

    localStorage.setItem(
        "riderx_selected_role",
        "customer"
    );

}


phone.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,10);

    }
);


document
    .getElementById("eyeBtn")
    .addEventListener(
        "click",
        function(){

            const show =
                password.type ===
                "password";

            password.type =
                show
                    ? "text"
                    : "password";

            this.textContent =
                show
                    ? "🙈"
                    : "👁";

        }
    );


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessages();


        const mobile =
            normalizePhone(
                phone.value
            );

        const pass =
            password.value;


        if(
            !/^[6-9]\d{9}$/.test(
                mobile
            )
        ){

            showError(
                "Please enter a valid 10-digit Indian mobile number."
            );

            phone.focus();

            return;

        }


        if(
            pass.length < 6
        ){

            showError(
                "Password must contain at least 6 characters."
            );

            password.focus();

            return;

        }


        setLoading(true);


        try{

            const customer =
                await findCustomerByPhone(
                    mobile
                );


            if(!customer){

                showError(
                    "No RiderX customer account was found with this mobile number."
                );

                setLoading(false);

                return;

            }


            const role =
                String(
                    customer.role ||
                    "customer"
                ).toLowerCase();


            if(
                role === "rider" ||
                role === "driver"
            ){

                showError(
                    "This mobile number belongs to a Rider account. Please use Rider Login."
                );

                setLoading(false);

                return;

            }


            const status =
                String(
                    customer.status ||
                    "active"
                ).toLowerCase();


            if(
                [
                    "blocked",
                    "suspended",
                    "disabled",
                    "banned"
                ].includes(status)
            ){

                showError(
                    "Your account is currently " +
                    status +
                    ". Please contact RiderX support."
                );

                setLoading(false);

                return;

            }


            const email =
                String(
                    customer.email ||
                    ""
                ).trim();


            if(!email){

                showError(
                    "Your RiderX account does not have an email authentication record yet. Please use OTP login or contact support."
                );

                setLoading(false);

                return;

            }


            await signInWithEmailAndPassword(
                /*
                 * firebase-config exports auth
                 * internally; the exported function
                 * requires auth as first parameter.
                 *
                 * Dynamic import below is used to
                 * obtain the initialized auth instance.
                 */
                (await import(
                    "../firebase/firebase-config.js"
                )).auth,
                email,
                pass
            );


            saveSession(
                customer
            );


            if(
                document.getElementById(
                    "remember"
                ).checked
            ){

                localStorage.setItem(
                    "riderx_remember",
                    "true"
                );

            }


            showSuccess(
                "Login successful. Opening Customer Dashboard..."
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "../customer/home.html"
                    );

                },
                650
            );


        }catch(error){

            console.error(
                "Customer login error:",
                error
            );


            let message =
                "Unable to login. Please try again.";


            if(
                error &&
                error.code
            ){

                switch(
                    error.code
                ){

                    case "auth/invalid-credential":
                    case "auth/wrong-password":
                    case "auth/user-not-found":

                        message =
                            "Invalid mobile number or password.";

                        break;

                    case "auth/too-many-requests":

                        message =
                            "Too many login attempts. Please wait and try again.";

                        break;

                    case "auth/network-request-failed":

                        message =
                            "Network error. Please check your internet connection.";

                        break;

                    case "permission-denied":

                        message =
                            "RiderX database permission denied. Please contact admin.";

                        break;

                }

            }


            showError(
                message
            );

            setLoading(false);

        }

    }
);


document
    .getElementById("otpBtn")
    .addEventListener(
        "click",
        function(){

            const mobile =
                normalizePhone(
                    phone.value
                );


            if(
                mobile &&
                !/^[6-9]\d{9}$/.test(
                    mobile
                )
            ){

                showError(
                    "Please enter a valid mobile number."
                );

                return;

            }


            if(mobile){

                localStorage.setItem(
                    "riderx_otp_phone",
                    mobile
                );

            }


            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );


            window.location.href =
                "./otp-login.html";

        }
    );


document
    .getElementById("forgotBtn")
    .addEventListener(
        "click",
        async function(){

            clearMessages();


            const mobile =
                normalizePhone(
                    phone.value
                );


            if(
                !/^[6-9]\d{9}$/.test(
                    mobile
                )
            ){

                showError(
                    "Enter your registered 10-digit mobile number first."
                );

                phone.focus();

                return;

            }


            try{

                const customer =
                    await findCustomerByPhone(
                        mobile
                    );


                if(
                    !customer ||
                    !customer.email
                ){

                    showError(
                        "No registered email was found for this mobile number."
                    );

                    return;

                }


                await sendPasswordResetEmail(
                    (await import(
                        "../firebase/firebase-config.js"
                    )).auth,
                    customer.email
                );


                showSuccess(
                    "Password reset link has been sent to your registered email."
                );


            }catch(error){

                console.error(
                    "Password reset error:",
                    error
                );

                showError(
                    "Unable to send password reset email. Please try again."
                );

            }

        }
    );


document
    .getElementById("backBtn")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "./role.html";

        }
    );


</script></body></html>
