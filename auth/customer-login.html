"use strict";


/* ============================================================
   RIDERX 2.0
   CUSTOMER LOGIN
   FINAL CUSTOMER LOGIN CONTROLLER

   IMPORTANT:
   Authentication is handled by js/auth.js.
   This page does NOT initialize Firebase directly.
   ============================================================ */


const STORAGE = Object.freeze({

    selectedRole:
        "riderx_selected_role",

    legacyRole:
        "riderx_role",

    userRole:
        "userRole",

    user:
        "riderx_user",

    customer:
        "riderx_customer",

    customerId:
        "riderx_customer_id",

    rememberedEmail:
        "riderx_customer_email"

});


const ROUTES = Object.freeze({

    role:
        "./role.html",

    register:
        "./register.html",

    otp:
        "./otp-login.html",

    rider:
        "./rider-login.html",

    customer:
        "../customer/home.html"

});


let RX_AUTH = null;

let authLoadPromise = null;

let busy = false;

let navigationStarted = false;


/* ============================================================
   DOM
============================================================ */

const form =
    document.getElementById(
        "customerLoginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const rememberInput =
    document.getElementById(
        "remember"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const togglePassword =
    document.getElementById(
        "togglePassword"
    );

const forgotPassword =
    document.getElementById(
        "forgotPassword"
    );

const otpButton =
    document.getElementById(
        "otpButton"
    );

const registerButton =
    document.getElementById(
        "registerButton"
    );

const riderLoginButton =
    document.getElementById(
        "riderLoginButton"
    );

const roleButton =
    document.getElementById(
        "roleButton"
    );

const message =
    document.getElementById(
        "message"
    );


/* ============================================================
   HELPERS
============================================================ */

function clean(value) {

    return String(
        value ?? ""
    ).trim();

}


function normalizeRole(role) {

    const value =
        clean(role)
            .toLowerCase()
            .replace(
                /[\s-]+/g,
                "_"
            );


    if (
        [
            "customer",
            "customers",
            "user",
            "users"
        ].includes(value)
    ) {

        return "customer";

    }


    if (
        [
            "rider",
            "riders",
            "driver",
            "drivers",
            "partner",
            "driver_partner",
            "driverpartner",
            "captain"
        ].includes(value)
    ) {

        return "rider";

    }


    if (
        [
            "admin",
            "administrator"
        ].includes(value)
    ) {

        return "admin";

    }


    if (
        [
            "superadmin",
            "super_admin",
            "superadministrator"
        ].includes(value)
    ) {

        return "superadmin";

    }


    return "";

}


function validEmail(email) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
        email
    );

}


/* ============================================================
   ROLE STORAGE
============================================================ */

function setCustomerRole() {

    try {

        localStorage.setItem(
            STORAGE.selectedRole,
            "customer"
        );

        localStorage.setItem(
            STORAGE.legacyRole,
            "customer"
        );

        localStorage.setItem(
            STORAGE.userRole,
            "customer"
        );

    } catch (error) {

        console.warn(
            "RiderX customer role storage failed:",
            error
        );

    }

}


function setRiderRole() {

    try {

        localStorage.setItem(
            STORAGE.selectedRole,
            "rider"
        );

        localStorage.setItem(
            STORAGE.legacyRole,
            "rider"
        );

        localStorage.setItem(
            STORAGE.userRole,
            "rider"
        );

    } catch (error) {

        console.warn(
            "RiderX rider role storage failed:",
            error
        );

    }

}


/* ============================================================
   AUTH ENGINE
============================================================ */

async function loadAuthEngine() {

    if (RX_AUTH) {

        return RX_AUTH;

    }


    if (
        window.RiderX &&
        window.RiderX.auth
    ) {

        RX_AUTH =
            window.RiderX.auth;

        return RX_AUTH;

    }


    if (!authLoadPromise) {

        authLoadPromise =
            import("../js/auth.js");

    }


    await authLoadPromise;


    if (
        window.RiderX &&
        window.RiderX.auth
    ) {

        RX_AUTH =
            window.RiderX.auth;

        return RX_AUTH;

    }


    throw new Error(
        "RiderX authentication engine is unavailable."
    );

}


/* ============================================================
   FIREBASE USER EXTRACTION
============================================================ */

function extractFirebaseUser(
    result
) {

    if (!result) {

        return null;

    }


    if (
        result.uid &&
        (
            result.email ||
            result.phoneNumber ||
            result.providerData
        )
    ) {

        return result;

    }


    if (
        result.user &&
        result.user.uid
    ) {

        return result.user;

    }


    if (
        result.firebaseUser &&
        result.firebaseUser.uid
    ) {

        return result.firebaseUser;

    }


    if (
        result.data?.user &&
        result.data.user.uid
    ) {

        return result.data.user;

    }


    return null;

}


/* ============================================================
   ROLE RESOLUTION
============================================================ */

async function getVerifiedRole(
    auth,
    result
) {

    let role =
        normalizeRole(
            result?.role ||
            result?.user?.role ||
            result?.profile?.role ||
            result?.data?.role ||
            result?.data?.user?.role ||
            result?.firebaseUser?.role
        );


    if (role) {

        return role;

    }


    if (
        auth &&
        typeof auth.getRole === "function"
    ) {

        try {

            const firebaseUser =
                extractFirebaseUser(
                    result
                );


            role =
                normalizeRole(
                    await auth.getRole(
                        firebaseUser
                    )
                );


            if (role) {

                return role;

            }

        } catch (error) {

            console.warn(
                "RiderX customer role lookup failed:",
                error
            );

        }

    }


    if (
        auth &&
        typeof auth.getCurrentUser === "function"
    ) {

        try {

            const currentUser =
                await auth.getCurrentUser();


            role =
                normalizeRole(
                    currentUser?.role ||
                    currentUser?.profile?.role
                );


            if (role) {

                return role;

            }

        } catch (error) {

            console.warn(
                "RiderX current user lookup failed:",
                error
            );

        }

    }


    if (
        auth &&
        typeof auth.getProfile === "function"
    ) {

        try {

            const firebaseUser =
                extractFirebaseUser(
                    result
                );


            const profile =
                await auth.getProfile(
                    firebaseUser
                );


            role =
                normalizeRole(
                    profile?.role ||
                    profile?.data?.role
                );


            if (role) {

                return role;

            }

        } catch (error) {

            console.warn(
                "RiderX profile lookup failed:",
                error
            );

        }

    }


    return "";

}


/* ============================================================
   PROFILE EXTRACTION
============================================================ */

async function getVerifiedProfile(
    auth,
    result
) {

    const directProfile =
        result?.profile ||
        result?.data?.profile ||
        result?.user?.profile;


    if (
        directProfile &&
        typeof directProfile === "object"
    ) {

        return directProfile;

    }


    if (
        auth &&
        typeof auth.getProfile === "function"
    ) {

        try {

            const firebaseUser =
                extractFirebaseUser(
                    result
                );


            const profile =
                await auth.getProfile(
                    firebaseUser
                );


            if (
                profile &&
                typeof profile === "object"
            ) {

                return profile;

            }

        } catch (error) {

            console.warn(
                "RiderX customer profile lookup failed:",
                error
            );

        }

    }


    const currentUser =
        result?.user ||
        result?.firebaseUser ||
        result;


    if (
        currentUser &&
        typeof currentUser === "object"
    ) {

        return {

            uid:
                currentUser.uid,

            email:
                currentUser.email,

            phoneNumber:
                currentUser.phoneNumber,

            displayName:
                currentUser.displayName,

            photoURL:
                currentUser.photoURL

        };

    }


    return {};

}


/* ============================================================
   ACCOUNT ACCESS
============================================================ */

function customerAccess(
    profile
) {

    const status =
        clean(
            profile?.status ||
            profile?.accountStatus ||
            profile?.userStatus ||
            "active"
        ).toLowerCase();


    if (
        profile?.blocked === true ||
        profile?.disabled === true ||
        status === "blocked" ||
        status === "disabled" ||
        status === "suspended"
    ) {

        return {

            allowed:
                false,

            message:
                "Your RiderX Customer account is blocked or suspended. Please contact support."

        };

    }


    if (
        status === "deleted" ||
        status === "deactivated"
    ) {

        return {

            allowed:
                false,

            message:
                "Your RiderX Customer account is deactivated. Please contact support."

        };

    }


    return {

        allowed:
            true,

        message:
            ""

    };

}


/* ============================================================
   SAVE CUSTOMER SESSION
============================================================ */

function saveCustomerSession(
    result,
    profile
) {

    const firebaseUser =
        extractFirebaseUser(
            result
        );


    if (!firebaseUser?.uid) {

        throw new Error(
            "RiderX user session could not be verified."
        );

    }


    const customer = {

        uid:
            clean(firebaseUser.uid),

        id:
            clean(firebaseUser.uid),

        role:
            "customer",

        userRole:
            "customer",

        accountType:
            "customer",

        name:
            clean(
                profile?.name ||
                profile?.fullName ||
                profile?.displayName ||
                firebaseUser.displayName
            ) ||
            "RiderX Customer",

        fullName:
            clean(
                profile?.fullName ||
                profile?.name ||
                profile?.displayName ||
                firebaseUser.displayName
            ),

        displayName:
            clean(
                profile?.displayName ||
                firebaseUser.displayName
            ),

        email:
            clean(
                profile?.email ||
                firebaseUser.email
            ),

        phone:
            clean(
                profile?.phone ||
                profile?.mobile ||
                profile?.phoneNumber ||
                firebaseUser.phoneNumber
            ),

        phoneNumber:
            clean(
                profile?.phoneNumber ||
                firebaseUser.phoneNumber
            ),

        city:
            clean(profile?.city),

        photoURL:
            clean(
                profile?.photoURL ||
                firebaseUser.photoURL
            ),

        rating:
            numberValue(
                profile?.rating,
                5
            ),

        totalRides:
            numberValue(
                profile?.totalRides,
                0
            ),

        completedRides:
            numberValue(
                profile?.completedRides,
                0
            ),

        cancelledRides:
            numberValue(
                profile?.cancelledRides,
                0
            ),

        walletBalance:
            numberValue(
                profile?.walletBalance,
                0
            ),

        referralCode:
            clean(profile?.referralCode),

        currentRideId:
            profile?.currentRideId ||
            null,

        status:
            clean(
                profile?.status ||
                profile?.accountStatus ||
                "active"
            ) || "active",

        loginMethod:
            "password",

        loginAt:
            new Date().toISOString()

    };


    try {

        localStorage.setItem(
            STORAGE.user,
            JSON.stringify(customer)
        );

        localStorage.setItem(
            STORAGE.customer,
            JSON.stringify(customer)
        );

        localStorage.setItem(
            STORAGE.customerId,
            customer.uid
        );

        localStorage.setItem(
            STORAGE.userRole,
            "customer"
        );

        localStorage.setItem(
            STORAGE.legacyRole,
            "customer"
        );

        localStorage.setItem(
            STORAGE.selectedRole,
            "customer"
        );

    } catch (error) {

        console.warn(
            "RiderX customer session cache failed:",
            error
        );

    }

}


/* ============================================================
   CLEAR LOCAL SESSION
============================================================ */

function clearCustomerSession() {

    try {

        localStorage.removeItem(
            STORAGE.user
        );

        localStorage.removeItem(
            STORAGE.customer
        );

        localStorage.removeItem(
            STORAGE.customerId
        );

        localStorage.removeItem(
            STORAGE.userRole
        );

        localStorage.removeItem(
            STORAGE.legacyRole
        );

    } catch (error) {

        console.warn(
            "RiderX customer session cleanup failed:",
            error
        );

    }

}


/* ============================================================
   AUTH LOGOUT
============================================================ */

async function cleanupAuthSession(
    auth
) {

    try {

        if (
            auth &&
            typeof auth.logout === "function"
        ) {

            await auth.logout();

            return;

        }


        if (
            auth &&
            typeof auth.signOut === "function"
        ) {

            await auth.signOut();

        }

    } catch (error) {

        console.warn(
            "RiderX customer logout cleanup failed:",
            error
        );

    }

}


/* ============================================================
   LOGIN
============================================================ */

async function handleLogin(
    event
) {

    event.preventDefault();


    if (
        busy ||
        navigationStarted
    ) {

        return;

    }


    hideMessage();


    const email =
        clean(emailInput.value)
            .toLowerCase();


    const password =
        String(
            passwordInput.value || ""
        );


    if (!email) {

        showMessage(
            "Please enter your email address."
        );

        emailInput.focus();

        return;

    }


    if (!validEmail(email)) {

        showMessage(
            "Please enter a valid email address."
        );

        emailInput.focus();

        return;

    }


    if (!password) {

        showMessage(
            "Please enter your password."
        );

        passwordInput.focus();

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters."
        );

        passwordInput.focus();

        return;

    }


    busy = true;

    setLoading(true);


    try {

        /*
         * Customer is the requested login context only.
         * It is NOT treated as proof of account role.
         */

        setCustomerRole();


        const auth =
            await loadAuthEngine();


        if (
            !auth ||
            typeof auth.loginEmail !== "function"
        ) {

            throw new Error(
                "RiderX email login service is unavailable."
            );

        }


        const result =
            await auth.loginEmail(
                email,
                password
            );


        if (!result) {

            throw new Error(
                "Customer login failed. Please try again."
            );

        }


        const firebaseUser =
            extractFirebaseUser(
                result
            );


        if (!firebaseUser?.uid) {

            throw new Error(
                "RiderX account authentication could not be verified."
            );

        }


        const verifiedRole =
            await getVerifiedRole(
                auth,
                result
            );


        /*
         * NEVER default an unknown role to customer.
         */

        if (!verifiedRole) {

            await cleanupAuthSession(
                auth
            );

            clearCustomerSession();

            throw new Error(
                "Your RiderX account role could not be verified."
            );

        }


        /*
         * Customer login page can ONLY enter the customer
         * dashboard when Firebase/Firestore says customer.
         */

        if (
            verifiedRole !== "customer"
        ) {

            await cleanupAuthSession(
                auth
            );

            clearCustomerSession();

            if (
                verifiedRole === "rider"
            ) {

                setRiderRole();

                throw new Error(
                    "This email belongs to a Rider account. Please use Rider Login."
                );

            }


            if (
                verifiedRole === "admin" ||
                verifiedRole === "superadmin"
            ) {

                throw new Error(
                    "This email belongs to an Admin account. Please use the Admin login."
                );

            }


            throw new Error(
                "This email is not registered as a Customer account."
            );

        }


        const profile =
            await getVerifiedProfile(
                auth,
                result
            );


        const profileRole =
            normalizeRole(
                profile?.role ||
                profile?.userRole ||
                profile?.accountType
            );


        /*
         * If a profile explicitly contains a role, it must
         * agree with the verified role.
         */

        if (
            profileRole &&
            profileRole !== "customer"
        ) {

            await cleanupAuthSession(
                auth
            );

            clearCustomerSession();

            throw new Error(
                "Customer account verification failed. Please contact RiderX support."
            );

        }


        const access =
            customerAccess(
                profile
            );


        if (
            !access.allowed
        ) {

            await cleanupAuthSession(
                auth
            );

            clearCustomerSession();

            throw new Error(
                access.message
            );

        }


        saveCustomerSession(
            result,
            profile
        );


        if (
            rememberInput.checked
        ) {

            try {

                localStorage.setItem(
                    STORAGE.rememberedEmail,
                    email
                );

            } catch (error) {

                console.warn(
                    "RiderX remembered email save failed:",
                    error
                );

            }

        } else {

            try {

                localStorage.removeItem(
                    STORAGE.rememberedEmail
                );

            } catch (error) {

                console.warn(
                    "RiderX remembered email cleanup failed:",
                    error
                );

            }

        }


        showMessage(
            "Login successful. Opening RiderX...",
            "success"
        );


        setLoading(
            true,
            "Login successful..."
        );


        navigationStarted = true;


        window.setTimeout(
            function () {

                window.location.replace(
                    ROUTES.customer
                );

            },
            250
        );

    } catch (error) {

        console.error(
            "RiderX Customer login error:",
            error
        );


        if (
            !navigationStarted
        ) {

            setLoading(false);

            showMessage(
                friendlyAuthError(error)
            );

        }

    }

}


/* ============================================================
   PASSWORD RESET
============================================================ */

async function handleForgotPassword() {

    if (
        busy ||
        navigationStarted
    ) {

        return;

    }


    hideMessage();


    const email =
        clean(emailInput.value)
            .toLowerCase();


    if (!email) {

        showMessage(
            "Enter your email address first."
        );

        emailInput.focus();

        return;

    }


    if (!validEmail(email)) {

        showMessage(
            "Please enter a valid email address."
        );

        emailInput.focus();

        return;

    }


    busy = true;

    setLoading(
        true,
        "Sending reset link...",
        "Please wait"
    );


    try {

        const auth =
            await loadAuthEngine();


        if (
            !auth ||
            typeof auth.resetPassword !== "function"
        ) {

            throw new Error(
                "Password reset service is unavailable."
            );

        }


        await auth.resetPassword(
            email
        );


        setLoading(false);

        showMessage(
            "Password reset email sent. Please check your inbox.",
            "success"
        );

    } catch (error) {

        console.error(
            "RiderX customer password reset error:",
            error
        );


        setLoading(false);

        showMessage(
            friendlyAuthError(error)
        );

    } finally {

        busy = false;

    }

}


/* ============================================================
   PASSWORD VISIBILITY
============================================================ */

function togglePasswordVisibility() {

    if (busy) {

        return;

    }


    const showing =
        passwordInput.type === "text";


    passwordInput.type =
        showing
            ? "password"
            : "text";


    togglePassword.textContent =
        showing
            ? "SHOW"
            : "HIDE";


    togglePassword.setAttribute(
        "aria-label",
        showing
            ? "Show password"
            : "Hide password"
    );


    togglePassword.setAttribute(
        "aria-pressed",
        showing
            ? "false"
            : "true"
    );

}


/* ============================================================
   NAVIGATION
============================================================ */

function navigate(
    target
) {

    if (
        navigationStarted
    ) {

        return;

    }


    navigationStarted = true;

    window.location.replace(
        target
    );

}


/* ============================================================
   LOADING
============================================================ */

function setLoading(
    loading,
    title
) {

    loginButton.disabled =
        Boolean(loading);

    forgotPassword.disabled =
        Boolean(loading);

    otpButton.disabled =
        Boolean(loading);

    registerButton.disabled =
        Boolean(loading);

    riderLoginButton.disabled =
        Boolean(loading);

    roleButton.disabled =
        Boolean(loading);

    togglePassword.disabled =
        Boolean(loading);

    emailInput.disabled =
        Boolean(loading);

    passwordInput.disabled =
        Boolean(loading);


    if (loading) {

        loginButton.innerHTML =
            '<span class="loader" aria-hidden="true"></span>' +
            clean(title) ||
            "Signing in...";

    } else {

        loginButton.textContent =
            "Login as Customer";

    }

}


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
    text,
    type = "error"
) {

    const value =
        clean(text);


    if (!value) {

        hideMessage();

        return;

    }


    message.textContent =
        value;

    message.className =
        "message show " +
        (
            type === "success"
                ? "success"
                : "error"
        );

}


function hideMessage() {

    message.textContent =
        "";

    message.className =
        "message";

}


/* ============================================================
   FRIENDLY AUTH ERROR
============================================================ */

function friendlyAuthError(
    error
) {

    const code =
        clean(
            error?.code
        ).toLowerCase();


    const known = {

        "auth/invalid-email":
            "Please enter a valid email address.",

        "auth/user-not-found":
            "No RiderX account was found with this email.",

        "auth/wrong-password":
            "Incorrect email or password.",

        "auth/invalid-credential":
            "Incorrect email or password.",

        "auth/invalid-login-credentials":
            "Incorrect email or password.",

        "auth/user-disabled":
            "This RiderX account has been disabled.",

        "auth/too-many-requests":
            "Too many login attempts. Please wait and try again later.",

        "auth/network-request-failed":
            "Network error. Check your internet connection and try again.",

        "auth/operation-not-allowed":
            "Email/password authentication is currently unavailable.",

        "auth/configuration-not-found":
            "RiderX authentication is not configured correctly.",

        "auth/invalid-api-key":
            "RiderX authentication configuration is invalid.",

        "auth/app-not-authorized":
            "This RiderX app is not authorized for Firebase authentication.",

        "auth/unauthorized-domain":
            "This RiderX domain is not authorized for Firebase authentication."

    };


    if (known[code]) {

        return known[code];

    }


    const raw =
        clean(
            error?.message
        );


    if (!raw) {

        return "Customer login failed. Please try again.";

    }


    const lower =
        raw.toLowerCase();


    if (
        lower.includes("permission-denied") ||
        lower.includes("permission denied")
    ) {

        return "RiderX account verification was denied by Firebase. Please check your Firestore security rules.";

    }


    if (
        lower.includes("firebaseerror") ||
        lower.includes("firebase error")
    ) {

        return "Unable to complete RiderX authentication. Please try again.";

    }


    return raw;

}


/* ============================================================
   EVENTS
============================================================ */

form.addEventListener(
    "submit",
    handleLogin
);


forgotPassword.addEventListener(
    "click",
    handleForgotPassword
);


togglePassword.addEventListener(
    "click",
    togglePasswordVisibility
);


otpButton.addEventListener(
    "click",
    function () {

        if (busy) {

            return;

        }

        setCustomerRole();

        navigate(
            ROUTES.otp
        );

    }
);


registerButton.addEventListener(
    "click",
    function () {

        if (busy) {

            return;

        }

        setCustomerRole();

        navigate(
            ROUTES.register
        );

    }
);


riderLoginButton.addEventListener(
    "click",
    function () {

        if (busy) {

            return;

        }

        setRiderRole();

        navigate(
            ROUTES.rider
        );

    }
);


roleButton.addEventListener(
    "click",
    function () {

        if (busy) {

            return;

        }

        navigate(
            ROUTES.role
        );

    }
);


emailInput.addEventListener(
    "input",
    function () {

        if (
            message.classList.contains("show") &&
            message.classList.contains("error")
        ) {

            hideMessage();

        }

    }
);


passwordInput.addEventListener(
    "input",
    function () {

        if (
            message.classList.contains("show") &&
            message.classList.contains("error")
        ) {

            hideMessage();

        }

    }
);


/* ============================================================
   STARTUP
============================================================ */

function init() {

    /*
     * This page intentionally does NOT:
     *
     * - import Firebase directly
     * - initialize Firebase
     * - call signInWithEmailAndPassword directly
     * - read Firestore directly for authentication
     * - trust localStorage as proof of authentication
     *
     * js/auth.js is the centralized authentication engine.
     */

    setCustomerRole();


    try {

        const savedEmail =
            clean(
                localStorage.getItem(
                    STORAGE.rememberedEmail
                )
            );


        if (savedEmail) {

            emailInput.value =
                savedEmail;

            rememberInput.checked =
                true;

        }

    } catch (error) {

        console.warn(
            "RiderX remembered email restore failed:",
            error
        );

    }


    hideMessage();

    setLoading(false);


    window.setTimeout(
        function () {

            if (
                !emailInput.disabled &&
                document.visibilityState !== "hidden"
            ) {

                emailInput.focus();

            }

        },
        100
    );


    window.RiderXCustomerLogin =
        Object.freeze({

            normalizeRole,

            loadAuthEngine,

            getVerifiedRole,

            showMessage,

            hideMessage

        });

}


init();
