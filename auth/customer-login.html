<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#FFD400"
>

<meta
    name="description"
    content="RiderX Customer Login"
>

<title>RiderX - Customer Login</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<link
    rel="stylesheet"
    href="../css/auth.css"
>

<link
    rel="stylesheet"
    href="../css/responsive.css"
>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    margin:0;
}

body{
    min-height:100vh;
    min-height:100dvh;
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.auth-page{
    min-height:100vh;
    min-height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        max(14px,env(safe-area-inset-top))
        max(14px,env(safe-area-inset-right))
        max(14px,env(safe-area-inset-bottom))
        max(14px,env(safe-area-inset-left));

    position:relative;
    overflow:auto;
}

.auth-page::before{
    content:"";

    position:absolute;

    width:340px;
    height:340px;

    top:-170px;
    right:-130px;

    border-radius:50%;

    background:
        rgba(255,212,0,.08);

    pointer-events:none;
}

.auth-page::after{
    content:"";

    position:absolute;

    width:300px;
    height:300px;

    bottom:-170px;
    left:-130px;

    border-radius:50%;

    background:
        rgba(255,212,0,.05);

    pointer-events:none;
}

.auth-card{
    position:relative;
    z-index:2;

    width:100%;
    max-width:420px;

    padding:28px 22px 22px;

    border:1px solid #2a2a2a;
    border-radius:22px;

    background:#111;

    box-shadow:
        0 20px 70px rgba(0,0,0,.55);
}

.brand{
    text-align:center;
    margin-bottom:24px;
}

.logo-box{
    width:68px;
    height:68px;

    margin:0 auto 13px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:19px;

    background:#FFD400;
    color:#080808;

    font-size:25px;
    font-weight:1000;

    box-shadow:
        0 8px 30px rgba(255,212,0,.14);
}

.brand h1{
    margin:0;

    font-size:25px;
    font-weight:1000;
}

.brand h1 span{
    color:#FFD400;
}

.brand p{
    margin:7px 0 0;

    color:#777;

    font-size:11px;
}

.welcome{
    margin-bottom:18px;
}

.welcome h2{
    margin:0;

    font-size:18px;
    font-weight:900;
}

.welcome p{
    margin:6px 0 0;

    color:#777;

    font-size:10px;
    line-height:1.5;
}

.message{
    display:none;

    margin-bottom:13px;

    padding:10px;

    border-radius:9px;

    font-size:10px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.error{
    border:1px solid #542828;
    background:#241414;
    color:#ff7777;
}

.success{
    border:1px solid #275335;
    background:#132319;
    color:#65e58b;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    color:#999;

    font-size:9px;
    font-weight:900;

    text-transform:uppercase;
}

.phone-row{
    display:flex;
    gap:8px;
}

.country-code{
    width:82px;
    min-width:82px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #333;
    border-radius:10px;

    background:#1a1a1a;

    color:#FFD400;

    font-size:11px;
    font-weight:900;
}

.form-group input{
    width:100%;
    height:48px;

    padding:0 13px;

    border:1px solid #333;
    border-radius:10px;

    outline:none;

    background:#1a1a1a;
    color:#fff;

    font-size:12px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.phone-row input{
    flex:1;
    min-width:0;
}

.form-group input::placeholder{
    color:#555;
}

.form-group input:focus{
    border-color:#FFD400;

    box-shadow:
        0 0 0 2px
        rgba(255,212,0,.08);
}

.password-row{
    position:relative;
}

.password-row input{
    padding-right:45px;
}

.eye-btn{
    position:absolute;

    right:7px;
    top:50%;

    width:35px;
    height:35px;

    transform:translateY(-50%);

    border:0;
    border-radius:7px;

    background:transparent;

    color:#777;

    cursor:pointer;
}

.eye-btn:hover,
.eye-btn:focus{
    color:#FFD400;
}

.options{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin:2px 0 17px;
}

.remember{
    display:flex;
    align-items:center;

    gap:7px;

    color:#777;

    font-size:9px;

    cursor:pointer;
}

.remember input{
    width:14px;
    height:14px;

    accent-color:#FFD400;
}

.link-btn{
    border:0;
    padding:0;

    background:none;

    color:#FFD400;

    cursor:pointer;

    font-size:9px;
    font-weight:800;
}

.login-btn{
    width:100%;
    min-height:49px;

    border:0;
    border-radius:10px;

    background:#FFD400;
    color:#111;

    cursor:pointer;

    font-size:12px;
    font-weight:1000;

    transition:
        transform .2s ease,
        background .2s ease,
        opacity .2s ease;
}

.login-btn:hover{
    background:#ffe04a;
    transform:translateY(-1px);
}

.login-btn:active{
    transform:scale(.99);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.divider{
    display:flex;
    align-items:center;

    gap:10px;

    margin:19px 0;

    color:#555;

    font-size:9px;
}

.divider::before,
.divider::after{
    content:"";

    flex:1;

    height:1px;

    background:#292929;
}

.otp-btn{
    width:100%;
    min-height:45px;

    border:1px solid #333;
    border-radius:10px;

    background:#191919;

    color:#ddd;

    cursor:pointer;

    font-size:10px;
    font-weight:900;

    transition:
        border-color .2s ease,
        color .2s ease;
}

.otp-btn:hover{
    border-color:#FFD400;
    color:#FFD400;
}

.register{
    margin-top:20px;

    text-align:center;

    color:#777;

    font-size:10px;
}

.register a{
    color:#FFD400;

    text-decoration:none;

    font-weight:900;
}

.register a:hover{
    text-decoration:underline;
}

.back-role{
    display:block;

    width:100%;

    margin-top:11px;

    border:0;

    background:transparent;

    color:#666;

    cursor:pointer;

    font-size:9px;
}

.back-role:hover{
    color:#FFD400;
}

.loader{
    display:inline-block;

    width:13px;
    height:13px;

    margin-right:7px;

    vertical-align:-2px;

    border:2px solid
        rgba(0,0,0,.25);

    border-top-color:#111;

    border-radius:50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.footer{
    margin-top:20px;

    text-align:center;

    color:#444;

    font-size:8px;
}

@media(max-width:480px){

    .auth-page{
        align-items:flex-start;

        padding-top:18px;
        padding-bottom:18px;
    }

    .auth-card{
        padding:
            24px 17px
            18px;

        border-radius:18px;
    }

}

@media(max-width:340px){

    .auth-card{
        padding-left:13px;
        padding-right:13px;
    }

    .country-code{
        width:70px;
        min-width:70px;
    }

    .options{
        align-items:flex-start;
        flex-direction:column;
    }

}

</style>

</head>

<body>

<main class="auth-page">

<section class="auth-card">

<div class="brand">

    <div class="logo-box">
        RX
    </div>

    <h1>
        Rider<span>X</span>
    </h1>

    <p>
        Ride smarter. Ride with RiderX.
    </p>

</div>


<div class="welcome">

    <h2>
        Customer Login
    </h2>

    <p>
        Login to book rides, track trips and manage your wallet.
    </p>

</div>


<div
    class="message error"
    id="errorBox"
    role="alert"
    aria-live="polite"
></div>


<div
    class="message success"
    id="successBox"
    role="status"
    aria-live="polite"
></div>


<form
    id="loginForm"
    novalidate
>

<div class="form-group">

    <label for="phone">
        Mobile Number
    </label>

    <div class="phone-row">

        <div class="country-code">
            +91
        </div>

        <input
            type="tel"
            id="phone"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="10"
            placeholder="Enter mobile number"
            required
        >

    </div>

</div>


<div class="form-group">

    <label for="password">
        Password
    </label>

    <div class="password-row">

        <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="Enter password"
            minlength="6"
            required
        >

        <button
            type="button"
            class="eye-btn"
            id="togglePassword"
            aria-label="Show password"
        >
            👁
        </button>

    </div>

</div>


<div class="options">

    <label class="remember">

        <input
            type="checkbox"
            id="remember"
        >

        Remember me

    </label>


    <button
        type="button"
        class="link-btn"
        id="forgotBtn"
    >
        Forgot password?
    </button>

</div>


<button
    type="submit"
    class="login-btn"
    id="loginBtn"
>
    Login
</button>

</form>


<div class="divider">
    OR
</div>


<button
    type="button"
    class="otp-btn"
    id="otpBtn"
>
    Login with OTP
</button>


<div class="register">

    Don't have an account?

    <a href="./register.html">
        Create account
    </a>

</div>


<button
    type="button"
    class="back-role"
    id="roleBtn"
>
    ← Choose another login type
</button>


<div class="footer">
    © 2026 RiderX • Customer Portal
</div>

</section>

</main>


<!-- =========================================================
     RIDERX FIREBASE CUSTOMER LOGIN
========================================================= -->

<script type="module">

import {

    auth,
    db,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    collection,
    query,
    where,
    getDocs

} from "../firebase/firebase-config.js";


const form =
    document.getElementById(
        "loginForm"
    );

const phoneInput =
    document.getElementById(
        "phone"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const successBox =
    document.getElementById(
        "successBox"
    );

const remember =
    document.getElementById(
        "remember"
    );


/* =========================================================
   PHONE INPUT
========================================================= */

phoneInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    10
                );

    }
);


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

document
    .getElementById(
        "togglePassword"
    )
    .addEventListener(
        "click",
        function(){

            const visible =
                passwordInput.type ===
                "password";

            passwordInput.type =
                visible
                    ? "text"
                    : "password";

            this.textContent =
                visible
                    ? "🙈"
                    : "👁";

            this.setAttribute(
                "aria-label",
                visible
                    ? "Hide password"
                    : "Show password"
            );

        }
    );


/* =========================================================
   LOGIN
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        hideMessages();

        const phone =
            normalizePhone(
                phoneInput.value
            );

        const password =
            passwordInput.value;


        if(
            !/^[6-9]\d{9}$/.test(
                phone
            )
        ){

            showError(
                "Please enter a valid 10-digit Indian mobile number."
            );

            phoneInput.focus();

            return;

        }


        if(
            password.length < 6
        ){

            showError(
                "Password must contain at least 6 characters."
            );

            passwordInput.focus();

            return;

        }


        setLoading(true);


        try{

            /*
             * Find customer profile by phone.
             *
             * Registration stores the profile
             * in Firestore users/{uid}.
             */

            const usersRef =
                collection(
                    db,
                    "users"
                );


            const customerQuery =
                query(
                    usersRef,
                    where(
                        "phone",
                        "in",
                        [
                            phone,
                            "+91" + phone,
                            "91" + phone
                        ]
                    )
                );


            const snapshot =
                await getDocs(
                    customerQuery
                );


            if(
                snapshot.empty
            ){

                showError(
                    "No RiderX customer account was found with this mobile number."
                );

                setLoading(false);

                return;

            }


            let profile =
                null;


            snapshot.forEach(
                function(docSnap){

                    if(profile){
                        return;
                    }

                    const data =
                        docSnap.data() ||
                        {};

                    const role =
                        normalizeRole(
                            data.role ||
                            data.userRole ||
                            data.accountType
                        );

                    if(
                        role === "customer"
                    ){

                        profile = {

                            ...data,

                            uid:
                                data.uid ||
                                docSnap.id

                        };

                    }

                }
            );


            if(!profile){

                showError(
                    "This mobile number is not registered as a RiderX customer."
                );

                setLoading(false);

                return;

            }


            const status =
                String(
                    profile.status ||
                    "active"
                )
                .trim()
                .toLowerCase();


            if(
                [
                    "blocked",
                    "suspended",
                    "disabled"
                ].includes(
                    status
                )
            ){

                showError(
                    "Your RiderX account is currently " +
                    status +
                    ". Please contact support."
                );

                setLoading(false);

                return;

            }


            /*
             * Firebase Email/Password is the actual
             * authentication mechanism.
             *
             * The customer's registered email is
             * retrieved from the Firestore profile.
             */

            const email =
                String(
                    profile.email ||
                    ""
                )
                .trim()
                .toLowerCase();


            if(!email){

                showError(
                    "Your account does not have a registered email for password login. Please use OTP login or update your profile."
                );

                setLoading(false);

                return;

            }


            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const firebaseUser =
                result.user;


            /*
             * Verify that Firebase UID and
             * Firestore profile belong together.
             */

            if(
                profile.uid &&
                firebaseUser.uid !==
                profile.uid
            ){

                await auth.signOut();

                showError(
                    "Account verification failed. Please contact RiderX support."
                );

                setLoading(false);

                return;

            }


            const session = {

                uid:
                    firebaseUser.uid,

                id:
                    firebaseUser.uid,

                name:
                    profile.name ||
                    profile.displayName ||
                    firebaseUser.displayName ||
                    "RiderX Customer",

                displayName:
                    profile.displayName ||
                    profile.name ||
                    firebaseUser.displayName ||
                    "RiderX Customer",

                email:
                    firebaseUser.email ||
                    email,

                phone:
                    normalizePhone(
                        profile.phone ||
                        phone
                    ),

                role:
                    "customer",

                userRole:
                    "customer",

                status:
                    status,

                photoURL:
                    profile.photoURL ||
                    firebaseUser.photoURL ||
                    "",

                loginAt:
                    new Date().toISOString()

            };


            /*
             * Master RiderX session.
             */

            localStorage.setItem(
                "riderx_user",
                JSON.stringify(
                    session
                )
            );

            localStorage.setItem(
                "riderx_role",
                "customer"
            );

            localStorage.setItem(
                "riderx_session",
                JSON.stringify(
                    {
                        uid:
                            firebaseUser.uid,

                        role:
                            "customer",

                        loginAt:
                            Date.now()
                    }
                )
            );


            /*
             * Legacy compatibility keys.
             */

            localStorage.setItem(
                "riderx_customer",
                JSON.stringify(
                    session
                )
            );

            localStorage.setItem(
                "userRole",
                "customer"
            );

            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );


            if(
                remember.checked
            ){

                localStorage.setItem(
                    "riderx_remember",
                    "true"
                );

            }else{

                localStorage.removeItem(
                    "riderx_remember"
                );

            }


            showSuccess(
                "Login successful. Opening your RiderX dashboard..."
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "../customer/home.html"
                    );

                },
                700
            );


        }catch(error){

            console.error(
                "RiderX customer login error:",
                error
            );


            showError(
                firebaseErrorMessage(
                    error
                )
            );


            setLoading(false);

        }

    }
);


/* =========================================================
   OTP LOGIN
========================================================= */

document
    .getElementById(
        "otpBtn"
    )
    .addEventListener(
        "click",
        function(){

            const phone =
                normalizePhone(
                    phoneInput.value
                );


            if(
                phone &&
                !/^[6-9]\d{9}$/.test(
                    phone
                )
            ){

                showError(
                    "Please enter a valid mobile number."
                );

                phoneInput.focus();

                return;

            }


            if(phone){

                localStorage.setItem(
                    "riderx_otp_phone",
                    phone
                );

            }


            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );


            window.location.href =
                "./otp-login.html";

        }
    );


/* =========================================================
   FORGOT PASSWORD
========================================================= */

document
    .getElementById(
        "forgotBtn"
    )
    .addEventListener(
        "click",
        async function(){

            hideMessages();


            const phone =
                normalizePhone(
                    phoneInput.value
                );


            if(
                phone &&
                !/^[6-9]\d{9}$/.test(
                    phone
                )
            ){

                showError(
                    "Please enter a valid mobile number."
                );

                phoneInput.focus();

                return;

            }


            if(!phone){

                showError(
                    "Enter your registered mobile number first."
                );

                phoneInput.focus();

                return;

            }


            const button =
                document.getElementById(
                    "forgotBtn"
                );


            button.disabled =
                true;


            try{

                const usersRef =
                    collection(
                        db,
                        "users"
                    );


                const q =
                    query(
                        usersRef,
                        where(
                            "phone",
                            "in",
                            [
                                phone,
                                "+91" + phone,
                                "91" + phone
                            ]
                        )
                    );


                const snapshot =
                    await getDocs(q);


                let email =
                    "";


                snapshot.forEach(
                    function(docSnap){

                        if(email){
                            return;
                        }


                        const data =
                            docSnap.data() ||
                            {};


                        const role =
                            normalizeRole(
                                data.role ||
                                data.userRole ||
                                data.accountType
                            );


                        if(
                            role ===
                            "customer"
                        ){

                            email =
                                String(
                                    data.email ||
                                    ""
                                )
                                .trim()
                                .toLowerCase();

                        }

                    }
                );


                if(!email){

                    showError(
                        "No customer account with this mobile number was found."
                    );

                    return;

                }


                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showSuccess(
                    "Password reset link sent to your registered email."
                );


            }catch(error){

                console.error(
                    "Password reset error:",
                    error
                );


                showError(
                    firebaseErrorMessage(
                        error
                    )
                );


            }finally{

                button.disabled =
                    false;

            }

        }
    );


/* =========================================================
   ROLE SELECTOR
========================================================= */

document
    .getElementById(
        "roleBtn"
    )
    .addEventListener(
        "click",
        function(){

            localStorage.removeItem(
                "riderx_selected_role"
            );

            window.location.href =
                "./role.html";

        }
    );


/* =========================================================
   HELPERS
========================================================= */

function normalizePhone(
    value
){

    let phone =
        String(
            value || ""
        )
        .replace(
            /\D/g,
            ""
        );


    if(
        phone.startsWith("91") &&
        phone.length > 10
    ){

        phone =
            phone.slice(
                -10
            );

    }


    return phone.slice(
        -10
    );

}


function normalizeRole(
    value
){

    const role =
        String(
            value || ""
        )
        .trim()
        .toLowerCase();


    if(
        role === "customer"
    ){

        return "customer";

    }


    if(
        role === "rider" ||
        role === "driver"
    ){

        return "rider";

    }


    if(
        role === "admin"
    ){

        return "admin";

    }


    return "";

}


function setLoading(
    loading
){

    loginBtn.disabled =
        loading;


    if(loading){

        loginBtn.innerHTML =
            '<span class="loader"></span>Logging in...';

    }else{

        loginBtn.textContent =
            "Login";

    }

}


function hideMessages(){

    errorBox.classList.remove(
        "show"
    );

    successBox.classList.remove(
        "show"
    );

    errorBox.textContent =
        "";

    successBox.textContent =
        "";

}


function showError(
    message
){

    successBox.classList.remove(
        "show"
    );

    errorBox.textContent =
        message;

    errorBox.classList.add(
        "show"
    );

}


function showSuccess(
    message
){

    errorBox.classList.remove(
        "show"
    );

    successBox.textContent =
        message;

    successBox.classList.add(
        "show"
    );

}


function firebaseErrorMessage(
    error
){

    const code =
        String(
            error?.code ||
            ""
        );


    switch(code){

        case "auth/invalid-credential":

        case "auth/wrong-password":

        case "auth/user-not-found":

            return "Invalid mobile number or password.";


        case "auth/invalid-email":

            return "The registered customer email is invalid.";


        case "auth/user-disabled":

            return "This Firebase account has been disabled.";


        case "auth/too-many-requests":

            return "Too many login attempts. Please wait and try again.";


        case "auth/network-request-failed":

            return "Network error. Please check your internet connection.";


        case "permission-denied":

            return "RiderX could not access your account profile. Please check Firebase permissions.";


        default:

            return (
                error?.message ||
                "Unable to login right now. Please try again."
            );

    }

}

</script>
