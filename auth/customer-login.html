<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFD400"><title>RiderX - Customer Login</title><link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Auth.css">
<link rel="stylesheet" href="../css/Responsive.css"><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.auth-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
    overflow:hidden;
}

.auth-page::before{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    top:-150px;
    right:-120px;
    border-radius:50%;
    background:rgba(255,212,0,.08);
}

.auth-page::after{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    bottom:-150px;
    left:-120px;
    border-radius:50%;
    background:rgba(255,212,0,.05);
}

.auth-card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:420px;
    padding:28px 22px 22px;
    border:1px solid #2a2a2a;
    border-radius:22px;
    background:#111;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.brand{
    text-align:center;
    margin-bottom:25px;
}

.logo-box{
    width:68px;
    height:68px;
    margin:0 auto 13px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:19px;
    background:#FFD400;
    color:#080808;
    font-size:25px;
    font-weight:1000;
    box-shadow:0 8px 30px rgba(255,212,0,.14);
}

.brand h1{
    margin:0;
    font-size:25px;
    font-weight:1000;
}

.brand h1 span{
    color:#FFD400;
}

.brand p{
    margin:7px 0 0;
    color:#777;
    font-size:11px;
}

.welcome{
    margin-bottom:18px;
}

.welcome h2{
    margin:0;
    font-size:18px;
}

.welcome p{
    margin:6px 0 0;
    color:#777;
    font-size:10px;
    line-height:1.5;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#999;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
    font-size:14px;
    pointer-events:none;
}

.form-group input{
    width:100%;
    height:48px;
    padding:0 13px 0 38px;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
    background:#1a1a1a;
    color:#fff;
    font-size:12px;
}

.form-group input::placeholder{
    color:#555;
}

.form-group input:focus{
    border-color:#FFD400;
    box-shadow:0 0 0 2px rgba(255,212,0,.08);
}

.phone-row{
    display:flex;
    gap:8px;
}

.country-code{
    width:82px;
    flex:none;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #333;
    border-radius:10px;
    background:#1a1a1a;
    color:#FFD400;
    font-size:11px;
    font-weight:900;
}

.phone-row input{
    flex:1;
    padding-left:13px;
}

.password-row{
    position:relative;
}

.password-row input{
    padding-right:45px;
}

.eye-btn{
    position:absolute;
    right:8px;
    top:50%;
    width:34px;
    height:34px;
    transform:translateY(-50%);
    border:0;
    border-radius:7px;
    background:transparent;
    color:#777;
    cursor:pointer;
}

.eye-btn:hover{
    color:#FFD400;
}

.options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:2px 0 17px;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:#777;
    font-size:9px;
    cursor:pointer;
}

.remember input{
    width:14px;
    height:14px;
    accent-color:#FFD400;
}

.link-btn{
    border:0;
    padding:0;
    background:none;
    color:#FFD400;
    cursor:pointer;
    font-size:9px;
    font-weight:800;
}

.login-btn{
    width:100%;
    height:49px;
    border:0;
    border-radius:10px;
    background:#FFD400;
    color:#111;
    cursor:pointer;
    font-size:12px;
    font-weight:1000;
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-1px);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:19px 0;
    color:#555;
    font-size:9px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#292929;
}

.otp-btn{
    width:100%;
    height:45px;
    border:1px solid #333;
    border-radius:10px;
    background:#191919;
    color:#ddd;
    cursor:pointer;
    font-size:10px;
    font-weight:900;
}

.otp-btn:hover{
    border-color:#FFD400;
    color:#FFD400;
}

.register{
    margin-top:20px;
    text-align:center;
    color:#777;
    font-size:10px;
}

.register a{
    color:#FFD400;
    text-decoration:none;
    font-weight:900;
}

.back-role{
    display:block;
    width:100%;
    margin-top:11px;
    border:0;
    background:transparent;
    color:#666;
    cursor:pointer;
    font-size:9px;
}

.back-role:hover{
    color:#FFD400;
}

.error{
    display:none;
    margin-bottom:13px;
    padding:10px;
    border:1px solid #542828;
    border-radius:9px;
    background:#241414;
    color:#ff7777;
    font-size:9px;
    line-height:1.5;
}

.error.show{
    display:block;
}

.success{
    display:none;
    margin-bottom:13px;
    padding:10px;
    border:1px solid #275335;
    border-radius:9px;
    background:#132319;
    color:#65e58b;
    font-size:9px;
}

.success.show{
    display:block;
}

.loader{
    display:inline-block;
    width:13px;
    height:13px;
    margin-right:7px;
    vertical-align:-2px;
    border:2px solid rgba(0,0,0,.25);
    border-top-color:#111;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#444;
    font-size:8px;
}

@media(max-width:480px){

    .auth-page{
        padding:12px;
    }

    .auth-card{
        padding:24px 17px 18px;
        border-radius:18px;
    }

}

</style></head><body><main class="auth-page"><section class="auth-card"><div class="brand"><div class="logo-box">
    RX
</div>

<h1>
    Rider<span>X</span>
</h1>

<p>
    Ride smarter. Ride with RiderX.
</p>

</div><div class="welcome"><h2>
    Customer Login
</h2>

<p>
    Login to book rides, track trips and manage your wallet.
</p>

</div><div
    class="error"
    id="errorBox"
></div><div
    class="success"
    id="successBox"
></div><form
    id="loginForm"
    novalidate
><div class="form-group"><label>
    Mobile Number
</label>

<div class="phone-row">

    <div class="country-code">
        +91
    </div>

    <input
        type="tel"
        id="phone"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="10"
        placeholder="Enter mobile number"
        required
    >

</div>

</div><div class="form-group"><label>
    Password
</label>

<div class="password-row">

    <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Enter password"
        minlength="6"
        required
    >

    <button
        type="button"
        class="eye-btn"
        id="togglePassword"
        aria-label="Show password"
    >
        👁
    </button>

</div>

</div><div class="options"><label class="remember">

    <input
        type="checkbox"
        id="remember"
    >

    Remember me

</label>


<button
    type="button"
    class="link-btn"
    id="forgotBtn"
>
    Forgot password?
</button>

</div><button
type="submit"
class="login-btn"
id="loginBtn"

«»

Login

</button></form><div class="divider">
    OR
</div><button
type="button"
class="otp-btn"
id="otpBtn"

«»

Login with OTP

</button><div class="register">Don't have an account?

<a
    href="./register.html"
>
    Create account
</a>

</div><button
type="button"
class="back-role"
id="roleBtn"

«»

← Choose another login type

</button><div class="footer">
    © 2026 RiderX • Customer Portal
</div></section></main><script>

"use strict";


const form =
    document.getElementById(
        "loginForm"
    );

const phone =
    document.getElementById(
        "phone"
    );

const password =
    document.getElementById(
        "password"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const successBox =
    document.getElementById(
        "successBox"
    );



phone.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    10
                );

    }
);



document
    .getElementById(
        "togglePassword"
    )
    .addEventListener(
        "click",
        function(){

            const isPassword =
                password.type ===
                "password";


            password.type =
                isPassword
                    ? "text"
                    : "password";


            this.textContent =
                isPassword
                    ? "🙈"
                    : "👁";

        }
    );



form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessages();


        const mobile =
            phone.value.trim();


        const pass =
            password.value;


        if(!/^[6-9]\d{9}$/.test(mobile)){

            showError(
                "Please enter a valid 10-digit Indian mobile number."
            );

            phone.focus();

            return;

        }


        if(pass.length < 6){

            showError(
                "Password must contain at least 6 characters."
            );

            password.focus();

            return;

        }


        setLoading(
            true
        );


        try{

            /*
             * Firebase/Auth integration hook.
             *
             * If the main RiderX auth system is connected,
             * this page can use the same session created here.
             */

            const users =
                getUsers();


            const user =
                users.find(
                    function(item){

                        return (
                            normalizePhone(
                                item.phone
                            ) ===
                            mobile &&
                            item.password ===
                            pass &&
                            (
                                !item.role ||
                                item.role ===
                                "customer"
                            )
                        );

                    }
                );


            if(!user){

                /*
                 * Demo/local fallback.
                 * Replace with Firebase Authentication
                 * when Firebase auth is enabled.
                 */

                showError(
                    "Invalid mobile number or password."
                );

                setLoading(
                    false
                );

                return;

            }


            const session = {

                uid:
                    user.uid ||
                    "customer_" +
                    mobile,

                name:
                    user.name ||
                    "RiderX Customer",

                phone:
                    mobile,

                role:
                    "customer",

                loginAt:
                    new Date().toISOString()

            };


            localStorage.setItem(
                "riderx_user",
                JSON.stringify(
                    session
                )
            );


            localStorage.setItem(
                "userRole",
                "customer"
            );


            if(
                document.getElementById(
                    "remember"
                ).checked
            ){

                localStorage.setItem(
                    "riderx_remember",
                    "true"
                );

            }


            showSuccess(
                "Login successful. Opening customer dashboard..."
            );


            setTimeout(
                function(){

                    window.location.href =
                        "../customer/home.html";

                },
                700
            );


        }catch(error){

            console.error(
                error
            );

            showError(
                "Unable to login right now. Please try again."
            );

            setLoading(
                false
            );

        }

    }
);



document
    .getElementById(
        "otpBtn"
    )
    .addEventListener(
        "click",
        function(){

            const mobile =
                phone.value.trim();


            if(
                mobile &&
                !/^[6-9]\d{9}$/.test(
                    mobile
                )
            ){

                showError(
                    "Please enter a valid mobile number."
                );

                phone.focus();

                return;

            }


            if(mobile){

                localStorage.setItem(
                    "riderx_otp_phone",
                    mobile
                );

            }


            window.location.href =
                "./otp-login.html";

        }
    );



document
    .getElementById(
        "forgotBtn"
    )
    .addEventListener(
        "click",
        function(){

            const mobile =
                phone.value.trim();


            if(
                mobile &&
                !/^[6-9]\d{9}$/.test(
                    mobile
                )
            ){

                showError(
                    "Please enter a valid mobile number."
                );

                return;

            }


            localStorage.setItem(
                "riderx_reset_role",
                "customer"
            );


            if(mobile){

                localStorage.setItem(
                    "riderx_reset_phone",
                    mobile
                );

            }


            window.location.href =
                "./otp-login.html";

        }
    );



document
    .getElementById(
        "roleBtn"
    )
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "./role.html";

        }
    );



function getUsers(){

    try{

        const data =
            localStorage.getItem(
                "riderx_users"
            );


        if(data){

            const users =
                JSON.parse(
                    data
                );


            if(
                Array.isArray(
                    users
                )
            ){

                return users;

            }

        }

    }catch(error){

        console.error(
            error
        );

    }


    /*
     * Also support the common keys
     * used by earlier RiderX auth pages.
     */

    try{

        const customer =
            localStorage.getItem(
                "riderx_customer"
            );


        if(customer){

            const parsed =
                JSON.parse(
                    customer
                );


            if(parsed){

                return [
                    parsed
                ];

            }

        }

    }catch(error){

        console.error(
            error
        );

    }


    return [];

}



function normalizePhone(
    value
){

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    )
    .slice(
        -10
    );

}



function setLoading(
    loading
){

    loginBtn.disabled =
        loading;


    if(loading){

        loginBtn.innerHTML =
            '<span class="loader"></span>Logging in...';

    }else{

        loginBtn.textContent =
            "Login";

    }

}



function hideMessages(){

    errorBox.classList.remove(
        "show"
    );

    successBox.classList.remove(
        "show"
    );

}



function showError(
    message
){

    successBox.classList.remove(
        "show"
    );

    errorBox.textContent =
        message;

    errorBox.classList.add(
        "show"
    );

}



function showSuccess(
    message
){

    errorBox.classList.remove(
        "show"
    );

    successBox.textContent =
        message;

    successBox.classList.add(
        "show"
    );

}

</script></body></html>
