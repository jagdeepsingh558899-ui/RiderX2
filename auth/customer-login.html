<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX Customer Login"
    >

    <title>RiderX - Customer Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background: #070707;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }


        .auth-page {

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                max(15px, env(safe-area-inset-top))
                max(15px, env(safe-area-inset-right))
                max(15px, env(safe-area-inset-bottom))
                max(15px, env(safe-area-inset-left));

            position: relative;

            overflow: auto;
        }


        .auth-page::before {

            content: "";

            position: absolute;

            width: 340px;
            height: 340px;

            top: -170px;
            right: -130px;

            border-radius: 50%;

            background:
                rgba(255, 212, 0, .08);

            pointer-events: none;
        }


        .auth-page::after {

            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            bottom: -170px;
            left: -130px;

            border-radius: 50%;

            background:
                rgba(255, 212, 0, .05);

            pointer-events: none;
        }


        .auth-card {

            position: relative;

            z-index: 2;

            width: 100%;
            max-width: 430px;

            padding: 28px 22px 22px;

            border:
                1px solid #292929;

            border-radius: 22px;

            background: #111111;

            box-shadow:
                0 22px 70px rgba(0, 0, 0, .55);
        }


        .brand {

            text-align: center;

            margin-bottom: 24px;
        }


        .logo-box {

            width: 68px;
            height: 68px;

            margin: 0 auto 13px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 19px;

            background: #ffd400;

            color: #080808;

            font-size: 25px;

            font-weight: 1000;

            box-shadow:
                0 8px 30px
                rgba(255, 212, 0, .14);
        }


        .brand h1 {

            margin: 0;

            font-size: 25px;

            font-weight: 1000;
        }


        .brand h1 span {

            color: #ffd400;
        }


        .brand p {

            margin: 7px 0 0;

            color: #777777;

            font-size: 10px;
        }


        .welcome {

            margin-bottom: 18px;
        }


        .welcome h2 {

            margin: 0;

            font-size: 19px;

            font-weight: 900;
        }


        .welcome p {

            margin: 6px 0 0;

            color: #777777;

            font-size: 10px;

            line-height: 1.5;
        }


        .message {

            display: none;

            margin-bottom: 13px;

            padding: 11px;

            border-radius: 9px;

            font-size: 10px;

            line-height: 1.5;
        }


        .message.show {

            display: block;
        }


        .message.error {

            border:
                1px solid #542828;

            background: #241414;

            color: #ff7777;
        }


        .message.success {

            border:
                1px solid #275335;

            background: #132319;

            color: #65e58b;
        }


        .form-group {

            margin-bottom: 14px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #999999;

            font-size: 9px;

            font-weight: 900;

            text-transform: uppercase;
        }


        .phone-row {

            display: flex;

            gap: 8px;
        }


        .country-code {

            width: 82px;
            min-width: 82px;

            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid #333333;

            border-radius: 10px;

            background: #1a1a1a;

            color: #ffd400;

            font-size: 11px;

            font-weight: 900;
        }


        .form-group input {

            width: 100%;
            height: 48px;

            padding:
                0 13px;

            border:
                1px solid #333333;

            border-radius: 10px;

            outline: none;

            background: #1a1a1a;

            color: #ffffff;

            font-size: 12px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }


        .phone-row input {

            flex: 1;

            min-width: 0;
        }


        .form-group input::placeholder {

            color: #555555;
        }


        .form-group input:focus {

            border-color: #ffd400;

            box-shadow:
                0 0 0 2px
                rgba(255, 212, 0, .08);
        }


        .form-group input.field-error {

            border-color: #ff5555;

            box-shadow:
                0 0 0 2px
                rgba(255, 80, 80, .08);
        }


        .password-row {

            position: relative;
        }


        .password-row input {

            padding-right: 45px;
        }


        .eye-btn {

            position: absolute;

            right: 7px;
            top: 50%;

            width: 35px;
            height: 35px;

            transform:
                translateY(-50%);

            border: 0;

            border-radius: 7px;

            background: transparent;

            color: #777777;

            cursor: pointer;
        }


        .eye-btn:hover {

            color: #ffd400;
        }


        .options {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin:
                2px 0 17px;
        }


        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #777777;

            font-size: 9px;

            cursor: pointer;
        }


        .remember input {

            width: 14px;
            height: 14px;

            accent-color: #ffd400;
        }


        .link-btn {

            padding: 0;

            border: 0;

            background: transparent;

            color: #ffd400;

            cursor: pointer;

            font-size: 9px;

            font-weight: 800;
        }


        .link-btn:disabled {

            opacity: .5;

            cursor: not-allowed;
        }


        .login-btn {

            width: 100%;

            min-height: 49px;

            border: 0;

            border-radius: 10px;

            background: #ffd400;

            color: #111111;

            cursor: pointer;

            font-size: 12px;

            font-weight: 1000;

            transition: .2s ease;
        }


        .login-btn:hover {

            background: #ffe04a;

            transform:
                translateY(-1px);
        }


        .login-btn:active {

            transform: scale(.99);
        }


        .login-btn:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }


        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 19px 0;

            color: #555555;

            font-size: 9px;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #292929;
        }


        .otp-btn {

            width: 100%;

            min-height: 45px;

            border:
                1px solid #333333;

            border-radius: 10px;

            background: #191919;

            color: #dddddd;

            cursor: pointer;

            font-size: 10px;

            font-weight: 900;

            transition: .2s ease;
        }


        .otp-btn:hover {

            border-color: #ffd400;

            color: #ffd400;
        }


        .register {

            margin-top: 20px;

            text-align: center;

            color: #777777;

            font-size: 10px;
        }


        .register a {

            color: #ffd400;

            text-decoration: none;

            font-weight: 900;
        }


        .register a:hover {

            text-decoration: underline;
        }


        .back-role {

            display: block;

            width: 100%;

            margin-top: 12px;

            border: 0;

            background: transparent;

            color: #666666;

            cursor: pointer;

            font-size: 9px;
        }


        .back-role:hover {

            color: #ffd400;
        }


        .loader {

            display: inline-block;

            width: 13px;
            height: 13px;

            margin-right: 7px;

            vertical-align: -2px;

            border:
                2px solid
                rgba(0, 0, 0, .25);

            border-top-color:
                #111111;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;
        }


        .footer {

            margin-top: 20px;

            text-align: center;

            color: #444444;

            font-size: 8px;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        @media (max-width: 480px) {

            .auth-page {

                align-items:
                    flex-start;

                padding-top: 18px;
                padding-bottom: 18px;
            }


            .auth-card {

                padding:
                    24px 17px 18px;

                border-radius: 18px;
            }
        }


        @media (max-width: 340px) {

            .auth-card {

                padding-left: 13px;
                padding-right: 13px;
            }


            .country-code {

                width: 70px;
                min-width: 70px;
            }


            .options {

                align-items:
                    flex-start;

                flex-direction: column;
            }
        }

    </style>

</head>


<body>


<main class="auth-page">


    <section class="auth-card">


        <div class="brand">

            <div class="logo-box">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                Ride smarter. Ride with RiderX.
            </p>

        </div>


        <div class="welcome">

            <h2>
                Customer Login
            </h2>

            <p>
                Login to book rides, track trips and manage your wallet.
            </p>

        </div>


        <div
            class="message error"
            id="errorBox"
            role="alert"
            aria-live="polite"
        ></div>


        <div
            class="message success"
            id="successBox"
            role="status"
            aria-live="polite"
        ></div>


        <form
            id="loginForm"
            novalidate
        >


            <div class="form-group">

                <label for="phone">
                    Mobile Number
                </label>


                <div class="phone-row">

                    <div class="country-code">
                        +91
                    </div>


                    <input
                        type="tel"
                        id="phone"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="10"
                        placeholder="Enter mobile number"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="password-row">

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        minlength="6"
                        maxlength="100"
                        placeholder="Enter password"
                        required
                    >


                    <button
                        type="button"
                        class="eye-btn"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>


                <button
                    type="button"
                    class="link-btn"
                    id="forgotBtn"
                >
                    Forgot password?
                </button>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>


        </form>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            class="otp-btn"
            id="otpBtn"
        >
            Login with OTP
        </button>


        <div class="register">

            Don't have an account?

            <a
                href="./register.html"
                id="registerLink"
            >
                Create account
            </a>

        </div>


        <button
            type="button"
            class="back-role"
            id="roleBtn"
        >
            ← Choose another login type
        </button>


        <div class="footer">

            © 2026 RiderX • Customer Portal

        </div>


    </section>


</main>


<script type="module">

    "use strict";


    /* ========================================================
       FIREBASE
    ======================================================== */

    import {

        auth,
        db,

        signInWithEmailAndPassword,
        sendPasswordResetEmail,

        collection,
        query,
        where,
        getDocs,

        onAuthStateChanged,
        signOut

    } from "../firebase/firebase-config.js";


    /* ========================================================
       ELEMENTS
    ======================================================== */

    const form =
        document.getElementById(
            "loginForm"
        );


    const phoneInput =
        document.getElementById(
            "phone"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const successBox =
        document.getElementById(
            "successBox"
        );


    const remember =
        document.getElementById(
            "remember"
        );


    const forgotBtn =
        document.getElementById(
            "forgotBtn"
        );


    const otpBtn =
        document.getElementById(
            "otpBtn"
        );


    const roleBtn =
        document.getElementById(
            "roleBtn"
        );


    /* ========================================================
       REMEMBER PREFERENCE
    ======================================================== */

    remember.checked =
        localStorage.getItem(
            "riderx_remember"
        ) === "true";


    /* ========================================================
       PHONE INPUT
    ======================================================== */

    phoneInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(
                        /\D/g,
                        ""
                    )
                    .slice(
                        0,
                        10
                    );


            clearFieldError(
                this
            );

            hideMessages();

        }
    );


    /* ========================================================
       PASSWORD INPUT
    ======================================================== */

    passwordInput.addEventListener(
        "input",
        function () {

            clearFieldError(
                this
            );

            hideMessages();

        }
    );


    /* ========================================================
       PASSWORD TOGGLE
    ======================================================== */

    document
        .getElementById(
            "togglePassword"
        )
        .addEventListener(
            "click",
            function () {

                const visible =
                    passwordInput.type ===
                    "password";


                passwordInput.type =
                    visible
                        ? "text"
                        : "password";


                this.textContent =
                    visible
                        ? "🙈"
                        : "👁";


                this.setAttribute(
                    "aria-label",
                    visible
                        ? "Hide password"
                        : "Show password"
                );

            }
        );


    /* ========================================================
       LOGIN
    ======================================================== */

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            hideMessages();

            clearFieldError(
                phoneInput
            );

            clearFieldError(
                passwordInput
            );


            const phone =
                normalizePhone(
                    phoneInput.value
                );


            const password =
                passwordInput.value;


            /* ------------------------------------------------
               VALIDATE PHONE
            ------------------------------------------------ */

            if (
                !/^[6-9]\d{9}$/.test(
                    phone
                )
            ) {

                markFieldError(
                    phoneInput
                );

                showError(
                    "Please enter a valid 10-digit Indian mobile number."
                );

                phoneInput.focus();

                return;
            }


            /* ------------------------------------------------
               VALIDATE PASSWORD
            ------------------------------------------------ */

            if (
                password.length < 6
            ) {

                markFieldError(
                    passwordInput
                );

                showError(
                    "Password must contain at least 6 characters."
                );

                passwordInput.focus();

                return;
            }


            setLoading(
                true
            );


            try {


                /* --------------------------------------------
                   FIND CUSTOMER PROFILE
                -------------------------------------------- */

                const usersRef =
                    collection(
                        db,
                        "users"
                    );


                const customerQuery =
                    query(
                        usersRef,

                        where(
                            "phone",
                            "in",
                            [
                                phone,
                                "+91" + phone,
                                "91" + phone
                            ]
                        )
                    );


                const snapshot =
                    await getDocs(
                        customerQuery
                    );


                if (
                    snapshot.empty
                ) {

                    showError(
                        "No RiderX customer account was found with this mobile number."
                    );

                    setLoading(
                        false
                    );

                    return;
                }


                /* --------------------------------------------
                   FIND CUSTOMER ROLE
                -------------------------------------------- */

                let profile =
                    null;


                snapshot.forEach(
                    function (docSnap) {

                        if (
                            profile
                        ) {
                            return;
                        }


                        const data =
                            docSnap.data() ||
                            {};


                        const role =
                            normalizeRole(
                                data.role ||
                                data.userRole ||
                                data.accountType
                            );


                        if (
                            role ===
                            "customer"
                        ) {

                            profile = {

                                ...data,

                                uid:
                                    data.uid ||
                                    docSnap.id

                            };

                        }

                    }
                );


                if (
                    !profile
                ) {

                    showError(
                        "This mobile number is not registered as a RiderX customer."
                    );

                    setLoading(
                        false
                    );

                    return;
                }


                /* --------------------------------------------
                   ACCOUNT STATUS
                -------------------------------------------- */

                const status =
                    normalizeStatus(
                        profile.status ||
                        "active"
                    );


                if (
                    [
                        "blocked",
                        "suspended",
                        "disabled"
                    ].includes(
                        status
                    )
                ) {

                    showError(
                        "Your RiderX account is currently " +
                        status +
                        ". Please contact RiderX support."
                    );

                    setLoading(
                        false
                    );

                    return;
                }


                /* --------------------------------------------
                   EMAIL REQUIRED FOR PASSWORD AUTH
                -------------------------------------------- */

                const email =
                    String(
                        profile.email ||
                        ""
                    )
                        .trim()
                        .toLowerCase();


                if (
                    !email
                ) {

                    showError(
                        "Your account does not have a registered email. Please use OTP login or update your profile."
                    );

                    setLoading(
                        false
                    );

                    return;
                }


                /* --------------------------------------------
                   FIREBASE AUTHENTICATION
                -------------------------------------------- */

                const result =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const firebaseUser =
                    result.user;


                if (
                    !firebaseUser
                ) {

                    throw new Error(
                        "Authentication failed."
                    );
                }


                /* --------------------------------------------
                   UID SECURITY CHECK
                -------------------------------------------- */

                if (
                    profile.uid &&
                    firebaseUser.uid !==
                    profile.uid
                ) {

                    await signOut(
                        auth
                    );


                    showError(
                        "Account verification failed. Please contact RiderX support."
                    );

                    setLoading(
                        false
                    );

                    return;
                }


                /* --------------------------------------------
                   CUSTOMER SESSION
                -------------------------------------------- */

                const session = {

                    uid:
                        firebaseUser.uid,

                    id:
                        firebaseUser.uid,

                    name:
                        profile.name ||
                        profile.fullName ||
                        profile.displayName ||
                        firebaseUser.displayName ||
                        "RiderX Customer",

                    fullName:
                        profile.fullName ||
                        profile.name ||
                        profile.displayName ||
                        firebaseUser.displayName ||
                        "RiderX Customer",

                    displayName:
                        profile.displayName ||
                        profile.name ||
                        profile.fullName ||
                        firebaseUser.displayName ||
                        "RiderX Customer",

                    email:
                        firebaseUser.email ||
                        email,

                    phone:
                        normalizePhone(
                            profile.phone ||
                            profile.mobile ||
                            phone
                        ),

                    mobile:
                        normalizePhone(
                            profile.mobile ||
                            profile.phone ||
                            phone
                        ),

                    role:
                        "customer",

                    userRole:
                        "customer",

                    status:
                        status,

                    city:
                        profile.city ||
                        "Chandigarh",

                    photoURL:
                        profile.photoURL ||
                        firebaseUser.photoURL ||
                        "",

                    rating:
                        Number(
                            profile.rating ??
                            5
                        ),

                    ratingCount:
                        Number(
                            profile.ratingCount ??
                            0
                        ),

                    loginAt:
                        new Date()
                            .toISOString()

                };


                /* --------------------------------------------
                   MASTER SESSION
                -------------------------------------------- */

                localStorage.setItem(
                    "riderx_user",
                    JSON.stringify(
                        session
                    )
                );


                localStorage.setItem(
                    "riderx_role",
                    "customer"
                );


                localStorage.setItem(
                    "riderx_session",
                    JSON.stringify({

                        uid:
                            firebaseUser.uid,

                        role:
                            "customer",

                        loginAt:
                            Date.now()

                    })
                );


                /* --------------------------------------------
                   COMPATIBILITY SESSION
                -------------------------------------------- */

                localStorage.setItem(
                    "riderx_customer",
                    JSON.stringify(
                        session
                    )
                );


                localStorage.setItem(
                    "userRole",
                    "customer"
                );


                localStorage.setItem(
                    "riderx_selected_role",
                    "customer"
                );


                /* --------------------------------------------
                   REMEMBER
                -------------------------------------------- */

                if (
                    remember.checked
                ) {

                    localStorage.setItem(
                        "riderx_remember",
                        "true"
                    );

                } else {

                    localStorage.removeItem(
                        "riderx_remember"
                    );

                }


                /* --------------------------------------------
                   SUCCESS
                -------------------------------------------- */

                showSuccess(
                    "Login successful. Opening your RiderX customer app..."
                );


                setTimeout(
                    function () {

                        window.location.replace(
                            "../customer/home.html"
                        );

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "RiderX customer login error:",
                    error
                );


                showError(
                    firebaseErrorMessage(
                        error
                    )
                );


                setLoading(
                    false
                );

            }

        }
    );


    /* ========================================================
       OTP LOGIN
    ======================================================== */

    otpBtn.addEventListener(
        "click",
        function () {

            const phone =
                normalizePhone(
                    phoneInput.value
                );


            if (
                phone &&
                !/^[6-9]\d{9}$/.test(
                    phone
                )
            ) {

                markFieldError(
                    phoneInput
                );

                showError(
                    "Please enter a valid mobile number."
                );

                phoneInput.focus();

                return;
            }


            if (
                phone
            ) {

                localStorage.setItem(
                    "riderx_otp_phone",
                    phone
                );

            }


            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );


            window.location.href =
                "./otp-login.html";

        }
    );


    /* ========================================================
       FORGOT PASSWORD
    ======================================================== */

    forgotBtn.addEventListener(
        "click",
        async function () {

            hideMessages();


            const phone =
                normalizePhone(
                    phoneInput.value
                );


            if (
                !phone
            ) {

                showError(
                    "Enter your registered mobile number first."
                );

                phoneInput.focus();

                return;
            }


            if (
                !/^[6-9]\d{9}$/.test(
                    phone
                )
            ) {

                markFieldError(
                    phoneInput
                );

                showError(
                    "Please enter a valid mobile number."
                );

                phoneInput.focus();

                return;
            }


            forgotBtn.disabled =
                true;


            try {


                /* --------------------------------------------
                   FIND CUSTOMER
                -------------------------------------------- */

                const usersRef =
                    collection(
                        db,
                        "users"
                    );


                const q =
                    query(
                        usersRef,

                        where(
                            "phone",
                            "in",
                            [
                                phone,
                                "+91" + phone,
                                "91" + phone
                            ]
                        )
                    );


                const snapshot =
                    await getDocs(
                        q
                    );


                let email =
                    "";


                snapshot.forEach(
                    function (docSnap) {

                        if (
                            email
                        ) {
                            return;
                        }


                        const data =
                            docSnap.data() ||
                            {};


                        const role =
                            normalizeRole(
                                data.role ||
                                data.userRole ||
                                data.accountType
                            );


                        if (
                            role ===
                            "customer"
                        ) {

                            email =
                                String(
                                    data.email ||
                                    ""
                                )
                                    .trim()
                                    .toLowerCase();

                        }

                    }
                );


                if (
                    !email
                ) {

                    showError(
                        "No customer account with this mobile number was found."
                    );

                    return;
                }


                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showSuccess(
                    "Password reset link sent to your registered email."
                );


            } catch (error) {

                console.error(
                    "RiderX password reset error:",
                    error
                );


                showError(
                    firebaseErrorMessage(
                        error
                    )
                );


            } finally {

                forgotBtn.disabled =
                    false;

            }

        }
    );


    /* ========================================================
       REGISTER
    ======================================================== */

    document
        .getElementById(
            "registerLink"
        )
        .addEventListener(
            "click",
            function () {

                localStorage.setItem(
                    "riderx_selected_role",
                    "customer"
                );

            }
        );


    /* ========================================================
       ROLE SELECTOR
    ======================================================== */

    roleBtn.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );


            window.location.href =
                "./role.html";

        }
    );


    /* ========================================================
       EXISTING AUTH SESSION
    ======================================================== */

    let initialAuthCheck =
        true;


    onAuthStateChanged(
        auth,
        async function (firebaseUser) {

            if (
                !initialAuthCheck
            ) {
                return;
            }


            initialAuthCheck =
                false;


            if (
                !firebaseUser
            ) {
                return;
            }


            /*
             * Do not interrupt an active login submission.
             */

            if (
                loginBtn.disabled
            ) {
                return;
            }


            try {

                const userRef =
                    collection(
                        db,
                        "users"
                    );


                const q =
                    query(
                        userRef,

                        where(
                            "uid",
                            "==",
                            firebaseUser.uid
                        )
                    );


                const snapshot =
                    await getDocs(
                        q
                    );


                let profile =
                    null;


                if (
                    !snapshot.empty
                ) {

                    profile =
                        snapshot.docs[0]
                            .data();

                }


                /*
                 * Some older RiderX profiles may use the
                 * UID as the document ID instead of a uid field.
                 */

                if (
                    !profile
                ) {

                    const {
                        doc,
                        getDoc
                    } = await import(
                        "../firebase/firebase-config.js"
                    );


                    const profileSnapshot =
                        await getDoc(
                            doc(
                                db,
                                "users",
                                firebaseUser.uid
                            )
                        );


                    if (
                        profileSnapshot.exists()
                    ) {

                        profile =
                            profileSnapshot.data();

                    }

                }


                if (
                    !profile
                ) {
                    return;
                }


                const role =
                    normalizeRole(
                        profile.role ||
                        profile.userRole ||
                        profile.accountType
                    );


                if (
                    role !==
                    "customer"
                ) {
                    return;
                }


                const status =
                    normalizeStatus(
                        profile.status ||
                        "active"
                    );


                if (
                    [
                        "blocked",
                        "suspended",
                        "disabled"
                    ].includes(
                        status
                    )
                ) {
                    return;
                }


                const session = {

                    uid:
                        firebaseUser.uid,

                    id:
                        firebaseUser.uid,

                    name:
                        profile.name ||
                        profile.fullName ||
                        profile.displayName ||
                        firebaseUser.displayName ||
                        "RiderX Customer",

                    fullName:
                        profile.fullName ||
                        profile.name ||
                        profile.displayName ||
                        firebaseUser.displayName ||
                        "RiderX Customer",

                    displayName:
                        profile.displayName ||
                        profile.name ||
                        profile.fullName ||
                        firebaseUser.displayName ||
                        "RiderX Customer",

                    email:
                        firebaseUser.email ||
                        profile.email ||
                        "",

                    phone:
                        normalizePhone(
                            profile.phone ||
                            profile.mobile ||
                            ""
                        ),

                    mobile:
                        normalizePhone(
                            profile.mobile ||
                            profile.phone ||
                            ""
                        ),

                    role:
                        "customer",

                    userRole:
                        "customer",

                    status:
                        status,

                    city:
                        profile.city ||
                        "Chandigarh",

                    photoURL:
                        profile.photoURL ||
                        firebaseUser.photoURL ||
                        ""

                };


                localStorage.setItem(
                    "riderx_user",
                    JSON.stringify(
                        session
                    )
                );


                localStorage.setItem(
                    "riderx_role",
                    "customer"
                );


                localStorage.setItem(
                    "riderx_customer",
                    JSON.stringify(
                        session
                    )
                );


                localStorage.setItem(
                    "userRole",
                    "customer"
                );


                localStorage.setItem(
                    "riderx_selected_role",
                    "customer"
                );


                window.location.replace(
                    "../customer/home.html"
                );


            } catch (error) {

                console.warn(
                    "Existing customer session check failed:",
                    error
                );

            }

        }
    );


    /* ========================================================
       HELPERS
    ======================================================== */

    function normalizePhone(
        value
    ) {

        let phone =
            String(
                value || ""
            )
                .replace(
                    /\D/g,
                    ""
                );


        if (
            phone.startsWith(
                "91"
            ) &&
            phone.length === 12
        ) {

            phone =
                phone.substring(
                    2
                );

        }


        return phone;
    }


    function normalizeRole(
        role
    ) {

        const value =
            String(
                role || ""
            )
                .trim()
                .toLowerCase();


        if (
            value ===
            "customer"
        ) {

            return "customer";
        }


        if (
            value === "rider" ||
            value === "driver" ||
            value === "delivery"
        ) {

            return "rider";
        }


        if (
            value === "admin" ||
            value === "administrator"
        ) {

            return "admin";
        }


        return "";
    }


    function normalizeStatus(
        status
    ) {

        return String(
            status || ""
        )
            .trim()
            .toLowerCase();
    }


    function setLoading(
        loading
    ) {

        loginBtn.disabled =
            loading;


        if (
            loading
        ) {

            loginBtn.innerHTML =
                '<span class="loader"></span>Logging in...';

        } else {

            loginBtn.textContent =
                "Login";

        }

    }


    function hideMessages() {

        errorBox.classList.remove(
            "show"
        );

        successBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            "";

    }


    function showError(
        message
    ) {

        successBox.classList.remove(
            "show"
        );

        successBox.textContent =
            "";

        errorBox.textContent =
            message;

        errorBox.classList.add(
            "show"
        );

    }


    function showSuccess(
        message
    ) {

        errorBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            message;

        successBox.classList.add(
            "show"
        );

    }


    function markFieldError(
        field
    ) {

        if (
            field
        ) {

            field.classList.add(
                "field-error"
            );

        }

    }


    function clearFieldError(
        field
    ) {

        if (
            field
        ) {

            field.classList.remove(
                "field-error"
            );

        }

    }


    function firebaseErrorMessage(
        error
    ) {

        const code =
            String(
                error?.code || ""
            )
                .toLowerCase();


        switch (
            code
        ) {

            case "auth/invalid-email":

                return "The registered email address is invalid.";


            case "auth/user-not-found":

                return "No Firebase account was found for this customer.";


            case "auth/wrong-password":

                return "Incorrect password. Please try again.";


            case "auth/invalid-credential":

                return "Email or password is incorrect.";


            case "auth/user-disabled":

                return "This account has been disabled in Firebase.";


            case "auth/too-many-requests":

                return "Too many login attempts. Please wait and try again later.";


            case "auth/network-request-failed":

                return "Network error. Please check your internet connection.";


            case "auth/operation-not-allowed":

                return "Email/password authentication is not enabled in Firebase.";


            case "permission-denied":

                return "Firebase permission denied. Please check Firestore Security Rules.";


            default:

                if (
                    error?.message &&
                    /permission/i.test(
                        error.message
                    )
                ) {

                    return "Firebase permission denied. Please check Firestore Security Rules.";

                }


                return "Login failed. Please check your details and try again.";

        }

    }


</script>


</body>

</html>
