<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX Customer Login"
    >

    <title>RiderX - Customer Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #070707;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 30px 23px 22px;
            border: 1px solid #292929;
            border-radius: 23px;
            background: #111111;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .55);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 19px;
            background: #ffd400;
            color: #090909;
            font-size: 23px;
            font-weight: 1000;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 1000;
        }

        .brand h1 span {
            color: #ffd400;
        }

        .brand p {
            margin: 6px 0 0;
            color: #777777;
            font-size: 10px;
        }

        .heading h2 {
            margin: 0;
            font-size: 19px;
            font-weight: 900;
        }

        .heading p {
            margin: 7px 0 0;
            color: #777777;
            font-size: 10px;
            line-height: 1.6;
        }

        .badge {
            display: inline-flex;
            margin-top: 12px;
            padding: 7px 10px;
            border: 1px solid #443b00;
            border-radius: 8px;
            background: rgba(255, 212, 0, .08);
            color: #ffd400;
            font-size: 9px;
            font-weight: 900;
        }

        .message {
            display: none;
            margin: 16px 0 13px;
            padding: 10px;
            border-radius: 9px;
            font-size: 9px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            border: 1px solid #542828;
            background: #241414;
            color: #ff7777;
        }

        .message.success {
            border: 1px solid #275335;
            background: #132319;
            color: #65e58b;
        }

        .field {
            margin-top: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #aaaaaa;
            font-size: 9px;
            font-weight: 800;
        }

        .input {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            border: 1px solid #333333;
            border-radius: 10px;
            outline: none;
            background: #191919;
            color: #ffffff;
            font-size: 12px;
        }

        .input::placeholder {
            color: #555555;
        }

        .input:focus {
            border-color: #ffd400;
            box-shadow: 0 0 0 2px rgba(255, 212, 0, .07);
        }

        .password-wrap {
            position: relative;
        }

        .password-input {
            padding-right: 52px;
        }

        .toggle {
            position: absolute;
            top: 50%;
            right: 7px;
            width: 39px;
            height: 35px;
            transform: translateY(-50%);
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #777777;
            cursor: pointer;
            font-size: 9px;
            font-weight: 800;
        }

        .toggle:hover {
            color: #ffd400;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 14px 0 18px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #777777;
            font-size: 9px;
        }

        .remember input {
            accent-color: #ffd400;
        }

        .forgot {
            padding: 0;
            border: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .primary {
            width: 100%;
            height: 49px;
            border: 0;
            border-radius: 10px;
            background: #ffd400;
            color: #111111;
            cursor: pointer;
            font-size: 12px;
            font-weight: 1000;
        }

        .primary:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: #555555;
            font-size: 8px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #282828;
        }

        .secondary {
            width: 100%;
            height: 46px;
            border: 1px solid #353535;
            border-radius: 10px;
            background: #171717;
            color: #ffffff;
            cursor: pointer;
            font-size: 10px;
            font-weight: 900;
        }

        .secondary:hover {
            border-color: #ffd400;
            color: #ffd400;
        }

        .register {
            margin-top: 18px;
            text-align: center;
            color: #666666;
            font-size: 9px;
        }

        .register button {
            border: 0;
            padding: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-weight: 900;
        }

        .rider-link {
            margin-top: 15px;
            text-align: center;
        }

        .rider-link button {
            border: 0;
            background: transparent;
            color: #888888;
            cursor: pointer;
            font-size: 9px;
        }

        .rider-link button:hover {
            color: #ffd400;
        }

        .security {
            margin-top: 17px;
            padding: 10px;
            border: 1px solid #252525;
            border-radius: 9px;
            background: #151515;
            color: #666666;
            font-size: 8px;
            line-height: 1.5;
            text-align: center;
        }

        .security strong {
            color: #aaaaaa;
        }

        .footer {
            margin-top: 17px;
            color: #444444;
            font-size: 8px;
            text-align: center;
        }

        .loader {
            display: inline-block;
            width: 13px;
            height: 13px;
            margin-right: 7px;
            vertical-align: -2px;
            border: 2px solid rgba(0, 0, 0, .25);
            border-top-color: #111111;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 420px) {

            .card {
                padding: 25px 17px 19px;
                border-radius: 19px;
            }

        }

    </style>

</head>

<body>

<main class="page">

    <section class="card">

        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                Move smarter. Ride better.
            </p>

        </div>


        <div class="heading">

            <h2>
                Customer Login
            </h2>

            <p>
                Login to book rides, track your rider,
                manage payments and view your ride history.
            </p>

            <div class="badge">
                CUSTOMER ACCOUNT
            </div>

        </div>


        <div
            id="errorBox"
            class="message error"
            role="alert"
            aria-live="polite"
        ></div>


        <div
            id="successBox"
            class="message success"
            role="status"
            aria-live="polite"
        ></div>


        <form
            id="customerLoginForm"
            novalidate
        >

            <div class="field">

                <label for="email">
                    Email address
                </label>

                <input
                    class="input"
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        class="input password-input"
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="togglePassword"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>


                <button
                    type="button"
                    class="forgot"
                    id="forgotPassword"
                >
                    Forgot password?
                </button>

            </div>


            <button
                type="submit"
                class="primary"
                id="loginButton"
            >
                Login as Customer
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            class="secondary"
            id="otpButton"
        >
            Continue with Mobile OTP
        </button>


        <div class="register">

            New to RiderX?

            <button
                type="button"
                id="registerButton"
            >
                Create customer account
            </button>

        </div>


        <div class="rider-link">

            <button
                type="button"
                id="riderLoginButton"
            >
                Are you a Rider? Login as Rider →
            </button>

        </div>


        <div class="security">

            <strong>Secure Login</strong><br>

            RiderX uses Firebase Authentication to
            securely protect your account.

        </div>


        <div class="footer">
            © 2026 RiderX • Chandigarh
        </div>

    </section>

</main>


<script type="module">

    "use strict";


    import {

        auth,
        db,

        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        signOut,

        doc,
        getDoc

    } from "../firebase/firebase-config.js";


    const form =
        document.getElementById(
            "customerLoginForm"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const rememberInput =
        document.getElementById(
            "remember"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );


    const otpButton =
        document.getElementById(
            "otpButton"
        );


    const registerButton =
        document.getElementById(
            "registerButton"
        );


    const riderLoginButton =
        document.getElementById(
            "riderLoginButton"
        );


    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const successBox =
        document.getElementById(
            "successBox"
        );


    let busy =
        false;


    const rememberedEmail =
        localStorage.getItem(
            "riderx_customer_email"
        );


    if (
        rememberedEmail
    ) {

        emailInput.value =
            rememberedEmail;

        rememberInput.checked =
            true;

    }


    localStorage.setItem(
        "riderx_selected_role",
        "customer"
    );


    togglePassword.addEventListener(
        "click",
        function () {

            const hidden =
                passwordInput.type ===
                "password";


            passwordInput.type =
                hidden
                    ? "text"
                    : "password";


            togglePassword.textContent =
                hidden
                    ? "HIDE"
                    : "SHOW";

        }
    );


    form.addEventListener(
        "submit",
        async function (
            event
        ) {

            event.preventDefault();


            if (
                busy
            ) {

                return;

            }


            clearMessages();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            if (
                !email
            ) {

                showError(
                    "Please enter your email address."
                );

                emailInput.focus();

                return;

            }


            if (
                !validEmail(
                    email
                )
            ) {

                showError(
                    "Please enter a valid email address."
                );

                emailInput.focus();

                return;

            }


            if (
                !password
            ) {

                showError(
                    "Please enter your password."
                );

                passwordInput.focus();

                return;

            }


            busy =
                true;


            setButtonLoading(
                true
            );


            try {

                const result =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const firebaseUser =
                    result.user;


                if (
                    !firebaseUser
                ) {

                    throw new Error(
                        "Authentication failed."
                    );

                }


                const profile =
                    await findCustomerProfile(
                        firebaseUser.uid,
                        firebaseUser
                    );


                if (
                    !profile
                ) {

                    await signOut(
                        auth
                    );


                    showError(
                        "This account is not registered as a RiderX customer."
                    );


                    return;

                }


                const role =
                    normalizeRole(
                        profile.role ||
                        profile.userRole ||
                        profile.accountType ||
                        "customer"
                    );


                if (
                    role !==
                    "customer"
                ) {

                    await signOut(
                        auth
                    );


                    showError(
                        "This is a RiderX Rider account. Please use Rider Login."
                    );


                    return;

                }


                if (
                    isBlocked(
                        profile
                    )
                ) {

                    await signOut(
                        auth
                    );


                    showError(
                        "Your RiderX customer account is currently disabled or blocked. Please contact support."
                    );


                    return;

                }


                await createCustomerSession(
                    firebaseUser,
                    profile
                );


                if (
                    rememberInput.checked
                ) {

                    localStorage.setItem(
                        "riderx_customer_email",
                        email
                    );

                } else {

                    localStorage.removeItem(
                        "riderx_customer_email"
                    );

                }


                showSuccess(
                    "Login successful. Opening RiderX..."
                );


                setTimeout(
                    function () {

                        window.location.replace(
                            "../customer/home.html"
                        );

                    },
                    600
                );


            } catch (
                error
            ) {

                console.error(
                    "Customer login error:",
                    error
                );


                showError(
                    firebaseMessage(
                        error
                    )
                );

            } finally {

                busy =
                    false;


                setButtonLoading(
                    false
                );

            }

        }
    );


    async function findCustomerProfile(
        uid,
        firebaseUser
    ) {

        const userRef =
            doc(
                db,
                "users",
                uid
            );


        const userSnapshot =
            await getDoc(
                userRef
            );


        if (
            userSnapshot.exists()
        ) {

            const data =
                userSnapshot.data();


            const role =
                normalizeRole(
                    data.role ||
                    data.userRole ||
                    data.accountType ||
                    "customer"
                );


            if (
                role ===
                "customer"
            ) {

                return data;

            }


            return {
                ...data,
                role:
                    role
            };

        }


        const customerRef =
            doc(
                db,
                "customers",
                uid
            );


        const customerSnapshot =
            await getDoc(
                customerRef
            );


        if (
            customerSnapshot.exists()
        ) {

            return customerSnapshot.data();

        }


        /*
         * Existing RiderX projects may have stored
         * customer data under a different profile path.
         * We intentionally do NOT create a profile here.
         */

        if (
            firebaseUser?.email
        ) {

            return null;

        }


        return null;

    }


    async function createCustomerSession(
        firebaseUser,
        profile
    ) {

        const customer = {

            uid:
                firebaseUser.uid,

            id:
                firebaseUser.uid,

            role:
                "customer",

            userRole:
                "customer",

            accountType:
                "customer",

            name:
                profile.name ||
                profile.fullName ||
                profile.displayName ||
                firebaseUser.displayName ||
                "RiderX Customer",

            fullName:
                profile.fullName ||
                profile.name ||
                profile.displayName ||
                firebaseUser.displayName ||
                "",

            displayName:
                profile.displayName ||
                firebaseUser.displayName ||
                "",

            email:
                profile.email ||
                firebaseUser.email ||
                "",

            phone:
                profile.phone ||
                profile.mobile ||
                profile.phoneNumber ||
                firebaseUser.phoneNumber ||
                "",

            phoneNumber:
                profile.phoneNumber ||
                firebaseUser.phoneNumber ||
                "",

            city:
                profile.city ||
                "Chandigarh",

            photoURL:
                profile.photoURL ||
                firebaseUser.photoURL ||
                "",

            rating:
                Number(
                    profile.rating ||
                    5
                ),

            walletBalance:
                Number(
                    profile.walletBalance ||
                    0
                ),

            totalRides:
                Number(
                    profile.totalRides ||
                    0
                ),

            completedRides:
                Number(
                    profile.completedRides ||
                    0
                ),

            currentRideId:
                profile.currentRideId ||
                null,

            status:
                profile.status ||
                "active",

            loginMethod:
                "password",

            loginAt:
                new Date().toISOString()

        };


        localStorage.setItem(
            "riderx_user",
            JSON.stringify(
                customer
            )
        );


        localStorage.setItem(
            "riderx_customer",
            JSON.stringify(
                customer
            )
        );


        localStorage.setItem(
            "riderx_customer_id",
            firebaseUser.uid
        );


        localStorage.setItem(
            "userRole",
            "customer"
        );


        localStorage.setItem(
            "riderx_role",
            "customer"
        );


        localStorage.setItem(
            "riderx_selected_role",
            "customer"
        );

    }


    function normalizeRole(
        role
    ) {

        const value =
            String(
                role || ""
            )
                .trim()
                .toLowerCase();


        if (
            value === "rider" ||
            value === "driver"
        ) {

            return "rider";

        }


        if (
            value === "admin" ||
            value === "administrator"
        ) {

            return "admin";

        }


        return "customer";

    }


    function isBlocked(
        profile
    ) {

        const status =
            String(
                profile.status ||
                profile.accountStatus ||
                ""
            )
                .trim()
                .toLowerCase();


        return (
            profile.disabled === true ||
            profile.blocked === true ||
            status === "blocked" ||
            status === "disabled" ||
            status === "suspended"
        );

    }


    function validEmail(
        email
    ) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        );

    }


    function clearMessages() {

        errorBox.textContent =
            "";

        successBox.textContent =
            "";

        errorBox.classList.remove(
            "show"
        );

        successBox.classList.remove(
            "show"
        );

    }


    function showError(
        message
    ) {

        successBox.classList.remove(
            "show"
        );

        successBox.textContent =
            "";

        errorBox.textContent =
            message;

        errorBox.classList.add(
            "show"
        );

    }


    function showSuccess(
        message
    ) {

        errorBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            message;

        successBox.classList.add(
            "show"
        );

    }


    function setButtonLoading(
        value
    ) {

        loginButton.disabled =
            value;


        if (
            value
        ) {

            loginButton.innerHTML =
                '<span class="loader"></span>Signing in...';

        } else {

            loginButton.textContent =
                "Login as Customer";

        }

    }


    otpButton.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );


            window.location.href =
                "./otp-login.html";

        }
    );


    registerButton.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );


            window.location.href =
                "./register.html";

        }
    );


    riderLoginButton.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "rider"
            );


            window.location.href =
                "./rider-login.html";

        }
    );


    forgotPassword.addEventListener(
        "click",
        async function () {

            clearMessages();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            if (
                !email
            ) {

                showError(
                    "Enter your email address first."
                );

                emailInput.focus();

                return;

            }


            if (
                !validEmail(
                    email
                )
            ) {

                showError(
                    "Please enter a valid email address."
                );

                return;

            }


            forgotPassword.disabled =
                true;


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showSuccess(
                    "Password reset email sent. Please check your inbox."
                );


            } catch (
                error
            ) {

                console.error(
                    "Password reset error:",
                    error
                );


                showError(
                    firebaseMessage(
                        error
                    )
                );


            } finally {

                forgotPassword.disabled =
                    false;

            }

        }
    );


    function firebaseMessage(
        error
    ) {

        const code =
            String(
                error?.code ||
                ""
            )
                .toLowerCase();


        switch (
            code
        ) {

            case "auth/invalid-email":

                return "Please enter a valid email address.";


            case "auth/user-not-found":

                return "No RiderX account was found with this email.";


            case "auth/wrong-password":

                return "Incorrect password. Please try again.";


            case "auth/invalid-credential":

                return "Email or password is incorrect.";


            case "auth/user-disabled":

                return "This account has been disabled.";


            case "auth/too-many-requests":

                return "Too many attempts. Please wait and try again later.";


            case "auth/network-request-failed":

                return "Network error. Check your internet connection.";


            case "auth/operation-not-allowed":

                return "Email/password login is not enabled in Firebase.";


            default:

                return (
                    error?.message ||
                    "Login failed. Please try again."
                );

        }

    }

</script>

</body>

</html>
