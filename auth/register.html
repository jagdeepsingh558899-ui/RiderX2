<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Register</title>

<link rel="stylesheet" href="../assets/app.css">


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

margin:0;
min-height:100vh;
background:#000;
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}


.register-box{

width:100%;
max-width:430px;
background:#111;
padding:25px;
border-radius:25px;
border:1px solid #333;

}



.logo{

text-align:center;
font-size:38px;
font-weight:900;
}


.logo span{

color:#FFD600;

}



.role-title{

text-align:center;
color:#FFD600;
margin:15px 0 20px;
font-size:20px;

}



.input{

width:100%;
padding:14px;
margin:8px 0;
background:#000;
border:1px solid #333;
border-radius:12px;
color:white;

}



select.input{

color:white;

}



.upload{

background:#000;
border:1px dashed #FFD600;
padding:12px;
border-radius:12px;
margin:10px 0;

}



.btn{

width:100%;
padding:15px;
border-radius:12px;
border:none;
margin-top:15px;
font-size:17px;
font-weight:bold;
cursor:pointer;

}



.create{

background:#FFD600;
color:#000;

}



.back{

text-align:center;
margin-top:20px;
color:#999;

}



#riderFields{

display:none;

}


</style>

</head>


<body>


<div class="register-box">


<div class="logo">
RID<span>ERX</span>
</div>



<div class="role-title" id="roleTitle">
Create Account
</div>



<input 
class="input"
id="name"
placeholder="Full Name">



<input 
class="input"
id="phone"
placeholder="Phone Number">



<input 
class="input"
id="email"
type="email"
placeholder="Email Address">



<input 
class="input"
id="password"
type="password"
placeholder="Password">





<!-- Rider Extra Details -->

<div id="riderFields">


<select class="input" id="vehicleType">

<option value="">
Select Vehicle Type
</option>

<option>
Bike
</option>

<option>
Cab
</option>

</select>



<input 
class="input"
id="vehicleNumber"
placeholder="Vehicle Number">





<div class="upload">

<label>
Upload RC
</label>

<input 
type="file"
id="rcUpload"
accept="image/*,.pdf">

</div>





<div class="upload">

<label>
Upload Driving License
</label>

<input 
type="file"
id="licenseUpload"
accept="image/*,.pdf">

</div>


</div>





<button class="btn create" id="createBtn">

Create Account

</button>





<div class="back" onclick="goBack()">

← Back To Login

</div>



</div>







<script>


const params =
new URLSearchParams(window.location.search);


const role =
params.get("role") || "customer";




if(role==="rider"){


document.getElementById("roleTitle").innerHTML=
"Rider Registration";


document.getElementById("riderFields").style.display=
"block";


}

else{


document.getElementById("roleTitle").innerHTML=
"Customer Registration";


}





document.getElementById("createBtn").onclick=function(){


let name =
document.getElementById("name").value;


let phone =
document.getElementById("phone").value;


let email =
document.getElementById("email").value;



if(name==="" || phone==="" || email===""){

alert("Please fill all required details");

return;

}




if(role==="rider"){


alert("Rider account created. Waiting for Admin Approval");


window.location.href="../rider/home.html";


}

else{


alert("Customer account created");


window.location.href="../customer/home.html";


}



};






function goBack(){

window.location.href=
"login.html?role="+role;

}



</script>



</body>

</html>
