<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffd400">
<meta name="description" content="Create your RiderX customer or rider account">
<title>RiderX - Create Account</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>
:root{
    --rx-yellow:#ffd400;
    --rx-yellow-hover:#ffe04a;
    --rx-black:#070707;
    --rx-card:#111;
    --rx-field:#191919;
    --rx-border:rgba(255,255,255,.11);
    --rx-muted:#858585;
    --rx-danger:#ff7777;
    --rx-success:#70d888;
}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:var(--rx-black);color:#fff}
body{min-height:100vh;min-height:100dvh;font-family:Inter,Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--rx-yellow);outline-offset:2px}

.page{
    position:relative;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right))
            max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
    overflow:auto;
    background:radial-gradient(circle at top,rgba(255,212,0,.10),transparent 38%),var(--rx-black);
}
.page::before,.page::after{content:"";position:fixed;border-radius:50%;pointer-events:none}
.page::before{width:430px;height:430px;top:-280px;right:-180px;background:rgba(255,212,0,.08)}
.page::after{width:360px;height:360px;bottom:-240px;left:-180px;background:rgba(255,212,0,.05)}

.card{
    position:relative;z-index:2;width:100%;max-width:455px;margin:12px 0;
    padding:28px 22px 21px;border:1px solid #292929;border-radius:23px;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),var(--rx-card);
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}
.brand{text-align:center;margin-bottom:21px}
.logo{width:62px;height:62px;margin:0 auto 11px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--rx-yellow);color:#080808;font-size:21px;font-weight:1000;box-shadow:0 10px 30px rgba(255,212,0,.12)}
.brand h1{margin:0;font-size:25px;font-weight:1000}
.brand h1 span{color:var(--rx-yellow)}
.brand p{margin:6px 0 0;color:#777;font-size:11px}

.heading{text-align:center}
.heading h2{margin:0;font-size:20px;font-weight:900}
.heading p{max-width:350px;margin:7px auto 0;color:#777;font-size:11px;line-height:1.55}

.role-title{margin-top:18px;color:#999;font-size:10px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:.5px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.role{min-height:55px;border:1px solid #303030;border-radius:11px;background:#181818;color:#888;cursor:pointer;font-size:10px;font-weight:900;transition:border-color .15s,background .15s,color .15s,transform .15s}
.role:hover,.role:focus-visible{border-color:var(--rx-yellow);color:var(--rx-yellow)}
.role:active{transform:scale(.99)}
.role.active{border-color:var(--rx-yellow);background:rgba(255,212,0,.08);color:var(--rx-yellow)}
.role:disabled{opacity:.55;cursor:not-allowed}

.form{margin-top:18px}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:6px;color:#aaa;font-size:10px;font-weight:900;text-transform:uppercase}
.field input,.field select{
    width:100%;height:45px;padding:0 12px;border:1px solid #303030;border-radius:10px;
    outline:none;background:var(--rx-field);color:#fff;font-size:13px;
    transition:border-color .15s,box-shadow .15s;
}
.field input::placeholder{color:#555}
.field input:focus,.field select:focus{border-color:var(--rx-yellow);box-shadow:0 0 0 2px rgba(255,212,0,.07)}
.field input:disabled,.field select:disabled{opacity:.6;cursor:not-allowed}
.field select{appearance:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.password-wrap{position:relative}
.password-wrap input{padding-right:64px}
.password-toggle{position:absolute;top:50%;right:8px;transform:translateY(-50%);border:0;padding:6px;border-radius:6px;background:transparent;color:#777;cursor:pointer;font-size:9px;font-weight:900}
.password-toggle:hover{color:var(--rx-yellow);background:rgba(255,212,0,.05)}
.password-toggle:disabled{opacity:.5;cursor:not-allowed}

.terms{display:flex;align-items:flex-start;gap:8px;margin:3px 0 15px;color:#777;font-size:10px;line-height:1.5}
.terms input{width:14px;height:14px;flex:0 0 auto;margin-top:1px;accent-color:var(--rx-yellow)}
.terms a{color:var(--rx-yellow);text-decoration:none}
.terms a:hover{text-decoration:underline}

.primary{width:100%;min-height:48px;border:0;border-radius:11px;background:var(--rx-yellow);color:#090909;cursor:pointer;font-size:12px;font-weight:1000;transition:opacity .15s,transform .15s}
.primary:hover{background:var(--rx-yellow-hover)}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.55;cursor:not-allowed;transform:none}

.message{display:none;margin:12px 0;padding:11px;border-radius:9px;text-align:center;font-size:10px;line-height:1.5;overflow-wrap:anywhere}
.message.show{display:block}
.message.error{border:1px solid #572525;background:rgba(255,50,50,.07);color:var(--rx-danger)}
.message.success{border:1px solid #295432;background:rgba(40,180,70,.07);color:var(--rx-success)}
.message.info{border:1px solid #443b00;background:rgba(255,212,0,.07);color:var(--rx-yellow)}

.login{margin-top:17px;padding-top:16px;border-top:1px solid #272727;color:#666;text-align:center;font-size:11px}
.login button{border:0;padding:0;background:transparent;color:var(--rx-yellow);cursor:pointer;font-size:11px;font-weight:900}
.login button:disabled{opacity:.5;cursor:not-allowed}
.footer{margin-top:16px;color:#444;font-size:9px;text-align:center}

.loader{display:inline-block;width:13px;height:13px;margin-right:7px;vertical-align:-2px;border:2px solid rgba(0,0,0,.2);border-top-color:#111;border-radius:50%;animation:riderxRegisterSpin .7s linear infinite}
@keyframes riderxRegisterSpin{to{transform:rotate(360deg)}}

@media(max-width:390px){
    .card{padding:24px 16px 18px;border-radius:19px}
    .two{grid-template-columns:1fr;gap:0}
}
@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important}
    .primary,.field input,.field select,.role{transition:none}
    .loader{animation:none}
}
</style>
</head>

<body>
<main class="page">
<section class="card" aria-labelledby="registerTitle">

    <div class="brand">
        <div class="logo" aria-hidden="true">RX</div>
        <h1>Rider<span>X</span></h1>
        <p>Ride smarter. Ride with RiderX.</p>
    </div>

    <div class="heading">
        <h2 id="registerTitle">Create your RiderX Account</h2>
        <p>Register once and start using RiderX for rides, payments and trip management.</p>
    </div>

    <div class="role-title">Choose account type</div>

    <div class="roles" role="group" aria-label="Choose account type">
        <button type="button" class="role active" id="customerRole" aria-pressed="true">CUSTOMER</button>
        <button type="button" class="role" id="riderRole" aria-pressed="false">RIDER / DRIVER</button>
    </div>

    <form class="form" id="registerForm" novalidate>

        <div class="two">
            <div class="field">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" autocomplete="given-name" placeholder="First name" maxlength="40" required>
            </div>
            <div class="field">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" autocomplete="family-name" placeholder="Last name" maxlength="40">
            </div>
        </div>

        <div class="field">
            <label for="phone">Mobile Number</label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10 digit mobile number" required>
        </div>

        <div class="field">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Enter your email" maxlength="254" required>
        </div>

        <div class="two">
            <div class="field">
                <label for="state">State / UT</label>
                <select id="state" name="state" required>
                    <option value="">Select State / UT</option>
                    <option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option><option>Bihar</option>
                    <option>Chhattisgarh</option><option>Goa</option><option>Gujarat</option><option>Haryana</option>
                    <option>Himachal Pradesh</option><option>Jharkhand</option><option>Karnataka</option><option>Kerala</option>
                    <option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option>
                    <option>Mizoram</option><option>Nagaland</option><option>Odisha</option><option>Punjab</option>
                    <option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option>
                    <option>Tripura</option><option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option>
                    <option>Andaman and Nicobar Islands</option><option>Chandigarh</option>
                    <option>Dadra and Nagar Haveli and Daman and Diu</option><option>Delhi</option>
                    <option>Jammu and Kashmir</option><option>Ladakh</option><option>Lakshadweep</option><option>Puducherry</option>
                </select>
            </div>
            <div class="field">
                <label for="city">City</label>
                <input id="city" name="city" type="text" autocomplete="address-level2" placeholder="Enter your city" maxlength="80" required>
            </div>
        </div>

        <div class="field">
            <label for="language">Language</label>
            <select id="language" name="language">
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
            </select>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="Minimum 6 characters" required>
                <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" aria-pressed="false">SHOW</button>
            </div>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrap">
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="Re-enter password" required>
                <button type="button" class="password-toggle" id="confirmToggle" aria-label="Show confirmation password" aria-pressed="false">SHOW</button>
            </div>
        </div>

        <div id="message" class="message" role="alert" aria-live="polite" aria-atomic="true"></div>

        <label class="terms">
            <input type="checkbox" id="terms" required>
            <span>
                I agree to the RiderX
                <a href="#" id="termsLink">Terms</a>
                and
                <a href="#" id="privacyLink">Privacy Policy</a>.
            </span>
        </label>

        <button type="submit" class="primary" id="registerButton">CREATE CUSTOMER ACCOUNT</button>
    </form>

    <div class="login">
        Already have an account?
        <button type="button" id="loginButton">Login</button>
    </div>

    <div class="footer">© 2026 RiderX • India</div>
</section>
</main>

<script type="module">
"use strict";

/* ============================================================
   RIDERX REGISTRATION PAGE
   ------------------------------------------------------------
   Authentication is handled ONLY by js/auth.js.
   This page collects UI data and delegates account creation to
   the canonical RiderX authentication engine.
============================================================ */

const STORAGE = Object.freeze({
    selectedRole: "riderx_selected_role"
});

const ROUTES = Object.freeze({
    login: "./login.html",
    customer: "../customer/home.html",
    riderPending: "../rider/pending.html"
});

const form = document.getElementById("registerForm");
const firstName = document.getElementById("firstName");
const lastName = document.getElementById("lastName");
const phone = document.getElementById("phone");
const email = document.getElementById("email");
const state = document.getElementById("state");
const city = document.getElementById("city");
const language = document.getElementById("language");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const terms = document.getElementById("terms");
const customerRole = document.getElementById("customerRole");
const riderRole = document.getElementById("riderRole");
const registerButton = document.getElementById("registerButton");
const loginButton = document.getElementById("loginButton");
const passwordToggle = document.getElementById("passwordToggle");
const confirmToggle = document.getElementById("confirmToggle");
const message = document.getElementById("message");
const termsLink = document.getElementById("termsLink");
const privacyLink = document.getElementById("privacyLink");

let selectedRole = "customer";
let busy = false;
let navigationStarted = false;
let authEnginePromise = null;
let RX_AUTH = null;

function clean(value) {
    return String(value ?? "").trim().replace(/\s+/g, " ");
}

function normalizeRole(value) {
    const role = clean(value).toLowerCase().replace(/[\s-]+/g, "_");

    if (["rider", "driver", "drivers", "partner", "captain", "driver_partner", "driverpartner"].includes(role)) {
        return "rider";
    }

    if (["customer", "customers", "user", "users", "passenger", "client"].includes(role)) {
        return "customer";
    }

    return "";
}

function getStorage(key) {
    try {
        return localStorage.getItem(key);
    } catch (error) {
        console.warn("RiderX storage read failed:", error);
        return null;
    }
}

function setStorage(key, value) {
    try {
        localStorage.setItem(key, String(value));
    } catch (error) {
        console.warn("RiderX storage write failed:", error);
    }
}

function showMessage(text, type = "info") {
    const value = clean(text);

    if (!value) {
        clearMessage();
        return;
    }

    message.textContent = value;
    message.className = "message show " + (["error", "success", "info"].includes(type) ? type : "info");
}

function clearMessage() {
    message.textContent = "";
    message.className = "message";
}

function updateRoleUI() {
    const rider = selectedRole === "rider";

    customerRole.classList.toggle("active", !rider);
    riderRole.classList.toggle("active", rider);

    customerRole.setAttribute("aria-pressed", String(!rider));
    riderRole.setAttribute("aria-pressed", String(rider));

    registerButton.textContent = rider
        ? "CREATE RIDER ACCOUNT"
        : "CREATE CUSTOMER ACCOUNT";
}

function setRole(role) {
    const normalized = normalizeRole(role);

    if (!normalized) {
        return;
    }

    selectedRole = normalized;
    setStorage(STORAGE.selectedRole, normalized);
    updateRoleUI();
}

function togglePassword(input, button) {
    if (busy) {
        return;
    }

    const show = input.type === "password";

    input.type = show ? "text" : "password";
    button.textContent = show ? "HIDE" : "SHOW";
    button.setAttribute("aria-label", show ? "Hide password" : "Show password");
    button.setAttribute("aria-pressed", String(show));
}

function validName(value) {
    return value.length >= 2 &&
        value.length <= 40 &&
        /^[\p{L} .'-]+$/u.test(value);
}

function validPhone(value) {
    return /^[6-9]\d{9}$/.test(value);
}

function validEmail(value) {
    return value.length <= 254 &&
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
}

function validPassword(value) {
    return value.length >= 6 && value.length <= 128;
}

function friendlyError(error) {
    if (RX_AUTH && typeof RX_AUTH.getErrorMessage === "function") {
        try {
            const messageFromEngine = clean(RX_AUTH.getErrorMessage(error));
            if (messageFromEngine) {
                return messageFromEngine;
            }
        } catch (engineError) {
            console.warn("RiderX auth error formatter failed:", engineError);
        }
    }

    const code = clean(error?.code).toLowerCase();

    const known = {
        "auth/email-already-in-use": "This email is already registered. Please login instead.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/weak-password": "Password is too weak. Use at least 6 characters.",
        "auth/password-does-not-meet-requirements": "Password does not meet the required password rules.",
        "auth/operation-not-allowed": "Email/password registration is currently unavailable.",
        "auth/network-request-failed": "Network error. Please check your internet connection.",
        "auth/too-many-requests": "Too many requests. Please wait and try again.",
        "auth/app-not-authorized": "This website is not authorized in Firebase.",
        "auth/invalid-api-key": "RiderX Firebase configuration is invalid.",
        "permission-denied": "You do not have permission to complete this request."
    };

    return known[code] || clean(error?.message) || "Registration failed. Please try again.";
}

async function loadAuthEngine() {
    if (RX_AUTH) {
        return RX_AUTH;
    }

    if (window.RiderX?.auth) {
        RX_AUTH = window.RiderX.auth;
        return RX_AUTH;
    }

    if (window.RiderXAuth?.auth) {
        RX_AUTH = window.RiderXAuth.auth;
        return RX_AUTH;
    }

    if (!authEnginePromise) {
        authEnginePromise = import("../js/auth.js").catch(error => {
            authEnginePromise = null;
            throw error;
        });
    }

    const module = await authEnginePromise;

    RX_AUTH =
        module?.AUTH ||
        module?.auth ||
        module?.default ||
        window.RiderX?.auth ||
        window.RiderXAuth?.auth ||
        null;

    if (!RX_AUTH || typeof RX_AUTH.registerWithEmail !== "function") {
        throw new Error("RiderX authentication engine is unavailable.");
    }

    return RX_AUTH;
}

async function enrichProfile(auth, uid, profileData) {
    /*
     * auth.js remains the owner of authentication and the canonical
     * users/{uid} profile. These fields are optional registration
     * metadata and are merged only after canonical registration.
     */
    if (!uid) {
        return;
    }

    try {
        const FB = await import("../firebase/firebase-config.js");

        if (
            !FB.db ||
            typeof FB.doc !== "function" ||
            typeof FB.setDoc !== "function"
        ) {
            console.warn("RiderX optional profile metadata service is unavailable.");
            return;
        }

        const data = {
            firstName: profileData.firstName,
            lastName: profileData.lastName,
            state: profileData.state,
            city: profileData.city,
            language: profileData.language,
            country: "India",
            countryCode: "IN",
            updatedAt:
                typeof FB.serverTimestamp === "function"
                    ? FB.serverTimestamp()
                    : Date.now()
        };

        await FB.setDoc(
            FB.doc(FB.db, "users", uid),
            data,
            { merge: true }
        );
    } catch (error) {
        /*
         * Registration itself is already complete at this point.
         * Metadata failure must never make the user register again
         * and accidentally create a duplicate-auth attempt.
         */
        console.warn("RiderX optional profile metadata update failed:", error);
    }
}

function setBusy(value) {
    busy = Boolean(value);

    registerButton.disabled = busy;
    loginButton.disabled = busy;
    customerRole.disabled = busy;
    riderRole.disabled = busy;
    passwordToggle.disabled = busy;
    confirmToggle.disabled = busy;
    firstName.disabled = busy;
    lastName.disabled = busy;
    phone.disabled = busy;
    email.disabled = busy;
    state.disabled = busy;
    city.disabled = busy;
    language.disabled = busy;
    password.disabled = busy;
    confirmPassword.disabled = busy;
    terms.disabled = busy;

    if (busy) {
        registerButton.innerHTML = '<span class="loader" aria-hidden="true"></span>CREATING ACCOUNT...';
    } else {
        updateRoleUI();
    }
}

function navigateAfterRegistration(role) {
    if (navigationStarted) {
        return;
    }

    navigationStarted = true;

    const target = role === "rider"
        ? ROUTES.riderPending
        : ROUTES.customer;

    window.location.replace(target);
}

async function handleRegistration(event) {
    event.preventDefault();

    if (busy || navigationStarted) {
        return;
    }

    clearMessage();

    const first = clean(firstName.value);
    const last = clean(lastName.value);
    const mobile = String(phone.value || "").replace(/\D/g, "").slice(0, 10);
    const mail = String(email.value || "").trim().toLowerCase();
    const selectedState = clean(state.value);
    const selectedCity = clean(city.value);
    const selectedLanguage = language.value === "hi" ? "hi" : "en";
    const pass = String(password.value || "");
    const confirmation = String(confirmPassword.value || "");

    if (!validName(first)) {
        showMessage("Please enter a valid first name.", "error");
        firstName.focus();
        return;
    }

    if (last && !validName(last)) {
        showMessage("Please enter a valid last name.", "error");
        lastName.focus();
        return;
    }

    if (!validPhone(mobile)) {
        showMessage("Please enter a valid 10-digit Indian mobile number.", "error");
        phone.focus();
        return;
    }

    if (!validEmail(mail)) {
        showMessage("Please enter a valid email address.", "error");
        email.focus();
        return;
    }

    if (!selectedState) {
        showMessage("Please select your State / UT.", "error");
        state.focus();
        return;
    }

    if (selectedCity.length < 2 || selectedCity.length > 80) {
        showMessage("Please enter a valid city.", "error");
        city.focus();
        return;
    }

    if (!validPassword(pass)) {
        showMessage("Password must contain 6 to 128 characters.", "error");
        password.focus();
        return;
    }

    if (pass !== confirmation) {
        showMessage("Passwords do not match.", "error");
        confirmPassword.focus();
        return;
    }

    if (!terms.checked) {
        showMessage("Please accept the RiderX Terms and Privacy Policy.", "error");
        terms.focus();
        return;
    }

    setBusy(true);

    try {
        const auth = await loadAuthEngine();

        if (typeof auth.registerWithEmail !== "function") {
            throw new Error("RiderX registration service is unavailable.");
        }

        const fullName = [first, last].filter(Boolean).join(" ");

        const result = await auth.registerWithEmail({
            name: fullName,
            fullName,
            displayName: fullName,
            email: mail,
            password: pass,
            phone: mobile,
            phoneNumber: mobile,
            city: selectedCity,
            role: selectedRole,
            selectedRole
        });

        const uid = clean(
            result?.user?.uid ||
            result?.profile?.uid ||
            auth.getUid?.()
        );

        if (!uid) {
            throw new Error("RiderX registration completed without a valid user ID.");
        }

        await enrichProfile(auth, uid, {
            firstName: first,
            lastName: last,
            state: selectedState,
            city: selectedCity,
            language: selectedLanguage
        });

        if (selectedRole === "rider") {
            showMessage(
                "Rider account created successfully. Your account is pending admin approval.",
                "success"
            );
        } else {
            showMessage(
                "Customer account created successfully. Opening RiderX...",
                "success"
            );
        }

        window.setTimeout(() => {
            navigateAfterRegistration(selectedRole);
        }, 700);

    } catch (error) {
        console.error("RiderX registration error:", error);
        setBusy(false);
        showMessage(friendlyError(error), "error");
    }
}

function goToLogin() {
    if (busy || navigationStarted) {
        return;
    }

    setStorage(STORAGE.selectedRole, selectedRole);
    window.location.href = ROUTES.login;
}

function showLegalMessage(kind) {
    showMessage(
        kind === "terms"
            ? "RiderX Terms and Conditions will be provided in the final legal section."
            : "RiderX Privacy Policy will be provided in the final legal section.",
        "info"
    );
}

customerRole.addEventListener("click", () => {
    if (!busy) {
        clearMessage();
        setRole("customer");
    }
});

riderRole.addEventListener("click", () => {
    if (!busy) {
        clearMessage();
        setRole("rider");
    }
});

passwordToggle.addEventListener("click", () => {
    togglePassword(password, passwordToggle);
});

confirmToggle.addEventListener("click", () => {
    togglePassword(confirmPassword, confirmToggle);
});

form.addEventListener("submit", handleRegistration);

phone.addEventListener("input", () => {
    phone.value = phone.value.replace(/\D/g, "").slice(0, 10);
});

email.addEventListener("input", () => {
    email.value = email.value.replace(/\s/g, "").slice(0, 254);
});

email.addEventListener("blur", () => {
    email.value = email.value.trim().toLowerCase();
});

firstName.addEventListener("blur", () => {
    firstName.value = clean(firstName.value);
});

lastName.addEventListener("blur", () => {
    lastName.value = clean(lastName.value);
});

city.addEventListener("blur", () => {
    city.value = clean(city.value);
});

loginButton.addEventListener("click", goToLogin);

termsLink.addEventListener("click", event => {
    event.preventDefault();
    showLegalMessage("terms");
});

privacyLink.addEventListener("click", event => {
    event.preventDefault();
    showLegalMessage("privacy");
});

window.addEventListener("pageshow", () => {
    if (!busy && !navigationStarted) {
        updateRoleUI();
    }
});

function init() {
    const savedRole = normalizeRole(getStorage(STORAGE.selectedRole));

    if (savedRole === "customer" || savedRole === "rider") {
        selectedRole = savedRole;
    }

    updateRoleUI();

    window.RiderXRegister = Object.freeze({
        getRole: () => selectedRole,
        setRole,
        loadAuthEngine,
        showMessage,
        clearMessage
    });
}

init();
</script>
</body>
</html>
