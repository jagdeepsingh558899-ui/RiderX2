<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Register</title>


<link rel="stylesheet" href="../assets/app.css">


<style>

body{

margin:0;
min-height:100vh;
background:#000;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
padding:20px;

}


.box{

width:100%;
max-width:430px;
background:#111;
padding:25px;
border-radius:25px;
border:1px solid #333;

}


.logo{

text-align:center;
font-size:38px;
font-weight:900;

}


.logo span{

color:#FFD600;

}



.role{

text-align:center;
color:#FFD600;
margin:15px;

}



.input{

width:100%;
padding:14px;
margin:8px 0;
background:#000;
color:white;
border:1px solid #444;
border-radius:12px;

}



.upload{

background:#000;
padding:12px;
border-radius:12px;
border:1px dashed #FFD600;
margin:10px 0;

}



.btn{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#FFD600;
color:#000;
font-weight:bold;
font-size:17px;
margin-top:15px;

}



#riderBox{

display:none;

}



.back{

text-align:center;
color:#aaa;
margin-top:20px;

}

</style>


</head>


<body>



<div class="box">



<div class="logo">

RID<span>ERX</span>

</div>



<div class="role" id="roleText">

Customer Registration

</div>




<input id="name"
class="input"
placeholder="Full Name">



<input id="phone"
class="input"
placeholder="Phone Number">



<input id="email"
class="input"
type="email"
placeholder="Email Address">



<input id="password"
class="input"
type="password"
placeholder="Password">





<div id="riderBox">


<select id="vehicle"
class="input">


<option value="">
Select Vehicle
</option>


<option>
Bike
</option>


<option>
Cab
</option>


</select>




<input id="vehicleNumber"
class="input"
placeholder="Vehicle Number">





<div class="upload">

RC Upload

<br>

<input id="rc"
type="file"
accept="image/*,.pdf">

</div>





<div class="upload">

Driving License Upload

<br>

<input id="license"
type="file"
accept="image/*,.pdf">

</div>



</div>






<button id="registerBtn" class="btn">

Create Account

</button>



<div class="back" onclick="history.back()">

← Back

</div>



</div>








<script type="module">


import {auth,db,storage}

from "../firebase/firebase-config.js";



import {

createUserWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

doc,
setDoc

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



import {

ref,
uploadBytes,
getDownloadURL

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";





const params =
new URLSearchParams(window.location.search);



const role =
params.get("role") || "customer";




if(role==="rider"){


document.getElementById("roleText").innerHTML=
"Rider Registration";


document.getElementById("riderBox").style.display=
"block";


}





async function uploadFile(file,path){


if(!file)
return "";


const fileRef =
ref(storage,path);


await uploadBytes(
fileRef,
file
);


return await getDownloadURL(fileRef);


}






document
.getElementById("registerBtn")
.onclick = async ()=>{


try{


const name =
document.getElementById("name").value;


const phone =
document.getElementById("phone").value;


const email =
document.getElementById("email").value;


const password =
document.getElementById("password").value;




const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);



const uid =
userCredential.user.uid;





let data={


name:name,

phone:phone,

email:email,

role:role,

createdAt:new Date()



};





if(role==="rider"){



const rcURL =
await uploadFile(
document.getElementById("rc").files[0],
"riders/"+uid+"/rc"
);



const licenseURL =
await uploadFile(
document.getElementById("license").files[0],
"riders/"+uid+"/license"
);




data.vehicle =
document.getElementById("vehicle").value;


data.vehicleNumber =
document.getElementById("vehicleNumber").value;


data.rc=rcURL;


data.license=licenseURL;


data.approved=false;


data.status="pending";


}





await setDoc(
doc(db,"users",uid),
data
);





alert(
"Account Created Successfully"
);





if(role==="rider"){


window.location.href=
"../rider/home.html";


}

else{


window.location.href=
"../customer/home.html";


}




}

catch(error){


alert(
error.message
);


}



};



</script>



</body>

</html>
