<!DOCTYPE html>
<html lang="en">
<head>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<title>RiderX Registration</title>

<meta name="theme-color" content="#050505">

<style>

:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111;
    --border:#292929;
    --gray:#999;
    --red:#ff5555;
    --green:#20d66b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.box{
    width:100%;
    max-width:440px;
    background:#111;
    border:1px solid #292929;
    border-radius:24px;
    padding:28px 24px;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
}

.logo span{
    color:var(--yellow);
}

.role{
    text-align:center;
    color:var(--yellow);
    font-size:15px;
    font-weight:bold;
    margin:10px 0 25px;
}

.input{
    width:100%;
    padding:14px;
    margin:7px 0;
    background:#050505;
    color:#fff;
    border:1px solid #383838;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:var(--yellow);
}

.section{
    margin-top:18px;
    margin-bottom:8px;
    color:#ddd;
    font-size:14px;
    font-weight:bold;
}

.upload{
    background:#050505;
    border:1px dashed #6b6000;
    border-radius:12px;
    padding:13px;
    margin:10px 0;
}

.upload-title{
    color:#ddd;
    font-size:13px;
    margin-bottom:8px;
}

.upload input{
    width:100%;
    color:#aaa;
    font-size:12px;
}

.btn{
    width:100%;
    padding:16px;
    margin-top:18px;
    border:0;
    border-radius:12px;
    background:var(--yellow);
    color:#000;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.loading{
    display:none;
    text-align:center;
    color:var(--yellow);
    font-size:13px;
    margin-top:14px;
}

.message{
    min-height:22px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
    margin-top:14px;
    word-break:break-word;
}

.success{
    color:var(--green);
}

.error{
    color:#ff7777;
}

.back{
    text-align:center;
    color:#888;
    margin-top:20px;
    font-size:14px;
    cursor:pointer;
}

.note{
    text-align:center;
    color:#666;
    font-size:11px;
    line-height:1.5;
    margin-top:18px;
}

#riderBox{
    display:none;
}

.debug{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:10px;
    background:#080808;
    border:1px solid #333;
    color:#888;
    font-size:11px;
    line-height:1.5;
    word-break:break-word;
}

@media(max-width:480px){

    body{
        padding:10px;
        align-items:flex-start;
        padding-top:20px;
    }

    .box{
        padding:24px 18px;
    }

    .logo{
        font-size:34px;
    }
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        RID<span>ERX</span>
    </div>

    <div id="roleText" class="role">
        Customer Registration
    </div>


    <!-- BASIC DETAILS -->

    <input
        id="fullName"
        class="input"
        type="text"
        placeholder="Full Name"
        autocomplete="name"
    >

    <input
        id="phone"
        class="input"
        type="tel"
        placeholder="Phone Number"
        inputmode="numeric"
        autocomplete="tel"
    >

    <input
        id="email"
        class="input"
        type="email"
        placeholder="Email Address"
        autocomplete="email"
    >

    <input
        id="password"
        class="input"
        type="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="new-password"
    >


    <!-- RIDER DETAILS -->

    <div id="riderBox">

        <div class="section">
            Rider / Vehicle Details
        </div>

        <select id="vehicleType" class="input">

            <option value="">
                Select Vehicle Type
            </option>

            <option value="bike">
                Bike
            </option>

            <option value="cab">
                Cab
            </option>

        </select>


        <input
            id="vehicleNumber"
            class="input"
            type="text"
            placeholder="Vehicle Number"
            autocomplete="off"
        >


        <input
            id="licenseNumber"
            class="input"
            type="text"
            placeholder="Driving License Number"
            autocomplete="off"
        >


        <div class="upload">

            <div class="upload-title">
                RC Document
            </div>

            <input
                id="rc"
                type="file"
                accept="image/*,.pdf"
            >

        </div>


        <div class="upload">

            <div class="upload-title">
                Driving License
            </div>

            <input
                id="license"
                type="file"
                accept="image/*,.pdf"
            >

        </div>

    </div>


    <button
        id="registerBtn"
        class="btn"
        type="button">

        Create Account

    </button>


    <div
        id="loading"
        class="loading">

        Creating account...

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div
        id="debug"
        class="debug">
    </div>


    <div
        id="backBtn"
        class="back">

        ← Back

    </div>


    <div class="note">

        Rider registrations are reviewed by RiderX Admin
        before activation.

    </div>

</div>


<script type="module">

/*
==============================================================
RIDERX REGISTRATION
==============================================================
IMPORTANT:

This file uses ONLY functions exported by:

../firebase/firebase-config.js

==============================================================
*/


import {

    auth,
    db,
    storage,

    createUserWithEmailAndPassword,

    signOut,

    doc,
    setDoc,
    updateDoc,
    serverTimestamp

} from "../firebase/firebase-config.js";


import {

    ref,
    uploadBytes,
    getDownloadURL

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";


/* ============================================================
   ELEMENTS
============================================================ */

const fullNameInput =
    document.getElementById("fullName");

const phoneInput =
    document.getElementById("phone");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const vehicleTypeInput =
    document.getElementById("vehicleType");

const vehicleNumberInput =
    document.getElementById("vehicleNumber");

const licenseNumberInput =
    document.getElementById("licenseNumber");

const rcInput =
    document.getElementById("rc");

const licenseInput =
    document.getElementById("license");

const riderBox =
    document.getElementById("riderBox");

const roleText =
    document.getElementById("roleText");

const registerBtn =
    document.getElementById("registerBtn");

const loading =
    document.getElementById("loading");

const message =
    document.getElementById("message");

const debug =
    document.getElementById("debug");

const backBtn =
    document.getElementById("backBtn");


/* ============================================================
   ROLE
============================================================ */

const params =
    new URLSearchParams(
        window.location.search
    );

let role =
    String(
        params.get("role") || "customer"
    )
    .trim()
    .toLowerCase();


if(
    role !== "customer" &&
    role !== "rider"
){

    role = "customer";

}


if(role === "rider"){

    roleText.textContent =
        "Rider Registration";

    riderBox.style.display =
        "block";

}else{

    roleText.textContent =
        "Customer Registration";

    riderBox.style.display =
        "none";

}


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
    text,
    type = ""
){

    message.textContent =
        text || "";

    message.className =
        "message " + type;

}


/* ============================================================
   DEBUG
============================================================ */

function showDebug(text){

    if(!text){

        debug.style.display =
            "none";

        debug.textContent =
            "";

        return;

    }

    debug.style.display =
        "block";

    debug.textContent =
        text;

}


/* ============================================================
   LOADING
============================================================ */

function setLoading(
    active,
    text = "Creating account..."
){

    registerBtn.disabled =
        active;

    loading.style.display =
        active
            ? "block"
            : "none";

    loading.textContent =
        text;

}


/* ============================================================
   VALIDATION
============================================================ */

function validate(){

    const name =
        fullNameInput.value.trim();

    const phone =
        phoneInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!name){

        showMessage(
            "❌ Please enter your full name.",
            "error"
        );

        fullNameInput.focus();

        return false;
    }


    if(
        phone.replace(/\D/g,"").length < 10
    ){

        showMessage(
            "❌ Please enter a valid 10 digit phone number.",
            "error"
        );

        phoneInput.focus();

        return false;
    }


    if(!email){

        showMessage(
            "❌ Please enter your email address.",
            "error"
        );

        emailInput.focus();

        return false;
    }


    if(password.length < 6){

        showMessage(
            "❌ Password must be at least 6 characters.",
            "error"
        );

        passwordInput.focus();

        return false;
    }


    if(role === "rider"){

        if(!vehicleTypeInput.value){

            showMessage(
                "❌ Please select vehicle type.",
                "error"
            );

            vehicleTypeInput.focus();

            return false;
        }


        if(
            !vehicleNumberInput.value.trim()
        ){

            showMessage(
                "❌ Please enter vehicle number.",
                "error"
            );

            vehicleNumberInput.focus();

            return false;
        }


        if(
            !licenseNumberInput.value.trim()
        ){

            showMessage(
                "❌ Please enter driving license number.",
                "error"
            );

            licenseNumberInput.focus();

            return false;
        }


        if(!rcInput.files.length){

            showMessage(
                "❌ Please upload RC document.",
                "error"
            );

            return false;
        }


        if(!licenseInput.files.length){

            showMessage(
                "❌ Please upload driving license.",
                "error"
            );

            return false;
        }

    }


    return true;

}


/* ============================================================
   FILE UPLOAD
============================================================ */

async function uploadDocument(
    file,
    path
){

    if(!file){

        throw new Error(
            "Document file is missing."
        );

    }


    if(
        file.size >
        10 * 1024 * 1024
    ){

        throw new Error(
            "File too large. Maximum size is 10 MB."
        );

    }


    const fileRef =
        ref(
            storage,
            path
        );


    await uploadBytes(
        fileRef,
        file
    );


    return await getDownloadURL(
        fileRef
    );

}


/* ============================================================
   FIREBASE ERROR
============================================================ */

function firebaseErrorMessage(error){

    console.error(
        "FULL FIREBASE ERROR:",
        error
    );


    if(!error){

        return "Unknown registration error.";

    }


    switch(error.code){

        case "auth/email-already-in-use":

            return "This email is already registered.";

        case "auth/invalid-email":

            return "Invalid email address.";

        case "auth/weak-password":

            return "Password must contain at least 6 characters.";

        case "auth/network-request-failed":

            return "Network error. Check your internet connection.";

        case "auth/operation-not-allowed":

            return "Email/password login is disabled in Firebase Authentication.";

        case "auth/user-disabled":

            return "This account has been disabled.";

        case "auth/too-many-requests":

            return "Too many attempts. Please try again later.";

        case "permission-denied":

            return "Firestore permission denied. Check Firestore Rules.";

        case "storage/unauthorized":

            return "Storage permission denied. Check Firebase Storage Rules.";

        case "storage/canceled":

            return "Document upload was cancelled.";

        case "storage/unknown":

            return "Firebase Storage upload failed.";

        case "storage/object-not-found":

            return "Uploaded document could not be found.";

        default:

            if(
                error.message &&
                error.message.includes(
                    "Missing or insufficient permissions"
                )
            ){

                return "Firestore permission denied. Check Firestore Rules.";

            }


            if(
                error.message &&
                error.message.includes(
                    "PERMISSION_DENIED"
                )
            ){

                return "Firebase permission denied.";

            }


            return (
                error.message ||
                "Registration failed."
            );

    }

}


/* ============================================================
   REGISTER CUSTOMER
============================================================ */

async function registerCustomer(
    firebaseUser
){

    const uid =
        firebaseUser.uid;


    setLoading(
        true,
        "Saving customer profile..."
    );


    const customerData = {

        uid: uid,

        name:
            fullNameInput.value.trim(),

        fullName:
            fullNameInput.value.trim(),

        phone:
            phoneInput.value.trim(),

        email:
            emailInput.value.trim().toLowerCase(),

        role:
            "customer",

        userType:
            "customer",

        status:
            "active",

        approved:
            true,

        isApproved:
            true,

        online:
            false,

        isOnline:
            false,

        createdAt:
            serverTimestamp()

    };


    /*
    ------------------------------------------------------------
    PRIMARY USERS DOCUMENT
    ------------------------------------------------------------
    */

    await setDoc(
        doc(
            db,
            "users",
            uid
        ),
        customerData
    );


    /*
    ------------------------------------------------------------
    CUSTOMER DOCUMENT
    ------------------------------------------------------------
    */

    await setDoc(
        doc(
            db,
            "customers",
            uid
        ),
        customerData
    );


    return uid;

}


/* ============================================================
   REGISTER RIDER
============================================================ */

async function registerRider(
    firebaseUser
){

    const uid =
        firebaseUser.uid;


    const riderData = {

        uid: uid,

        name:
            fullNameInput.value.trim(),

        fullName:
            fullNameInput.value.trim(),

        phone:
            phoneInput.value.trim(),

        email:
            emailInput.value.trim().toLowerCase(),

        role:
            "rider",

        userType:
            "rider",

        status:
            "pending",

        approvalStatus:
            "pending",

        riderStatus:
            "pending",

        verificationStatus:
            "pending",

        accountStatus:
            "pending",

        approved:
            false,

        isApproved:
            false,

        online:
            false,

        isOnline:
            false,

        vehicleType:
            vehicleTypeInput.value,

        vehicleNumber:
            vehicleNumberInput.value
                .trim()
                .toUpperCase(),

        licenseNumber:
            licenseNumberInput.value
                .trim()
                .toUpperCase(),

        applicationSubmitted:
            true,

        registrationCompleted:
            true,

        documentsSubmitted:
            false,

        createdAt:
            serverTimestamp()

    };


    /*
    ------------------------------------------------------------
    CREATE USERS PROFILE FIRST
    ------------------------------------------------------------
    */

    setLoading(
        true,
        "Saving rider application..."
    );


    await setDoc(
        doc(
            db,
            "users",
            uid
        ),
        riderData
    );


    /*
    ------------------------------------------------------------
    RIDERS COLLECTION
    ------------------------------------------------------------
    */

    await setDoc(
        doc(
            db,
            "riders",
            uid
        ),
        riderData
    );


    /*
    ------------------------------------------------------------
    RC UPLOAD
    ------------------------------------------------------------
    */

    setLoading(
        true,
        "Uploading RC document..."
    );


    const rcURL =
        await uploadDocument(
            rcInput.files[0],
            "riders/" +
            uid +
            "/documents/rc"
        );


    /*
    ------------------------------------------------------------
    LICENSE UPLOAD
    ------------------------------------------------------------
    */

    setLoading(
        true,
        "Uploading driving license..."
    );


    const licenseURL =
        await uploadDocument(
            licenseInput.files[0],
            "riders/" +
            uid +
            "/documents/license"
        );


    /*
    ------------------------------------------------------------
    UPDATE DOCUMENTS
    ------------------------------------------------------------
    */

    setLoading(
        true,
        "Finalizing rider application..."
    );


    const documentData = {

        rc:
            rcURL,

        rcUrl:
            rcURL,

        license:
            licenseURL,

        licenseUrl:
            licenseURL,

        documentsUploaded:
            true,

        documentsSubmitted:
            true,

        updatedAt:
            serverTimestamp()

    };


    await updateDoc(
        doc(
            db,
            "users",
            uid
        ),
        documentData
    );


    await updateDoc(
        doc(
            db,
            "riders",
            uid
        ),
        documentData
    );


    return uid;

}


/* ============================================================
   MAIN REGISTRATION
============================================================ */

async function registerAccount(){

    if(registerBtn.disabled){

        return;

    }


    showMessage("");

    showDebug("");


    if(!validate()){

        return;

    }


    const email =
        emailInput.value
            .trim()
            .toLowerCase();

    const password =
        passwordInput.value;


    let firebaseUser =
        null;


    try{

        /*
        --------------------------------------------------------
        CREATE FIREBASE AUTH ACCOUNT
        --------------------------------------------------------
        */

        setLoading(
            true,
            "Creating Firebase account..."
        );


        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        firebaseUser =
            result.user;


        if(!firebaseUser){

            throw new Error(
                "Firebase did not return a user account."
            );

        }


        console.log(
            "RiderX registration Auth UID:",
            firebaseUser.uid
        );


        /*
        --------------------------------------------------------
        CUSTOMER
        --------------------------------------------------------
        */

        if(role === "customer"){

            await registerCustomer(
                firebaseUser
            );


            showMessage(
                "✅ Account created successfully!",
                "success"
            );


            setLoading(
                true,
                "Opening RiderX..."
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "../customer/home.html"
                    );

                },
                800
            );


            return;

        }


        /*
        --------------------------------------------------------
        RIDER
        --------------------------------------------------------
        */

        await registerRider(
            firebaseUser
        );


        showMessage(
            "✅ Rider application submitted successfully. Admin approval is required.",
            "success"
        );


        setLoading(
            true,
            "Opening application status..."
        );


        setTimeout(
            () => {

                /*
                If pending.html exists, open it.
                */

                window.location.replace(
                    "../rider/pending.html"
                );

            },
            1000
        );


    }
    catch(error){

        console.error(
            "RiderX Registration Error:",
            error
        );


        const readable =
            firebaseErrorMessage(
                error
            );


        setLoading(
            false
        );


        showMessage(
            "❌ " + readable,
            "error"
        );


        /*
        --------------------------------------------------------
        SHOW TECHNICAL ERROR
        --------------------------------------------------------
        */

        showDebug(
            "Firebase error code: " +
            (error.code || "unknown") +
            "\n\n" +
            "Message: " +
            (error.message || "No message")
        );


        /*
        IMPORTANT:

        If Auth account was created but Firestore failed,
        we do NOT automatically delete the Auth account.

        This prevents accidental data loss and lets us see
        the exact Firebase error.
        */

    }

}


/* ============================================================
   BUTTON
============================================================ */

registerBtn.addEventListener(
    "click",
    registerAccount
);


/* ============================================================
   ENTER KEY
============================================================ */

const enterInputs = [

    fullNameInput,
    phoneInput,
    emailInput,
    passwordInput,
    vehicleNumberInput,
    licenseNumberInput

];


enterInputs.forEach(
    input => {

        if(!input){

            return;

        }


        input.addEventListener(
            "keydown",
            event => {

                if(
                    event.key ===
                    "Enter"
                ){

                    event.preventDefault();

                    registerAccount();

                }

            }
        );

    }
);


/* ============================================================
   BACK BUTTON
============================================================ */

backBtn.addEventListener(
    "click",
    () => {

        if(
            window.history.length > 1
        ){

            window.history.back();

        }
        else{

            window.location.replace(
                "../index.html"
            );

        }

    }
);


/* ============================================================
   PAGE READY
============================================================ */

console.log(
    "RiderX registration page loaded successfully."
);

console.log(
    "Registration role:",
    role
);

console.log(
    "Firebase Auth:",
    !!auth
);

console.log(
    "Firestore:",
    !!db
);

console.log(
    "Storage:",
    !!storage
);

</script>

</body>
</html>
