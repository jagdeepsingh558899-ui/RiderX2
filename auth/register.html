<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Register</title>

<link rel="stylesheet" href="../assets/app.css">

<style>

body{
margin:0;
min-height:100vh;
background:#000;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
padding:20px;
}

.box{
width:100%;
max-width:430px;
background:#111;
padding:25px;
border-radius:25px;
border:1px solid #333;
}

.logo{
text-align:center;
font-size:38px;
font-weight:900;
}

.logo span{
color:#FFD600;
}

.role{
text-align:center;
color:#FFD600;
margin:15px;
}

.input{
width:100%;
padding:14px;
margin:8px 0;
background:#000;
color:white;
border:1px solid #444;
border-radius:12px;
box-sizing:border-box;
}

.upload{
background:#000;
padding:12px;
border-radius:12px;
border:1px dashed #FFD600;
margin:10px 0;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#FFD600;
color:#000;
font-weight:bold;
font-size:17px;
margin-top:15px;
}

#riderBox{
display:none;
}

.back{
text-align:center;
color:#aaa;
margin-top:20px;
cursor:pointer;
}

</style>

</head>


<body>


<div class="box">


<div class="logo">
RID<span>ERX</span>
</div>


<div class="role" id="roleText">
Customer Registration
</div>



<input id="fullName"
class="input"
placeholder="Full Name">



<input id="phone"
class="input"
placeholder="Phone Number">



<input id="email"
class="input"
type="email"
placeholder="Email Address">



<input id="password"
class="input"
type="password"
placeholder="Password">





<div id="riderBox">


<select id="vehicleType" class="input">

<option value="">
Select Vehicle
</option>

<option value="bike">
Bike
</option>

<option value="cab">
Cab
</option>

</select>




<input id="vehicleNumber"
class="input"
placeholder="Vehicle Number">



<div class="upload">

RC Upload

<br>

<input id="rc"
type="file"
accept="image/*,.pdf">

</div>



<div class="upload">

Driving License Upload

<br>

<input id="license"
type="file"
accept="image/*,.pdf">

</div>


</div>





<button id="registerBtn" class="btn">

Create Account

</button>



<div class="back" onclick="history.back()">

← Back

</div>


</div>






<script type="module">


import {

auth,
db,
storage,
createUserWithEmailAndPassword,
doc,
setDoc,
serverTimestamp

}

from "../firebase/firebase-config.js";



import {

ref,
uploadBytes,
getDownloadURL

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";





const params =
new URLSearchParams(window.location.search);



const role =
params.get("role") || "customer";





if(role==="rider"){

document.getElementById("roleText").innerText =
"Rider Registration";

document.getElementById("riderBox").style.display =
"block";

}







async function uploadFile(file,path){

if(!file)
return "";

const fileRef =
ref(storage,path);

await uploadBytes(fileRef,file);

return await getDownloadURL(fileRef);

}







document
.getElementById("registerBtn")
.onclick = async ()=>{


try{


const fullName =
document.getElementById("fullName").value.trim();


const phone =
document.getElementById("phone").value.trim();


const email =
document.getElementById("email").value.trim();


const password =
document.getElementById("password").value;





const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);



const uid =
userCredential.user.uid;





let userData={


uid:uid,

fullName:fullName,

phone:phone,

email:email,

role:role,

status: role==="rider"
? "pending"
: "active",

createdAt:serverTimestamp()

};






if(role==="rider"){


const rcURL =
await uploadFile(
document.getElementById("rc").files[0],
"riders/"+uid+"/rc"
);



const licenseURL =
await uploadFile(
document.getElementById("license").files[0],
"riders/"+uid+"/license"
);




userData.vehicleType =
document.getElementById("vehicleType").value;


userData.vehicleNumber =
document.getElementById("vehicleNumber").value;


userData.rc =
rcURL;


userData.license =
licenseURL;


userData.approved =
false;



await setDoc(
doc(db,"drivers",uid),
{

driverId:uid,

fullName:fullName,

isOnline:false,

approved:false,

status:"pending",

location:{
lat:0,
lng:0
}

}

);


}







await setDoc(
doc(db,"users",uid),
userData
);






alert("RiderX Account Created Successfully");





if(role==="rider"){

window.location.href="../rider/pending.html";

}
else{

window.location.href="../customer/home.html";

}



}

catch(error){

alert(error.message);

}


};



</script>


</body>

</html>
