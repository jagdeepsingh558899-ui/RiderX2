<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFD400"><title>RiderX - Create Account</title><link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Auth.css">
<link rel="stylesheet" href="../css/Responsive.css"><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    position:relative;
    overflow:hidden;
}

.page::before{
    content:"";
    position:absolute;
    width:360px;
    height:360px;
    top:-180px;
    right:-150px;
    border-radius:50%;
    background:rgba(255,212,0,.07);
}

.page::after{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    bottom:-190px;
    left:-150px;
    border-radius:50%;
    background:rgba(255,212,0,.05);
}

.card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:440px;
    padding:26px 22px 20px;
    border:1px solid #292929;
    border-radius:22px;
    background:#111;
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.brand{
    text-align:center;
    margin-bottom:21px;
}

.logo{
    width:62px;
    height:62px;
    margin:0 auto 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:17px;
    background:#FFD400;
    color:#090909;
    font-size:22px;
    font-weight:1000;
}

.brand h1{
    margin:0;
    font-size:24px;
    font-weight:1000;
}

.brand h1 span{
    color:#FFD400;
}

.brand p{
    margin:5px 0 0;
    color:#777;
    font-size:9px;
}

.heading{
    margin-bottom:15px;
}

.heading h2{
    margin:0;
    font-size:18px;
}

.heading p{
    margin:5px 0 0;
    color:#777;
    font-size:9px;
    line-height:1.5;
}

.message{
    display:none;
    margin-bottom:12px;
    padding:10px;
    border-radius:9px;
    font-size:9px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.error{
    border:1px solid #542828;
    background:#241414;
    color:#ff7777;
}

.success{
    border:1px solid #275335;
    background:#132319;
    color:#65e58b;
}

.field{
    margin-bottom:12px;
}

.field label{
    display:block;
    margin-bottom:6px;
    color:#999;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
}

.input{
    width:100%;
    height:45px;
    padding:0 12px;
    border:1px solid #333;
    border-radius:9px;
    outline:none;
    background:#1a1a1a;
    color:#fff;
    font-size:11px;
}

.input:focus{
    border-color:#FFD400;
    box-shadow:0 0 0 2px rgba(255,212,0,.08);
}

.input::placeholder{
    color:#555;
}

.phone-row{
    display:flex;
    gap:7px;
}

.code{
    width:76px;
    flex:none;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #333;
    border-radius:9px;
    background:#1a1a1a;
    color:#FFD400;
    font-size:10px;
    font-weight:900;
}

.phone-row .input{
    flex:1;
}

.password{
    position:relative;
}

.password .input{
    padding-right:43px;
}

.eye{
    position:absolute;
    top:50%;
    right:6px;
    width:34px;
    height:34px;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#777;
    cursor:pointer;
}

.eye:hover{
    color:#FFD400;
}

.role-title{
    margin:2px 0 8px;
    color:#999;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
}

.roles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:13px;
}

.role{
    position:relative;
}

.role input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.role label{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    border:1px solid #333;
    border-radius:9px;
    background:#191919;
    color:#888;
    cursor:pointer;
    font-size:10px;
    font-weight:900;
}

.role input:checked + label{
    border-color:#FFD400;
    background:#211f12;
    color:#FFD400;
}

.password-strength{
    margin-top:6px;
    display:flex;
    align-items:center;
    gap:7px;
}

.strength-bar{
    flex:1;
    height:4px;
    border-radius:10px;
    background:#292929;
    overflow:hidden;
}

.strength-fill{
    width:0;
    height:100%;
    background:#FFD400;
    transition:.2s;
}

.strength-text{
    min-width:43px;
    color:#666;
    font-size:7px;
    text-align:right;
}

.terms{
    display:flex;
    align-items:flex-start;
    gap:7px;
    margin:5px 0 15px;
    color:#666;
    font-size:8px;
    line-height:1.5;
}

.terms input{
    width:14px;
    height:14px;
    flex:none;
    accent-color:#FFD400;
}

.terms a{
    color:#FFD400;
    text-decoration:none;
}

.submit{
    width:100%;
    height:47px;
    border:0;
    border-radius:9px;
    background:#FFD400;
    color:#111;
    cursor:pointer;
    font-size:11px;
    font-weight:1000;
}

.submit:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.login{
    margin-top:16px;
    text-align:center;
    color:#777;
    font-size:9px;
}

.login a{
    color:#FFD400;
    text-decoration:none;
    font-weight:900;
}

.back{
    width:100%;
    margin-top:11px;
    border:0;
    background:transparent;
    color:#555;
    cursor:pointer;
    font-size:8px;
}

.back:hover{
    color:#FFD400;
}

.footer{
    margin-top:17px;
    text-align:center;
    color:#444;
    font-size:7px;
}

.loader{
    display:inline-block;
    width:12px;
    height:12px;
    margin-right:6px;
    vertical-align:-2px;
    border:2px solid rgba(0,0,0,.25);
    border-top-color:#111;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:430px){

    .page{
        padding:9px;
    }

    .card{
        padding:23px 16px 17px;
        border-radius:18px;
    }

}

</style></head><body><main class="page"><section class="card"><div class="brand"><div class="logo">
    RX
</div>

<h1>
    Rider<span>X</span>
</h1>

<p>
    Join the smarter way to travel
</p>

</div><div class="heading"><h2>
    Create your account
</h2>

<p>
    Register once and start using RiderX.
</p>

</div><div
    class="message error"
    id="errorBox"
></div><div
    class="message success"
    id="successBox"
></div><form
    id="registerForm"
    novalidate
><div class="field"><label>
    Full Name
</label>

<input
    class="input"
    id="name"
    type="text"
    autocomplete="name"
    maxlength="60"
    placeholder="Enter your full name"
    required
>

</div><div class="field"><label>
    Mobile Number
</label>

<div class="phone-row">

    <div class="code">
        +91
    </div>

    <input
        class="input"
        id="phone"
        type="tel"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="10"
        placeholder="10-digit mobile number"
        required
    >

</div>

</div><div class="field"><label>
    Email Address
</label>

<input
    class="input"
    id="email"
    type="email"
    autocomplete="email"
    maxlength="100"
    placeholder="Enter email address"
>

</div><div class="field"><label>
    Password
</label>

<div class="password">

    <input
        class="input"
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="6"
        maxlength="40"
        placeholder="Create password"
        required
    >

    <button
        type="button"
        class="eye"
        id="passwordEye"
    >
        👁
    </button>

</div>


<div class="password-strength">

    <div class="strength-bar">

        <div
            class="strength-fill"
            id="strengthFill"
        ></div>

    </div>

    <span
        class="strength-text"
        id="strengthText"
    >
        Weak
    </span>

</div>

</div><div class="field"><label>
    Confirm Password
</label>

<div class="password">

    <input
        class="input"
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="6"
        maxlength="40"
        placeholder="Confirm password"
        required
    >

    <button
        type="button"
        class="eye"
        id="confirmEye"
    >
        👁
    </button>

</div>

</div><div class="role-title">
    Account Type
</div><div class="roles"><div class="role">

    <input
        type="radio"
        name="role"
        id="customerRole"
        value="customer"
        checked
    >

    <label for="customerRole">
        👤 Customer
    </label>

</div>


<div class="role">

    <input
        type="radio"
        name="role"
        id="riderRole"
        value="rider"
    >

    <label for="riderRole">
        🛵 Rider
    </label>

</div>

</div><label class="terms"><input
    type="checkbox"
    id="terms"
>

<span>
    I agree to RiderX
    <a href="#">
        Terms & Conditions
    </a>
    and
    <a href="#">
        Privacy Policy
    </a>.
</span>

</label><button
type="submit"
class="submit"
id="submitBtn"

«»

Create Account

</button></form><div class="login">Already have an account?

<a href="./login.html">
    Login
</a>

</div><button
type="button"
class="back"
id="backBtn"

«»

← Choose another option

</button><div class="footer">
    © 2026 RiderX • Account Registration
</div></section></main><script>

"use strict";


const form =
    document.getElementById(
        "registerForm"
    );

const nameInput =
    document.getElementById(
        "name"
    );

const phoneInput =
    document.getElementById(
        "phone"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const confirmInput =
    document.getElementById(
        "confirmPassword"
    );

const terms =
    document.getElementById(
        "terms"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const successBox =
    document.getElementById(
        "successBox"
    );

const strengthFill =
    document.getElementById(
        "strengthFill"
    );

const strengthText =
    document.getElementById(
        "strengthText"
    );



phoneInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    10
                );

    }
);



passwordInput.addEventListener(
    "input",
    function(){

        updateStrength(
            this.value
        );

    }
);



document
    .getElementById(
        "passwordEye"
    )
    .addEventListener(
        "click",
        function(){

            togglePassword(
                passwordInput,
                this
            );

        }
    );



document
    .getElementById(
        "confirmEye"
    )
    .addEventListener(
        "click",
        function(){

            togglePassword(
                confirmInput,
                this
            );

        }
    );



form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        clearMessages();


        const name =
            nameInput.value.trim();


        const phone =
            phoneInput.value.trim();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        const confirm =
            confirmInput.value;


        const role =
            document.querySelector(
                'input[name="role"]:checked'
            )?.value ||
            "customer";


        if(
            name.length < 2
        ){

            showError(
                "Please enter your full name."
            );

            nameInput.focus();

            return;

        }


        if(
            !/^[6-9]\d{9}$/.test(
                phone
            )
        ){

            showError(
                "Please enter a valid 10-digit Indian mobile number."
            );

            phoneInput.focus();

            return;

        }


        if(
            email &&
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                email
            )
        ){

            showError(
                "Please enter a valid email address."
            );

            emailInput.focus();

            return;

        }


        if(
            password.length < 6
        ){

            showError(
                "Password must contain at least 6 characters."
            );

            passwordInput.focus();

            return;

        }


        if(
            password !==
            confirm
        ){

            showError(
                "Passwords do not match."
            );

            confirmInput.focus();

            return;

        }


        if(
            !terms.checked
        ){

            showError(
                "Please accept the Terms & Conditions and Privacy Policy."
            );

            return;

        }


        if(
            userExists(
                phone
            )
        ){

            showError(
                "An account with this mobile number already exists."
            );

            phoneInput.focus();

            return;

        }


        setLoading(
            true
        );


        try{

            const user = {

                uid:
                    "user_" +
                    Date.now(),

                name:
                    name,

                phone:
                    phone,

                email:
                    email,

                password:
                    password,

                role:
                    role,

                status:
                    "active",

                createdAt:
                    new Date().toISOString()

            };


            const users =
                getUsers();


            users.push(
                user
            );


            localStorage.setItem(
                "riderx_users",
                JSON.stringify(
                    users
                )
            );


            /*
             * Keep role-specific compatibility
             * with existing RiderX pages.
             */

            if(
                role === "customer"
            ){

                localStorage.setItem(
                    "riderx_customer",
                    JSON.stringify(
                        user
                    )
                );

            }


            if(
                role === "rider"
            ){

                localStorage.setItem(
                    "riderx_rider",
                    JSON.stringify(
                        user
                    )
                );

            }


            localStorage.setItem(
                "riderx_selected_role",
                role
            );


            showSuccess(
                "Account created successfully. Redirecting..."
            );


            setTimeout(
                function(){

                    if(
                        role === "rider"
                    ){

                        window.location.href =
                            "./rider-login.html";

                    }else{

                        window.location.href =
                            "./customer-login.html";

                    }

                },
                800
            );


        }catch(error){

            console.error(
                error
            );


            showError(
                "Unable to create account. Please try again."
            );


            setLoading(
                false
            );

        }

    }
);



document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "./role.html";

        }
    );



function getUsers(){

    try{

        const raw =
            localStorage.getItem(
                "riderx_users"
            );


        if(raw){

            const parsed =
                JSON.parse(
                    raw
                );


            if(
                Array.isArray(
                    parsed
                )
            ){

                return parsed;

            }

        }

    }catch(error){

        console.error(
            error
        );

    }


    return [];

}



function userExists(
    phone
){

    const users =
        getUsers();


    return users.some(
        function(user){

            return (
                normalizePhone(
                    user.phone
                ) ===
                phone
            );

        }
    );

}



function normalizePhone(
    value
){

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    )
    .slice(
        -10
    );

}



function updateStrength(
    value
){

    let score =
        0;


    if(
        value.length >= 6
    ){

        score++;

    }


    if(
        /[A-Z]/.test(
            value
        )
    ){

        score++;

    }


    if(
        /[0-9]/.test(
            value
        )
    ){

        score++;

    }


    if(
        /[^A-Za-z0-9]/.test(
            value
        )
    ){

        score++;

    }


    if(!value){

        strengthFill.style.width =
            "0%";

        strengthText.textContent =
            "Weak";

        return;

    }


    if(score <= 1){

        strengthFill.style.width =
            "25%";

        strengthText.textContent =
            "Weak";

    }else if(score === 2){

        strengthFill.style.width =
            "50%";

        strengthText.textContent =
            "Fair";

    }else if(score === 3){

        strengthFill.style.width =
            "75%";

        strengthText.textContent =
            "Good";

    }else{

        strengthFill.style.width =
            "100%";

        strengthText.textContent =
            "Strong";

    }

}



function togglePassword(
input,
button
){

    const show =
        input.type ===
        "password";


    input.type =
        show
            ? "text"
            : "password";


    button.textContent =
        show
            ? "🙈"
            : "👁";

}



function setLoading(
loading
){

    submitBtn.disabled =
        loading;


    if(loading){

        submitBtn.innerHTML =
            '<span class="loader"></span>Creating account...';

    }else{

        submitBtn.textContent =
            "Create Account";

    }

}



function clearMessages(){

    errorBox.classList.remove(
        "show"
    );

    successBox.classList.remove(
        "show"
    );

}



function showError(
message
){

    successBox.classList.remove(
        "show"
    );

    errorBox.textContent =
        message;

    errorBox.classList.add(
        "show"
    );

}



function showSuccess(
message
){

    errorBox.classList.remove(
        "show"
    );

    successBox.textContent =
        message;

    successBox.classList.add(
        "show"
    );

}

</script></body></html>
