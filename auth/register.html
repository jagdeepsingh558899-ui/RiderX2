<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#ffd400"
>

<meta
    name="description"
    content="Create your RiderX account"
>

<title>RiderX - Create Account</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #070707;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.page {
    position: relative;

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

    overflow: auto;
}

.page::before,
.page::after {
    content: "";

    position: fixed;

    border-radius: 50%;

    pointer-events: none;
}

.page::before {
    width: 430px;
    height: 430px;

    top: -280px;
    right: -180px;

    background: rgba(255, 212, 0, .08);
}

.page::after {
    width: 360px;
    height: 360px;

    bottom: -240px;
    left: -180px;

    background: rgba(255, 212, 0, .05);
}

.card {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 455px;

    margin: 12px 0;
    padding: 28px 22px 21px;

    border: 1px solid #292929;
    border-radius: 23px;

    background: #111;

    box-shadow:
        0 25px 80px rgba(0, 0, 0, .55);
}

.brand {
    margin-bottom: 21px;
    text-align: center;
}

.logo {
    width: 62px;
    height: 62px;

    margin: 0 auto 11px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background: #ffd400;
    color: #080808;

    font-size: 21px;
    font-weight: 1000;
}

.brand h1 {
    margin: 0;

    font-size: 25px;
    font-weight: 1000;
}

.brand h1 span {
    color: #ffd400;
}

.brand p {
    margin: 6px 0 0;

    color: #777;

    font-size: 9px;
}

.heading {
    text-align: center;
}

.heading h2 {
    margin: 0;

    font-size: 19px;
    font-weight: 900;
}

.heading p {
    max-width: 350px;

    margin: 6px auto 0;

    color: #777;

    font-size: 9px;
    line-height: 1.55;
}

.role-title {
    margin-top: 17px;

    color: #999;

    font-size: 8px;
    font-weight: 900;

    text-align: center;
    text-transform: uppercase;
}

.roles {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;

    margin-top: 8px;
}

.role {
    min-height: 57px;

    border: 1px solid #303030;
    border-radius: 11px;

    background: #181818;
    color: #888;

    cursor: pointer;

    font-size: 9px;
    font-weight: 900;

    transition:
        border-color .15s ease,
        background .15s ease,
        color .15s ease,
        transform .15s ease;
}

.role:hover,
.role:focus-visible {
    border-color: #ffd400;
    color: #ffd400;
    outline: none;
}

.role:active {
    transform: scale(.99);
}

.role.active {
    border-color: #ffd400;

    background:
        rgba(255, 212, 0, .08);

    color: #ffd400;
}

.form {
    margin-top: 18px;
}

.field {
    margin-bottom: 12px;
}

.field label {
    display: block;

    margin-bottom: 6px;

    color: #aaa;

    font-size: 8px;
    font-weight: 900;

    text-transform: uppercase;
}

.field input,
.field select {
    width: 100%;
    height: 45px;

    padding: 0 12px;

    border: 1px solid #303030;
    border-radius: 10px;

    outline: none;

    background: #191919;
    color: #fff;

    font-size: 11px;

    transition:
        border-color .15s ease,
        box-shadow .15s ease;
}

.field input::placeholder {
    color: #555;
}

.field input:focus,
.field select:focus {
    border-color: #ffd400;

    box-shadow:
        0 0 0 2px
        rgba(255, 212, 0, .06);
}

.field input:disabled,
.field select:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.field select {
    appearance: none;
}

.two {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 9px;
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 60px;
}

.password-toggle {
    position: absolute;

    top: 50%;
    right: 8px;

    transform: translateY(-50%);

    border: 0;

    padding: 4px;

    background: transparent;
    color: #777;

    cursor: pointer;

    font-size: 8px;
    font-weight: 900;
}

.password-toggle:hover,
.password-toggle:focus-visible {
    color: #ffd400;
    outline: none;
}

.terms {
    display: flex;
    align-items: flex-start;

    gap: 8px;

    margin: 3px 0 15px;

    color: #666;

    font-size: 8px;
    line-height: 1.5;
}

.terms input {
    width: 14px;
    height: 14px;

    flex: 0 0 auto;

    margin-top: 1px;

    accent-color: #ffd400;
}

.terms a {
    color: #ffd400;
    text-decoration: none;
}

.terms a:hover {
    text-decoration: underline;
}

.primary {
    width: 100%;
    min-height: 47px;

    border: 0;
    border-radius: 10px;

    background: #ffd400;
    color: #090909;

    cursor: pointer;

    font-size: 10px;
    font-weight: 1000;

    transition:
        opacity .15s ease,
        transform .15s ease;
}

.primary:hover {
    opacity: .94;
}

.primary:active {
    transform: scale(.99);
}

.primary:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.message {
    display: none;

    margin: 12px 0;

    padding: 10px;

    border-radius: 9px;

    text-align: center;

    font-size: 8px;
    line-height: 1.5;
}

.message.show {
    display: block;
}

.message.error {
    border: 1px solid #572525;

    background:
        rgba(255, 50, 50, .07);

    color: #ff7777;
}

.message.success {
    border: 1px solid #295432;

    background:
        rgba(40, 180, 70, .07);

    color: #70d888;
}

.message.info {
    border: 1px solid #443b00;

    background:
        rgba(255, 212, 0, .07);

    color: #ffd400;
}

.login {
    margin-top: 17px;
    padding-top: 16px;

    border-top: 1px solid #272727;

    color: #666;

    text-align: center;
    font-size: 9px;
}

.login button {
    border: 0;

    padding: 0;

    background: transparent;
    color: #ffd400;

    cursor: pointer;

    font-size: 9px;
    font-weight: 900;
}

.footer {
    margin-top: 16px;

    color: #444;

    font-size: 8px;

    text-align: center;
}

.loader {
    display: inline-block;

    width: 13px;
    height: 13px;

    margin-right: 7px;

    vertical-align: -2px;

    border:
        2px solid rgba(0, 0, 0, .2);

    border-top-color: #111;

    border-radius: 50%;

    animation:
        riderxRegisterSpin .7s linear infinite;
}

@keyframes riderxRegisterSpin {

    to {
        transform: rotate(360deg);
    }

}

@media (max-width: 390px) {

    .card {
        padding: 24px 16px 18px;

        border-radius: 19px;
    }

    .two {
        grid-template-columns: 1fr;

        gap: 0;
    }

}

</style>

</head>

<body>

<main class="page">

<section class="card">

    <div class="brand">

        <div class="logo">
            RX
        </div>

        <h1>
            Rider<span>X</span>
        </h1>

        <p>
            Ride smarter. Ride with RiderX.
        </p>

    </div>


    <div class="heading">

        <h2>
            Create your RiderX Account
        </h2>

        <p>
            Register once and start using RiderX
            for rides, payments and trip management.
        </p>

    </div>


    <div class="role-title">
        Choose account type
    </div>


    <div
        class="roles"
        role="group"
        aria-label="Choose account type"
    >

        <button
            type="button"
            class="role active"
            id="customerRole"
            aria-pressed="true"
        >
            CUSTOMER
        </button>

        <button
            type="button"
            class="role"
            id="riderRole"
            aria-pressed="false"
        >
            RIDER / DRIVER
        </button>

    </div>


    <form
        class="form"
        id="registerForm"
        novalidate
    >

        <div class="two">

            <div class="field">

                <label for="firstName">
                    First Name
                </label>

                <input
                    id="firstName"
                    type="text"
                    autocomplete="given-name"
                    placeholder="First name"
                    maxlength="40"
                    required
                >

            </div>


            <div class="field">

                <label for="lastName">
                    Last Name
                </label>

                <input
                    id="lastName"
                    type="text"
                    autocomplete="family-name"
                    placeholder="Last name"
                    maxlength="40"
                >

            </div>

        </div>


        <div class="field">

            <label for="phone">
                Mobile Number
            </label>

            <input
                id="phone"
                type="tel"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="10"
                placeholder="10 digit mobile number"
                required
            >

        </div>


        <div class="field">

            <label for="email">
                Email Address
            </label>

            <input
                id="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="Enter your email"
                maxlength="100"
                required
            >

        </div>


        <div class="two">

            <div class="field">

                <label for="state">
                    State / UT
                </label>

                <select
                    id="state"
                    required
                >

                    <option value="">
                        Select State / UT
                    </option>

                    <option>Andhra Pradesh</option>
                    <option>Arunachal Pradesh</option>
                    <option>Assam</option>
                    <option>Bihar</option>
                    <option>Chhattisgarh</option>
                    <option>Goa</option>
                    <option>Gujarat</option>
                    <option>Haryana</option>
                    <option>Himachal Pradesh</option>
                    <option>Jharkhand</option>
                    <option>Karnataka</option>
                    <option>Kerala</option>
                    <option>Madhya Pradesh</option>
                    <option>Maharashtra</option>
                    <option>Manipur</option>
                    <option>Meghalaya</option>
                    <option>Mizoram</option>
                    <option>Nagaland</option>
                    <option>Odisha</option>
                    <option>Punjab</option>
                    <option>Rajasthan</option>
                    <option>Sikkim</option>
                    <option>Tamil Nadu</option>
                    <option>Telangana</option>
                    <option>Tripura</option>
                    <option>Uttar Pradesh</option>
                    <option>Uttarakhand</option>
                    <option>West Bengal</option>
                    <option>Andaman and Nicobar Islands</option>
                    <option>Chandigarh</option>
                    <option>Dadra and Nagar Haveli and Daman and Diu</option>
                    <option>Delhi</option>
                    <option>Jammu and Kashmir</option>
                    <option>Ladakh</option>
                    <option>Lakshadweep</option>
                    <option>Puducherry</option>

                </select>

            </div>


            <div class="field">

                <label for="city">
                    City
                </label>

        <div class="field">

<script type="module">

"use strict";


/* =========================================================
   DOM
========================================================= */

const form =
    document.getElementById("registerForm");

const firstName =
    document.getElementById("firstName");

const lastName =
    document.getElementById("lastName");

const phone =
    document.getElementById("phone");

const email =
    document.getElementById("email");

const state =
    document.getElementById("state");

const city =
    document.getElementById("city");

const language =
    document.getElementById("language");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const terms =
    document.getElementById("terms");

const customerRole =
    document.getElementById("customerRole");

const riderRole =
    document.getElementById("riderRole");

const registerButton =
    document.getElementById("registerButton");

const loginButton =
    document.getElementById("loginButton");

const passwordToggle =
    document.getElementById("passwordToggle");

const confirmToggle =
    document.getElementById("confirmToggle");

const message =
    document.getElementById("message");

const termsLink =
    document.getElementById("termsLink");

const privacyLink =
    document.getElementById("privacyLink");


/* =========================================================
   STATE
========================================================= */

let selectedRole = "customer";
let busy = false;


/* =========================================================
   STORAGE
========================================================= */

function getStorage(key) {

    try {

        return localStorage.getItem(key);

    } catch (error) {

        console.warn(
            "RiderX storage read failed:",
            error
        );

        return null;

    }

}


function setStorage(
    key,
    value
) {

    try {

        localStorage.setItem(
            key,
            value
        );

    } catch (error) {

        console.warn(
            "RiderX storage write failed:",
            error
        );

    }

}


function removeStorage(key) {

    try {

        localStorage.removeItem(key);

    } catch (error) {

        console.warn(
            "RiderX storage removal failed:",
            error
        );

    }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "info"
) {

    message.textContent =
        String(text || "");

    message.className =
        "message show " + type;

}


function clearMessage() {

    message.textContent = "";

    message.className =
        "message";

}


/* =========================================================
   ROLE
========================================================= */

function normalizeRole(value) {

    const role =
        String(value || "")
            .trim()
            .toLowerCase();

    if (
        [
            "rider",
            "driver",
            "partner",
            "captain",
            "driver_partner"
        ].includes(role)
    ) {

        return "rider";

    }

    return "customer";

}


function updateRoleUI() {

    const isRider =
        selectedRole === "rider";


    customerRole.classList.toggle(
        "active",
        !isRider
    );

    riderRole.classList.toggle(
        "active",
        isRider
    );


    customerRole.setAttribute(
        "aria-pressed",
        String(!isRider)
    );

    riderRole.setAttribute(
        "aria-pressed",
        String(isRider)
    );


    registerButton.textContent =
        isRider
            ? "CREATE RIDER ACCOUNT"
            : "CREATE CUSTOMER ACCOUNT";

}


function setRole(role) {

    selectedRole =
        normalizeRole(role);


    /*
     * This value is only a UI/navigation preference.
     * It is never used as authentication proof.
     */

    setStorage(
        "riderx_selected_role",
        selectedRole
    );


    updateRoleUI();

}


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

function togglePassword(
    input,
    button
) {

    const shouldShow =
        input.type === "password";


    input.type =
        shouldShow
            ? "text"
            : "password";


    button.textContent =
        shouldShow
            ? "HIDE"
            : "SHOW";


    button.setAttribute(
        "aria-label",
        shouldShow
            ? "Hide password"
            : "Show password"
    );

}


passwordToggle.addEventListener(
    "click",
    function () {

        togglePassword(
            password,
            passwordToggle
        );

    }
);


confirmToggle.addEventListener(
    "click",
    function () {

        togglePassword(
            confirmPassword,
            confirmToggle
        );

    }
);


/* =========================================================
   ROLE BUTTONS
========================================================= */

customerRole.addEventListener(
    "click",
    function () {

        if (busy) {
            return;
        }

        clearMessage();

        setRole("customer");

    }
);


riderRole.addEventListener(
    "click",
    function () {

        if (busy) {
            return;
        }

        clearMessage();

        setRole("rider");

    }
);


/* =========================================================
   VALIDATION
========================================================= */

function cleanText(value) {

    return String(value || "")
        .trim()
        .replace(/\s+/g, " ");

}


function validName(value) {

    return (
        value.length >= 2 &&
        value.length <= 40 &&
        /^[\p{L} .'-]+$/u.test(value)
    );

}


function validPhone(value) {

    return /^[6-9]\d{9}$/.test(value);

}


function validEmail(value) {

    return (
        value.length <= 100 &&
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
    );

}


function validPassword(value) {

    return (
        value.length >= 6 &&
        value.length <= 72
    );

}


/* =========================================================
   FIREBASE ERROR
========================================================= */

function firebaseErrorMessage(error) {

    const code =
        String(
            error?.code || ""
        ).toLowerCase();


    const known = {

        "auth/email-already-in-use":
            "This email is already registered. Please login instead.",

        "auth/invalid-email":
            "Please enter a valid email address.",

        "auth/weak-password":
            "Password is too weak. Use at least 6 characters.",

        "auth/password-does-not-meet-requirements":
            "Password does not meet the required password rules.",

        "auth/operation-not-allowed":
            "Email/password registration is not enabled in Firebase.",

        "auth/network-request-failed":
            "Network error. Please check your internet connection.",

        "auth/too-many-requests":
            "Too many requests. Please wait and try again.",

        "auth/app-not-authorized":
            "This website is not authorized in Firebase.",

        "auth/invalid-api-key":
            "Firebase configuration is invalid.",

        "auth/quota-exceeded":
            "Firebase quota has been exceeded. Please try again later.",

        "auth/admin-restricted-operation":
            "This registration method is currently restricted."

    };


    if (known[code]) {

        return known[code];

    }


    const text =
        String(
            error?.message || ""
        );


    if (
        text.toLowerCase().includes(
            "permission"
        )
    ) {

        return (
            "Firebase permission denied. Please check Firestore rules."
        );

    }


    return (
        text ||
        "Registration failed. Please try again."
    );

}


/* =========================================================
   REFERRAL CODE
========================================================= */

function createReferralCode(name) {

    const prefix =
        String(name || "USER")
            .replace(
                /[^a-zA-Z0-9]/g,
                ""
            )
            .toUpperCase()
            .slice(0, 4)
            .padEnd(2, "X");


    const random =
        Math.random()
            .toString(36)
            .slice(2, 8)
            .toUpperCase();


    return (
        "RX" +
        prefix +
        random
    );

}


/* =========================================================
   FIREBASE MODULE
========================================================= */

async function loadFirebase() {

    const FB =
        await import(
            "../firebase/firebase-config.js"
        );


    const required = [

        "auth",
        "db",
        "createUserWithEmailAndPassword",
        "setDoc",
        "doc"

    ];


    for (
        const key of required
    ) {

        if (
            typeof FB[key] === "undefined"
        ) {

            throw new Error(
                "Firebase module is missing required export: " +
                key
            );

        }

    }


    return FB;

}


/* =========================================================
   PROFILE CREATION
========================================================= */

async function createProfiles(
    FB,
    profile,
    uid
) {

    /*
     * users/{uid} is the canonical common profile.
     */

    await FB.setDoc(
        FB.doc(
            FB.db,
            "users",
            uid
        ),
        profile,
        {
            merge: true
        }
    );


    /*
     * Keep role-specific documents synchronized
     * with the common profile.
     */

    const roleCollection =
        profile.role === "rider"
            ? "riders"
            : "customers";


    await FB.setDoc(
        FB.doc(
            FB.db,
            roleCollection,
            uid
        ),
        profile,
        {
            merge: true
        }
    );

}


/* =========================================================
   LOCAL SESSION
========================================================= */

function saveLocalSession(
    profile
) {

    const localProfile = {

        ...profile,

        createdAt:
            new Date().toISOString(),

        updatedAt:
            new Date().toISOString()

    };


    setStorage(
        "riderx_session",
        JSON.stringify({

            uid:
                profile.uid,

            role:
                profile.role,

            email:
                profile.email,

            displayName:
                profile.displayName,

            updatedAt:
                Date.now()

        })
    );


    setStorage(
        "riderx_user",
        JSON.stringify(
            localProfile
        )
    );


    setStorage(
        "riderx_role",
        profile.role
    );


    setStorage(
        "riderx_selected_role",
        profile.role
    );


    setStorage(
        "userRole",
        profile.role
    );


    setStorage(
        "riderx_uid",
        profile.uid
    );


    if (
        profile.role === "rider"
    ) {

        setStorage(
            "riderx_rider_id",
            profile.uid
        );

        setStorage(
            "riderx_rider",
            JSON.stringify(
                localProfile
            )
        );


        removeStorage(
            "riderx_customer_id"
        );

        removeStorage(
            "riderx_customer"
        );

    } else {

        setStorage(
            "riderx_customer_id",
            profile.uid
        );

        setStorage(
            "riderx_customer",
            JSON.stringify(
                localProfile
            )
        );


        removeStorage(
            "riderx_rider_id"
        );

        removeStorage(
            "riderx_rider"
        );

    }

}


/* =========================================================
   REGISTRATION
========================================================= */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        if (busy) {
            return;
        }


        clearMessage();


        const first =
            cleanText(
                firstName.value
            );


        const last =
            cleanText(
                lastName.value
            );


        const mobile =
            phone.value
                .replace(/\D/g, "")
                .slice(0, 10);


        const mail =
            email.value
                .trim()
                .toLowerCase();


        const selectedState =
            cleanText(
                state.value
            );


        const selectedCity =
            cleanText(
                city.value
            );


        const selectedLanguage =
            language.value === "hi"
                ? "hi"
                : "en";


        const pass =
            password.value;


        const confirm =
            confirmPassword.value;


        /* -------------------------------------------------
           VALIDATION
        ------------------------------------------------- */

        if (!validName(first)) {

            showMessage(
                "Please enter a valid first name.",
                "error"
            );

            firstName.focus();

            return;

        }


        if (
            last &&
            !validName(last)
        ) {

            showMessage(
                "Please enter a valid last name.",
                "error"
            );

            lastName.focus();

            return;

        }


        if (!validPhone(mobile)) {

            showMessage(
                "Please enter a valid 10-digit Indian mobile number.",
                "error"
            );

            phone.focus();

            return;

        }


        if (!validEmail(mail)) {

            showMessage(
                "Please enter a valid email address.",
                "error"
            );

            email.focus();

            return;

        }


        if (!selectedState) {

            showMessage(
                "Please select your State / UT.",
                "error"
            );

            state.focus();

            return;

        }


        if (selectedCity.length < 2) {

            showMessage(
                "Please enter your city.",
                "error"
            );

            city.focus();

            return;

        }


        if (!validPassword(pass)) {

            showMessage(
                "Password must contain 6 to 72 characters.",
                "error"
            );

            password.focus();

            return;

        }


        if (pass !== confirm) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            confirmPassword.focus();

            return;

        }


        if (!terms.checked) {

            showMessage(
                "Please accept the RiderX Terms and Privacy Policy.",
                "error"
            );

            terms.focus();

            return;

        }


        /* -------------------------------------------------
           START REGISTRATION
        ------------------------------------------------- */

        busy = true;

        registerButton.disabled = true;

        customerRole.disabled = true;

        riderRole.disabled = true;

        registerButton.innerHTML =
            '<span class="loader"></span>CREATING ACCOUNT...';


        let authCreatedUser = null;


        try {

            const FB =
                await loadFirebase();


            /* ------------------------------------------------
               CREATE AUTH USER
            ------------------------------------------------ */

            const result =
                await FB.createUserWithEmailAndPassword(
                    FB.auth,
                    mail,
                    pass
                );


            authCreatedUser =
                result?.user || null;


            if (
                !authCreatedUser ||
                !authCreatedUser.uid
            ) {

                throw new Error(
                    "Firebase did not return a valid user account."
                );

            }


            const uid =
                authCreatedUser.uid;


            const fullName =
                (
                    first +
                    (
                        last
                            ? " " + last
                            : ""
                    )
                ).trim();


            /* ------------------------------------------------
               AUTH DISPLAY NAME
            ------------------------------------------------ */

            if (
                typeof FB.updateProfile ===
                "function"
            ) {

                try {

                    await FB.updateProfile(
                        authCreatedUser,
                        {
                            displayName:
                                fullName
                        }
                    );

                } catch (profileError) {

                    console.warn(
                        "RiderX Auth profile update warning:",
                        profileError
                    );

                }

            }


            /* ------------------------------------------------
               ROLE
            ------------------------------------------------ */

            const isRider =
                selectedRole === "rider";


            /*
             * Riders must remain pending until admin approval.
             * Customers become active immediately.
             */

            const accountStatus =
                isRider
                    ? "pending"
                    : "active";


            const approvalStatus =
                isRider
                    ? "pending"
                    : "approved";


            /* ------------------------------------------------
               PROFILE
            ------------------------------------------------ */

            const profile = {

                uid:
                    uid,

                id:
                    uid,

                role:
                    selectedRole,

                userRole:
                    selectedRole,

                accountType:
                    selectedRole,

                name:
                    fullName,

                fullName:
                    fullName,

                firstName:
                    first,

                lastName:
                    last,

                displayName:
                    fullName,

                email:
                    mail,

                phone:
                    mobile,

                phoneNumber:
                    mobile,

                country:
                    "India",

                countryCode:
                    "IN",

                state:
                    selectedState,

                city:
                    selectedCity,

                language:
                    selectedLanguage,

                status:
                    accountStatus,

                accountStatus:
                    accountStatus,

                approvalStatus:
                    approvalStatus,

                isApproved:
                    !isRider,

                isOnline:
                    false,

                isAvailable:
                    false,

                totalRides:
                    0,

                completedRides:
                    0,

                cancelledRides:
                    0,

                rating:
                    isRider
                        ? 5
                        : 0,

                walletBalance:
                    0,

                referralCode:
                    createReferralCode(
                        first
                    ),

                createdAt:
                    typeof FB.serverTimestamp ===
                    "function"
                        ? FB.serverTimestamp()
                        : new Date().toISOString(),

                updatedAt:
                    typeof FB.serverTimestamp ===
                    "function"
                        ? FB.serverTimestamp()
                        : new Date().toISOString()

            };


            /* ------------------------------------------------
               FIRESTORE
            ------------------------------------------------ */

            await createProfiles(
                FB,
                profile,
                uid
            );


            /* ------------------------------------------------
               LOCAL CACHE
            ------------------------------------------------ */

            saveLocalSession(
                profile
            );


            /* ------------------------------------------------
               SUCCESS
            ------------------------------------------------ */

            if (isRider) {

                showMessage(
                    "Rider account created successfully. Your account is pending admin approval.",
                    "success"
                );

            } else {

                showMessage(
                    "Customer account created successfully. Opening RiderX...",
                    "success"
                );

            }


            /*
             * Do not create or redirect to a fake pending page.
             * rider/home.html must enforce the pending state.
             */

            window.setTimeout(
                function () {

                    if (isRider) {

                        window.location.replace(
                            "../rider/home.html"
                        );

                    } else {

                        window.location.replace(
                            "../customer/home.html"
                        );

                    }

                },
                700
            );


        } catch (error) {

            console.error(
                "RiderX registration error:",
                error
            );


            /*
             * Important:
             *
             * Auth may already exist even when Firestore
             * profile creation fails.
             *
             * Never claim complete registration in that case.
             */

            if (authCreatedUser) {

                showMessage(
                    "Your login account was created, but your RiderX profile could not be completed. Please do not register again with the same email. Try logging in or contact support.",
                    "error"
                );

            } else {

                showMessage(
                    firebaseErrorMessage(error),
                    "error"
                );

            }


        } finally {

            busy = false;

            registerButton.disabled = false;

            customerRole.disabled = false;

            riderRole.disabled = false;

            registerButton.textContent =
                selectedRole === "rider"
                    ? "CREATE RIDER ACCOUNT"
                    : "CREATE CUSTOMER ACCOUNT";

        }

    }
);


/* =========================================================
   PHONE INPUT
========================================================= */

phone.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);

    }
);


/* =========================================================
   EMAIL INPUT
========================================================= */

email.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\s/g, "")
                .slice(0, 100);

    }
);


email.addEventListener(
    "blur",
    function () {

        this.value =
            this.value
                .trim()
                .toLowerCase();

    }
);


/* =========================================================

========================================================= */

firstName.addEventListener(
    "blur",
    function () {

        this.value =
            cleanText(
                this.value
            );

    }
);


lastName.addEventListener(
    "blur",
    function () {

        this.value =
            cleanText(
                this.value
            );

    }
);


/* =========================================================
   CITY INPUT
========================================================= */

city.addEventListener(
    "blur",
    function () {

        this.value =
            cleanText(
                this.value
            );

    }
);


/* =========================================================
   LOGIN
========================================================= */

loginButton.addEventListener(
    "click",
    function () {

        if (busy) {
            return;
        }


        setStorage(
            "riderx_selected_role",
            selectedRole
        );


        window.location.href =
            "./login.html";

    }
);


/* =========================================================
   LEGAL LINKS
========================================================= */

termsLink.addEventListener(
    "click",
    function (event) {

        event.preventDefault();

        showMessage(
            "RiderX Terms and Conditions will be available in the final legal section.",
            "info"
        );

    }
);


privacyLink.addEventListener(
    "click",
    function (event) {

        event.preventDefault();

        showMessage(
            "RiderX Privacy Policy will be available in the final legal section.",
            "info"
        );

    }
);


/* =========================================================
   INITIAL ROLE
========================================================= */

const savedRole =
    getStorage(
        "riderx_selected_role"
    );


if (
    savedRole === "customer" ||
    savedRole === "rider"
) {

    selectedRole =
        normalizeRole(
            savedRole
        );

}


updateRoleUI();


/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
    "pageshow",
    function () {

        busy = false;

        customerRole.disabled = false;

        riderRole.disabled = false;

        registerButton.disabled = false;

        updateRoleUI();

    }
);

</script>
