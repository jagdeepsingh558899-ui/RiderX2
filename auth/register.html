<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Registration</title>

<meta name="theme-color" content="#000000">

<style>

:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111111;
    --border:#292929;
    --gray:#999999;
    --red:#ff5555;
    --green:#22d66b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.box{
    width:100%;
    max-width:440px;
    background:#111;
    border:1px solid #292929;
    border-radius:24px;
    padding:28px 22px;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    color:var(--yellow);
}

.role{
    text-align:center;
    color:var(--yellow);
    font-size:15px;
    font-weight:bold;
    margin:9px 0 25px;
}

.input{
    width:100%;
    padding:15px;
    margin:7px 0;
    background:#050505;
    color:#fff;
    border:1px solid #383838;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:var(--yellow);
}

select.input option{
    background:#111;
    color:#fff;
}

.section{
    margin-top:18px;
    margin-bottom:8px;
    color:#ddd;
    font-size:14px;
    font-weight:bold;
}

.btn{
    width:100%;
    padding:16px;
    margin-top:18px;
    border:0;
    border-radius:12px;
    background:var(--yellow);
    color:#000;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.loading{
    display:none;
    text-align:center;
    color:var(--yellow);
    font-size:13px;
    margin-top:14px;
}

.message{
    min-height:24px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
    margin-top:14px;
    word-break:break-word;
}

.success{
    color:var(--green);
}

.error{
    color:#ff7777;
}

.info{
    color:#aaa;
}

.back{
    text-align:center;
    color:#888;
    margin-top:20px;
    font-size:14px;
    cursor:pointer;
}

.back:hover{
    color:#fff;
}

.note{
    text-align:center;
    color:#666;
    font-size:11px;
    line-height:1.5;
    margin-top:18px;
}

#riderBox{
    display:none;
}

.debug{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#080808;
    border:1px solid #333;
    border-radius:10px;
    color:#888;
    font-size:11px;
    line-height:1.5;
    word-break:break-word;
}

@media(max-width:480px){

    body{
        padding:10px;
    }

    .box{
        padding:24px 17px;
        border-radius:20px;
    }

    .logo{
        font-size:34px;
    }
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        RID<span>ERX</span>
    </div>

    <div id="roleText" class="role">
        Customer Registration
    </div>


    <!-- =====================================================
         BASIC DETAILS
    ====================================================== -->

    <input
        id="fullName"
        class="input"
        type="text"
        placeholder="Full Name"
        autocomplete="name"
    >

    <input
        id="phone"
        class="input"
        type="tel"
        placeholder="Phone Number"
        inputmode="numeric"
        autocomplete="tel"
    >

    <input
        id="email"
        class="input"
        type="email"
        placeholder="Email Address"
        autocomplete="email"
    >

    <input
        id="password"
        class="input"
        type="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="new-password"
    >


    <!-- =====================================================
         RIDER DETAILS
    ====================================================== -->

    <div id="riderBox">

        <div class="section">
            Rider / Vehicle Details
        </div>

        <select
            id="vehicleType"
            class="input"
        >
            <option value="">
                Select Vehicle Type
            </option>

            <option value="bike">
                Bike
            </option>

            <option value="cab">
                Cab
            </option>
        </select>

        <input
            id="vehicleNumber"
            class="input"
            type="text"
            placeholder="Vehicle Number"
            autocomplete="off"
        >

        <input
            id="licenseNumber"
            class="input"
            type="text"
            placeholder="Driving License Number"
            autocomplete="off"
        >

    </div>


    <!-- =====================================================
         REGISTER BUTTON
    ====================================================== -->

    <button
        id="registerBtn"
        class="btn"
        type="button"
    >
        Create Account
    </button>


    <div
        id="loading"
        class="loading"
    >
        Creating account...
    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="debug"
        class="debug"
    ></div>


    <div
        id="backBtn"
        class="back"
    >
        ← Back to Login
    </div>


    <div class="note">
        Rider registrations are reviewed by RiderX Admin before activation.
    </div>

</div>


<script type="module">

/* ============================================================
   FIREBASE
============================================================ */

import {
    auth,
    db
} from "../firebase/firebase-config.js";

import {
    createUserWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* ============================================================
   ELEMENTS
============================================================ */

const fullNameInput =
    document.getElementById("fullName");

const phoneInput =
    document.getElementById("phone");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const vehicleTypeInput =
    document.getElementById("vehicleType");

const vehicleNumberInput =
    document.getElementById("vehicleNumber");

const licenseNumberInput =
    document.getElementById("licenseNumber");

const riderBox =
    document.getElementById("riderBox");

const roleText =
    document.getElementById("roleText");

const registerBtn =
    document.getElementById("registerBtn");

const loading =
    document.getElementById("loading");

const message =
    document.getElementById("message");

const debug =
    document.getElementById("debug");

const backBtn =
    document.getElementById("backBtn");


/* ============================================================
   ROLE
============================================================ */

const params =
    new URLSearchParams(
        window.location.search
    );

let role =
    String(
        params.get("role") || "customer"
    )
    .trim()
    .toLowerCase();


if(
    role !== "customer" &&
    role !== "rider"
){

    role = "customer";

}


if(role === "rider"){

    roleText.textContent =
        "Rider Registration";

    riderBox.style.display =
        "block";

}else{

    roleText.textContent =
        "Customer Registration";

    riderBox.style.display =
        "none";

}


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
    text,
    type = ""
){

    message.textContent =
        text || "";

    message.className =
        "message " + type;

}


/* ============================================================
   DEBUG
============================================================ */

function showDebug(text){

    debug.style.display =
        "block";

    debug.textContent =
        text;

}

function hideDebug(){

    debug.style.display =
        "none";

    debug.textContent =
        "";

}


/* ============================================================
   LOADING
============================================================ */

function setLoading(
    active,
    text = "Creating account..."
){

    registerBtn.disabled =
        active;

    fullNameInput.disabled =
        active;

    phoneInput.disabled =
        active;

    emailInput.disabled =
        active;

    passwordInput.disabled =
        active;

    if(role === "rider"){

        vehicleTypeInput.disabled =
            active;

        vehicleNumberInput.disabled =
            active;

        licenseNumberInput.disabled =
            active;

    }

    if(active){

        loading.style.display =
            "block";

        loading.textContent =
            text;

    }else{

        loading.style.display =
            "none";

    }

}


/* ============================================================
   VALIDATION
============================================================ */

function validate(){

    const fullName =
        fullNameInput.value.trim();

    const phone =
        phoneInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!fullName){

        showMessage(
            "❌ Please enter your full name.",
            "error"
        );

        fullNameInput.focus();

        return false;

    }


    if(fullName.length < 2){

        showMessage(
            "❌ Please enter a valid name.",
            "error"
        );

        fullNameInput.focus();

        return false;

    }


    if(!phone){

        showMessage(
            "❌ Please enter your phone number.",
            "error"
        );

        phoneInput.focus();

        return false;

    }


    const cleanPhone =
        phone.replace(
            /\D/g,
            ""
        );


    if(cleanPhone.length < 10){

        showMessage(
            "❌ Please enter a valid 10-digit phone number.",
            "error"
        );

        phoneInput.focus();

        return false;

    }


    if(!email){

        showMessage(
            "❌ Please enter your email address.",
            "error"
        );

        emailInput.focus();

        return false;

    }


    if(!email.includes("@")){

        showMessage(
            "❌ Please enter a valid email address.",
            "error"
        );

        emailInput.focus();

        return false;

    }


    if(password.length < 6){

        showMessage(
            "❌ Password must be at least 6 characters.",
            "error"
        );

        passwordInput.focus();

        return false;

    }


    /* ========================================================
       RIDER VALIDATION
    ====================================================== */

    if(role === "rider"){

        if(!vehicleTypeInput.value){

            showMessage(
                "❌ Please select vehicle type.",
                "error"
            );

            vehicleTypeInput.focus();

            return false;

        }


        if(
            !vehicleNumberInput.value.trim()
        ){

            showMessage(
                "❌ Please enter vehicle number.",
                "error"
            );

            vehicleNumberInput.focus();

            return false;

        }


        if(
            !licenseNumberInput.value.trim()
        ){

            showMessage(
                "❌ Please enter driving license number.",
                "error"
            );

            licenseNumberInput.focus();

            return false;

        }

    }


    return true;

}


/* ============================================================
   FIREBASE ERROR
============================================================ */

function firebaseErrorMessage(error){

    console.error(
        "RiderX Firebase Error:",
        error
    );


    if(!error){

        return "Unknown Firebase error.";

    }


    switch(error.code){

        case "auth/email-already-in-use":

            return "This email is already registered.";

        case "auth/invalid-email":

            return "Invalid email address.";

        case "auth/weak-password":

            return "Password is too weak. Use at least 6 characters.";

        case "auth/network-request-failed":

            return "Network error. Check your internet connection.";

        case "auth/operation-not-allowed":

            return "Email/Password login is disabled in Firebase Authentication.";

        case "auth/admin-restricted-operation":

            return "Firebase Authentication operation is restricted.";

        case "auth/too-many-requests":

            return "Too many attempts. Please try again later.";

        case "permission-denied":

            return "Firestore permission denied.";

        case "failed-precondition":

            return "Firebase operation failed because a required condition is missing.";

        case "unavailable":

            return "Firebase service is temporarily unavailable.";

        case "unauthenticated":

            return "Firebase authentication session is not available.";

        default:

            if(
                error.message &&
                error.message.includes(
                    "Missing or insufficient permissions"
                )
            ){

                return "Firestore permission denied. Check Firestore Rules.";

            }


            return (
                error.message ||
                "Unknown Firebase error."
            );

    }

}


/* ============================================================
   REGISTER
============================================================ */

async function registerAccount(){

    if(registerBtn.disabled){

        return;

    }


    hideDebug();

    showMessage("");

    
    if(!validate()){

        return;

    }


    const fullName =
        fullNameInput.value.trim();

    const phone =
        phoneInput.value.trim();

    const email =
        emailInput.value.trim().toLowerCase();

    const password =
        passwordInput.value;


    let firebaseUser =
        null;


    try{

        /* ====================================================
           STEP 1
           CREATE FIREBASE AUTH ACCOUNT
        ==================================================== */

        setLoading(
            true,
            "1/3 Creating Firebase account..."
        );


        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        firebaseUser =
            result.user;


        if(!firebaseUser){

            throw new Error(
                "Firebase account was not created."
            );

        }


        const uid =
            firebaseUser.uid;


        console.log(
            "RiderX Auth account created:",
            uid
        );


        /* ====================================================
           STEP 2
           CREATE USER DOCUMENT
        ==================================================== */

        setLoading(
            true,
            "2/3 Saving RiderX user profile..."
        );


        const commonData = {

            uid: uid,

            name: fullName,

            fullName: fullName,

            phone: phone,

            email: email,

            role: role,

            userType: role,

            createdAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp(),

            online: false,

            isOnline: false

        };


        if(role === "customer"){

            const customerData = {

                ...commonData,

                role: "customer",

                userType: "customer",

                status: "active",

                accountStatus: "active",

                approved: true,

                isApproved: true

            };


            /*
             * Main users document
             */

            await setDoc(
                doc(
                    db,
                    "users",
                    uid
                ),
                customerData
            );


            console.log(
                "RiderX users/customer created:",
                uid
            );


            /*
             * Customer document
             */

            await setDoc(
                doc(
                    db,
                    "customers",
                    uid
                ),
                customerData
            );


            console.log(
                "RiderX customers document created:",
                uid
            );


            /* =================================================
               SUCCESS CUSTOMER
            ================================================= */

            showMessage(
                "✅ Customer account created successfully!",
                "success"
            );


            setLoading(
                true,
                "Opening Customer Home..."
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "../customer/home.html"
                    );

                },
                800
            );


            return;

        }


        /* ====================================================
           RIDER
        ==================================================== */

        const riderData = {

            ...commonData,

            role: "rider",

            userType: "rider",

            status: "pending",

            accountStatus: "pending",

            approvalStatus: "pending",

            riderStatus: "pending",

            verificationStatus: "pending",

            approved: false,

            isApproved: false,

            applicationSubmitted: true,

            registrationCompleted: true,

            documentsSubmitted: false,

            vehicleType:
                vehicleTypeInput.value,

            vehicleNumber:
                vehicleNumberInput.value
                    .trim()
                    .toUpperCase(),

            licenseNumber:
                licenseNumberInput.value
                    .trim()
                    .toUpperCase()

        };


        /*
         * Main users document
         */

        await setDoc(
            doc(
                db,
                "users",
                uid
            ),
            riderData
        );


        console.log(
            "RiderX users/rider created:",
            uid
        );


        /*
         * Rider document
         */

        await setDoc(
            doc(
                db,
                "riders",
                uid
            ),
            riderData
        );


        console.log(
            "RiderX riders document created:",
            uid
        );


        /* ====================================================
