<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Register</title>


<link rel="stylesheet" href="../css/style.css">



<style>


body{

background:#000;

color:white;

font-family:Arial,sans-serif;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

}



.register-box{


width:90%;

max-width:420px;

background:#111;

padding:30px;

border-radius:25px;

box-shadow:0 0 25px #FFD600;

text-align:center;


}



.logo{

width:90px;

}



h1{

color:#FFD600;

}



input{


width:100%;

padding:15px;

margin:8px 0;

background:#222;

border:none;

border-radius:12px;

color:white;

font-size:16px;

box-sizing:border-box;


}



button{


width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:12px;

background:#FFD600;

font-weight:bold;

font-size:16px;


}



.role-box{


display:flex;

gap:10px;

margin:15px 0;


}



.role{


flex:1;

padding:15px;

background:#222;

border-radius:12px;

cursor:pointer;

}



.role.active{


background:#FFD600;

color:#000;

}



.link{


color:#FFD600;

display:block;

margin-top:20px;

text-decoration:none;

}



</style>


</head>



<body>



<div class="register-box">


<img src="../assets/logo.svg" class="logo">


<h1>
RiderX
</h1>


<h3>
Create Account
</h3>



<div class="role-box">


<div class="role active" id="customerRole">

Customer

</div>



<div class="role" id="riderRole">

Rider

</div>



</div>




<input

type="text"

id="name"

placeholder="Full Name">



<input

type="tel"

id="phone"

placeholder="Mobile Number">



<input

type="email"

id="email"

placeholder="Email Address">



<input

type="password"

id="password"

placeholder="Password">



<button id="registerBtn">

Create Account

</button>




<a class="link" href="login.html">

Already have account? Login

</a>



</div>







<script type="module" src="../js/register.js"></script>



</body>


</html>
