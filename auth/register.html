<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Registration</title>

<meta name="theme-color" content="#050505">

<style>

:root{
    --yellow:#FFE500;
    --black:#050505;
    --card:#111;
    --border:#292929;
    --gray:#999;
    --red:#ff5555;
    --green:#20d66b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.box{
    width:100%;
    max-width:440px;
    background:#111;
    border:1px solid #292929;
    border-radius:24px;
    padding:28px 24px;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
}

.logo span{
    color:var(--yellow);
}

.role{
    text-align:center;
    color:var(--yellow);
    font-size:15px;
    font-weight:bold;
    margin:10px 0 25px;
}

.input{
    width:100%;
    padding:14px;
    margin:7px 0;
    background:#050505;
    color:#fff;
    border:1px solid #383838;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:var(--yellow);
}

.section{
    margin-top:18px;
    margin-bottom:8px;
    color:#ddd;
    font-size:14px;
    font-weight:bold;
}

.btn{
    width:100%;
    padding:16px;
    margin-top:18px;
    border:0;
    border-radius:12px;
    background:var(--yellow);
    color:#000;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.loading{
    display:none;
    text-align:center;
    color:var(--yellow);
    font-size:13px;
    margin-top:14px;
}

.message{
    min-height:24px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
    margin-top:14px;
    word-break:break-word;
}

.success{
    color:var(--green);
}

.error{
    color:#ff7777;
}

.back{
    text-align:center;
    color:#888;
    margin-top:20px;
    font-size:14px;
    cursor:pointer;
}

.note{
    text-align:center;
    color:#666;
    font-size:11px;
    line-height:1.5;
    margin-top:18px;
}

#riderBox{
    display:none;
}

.statusBox{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    background:#080808;
    border:1px solid #292929;
    color:#aaa;
    font-size:12px;
    line-height:1.6;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        RID<span>ERX</span>
    </div>

    <div id="roleText" class="role">
        Customer Registration
    </div>


    <!-- BASIC DETAILS -->

    <input
        id="fullName"
        class="input"
        type="text"
        placeholder="Full Name"
        autocomplete="name"
    >

    <input
        id="phone"
        class="input"
        type="tel"
        placeholder="Phone Number"
        inputmode="numeric"
        autocomplete="tel"
    >

    <input
        id="email"
        class="input"
        type="email"
        placeholder="Email Address"
        autocomplete="email"
    >

    <input
        id="password"
        class="input"
        type="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="new-password"
    >


    <!-- RIDER DETAILS -->

    <div id="riderBox">

        <div class="section">
            Rider / Vehicle Details
        </div>

        <select
            id="vehicleType"
            class="input"
        >

            <option value="">
                Select Vehicle Type
            </option>

            <option value="bike">
                Bike
            </option>

            <option value="cab">
                Cab
            </option>

        </select>


        <input
            id="vehicleNumber"
            class="input"
            type="text"
            placeholder="Vehicle Number"
            autocomplete="off"
        >


        <input
            id="licenseNumber"
            class="input"
            type="text"
            placeholder="Driving License Number"
            autocomplete="off"
        >

    </div>


    <button
        id="registerBtn"
        class="btn"
        type="button"
    >
        Create Account
    </button>


    <div
        id="loading"
        class="loading"
    >
        Creating account...
    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div
        id="statusBox"
        class="statusBox"
    ></div>


    <div
        id="backBtn"
        class="back"
    >
        ← Back
    </div>


    <div class="note">

        Rider registrations are reviewed by RiderX Admin
        before activation.

    </div>

</div>


<script type="module">

/*
==============================================================
RIDERX REGISTRATION
==============================================================

NO FIREBASE STORAGE USED.

Customer:
Firebase Auth
    ↓
users/{uid}
    ↓
customers/{uid}

Rider:
Firebase Auth
    ↓
users/{uid}
    ↓
riders/{uid}

==============================================================
*/


import {

    auth,
    db,

    createUserWithEmailAndPassword,

    doc,
    setDoc,

    serverTimestamp

} from "../firebase/firebase-config.js";


/* ============================================================
   ELEMENTS
============================================================ */

const fullNameInput =
    document.getElementById("fullName");

const phoneInput =
    document.getElementById("phone");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const vehicleTypeInput =
    document.getElementById("vehicleType");

const vehicleNumberInput =
    document.getElementById("vehicleNumber");

const licenseNumberInput =
    document.getElementById("licenseNumber");

const riderBox =
    document.getElementById("riderBox");

const roleText =
    document.getElementById("roleText");

const registerBtn =
    document.getElementById("registerBtn");

const loading =
    document.getElementById("loading");

const message =
    document.getElementById("message");

const statusBox =
    document.getElementById("statusBox");

const backBtn =
    document.getElementById("backBtn");


/* ============================================================
   GET ROLE
============================================================ */

const params =
    new URLSearchParams(
        window.location.search
    );

let role =
    String(
        params.get("role") || "customer"
    )
    .trim()
    .toLowerCase();


if(
    role !== "customer" &&
    role !== "rider"
){

    role = "customer";

}


/* ============================================================
   SHOW ROLE
============================================================ */

if(role === "rider"){

    roleText.textContent =
        "Rider Registration";

    riderBox.style.display =
        "block";

}else{

    roleText.textContent =
        "Customer Registration";

    riderBox.style.display =
        "none";

}


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
    text,
    type = ""
){

    message.textContent =
        text || "";

    message.className =
        "message " + type;

}


/* ============================================================
   STATUS
============================================================ */

function showStatus(text){

    if(!text){

        statusBox.style.display =
            "none";

        statusBox.textContent =
            "";

        return;

    }

    statusBox.style.display =
        "block";

    statusBox.textContent =
        text;

}


/* ============================================================
   LOADING
============================================================ */

function setLoading(
    active,
    text = "Creating account..."
){

    registerBtn.disabled =
        active;

    loading.style.display =
        active
            ? "block"
            : "none";

    loading.textContent =
        text;

}


/* ============================================================
   VALIDATION
============================================================ */

function validate(){

    const name =
        fullNameInput.value.trim();

    const phone =
        phoneInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!name){

        showMessage(
            "❌ Please enter your full name.",
            "error"
        );

        fullNameInput.focus();

        return false;

    }


    const phoneDigits =
        phone.replace(
            /\D/g,
            ""
        );


    if(
        phoneDigits.length !== 10
    ){

        showMessage(
            "❌ Please enter a valid 10 digit phone number.",
            "error"
        );

        phoneInput.focus();

        return false;

    }


    if(!email){

        showMessage(
            "❌ Please enter your email address.",
            "error"
        );

        emailInput.focus();

        return false;

    }


    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if(
        !emailPattern.test(email)
    ){

        showMessage(
            "❌ Please enter a valid email address.",
            "error"
        );

        emailInput.focus();

        return false;

    }


    if(
        password.length < 6
    ){

        showMessage(
            "❌ Password must be at least 6 characters.",
            "error"
        );

        passwordInput.focus();

        return false;

    }


    /*
    ------------------------------------------------------------
    RIDER VALIDATION
    ------------------------------------------------------------
    */

    if(role === "rider"){

        if(
            !vehicleTypeInput.value
        ){

            showMessage(
                "❌ Please select vehicle type.",
                "error"
            );

            vehicleTypeInput.focus();

            return false;

        }


        if(
            !vehicleNumberInput.value.trim()
        ){

            showMessage(
                "❌ Please enter vehicle number.",
                "error"
            );

            vehicleNumberInput.focus();

            return false;

        }


        if(
            !licenseNumberInput.value.trim()
        ){

            showMessage(
                "❌ Please enter driving license number.",
                "error"
            );

            licenseNumberInput.focus();

            return false;

        }

    }


    return true;

}


/* ============================================================
   FIREBASE ERROR
============================================================ */

function getFirebaseError(error){

    console.error(
        "RIDERX FIREBASE ERROR:",
        error
    );


    if(!error){

        return "Unknown registration error.";

    }


    switch(error.code){

        case "auth/email-already-in-use":

            return "This email is already registered. Please login instead.";

        case "auth/invalid-email":

            return "Invalid email address.";

        case "auth/missing-password":

            return "Please enter a password.";

        case "auth/weak-password":

            return "Password must contain at least 6 characters.";

        case "auth/network-request-failed":

            return "Network error. Please check your internet connection.";

        case "auth/operation-not-allowed":

            return "Email/password authentication is disabled in Firebase.";

        case "auth/user-disabled":

            return "This account has been disabled.";

        case "auth/too-many-requests":

            return "Too many attempts. Please try again later.";

        case "permission-denied":

            return "Firestore permission denied. Please check Firestore Rules.";

        case "failed-precondition":

            return "Firebase configuration or Firestore setup problem.";

        case "unavailable":

            return "Firebase is temporarily unavailable. Try again.";

        default:

            if(
                error.message &&
                error.message.includes(
                    "Missing or insufficient permissions"
                )
            ){

                return "Firestore permission denied. Check Firestore Rules.";

            }


            return (
                error.message ||
                "Registration failed."
            );

    }

}


/* ============================================================
   CUSTOMER REGISTRATION
============================================================ */

async function createCustomerProfile(
    firebaseUser
){

    const uid =
        firebaseUser.uid;


    const name =
        fullNameInput.value.trim();

    const phone =
        phoneInput.value.trim();

    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    const customerData = {

        uid: uid,

        name: name,

        fullName: name,

        phone: phone,

        email: email,

        role: "customer",

        userType: "customer",

        status: "active",

        accountStatus: "active",

        approved: true,

        isApproved: true,

        online: false,

        isOnline: false,

        createdAt:
            serverTimestamp(),

        updatedAt:
            serverTimestamp()

    };


    /*
    ------------------------------------------------------------
    USERS
    ------------------------------------------------------------
    */

    setLoading(
        true,
        "Creating customer profile..."
    );


    await setDoc(
        doc(
            db,
            "users",
            uid
        ),
        customerData
    );


    /*
    ------------------------------------------------------------
    CUSTOMERS
    ------------------------------------------------------------
    */

    setLoading(
        true,
        "Saving customer account..."
    );


    await setDoc(
        doc(
            db,
            "customers",
            uid
        ),
        customerData
    );

}


/* ============================================================
   RIDER REGISTRATION
============================================================ */

async function createRiderProfile(
    firebaseUser
){

    const uid =
        firebaseUser.uid;


    const name =
        fullNameInput.value.trim();

    const phone =
        phoneInput.value.trim();

    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    const vehicleType =
        vehicleTypeInput.value;

    const vehicleNumber =
        vehicleNumberInput.value
            .trim()
            .toUpperCase();

    const licenseNumber =
        licenseNumberInput.value
            .trim()
            .toUpperCase();


    const riderData = {

        uid: uid,

        name: name,

        fullName: name,

        phone: phone,

        email: email,

        role: "rider",

        userType: "rider",

        status: "pending",

        approvalStatus: "pending",

        riderStatus: "pending",

        verificationStatus: "pending",

        accountStatus: "pending",

        approved: false,

        isApproved: false,

        online: false,

        isOnline: false,

        vehicleType:
            vehicleType,

        vehicleNumber:
            vehicleNumber,

        licenseNumber:
            licenseNumber,

        applicationSubmitted:
            true,

        registrationCompleted:
            true,

        documentsSubmitted:
            false,

        documentsUploaded:
            false,

        createdAt:
            serverTimestamp(),

        updatedAt:
            serverTimestamp()

    };


    /*
    ------------------------------------------------------------
    USERS
    ------------------------------------------------------------
    */

    setLoading(
        true,
        "Creating rider profile..."
    );


    await setDoc(
        doc(
            db,
            "users",
            uid
        ),
        riderData
    );


    /*
    ------------------------------------------------------------
    RIDERS
    ------------------------------------------------------------
    */

    setLoading(
        true,
        "Saving rider application..."
    );


    await setDoc(
        doc(
            db,
            "riders",
            uid
        ),
        riderData
    );

}


/* ============================================================
   MAIN REGISTRATION
============================================================ */

async function registerAccount(){

    if(registerBtn.disabled){

        return;

    }


    showMessage("");

    showStatus("");


    if(!validate()){

        return;

    }


    const email =
        emailInput.value
            .trim()
            .toLowerCase();

    const password =
        passwordInput.value;


    try{

        /*
        ========================================================
        STEP 1
        FIREBASE AUTH
        ========================================================
        */

        setLoading(
            true,
            "Creating Firebase account..."
        );


        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const firebaseUser =
            result.user;


        if(!firebaseUser){

            throw new Error(
                "Firebase account was not returned."
            );

        }


        console.log(
            "RiderX Auth account created:",
            firebaseUser.uid
        );


        /*
        ========================================================
        STEP 2
        CUSTOMER
        ========================================================
        */

        if(role === "customer"){

            await createCustomerProfile(
                firebaseUser
            );


            showMessage(
                "✅ Account created successfully!",
                "success"
            );


            showStatus(
                "Your RiderX customer account is ready. Opening Customer Home..."
            );


            setLoading(
                true,
                "Opening RiderX..."
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "../customer/home.html"
                    );

                },
                1000
            );


            return;

        }


        /*
        ========================================================
        STEP 3
        RIDER
        ========================================================
        */

        await createRiderProfile(
            firebaseUser
        );


        showMessage(
            "✅ Rider registration submitted successfully!",
            "success"
        );


        showStatus(
            "Your rider application is pending Admin approval. Documents can be added later when Firebase Storage is enabled."
        );


        setLoading(
            true,
            "Opening Rider..."
        );


        setTimeout(
            function(){

                /*
                ------------------------------------------------
                TRY PENDING PAGE
                ------------------------------------------------
                */

                window.location.replace(
                    "../rider/pending.html"
                );

            },
            1200
        );

    }
    catch(error){

        console.error(
            "RIDERX REGISTRATION ERROR:",
            error
        );


        setLoading(
            false
        );


        showMessage(
            "❌ " +
            getFirebaseError(error),
            "error"
        );


        /*
        --------------------------------------------------------
        TECHNICAL INFORMATION
        --------------------------------------------------------
        */

        if(error.code){

            showStatus(
                "Firebase error code: " +
                error.code +
                "\n\n" +
                (
                    error.message ||
                    "No additional Firebase message."
                )
            );

        }else{

            showStatus(
                error.message ||
                "Unknown error."
            );

        }

    }

}


/* ============================================================
   REGISTER BUTTON
============================================================ */

registerBtn.addEventListener(
    "click",
    registerAccount
);


/* ============================================================
   ENTER KEY
============================================================ */

const enterInputs = [

    fullNameInput,
    phoneInput,
    emailInput,
    passwordInput,
    vehicleNumberInput,
    licenseNumberInput

];


enterInputs.forEach(
    function(input){

        if(!input){

            return;

        }


        input.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key ===
                    "Enter"
                ){

                    event.preventDefault();

                    registerAccount();

                }

            }
        );

    }
);


/* ============================================================
   BACK
============================================================ */

backBtn.addEventListener(
    "click",
    function(){

        if(
            window.history.length > 1
        ){

            window.history.back();

        }else{

            window.location.replace(
                "../index.html"
            );

        }

    }
);


/* ============================================================
   PAGE READY
============================================================ */

console.log(
    "================================"
);

console.log(
    "RiderX Registration Loaded"
);

console.log(
    "Role:",
    role
);

console.log(
    "Firebase Auth:",
    !!auth
);

console.log(
    "Firestore:",
    !!db
);

console.log(
    "Storage:",
    "NOT REQUIRED"
);

console.log(
    "================================"
);

</script>

</body>
</html>
