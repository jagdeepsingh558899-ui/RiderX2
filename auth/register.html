<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Register</title>

<link rel="stylesheet" href="../css/style.css">


<style>

body{

margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;

}


.box{

width:90%;
max-width:400px;
margin:40px auto;
background:#1d1d1d;
padding:25px;
border-radius:15px;

}


h1{

text-align:center;
color:#ffcc00;

}


input,select{

width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;

}


button{

width:100%;
padding:14px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}


a{

display:block;
text-align:center;
margin-top:15px;
color:#ffcc00;

}

</style>

</head>


<body>


<div class="box">


<h1>
🏍 RiderX
</h1>


<h2>
Create Account
</h2>



<input id="name" placeholder="Full Name">


<input id="email" placeholder="Email">


<input id="password" type="password" placeholder="Password">


<select id="role">

<option value="customer">
Customer
</option>


<option value="rider">
Rider
</option>

</select>




<button onclick="register()">

Register

</button>



<p id="msg"></p>



<a href="login.html">

Already Account? Login

</a>


</div>






<script type="module">


import { auth, db } from "../firebase/config.js";


import {

createUserWithEmailAndPassword

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {

doc,
setDoc

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





window.register = async function(){


let name =
document.getElementById("name").value;


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;


let role =
document.getElementById("role").value;




try{


let user = await createUserWithEmailAndPassword(

auth,

email,

password

);




await setDoc(

doc(db,"users",user.user.uid),

{

name:name,

email:email,

role:role,

status:"Active",

createdAt:new Date()

}

);




document.getElementById("msg").innerHTML=
"Account Created ✅";




setTimeout(()=>{


if(role=="rider"){


location.href="../rider/dashboard.html";


}

else{


location.href="../customer/dashboard.html";


}


},1000);



}

catch(error){


document.getElementById("msg").innerHTML=
error.message;


}



}


</script>


</body>

</html>
