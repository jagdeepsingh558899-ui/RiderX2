<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#000;
color:white;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}



.box{

width:90%;
max-width:400px;

background:#111;

padding:25px;

border-radius:20px;

border:2px solid #FFD600;

}



h1{

text-align:center;
margin-bottom:20px;

}


span{

color:#FFD600;

}



input,
select{

width:100%;

padding:15px;

margin-top:15px;

border-radius:12px;

border:none;

font-size:16px;

}



button{

width:100%;

padding:15px;

margin-top:20px;

background:#FFD600;

border:none;

border-radius:12px;

font-weight:bold;

font-size:17px;

}



a{

display:block;

text-align:center;

color:#FFD600;

margin-top:20px;

}



</style>


</head>


<body>



<div class="box">


<h1>

RIDER<span>X</span>

</h1>



<input id="name" placeholder="Full Name">



<input id="email" type="email" placeholder="Email">



<input id="password" type="password" placeholder="Password">



<select id="role">


<option value="customer">

Customer

</option>


<option value="rider">

Rider

</option>


</select>



<button id="registerBtn">

Create Account

</button>



<a href="login.html">

Already have account? Login

</a>



</div>




<script type="module" src="../js/register.js"></script>



</body>

</html>
