<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#FFD400"
    >

    <meta
        name="description"
        content="RiderX - Create Customer or Rider Account"
    >

    <title>RiderX - Create Account</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #070707;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .auth-page {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(14px, env(safe-area-inset-top))
                max(14px, env(safe-area-inset-right))
                max(14px, env(safe-area-inset-bottom))
                max(14px, env(safe-area-inset-left));

            position: relative;
            overflow: auto;
        }

        .auth-page::before {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            top: -180px;
            right: -140px;

            border-radius: 50%;

            background: rgba(255, 212, 0, .08);

            pointer-events: none;
        }

        .auth-page::after {
            content: "";

            position: absolute;

            width: 310px;
            height: 310px;

            bottom: -180px;
            left: -140px;

            border-radius: 50%;

            background: rgba(255, 212, 0, .05);

            pointer-events: none;
        }

        .auth-card {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 440px;

            margin: 15px 0;

            padding: 27px 22px 22px;

            border: 1px solid #2a2a2a;
            border-radius: 22px;

            background: #111;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, .55);
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo-box {
            width: 67px;
            height: 67px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 19px;

            background: #FFD400;
            color: #080808;

            font-size: 25px;
            font-weight: 1000;

            box-shadow:
                0 8px 30px rgba(255, 212, 0, .14);
        }

        .brand h1 {
            margin: 0;

            font-size: 25px;
            font-weight: 1000;
        }

        .brand h1 span {
            color: #FFD400;
        }

        .brand p {
            margin: 7px 0 0;

            color: #777;

            font-size: 10px;
        }

        .welcome {
            margin-bottom: 18px;
        }

        .welcome h2 {
            margin: 0;

            font-size: 18px;
            font-weight: 900;
        }

        .welcome p {
            margin: 6px 0 0;

            color: #777;

            font-size: 10px;
            line-height: 1.5;
        }

        .message {
            display: none;

            margin-bottom: 13px;

            padding: 10px;

            border-radius: 9px;

            font-size: 10px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .error {
            border: 1px solid #542828;
            background: #241414;
            color: #ff7777;
        }

        .success {
            border: 1px solid #275335;
            background: #132319;
            color: #65e58b;
        }

        .role-title {
            display: block;

            margin-bottom: 8px;

            color: #999;

            font-size: 9px;
            font-weight: 900;

            text-transform: uppercase;
        }

        .role-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

            margin-bottom: 15px;
        }

        .role-option {
            position: relative;
        }

        .role-option input {
            position: absolute;

            opacity: 0;

            pointer-events: none;
        }

        .role-label {
            min-height: 75px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 4px;

            border: 1px solid #303030;
            border-radius: 11px;

            background: #191919;

            cursor: pointer;

            text-align: center;

            transition: .2s ease;
        }

        .role-label:hover {
            border-color: #555;
        }

        .role-option input:checked + .role-label {
            border-color: #FFD400;

            background: #211f12;

            box-shadow:
                0 0 0 1px rgba(255, 212, 0, .08);
        }

        .role-icon {
            font-size: 21px;
        }

        .role-name {
            color: #ddd;

            font-size: 10px;
            font-weight: 900;
        }

        .role-option input:checked + .role-label .role-name {
            color: #FFD400;
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #999;

            font-size: 9px;
            font-weight: 900;

            text-transform: uppercase;
        }

        .input-wrap {
            position: relative;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 47px;

            padding: 0 13px;

            border: 1px solid #333;
            border-radius: 10px;

            outline: none;

            background: #1a1a1a;
            color: #fff;

            font-size: 12px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #FFD400;

            box-shadow:
                0 0 0 2px rgba(255, 212, 0, .08);
        }

        .phone-row {
            display: flex;
            gap: 8px;
        }

        .country-code {
            width: 82px;
            min-width: 82px;
            height: 47px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #333;
            border-radius: 10px;

            background: #1a1a1a;

            color: #FFD400;

            font-size: 11px;
            font-weight: 900;
        }

        .phone-row input {
            flex: 1;
            min-width: 0;
        }

        .password-row {
            position: relative;
        }

        .password-row input {
            padding-right: 45px;
        }

        .eye-btn {
            position: absolute;

            right: 7px;
            top: 50%;

            width: 34px;
            height: 34px;

            transform: translateY(-50%);

            border: 0;
            border-radius: 7px;

            background: transparent;
            color: #777;

            cursor: pointer;
        }

        .eye-btn:hover {
            color: #FFD400;
        }

        .password-hint {
            margin-top: 5px;

            color: #555;

            font-size: 8px;
        }

        .checkbox-row {
            display: flex;

            align-items: flex-start;

            gap: 8px;

            margin: 4px 0 16px;

            color: #777;

            font-size: 9px;
            line-height: 1.5;
        }

        .checkbox-row input {
            width: 14px;
            height: 14px;

            margin: 0;

            flex: none;

            accent-color: #FFD400;
        }

        .checkbox-row a {
            color: #FFD400;

            text-decoration: none;

            font-weight: 800;
        }

        .register-btn {
            width: 100%;
            min-height: 49px;

            border: 0;
            border-radius: 10px;

            background: #FFD400;
            color: #111;

            cursor: pointer;

            font-size: 12px;
            font-weight: 1000;

            transition: .2s ease;
        }

        .register-btn:hover {
            background: #ffe04a;
            transform: translateY(-1px);
        }

        .register-btn:active {
            transform: scale(.99);
        }

        .register-btn:disabled {
            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }

        .loader {
            display: inline-block;

            width: 13px;
            height: 13px;

            margin-right: 7px;

            vertical-align: -2px;

            border: 2px solid rgba(0, 0, 0, .25);
            border-top-color: #111;

            border-radius: 50%;

            animation: spin .7s linear infinite;
        }

        .login-link {
            margin-top: 18px;

            text-align: center;

            color: #777;

            font-size: 10px;
        }

        .login-link a {
            color: #FFD400;

            text-decoration: none;

            font-weight: 900;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-role {
            display: block;

            width: 100%;

            margin-top: 11px;

            border: 0;

            background: transparent;
            color: #666;

            cursor: pointer;

            font-size: 9px;
        }

        .back-role:hover {
            color: #FFD400;
        }

        .footer {
            margin-top: 19px;

            padding-top: 13px;

            border-top: 1px solid #202020;

            text-align: center;

            color: #444;

            font-size: 8px;
        }

        .field-error {
            border-color: #ff5555 !important;

            box-shadow:
                0 0 0 2px rgba(255, 80, 80, .08) !important;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {

            .auth-page {
                align-items: flex-start;

                padding-top: 16px;
                padding-bottom: 16px;
            }

            .auth-card {
                margin: 0;

                padding:
                    24px 17px
                    18px;

                border-radius: 18px;
            }
        }

        @media (max-width: 340px) {

            .auth-card {
                padding-left: 13px;
                padding-right: 13px;
            }

            .country-code {
                width: 70px;
                min-width: 70px;
            }

            .role-label {
                min-height: 68px;
            }
        }
    </style>
</head>


<body>

<main class="auth-page">

    <section class="auth-card">

        <div class="brand">

            <div class="logo-box">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                Your ride. Your journey. Your choice.
            </p>

        </div>


        <div class="welcome">

            <h2>
                Create RiderX Account
            </h2>

            <p>
                Create your customer or rider account and start using RiderX.
            </p>

        </div>


        <div
            class="message error"
            id="errorBox"
            role="alert"
            aria-live="polite"
        ></div>


        <div
            class="message success"
            id="successBox"
            role="status"
            aria-live="polite"
        ></div>


        <form
            id="registerForm"
            novalidate
        >

            <label class="role-title">
                Account Type
            </label>


            <div class="role-grid">

                <div class="role-option">

                    <input
                        type="radio"
                        name="role"
                        id="customerRole"
                        value="customer"
                    >

                    <label
                        class="role-label"
                        for="customerRole"
                    >

                        <span class="role-icon">
                            👤
                        </span>

                        <span class="role-name">
                            Customer
                        </span>

                    </label>

                </div>


                <div class="role-option">

                    <input
                        type="radio"
                        name="role"
                        id="riderRole"
                        value="rider"
                    >

                    <label
                        class="role-label"
                        for="riderRole"
                    >

                        <span class="role-icon">
                            🛵
                        </span>

                        <span class="role-name">
                            Rider
                        </span>

                    </label>

                </div>

            </div>


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    autocomplete="name"
                    maxlength="60"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Mobile Number
                </label>

                <div class="phone-row">

                    <div class="country-code">
                        +91
                    </div>

                    <input
                        type="tel"
                        id="phone"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="10"
                        placeholder="Enter mobile number"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    maxlength="100"
                    placeholder="Enter email address"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-row">

                    <input
                        type="password"
                        id="password"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="100"
                        placeholder="Create password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-btn"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

                <div class="password-hint">
                    Minimum 6 characters.
                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-row">

                    <input
                        type="password"
                        id="confirmPassword"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="100"
                        placeholder="Confirm password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-btn"
                        id="toggleConfirmPassword"
                        aria-label="Show confirm password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div
                id="riderFields"
                style="display:none;"
            >

                <div class="form-group">

                    <label for="vehicleType">
                        Vehicle Type
                    </label>

                    <select id="vehicleType">

                        <option value="bike">
                            Bike
                        </option>

                        <option value="scooter">
                            Scooter
                        </option>

                        <option value="cab">
                            Cab
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="vehicleNumber">
                        Vehicle Number
                    </label>

                    <input
                        type="text"
                        id="vehicleNumber"
                        maxlength="20"
                        autocomplete="off"
                        placeholder="Example: CH01AB1234"
                    >

                </div>

            </div>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="terms"
                >

                <span>

                    I agree to the RiderX

                    <a
                        href="../terms.html"
                        target="_blank"
                    >
                        Terms & Conditions
                    </a>

                    and

                    <a
                        href="../privacy.html"
                        target="_blank"
                    >
                        Privacy Policy
                    </a>.

                </span>

            </label>


            <button
                type="submit"
                class="register-btn"
                id="registerBtn"
            >
                Create Account
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a
                href="./role.html"
                id="loginLink"
            >
                Login
            </a>

        </div>


        <button
            type="button"
            class="back-role"
            id="backRole"
        >
            ← Choose account type
        </button>


        <div class="footer">
            © 2026 RiderX • Secure Account Registration
        </div>

    </section>

</main>


<script type="module">

    "use strict";


    /* =========================================================
       FIREBASE
    ========================================================= */

    import {
        auth,
        db,
        createUserWithEmailAndPassword,
        updateProfile,
        doc,
        setDoc,
        serverTimestamp
    } from "../firebase/firebase-config.js";


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const registerForm =
        document.getElementById("registerForm");

    const customerRole =
        document.getElementById("customerRole");

    const riderRole =
        document.getElementById("riderRole");

    const nameInput =
        document.getElementById("name");

    const phoneInput =
        document.getElementById("phone");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const vehicleType =
        document.getElementById("vehicleType");

    const vehicleNumber =
        document.getElementById("vehicleNumber");

    const riderFields =
        document.getElementById("riderFields");

    const terms =
        document.getElementById("terms");

    const registerBtn =
        document.getElementById("registerBtn");

    const errorBox =
        document.getElementById("errorBox");

    const successBox =
        document.getElementById("successBox");


    /* =========================================================
       ROLE
    ========================================================= */

    const savedRole =
        normalizeRole(
            localStorage.getItem(
                "riderx_selected_role"
            )
        );


    if (savedRole === "customer") {

        customerRole.checked = true;

    }


    if (savedRole === "rider") {

        riderRole.checked = true;

    }


    updateRoleFields();


    customerRole.addEventListener(
        "change",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );

            updateRoleFields();
            hideMessages();

        }
    );


    riderRole.addEventListener(
        "change",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "rider"
            );

            updateRoleFields();
            hideMessages();

        }
    );


    function updateRoleFields() {

        if (riderRole.checked) {

            riderFields.style.display =
                "block";

            vehicleType.required =
                true;

            vehicleNumber.required =
                true;

        } else {

            riderFields.style.display =
                "none";

            vehicleType.required =
                false;

            vehicleNumber.required =
                false;

            vehicleNumber.value = "";

        }
    }


    /* =========================================================
       PHONE
    ========================================================= */

    phoneInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 10);

            clearFieldError(this);
            hideMessages();

        }
    );


    /* =========================================================
       NAME
    ========================================================= */

    nameInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\s+/g, " ")
                    .replace(/^\s+/, "");

            clearFieldError(this);

        }
    );


    /* =========================================================
       EMAIL
    ========================================================= */

    emailInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .trimStart()
                    .toLowerCase();

            clearFieldError(this);

        }
    );


    /* =========================================================
       VEHICLE NUMBER
    ========================================================= */

    vehicleNumber.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .toUpperCase()
                    .replace(/\s+/g, "");

            clearFieldError(this);

        }
    );


    /* =========================================================
       PASSWORD VISIBILITY
    ========================================================= */

    document
        .getElementById("togglePassword")
        .addEventListener(
            "click",
            function () {

                const visible =
                    passwordInput.type ===
                    "password";

                passwordInput.type =
                    visible
                        ? "text"
                        : "password";

                this.textContent =
                    visible
                        ? "🙈"
                        : "👁";

                this.setAttribute(
                    "aria-label",
                    visible
                        ? "Hide password"
                        : "Show password"
                );

            }
        );


    document
        .getElementById("toggleConfirmPassword")
        .addEventListener(
            "click",
            function () {

                const visible =
                    confirmPasswordInput.type ===
                    "password";

                confirmPasswordInput.type =
                    visible
                        ? "text"
                        : "password";

                this.textContent =
                    visible
                        ? "🙈"
                        : "👁";

                this.setAttribute(
                    "aria-label",
                    visible
                        ? "Hide confirm password"
                        : "Show confirm password"
                );

            }
        );


    /* =========================================================
       PASSWORD INPUT
    ========================================================= */

    passwordInput.addEventListener(
        "input",
        function () {

            clearFieldError(this);
            hideMessages();

        }
    );


    confirmPasswordInput.addEventListener(
        "input",
        function () {

            clearFieldError(this);
            hideMessages();

        }
    );


    /* =========================================================
       REGISTER
    ========================================================= */

    registerForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideMessages();

            clearAllFieldErrors();


            const role =
                getSelectedRole();

            const name =
                nameInput.value
                    .trim()
                    .replace(/\s+/g, " ");

            const mobile =
                normalizePhone(
                    phoneInput.value
                );

            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            /* -------------------------------------------------
               ROLE
            ------------------------------------------------- */

            if (!role) {

                showError(
                    "Please select Customer or Rider account."
                );

                return;
            }


            /* -------------------------------------------------
               NAME
            ------------------------------------------------- */

            if (name.length < 2) {

                showError(
                    "Please enter your full name."
                );

                markFieldError(
                    nameInput
                );

                nameInput.focus();

                return;
            }


            if (
                !/^[A-Za-zÀ-ÿ\u0900-\u097F\s.'-]{2,60}$/.test(
                    name
                )
            ) {

                showError(
                    "Please enter a valid name."
                );

                markFieldError(
                    nameInput
                );

                nameInput.focus();

                return;
            }


            /* -------------------------------------------------
               PHONE
            ------------------------------------------------- */

            if (
                !/^[6-9]\d{9}$/.test(
                    mobile
                )
            ) {

                showError(
                    "Please enter a valid 10-digit Indian mobile number."
                );

                markFieldError(
                    phoneInput
                );

                phoneInput.focus();

                return;
            }


            /* -------------------------------------------------
               EMAIL
            -------------------------------------------------
               Email is required because this registration
               flow uses Firebase Email/Password Auth.
            ------------------------------------------------- */

            if (!isValidEmail(email)) {

                showError(
                    "Please enter a valid email address."
                );

                markFieldError(
                    emailInput
                );

                emailInput.focus();

                return;
            }


            /* -------------------------------------------------
               PASSWORD
            ------------------------------------------------- */

            if (password.length < 6) {

                showError(
                    "Password must contain at least 6 characters."
                );

                markFieldError(
                    passwordInput
                );

                passwordInput.focus();

                return;
            }


            if (password !== confirmPassword) {

                showError(
                    "Passwords do not match."
                );

                markFieldError(
                    confirmPasswordInput
                );

                confirmPasswordInput.focus();

                return;
            }


            /* -------------------------------------------------
               RIDER VALIDATION
            ------------------------------------------------- */

            let selectedVehicle = "";
            let selectedVehicleNumber = "";


            if (role === "rider") {

                selectedVehicle =
                    String(
                        vehicleType.value ||
                        "bike"
                    )
                        .trim()
                        .toLowerCase();


                selectedVehicleNumber =
                    vehicleNumber.value
                        .trim()
                        .toUpperCase()
                        .replace(/\s+/g, "");


                if (!selectedVehicleNumber) {

                    showError(
                        "Please enter your vehicle number."
                    );

                    markFieldError(
                        vehicleNumber
                    );

                    vehicleNumber.focus();

                    return;
                }


                if (
                    !/^[A-Z0-9-]{4,20}$/.test(
                        selectedVehicleNumber
                    )
                ) {

                    showError(
                        "Please enter a valid vehicle number."
                    );

                    markFieldError(
                        vehicleNumber
                    );

                    vehicleNumber.focus();

                    return;
                }
            }


            /* -------------------------------------------------
               TERMS
            ------------------------------------------------- */

            if (!terms.checked) {

                showError(
                    "Please accept the Terms & Conditions and Privacy Policy."
                );

                terms.focus();

                return;
            }


            /* -------------------------------------------------
               START FIREBASE REGISTRATION
            ------------------------------------------------- */

            setLoading(true);


            try {

                /*
                 * Firebase creates the real authentication
                 * account here.
                 *
                 * Password is NEVER written to Firestore or
                 * localStorage.
                 */

                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const firebaseUser =
                    credential.user;


                if (!firebaseUser) {

                    throw new Error(
                        "Firebase did not return a user."
                    );
                }


                /* -------------------------------------------------
                   UPDATE AUTH PROFILE
                ------------------------------------------------- */

                await updateProfile(
                    firebaseUser,
                    {
                        displayName: name
                    }
                );


                /* -------------------------------------------------
                   USER PROFILE
                ------------------------------------------------- */

                const userProfile = {

                    uid:
                        firebaseUser.uid,

                    id:
                        firebaseUser.uid,

                    name:
                        name,

                    fullName:
                        name,

                    email:
                        email,

                    phone:
                        mobile,

                    mobile:
                        mobile,

                    role:
                        role,

                    status:
                        role === "rider"
                            ? "pending"
                            : "active",

                    city:
                        "Chandigarh",

                    vehicleType:
                        role === "rider"
                            ? selectedVehicle
                            : "",

                    vehicleNumber:
                        role === "rider"
                            ? selectedVehicleNumber
                            : "",

                    walletBalance:
                        0,

                    totalEarnings:
                        0,

                    totalRides:
                        0,

                    online:
                        false,

                    available:
                        false,

                    verified:
                        false,

                    rating:
                        5,

                    ratingCount:
                        0,

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()
                };


                /* -------------------------------------------------
                   MAIN USERS COLLECTION
                ------------------------------------------------- */

                await setDoc(
                    doc(
                        db,
                        "users",
                        firebaseUser.uid
                    ),
                    userProfile
                );


                /* -------------------------------------------------
                   ROLE COLLECTION
                ------------------------------------------------- */

                if (role === "customer") {

                    await setDoc(
                        doc(
                            db,
                            "customers",
                            firebaseUser.uid
                        ),
                        userProfile
                    );

                } else {

                    await setDoc(
                        doc(
                            db,
                            "riders",
                            firebaseUser.uid
                        ),
                        userProfile
                    );
                }


                /* -------------------------------------------------
                   LOCAL UI STATE ONLY
                -------------------------------------------------
                   No password is stored.
                */

                const localSession = {

                    uid:
                        firebaseUser.uid,

                    id:
                        firebaseUser.uid,

                    name:
                        name,

                    fullName:
                        name,

                    email:
                        email,

                    phone:
                        mobile,

                    mobile:
                        mobile,

                    role:
                        role,

                    status:
                        userProfile.status,

                    vehicleType:
                        userProfile.vehicleType,

                    vehicleNumber:
                        userProfile.vehicleNumber,

                    city:
                        "Chandigarh"
                };


                localStorage.setItem(
                    "riderx_user",
                    JSON.stringify(
                        localSession
                    )
                );


                localStorage.setItem(
                    "userRole",
                    role
                );


                localStorage.setItem(
                    "riderx_selected_role",
                    role
                );


                if (role === "customer") {

                    localStorage.setItem(
                        "riderx_customer",
                        JSON.stringify(
                            localSession
                        )
                    );

                } else {

                    localStorage.setItem(
                        "riderx_rider",
                        JSON.stringify(
                            localSession
                        )
                    );
                }


                /* -------------------------------------------------
                   SUCCESS
                ------------------------------------------------- */

                if (role === "rider") {

                    showSuccess(
                        "Rider account created successfully. Your account is pending verification."
                    );

                } else {

                    showSuccess(
                        "Customer account created successfully."
                    );
                }


                /*
                 * Firebase Auth has already established the
                 * authenticated session.
                 *
                 * The next login/guard files will use
                 * onAuthStateChanged instead of trusting
                 * localStorage.
                 */

                setTimeout(
                    function () {

                        if (role === "rider") {

                            window.location.replace(
                                "../rider/home.html"
                            );

                        } else {

                            window.location.replace(
                                "../customer/home.html"
                            );
                        }

                    },
                    900
                );


            } catch (error) {

                console.error(
                    "RiderX registration error:",
                    error
                );


                /*
                 * If Firestore fails after Auth creation,
                 * the Firebase account may already exist.
                 *
                 * We do not store the password anywhere.
                 */

                showError(
                    getFirebaseErrorMessage(
                        error
                    )
                );


                setLoading(false);
            }

        }
    );


    /* =========================================================
       ROLE HELPERS
    ========================================================= */

    function getSelectedRole() {

        if (customerRole.checked) {

            return "customer";
        }


        if (riderRole.checked) {

            return "rider";
        }


        return "";
    }


    function normalizeRole(role) {

        const value =
            String(
                role || ""
            )
                .trim()
                .toLowerCase();


        if (
            value === "driver" ||
            value === "delivery"
        ) {

            return "rider";
        }


        if (value === "rider") {

            return "rider";
        }


        if (value === "customer") {

            return "customer";
        }


        return "";
    }


    /* =========================================================
       PHONE
    ========================================================= */

    function normalizePhone(value) {

        return String(
            value || ""
        )
            .replace(
                /\D/g,
                ""
            )
            .slice(
                -10
            );
    }


    /* =========================================================
       EMAIL
    ========================================================= */

    function isValidEmail(email) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/
            .test(email);
    }


    /* =========================================================
       FIREBASE ERROR MESSAGES
    ========================================================= */

    function getFirebaseErrorMessage(error) {

        const code =
            String(
                error?.code || ""
            )
                .toLowerCase();


        switch (code) {

            case "auth/email-already-in-use":

                return "An account with this email already exists. Please login instead.";


            case "auth/invalid-email":

                return "Please enter a valid email address.";


            case "auth/weak-password":

                return "Password is too weak. Please use at least 6 characters.";


            case "auth/network-request-failed":

                return "Network error. Please check your internet connection and try again.";


            case "auth/operation-not-allowed":

                return "Email/password registration is not enabled in Firebase Authentication.";


            case "auth/too-many-requests":

                return "Too many attempts. Please wait a while and try again.";


            case "permission-denied":

                return "Firebase permission denied. Please check Firestore Security Rules.";


            default:

                if (
                    error?.message &&
                    /permission/i.test(
                        error.message
                    )
                ) {

                    return "Firebase permission denied. Please check Firestore Security Rules.";
                }


                return "Unable to create your account right now. Please try again.";
        }
    }


    /* =========================================================
       LOADING
    ========================================================= */

    function setLoading(loading) {

        registerBtn.disabled =
            loading;


        if (loading) {

            registerBtn.innerHTML =
                '<span class="loader"></span>Creating account...';

        } else {

            registerBtn.textContent =
                "Create Account";
        }
    }


    /* =========================================================
       MESSAGES
    ========================================================= */

    function hideMessages() {

        errorBox.classList.remove(
            "show"
        );

        successBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            "";
    }


    function showError(message) {

        successBox.classList.remove(
            "show"
        );

        successBox.textContent =
            "";

        errorBox.textContent =
            message;

        errorBox.classList.add(
            "show"
        );
    }


    function showSuccess(message) {

        errorBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            message;

        successBox.classList.add(
            "show"
        );
    }


    /* =========================================================
       FIELD ERROR
    ========================================================= */

    function markFieldError(field) {

        if (!field) {
            return;
        }

        field.classList.add(
            "field-error"
        );
    }


    function clearFieldError(field) {

        if (!field) {
            return;
        }

        field.classList.remove(
            "field-error"
        );
    }


    function clearAllFieldErrors() {

        [
            nameInput,
            phoneInput,
            emailInput,
            passwordInput,
            confirmPasswordInput,
            vehicleNumber
        ].forEach(
            clearFieldError
        );
    }


    /* =========================================================
       BACK TO ROLE
    ========================================================= */

    document
        .getElementById("backRole")
        .addEventListener(
            "click",
            function () {

                window.location.href =
                    "./role.html";

            }
        );


    /* =========================================================
       LOGIN LINK
    ========================================================= */

    document
        .getElementById("loginLink")
        .addEventListener(
            "click",
            function () {

                const role =
                    getSelectedRole();


                if (role) {

                    localStorage.setItem(
                        "riderx_selected_role",
                        role
                    );
                }

            }
        );


</script>
