<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX Registration"
    >

    <title>RiderX - Create Account</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #070707;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 27px 22px 22px;
            border: 1px solid #292929;
            border-radius: 23px;
            background: #111111;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .55);
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #ffd400;
            color: #090909;
            font-size: 21px;
            font-weight: 1000;
        }

        .brand h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 1000;
        }

        .brand h1 span {
            color: #ffd400;
        }

        .brand p {
            margin: 5px 0 0;
            color: #777777;
            font-size: 9px;
        }

        .heading h2 {
            margin: 0;
            font-size: 19px;
            font-weight: 900;
        }

        .heading p {
            margin: 7px 0 0;
            color: #777777;
            font-size: 9px;
            line-height: 1.6;
        }

        .role-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 18px;
        }

        .role-tab {
            min-height: 52px;
            padding: 8px;
            border: 1px solid #333333;
            border-radius: 10px;
            background: #181818;
            color: #777777;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .role-tab strong {
            display: block;
            margin-bottom: 3px;
            color: #aaaaaa;
            font-size: 10px;
        }

        .role-tab.active {
            border-color: #ffd400;
            background: rgba(255, 212, 0, .09);
            color: #ffd400;
        }

        .role-tab.active strong {
            color: #ffd400;
        }

        .message {
            display: none;
            margin: 15px 0 10px;
            padding: 10px;
            border-radius: 9px;
            font-size: 9px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            border: 1px solid #542828;
            background: #241414;
            color: #ff7777;
        }

        .message.success {
            border: 1px solid #275335;
            background: #132319;
            color: #65e58b;
        }

        .field {
            margin-top: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            color: #aaaaaa;
            font-size: 9px;
            font-weight: 800;
        }

        .input,
        .select {
            width: 100%;
            height: 46px;
            padding: 0 12px;
            border: 1px solid #333333;
            border-radius: 10px;
            outline: none;
            background: #191919;
            color: #ffffff;
            font-size: 11px;
        }

        .select {
            appearance: none;
        }

        .input::placeholder {
            color: #555555;
        }

        .input:focus,
        .select:focus {
            border-color: #ffd400;
            box-shadow: 0 0 0 2px rgba(255, 212, 0, .07);
        }

        .password-wrap {
            position: relative;
        }

        .password-input {
            padding-right: 53px;
        }

        .toggle {
            position: absolute;
            top: 50%;
            right: 6px;
            width: 40px;
            height: 34px;
            transform: translateY(-50%);
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #777777;
            cursor: pointer;
            font-size: 8px;
            font-weight: 900;
        }

        .toggle:hover {
            color: #ffd400;
        }

        .two-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .rider-fields {
            display: none;
        }

        .rider-fields.show {
            display: block;
        }

        .vehicle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 17px 0;
            color: #777777;
            font-size: 8px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 2px;
            accent-color: #ffd400;
        }

        .terms strong {
            color: #bbbbbb;
        }

        .primary {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 10px;
            background: #ffd400;
            color: #111111;
            cursor: pointer;
            font-size: 11px;
            font-weight: 1000;
        }

        .primary:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .login {
            margin-top: 17px;
            text-align: center;
            color: #666666;
            font-size: 9px;
        }

        .login button {
            border: 0;
            padding: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-weight: 900;
        }

        .footer {
            margin-top: 16px;
            color: #444444;
            font-size: 8px;
            text-align: center;
        }

        .loader {
            display: inline-block;
            width: 13px;
            height: 13px;
            margin-right: 7px;
            vertical-align: -2px;
            border: 2px solid rgba(0, 0, 0, .25);
            border-top-color: #111111;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 390px) {

            .card {
                padding: 23px 16px 19px;
                border-radius: 19px;
            }

            .two-fields,
            .vehicle-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>

</head>

<body>

<main class="page">

    <section class="card">

        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                One platform. Every journey.
            </p>

        </div>


        <div class="heading">

            <h2>
                Create your account
            </h2>

            <p>
                Choose your account type and create your
                secure RiderX account.
            </p>

        </div>


        <div class="role-tabs">

            <button
                type="button"
                class="role-tab active"
                id="customerRole"
            >
                <strong>Customer</strong>
                Book rides & track trips
            </button>

            <button
                type="button"
                class="role-tab"
                id="riderRole"
            >
                <strong>Rider</strong>
                Drive & earn with RiderX
            </button>

        </div>


        <div
            id="errorBox"
            class="message error"
            role="alert"
            aria-live="polite"
        ></div>


        <div
            id="successBox"
            class="message success"
            role="status"
            aria-live="polite"
        ></div>


        <form
            id="registerForm"
            novalidate
        >

            <div class="two-fields">

                <div class="field">

                    <label for="firstName">
                        First name
                    </label>

                    <input
                        class="input"
                        id="firstName"
                        type="text"
                        autocomplete="given-name"
                        placeholder="First name"
                        required
                    >

                </div>


                <div class="field">

                    <label for="lastName">
                        Last name
                    </label>

                    <input
                        class="input"
                        id="lastName"
                        type="text"
                        autocomplete="family-name"
                        placeholder="Last name"
                        required
                    >

                </div>

            </div>


            <div class="field">

                <label for="email">
                    Email address
                </label>

                <input
                    class="input"
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="phone">
                    Mobile number
                </label>

                <input
                    class="input"
                    id="phone"
                    type="tel"
                    inputmode="numeric"
                    autocomplete="tel"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                    required
                >

            </div>


            <div class="field">

                <label for="city">
                    City
                </label>

                <select
                    class="select"
                    id="city"
                    required
                >

                    <option value="Chandigarh">
                        Chandigarh
                    </option>

                </select>

            </div>


            <div class="rider-fields" id="riderFields">

                <div class="field">

                    <label for="vehicleType">
                        Vehicle type
                    </label>

                    <select
                        class="select"
                        id="vehicleType"
                    >

                        <option value="bike">
                            Bike
                        </option>

                        <option value="scooter">
                            Scooter
                        </option>

                        <option value="cab">
                            Cab
                        </option>

                    </select>

                </div>


                <div class="vehicle-grid">

                    <div class="field">

                        <label for="vehicleNumber">
                            Vehicle number
                        </label>

                        <input
                            class="input"
                            id="vehicleNumber"
                            type="text"
                            autocomplete="off"
                            placeholder="PB00XX0000"
                            maxlength="15"
                        >

                    </div>


                    <div class="field">

                        <label for="licenseNumber">
                            Driving licence
                        </label>

                        <input
                            class="input"
                            id="licenseNumber"
                            type="text"
                            autocomplete="off"
                            placeholder="Licence number"
                            maxlength="30"
                        >

                    </div>

                </div>

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        class="input password-input"
                        id="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="togglePassword"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <div class="field">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <div class="password-wrap">

                    <input
                        class="input password-input"
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Re-enter password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="toggleConfirmPassword"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                >

                <span>
                    I agree to RiderX's <strong>Terms of Service</strong>
                    and <strong>Privacy Policy</strong>. I confirm that
                    the information provided is accurate.
                </span>

            </label>


            <button
                type="submit"
                class="primary"
                id="registerButton"
            >
                Create Customer Account
            </button>

        </form>


        <div class="login">

            Already have an account?

            <button
                type="button"
                id="loginButton"
            >
                Login
            </button>

        </div>


        <div class="footer">
            © 2026 RiderX • Chandigarh
        </div>

    </section>

</main>


<script type="module">

    "use strict";


    import {

        auth,
        db,

        createUserWithEmailAndPassword,
        updateProfile,
        signOut,

        doc,
        setDoc,
        serverTimestamp

    } from "../firebase/firebase-config.js";


    const form =
        document.getElementById(
            "registerForm"
        );


    const firstNameInput =
        document.getElementById(
            "firstName"
        );


    const lastNameInput =
        document.getElementById(
            "lastName"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const phoneInput =
        document.getElementById(
            "phone"
        );


    const cityInput =
        document.getElementById(
            "city"
        );


    const vehicleTypeInput =
        document.getElementById(
            "vehicleType"
        );


    const vehicleNumberInput =
        document.getElementById(
            "vehicleNumber"
        );


    const licenseNumberInput =
        document.getElementById(
            "licenseNumber"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const confirmPasswordInput =
        document.getElementById(
            "confirmPassword"
        );


    const termsInput =
        document.getElementById(
            "terms"
        );


    const customerRole =
        document.getElementById(
            "customerRole"
        );


    const riderRole =
        document.getElementById(
            "riderRole"
        );


    const riderFields =
        document.getElementById(
            "riderFields"
        );


    const registerButton =
        document.getElementById(
            "registerButton"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    const toggleConfirmPassword =
        document.getElementById(
            "toggleConfirmPassword"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const successBox =
        document.getElementById(
            "successBox"
        );


    let selectedRole =
        "customer";


    let busy =
        false;


    const savedRole =
        localStorage.getItem(
            "riderx_selected_role"
        );


    if (
        savedRole === "rider"
    ) {

        selectRole(
            "rider"
        );

    } else {

        selectRole(
            "customer"
        );

    }


    customerRole.addEventListener(
        "click",
        function () {

            selectRole(
                "customer"
            );

        }
    );


    riderRole.addEventListener(
        "click",
        function () {

            selectRole(
                "rider"
            );

        }
    );


    function selectRole(
        role
    ) {

        selectedRole =
            role === "rider"
                ? "rider"
                : "customer";


        localStorage.setItem(
            "riderx_selected_role",
            selectedRole
        );


        customerRole.classList.toggle(
            "active",
            selectedRole === "customer"
        );


        riderRole.classList.toggle(
            "active",
            selectedRole === "rider"
        );


        riderFields.classList.toggle(
            "show",
            selectedRole === "rider"
        );


        registerButton.textContent =
            selectedRole === "rider"
                ? "Create Rider Account"
                : "Create Customer Account";


        vehicleNumberInput.required =
            selectedRole === "rider";


        licenseNumberInput.required =
            selectedRole === "rider";

    }


    togglePassword.addEventListener(
        "click",
        function () {

            toggleInput(
                passwordInput,
                togglePassword
            );

        }
    );


    toggleConfirmPassword.addEventListener(
        "click",
        function () {

            toggleInput(
                confirmPasswordInput,
                toggleConfirmPassword
            );

        }
    );


    function toggleInput(
        input,
        button
    ) {

        const hidden =
            input.type === "password";


        input.type =
            hidden
                ? "text"
                : "password";


        button.textContent =
            hidden
                ? "HIDE"
                : "SHOW";

    }


    phoneInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(
                        /\D/g,
                        ""
                    )
                    .slice(
                        0,
                        10
                    );

        }
    );


    vehicleNumberInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9 -]/g,
                        ""
                    )
                    .slice(
                        0,
                        15
                    );

        }
    );


    licenseNumberInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .toUpperCase()
                    .replace(
                        /[^A-Z0-9 -]/g,
                        ""
                    )
                    .slice(
                        0,
                        30
                    );

        }
    );


    form.addEventListener(
        "submit",
        async function (
            event
        ) {

            event.preventDefault();


            if (
                busy
            ) {

                return;

            }


            clearMessages();


            const firstName =
                firstNameInput.value
                    .trim();


            const lastName =
                lastNameInput.value
                    .trim();


            const fullName =
                (
                    firstName +
                    " " +
                    lastName
                )
                    .trim();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const phone =
                phoneInput.value
                    .trim();


            const city =
                cityInput.value
                    .trim();


            const password =
                passwordInput.value;


            const confirmPassword =
                confirmPasswordInput.value;


            const vehicleType =
                vehicleTypeInput.value;


            const vehicleNumber =
                vehicleNumberInput.value
                    .trim()
                    .toUpperCase();


            const licenseNumber =
                licenseNumberInput.value
                    .trim()
                    .toUpperCase();


            const validation =
                validateForm(
                    firstName,
                    lastName,
                    email,
                    phone,
                    password,
                    confirmPassword,
                    vehicleNumber,
                    licenseNumber
                );


            if (
                !validation.valid
            ) {

                showError(
                    validation.message
                );

                return;

            }


            if (
                !termsInput.checked
            ) {

                showError(
                    "Please accept the RiderX Terms of Service and Privacy Policy."
                );

                return;

            }


            busy =
                true;


            setLoading(
                true
            );


            let firebaseUser =
                null;


            try {

                const result =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                firebaseUser =
                    result.user;


                if (
                    !firebaseUser
                ) {

                    throw new Error(
                        "Account creation failed."
                    );

                }


                try {

                    await updateProfile(
                        firebaseUser,
                        {
                            displayName:
                                fullName
                        }
                    );

                } catch (
                    profileError
                ) {

                    console.warn(
                        "Firebase profile update warning:",
                        profileError
                    );

                }


                const commonProfile = {

                    uid:
                        firebaseUser.uid,

                    id:
                        firebaseUser.uid,

                    role:
                        selectedRole,

                    userRole:
                        selectedRole,

                    accountType:
                        selectedRole,

                    name:
                        fullName,

                    fullName:
                        fullName,

                    displayName:
                        fullName,

                    firstName:
                        firstName,

                    lastName:
                        lastName,

                    email:
                        email,

                    phone:
                        phone,

                    phoneNumber:
                        phone,

                    city:
                        city,

                    photoURL:
                        "",

                    rating:
                        5,

                    totalRides:
                        0,

                    completedRides:
                        0,

                    walletBalance:
                        0,

                    currentRideId:
                        null,

                    status:
                        "active",

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                };


                if (
                    selectedRole ===
                    "customer"
                ) {

                    const customerProfile = {

                        ...commonProfile,

                        role:
                            "customer",

                        userRole:
                            "customer",

                        accountType:
                            "customer",

                        accountStatus:
                            "active",

                        totalRides:
                            0,

                        completedRides:
                            0,

                        cancelledRides:
                            0,

                        walletBalance:
                            0,

                        referralCode:
                            makeReferralCode(
                                fullName,
                                firebaseUser.uid
                            ),

                        currentRideId:
                            null

                    };


                    await setDoc(
                        doc(
                            db,
                            "users",
                            firebaseUser.uid
                        ),
                        customerProfile,
                        {
                            merge:
                                true
                        }
                    );


                    await setDoc(
                        doc(
                            db,
                            "customers",
                            firebaseUser.uid
                        ),
                        customerProfile,
                        {
                            merge:
                                true
                        }
                    );


                    saveLocalSession(
                        customerProfile
                    );


                    showSuccess(
                        "Customer account created successfully. Opening RiderX..."
                    );


                    setTimeout(
                        function () {

                            window.location.replace(
                                "../customer/home.html"
                            );

                        },
                        800
                    );


                } else {

                    const riderProfile = {

                        ...commonProfile,

                        role:
                            "rider",

                        userRole:
                            "rider",

                        accountType:
                            "rider",

                        vehicleType:
                            vehicleType,

                        vehicleNumber:
                            vehicleNumber,

                        licenseNumber:
                            licenseNumber,

                        approvalStatus:
                            "pending",

                        applicationStatus:
                            "pending",

                        verificationStatus:
                            "pending",

                        approved:
                            false,

                        isApproved:
                            false,

                        online:
                            false,

                        isOnline:
                            false,

                        blocked:
                            false,

                        disabled:
                            false,

                        rejected:
                            false,

                        earnings:
                            0,

                        todayEarnings:
                            0,

                        totalRides:
                            0,

                        completedRides:
                            0,

                        cancelledRides:
                            0,

                        walletBalance:
                            0,

                        currentRideId:
                            null

                    };


                    await setDoc(
                        doc(
                            db,
                            "users",
                            firebaseUser.uid
                        ),
                        riderProfile,
                        {
                            merge:
                                true
                        }
                    );


                    await setDoc(
                        doc(
                            db,
                            "riders",
                            firebaseUser.uid
                        ),
                        riderProfile,
                        {
                            merge:
                                true
                        }
                    );


                    saveLocalSession(
                        riderProfile
                    );


                    await signOut(
                        auth
                    );


                    showSuccess(
                        "Rider application submitted. Your account is waiting for admin approval."
                    );


                    setTimeout(
                        function () {

                            window.location.replace(
                                "./rider-login.html"
                            );

                        },
                        1400
                    );

                }


            } catch (
                error
            ) {

                console.error(
                    "Registration error:",
                    error
                );


                if (
                    firebaseUser &&
                    error?.code !==
                    "auth/email-already-in-use"
                ) {

                    try {

                        await signOut(
                            auth
                        );

                    } catch (
                        signOutError
                    ) {

                        console.warn(
                            "Sign out warning:",
                            signOutError
                        );

                    }

                }


                showError(
                    registrationMessage(
                        error
                    )
                );

            } finally {

                busy =
                    false;


                setLoading(
                    false
                );

            }

        }
    );


    function validateForm(
        firstName,
        lastName,
        email,
        phone,
        password,
        confirmPassword,
        vehicleNumber,
        licenseNumber
    ) {

        if (
            firstName.length <
            2
        ) {

            return {
                valid:
                    false,
                message:
                    "Please enter your first name."
            };

        }


        if (
            lastName.length <
            1
        ) {

            return {
                valid:
                    false,
                message:
                    "Please enter your last name."
            };

        }


        if (
            !validEmail(
                email
            )
        ) {

            return {
                valid:
                    false,
                message:
                    "Please enter a valid email address."
            };

        }


        if (
            !/^\d{10}$/.test(
                phone
            )
        ) {

            return {
                valid:
                    false,
                message:
                    "Please enter a valid 10 digit mobile number."
            };

        }


        if (
            password.length <
            6
        ) {

            return {
                valid:
                    false,
                message:
                    "Password must contain at least 6 characters."
            };

        }


        if (
            password !==
            confirmPassword
        ) {

            return {
                valid:
                    false,
                message:
                    "Passwords do not match."
            };

        }


        if (
            selectedRole ===
            "rider"
        ) {

            if (
                vehicleNumber.length <
                4
            ) {

                return {
                    valid:
                        false,
                    message:
                        "Please enter your vehicle number."
                };

            }


            if (
                licenseNumber.length <
                5
            ) {

                return {
                    valid:
                        false,
                    message:
                        "Please enter your driving licence number."
                };

            }

        }


        return {
            valid:
                true,
            message:
                ""
        };

    }


    function saveLocalSession(
        profile
    ) {

        localStorage.setItem(
            "riderx_user",
            JSON.stringify(
                profile
            )
        );


        if (
            profile.role ===
            "customer"
        ) {

            localStorage.setItem(
                "riderx_customer",
                JSON.stringify(
                    profile
                )
            );

            localStorage.setItem(
                "riderx_customer_id",
                profile.uid
            );

        } else {

            localStorage.setItem(
                "riderx_rider",
                JSON.stringify(
                    profile
                )
            );

            localStorage.setItem(
                "riderx_rider_id",
                profile.uid
            );

        }


        localStorage.setItem(
            "userRole",
            profile.role
        );


        localStorage.setItem(
            "riderx_role",
            profile.role
        );


        localStorage.setItem(
            "riderx_selected_role",
            profile.role
        );

    }


    function makeReferralCode(
        name,
        uid
    ) {

        const cleanName =
            String(
                name || "RX"
            )
                .replace(
                    /[^a-zA-Z0-9]/g,
                    ""
                )
                .toUpperCase()
                .slice(
                    0,
                    5
                );


        return (
            "RX-" +
            cleanName +
            "-" +
            String(
                uid || ""
            )
                .slice(
                    0,
                    6
                )
                .toUpperCase()
        );

    }


    function validEmail(
        email
    ) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        );

    }


    function clearMessages() {

        errorBox.textContent =
            "";

        successBox.textContent =
            "";

        errorBox.classList.remove(
            "show"
        );

        successBox.classList.remove(
            "show"
        );

    }


    function showError(
        message
    ) {

        successBox.classList.remove(
            "show"
        );

        successBox.textContent =
            "";

        errorBox.textContent =
            message;

        errorBox.classList.add(
            "show"
        );

    }


    function showSuccess(
        message
    ) {

        errorBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            message;

        successBox.classList.add(
            "show"
        );

    }


    function setLoading(
        value
    ) {

        registerButton.disabled =
            value;


        if (
            value
        ) {

            registerButton.innerHTML =
                '<span class="loader"></span>Creating account...';

        } else {

            registerButton.textContent =
                selectedRole === "rider"
                    ? "Create Rider Account"
                    : "Create Customer Account";

        }

    }


    function registrationMessage(
        error
    ) {

        const code =
            String(
                error?.code ||
                ""
            )
                .toLowerCase();


        switch (
            code
        ) {

            case "auth/email-already-in-use":

                return "An account with this email already exists. Please login instead.";


            case "auth/invalid-email":

                return "Please enter a valid email address.";


            case "auth/weak-password":

                return "Password is too weak. Use at least 6 characters.";


            case "auth/operation-not-allowed":

                return "Email/password authentication is not enabled in Firebase.";


            case "auth/network-request-failed":

                return "Network error. Please check your internet connection.";


            case "permission-denied":

                return "Firebase permission denied. Check your Firestore security rules.";


            default:

                if (
                    String(
                        error?.message ||
                        ""
                    )
                        .toLowerCase()
                        .includes(
                            "permission"
                        )
                ) {

                    return "Firebase permission denied. Check your Firestore security rules.";

                }


                return (
                    error?.message ||
                    "Registration failed. Please try again."
                );

        }

    }


    loginButton.addEventListener(
        "click",
        function () {

            if (
                selectedRole ===
                "rider"
            ) {

                window.location.href =
                    "./rider-login.html";

            } else {

                window.location.href =
                    "./customer-login.html";

            }

        }
    );

</script>
