<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Register</title>


<link rel="icon" href="../assets/logo.png">


<link rel="stylesheet" href="../css/Style.css">

<link rel="stylesheet" href="../css/Auth.css">

<link rel="stylesheet" href="../css/Responsive.css">

<link rel="stylesheet" href="../css/Animation.css">


</head>


<body>


<div class="auth-page">


<div class="auth-container fade-in">


<div class="auth-logo">


<img src="../assets/logo.png" alt="RiderX">


<h1>RiderX</h1>


<p>Create your account</p>


</div>





<h2>Register</h2>





<!-- Role -->


<div class="role-box">


<div class="role-option active" id="customerRole">

👤 Customer

</div>



<div class="role-option" id="riderRole">

🏍 Rider

</div>



</div>





<form id="registerForm">



<div class="auth-input">

<label>Name</label>

<input 
type="text"
id="name"
placeholder="Enter your name"
required>

</div>





<div class="auth-input">

<label>Mobile Number</label>

<input 
type="tel"
id="phone"
placeholder="Enter mobile number"
required>

</div>





<div class="auth-input">

<label>Email</label>

<input 
type="email"
id="email"
placeholder="Enter email"
required>

</div>





<div class="auth-input">

<label>Password</label>

<input 
type="password"
id="password"
placeholder="Create password"
required>

</div>





<div class="auth-input">

<label>Confirm Password</label>

<input 
type="password"
id="confirmPassword"
placeholder="Confirm password"
required>

</div>






<div class="auth-input">


<label>

<input type="checkbox" required>

I agree to RiderX Terms & Conditions

</label>


</div>






<button 
type="submit"
class="auth-btn btn-animation">

Create Account

</button>





<p id="message"></p>



</form>





<div class="auth-switch">


Already have an account?

<a href="login.html">

Login

</a>


</div>





</div>


</div>







<script type="module" src="../js/Auth.js"></script>


</body>

</html>
