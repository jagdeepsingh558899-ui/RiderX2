<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#ffd400"
>

<meta
    name="description"
    content="RiderX Mobile OTP Login"
>

<title>RiderX - OTP Login</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    min-height: 100vh;
    min-height: 100dvh;

    background: #070707;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.page {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

    position: relative;
    overflow: hidden;
}

.page::before {
    content: "";

    position: fixed;

    width: 430px;
    height: 430px;

    top: -270px;
    right: -180px;

    border-radius: 50%;

    background:
        rgba(255, 212, 0, .08);

    pointer-events: none;
}

.page::after {
    content: "";

    position: fixed;

    width: 350px;
    height: 350px;

    bottom: -230px;
    left: -170px;

    border-radius: 50%;

    background:
        rgba(255, 212, 0, .05);

    pointer-events: none;
}

.card {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 430px;

    padding: 29px 22px 21px;

    border:
        1px solid #292929;

    border-radius: 23px;

    background: #111;

    box-shadow:
        0 25px 80px
        rgba(0, 0, 0, .55);
}

.brand {
    text-align: center;

    margin-bottom: 24px;
}

.logo {
    width: 64px;
    height: 64px;

    margin:
        0 auto 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background: #ffd400;
    color: #080808;

    font-size: 22px;
    font-weight: 1000;
}

.brand h1 {
    margin: 0;

    font-size: 26px;
    font-weight: 1000;
}

.brand h1 span {
    color: #ffd400;
}

.brand p {
    margin: 6px 0 0;

    color: #777;

    font-size: 9px;
}

.heading {
    text-align: center;
}

.heading h2 {
    margin: 0;

    font-size: 20px;
    font-weight: 900;
}

.heading p {
    margin:
        7px auto 0;

    max-width: 350px;

    color: #777;

    font-size: 9px;
    line-height: 1.55;
}

.role {
    width: fit-content;

    margin:
        14px auto 0;

    padding:
        7px 11px;

    border:
        1px solid #493f00;

    border-radius: 999px;

    background:
        rgba(255, 212, 0, .07);

    color: #ffd400;

    font-size: 8px;
    font-weight: 900;
}

.form {
    margin-top: 22px;
}

.label {
    display: block;

    margin-bottom: 7px;

    color: #aaa;

    font-size: 9px;
    font-weight: 900;
}

.input {
    width: 100%;
    height: 47px;

    padding:
        0 13px;

    border:
        1px solid #303030;

    border-radius: 10px;

    outline: none;

    background: #191919;
    color: #fff;

    font-size: 12px;
}

.input::placeholder {
    color: #555;
}

.input:focus {
    border-color: #ffd400;

    box-shadow:
        0 0 0 2px
        rgba(255, 212, 0, .07);
}

.phone-wrap {
    display: flex;

    gap: 8px;
}

.country {
    flex: 0 0 74px;

    height: 47px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        1px solid #303030;

    border-radius: 10px;

    background: #191919;

    color: #aaa;

    font-size: 11px;
    font-weight: 900;
}

.phone {
    flex: 1;
}

.primary {
    width: 100%;
    min-height: 47px;

    margin-top: 17px;

    border: 0;
    border-radius: 10px;

    background: #ffd400;
    color: #090909;

    cursor: pointer;

    font-size: 10px;
    font-weight: 1000;
}

.primary:hover {
    opacity: .94;
}

.primary:active {
    transform: scale(.99);
}

.primary:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.otp-section {
    display: none;

    margin-top: 20px;
}

.otp-section.show {
    display: block;
}

.otp-info {
    margin-bottom: 12px;

    color: #888;

    text-align: center;

    font-size: 9px;
    line-height: 1.55;
}

.otp-input {
    text-align: center;

    letter-spacing: 9px;

    font-size: 18px;
    font-weight: 900;
}

.otp-input::placeholder {
    letter-spacing: 2px;

    font-size: 10px;
    font-weight: normal;
}

.timer {
    margin-top: 10px;

    text-align: center;

    color: #666;

    font-size: 8px;
}

.resend {
    display: none;

    margin:
        9px auto 0;

    border: 0;
    padding: 0;

    background: transparent;

    color: #ffd400;

    cursor: pointer;

    font-size: 8px;
    font-weight: 900;
}

.resend.show {
    display: block;
}

.message {
    display: none;

    margin-top: 14px;

    padding: 10px;

    border-radius: 9px;

    text-align: center;

    font-size: 8px;
    line-height: 1.5;
}

.message.show {
    display: block;
}

.message.error {
    border:
        1px solid #572525;

    background:
        rgba(255, 50, 50, .07);

    color: #ff7777;
}

.message.success {
    border:
        1px solid #295432;

    background:
        rgba(40, 180, 70, .07);

    color: #6cda88;
}

.message.info {
    border:
        1px solid #443b00;

    background:
        rgba(255, 212, 0, .07);

    color: #ffd400;
}

.secondary {
    width: 100%;
    height: 43px;

    margin-top: 11px;

    border:
        1px solid #303030;

    border-radius: 10px;

    background: #181818;

    color: #888;

    cursor: pointer;

    font-size: 8px;
    font-weight: 900;
}

.secondary:hover {
    border-color: #ffd400;

    color: #ffd400;
}

.footer {
    margin-top: 18px;

    color: #444;

    font-size: 8px;

    text-align: center;
}

.loader {
    display: inline-block;

    width: 13px;
    height: 13px;

    margin-right: 7px;

    vertical-align: -2px;

    border:
        2px solid rgba(0, 0, 0, .2);

    border-top-color:
        #111;

    border-radius: 50%;

    animation:
        spin .7s linear infinite;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}

@media (max-width: 380px) {

    .card {
        padding:
            24px 16px 18px;

        border-radius: 19px;
    }

    .country {
        flex-basis: 68px;
    }

}

</style>

</head>


<body>

<main class="page">

<section class="card">


<div class="brand">

    <div class="logo">
        RX
    </div>

    <h1>
        Rider<span>X</span>
    </h1>

    <p>
        Ride smarter. Ride with RiderX.
    </p>

</div>


<div class="heading">

    <h2>
        Mobile OTP Login
    </h2>

    <p>
        Verify your mobile number with a secure
        one-time password.
    </p>

    <div
        class="role"
        id="roleBadge"
    >
        CUSTOMER / RIDER
    </div>

</div>


<div class="form">


<label
    class="label"
    for="phone"
>
    Mobile Number
</label>


<div class="phone-wrap">

    <div class="country">
        +91
    </div>

    <input
        class="input phone"
        id="phone"
        type="tel"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="10"
        placeholder="Enter 10 digit mobile number"
    >

</div>


<button
    type="button"
    class="primary"
    id="sendOtp"
>
    SEND OTP
</button>


<div
    class="otp-section"
    id="otpSection"
>

    <div class="otp-info">
        Enter the 6-digit OTP sent to your mobile number.
    </div>

    <input
        class="input otp-input"
        id="otp"
        type="tel"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="OTP"
    >


    <div
        class="timer"
        id="timer"
    >
        OTP expires in 60 seconds
    </div>


    <button
        type="button"
        class="resend"
        id="resend"
    >
        RESEND OTP
    </button>


    <button
        type="button"
        class="primary"
        id="verifyOtp"
    >
        VERIFY & LOGIN
    </button>

</div>


<div
    class="message"
    id="message"
    role="status"
    aria-live="polite"
></div>


<button
    type="button"
    class="secondary"
    id="changeNumber"
>
    CHANGE MOBILE NUMBER
</button>


<button
    type="button"
    class="secondary"
    id="back"
>
    ← BACK TO LOGIN
</button>


</div>


<div class="footer">
    © 2026 RiderX • Chandigarh
</div>


</section>

</main>


<script type="module">

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const phoneInput =
    document.getElementById(
        "phone"
    );

const otpInput =
    document.getElementById(
        "otp"
    );

const sendOtpButton =
    document.getElementById(
        "sendOtp"
    );

const verifyOtpButton =
    document.getElementById(
        "verifyOtp"
    );

const otpSection =
    document.getElementById(
        "otpSection"
    );

const resendButton =
    document.getElementById(
        "resend"
    );

const changeNumberButton =
    document.getElementById(
        "changeNumber"
    );

const backButton =
    document.getElementById(
        "back"
    );

const messageBox =
    document.getElementById(
        "message"
    );

const timerBox =
    document.getElementById(
        "timer"
    );

const roleBadge =
    document.getElementById(
        "roleBadge"
    );


/* =========================================================
   STATE
========================================================= */

let confirmationResult =
    null;

let resendTimer =
    null;

let seconds =
    60;

let busy =
    false;

let firebaseModule =
    null;


/* =========================================================
   ROLE
========================================================= */

function getSelectedRole() {

    const values = [

        localStorage.getItem(
            "riderx_selected_role"
        ),

        localStorage.getItem(
            "riderx_role"
        ),

        localStorage.getItem(
            "userRole"
        )

    ];


    for (
        const value of values
    ) {

        const role =
            normalizeRole(
                value
            );


        if (
            role
        ) {

            return role;

        }

    }


    return "customer";

}


function normalizeRole(
    value
) {

    const role =
        String(
            value || ""
        )
            .trim()
            .toLowerCase();


    if (
        [
            "rider",
            "driver",
            "partner",
            "captain",
            "driver_partner"
        ].includes(
            role
        )
    ) {

        return "rider";

    }


    if (
        [
            "admin",
            "administrator"
        ].includes(
            role
        )
    ) {

        return "admin";

    }


    return "customer";

}


let selectedRole =
    getSelectedRole();


if (
    selectedRole ===
    "rider"
) {

    roleBadge.textContent =
        "RIDER / DRIVER PARTNER";

} else {

    roleBadge.textContent =
        "CUSTOMER";

}


/* =========================================================
   LOAD FIREBASE
========================================================= */

async function loadFirebase() {

    if (
        firebaseModule
    ) {

        return firebaseModule;

    }


    firebaseModule =
        await import(
            "../firebase/firebase-config.js"
        );


    return firebaseModule;

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "info"
) {

    messageBox.textContent =
        String(
            text || ""
        );

    messageBox.className =
        "message show " +
        type;

}


function clearMessage() {

    messageBox.textContent =
        "";

    messageBox.className =
        "message";

}


/* =========================================================
   PHONE FORMAT
========================================================= */

function getPhoneNumber() {

    let phone =
        phoneInput.value
            .replace(
                /\D/g,
                ""
            );


    if (
        phone.startsWith("91") &&
        phone.length === 12
    ) {

        phone =
            phone.substring(2);

    }


    return phone;

}


function getFirebasePhone() {

    const phone =
        getPhoneNumber();


    return (
        "+91" +
        phone
    );

}


/* =========================================================
   VALIDATE PHONE
========================================================= */

function validatePhone() {

    const phone =
        getPhoneNumber();


    if (
        phone.length !== 10
    ) {

        showMessage(
            "Please enter a valid 10-digit Indian mobile number.",
            "error"
        );

        phoneInput.focus();

        return false;

    }


    if (
        !/^[6-9]\d{9}$/.test(
            phone
        )
    ) {

        showMessage(
            "Please enter a valid Indian mobile number starting with 6, 7, 8 or 9.",
            "error"
        );

        phoneInput.focus();

        return false;

    }


    return true;

}


/* =========================================================
   SEND OTP
========================================================= */

async function sendOTP() {

    if (
        busy
    ) {

        return;

    }


    clearMessage();


    if (
        !validatePhone()
    ) {

        return;

    }


    busy =
        true;


    setButtons(
        true
    );


    try {

        const FB =
            await loadFirebase();


        if (
            !FB.auth
        ) {

            throw new Error(
                "Firebase Authentication is not available."
            );

        }


        if (
            !FB.RecaptchaVerifier
        ) {

            throw new Error(
                "Firebase reCAPTCHA is not configured."
            );

        }


        /*
         * Firebase requires a reCAPTCHA verifier
         * before phone authentication.
         */

        if (
            window.riderxRecaptcha
        ) {

            try {

                window.riderxRecaptcha.clear();

            } catch (
                error
            ) {

                console.warn(
                    "reCAPTCHA cleanup warning:",
                    error
                );

            }

            window.riderxRecaptcha =
                null;

        }


        const verifier =
            new FB.RecaptchaVerifier(
                FB.auth,
                document.body,
                {

                    size:
                        "invisible",

                    callback:
                        function () {

                            console.log(
                                "RiderX reCAPTCHA verified."
                            );

                        },

                    "expired-callback":
                        function () {

                            showMessage(
                                "Security verification expired. Please send OTP again.",
                                "error"
                            );

                        }

                }
            );


        window.riderxRecaptcha =
            verifier;


        confirmationResult =
            await FB.signInWithPhoneNumber(
                FB.auth,
                getFirebasePhone(),
                verifier
            );


        otpSection.classList.add(
            "show"
        );


        phoneInput.disabled =
            true;


        sendOtpButton.style.display =
            "none";


        otpInput.focus();


        startTimer();


        showMessage(
            "OTP sent successfully. Check your mobile.",
            "success"
        );


    } catch (
        error
    ) {

        console.error(
            "RiderX OTP send error:",
            error
        );


        confirmationResult =
            null;


        showMessage(
            firebaseErrorMessage(
                error
            ),
            "error"
        );


        cleanupRecaptcha();


    } finally {

        busy =
            false;

        setButtons(
            false
        );

    }

}


/* =========================================================
   VERIFY OTP
========================================================= */

async function verifyOTP() {

    if (
        busy
    ) {

        return;

    }


    clearMessage();


    const otp =
        otpInput.value
            .replace(
                /\D/g,
                ""
            );


    if (
        !confirmationResult
    ) {

        showMessage(
            "Please request a new OTP first.",
            "error"
        );

        return;

    }


    if (
        otp.length !== 6
    ) {

        showMessage(
            "Please enter the 6-digit OTP.",
            "error"
        );

        otpInput.focus();

        return;

    }


    busy =
        true;


    setButtons(
        true
    );


    try {

        const result =
            await confirmationResult.confirm(
                otp
            );


        const firebaseUser =
            result.user;


        if (
            !firebaseUser ||
            !firebaseUser.uid
        ) {

            throw new Error(
                "Firebase could not verify your account."
            );

        }


        const profile =
            await findProfile(
                firebaseUser.uid
            );


        /*
         * Existing account:
         * verify the stored RiderX role.
         */

        if (
            profile
        ) {

            const role =
                normalizeRole(
                    profile.role ||
                    profile.userRole ||
                    profile.accountType
                );


            if (
                role !==
                selectedRole
            ) {

                await safeSignOut();


                throw new Error(
                    role === "rider"
                        ? "This mobile number belongs to a Rider account. Please use Rider login."
                        : "This mobile number belongs to a Customer account. Please use Customer login."
                );

            }


            if (
                isBlocked(
                    profile
                )
            ) {

                await safeSignOut();


                throw new Error(
                    "Your RiderX account is blocked or suspended. Please contact support."
                );

            }


            saveSession(
                firebaseUser,
                profile
            );


            showMessage(
                "OTP verified. Opening RiderX...",
                "success"
            );


            redirectByRole(
                selectedRole
            );


            return;

        }


        /*
         * No profile:
         *
         * Do NOT silently create a Customer/Rider role.
         * This prevents OTP login from creating an
         * incorrectly typed account.
         */

        await safeSignOut();


        throw new Error(
            "No RiderX account was found for this mobile number. Please register first."
        );


    } catch (
        error
    ) {

        console.error(
            "RiderX OTP verification error:",
            error
        );


        showMessage(
            firebaseErrorMessage(
                error
            ),
            "error"
        );


    } finally {

        busy =
            false;

        setButtons(
            false
        );

    }

}


/* =========================================================
   FIND USER PROFILE
========================================================= */

async function findProfile(
    uid
) {

    const FB =
        await loadFirebase();


    let profile =
        null;


    /*
     * Primary:
     * users/{uid}
     */

    try {

        const snapshot =
            await FB.getDoc(
                FB.doc(
                    FB.db,
                    "users",
                    uid
                )
            );


        if (
            snapshot.exists()
        ) {

            profile =
                snapshot.data() ||
                {};

            profile.uid =
                profile.uid ||
                uid;

        }

    } catch (
        error
    ) {

        console.warn(
            "RiderX users profile lookup:",
            error
        );

    }


    /*
     * Role-specific collection fallback.
     */

    if (
        !profile
    ) {

        const collection =
            selectedRole ===
            "rider"
                ? "riders"
                : "customers";


        try {

            const snapshot =
                await FB.getDoc(
                    FB.doc(
                        FB.db,
                        collection,
                        uid
                    )
                );


            if (
                snapshot.exists()
            ) {

                profile =
                    snapshot.data() ||
                    {};

                profile.uid =
                    profile.uid ||
                    uid;

            }

        } catch (
            error
        ) {

            console.warn(
                "RiderX role profile lookup:",
                error
            );

        }

    }


    return profile;

}


/* =========================================================
   BLOCK CHECK
========================================================= */

function isBlocked(
    profile
) {

    const status =
        String(
            profile.status ||
            profile.accountStatus ||
            profile.userStatus ||
            ""
        )
            .trim()
            .toLowerCase();


    return (
        profile.blocked === true ||
        profile.disabled === true ||
        [
            "blocked",
            "disabled",
            "suspended",
            "banned"
        ].includes(
            status
        )
    );

}


/* =========================================================
   SAVE SESSION
========================================================= */

function saveSession(
    firebaseUser,
    profile
) {

    const user = {

        ...profile,

        uid:
            firebaseUser.uid,

        id:
            firebaseUser.uid,

        role:
            selectedRole,

        userRole:
            selectedRole,

        accountType:
            selectedRole,

        name:
            profile.name ||
            profile.fullName ||
            profile.displayName ||
            firebaseUser.displayName ||
            (
                selectedRole ===
                "rider"
                    ? "RiderX Rider"
                    : "RiderX Customer"
            ),

        email:
            profile.email ||
            firebaseUser.email ||
            "",

        phone:
            profile.phone ||
            profile.mobile ||
            profile.phoneNumber ||
            firebaseUser.phoneNumber ||
            "",

        photoURL:
            profile.photoURL ||
            firebaseUser.photoURL ||
            "",

        loginMethod:
            "phone",

        loginAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "riderx_user",
        JSON.stringify(
            user
        )
    );


    if (
        selectedRole ===
        "rider"
    ) {

        localStorage.setItem(
            "riderx_rider",
            JSON.stringify(
                user
            )
        );

        localStorage.setItem(
            "riderx_rider_id",
            firebaseUser.uid
        );

    } else {

        localStorage.setItem(
            "riderx_customer",
            JSON.stringify(
                user
            )
        );

        localStorage.setItem(
            "riderx_customer_id",
            firebaseUser.uid
        );

    }


    localStorage.setItem(
        "riderx_role",
        selectedRole
    );

    localStorage.setItem(
        "userRole",
        selectedRole
    );

    localStorage.setItem(
        "riderx_selected_role",
        selectedRole
    );

}


/* =========================================================
   REDIRECT
========================================================= */

function redirectByRole(
    role
) {

    if (
        role ===
        "rider"
    ) {

        window.setTimeout(
            function () {

                window.location.replace(
                    "../rider/home.html"
                );

            },
            450
        );

        return;

    }


    window.setTimeout(
        function () {

            window.location.replace(
                "../customer/home.html"
            );

        },
        450
    );

}


/* =========================================================
   SIGN OUT
========================================================= */

async function safeSignOut() {

    try {

        const FB =
            await loadFirebase();


        if (
            FB.auth &&
            FB.signOut
        ) {

            await FB.signOut(
                FB.auth
            );

        }

    } catch (
        error
    ) {

        console.warn(
            "RiderX OTP sign-out warning:",
            error
        );

    }


    localStorage.removeItem(
        "riderx_user"
    );

    localStorage.removeItem(
        "riderx_rider"
    );

    localStorage.removeItem(
        "riderx_customer"
    );

}


/* =========================================================
   RECAPTCHA CLEANUP
========================================================= */

function cleanupRecaptcha() {

    if (
        window.riderxRecaptcha
    ) {

        try {

            window.riderxRecaptcha.clear();

        } catch (
            error
        ) {

            console.warn(
                "reCAPTCHA cleanup:",
                error
            );

        }

        window.riderxRecaptcha =
            null;

    }

}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    stopTimer();


    seconds =
        60;


    resendButton.classList.remove(
        "show"
    );


    timerBox.textContent =
        "OTP expires in 60 seconds";


    resendTimer =
        window.setInterval(
            function () {

                seconds--;


                if (
                    seconds <=
                    0
                ) {

                    stopTimer();


                    timerBox.textContent =
                        "OTP expired. Request a new OTP.";


                    resendButton.classList.add(
                        "show"
                    );


                    return;

                }


                timerBox.textContent =
                    "OTP expires in " +
                    seconds +
                    " seconds";

            },
            1000
        );

}


function stopTimer() {

    if (
        resendTimer
    ) {

        window.clearInterval(
            resendTimer
        );

        resendTimer =
            null;

    }

}


/* =========================================================
   RESEND
========================================================= */

resendButton.addEventListener(
    "click",
    async function () {

        otpInput.value =
            "";

        await sendOTP();

    }
);


/* =========================================================
   CHANGE NUMBER
========================================================= */

changeNumberButton.addEventListener(
    "click",
    function () {

        confirmationResult =
            null;


        stopTimer();


        otpSection.classList.remove(
            "show"
        );


        resendButton.classList.remove(
            "show"
        );


        phoneInput.disabled =
            false;


        sendOtpButton.style.display =
            "";


        otpInput.value =
            "";


        clearMessage();


        phoneInput.focus();

    }
);


/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
    "click",
    function () {

        stopTimer();

        cleanupRecaptcha();


        if (
            selectedRole ===
            "rider"
        ) {

            window.location.href =
                "./rider-login.html";

        } else {

            window.location.href =
                "./customer-login.html";

        }

    }
);


/* =========================================================
   SEND BUTTON
========================================================= */

sendOtpButton.addEventListener(
    "click",
    sendOTP
);


/* =========================================================
   VERIFY BUTTON
========================================================= */

verifyOtpButton.addEventListener(
    "click",
    verifyOTP
);


/* =========================================================
   INPUT FORMATTING
========================================================= */

phoneInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    10
                );

    }
);


otpInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    6
                );

    }
);


/* =========================================================
   ENTER KEY
========================================================= */

phoneInput.addEventListener(
    "keydown",
    function (
        event
    ) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendOTP();

        }

    }
);


otpInput.addEventListener(
    "keydown",
    function (
        event
    ) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            verifyOTP();

        }

    }
);


/* =========================================================
   BUTTON STATE
========================================================= */

function setButtons(
    disabled
) {

    sendOtpButton.disabled =
        disabled;

    verifyOtpButton.disabled =
        disabled;

    resendButton.disabled =
        disabled;

    changeNumberButton.disabled =
        disabled;

    backButton.disabled =
        disabled;

}


/* =========================================================
   FIREBASE ERROR MESSAGE
========================================================= */

function firebaseErrorMessage(
    error
) {

    const code =
        String(
            error?.code ||
            ""
        )
            .toLowerCase();


    const messages = {

        "auth/invalid-phone-number":
            "Please enter a valid mobile number.",

        "auth/missing-phone-number":
            "Mobile number is required.",

        "auth/too-many-requests":
            "Too many OTP requests. Please wait and try again later.",

        "auth/quota-exceeded":
            "OTP service limit has been reached. Please try again later.",

        "auth/invalid-verification-code":
            "The OTP is incorrect. Please check and try again.",

        "auth/code-expired":
            "The OTP has expired. Please request a new OTP.",

        "auth/session-expired":
            "OTP session expired. Please request a new OTP.",

        "auth/network-request-failed":
            "Network error. Check your internet connection.",

        "auth/captcha-check-failed":
            "Security verification failed. Please try again.",

        "auth/app-not-authorized":
            "This RiderX domain is not authorized for phone authentication.",

        "auth/operation-not-allowed":
            "Phone authentication is not enabled in Firebase."

    };


    if (
        messages[code]
    ) {

        return messages[code];

    }


    const message =
        String(
            error?.message ||
            ""
        );


    if (
        message
    ) {

        return message;

    }


    return (
        "OTP verification failed. Please try again."
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function () {

        stopTimer();

    }
);

</script>
