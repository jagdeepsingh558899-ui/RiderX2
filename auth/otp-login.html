<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#ffd400"
>

<meta
    name="description"
    content="RiderX secure OTP login"
>

<title>RiderX - OTP Login</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #070707;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.page {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));

    position: relative;
    overflow: hidden;
}

.page::before {
    content: "";

    position: absolute;

    width: 380px;
    height: 380px;

    top: -200px;
    right: -150px;

    border-radius: 50%;

    background: rgba(255, 212, 0, .08);

    pointer-events: none;
}

.page::after {
    content: "";

    position: absolute;

    width: 340px;
    height: 340px;

    bottom: -200px;
    left: -160px;

    border-radius: 50%;

    background: rgba(255, 212, 0, .05);

    pointer-events: none;
}

.card {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 430px;

    padding: 30px 22px 22px;

    border: 1px solid #292929;
    border-radius: 22px;

    background: #111;

    box-shadow:
        0 25px 80px rgba(0, 0, 0, .55);

    text-align: center;
}

.logo {
    width: 68px;
    height: 68px;

    margin: 0 auto 13px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 19px;

    background: #ffd400;
    color: #090909;

    font-size: 23px;
    font-weight: 1000;
}

.brand {
    margin-bottom: 22px;
}

.brand h1 {
    margin: 0;

    font-size: 25px;
    font-weight: 1000;
}

.brand h1 span {
    color: #ffd400;
}

.brand p {
    margin: 6px 0 0;

    color: #777;

    font-size: 10px;
}

.heading {
    margin-bottom: 17px;
}

.heading h2 {
    margin: 0;

    font-size: 19px;
    font-weight: 900;
}

.heading p {
    max-width: 330px;

    margin: 7px auto 0;

    color: #777;

    font-size: 10px;
    line-height: 1.6;
}

.role-badge {
    display: inline-flex;

    margin-top: 11px;

    padding: 7px 10px;

    border: 1px solid #443b00;
    border-radius: 8px;

    background: rgba(255, 212, 0, .07);

    color: #ffd400;

    font-size: 8px;
    font-weight: 900;
}

.phone-box {
    display: flex;

    gap: 8px;

    margin: 18px 0 14px;
}

.country-code {
    width: 66px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #333;
    border-radius: 10px;

    background: #191919;

    color: #ffd400;

    font-size: 11px;
    font-weight: 900;
}

.phone-input {
    flex: 1;

    width: 100%;
    height: 48px;

    padding: 0 13px;

    border: 1px solid #333;
    border-radius: 10px;

    outline: none;

    background: #191919;
    color: #fff;

    font-size: 13px;
}

.phone-input::placeholder {
    color: #555;
}

.phone-input:focus {
    border-color: #ffd400;

    box-shadow:
        0 0 0 2px rgba(255, 212, 0, .08);
}

.message {
    display: none;

    margin-bottom: 13px;

    padding: 10px;

    border-radius: 9px;

    font-size: 9px;
    line-height: 1.55;

    text-align: left;
}

.message.show {
    display: block;
}

.message.error {
    border: 1px solid #542828;

    background: #241414;

    color: #ff7777;
}

.message.success {
    border: 1px solid #275335;

    background: #132319;

    color: #65e58b;
}

.otp-title {
    margin: 16px 0 9px;

    color: #999;

    font-size: 9px;
    font-weight: 900;
}

.otp-inputs {
    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 7px;

    margin-bottom: 16px;
}

.otp-input {
    width: 100%;
    height: 48px;

    border: 1px solid #333;
    border-radius: 9px;

    outline: none;

    background: #191919;
    color: #fff;

    text-align: center;

    font-size: 18px;
    font-weight: 900;
}

.otp-input:focus {
    border-color: #ffd400;

    box-shadow:
        0 0 0 2px rgba(255, 212, 0, .08);
}

.otp-input.invalid {
    border-color: #e74c3c;

    background: #241414;
}

.primary-btn {
    width: 100%;
    min-height: 48px;

    border: 0;
    border-radius: 10px;

    background: #ffd400;

    color: #111;

    cursor: pointer;

    font-size: 11px;
    font-weight: 1000;
}

.primary-btn:disabled {
    opacity: .55;

    cursor: not-allowed;
}

.resend {
    margin-top: 13px;

    color: #777;

    font-size: 9px;
}

.resend button {
    border: 0;
    padding: 0;

    background: transparent;

    color: #ffd400;

    cursor: pointer;

    font-size: 9px;
    font-weight: 900;
}

.resend button:disabled {
    color: #555;

    cursor: not-allowed;
}

.timer {
    margin-top: 5px;

    min-height: 12px;

    color: #555;

    font-size: 8px;
}

.change-btn {
    width: 100%;

    margin-top: 15px;

    min-height: 43px;

    border: 1px solid #333;
    border-radius: 9px;

    background: #171717;

    color: #aaa;

    cursor: pointer;

    font-size: 9px;
    font-weight: 900;
}

.change-btn:hover {
    border-color: #ffd400;
    color: #ffd400;
}

.footer {
    margin-top: 18px;

    color: #444;

    font-size: 8px;
}

#recaptcha-container {
    min-height: 0;
}

.loader {
    display: inline-block;

    width: 13px;
    height: 13px;

    margin-right: 7px;

    vertical-align: -2px;

    border: 2px solid rgba(0,0,0,.25);

    border-top-color: #111;

    border-radius: 50%;

    animation: spin .7s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

@media (max-width: 420px) {

    .card {
        padding: 25px 17px 19px;

        border-radius: 18px;
    }

    .otp-inputs {
        gap: 5px;
    }

    .otp-input {
        height: 44px;

        font-size: 16px;
    }

}

@media (max-width: 340px) {

    .otp-inputs {
        gap: 3px;
    }

    .otp-input {
        height: 41px;

        font-size: 15px;
    }

}

</style>

</head>


<body>

<main class="page">

<section class="card">


<div class="brand">

    <div class="logo">
        RX
    </div>

    <h1>
        Rider<span>X</span>
    </h1>

    <p>
        Secure mobile authentication
    </p>

</div>


<div class="heading">

    <h2>
        Login with OTP
    </h2>

    <p>
        Enter your Indian mobile number.
        We will send a secure 6-digit verification code.
    </p>

    <div
        class="role-badge"
        id="roleBadge"
    >
        CUSTOMER LOGIN
    </div>

</div>


<div
    class="message error"
    id="errorBox"
    role="alert"
    aria-live="polite"
></div>


<div
    class="message success"
    id="successBox"
    role="status"
    aria-live="polite"
></div>


<form
    id="otpForm"
    novalidate
>


<div class="phone-box">

    <div class="country-code">
        +91
    </div>

    <input
        id="phone"
        class="phone-input"
        type="tel"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="10"
        placeholder="10-digit mobile number"
        required
    >

</div>


<div id="recaptcha-container"></div>


<button
    type="button"
    class="primary-btn"
    id="sendOtpButton"
>
    Send OTP
</button>


<div class="otp-title">
    ENTER 6-DIGIT OTP
</div>


<div class="otp-inputs">

    <input
        class="otp-input"
        maxlength="1"
        inputmode="numeric"
        autocomplete="one-time-code"
        aria-label="OTP digit 1"
    >

    <input
        class="otp-input"
        maxlength="1"
        inputmode="numeric"
        aria-label="OTP digit 2"
    >

    <input
        class="otp-input"
        maxlength="1"
        inputmode="numeric"
        aria-label="OTP digit 3"
    >

    <input
        class="otp-input"
        maxlength="1"
        inputmode="numeric"
        aria-label="OTP digit 4"
    >

    <input
        class="otp-input"
        maxlength="1"
        inputmode="numeric"
        aria-label="OTP digit 5"
    >

    <input
        class="otp-input"
        maxlength="1"
        inputmode="numeric"
        aria-label="OTP digit 6"
    >

</div>


<button
    type="submit"
    class="primary-btn"
    id="verifyButton"
    disabled
>
    Verify & Continue
</button>


<div class="resend">

    Didn't receive the code?

    <button
        type="button"
        id="resendButton"
        disabled
    >
        Resend OTP
    </button>

</div>


<div
    class="timer"
    id="timer"
></div>


</form>


<button
    type="button"
    class="change-btn"
    id="changeButton"
>
    ← Change Mobile / Back to Login
</button>


<div class="footer">
    © 2026 RiderX • Chandigarh
</div>


</section>

</main>


<script type="module">

"use strict";


import {

    auth,
    db,

    RecaptchaVerifier,
    signInWithPhoneNumber,
    signOut,

    doc,
    getDoc,
    setDoc,
    serverTimestamp

} from "../firebase/firebase-config.js";


const phoneInput =
    document.getElementById(
        "phone"
    );


const sendOtpButton =
    document.getElementById(
        "sendOtpButton"
    );


const verifyButton =
    document.getElementById(
        "verifyButton"
    );


const resendButton =
    document.getElementById(
        "resendButton"
    );


const changeButton =
    document.getElementById(
        "changeButton"
    );


const timer =
    document.getElementById(
        "timer"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const successBox =
    document.getElementById(
        "successBox"
    );


const roleBadge =
    document.getElementById(
        "roleBadge"
    );


const otpInputs =
    Array.from(
        document.querySelectorAll(
            ".otp-input"
        )
    );


let selectedRole =
    getSelectedRole();


let confirmationResult =
    null;


let recaptchaVerifier =
    null;


let recaptchaWidgetId =
    null;


let sending =
    false;


let verifying =
    false;


let countdown =
    0;


let timerHandle =
    null;


applyRoleUI();


/*
 * Restore phone number when the user comes
 * back from another authentication page.
 */

const savedPhone =
    localStorage.getItem(
        "riderx_otp_phone"
    );


if (
    savedPhone
) {

    phoneInput.value =
        normalizePhone(
            savedPhone
        );

}


/*
 * Keep the phone field numeric.
 */

phoneInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    10
                );

    }
);


/*
 * OTP input handling.
 */

otpInputs.forEach(
    function (
        input,
        index
    ) {

        input.addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(
                            /\D/g,
                            ""
                        )
                        .slice(
                            0,
                            1
                        );


                this.classList.remove(
                    "invalid"
                );


                if (
                    this.value &&
                    index <
                    otpInputs.length - 1
                ) {

                    otpInputs[
                        index + 1
                    ].focus();

                }


                updateVerifyButton();

            }
        );


        input.addEventListener(
            "keydown",
            function (
                event
            ) {

                if (
                    event.key ===
                    "Backspace" &&
                    !this.value &&
                    index > 0
                ) {

                    otpInputs[
                        index - 1
                    ].focus();

                }


                if (
                    event.key ===
                    "ArrowLeft" &&
                    index > 0
                ) {

                    otpInputs[
                        index - 1
                    ].focus();

                }


                if (
                    event.key ===
                    "ArrowRight" &&
                    index <
                    otpInputs.length - 1
                ) {

                    otpInputs[
                        index + 1
                    ].focus();

                }

            }
        );


        input.addEventListener(
            "paste",
            function (
                event
            ) {

                event.preventDefault();


                const clipboard =
                    event.clipboardData ||
                    window.clipboardData;


                const pasted =
                    (
                        clipboard?.getData(
                            "text"
                        ) ||
                        ""
                    )
                        .replace(
                            /\D/g,
                            ""
                        )
                        .slice(
                            0,
                            6
                        );


                if (
                    !pasted
                ) {

                    return;

                }


                pasted
                    .split("")
                    .forEach(
                        function (
                            digit,
                            digitIndex
                        ) {

                            if (
                                otpInputs[
                                    digitIndex
                                ]
                            ) {

                                otpInputs[
                                    digitIndex
                                ].value =
                                    digit;

                            }

                        }
                    );


                otpInputs[
                    Math.min(
                        pasted.length,
                        5
                    )
                ].focus();


                updateVerifyButton();

            }
        );

    }
);


/*
 * Send OTP.
 */

sendOtpButton.addEventListener(
    "click",
    async function () {

        await sendOtp();

    }
);


/*
 * Resend OTP.
 */

resendButton.addEventListener(
    "click",
    async function () {

        if (
            sending ||
            resendButton.disabled
        ) {

            return;

        }


        resetRecaptcha();


        await sendOtp();

    }
);


/*
 * Verify OTP.
 */

document
    .getElementById(
        "otpForm"
    )
    .addEventListener(
        "submit",
        async function (
            event
        ) {

            event.preventDefault();


            if (
                verifying
            ) {

                return;

            }


            clearMessages();


            const otp =
                getOtp();


            if (
                !isCompleteOtp()
            ) {

                showError(
                    "Please enter the complete 6-digit OTP."
                );


                otpInputs.forEach(
                    function (
                        input
                    ) {

                        if (
                            !input.value
                        ) {

                            input.classList.add(
                                "invalid"
                            );

                        }

                    }
                );


                otpInputs[0].focus();

                return;

            }


            if (
                !confirmationResult
            ) {

                showError(
                    "Your OTP session has expired. Please request a new OTP."
                );

                return;

            }


            verifying =
                true;


            setVerifyLoading(
                true
            );


            try {

                const result =
                    await confirmationResult.confirm(
                        otp
                    );


                const firebaseUser =
                    result.user;


                if (
                    !firebaseUser
                ) {

                    throw new Error(
                        "Firebase authentication did not return a user."
                    );

                }


                await completeLogin(
                    firebaseUser
                );


            } catch (
                error
            ) {

                console.error(
                    "RiderX OTP verification error:",
                    error
                );


                showError(
                    firebaseErrorMessage(
                        error
                    )
                );


                clearOtp();


            } finally {

                verifying =
                    false;


                setVerifyLoading(
                    false
                );

            }

        }
    );


/*
 * Send OTP implementation.
 */

async function sendOtp() {

    if (
        sending
    ) {

        return;

    }


    const phone =
        normalizePhone(
            phoneInput.value
        );


    if (
        !isValidPhone(
            phone
        )
    ) {

        showError(
            "Please enter a valid 10-digit Indian mobile number."
        );

        phoneInput.focus();

        return;

    }


    clearMessages();


    sending =
        true;


    setSendLoading(
        true
    );


    try {

        await ensureRecaptcha();


        const fullPhone =
            "+91" +
            phone;


        confirmationResult =
            await signInWithPhoneNumber(
                auth,
                fullPhone,
                recaptchaVerifier
            );


        localStorage.setItem(
            "riderx_otp_phone",
            phone
        );


        clearOtp();


        showSuccess(
            "OTP sent successfully to +91 " +
            phone
        );


        startResendTimer();


        setTimeout(
            function () {

                otpInputs[0].focus();

            },
            150
        );


    } catch (
        error
    ) {

        console.error(
            "RiderX OTP send error:",
            error
        );


        confirmationResult =
            null;


        resetRecaptcha();


        showError(
            firebaseErrorMessage(
                error
            )
        );


    } finally {

        sending =
            false;


        setSendLoading(
            false
        );

    }

}


/*
 * Initialize invisible reCAPTCHA safely.
 */

async function ensureRecaptcha() {

    if (
        recaptchaVerifier
    ) {

        return;

    }


    recaptchaVerifier =
        new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
                size:
                    "invisible",

                callback:
                    function () {

                        console.log(
                            "RiderX reCAPTCHA verified."
                        );

                    },

                "expired-callback":
                    function () {

                        showError(
                            "Security verification expired. Please request OTP again."
                        );

                    }

            }
        );


    recaptchaWidgetId =
        await recaptchaVerifier.render();

}


/*
 * Reset reCAPTCHA.
 */

function resetRecaptcha() {

    try {

        if (
            recaptchaVerifier
        ) {

            recaptchaVerifier.clear();

        }

    } catch (
        error
    ) {

        console.warn(
            "RiderX reCAPTCHA reset warning:",
            error
        );

    }


    recaptchaVerifier =
        null;


    recaptchaWidgetId =
        null;

}


/*
 * Complete authenticated RiderX login.
 */

async function completeLogin(
    firebaseUser
) {

    try {

        const profile =
            await getProfile(
                firebaseUser.uid
            );


        /*
         * If the requested role is Customer/Rider,
         * an existing profile must match it.
         */

        if (
            profile
        ) {

            const profileRole =
                getProfileRole(
                    profile
                );


            if (
                profileRole &&
                profileRole !==
                selectedRole
            ) {

                /*
                 * Do not silently switch the user's
                 * account type.
                 */

                await safeSignOut();


                clearSession();


                showError(
                    "This mobile number is already registered as a " +
                    profileRole +
                    " account. Please use the " +
                    profileRole +
                    " login."
                );


                return;

            }

        }


        /*
         * New phone account.
         */

        if (
            !profile
        ) {

            const newProfile =
                await createPhoneProfile(
                    firebaseUser
                );


            await saveSession(
                firebaseUser,
                newProfile
            );


            showSuccess(
                "OTP verified. Your RiderX account has been created."
            );


            setTimeout(
                function () {

                    redirectByRole(
                        selectedRole,
                        newProfile
                    );

                },
                650
            );


            return;

        }


        /*
         * Existing Rider account:
         * OTP must NOT bypass approval.
         */

        if (
            selectedRole ===
            "rider"
        ) {

            const access =
                riderAccess(
                    profile
                );


            if (
                !access.allowed
            ) {

                await safeSignOut();

                clearSession();


                showError(
                    access.message
                );


                return;

            }

        }


        /*
         * Existing valid account.
         */

        await saveSession(
            firebaseUser,
            profile
        );


        showSuccess(
            "OTP verified successfully. Opening RiderX..."
        );


        setTimeout(
            function () {

                redirectByRole(
                    selectedRole,
                    profile
                );

            },
            650
        );


    } catch (
        error
    ) {

        console.error(
            "RiderX profile/session error:",
            error
        );


        await safeSignOut();

        clearSession();


        showError(
            "OTP was verified, but RiderX could not load your account profile. Please try again."
        );

    }

}


/*
 * Load profile.
 */

async function getProfile(
    uid
) {

    const userSnapshot =
        await getDoc(
            doc(
                db,
                "users",
                uid
            )
        );


    if (
        userSnapshot.exists()
    ) {

        return {

            ...userSnapshot.data(),

            uid:
                userSnapshot.data().uid ||
                uid

        };

    }


    if (
        selectedRole ===
        "customer"
    ) {

        const customerSnapshot =
            await getDoc(
                doc(
                    db,
                    "customers",
                    uid
                )
            );


        if (
            customerSnapshot.exists()
        ) {

            return {

                ...customerSnapshot.data(),

                uid:
                    customerSnapshot.data().uid ||
                    uid

            };

        }

    }


    if (
        selectedRole ===
        "rider"
    ) {

        const riderSnapshot =
            await getDoc(
                doc(
                    db,
                    "riders",
                    uid
                )
            );


        if (
            riderSnapshot.exists()
        ) {

            return {

                ...riderSnapshot.data(),

                uid:
                    riderSnapshot.data().uid ||
                    uid

            };

        }

    }


    return null;

}


/*
 * Create profile for a brand-new phone-auth user.
 */

async function createPhoneProfile(
    firebaseUser
) {

    const role =
        selectedRole;


    const fullPhone =
        firebaseUser.phoneNumber ||
        "+91" +
        normalizePhone(
            phoneInput.value
        );


    const displayName =
        firebaseUser.displayName ||
        (
            role === "rider"
                ? "Rider"
                : "RiderX Customer"
        );


    const profile = {

        uid:
            firebaseUser.uid,

        name:
            displayName,

        fullName:
            displayName,

        displayName:
            firebaseUser.displayName ||
            "",

        email:
            firebaseUser.email ||
            "",

        phone:
            normalizePhone(
                phoneInput.value
            ),

        mobile:
            normalizePhone(
                phoneInput.value
            ),

        phoneNumber:
            fullPhone,

        role:
            role,

        userRole:
            role,

        accountType:
            role,

        status:
            role === "rider"
                ? "pending"
                : "active",

        approvalStatus:
            role === "rider"
                ? "pending"
                : "approved",

        applicationStatus:
            role === "rider"
                ? "pending"
                : "approved",

        verificationStatus:
            role === "rider"
                ? "pending"
                : "approved",

        approved:
            role !== "rider",

        isApproved:
            role !== "rider",

        city:
            "Chandigarh",

        photoURL:
            firebaseUser.photoURL ||
            "",

        rating:
            5,

        ratingCount:
            0,

        walletBalance:
            0,

        totalRides:
            0,

        completedRides:
            0,

        cancelledRides:
            0,

        isOnline:
            false,

        online:
            false,

        currentRideId:
            null,

        vehicleType:
            role === "rider"
                ? "bike"
                : null,

        vehicleNumber:
            "",

        vehicleModel:
            "",

        vehicleBrand:
            "",

        onboardingCompleted:
            role !== "rider",

        loginMethod:
            "phone",

        createdAt:
            serverTimestamp(),

        updatedAt:
            serverTimestamp()

    };


    /*
     * Primary profile.
     */

    await setDoc(
        doc(
            db,
            "users",
            firebaseUser.uid
        ),
        profile,
        {
            merge:
                true
        }
    );


    /*
     * Keep RiderX role collections compatible
     * with the current project.
     */

    if (
        role ===
        "rider"
    ) {

        await setDoc(
            doc(
                db,
                "riders",
                firebaseUser.uid
            ),
            {

                ...profile,

                riderId:
                    firebaseUser.uid,

                driverId:
                    firebaseUser.uid,

                applicationStatus:
                    "pending",

                verificationStatus:
                    "pending",

                isApproved:
                    false,

                onboardingCompleted:
                    false,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:
                    true
            }
        );

    } else {

        await setDoc(
            doc(
                db,
                "customers",
                firebaseUser.uid
            ),
            {

                ...profile,

                customerId:
                    firebaseUser.uid,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:
                    true
            }
        );

    }


    return {

        ...profile,

        uid:
            firebaseUser.uid

    };

}


/*
 * Rider approval/access check.
 */

function riderAccess(
    profile
) {

    const status =
        String(
            profile.approvalStatus ||
            profile.applicationStatus ||
            profile.verificationStatus ||
            profile.status ||
            ""
        )
            .trim()
            .toLowerCase();


    if (
        profile.blocked === true ||
        profile.disabled === true ||
        status === "blocked" ||
        status === "disabled" ||
        status === "suspended"
    ) {

        return {

            allowed:
                false,

            message:
                "Your RiderX rider account is blocked or suspended. Please contact support."

        };

    }


    if (
        profile.rejected === true ||
        status === "rejected"
    ) {

        return {

            allowed:
                false,

            message:
                "Your RiderX rider application is rejected. Please contact support."

        };

    }


    if (
        profile.approved === false ||
        profile.isApproved === false ||
        status === "pending" ||
        status === "waiting" ||
        status === "under_review" ||
        status === "under-review"
    ) {

        return {

            allowed:
                false,

            message:
                "Your rider account is waiting for RiderX approval. You cannot enter the Driver Partner app until approval."

        };

    }


    return {

        allowed:
            true,

        message:
            ""

    };

}


/*
 * Get role from Firestore.
 */

function getProfileRole(
    profile
) {

    const raw =
        profile.role ||
        profile.userRole ||
        profile.accountType ||
        "";


    if (
        !raw
    ) {

        return "";

    }


    return normalizeRole(
        raw
    );

}


/*
 * Save common local session.
 */

async function saveSession(
    firebaseUser,
    profile
) {

    const sessionRole =
        selectedRole;


    const safeProfile = {

        uid:
            firebaseUser.uid,

        id:
            firebaseUser.uid,

        name:
            profile.name ||
            profile.fullName ||
            profile.displayName ||
            (
                sessionRole === "rider"
                    ? "RiderX Rider"
                    : "RiderX Customer"
            ),

        fullName:
            profile.fullName ||
            profile.name ||
            profile.displayName ||
            "",

        displayName:
            profile.displayName ||
            firebaseUser.displayName ||
            "",

        email:
            profile.email ||
            firebaseUser.email ||
            "",

        phone:
            normalizePhone(
                profile.phone ||
                profile.mobile ||
                firebaseUser.phoneNumber ||
                phoneInput.value
            ),

        mobile:
            normalizePhone(
                profile.phone ||
                profile.mobile ||
                firebaseUser.phoneNumber ||
                phoneInput.value
            ),

        phoneNumber:
            firebaseUser.phoneNumber ||
            "+91" +
            normalizePhone(
                phoneInput.value
            ),

        role:
            sessionRole,

        userRole:
            sessionRole,

        accountType:
            sessionRole,

        status:
            profile.status ||
            (
                sessionRole === "rider"
                    ? "pending"
                    : "active"
            ),

        approvalStatus:
            profile.approvalStatus ||
            profile.applicationStatus ||
            (
                sessionRole === "rider"
                    ? "pending"
                    : "approved"
            ),

        approved:
            profile.approved !== false &&
            profile.isApproved !== false,

        city:
            profile.city ||
            "Chandigarh",

        photoURL:
            profile.photoURL ||
            firebaseUser.photoURL ||
            "",

        vehicleType:
            profile.vehicleType ||
            (
                sessionRole === "rider"
                    ? "bike"
                    : null
            ),

        vehicleNumber:
            profile.vehicleNumber ||
            "",

        vehicleModel:
            profile.vehicleModel ||
            "",

        vehicleBrand:
            profile.vehicleBrand ||
            "",

        rating:
            numberValue(
                profile.rating,
                5
            ),

        walletBalance:
            numberValue(
                profile.walletBalance,
                0
            ),

        totalRides:
            numberValue(
                profile.totalRides,
                0
            ),

        completedRides:
            numberValue(
                profile.completedRides,
                0
            ),

        cancelledRides:
            numberValue(
                profile.cancelledRides,
                0
            ),

        currentRideId:
            profile.currentRideId ||
            null,

        loginMethod:
            "phone",

        loginAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "riderx_user",
        JSON.stringify(
            safeProfile
        )
    );


    localStorage.setItem(
        "userRole",
        sessionRole
    );


    localStorage.setItem(
        "riderx_role",
        sessionRole
    );


    localStorage.setItem(
        "riderx_selected_role",
        sessionRole
    );


    if (
        sessionRole ===
        "rider"
    ) {

        localStorage.setItem(
            "riderx_rider",
            JSON.stringify(
                safeProfile
            )
        );


        localStorage.setItem(
            "riderx_rider_id",
            firebaseUser.uid
        );


        localStorage.removeItem(
            "riderx_customer"
        );

        localStorage.removeItem(
            "riderx_customer_id"
        );

    } else {

        localStorage.setItem(
            "riderx_customer",
            JSON.stringify(
                safeProfile
            )
        );


        localStorage.setItem(
            "riderx_customer_id",
            firebaseUser.uid
        );


        localStorage.removeItem(
            "riderx_rider"
        );

        localStorage.removeItem(
            "riderx_rider_id"
        );

    }


    localStorage.removeItem(
        "riderx_otp_phone"
    );

    localStorage.removeItem(
        "riderx_reset_phone"
    );

    localStorage.removeItem(
        "riderx_phone"
    );

}


/*
 * Clear local session.
 */

function clearSession() {

    localStorage.removeItem(
        "riderx_user"
    );

    localStorage.removeItem(
        "userRole"
    );

    localStorage.removeItem(
        "riderx_role"
    );

    localStorage.removeItem(
        "riderx_selected_role"
    );

    localStorage.removeItem(
        "riderx_rider"
    );

    localStorage.removeItem(
        "riderx_rider_id"
    );

    localStorage.removeItem(
        "riderx_customer"
    );

    localStorage.removeItem(
        "riderx_customer_id"
    );

}


/*
 * Redirect only according to the selected
 * authentication role.
 */

function redirectByRole(
    role,
    profile
) {

    const normalizedRole =
        normalizeRole(
            role
        );


    if (
        normalizedRole ===
        "rider"
    ) {

        window.location.replace(
            "../rider/home.html"
        );

        return;

    }


    window.location.replace(
        "../customer/home.html"
    );

}


/*
 * Back to correct login page.
 */

changeButton.addEventListener(
    "click",
    function () {

        goBackToLogin();

    }
);


function goBackToLogin() {

    resetRecaptcha();

    clearOtp();

    clearMessages();


    if (
        selectedRole ===
        "rider"
    ) {

        window.location.replace(
            "./rider-login.html"
        );

    } else {

        window.location.replace(
            "./customer-login.html"
        );

    }

}


/*
 * Role selection.
 */

function getSelectedRole() {

    const value =
        String(
            localStorage.getItem(
                "riderx_selected_role"
            ) ||
            localStorage.getItem(
                "riderx_role"
            ) ||
            "customer"
        )
            .trim()
            .toLowerCase();


    if (
        value === "rider" ||
        value === "driver" ||
        value === "captain" ||
        value === "partner"
    ) {

        return "rider";

    }


    return "customer";

}


function applyRoleUI() {

    if (
        selectedRole ===
        "rider"
    ) {

        roleBadge.textContent =
            "RIDER / DRIVER PARTNER";

    } else {

        roleBadge.textContent =
            "CUSTOMER LOGIN";

    }

}


/*
 * OTP helpers.
 */

function getOtp() {

    return otpInputs
        .map(
            function (
                input
            ) {

                return input.value;

            }
        )
        .join("");

}


function isCompleteOtp() {

    return /^\d{6}$/.test(
        getOtp()
    );

}


function clearOtp() {

    otpInputs.forEach(
        function (
            input
        ) {

            input.value =
                "";

            input.classList.remove(
                "invalid"
            );

        }
    );


    updateVerifyButton();

}


function updateVerifyButton() {

    verifyButton.disabled =
        !isCompleteOtp() ||
        verifying ||
        !confirmationResult;

}


/*
 * Resend timer.
 */

function startResendTimer() {

    clearInterval(
        timerHandle
    );


    countdown =
        30;


    resendButton.disabled =
        true;


    timer.textContent =
        "You can resend in " +
        countdown +
        "s";


    timerHandle =
        setInterval(
            function () {

                countdown -= 1;


                if (
                    countdown <= 0
                ) {

                    clearInterval(
                        timerHandle
                    );


                    timer.textContent =
                        "";


                    resendButton.disabled =
                        false;


                    return;

                }


                timer.textContent =
                    "You can resend in " +
                    countdown +
                    "s";

            },
            1000
        );

}


/*
 * Loading states.
 */

function setSendLoading(
    loading
) {

    sendOtpButton.disabled =
        loading;


    if (
        loading
    ) {

        sendOtpButton.innerHTML =
            '<span class="loader"></span>Sending OTP...';

    } else {

        sendOtpButton.textContent =
            "Send OTP";

    }

}


function setVerifyLoading(
    loading
) {

    verifyButton.disabled =
        loading ||
        !isCompleteOtp();


    if (
        loading
    ) {

        verifyButton.innerHTML =
            '<span class="loader"></span>Verifying...';

    } else {

        verifyButton.textContent =
            "Verify & Continue";

        updateVerifyButton();

    }

}


/*
 * Phone helpers.
 */

function normalizePhone(
    value
) {

    return String(
        value ||
        ""
    )
        .replace(
            /\D/g,
            ""
        )
        .slice(
            -10
        );

}


function isValidPhone(
    phone
) {

    return /^[6-9]\d{9}$/.test(
        phone
    );

}


/*
 * Role normalization.
 */

function normalizeRole(
    role
) {

    const value =
        String(
            role ||
            ""
        )
            .trim()
            .toLowerCase();


    if (
        value === "rider" ||
        value === "driver" ||
        value === "captain" ||
        value === "partner"
    ) {

        return "rider";

    }


    if (
        value === "admin" ||
        value === "administrator"
    ) {

        return "admin";

    }


    return "customer";

}


/*
 * Number helper.
 */

function numberValue(
    value,
    fallback
) {

    const number =
        Number(
            value
        );


    return Number.isFinite(
        number
    )
        ? number
        : fallback;

}


/*
 * UI messages.
 */

function clearMessages() {

    errorBox.textContent =
        "";

    successBox.textContent =
        "";

    errorBox.classList.remove(
        "show"
    );

    successBox.classList.remove(
        "show"
    );

}


function showError(
    message
) {

    successBox.classList.remove(
        "show"
    );

    successBox.textContent =
        "";


    errorBox.textContent =
        message;

    errorBox.classList.add(
        "show"
    );

}


function showSuccess(
    message
) {

    errorBox.classList.remove(
        "show"
    );

    errorBox.textContent =
        "";


    successBox.textContent =
        message;

    successBox.classList.add(
        "show"
    );

}


/*
 * Firebase sign-out.
 */

async function safeSignOut() {

    try {

        await signOut(
            auth
        );

    } catch (
        error
    ) {

        console.warn(
            "RiderX sign-out warning:",
            error
        );

    }

}


/*
 * Firebase error translator.
 */

function firebaseErrorMessage(
    error
) {

    const code =
        String(
            error?.code ||
            ""
        )
            .toLowerCase();


    switch (
        code
    ) {

        case "auth/invalid-phone-number":

            return "Please enter a valid Indian mobile number.";


        case "auth/missing-phone-number":

            return "Please enter your mobile number.";


        case "auth/invalid-verification-code":

            return "The OTP is incorrect. Please check and try again.";


        case "auth/code-expired":

            return "This OTP has expired. Please request a new OTP.";


        case "auth/too-many-requests":

            return "Too many attempts. Please wait and try again later.";


        case "auth/quota-exceeded":

            return "OTP service limit has been reached. Please try again later.";


        case "auth/captcha-check-failed":

            return "Security verification failed. Please refresh and try again.";


        case "auth/network-request-failed":

            return "Network error. Check your internet connection.";


        case "auth/operation-not-allowed":

            return "Phone authentication is not enabled in Firebase.";


        case "auth/app-not-authorized":

            return "This RiderX domain is not authorized for Firebase Phone Authentication.";


        case "permission-denied":

            return "Firebase permission denied. Please check Firestore security rules.";


        default:

            if (
                String(
                    error?.message ||
                    ""
                )
                    .toLowerCase()
                    .includes(
                        "permission"
                    )
            ) {

                return "Firebase permission denied. Please check Firestore security rules.";

            }


            return (
                error?.message ||
                "OTP login failed. Please try again."
            );

    }

}


/*
 * Cleanup when leaving the page.
 */

window.addEventListener(
    "beforeunload",
    function () {

        clearInterval(
            timerHandle
        );

    }
);

</script>
