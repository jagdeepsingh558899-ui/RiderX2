</main><div id="recaptcha-container"></div><script type="module">

"use strict";

/* =========================================================
   RIDERX 2.0
   REAL FIREBASE PHONE OTP LOGIN
   File: auth/otp-login.html

   IMPORTANT:
   - No demo OTP
   - No fake local authentication
   - Firebase Authentication is the source of truth
   - Firestore profile is required
========================================================= */


/* =========================================================
   DOM
========================================================= */

const phoneInput =
    document.getElementById("phone");

const otpInput =
    document.getElementById("otp");

const sendOtpButton =
    document.getElementById("sendOtp");

const verifyOtpButton =
    document.getElementById("verifyOtp");

const otpSection =
    document.getElementById("otpSection");

const resendButton =
    document.getElementById("resend");

const changeNumberButton =
    document.getElementById("changeNumber");

const backButton =
    document.getElementById("back");

const messageBox =
    document.getElementById("message");

const timerBox =
    document.getElementById("timer");

const roleBadge =
    document.getElementById("roleBadge");

const recaptchaContainer =
    document.getElementById("recaptcha-container");


/* =========================================================
   STATE
========================================================= */

let FB = null;

let confirmationResult = null;

let recaptchaVerifier = null;

let timerId = null;

let seconds = 60;

let busy = false;

let selectedRole = "customer";

let currentPhone = "";


/* =========================================================
   ROLE
========================================================= */

function normalizeRole(value) {

    const role =
        String(value || "")
            .trim()
            .toLowerCase();

    if (
        [
            "rider",
            "driver",
            "partner",
            "captain",
            "driver_partner"
        ].includes(role)
    ) {
        return "rider";
    }

    if (
        [
            "customer",
            "user",
            "passenger"
        ].includes(role)
    ) {
        return "customer";
    }

    return null;
}


function detectRole() {

    try {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const urlRole =
            normalizeRole(
                params.get("role")
            );

        if (urlRole) {
            return urlRole;
        }

    } catch (error) {

        console.warn(
            "RiderX role URL detection failed:",
            error
        );
    }


    const keys = [
        "riderx_selected_role",
        "riderx_role",
        "userRole"
    ];


    for (const key of keys) {

        const role =
            normalizeRole(
                localStorage.getItem(key)
            );

        if (role) {
            return role;
        }
    }


    return "customer";
}


selectedRole =
    detectRole();


if (
    selectedRole !== "customer" &&
    selectedRole !== "rider"
) {
    selectedRole = "customer";
}


roleBadge.textContent =
    selectedRole === "rider"
        ? "RIDER / DRIVER PARTNER"
        : "CUSTOMER";


localStorage.setItem(
    "riderx_selected_role",
    selectedRole
);

localStorage.setItem(
    "riderx_role",
    selectedRole
);


/* =========================================================
   FIREBASE
========================================================= */

async function loadFirebase() {

    if (FB) {
        return FB;
    }


    FB =
        await import(
            "../firebase/firebase-config.js"
        );


    validateFirebase();


    return FB;
}


function validateFirebase() {

    const required = [
        "auth",
        "db",
        "signInWithPhoneNumber",
        "RecaptchaVerifier",
        "getDoc",
        "doc"
    ];


    const missing =
        required.filter(
            key =>
                !FB ||
                typeof FB[key] === "undefined"
        );


    if (missing.length) {

        console.error(
            "RiderX Firebase exports missing:",
            missing
        );

        throw new Error(
            "RiderX Firebase configuration is incomplete. Missing: " +
            missing.join(", ")
        );
    }
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "info"
) {

    messageBox.textContent =
        String(text || "");

    messageBox.className =
        "message show " + type;
}


function clearMessage() {

    messageBox.textContent = "";

    messageBox.className =
        "message";
}


/* =========================================================
   PHONE
========================================================= */

function normalizePhone(value) {

    let phone =
        String(value || "")
            .replace(/\D/g, "");


    if (
        phone.startsWith("91") &&
        phone.length === 12
    ) {
        phone =
            phone.substring(2);
    }


    return phone.slice(0, 10);
}


function firebasePhone() {

    return "+91" + normalizePhone(
        phoneInput.value
    );
}


function validatePhone() {

    const phone =
        normalizePhone(
            phoneInput.value
        );


    if (
        !/^[6-9]\d{9}$/.test(phone)
    ) {

        showMessage(
            "Please enter a valid 10-digit Indian mobile number.",
            "error"
        );

        phoneInput.focus();

        return false;
    }


    phoneInput.value =
        phone;


    return true;
}


/* =========================================================
   RECAPTCHA
========================================================= */

async function createRecaptcha() {

    const firebase =
        await loadFirebase();


    cleanupRecaptcha();


    if (
        !recaptchaContainer
    ) {

        throw new Error(
            "RiderX reCAPTCHA container is missing."
        );
    }


    recaptchaVerifier =
        new firebase.RecaptchaVerifier(
            firebase.auth,
            recaptchaContainer,
            {
                size: "invisible",

                callback: function () {

                    console.log(
                        "RiderX reCAPTCHA verified."
                    );
                },

                "expired-callback": function () {

                    showMessage(
                        "Security verification expired. Please request OTP again.",
                        "error"
                    );

                    cleanupRecaptcha();
                },

                "error-callback": function () {

                    showMessage(
                        "Security verification failed. Please try again.",
                        "error"
                    );

                    cleanupRecaptcha();
                }
            }
        );


    try {

        await recaptchaVerifier.render();

    } catch (error) {

        cleanupRecaptcha();

        throw error;
    }


    return recaptchaVerifier;
}


function cleanupRecaptcha() {

    if (recaptchaVerifier) {

        try {

            recaptchaVerifier.clear();

        } catch (error) {

            console.warn(
                "RiderX reCAPTCHA cleanup:",
                error
            );
        }
    }


    recaptchaVerifier = null;


    if (recaptchaContainer) {
        recaptchaContainer.innerHTML = "";
    }
}


/* =========================================================
   SEND OTP
========================================================= */

async function sendOTP() {

    if (busy) {
        return;
    }


    clearMessage();


    if (!validatePhone()) {
        return;
    }


    busy = true;

    setSendingState(true);


    try {

        const firebase =
            await loadFirebase();


        const verifier =
            await createRecaptcha();


        currentPhone =
            firebasePhone();


        confirmationResult =
            await firebase.signInWithPhoneNumber(
                firebase.auth,
                currentPhone,
                verifier
            );


        otpSection.classList.add(
            "show"
        );


        phoneInput.disabled = true;

        sendOtpButton.style.display =
            "none";


        otpInput.value = "";

        otpInput.focus();


        startTimer();


        showMessage(
            "OTP sent successfully. Please check your mobile.",
            "success"
        );


    } catch (error) {

        console.error(
            "RiderX send OTP error:",
            error
        );


        confirmationResult = null;

        cleanupRecaptcha();


        showMessage(
            firebaseErrorMessage(error),
            "error"
        );


    } finally {

        busy = false;

        setSendingState(false);
    }
}


/* =========================================================
   VERIFY OTP
========================================================= */

async function verifyOTP() {

    if (busy) {
        return;
    }


    clearMessage();


    if (!confirmationResult) {

        showMessage(
            "Please request an OTP first.",
            "error"
        );

        return;
    }


    const otp =
        String(
            otpInput.value || ""
        )
            .replace(/\D/g, "")
            .slice(0, 6);


    otpInput.value =
        otp;


    if (
        otp.length !== 6
    ) {

        showMessage(
            "Please enter the complete 6-digit OTP.",
            "error"
        );

        otpInput.focus();

        return;
    }


    busy = true;

    setVerifyingState(true);


    try {

        const firebase =
            await loadFirebase();


        const result =
            await confirmationResult.confirm(
                otp
            );


        const firebaseUser =
            result?.user ||
            firebase.auth?.currentUser;


        if (
            !firebaseUser ||
            !firebaseUser.uid
        ) {

            throw new Error(
                "Firebase authentication completed but no user session was returned."
            );
        }


        stopTimer();

        cleanupRecaptcha();


        const profileResult =
            await findProfile(
                firebaseUser
            );


        if (
            profileResult.status ===
            "error"
        ) {

            await signOutFirebase();

            clearLocalSession();

            throw new Error(
                profileResult.message
            );
        }


        if (
            !profileResult.profile
        ) {

            /*
             * Phone authentication succeeded,
             * but RiderX application account does
             * not exist yet.
             */

            await signOutFirebase();

            clearLocalSession();


            throw new Error(
                "No RiderX account was found for this mobile number. Please register first."
            );
        }


        const profile =
            profileResult.profile;


        const profileRole =
            resolveProfileRole(
                profile,
                profileResult.collection
            );


        if (
            profileRole !== selectedRole
        ) {

            await signOutFirebase();

            clearLocalSession();


            if (
                profileRole === "rider"
            ) {

                throw new Error(
                    "This mobile number belongs to a Rider account. Please use Rider Login."
                );
            }


            throw new Error(
                "This mobile number belongs to a Customer account. Please use Customer Login."
            );
        }


        if (
            isBlocked(profile)
        ) {

            await signOutFirebase();

            clearLocalSession();


            throw new Error(
                "Your RiderX account is blocked or suspended. Please contact support."
            );
        }


        saveSession(
            firebaseUser,
            profile
        );


        showMessage(
            "OTP verified successfully. Opening RiderX...",
            "success"
        );


        redirectByRole(
            selectedRole
        );


    } catch (error) {

        console.error(
            "RiderX verify OTP error:",
            error
        );


        showMessage(
            firebaseErrorMessage(error),
            "error"
        );


    } finally {

        busy = false;

        setVerifyingState(false);
    }
}


/* =========================================================
   PROFILE LOOKUP
========================================================= */

async function findProfile(firebaseUser) {

    const firebase =
        await loadFirebase();


    const uid =
        firebaseUser.uid;


    const phone =
        normalizePhone(
            firebaseUser.phoneNumber ||
            currentPhone ||
            ""
        );


    /*
     * First: UID based lookup.
     *
     * This is the preferred RiderX structure.
     */

    const uidCollections = [
        "users",
        selectedRole === "rider"
            ? "riders"
            : "customers",
        selectedRole === "rider"
            ? "customers"
            : "riders"
    ];


    const checked =
        new Set();


    for (
        const collectionName
        of uidCollections
    ) {

        if (
            checked.has(collectionName)
        ) {
            continue;
        }


        checked.add(
            collectionName
        );


        const result =
            await readProfileByUid(
                collectionName,
                uid
            );


        if (
            result.status === "error"
        ) {

            return result;
        }


        if (
            result.profile
        ) {

            return {
                status: "found",
                collection: collectionName,
                profile: normalizeProfile(
                    result.profile,
                    uid,
                    collectionName
                )
            };
        }
    }


    /*
     * Fallback:
     * Search the application profile by phone
     * when registration stored a different
     * document ID.
     *
     * This requires Firestore rules to permit
     * the corresponding query.
     */

    if (phone) {

        const phoneFields = [
            "phone",
            "phoneNumber",
            "mobile",
            "mobileNumber"
        ];


        const phoneCollections = [
            "users",
            selectedRole === "rider"
                ? "riders"
                : "customers"
        ];


        for (
            const collectionName
            of phoneCollections
        ) {

            for (
                const field
                of phoneFields
            ) {

                const result =
                    await queryProfileByPhone(
                        collectionName,
                        field,
                        phone
                    );


                if (
                    result.status ===
                    "error"
                ) {

                    /*
                     * Permission denied on a fallback
                     * query is not necessarily fatal if
                     * UID lookup already failed normally.
                     *
                     * Continue trying the canonical
                     * collections/fields.
                     */

                    continue;
                }


                if (
                    result.profile
                ) {

                    return {
                        status: "found",
                        collection:
                            collectionName,
                        profile:
                            normalizeProfile(
                                result.profile,
                                uid,
                                collectionName
                            )
                    };
                }
            }
        }
    }


    return {
        status: "not-found",
        collection: null,
        profile: null
    };
}


/* =========================================================
   UID PROFILE READ
========================================================= */

async function readProfileByUid(
    collectionName,
    uid
) {

    try {

        const firebase =
            await loadFirebase();


        const snapshot =
            await firebase.getDoc(
                firebase.doc(
                    firebase.db,
                    collectionName,
                    uid
                )
            );


        if (
            !snapshot.exists()
        ) {

            return {
                status: "not-found",
                profile: null
            };
        }


        return {
            status: "found",
            profile:
                snapshot.data() || {}
        };


    } catch (error) {

        console.error(
            "RiderX profile read failed:",
            collectionName,
            error
        );


        const code =
            String(
                error?.code || ""
            ).toLowerCase();


        if (
            code.includes(
                "permission-denied"
            ) ||
            code.includes(
                "unauthenticated"
            ) ||
            code.includes(
                "network"
            ) ||
            code.includes(
                "unavailable"
            ) ||
            code.includes(
                "failed-precondition"
            )
        ) {

            return {
                status: "error",
                profile: null,
                message:
                    firebaseErrorMessage(
                        error
                    )
            };
        }


        return {
            status: "not-found",
            profile: null
        };
    }
}


/* =========================================================
   PHONE PROFILE QUERY
========================================================= */

async function queryProfileByPhone(
    collectionName,
    field,
    phone
) {

    try {

        const firebase =
            await loadFirebase();


        /*
         * firebase-config.js may expose either:
         *
         * getDocs + collection + query + where
         *
         * or only the basic document API.
         */

        if (
            typeof firebase.getDocs !== "function" ||
            typeof firebase.collection !== "function" ||
            typeof firebase.query !== "function" ||
            typeof firebase.where !== "function"
        ) {

            return {
                status: "not-found",
                profile: null
            };
        }


        const variants = [
            phone,
            "+91" + phone
        ];


        for (
            const value
            of variants
        ) {

            const q =
                firebase.query(
                    firebase.collection(
                        firebase.db,
                        collectionName
                    ),
                    firebase.where(
                        field,
                        "==",
                        value
                    )
                );


            const snapshot =
                await firebase.getDocs(
                    q
                );


            if (
                snapshot.empty
            ) {
                continue;
            }


            const first =
                snapshot.docs[0];


            return {
                status: "found",
                profile: {
                    ...(first.data() || {}),
                    uid:
                        first.data()?.uid ||
                        first.id
                }
            };
        }


    } catch (error) {

        console.warn(
            "RiderX phone profile lookup:",
            collectionName,
            field,
            error
        );


        return {
            status: "error",
            profile: null,
            message:
                firebaseErrorMessage(
                    error
                )
        };
    }


    return {
        status: "not-found",
        profile: null
    };
}


/* =========================================================
   NORMALIZE PROFILE
========================================================= */

function normalizeProfile(
    profile,
    uid,
    collectionName
) {

    const data =
        profile || {};


    return {
        ...data,

        uid:
            data.uid ||
            uid,

        role:
            data.role ||
            data.userRole ||
            data.accountType ||
            (
                collectionName === "riders"
                    ? "rider"
                    : collectionName === "customers"
                        ? "customer"
                        : selectedRole
            )
    };
}


/* =========================================================
   ROLE
========================================================= */

function resolveProfileRole(
    profile,
    collectionName
) {

    const role =
        normalizeRole(
            profile.role ||
            profile.userRole ||
            profile.accountType
        );


    if (role) {
        return role;
    }


    if (
        collectionName === "riders"
    ) {
        return "rider";
    }


    if (
        collectionName === "customers"
    ) {
        return "customer";
    }


    return selectedRole;
}


/* =========================================================
   BLOCK STATUS
========================================================= */

function isBlocked(profile) {

    if (
        profile.blocked === true ||
        profile.disabled === true
    ) {
        return true;
    }


    const status =
        String(
            profile.status ||
            profile.accountStatus ||
            profile.userStatus ||
            ""
        )
            .trim()
            .toLowerCase();


    return [
        "blocked",
        "disabled",
        "suspended",
        "banned"
    ].includes(status);
}


/* =========================================================
   SAVE SESSION
========================================================= */

function saveSession(
    firebaseUser,
    profile
) {

    const phone =
        profile.phone ||
        profile.phoneNumber ||
        profile.mobile ||
        profile.mobileNumber ||
        firebaseUser.phoneNumber ||
        currentPhone ||
        "";


    const user = {

        ...profile,

        uid:
            firebaseUser.uid,

        id:
            firebaseUser.uid,

        role:
            selectedRole,

        userRole:
            selectedRole,

        accountType:
            selectedRole,

        name:
            profile.name ||
            profile.fullName ||
            profile.displayName ||
            firebaseUser.displayName ||
            (
                selectedRole === "rider"
                    ? "RiderX Rider"
                    : "RiderX Customer"
            ),

        fullName:
            profile.fullName ||
            profile.name ||
            profile.displayName ||
            firebaseUser.displayName ||
            "",

        displayName:
            profile.displayName ||
            firebaseUser.displayName ||
            "",

        email:
            profile.email ||
            firebaseUser.email ||
            "",

        phone:
            phone,

        phoneNumber:
            phone,

        photoURL:
            profile.photoURL ||
            firebaseUser.photoURL ||
            "",

        firebaseUid:
            firebaseUser.uid,

        loginMethod:
            "phone",

        loginAt:
            new Date().toISOString()
    };


    localStorage.setItem(
        "riderx_user",
        JSON.stringify(user)
    );

    localStorage.setItem(
        "riderx_role",
        selectedRole
    );

    localStorage.setItem(
        "userRole",
        selectedRole
    );

    localStorage.setItem(
        "riderx_selected_role",
        selectedRole
    );


    if (
        selectedRole === "rider"
    ) {

        localStorage.setItem(
            "riderx_rider",
            JSON.stringify(user)
        );

        localStorage.setItem(
            "riderx_rider_id",
            firebaseUser.uid
        );


        localStorage.removeItem(
            "riderx_customer"
        );

        localStorage.removeItem(
            "riderx_customer_id"
        );

    } else {

        localStorage.setItem(
            "riderx_customer",
            JSON.stringify(user)
        );

        localStorage.setItem(
            "riderx_customer_id",
            firebaseUser.uid
        );


        localStorage.removeItem(
            "riderx_rider"
        );

        localStorage.removeItem(
            "riderx_rider_id"
        );
    }
}


/* =========================================================
   LOCAL SESSION CLEAR
========================================================= */

function clearLocalSession() {

    [
        "riderx_user",
        "riderx_rider",
        "riderx_customer",
        "riderx_rider_id",
        "riderx_customer_id"
    ].forEach(
        key =>
            localStorage.removeItem(
                key
            )
    );
}


/* =========================================================
   FIREBASE SIGN OUT
========================================================= */

async function signOutFirebase() {

    try {

        const firebase =
            await loadFirebase();


        if (
            firebase.auth &&
            typeof firebase.signOut ===
                "function"
        ) {

            await firebase.signOut(
                firebase.auth
            );
        }

    } catch (error) {

        console.warn(
            "RiderX sign out warning:",
            error
        );
    }
}


/* =========================================================
   REDIRECT
========================================================= */

function redirectByRole(role) {

    window.setTimeout(
        function () {

            if (
                role === "rider"
            ) {

                window.location.replace(
                    "../rider/home.html"
                );

                return;
            }


            window.location.replace(
                "../customer/home.html"
            );

        },
        450
    );
}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    stopTimer();


    seconds = 60;


    resendButton.classList.remove(
        "show"
    );


    timerBox.textContent =
        "OTP expires in 60 seconds";


    timerId =
        window.setInterval(
            function () {

                seconds--;


                if (
                    seconds <= 0
                ) {

                    stopTimer();


                    timerBox.textContent =
                        "OTP expired. Request a new OTP.";


                    resendButton.classList.add(
                        "show"
                    );


                    return;
                }


                timerBox.textContent =
                    "OTP expires in " +
                    seconds +
                    " seconds";

            },
            1000
        );
}


function stopTimer() {

    if (timerId) {

        window.clearInterval(
            timerId
        );

        timerId = null;
    }
}


/* =========================================================
   RESET FLOW
========================================================= */

function resetOtpFlow() {

    confirmationResult = null;

    currentPhone = "";

    stopTimer();

    cleanupRecaptcha();


    otpSection.classList.remove(
        "show"
    );


    resendButton.classList.remove(
        "show"
    );


    phoneInput.disabled = false;

    sendOtpButton.style.display =
        "";

    otpInput.value = "";


    timerBox.textContent =
        "OTP expires in 60 seconds";


    setSendingState(false);

    setVerifyingState(false);
}


/* =========================================================
   RESEND
========================================================= */

resendButton.addEventListener(
    "click",
    async function () {

        if (busy) {
            return;
        }


        otpInput.value = "";

        confirmationResult = null;

        cleanupRecaptcha();


        await sendOTP();
    }
);


/* =========================================================
   CHANGE NUMBER
========================================================= */

changeNumberButton.addEventListener(
    "click",
    function () {

        if (busy) {
            return;
        }


        resetOtpFlow();

        clearMessage();

        phoneInput.focus();
    }
);


/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
    "click",
    function () {

        if (busy) {
            return;
        }


        stopTimer();

        cleanupRecaptcha();


        if (
            selectedRole === "rider"
        ) {

            window.location.replace(
                "./rider-login.html"
            );

            return;
        }


        window.location.replace(
            "./customer-login.html"
        );
    }
);


/* =========================================================
   SEND
========================================================= */

sendOtpButton.addEventListener(
    "click",
    sendOTP
);


/* =========================================================
   VERIFY
========================================================= */

verifyOtpButton.addEventListener(
    "click",
    verifyOTP
);


/* =========================================================
   PHONE INPUT
========================================================= */

phoneInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);


        clearMessage();
    }
);


/* =========================================================
   OTP INPUT
========================================================= */

otpInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 6);


        clearMessage();


        if (
            this.value.length === 6 &&
            confirmationResult &&
            !busy
        ) {

            window.setTimeout(
                function () {

                    if (
                        otpInput.value.length === 6 &&
                        confirmationResult &&
                        !busy
                    ) {

                        verifyOTP();
                    }

                },
                100
            );
        }
    }
);


/* =========================================================
   ENTER
========================================================= */

phoneInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendOTP();
        }
    }
);


otpInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            verifyOTP();
        }
    }
);


/* =========================================================
   BUTTON STATES
========================================================= */

function setSendingState(
    loading
) {

    sendOtpButton.disabled =
        loading;


    if (loading) {

        sendOtpButton.innerHTML =
            '<span class="loader"></span>Sending OTP...';

    } else {

        sendOtpButton.textContent =
            "SEND OTP";
    }


    changeNumberButton.disabled =
        loading;

    backButton.disabled =
        loading;
}


function setVerifyingState(
    loading
) {

    verifyOtpButton.disabled =
        loading;

    resendButton.disabled =
        loading;

    changeNumberButton.disabled =
        loading;

    backButton.disabled =
        loading;


    if (loading) {

        verifyOtpButton.innerHTML =
            '<span class="loader"></span>Verifying...';

    } else {

        verifyOtpButton.textContent =
            "VERIFY & LOGIN";
    }
}


/* =========================================================
   FIREBASE ERROR TRANSLATOR
========================================================= */

function firebaseErrorMessage(
    error
) {

    const code =
        String(
            error?.code || ""
        )
            .toLowerCase();


    const messages = {

        "auth/invalid-phone-number":
            "Please enter a valid mobile number.",

        "auth/missing-phone-number":
            "Mobile number is required.",

        "auth/too-many-requests":
            "Too many OTP requests. Please wait and try again later.",

        "auth/quota-exceeded":
            "Firebase OTP quota has been exceeded. Please try again later.",

        "auth/invalid-verification-code":
            "The OTP is incorrect. Please check the code and try again.",

        "auth/invalid-verification-id":
            "This OTP session is invalid. Please request a new OTP.",

        "auth/code-expired":
            "The OTP has expired. Please request a new OTP.",

        "auth/session-expired":
            "Your OTP session expired. Please request a new OTP.",

        "auth/network-request-failed":
            "Network error. Please check your internet connection.",

        "auth/captcha-check-failed":
            "Security verification failed. Please try again.",

        "auth/app-not-authorized":
            "This RiderX domain is not authorized for Firebase Phone Authentication.",

        "auth/operation-not-allowed":
            "Firebase Phone Authentication is not enabled.",

        "auth/user-disabled":
            "This Firebase account has been disabled.",

        "auth/internal-error":
            "Firebase encountered an internal error. Please try again.",

        "auth/invalid-app-credential":
            "Firebase security verification failed. Please refresh and try again.",

        "auth/missing-app-credential":
            "Firebase security verification is missing. Please refresh and try again.",

        "permission-denied":
            "RiderX cannot read your account profile. Check Firestore rules.",

        "failed-precondition":
            "RiderX Firebase configuration is not ready.",

        "unavailable":
            "Firebase is temporarily unavailable. Please try again.",

        "unauthenticated":
            "Your authentication session expired. Please try again."
    };


    if (
        messages[code]
    ) {

        return messages[code];
    }


    const raw =
        String(
            error?.message || ""
        ).trim();


    if (
        raw.toLowerCase().includes(
            "network"
        )
    ) {

        return (
            "Network error. Please check your internet connection."
        );
    }


    if (
        raw.toLowerCase().includes(
            "permission"
        )
    ) {

        return (
            "RiderX cannot access your account profile. Please check Firestore rules."
        );
    }


    if (raw) {
        return raw;
    }


    return (
        "OTP authentication failed. Please try again."
    );
}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function () {

        stopTimer();

        cleanupRecaptcha();
    }
);


/* =========================================================
   INITIALIZE
========================================================= */

clearMessage();

phoneInput.focus();


console.log(
    "RiderX real OTP login initialized.",
    {
        role: selectedRole
    }
);
