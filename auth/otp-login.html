    /*

    #recaptcha-container {

</main><!-- Firebase Phone Authentication reCAPTCHA target --><div id="recaptcha-container"></div><script type="module">

"use strict";

/* =========================================================
   DOM ELEMENTS
========================================================= */

const phoneInput =
    document.getElementById("phone");

const otpInput =
    document.getElementById("otp");

const sendOtpButton =
    document.getElementById("sendOtp");

const verifyOtpButton =
    document.getElementById("verifyOtp");

const otpSection =
    document.getElementById("otpSection");

const resendButton =
    document.getElementById("resend");

const changeNumberButton =
    document.getElementById("changeNumber");

const backButton =
    document.getElementById("back");

const messageBox =
    document.getElementById("message");

const timerBox =
    document.getElementById("timer");

const roleBadge =
    document.getElementById("roleBadge");

const recaptchaContainer =
    document.getElementById("recaptcha-container");


/* =========================================================
   STATE
========================================================= */

let firebaseModule = null;

let confirmationResult = null;

let recaptchaVerifier = null;

let resendTimer = null;

let seconds = 60;

let busy = false;

let selectedRole = "customer";

let currentPhone = "";


/* =========================================================
   ROLE PARSER
========================================================= */

function parseRole(value) {

    const role =
        String(value || "")
            .trim()
            .toLowerCase();

    if (
        [
            "rider",
            "driver",
            "partner",
            "captain",
            "driver_partner"
        ].includes(role)
    ) {
        return "rider";
    }

    if (
        [
            "customer",
            "user",
            "passenger"
        ].includes(role)
    ) {
        return "customer";
    }

    return null;
}


/* =========================================================
   ROLE DETECTION
========================================================= */

function detectRole() {

    /*
     * URL role has highest priority.
     *
     * Examples:
     * otp-login.html?role=customer
     * otp-login.html?role=rider
     */

    try {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const urlRole =
            parseRole(
                params.get("role")
            );

        if (urlRole) {
            return urlRole;
        }

    } catch (error) {

        console.warn(
            "RiderX OTP URL role detection failed:",
            error
        );

    }


    const storageKeys = [
        "riderx_selected_role",
        "riderx_role",
        "userRole"
    ];


    for (const key of storageKeys) {

        const role =
            parseRole(
                localStorage.getItem(key)
            );

        if (role) {
            return role;
        }

    }


    return "customer";
}


/* =========================================================
   INITIAL ROLE
========================================================= */

selectedRole =
    detectRole();


/*
 * Admin is never allowed to use this
 * customer/rider OTP authentication screen.
 */

if (
    selectedRole !== "rider" &&
    selectedRole !== "customer"
) {
    selectedRole = "customer";
}


localStorage.setItem(
    "riderx_selected_role",
    selectedRole
);


roleBadge.textContent =
    selectedRole === "rider"
        ? "RIDER / DRIVER PARTNER"
        : "CUSTOMER";


/* =========================================================
   FIREBASE LOADER
========================================================= */

async function loadFirebase() {

    if (firebaseModule) {
        return firebaseModule;
    }

    firebaseModule =
        await import(
            "../firebase/firebase-config.js"
        );

    validateFirebaseModule();

    return firebaseModule;
}


/* =========================================================
   FIREBASE EXPORT VALIDATION
========================================================= */

function validateFirebaseModule() {

    const required =
        [
            "auth",
            "db",
            "signInWithPhoneNumber",
            "RecaptchaVerifier",
            "getDoc",
            "doc",
            "signOut"
        ];

    const missing =
        required.filter(
            key =>
                !firebaseModule ||
                firebaseModule[key] == null
        );


    if (missing.length > 0) {

        console.error(
            "RiderX Firebase exports missing:",
            missing
        );

        throw new Error(
            "RiderX Firebase configuration is incomplete. Missing: " +
            missing.join(", ")
        );
    }
}


/* =========================================================
   MESSAGE HELPERS
========================================================= */

function showMessage(
    text,
    type = "info"
) {

    messageBox.textContent =
        String(text || "");

    messageBox.className =
        "message show " + type;
}


function clearMessage() {

    messageBox.textContent = "";

    messageBox.className =
        "message";
}


/* =========================================================
   PHONE NORMALIZATION
========================================================= */

function getPhoneNumber() {

    let phone =
        String(
            phoneInput.value || ""
        )
            .replace(/\D/g, "");


    /*
     * Accept accidental +91XXXXXXXXXX input
     * and normalize it to 10 digits.
     */

    if (
        phone.startsWith("91") &&
        phone.length === 12
    ) {
        phone =
            phone.substring(2);
    }


    return phone.slice(0, 10);
}


function getFirebasePhone() {

    return "+91" + getPhoneNumber();
}


/* =========================================================
   PHONE VALIDATION
========================================================= */

function validatePhone() {

    const phone =
        getPhoneNumber();


    if (
        phone.length !== 10
    ) {

        showMessage(
            "Please enter a valid 10-digit Indian mobile number.",
            "error"
        );

        phoneInput.focus();

        return false;
    }


    if (
        !/^[6-9]\d{9}$/.test(phone)
    ) {

        showMessage(
            "Please enter a valid Indian mobile number starting with 6, 7, 8 or 9.",
            "error"
        );

        phoneInput.focus();

        return false;
    }


    return true;
}


/* =========================================================
   RECAPTCHA CREATE
========================================================= */

async function createRecaptcha() {

    const FB =
        await loadFirebase();


    cleanupRecaptcha();


    if (
        !FB.RecaptchaVerifier
    ) {

        throw new Error(
            "Firebase reCAPTCHA is not available."
        );
    }


    if (
        !recaptchaContainer
    ) {

        throw new Error(
            "RiderX reCAPTCHA container is missing."
        );
    }


    recaptchaVerifier =
        new FB.RecaptchaVerifier(
            FB.auth,
            recaptchaContainer,
            {
                size: "invisible",

                callback: function () {

                    console.log(
                        "RiderX reCAPTCHA verified."
                    );

                },

                "expired-callback": function () {

                    showMessage(
                        "Security verification expired. Please request OTP again.",
                        "error"
                    );

                    cleanupRecaptcha();

                },

                "error-callback": function () {

                    showMessage(
                        "Security verification failed. Please try again.",
                        "error"
                    );

                    cleanupRecaptcha();

                }
            }
        );


    /*
     * Explicit render makes the lifecycle more
     * predictable across mobile browsers.
     */

    try {

        await recaptchaVerifier.render();

    } catch (error) {

        cleanupRecaptcha();

        throw error;
    }


    return recaptchaVerifier;
}


/* =========================================================
   SEND OTP
========================================================= */

async function sendOTP() {

    if (busy) {
        return;
    }


    clearMessage();


    if (!validatePhone()) {
        return;
    }


    busy = true;

    setButtons(true);


    try {

        const FB =
            await loadFirebase();


        const verifier =
            await createRecaptcha();


        currentPhone =
            getFirebasePhone();


        confirmationResult =
            await FB.signInWithPhoneNumber(
                FB.auth,
                currentPhone,
                verifier
            );


        otpSection.classList.add("show");

        phoneInput.disabled = true;

        sendOtpButton.style.display = "none";

        otpInput.value = "";

        otpInput.focus();

        startTimer();


        showMessage(
            "OTP sent successfully. Check your mobile.",
            "success"
        );


    } catch (error) {

        console.error(
            "RiderX OTP send error:",
            error
        );


        confirmationResult = null;

        cleanupRecaptcha();


        showMessage(
            firebaseErrorMessage(error),
            "error"
        );


    } finally {

        busy = false;

        setButtons(false);
    }
}


/* =========================================================
   VERIFY OTP
========================================================= */

async function verifyOTP() {

    if (busy) {
        return;
    }


    clearMessage();


    if (!confirmationResult) {

        showMessage(
            "Please request a new OTP first.",
            "error"
        );

        return;
    }


    const otp =
        String(
            otpInput.value || ""
        )
            .replace(/\D/g, "")
            .slice(0, 6);


    otpInput.value = otp;


    if (otp.length !== 6) {

        showMessage(
            "Please enter the 6-digit OTP.",
            "error"
        );

        otpInput.focus();

        return;
    }


    busy = true;

    setButtons(true);


    try {

        const FB =
            await loadFirebase();


        const result =
            await confirmationResult.confirm(
                otp
            );


        const firebaseUser =
            result?.user;


        if (
            !firebaseUser ||
            !firebaseUser.uid
        ) {

            throw new Error(
                "Firebase could not verify your account."
            );
        }


        stopTimer();

        cleanupRecaptcha();


        /*
         * Authentication alone is not enough.
         * RiderX requires a matching application
         * profile before entering the dashboard.
         */

        const profileResult =
            await findProfile(
                firebaseUser.uid
            );


        if (
            profileResult.status ===
            "error"
        ) {

            await safeSignOut();

            clearLocalSession();

            throw new Error(
                profileResult.message
            );
        }


        const profile =
            profileResult.profile;


        if (!profile) {

            await safeSignOut();

            clearLocalSession();

            throw new Error(
                "No RiderX account was found for this mobile number. Please register first."
            );
        }


        const profileRole =
            resolveProfileRole(
                profile,
                profileResult.collection
            );


        if (
            profileRole !== selectedRole
        ) {

            await safeSignOut();

            clearLocalSession();


            if (
                profileRole === "rider"
            ) {

                throw new Error(
                    "This mobile number belongs to a Rider account. Please use Rider Login."
                );
            }


            if (
                profileRole === "customer"
            ) {

                throw new Error(
                    "This mobile number belongs to a Customer account. Please use Customer Login."
                );
            }


            throw new Error(
                "This RiderX account has an invalid role. Please contact support."
            );
        }


        if (
            isBlocked(profile)
        ) {

            await safeSignOut();

            clearLocalSession();

            throw new Error(
                "Your RiderX account is blocked or suspended. Please contact support."
            );
        }


        saveSession(
            firebaseUser,
            profile
        );


        showMessage(
            "OTP verified successfully. Opening RiderX...",
            "success"
        );


        redirectByRole(
            selectedRole
        );


    } catch (error) {

        console.error(
            "RiderX OTP verification error:",
            error
        );


        showMessage(
            firebaseErrorMessage(error),
            "error"
        );


    } finally {

        busy = false;

        setButtons(false);
    }
}


/* =========================================================
   PROFILE LOOKUP
========================================================= */

async function findProfile(uid) {

    const FB =
        await loadFirebase();


    /*
     * IMPORTANT:
     * A Firestore permission/network failure must
     * NOT be silently converted into "account not found".
     */


    const collections = [];


    /*
     * Always check users first.
     */

    collections.push("users");


    /*
     * Then selected role collection.
     */

    if (
        selectedRole === "rider"
    ) {

        collections.push("riders");

    } else {

        collections.push("customers");
    }


    /*
     * Finally check the alternate collection.
     */

    if (
        selectedRole === "rider"
    ) {

        collections.push("customers");

    } else {

        collections.push("riders");
    }


    const checked =
        new Set();


    for (
        const collectionName of collections
    ) {

        if (
            checked.has(collectionName)
        ) {
            continue;
        }


        checked.add(collectionName);


        try {

            const snapshot =
                await FB.getDoc(
                    FB.doc(
                        FB.db,
                        collectionName,
                        uid
                    )
                );


            if (
                snapshot.exists()
            ) {

                const data =
                    snapshot.data() || {};


                return {

                    status: "found",

                    collection:
                        collectionName,

                    profile: {
                        ...data,

                        uid:
                            data.uid ||
                            uid,

                        role:
                            data.role ||
                            (
                                collectionName === "riders"
                                    ? "rider"
                                    : collectionName === "customers"
                                        ? "customer"
                                        : data.role
                            )
                    }

                };
            }


        } catch (error) {

            console.error(
                "RiderX profile lookup failed:",
                collectionName,
                error
            );


            /*
             * Permission/network errors should be
             * reported instead of pretending the
             * profile does not exist.
             */

            const code =
                String(
                    error?.code || ""
                ).toLowerCase();


            if (
                code.includes("permission-denied") ||
                code.includes("unauthenticated") ||
                code.includes("network") ||
                code.includes("failed-precondition") ||
                code.includes("unavailable")
            ) {

                return {

                    status: "error",

                    collection:
                        collectionName,

                    profile: null,

                    message:
                        firebaseErrorMessage(error)
                };
            }
        }
    }


    return {

        status: "not-found",

        collection: null,

        profile: null
    };
}


/* =========================================================
   PROFILE ROLE
========================================================= */

function resolveProfileRole(
    profile,
    collectionName
) {

    const explicitRole =
        parseRole(
            profile.role ||
            profile.userRole ||
            profile.accountType
        );


    if (explicitRole) {
        return explicitRole;
    }


    if (
        collectionName === "riders"
    ) {
        return "rider";
    }


    if (
        collectionName === "customers"
    ) {
        return "customer";
    }


    /*
     * users/{uid} without a role:
     * use the selected login context.
     */

    return selectedRole;
}


/* =========================================================
   BLOCK CHECK
========================================================= */

function isBlocked(profile) {

    if (
        profile.blocked === true ||
        profile.disabled === true
    ) {
        return true;
    }


    const status =
        String(
            profile.status ||
            profile.accountStatus ||
            profile.userStatus ||
            ""
        )
            .trim()
            .toLowerCase();


    return [
        "blocked",
        "disabled",
        "suspended",
        "banned"
    ].includes(status);
}


/* =========================================================
   SAVE SESSION
========================================================= */

function saveSession(
    firebaseUser,
    profile
) {

    const phone =
        profile.phone ||
        profile.mobile ||
        profile.phoneNumber ||
        firebaseUser.phoneNumber ||
        currentPhone ||
        "";


    const user = {

        ...profile,

        uid:
            firebaseUser.uid,

        id:
            firebaseUser.uid,

        role:
            selectedRole,

        userRole:
            selectedRole,

        accountType:
            selectedRole,

        name:
            profile.name ||
            profile.fullName ||
            profile.displayName ||
            firebaseUser.displayName ||
            (
                selectedRole === "rider"
                    ? "RiderX Rider"
                    : "RiderX Customer"
            ),

        fullName:
            profile.fullName ||
            profile.name ||
            profile.displayName ||
            firebaseUser.displayName ||
            "",

        displayName:
            profile.displayName ||
            firebaseUser.displayName ||
            "",

        email:
            profile.email ||
            firebaseUser.email ||
            "",

        phone:
            phone,

        phoneNumber:
            phone,

        photoURL:
            profile.photoURL ||
            firebaseUser.photoURL ||
            "",

        loginMethod:
            "phone",

        loginAt:
            new Date().toISOString()
    };


    localStorage.setItem(
        "riderx_user",
        JSON.stringify(user)
    );


    localStorage.setItem(
        "riderx_role",
        selectedRole
    );


    localStorage.setItem(
        "userRole",
        selectedRole
    );


    localStorage.setItem(
        "riderx_selected_role",
        selectedRole
    );


    if (
        selectedRole === "rider"
    ) {

        localStorage.setItem(
            "riderx_rider",
            JSON.stringify(user)
        );

        localStorage.setItem(
            "riderx_rider_id",
            firebaseUser.uid
        );


        localStorage.removeItem(
            "riderx_customer"
        );

        localStorage.removeItem(
            "riderx_customer_id"
        );

    } else {

        localStorage.setItem(
            "riderx_customer",
            JSON.stringify(user)
        );

        localStorage.setItem(
            "riderx_customer_id",
            firebaseUser.uid
        );


        localStorage.removeItem(
            "riderx_rider"
        );

        localStorage.removeItem(
            "riderx_rider_id"
        );
    }
}


/* =========================================================
   CLEAR LOCAL SESSION
========================================================= */

function clearLocalSession() {

    const keys = [
        "riderx_user",
        "riderx_rider",
        "riderx_customer",
        "riderx_rider_id",
        "riderx_customer_id"
    ];


    keys.forEach(
        key =>
            localStorage.removeItem(key)
    );
}


/* =========================================================
   REDIRECT
========================================================= */

function redirectByRole(role) {

    window.setTimeout(
        function () {

            if (
                role === "rider"
            ) {

                window.location.replace(
                    "../rider/home.html"
                );

                return;
            }


            window.location.replace(
                "../customer/home.html"
            );

        },
        450
    );
}


/* =========================================================
   SAFE SIGN OUT
========================================================= */

async function safeSignOut() {

    try {

        const FB =
            await loadFirebase();


        if (
            FB.auth &&
            typeof FB.signOut === "function"
        ) {

            await FB.signOut(
                FB.auth
            );
        }

    } catch (error) {

        console.warn(
            "RiderX OTP sign-out warning:",
            error
        );
    }
}


/* =========================================================
   RECAPTCHA CLEANUP
========================================================= */

function cleanupRecaptcha() {

    if (!recaptchaVerifier) {
        return;
    }


    try {

        recaptchaVerifier.clear();

    } catch (error) {

        console.warn(
            "RiderX reCAPTCHA cleanup warning:",
            error
        );
    }


    recaptchaVerifier = null;


    /*
     * Remove any Firebase-created iframe remnants
     * from our dedicated container.
     */

    if (
        recaptchaContainer
    ) {

        recaptchaContainer.innerHTML = "";
    }
}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    stopTimer();


    seconds = 60;


    resendButton.classList.remove(
        "show"
    );


    timerBox.textContent =
        "OTP expires in 60 seconds";


    resendTimer =
        window.setInterval(
            function () {

                seconds--;


                if (
                    seconds <= 0
                ) {

                    stopTimer();


                    timerBox.textContent =
                        "OTP expired. Request a new OTP.";


                    resendButton.classList.add(
                        "show"
                    );


                    return;
                }


                timerBox.textContent =
                    "OTP expires in " +
                    seconds +
                    " seconds";

            },
            1000
        );
}


function stopTimer() {

    if (resendTimer) {

        window.clearInterval(
            resendTimer
        );

        resendTimer = null;
    }
}


/* =========================================================
   RESET OTP FLOW
========================================================= */

function resetOtpFlow() {

    confirmationResult = null;

    currentPhone = "";

    stopTimer();

    cleanupRecaptcha();


    otpSection.classList.remove(
        "show"
    );


    resendButton.classList.remove(
        "show"
    );


    phoneInput.disabled = false;

    sendOtpButton.style.display = "";

    otpInput.value = "";

    timerBox.textContent =
        "OTP expires in 60 seconds";
}


/* =========================================================
   RESEND OTP
========================================================= */

resendButton.addEventListener(
    "click",
    async function () {

        if (busy) {
            return;
        }


        otpInput.value = "";

        confirmationResult = null;

        cleanupRecaptcha();

        await sendOTP();
    }
);


/* =========================================================
   CHANGE NUMBER
========================================================= */

changeNumberButton.addEventListener(
    "click",
    function () {

        if (busy) {
            return;
        }


        resetOtpFlow();

        clearMessage();

        phoneInput.focus();
    }
);


/* =========================================================
   BACK TO LOGIN
========================================================= */

backButton.addEventListener(
    "click",
    function () {

        if (busy) {
            return;
        }


        stopTimer();

        cleanupRecaptcha();


        if (
            selectedRole === "rider"
        ) {

            window.location.replace(
                "./rider-login.html"
            );

            return;
        }


        window.location.replace(
            "./customer-login.html"
        );
    }
);


/* =========================================================
   SEND OTP
========================================================= */

sendOtpButton.addEventListener(
    "click",
    sendOTP
);


/* =========================================================
   VERIFY OTP
========================================================= */

verifyOtpButton.addEventListener(
    "click",
    verifyOTP
);


/* =========================================================
   PHONE INPUT
========================================================= */

phoneInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);


        clearMessage();
    }
);


/* =========================================================
   OTP INPUT
========================================================= */

otpInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 6);


        clearMessage();


        /*
         * Automatically verify after the sixth digit.
         * Small delay prevents double-triggering on
         * slower mobile keyboards.
         */

        if (
            this.value.length === 6 &&
            !busy
        ) {

            window.setTimeout(
                function () {

                    if (
                        otpInput.value.length === 6 &&
                        !busy
                    ) {

                        verifyOTP();
                    }

                },
                80
            );
        }
    }
);


/* =========================================================
   ENTER KEY
========================================================= */

phoneInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendOTP();
        }
    }
);


otpInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            verifyOTP();
        }
    }
);


/* =========================================================
   BUTTON STATE
========================================================= */

function setButtons(disabled) {

    sendOtpButton.disabled =
        disabled;

    verifyOtpButton.disabled =
        disabled;

    resendButton.disabled =
        disabled;

    changeNumberButton.disabled =
        disabled;

    backButton.disabled =
        disabled;


    if (
        disabled &&
        sendOtpButton.style.display !== "none"
    ) {

        sendOtpButton.innerHTML =
            '<span class="loader"></span>Sending OTP...';

    } else if (
        !disabled &&
        sendOtpButton.style.display !== "none"
    ) {

        sendOtpButton.textContent =
            "SEND OTP";
    }


    if (disabled) {

        verifyOtpButton.innerHTML =
            '<span class="loader"></span>Verifying...';

    } else {

        verifyOtpButton.textContent =
            "VERIFY & LOGIN";
    }
}


/* =========================================================
   FIREBASE ERROR TRANSLATOR
========================================================= */

function firebaseErrorMessage(error) {

    const code =
        String(
            error?.code || ""
        )
            .toLowerCase();


    const messages = {

        "auth/invalid-phone-number":
            "Please enter a valid mobile number.",

        "auth/missing-phone-number":
            "Mobile number is required.",

        "auth/too-many-requests":
            "Too many OTP requests. Please wait and try again later.",

        "auth/quota-exceeded":
            "OTP service limit has been reached. Please try again later.",

        "auth/invalid-verification-code":
            "The OTP is incorrect. Please check and try again.",

        "auth/invalid-verification-id":
            "This OTP session is invalid. Please request a new OTP.",

        "auth/code-expired":
            "The OTP has expired. Please request a new OTP.",

        "auth/session-expired":
            "OTP session expired. Please request a new OTP.",

        "auth/network-request-failed":
            "Network error. Check your internet connection.",

        "auth/captcha-check-failed":
            "Security verification failed. Please try again.",

        "auth/app-not-authorized":
            "This RiderX domain is not authorized for phone authentication in Firebase.",

        "auth/operation-not-allowed":
            "Phone authentication is not enabled in Firebase.",

        "auth/user-disabled":
            "This Firebase account has been disabled.",

        "auth/internal-error":
            "Firebase encountered an internal error. Please try again.",

        "auth/invalid-app-credential":
            "Firebase security verification failed. Please refresh and try again.",

        "auth/missing-app-credential":
            "Firebase security verification is missing. Please refresh and try again.",

        "permission-denied":
            "RiderX could not read your account profile. Please check Firebase Firestore rules.",

        "failed-precondition":
            "RiderX Firebase configuration is not ready. Please try again.",

        "unavailable":
            "Firebase is temporarily unavailable. Please try again.",

        "unauthenticated":
            "Your authentication session expired. Please try again."
    };


    if (
        messages[code]
    ) {

        return messages[code];
    }


    const rawMessage =
        String(
            error?.message || ""
        ).trim();


    /*
     * Avoid exposing ugly Firebase internal
     * messages directly when possible.
     */

    if (
        rawMessage
    ) {

        if (
            rawMessage.toLowerCase().includes(
                "network"
            )
        ) {

            return (
                "Network error. Check your internet connection."
            );
        }


        if (
            rawMessage.toLowerCase().includes(
                "permission"
            )
        ) {

            return (
                "RiderX could not access your account profile. Please check Firebase Firestore rules."
            );
        }


        return rawMessage;
    }


    return (
        "OTP verification failed. Please try again."
    );
}


/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function () {

        stopTimer();

        cleanupRecaptcha();
    }
);


/* =========================================================
   INITIAL UI
========================================================= */

clearMessage();

phoneInput.focus();

console.log(
    "RiderX OTP Login initialized:",
    {
        role: selectedRole
    }
);
