<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f5c400"
    >

    <meta
        name="description"
        content="Choose your RiderX account type"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

    <link
        rel="icon"
        href="../assets/logo.png"
    >

    <title>RiderX — Choose Account</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background: #050505;
            color: #fff;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button,
        label,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        .rx-role-page {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(24px, env(safe-area-inset-top))
                20px
                max(24px, env(safe-area-inset-bottom));

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(245, 196, 0, 0.12),
                    transparent 35%
                ),
                #050505;
        }

        .rx-role-card {
            width: 100%;
            max-width: 430px;

            padding: 28px 20px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(25, 25, 25, 0.98),
                    rgba(10, 10, 10, 0.98)
                );

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55);
        }

        .rx-logo {
            width: 72px;
            height: 72px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            border: 2px solid
                rgba(245, 196, 0, 0.3);

            background: #101010;

            overflow: hidden;
        }

        .rx-logo img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .rx-brand {
            text-align: center;

            font-size: 30px;
            font-weight: 900;

            letter-spacing: -1px;
        }

        .rx-brand span {
            color: #f5c400;
        }

        .rx-title {
            margin: 26px 0 8px;

            text-align: center;

            font-size: 24px;
            font-weight: 800;
        }

        .rx-subtitle {
            margin: 0 auto 24px;

            max-width: 320px;

            text-align: center;

            color: #999;

            font-size: 14px;
            line-height: 1.5;
        }

        .rx-role-options {
            display: grid;
            gap: 12px;
        }

        .rx-role-option {
            position: relative;
        }

        .rx-role-option input {
            position: absolute;

            width: 1px;
            height: 1px;

            opacity: 0;
            pointer-events: none;
        }

        .rx-role-label {
            min-height: 88px;

            display: flex;
            align-items: center;

            gap: 15px;

            padding: 15px;

            border: 1px solid
                rgba(255, 255, 255, 0.09);

            border-radius: 18px;

            background: #101010;

            cursor: pointer;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }

        .rx-role-label:hover {
            border-color:
                rgba(245, 196, 0, 0.35);
        }

        .rx-role-label:active {
            transform: scale(0.985);
        }

        .rx-role-option input:focus-visible
        + .rx-role-label {
            outline: 2px solid #f5c400;
            outline-offset: 3px;
        }

        .rx-role-option input:checked
        + .rx-role-label {
            border-color: #f5c400;

            background:
                linear-gradient(
                    135deg,
                    rgba(245, 196, 0, 0.14),
                    rgba(245, 196, 0, 0.04)
                );

            box-shadow:
                0 0 0 1px
                rgba(245, 196, 0, 0.12);
        }

        .rx-role-icon {
            flex: 0 0 52px;

            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                rgba(245, 196, 0, 0.1);

            font-size: 25px;
        }

        .rx-role-info {
            flex: 1;
            min-width: 0;
        }

        .rx-role-name {
            display: block;

            color: #fff;

            font-size: 16px;
            font-weight: 800;
        }

        .rx-role-description {
            display: block;

            margin-top: 4px;

            color: #8f8f8f;

            font-size: 12px;
            line-height: 1.4;
        }

        .rx-check {
            width: 22px;
            height: 22px;

            flex: 0 0 22px;

            position: relative;

            border: 2px solid #555;
            border-radius: 50%;
        }

        .rx-role-option input:checked
        + .rx-role-label
        .rx-check {
            border-color: #f5c400;
            background: #f5c400;
        }

        .rx-role-option input:checked
        + .rx-role-label
        .rx-check::after {
            content: "";

            position: absolute;

            width: 6px;
            height: 10px;

            left: 6px;
            top: 3px;

            border:
                solid #050505;

            border-width:
                0 2px 2px 0;

            transform:
                rotate(45deg);
        }

        .rx-continue {
            width: 100%;

            margin-top: 20px;

            min-height: 52px;

            border: 0;
            border-radius: 15px;

            background: #f5c400;
            color: #080808;

            font-size: 15px;
            font-weight: 900;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .rx-continue:active {
            transform: scale(0.985);
        }

        .rx-continue:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .rx-register {
            width: 100%;

            margin-top: 12px;

            min-height: 48px;

            border: 1px solid
                rgba(245, 196, 0, 0.35);

            border-radius: 15px;

            background: transparent;
            color: #f5c400;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .rx-register:hover {
            background:
                rgba(245, 196, 0, 0.06);
        }

        .rx-register:active {
            transform: scale(0.985);
        }

        .rx-login-text {
            margin-top: 22px;

            text-align: center;

            color: #888;

            font-size: 13px;
        }

        .rx-login-link {
            display: inline-block;

            margin-top: 7px;

            color: #f5c400;

            font-weight: 800;
            text-decoration: none;
        }

        .rx-login-link:focus-visible {
            outline: 2px solid #f5c400;
            outline-offset: 3px;
            border-radius: 4px;
        }

        .rx-message {
            min-height: 20px;

            margin-top: 14px;

            text-align: center;

            color: #f5c400;

            font-size: 12px;
            line-height: 1.4;
        }

        .rx-message.error {
            color: #ff7474;
        }

        .rx-message.success {
            color: #7ee787;
        }

        .rx-loading {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 8px;
        }

        .rx-loading.active {
            display: flex;
        }

        .rx-spinner {
            width: 17px;
            height: 17px;

            border:
                2px solid rgba(0, 0, 0, 0.25);

            border-top-color: #080808;

            border-radius: 50%;

            animation:
                rx-spin 0.7s linear infinite;
        }

        @keyframes rx-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 360px) {

            .rx-role-card {
                padding: 23px 15px;
            }

            .rx-title {
                font-size: 21px;
            }

            .rx-role-label {
                min-height: 80px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration:
                    0.01ms !important;

                transition-duration:
                    0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="rx-role-page">

        <section
            class="rx-role-card"
            aria-labelledby="role-title"
        >

            <div class="rx-logo">
                <img
                    src="../assets/logo.png"
                    alt="RiderX"
                    onerror="this.style.display='none';"
                >
            </div>

            <div class="rx-brand">
                Rider<span>X</span>
            </div>

            <h1
                id="role-title"
                class="rx-title"
            >
                Choose your account
            </h1>

            <p class="rx-subtitle">
                Select how you want to use RiderX.
            </p>


            <div
                class="rx-role-options"
                role="radiogroup"
                aria-label="Account type"
            >

                <div class="rx-role-option">

                    <input
                        type="radio"
                        id="customer-role"
                        name="role"
                        value="customer"
                    >

                    <label
                        class="rx-role-label"
                        for="customer-role"
                    >

                        <span
                            class="rx-role-icon"
                            aria-hidden="true"
                        >
                            🧑
                        </span>

                        <span class="rx-role-info">

                            <span class="rx-role-name">
                                Customer
                            </span>

                            <span class="rx-role-description">
                                Book rides, track riders and manage bookings.
                            </span>

                        </span>

                        <span
                            class="rx-check"
                            aria-hidden="true"
                        ></span>

                    </label>

                </div>


                <div class="rx-role-option">

                    <input
                        type="radio"
                        id="rider-role"
                        name="role"
                        value="rider"
                    >

                    <label
                        class="rx-role-label"
                        for="rider-role"
                    >

                        <span
                            class="rx-role-icon"
                            aria-hidden="true"
                        >
                            🏍️
                        </span>

                        <span class="rx-role-info">

                            <span class="rx-role-name">
                                Rider
                            </span>

                            <span class="rx-role-description">
                                Accept rides, navigate and earn with RiderX.
                            </span>

                        </span>

                        <span
                            class="rx-check"
                            aria-hidden="true"
                        ></span>

                    </label>

                </div>

            </div>


            <button
                id="continue-btn"
                class="rx-continue"
                type="button"
                disabled
            >

                <span id="continue-text">
                    Continue
                </span>

                <span
                    id="continue-loading"
                    class="rx-loading"
                >

                    <span
                        class="rx-spinner"
                        aria-hidden="true"
                    ></span>

                    Please wait...

                </span>

            </button>


            <button
                id="register-btn"
                class="rx-register"
                type="button"
            >
                Create New Account
            </button>


            <div class="rx-login-text">

                Already have an account?

                <br>

                <a
                    id="login-link"
                    class="rx-login-link"
                    href="./login.html"
                >
                    Login
                </a>

            </div>


            <div
                id="role-message"
                class="rx-message"
                aria-live="polite"
            ></div>

        </section>

    </main>


    <script type="module">

        "use strict";


        /* =====================================================
           DOM
        ===================================================== */

        const customerRole =
            document.getElementById(
                "customer-role"
            );

        const riderRole =
            document.getElementById(
                "rider-role"
            );

        const continueButton =
            document.getElementById(
                "continue-btn"
            );

        const continueText =
            document.getElementById(
                "continue-text"
            );

        const continueLoading =
            document.getElementById(
                "continue-loading"
            );

        const registerButton =
            document.getElementById(
                "register-btn"
            );

        const loginLink =
            document.getElementById(
                "login-link"
            );

        const message =
            document.getElementById(
                "role-message"
            );


        /* =====================================================
           STORAGE
           -----------------------------------------------------
           Role is only a navigation preference.
           It is NEVER treated as authentication.
        ===================================================== */

        const SELECTED_ROLE_KEY =
            "riderx_selected_role";


        /* =====================================================
           CONSTANTS
        ===================================================== */

        const ROLE_CUSTOMER =
            "customer";

        const ROLE_RIDER =
            "rider";

        const LOGIN_ROUTE =
            "./login.html";

        /*
         * The canonical repository currently uses the common
         * authentication login page.
         *
         * Registration is opened through the same authentication
         * flow with the selected role supplied as a query value.
         *
         * This avoids creating/using duplicate auth pages.
         */

        const REGISTER_ROUTE =
            "./login.html";


        /* =====================================================
           ROLE NORMALIZATION
        ===================================================== */

        function normalizeRole(
            value
        ) {

            if (
                typeof value !== "string"
            ) {

                return "";
            }


            const role =
                value
                    .trim()
                    .toLowerCase();


            if (
                [
                    "customer",
                    "user",
                    "passenger"
                ].includes(role)
            ) {

                return ROLE_CUSTOMER;
            }


            if (
                [
                    "rider",
                    "driver",
                    "captain"
                ].includes(role)
            ) {

                return ROLE_RIDER;
            }


            return "";
        }


        /* =====================================================
           GET SELECTED ROLE
        ===================================================== */

        function getSelectedRole() {

            if (
                customerRole &&
                customerRole.checked
            ) {

                return ROLE_CUSTOMER;
            }


            if (
                riderRole &&
                riderRole.checked
            ) {

                return ROLE_RIDER;
            }


            return "";
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        function setMessage(
            text,
            type = ""
        ) {

            if (
                !message
            ) {

                return;
            }


            message.textContent =
                text;


            message.className =
                "rx-message";


            if (
                type
            ) {

                message.classList.add(
                    type
                );
            }
        }


        /* =====================================================
           SAVE SELECTED ROLE
        ===================================================== */

        function saveSelectedRole(
            role
        ) {

            const normalized =
                normalizeRole(
                    role
                );


            if (
                !normalized
            ) {

                return false;
            }


            try {

                localStorage.setItem(
                    SELECTED_ROLE_KEY,
                    normalized
                );


                return true;

            } catch (error) {

                console.warn(
                    "RiderX: unable to save selected role.",
                    error
                );


                return false;
            }
        }


        /* =====================================================
           READ SELECTED ROLE
        ===================================================== */

        function getSavedRole() {

            try {

                return normalizeRole(
                    localStorage.getItem(
                        SELECTED_ROLE_KEY
                    )
                );

            } catch (error) {

                console.warn(
                    "RiderX: unable to read selected role.",
                    error
                );


                return "";
            }
        }


        /* =====================================================
           UPDATE CONTINUE
        ===================================================== */

        function updateContinueState() {

            const role =
                getSelectedRole();


            if (
                continueButton
            ) {

                continueButton.disabled =
                    !role;
            }
        }


        /* =====================================================
           LOADING
        ===================================================== */

        function setLoading(
            loading
        ) {

            if (
                continueButton
            ) {

                continueButton.disabled =
                    loading ||
                    !getSelectedRole();
            }


            if (
                continueText
            ) {

                continueText.style.display =
                    loading
                        ? "none"
                        : "inline";
            }


            if (
                continueLoading
            ) {

                continueLoading.classList.toggle(
                    "active",
                    loading
                );
            }


            if (
                registerButton
            ) {

                registerButton.disabled =
                    loading;
            }
        }


        /* =====================================================
           BUILD LOGIN URL
        ===================================================== */

        function buildLoginUrl(
            role
        ) {

            const normalized =
                normalizeRole(
                    role
                );


            const url =
                new URL(
                    LOGIN_ROUTE,
                    window.location.href
                );


            if (
                normalized
            ) {

                url.searchParams.set(
                    "role",
                    normalized
                );
            }


            return (
                url.pathname
                +
                url.search
                +
                url.hash
            );
        }


        /* =====================================================
           BUILD REGISTER URL
           -----------------------------------------------------
           Uses the canonical login page because the repository
           must not invent a new auth/register.html route.
        ===================================================== */

        function buildRegisterUrl(
            role
        ) {

            const normalized =
                normalizeRole(
                    role
                );


            const url =
                new URL(
                    REGISTER_ROUTE,
                    window.location.href
                );


            url.searchParams.set(
                "mode",
                "register"
            );


            if (
                normalized
            ) {

                url.searchParams.set(
                    "role",
                    normalized
                );
            }


            return (
                url.pathname
                +
                url.search
                +
                url.hash
            );
        }


        /* =====================================================
           SELECT ROLE
        ===================================================== */

        function selectRole(
            role
        ) {

            const normalized =
                normalizeRole(
                    role
                );


            if (
                normalized === ROLE_CUSTOMER
                &&
                customerRole
            ) {

                customerRole.checked =
                    true;
            }


            if (
                normalized === ROLE_RIDER
                &&
                riderRole
            ) {

                riderRole.checked =
                    true;
            }


            if (
                normalized
            ) {

                saveSelectedRole(
                    normalized
                );
            }


            updateContinueState();

            setMessage(
                ""
            );
        }


        /* =====================================================
           ROLE CHANGE
        ===================================================== */

        if (
            customerRole
        ) {

            customerRole.addEventListener(
                "change",
                function () {

                    if (
                        customerRole.checked
                    ) {

                        selectRole(
                            ROLE_CUSTOMER
                        );
                    }
                }
            );
        }


        if (
            riderRole
        ) {

            riderRole.addEventListener(
                "change",
                function () {

                    if (
                        riderRole.checked
                    ) {

                        selectRole(
                            ROLE_RIDER
                        );
                    }
                }
            );
        }


        /* =====================================================
           CONTINUE
        ===================================================== */

        if (
            continueButton
        ) {

            continueButton.addEventListener(
                "click",
                function () {

                    const role =
                        getSelectedRole();


                    if (
                        !role
                    ) {

                        setMessage(
                            "Please select Customer or Rider.",
                            "error"
                        );


                        return;
                    }


                    saveSelectedRole(
                        role
                    );


                    setLoading(
                        true
                    );


                    setMessage(
                        "Opening login..."
                    );


                    window.setTimeout(
                        function () {

                            window.location.replace(
                                buildLoginUrl(
                                    role
                                )
                            );

                        },
                        120
                    );
                }
            );
        }


        /* =====================================================
           CREATE ACCOUNT
        ===================================================== */

        if (
            registerButton
        ) {

            registerButton.addEventListener(
                "click",
                function () {

                    const role =
                        getSelectedRole();


                    if (
                        !role
                    ) {

                        setMessage(
                            "Please select Customer or Rider first.",
                            "error"
                        );


                        return;
                    }


                    saveSelectedRole(
                        role
                    );


                    setLoading(
                        true
                    );


                    setMessage(
                        "Opening account registration..."
                    );


                    window.setTimeout(
                        function () {

                            window.location.replace(
                                buildRegisterUrl(
                                    role
                                )
                            );

                        },
                        120
                    );
                }
            );
        }


        /* =====================================================
           LOGIN LINK
        ===================================================== */

        if (
            loginLink
        ) {

            loginLink.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();


                    const role =
                        getSelectedRole()
                        ||
                        getSavedRole();


                    if (
                        role
                    ) {

                        saveSelectedRole(
                            role
                        );
                    }


                    window.location.replace(
                        buildLoginUrl(
                            role
                        )
                    );
                }
            );
        }


        /* =====================================================
           RESTORE SAVED ROLE
        ===================================================== */

        (function restoreRole() {

            const savedRole =
                getSavedRole();


            if (
                savedRole
            ) {

                selectRole(
                    savedRole
                );

            } else {

                updateContinueState();
            }
        })();


        /* =====================================================
           KEYBOARD ACCESSIBILITY
        ===================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key !== "Enter"
                    &&
                    event.key !== " "
                ) {

                    return;
                }


                const target =
                    event.target;


                if (
                    target === customerRole
                    ||
                    target === riderRole
                ) {

                    event.preventDefault();


                    target.checked =
                        true;


                    selectRole(
                        target.value
                    );
                }
            }
        );


        /* =====================================================
           PAGE SAFETY
        ===================================================== */

        window.addEventListener(
            "pageshow",
            function () {

                updateContinueState();
            }
        );

    </script>

</body>
</html>
