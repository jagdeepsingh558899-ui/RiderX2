<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX - Choose your account"
    >

    <title>RiderX - Choose Account</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #070707;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font: inherit;
        }

        .page {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
        }

        .glow {
            position: absolute;
            width: 430px;
            height: 430px;
            border-radius: 50%;
            pointer-events: none;
        }

        .glow.one {
            top: -300px;
            right: -180px;
            background: rgba(255, 212, 0, .08);
        }

        .glow.two {
            bottom: -300px;
            left: -190px;
            background: rgba(255, 212, 0, .05);
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            padding: 29px 22px 22px;
            border: 1px solid #292929;
            border-radius: 24px;
            background: #111111;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .55);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 19px;
            background: #ffd400;
            color: #090909;
            font-size: 23px;
            font-weight: 1000;
            box-shadow: 0 10px 35px rgba(255, 212, 0, .10);
        }

        .brand h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 1000;
            letter-spacing: -.5px;
        }

        .brand h1 span {
            color: #ffd400;
        }

        .brand p {
            margin: 6px 0 0;
            color: #777777;
            font-size: 9px;
        }

        .heading {
            text-align: center;
        }

        .heading h2 {
            margin: 0;
            font-size: 19px;
            font-weight: 900;
        }

        .heading p {
            margin: 7px auto 0;
            max-width: 330px;
            color: #777777;
            font-size: 9px;
            line-height: 1.6;
        }

        .roles {
            display: grid;
            gap: 11px;
            margin-top: 23px;
        }

        .role {
            position: relative;
            width: 100%;
            min-height: 88px;
            display: grid;
            grid-template-columns: 52px 1fr 25px;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid #303030;
            border-radius: 15px;
            background: #171717;
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            transition:
                transform .15s ease,
                border-color .15s ease,
                background .15s ease;
        }

        .role:hover {
            transform: translateY(-1px);
            border-color: #ffd400;
            background: #1a1a1a;
        }

        .role:active {
            transform: scale(.99);
        }

        .role-icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: #222222;
            color: #ffd400;
            font-size: 16px;
            font-weight: 1000;
        }

        .role-content strong {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: 1000;
        }

        .role-content span {
            display: block;
            color: #777777;
            font-size: 8px;
            line-height: 1.5;
        }

        .arrow {
            color: #555555;
            font-size: 16px;
            font-weight: 900;
        }

        .role:hover .arrow {
            color: #ffd400;
        }

        .quick-login {
            margin-top: 18px;
            padding-top: 17px;
            border-top: 1px solid #252525;
        }

        .quick-title {
            margin-bottom: 9px;
            color: #666666;
            font-size: 8px;
            text-align: center;
        }

        .login-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .login-button {
            min-height: 42px;
            border: 1px solid #303030;
            border-radius: 9px;
            background: #181818;
            color: #aaaaaa;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .login-button:hover {
            border-color: #ffd400;
            color: #ffd400;
        }

        .footer {
            margin-top: 18px;
            color: #444444;
            font-size: 8px;
            text-align: center;
        }

        .status {
            display: none;
            margin-top: 13px;
            padding: 9px;
            border: 1px solid #275335;
            border-radius: 8px;
            background: #132319;
            color: #65e58b;
            font-size: 8px;
            line-height: 1.5;
            text-align: center;
        }

        .status.show {
            display: block;
        }

        @media (max-width: 390px) {

            .card {
                padding: 24px 16px 19px;
                border-radius: 20px;
            }

            .role {
                grid-template-columns: 46px 1fr 20px;
                min-height: 82px;
                padding: 11px;
            }

            .role-icon {
                width: 46px;
                height: 46px;
            }

        }

    </style>

</head>

<body>

<main class="page">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <section class="card">

        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                One platform. Every journey.
            </p>

        </div>


        <div class="heading">

            <h2>
                How will you use RiderX?
            </h2>

            <p>
                Select your account type to continue
                to the correct RiderX experience.
            </p>

        </div>


        <div class="roles">

            <button
                type="button"
                class="role"
                id="customerOption"
            >

                <div class="role-icon">
                    C
                </div>

                <div class="role-content">

                    <strong>
                        I'm a Customer
                    </strong>

                    <span>
                        Book Bike Taxi, Cab, Parcel and
                        other RiderX services.
                    </span>

                </div>

                <div class="arrow">
                    →
                </div>

            </button>


            <button
                type="button"
                class="role"
                id="riderOption"
            >

                <div class="role-icon">
                    R
                </div>

                <div class="role-content">

                    <strong>
                        I'm a Rider
                    </strong>

                    <span>
                        Drive with RiderX, accept rides,
                        navigate and manage earnings.
                    </span>

                </div>

                <div class="arrow">
                    →
                </div>

            </button>

        </div>


        <div
            class="status"
            id="status"
        ></div>


        <div class="quick-login">

            <div class="quick-title">
                ALREADY HAVE AN ACCOUNT?
            </div>

            <div class="login-grid">

                <button
                    type="button"
                    class="login-button"
                    id="customerLogin"
                >
                    Customer Login
                </button>

                <button
                    type="button"
                    class="login-button"
                    id="riderLogin"
                >
                    Rider Login
                </button>

            </div>

        </div>


        <div class="footer">
            © 2026 RiderX • India 🇮🇳
        </div>

    </section>

</main>


<script>

    "use strict";


    const customerOption =
        document.getElementById(
            "customerOption"
        );


    const riderOption =
        document.getElementById(
            "riderOption"
        );


    const customerLogin =
        document.getElementById(
            "customerLogin"
        );


    const riderLogin =
        document.getElementById(
            "riderLogin"
        );


    const status =
        document.getElementById(
            "status"
        );


    function setRole(
        role
    ) {

        localStorage.setItem(
            "riderx_selected_role",
            role
        );

        localStorage.setItem(
            "riderx_role",
            role
        );

    }


    function showStatus(
        text
    ) {

        status.textContent =
            text;

        status.classList.add(
            "show"
        );

    }


    customerOption.addEventListener(
        "click",
        function () {

            setRole(
                "customer"
            );

            showStatus(
                "Opening Customer experience..."
            );

            setTimeout(
                function () {

                    window.location.href =
                        "./customer-login.html";

                },
                180
            );

        }
    );


    riderOption.addEventListener(
        "click",
        function () {

            setRole(
                "rider"
            );

            showStatus(
                "Opening Rider / Driver Partner experience..."
            );

            setTimeout(
                function () {

                    window.location.href =
                        "./rider-login.html";

                },
                180
            );

        }
    );


    customerLogin.addEventListener(
        "click",
        function () {

            setRole(
                "customer"
            );

            window.location.href =
                "./customer-login.html";

        }
    );


    riderLogin.addEventListener(
        "click",
        function () {

            setRole(
                "rider"
            );

            window.location.href =
                "./rider-login.html";

        }
    );


    /*
     * If another RiderX page intentionally sends a user
     * here with a selected role, keep that role available.
     */

    const existingRole =
        localStorage.getItem(
            "riderx_selected_role"
        );


    if (
        existingRole === "customer" ||
        existingRole === "rider"
    ) {

        /*
         * No automatic redirect here.
         * This page remains the safe central role gate.
         */

    }

</script>

</body>

</html>
