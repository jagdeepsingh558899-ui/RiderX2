<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#FFD400"
    >

    <meta
        name="description"
        content="RiderX - Choose your account type"
    >

    <meta
        name="color-scheme"
        content="dark"
    >

    <title>RiderX - Choose Account</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

    <style>

        :root {
            --rx-yellow: #FFD400;
            --rx-black: #070707;
            --rx-card: #111111;
            --rx-card-2: #171717;
            --rx-border: #292929;
            --rx-text: #ffffff;
            --rx-muted: #777777;
            --rx-danger: #ff7777;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        html {
            background: var(--rx-black);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background: var(--rx-black);
            color: var(--rx-text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
        }

        button:disabled {
            cursor: not-allowed;
        }

        .page {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
        }

        .glow {
            position: absolute;

            width: 430px;
            height: 430px;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(2px);

            z-index: 0;
        }

        .glow.one {
            top: -300px;
            right: -180px;

            background:
                rgba(255, 212, 0, .09);
        }

        .glow.two {
            bottom: -300px;
            left: -190px;

            background:
                rgba(255, 212, 0, .06);
        }

        .card {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 460px;

            padding: 29px 22px 22px;

            border: 1px solid var(--rx-border);

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(22, 22, 22, .98),
                    rgba(12, 12, 12, .98)
                );

            box-shadow:
                0 25px 80px rgba(0, 0, 0, .55),
                0 0 40px rgba(255, 212, 0, .025);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 68px;
            height: 68px;

            margin: 0 auto 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 19px;

            background: var(--rx-yellow);
            color: #090909;

            font-size: 23px;
            font-weight: 900;

            box-shadow:
                0 10px 35px
                rgba(255, 212, 0, .14);

            user-select: none;
        }

        .brand h1 {
            margin: 0;

            font-size: 26px;
            line-height: 1.1;
            font-weight: 900;

            letter-spacing: -.5px;
        }

        .brand h1 span {
            color: var(--rx-yellow);
        }

        .brand p {
            margin: 7px 0 0;

            color: var(--rx-muted);

            font-size: 11px;
            line-height: 1.4;
        }

        .heading {
            text-align: center;
        }

        .heading h2 {
            margin: 0;

            font-size: 19px;
            line-height: 1.25;
            font-weight: 900;
        }

        .heading p {
            margin: 8px auto 0;

            max-width: 330px;

            color: var(--rx-muted);

            font-size: 11px;
            line-height: 1.55;
        }

        .roles {
            display: grid;

            gap: 11px;

            margin-top: 23px;
        }

        .role {
            position: relative;

            width: 100%;
            min-height: 88px;

            display: grid;

            grid-template-columns:
                52px minmax(0, 1fr) 25px;

            align-items: center;

            gap: 12px;

            padding: 14px;

            border:
                1px solid #303030;

            border-radius: 15px;

            background: var(--rx-card-2);
            color: #fff;

            cursor: pointer;

            text-align: left;

            appearance: none;
            -webkit-appearance: none;

            transition:
                transform .15s ease,
                border-color .15s ease,
                background .15s ease,
                box-shadow .15s ease;
        }

        .role:hover {
            transform: translateY(-1px);

            border-color: var(--rx-yellow);

            background: #1a1a1a;

            box-shadow:
                0 8px 25px
                rgba(255, 212, 0, .06);
        }

        .role:focus {
            outline: none;
        }

        .role:focus-visible {
            outline:
                2px solid
                var(--rx-yellow);

            outline-offset: 3px;
        }

        .role:active {
            transform: scale(.99);
        }

        .role-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: #222;
            color: var(--rx-yellow);

            font-size: 16px;
            font-weight: 900;

            user-select: none;
        }

        .role-content {
            min-width: 0;
        }

        .role-content strong {
            display: block;

            margin-bottom: 5px;

            color: #fff;

            font-size: 13px;
            line-height: 1.25;
            font-weight: 900;
        }

        .role-content span {
            display: block;

            color: var(--rx-muted);

            font-size: 10px;
            line-height: 1.5;
        }

        .arrow {
            color: #555;

            font-size: 18px;
            line-height: 1;

            font-weight: 900;

            transition:
                color .15s ease,
                transform .15s ease;

            user-select: none;
        }

        .role:hover .arrow {
            color: var(--rx-yellow);
            transform: translateX(2px);
        }

        .quick-login {
            margin-top: 18px;
            padding-top: 17px;

            border-top:
                1px solid #252525;
        }

        .quick-title {
            margin-bottom: 9px;

            color: #666;

            font-size: 9px;
            line-height: 1.3;

            text-align: center;

            letter-spacing: .4px;
        }

        .login-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;
        }

        .login-button {
            min-height: 44px;

            border:
                1px solid #303030;

            border-radius: 10px;

            background: #181818;
            color: #aaa;

            cursor: pointer;

            font-size: 10px;
            font-weight: 900;

            appearance: none;
            -webkit-appearance: none;

            transition:
                border-color .15s ease,
                color .15s ease,
                background .15s ease,
                transform .15s ease;
        }

        .login-button:hover {
            border-color: var(--rx-yellow);

            color: var(--rx-yellow);

            background: #1b1b1b;
        }

        .login-button:active {
            transform: scale(.98);
        }

        .login-button:focus {
            outline: none;
        }

        .login-button:focus-visible {
            outline:
                2px solid
                var(--rx-yellow);

            outline-offset: 2px;
        }

        .status {
            display: none;

            margin-top: 13px;
            padding: 10px 11px;

            border:
                1px solid
                #443b00;

            border-radius: 9px;

            background:
                rgba(255, 212, 0, .07);

            color: var(--rx-yellow);

            font-size: 10px;
            line-height: 1.5;

            text-align: center;
        }

        .status.show {
            display: block;
        }

        .status.error {
            border-color: #5a2222;

            background:
                rgba(255, 60, 60, .07);

            color: var(--rx-danger);
        }

        .footer {
            margin-top: 18px;

            color: #444;

            font-size: 9px;
            line-height: 1.4;

            text-align: center;
        }

        @media (max-width: 390px) {

            .page {
                align-items: flex-start;

                padding-top:
                    max(
                        16px,
                        env(safe-area-inset-top)
                    );
            }

            .card {
                padding:
                    24px 16px 19px;

                border-radius: 20px;
            }

            .brand {
                margin-bottom: 22px;
            }

            .logo {
                width: 62px;
                height: 62px;

                border-radius: 17px;

                font-size: 21px;
            }

            .brand h1 {
                font-size: 24px;
            }

            .heading h2 {
                font-size: 18px;
            }

            .role {
                grid-template-columns:
                    46px minmax(0, 1fr) 20px;

                min-height: 82px;

                padding: 11px;

                gap: 10px;
            }

            .role-icon {
                width: 46px;
                height: 46px;
            }

            .role-content strong {
                font-size: 12px;
            }

            .role-content span {
                font-size: 9px;
            }

            .arrow {
                font-size: 16px;
            }
        }

        @media (max-height: 650px) {

            .page {
                align-items: flex-start;

                padding-top:
                    max(
                        12px,
                        env(safe-area-inset-top)
                    );

                padding-bottom:
                    max(
                        12px,
                        env(safe-area-inset-bottom)
                    );
            }

            .card {
                margin-top: 0;
            }

            .brand {
                margin-bottom: 16px;
            }

            .logo {
                width: 56px;
                height: 56px;

                margin-bottom: 8px;
            }

            .roles {
                margin-top: 16px;
            }

            .quick-login {
                margin-top: 14px;
                padding-top: 13px;
            }

            .footer {
                margin-top: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .role,
            .arrow,
            .login-button {
                transition: none;
            }
        }

    </style>

</head>

<body>

<main class="page">

    <div
        class="glow one"
        aria-hidden="true"
    ></div>

    <div
        class="glow two"
        aria-hidden="true"
    ></div>


    <section
        class="card"
        aria-labelledby="pageTitle"
    >

        <div class="brand">

            <div
                class="logo"
                aria-hidden="true"
            >
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                One platform. Every journey.
            </p>

        </div>


        <div class="heading">

            <h2 id="pageTitle">
                How will you use RiderX?
            </h2>

            <p>
                Select your account type to continue
                to the correct RiderX login.
            </p>

        </div>


        <div class="roles">

            <button
                type="button"
                class="role"
                id="customerOption"
                aria-label="Continue as Customer"
            >

                <div
                    class="role-icon"
                    aria-hidden="true"
                >
                    C
                </div>

                <div class="role-content">

                    <strong>
                        I'm a Customer
                    </strong>

                    <span>
                        Book Bike Taxi, Cab, Parcel
                        and other RiderX services.
                    </span>

                </div>

                <div
                    class="arrow"
                    aria-hidden="true"
                >
                    →
                </div>

            </button>


            <button
                type="button"
                class="role"
                id="riderOption"
                aria-label="Continue as Rider or Driver"
            >

                <div
                    class="role-icon"
                    aria-hidden="true"
                >
                    R
                </div>

                <div class="role-content">

                    <strong>
                        I'm a Rider
                    </strong>

                    <span>
                        Drive with RiderX, accept rides,
                        navigate and manage earnings.
                    </span>

                </div>

                <div
                    class="arrow"
                    aria-hidden="true"
                >
                    →
                </div>

            </button>

        </div>


        <div
            class="status"
            id="status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        ></div>


        <div class="quick-login">

            <div class="quick-title">
                ALREADY HAVE AN ACCOUNT?
            </div>

            <div class="login-grid">

                <button
                    type="button"
                    class="login-button"
                    id="customerLogin"
                >
                    Customer Login
                </button>

                <button
                    type="button"
                    class="login-button"
                    id="riderLogin"
                >
                    Rider Login
                </button>

            </div>

        </div>


        <div class="footer">
            © 2026 RiderX • India
        </div>

    </section>

</main>


<script>

"use strict";


/* =========================================================
   RIDERX ROLE SELECTION ENGINE
   =========================================================

   FLOW:

   index.html
        ↓
   auth/role.html
        ↓
   Customer / Rider selection
        ↓
   auth/login.html?role=customer
   OR
   auth/login.html?role=rider
        ↓
   Firebase authentication
        ↓
   auth.js resolves real Firebase/Firestore role
        ↓
   Customer / Rider dashboard

   IMPORTANT:
   This page NEVER authenticates a user.
   This page NEVER sends a user directly to a dashboard.
   ========================================================= */


/* =========================================================
   CONSTANTS
========================================================= */

const ROLE_KEY =
    "riderx_selected_role";

const LEGACY_ROLE_KEY =
    "riderx_role";

const LOGIN_PAGE =
    "./login.html";


/* =========================================================
   ELEMENTS
========================================================= */

const customerOption =
    document.getElementById(
        "customerOption"
    );

const riderOption =
    document.getElementById(
        "riderOption"
    );

const customerLogin =
    document.getElementById(
        "customerLogin"
    );

const riderLogin =
    document.getElementById(
        "riderLogin"
    );

const statusBox =
    document.getElementById(
        "status"
    );


/* =========================================================
   ROLE NORMALIZATION
========================================================= */

function normalizeRole(role) {

    const value =
        String(role ?? "")
            .trim()
            .toLowerCase()
            .replace(
                /[\s-]+/g,
                "_"
            );


    if (
        [
            "customer",
            "customers",
            "user",
            "users"
        ].includes(value)
    ) {

        return "customer";

    }


    if (
        [
            "rider",
            "riders",
            "driver",
            "drivers",
            "partner",
            "driver_partner",
            "driverpartner",
            "captain"
        ].includes(value)
    ) {

        return "rider";

    }


    return "";

}


/* =========================================================
   SAVE SELECTED ROLE
========================================================= */

function saveRole(role) {

    const normalized =
        normalizeRole(role);


    if (!normalized) {
        return false;
    }


    try {

        localStorage.setItem(
            ROLE_KEY,
            normalized
        );

        localStorage.setItem(
            LEGACY_ROLE_KEY,
            normalized
        );

        return true;

    } catch (error) {

        console.warn(
            "RiderX role storage unavailable:",
            error
        );

        /*
         * The URL still carries ?role=customer/rider,
         * so login can continue even if localStorage
         * is blocked.
         */

        return false;

    }

}


/* =========================================================
   READ ROLE FROM URL
========================================================= */

function getUrlRole() {

    try {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return normalizeRole(
            params.get("role")
        );

    } catch (error) {

        console.warn(
            "RiderX URL role parsing failed:",
            error
        );

        return "";

    }

}


/* =========================================================
   READ STORED ROLE
========================================================= */

function getStoredRole() {

    try {

        return normalizeRole(

            localStorage.getItem(
                ROLE_KEY
            )

            ||

            localStorage.getItem(
                LEGACY_ROLE_KEY
            )

        );

    } catch (error) {

        console.warn(
            "RiderX role storage read failed:",
            error
        );

        return "";

    }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    text,
    type
) {

    if (!statusBox) {
        return;
    }


    const message =
        String(text ?? "").trim();


    if (!message) {

        clearStatus();

        return;

    }


    statusBox.textContent =
        message;


    statusBox.className =
        "status show";


    if (
        type === "error"
    ) {

        statusBox.classList.add(
            "error"
        );

    }

}


function clearStatus() {

    if (!statusBox) {
        return;
    }


    statusBox.textContent =
        "";

    statusBox.className =
        "status";

}


/* =========================================================
   LOGIN NAVIGATION
========================================================= */

function openLogin(role) {

    const normalized =
        normalizeRole(role);


    if (
        normalized !== "customer" &&
        normalized !== "rider"
    ) {

        showStatus(
            "Please select a valid RiderX account type.",
            "error"
        );

        return;

    }


    /*
     * Save role for login.html.
     *
     * URL also contains the role, so the flow does not
     * depend exclusively on localStorage.
     */

    saveRole(
        normalized
    );


    const destination =
        LOGIN_PAGE +
        "?role=" +
        encodeURIComponent(
            normalized
        );


    showStatus(
        normalized === "customer"
            ? "Opening Customer login..."
            : "Opening Rider login..."
    );


    /*
     * Small delay gives the user feedback and allows
     * the browser to complete the click interaction.
     */

    window.setTimeout(
        function () {

            window.location.replace(
                destination
            );

        },
        120
    );

}


/* =========================================================
   CUSTOMER BUTTON
========================================================= */

if (customerOption) {

    customerOption.addEventListener(
        "click",
        function () {

            openLogin(
                "customer"
            );

        }
    );

}


/* =========================================================
   RIDER BUTTON
========================================================= */

if (riderOption) {

    riderOption.addEventListener(
        "click",
        function () {

            openLogin(
                "rider"
            );

        }
    );

}


/* =========================================================
   QUICK CUSTOMER LOGIN
========================================================= */

if (customerLogin) {

    customerLogin.addEventListener(
        "click",
        function () {

            openLogin(
                "customer"
            );

        }
    );

}


/* =========================================================
   QUICK RIDER LOGIN
========================================================= */

if (riderLogin) {

    riderLogin.addEventListener(
        "click",
        function () {

            openLogin(
                "rider"
            );

        }
    );

}


/* =========================================================
   URL ROLE PRESERVATION
=========================================================

   If role.html is opened as:

   role.html?role=customer

   or:

   role.html?role=rider

   remember that role.

   This DOES NOT authenticate or redirect to a dashboard.
========================================================= */

(function preserveUrlRole() {

    const urlRole =
        getUrlRole();


    if (
        urlRole === "customer" ||
        urlRole === "rider"
    ) {

        saveRole(
            urlRole
        );

    }

})();


/* =========================================================
   CLEAR INITIAL STATUS
========================================================= */

clearStatus();


/* =========================================================
   DEBUG-SAFE STARTUP
========================================================= */

window.RiderXRole =
    Object.freeze({

        normalizeRole,
        saveRole,
        getUrlRole,
        getStoredRole

    });


</script>

</body>
</html>
