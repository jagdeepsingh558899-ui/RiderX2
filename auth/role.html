html,

.heading{

}

.heading h2{
    margin:0;

    font-weight:900;
}

.heading p{

.roles{

.role{
    position:relative;

        52px 1fr 25px;

.role:hover .arrow{

    transform:translateX(2px);
}

.quick-login{

}

.quick-title{
    margin-bottom:9px;

.login-grid{

}

.login-button{
    min-height:42px;

    border:
        1px solid #303030;

    border-radius:9px;

    background:#181818;
    color:#aaa;

    cursor:pointer;

    font-size:9px;
    font-weight:900;

    transition:
        border-color .15s ease,
        color .15s ease,
        background .15s ease;
}

.login-button:hover{
    border-color:#FFD400;

    color:#FFD400;

    background:#1b1b1b;
}

.login-button:focus-visible{
    outline:2px solid #FFD400;
    outline-offset:2px;
}

.status{
    display:none;

    margin-top:13px;
    padding:9px;

    border:
        1px solid #443b00;

    border-radius:8px;

    color:#FFD400;

.status.show{

}

.status.error{
    border-color:#5a2222;

    background:
        rgba(255,60,60,.07);

.footer{

@media(max-width:390px){

@media(prefers-reduced-motion:reduce){

    .role,
    .arrow,
    .login-button{

</style></head><body><main class="page"><div

</section></main><script>

"use strict";


/* =========================================================
   CONSTANTS
========================================================= */

const ROLE_KEY =
    "riderx_selected_role";

const LEGACY_ROLE_KEY =
    "riderx_role";

const LOGIN_PAGE =
    "./login.html";


/* =========================================================
   ELEMENTS
========================================================= */

const customerOption =
    document.getElementById(
        "customerOption"
    );

const riderOption =
    document.getElementById(
        "riderOption"
    );

const customerLogin =
    document.getElementById(
        "customerLogin"
    );

const riderLogin =
    document.getElementById(
        "riderLogin"
    );

const status =
    document.getElementById(
        "status"
    );


/* =========================================================
   ROLE NORMALIZATION
========================================================= */

function normalizeRole(role){

    const value =
        String(role || "")
            .trim()
            .toLowerCase()
            .replace(
                /[\s-]+/g,
                "_"
            );


    if(
        [
            "customer",
            "user",
            "users"
        ].includes(value)
    ){

        return "customer";

    }


    if(
        [
            "rider",
            "driver",
            "partner",
            "riders",
            "drivers"
        ].includes(value)
    ){

        return "rider";

    }


    return "";

}


/* =========================================================
   STORAGE
========================================================= */

function setRole(role){

    const normalized =
        normalizeRole(role);


    if(!normalized){
        return false;
    }


    try{

        localStorage.setItem(
            ROLE_KEY,
            normalized
        );


        localStorage.setItem(
            LEGACY_ROLE_KEY,
            normalized
        );


        return true;

    }catch(error){

        console.warn(
            "RiderX role storage failed:",
            error
        );

        return false;

    }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    text,
    type = ""
){

    if(!status){
        return;
    }


    status.textContent =
        String(text || "");


    status.className =
        "status show";


    if(type){

        status.classList.add(
            type
        );

    }

}


function clearStatus(){

    if(!status){
        return;
    }


    status.textContent =
        "";

    status.className =
        "status";

}


/* =========================================================
   OPEN LOGIN
========================================================= */

function openLogin(role){

    const normalized =
        normalizeRole(role);


    if(!normalized){

        showStatus(
            "Please select a valid RiderX account type.",
            "error"
        );

        return;

    }


    /*
     * This only remembers the user's selected login type.
     * It does NOT authenticate the user.
     */

    setRole(
        normalized
    );


    showStatus(
        normalized === "customer"
            ? "Opening Customer login..."
            : "Opening Rider / Driver login..."
    );


    const destination =
        LOGIN_PAGE +
        "?role=" +
        encodeURIComponent(
            normalized
        );


    window.setTimeout(
        function(){

            window.location.replace(
                destination
            );

        },
        180
    );

}


/* =========================================================
   CUSTOMER
========================================================= */

if(customerOption){

    customerOption.addEventListener(
        "click",
        function(){
            openLogin("customer");
        }
    );

}


/* =========================================================
   RIDER
========================================================= */

if(riderOption){

    riderOption.addEventListener(
        "click",
        function(){
            openLogin("rider");
        }
    );

}


/* =========================================================
   QUICK CUSTOMER LOGIN
========================================================= */

if(customerLogin){

    customerLogin.addEventListener(
        "click",
        function(){
            openLogin("customer");
        }
    );

}


/* =========================================================
   QUICK RIDER LOGIN
========================================================= */

if(riderLogin){

    riderLogin.addEventListener(
        "click",
        function(){
            openLogin("rider");
        }
    );

}


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

if(customerOption){

    customerOption.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                openLogin("customer");

            }

        }
    );

}


if(riderOption){

    riderOption.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                openLogin("rider");

            }

        }
    );

}


/* =========================================================
   URL ROLE
   ---------------------------------------------------------
   URL role is only remembered.
   It NEVER auto-opens a dashboard.
========================================================= */

(function preserveUrlRole(){

    try{

        const params =
            new URLSearchParams(
                window.location.search
            );


        const urlRole =
            normalizeRole(
                params.get("role")
            );


        if(urlRole){

            setRole(
                urlRole
            );

        }

    }catch(error){

        console.warn(
            "RiderX role URL parsing failed:",
            error
        );

    }

})();


/* =========================================================
   IMPORTANT
   ---------------------------------------------------------
   There is intentionally NO automatic redirect here.

   role.html is the authentication entry gate.
   User must explicitly choose Customer/Rider and
   then complete login.
========================================================= */

clearStatus();

</script></body></html>
