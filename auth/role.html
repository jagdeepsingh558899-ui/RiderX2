<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#FFD400"
    >

    <meta
        name="description"
        content="Choose your RiderX account type"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

    <link
        rel="icon"
        href="../assets/logo.png"
    >

    <title>RiderX — Choose Account</title>

    <style>
        :root {
            --rx-yellow: #ffd400;
            --rx-yellow-hover: #ffe04a;
            --rx-black: #050505;
            --rx-card: #101010;
            --rx-card-2: #151515;
            --rx-border: rgba(255, 255, 255, 0.09);
            --rx-text: #ffffff;
            --rx-muted: #999999;
            --rx-danger: #ff7070;
            --rx-success: #70e890;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        html {
            background: var(--rx-black);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background:
                radial-gradient(
                    circle at 50% 5%,
                    rgba(255, 212, 0, 0.13),
                    transparent 34%
                ),
                var(--rx-black);

            color: var(--rx-text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input {
            font: inherit;
        }

        button,
        label,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--rx-yellow);
            outline-offset: 3px;
        }

        .rx-role-page {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(24px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));
        }

        .rx-role-card {
            width: 100%;
            max-width: 430px;

            padding: 28px 21px;

            border: 1px solid var(--rx-border);
            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(25, 25, 25, 0.98),
                    rgba(10, 10, 10, 0.99)
                );

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55);
        }

        .rx-logo {
            width: 72px;
            height: 72px;

            margin: 0 auto 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 21px;

            border: 1px solid
                rgba(255, 212, 0, 0.35);

            background: #0d0d0d;

            overflow: hidden;

            box-shadow:
                0 12px 35px rgba(255, 212, 0, 0.10);
        }

        .rx-logo img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;
        }

        .rx-logo-fallback {
            display: none;

            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;

            background: var(--rx-yellow);
            color: #000;

            font-size: 23px;
            font-weight: 950;
            letter-spacing: -1px;
        }

        .rx-brand {
            text-align: center;

            color: #fff;

            font-size: 30px;
            font-weight: 950;

            letter-spacing: -1px;
        }

        .rx-brand span {
            color: var(--rx-yellow);
        }

        .rx-title {
            margin: 25px 0 8px;

            text-align: center;

            color: #fff;

            font-size: 24px;
            font-weight: 850;

            letter-spacing: -0.4px;
        }

        .rx-subtitle {
            max-width: 330px;

            margin: 0 auto 23px;

            text-align: center;

            color: var(--rx-muted);

            font-size: 14px;
            line-height: 1.5;
        }

        .rx-role-options {
            display: grid;
            gap: 12px;
        }

        .rx-role-option {
            position: relative;
        }

        .rx-role-option input {
            position: absolute;

            width: 1px;
            height: 1px;

            margin: -1px;
            padding: 0;

            overflow: hidden;
            clip: rect(0, 0, 0, 0);

            white-space: nowrap;

            border: 0;
        }

        .rx-role-label {
            min-height: 88px;

            display: flex;
            align-items: center;

            gap: 14px;

            padding: 14px;

            border: 1px solid
                rgba(255, 255, 255, 0.09);

            border-radius: 18px;

            background: #101010;

            cursor: pointer;

            user-select: none;

            transition:
                border-color 0.18s ease,
                background 0.18s ease,
                transform 0.15s ease,
                box-shadow 0.18s ease;
        }

        .rx-role-label:hover {
            border-color:
                rgba(255, 212, 0, 0.35);
        }

        .rx-role-label:active {
            transform: scale(0.985);
        }

        .rx-role-option input:focus-visible
        + .rx-role-label {
            outline: 2px solid var(--rx-yellow);
            outline-offset: 3px;
        }

        .rx-role-option input:checked
        + .rx-role-label {
            border-color: var(--rx-yellow);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 212, 0, 0.14),
                    rgba(255, 212, 0, 0.035)
                );

            box-shadow:
                0 0 0 1px
                rgba(255, 212, 0, 0.12),
                0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .rx-role-icon {
            flex: 0 0 52px;

            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                rgba(255, 212, 0, 0.09);

            font-size: 25px;
        }

        .rx-role-info {
            flex: 1;
            min-width: 0;
        }

        .rx-role-name {
            display: block;

            color: #fff;

            font-size: 16px;
            font-weight: 850;
        }

        .rx-role-description {
            display: block;

            margin-top: 4px;

            color: #8e8e8e;

            font-size: 12px;
            line-height: 1.4;
        }

        .rx-check {
            position: relative;

            flex: 0 0 22px;

            width: 22px;
            height: 22px;

            border: 2px solid #555;
            border-radius: 50%;

            transition:
                background 0.18s ease,
                border-color 0.18s ease;
        }

        .rx-role-option input:checked
        + .rx-role-label
        .rx-check {
            border-color: var(--rx-yellow);
            background: var(--rx-yellow);
        }

        .rx-role-option input:checked
        + .rx-role-label
        .rx-check::after {
            content: "";

            position: absolute;

            width: 6px;
            height: 10px;

            left: 6px;
            top: 3px;

            border: solid #050505;
            border-width: 0 2px 2px 0;

            transform: rotate(45deg);
        }

        .rx-continue {
            width: 100%;

            min-height: 54px;

            margin-top: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 15px;

            background: var(--rx-yellow);
            color: #050505;

            font-size: 15px;
            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(255, 212, 0, 0.12);

            transition:
                background 0.18s ease,
                transform 0.15s ease,
                opacity 0.18s ease;
        }

        .rx-continue:not(:disabled):hover {
            background: var(--rx-yellow-hover);
            transform: translateY(-1px);
        }

        .rx-continue:not(:disabled):active {
            transform: translateY(0);
        }

        .rx-continue:disabled {
            opacity: 0.42;
            cursor: not-allowed;
            box-shadow: none;
        }

        .rx-register {
            width: 100%;

            min-height: 49px;

            margin-top: 12px;

            border: 1px solid
                rgba(255, 212, 0, 0.32);

            border-radius: 15px;

            background: transparent;
            color: var(--rx-yellow);

            font-size: 14px;
            font-weight: 850;

            cursor: pointer;

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                transform 0.15s ease,
                opacity 0.18s ease;
        }

        .rx-register:hover {
            border-color:
                rgba(255, 212, 0, 0.55);

            background:
                rgba(255, 212, 0, 0.06);
        }

        .rx-register:active {
            transform: scale(0.985);
        }

        .rx-register:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .rx-login-text {
            margin-top: 21px;

            text-align: center;

            color: #888;

            font-size: 13px;
            line-height: 1.5;
        }

        .rx-login-link {
            display: inline-block;

            margin-top: 6px;

            color: var(--rx-yellow);

            font-weight: 850;

            text-decoration: none;
        }

        .rx-login-link:hover {
            text-decoration: underline;
        }

        .rx-message {
            min-height: 20px;

            margin-top: 13px;

            text-align: center;

            color: var(--rx-muted);

            font-size: 12px;
            line-height: 1.45;

            overflow-wrap: anywhere;
        }

        .rx-message.error {
            color: var(--rx-danger);
        }

        .rx-message.success {
            color: var(--rx-success);
        }

        .rx-loading {
            display: none;

            align-items: center;
            justify-content: center;

            gap: 8px;
        }

        .rx-loading.active {
            display: flex;
        }

        .rx-spinner {
            width: 17px;
            height: 17px;

            border: 2px solid
                rgba(0, 0, 0, 0.22);

            border-top-color: #050505;

            border-radius: 50%;

            animation:
                rx-spin 0.7s linear infinite;
        }

        @keyframes rx-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .rx-role-page {
                align-items: flex-start;

                padding-top:
                    max(30px, env(safe-area-inset-top));
            }

            .rx-role-card {
                padding: 24px 18px;
            }
        }

        @media (max-width: 360px) {
            .rx-role-card {
                padding: 21px 15px;
                border-radius: 21px;
            }

            .rx-logo {
                width: 64px;
                height: 64px;
                border-radius: 19px;
            }

            .rx-brand {
                font-size: 27px;
            }

            .rx-title {
                margin-top: 21px;
                font-size: 21px;
            }

            .rx-role-label {
                min-height: 80px;
                padding: 12px;
            }

            .rx-role-icon {
                flex-basis: 46px;
                width: 46px;
                height: 46px;
                border-radius: 14px;
            }

            .rx-role-description {
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

<main class="rx-role-page">

    <section
        class="rx-role-card"
        aria-labelledby="role-title"
    >

        <div class="rx-logo">

            <img
                id="rxLogoImage"
                src="../assets/logo.png"
                alt="RiderX"
            >

            <span
                id="rxLogoFallback"
                class="rx-logo-fallback"
                aria-hidden="true"
            >
                RX
            </span>

        </div>

        <div class="rx-brand">
            Rider<span>X</span>
        </div>

        <h1
            id="role-title"
            class="rx-title"
        >
            Choose your account
        </h1>

        <p class="rx-subtitle">
            Select how you want to use RiderX.
        </p>


        <div
            class="rx-role-options"
            role="radiogroup"
            aria-label="Account type"
        >

            <div class="rx-role-option">

                <input
                    type="radio"
                    id="customer-role"
                    name="role"
                    value="customer"
                    aria-label="Customer"
                >

                <label
                    class="rx-role-label"
                    for="customer-role"
                >

                    <span
                        class="rx-role-icon"
                        aria-hidden="true"
                    >
                        🧑
                    </span>

                    <span class="rx-role-info">

                        <span class="rx-role-name">
                            Customer
                        </span>

                        <span class="rx-role-description">
                            Book rides, track riders and manage your bookings.
                        </span>

                    </span>

                    <span
                        class="rx-check"
                        aria-hidden="true"
                    ></span>

                </label>

            </div>


            <div class="rx-role-option">

                <input
                    type="radio"
                    id="rider-role"
                    name="role"
                    value="rider"
                    aria-label="Rider"
                >

                <label
                    class="rx-role-label"
                    for="rider-role"
                >

                    <span
                        class="rx-role-icon"
                        aria-hidden="true"
                    >
                        🏍️
                    </span>

                    <span class="rx-role-info">

                        <span class="rx-role-name">
                            Rider
                        </span>

                        <span class="rx-role-description">
                            Accept rides, navigate and earn with RiderX.
                        </span>

                    </span>

                    <span
                        class="rx-check"
                        aria-hidden="true"
                    ></span>

                </label>

            </div>

        </div>


        <button
            id="continue-btn"
            class="rx-continue"
            type="button"
            disabled
        >

            <span id="continue-text">
                Continue
            </span>

            <span
                id="continue-loading"
                class="rx-loading"
                aria-hidden="true"
            >

                <span
                    class="rx-spinner"
                    aria-hidden="true"
                ></span>

                Please wait...

            </span>

        </button>


        <button
            id="register-btn"
            class="rx-register"
            type="button"
        >
            Create New Account
        </button>


        <div class="rx-login-text">

            Already have an account?

            <br>

            <a
                id="login-link"
                class="rx-login-link"
                href="./login.html"
            >
                Login
            </a>

        </div>


        <div
            id="role-message"
            class="rx-message"
            aria-live="polite"
            aria-atomic="true"
        ></div>

    </section>

</main>


<script type="module">

"use strict";

/* ============================================================
   RIDERX ROLE SELECTOR
   File: auth/role.html
   ============================================================ */

const customerRole = document.getElementById("customer-role");
const riderRole = document.getElementById("rider-role");
const continueButton = document.getElementById("continue-btn");
const continueText = document.getElementById("continue-text");
const continueLoading = document.getElementById("continue-loading");
const registerButton = document.getElementById("register-btn");
const loginLink = document.getElementById("login-link");
const message = document.getElementById("role-message");
const logoImage = document.getElementById("rxLogoImage");
const logoFallback = document.getElementById("rxLogoFallback");

const STORAGE = Object.freeze({
    selectedRole: "riderx_selected_role",
    legacyRole: "riderx_role"
});

const ROLE = Object.freeze({
    CUSTOMER: "customer",
    RIDER: "rider"
});

const ROUTES = Object.freeze({
    login: "./login.html"
});

let navigationBusy = false;

/* ROLE NORMALIZATION */
function normalizeRole(value) {
    const role = String(value ?? "").trim().toLowerCase().replace(/[\s-]+/g, "_");

    if (["customer", "customers", "user", "users", "passenger"].includes(role)) {
        return ROLE.CUSTOMER;
    }

    if (["rider", "riders", "driver", "drivers", "captain", "partner", "driver_partner", "driverpartner"].includes(role)) {
        return ROLE.RIDER;
    }

    return "";
}

/* GET ROLE FROM RADIO */
function getSelectedRole() {
    if (customerRole?.checked) {
        return ROLE.CUSTOMER;
    }
    if (riderRole?.checked) {
        return ROLE.RIDER;
    }
    return "";
}

/* STORAGE HELPERS */
function saveSelectedRole(role) {
    const normalized = normalizeRole(role);
    if (normalized !== ROLE.CUSTOMER && normalized !== ROLE.RIDER) {
        return false;
    }

    try {
        localStorage.setItem(STORAGE.selectedRole, normalized);
        localStorage.setItem(STORAGE.legacyRole, normalized);
        return true;
    } catch (error) {
        console.warn("RiderX role storage failed:", error);
        return false;
    }
}

function getSavedRole() {
    try {
        const selected = normalizeRole(localStorage.getItem(STORAGE.selectedRole));
        if (selected) {
            return selected;
        }
        return normalizeRole(localStorage.getItem(STORAGE.legacyRole));
    } catch (error) {
        console.warn("RiderX saved role read failed:", error);
        return "";
    }
}

/* MESSAGE */
function setMessage(text, type = "") {
    if (!message) return;
    message.textContent = String(text ?? "");
    message.className = "rx-message";
    if (type === "error" || type === "success") {
        message.classList.add(type);
    }
}

/* CONTINUE BUTTON STATE */
function updateContinueState() {
    if (!continueButton) return;
    continueButton.disabled = navigationBusy || !getSelectedRole();
}

/* LOADING STATE */
function setLoading(loading) {
    navigationBusy = Boolean(loading);

    if (continueButton) {
        continueButton.disabled = navigationBusy || !getSelectedRole();
    }
    if (registerButton) {
        registerButton.disabled = navigationBusy;
    }
    if (loginLink) {
        loginLink.style.pointerEvents = navigationBusy ? "none" : "";
        loginLink.setAttribute("aria-disabled", navigationBusy ? "true" : "false");
    }
    if (continueText) {
        continueText.style.display = loading ? "none" : "inline";
    }
    if (continueLoading) {
        continueLoading.classList.toggle("active", Boolean(loading));
    }
}

/* CHECK / SELECT ROLE */
function selectRole(role) {
    const normalized = normalizeRole(role);

    if (normalized === ROLE.CUSTOMER) {
        if (customerRole) customerRole.checked = true;
        if (riderRole) riderRole.checked = false;
    } else if (normalized === ROLE.RIDER) {
        if (riderRole) riderRole.checked = true;
        if (customerRole) customerRole.checked = false;
    } else {
        if (customerRole) customerRole.checked = false;
        if (riderRole) riderRole.checked = false;
    }

    if (normalized) {
        saveSelectedRole(normalized);
    }

    updateContinueState();
    setMessage("");
}

/* BUILD AUTH URL */
function buildAuthUrl(mode = "login", role = "") {
    const normalized = normalizeRole(role);
    const url = new URL(ROUTES.login, window.location.href);

    if (mode === "register") {
        url.searchParams.set("mode", "register");
    }
    if (normalized) {
        url.searchParams.set("role", normalized);
    }

    return url.pathname + url.search + url.hash;
}

/* NAVIGATE TO AUTH */
function navigateToAuth(mode = "login", role = "") {
    if (navigationBusy) return;

    const normalized = normalizeRole(role);

    if (!normalized) {
        setMessage("Please select Customer or Rider first.", "error");
        return;
    }

    saveSelectedRole(normalized);
    setLoading(true);

    setMessage(
        mode === "register"
            ? "Opening account registration..."
            : "Opening login..."
    );

    const target = buildAuthUrl(mode, normalized);

    window.setTimeout(function () {
        window.location.replace(target);
    }, 100);
}

/* LISTENERS */
customerRole?.addEventListener("change", function () {
    if (customerRole.checked) selectRole(ROLE.CUSTOMER);
});

riderRole?.addEventListener("change", function () {
    if (riderRole.checked) selectRole(ROLE.RIDER);
});

continueButton?.addEventListener("click", function () {
    const role = getSelectedRole();
    if (!role) {
        setMessage("Please select Customer or Rider.", "error");
        return;
    }
    navigateToAuth("login", role);
});

registerButton?.addEventListener("click", function () {
    const role = getSelectedRole();
    if (!role) {
        setMessage("Please select Customer or Rider first.", "error");
        customerRole?.focus();
        return;
    }
    navigateToAuth("register", role);
});

loginLink?.addEventListener("click", function (event) {
    event.preventDefault();
    if (navigationBusy) return;

    const role = getSelectedRole() || getSavedRole();
    if (role) {
        navigateToAuth("login", role);
        return;
    }

    navigationBusy = true;
    window.location.replace(buildAuthUrl("login", ""));
});

document.addEventListener("keydown", function (event) {
    if (navigationBusy) return;

    const target = event.target;
    if (target === customerRole && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        selectRole(ROLE.CUSTOMER);
    } else if (target === riderRole && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        selectRole(ROLE.RIDER);
    }
});

if (logoImage) {
    logoImage.addEventListener("error", function () {
        logoImage.style.display = "none";
        if (logoFallback) logoFallback.style.display = "flex";
    });

    if (logoImage.complete && logoImage.naturalWidth === 0) {
        logoImage.style.display = "none";
        if (logoFallback) logoFallback.style.display = "flex";
    }
}

function restoreSavedRole() {
    const savedRole = getSavedRole();
    if (savedRole === ROLE.CUSTOMER || savedRole === ROLE.RIDER) {
        selectRole(savedRole);
        return;
    }
    updateContinueState();
}

window.addEventListener("pageshow", function () {
    navigationBusy = false;
    setLoading(false);
    restoreSavedRole();
});

restoreSavedRole();

window.RiderXRole = Object.freeze({
    normalizeRole,
    getSelectedRole,
    getSavedRole,
    saveSelectedRole,
    buildAuthUrl
});

</script>

</body>
</html>
