body{

    border-color:#FFD400;

.resend-row{

    margin-top:13px;

.change:hover{

.demo{
    margin-top:17px;

}

.demo strong{
    color:#aaa;
}

.footer{
    margin-top:18px;

}

    display:inline-block;

    vertical-align:-2px;
    border:2px solid rgba(0,0,0,.25);
    border-top-color:#111;
    border-radius:50%;
    animation:spin .7s linear infinite;

@keyframes spin{
    to{
        transform:rotate(360deg);

@media(max-width:420px){

    .card{
        padding:24px 16px 18px;
        border-radius:18px;
    }

    .otp-box{
        gap:5px;
    }

    .otp{
        width:42px;
        height:49px;
    }

}

</style></head><body><main class="page"><section class="card"><div class="brand"><div class="logo">

</div><div class="heading"><h2>

</div></section></main><script>

"use strict";


const otpInputs =
    Array.from(
        document.querySelectorAll(
            ".otp"
        )
    );


const form =
    document.getElementById(
        "otpForm"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );

const resendBtn =
    document.getElementById(
        "resendBtn"
    );

const timerText =
    document.getElementById(
        "timer"
    );

const phoneDisplay =
    document.getElementById(
        "phoneDisplay"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const successBox =
    document.getElementById(
        "successBox"
    );



let seconds =
    30;

let timerId =
    null;



const selectedRole =
    (
        localStorage.getItem(
            "riderx_selected_role"
        ) ||
        localStorage.getItem(
            "userRole"
        ) ||
        "customer"
    ).toLowerCase();



let phone =
    localStorage.getItem(
        "riderx_otp_phone"
    ) ||
    localStorage.getItem(
        "riderx_reset_phone"
    ) ||
    "";



if(
    !/^[6-9]\d{9}$/.test(
        phone
    )
){

    phone = "";

}



phoneDisplay.textContent =
    phone
        ? "+91 " + maskPhone(phone)
        : "+91 ••••••••••";



otpInputs.forEach(
    function(input,index){

        input.addEventListener(
            "input",
            function(){

                this.value =
                    this.value
                        .replace(
                            /\D/g,
                            ""
                        )
                        .slice(
                            0,
                            1
                        );


                if(
                    this.value &&
                    index <
                    otpInputs.length - 1
                ){

                    otpInputs[
                        index + 1
                    ].focus();

                }

            }
        );


        input.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key ===
                    "Backspace" &&
                    !this.value &&
                    index > 0
                ){

                    otpInputs[
                        index - 1
                    ].focus();

                }


                if(
                    event.key ===
                    "ArrowLeft" &&
                    index > 0
                ){

                    otpInputs[
                        index - 1
                    ].focus();

                }


                if(
                    event.key ===
                    "ArrowRight" &&
                    index <
                    otpInputs.length - 1
                ){

                    otpInputs[
                        index + 1
                    ].focus();

                }

            }
        );


        input.addEventListener(
            "paste",
            function(event){

                event.preventDefault();


                const pasted =
                    (
                        event.clipboardData ||
                        window.clipboardData
                    )
                    .getData(
                        "text"
                    )
                    .replace(
                        /\D/g,
                        ""
                    )
                    .slice(
                        0,
                        6
                    );


                if(!pasted){

                    return;

                }


                pasted
                    .split("")
                    .forEach(
                        function(char,i){

                            if(
                                otpInputs[i]
                            ){

                                otpInputs[i]
                                    .value =
                                    char;

                            }

                        }
                    );


                otpInputs[
                    Math.min(
                        pasted.length,
                        5
                    )
                ].focus();

            }
        );

    }
);



form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        clearMessages();


        const otp =
            otpInputs
                .map(
                    function(input){

                        return input.value;

                    }
                )
                .join("");


        if(
            otp.length !== 6
        ){

            showError(
                "Please enter the complete 6-digit OTP."
            );

            otpInputs[0].focus();

            return;

        }


        setLoading(
            true
        );


        setTimeout(
            function(){

                /*
                 * Demo/local OTP.
                 * Firebase Phone Auth can replace
                 * this verification layer later.
                 */

                if(
                    otp !== "123456"
                ){

                    showError(
                        "Invalid OTP. For demo mode use 123456."
                    );

                    setLoading(
                        false
                    );

                    clearOtp();

                    otpInputs[0].focus();

                    return;

                }


                const account =
                    getAccount(
                        phone,
                        selectedRole
                    );


                const session = {

                    uid:
                        account?.uid ||
                        (
                            selectedRole +
                            "_" +
                            (
                                phone ||
                                Date.now()
                            )
                        ),

                    name:
                        account?.name ||
                        (
                            selectedRole ===
                            "rider"
                                ? "Rider"
                                : "RiderX Customer"
                        ),

                    phone:
                        phone,

                    email:
                        account?.email ||
                        "",

                    role:
                        selectedRole,

                    status:
                        "active",

                    loginMethod:
                        "otp",

                    loginAt:
                        new Date().toISOString()

                };


                localStorage.setItem(
                    "riderx_user",
                    JSON.stringify(
                        session
                    )
                );


                localStorage.setItem(
                    "userRole",
                    selectedRole
                );


                localStorage.setItem(
                    "riderx_selected_role",
                    selectedRole
                );


                if(
                    selectedRole ===
                    "rider"
                ){

                    localStorage.setItem(
                        "riderx_rider",
                        JSON.stringify(
                            session
                        )
                    );

                }else{

                    localStorage.setItem(
                        "riderx_customer",
                        JSON.stringify(
                            session
                        )
                    );

                }


                showSuccess(
                    "OTP verified successfully. Redirecting..."
                );


                setTimeout(
                    function(){

                        if(
                            selectedRole ===
                            "rider"
                        ){

                            window.location.href =
                                "../rider/home.html";

                        }else{

                            window.location.href =
                                "../customer/home.html";

                        }

                    },
                    700
                );

            },
            450
        );

    }
);



resendBtn.addEventListener(
    "click",
    function(){

        clearMessages();


        clearOtp();


        seconds =
            30;


        startTimer();


        showSuccess(
            "A new demo OTP has been generated. Use 123456."
        );


        otpInputs[0].focus();

    }
);



document
    .getElementById(
        "changeBtn"
    )
    .addEventListener(
        "click",
        function(){

            if(
                selectedRole ===
                "rider"
            ){

                window.location.href =
                    "./rider-login.html";

            }else{

                window.location.href =
                    "./customer-login.html";

            }

        }
    );



function startTimer(){

    resendBtn.disabled =
        true;


    updateTimer();


    if(timerId){

        clearInterval(
            timerId
        );

    }


    timerId =
        setInterval(
            function(){

                seconds--;


                updateTimer();


                if(
                    seconds <= 0
                ){

                    clearInterval(
                        timerId
                    );


                    resendBtn.disabled =
                        false;


                    timerText.textContent =
                        "";

                }

            },
            1000
        );

}



function updateTimer(){

    timerText.textContent =
        seconds +
        "s";

}



function getAccount(
    mobile,
    role
){

    if(!mobile){

        return null;

    }


    const keys = [

        "riderx_users",
        "riderx_customers",
        "riderx_riders",
        "users"

    ];


    for(
        const key of keys
    ){

        try{

            const raw =
                localStorage.getItem(
                    key
                );


            if(!raw){

                continue;

            }


            const parsed =
                JSON.parse(
                    raw
                );


            const list =
                Array.isArray(
                    parsed
                )
                    ? parsed
                    : [parsed];


            const found =
                list.find(
                    function(item){

                        if(!item){

                            return false;

                        }


                        const itemRole =
                            String(
                                item.role ||
                                "customer"
                            )
                            .toLowerCase();


                        const normalizedRole =
                            (
                                itemRole ===
                                "driver"
                            )
                                ? "rider"
                                : itemRole;


                        return (
                            normalizePhone(
                                item.phone
                            ) ===
                            mobile &&
                            normalizedRole ===
                            role
                        );

                    }
                );


            if(found){

                return found;

            }

        }catch(error){

            console.error(
                error
            );

        }

    }


    return null;

}



function normalizePhone(
    value
){

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    )
    .slice(
        -10
    );

}



function maskPhone(
    value
){

    const number =
        normalizePhone(
            value
        );


    if(
        number.length !== 10
    ){

        return "••••••••••";

    }


    return (
        number.slice(
            0,
            2
        ) +
        "••••" +
        number.slice(
            -4
        )
    );

}



function clearOtp(){

    otpInputs.forEach(
        function(input){

            input.value =
                "";

        }
    );

}



function setLoading(
    loading
){

    submitBtn.disabled =
        loading;


    if(loading){

        submitBtn.innerHTML =
            '<span class="loader"></span>Verifying...';

    }else{

        submitBtn.textContent =
            "Verify & Continue";

    }

}



function clearMessages(){

    errorBox.classList.remove(
        "show"
    );

    successBox.classList.remove(
        "show"
    );

}



function showError(
    message
){

    successBox.classList.remove(
        "show"
    );

    errorBox.textContent =
        message;

    errorBox.classList.add(
        "show"
    );

}



function showSuccess(
    message
){

    errorBox.classList.remove(
        "show"
    );

    successBox.textContent =
        message;

    successBox.classList.add(
        "show"
    );

}



startTimer();

setTimeout(
    function(){

        otpInputs[0].focus();

    },
    150
);

</script></body></html>
