<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX Rider Login"
    >

    <title>RiderX - Rider Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #070707;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
            position: relative;
            overflow: hidden;
        }

        .page::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            top: -240px;
            right: -160px;
            border-radius: 50%;
            background: rgba(255, 212, 0, .08);
        }

        .page::after {
            content: "";
            position: absolute;
            width: 360px;
            height: 360px;
            bottom: -230px;
            left: -180px;
            border-radius: 50%;
            background: rgba(255, 212, 0, .05);
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 430px;
            padding: 30px 23px 22px;
            border: 1px solid #292929;
            border-radius: 23px;
            background: #111111;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .55);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 19px;
            background: #ffd400;
            color: #090909;
            font-size: 23px;
            font-weight: 1000;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 1000;
        }

        .brand h1 span {
            color: #ffd400;
        }

        .brand p {
            margin: 6px 0 0;
            color: #777777;
            font-size: 10px;
        }

        .heading h2 {
            margin: 0;
            font-size: 19px;
            font-weight: 900;
        }

        .heading p {
            margin: 7px 0 0;
            color: #777777;
            font-size: 10px;
            line-height: 1.6;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            margin-top: 12px;
            padding: 7px 10px;
            border: 1px solid #443b00;
            border-radius: 8px;
            background: rgba(255, 212, 0, .08);
            color: #ffd400;
            font-size: 9px;
            font-weight: 900;
        }

        .message {
            display: none;
            margin: 16px 0 13px;
            padding: 10px;
            border-radius: 9px;
            font-size: 9px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            border: 1px solid #542828;
            background: #241414;
            color: #ff7777;
        }

        .message.success {
            border: 1px solid #275335;
            background: #132319;
            color: #65e58b;
        }

        .field {
            margin-top: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #aaaaaa;
            font-size: 9px;
            font-weight: 800;
        }

        .input {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            border: 1px solid #333333;
            border-radius: 10px;
            outline: none;
            background: #191919;
            color: #ffffff;
            font-size: 12px;
        }

        .input::placeholder {
            color: #555555;
        }

        .input:focus {
            border-color: #ffd400;
            box-shadow: 0 0 0 2px rgba(255, 212, 0, .07);
        }

        .password-wrap {
            position: relative;
        }

        .password-input {
            padding-right: 52px;
        }

        .toggle {
            position: absolute;
            top: 50%;
            right: 7px;
            width: 39px;
            height: 35px;
            transform: translateY(-50%);
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #777777;
            cursor: pointer;
            font-size: 9px;
            font-weight: 800;
        }

        .toggle:hover {
            color: #ffd400;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 14px 0 18px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #777777;
            font-size: 9px;
        }

        .remember input {
            accent-color: #ffd400;
        }

        .forgot {
            padding: 0;
            border: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .primary {
            width: 100%;
            height: 49px;
            border: 0;
            border-radius: 10px;
            background: #ffd400;
            color: #111111;
            cursor: pointer;
            font-size: 12px;
            font-weight: 1000;
        }

        .primary:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: #555555;
            font-size: 8px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #282828;
        }

        .secondary {
            width: 100%;
            height: 46px;
            border: 1px solid #353535;
            border-radius: 10px;
            background: #171717;
            color: #ffffff;
            cursor: pointer;
            font-size: 10px;
            font-weight: 900;
        }

        .secondary:hover {
            border-color: #ffd400;
            color: #ffd400;
        }

        .register {
            margin-top: 18px;
            text-align: center;
            color: #666666;
            font-size: 9px;
        }

        .register button {
            border: 0;
            padding: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-weight: 900;
        }

        .customer-link {
            margin-top: 15px;
            text-align: center;
        }

        .customer-link button {
            border: 0;
            background: transparent;
            color: #888888;
            cursor: pointer;
            font-size: 9px;
        }

        .customer-link button:hover {
            color: #ffd400;
        }

        .requirements {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 17px;
        }

        .requirement {
            padding: 9px;
            border: 1px solid #252525;
            border-radius: 8px;
            background: #151515;
            color: #666666;
            font-size: 8px;
            text-align: center;
        }

        .requirement strong {
            display: block;
            margin-bottom: 3px;
            color: #aaaaaa;
            font-size: 8px;
        }

        .footer {
            margin-top: 17px;
            color: #444444;
            font-size: 8px;
            text-align: center;
        }

        .loader {
            display: inline-block;
            width: 13px;
            height: 13px;
            margin-right: 7px;
            vertical-align: -2px;
            border: 2px solid rgba(0, 0, 0, .25);
            border-top-color: #111111;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 420px) {

            .card {
                padding: 25px 17px 19px;
                border-radius: 19px;
            }

        }

    </style>

</head>

<body>

<main class="page">

    <section class="card">

        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                Drive. Earn. Grow.
            </p>

        </div>


        <div class="heading">

            <h2>
                Rider Login
            </h2>

            <p>
                Sign in to go online, receive rides,
                navigate to customers and manage your earnings.
            </p>

            <div class="badge">
                RIDER / DRIVER PARTNER
            </div>

        </div>


        <div
            id="errorBox"
            class="message error"
            role="alert"
            aria-live="polite"
        ></div>


        <div
            id="successBox"
            class="message success"
            role="status"
            aria-live="polite"
        ></div>


        <form
            id="riderLoginForm"
            novalidate
        >

            <div class="field">

                <label for="email">
                    Rider email
                </label>

                <input
                    class="input"
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your rider email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        class="input password-input"
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        id="togglePassword"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>


                <button
                    type="button"
                    class="forgot"
                    id="forgotPassword"
                >
                    Forgot password?
                </button>

            </div>


            <button
                type="submit"
                class="primary"
                id="loginButton"
            >
                Login as Rider
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            class="secondary"
            id="otpButton"
        >
            Rider Mobile / OTP Login
        </button>


        <div class="register">

            Want to drive with RiderX?

            <button
                type="button"
                id="registerButton"
            >
                Become a Rider
            </button>

        </div>


        <div class="customer-link">

            <button
                type="button"
                id="customerLoginButton"
            >
                Are you a Customer? Login here →
            </button>

        </div>


        <div class="requirements">

            <div class="requirement">
                <strong>Approval</strong>
                Admin verification required
            </div>

            <div class="requirement">
                <strong>Documents</strong>
                Valid rider documents
            </div>

        </div>


        <div class="footer">
            © 2026 RiderX • Chandigarh
        </div>

    </section>

</main>


<script type="module">

    "use strict";


    import {

        auth,
        db,

        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        signOut,

        doc,
        getDoc

    } from "../firebase/firebase-config.js";


    const form =
        document.getElementById(
            "riderLoginForm"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const rememberInput =
        document.getElementById(
            "remember"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );


    const otpButton =
        document.getElementById(
            "otpButton"
        );


    const registerButton =
        document.getElementById(
            "registerButton"
        );


    const customerLoginButton =
        document.getElementById(
            "customerLoginButton"
        );


    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const successBox =
        document.getElementById(
            "successBox"
        );


    let busy =
        false;


    localStorage.setItem(
        "riderx_selected_role",
        "rider"
    );


    const rememberedEmail =
        localStorage.getItem(
            "riderx_rider_email"
        );


    if (
        rememberedEmail
    ) {

        emailInput.value =
            rememberedEmail;

        rememberInput.checked =
            true;

    }


    togglePassword.addEventListener(
        "click",
        function () {

            const hidden =
                passwordInput.type ===
                "password";


            passwordInput.type =
                hidden
                    ? "text"
                    : "password";


            togglePassword.textContent =
                hidden
                    ? "HIDE"
                    : "SHOW";

        }
    );


    form.addEventListener(
        "submit",
        async function (
            event
        ) {

            event.preventDefault();


            if (
                busy
            ) {

                return;

            }


            clearMessages();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            if (
                !email
            ) {

                showError(
                    "Please enter your rider email address."
                );

                emailInput.focus();

                return;

            }


            if (
                !validEmail(
                    email
                )
            ) {

                showError(
                    "Please enter a valid email address."
                );

                emailInput.focus();

                return;

            }


            if (
                !password
            ) {

                showError(
                    "Please enter your password."
                );

                passwordInput.focus();

                return;

            }


            busy =
                true;


            setLoading(
                true
            );


            try {

                const result =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const firebaseUser =
                    result.user;


                if (
                    !firebaseUser
                ) {

                    throw new Error(
                        "Authentication failed."
                    );

                }


                const profile =
                    await findRiderProfile(
                        firebaseUser.uid
                    );


                if (
                    !profile
                ) {

                    await signOut(
                        auth
                    );


                    showError(
                        "This Firebase account does not have a RiderX rider profile. Please register as a rider first."
                    );


                    return;

                }


                const role =
                    normalizeRole(
                        profile.role ||
                        profile.userRole ||
                        profile.accountType ||
                        "rider"
                    );


                if (
                    role !==
                    "rider"
                ) {

                    await signOut(
                        auth
                    );


                    showError(
                        "This account belongs to the Customer side. Please use Customer Login."
                    );


                    return;

                }


                const access =
                    riderAccess(
                        profile
                    );


                if (
                    !access.allowed
                ) {

                    await createSession(
                        firebaseUser,
                        profile
                    );


                    await signOut(
                        auth
                    );


                    showError(
                        access.message
                    );


                    return;

                }


                await createSession(
                    firebaseUser,
                    profile
                );


                if (
                    rememberInput.checked
                ) {

                    localStorage.setItem(
                        "riderx_rider_email",
                        email
                    );

                } else {

                    localStorage.removeItem(
                        "riderx_rider_email"
                    );

                }


                showSuccess(
                    "Rider login successful. Opening Driver Partner app..."
                );


                setTimeout(
                    function () {

                        window.location.replace(
                            "../rider/home.html"
                        );

                    },
                    600
                );


            } catch (
                error
            ) {

                console.error(
                    "Rider login error:",
                    error
                );


                showError(
                    firebaseMessage(
                        error
                    )
                );

            } finally {

                busy =
                    false;


                setLoading(
                    false
                );

            }

        }
    );


    async function findRiderProfile(
        uid
    ) {

        const userSnapshot =
            await getDoc(
                doc(
                    db,
                    "users",
                    uid
                )
            );


        if (
            userSnapshot.exists()
        ) {

            const data =
                userSnapshot.data();


            const role =
                normalizeRole(
                    data.role ||
                    data.userRole ||
                    data.accountType ||
                    ""
                );


            if (
                role ===
                "rider"
            ) {

                return data;

            }


            return null;

        }


        const riderSnapshot =
            await getDoc(
                doc(
                    db,
                    "riders",
                    uid
                )
            );


        if (
            riderSnapshot.exists()
        ) {

            return riderSnapshot.data();

        }


        return null;

    }


    function riderAccess(
        profile
    ) {

        const status =
            String(
                profile.approvalStatus ||
                profile.applicationStatus ||
                profile.verificationStatus ||
                profile.status ||
                ""
            )
                .trim()
                .toLowerCase();


        if (
            profile.blocked === true ||
            profile.disabled === true ||
            status === "blocked" ||
            status === "disabled" ||
            status === "suspended"
        ) {

            return {

                allowed:
                    false,

                message:
                    "Your RiderX rider account is currently blocked or suspended. Please contact RiderX support."

            };

        }


        if (
            profile.rejected === true ||
            status === "rejected"
        ) {

            return {

                allowed:
                    false,

                message:
                    "Your rider application was rejected. Please contact RiderX support."

            };

        }


        if (
            profile.approved === false ||
            profile.isApproved === false ||
            status === "pending" ||
            status === "waiting" ||
            status === "under_review" ||
            status === "under-review"
        ) {

            return {

                allowed:
                    false,

                message:
                    "Your rider account is waiting for admin approval. You cannot go online until your account is approved."

            };

        }


        /*
         * If an existing RiderX profile has no explicit
         * approval field, preserve compatibility with
         * older approved rider accounts.
         */

        return {

            allowed:
                true,

            message:
                ""

        };

    }


    async function createSession(
        firebaseUser,
        profile
    ) {

        const rider = {

            uid:
                firebaseUser.uid,

            id:
                firebaseUser.uid,

            role:
                "rider",

            userRole:
                "rider",

            accountType:
                "rider",

            name:
                profile.name ||
                profile.fullName ||
                profile.displayName ||
                firebaseUser.displayName ||
                "RiderX Rider",

            fullName:
                profile.fullName ||
                profile.name ||
                profile.displayName ||
                firebaseUser.displayName ||
                "",

            displayName:
                profile.displayName ||
                firebaseUser.displayName ||
                "",

            email:
                profile.email ||
                firebaseUser.email ||
                "",

            phone:
                profile.phone ||
                profile.mobile ||
                profile.phoneNumber ||
                firebaseUser.phoneNumber ||
                "",

            phoneNumber:
                profile.phoneNumber ||
                firebaseUser.phoneNumber ||
                "",

            city:
                profile.city ||
                "Chandigarh",

            photoURL:
                profile.photoURL ||
                firebaseUser.photoURL ||
                "",

            rating:
                Number(
                    profile.rating ||
                    5
                ),

            walletBalance:
                Number(
                    profile.walletBalance ||
                    0
                ),

            totalRides:
                Number(
                    profile.totalRides ||
                    0
                ),

            completedRides:
                Number(
                    profile.completedRides ||
                    0
                ),

            currentRideId:
                profile.currentRideId ||
                null,

            vehicleType:
                profile.vehicleType ||
                "bike",

            vehicleNumber:
                profile.vehicleNumber ||
                "",

            approvalStatus:
                profile.approvalStatus ||
                profile.applicationStatus ||
                "approved",

            approved:
                profile.approved !== false &&
                profile.isApproved !== false,

            status:
                profile.status ||
                "active",

            online:
                profile.online === true,

            isOnline:
                profile.isOnline === true,

            loginMethod:
                "password",

            loginAt:
                new Date().toISOString()

        };


        localStorage.setItem(
            "riderx_user",
            JSON.stringify(
                rider
            )
        );


        localStorage.setItem(
            "riderx_rider",
            JSON.stringify(
                rider
            )
        );


        localStorage.setItem(
            "riderx_rider_id",
            firebaseUser.uid
        );


        localStorage.setItem(
            "userRole",
            "rider"
        );


        localStorage.setItem(
            "riderx_role",
            "rider"
        );


        localStorage.setItem(
            "riderx_selected_role",
            "rider"
        );

    }


    function normalizeRole(
        role
    ) {

        const value =
            String(
                role || ""
            )
                .trim()
                .toLowerCase();


        if (
            value === "rider" ||
            value === "driver" ||
            value === "captain" ||
            value === "partner"
        ) {

            return "rider";

        }


        if (
            value === "admin" ||
            value === "administrator"
        ) {

            return "admin";

        }


        return "customer";

    }


    function validEmail(
        email
    ) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        );

    }


    function clearMessages() {

        errorBox.textContent =
            "";

        successBox.textContent =
            "";

        errorBox.classList.remove(
            "show"
        );

        successBox.classList.remove(
            "show"
        );

    }


    function showError(
        message
    ) {

        successBox.classList.remove(
            "show"
        );

        successBox.textContent =
            "";

        errorBox.textContent =
            message;

        errorBox.classList.add(
            "show"
        );

    }


    function showSuccess(
        message
    ) {

        errorBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            message;

        successBox.classList.add(
            "show"
        );

    }


    function setLoading(
        value
    ) {

        loginButton.disabled =
            value;


        if (
            value
        ) {

            loginButton.innerHTML =
                '<span class="loader"></span>Signing in...';

        } else {

            loginButton.textContent =
                "Login as Rider";

        }

    }


    otpButton.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "rider"
            );


            window.location.href =
                "./otp-login.html";

        }
    );


    registerButton.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "rider"
            );


            window.location.href =
                "./register.html";

        }
    );


    customerLoginButton.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );


            window.location.href =
                "./customer-login.html";

        }
    );


    forgotPassword.addEventListener(
        "click",
        async function () {

            clearMessages();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            if (
                !email
            ) {

                showError(
                    "Enter your rider email address first."
                );

                emailInput.focus();

                return;

            }


            if (
                !validEmail(
                    email
                )
            ) {

                showError(
                    "Please enter a valid email address."
                );

                return;

            }


            forgotPassword.disabled =
                true;


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showSuccess(
                    "Password reset email sent. Please check your inbox."
                );


            } catch (
                error
            ) {

                console.error(
                    "Rider password reset error:",
                    error
                );


                showError(
                    firebaseMessage(
                        error
                    )
                );


            } finally {

                forgotPassword.disabled =
                    false;

            }

        }
    );


    function firebaseMessage(
        error
    ) {

        const code =
            String(
                error?.code ||
                ""
            )
                .toLowerCase();


        switch (
            code
        ) {

            case "auth/invalid-email":

                return "Please enter a valid email address.";


            case "auth/user-not-found":

                return "No RiderX account was found with this email.";


            case "auth/wrong-password":

                return "Incorrect password. Please try again.";


            case "auth/invalid-credential":

                return "Email or password is incorrect.";


            case "auth/user-disabled":

                return "This Firebase account has been disabled.";


            case "auth/too-many-requests":

                return "Too many login attempts. Please wait and try again later.";


            case "auth/network-request-failed":

                return "Network error. Check your internet connection.";


            case "auth/operation-not-allowed":

                return "Email/password authentication is not enabled in Firebase.";


            case "auth/app-not-authorized":

                return "This RiderX domain is not authorized in Firebase.";


            default:

                return (
                    error?.message ||
                    "Rider login failed. Please try again."
                );

        }

    }

</script>
