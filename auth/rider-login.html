<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX Rider / Driver Partner Login"
    >

    <title>RiderX - Rider Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #070707;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
            overflow: hidden;
        }

        .glow {
            position: fixed;
            width: 430px;
            height: 430px;
            border-radius: 50%;
            pointer-events: none;
        }

        .glow.one {
            top: -300px;
            right: -170px;
            background: rgba(255, 212, 0, .08);
        }

        .glow.two {
            bottom: -300px;
            left: -180px;
            background: rgba(255, 212, 0, .05);
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 455px;
            padding: 29px 23px 22px;
            border: 1px solid #292929;
            border-radius: 24px;
            background: #111;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .55);
        }

        .brand {
            text-align: center;
            margin-bottom: 23px;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #ffd400;
            color: #080808;
            font-size: 22px;
            font-weight: 1000;
        }

        .brand h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 1000;
        }

        .brand h1 span {
            color: #ffd400;
        }

        .brand p {
            margin: 6px 0 0;
            color: #777;
            font-size: 9px;
        }

        .heading {
            text-align: center;
        }

        .heading h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
        }

        .heading p {
            margin: 7px auto 0;
            max-width: 350px;
            color: #777;
            font-size: 9px;
            line-height: 1.6;
        }

        .role-badge {
            width: fit-content;
            margin: 16px auto 0;
            padding: 7px 12px;
            border: 1px solid #4b4100;
            border-radius: 999px;
            background: rgba(255, 212, 0, .07);
            color: #ffd400;
            font-size: 8px;
            font-weight: 900;
        }

        .form {
            margin-top: 22px;
        }

        .field {
            margin-bottom: 13px;
        }

        .field label {
            display: block;
            margin: 0 0 6px;
            color: #aaa;
            font-size: 9px;
            font-weight: 800;
        }

        .field input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #303030;
            border-radius: 11px;
            outline: none;
            background: #181818;
            color: #fff;
            font-size: 11px;
        }

        .field input:focus {
            border-color: #ffd400;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;
            top: 50%;
            right: 9px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #777;
            cursor: pointer;
            font-size: 8px;
            font-weight: 900;
        }

        .show-password:hover {
            color: #ffd400;
        }

        .forgot {
            display: flex;
            justify-content: flex-end;
            margin-top: -3px;
            margin-bottom: 14px;
        }

        .forgot button {
            border: 0;
            padding: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-size: 8px;
            font-weight: 900;
        }

        .primary {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 11px;
            background: #ffd400;
            color: #090909;
            cursor: pointer;
            font-size: 10px;
            font-weight: 1000;
        }

        .primary:hover {
            background: #ffe04a;
        }

        .primary:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0;
            color: #555;
            font-size: 8px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #292929;
        }

        .google {
            width: 100%;
            height: 44px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #181818;
            color: #fff;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .google:hover {
            border-color: #ffd400;
        }

        .otp {
            width: 100%;
            height: 44px;
            margin-top: 10px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #181818;
            color: #ffd400;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .otp:hover {
            border-color: #ffd400;
        }

        .status {
            display: none;
            margin-top: 14px;
            padding: 10px;
            border-radius: 9px;
            font-size: 8px;

        .status.show {
            display: block;
        }

        .status.info {
            border: 1px solid #443b00;
            background: rgba(255, 212, 0, .07);
            color: #ffd400;
        }

        .status.error {
            border: 1px solid #5a2222;
            background: rgba(255, 50, 50, .07);
            color: #ff7777;
        }

        .status.success {
            border: 1px solid #28512e;
            background: rgba(40, 180, 70, .07);
            color: #70d888;
        }

        .register {
            margin-top: 19px;
            padding-top: 17px;
            border-top: 1px solid #272727;
            text-align: center;
            color: #666;
            font-size: 9px;
        }

        .register button {
            margin-left: 4px;
            border: 0;
            padding: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-weight: 900;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 13px auto 0;
            border: 0;
            background: transparent;
            color: #555;
            cursor: pointer;
            font-size: 8px;
        }

        .back:hover {
            color: #ffd400;
        }

        .footer {
            margin-top: 17px;
            color: #444;
            font-size: 8px;
            text-align: center;
        }

        .loading {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .72);
            backdrop-filter: blur(5px);
        }

        .loading.show {
            display: flex;
        }

        .loading-box {
            padding: 22px 27px;
            border: 1px solid #333;
            border-radius: 15px;
            background: #111;
            text-align: center;
        }

        .spinner {
            width: 28px;
            height: 28px;
            margin: 0 auto 10px;
            border: 3px solid #333;
            border-top-color: #ffd400;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .loading-box span {
            color: #aaa;
            font-size: 9px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 390px) {

            .card {
                padding: 25px 17px 19px;
                border-radius: 20px;
            }

            .logo {
                width: 58px;
                height: 58px;
            }

        }

    </style>

<body>

<main class="page">

    <div class="glow one"></div>
    <div class="glow two"></div>


    <section class="card">

        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                One platform. Every journey.
            </p>

        </div>


        <div class="heading">

            <h2>
                Rider Login
            </h2>

            <p>
                Login to your RiderX Driver Partner
                account and start accepting rides.
            </p>

            <div class="role-badge">
                RIDER / DRIVER PARTNER
            </div>

        </div>


        <form
            class="form"
            id="loginForm"
            novalidate
        >

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <div class="forgot">

                <button
                    type="button"
                    id="forgotPassword"
                >
                    Forgot password?
                </button>

            </div>


            <button
                type="submit"
                class="primary"
                id="loginButton"
            >
                LOGIN AS RIDER
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            class="google"
            id="googleLogin"
        >
            Continue with Google
        </button>


        <button
            type="button"
            class="otp"
            id="otpLogin"
        >
            Login with Mobile / OTP
        </button>


        <div
            class="status"
            id="status"
        ></div>


        <div class="register">

            New RiderX rider?

            <button
                type="button"
                id="registerButton"
            >
                Create Rider Account
            </button>

        </div>


        <button
            type="button"
            class="back"
            id="backButton"
        >
            ← Change account type
        </button>


        <div class="footer">
            © 2026 RiderX • Chandigarh
        </div>

    </section>

</main>


<div
    class="loading"
    id="loading"
    aria-hidden="true"
>

    <div class="loading-box">

        <div class="spinner"></div>

        <span id="loadingText">
            Signing in...
        </span>

    </div>

</div>


<script type="module">

"use strict";


/* =========================================================
   RIDERX RIDER LOGIN
   Centralized Firebase authentication
   Uses ../js/auth.js only
========================================================= */


const loginForm =
    document.getElementById("loginForm");


const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const loginButton =
    document.getElementById("loginButton");


const googleLogin =
    document.getElementById("googleLogin");


const otpLogin =
    document.getElementById("otpLogin");


const forgotPassword =
    document.getElementById("forgotPassword");


const registerButton =
    document.getElementById("registerButton");


const backButton =
    document.getElementById("backButton");


const showPassword =
    document.getElementById("showPassword");


const statusBox =
    document.getElementById("status");


const loading =
    document.getElementById("loading");


const loadingText =
    document.getElementById("loadingText");


/* =========================================================
   ROLE
========================================================= */

localStorage.setItem(
    "riderx_selected_role",
    "rider"
);


/* =========================================================
   LOAD CENTRAL AUTH ENGINE
========================================================= */

let AUTH = null;
let Firebase = null;


async function getAuthEngine() {

    if (AUTH) {
        return AUTH;
    }

    await import("../js/auth.js");

    if (
        window.RiderX &&
        window.RiderX.auth
    ) {

        AUTH =
            window.RiderX.auth;

        return AUTH;

    }

    throw new Error(
        "RiderX authentication engine could not be loaded."
    );

}


/* =========================================================
   FIREBASE MODULE
   Used only for Google auth where auth.js does not expose
   a Google login wrapper.
========================================================= */

async function getFirebase() {

    if (Firebase) {
        return Firebase;
    }

    Firebase =
        await import(
            "../firebase/firebase-config.js"
        );

    return Firebase;

}


/* =========================================================
   UI
========================================================= */

function showStatus(
    message,
    type = "info"
) {

    statusBox.textContent =
        String(message || "");

    statusBox.className =
        "status show " + type;

}


function clearStatus() {

    statusBox.textContent =
        "";

    statusBox.className =
        "status";

}


function setLoading(
    active,
    message = "Please wait..."
) {

    loadingText.textContent =
        message;

    loading.classList.toggle(
        "show",
        Boolean(active)
    );

    loading.setAttribute(
        "aria-hidden",
        active ? "false" : "true"
    );

    loginButton.disabled =
        active;

    googleLogin.disabled =
        active;

    otpLogin.disabled =
        active;

    registerButton.disabled =
        active;

    forgotPassword.disabled =
        active;

}


/* =========================================================
   ERROR NORMALIZER
========================================================= */

function getErrorMessage(
    error
) {

    if (!error) {
        return "Something went wrong. Please try again.";
    }


    const code =
        String(
            error.code || ""
        ).toLowerCase();


    const messages = {

        "auth/invalid-credential":
            "Invalid email or password.",

        "auth/invalid-login-credentials":
            "Invalid email or password.",

        "auth/wrong-password":
            "Invalid email or password.",

        "auth/user-not-found":
            "No RiderX account was found with this email.",

        "auth/invalid-email":
            "Please enter a valid email address.",

        "auth/too-many-requests":
            "Too many attempts. Please wait and try again.",

        "auth/network-request-failed":
            "Network error. Check your internet connection.",

        "auth/user-disabled":
            "This Firebase account has been disabled.",

        "auth/popup-closed-by-user":
            "Google login was cancelled.",

        "auth/popup-blocked":
            "The browser blocked the Google login popup.",

        "auth/operation-not-allowed":
            "This login method is not enabled in Firebase.",

        "auth/email-already-in-use":
            "An account with this email already exists."

    };


    if (
        messages[code]
    ) {

        return messages[code];

    }


    return (
        error.message ||
        "Unable to complete login. Please try again."
    );

}


/* =========================================================
   RIDER PROFILE CHECK
========================================================= */

async function verifyRiderProfile(
    user
) {

    const FB =
        await getFirebase();


    if (!FB || !FB.db) {

        throw new Error(
            "Firebase database is unavailable."
        );

    }


    const uid =
        user?.uid ||
        user?.id ||
        user?.userId;


    if (!uid) {

        throw new Error(
            "Rider account ID is missing."
        );

    }


    /*
     * First check users/{uid}
     */

    let userData =
        null;


    try {

        const userSnap =
            await FB.getDoc(
                FB.doc(
                    FB.db,
                    "users",
                    uid
                )
            );


        if (
            userSnap.exists()
        ) {

            userData =
                userSnap.data();

        }

    } catch (error) {

        console.warn(
            "RiderX users profile check failed:",
            error
        );

    }


    /*
     * Then check riders/{uid}.
     * Rider profile is authoritative for approval status.
     */

    let riderData =
        null;


    try {

        const riderSnap =
            await FB.getDoc(
                FB.doc(
                    FB.db,
                    "riders",
                    uid
                )
            );


        if (
            riderSnap.exists()
        ) {

            riderData =
                riderSnap.data();

        }

    } catch (error) {

        console.warn(
            "RiderX rider profile check failed:",
            error
        );

    }


    if (
        !userData &&
        !riderData
    ) {

        /*
         * Firebase Authentication account exists,
         * but no RiderX profile exists.
         */

        throw new Error(
            "Rider profile was not found. Please complete Rider registration first."
        );

    }


    const role =
        String(
            riderData?.role ||
            riderData?.userRole ||
            userData?.role ||
            userData?.userRole ||
            ""
        )
        .trim()
        .toLowerCase();


    if (
        role === "customer"
    ) {

        throw new Error(
            "This account is registered as a Customer, not a Rider."
        );

    }


    if (
        role !== "rider" &&
        role !== "driver"
    ) {

        throw new Error(
            "Rider role is not configured for this account."
        );

    }


    const status =
        String(
            riderData?.status ||
            riderData?.approvalStatus ||
            userData?.status ||
            "active"
        )
        .trim()
        .toLowerCase();


    if (
        [
            "blocked",
            "disabled",
            "suspended",
            "banned"
        ].includes(status)
    ) {

        throw new Error(
            "Your RiderX rider account is disabled or suspended."
        );

    }


    if (
        [
            "rejected",
            "declined"
        ].includes(status)
    ) {

        window.location.replace(
            "../rider/rejected.html"
        );

        return null;

    }


    if (
        [
            "pending",
            "pending_approval",
            "under_review",
            "verification_pending"
        ].includes(status)
    ) {

        window.location.replace(
            "../rider/pending.html"
        );

        return null;

    }


    /*
     * Approved/active rider.
     */

    return {

        ...userData,

        ...riderData,

        uid,

        role: "rider",

        userRole: "rider",

        status

    };

}


/* =========================================================
   SAVE RIDER SESSION
========================================================= */

async function completeRiderLogin(
    result
) {

    if (!result) {
        return;
    }


    const AUTH =
        await getAuthEngine();


    const firebaseUser =
        result.firebaseUser ||
        result.user;


    let profile =
        result.user ||
        null;


    if (
        firebaseUser &&
        typeof firebaseUser.uid === "string"
    ) {

        try {

            profile =
                await AUTH.getProfile(
                    firebaseUser
                );

        } catch (error) {

            console.warn(
                "Unable to refresh RiderX profile:",
                error
            );

        }

    }


    if (!profile) {

        profile =
            firebaseUser;

    }


    const rider =
        await verifyRiderProfile(
            profile
        );


    if (!rider) {
        return;
    }


    rider.role =
        "rider";

    rider.userRole =
        "rider";


    AUTH.saveSession(
        rider,
        "rider"
    );


    AUTH.state.firebaseUser =
        firebaseUser;


    showStatus(
        "Login successful. Opening RiderX...",
        "success"
    );


    setLoading(
        true,
        "Opening RiderX Rider..."
    );


    setTimeout(
        function () {

            window.location.replace(
                "../rider/home.html"
            );

        },
        250
    );

}


/* =========================================================
   EMAIL LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        clearStatus();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (!email) {

            showStatus(
                "Please enter your email address.",
                "error"
            );

            emailInput.focus();

            return;

        }


        if (!password) {

            showStatus(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        try {

            setLoading(
                true,
                "Signing in as Rider..."
            );


            const AUTH =
                await getAuthEngine();


            const result =
                await AUTH.loginEmail(
                    email,
                    password
                );


            /*
             * Auth engine already resolved role.
             * We still verify the Rider-specific profile.
             */

            const normalizedRole =
                AUTH.normalizeRole(
                    result.role
                );


            if (
                normalizedRole !== "rider"
            ) {

                await AUTH.logout();

                throw new Error(
                    "This account is not registered as a Rider."
                );

            }


            await completeRiderLogin(
                result
            );

        } catch (error) {

            console.error(
                "RiderX rider login failed:",
                error
            );

            setLoading(
                false
            );

            showStatus(
                getErrorMessage(error),
                "error"
            );

        }

    }
);


/* =========================================================
   GOOGLE LOGIN
========================================================= */

googleLogin.addEventListener(
    "click",
    async function () {

        clearStatus();


        try {

            setLoading(
                true,
                "Connecting with Google..."
            );


            const AUTH =
                await getAuthEngine();


            const FB =
                await getFirebase();


            const result =
                await FB.signInWithPopup(
                    FB.auth,
                    FB.googleProvider
                );


            const firebaseUser =
                result.user;


            const profile =
                await AUTH.getProfile(
                    firebaseUser
                );


            let role =
                await AUTH.resolveRole(
                    profile
                );


            /*
             * A Google account without an existing
             * RiderX role must not silently become a rider.
             */

            if (!role) {

                await FB.signOut(
                    FB.auth
                );

                throw new Error(
                    "No RiderX role is configured for this Google account. Please register as a Rider first."
                );

            }


            if (
                role !== "rider"
            ) {

                await FB.signOut(
                    FB.auth
                );

                throw new Error(
                    "This Google account is not registered as a Rider."
                );

            }


            profile.role =
                "rider";

            profile.userRole =
                "rider";


            AUTH.saveSession(
                profile,
                "rider"
            );


            AUTH.state.firebaseUser =
                firebaseUser;


            await completeRiderLogin({

                user:
                    profile,

                firebaseUser:
                    firebaseUser

            });

        } catch (error) {

            console.error(
                "RiderX Google rider login failed:",
                error
            );

            setLoading(
                false
            );

            showStatus(
                getErrorMessage(error),
                "error"
            );

        }

    }
);


/* =========================================================
   OTP LOGIN
========================================================= */

otpLogin.addEventListener(
    "click",
    function () {

        localStorage.setItem(
            "riderx_selected_role",
            "rider"
        );


        window.location.href =
            "./otp-login.html";

    }
);


/* =========================================================
   FORGOT PASSWORD
========================================================= */

forgotPassword.addEventListener(
    "click",
    async function () {

        clearStatus();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        if (!email) {

            showStatus(
                "Enter your email first, then tap Forgot password.",
                "error"
            );

            emailInput.focus();

            return;

        }


        try {

            setLoading(
                true,
                "Sending password reset..."
            );


            const AUTH =
                await getAuthEngine();


            await AUTH.resetPassword(
                email
            );


            setLoading(
                false
            );


            showStatus(
                "Password reset email sent. Check your inbox.",
                "success"
            );

        } catch (error) {

            console.error(
                "RiderX password reset failed:",
                error
            );

            setLoading(
                false
            );

            showStatus(
                getErrorMessage(error),
                "error"
            );

        }

    }
);


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

showPassword.addEventListener(
    "click",
    function () {

        const isPassword =
            passwordInput.type ===
            "password";


        passwordInput.type =
            isPassword
                ? "text"
                : "password";


        showPassword.textContent =
            isPassword
                ? "HIDE"
                : "SHOW";

    }
);


/* =========================================================
   REGISTER
========================================================= */

registerButton.addEventListener(
    "click",
    function () {

        localStorage.setItem(
            "riderx_selected_role",
            "rider"
        );


        window.location.href =
            "./register.html";

    }
);


/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
    "click",
    function () {

        localStorage.removeItem(
            "riderx_selected_role"
        );


        window.location.href =
            "./login.html";

    }
);


/* =========================================================
   AUTH EVENTS
========================================================= */

window.addEventListener(
    "riderx-auth-signed-out",
    function () {

        /*
         * Do not redirect automatically here.
         * The user may simply be visiting the login page.
         */

    }
);


/* =========================================================
   PREVENT DOUBLE SUBMIT
========================================================= */

window.addEventListener(
    "beforeunload",
    function () {

        /*
         * Nothing required here.
         * Firebase session persistence is handled by Firebase Auth.
         */

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

(function initializePage() {

    localStorage.setItem(
        "riderx_selected_role",
        "rider"
    );

    /*
     * If an already authenticated Rider opens this page,
     * verify the current session before redirecting.
     */

    setTimeout(
        async function () {

            try {

                const AUTH =
                    await getAuthEngine();


                if (
                    !AUTH.isLoggedIn()
                ) {

                    return;

                }


                const role =
                    AUTH.normalizeRole(
                        AUTH.getRole()
                    );


                if (
                    role !== "rider"
                ) {

                    return;

                }


                const user =
                    AUTH.getUser();


                if (!user) {
                    return;
                }


                const rider =
                    await verifyRiderProfile(
                        user
                    );


                if (!rider) {
                    return;
                }


                AUTH.saveSession(
                    rider,
                    "rider"
                );


                window.location.replace(
                    "../rider/home.html"
                );

            } catch (error) {

                /*
                 * Existing/invalid session should not
                 * prevent the login page from opening.
                 */

                console.warn(
                    "RiderX existing session check:",
                    error
                );

            }

        },
        350
    );

})();

</script>
