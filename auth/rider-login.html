<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#ffd400"
>

<meta
    name="description"
    content="RiderX Rider / Driver Partner Login"
>

<title>RiderX - Rider Login</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    min-height: 100vh;
    min-height: 100dvh;

    background: #070707;
    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.page {
    position: relative;

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

    overflow: hidden;
}

.glow {
    position: fixed;

    width: 430px;
    height: 430px;

    border-radius: 50%;

    pointer-events: none;
}

.glow.one {
    top: -300px;
    right: -170px;

    background:
        rgba(255, 212, 0, .08);
}

.glow.two {
    bottom: -300px;
    left: -180px;

    background:
        rgba(255, 212, 0, .05);
}

.card {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 455px;

    padding: 29px 23px 22px;

    border:
        1px solid #292929;

    border-radius: 24px;

    background: #111111;

    box-shadow:
        0 25px 80px
        rgba(0, 0, 0, .55);
}

.brand {
    margin-bottom: 23px;

    text-align: center;
}

.logo {
    width: 64px;
    height: 64px;

    margin:
        0 auto 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background: #ffd400;
    color: #080808;

    font-size: 22px;
    font-weight: 1000;
}

.brand h1 {
    margin: 0;

    font-size: 26px;
    font-weight: 1000;
}

.brand h1 span {
    color: #ffd400;
}

.brand p {
    margin: 6px 0 0;

    color: #777777;

    font-size: 9px;
}

.heading {
    text-align: center;
}

.heading h2 {
    margin: 0;

    font-size: 20px;
    font-weight: 900;
}

.heading p {
    max-width: 350px;

    margin:
        7px auto 0;

    color: #777777;

    font-size: 9px;
    line-height: 1.6;
}

.role-badge {
    width: fit-content;

    margin:
        16px auto 0;

    padding:
        7px 12px;

    border:
        1px solid #4b4100;

    border-radius: 999px;

    background:
        rgba(255, 212, 0, .07);

    color: #ffd400;

    font-size: 8px;
    font-weight: 900;
}

.form {
    margin-top: 22px;
}

.field {
    margin-bottom: 13px;
}

.field label {
    display: block;

    margin:
        0 0 6px;

    color: #aaaaaa;

    font-size: 9px;
    font-weight: 800;
}

.field input {
    width: 100%;
    height: 46px;

    padding:
        0 13px;

    border:
        1px solid #303030;

    border-radius: 11px;

    outline: none;

    background: #181818;
    color: #ffffff;

    font-size: 11px;

    transition:
        border-color .15s ease,
        box-shadow .15s ease;
}

.field input::placeholder {
    color: #555555;
}

.field input:focus {
    border-color: #ffd400;

    box-shadow:
        0 0 0 2px
        rgba(255, 212, 0, .06);
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 70px;
}

.show-password {
    position: absolute;

    top: 50%;
    right: 9px;

    transform:
        translateY(-50%);

    border: 0;

    background:
        transparent;

    color: #777777;

    cursor: pointer;

    font-size: 8px;
    font-weight: 900;
}

.show-password:hover {
    color: #ffd400;
}

.forgot {
    display: flex;
    justify-content: flex-end;

    margin:
        -3px 0 14px;
}

.forgot button {
    border: 0;
    padding: 0;

    background:
        transparent;

    color: #ffd400;

    cursor: pointer;

    font-size: 8px;
    font-weight: 900;
}

.forgot button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.primary {
    width: 100%;
    min-height: 46px;

    border: 0;
    border-radius: 11px;

    background: #ffd400;
    color: #090909;

    cursor: pointer;

    font-size: 10px;
    font-weight: 1000;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.primary:hover {
    opacity: .94;
}

.primary:active {
    transform: scale(.99);
}

.primary:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.divider {
    display: flex;

    align-items: center;

    gap: 10px;

    margin: 18px 0;

    color: #555555;

    font-size: 8px;
}

.divider::before,
.divider::after {
    content: "";

    flex: 1;

    height: 1px;

    background: #292929;
}

.google,
.otp {
    width: 100%;
    height: 44px;

    border:
        1px solid #333333;

    border-radius: 10px;

    background: #181818;

    cursor: pointer;

    font-size: 9px;
    font-weight: 900;
}

.google {
    color: #ffffff;
}

.otp {
    margin-top: 10px;

    color: #ffd400;
}

.google:hover,
.otp:hover {
    border-color: #ffd400;
}

.google:disabled,
.otp:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    display: none;

    margin-top: 14px;

    padding: 10px;

    border-radius: 9px;

    font-size: 8px;
    line-height: 1.5;

    text-align: center;
}

.status.show {
    display: block;
}

.status.info {
    border:
        1px solid #443b00;

    background:
        rgba(255, 212, 0, .07);

    color: #ffd400;
}

.status.error {
    border:
        1px solid #5a2222;

    background:
        rgba(255, 50, 50, .07);

    color: #ff7777;
}

.status.success {
    border:
        1px solid #28512e;

    background:
        rgba(40, 180, 70, .07);

    color: #70d888;
}

.register {
    margin-top: 19px;

    padding-top: 17px;

    border-top:
        1px solid #272727;

    text-align: center;

    color: #666666;

    font-size: 9px;
}

.register button {
    margin-left: 4px;

    border: 0;
    padding: 0;

    background:
        transparent;

    color: #ffd400;

    cursor: pointer;

    font-weight: 900;
}

.back {
    display: block;

    width: fit-content;

    margin:
        13px auto 0;

    border: 0;

    background:
        transparent;

    color: #555555;

    cursor: pointer;

    font-size: 8px;
}

.back:hover {
    color: #ffd400;
}

.footer {
    margin-top: 17px;

    color: #444444;

    font-size: 8px;

    text-align: center;
}

.loading {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(0, 0, 0, .72);

    backdrop-filter:
        blur(5px);
}

.loading.show {
    display: flex;
}

.loading-box {
    min-width: 190px;

    padding:
        22px 27px;

    border:
        1px solid #333333;

    border-radius: 15px;

    background: #111111;

    text-align: center;
}

.spinner {
    width: 28px;
    height: 28px;

    margin:
        0 auto 10px;

    border:
        3px solid #333333;

    border-top-color:
        #ffd400;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

.loading-box span {
    color: #aaaaaa;

    font-size: 9px;
}

@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}

@media (max-width: 390px) {

    .card {
        padding:
            25px 17px 19px;

        border-radius: 20px;
    }

    .logo {
        width: 58px;
        height: 58px;
    }

}

</style>

</head>


<body>

<main class="page">

    <div class="glow one"></div>
    <div class="glow two"></div>


    <section class="card">


        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                One platform. Every journey.
            </p>

        </div>


        <div class="heading">

            <h2>
                Rider Login
            </h2>

            <p>
                Login to your RiderX Driver Partner
                account and start accepting rides.
            </p>

            <div class="role-badge">
                RIDER / DRIVER PARTNER
            </div>

        </div>


        <form
            class="form"
            id="loginForm"
            novalidate
        >


            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    inputmode="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <div class="forgot">

                <button
                    type="button"
                    id="forgotPassword"
                >
                    Forgot password?
                </button>

            </div>


            <button
                type="submit"
                class="primary"
                id="loginButton"
            >
                LOGIN AS RIDER
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            class="google"
            id="googleLogin"
        >
            Continue with Google
        </button>


        <button
            type="button"
            class="otp"
            id="otpLogin"
        >
            Login with Mobile / OTP
        </button>


        <div
            class="status"
            id="status"
            role="status"
            aria-live="polite"
        ></div>


        <div class="register">

            New RiderX rider?

            <button
                type="button"
                id="registerButton"
            >
                Create Rider Account
            </button>

        </div>


        <button
            type="button"
            class="back"
            id="backButton"
        >
            ← Change account type
        </button>


        <div class="footer">
            © 2026 RiderX • Chandigarh
        </div>


    </section>

</main>


<div
    class="loading"
    id="loading"
    aria-hidden="true"
>

    <div class="loading-box">

        <div class="spinner"></div>

        <span id="loadingText">
            Signing in...
        </span>

    </div>

</div>


<script type="module">

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const googleLogin =
    document.getElementById(
        "googleLogin"
    );

const otpLogin =
    document.getElementById(
        "otpLogin"
    );

const forgotPassword =
    document.getElementById(
        "forgotPassword"
    );

const registerButton =
    document.getElementById(
        "registerButton"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const showPassword =
    document.getElementById(
        "showPassword"
    );

const statusBox =
    document.getElementById(
        "status"
    );

const loading =
    document.getElementById(
        "loading"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );


/* =========================================================
   STATE
========================================================= */

let AUTH = null;

let Firebase = null;

let processing = false;

let redirecting = false;


/* =========================================================
   FORCE RIDER ROLE
========================================================= */

function setRiderRole() {

    localStorage.setItem(
        "riderx_selected_role",
        "rider"
    );

    localStorage.setItem(
        "riderx_role",
        "rider"
    );

    localStorage.setItem(
        "userRole",
        "rider"
    );

}

setRiderRole();


/* =========================================================
   LOAD CENTRAL AUTH ENGINE
========================================================= */

async function getAuthEngine() {

    if (
        AUTH
    ) {

        return AUTH;

    }


    await import(
        "../js/auth.js"
    );


    if (
        window.RiderX &&
        window.RiderX.auth
    ) {

        AUTH =
            window.RiderX.auth;

        return AUTH;

    }


    throw new Error(
        "RiderX authentication engine could not be loaded."
    );

}


/* =========================================================
   LOAD FIREBASE MODULE
========================================================= */

async function getFirebase() {

    if (
        Firebase
    ) {

        return Firebase;

    }


    Firebase =
        await import(
            "../firebase/firebase-config.js"
        );


    if (
        !Firebase ||
        !Firebase.auth
    ) {

        throw new Error(
            "Firebase Auth is unavailable."
        );

    }


    return Firebase;

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type = "info"
) {

    statusBox.textContent =
        String(
            message || ""
        );

    statusBox.className =
        "status show " +
        type;

}


function clearStatus() {

    statusBox.textContent =
        "";

    statusBox.className =
        "status";

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(
    active,
    message = "Please wait..."
) {

    loadingText.textContent =
        message;

    loading.classList.toggle(
        "show",
        Boolean(active)
    );

    loading.setAttribute(
        "aria-hidden",
        active
            ? "false"
            : "true"
    );


    loginButton.disabled =
        active;

    googleLogin.disabled =
        active;

    otpLogin.disabled =
        active;

    registerButton.disabled =
        active;

    forgotPassword.disabled =
        active;

}


/* =========================================================
   EMAIL VALIDATION
========================================================= */

function validEmail(
    value
) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
        value
    );

}


/* =========================================================
   ERROR TRANSLATOR
========================================================= */

function getErrorMessage(
    error
) {

    const code =
        String(
            error?.code ||
            ""
        )
            .toLowerCase();


    const messages = {

        "auth/invalid-credential":
            "Invalid email or password.",

        "auth/invalid-login-credentials":
            "Invalid email or password.",

        "auth/wrong-password":
            "Invalid email or password.",

        "auth/user-not-found":
            "No RiderX account was found with this email.",

        "auth/invalid-email":
            "Please enter a valid email address.",

        "auth/too-many-requests":
            "Too many attempts. Please wait and try again.",

        "auth/network-request-failed":
            "Network error. Check your internet connection.",

        "auth/user-disabled":
            "This Firebase account has been disabled.",

        "auth/popup-closed-by-user":
            "Google login was cancelled.",

        "auth/popup-blocked":
            "The browser blocked the Google login popup.",

        "auth/operation-not-allowed":
            "This login method is not enabled in Firebase.",

        "auth/email-already-in-use":
            "An account with this email already exists.",

        "auth/app-not-authorized":
            "This RiderX domain is not authorized in Firebase."

    };


    if (
        messages[code]
    ) {

        return messages[code];

    }


    const message =
        String(
            error?.message ||
            ""
        );


    if (
        message
    ) {

        return message;

    }


    return (
        "Unable to complete Rider login. Please try again."
    );

}


/* =========================================================
   NORMALIZE ROLE
========================================================= */

function normalizeRole(
    role
) {

    if (
        AUTH &&
        typeof AUTH.normalizeRole ===
        "function"
    ) {

        return AUTH.normalizeRole(
            role
        );

    }


    const value =
        String(
            role || ""
        )
            .trim()
            .toLowerCase()
            .replace(
                /[\s-]+/g,
                "_"
            );


    if (
        [
            "rider",
            "driver",
            "partner",
            "driver_partner",
            "driverpartner",
            "captain"
        ].includes(
            value
        )
    ) {

        return "rider";

    }


    if (
        [
            "customer",
            "user"
        ].includes(
            value
        )
    ) {

        return "customer";

    }


    if (
        value === "admin"
    ) {

        return "admin";

    }


    return "";

}


/* =========================================================
   CLEAR INVALID SESSION
========================================================= */

async function clearInvalidSession() {

    try {

        if (
            AUTH &&
            typeof AUTH.logout ===
            "function"
        ) {

            await AUTH.logout();

        }

    } catch (
        error
    ) {

        console.warn(
            "RiderX logout warning:",
            error
        );

    }


    try {

        if (
            Firebase &&
            Firebase.auth &&
            typeof Firebase.signOut ===
            "function"
        ) {

            await Firebase.signOut(
                Firebase.auth
            );

        }

    } catch (
        error
    ) {

        console.warn(
            "Firebase sign-out warning:",
            error
        );

    }


    localStorage.removeItem(
        "riderx_user"
    );

    localStorage.removeItem(
        "riderx_rider"
    );

    localStorage.removeItem(
        "riderx_session"
    );

    localStorage.removeItem(
        "riderx_role"
    );

    localStorage.removeItem(
        "userRole"
    );

}


/* =========================================================
   VERIFY RIDER PROFILE
========================================================= */

async function verifyRiderProfile(
    user
) {

    if (
        !user
    ) {

        throw new Error(
            "Rider account information is missing."
        );

    }


    const uid =
        user.uid ||
        user.id ||
        user.userId;


    if (
        !uid
    ) {

        throw new Error(
            "Rider account ID is missing."
        );

    }


    const FB =
        await getFirebase();


    let userData =
        null;

    let riderData =
        null;


    /* -----------------------------------------------------
       users/{uid}
    ----------------------------------------------------- */

    try {

        const userSnapshot =
            await FB.getDoc(
                FB.doc(
                    FB.db,
                    "users",
                    uid
                )
            );


        if (
            userSnapshot.exists()
        ) {

            userData =
                userSnapshot.data() ||
                {};

        }

    } catch (
        error
    ) {

        console.warn(
            "RiderX users profile check failed:",
            error
        );

    }


    /* -----------------------------------------------------
       riders/{uid}
    ----------------------------------------------------- */

    try {

        const riderSnapshot =
            await FB.getDoc(
                FB.doc(
                    FB.db,
                    "riders",
                    uid
                )
            );


        if (
            riderSnapshot.exists()
        ) {

            riderData =
                riderSnapshot.data() ||
                {};

        }

    } catch (
        error
    ) {

        console.warn(
            "RiderX riders profile check failed:",
            error
        );

    }


    if (
        !userData &&
        !riderData
    ) {

        throw new Error(
            "Rider profile was not found. Please complete Rider registration first."
        );

    }


    const role =
        normalizeRole(
            riderData?.role ||
            riderData?.userRole ||
            riderData?.accountType ||
            userData?.role ||
            userData?.userRole ||
            userData?.accountType
        );


    if (
        role === "customer"
    ) {

        throw new Error(
            "This account is registered as a Customer, not a Rider."
        );

    }


    if (
        role !== "rider"
    ) {

        throw new Error(
            "Rider role is not configured for this account."
        );

    }


    const status =
        String(
            riderData?.status ||
            riderData?.approvalStatus ||
            userData?.status ||
            userData?.accountStatus ||
            "active"
        )
            .trim()
            .toLowerCase();


    if (
        [
            "blocked",
            "disabled",
            "suspended",
            "banned"
        ].includes(
            status
        )
    ) {

        throw new Error(
            "Your RiderX rider account is disabled or suspended."
        );

    }


    if (
        [
            "rejected",
            "declined"
        ].includes(
            status
        )
    ) {

        window.location.replace(
            "../rider/rejected.html"
        );

        return null;

    }


    if (
        [
            "pending",
            "pending_approval",
            "under_review",
            "verification_pending"
        ].includes(
            status
        )
    ) {

        window.location.replace(
            "../rider/pending.html"
        );

        return null;

    }


    return {

        ...userData,

        ...riderData,

        uid:

            uid,

        role:

            "rider",

        userRole:

            "rider",

        accountType:

            "rider",

        status:

            status

    };

}


/* =========================================================
   COMPLETE RIDER LOGIN
========================================================= */

async function completeRiderLogin(
    result
) {

    if (
        !result
    ) {

        throw new Error(
            "Rider login result is missing."
        );

    }


    const firebaseUser =
        result.firebaseUser ||
        result.user;


    if (
        !firebaseUser ||
        !firebaseUser.uid
    ) {

        throw new Error(
            "Firebase Rider account could not be identified."
        );

    }


    let profile =
        result.profile ||
        null;


    if (
        !profile &&
        AUTH &&
        typeof AUTH.getProfile ===
        "function"
    ) {

        profile =
            await AUTH.getProfile(
                firebaseUser
            );

    }


    profile =
        profile ||
        firebaseUser;


    const rider =
        await verifyRiderProfile(
            profile
        );


    if (
        !rider
    ) {

        return;

    }


    rider.role =
        "rider";

    rider.userRole =
        "rider";

    rider.accountType =
        "rider";


    if (
        typeof AUTH.saveSession ===
        "function"
    ) {

        AUTH.saveSession(
            rider,
            "rider"
        );

    }


    if (
        AUTH.state
    ) {

        AUTH.state.firebaseUser =
            firebaseUser;

        AUTH.state.user =
            rider;

        AUTH.state.role =
            "rider";

    }


    localStorage.setItem(
        "riderx_selected_role",
        "rider"
    );

    localStorage.setItem(
        "riderx_role",
        "rider"
    );

    localStorage.setItem(
        "userRole",
        "rider"
    );


    showStatus(
        "Login successful. Opening RiderX...",
        "success"
    );


    redirecting =
        true;


    setLoading(
        true,
        "Opening RiderX Rider..."
    );


    window.setTimeout(
        function () {

            window.location.replace(
                "../rider/home.html"
            );

        },
        300
    );

}


/* =========================================================
   EMAIL LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function (
        event
    ) {

        event.preventDefault();


        if (
            processing ||
            redirecting
        ) {

            return;

        }


        clearStatus();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (
            !email
        ) {

            showStatus(
                "Please enter your email address.",
                "error"
            );

            emailInput.focus();

            return;

        }


        if (
            !validEmail(
                email
            )
        ) {

            showStatus(
                "Please enter a valid email address.",
                "error"
            );

            emailInput.focus();

            return;

        }


        if (
            !password
        ) {

            showStatus(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        if (
            password.length < 6
        ) {

            showStatus(
                "Password must contain at least 6 characters.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        processing =
            true;


        try {

            setLoading(
                true,
                "Signing in as Rider..."
            );


            const authEngine =
                await getAuthEngine();


            const result =
                await authEngine.loginEmail(
                    email,
                    password
                );


            const role =
                normalizeRole(
                    result?.role
                );


            if (
                role !== "rider"
            ) {

                await clearInvalidSession();


                throw new Error(
                    "This account is not registered as a Rider."
                );

            }


            await completeRiderLogin(
                result
            );


        } catch (
            error
        ) {

            console.error(
                "RiderX Rider login failed:",
                error
            );


            if (
                !redirecting
            ) {

                setLoading(
                    false
                );

                showStatus(
                    getErrorMessage(
                        error
                    ),
                    "error"
                );

            }

        } finally {

            processing =
                false;

        }

    }
);


/* =========================================================
   GOOGLE LOGIN
========================================================= */

googleLogin.addEventListener(
    "click",
    async function () {

        if (
            processing ||
            redirecting
        ) {

            return;

        }


        processing =
            true;


        clearStatus();


        try {

            setLoading(
                true,
                "Connecting with Google..."
            );


            const authEngine =
                await getAuthEngine();


            const FB =
                await getFirebase();


            if (
                !FB.googleProvider ||
                !FB.signInWithPopup
            ) {

                throw new Error(
                    "Google login is not configured in Firebase."
                );

            }


            const result =
                await FB.signInWithPopup(
                    FB.auth,
                    FB.googleProvider
                );


            const firebaseUser =
                result.user;


            if (
                !firebaseUser
            ) {

                throw new Error(
                    "Google account could not be identified."
                );

            }


            const profile =
                await authEngine.getProfile(
                    firebaseUser
                );


            const role =
                normalizeRole(
                    await authEngine.resolveRole(
                        profile
                    )
                );


            if (
                role !== "rider"
            ) {

                try {

                    await FB.signOut(
                        FB.auth
                    );

                } catch (
                    signOutError
                ) {

                    console.warn(
                        "Google account sign-out warning:",
                        signOutError
                    );

                }


                throw new Error(
                    role === "customer"
                        ? "This Google account is registered as a Customer, not a Rider."
                        : "No RiderX Rider role is configured for this Google account. Please register as a Rider first."
                );

            }


            await completeRiderLogin({

                firebaseUser:

                    firebaseUser,

                user:

                    profile

            });


        } catch (
            error
        ) {

            console.error(
                "RiderX Google login failed:",
                error
            );


            if (
                !redirecting
            ) {

                setLoading(
                    false
                );

                showStatus(
                    getErrorMessage(
                        error
                    ),
                    "error"
                );

            }

        } finally {

            processing =
                false;

        }

    }
);

/* =========================================================
   INITIAL SESSION CHECK
========================================================= */

async function checkExistingRiderSession() {

    try {

        const authEngine =
            await getAuthEngine();


        if (
            typeof authEngine.isLoggedIn !==
            "function"
        ) {

            return;

        }


        if (
            !authEngine.isLoggedIn()
        ) {

            return;

        }


        const currentRole =
            normalizeRole(
                typeof authEngine.getRole ===
                "function"
                    ? authEngine.getRole()
                    : ""
            );


        if (
            currentRole !==
            "rider"
        ) {

            return;

        }


        const currentUser =
            typeof authEngine.getUser ===
            "function"
                ? authEngine.getUser()
                : null;


        if (
            !currentUser
        ) {

            return;

        }


        const rider =
            await verifyRiderProfile(
                currentUser
            );


        if (
            !rider
        ) {

            return;

        }


        if (
            typeof authEngine.saveSession ===
            "function"
        ) {

            authEngine.saveSession(
                rider,
                "rider"
            );

        }


        localStorage.setItem(
            "riderx_selected_role",
            "rider"
        );


        window.location.replace(
            "../rider/home.html"
        );


    } catch (
        error
    ) {

        /*
         * Login page itself must remain usable if
         * a stale session/profile is present.
         */

        console.warn(
            "RiderX existing rider session check:",
            error
        );

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

window.setTimeout(
    function () {

        checkExistingRiderSession();

    },
    350
);
