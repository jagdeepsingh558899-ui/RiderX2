<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#ffd400"
>

<meta
    name="description"
    content="RiderX Rider / Driver Partner Login"
>

<title>RiderX - Rider Login</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>
*{box-sizing:border-box}

html,
body{
    width:100%;
    min-height:100%;
    margin:0;
}

body{
    min-height:100vh;
    min-height:100dvh;
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
}

button,
input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
input:focus-visible{
    outline:2px solid #ffd400;
    outline-offset:2px;
}

.page{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
        max(18px,env(safe-area-inset-top))
        max(18px,env(safe-area-inset-right))
        max(18px,env(safe-area-inset-bottom))
        max(18px,env(safe-area-inset-left));
    overflow:auto;
    background:
        radial-gradient(
            circle at top,
            rgba(255,212,0,.10),
            transparent 40%
        ),
        #070707;
}

.glow{
    position:fixed;
    width:430px;
    height:430px;
    border-radius:50%;
    pointer-events:none;
}

.glow.one{
    top:-300px;
    right:-170px;
    background:rgba(255,212,0,.08);
}

.glow.two{
    bottom:-300px;
    left:-180px;
    background:rgba(255,212,0,.05);
}

.card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:455px;
    margin:12px 0;
    padding:29px 23px 22px;
    border:1px solid #292929;
    border-radius:24px;
    background:#111;
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.brand{
    margin-bottom:23px;
    text-align:center;
}

.logo{
    width:64px;
    height:64px;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:18px;
    background:#ffd400;
    color:#080808;
    font-size:22px;
    font-weight:1000;
    box-shadow:0 10px 30px rgba(255,212,0,.12);
}

.brand h1{
    margin:0;
    font-size:26px;
    font-weight:1000;
}

.brand h1 span{
    color:#ffd400;
}

.brand p{
    margin:6px 0 0;
    color:#777;
    font-size:9px;
}

.heading{
    text-align:center;
}

.heading h2{
    margin:0;
    font-size:20px;
    font-weight:900;
}

.heading p{
    max-width:350px;
    margin:7px auto 0;
    color:#777;
    font-size:9px;
    line-height:1.6;
}

.role-badge{
    width:max-content;
    max-width:100%;
    margin:16px auto 0;
    padding:7px 12px;
    border:1px solid #4b4100;
    border-radius:999px;
    background:rgba(255,212,0,.07);
    color:#ffd400;
    font-size:8px;
    font-weight:900;
}

.form{
    margin-top:22px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    margin:0 0 6px;
    color:#aaa;
    font-size:9px;
    font-weight:800;
}

.field input{
    width:100%;
    height:46px;
    padding:0 13px;
    border:1px solid #303030;
    border-radius:11px;
    outline:none;
    background:#181818;
    color:#fff;
    font-size:11px;
    transition:border-color .15s ease,box-shadow .15s ease;
}

.field input::placeholder{
    color:#555;
}

.field input:focus{
    border-color:#ffd400;
    box-shadow:0 0 0 2px rgba(255,212,0,.06);
}

.field input:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:70px;
}

.show-password{
    position:absolute;
    top:50%;
    right:9px;
    transform:translateY(-50%);
    border:0;
    padding:6px;
    border-radius:6px;
    background:transparent;
    color:#777;
    cursor:pointer;
    font-size:8px;
    font-weight:900;
}

.show-password:hover{
    color:#ffd400;
    background:rgba(255,212,0,.05);
}

.show-password:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.forgot{
    display:flex;
    justify-content:flex-end;
    margin:-3px 0 14px;
}

.forgot button{
    border:0;
    padding:0;
    background:transparent;
    color:#ffd400;
    cursor:pointer;
    font-size:8px;
    font-weight:900;
}

.forgot button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.primary{
    width:100%;
    min-height:46px;
    border:0;
    border-radius:11px;
    background:#ffd400;
    color:#090909;
    cursor:pointer;
    font-size:10px;
    font-weight:1000;
    transition:transform .15s ease,opacity .15s ease;
}

.primary:hover{
    opacity:.94;
}

.primary:active{
    transform:scale(.99);
}

.primary:disabled{
    opacity:.55;
    cursor:not-allowed;
    transform:none;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0;
    color:#555;
    font-size:8px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#292929;
}

.google,
.otp{
    width:100%;
    height:44px;
    border:1px solid #333;
    border-radius:10px;
    background:#181818;
    cursor:pointer;
    font-size:9px;
    font-weight:900;
}

.google{
    color:#fff;
}

.otp{
    margin-top:10px;
    color:#ffd400;
}

.google:hover,
.otp:hover{
    border-color:#ffd400;
}

.google:disabled,
.otp:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.status{
    display:none;
    margin-top:14px;
    padding:10px;
    border-radius:9px;
    font-size:8px;
    line-height:1.5;
    text-align:center;
    overflow-wrap:anywhere;
}

.status.show{
    display:block;
}

.status.info{
    border:1px solid #443b00;
    background:rgba(255,212,0,.07);
    color:#ffd400;
}

.status.error{
    border:1px solid #5a2222;
    background:rgba(255,50,50,.07);
    color:#ff7777;
}

.status.success{
    border:1px solid #28512e;
    background:rgba(40,180,70,.07);
    color:#70d888;
}

.register{
    margin-top:19px;
    padding-top:17px;
    border-top:1px solid #272727;
    text-align:center;
    color:#666;
    font-size:9px;
}

.register button{
    margin-left:4px;
    border:0;
    padding:0;
    background:transparent;
    color:#ffd400;
    cursor:pointer;
    font-weight:900;
}

.register button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.back{
    display:block;
    width:max-content;
    margin:13px auto 0;
    border:0;
    background:transparent;
    color:#555;
    cursor:pointer;
    font-size:8px;
}

.back:hover{
    color:#ffd400;
}

.back:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.footer{
    margin-top:17px;
    color:#444;
    font-size:8px;
    text-align:center;
}

.loading{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(5px);
}

.loading.show{
    display:flex;
}

.loading-box{
    min-width:190px;
    max-width:90vw;
    padding:22px 27px;
    border:1px solid #333;
    border-radius:15px;
    background:#111;
    text-align:center;
}

.spinner{
    width:28px;
    height:28px;
    margin:0 auto 10px;
    border:3px solid #333;
    border-top-color:#ffd400;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.loading-box span{
    color:#aaa;
    font-size:9px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:390px){
    .card{
        padding:25px 17px 19px;
        border-radius:20px;
    }

    .logo{
        width:58px;
        height:58px;
    }
}

@media(prefers-reduced-motion:reduce){
    .spinner{
        animation:none;
    }

    .primary,
    .field input{
        transition:none;
    }
}
</style>

</head>

<body>

<main class="page">

    <div class="glow one" aria-hidden="true"></div>
    <div class="glow two" aria-hidden="true"></div>

    <section class="card" aria-labelledby="riderLoginTitle">

        <div class="brand">

            <div class="logo" aria-hidden="true">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                One platform. Every journey.
            </p>

        </div>

        <div class="heading">

            <h2 id="riderLoginTitle">
                Rider Login
            </h2>

            <p>
                Login to your RiderX Driver Partner
                account and start accepting rides.
            </p>

            <div class="role-badge">
                RIDER / DRIVER PARTNER
            </div>

        </div>

        <form
            class="form"
            id="loginForm"
            novalidate
        >

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    inputmode="email"
                    placeholder="Enter your email"
                    maxlength="254"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        minlength="6"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        SHOW
                    </button>

                </div>

            </div>

            <div class="forgot">

                <button
                    type="button"
                    id="forgotPassword"
                >
                    Forgot password?
                </button>

            </div>

            <button
                type="submit"
                class="primary"
                id="loginButton"
            >
                LOGIN AS RIDER
            </button>

        </form>

        <div class="divider">
            OR
        </div>

        <button
            type="button"
            class="google"
            id="googleLogin"
        >
            Continue with Google
        </button>

        <button
            type="button"
            class="otp"
            id="otpLogin"
        >
            Login with Mobile / OTP
        </button>

        <div
            class="status"
            id="status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        ></div>

        <div class="register">

            New RiderX rider?

            <button
                type="button"
                id="registerButton"
            >
                Create Rider Account
            </button>

        </div>

        <button
            type="button"
            class="back"
            id="backButton"
        >
            ← Change account type
        </button>

        <div class="footer">
            © 2026 RiderX • India
        </div>

    </section>

</main>

<div
    class="loading"
    id="loading"
    aria-hidden="true"
>

    <div class="loading-box">

        <div class="spinner" aria-hidden="true"></div>

        <span id="loadingText">
            Signing in...
        </span>

    </div>

</div>

<script type="module">
"use strict";

/* ============================================================
   RIDERX RIDER LOGIN
   ------------------------------------------------------------
   AUTHENTICATION OWNER:
       js/auth.js

   FIREBASE OWNER:
       firebase/firebase-config.js

   THIS PAGE:
       - collects login credentials
       - forces rider context
       - delegates authentication
       - verifies rider role/profile
       - handles rider approval status
       - redirects verified riders to rider/home.html

   IMPORTANT:
       No independent Firebase initialization is performed here.
============================================================ */

/* ============================================================
   ROUTES
============================================================ */

const ROUTES = Object.freeze({
    login: "./login.html",
    register: "./register.html",
    otp: "./otp-login.html",
    riderHome: "../rider/home.html",
    riderPending: "../rider/pending.html",
    riderRejected: "../rider/rejected.html"
});

/* ============================================================
   STORAGE
============================================================ */

const STORAGE_KEYS = Object.freeze({
    selectedRole: "riderx_selected_role",
    role: "riderx_role",
    userRole: "userRole",
    user: "riderx_user",
    rider: "riderx_rider",
    session: "riderx_session"
});

/* ============================================================
   ELEMENTS
============================================================ */

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const loginButton = document.getElementById("loginButton");
const googleLogin = document.getElementById("googleLogin");
const otpLogin = document.getElementById("otpLogin");
const forgotPassword = document.getElementById("forgotPassword");

const registerButton = document.getElementById("registerButton");
const backButton = document.getElementById("backButton");
const showPassword = document.getElementById("showPassword");

const statusBox = document.getElementById("status");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

/* ============================================================
   STATE
============================================================ */

let AUTH = null;
let Firebase = null;

let processing = false;
let redirecting = false;
let initialized = false;

/* ============================================================
   STORAGE HELPERS
============================================================ */

function setStorage(key, value) {
    try {
        localStorage.setItem(key, String(value));
    } catch (error) {
        console.warn("RiderX storage write failed:", error);
    }
}

function removeStorage(key) {
    try {
        localStorage.removeItem(key);
    } catch (error) {
        console.warn("RiderX storage remove failed:", error);
    }
}

/* ============================================================
   FORCE RIDER CONTEXT
============================================================ */

function setRiderRole() {
    setStorage(STORAGE_KEYS.selectedRole, "rider");
    setStorage(STORAGE_KEYS.role, "rider");
    setStorage(STORAGE_KEYS.userRole, "rider");
}

/* ============================================================
   AUTH ENGINE
============================================================ */

async function getAuthEngine() {

    if (AUTH) {
        return AUTH;
    }

    if (window.RiderX?.auth) {
        AUTH = window.RiderX.auth;
        return AUTH;
    }

    if (window.RiderXAuth?.auth) {
        AUTH = window.RiderXAuth.auth;
        return AUTH;
    }

    const module = await import("../js/auth.js");

    AUTH =
        module?.AUTH ||
        module?.auth ||
        module?.default ||
        window.RiderX?.auth ||
        window.RiderXAuth?.auth ||
        null;

    if (!AUTH) {
        throw new Error(
            "RiderX authentication engine could not be loaded."
        );
    }

    return AUTH;
}

/* ============================================================
   FIREBASE MODULE
============================================================ */

async function getFirebase() {

    if (Firebase) {
        return Firebase;
    }

    Firebase =
        await import("../firebase/firebase-config.js");

    if (!Firebase?.auth) {
        throw new Error(
            "Firebase Authentication is unavailable."
        );
    }

    return Firebase;
}

/* ============================================================
   STATUS
============================================================ */

function showStatus(text, type = "info") {

    const message = String(text || "").trim();

    if (!message) {
        clearStatus();
        return;
    }

    const safeType =
        ["info", "error", "success"].includes(type)
            ? type
            : "info";

    statusBox.textContent = message;
    statusBox.className = "status show " + safeType;
}

function clearStatus() {
    statusBox.textContent = "";
    statusBox.className = "status";
}

/* ============================================================
   LOADING
============================================================ */

function setLoading(active, text = "Please wait...") {

    const isActive = Boolean(active);

    loadingText.textContent = text;

    loading.classList.toggle(
        "show",
        isActive
    );

    loading.setAttribute(
        "aria-hidden",
        isActive ? "false" : "true"
    );

    loginButton.disabled = isActive;
    googleLogin.disabled = isActive;
    otpLogin.disabled = isActive;
    registerButton.disabled = isActive;
    forgotPassword.disabled = isActive;
    backButton.disabled = isActive;
    showPassword.disabled = isActive;
    emailInput.disabled = isActive;
    passwordInput.disabled = isActive;
}

/* ============================================================
   EMAIL VALIDATION
============================================================ */

function validEmail(value) {

    const email = String(value || "").trim();

    return (
        email.length > 0 &&
        email.length <= 254 &&
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    );
}

/* ============================================================
   ROLE NORMALIZATION
============================================================ */

function normalizeRole(role) {

    if (
        AUTH &&
        typeof AUTH.normalizeRole === "function"
    ) {
        try {
            const normalized =
                AUTH.normalizeRole(role);

            if (normalized) {
                return String(normalized)
                    .trim()
                    .toLowerCase();
            }
        } catch (error) {
            console.warn(
                "RiderX role normalization fallback:",
                error
            );
        }
    }

    const value =
        String(role || "")
            .trim()
            .toLowerCase()
            .replace(/[\s-]+/g, "_");

    if (
        [
            "rider",
            "driver",
            "partner",
            "driver_partner",
            "driverpartner",
            "captain"
        ].includes(value)
    ) {
        return "rider";
    }

    if (
        [
            "customer",
            "customers",
            "user",
            "users",
            "passenger",
            "client"
        ].includes(value)
    ) {
        return "customer";
    }

    if (value === "admin") {
        return "admin";
    }

    return "";
}

/* ============================================================
   ERROR MESSAGE
============================================================ */

function getErrorMessage(error) {

    if (
        AUTH &&
        typeof AUTH.getErrorMessage === "function"
    ) {
        try {
            const engineMessage =
                String(
                    AUTH.getErrorMessage(error) || ""
                ).trim();

            if (engineMessage) {
                return engineMessage;
            }
        } catch (formatterError) {
            console.warn(
                "RiderX auth error formatter failed:",
                formatterError
            );
        }
    }

    const code =
        String(error?.code || "")
            .trim()
            .toLowerCase();

    const messages = {
        "auth/invalid-credential":
            "Invalid email or password.",

        "auth/invalid-login-credentials":
            "Invalid email or password.",

        "auth/wrong-password":
            "Invalid email or password.",

        "auth/user-not-found":
            "No RiderX account was found with this email.",

        "auth/invalid-email":
            "Please enter a valid email address.",

        "auth/too-many-requests":
            "Too many attempts. Please wait and try again.",

        "auth/network-request-failed":
            "Network error. Check your internet connection.",

        "auth/user-disabled":
            "This Firebase account has been disabled.",

        "auth/popup-closed-by-user":
            "Google login was cancelled.",

        "auth/popup-blocked":
            "The browser blocked the Google login popup.",

        "auth/operation-not-allowed":
            "This login method is not enabled in Firebase.",

        "auth/app-not-authorized":
            "This RiderX domain is not authorized in Firebase.",

        "auth/invalid-api-key":
            "RiderX Firebase configuration is invalid.",

        "permission-denied":
            "You do not have permission to access this RiderX account."
    };

    if (messages[code]) {
        return messages[code];
    }

    const rawMessage =
        String(error?.message || "").trim();

    if (rawMessage) {
        return rawMessage;
    }

    return (
        "Unable to complete Rider login. Please try again."
    );
}

/* ============================================================
   PROFILE VALUE HELPERS
============================================================ */

function firstValue(...values) {

    for (const value of values) {

        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {
            return value;
        }
    }

    return "";
}

/* ============================================================
   CLEAR AUTH SESSION
============================================================ */

async function clearInvalidSession() {

    try {

        if (
            AUTH &&
            typeof AUTH.logout === "function"
        ) {
            await AUTH.logout();
        }

    } catch (error) {

        console.warn(
            "RiderX auth logout warning:",
            error
        );
    }

    try {

        if (
            Firebase?.auth &&
            typeof Firebase.signOut === "function"
        ) {
            await Firebase.signOut(
                Firebase.auth
            );
        }

    } catch (error) {

        console.warn(
            "Firebase sign-out warning:",
            error
        );
    }

    removeStorage(STORAGE_KEYS.user);
    removeStorage(STORAGE_KEYS.rider);
    removeStorage(STORAGE_KEYS.session);
    removeStorage(STORAGE_KEYS.role);
    removeStorage(STORAGE_KEYS.userRole);

    /*
     * Keep selectedRole = rider because this page is explicitly
     * the Rider login page.
     */
    setStorage(
        STORAGE_KEYS.selectedRole,
        "rider"
    );
}

/* ============================================================
   LOAD PROFILE FROM FIRESTORE
   ------------------------------------------------------------
   users/{uid} is the canonical account profile.

   riders/{uid} is optional and is merged when available.
============================================================ */

async function loadRiderProfile(uid) {

    if (!uid) {
        throw new Error(
            "Rider account ID is missing."
        );
    }

    const FB = await getFirebase();

    if (
        !FB.db ||
        typeof FB.doc !== "function" ||
        typeof FB.getDoc !== "function"
    ) {
        throw new Error(
            "RiderX Firestore profile service is unavailable."
        );
    }

    let userData = null;
    let riderData = null;

    /* --------------------------------------------------------
       users/{uid}
    -------------------------------------------------------- */

    try {

        const userRef =
            FB.doc(
                FB.db,
                "users",
                uid
            );

        const snapshot =
            await FB.getDoc(userRef);

        if (snapshot.exists()) {
            userData =
                snapshot.data() || {};
        }

    } catch (error) {

        console.warn(
            "RiderX users profile lookup failed:",
            error
        );
    }

    /* --------------------------------------------------------
       riders/{uid}

       This collection is OPTIONAL.

       A rider may initially exist only in users/{uid}
       while waiting for admin approval.
    -------------------------------------------------------- */

    try {

        const riderRef =
            FB.doc(
                FB.db,
                "riders",
                uid
            );

        const snapshot =
            await FB.getDoc(riderRef);

        if (snapshot.exists()) {
            riderData =
                snapshot.data() || {};
        }

    } catch (error) {

        /*
         * Do NOT fail login simply because riders/{uid}
         * is missing or temporarily inaccessible.
         *
         * users/{uid} remains sufficient for role/status
         * resolution.
         */
        console.warn(
            "RiderX optional rider profile lookup failed:",
            error
        );
    }

    if (!userData && !riderData) {

        throw new Error(
            "Rider profile was not found. Please complete Rider registration first."
        );
    }

    const merged = {
        ...(userData || {}),
        ...(riderData || {})
    };

    const role =
        normalizeRole(
            firstValue(
                riderData?.role,
                riderData?.userRole,
                riderData?.accountType,
                userData?.role,
                userData?.userRole,
                userData?.accountType
            )
        );

    if (role === "customer") {

        throw new Error(
            "This account is registered as a Customer, not a Rider."
        );
    }

    if (role === "admin") {

        throw new Error(
            "This account is registered as an Admin, not a Rider."
        );
    }

    if (role !== "rider") {

        throw new Error(
            "Rider role is not configured for this account. Please complete Rider registration."
        );
    }

    const status =
        String(
            firstValue(
                riderData?.status,
                riderData?.approvalStatus,
                riderData?.accountStatus,
                userData?.status,
                userData?.approvalStatus,
                userData?.accountStatus,
                "active"
            )
        )
            .trim()
            .toLowerCase()
            .replace(/[\s-]+/g, "_");

    if (
        [
            "blocked",
            "disabled",
            "suspended",
            "banned"
        ].includes(status)
    ) {

        throw new Error(
            "Your RiderX rider account is disabled or suspended."
        );
    }

    if (
        [
            "rejected",
            "declined"
        ].includes(status)
    ) {

        window.location.replace(
            ROUTES.riderRejected
        );

        return null;
    }

    if (
        [
            "pending",
            "pending_approval",
            "under_review",
            "verification_pending",
            "awaiting_approval"
        ].includes(status)
    ) {

        window.location.replace(
            ROUTES.riderPending
        );

        return null;
    }

    return {
        ...merged,

        uid,

        role: "rider",
        userRole: "rider",
        accountType: "rider",

        status
    };
}

/* ============================================================
   RESOLVE FIREBASE USER
============================================================ */

async function resolveFirebaseUser(result) {

    const directUser =
        result?.firebaseUser ||
        result?.user ||
        null;

    if (directUser?.uid) {
        return directUser;
    }

    try {

        const FB = await getFirebase();

        if (
            FB.auth?.currentUser?.uid
        ) {
            return FB.auth.currentUser;
        }

    } catch (error) {

        console.warn(
            "RiderX current Firebase user lookup failed:",
            error
        );
    }

    return null;
}

/* ============================================================
   RESOLVE PROFILE
============================================================ */

async function resolveProfile(
    result,
    firebaseUser
) {

    if (result?.profile) {
        return result.profile;
    }

    if (
        AUTH &&
        typeof AUTH.getProfile === "function"
    ) {

        try {

            const profile =
                await AUTH.getProfile(
                    firebaseUser
                );

            if (profile) {
                return profile;
            }

        } catch (error) {

            console.warn(
                "RiderX auth profile lookup failed:",
                error
            );
        }
    }

    return {
        uid: firebaseUser.uid,
        email: firebaseUser.email || "",
        displayName:
            firebaseUser.displayName || "",
        phoneNumber:
            firebaseUser.phoneNumber || ""
    };
}

/* ============================================================
   COMPLETE RIDER LOGIN
============================================================ */

async function completeRiderLogin(result) {

    const firebaseUser =
        await resolveFirebaseUser(result);

    if (
        !firebaseUser ||
        !firebaseUser.uid
    ) {

        throw new Error(
            "Firebase Rider account could not be identified."
        );
    }

    const profile =
        await resolveProfile(
            result,
            firebaseUser
        );

    const uid =
        firebaseUser.uid ||
        profile?.uid ||
        profile?.id ||
        profile?.userId;

    if (!uid) {

        throw new Error(
            "Rider account ID is missing."
        );
    }

    /*
     * IMPORTANT:
     *
     * Do NOT trust result.role alone.
     *
     * loginEmail() may return the Firebase user before
     * the Firestore role has been resolved.
     *
     * The canonical role verification happens here.
     */
    const rider =
        await loadRiderProfile(uid);

    if (!rider) {
        return;
    }

    const finalRider = {
        ...profile,
        ...rider,

        uid,

        email:
            firstValue(
                rider.email,
                profile?.email,
                firebaseUser.email
            ),

        role: "rider",
        userRole: "rider",
        accountType: "rider"
    };

    /*
     * Save canonical session only after:
     *
     * 1. Firebase authentication succeeded
     * 2. Firestore profile exists
     * 3. Account role is rider
     * 4. Account is not blocked/rejected/pending
     */
    if (
        AUTH &&
        typeof AUTH.saveSession === "function"
    ) {

        AUTH.saveSession(
            finalRider,
            "rider"
        );
    }

    if (AUTH?.state) {

        AUTH.state.firebaseUser =
            firebaseUser;

        AUTH.state.user =
            finalRider;

        AUTH.state.role =
            "rider";
    }

    setRiderRole();

    showStatus(
        "Login successful. Opening RiderX...",
        "success"
    );

    redirecting = true;

    setLoading(
        true,
        "Opening RiderX Rider..."
    );

    window.setTimeout(
        () => {
            window.location.replace(
                ROUTES.riderHome
            );
        },
        250
    );
}

/* ============================================================
   EMAIL LOGIN
============================================================ */

loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        if (
            processing ||
            redirecting
        ) {
            return;
        }

        clearStatus();

        const email =
            String(
                emailInput.value || ""
            )
                .trim()
                .toLowerCase();

        const password =
            String(
                passwordInput.value || ""
            );

        if (!validEmail(email)) {

            showStatus(
                "Please enter a valid email address.",
                "error"
            );

            emailInput.focus();

            return;
        }

        if (!password) {

            showStatus(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;
        }

        if (
            password.length < 6
        ) {

            showStatus(
                "Password must contain at least 6 characters.",
                "error"
            );

            passwordInput.focus();

            return;
        }

        processing = true;

        setRiderRole();

        try {

            setLoading(
                true,
                "Signing in as Rider..."
            );

            const authEngine =
                await getAuthEngine();

            if (
                typeof authEngine.loginEmail !==
                "function"
            ) {

                throw new Error(
                    "RiderX email login service is unavailable."
                );
            }

            const result =
                await authEngine.loginEmail(
                    email,
                    password
                );

            /*
             * Do NOT reject based only on result.role.
             * completeRiderLogin() performs the authoritative
             * rider profile/role verification.
             */
            await completeRiderLogin(
                result
            );

        } catch (error) {

            console.error(
                "RiderX Rider email login failed:",
                error
            );

            if (!redirecting) {

                setLoading(
                    false
                );

                showStatus(
                    getErrorMessage(error),
                    "error"
                );
            }

        } finally {

            processing = false;
        }
    }
);

/* ============================================================
   GOOGLE LOGIN
============================================================ */

googleLogin.addEventListener(
    "click",
    async () => {

        if (
            processing ||
            redirecting
        ) {
            return;
        }

        processing = true;

        setRiderRole();

        clearStatus();

        try {

            setLoading(
                true,
                "Connecting with Google..."
            );

            const FB =
                await getFirebase();

            if (
                !FB.googleProvider ||
                typeof FB.signInWithPopup !==
                "function"
            ) {

                throw new Error(
                    "Google login is not configured in Firebase."
                );
            }

            const result =
                await FB.signInWithPopup(
                    FB.auth,
                    FB.googleProvider
                );

            const firebaseUser =
                result?.user;

            if (
                !firebaseUser?.uid
            ) {

                throw new Error(
                    "Google account could not be identified."
                );
            }

            /*
             * completeRiderLogin() performs the canonical
             * Firestore role/profile verification.
             */
            await completeRiderLogin({
                firebaseUser,
                user: firebaseUser
            });

        } catch (error) {

            console.error(
                "RiderX Google login failed:",
                error
            );

            if (!redirecting) {

                /*
                 * Google popup may have already authenticated
                 * the user. Clear it when the account is not a
                 * valid Rider account.
                 */
                try {

                    const FB =
                        Firebase ||
                        await getFirebase();

                    if (
                        FB.auth &&
                        typeof FB.signOut ===
                        "function"
                    ) {
                        await FB.signOut(
                            FB.auth
                        );
                    }

                } catch (signOutError) {

                    console.warn(
                        "RiderX Google cleanup failed:",
                        signOutError
                    );
                }

                setLoading(
                    false
                );

                showStatus(
                    getErrorMessage(error),
                    "error"
                );
            }

        } finally {

            processing = false;
        }
    }
);

/* ============================================================
   OTP LOGIN
============================================================ */

otpLogin.addEventListener(
    "click",
    () => {

        if (
            processing ||
            redirecting
        ) {
            return;
        }

/* ============================================================
   FORGOT PASSWORD
============================================================ */

forgotPassword.addEventListener(
    "click",
    async () => {

        if (
            processing ||
            redirecting
        ) {
            return;
        }

        clearStatus();

        const email =
            String(
                emailInput.value || ""
            )
                .trim()
                .toLowerCase();

        if (!validEmail(email)) {

            showStatus(
                "Enter a valid email address first.",
                "error"
            );

            emailInput.focus();

            return;
        }

        processing = true;

        try {

            setLoading(
                true,
                "Sending password reset..."
            );

            const authEngine =
                await getAuthEngine();

            if (
                typeof authEngine.resetPassword !==
                "function"
            ) {

                throw new Error(
                    "Password reset service is unavailable."
                );
            }

            await authEngine.resetPassword(
                email
            );

            setLoading(
                false
            );

            showStatus(
                "Password reset email sent. Check your inbox.",
                "success"
            );

        } catch (error) {

            console.error(
                "RiderX password reset failed:",
                error
            );

            setLoading(
                false
            );

            showStatus(
                getErrorMessage(error),
                "error"
            );

        } finally {

            processing = false;
        }
    }
);

/* ============================================================
   PASSWORD VISIBILITY
============================================================ */

showPassword.addEventListener(
    "click",
    () => {

        if (processing) {
            return;
        }

        const shouldShow =
            passwordInput.type ===
            "password";

        passwordInput.type =
            shouldShow
                ? "text"
                : "password";

        showPassword.textContent =
            shouldShow
                ? "HIDE"
                : "SHOW";

        showPassword.setAttribute(
            "aria-label",
            shouldShow
                ? "Hide password"
                : "Show password"
        );

        showPassword.setAttribute(
            "aria-pressed",
            String(shouldShow)
        );
    }
);

/* ============================================================
   INPUT NORMALIZATION
============================================================ */

emailInput.addEventListener(
    "input",
    () => {

        emailInput.value =
            emailInput.value
                .replace(/\s/g, "")
                .slice(0, 254);
    }
);

emailInput.addEventListener(
    "blur",
    () => {

        emailInput.value =
            emailInput.value
                .trim()
                .toLowerCase();
    }
);

/* ============================================================
   REGISTER
============================================================ */

registerButton.addEventListener(
    "click",
    () => {

        if (
            processing ||
            redirecting
        ) {
            return;
        }

        setRiderRole();

        window.location.href =
            ROUTES.register;
    }
);

/* ============================================================
   BACK TO ACCOUNT TYPE
============================================================ */

backButton.addEventListener(
    "click",
    () => {

        if (
            processing ||
            redirecting
        ) {
            return;
        }

        removeStorage(
            STORAGE_KEYS.selectedRole
        );

        window.location.href =
            ROUTES.login;
    }
);

/* ============================================================
   EXISTING SESSION CHECK
============================================================ */

async function checkExistingRiderSession() {

    if (
        processing ||
        redirecting
    ) {
        return;
    }

    try {

        const authEngine =
            await getAuthEngine();

        if (
            typeof authEngine.isLoggedIn !==
            "function"
        ) {
            return;
        }

        if (
            !authEngine.isLoggedIn()
        ) {
            return;
        }

        let currentUser = null;

        if (
            typeof authEngine.getUser ===
            "function"
        ) {

            currentUser =
                authEngine.getUser();
        }

        if (!currentUser) {

            try {

                const FB =
                    await getFirebase();

                currentUser =
                    FB.auth?.currentUser ||
                    null;

            } catch (error) {

                console.warn(
                    "RiderX existing Firebase user lookup:",
                    error
                );
            }
        }

        if (
            !currentUser?.uid
        ) {
            return;
        }

        /*
         * Never trust only localStorage role.
         * Re-check Firestore profile.
         */
        const rider =
            await loadRiderProfile(
                currentUser.uid
            );

        if (!rider) {
            return;
        }

        const finalRider = {
            ...currentUser,
            ...rider,

            uid:
                currentUser.uid,

            role: "rider",
            userRole: "rider",
            accountType: "rider"
        };

        if (
            typeof authEngine.saveSession ===
            "function"
        ) {

            authEngine.saveSession(
                finalRider,
                "rider"
            );
        }

        setRiderRole();

        redirecting = true;

        window.location.replace(
            ROUTES.riderHome
        );

    } catch (error) {

        /*
         * A stale/invalid session must never make the login
         * page unusable.
         *
         * Pending/rejected/blocked routes are handled by
         * loadRiderProfile().
         */
        console.warn(
            "RiderX existing rider session check:",
            error
        );
    }
}

/* ============================================================
   INITIALIZATION
============================================================ */

function init() {

    if (initialized) {
        return;
    }

    initialized = true;

    setRiderRole();

    /*
     * Do not immediately redirect.
     * Give the page a short moment to render and remain usable.
     */
    window.setTimeout(
        () => {
            checkExistingRiderSession();
        },
        250
    );

    window.RiderXRiderLogin = Object.freeze({
        getAuthEngine,
        getFirebase,
        showStatus,
        clearStatus,
        setRiderRole,
        normalizeRole
    });
}

init();
