<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX - Rider Login</title>

<style>
:root{
  --yellow:#ffe500;
  --black:#050505;
  --card:#111;
  --border:#292929;
  --gray:#999;
  --red:#ff5555;
  --green:#20d66b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:var(--black);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:410px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:28px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:900;
  margin-bottom:5px;
}

.logo span{
  color:var(--yellow);
}

.subtitle{
  text-align:center;
  color:var(--gray);
  font-size:14px;
  margin-bottom:28px;
}

label{
  display:block;
  color:#ccc;
  font-size:14px;
  margin-bottom:7px;
}

.input-box{
  position:relative;
  margin-bottom:17px;
}

input{
  width:100%;
  height:52px;
  padding:0 14px;
  background:#050505;
  border:1px solid #333;
  border-radius:12px;
  color:#fff;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:var(--yellow);
}

.password-toggle{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:#aaa;
  cursor:pointer;
  font-size:14px;
}

.login-btn{
  width:100%;
  height:54px;
  border:0;
  border-radius:12px;
  background:var(--yellow);
  color:#000;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:4px;
}

.login-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.register-btn{
  width:100%;
  height:50px;
  margin-top:12px;
  border-radius:12px;
  background:#171717;
  border:1px solid #333;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.register-btn:hover{
  border-color:var(--yellow);
}

.loading{
  display:none;
  text-align:center;
  color:var(--yellow);
  font-size:14px;
  margin-top:16px;
}

.message{
  min-height:22px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
  margin-top:15px;
}

.message.error{
  color:#ff7777;
}

.message.success{
  color:var(--green);
}

.note{
  text-align:center;
  color:#666;
  font-size:11px;
  line-height:1.5;
  margin-top:20px;
}

.back{
  display:block;
  text-align:center;
  color:#888;
  text-decoration:none;
  font-size:13px;
  margin-top:18px;
}

.back:hover{
  color:var(--yellow);
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    RID<span>ERX</span>
  </div>

  <div class="subtitle">
    Rider Login
  </div>

  <label for="email">Email</label>

  <div class="input-box">
    <input
      type="email"
      id="email"
      placeholder="Enter your registered email"
      autocomplete="username"
    >
  </div>

  <label for="password">Password</label>

  <div class="input-box">
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <span
      id="togglePassword"
      class="password-toggle">
      Show
    </span>
  </div>

  <button
    id="loginBtn"
    class="login-btn"
    type="button">
    Rider Login
  </button>

  <button
    id="registerBtn"
    class="register-btn"
    type="button">
    New Rider? Register
  </button>

  <div
    id="loading"
    class="loading">
    Signing in...
  </div>

  <div
    id="message"
    class="message">
  </div>

  <div class="note">
    Your rider account must be approved by RiderX Admin before you can go online.
  </div>

  <a
    href="../index.html"
    class="back">
    ← Back to RiderX
  </a>

</div>


<script type="module">

import {
  auth,
  db
} from "../firebase/firebase-config.js";

import {
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const registerBtn =
  document.getElementById("registerBtn");

const loading =
  document.getElementById("loading");

const message =
  document.getElementById("message");

const togglePassword =
  document.getElementById("togglePassword");


function setMessage(text,type=""){

  message.textContent = text;

  message.className =
    "message " + type;

}


function setLoading(active,text="Signing in..."){

  if(active){

    loading.style.display = "block";

    loading.textContent = text;

    loginBtn.disabled = true;

    registerBtn.disabled = true;

  }else{

    loading.style.display = "none";

    loginBtn.disabled = false;

    registerBtn.disabled = false;

  }

}


function roleOf(data){

  return String(
    data?.role ??
    data?.userType ??
    data?.type ??
    ""
  )
  .trim()
  .toLowerCase();

}


function getApprovalStatus(data){

  return String(
    data?.approvalStatus ??
    data?.riderStatus ??
    data?.status ??
    data?.verificationStatus ??
    ""
  )
  .trim()
  .toLowerCase();

}


function isApproved(data){

  const status =
    getApprovalStatus(data);

  return (
    data?.approved === true ||
    data?.isApproved === true ||
    [
      "approved",
      "active",
      "verified"
    ].includes(status)
  );

}


function isRejected(data){

  const status =
    getApprovalStatus(data);

  return [
    "rejected",
    "declined",
    "blocked"
  ].includes(status);

}


async function getRiderProfile(uid){

  /*
    First check users/{uid}
  */

  try{

    const userRef =
      doc(db,"users",uid);

    const userSnap =
      await getDoc(userRef);

    if(userSnap.exists()){

      const data =
        userSnap.data();

      if(
        roleOf(data) === "rider" ||
        data.rider === true ||
        data.userType === "rider"
      ){

        return {
          ...data,
          _collection:"users",
          _id:uid
        };

      }

    }

  }catch(error){

    console.warn(
      "users profile check failed:",
      error
    );

  }


  /*
    Then check riders/{uid}
  */

  try{

    const riderRef =
      doc(db,"riders",uid);

    const riderSnap =
      await getDoc(riderRef);

    if(riderSnap.exists()){

      return {
        ...riderSnap.data(),
        _collection:"riders",
        _id:uid
      };

    }

  }catch(error){

    console.warn(
      "riders profile check failed:",
      error
    );

  }


  return null;

}


async function loginRider(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if(!email){

    setMessage(
      "❌ Please enter your email.",
      "error"
    );

    emailInput.focus();

    return;

  }


  if(!password){

    setMessage(
      "❌ Please enter your password.",
      "error"
    );

    passwordInput.focus();

    return;

  }


  setMessage("");

  setLoading(
    true,
    "Signing in..."
  );


  try{

    /*
      Firebase Authentication login
    */

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user =
      result.user;


    setLoading(
      true,
      "Checking rider account..."
    );


    /*
      Get rider profile
    */

    const rider =
      await getRiderProfile(
        user.uid
      );


    if(!rider){

      await signOut(auth);

      setLoading(false);

      setMessage(
        "❌ Rider profile not found. Please register as a rider first.",
        "error"
      );

      return;

    }


    /*
      Make sure this is a rider
    */

    if(
      roleOf(rider) &&
      roleOf(rider) !== "rider"
    ){

      await signOut(auth);

      setLoading(false);

      setMessage(
        "❌ This account is not registered as a rider.",
        "error"
      );

      return;

    }


    /*
      REJECTED ACCOUNT
    */

    if(isRejected(rider)){

      await signOut(auth);

      setLoading(false);

      setMessage(
        "❌ Your rider registration was rejected by Admin.",
        "error"
      );

      return;

    }


    /*
      PENDING ACCOUNT
    */

    if(!isApproved(rider)){

      await signOut(auth);

      setLoading(false);

      setMessage(
        "⏳ Your rider registration is pending Admin approval. You cannot go online yet.",
        "error"
      );

      return;

    }


    /*
      APPROVED
    */

    setMessage(
      "✅ Login successful. Opening rider dashboard...",
      "success"
    );


    setLoading(
      true,
      "Opening Rider Dashboard..."
    );


    /*
      IMPORTANT:
      Change ONLY this path if your actual rider
      home file has a different name.
    */

    window.location.replace(
      "../rider/Home.html"
    );


  }catch(error){

    console.error(
      "Rider login error:",
      error
    );


    let text =
      "❌ Login failed.";


    switch(error.code){

      case "auth/invalid-credential":

        text =
          "❌ Email or password is incorrect.";

        break;


      case "auth/user-not-found":

        text =
          "❌ Rider account not found.";

        break;


      case "auth/wrong-password":

        text =
          "❌ Wrong password.";

        break;


      case "auth/invalid-email":

        text =
          "❌ Invalid email address.";

        break;


      case "auth/user-disabled":

        text =
          "❌ This account has been disabled.";

        break;


      case "auth/too-many-requests":

        text =
          "❌ Too many login attempts. Please try again later.";

        break;


      case "auth/network-request-failed":

        text =
          "❌ Network error. Check your internet connection.";

        break;


      default:

        if(
          error.message &&
          error.message.includes(
            "Missing or insufficient permissions"
          )
        ){

          text =
            "❌ Firestore permission denied.";

        }else{

          text =
            "❌ " +
            (
              error.message ||
              "Unable to login."
            );

        }

    }


    setLoading(false);

    setMessage(
      text,
      "error"
    );

  }

}


/*
  Login button
*/

loginBtn.addEventListener(
  "click",
  loginRider
);


/*
  Register button

  IMPORTANT:
  If your registration file has a different name,
  only this path needs changing.
*/

registerBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "rider-register.html";

  }
);


/*
  Enter key
*/

emailInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      loginRider();

    }

  }
);


passwordInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      loginRider();

    }

  }
);


/*
  Show / Hide password
*/

togglePassword.addEventListener(
  "click",
  () => {

    if(
      passwordInput.type === "password"
    ){

      passwordInput.type =
        "text";

      togglePassword.textContent =
        "Hide";

    }else{

      passwordInput.type =
        "password";

      togglePassword.textContent =
        "Show";

    }

  }
);

</script>

</body>
</html>
