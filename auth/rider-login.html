<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#FFD400"
>

<meta
    name="description"
    content="RiderX Rider Login"
>

<title>RiderX - Rider Login</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<link
    rel="stylesheet"
    href="../css/auth.css"
>

<link
    rel="stylesheet"
    href="../css/responsive.css"
>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    margin:0;
}

body{
    min-height:100vh;
    min-height:100dvh;

    background:#070707;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   PAGE
========================================================= */

.auth-page{

    min-height:100vh;
    min-height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));

    position:relative;

    overflow:auto;
}


.auth-page::before{

    content:"";

    position:absolute;

    width:350px;
    height:350px;

    top:-175px;
    right:-135px;

    border-radius:50%;

    background:
        rgba(255,212,0,.08);

    pointer-events:none;
}


.auth-page::after{

    content:"";

    position:absolute;

    width:310px;
    height:310px;

    bottom:-180px;
    left:-140px;

    border-radius:50%;

    background:
        rgba(255,212,0,.05);

    pointer-events:none;
}


/* =========================================================
   CARD
========================================================= */

.auth-card{

    position:relative;
    z-index:2;

    width:100%;
    max-width:420px;

    padding:28px 22px 22px;

    border:1px solid #2a2a2a;

    border-radius:22px;

    background:#111;

    box-shadow:
        0 20px 70px rgba(0,0,0,.55);
}


/* =========================================================
   BRAND
========================================================= */

.brand{

    text-align:center;

    margin-bottom:24px;
}


.logo-box{

    width:68px;
    height:68px;

    margin:
        0 auto 13px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:19px;

    background:#FFD400;

    color:#080808;

    font-size:25px;

    font-weight:1000;

    box-shadow:
        0 8px 30px
        rgba(255,212,0,.14);
}


.brand h1{

    margin:0;

    font-size:25px;

    font-weight:1000;

    letter-spacing:-.4px;
}


.brand h1 span{

    color:#FFD400;
}


.brand p{

    margin:7px 0 0;

    color:#777;

    font-size:11px;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome{

    margin-bottom:18px;
}


.welcome h2{

    margin:0;

    font-size:18px;

    font-weight:900;
}


.welcome p{

    margin:6px 0 0;

    color:#777;

    font-size:10px;

    line-height:1.5;
}


/* =========================================================
   MESSAGES
========================================================= */

.message{

    display:none;

    margin-bottom:13px;

    padding:10px;

    border-radius:9px;

    font-size:10px;

    line-height:1.5;
}


.message.show{

    display:block;
}


.error{

    border:1px solid #542828;

    background:#241414;

    color:#ff7777;
}


.success{

    border:1px solid #275335;

    background:#132319;

    color:#65e58b;
}


/* =========================================================
   FORM
========================================================= */

.form-group{

    margin-bottom:14px;
}


.form-group label{

    display:block;

    margin-bottom:7px;

    color:#999;

    font-size:9px;

    font-weight:900;

    text-transform:uppercase;
}


/* =========================================================
   PHONE
========================================================= */

.phone-row{

    display:flex;

    gap:8px;
}


.country-code{

    width:82px;

    min-width:82px;

    height:48px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:1px solid #333;

    border-radius:10px;

    background:#1a1a1a;

    color:#FFD400;

    font-size:11px;

    font-weight:900;
}


.form-group input{

    width:100%;

    height:48px;

    padding:
        0 13px;

    border:1px solid #333;

    border-radius:10px;

    outline:none;

    background:#1a1a1a;

    color:#fff;

    font-size:12px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}


.phone-row input{

    flex:1;

    min-width:0;
}


.form-group input::placeholder{

    color:#555;
}


.form-group input:focus{

    border-color:#FFD400;

    box-shadow:
        0 0 0 2px
        rgba(255,212,0,.08);
}


/* =========================================================
   PASSWORD
========================================================= */

.password-row{

    position:relative;
}


.password-row input{

    padding-right:45px;
}


.eye-btn{

    position:absolute;

    right:7px;

    top:50%;

    width:35px;

    height:35px;

    transform:
        translateY(-50%);

    border:0;

    border-radius:7px;

    background:transparent;

    color:#777;

    cursor:pointer;
}


.eye-btn:hover{

    color:#FFD400;
}


/* =========================================================
   OPTIONS
========================================================= */

.options{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin:
        2px 0 17px;
}


.remember{

    display:flex;

    align-items:center;

    gap:7px;

    color:#777;

    font-size:9px;

    cursor:pointer;
}


.remember input{

    width:14px;
    height:14px;

    accent-color:#FFD400;
}


.link-btn{

    padding:0;

    border:0;

    background:none;

    color:#FFD400;

    cursor:pointer;

    font-size:9px;

    font-weight:800;
}


/* =========================================================
   LOGIN BUTTON
========================================================= */

.login-btn{

    width:100%;

    min-height:49px;

    border:0;

    border-radius:10px;

    background:#FFD400;

    color:#111;

    cursor:pointer;

    font-size:12px;

    font-weight:1000;

    transition:
        transform .2s ease,
        background .2s ease,
        opacity .2s ease;
}


.login-btn:hover{

    background:#ffe04a;

    transform:
        translateY(-1px);
}


.login-btn:active{

    transform:
        scale(.99);
}


.login-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}


/* =========================================================
   DIVIDER
========================================================= */

.divider{

    display:flex;

    align-items:center;

    gap:10px;

    margin:19px 0;

    color:#555;

    font-size:9px;
}


.divider::before,
.divider::after{

    content:"";

    flex:1;

    height:1px;

    background:#292929;
}


/* =========================================================
   OTP
========================================================= */

.otp-btn{

    width:100%;

    min-height:45px;

    border:1px solid #333;

    border-radius:10px;

    background:#191919;

    color:#ddd;

    cursor:pointer;

    font-size:10px;

    font-weight:900;

    transition:
        border-color .2s ease,
        color .2s ease;
}


.otp-btn:hover{

    border-color:#FFD400;

    color:#FFD400;
}


/* =========================================================
   REGISTER
========================================================= */

.register{

    margin-top:20px;

    text-align:center;

    color:#777;

    font-size:10px;
}


.register a{

    color:#FFD400;

    text-decoration:none;

    font-weight:900;
}


.register a:hover{

    text-decoration:underline;
}


/* =========================================================
   BACK
========================================================= */

.back-role{

    display:block;

    width:100%;

    margin-top:11px;

    border:0;

    background:transparent;

    color:#666;

    cursor:pointer;

    font-size:9px;
}


.back-role:hover{

    color:#FFD400;
}


/* =========================================================
   LOADER
========================================================= */

.loader{

    display:inline-block;

    width:13px;
    height:13px;

    margin-right:7px;

    vertical-align:-2px;

    border:2px solid
        rgba(0,0,0,.25);

    border-top-color:#111;

    border-radius:50%;

    animation:
        spin .7s linear infinite;
}


@keyframes spin{

    to{

        transform:
            rotate(360deg);

    }

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:20px;

    text-align:center;

    color:#444;

    font-size:8px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:480px){

    .auth-page{

        align-items:flex-start;

        padding-top:18px;

        padding-bottom:18px;
    }


    .auth-card{

        padding:
            24px 17px
            18px;

        border-radius:18px;
    }

}


@media(max-width:340px){

    .auth-card{

        padding-left:13px;

        padding-right:13px;
    }


    .country-code{

        width:70px;

        min-width:70px;
    }


    .options{

        align-items:flex-start;

        flex-direction:column;
    }

}

</style>

</head>


<body>


<main class="auth-page">


<section class="auth-card">


<div class="brand">

    <div class="logo-box">
        RX
    </div>


    <h1>
        Rider<span>X</span>
    </h1>


    <p>
        Ride smarter. Earn with RiderX.
    </p>

</div>


<div class="welcome">

    <h2>
        Rider Login
    </h2>


    <p>
        Login to go online, accept rides and manage your earnings.
    </p>

</div>


<div
    class="message error"
    id="errorBox"
    role="alert"
    aria-live="polite"
></div>


<div
    class="message success"
    id="successBox"
    role="status"
    aria-live="polite"
></div>


<form
    id="loginForm"
    novalidate
>


<div class="form-group">

    <label for="phone">
        Mobile Number
    </label>


    <div class="phone-row">


        <div class="country-code">
            +91
        </div>


        <input
            type="tel"
            id="phone"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="10"
            placeholder="Enter mobile number"
            required
        >


    </div>

</div>


<div class="form-group">

    <label for="password">
        Password
    </label>


    <div class="password-row">


        <input
            type="password"
            id="password"
            autocomplete="current-password"
            placeholder="Enter password"
            minlength="6"
            required
        >


        <button
            type="button"
            class="eye-btn"
            id="togglePassword"
            aria-label="Show password"
        >
            👁
        </button>


    </div>

</div>


<div class="options">


<label class="remember">

    <input
        type="checkbox"
        id="remember"
    >

    Remember me

</label>


<button
    type="button"
    class="link-btn"
    id="forgotBtn"
>
    Forgot password?
</button>


</div>


<button
    type="submit"
    class="login-btn"
    id="loginBtn"
>
    Login
</button>


</form>


<div class="divider">
    OR
</div>


<button
    type="button"
    class="otp-btn"
    id="otpBtn"
>
    Login with OTP
</button>


<div class="register">

    Don't have a rider account?

    <a href="./register.html">
        Create rider account
    </a>

</div>


<button
    type="button"
    class="back-role"
    id="roleBtn"
>
    ← Choose another login type
</button>


<div class="footer">
    © 2026 RiderX • Rider Portal
</div>


</section>


</main>


<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const form =
    document.getElementById(
        "loginForm"
    );


const phone =
    document.getElementById(
        "phone"
    );


const password =
    document.getElementById(
        "password"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const successBox =
    document.getElementById(
        "successBox"
    );


const remember =
    document.getElementById(
        "remember"
    );


const togglePassword =
    document.getElementById(
        "togglePassword"
    );


const otpBtn =
    document.getElementById(
        "otpBtn"
    );


const forgotBtn =
    document.getElementById(
        "forgotBtn"
    );


const roleBtn =
    document.getElementById(
        "roleBtn"
    );


/* =========================================================
   ROLE
========================================================= */

localStorage.setItem(
    "riderx_selected_role",
    "rider"
);


/* =========================================================
   PHONE INPUT
========================================================= */

phone.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    10
                );

    }
);


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

togglePassword.addEventListener(
    "click",
    function(){

        const shouldShow =
            password.type ===
            "password";


        password.type =
            shouldShow
                ? "text"
                : "password";


        this.textContent =
            shouldShow
                ? "🙈"
                : "👁";


        this.setAttribute(
            "aria-label",
            shouldShow
                ? "Hide password"
                : "Show password"
        );

    }
);


/* =========================================================
   LOGIN
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessages();


        const mobile =
            normalizePhone(
                phone.value
            );


        const pass =
            String(
                password.value || ""
            );


        /* -----------------------------------------
           VALIDATION
        ----------------------------------------- */

        if(
            !/^[6-9]\d{9}$/.test(
                mobile
            )
        ){

            showError(
                "Please enter a valid 10-digit Indian mobile number."
            );


            phone.focus();

            return;

        }


        if(
            pass.length < 6
        ){

            showError(
                "Password must contain at least 6 characters."
            );


            password.focus();

            return;

        }


        setLoading(
            true
        );


        try{


            const users =
                getUsers();


            const user =
                users.find(
                    function(item){

                        if(
                            !item ||
                            typeof item !==
                            "object"
                        ){

                            return false;

                        }


                        const itemPhone =
                            normalizePhone(
                                item.phone ||
                                item.mobile ||
                                item.phoneNumber
                            );


                        const itemPassword =
                            String(
                                item.password ||
                                ""
                            );


                        const role =
                            String(
                                item.role ||
                                ""
                            )
                            .trim()
                            .toLowerCase();


                        const status =
                            String(
                                item.status ||
                                "active"
                            )
                            .trim()
                            .toLowerCase();


                        /*
                         * Empty role is accepted for
                         * legacy users, but a declared
                         * customer account cannot login
                         * as rider.
                         */

                        const roleAllowed =
                            !role ||
                            role === "rider" ||
                            role === "driver";


                        const statusAllowed =
                            status !== "blocked" &&
                            status !== "suspended" &&
                            status !== "disabled";


                        return (

                            itemPhone === mobile &&

                            itemPassword === pass &&

                            roleAllowed &&

                            statusAllowed

                        );

                    }
                );


            /* -----------------------------------------
               USER NOT FOUND
            ----------------------------------------- */

            if(
                !user
            ){

                showError(
                    "Invalid rider mobile number or password."
                );


                setLoading(
                    false
                );


                return;

            }


            /* -----------------------------------------
               SESSION
            ----------------------------------------- */

            const session = {

                uid:
                    user.uid ||
                    user.id ||
                    "rider_" + mobile,


                id:
                    user.id ||
                    user.uid ||
                    "rider_" + mobile,


                name:
                    user.name ||
                    user.fullName ||
                    user.displayName ||
                    "RiderX Rider",


                fullName:
                    user.fullName ||
                    user.name ||
                    user.displayName ||
                    "RiderX Rider",


                phone:
                    mobile,


                mobile:
                    mobile,


                email:
                    user.email ||
                    "",


                role:
                    "rider",


                status:
                    user.status ||
                    "active",


                vehicleType:
                    user.vehicleType ||
                    user.vehicle ||
                    "bike",


                vehicleNumber:
                    user.vehicleNumber ||
                    user.vehicleNo ||
                    "",


                loginAt:
                    new Date().toISOString()

            };


            /* -----------------------------------------
               SYNCHRONIZED RIDER SESSION
            ----------------------------------------- */

            localStorage.setItem(
                "riderx_user",
                JSON.stringify(
                    session
                )
            );


            localStorage.setItem(
                "riderx_rider",
                JSON.stringify(
                    session
                )
            );


            localStorage.setItem(
                "userRole",
                "rider"
            );


            localStorage.setItem(
                "riderx_selected_role",
                "rider"
            );


            /*
             * Keep a simple login flag for older
             * RiderX pages.
             */

            localStorage.setItem(
                "riderx_logged_in",
                "true"
            );


            if(
                remember.checked
            ){

                localStorage.setItem(
                    "riderx_remember",
                    "true"
                );

            }else{

                localStorage.removeItem(
                    "riderx_remember"
                );

            }


            showSuccess(
                "Login successful. Opening rider dashboard..."
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "../rider/home.html"
                    );

                },
                650
            );


        }catch(error){

            console.error(
                "Rider login error:",
                error
            );


            showError(
                "Unable to login right now. Please try again."
            );


            setLoading(
                false
            );

        }

    }
);


/* =========================================================
   OTP LOGIN
========================================================= */

otpBtn.addEventListener(
    "click",
    function(){

        const mobile =
            normalizePhone(
                phone.value
            );


        if(
            mobile &&
            !/^[6-9]\d{9}$/.test(
                mobile
            )
        ){

            showError(
                "Please enter a valid mobile number."
            );


            phone.focus();

            return;

        }


        if(
            mobile
        ){

            localStorage.setItem(
                "riderx_otp_phone",
                mobile
            );

        }else{

            localStorage.removeItem(
                "riderx_otp_phone"
            );

        }


        localStorage.setItem(
            "riderx_selected_role",
            "rider"
        );


        localStorage.setItem(
            "riderx_otp_role",
            "rider"
        );


        window.location.href =
            "./otp-login.html";

    }
);


/* =========================================================
   FORGOT PASSWORD
========================================================= */

forgotBtn.addEventListener(
    "click",
    function(){

        const mobile =
            normalizePhone(
                phone.value
            );


        if(
            mobile &&
            !/^[6-9]\d{9}$/.test(
                mobile
            )
        ){

            showError(
                "Please enter a valid mobile number."
            );


            phone.focus();

            return;

        }


        localStorage.setItem(
            "riderx_reset_role",
            "rider"
        );


        if(
            mobile
        ){

            localStorage.setItem(
                "riderx_reset_phone",
                mobile
            );

        }else{

            localStorage.removeItem(
                "riderx_reset_phone"
            );

        }


        /*
         * Use the existing OTP page as the
         * password-reset entry point.
         */

        window.location.href =
            "./otp-login.html";

    }
);


/* =========================================================
   ROLE SELECTOR
========================================================= */

roleBtn.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "riderx_selected_role"
        );


        localStorage.removeItem(
            "riderx_otp_role"
        );


        window.location.href =
            "./role.html";

    }
);


/* =========================================================
   GET USERS
========================================================= */

function getUsers(){

    const result = [];


    /* -----------------------------------------
       MAIN USERS LIST
    ----------------------------------------- */

    try{

        const raw =
            localStorage.getItem(
                "riderx_users"
            );


        if(
            raw
        ){

            const users =
                JSON.parse(
                    raw
                );


            if(
                Array.isArray(
                    users
                )
            ){

                result.push(
                    ...users
                );

            }

        }

    }catch(error){

        console.error(
            "riderx_users read error:",
            error
        );

    }


    /* -----------------------------------------
       LEGACY RIDER SESSION
    ----------------------------------------- */

    try{

        const raw =
            localStorage.getItem(
                "riderx_rider"
            );


        if(
            raw
        ){

            const rider =
                JSON.parse(
                    raw
                );


            if(
                rider &&
                typeof rider ===
                "object"
            ){

                const exists =
                    result.some(
                        function(item){

                            if(
                                !item
                            ){

                                return false;

                            }


                            const itemId =
                                item.uid ||
                                item.id;


                            const riderId =
                                rider.uid ||
                                rider.id;


                            if(
                                itemId &&
                                riderId &&
                                itemId ===
                                riderId
                            ){

                                return true;

                            }


                            return (
                                normalizePhone(
                                    item.phone ||
                                    item.mobile ||
                                    item.phoneNumber
                                ) ===
                                normalizePhone(
                                    rider.phone ||
                                    rider.mobile ||
                                    rider.phoneNumber
                                )
                            );

                        }
                    );


                if(
                    !exists
                ){

                    result.push(
                        rider
                    );

                }

            }

        }

    }catch(error){

        console.error(
            "Legacy rider read error:",
            error
        );

    }


    return result;

}


/* =========================================================
   PHONE NORMALIZER
========================================================= */

function normalizePhone(
    value
){

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    )
    .slice(
        -10
    );

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(
    loading
){

    loginBtn.disabled =
        loading;


    otpBtn.disabled =
        loading;


    if(
        loading
    ){

        loginBtn.innerHTML =
            '<span class="loader"></span>Logging in...';

    }else{

        loginBtn.textContent =
            "Login";

    }

}


/* =========================================================
   MESSAGES
========================================================= */

function hideMessages(){

    errorBox.classList.remove(
        "show"
    );


    successBox.classList.remove(
        "show"
    );


    errorBox.textContent =
        "";


    successBox.textContent =
        "";

}


function showError(
    message
){

    successBox.classList.remove(
        "show"
    );


    successBox.textContent =
        "";


    errorBox.textContent =
        message;


    errorBox.classList.add(
        "show"
    );

}


function showSuccess(
    message
){

    errorBox.classList.remove(
        "show"
    );


    errorBox.textContent =
        "";


    successBox.textContent =
        message;


    successBox.classList.add(
        "show"
    );

}


/* =========================================================
   RESTORE PHONE
========================================================= */

(function restorePhone(){

    try{

        const savedPhone =
            localStorage.getItem(
                "riderx_otp_phone"
            );


        if(
            savedPhone &&
            /^[6-9]\d{9}$/.test(
                normalizePhone(
                    savedPhone
                )
            )
        ){

            phone.value =
                normalizePhone(
                    savedPhone
                );

        }

    }catch(error){

        console.warn(
            "Could not restore rider phone:",
            error
        );

    }

})();

</script>
