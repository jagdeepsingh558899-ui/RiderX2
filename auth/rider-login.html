<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFD400"><title>RiderX - Rider Login</title><link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Auth.css">
<link rel="stylesheet" href="../css/Responsive.css"><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#070707;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    position:relative;
    overflow:hidden;
}

.page::before{
    content:"";
    position:absolute;
    width:370px;
    height:370px;
    top:-190px;
    right:-150px;
    border-radius:50%;
    background:rgba(255,212,0,.08);
}

.page::after{
    content:"";
    position:absolute;
    width:330px;
    height:330px;
    bottom:-200px;
    left:-160px;
    border-radius:50%;
    background:rgba(255,212,0,.05);
}

.card{
    position:relative;
    z-index:2;
    width:100%;
    max-width:430px;
    padding:29px 22px 22px;
    border:1px solid #292929;
    border-radius:22px;
    background:#111;
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.brand{
    text-align:center;
    margin-bottom:22px;
}

.logo{
    width:68px;
    height:68px;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:19px;
    background:#FFD400;
    color:#090909;
    font-size:23px;
    font-weight:1000;
}

.brand h1{
    margin:0;
    font-size:25px;
    font-weight:1000;
}

.brand h1 span{
    color:#FFD400;
}

.brand p{
    margin:6px 0 0;
    color:#777;
    font-size:10px;
}

.rider-badge{
    width:max-content;
    margin:0 auto 17px;
    padding:7px 12px;
    border:1px solid rgba(255,212,0,.3);
    border-radius:20px;
    background:#211f12;
    color:#FFD400;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.heading{
    margin-bottom:17px;
}

.heading h2{
    margin:0;
    font-size:18px;
}

.heading p{
    margin:6px 0 0;
    color:#777;
    font-size:10px;
    line-height:1.5;
}

.message{
    display:none;
    margin-bottom:13px;
    padding:10px;
    border-radius:9px;
    font-size:9px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.error{
    border:1px solid #542828;
    background:#241414;
    color:#ff7777;
}

.success{
    border:1px solid #275335;
    background:#132319;
    color:#65e58b;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    margin-bottom:6px;
    color:#999;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
}

.input{
    width:100%;
    height:48px;
    padding:0 13px;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
    background:#1a1a1a;
    color:#fff;
    font-size:12px;
}

.input:focus{
    border-color:#FFD400;
    box-shadow:0 0 0 2px rgba(255,212,0,.08);
}

.input::placeholder{
    color:#555;
}

.phone-row{
    display:flex;
    gap:8px;
}

.code{
    width:80px;
    height:48px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #333;
    border-radius:10px;
    background:#1a1a1a;
    color:#FFD400;
    font-size:11px;
    font-weight:900;
}

.phone-row .input{
    flex:1;
}

.password{
    position:relative;
}

.password .input{
    padding-right:45px;
}

.eye{
    position:absolute;
    right:7px;
    top:50%;
    width:34px;
    height:34px;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#777;
    cursor:pointer;
}

.eye:hover{
    color:#FFD400;
}

.options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:2px 0 17px;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:#777;
    font-size:9px;
}

.remember input{
    width:14px;
    height:14px;
    accent-color:#FFD400;
}

.link{
    border:0;
    background:transparent;
    color:#FFD400;
    cursor:pointer;
    font-size:9px;
    font-weight:900;
}

.submit{
    width:100%;
    height:49px;
    border:0;
    border-radius:10px;
    background:#FFD400;
    color:#111;
    cursor:pointer;
    font-size:12px;
    font-weight:1000;
}

.submit:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.otp-btn{
    width:100%;
    height:45px;
    margin-top:10px;
    border:1px solid #333;
    border-radius:10px;
    background:#191919;
    color:#ddd;
    cursor:pointer;
    font-size:10px;
    font-weight:900;
}

.otp-btn:hover{
    border-color:#FFD400;
    color:#FFD400;
}

.register{
    margin-top:19px;
    text-align:center;
    color:#777;
    font-size:10px;
}

.register a{
    color:#FFD400;
    text-decoration:none;
    font-weight:900;
}

.back{
    width:100%;
    margin-top:12px;
    border:0;
    background:transparent;
    color:#555;
    cursor:pointer;
    font-size:9px;
}

.back:hover{
    color:#FFD400;
}

.notice{
    margin-top:16px;
    padding:10px;
    border:1px solid #252525;
    border-radius:9px;
    background:#151515;
    color:#666;
    font-size:8px;
    line-height:1.5;
    text-align:center;
}

.notice strong{
    color:#aaa;
}

.footer{
    margin-top:17px;
    text-align:center;
    color:#444;
    font-size:8px;
}

.loader{
    display:inline-block;
    width:13px;
    height:13px;
    margin-right:7px;
    vertical-align:-2px;
    border:2px solid rgba(0,0,0,.25);
    border-top-color:#111;
    border-radius:50%;
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:480px){

    .page{
        padding:10px;
    }

    .card{
        padding:24px 17px 18px;
        border-radius:18px;
    }

}

</style></head><body><main class="page"><section class="card"><div class="brand"><div class="logo">
    RX
</div>

<h1>
    Rider<span>X</span>
</h1>

<p>
    Ride more. Earn more.
</p>

</div><div class="rider-badge">
    🛵 Rider Partner Login
</div><div class="heading"><h2>
    Welcome, Rider
</h2>

<p>
    Login to go online and start accepting RiderX rides.
</p>

</div><div
    class="message error"
    id="errorBox"
></div><div
    class="message success"
    id="successBox"
></div><form
    id="riderLoginForm"
    novalidate
><div class="field"><label>
    Mobile Number
</label>

<div class="phone-row">

    <div class="code">
        +91
    </div>

    <input
        class="input"
        id="phone"
        type="tel"
        inputmode="numeric"
        autocomplete="tel"
        maxlength="10"
        placeholder="10-digit mobile number"
        required
    >

</div>

</div><div class="field"><label>
    Password
</label>

<div class="password">

    <input
        class="input"
        id="password"
        type="password"
        autocomplete="current-password"
        minlength="6"
        placeholder="Enter rider password"
        required
    >

    <button
        type="button"
        class="eye"
        id="eyeBtn"
        aria-label="Show password"
    >
        👁
    </button>

</div>

</div><div class="options"><label class="remember">

    <input
        type="checkbox"
        id="remember"
    >

    Remember me

</label>


<button
    type="button"
    class="link"
    id="forgotBtn"
>
    Forgot password?
</button>

</div><button
type="submit"
class="submit"
id="submitBtn"

«»

Rider Login

</button></form><button
type="button"
class="otp-btn"
id="otpBtn"

«»

Login with Rider OTP

</button><div class="register">Want to become a Rider?

<a href="./register.html">
    Register now
</a>

</div><button
type="button"
class="back"
id="backBtn"

«»

← Back to login options

</button><div class="notice"><strong>Rider access:</strong>
Your rider account must be approved before you can accept rides.

</div><div class="footer">
    © 2026 RiderX • Rider Partner Portal
</div></section></main><script>

"use strict";


const form =
    document.getElementById(
        "riderLoginForm"
    );

const phone =
    document.getElementById(
        "phone"
    );

const password =
    document.getElementById(
        "password"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const successBox =
    document.getElementById(
        "successBox"
    );



phone.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    10
                );

    }
);



document
    .getElementById(
        "eyeBtn"
    )
    .addEventListener(
        "click",
        function(){

            const show =
                password.type ===
                "password";


            password.type =
                show
                    ? "text"
                    : "password";


            this.textContent =
                show
                    ? "🙈"
                    : "👁";

        }
    );



form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        clearMessages();


        const mobile =
            phone.value.trim();


        const pass =
            password.value;


        if(
            !/^[6-9]\d{9}$/.test(
                mobile
            )
        ){

            showError(
                "Enter a valid 10-digit Indian mobile number."
            );

            phone.focus();

            return;

        }


        if(
            pass.length < 6
        ){

            showError(
                "Password must be at least 6 characters."
            );

            password.focus();

            return;

        }


        setLoading(
            true
        );


        try{

            const rider =
                findRider(
                    mobile,
                    pass
                );


            if(!rider){

                showError(
                    "Rider account not found or password is incorrect."
                );

                setLoading(
                    false
                );

                return;

            }


            const status =
                normalizeStatus(
                    rider.status
                );


            if(
                status ===
                "pending"
            ){

                showError(
                    "Your RiderX rider account is still pending approval."
                );

                setLoading(
                    false
                );

                return;

            }


            if(
                status ===
                "blocked" ||
                status ===
                "suspended" ||
                status ===
                "rejected"
            ){

                showError(
                    "Your rider account is currently " +
                    status +
                    ". Please contact RiderX support."
                );

                setLoading(
                    false
                );

                return;

            }


            const session = {

                uid:
                    rider.uid ||
                    "rider_" +
                    mobile,

                name:
                    rider.name ||
                    "Rider",

                phone:
                    mobile,

                email:
                    rider.email ||
                    "",

                role:
                    "rider",

                status:
                    "active",

                loginMethod:
                    "password",

                loginAt:
                    new Date().toISOString()

            };


            localStorage.setItem(
                "riderx_user",
                JSON.stringify(
                    session
                )
            );


            localStorage.setItem(
                "riderx_rider",
                JSON.stringify(
                    session
                )
            );


            localStorage.setItem(
                "userRole",
                "rider"
            );


            localStorage.setItem(
                "riderx_selected_role",
                "rider"
            );


            if(
                document.getElementById(
                    "remember"
                ).checked
            ){

                localStorage.setItem(
                    "riderx_remember",
                    "true"
                );

            }


            showSuccess(
                "Rider login successful. Opening Rider Dashboard..."
            );


            setTimeout(
                function(){

                    window.location.href =
                        "../rider/home.html";

                },
                700
            );


        }catch(error){

            console.error(
                error
            );


            showError(
                "Something went wrong. Please try again."
            );


            setLoading(
                false
            );

        }

    }
);



document
    .getElementById(
        "otpBtn"
    )
    .addEventListener(
        "click",
        function(){

            const mobile =
                phone.value.trim();


            if(
                mobile &&
                !/^[6-9]\d{9}$/.test(
                    mobile
                )
            ){

                showError(
                    "Enter a valid mobile number."
                );

                return;

            }


            if(mobile){

                localStorage.setItem(
                    "riderx_otp_phone",
                    mobile
                );

            }


            localStorage.setItem(
                "riderx_selected_role",
                "rider"
            );


            window.location.href =
                "./otp-login.html";

        }
    );



document
    .getElementById(
        "forgotBtn"
    )
    .addEventListener(
        "click",
        function(){

            const mobile =
                phone.value.trim();


            if(
                mobile &&
                !/^[6-9]\d{9}$/.test(
                    mobile
                )
            ){

                showError(
                    "Enter a valid mobile number."
                );

                return;

            }


            localStorage.setItem(
                "riderx_selected_role",
                "rider"
            );


            if(mobile){

                localStorage.setItem(
                    "riderx_reset_phone",
                    mobile
                );

            }


            window.location.href =
                "./otp-login.html";

        }
    );



document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "./role.html";

        }
    );



function findRider(
    mobile,
    pass
){

    const riders =
        getRiders();


    return riders.find(
        function(rider){

            return (
                normalizePhone(
                    rider.phone
                ) ===
                mobile &&
                String(
                    rider.password ||
                    ""
                ) ===
                pass
            );

        }
    ) || null;

}



function getRiders(){

    const result = [];


    const keys = [

        "riderx_riders",
        "riderx_users",
        "users"

    ];


    keys.forEach(
        function(key){

            try{

                const raw =
                    localStorage.getItem(
                        key
                    );


                if(!raw){

                    return;

                }


                const parsed =
                    JSON.parse(
                        raw
                    );


                if(
                    Array.isArray(
                        parsed
                    )
                ){

                    parsed.forEach(
                        function(item){

                            if(
                                normalizeRole(
                                    item.role
                                ) ===
                                "rider"
                            ){

                                result.push(
                                    item
                                );

                            }

                        }
                    );

                }else if(
                    parsed &&
                    normalizeRole(
                        parsed.role
                    ) ===
                    "rider"
                ){

                    result.push(
                        parsed
                    );

                }

            }catch(error){

                console.error(
                    error
                );

            }

        }
    );


    return result;

}



function normalizeRole(
    role
){

    const value =
        String(
            role || ""
        )
        .toLowerCase();


    if(
        value === "rider" ||
        value === "driver"
    ){

        return "rider";

    }


    return "customer";

}



function normalizePhone(
    value
){

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    )
    .slice(
        -10
    );

}



function normalizeStatus(
    status
){

    const value =
        String(
            status ||
            "active"
        )
        .toLowerCase();


    if(
        value.includes(
            "pending"
        )
    ){

        return "pending";

    }


    if(
        value.includes(
            "block"
        )
    ){

        return "blocked";

    }


    if(
        value.includes(
            "suspend"
        )
    ){

        return "suspended";

    }


    if(
        value.includes(
            "reject"
        )
    ){

        return "rejected";

    }


    return "active";

}



function setLoading(
loading
){

    submitBtn.disabled =
        loading;


    if(loading){

        submitBtn.innerHTML =
            '<span class="loader"></span>Signing in...';

    }else{

        submitBtn.textContent =
            "Rider Login";

    }

}



function clearMessages(){

    errorBox.classList.remove(
        "show"
    );

    successBox.classList.remove(
        "show"
    );

}



function showError(
message
){

    successBox.classList.remove(
        "show"
    );

    errorBox.textContent =
        message;

    errorBox.classList.add(
        "show"
    );

}



function showSuccess(
message
){

    errorBox.classList.remove(
        "show"
    );

    successBox.textContent =
        message;

    successBox.classList.add(
        "show"
    );

}

</script></body></html>
