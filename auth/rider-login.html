<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RiderX Rider Login</title>

<style>
:root{
  --yellow:#ffe500;
  --black:#050505;
  --card:#111;
  --border:#292929;
  --gray:#999;
  --green:#19d36b;
  --red:#ff5555;
  --orange:#ffad1f;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:var(--black);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:900;
  margin-bottom:8px;
}

.logo span{
  color:var(--yellow);
}

.subtitle{
  text-align:center;
  color:var(--gray);
  font-size:14px;
  margin-bottom:28px;
}

label{
  display:block;
  color:#ccc;
  font-size:14px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:17px;
  background:#050505;
  color:#fff;
  border:1px solid #333;
  border-radius:12px;
  outline:none;
  font-size:16px;
}

input:focus{
  border-color:var(--yellow);
}

.login-btn{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:var(--yellow);
  color:#000;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.loading{
  display:none;
  text-align:center;
  color:var(--yellow);
  font-size:14px;
  margin-top:16px;
}

.message{
  min-height:24px;
  margin-top:16px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
}

.message.success{
  color:var(--green);
}

.message.error{
  color:var(--red);
}

.message.pending{
  color:var(--orange);
}

.links{
  margin-top:22px;
  text-align:center;
}

.links a{
  color:var(--yellow);
  text-decoration:none;
  font-size:14px;
}

.links a:hover{
  text-decoration:underline;
}

.note{
  text-align:center;
  color:#666;
  font-size:11px;
  margin-top:20px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    RID<span>ERX</span>
  </div>

  <div class="subtitle">
    Rider Login
  </div>

  <label for="email">
    Email
  </label>

  <input
    id="email"
    type="email"
    placeholder="Enter registered email"
    autocomplete="username"
  >

  <label for="password">
    Password
  </label>

  <input
    id="password"
    type="password"
    placeholder="Enter password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    class="login-btn"
    type="button"
  >
    Rider Login
  </button>

  <div id="loading" class="loading">
    Signing in...
  </div>

  <div id="message" class="message"></div>

  <div class="links">
    <a href="rider-register.html">
      New rider? Register here
    </a>
  </div>

  <div class="note">
    Rider account must be approved by RiderX Admin
    before going online.
  </div>

</div>


<script type="module">

/* ============================================================
   RIDERX RIDER LOGIN
   FINAL APPROVAL-BASED LOGIN
   ============================================================ */

import {
  auth,
  db,
  signInWithEmailAndPassword,
  signOut,
  doc,
  getDoc
} from "../firebase/firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loading =
  document.getElementById("loading");

const message =
  document.getElementById("message");


let loggingIn = false;


/* ============================================================
   HELPERS
   ============================================================ */

function showMessage(text,type="error"){

  message.textContent = text;

  message.className =
    "message " + type;
}


function clearMessage(){

  message.textContent = "";

  message.className =
    "message";
}


function setLoading(active,text="Signing in..."){

  if(active){

    loading.style.display =
      "block";

    loading.textContent =
      text;

    loginBtn.disabled =
      true;

  }else{

    loading.style.display =
      "none";

    loginBtn.disabled =
      false;

  }
}


function normalize(value){

  return String(
    value ?? ""
  )
  .trim()
  .toLowerCase();
}


function getStatus(data){

  return normalize(
    data?.status ??
    data?.approvalStatus ??
    data?.riderStatus ??
    data?.verificationStatus ??
    ""
  );
}


function isAdminApproved(data){

  const status =
    getStatus(data);

  return (
    data?.adminApproved === true ||
    data?.approved === true ||
    data?.isApproved === true ||
    [
      "approved",
      "active",
      "verified"
    ].includes(status)
  );
}


function isRejected(data){

  const status =
    getStatus(data);

  return (
    [
      "rejected",
      "declined",
      "blocked"
    ].includes(status) ||
    data?.accountStatus === "rejected"
  );
}


function isPending(data){

  if(isAdminApproved(data)){
    return false;
  }

  if(isRejected(data)){
    return false;
  }

  const status =
    getStatus(data);

  return (
    !status ||
    [
      "pending",
      "pending_approval",
      "pending-approval",
      "under_review",
      "under-review",
      "verifying",
      "verification",
      "review",
      "submitted",
      "application_submitted"
    ].includes(status)
  );
}


/* ============================================================
   ERROR MESSAGE
   ============================================================ */

function firebaseError(error){

  const code =
    error?.code || "";

  switch(code){

    case "auth/invalid-credential":
      return "Email or password is incorrect.";

    case "auth/user-not-found":
      return "Rider account not found.";

    case "auth/wrong-password":
      return "Wrong password.";

    case "auth/invalid-email":
      return "Invalid email address.";

    case "auth/too-many-requests":
      return "Too many login attempts. Please try again later.";

    case "auth/network-request-failed":
      return "Network error. Please check your internet.";

    case "auth/user-disabled":
      return "This rider account has been disabled.";

    default:

      if(
        String(error?.message || "")
          .toLowerCase()
          .includes(
            "missing or insufficient permissions"
          )
      ){

        return "Firestore permission denied.";
      }

      return (
        error?.message ||
        "Login failed."
      );
  }
}


/* ============================================================
   LOAD RIDER PROFILE
   ============================================================ */

async function getRiderProfile(uid){

  /*
    First check users/{uid}
  */

  let usersSnap =
    await getDoc(
      doc(db,"users",uid)
    );

  let usersData =
    usersSnap.exists()
      ? usersSnap.data()
      : null;


  /*
    Then check riders/{uid}
  */

  let ridersSnap =
    await getDoc(
      doc(db,"riders",uid)
    );

  let ridersData =
    ridersSnap.exists()
      ? ridersSnap.data()
      : null;


  if(!usersData && !ridersData){

    return null;
  }


  /*
    Merge both documents.

    Rider document has priority for
    rider-specific fields.
  */

  return {
    ...(usersData || {}),
    ...(ridersData || {})
  };
}


/* ============================================================
   LOGIN
   ============================================================ */

async function loginRider(){

  if(loggingIn){
    return;
  }

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if(!email){

    showMessage(
      "Please enter your email."
    );

    emailInput.focus();

    return;
  }


  if(!password){

    showMessage(
      "Please enter your password."
    );

    passwordInput.focus();

    return;
  }


  loggingIn = true;

  clearMessage();

  setLoading(
    true,
    "Signing in..."
  );


  try{

    /*
      Firebase Authentication
    */

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user =
      result.user;

    const uid =
      user.uid;


    setLoading(
      true,
      "Checking rider approval..."
    );


    /*
      Get rider profile
    */

    const rider =
      await getRiderProfile(uid);


    if(!rider){

      await signOut(auth);

      showMessage(
        "Rider profile not found. Please register again."
      );

      setLoading(false);

      loggingIn = false;

      return;
    }


    /*
      Make sure this is a rider account.
    */

    const role =
      normalize(
        rider.role ??
        rider.userType ??
        rider.type ??
        "rider"
      );


    if(
      role !== "rider" &&
      role !== "driver"
    ){

      await signOut(auth);

      showMessage(
        "This account is not registered as a rider."
      );

      setLoading(false);

      loggingIn = false;

      return;
    }


    /*
      REJECTED
    */

    if(isRejected(rider)){

      await signOut(auth);

      showMessage(
        "Your rider registration was rejected by Admin. Please contact RiderX support.",
        "error"
      );

      setLoading(false);

      loggingIn = false;

      return;
    }


    /*
      PENDING
    */

    if(!isAdminApproved(rider)){

      /*
        Do NOT send pending rider to home.
      */

      await signOut(auth);

      showMessage(
        "Your rider account is pending Admin approval.",
        "pending"
      );

      setLoading(false);

      loggingIn = false;

      setTimeout(
        () => {

          window.location.replace(
            "pending.html"
          );

        },
        900
      );

      return;
    }


    /*
      APPROVED
    */

    setLoading(
      true,
      "Admin approved. Opening Rider Panel..."
    );


    /*
      Keep account offline initially.
      Rider can manually go online
      from Rider Home.
    */

    try{

      await import(
        "../firebase/firebase-config.js"
      );

      /*
        We intentionally do not change
        approval fields here.
      */

    }catch(error){

      console.warn(
        "Optional Firebase module warning:",
        error
      );
    }


    showMessage(
      "Login successful. Opening Rider Panel...",
      "success"
    );


    /*
      IMPORTANT:
      Use lowercase home.html.

      This prevents Vercel/Linux
      case-sensitive 404 problems.
    */

    setTimeout(
      () => {

        window.location.replace(
          "../rider/home.html"
        );

      },
      300
    );


  }catch(error){

    console.error(
      "Rider Login Error:",
      error
    );

    showMessage(
      firebaseError(error)
    );

    setLoading(false);

    loggingIn = false;
  }
}


/* ============================================================
   BUTTON
   ============================================================ */

loginBtn.addEventListener(
  "click",
  loginRider
);


/* ============================================================
   ENTER KEY
   ============================================================ */

emailInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      loginRider();
    }
  }
);


passwordInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      loginRider();
    }
  }
);


/* ============================================================
   IMPORTANT
   ============================================================

   We DO NOT use onAuthStateChanged here
   to automatically redirect.

   This prevents:
   - old Firebase session
   - automatic Home redirect
   - login page loop
   - wrong rider/admin routing
   ============================================================ */


/* ============================================================
   PAGE LOAD
   ============================================================ */

clearMessage();

setLoading(
  false
);

console.log(
  "RiderX Rider Login loaded successfully."
);

</script>

</body>
</html>
