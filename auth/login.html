<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Login</title>


<link rel="stylesheet" href="../assets/app.css">


<style>

body{
margin:0;
height:100vh;
background:#000;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
}


.login-box{

width:90%;
max-width:420px;
background:#111;
padding:30px;
border-radius:25px;
border:1px solid #333;

}


.logo{

text-align:center;
font-size:40px;
font-weight:900;

}


.logo span{

color:#FFD600;

}


.role{

text-align:center;
color:#FFD600;
margin:15px;

}


.input{

width:100%;
padding:14px;
margin:10px 0;
background:#000;
color:white;
border:1px solid #444;
border-radius:12px;

}


.btn{

width:100%;
padding:15px;
margin-top:12px;
border-radius:12px;
border:none;
font-size:17px;
font-weight:bold;
cursor:pointer;

}


.login{

background:#FFD600;
color:#000;

}


.register{

background:#222;
color:#FFD600;
border:1px solid #FFD600;

}


.back{

text-align:center;
margin-top:20px;
color:#999;

}


</style>

</head>



<body>



<div class="login-box">


<div class="logo">
RID<span>ERX</span>
</div>


<div class="role" id="roleText">
Customer Login
</div>



<input 
id="email"
class="input"
type="email"
placeholder="Email Address">



<input 
id="password"
class="input"
type="password"
placeholder="Password">



<button id="loginBtn" class="btn login">

Login

</button>




<button id="registerBtn" class="btn register">

Create Account

</button>



<div class="back" onclick="history.back()">

← Back

</div>


</div>








<script type="module">


import { auth, db } from "../firebase/firebase-config.js";


import {

signInWithEmailAndPassword

} from 

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

doc,
getDoc

} from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





// Role Check


const params =
new URLSearchParams(window.location.search);


const role =
params.get("role") || "customer";



if(role==="rider"){

document.getElementById("roleText").innerHTML=
"Rider Login";

}






// Login


document
.getElementById("loginBtn")
.onclick = async ()=>{


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;




if(!email || !password){

alert("Enter email and password");

return;

}




try{


const result =
await signInWithEmailAndPassword(
auth,
email,
password
);



const uid =
result.user.uid;





const userSnap =
await getDoc(
doc(db,"users",uid)
);



if(userSnap.exists()){


const user =
userSnap.data();




if(user.role==="rider"){


window.location.href=
"../rider/home.html";


}

else{


window.location.href=
"../customer/home.html";


}



}

else{


alert(
"User profile not found"
);


}





}

catch(error){


alert(
"Login Failed: "+error.message
);


}



};






// Register


document
.getElementById("registerBtn")
.onclick=function(){


window.location.href=
"register.html?role="+role;


};



</script>



</body>

</html>
