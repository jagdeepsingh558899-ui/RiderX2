<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Login</title>

<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;

}



.box{

width:90%;
max-width:380px;

background:#111;

padding:25px;

border-radius:20px;

border:1px solid #FFD600;

}



h1{

text-align:center;

margin-bottom:25px;

}



span{

color:#FFD600;

}



input{

width:100%;

padding:15px;

margin-top:15px;

border-radius:12px;

border:none;

font-size:16px;

}



button{

width:100%;

padding:15px;

margin-top:20px;

border-radius:12px;

border:none;

background:#FFD600;

font-weight:bold;

font-size:17px;

}



a{

color:#FFD600;

display:block;

text-align:center;

margin-top:20px;

}



</style>


</head>


<body>



<div class="box">


<h1>

RIDER<span>X</span>

</h1>



<input 
id="email"
type="email"
placeholder="Email">



<input 
id="password"
type="password"
placeholder="Password">



<button id="loginBtn">

Login

</button>




<a href="register.html">

Create New Account

</a>



</div>






<script type="module" src="../js/auth.js"></script>


</body>


</html>
