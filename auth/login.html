<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Login</title>


<link rel="stylesheet" href="../assets/app.css">


<link rel="manifest" href="../manifest.json">


<meta name="theme-color" content="#000000">



<style>


*{

box-sizing:border-box;

}


body{

margin:0;

min-height:100vh;

background:#000;

color:#fff;

display:flex;

justify-content:center;

align-items:center;

font-family:Arial,sans-serif;

padding:20px;

}




.auth-card{


width:100%;

max-width:420px;

background:#111;

padding:30px;

border-radius:25px;

border:1px solid #333;

}





.logo{


text-align:center;

font-size:38px;

font-weight:900;

margin-bottom:20px;


}



.logo span{

color:#FFD600;

}



h2{


text-align:center;

color:#FFD600;

margin-bottom:20px;


}





.input-box{


margin-bottom:15px;


}



label{


color:#aaa;

font-size:14px;

display:block;

margin-bottom:7px;


}



input{


width:100%;

padding:14px;

background:#000;

border:1px solid #444;

border-radius:12px;

color:#fff;

font-size:15px;


}





.btn{


width:100%;

padding:15px;

background:#FFD600;

border:none;

border-radius:12px;

font-weight:bold;

font-size:17px;

cursor:pointer;


}





.error-msg{


color:#ff4444;

margin-bottom:15px;

display:none;


}




.auth-links{


text-align:center;

margin-top:20px;

color:#aaa;


}



.auth-links a{


color:#FFD600;

text-decoration:none;

font-weight:bold;


}



</style>


</head>



<body>



<div class="auth-card">



<div class="logo">

RID<span>ERX</span>

</div>



<h2>

Login

</h2>




<div id="error-message"
class="error-msg">

</div>




<form id="login-form">



<div class="input-box">

<label>Email</label>

<input 
id="email"
type="email"
required
placeholder="Email Address">


</div>





<div class="input-box">

<label>Password</label>

<input
id="password"
type="password"
required
placeholder="Password">


</div>





<button 
class="btn"
id="login-btn"
type="submit">


Login


</button>




</form>






<div class="auth-links">


Don't have account?


<a id="registerLink"
href="register.html">


Register


</a>



</div>



</div>








<script>


const params =
new URLSearchParams(
window.location.search
);



const role =
params.get("role");




if(role==="rider"){


document.getElementById("registerLink").href =
"register.html?role=rider";


}



</script>





<script type="module" src="../js/login.js"></script>


</body>


</html>
