<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFD400">
<meta name="description" content="RiderX secure login">

<title>RiderX - Login</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

:root {
    --rx-yellow: #ffd400;
    --rx-black: #050505;
    --rx-card: #111111;
    --rx-border: rgba(255,255,255,.10);
    --rx-text: #ffffff;
    --rx-muted: #999999;
    --rx-danger: #ff4d4d;
    --rx-success: #31d158;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    min-height: 100dvh;

    background:
        radial-gradient(
            circle at top,
            rgba(255,212,0,.12),
            transparent 38%
        ),
        #050505;

    color: var(--rx-text);

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.auth-page {
    width: 100%;
    max-width: 430px;
}

.auth-brand {
    text-align: center;
    margin-bottom: 22px;
}

.auth-logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 12px;

    border-radius: 22px;

    background: var(--rx-yellow);
    color: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
    font-weight: 900;

    box-shadow:
        0 12px 35px rgba(255,212,0,.18);

    user-select: none;
}

.auth-brand h1 {
    margin: 0;

    font-size: 29px;
    font-weight: 900;

    letter-spacing: -.8px;
}

.auth-brand p {
    margin: 7px 0 0;

    color: var(--rx-muted);

    font-size: 14px;
}

.auth-card {
    width: 100%;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        ),
        var(--rx-card);

    border:
        1px solid var(--rx-border);

    border-radius: 25px;

    padding: 25px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);
}

.auth-card h2 {
    margin: 0 0 7px;

    font-size: 24px;
    font-weight: 850;
}

.auth-subtitle {
    margin: 0 0 22px;

    color: var(--rx-muted);

    font-size: 14px;
    line-height: 1.5;
}

.role-info {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding: 11px 13px;

    margin-bottom: 18px;

    border-radius: 13px;

    background:
        rgba(255,212,0,.08);

    border:
        1px solid rgba(255,212,0,.18);
}

.role-info span {
    display: block;

    color: #aaa;

    font-size: 12px;
}

.role-info strong {
    display: block;

    margin-top: 2px;

    color: var(--rx-yellow);

    font-size: 13px;

    text-transform: capitalize;
}

.change-role {
    border: 0;

    background: transparent;

    color: var(--rx-yellow);

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;

    padding: 5px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    color: #ddd;

    font-size: 13px;
    font-weight: 700;
}

.input-wrap {
    position: relative;
}

.form-input {
    width: 100%;
    height: 52px;

    padding: 0 15px;

    border-radius: 14px;

    border:
        1px solid var(--rx-border);

    outline: none;

    background: #080808;

    color: #fff;

    font-size: 15px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.form-input:focus {
    border-color: var(--rx-yellow);

    box-shadow:
        0 0 0 3px
        rgba(255,212,0,.10);
}

.form-input::placeholder {
    color: #666;
}

.password-toggle {
    position: absolute;

    right: 12px;
    top: 50%;

    transform: translateY(-50%);

    border: 0;

    background: transparent;

    color: #aaa;

    cursor: pointer;

    font-size: 12px;
    font-weight: 700;
}

.password-toggle:hover {
    color: var(--rx-yellow);
}

.form-actions {
    display: flex;
    justify-content: flex-end;

    margin: -3px 0 18px;
}

.forgot-btn {
    border: 0;

    background: transparent;

    color: var(--rx-yellow);

    cursor: pointer;

    font-size: 13px;
    font-weight: 700;

    padding: 4px 0;
}

.login-btn {
    width: 100%;
    height: 54px;

    border: 0;

    border-radius: 15px;

    background: var(--rx-yellow);
    color: #000;

    font-size: 16px;
    font-weight: 900;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        opacity .2s ease;

    box-shadow:
        0 10px 25px
        rgba(255,212,0,.14);
}

.login-btn:hover {
    background: #ffe04a;

    transform:
        translateY(-1px);
}

.login-btn:active {
    transform:
        translateY(0);
}

.login-btn:disabled {
    opacity: .55;

    cursor: not-allowed;

    transform: none;
}

.divider {
    display: flex;
    align-items: center;

    gap: 12px;

    margin: 21px 0;

    color: #666;

    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    flex: 1;

    background:
        var(--rx-border);
}

.register-row {
    text-align: center;

    color: #888;

    font-size: 13px;
}

.register-btn {
    border: 0;

    background: transparent;

    color: var(--rx-yellow);

    cursor: pointer;

    font-size: 13px;
    font-weight: 800;
}

.message {
    display: none;

    margin-bottom: 17px;

    padding: 12px 14px;

    border-radius: 13px;

    font-size: 13px;

    line-height: 1.45;
}

.message.show {
    display: block;
}

.message.error {
    color: #ffb3b3;

    background:
        rgba(255,77,77,.09);

    border:
        1px solid
        rgba(255,77,77,.22);
}

.message.success {
    color: #b8ffc7;

    background:
        rgba(49,209,88,.08);

    border:
        1px solid
        rgba(49,209,88,.20);
}

.loading-overlay {
    position: fixed;

    inset: 0;

    z-index: 9999;

    background:
        rgba(0,0,0,.82);

    backdrop-filter:
        blur(8px);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.loading-overlay.show {
    display: flex;
}

.loading-box {
    width: min(340px, 100%);

    padding: 25px;

    border-radius: 20px;

    background: #111;

    border:
        1px solid var(--rx-border);

    text-align: center;
}

.loader {
    width: 38px;
    height: 38px;

    margin: 0 auto 15px;

    border:
        3px solid
        rgba(255,255,255,.15);

    border-top-color:
        var(--rx-yellow);

    border-radius: 50%;

    animation:
        rxSpin .8s linear infinite;
}

.loading-box strong {
    display: block;

    font-size: 15px;
}

.loading-box span {
    display: block;

    margin-top: 6px;

    color: #888;

    font-size: 12px;
}

@keyframes rxSpin {

    to {
        transform: rotate(360deg);
    }

}

@media (max-width: 480px) {

    body {
        padding: 14px;

        align-items: flex-start;

        padding-top: 35px;
    }

    .auth-card {
        padding: 21px;

        border-radius: 22px;
    }

    .auth-brand h1 {
        font-size: 27px;
    }

}

@media (prefers-reduced-motion: reduce) {

    .login-btn,
    .form-input,
    .loader {
        transition: none;
        animation: none;
    }

}

</style>
</head>

<body>

<main class="auth-page">

    <section class="auth-brand">

        <div class="auth-logo">
            RX
        </div>

        <h1>
            RiderX
        </h1>

        <p>
            Ride smarter. Move faster.
        </p>

    </section>


    <section class="auth-card">

        <h2>
            Welcome back
        </h2>

        <p class="auth-subtitle">
            Login to continue to your RiderX account.
        </p>


        <div
            id="roleInfo"
            class="role-info"
        >

            <div>

                <span>
                    Login as
                </span>

                <strong id="selectedRoleText">
                    Customer
                </strong>

            </div>

            <button
                type="button"
                class="change-role"
                id="changeRoleBtn"
            >
                Change
            </button>

        </div>


        <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite"
            aria-atomic="true"
        ></div>


        <form
            id="loginForm"
            novalidate
        >

            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    id="email"
                    name="email"
                    class="form-input"
                    type="email"
                    autocomplete="email"
                    inputmode="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrap">

                    <input
                        id="password"
                        name="password"
                        class="form-input"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="forgot-btn"
                    id="forgotPasswordBtn"
                >
                    Forgot password?
                </button>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <div class="register-row">

            Don't have a RiderX account?

            <button
                type="button"
                class="register-btn"
                id="registerBtn"
            >
                Create account
            </button>

        </div>

    </section>

</main>


<div
    id="loadingOverlay"
    class="loading-overlay"
    aria-hidden="true"
>

    <div class="loading-box">

        <div class="loader"></div>

        <strong id="loadingTitle">
            Signing in...
        </strong>

        <span id="loadingText">
            Verifying your RiderX account
        </span>

    </div>

</div>


<script type="module">

"use strict";


/* ============================================================
   RIDERX LOGIN ENGINE
   ============================================================

   IMPORTANT FIX:

   auth.js is NOT imported during page startup.

   Old flow:

       login.html loads
           ↓
       auth.js imports
           ↓
       auth listener starts
           ↓
       signed-out state detected
           ↓
       global auth redirect
           ↓
       role.html

   This caused the login page to disappear after a few seconds.

   New flow:

       role.html
           ↓
       login.html
           ↓
       login page remains here
           ↓
       user presses Login
           ↓
       auth.js loads
           ↓
       Firebase login
           ↓
       Firestore role
           ↓
       correct dashboard

   Only the user's explicit "Change" action can return
   to role.html from this page.
============================================================ */


const STORAGE = Object.freeze({

    selectedRole:
        "riderx_selected_role",

    legacyRole:
        "riderx_role",

    user:
        "riderx_user"

});


const ROUTES = Object.freeze({

    role:
        "role.html",

    customer:
        "../customer/home.html",

    rider:
        "../rider/home.html",

    admin:
        "../admin/dashboard.html"

});


let RX_AUTH = null;

let loginBusy = false;


/* ============================================================
   DOM
============================================================ */

const loginForm =
    document.getElementById(
        "loginForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const message =
    document.getElementById(
        "message"
    );

const selectedRoleText =
    document.getElementById(
        "selectedRoleText"
    );

const changeRoleBtn =
    document.getElementById(
        "changeRoleBtn"
    );

const registerBtn =
    document.getElementById(
        "registerBtn"
    );

const forgotPasswordBtn =
    document.getElementById(
        "forgotPasswordBtn"
    );

const passwordToggle =
    document.getElementById(
        "passwordToggle"
    );

const loadingOverlay =
    document.getElementById(
        "loadingOverlay"
    );

const loadingTitle =
    document.getElementById(
        "loadingTitle"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );


/* ============================================================
   BASIC HELPERS
============================================================ */

function clean(value) {

    return String(
        value ?? ""
    ).trim();

}


function normalizeRole(role) {

    const value =
        clean(role)
            .toLowerCase()
            .replace(
                /[\s-]+/g,
                "_"
            );


    if (
        [
            "customer",
            "customers",
            "user",
            "users"
        ].includes(value)
    ) {

        return "customer";

    }


    if (
        [
            "rider",
            "riders",
            "driver",
            "drivers",
            "partner",
            "driver_partner",
            "driverpartner",
            "captain"
        ].includes(value)
    ) {

        return "rider";

    }


    if (
        [
            "admin",
            "administrator"
        ].includes(value)
    ) {

        return "admin";

    }


    if (
        [
            "superadmin",
            "super_admin",
            "superadministrator"
        ].includes(value)
    ) {

        return "superadmin";

    }


    return "";

}


/* ============================================================
   ROLE FROM URL
============================================================ */

function getUrlRole() {

    try {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return normalizeRole(
            params.get("role")
        );

    } catch (error) {

        console.warn(
            "RiderX role URL read failed:",
            error
        );

        return "";

    }

}


/* ============================================================
   SELECTED ROLE
============================================================ */

function getSelectedRole() {

    const urlRole =
        getUrlRole();


    if (
        urlRole === "customer" ||
        urlRole === "rider"
    ) {

        return urlRole;

    }


    try {

        const stored =
            normalizeRole(
                localStorage.getItem(
                    STORAGE.selectedRole
                )
            );

        if (
            stored === "customer" ||
            stored === "rider"
        ) {

            return stored;

        }

    } catch (error) {

        console.warn(
            "RiderX selected role read failed:",
            error
        );

    }


    return "";

}


/* ============================================================
   SAVE ROLE
============================================================ */

function saveSelectedRole(role) {

    const normalized =
        normalizeRole(role);


    if (
        normalized !== "customer" &&
        normalized !== "rider"
    ) {

        return;

    }


    try {

        localStorage.setItem(
            STORAGE.selectedRole,
            normalized
        );

        localStorage.setItem(
            STORAGE.legacyRole,
            normalized
        );

    } catch (error) {

        console.warn(
            "RiderX role save failed:",
            error
        );

    }

}


/* ============================================================
   MESSAGE
============================================================ */

function showMessage(
    text,
    type = "error"
) {

    const value =
        clean(text);


    if (!value) {

        hideMessage();

        return;

    }


    message.textContent =
        value;

    message.className =
        "message show " +
        (
            type === "success"
                ? "success"
                : "error"
        );

}


function hideMessage() {

    message.textContent =
        "";

    message.className =
        "message";

}


/* ============================================================
   LOADING
============================================================ */

function setLoading(
    loading,
    title,
    text
) {

    loginBusy =
        Boolean(loading);


    loginBtn.disabled =
        Boolean(loading);

    emailInput.disabled =
        Boolean(loading);

    passwordInput.disabled =
        Boolean(loading);

    forgotPasswordBtn.disabled =
        Boolean(loading);

    registerBtn.disabled =
        Boolean(loading);

    changeRoleBtn.disabled =
        Boolean(loading);


    if (loading) {

        loadingTitle.textContent =
            title ||
            "Please wait...";

        loadingText.textContent =
            text ||
            "Processing your RiderX request";

        loadingOverlay.classList.add(
            "show"
        );

        loadingOverlay.setAttribute(
            "aria-hidden",
            "false"
        );

    } else {

        loadingOverlay.classList.remove(
            "show"
        );

        loadingOverlay.setAttribute(
            "aria-hidden",
            "true"
        );

    }

}


/* ============================================================
   DASHBOARD ROUTE
============================================================ */

function routeForRole(role) {

    const normalized =
        normalizeRole(role);


    if (
        normalized === "customer"
    ) {

        return ROUTES.customer;

    }


    if (
        normalized === "rider"
    ) {

        return ROUTES.rider;

    }


    if (
        normalized === "admin" ||
        normalized === "superadmin"
    ) {

        return ROUTES.admin;

    }


    return "";

}


/* ============================================================
   NAVIGATION
============================================================ */

function goToRolePage() {

    /*
     * This is the ONLY normal navigation from login.html
     * back to role.html.
     *
     * It is called only by:
     *
     * 1. Change
     * 2. Create account
     */

    window.location.replace(
        ROUTES.role
    );

}


function goToDashboard(role) {

    const target =
        routeForRole(role);


    if (!target) {

        throw new Error(
            "Your RiderX account role is not configured."
        );

    }


    /*
     * Direct dashboard navigation.
     *
     * NEVER send successful login to role.html.
     */

    window.location.replace(
        target
    );

}


/* ============================================================
   ROLE DISPLAY
============================================================ */

function renderSelectedRole() {

    const role =
        getSelectedRole();


    if (
        role === "customer"
    ) {

        selectedRoleText.textContent =
            "Customer";

        saveSelectedRole(
            "customer"
        );

        return;

    }


    if (
        role === "rider"
    ) {

        selectedRoleText.textContent =
            "Rider";

        saveSelectedRole(
            "rider"
        );

        return;

    }


    /*
     * If somebody directly opens login.html without selecting
     * a role, we still allow the page to remain visible.
     *
     * The actual Firestore role will be authoritative after
     * successful authentication.
     */

    selectedRoleText.textContent =
        "RiderX account";

}


/* ============================================================
   LOAD AUTH ENGINE
============================================================ */

async function loadAuthEngine() {

    if (
        RX_AUTH
    ) {

        return RX_AUTH;

    }


    if (
        window.RiderX &&
        window.RiderX.auth
    ) {

        RX_AUTH =
            window.RiderX.auth;

        return RX_AUTH;

    }


    /*
     * IMPORTANT:
     *
     * This import happens ONLY after an actual authentication
     * action.
     *
     * login.html startup no longer imports auth.js.
     */

    await import(
        "../js/auth.js"
    );


    if (
        !window.RiderX ||
        !window.RiderX.auth
    ) {

        throw new Error(
            "RiderX authentication engine is unavailable."
        );

    }


    RX_AUTH =
        window.RiderX.auth;


    return RX_AUTH;

}


/* ============================================================
   LOGIN
============================================================ */

async function handleLogin(event) {

    event.preventDefault();


    if (loginBusy) {

        return;

    }


    hideMessage();


    const email =
        clean(
            emailInput.value
        )
        .toLowerCase();


    const password =
        String(
            passwordInput.value || ""
        );


    if (!email) {

        showMessage(
            "Please enter your email address."
        );

        emailInput.focus();

        return;

    }


    if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
    ) {

        showMessage(
            "Please enter a valid email address."
        );

        emailInput.focus();

        return;

    }


    if (!password) {

        showMessage(
            "Please enter your password."
        );

        passwordInput.focus();

        return;

    }


    if (
        password.length < 6
    ) {

        showMessage(
            "Password must contain at least 6 characters."
        );

        passwordInput.focus();

        return;

    }


    try {

        setLoading(
            true,
            "Signing in...",
            "Checking your RiderX account"
        );


        /*
         * Auth engine is loaded ONLY now.
         */

        const auth =
            await loadAuthEngine();


        if (
            !auth ||
            typeof auth.loginEmail !==
                "function"
        ) {

            throw new Error(
                "RiderX login service is unavailable."
            );

        }


        /*
         * Firestore/Firebase role remains authoritative.
         *
         * Selected Customer/Rider role is NOT trusted
         * for authorization.
         */

        const result =
            await auth.loginEmail(
                email,
                password
            );


        if (!result) {

            throw new Error(
                "Login failed. Please try again."
            );

        }


        const role =
            normalizeRole(
                result.role ||
                result.user?.role ||
                (
                    typeof auth.getRole ===
                    "function"
                        ? auth.getRole()
                        : ""
                )
            );


        if (!role) {

            throw new Error(
                "Your RiderX account role could not be verified."
            );

        }


        /*
         * Store verified role.
         */

        try {

            localStorage.setItem(
                STORAGE.legacyRole,
                role
            );

        } catch (storageError) {

            console.warn(
                "RiderX verified role storage failed:",
                storageError
            );

        }


        /*
         * Remove stale selection.
         *
         * This is done AFTER successful authentication.
         */

        try {

            localStorage.removeItem(
                STORAGE.selectedRole
            );

        } catch (storageError) {

            console.warn(
                "RiderX selected-role cleanup failed:",
                storageError
            );

        }


        setLoading(
            true,
            "Login successful",
            "Opening your RiderX dashboard"
        );


        /*
         * Small delay is NOT used here.
         * Navigate immediately after verified login.
         */

        goToDashboard(
            role
        );

    } catch (error) {

        console.error(
            "RiderX login error:",
            error
        );


        setLoading(
            false
        );


        showMessage(
            clean(
                error?.message
            ) ||
            "Unable to login. Please try again."
        );

    }

}


/* ============================================================
   FORGOT PASSWORD
============================================================ */

async function handleForgotPassword() {

    if (loginBusy) {

        return;

    }


    hideMessage();


    const email =
        clean(
            emailInput.value
        )
        .toLowerCase();


    if (!email) {

        showMessage(
            "Enter your email address first."
        );

        emailInput.focus();

        return;

    }


    if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(email)
    ) {

        showMessage(
            "Please enter a valid email address."
        );

        emailInput.focus();

        return;

    }


    try {

        setLoading(
            true,
            "Sending reset link...",
            "Please wait"
        );


        const auth =
            await loadAuthEngine();


        if (
            !auth ||
            typeof auth.resetPassword !==
                "function"
        ) {

            throw new Error(
                "Password reset service is unavailable."
            );

        }


        await auth.resetPassword(
            email
        );


        setLoading(
            false
        );


        showMessage(
            "Password reset email sent. Please check your inbox.",
            "success"
        );

    } catch (error) {

        console.error(
            "RiderX password reset error:",
            error
        );


        setLoading(
            false
        );


        showMessage(
            clean(
                error?.message
            ) ||
            "Unable to send password reset email."
        );

    }

}


/* ============================================================
   PASSWORD TOGGLE
============================================================ */

function togglePassword() {

    const showing =
        passwordInput.type ===
        "text";


    passwordInput.type =
        showing
            ? "password"
            : "text";


    passwordToggle.textContent =
        showing
            ? "SHOW"
            : "HIDE";


    passwordToggle.setAttribute(
        "aria-label",
        showing
            ? "Show password"
            : "Hide password"
    );

}


/* ============================================================
   EVENTS
============================================================ */

loginForm.addEventListener(
    "submit",
    handleLogin
);


forgotPasswordBtn.addEventListener(
    "click",
    handleForgotPassword
);


passwordToggle.addEventListener(
    "click",
    togglePassword
);


changeRoleBtn.addEventListener(
    "click",
    function () {

        if (loginBusy) {

            return;

        }


        /*
         * Explicit user action.
         */

        try {

            localStorage.removeItem(
                STORAGE.selectedRole
            );

        } catch (error) {

            console.warn(
                "RiderX selected-role cleanup failed:",
                error
            );

        }


        goToRolePage();

    }
);


registerBtn.addEventListener(
    "click",
    function () {

        if (loginBusy) {

            return;

        }


        /*
         * Registration starts from the role selector.
         */

        try {

            localStorage.removeItem(
                STORAGE.selectedRole
            );

        } catch (error) {

            console.warn(
                "RiderX role cleanup failed:",
                error
            );

        }


        goToRolePage();

    }
);


/* ============================================================
   AUTH EVENTS
============================================================

   These listeners are intentionally passive.

   They do NOT redirect signed-out users to role.html.

   This page must remain stable until the user explicitly
   changes role or completes login.
============================================================ */

window.addEventListener(
    "riderx-auth-signed-in",
    function (event) {

        if (loginBusy) {

            return;

        }


        const role =
            normalizeRole(
                event.detail?.role
            );


        if (!role) {

            return;

        }


        /*
         * Only a verified signed-in event can send the user
         * to a dashboard.
         */

        goToDashboard(
            role
        );

    }
);


window.addEventListener(
    "riderx-auth-auth-error",
    function (event) {

        if (loginBusy) {

            return;

        }


        const error =
            event.detail?.error;


        if (
            error?.message
        ) {

            showMessage(
                error.message
            );

        }

    }
);


/* ============================================================
   STARTUP
============================================================ */

(function init() {

    /*
     * IMPORTANT:
     *
     * No auth.js import here.
     * No Firebase session check here.
     * No automatic redirect here.
     *
     * Therefore login.html cannot jump back to role.html
     * merely because Firebase reports signed-out state.
     */

    renderSelectedRole();

    hideMessage();

    setLoading(
        false
    );


    /*
     * Make the email field immediately usable.
     */

    window.setTimeout(
        function () {

            if (
                !emailInput.disabled
            ) {

                emailInput.focus();

            }

        },
        50
    );


    /*
     * Public diagnostic object.
     */

    window.RiderXLogin =
        Object.freeze({

            getSelectedRole,
            normalizeRole,
            loadAuthEngine

        });

})();

</script>
