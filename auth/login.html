<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#FFD400"
>

<meta
    name="description"
    content="Login to RiderX"
>

<title>RiderX - Login</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<link
    rel="stylesheet"
    href="../css/auth.css"
>

<link
    rel="stylesheet"
    href="../css/responsive.css"
>

<style>

:root{
    --rx-yellow:#FFD400;
    --rx-yellow-dark:#E6BD00;
    --rx-black:#050505;
    --rx-card:#111111;
    --rx-border:rgba(255,212,0,.18);
    --rx-text:#fff;
    --rx-muted:#9B9B9B;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
    background:var(--rx-black);
    color:var(--rx-text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.login-page{
    width:100%;
    min-height:100vh;
    min-height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;

    position:relative;
    overflow:hidden;
}

.login-page::before,
.login-page::after{
    content:"";
    position:absolute;

    border-radius:50%;
    filter:blur(80px);

    pointer-events:none;
}

.login-page::before{
    width:360px;
    height:360px;

    top:-160px;
    left:-120px;

    background:rgba(255,212,0,.08);
}

.login-page::after{
    width:320px;
    height:320px;

    right:-120px;
    bottom:-160px;

    background:rgba(255,212,0,.06);
}

.login-card{
    position:relative;
    z-index:2;

    width:100%;
    max-width:440px;

    padding:30px 24px 24px;

    border:1px solid var(--rx-border);
    border-radius:26px;

    background:
        linear-gradient(
            145deg,
            rgba(25,25,25,.98),
            rgba(10,10,10,.98)
        );

    box-shadow:
        0 25px 80px rgba(0,0,0,.65);
}

.logo-area{
    text-align:center;
    margin-bottom:24px;
}

.logo{
    width:68px;
    height:68px;

    margin:0 auto 14px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:var(--rx-yellow);
    color:#000;

    font-size:28px;
    font-weight:900;
}

.logo-title{
    margin:0;

    font-size:27px;
    font-weight:900;
}

.logo-title span{
    color:var(--rx-yellow);
}

.logo-subtitle{
    margin:7px 0 0;

    color:var(--rx-muted);
    font-size:14px;
}

.selected-role{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;

    padding:12px 14px;
    margin-bottom:18px;

    border-radius:14px;

    background:rgba(255,212,0,.06);
    border:1px solid rgba(255,212,0,.14);
}

.selected-role-left{
    display:flex;
    align-items:center;
    gap:10px;

    min-width:0;
}

.role-icon{
    width:34px;
    height:34px;

    flex:0 0 34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:var(--rx-yellow);
    color:#000;

    font-weight:900;
}

.role-label{
    color:var(--rx-muted);
    font-size:12px;
}

.role-value{
    font-size:14px;
    font-weight:800;
    text-transform:capitalize;
}

.change-role{
    border:0;
    background:transparent;

    color:var(--rx-yellow);

    font-size:12px;
    font-weight:700;

    cursor:pointer;
    padding:8px 4px;
}

.login-methods{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-bottom:18px;
}

.method-btn{
    border:1px solid #2A2A2A;

    background:#151515;
    color:#AAA;

    padding:11px 10px;

    border-radius:12px;

    font-weight:700;

    cursor:pointer;
}

.method-btn.active{
    background:var(--rx-yellow);
    color:#000;
    border-color:var(--rx-yellow);
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    color:#D5D5D5;

    font-size:13px;
    font-weight:700;
}

.input-wrap{
    position:relative;
}

.form-input{
    width:100%;
    height:50px;

    border:1px solid #2B2B2B;
    border-radius:13px;

    outline:none;

    background:#0B0B0B;
    color:#FFF;

    padding:0 14px;

    font-size:15px;
}

.form-input:focus{
    border-color:var(--rx-yellow);

    box-shadow:
        0 0 0 3px
        rgba(255,212,0,.08);
}

.form-input::placeholder{
    color:#666;
}

.password-toggle{
    position:absolute;

    top:50%;
    right:12px;

    transform:translateY(-50%);

    border:0;
    background:transparent;

    color:#999;

    cursor:pointer;

    font-size:12px;
    font-weight:700;
}

.forgot-row{
    display:flex;
    justify-content:flex-end;

    margin-top:-4px;
    margin-bottom:18px;
}

.forgot-btn{
    border:0;
    background:transparent;

    color:var(--rx-yellow);

    cursor:pointer;

    font-size:13px;
    font-weight:700;
}

.primary-btn{
    width:100%;
    min-height:52px;

    border:0;
    border-radius:14px;

    background:var(--rx-yellow);
    color:#000;

    font-size:16px;
    font-weight:900;

    cursor:pointer;
}

.primary-btn:hover{
    background:#FFE45C;
}

.primary-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.divider{
    display:flex;
    align-items:center;

    gap:12px;

    color:#777;
    font-size:12px;

    margin:20px 0;
}

.divider::before,
.divider::after{
    content:"";

    height:1px;

    background:#272727;

    flex:1;
}

.phone-section{
    display:none;
}

.phone-section.active{
    display:block;
}

.email-section.hidden{
    display:none;
}

.phone-step.hidden{
    display:none;
}

.otp-section{
    display:none;
}

.otp-section.active{
    display:block;
}

.otp-input{
    text-align:center;

    letter-spacing:8px;

    font-size:20px;
    font-weight:800;
}

.otp-help{
    color:var(--rx-muted);

    font-size:12px;

    line-height:1.5;

    margin-top:9px;
}

.message{
    display:none;

    padding:12px 14px;

    border-radius:12px;

    margin-bottom:15px;

    font-size:13px;

    line-height:1.45;
}

.message.show{
    display:block;
}

.message.error{
    color:#FFD5D5;

    background:rgba(255,77,77,.10);

    border:1px solid rgba(255,77,77,.25);
}

.message.success{
    color:#D9FFE9;

    background:rgba(66,211,146,.10);

    border:1px solid rgba(66,211,146,.22);
}

.register-text{
    text-align:center;

    margin-top:22px;

    color:var(--rx-muted);

    font-size:13px;
}

.register-btn{
    border:0;
    background:transparent;

    color:var(--rx-yellow);

    font-weight:800;

    cursor:pointer;
}

.loading-overlay{
    display:none;

    position:fixed;
    inset:0;

    z-index:1000;

    background:rgba(0,0,0,.78);

    backdrop-filter:blur(7px);

    align-items:center;
    justify-content:center;
}

.loading-overlay.show{
    display:flex;
}

.loading-box{
    width:min(88%,330px);

    padding:26px;

    border-radius:20px;

    background:#121212;

    border:1px solid rgba(255,212,0,.18);

    text-align:center;
}

.spinner{
    width:42px;
    height:42px;

    border-radius:50%;

    border:4px solid #333;

    border-top-color:var(--rx-yellow);

    animation:rxspin .8s linear infinite;

    margin:0 auto 16px;
}

@keyframes rxspin{
    to{
        transform:rotate(360deg);
    }
}

.loading-text{
    color:#fff;

    font-weight:700;
    font-size:14px;
}

.back-btn{
    width:100%;

    margin-top:12px;

    height:45px;

    border-radius:12px;

    border:1px solid #292929;

    background:#151515;
    color:#AAA;

    font-weight:700;

    cursor:pointer;
}

@media(max-width:480px){

    .login-page{
        padding:12px;

        align-items:flex-start;
        padding-top:24px;
    }

    .login-card{
        border-radius:22px;
        padding:25px 18px 20px;
    }

    .logo-title{
        font-size:24px;
    }
}

</style>

</head>

<body>

<div class="login-page">

<main class="login-card">

<div class="logo-area">

<div
    class="logo"
    aria-hidden="true"
>
    RX
</div>

<h1 class="logo-title">
    Rider<span>X</span>
</h1>

<p class="logo-subtitle">
    Login to continue your journey
</p>

</div>


<div class="selected-role">

<div class="selected-role-left">

<div
    class="role-icon"
    id="roleIcon"
>
    C
</div>

<div>

<div class="role-label">
    Signing in as
</div>

<div
    class="role-value"
    id="selectedRoleText"
>
    Customer
</div>

</div>

</div>

<button
    type="button"
    class="change-role"
    id="changeRoleBtn"
>
    Change
</button>

</div>


<div
    id="message"
    class="message"
    role="alert"
    aria-live="polite"
></div>


<div class="login-methods">

<button
    type="button"
    class="method-btn active"
    id="emailMethodBtn"
>
    Email
</button>

<button
    type="button"
    class="method-btn"
    id="phoneMethodBtn"
>
    Phone OTP
</button>

</div>


<section
    id="emailSection"
    class="email-section"
>

<form
    id="emailLoginForm"
    novalidate
>

<div class="form-group">

<label for="email">
    Email
</label>

<input
    id="email"
    name="email"
    class="form-input"
    type="email"
    autocomplete="email"
    placeholder="Enter your email"

>

</div>


<div class="form-group">

<label for="password">
    Password
</label>

<div class="input-wrap">

<input
    id="password"

    class="form-input"

>

<button

</div>

</div>


<div class="forgot-row">

<button
    type="button"

>
    Forgot password?
</button>

</div>


<button
    type="submit"
    class="primary-btn"
    id="emailLoginBtn"
>
    Login
</button>

</form>

</section>


<section

>

>

<input
    id="phone"

<div

<div

<button

<button

    Change number

</div>

</section>


<div class="divider">
    <span>RiderX</span>
</div>


<div class="register-text">

Don't have an account?

<button
    type="button"
    class="register-btn"

>
    Create account
</button>

</div>

</main>

</div>


<div
    class="loading-overlay"
    id="loadingOverlay"
    aria-hidden="true"
>

<div class="loading-box">

<div class="spinner"></div>

<div
    class="loading-text"
    id="loadingText"
>
    Please wait...
</div>

</div>

</div>


<script type="module" src="../js/auth.js"></script>


<script>

"use strict";


/*
===========================================================
RIDERX LOGIN CONTROLLER
===========================================================

IMPORTANT FLOW:

role.html
   ↓
login.html?role=customer
OR
login.html?role=rider
   ↓
Firebase login
   ↓
Firestore role verification
   ↓
customer/home.html
OR
rider/home.html

IMPORTANT:

The URL role is authoritative for this login page.

We DO NOT redirect to role.html merely because
localStorage is unavailable or empty.

===========================================================
*/


(function(){

const ROLE_KEY =
    "riderx_selected_role";

const LEGACY_ROLE_KEY =
    "riderx_role";

const ROUTES = {

    role:
        "./role.html",

    customer:
        "../customer/home.html",

    rider:
        "../rider/home.html",

    admin:
        "../admin/dashboard.html"

};


const $ = function(selector){

    return document.querySelector(selector);

};


const messageBox =
    $("#message");

const loadingOverlay =
    $("#loadingOverlay");

const loadingText =
    $("#loadingText");

const emailLoginBtn =
    $("#emailLoginBtn");

const sendOtpBtn =
    $("#sendOtpBtn");

const verifyOtpBtn =
    $("#verifyOtpBtn");


let loginBusy = false;


/* ========================================================
   ROLE NORMALIZATION
======================================================== */

function normalizeRole(role){

    const value =
        String(role ?? "")
            .trim()
            .toLowerCase()
            .replace(/[\s-]+/g,"_");


    if([
        "customer",
        "customers",
        "user",
        "users"
    ].includes(value)){

        return "customer";

    }


    if([
        "rider",
        "riders",
        "driver",
        "drivers",
        "partner",
        "driver_partner",
        "driverpartner",
        "captain"
    ].includes(value)){

        return "rider";

    }


    if([
        "admin",
        "administrator"
    ].includes(value)){

        return "admin";

    }


    if([
        "superadmin",
        "super_admin",
        "superadministrator"
    ].includes(value)){

        return "superadmin";

    }


    return "";

}


/* ========================================================
   SAFE STORAGE
======================================================== */

function readStorage(key){

    try{

        return localStorage.getItem(key) || "";

    }catch(error){

        console.warn(
            "RiderX localStorage read failed:",
            error
        );

        return "";

    }

}


function writeStorage(
    key,
    value
){

    try{

        localStorage.setItem(
            key,
            value
        );

        return true;

    }catch(error){

        console.warn(
            "RiderX localStorage write failed:",
            error
        );

        return false;

    }

}


function saveRole(role){

    const normalized =
        normalizeRole(role);


    if(!normalized){

        return false;

    }


    writeStorage(
        ROLE_KEY,
        normalized
    );

    writeStorage(
        LEGACY_ROLE_KEY,
        normalized
    );


    return true;

}


/* ========================================================
   CRITICAL ROLE RESOLUTION
======================================================== */

function getUrlRole(){

    try{

        const params =
            new URLSearchParams(
                window.location.search
            );


        return normalizeRole(
            params.get("role")
        );

    }catch(error){

        console.warn(
            "RiderX URL role read failed:",
            error
        );

        return "";

    }

}


function getStoredRole(){

    return normalizeRole(
        readStorage(ROLE_KEY)
        ||
        readStorage(LEGACY_ROLE_KEY)
    );

}


/*
------------------------------------------------------------
THIS FIX PREVENTS THE LOOP.

Priority:

1. URL role
2. stored role
3. otherwise no role

If URL contains:

login.html?role=customer

we NEVER redirect to role.html because localStorage
is empty.
------------------------------------------------------------
*/

function resolveLoginRole(){

    const urlRole =
        getUrlRole();


    if(
        urlRole === "customer" ||
        urlRole === "rider"
    ){

        saveRole(urlRole);

        return urlRole;

    }


    const storedRole =
        getStoredRole();


    if(
        storedRole === "customer" ||
        storedRole === "rider"
    ){

        return storedRole;

    }


    return "";

}


/* ========================================================
   MESSAGE
======================================================== */

function clearMessage(){

    if(!messageBox){
        return;
    }


    messageBox.textContent =
        "";

    messageBox.className =
        "message";

}


function showMessage(
    text,
    type = "error"
){

    if(!messageBox){
        return;
    }


    const value =
        String(text || "").trim();


    if(!value){

        clearMessage();

        return;

    }


    messageBox.textContent =
        value;

    messageBox.className =
        "message show " +
        (
            type === "success"
                ? "success"
                : "error"
        );

}


/* ========================================================
   LOADING
======================================================== */

function setLoading(
    state,
    text
){

    if(loadingOverlay){

        loadingOverlay.classList.toggle(
            "show",
            Boolean(state)
        );

        loadingOverlay.setAttribute(
            "aria-hidden",
            state ? "false" : "true"
        );

    }


    if(loadingText){

        loadingText.textContent =
            text ||
            "Please wait...";

    }


    [
        emailLoginBtn,
        sendOtpBtn,
        verifyOtpBtn
    ].forEach(function(button){

        if(button){

            button.disabled =
                Boolean(state);

        }

    });

}


/* ========================================================
   ROLE UI
======================================================== */

function updateRoleUI(role){

    const normalized =
        normalizeRole(role);


    const roleText =
        $("#selectedRoleText");

    const roleIcon =
        $("#roleIcon");


    if(normalized === "rider"){

        if(roleText){
            roleText.textContent =
                "Rider";
        }

        if(roleIcon){
            roleIcon.textContent =
                "R";
        }

        return;

    }


    if(normalized === "customer"){

        if(roleText){
            roleText.textContent =
                "Customer";
        }

        if(roleIcon){
            roleIcon.textContent =
                "C";
        }

        return;

    }


    if(
        normalized === "admin" ||
        normalized === "superadmin"
    ){

        if(roleText){
            roleText.textContent =
                "Admin";
        }

        if(roleIcon){
            roleIcon.textContent =
                "A";
        }

    }

}


/* ========================================================
   ROUTING
======================================================== */

function getDashboard(role){

    const normalized =
        normalizeRole(role);


    return ROUTES[normalized] || "";

}


function goToDashboard(role){

    const normalized =
        normalizeRole(role);


    const destination =
        getDashboard(normalized);


    if(!destination){

        throw new Error(
            "Your RiderX account role is not configured."
        );

    }


    window.location.replace(
        destination
    );

}


/* ========================================================
   AUTH ENGINE
======================================================== */

async function getAuthEngine(){

    const start =
        Date.now();

    const timeout =
        15000;


    while(
        Date.now() - start <
        timeout
    ){

        if(
            window.RiderX &&
            window.RiderX.auth
        ){

            const auth =
                window.RiderX.auth;


            if(
                typeof auth.waitForAuth ===
                "function"
            ){

                try{

                    await auth.waitForAuth(
                        12000
                    );

                }catch(error){

                    console.warn(
                        "RiderX auth readiness warning:",
                        error
                    );

                }

            }


            return auth;

        }


        await new Promise(
            function(resolve){

                setTimeout(
                    resolve,
                    50
                );

            }
        );

    }


    throw new Error(
        "RiderX authentication engine is unavailable. Please refresh and try again."
    );

}


/* ========================================================
   INITIALIZE
======================================================== */

async function initializeLoginPage(){

    /*
     * CRITICAL:
     *
     * Resolve role BEFORE auth initialization.
     */

    const selectedRole =
        resolveLoginRole();


    if(!selectedRole){

        /*
         * Only now do we go back to role.html.
         *
         * This means login.html without a valid role
         * cannot silently select an incorrect account type.
         */

        window.location.replace(
            ROUTES.role
        );

        return;

    }


    updateRoleUI(
        selectedRole
    );


    clearMessage();


    try{

        const auth =
            await getAuthEngine();


        /*
         * Existing Firebase session.
         *
         * If auth.js already resolved the account role,
         * go directly to that dashboard.
         */

        const firebaseUser =
            auth?.state?.firebaseUser;


        const firebaseRole =
            normalizeRole(
                auth?.state?.role ||
                (
                    typeof auth?.getRole ===
                    "function"
                        ? auth.getRole()
                        : ""
                )
            );


        if(
            firebaseUser?.uid &&
            firebaseRole
        ){

            /*
             * Never trust a different local role over the
             * actual Firebase/Firestore account role.
             */

            if(
                firebaseRole === "customer" ||
                firebaseRole === "rider" ||
                firebaseRole === "admin" ||
                firebaseRole === "superadmin"
            ){

                saveRole(
                    firebaseRole
                );

                updateRoleUI(
                    firebaseRole
                );

                goToDashboard(
                    firebaseRole
                );

                return;

            }

        }

    }catch(error){

        console.error(
            "RiderX login initialization error:",
            error
        );


        /*
         * DO NOT redirect to role.html here.
         *
         * The user is already on the correct login page.
         */

        showMessage(
            error?.message ||
            "Authentication service is temporarily unavailable. Please refresh."
        );

    }

}


/* ========================================================
   EMAIL LOGIN
======================================================== */

async function loginWithEmail(){

    if(loginBusy){
        return;
    }


    clearMessage();


    const selectedRole =
        resolveLoginRole();


    if(
        selectedRole !== "customer" &&
        selectedRole !== "rider"
    ){

        showMessage(
            "Please select Customer or Rider first."
        );

        return;

    }


    const email =
        String(
            $("#email")?.value || ""
        )
        .trim()
        .toLowerCase();


    const password =
        String(
            $("#password")?.value || ""
        );


    if(!email){

        showMessage(
            "Please enter your email."
        );

        $("#email")?.focus();

        return;

    }


    if(!password){

        showMessage(
            "Please enter your password."
        );

        $("#password")?.focus();

        return;

    }


    loginBusy = true;


    setLoading(
        true,
        "Signing you in..."
    );


    try{

        const auth =
            await getAuthEngine();


        if(
            typeof auth.loginEmail !==
            "function"
        ){

            throw new Error(
                "RiderX email authentication service is unavailable."
            );

        }


        const result =
            await auth.loginEmail(
                email,
                password
            );


        const actualRole =
            normalizeRole(
                result?.role ||
                auth?.state?.role ||
                (
                    typeof auth.getRole ===
                    "function"
                        ? auth.getRole()
                        : ""
                )
            );


        if(
            actualRole !== "customer" &&
            actualRole !== "rider" &&
            actualRole !== "admin" &&
            actualRole !== "superadmin"
        ){

            throw new Error(
                "Your RiderX account role is not configured."
            );

        }


        saveRole(
            actualRole
        );


        updateRoleUI(
            actualRole
        );


        goToDashboard(
            actualRole
        );

    }catch(error){

        console.error(
            "RiderX email login failed:",
            error
        );


        showMessage(
            error?.message ||
            "Login failed. Please check your email and password."
        );

    }finally{

        loginBusy = false;

        setLoading(
            false
        );

    }

}

/* ========================================================
   METHOD SWITCH
======================================================== */

function switchMethod(method){

    const emailMode =
        method === "email";


    $("#emailMethodBtn")
        ?.classList.toggle(
            "active",
            emailMode
        );


    $("#phoneMethodBtn")
        ?.classList.toggle(
            "active",
            !emailMode
        );


    $("#emailSection")
        ?.classList.toggle(
            "hidden",
            !emailMode
        );


    $("#phoneSection")
        ?.classList.toggle(
            "active",
            !emailMode
        );


    clearMessage();


    if(emailMode){

        $("#email")?.focus();

    }else{

        $("#phone")?.focus();

    }

}


/* ========================================================
   PHONE RESET
======================================================== */

function resetPhoneStep(){

    $("#otpStep")
        ?.classList.remove(
            "active"
        );


    $("#phoneStep")
        ?.classList.remove(
            "hidden"
        );


    if($("#otp")){

        $("#otp").value = "";

    }


    clearMessage();

}


/* ========================================================
   CHANGE ROLE
======================================================== */

function changeRole(){

    /*
     * Explicit user action only.
     */

    try{

        localStorage.removeItem(
            ROLE_KEY
        );

        localStorage.removeItem(
            LEGACY_ROLE_KEY
        );

    }catch(error){

        console.warn(
            "RiderX role cleanup failed:",
            error
        );

    }


    window.location.replace(
        ROUTES.role
    );

}


/* ========================================================
   REGISTER
======================================================== */

function openRegister(){

    const role =
        resolveLoginRole();


    if(
        role === "customer" ||
        role === "rider"
    ){

        saveRole(
            role
        );

    }


    window.location.replace(
        "./register.html"
    );

}


/* ========================================================
   PASSWORD TOGGLE
======================================================== */

function togglePassword(){

    const input =
        $("#password");

    const button =
        $("#passwordToggle");


    if(
        !input ||
        !button
    ){

        return;

    }


    const visible =
        input.type === "text";


    input.type =
        visible
            ? "password"
            : "text";


    button.textContent =
        visible
            ? "SHOW"
            : "HIDE";

}


/* ========================================================
   INPUT SANITIZATION
======================================================== */

function sanitizeOtp(){

    const input =
        $("#otp");


    if(!input){
        return;
    }


    input.value =
        input.value
            .replace(/\D/g,"")
            .slice(0,6);

}


function sanitizePhone(){

    const input =
        $("#phone");


    if(!input){
        return;
    }


    input.value =
        input.value
            .replace(/[^\d+]/g,"");

}


/* ========================================================
   EVENTS
======================================================== */

function bindEvents(){

    $("#emailLoginForm")
        ?.addEventListener(
            "submit",
            function(event){

                event.preventDefault();

                loginWithEmail();

            }
        );


    $("#emailMethodBtn")
        ?.addEventListener(
            "click",
            function(){

                switchMethod("email");

            }
        );


    $("#phoneMethodBtn")
        ?.addEventListener(
            "click",
            function(){

                switchMethod("phone");

            }
        );


    $("#passwordToggle")
        ?.addEventListener(
            "click",
            togglePassword
        );


    $("#forgotPasswordBtn")
        ?.addEventListener(
            "click",
            resetPassword
        );


    $("#sendOtpBtn")
        ?.addEventListener(
            "click",
            sendOtp
        );


    $("#verifyOtpBtn")
        ?.addEventListener(
            "click",
            verifyOtp
        );


    $("#changePhoneBtn")
        ?.addEventListener(
            "click",
            resetPhoneStep
        );


    $("#changeRoleBtn")
        ?.addEventListener(
            "click",
            changeRole
        );


    $("#registerBtn")
        ?.addEventListener(
            "click",
            openRegister
        );


    $("#otp")
        ?.addEventListener(
            "input",
            sanitizeOtp
        );


    $("#phone")
        ?.addEventListener(
            "input",
            sanitizePhone
        );


    $("#password")
        ?.addEventListener(
            "keydown",
            function(event){

                if(event.key === "Enter"){

                    event.preventDefault();

                    loginWithEmail();

                }

            }
        );

}


/* ========================================================
   START
======================================================== */

function start(){

    /*
     * Resolve URL role FIRST.
     *
     * login.html?role=customer
     * login.html?role=rider
     *
     * will now stay on login.html.
     */

    const role =
        resolveLoginRole();


    if(!role){

        window.location.replace(
            ROUTES.role
        );

        return;

    }


    updateRoleUI(
        role
    );


    bindEvents();


    initializeLoginPage();

}


if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        start,
        {
            once:true
        }
    );

}else{

    start();

}

})();

</script>
