><style>

:root{
    --rx-yellow:#FFD400;
    --rx-yellow-dark:#e5bd00;
    --rx-black:#050505;
    --rx-card:#111111;
    --rx-card-2:#181818;
    --rx-border:#292929;
    --rx-text:#ffffff;
    --rx-muted:#9b9b9b;
    --rx-danger:#ff4d4d;
    --rx-success:#28d17c;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at top,
            rgba(255,212,0,.10),
            transparent 35%

        var(--rx-black);
    color:var(--rx-text);
    font-family:
        Inter,

}

button,
input{
    font:inherit;
}

button{
    border:0;
}

.rx-page{
    min-height:100vh;

    justify-content:center;
    padding:24px 16px;
}

.rx-login-wrap{
    width:100%;
    max-width:430px;
}

.rx-brand{
    text-align:center;
    margin-bottom:22px;
}

.rx-logo{
    width:70px;
    height:70px;
    margin:0 auto 12px;
    border-radius:20px;
    background:var(--rx-yellow);
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:900;
    box-shadow:
        0 12px 35px rgba(255,212,0,.20);
}

.rx-brand h1{
    margin:0;
    font-size:28px;
    font-weight:900;
    letter-spacing:-.5px;
}

.rx-brand p{
    margin:6px 0 0;
    color:var(--rx-muted);
    font-size:14px;
}

.rx-card{
    width:100%;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.015)
        ),
        var(--rx-card);
    border:1px solid var(--rx-border);
    border-radius:24px;
    padding:24px;
    box-shadow:

.rx-role-title{
    text-align:center;

    color:#ddd;
    font-size:13px;
}

.rx-role-row{

    gap:10px;
    margin-bottom:22px;
}

.rx-role{
    min-height:52px;
    border:1px solid var(--rx-border);
    border-radius:14px;
    background:#0d0d0d;
    color:#aaa;
    cursor:pointer;
    font-weight:800;
    transition:.2s ease;
}

.rx-role:hover{
    border-color:#555;
}

.rx-role.active{
    background:var(--rx-yellow);
    border-color:var(--rx-yellow);
    color:#000;
    box-shadow:
        0 7px 22px rgba(255,212,0,.16);
}

.rx-field{
    margin-bottom:15px;
}

.rx-field label{
    display:block;
    margin-bottom:7px;
    font-size:13px;

    color:#ddd;
}

.rx-input-wrap{
    position:relative;
}

.rx-input{
    width:100%;
    height:52px;
    padding:0 15px;
    border-radius:14px;
    border:1px solid var(--rx-border);
    outline:none;
    background:#0b0b0b;
    color:#fff;
    transition:.2s ease;
}

.rx-input::placeholder{
    color:#666;
}

.rx-input:focus{
    border-color:var(--rx-yellow);
    box-shadow:
        0 0 0 3px rgba(255,212,0,.08);
}

    right:8px;

}

.rx-password-toggle:hover{
    color:#fff;
    background:#191919;
}

.rx-forgot{
    text-align:right;
    margin-top:-5px;
    margin-bottom:18px;
}

.rx-forgot button{
    background:none;
    color:var(--rx-yellow);
    cursor:pointer;
    font-size:13px;
    font-weight:700;
}

.rx-login-btn{
    width:100%;
    min-height:54px;
    border-radius:15px;
    background:var(--rx-yellow);
    color:#000;
    cursor:pointer;
    font-size:16px;
    font-weight:900;
    transition:.2s ease;
}

.rx-login-btn:hover{
    background:#ffe047;
    transform:translateY(-1px);
}

.rx-login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.rx-message{
    display:none;
    margin-bottom:16px;
    padding:12px 13px;
    border-radius:12px;
    font-size:13px;
    line-height:1.45;
}

.rx-message.show{
    display:block;
}

.rx-message.error{
    background:rgba(255,77,77,.10);
    border:1px solid rgba(255,77,77,.30);
    color:#ff8b8b;
}

.rx-message.success{
    background:rgba(40,209,124,.10);
    border:1px solid rgba(40,209,124,.30);
    color:#70e6a8;
}

.rx-loading{
    display:none;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-top:13px;
    color:#aaa;
    font-size:13px;
}

.rx-loading.show{
    display:flex;
}

.rx-spinner{
    width:16px;
    height:16px;
    border-radius:50%;
    border:2px solid #444;
    border-top-color:var(--rx-yellow);
    animation:rxSpin .7s linear infinite;
}

@keyframes rxSpin{
    to{
        transform:rotate(360deg);
    }
}

.rx-register{
    text-align:center;
    margin-top:21px;
    padding-top:18px;
    border-top:1px solid #242424;
    color:#888;
    font-size:13px;
}

.rx-register button{
    background:none;
    color:var(--rx-yellow);
    cursor:pointer;
    font-weight:800;
}

.rx-footer{
    text-align:center;
    margin-top:18px;
    color:#555;
    font-size:11px;
}

.rx-back{
    display:block;
    width:max-content;
    margin:0 auto 16px;
    background:none;
    color:#888;
    cursor:pointer;
    font-size:13px;
}

.rx-back:hover{
    color:#fff;
}

@media(max-width:480px){

    .rx-page{
        padding:18px 12px;
    }

    .rx-card{
        padding:20px 16px;
        border-radius:20px;
    }

    .rx-brand h1{
        font-size:25px;
    }

}

</style></head><body><main class="rx-page"><section class="rx-login-wrap">

    <button

    </button>

    <div class="rx-brand">

        <div class="rx-logo">

        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your RiderX account
        </p>

    </div>

    <div class="rx-card">

        <div class="rx-role-title">
            Login as
        </div>

        <div class="rx-role-row">

            <button
                type="button"
                class="rx-role"
                data-role="customer"
                id="customerRoleBtn"
            >
                Customer
            </button>

            <button
                type="button"
                class="rx-role"
                data-role="rider"
                id="riderRoleBtn"
            >
                Rider
            </button>

        </div>

        <div
            class="rx-message"
            id="message"
        ></div>

        <form
            id="loginForm"

            <div class="rx-field">

                <label for="email">

                </label>

                <input
                    id="email"
                    class="rx-input"

            <div class="rx-field">

                <label for="password">

                </label>

                <div class="rx-input-wrap">

                    <input
                        id="password"

                        type="password"
                        autocomplete="current-password"

                        Show

            </button>

            </button>

        </div>

    </div>

    <div class="rx-footer">
        RiderX 2.0 • Secure Firebase Authentication
    </div>

</section>

</main><script type="module">

"use strict";

/* ============================================================
   RIDERX LOGIN PAGE
   Compatible with js/auth.js

   IMPORTANT:
   - auth.js is the single authentication engine.
   - Firebase is initialized by firebase/firebase-config.js.
   - This page NEVER trusts localStorage as authentication.
   - Firestore users/{uid}.role is resolved by auth.js.
============================================================ */

const STORAGE = {

    selectedRole:
        "riderx_selected_role",

    role:
        "riderx_role"

};

const ROUTES = {

    role:
        "auth/role.html",

    register:
        "auth/register.html",

    customer:
        "customer/home.html",

    rider:
        "rider/home.html",

    admin:
        "admin/dashboard.html"

};


function clean(value){

    return String(
        value ?? ""
    ).trim();

}


function normalizeRole(role){

    const value =
        clean(role)
            .toLowerCase()
            .replace(
                /[\s-]+/g,
                "_"
            );

    if(
        [
            "customer",
            "customers",
            "user",
            "users"
        ].includes(value)
    ){

        return "customer";

    }

    if(
        [
            "rider",
            "riders",
            "driver",
            "drivers",
            "partner",
            "driver_partner",
            "driverpartner",
            "captain"
        ].includes(value)
    ){

        return "rider";

    }

    if(
        [
            "admin",
            "administrator"
        ].includes(value)
    ){

        return "admin";

    }

    if(
        [
            "superadmin",
            "super_admin",
            "superadministrator"
        ].includes(value)
    ){

        return "superadmin";

    }

    return "";

}


function getRoot(){

    const pathname =
        window.location.pathname || "/";

    const folders = [
        "/auth/",
        "/customer/",
        "/rider/",
        "/admin/"
    ];

    for(
        const folder of folders
    ){

        const index =
            pathname.indexOf(folder);

        if(index !== -1){

            return pathname.slice(
                0,
                index
            );

        }

    }

    if(
        pathname.endsWith("/index.html")
    ){

        return pathname
            .slice(
                0,
                pathname.length -
                "index.html".length
            )
            .replace(
                /\/$/,
                ""
            );

    }

    return "";

}


function routeUrl(route){

    const path =
        clean(route)
            .replace(
                /^\/+/,
                ""
            );

    const root =
        getRoot();

    return (
        root
            ? root.replace(/\/+$/, "") + "/"
            : "/"
    ) + path;

}


function safeGet(key){

    try{

        return localStorage.getItem(key);

    }catch(error){

        return null;

    }

}


function safeSet(
    key,
    value
){

    try{

        localStorage.setItem(
            key,
            String(value)
        );

    }catch(error){

        console.warn(
            "RiderX localStorage unavailable:",
            error
        );

    }

}


const message =
    document.getElementById(
        "message"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const loginBtn =
    document.getElementById(
        "loginBtn"
    );

const loading =
    document.getElementById(
        "loading"
    );

const loadingText =
    document.getElementById(
        "loadingText"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const customerRoleBtn =
    document.getElementById(
        "customerRoleBtn"
    );

const riderRoleBtn =
    document.getElementById(
        "riderRoleBtn"
    );


let selectedRole =
    normalizeRole(
        safeGet(
            STORAGE.selectedRole
        )
    );


function showMessage(
    text,
    type = "error"
){

    message.textContent =
        clean(text);

    message.className =
        "rx-message show " +
        type;

}


function clearMessage(){

    message.textContent =
        "";

    message.className =
        "rx-message";

}


function setLoading(
    active,
    text = "Signing in..."
){

    loginBtn.disabled =
        active;

    loading.classList.toggle(
        "show",
        active
    );

    loadingText.textContent =
        text;

    customerRoleBtn.disabled =
        active;

    riderRoleBtn.disabled =
        active;

}


function setRole(
    role,
    save = true
){

    role =
        normalizeRole(role);

    if(
        ![
            "customer",
            "rider"
        ].includes(role)
    ){

        return;

    }

    selectedRole =
        role;

    customerRoleBtn.classList.toggle(
        "active",
        role === "customer"
    );

    riderRoleBtn.classList.toggle(
        "active",
        role === "rider"
    );

    if(save){

        safeSet(
            STORAGE.selectedRole,
            role
        );

    }

    clearMessage();

}


function redirectByRole(
    role
){

    role =
        normalizeRole(role);

    let target;

    if(
        role === "customer"
    ){

        target =
            ROUTES.customer;

    }else if(
        role === "rider"
    ){

        target =
            ROUTES.rider;

    }else if(
        role === "admin" ||
        role === "superadmin"
    ){

        target =
            ROUTES.admin;

    }else{

        target =
            ROUTES.role;

    }

    window.location.replace(
        routeUrl(target)
    );

}


function getAuthEngine(){

    const RX =
        window.RiderX;

    if(
        !RX ||
        !RX.auth
    ){

        return null;

    }

    return RX.auth;

}


/* ------------------------------------------------------------
   Wait until auth.js has loaded and initialized
------------------------------------------------------------ */

async function waitForAuthEngine(
    timeout = 10000
){

    const started =
        Date.now();

    while(
        Date.now() - started <
        timeout
    ){

        const AUTH =
            getAuthEngine();

        if(
            AUTH &&
            typeof AUTH.loginEmail ===
            "function"
        ){

            return AUTH;

        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    50
                )
        );

    }

    return null;

}


/* ------------------------------------------------------------
   ROLE BUTTONS
------------------------------------------------------------ */

customerRoleBtn.addEventListener(
    "click",
    function(){

        setRole(
            "customer"
        );

    }
);


riderRoleBtn.addEventListener(
    "click",
    function(){

        setRole(
            "rider"
        );

    }
);


/* ------------------------------------------------------------
   PASSWORD SHOW/HIDE
------------------------------------------------------------ */

document
    .getElementById(
        "passwordToggle"
    )
    .addEventListener(
        "click",
        function(){

            const visible =
                passwordInput.type ===
                "text";

            passwordInput.type =
                visible
                    ? "password"
                    : "text";

            this.textContent =
                visible
                    ? "Show"
                    : "Hide";

        }
    );


/* ------------------------------------------------------------
   LOGIN
------------------------------------------------------------ */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();

        const email =
            clean(
                emailInput.value
            ).toLowerCase();

        const password =
            String(
                passwordInput.value || ""
            );

        if(
            !selectedRole
        ){

            showMessage(
                "Please select Customer or Rider first."
            );

            return;

        }

        if(!email){

            showMessage(
                "Please enter your email address."
            );

            emailInput.focus();

            return;

        }

        if(!password){

            showMessage(
                "Please enter your password."
            );

            passwordInput.focus();

            return;

        }

        if(password.length < 6){

            showMessage(
                "Password must contain at least 6 characters."
            );

            passwordInput.focus();

            return;

        }

        setLoading(
            true,
            "Connecting to RiderX..."
        );

        try{

            const AUTH =
                await waitForAuthEngine();

            if(!AUTH){

                throw new Error(
                    "RiderX authentication engine is unavailable. Please refresh the page and try again."
                );

            }

            setLoading(
                true,
                "Signing in..."
            );

            /*
             * auth.js performs the REAL Firebase login
             * and resolves the REAL Firestore role.
             */

            const result =
                await AUTH.loginEmail(
                    email,
                    password
                );

            if(
                !result ||
                !result.user ||
                !result.role
            ){

                throw new Error(
                    "RiderX login completed but the account role could not be verified."
                );

            }

            const actualRole =
                normalizeRole(
                    result.role
                );

            /*
             * SECURITY:
             * Do not allow the selected UI role to override
             * Firestore's authoritative role.
             */

            if(
                actualRole !==
                selectedRole
            ){

                /*
                 * Authentication itself succeeded.
                 * The selected role was simply wrong.
                 * We redirect according to the real role.
                 */

                safeSet(
                    STORAGE.role,
                    actualRole
                );

                safeSet(
                    STORAGE.selectedRole,
                    actualRole
                );

                setLoading(
                    true,
                    "Account verified..."
                );

                setTimeout(
                    function(){

                        redirectByRole(
                            actualRole
                        );

                    },
                    150
                );

                return;

            }

            safeSet(
                STORAGE.role,
                actualRole
            );

            safeSet(
                STORAGE.selectedRole,
                actualRole
            );

            setLoading(
                true,
                "Login successful..."
            );

            setTimeout(
                function(){

                    redirectByRole(
                        actualRole
                    );

                },
                150
            );

        }catch(error){

            console.error(
                "RiderX login page error:",
                error
            );

            setLoading(
                false
            );

            showMessage(
                error?.message ||
                "Unable to login. Please try again."
            );

        }

    }
);


/* ------------------------------------------------------------
   FORGOT PASSWORD
------------------------------------------------------------ */

document
    .getElementById(
        "forgotPassword"
    )
    .addEventListener(
        "click",
        async function(){

            clearMessage();

            const email =
                clean(
                    emailInput.value
                ).toLowerCase();

            if(!email){

                showMessage(
                    "Enter your email first, then tap Forgot password."
                );

                emailInput.focus();

                return;

            }

            try{

                const AUTH =
                    await waitForAuthEngine();

                if(!AUTH){

                    throw new Error(
                        "RiderX authentication engine is unavailable."
                    );

                }

                this.disabled =
                    true;

                await AUTH.resetPassword(
                    email
                );

                showMessage(
                    "Password reset email sent. Please check your inbox.",
                    "success"
                );

            }catch(error){

                console.error(
                    "RiderX password reset error:",
                    error
                );

                showMessage(
                    error?.message ||
                    "Unable to send password reset email."
                );

            }finally{

                this.disabled =
                    false;

            }

        }
    );


/* ------------------------------------------------------------
   REGISTER
------------------------------------------------------------ */

document
    .getElementById(
        "registerBtn"
    )
    .addEventListener(
        "click",
        function(){

            if(
                selectedRole
            ){

                safeSet(
                    STORAGE.selectedRole,
                    selectedRole
                );

            }

            window.location.href =
                routeUrl(
                    ROUTES.register
                );

        }
    );


/* ------------------------------------------------------------
   BACK
------------------------------------------------------------ */

document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        function(){

            window.location.href =
                routeUrl(
                    ROUTES.role
                );

        }
    );


/* ------------------------------------------------------------
   AUTH EVENTS
------------------------------------------------------------ */

window.addEventListener(
    "riderx-auth-auth-error",
    function(event){

        const error =
            event.detail?.error;

        if(
            error &&
            !loginBtn.disabled
        ){

            showMessage(
                error.message ||
                "RiderX authentication error."
            );

        }

    }
);


/* ------------------------------------------------------------
   INITIAL ROLE
------------------------------------------------------------ */

if(
    selectedRole
){

    setRole(
        selectedRole,
        false
    );

}else{

    /*
     * Do NOT silently choose customer/rider.
     * User must choose the account type.
     */

    customerRoleBtn.classList.remove(
        "active"
    );

    riderRoleBtn.classList.remove(
        "active"
    );

}


/* ------------------------------------------------------------
   START AUTH ENGINE
------------------------------------------------------------ */

(async function(){

    try{

        const AUTH =
            await waitForAuthEngine(
                10000
            );

        if(!AUTH){

            console.error(
                "RiderX authentication engine is unavailable."
            );

            return;

        }

        /*
         * auth.js already auto-initializes itself.
         * We only wait for Firebase auth state here.
         */

        const firebaseUser =
            await AUTH.waitForAuth(
                10000
            );

        if(
            firebaseUser &&
            firebaseUser.uid
        ){

            const role =
                normalizeRole(
                    AUTH.getRole()
                );

            if(role){

                /*
                 * Existing authenticated session:
                 * go directly to the real role dashboard.
                 */

                safeSet(
                    STORAGE.role,
                    role
                );

                safeSet(
                    STORAGE.selectedRole,
                    role
                );

                redirectByRole(
                    role
                );

            }

        }

    }catch(error){

        console.warn(
            "RiderX login auth-state initialization warning:",
            error
        );

    }

})();

</script><!--
    IMPORTANT:
    auth.js is loaded AFTER the page markup so that:
    1. RiderX namespace is created.
    2. Firebase module is loaded by auth.js.
    3. Login handlers above can wait for RiderX.auth.
--><script
    type="module"
    src="../js/auth.js"
></script></body></html>
