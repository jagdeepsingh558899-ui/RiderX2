<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX secure customer and rider login"
    >

    <title>RiderX - Login</title>

    <!-- IMPORTANT:
         RiderX repository uses lowercase CSS filenames.
    -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #070707;
            color: #ffffff;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(2px);
        }

        .glow.one {
            width: 430px;
            height: 430px;
            top: -300px;
            right: -170px;
            background: rgba(255, 212, 0, .08);
        }

        .glow.two {
            width: 390px;
            height: 390px;
            bottom: -280px;
            left: -190px;
            background: rgba(255, 212, 0, .05);
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 455px;
            padding: 30px 23px 22px;
            border: 1px solid #292929;
            border-radius: 24px;
            background: #111111;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, .55);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: #ffd400;
            color: #090909;
            font-size: 24px;
            font-weight: 1000;
            box-shadow:
                0 10px 35px rgba(255, 212, 0, .12);
        }

        .brand h1 {
            margin: 0;
            font-size: 27px;
            font-weight: 1000;
            letter-spacing: -.6px;
        }

        .brand h1 span {
            color: #ffd400;
        }

        .brand p {
            margin: 6px 0 0;
            color: #777777;
            font-size: 9px;
        }

        .heading {
            text-align: center;
        }

        .heading h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
        }

        .heading p {
            margin: 7px auto 0;
            max-width: 340px;
            color: #777777;
            font-size: 9px;
            line-height: 1.6;
        }

        .role-box {
            margin-top: 22px;
        }

        .role-title {
            margin-bottom: 9px;
            color: #777777;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .role-btn {
            min-height: 50px;
            border: 1px solid #303030;
            border-radius: 11px;
            background: #171717;
            color: #aaaaaa;
            cursor: pointer;
            font-size: 10px;
            font-weight: 900;
            transition: .15s ease;
        }

        .role-btn.active {
            border-color: #ffd400;
            background: rgba(255, 212, 0, .08);
            color: #ffd400;
        }

        .role-btn:hover {
            border-color: #ffd400;
        }

        .form {
            margin-top: 18px;
        }

        .field {
            margin-bottom: 11px;
        }

        .field label {
            display: block;
            margin: 0 0 6px;
            color: #888888;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .6px;
        }

        .field input {
            width: 100%;
            height: 47px;
            padding: 0 13px;
            border: 1px solid #333333;
            border-radius: 10px;
            outline: none;
            background: #181818;
            color: #ffffff;
            font-size: 11px;
        }

        .field input:focus {
            border-color: #ffd400;
            box-shadow:
                0 0 0 2px rgba(255, 212, 0, .06);
        }

        .field input::placeholder {
            color: #555555;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            height: 32px;
            padding: 0 8px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: #777777;
            cursor: pointer;
            font-size: 8px;
            font-weight: 900;
        }

        .show-password:hover {
            color: #ffd400;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            margin-top: 4px;
            border: 0;
            border-radius: 11px;
            background: #ffd400;
            color: #090909;
            cursor: pointer;
            font-size: 10px;
            font-weight: 1000;
            transition:
                transform .15s ease,
                opacity .15s ease;
        }

        .login-btn:hover {
            opacity: .94;
        }

        .login-btn:active {
            transform: scale(.99);
        }

        .login-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .forgot {
            width: 100%;
            margin-top: 11px;
            border: 0;
            background: transparent;
            color: #777777;
            cursor: pointer;
            font-size: 8px;
            font-weight: 800;
        }

        .forgot:hover {
            color: #ffd400;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 17px 0;
            color: #4c4c4c;
            font-size: 8px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #292929;
        }

        .otp-btn {
            width: 100%;
            height: 45px;
            border: 1px solid #333333;
            border-radius: 10px;
            background: #181818;
            color: #aaaaaa;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .otp-btn:hover {
            border-color: #ffd400;
            color: #ffd400;
        }

        .otp-panel {
            display: none;
            margin-top: 15px;
            padding: 14px;
            border: 1px solid #292929;
            border-radius: 13px;
            background: #151515;
        }

        .otp-panel.show {
            display: block;
        }

        .otp-title {
            margin-bottom: 10px;
            color: #ffffff;
            font-size: 10px;
            font-weight: 900;
        }

        .otp-subtitle {
            margin-bottom: 11px;
            color: #666666;
            font-size: 8px;
            line-height: 1.5;
        }

        .otp-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .otp-send,
        .otp-verify {
            height: 42px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 8px;
            font-weight: 900;
        }

        .otp-send {
            border: 1px solid #333333;
            background: #1c1c1c;
            color: #cccccc;
        }

        .otp-verify {
            border: 0;
            background: #ffd400;
            color: #090909;
        }

        .otp-actions button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .recaptcha {
            min-height: 1px;
        }

        .status {
            display: none;
            margin-top: 13px;
            padding: 9px;
            border: 1px solid #443b00;
            border-radius: 8px;
            background: rgba(255, 212, 0, .07);
            color: #ffd400;
            font-size: 8px;
            line-height: 1.5;
            text-align: center;
        }

        .status.show {
            display: block;
        }

        .status.error {
            border-color: #5a2222;
            background: rgba(255, 60, 60, .07);
            color: #ff7777;
        }

        .status.success {
            border-color: #24552d;
            background: rgba(50, 200, 80, .07);
            color: #72e88a;
        }

        .register {
            margin-top: 20px;
            padding-top: 17px;
            border-top: 1px solid #272727;
            text-align: center;
            color: #666666;
            font-size: 9px;
        }

        .register button {
            margin-left: 4px;
            border: 0;
            padding: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-weight: 900;
        }

        .back {
            width: 100%;
            margin-top: 10px;
            border: 0;
            background: transparent;
            color: #555555;
            cursor: pointer;
            font-size: 8px;
        }

        .back:hover {
            color: #ffd400;
        }

        .footer {
            margin-top: 18px;
            color: #444444;
            font-size: 8px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 390px) {

            .card {
                padding: 25px 17px 19px;
                border-radius: 20px;
            }

            .roles {
                gap: 7px;
            }

        }

    </style>

</head>


<body>

<main class="page">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <section class="card">

        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                One platform. Every journey.
            </p>

        </div>


        <div class="heading">

            <h2>
                Login to RiderX
            </h2>

            <p>
                Select your account type and
                securely continue.
            </p>

        </div>


        <div class="role-box">

            <div class="role-title">
                Account type
            </div>

            <div class="roles">

                <button
                    type="button"
                    class="role-btn"
                    id="customerRole"
                    aria-pressed="false"
                >
                    Customer
                </button>

                <button
                    type="button"
                    class="role-btn"
                    id="riderRole"
                    aria-pressed="false"
                >
                    Rider / Driver
                </button>

            </div>

        </div>


        <form
            class="form"
            id="loginForm"
            novalidate
        >

            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                        aria-label="Show password"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                LOGIN
            </button>

        </form>


        <button
            type="button"
            class="forgot"
            id="forgotButton"
        >
            Forgot password?
        </button>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            class="otp-btn"
            id="otpToggle"
            aria-expanded="false"
            aria-controls="otpPanel"
        >
            Login with Mobile / OTP
        </button>


        <section
            class="otp-panel"
            id="otpPanel"
            aria-hidden="true"
        >

            <div class="otp-title">
                Mobile OTP Login
            </div>

            <div class="otp-subtitle">
                Enter your Indian mobile number.
                We will send a verification code.
            </div>


            <div class="field">

                <label for="phone">
                    Mobile number
                </label>

                <input
                    id="phone"
                    type="tel"
                    inputmode="numeric"
                    autocomplete="tel"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                >

            </div>


            <div
                class="recaptcha"
                id="recaptcha-container"
            ></div>


            <div class="field">

                <label for="otp">
                    OTP
                </label>

                <input
                    id="otp"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                >

            </div>


            <div class="otp-actions">

                <button
                    type="button"
                    class="otp-send"
                    id="sendOtpButton"
                >
                    SEND OTP
                </button>

                <button
                    type="button"
                    class="otp-verify"
                    id="verifyOtpButton"
                >
                    VERIFY
                </button>

            </div>

        </section>


        <div
            class="status"
            id="status"
            role="status"
            aria-live="polite"
        ></div>


        <div class="register">

            New to RiderX?

            <button
                type="button"
                id="registerButton"
            >
                Create an account
            </button>

        </div>


        <button
            type="button"
            class="back"
            id="backButton"
        >
            ← Back to role selection
        </button>


        <div class="footer">
            © 2026 RiderX • Chandigarh
        </div>

    </section>

</main>


<script type="module">

"use strict";


/* =========================================================
   RIDERX LOGIN CONTROLLER
========================================================= */

let AUTH = null;
let authModuleLoaded = false;
let redirecting = false;
let existingSessionChecked = false;


/* =========================================================
   LOAD AUTH ENGINE
========================================================= */

async function loadAuth() {

    if (authModuleLoaded && AUTH) {
        return AUTH;
    }

    try {

        await import("../js/auth.js");

        AUTH =
            window.RiderX &&
            window.RiderX.auth
                ? window.RiderX.auth
                : null;

        if (!AUTH) {

            throw new Error(
                "RiderX authentication engine is unavailable."
            );

        }

        authModuleLoaded = true;

        return AUTH;

    } catch (error) {

        console.error(
            "RiderX auth.js failed to load:",
            error
        );

        showStatus(
            "Authentication system could not be loaded. Please refresh the page.",
            "error"
        );

        return null;

    }

}


/* =========================================================
   ELEMENTS
========================================================= */

const customerRole =
    document.getElementById("customerRole");

const riderRole =
    document.getElementById("riderRole");

const loginForm =
    document.getElementById("loginForm");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

const loginButton =
    document.getElementById("loginButton");

const forgotButton =
    document.getElementById("forgotButton");

const otpToggle =
    document.getElementById("otpToggle");

const otpPanel =
    document.getElementById("otpPanel");

const phone =
    document.getElementById("phone");

const otp =
    document.getElementById("otp");

const sendOtpButton =
    document.getElementById("sendOtpButton");

const verifyOtpButton =
    document.getElementById("verifyOtpButton");

const status =
    document.getElementById("status");

const registerButton =
    document.getElementById("registerButton");

const backButton =
    document.getElementById("backButton");


/* =========================================================
   STATE
========================================================= */

const ROLE_KEY =
    "riderx_selected_role";

const LEGACY_ROLE_KEY =
    "riderx_role";


let selectedRole =
    normalizeSelectedRole(
        localStorage.getItem(ROLE_KEY)
    );


if (!selectedRole) {

    selectedRole =
        normalizeSelectedRole(
            localStorage.getItem(LEGACY_ROLE_KEY)
        );

}


if (!selectedRole) {

    selectedRole =
        "customer";

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type = ""
) {

    if (!status) {
        return;
    }

    status.textContent =
        String(message || "");

    status.className =
        "status show";

    if (type) {

        status.classList.add(
            type
        );

    }

}


function clearStatus() {

    if (!status) {
        return;
    }

    status.textContent =
        "";

    status.className =
        "status";

}


/* =========================================================
   ROLE NORMALIZATION
========================================================= */

function normalizeSelectedRole(
    role
) {

    const value =
        String(role || "")
            .trim()
            .toLowerCase();

    if (
        value === "rider" ||
        value === "driver" ||
        value === "partner"
    ) {

        return "rider";

    }

    if (
        value === "customer" ||
        value === "user"
    ) {

        return "customer";

    }

    return "";

}


/* =========================================================
   ROLE SELECTION
========================================================= */

function selectRole(
    role
) {

    const normalized =
        normalizeSelectedRole(
            role
        );

    if (!normalized) {
        return;
    }

    selectedRole =
        normalized;

    localStorage.setItem(
        ROLE_KEY,
        selectedRole
    );

    localStorage.setItem(
        LEGACY_ROLE_KEY,
        selectedRole
    );

    customerRole.classList.toggle(
        "active",
        selectedRole === "customer"
    );

    riderRole.classList.toggle(
        "active",
        selectedRole === "rider"
    );

    customerRole.setAttribute(
        "aria-pressed",
        selectedRole === "customer"
            ? "true"
            : "false"
    );

    riderRole.setAttribute(
        "aria-pressed",
        selectedRole === "rider"
            ? "true"
            : "false"
    );

    clearStatus();

}


selectRole(
    selectedRole
);


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

showPassword.addEventListener(
    "click",
    function () {

        const isPassword =
            password.type === "password";

        password.type =
            isPassword
                ? "text"
                : "password";

        showPassword.textContent =
            isPassword
                ? "HIDE"
                : "SHOW";

        showPassword.setAttribute(
            "aria-label",
            isPassword
                ? "Hide password"
                : "Show password"
        );

    }
);


/* =========================================================
   EMAIL LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        if (redirecting) {
            return;
        }

        clearStatus();

        const emailValue =
            email.value
                .trim()
                .toLowerCase();

        const passwordValue =
            password.value;

        if (!selectedRole) {

            showStatus(
                "Please select Customer or Rider.",
                "error"
            );

            return;

        }

        if (!emailValue) {

            showStatus(
                "Enter your email address.",
                "error"
            );

            email.focus();

            return;

        }

        if (
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                emailValue
            )
        ) {

            showStatus(
                "Enter a valid email address.",
                "error"
            );

            email.focus();

            return;

        }

        if (
            passwordValue.length < 6
        ) {

            showStatus(
                "Password must contain at least 6 characters.",
                "error"
            );

            password.focus();

            return;

        }

        const auth =
            await loadAuth();

        if (
            !auth ||
            typeof auth.loginEmail !== "function"
        ) {

            return;

        }

        loginButton.disabled =
            true;

        loginButton.textContent =
            "SIGNING IN...";

        try {

            const result =
                await auth.loginEmail(
                    emailValue,
                    passwordValue
                );

            const actualRole =
                normalizeSelectedRole(
                    typeof auth.normalizeRole === "function"
                        ? auth.normalizeRole(
                            result?.role
                        )
                        : result?.role
                );

            if (
                actualRole !== selectedRole
            ) {

                try {

                    if (
                        typeof auth.logout ===
                        "function"
                    ) {

                        await auth.logout();

                    }

                } catch (logoutError) {

                    console.warn(
                        "RiderX logout after role mismatch failed:",
                        logoutError
                    );

                }

                throw new Error(
                    "This account belongs to " +
                    (
                        actualRole === "rider"
                            ? "Rider / Driver"
                            : "Customer"
                    ) +
                    ". Please select the correct account type."
                );

            }

            showStatus(
                "Login successful. Opening your dashboard...",
                "success"
            );

            redirectToRole(
                actualRole
            );

        } catch (error) {

            console.error(
                "RiderX login error:",
                error
            );

            showStatus(
                getFirebaseErrorMessage(error),
                "error"
            );

            loginButton.disabled =
                false;

            loginButton.textContent =
                "LOGIN";

        }

    }
);


/* =========================================================
   FORGOT PASSWORD
========================================================= */

forgotButton.addEventListener(
    "click",
    async function () {

        if (redirecting) {
            return;
        }

        clearStatus();

        const emailValue =
            email.value
                .trim()
                .toLowerCase();

        if (!emailValue) {

            showStatus(
                "Enter your email first, then tap Forgot password.",
                "error"
            );

            email.focus();

            return;

        }

        if (
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
                emailValue
            )
        ) {

            showStatus(
                "Enter a valid email address.",
                "error"
            );

            email.focus();

            return;

        }

        const auth =
            await loadAuth();

        if (
            !auth ||
            typeof auth.resetPassword !== "function"
        ) {

            return;

        }

        forgotButton.disabled =
            true;

        try {

            await auth.resetPassword(
                emailValue
            );

            showStatus(
                "Password reset email sent. Check your inbox.",
                "success"
            );

        } catch (error) {

            console.error(
                "RiderX password reset error:",
                error
            );

            showStatus(
                getFirebaseErrorMessage(error),
                "error"
            );

        } finally {

            forgotButton.disabled =
                false;

        }

    }
);


/* =========================================================
   OTP PANEL
========================================================= */

otpToggle.addEventListener(
    "click",
    function () {

        const open =
            otpPanel.classList.toggle(
                "show"
            );

        otpToggle.setAttribute(
            "aria-expanded",
            open ? "true" : "false"
        );

        otpPanel.setAttribute(
            "aria-hidden",
            open ? "false" : "true"
        );

        if (open) {

            phone.focus();

        }

    }
);


/* =========================================================
   PHONE CLEANUP
========================================================= */

phone.addEventListener(
    "input",
    function () {

        phone.value =
            phone.value
                .replace(/\D/g, "")
                .slice(0, 10);

    }
);


/* =========================================================
   OTP CLEANUP
========================================================= */

otp.addEventListener(
    "input",
    function () {

        otp.value =
            otp.value
                .replace(/\D/g, "")
                .slice(0, 6);

    }
);


/* =========================================================
   SEND OTP
========================================================= */

sendOtpButton.addEventListener(
    "click",
    async function () {

        if (redirecting) {
            return;
        }

        clearStatus();

        const phoneValue =
            phone.value
                .replace(/\D/g, "");

        if (
            !/^[6-9]\d{9}$/.test(
                phoneValue
            )
        ) {

            showStatus(
                "Enter a valid 10-digit Indian mobile number.",
                "error"
            );

            phone.focus();

            return;

        }

        const auth =
            await loadAuth();

        if (
            !auth ||
            typeof auth.sendOtp !== "function"
        ) {

            return;

        }

        sendOtpButton.disabled =
            true;

        sendOtpButton.textContent =
            "SENDING...";

        try {

            await auth.sendOtp(
                "+91" + phoneValue,
                "recaptcha-container"
            );

            showStatus(
                "OTP sent successfully. Enter the 6-digit code.",
                "success"
            );

            otp.focus();

        } catch (error) {

            console.error(
                "RiderX OTP send error:",
                error
            );

            showStatus(
                getFirebaseErrorMessage(error),
                "error"
            );

        } finally {

            sendOtpButton.disabled =
                false;

            sendOtpButton.textContent =
                "SEND OTP";

        }

    }
);


/* =========================================================
   VERIFY OTP
========================================================= */

verifyOtpButton.addEventListener(
    "click",
    async function () {

        if (redirecting) {
            return;
        }

        clearStatus();

        const otpValue =
            otp.value.trim();

        if (
            !/^\d{6}$/.test(
                otpValue
            )
        ) {

            showStatus(
                "Enter the 6-digit OTP.",
                "error"
            );

            otp.focus();

            return;

        }

        const auth =
            await loadAuth();

        if (
            !auth ||
            typeof auth.verifyOtp !== "function"
        ) {

            return;

        }

        verifyOtpButton.disabled =
            true;

        verifyOtpButton.textContent =
            "VERIFYING...";

        try {

            const result =
                await auth.verifyOtp(
                    otpValue,
                    selectedRole
                );

            const actualRole =
                normalizeSelectedRole(
                    typeof auth.normalizeRole === "function"
                        ? auth.normalizeRole(
                            result?.role
                        )
                        : result?.role
                );

            if (
                actualRole !== selectedRole
            ) {

                try {

                    if (
                        typeof auth.logout ===
                        "function"
                    ) {

                        await auth.logout();

                    }

                } catch (logoutError) {

                    console.warn(
                        "RiderX OTP mismatch logout failed:",
                        logoutError
                    );

                }

                throw new Error(
                    "This phone account belongs to another RiderX account type."
                );

            }

            showStatus(
                "OTP verified. Opening your dashboard...",
                "success"
            );

            redirectToRole(
                actualRole
            );

        } catch (error) {

            console.error(
                "RiderX OTP verification error:",
                error
            );

            showStatus(
                getFirebaseErrorMessage(error),
                "error"
            );

            verifyOtpButton.disabled =
                false;

            verifyOtpButton.textContent =
                "VERIFY";

        }

    }
);


/* =========================================================
   REGISTER
========================================================= */

registerButton.addEventListener(
    "click",
    function () {

        localStorage.setItem(
            ROLE_KEY,
            selectedRole
        );

        localStorage.setItem(
            LEGACY_ROLE_KEY,
            selectedRole
        );

        window.location.replace(
            "./register.html"
        );

    }
);


/* =========================================================
   BACK TO ROLE
========================================================= */

backButton.addEventListener(
    "click",
    function () {

        localStorage.removeItem(
            ROLE_KEY
        );

        localStorage.removeItem(
            LEGACY_ROLE_KEY
        );

        window.location.replace(
            "./role.html"
        );

    }
);


/* =========================================================
   ROLE BUTTONS
========================================================= */

customerRole.addEventListener(
    "click",
    function () {

        selectRole(
            "customer"
        );

    }
);


riderRole.addEventListener(
    "click",
    function () {

        selectRole(
            "rider"
        );

    }
);


/* =========================================================
   ROLE REDIRECT
========================================================= */

function redirectToRole(
    role
) {

    const normalized =
        normalizeSelectedRole(
            role
        );

    if (
        normalized !== "customer" &&
        normalized !== "rider"
    ) {

        throw new Error(
            "RiderX account role could not be determined."
        );

    }

    if (redirecting) {
        return;
    }

    redirecting = true;

    localStorage.setItem(
        ROLE_KEY,
        normalized
    );

    localStorage.setItem(
        LEGACY_ROLE_KEY,
        normalized
    );

    const destination =
        normalized === "rider"
            ? "../rider/home.html"
            : "../customer/home.html";

    window.setTimeout(
        function () {

            window.location.replace(
                destination
            );

        },
        250
    );

}


/* =========================================================
   FIREBASE ERROR TRANSLATOR
========================================================= */

function getFirebaseErrorMessage(
    error
) {

    const code =
        String(
            error?.code || ""
        ).toLowerCase();

    const message =
        String(
            error?.message || ""
        );

    if (
        code.includes("invalid-credential") ||
        code.includes("wrong-password") ||
        code.includes("user-not-found")
    ) {

        return "Email or password is incorrect.";

    }

    if (
        code.includes("invalid-email")
    ) {

        return "Enter a valid email address.";

    }

    if (
        code.includes("email-already-in-use")
    ) {

        return "This email is already registered.";

    }

    if (
        code.includes("weak-password")
    ) {

        return "Password is too weak. Use at least 6 characters.";

    }

    if (
        code.includes("too-many-requests")
    ) {

        return "Too many attempts. Please wait and try again.";

    }

    if (
        code.includes("network-request-failed")
    ) {

        return "Network error. Check your internet connection.";

    }

    if (
        code.includes("captcha-check-failed")
    ) {

        return "Security verification failed. Please try again.";

    }

    if (
        code.includes("invalid-phone-number")
    ) {

        return "The mobile number is invalid.";

    }

    if (
        code.includes("quota-exceeded")
    ) {

        return "OTP service limit has been reached. Please try later.";

    }

    if (
        code.includes("code-expired")
    ) {

        return "OTP has expired. Request a new OTP.";

    }

    if (
        code.includes("invalid-verification-code")
    ) {

        return "Incorrect OTP. Please check and try again.";

    }

    if (
        code.includes("requires-recent-login")
    ) {

        return "Please sign in again and retry this action.";

    }

    if (
        code.includes("user-disabled")
    ) {

        return "This RiderX account has been disabled.";

    }

    if (
        message.toLowerCase().includes(
            "role is not configured"
        )
    ) {

        return message;

    }

    if (
        message.toLowerCase().includes(
            "authentication"
        )
    ) {

        return message;

    }

    return (
        message ||
        "Login failed. Please try again."
    );

}


/* =========================================================
   EXISTING FIREBASE SESSION
========================================================= */

async function checkExistingSession() {

    if (existingSessionChecked) {
        return;
    }

    existingSessionChecked = true;

    const auth =
        await loadAuth();

    if (!auth) {
        return;
    }

    /*
     * auth.js maintains the Firebase auth state.
     * Do not trust localStorage alone for automatic
     * dashboard access.
     */

    const firebaseUser =
        auth.state?.firebaseUser ||
        auth.state?.user ||
        null;

    if (!firebaseUser) {
        return;
    }

    let role =
        "";

    try {

        role =
            normalizeSelectedRole(
                typeof auth.getRole === "function"
                    ? auth.getRole()
                    : auth.state?.role
            );

    } catch (error) {

        console.warn(
            "RiderX existing-session role lookup failed:",
            error
        );

    }

    if (
        role !== "customer" &&
        role !== "rider"
    ) {

        return;

    }

    /*
     * If the user explicitly selected another role,
     * never silently switch account type.
     */

    if (
        selectedRole &&
        role !== selectedRole
    ) {

        return;

    }

    showStatus(
        "You are already signed in. Opening your dashboard...",
        "success"
    );

    redirectToRole(
        role
    );

}


/* =========================================================
   AUTH LOGIN EVENT
========================================================= */

window.addEventListener(
    "riderx-auth-login",
    function (event) {

        if (redirecting) {
            return;
        }

        const authRole =
            normalizeSelectedRole(
                event.detail?.role
            );

        if (
            !authRole ||
            authRole !== selectedRole
        ) {

            return;

        }

        redirectToRole(
            authRole
        );

    }
);


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

[email, password].forEach(
    function (input) {

        input.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    if (
                        input === email
                    ) {

                        password.focus();

                    }

                }

            }
        );

    }
);


/* =========================================================
   INITIALIZATION
========================================================= */

(async function initLoginPage() {

    try {

        const auth =
            await loadAuth();

        if (!auth) {
            return;
        }

        /*
         * Give auth.js a moment to finish its initial
         * Firebase onAuthStateChanged processing.
         */

        window.setTimeout(
            checkExistingSession,
            400
        );

    } catch (error) {

        console.error(
            "RiderX login initialization failed:",
            error
        );

        showStatus(
            "Unable to initialize login. Please refresh the page.",
            "error"
        );

    }

})();

</script>
