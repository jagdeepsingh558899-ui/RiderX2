===============================================================
RIDERX AUTH ENGINE
===============================================================

IMPORTANT:

js/auth.js is loaded FIRST.

The login controller below waits for the same global
window.RiderX.auth instance.

Firebase initialization remains inside:
    firebase/firebase-config.js

This page never initializes Firebase itself.
===============================================================
--><script
    type="module"
    src="../js/auth.js"
></script><script>

"use strict";


/* =========================================================
   RIDERX LOGIN CONTROLLER
========================================================= */

(function () {


    const STORAGE_ROLE =
        "riderx_selected_role";

    const LEGACY_ROLE =
        "riderx_role";


    const ROUTES = {

        role:
            "./role.html",

        customer:
            "../customer/home.html",

        rider:
            "../rider/home.html",

        admin:
            "../admin/dashboard.html"

    };


    const $ =
        function (selector) {

            return document.querySelector(
                selector
            );

        };


    const messageBox =
        $("#message");


    const loadingOverlay =
        $("#loadingOverlay");


    const loadingText =
        $("#loadingText");


    const emailLoginBtn =
        $("#emailLoginBtn");


    const sendOtpBtn =
        $("#sendOtpBtn");


    const verifyOtpBtn =
        $("#verifyOtpBtn");


    let loginBusy =
        false;


    /* =====================================================
       BASIC HELPERS
    ===================================================== */

    function clean(value) {

        return String(
            value ?? ""
        ).trim();

    }


    function normalizeRole(role) {

        const value =
            clean(role)
                .toLowerCase()
                .replace(
                    /[\s-]+/g,
                    "_"
                );


        if (
            [
                "customer",
                "customers",
                "user",
                "users"
            ].includes(value)
        ) {

            return "customer";

        }


        if (
            [
                "rider",
                "riders",
                "driver",
                "drivers",
                "partner",
                "driver_partner",
                "driverpartner",
                "captain"
            ].includes(value)
        ) {

            return "rider";

        }


        if (
            [
                "admin",
                "administrator"
            ].includes(value)
        ) {

            return "admin";

        }


        if (
            [
                "superadmin",
                "super_admin",
                "superadministrator"
            ].includes(value)
        ) {

            return "superadmin";

        }


        return "";

    }


    function getQueryRole() {

        try {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return normalizeRole(
                params.get("role")
            );

        } catch (error) {

            console.warn(
                "RiderX login role query error:",
                error
            );

            return "";

        }

    }


    function getStoredRole() {

        try {

            return normalizeRole(

                localStorage.getItem(
                    STORAGE_ROLE
                )

                ||

                localStorage.getItem(
                    LEGACY_ROLE
                )

            );

        } catch (error) {

            console.warn(
                "RiderX login role storage read failed:",
                error
            );

            return "";

        }

    }


    function saveSelectedRole(role) {

        const normalized =
            normalizeRole(role);


        if (
            !normalized
        ) {

            return false;

        }


        try {

            localStorage.setItem(
                STORAGE_ROLE,
                normalized
            );

            localStorage.setItem(
                LEGACY_ROLE,
                normalized
            );

            return true;

        } catch (error) {

            console.warn(
                "RiderX login role storage write failed:",
                error
            );

            return false;

        }

    }


    function getSelectedRole() {

        const queryRole =
            getQueryRole();


        if (
            queryRole ===
                "customer" ||
            queryRole ===
                "rider"
        ) {

            saveSelectedRole(
                queryRole
            );

            return queryRole;

        }


        const storedRole =
            getStoredRole();


        if (
            storedRole ===
                "customer" ||
            storedRole ===
                "rider"
        ) {

            return storedRole;

        }


        return "";

    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(
        text,
        type
    ) {

        if (!messageBox) {
            return;
        }


        const value =
            clean(text);


        if (!value) {

            clearMessage();

            return;

        }


        messageBox.textContent =
            value;


        messageBox.className =
            "message show " +
            (
                type === "success"
                    ? "success"
                    : "error"
            );

    }


    function clearMessage() {

        if (!messageBox) {
            return;
        }


        messageBox.textContent =
            "";

        messageBox.className =
            "message";

    }


    /* =====================================================
       LOADING
    ===================================================== */

    function setLoading(
        state,
        text
    ) {

        if (
            loadingOverlay
        ) {

            if (state) {

                loadingText.textContent =
                    text ||
                    "Please wait...";

                loadingOverlay.classList.add(
                    "show"
                );

                loadingOverlay.setAttribute(
                    "aria-hidden",
                    "false"
                );

            } else {

                loadingOverlay.classList.remove(
                    "show"
                );

                loadingOverlay.setAttribute(
                    "aria-hidden",
                    "true"
                );

            }

        }


        if (emailLoginBtn) {

            emailLoginBtn.disabled =
                Boolean(state);

        }


        if (sendOtpBtn) {

            sendOtpBtn.disabled =
                Boolean(state);

        }


        if (verifyOtpBtn) {

            verifyOtpBtn.disabled =
                Boolean(state);

        }

    }


    /* =====================================================
       ROLE UI
    ===================================================== */

    function updateRoleUI(
        role
    ) {

        const normalized =
            normalizeRole(role);


        const roleText =
            $("#selectedRoleText");


        const roleIcon =
            $("#roleIcon");


        if (
            normalized ===
            "rider"
        ) {

            if (roleText) {

                roleText.textContent =
                    "Rider";

            }


            if (roleIcon) {

                roleIcon.textContent =
                    "R";

            }

            return;

        }


        if (
            normalized ===
            "customer"
        ) {

            if (roleText) {

                roleText.textContent =
                    "Customer";

            }


            if (roleIcon) {

                roleIcon.textContent =
                    "C";

            }

            return;

        }


        if (
            normalized ===
                "admin" ||
            normalized ===
                "superadmin"
        ) {

            if (roleText) {

                roleText.textContent =
                    "Admin";

            }


            if (roleIcon) {

                roleIcon.textContent =
                    "A";

            }

        }

    }


    /* =====================================================
       ROUTING
    ===================================================== */

    function dashboardForRole(
        role
    ) {

        const normalized =
            normalizeRole(role);


        if (
            normalized ===
            "customer"
        ) {

            return ROUTES.customer;

        }


        if (
            normalized ===
            "rider"
        ) {

            return ROUTES.rider;

        }


        if (
            normalized ===
                "admin" ||
            normalized ===
                "superadmin"
        ) {

            return ROUTES.admin;

        }


        return "";

    }


    function goToDashboard(
        role
    ) {

        const normalized =
            normalizeRole(role);


        const destination =
            dashboardForRole(
                normalized
            );


        if (!destination) {

            throw new Error(
                "Your RiderX account role is not configured."
            );

        }


        /*
         * IMPORTANT:
         *
         * Do NOT go to role.html here.
         *
         * Successful Firebase authentication is complete.
         */

        window.location.replace(
            destination
        );

    }


    /* =====================================================
       AUTH ENGINE
    ===================================================== */

    async function getAuthEngine() {

        const started =
            Date.now();


        const timeout =
            15000;


        while (
            Date.now() -
            started <
            timeout
        ) {

            if (
                window.RiderX &&
                window.RiderX.auth
            ) {

                const auth =
                    window.RiderX.auth;


                /*
                 * auth.js exposes waitForAuth().
                 *
                 * This waits for Firebase's initial
                 * auth-state resolution instead of showing
                 * a false "engine unavailable" error.
                 */

                if (
                    typeof
                        auth.waitForAuth ===
                    "function"
                ) {

                    try {

                        await auth.waitForAuth(
                            12000
                        );

                    } catch (error) {

                        console.warn(
                            "RiderX auth readiness warning:",
                            error
                        );

                    }

                }


                return auth;

            }


            await new Promise(
                function (resolve) {

                    setTimeout(
                        resolve,
                        50
                    );

                }
            );

        }


        throw new Error(
            "RiderX authentication engine is unavailable. Please refresh and try again."
        );

    }


    /* =====================================================
       INITIAL PAGE SETUP
    ===================================================== */

    async function initializeLoginPage() {

        /*
         * First check URL role.
         *
         * role.html sends:
         *
         * login.html?role=customer
         *
         * or:
         *
         * login.html?role=rider
         */

        const role =
            getSelectedRole();


        if (!role) {

            /*
             * Only redirect when NO role exists.
             *
             * Never redirect a normal login attempt
             * back to role.html.
             */

            window.location.replace(
                ROUTES.role
            );

            return;

        }


        updateRoleUI(
            role
        );


        /*
         * Wait for auth engine without redirecting.
         */

        try {

            const auth =
                await getAuthEngine();


            /*
             * If Firebase already has an authenticated
             * account AND auth.js already resolved its role,
             * continue directly to its dashboard.
             *
             * This is safe because the Firebase user is
             * authoritative, not localStorage.
             */

            const firebaseUser =
                auth.state?.firebaseUser;


            const actualRole =
                normalizeRole(
                    auth.state?.role ||
                    (
                        typeof auth.getRole ===
                        "function"
                            ? auth.getRole()
                            : ""
                    )
                );


            if (
                firebaseUser?.uid &&
                actualRole
            ) {

                goToDashboard(
                    actualRole
                );

                return;

            }


            /*
             * Unauthenticated state is perfectly valid here.
             * Stay on the login page.
             */

            clearMessage();


        } catch (error) {

            console.error(
                "RiderX login page initialization error:",
                error
            );


            /*
             * IMPORTANT:
             *
             * Do NOT send the user back to role.html.
             *
             * If auth.js/Firebase is unavailable, show the
             * actual problem on this page.
             */

            showMessage(
                error?.message ||
                "RiderX authentication is temporarily unavailable. Please refresh.",
                "error"
            );

        }

    }


    /* =====================================================
       EMAIL LOGIN
    ===================================================== */

    async function loginWithEmail() {

        if (loginBusy) {
            return;
        }


        clearMessage();


        const selectedRole =
            getSelectedRole();


        if (
            selectedRole !==
                "customer" &&
            selectedRole !==
                "rider"
        ) {

            window.location.replace(
                ROUTES.role
            );

            return;

        }


        const email =
            clean(
                $("#email")?.value
            ).toLowerCase();


        const password =
            String(
                $("#password")?.value ||
                ""
            );


        if (!email) {

            showMessage(
                "Please enter your email."
            );

            $("#email")?.focus();

            return;

        }


        if (!password) {

            showMessage(
                "Please enter your password."
            );

            $("#password")?.focus();

            return;

        }


        loginBusy =
            true;


        setLoading(
            true,
            "Signing you in..."
        );


        try {

            const auth =
                await getAuthEngine();


            if (
                typeof
                    auth.loginEmail !==
                "function"
            ) {

                throw new Error(
                    "RiderX email authentication service is unavailable."
                );

            }


            /*
             * auth.js performs:
             *
             * Firebase email authentication
             * Firestore profile loading
             * Firestore role resolution
             * session saving
             */

            const result =
                await auth.loginEmail(
                    email,
                    password
                );


            const actualRole =
                normalizeRole(
                    result?.role ||
                    auth.state?.role ||
                    (
                        typeof auth.getRole ===
                        "function"
                            ? auth.getRole()
                            : ""
                    )
                );


            if (!actualRole) {

                throw new Error(
                    "Your RiderX account role is not configured. Please contact support."
                );

            }


            /*
             * Firebase/Firestore role is authoritative.
             *
             * We do not overwrite it with localStorage.
             */

            updateRoleUI(
                actualRole
            );


            goToDashboard(
                actualRole
            );


        } catch (error) {

            console.error(
                "RiderX email login failed:",
                error
            );


            showMessage(
                error?.message ||
                "Login failed. Please check your email and password."
            );


            setLoading(
                false
            );


        } finally {

            loginBusy =
                false;

        }

    }


    /* =====================================================
       PHONE OTP
    ===================================================== */

    async function sendOtp() {

        if (loginBusy) {
            return;
        }


        clearMessage();


        const selectedRole =
            getSelectedRole();


        if (
            selectedRole !==
                "customer" &&
            selectedRole !==
                "rider"
        ) {

            window.location.replace(
                ROUTES.role
            );

            return;

        }


        const phone =
            clean(
                $("#phone")?.value
            );


        if (!phone) {

            showMessage(
                "Please enter your mobile number."
            );

            $("#phone")?.focus();

            return;

        }


        loginBusy =
            true;


        setLoading(
            true,
            "Sending OTP..."
        );


        try {

            const auth =
                await getAuthEngine();


            if (
                typeof
                    auth.sendOtp !==
                "function"
            ) {

                throw new Error(
                    "RiderX phone authentication service is unavailable."
                );

            }


            await auth.sendOtp(
                phone,
                "recaptcha-container"
            );


            $("#phoneStep")
                ?.classList.add(
                    "hidden"
                );


            $("#otpStep")
                ?.classList.add(
                    "active"
                );


            showMessage(
                "OTP sent successfully.",
                "success"
            );


            $("#otp")?.focus();


        } catch (error) {

            console.error(
                "RiderX send OTP failed:",
                error
            );


            showMessage(
                error?.message ||
                "Unable to send OTP."
            );


        } finally {

            loginBusy =
                false;


            setLoading(
                false
            );

        }

    }


    /* =====================================================
       VERIFY OTP
    ===================================================== */

    async function verifyOtp() {

        if (loginBusy) {
            return;
        }


        clearMessage();


        const selectedRole =
            getSelectedRole();


        if (
            selectedRole !==
                "customer" &&
            selectedRole !==
                "rider"
        ) {

            window.location.replace(
                ROUTES.role
            );

            return;

        }


        const otp =
            clean(
                $("#otp")?.value
            );


        if (
            !/^\d{6}$/.test(
                otp
            )
        ) {

            showMessage(
                "Please enter the 6-digit OTP."
            );

            $("#otp")?.focus();

            return;

        }


        loginBusy =
            true;


        setLoading(
            true,
            "Verifying OTP..."
        );


        try {

            const auth =
                await getAuthEngine();


            if (
                typeof
                    auth.verifyOtp !==
                "function"
            ) {

                throw new Error(
                    "RiderX phone verification service is unavailable."
                );

            }


            const result =
                await auth.verifyOtp(
                    otp,
                    selectedRole
                );


            const actualRole =
                normalizeRole(
                    result?.role ||
                    auth.state?.role ||
                    (
                        typeof auth.getRole ===
                        "function"
                            ? auth.getRole()
                            : ""
                    )
                );


            if (!actualRole) {

                throw new Error(
                    "Your RiderX account role is not configured."
                );

            }


            updateRoleUI(
                actualRole
            );


            goToDashboard(
                actualRole
            );


        } catch (error) {

            console.error(
                "RiderX OTP verification failed:",
                error
            );


            showMessage(
                error?.message ||
                "OTP verification failed."
            );


            setLoading(
                false
            );


        } finally {

            loginBusy =
                false;

        }

    }


    /* =====================================================
       PASSWORD RESET
    ===================================================== */

    async function resetPassword() {

        clearMessage();


        const email =
            clean(
                $("#email")?.value
            ).toLowerCase();


        if (!email) {

            showMessage(
                "Enter your email first, then tap Forgot password."
            );

            $("#email")?.focus();

            return;

        }


        setLoading(
            true,
            "Sending password reset..."
        );


        try {

            const auth =
                await getAuthEngine();


            if (
                typeof
                    auth.resetPassword !==
                "function"
            ) {

                throw new Error(
                    "RiderX password reset service is unavailable."
                );

            }


            await auth.resetPassword(
                email
            );


            showMessage(
                "Password reset email sent. Please check your inbox.",
                "success"
            );


        } catch (error) {

            console.error(
                "RiderX password reset failed:",
                error
            );


            showMessage(
                error?.message ||
                "Unable to send password reset email."
            );


        } finally {

            setLoading(
                false
            );

        }

    }


    /* =====================================================
       LOGIN METHOD SWITCH
    ===================================================== */

    function switchMethod(
        method
    ) {

        const emailMode =
            method === "email";


        $("#emailMethodBtn")
            ?.classList.toggle(
                "active",
                emailMode
            );


        $("#phoneMethodBtn")
            ?.classList.toggle(
                "active",
                !emailMode
            );


        $("#emailSection")
            ?.classList.toggle(
                "hidden",
                !emailMode
            );


        $("#phoneSection")
            ?.classList.toggle(
                "active",
                !emailMode
            );


        clearMessage();


        if (
            !emailMode
        ) {

            $("#phone")?.focus();

        } else {

            $("#email")?.focus();

        }

    }


    /* =====================================================
       CHANGE PHONE
    ===================================================== */

    function resetPhoneStep() {

        $("#otpStep")
            ?.classList.remove(
                "active"
            );


        $("#phoneStep")
            ?.classList.remove(
                "hidden"
            );


        if (
            $("#otp")
        ) {

            $("#otp").value =
                "";

        }


        clearMessage();

    }


    /* =====================================================
       CHANGE ROLE
    ===================================================== */

    function changeRole() {

        /*
         * This is the ONLY normal login-page action that
         * intentionally returns to role.html.
         */

        try {

            localStorage.removeItem(
                STORAGE_ROLE
            );

            localStorage.removeItem(
                LEGACY_ROLE
            );

        } catch (error) {

            console.warn(
                "RiderX role cleanup failed:",
                error
            );

        }


        window.location.replace(
            ROUTES.role
        );

    }


    /* =====================================================
       REGISTER
    ===================================================== */

    function openRegister() {

        /*
         * Keep the selected Customer/Rider role.
         *
         * register.html can read riderx_selected_role.
         */

        const role =
            getSelectedRole();


        if (
            role ===
                "customer" ||
            role ===
                "rider"
        ) {

            saveSelectedRole(
                role
            );

        }


        window.location.replace(
            "./register.html"
        );

    }


    /* =====================================================
       PASSWORD SHOW/HIDE
    ===================================================== */

    function togglePassword() {

        const input =
            $("#password");


        const button =
            $("#passwordToggle");


        if (
            !input ||
            !button
        ) {

            return;

        }


        const visible =
            input.type ===
            "text";


        input.type =
            visible
                ? "password"
                : "text";


        button.textContent =
            visible
                ? "SHOW"
                : "HIDE";

    }


    /* =====================================================
       INPUT HELPERS
    ===================================================== */

    function sanitizeOtpInput() {

        const input =
            $("#otp");


        if (!input) {
            return;
        }


        input.value =
            input.value
                .replace(
                    /\D/g,
                    ""
                )
                .slice(
                    0,
                    6
                );

    }


    function sanitizePhoneInput() {

        const input =
            $("#phone");


        if (!input) {
            return;
        }


        input.value =
            input.value
                .replace(
                    /[^\d+]/g,
                    ""
                );

    }


    /* =====================================================
       EVENT BINDING
    ===================================================== */

    function bindEvents() {


        const emailForm =
            $("#emailLoginForm");


        if (emailForm) {

            emailForm.addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();

                    loginWithEmail();

                }
            );

        }


        $("#emailMethodBtn")
            ?.addEventListener(
                "click",
                function () {

                    switchMethod(
                        "email"
                    );

                }
            );


        $("#phoneMethodBtn")
            ?.addEventListener(
                "click",
                function () {

                    switchMethod(
                        "phone"
                    );

                }
            );


        $("#passwordToggle")
            ?.addEventListener(
                "click",
                togglePassword
            );


        $("#forgotPasswordBtn")
            ?.addEventListener(
                "click",
                resetPassword
            );


        $("#sendOtpBtn")
            ?.addEventListener(
                "click",
                sendOtp
            );


        $("#verifyOtpBtn")
            ?.addEventListener(
                "click",
                verifyOtp
            );


        $("#changePhoneBtn")
            ?.addEventListener(
                "click",
                resetPhoneStep
            );


        $("#changeRoleBtn")
            ?.addEventListener(
                "click",
                changeRole
            );


        $("#registerBtn")
            ?.addEventListener(
                "click",
                openRegister
            );


        $("#otp")
            ?.addEventListener(
                "input",
                sanitizeOtpInput
            );


        $("#phone")
            ?.addEventListener(
                "input",
                sanitizePhoneInput
            );


        $("#password")
            ?.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        event.preventDefault();

                        loginWithEmail();

                    }

                }
            );

    }


    /* =====================================================
       START
    ===================================================== */

    function start() {

        /*
         * Role is resolved before anything else.
         *
         * This prevents the login page from randomly
         * falling back to role.html after a few seconds.
         */

        const role =
            getSelectedRole();


        if (!role) {

            window.location.replace(
                ROUTES.role
            );

            return;

        }


        updateRoleUI(
            role
        );


        bindEvents();


        /*
         * Initialize auth state asynchronously.
         *
         * Failure is shown on login page instead of causing
         * another role-selection redirect.
         */

        initializeLoginPage();

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            start,
            {
                once: true
            }
        );

    } else {

        start();

    }


})();

</script></body></html>
