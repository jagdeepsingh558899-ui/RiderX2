"use strict";

/*
============================================================
RIDERX LOGIN
IMPORTANT:
This page creates the ONLY normal local session used
for dashboard routing.

Old selected-role values are NOT treated as login sessions.
============================================================
*/

const form =
    document.getElementById("loginForm");

const phoneInput =
    document.getElementById("phone");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginBtn");

const errorBox =
    document.getElementById("errorBox");

const successBox =
    document.getElementById("successBox");

const rememberInput =
    document.getElementById("remember");

const customerRole =
    document.getElementById("customerRole");

const riderRole =
    document.getElementById("riderRole");


/* =========================================================
   ROLE
========================================================= */

function getRole(){

    const checked =
        document.querySelector(
            'input[name="role"]:checked'
        );

    if(!checked){
        return "";
    }

    return String(
        checked.value
    )
    .trim()
    .toLowerCase();
}


function saveRole(role){

    if(
        role !== "customer" &&
        role !== "rider"
    ){
        return;
    }

    /*
     * This is only the selected login type.
     * It is NOT a login session.
     */

    localStorage.setItem(
        "riderx_selected_role",
        role
    );

}


/* =========================================================
   RESTORE SELECTED ROLE ONLY
========================================================= */

(function restoreRole(){

    const saved =
        String(
            localStorage.getItem(
                "riderx_selected_role"
            ) || ""
        )
        .trim()
        .toLowerCase();

    if(saved === "customer"){
        customerRole.checked = true;
    }

    if(saved === "rider"){
        riderRole.checked = true;
    }

})();


/* =========================================================
   ROLE CHANGE
========================================================= */

customerRole.addEventListener(
    "change",
    function(){

        if(this.checked){

            saveRole("customer");
            clearMessages();

        }

    }
);


riderRole.addEventListener(
    "change",
    function(){

        if(this.checked){

            saveRole("rider");
            clearMessages();

        }

    }
);


/* =========================================================
   PHONE
========================================================= */

phoneInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,10);

    }
);


/* =========================================================
   PASSWORD
========================================================= */

document
.getElementById("togglePassword")
.addEventListener(
    "click",
    function(){

        const isPassword =
            passwordInput.type === "password";

        passwordInput.type =
            isPassword
                ? "text"
                : "password";

        this.textContent =
            isPassword
                ? "🙈"
                : "👁";

        this.setAttribute(
            "aria-label",
            isPassword
                ? "Hide password"
                : "Show password"
        );

    }
);


/* =========================================================
   LOGIN
========================================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessages();

        const role =
            getRole();

        const mobile =
            normalizePhone(
                phoneInput.value
            );

        const password =
            passwordInput.value;


        if(!role){

            showError(
                "Please select Customer or Rider."
            );

            return;

        }


        if(
            !/^[6-9]\d{9}$/.test(mobile)
        ){

            showError(
                "Please enter a valid 10-digit Indian mobile number."
            );

            phoneInput.focus();

            return;

        }


        if(password.length < 6){

            showError(
                "Password must contain at least 6 characters."
            );

            passwordInput.focus();

            return;

        }


        setLoading(true);


        try{

            const users =
                getUsers();

            const user =
                findUser(
                    users,
                    mobile,
                    password,
                    role
                );


            if(!user){

                showError(
                    "Invalid mobile number or password."
                );

                setLoading(false);

                return;

            }


            const status =
                String(
                    user.status || "active"
                )
                .trim()
                .toLowerCase();


            if(
                [
                    "blocked",
                    "suspended",
                    "disabled"
                ].includes(status)
            ){

                showError(
                    "Your account is currently disabled. Please contact RiderX support."
                );

                setLoading(false);

                return;

            }


            /*
             * Create a clean authenticated session.
             */

            const session = {

                uid:
                    user.uid ||
                    user.id ||
                    role + "_" + mobile,

                id:
                    user.id ||
                    user.uid ||
                    role + "_" + mobile,

                name:
                    user.name ||
                    user.fullName ||
                    (
                        role === "rider"
                            ? "RiderX Rider"
                            : "RiderX Customer"
                    ),

                fullName:
                    user.fullName ||
                    user.name ||
                    "",

                phone:
                    mobile,

                mobile:
                    mobile,

                email:
                    user.email ||
                    "",

                role:
                    role,

                status:
                    status,

                authenticated:
                    true,

                loggedIn:
                    true,

                isLoggedIn:
                    true,

                loginAt:
                    new Date().toISOString()

            };


            /*
             * IMPORTANT:
             * Clear stale session values first.
             */

            localStorage.removeItem(
                "riderx_user"
            );

            localStorage.removeItem(
                "riderx_customer"
            );

            localStorage.removeItem(
                "riderx_rider"
            );


            /*
             * Main authenticated session.
             */

            localStorage.setItem(
                "riderx_user",
                JSON.stringify(session)
            );


            /*
             * Role-specific session.
             */

            localStorage.setItem(
                role === "rider"
                    ? "riderx_rider"
                    : "riderx_customer",
                JSON.stringify(session)
            );


            /*
             * Current role.
             */

            localStorage.setItem(
                "userRole",
                role
            );

            localStorage.setItem(
                "riderx_role",
                role
            );

            localStorage.setItem(
                "riderx_selected_role",
                role
            );


            if(rememberInput.checked){

                localStorage.setItem(
                    "riderx_remember",
                    "true"
                );

            }else{

                localStorage.removeItem(
                    "riderx_remember"
                );

            }


            showSuccess(
                "Login successful. Opening your RiderX dashboard..."
            );


            const destination =
                role === "rider"
                    ? "../rider/home.html"
                    : "../customer/home.html";


            setTimeout(
                function(){

                    window.location.replace(
                        destination
                    );

                },
                650
            );


        }catch(error){

            console.error(
                "RiderX login error:",
                error
            );

            showError(
                "Unable to login right now. Please try again."
            );

            setLoading(false);

        }

    }
);


/* =========================================================
   FIND USER
========================================================= */

function findUser(
    users,
    mobile,
    password,
    role
){

    for(
        const item of users
    ){

        if(
            !item ||
            typeof item !== "object"
        ){
            continue;
        }


        const itemPhone =
            normalizePhone(
                item.phone ||
                item.mobile ||
                item.phoneNumber
            );


        if(itemPhone !== mobile){
            continue;
        }


        const itemRole =
            String(
                item.role || ""
            )
            .trim()
            .toLowerCase();


        if(
            itemRole &&
            itemRole !== role &&
            !(
                role === "rider" &&
                itemRole === "driver"
            )
        ){
            continue;
        }


        const itemPassword =
            String(
                item.password || ""
            );


        if(itemPassword !== password){
            continue;
        }


        return item;

    }


    return null;

}


/* =========================================================
   USERS
========================================================= */

function getUsers(){

    const users = [];


    readArrayStorage(
        "riderx_users",
        users
    );


    /*
     * Legacy user data is used only for
     * login verification.
     *
     * It does NOT create a session.
     */

    readObjectStorage(
        "riderx_customer",
        users
    );

    readObjectStorage(
        "riderx_rider",
        users
    );


    readArrayStorage(
        "users",
        users
    );


    return deduplicateUsers(users);

}


/* =========================================================
   STORAGE
========================================================= */

function readArrayStorage(
    key,
    target
){

    try{

        const raw =
            localStorage.getItem(key);

        if(!raw){
            return;
        }

        const parsed =
            JSON.parse(raw);

        if(Array.isArray(parsed)){

            target.push(...parsed);

        }

    }catch(error){

        console.warn(
            "Unable to read:",
            key,
            error
        );

    }

}


function readObjectStorage(
    key,
    target
){

    try{

        const raw =
            localStorage.getItem(key);

        if(!raw){
            return;
        }

        const parsed =
            JSON.parse(raw);

        if(
            parsed &&
            typeof parsed === "object" &&
            !Array.isArray(parsed)
        ){

            target.push(parsed);

        }

    }catch(error){

        console.warn(
            "Unable to read:",
            key,
            error
        );

    }

}


/* =========================================================
   DEDUPLICATE
========================================================= */

function deduplicateUsers(users){

    const result = [];

    const seen = new Set();


    users.forEach(
        function(user){

            if(
                !user ||
                typeof user !== "object"
            ){
                return;
            }


            const phone =
                normalizePhone(
                    user.phone ||
                    user.mobile ||
                    user.phoneNumber
                );


            const id =
                String(
                    user.uid ||
                    user.id ||
                    ""
                );


            const key =
                phone
                    ? "phone:" + phone
                    : id
                        ? "id:" + id
                        : "";


            if(
                key &&
                seen.has(key)
            ){
                return;
            }


            if(key){
                seen.add(key);
            }


            result.push(user);

        }
    );


    return result;

}


/* =========================================================
   PHONE
========================================================= */

function normalizePhone(value){

    return String(
        value || ""
    )
    .replace(/\D/g,"")
    .slice(-10);

}


/* =========================================================
   OTP
========================================================= */

document
.getElementById("otpBtn")
.addEventListener(
    "click",
    function(){

        clearMessages();

        const role =
            getRole();


        if(!role){

            showError(
                "Please select Customer or Rider first."
            );

            return;

        }


        const mobile =
            normalizePhone(
                phoneInput.value
            );


        if(
            mobile &&
            !/^[6-9]\d{9}$/.test(mobile)
        ){

            showError(
                "Please enter a valid 10-digit Indian mobile number."
            );

            phoneInput.focus();

            return;

        }


        saveRole(role);


        if(mobile){

            localStorage.setItem(
                "riderx_otp_phone",
                mobile
            );

        }else{

            localStorage.removeItem(
                "riderx_otp_phone"
            );

        }


        window.location.href =
            "./otp-login.html";

    }
);

/* =========================================================
   BACK
========================================================= */

document
.getElementById("backBtn")
.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "riderx_selected_role"
        );

        window.location.href =
            "./role.html";

    }
);


/* =========================================================
   LOADING
========================================================= */

function setLoading(loading){

    loginButton.disabled =
        loading;


    if(loading){

        loginButton.innerHTML =
            '<span class="loader"></span>Logging in...';

    }else{

        loginButton.textContent =
            "Login";

    }

}


/* =========================================================
   MESSAGES
========================================================= */

function clearMessages(){

    errorBox.classList.remove("show");
    successBox.classList.remove("show");

    errorBox.textContent = "";
    successBox.textContent = "";

}


function showError(message){

    successBox.classList.remove("show");
    successBox.textContent = "";

    errorBox.textContent =
        message;

    errorBox.classList.add("show");

}


function showSuccess(message){

    errorBox.classList.remove("show");
    errorBox.textContent = "";

    successBox.textContent =
        message;

    successBox.classList.add("show");

}
