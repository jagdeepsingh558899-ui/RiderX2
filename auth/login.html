<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX secure login"
    >

    <title>RiderX - Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">


    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background: #070707;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }


        .auth-page {

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                max(15px, env(safe-area-inset-top))
                max(15px, env(safe-area-inset-right))
                max(15px, env(safe-area-inset-bottom))
                max(15px, env(safe-area-inset-left));

            position: relative;

            overflow: auto;
        }


        .auth-card {

            width: 100%;
            max-width: 430px;

            padding: 28px 22px 22px;

            border:
                1px solid #292929;

            border-radius: 22px;

            background: #111111;

            box-shadow:
                0 22px 70px rgba(0, 0, 0, .55);

            position: relative;
            z-index: 2;
        }


        .brand {

            text-align: center;

            margin-bottom: 25px;
        }


        .logo {

            width: 66px;
            height: 66px;

            margin: 0 auto 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #ffd400;
            color: #111111;

            font-size: 24px;
            font-weight: 1000;
        }


        .brand h1 {

            margin: 0;

            font-size: 26px;
            font-weight: 1000;
        }


        .brand h1 span {

            color: #ffd400;
        }


        .brand p {

            margin: 6px 0 0;

            color: #777777;

            font-size: 10px;
        }


        .heading {

            margin-bottom: 17px;
        }


        .heading h2 {

            margin: 0;

            font-size: 19px;
            font-weight: 900;
        }


        .heading p {

            margin: 6px 0 0;

            color: #777777;

            font-size: 10px;
            line-height: 1.5;
        }


        .message {

            display: none;

            margin-bottom: 13px;

            padding: 11px;

            border-radius: 9px;

            font-size: 10px;

            line-height: 1.5;
        }


        .message.show {

            display: block;
        }


        .message.error {

            border: 1px solid #522b2b;

            background: #251515;

            color: #ff7777;
        }


        .message.success {

            border: 1px solid #285334;

            background: #132318;

            color: #69e48b;
        }


        .role-box {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;

            margin-bottom: 17px;
        }


        .role-option {

            position: relative;
        }


        .role-option input {

            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        .role-label {

            min-height: 70px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 4px;

            border:
                1px solid #303030;

            border-radius: 11px;

            background: #191919;

            cursor: pointer;

            transition: .2s ease;
        }


        .role-label:hover {

            border-color: #555555;
        }


        .role-option input:checked
        + .role-label {

            border-color: #ffd400;

            background: #211f12;

            box-shadow:
                0 0 0 1px
                rgba(255, 212, 0, .08);
        }


        .role-icon {

            font-size: 20px;
        }


        .role-name {

            color: #cccccc;

            font-size: 10px;

            font-weight: 900;
        }


        .role-option input:checked
        + .role-label
        .role-name {

            color: #ffd400;
        }


        .form-group {

            margin-bottom: 14px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #999999;

            font-size: 9px;

            font-weight: 900;

            text-transform: uppercase;
        }


        .input-wrap {

            position: relative;
        }


        .form-group input {

            width: 100%;
            height: 48px;

            padding:
                0 13px;

            border:
                1px solid #333333;

            border-radius: 10px;

            outline: none;

            background: #1a1a1a;

            color: #ffffff;

            font-size: 12px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }


        .form-group input::placeholder {

            color: #555555;
        }


        .form-group input:focus {

            border-color: #ffd400;

            box-shadow:
                0 0 0 2px
                rgba(255, 212, 0, .08);
        }


        .password-wrap input {

            padding-right: 45px;
        }


        .eye-button {

            position: absolute;

            right: 6px;
            top: 50%;

            width: 35px;
            height: 35px;

            transform:
                translateY(-50%);

            border: 0;

            border-radius: 7px;

            background: transparent;

            color: #777777;

            cursor: pointer;
        }


        .eye-button:hover {

            color: #ffd400;
        }


        .forgot {

            display: flex;

            justify-content: flex-end;

            margin-top: -5px;
            margin-bottom: 15px;
        }


        .forgot button {

            padding: 0;

            border: 0;

            background: transparent;

            color: #ffd400;

            cursor: pointer;

            font-size: 9px;

            font-weight: 800;
        }


        .login-button {

            width: 100%;

            min-height: 49px;

            border: 0;

            border-radius: 10px;

            background: #ffd400;

            color: #111111;

            cursor: pointer;

            font-size: 12px;

            font-weight: 1000;

            transition: .2s ease;
        }


        .login-button:hover {

            background: #ffe04b;

            transform:
                translateY(-1px);
        }


        .login-button:active {

            transform: scale(.99);
        }


        .login-button:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }


        .loader {

            display: inline-block;

            width: 13px;
            height: 13px;

            margin-right: 7px;

            vertical-align: -2px;

            border:
                2px solid
                rgba(0, 0, 0, .25);

            border-top-color: #111111;

            border-radius: 50%;

            animation:
                spin .7s linear infinite;
        }


        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 18px 0;
        }


        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #252525;
        }


        .divider span {

            color: #555555;

            font-size: 8px;

            font-weight: 800;
        }


        .secondary-button {

            width: 100%;

            min-height: 45px;

            border:
                1px solid #303030;

            border-radius: 10px;

            background: #181818;

            color: #dddddd;

            cursor: pointer;

            font-size: 10px;

            font-weight: 800;

            transition: .2s ease;
        }


        .secondary-button:hover {

            border-color: #ffd400;

            color: #ffd400;
        }


        .register-link {

            margin-top: 18px;

            text-align: center;

            color: #777777;

            font-size: 10px;
        }


        .register-link a {

            color: #ffd400;

            text-decoration: none;

            font-weight: 900;
        }


        .footer {

            margin-top: 18px;

            padding-top: 13px;

            border-top:
                1px solid #202020;

            text-align: center;

            color: #444444;

            font-size: 8px;
        }


        .field-error {

            border-color:
                #ff5555 !important;

            box-shadow:
                0 0 0 2px
                rgba(255, 80, 80, .08)
                !important;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        @media (max-width: 480px) {

            .auth-page {

                align-items:
                    flex-start;

                padding-top: 16px;
                padding-bottom: 16px;
            }


            .auth-card {

                padding:
                    24px 17px 19px;

                border-radius: 18px;
            }
        }


        @media (max-width: 340px) {

            .auth-card {

                padding-left: 13px;
                padding-right: 13px;
            }
        }

    </style>

</head>


<body>


<main class="auth-page">


    <section class="auth-card">


        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                Your ride. Your journey. Your choice.
            </p>

        </div>


        <div class="heading">

            <h2>
                Welcome Back
            </h2>

            <p>
                Login to continue to your RiderX account.
            </p>

        </div>


        <div
            id="errorBox"
            class="message error"
            role="alert"
            aria-live="polite"
        ></div>


        <div
            id="successBox"
            class="message success"
            role="status"
            aria-live="polite"
        ></div>


        <div class="role-box">


            <div class="role-option">

                <input
                    type="radio"
                    name="role"
                    id="customerRole"
                    value="customer"
                >

                <label
                    for="customerRole"
                    class="role-label"
                >

                    <span class="role-icon">
                        👤
                    </span>

                    <span class="role-name">
                        Customer
                    </span>

                </label>

            </div>


            <div class="role-option">

                <input
                    type="radio"
                    name="role"
                    id="riderRole"
                    value="rider"
                >

                <label
                    for="riderRole"
                    class="role-label"
                >

                    <span class="role-icon">
                        🛵
                    </span>

                    <span class="role-name">
                        Rider
                    </span>

                </label>

            </div>


        </div>


        <form
            id="loginForm"
            novalidate
        >


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    inputmode="email"
                    maxlength="120"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="input-wrap password-wrap">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        maxlength="100"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="eye-button"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="forgot">

                <button
                    type="button"
                    id="forgotPassword"
                >
                    Forgot Password?
                </button>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>


        </form>


        <div class="divider">

            <span>
                OR
            </span>

        </div>


        <button
            type="button"
            id="otpButton"
            class="secondary-button"
        >
            Login with Mobile OTP
        </button>


        <div class="register-link">

            Don't have an account?

            <a
                href="./register.html"
                id="registerLink"
            >
                Create Account
            </a>

        </div>


        <div class="footer">

            © 2026 RiderX • Secure Login

        </div>


    </section>


</main>


<script type="module">


    "use strict";


    /* ========================================================
       FIREBASE
    ======================================================== */

    import {

        auth,

        db,

        signInWithEmailAndPassword,

        onAuthStateChanged,

        sendPasswordResetEmail,

        doc,

        getDoc

    } from "../firebase/firebase-config.js";


    /* ========================================================
       ELEMENTS
    ======================================================== */

    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    const customerRole =
        document.getElementById(
            "customerRole"
        );


    const riderRole =
        document.getElementById(
            "riderRole"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const successBox =
        document.getElementById(
            "successBox"
        );


    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );


    const otpButton =
        document.getElementById(
            "otpButton"
        );


    /* ========================================================
       EXISTING ROLE
    ======================================================== */

    const savedRole =
        normalizeRole(
            localStorage.getItem(
                "riderx_selected_role"
            ) ||
            localStorage.getItem(
                "userRole"
            )
        );


    if (
        savedRole === "customer"
    ) {

        customerRole.checked =
            true;

    }


    if (
        savedRole === "rider"
    ) {

        riderRole.checked =
            true;

    }


    /* ========================================================
       ROLE CHANGE
    ======================================================== */

    customerRole.addEventListener(
        "change",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "customer"
            );

            hideMessages();

        }
    );


    riderRole.addEventListener(
        "change",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                "rider"
            );

            hideMessages();

        }
    );


    /* ========================================================
       INPUT CLEANUP
    ======================================================== */

    emailInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .trimStart()
                    .toLowerCase();

            clearFieldError(
                this
            );

            hideMessages();

        }
    );


    passwordInput.addEventListener(
        "input",
        function () {

            clearFieldError(
                this
            );

            hideMessages();

        }
    );


    /* ========================================================
       PASSWORD VISIBILITY
    ======================================================== */

    document
        .getElementById(
            "togglePassword"
        )
        .addEventListener(
            "click",
            function () {

                const visible =
                    passwordInput.type ===
                    "password";


                passwordInput.type =
                    visible
                        ? "text"
                        : "password";


                this.textContent =
                    visible
                        ? "🙈"
                        : "👁";


                this.setAttribute(
                    "aria-label",
                    visible
                        ? "Hide password"
                        : "Show password"
                );

            }
        );


    /* ========================================================
       LOGIN
    ======================================================== */

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            hideMessages();

            clearFieldError(
                emailInput
            );

            clearFieldError(
                passwordInput
            );


            const role =
                getSelectedRole();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            /* ------------------------------------------------
               ROLE
            ------------------------------------------------ */

            if (!role) {

                showError(
                    "Please select Customer or Rider."
                );

                return;
            }


            /* ------------------------------------------------
               EMAIL
            ------------------------------------------------ */

            if (
                !isValidEmail(
                    email
                )
            ) {

                markFieldError(
                    emailInput
                );

                showError(
                    "Please enter a valid email address."
                );

                emailInput.focus();

                return;
            }


            /* ------------------------------------------------
               PASSWORD
            ------------------------------------------------ */

            if (
                !password
            ) {

                markFieldError(
                    passwordInput
                );

                showError(
                    "Please enter your password."
                );

                passwordInput.focus();

                return;
            }


            setLoading(
                true
            );


            try {


                /* --------------------------------------------
                   FIREBASE AUTH
                -------------------------------------------- */

                const credential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const firebaseUser =
                    credential.user;


                if (!firebaseUser) {

                    throw new Error(
                        "Authentication failed."
                    );
                }


                /* --------------------------------------------
                   FIRESTORE PROFILE
                -------------------------------------------- */

                const userRef =
                    doc(
                        db,
                        "users",
                        firebaseUser.uid
                    );


                const userSnapshot =
                    await getDoc(
                        userRef
                    );


                let profile = null;


                if (
                    userSnapshot.exists()
                ) {

                    profile =
                        userSnapshot.data();

                }


                /* --------------------------------------------
                   DETERMINE ROLE
                -------------------------------------------- */

                let accountRole =
                    normalizeRole(
                        profile?.role
                    );


                /*
                 * If Firestore profile doesn't contain role,
                 * use selected login role temporarily.
                 */

                if (!accountRole) {

                    accountRole =
                        role;
                }


                /* --------------------------------------------
                   SECURITY: SELECTED ROLE MUST MATCH
                -------------------------------------------- */

                if (
                    accountRole !== role
                ) {

                    showError(
                        "This account belongs to the " +
                        formatRole(
                            accountRole
                        ) +
                        " account. Please select the correct account type."
                    );


                    /*
                     * Do not leave a wrong-role authenticated
                     * session active.
                     */

                    await safeLogout();


                    setLoading(
                        false
                    );

                    return;
                }


                /* --------------------------------------------
                   PROFILE FALLBACK
                -------------------------------------------- */

                const sessionData = {

                    uid:
                        firebaseUser.uid,

                    id:
                        firebaseUser.uid,

                    name:
                        profile?.name ||
                        profile?.fullName ||
                        firebaseUser.displayName ||
                        "RiderX User",

                    fullName:
                        profile?.fullName ||
                        profile?.name ||
                        firebaseUser.displayName ||
                        "RiderX User",

                    email:
                        firebaseUser.email ||
                        profile?.email ||
                        email,

                    phone:
                        profile?.phone ||
                        profile?.mobile ||
                        "",

                    mobile:
                        profile?.mobile ||
                        profile?.phone ||
                        "",

                    role:
                        accountRole,

                    status:
                        profile?.status ||
                        (
                            accountRole === "rider"
                                ? "pending"
                                : "active"
                        ),

                    city:
                        profile?.city ||
                        "Chandigarh",

                    vehicleType:
                        profile?.vehicleType ||
                        "",

                    vehicleNumber:
                        profile?.vehicleNumber ||
                        "",

                    rating:
                        Number(
                            profile?.rating ?? 5
                        ),

                    ratingCount:
                        Number(
                            profile?.ratingCount ?? 0
                        )

                };


                /* --------------------------------------------
                   LOCAL UI SESSION
                   NO PASSWORD
                -------------------------------------------- */

                localStorage.setItem(
                    "riderx_user",
                    JSON.stringify(
                        sessionData
                    )
                );


                localStorage.setItem(
                    "userRole",
                    accountRole
                );


                localStorage.setItem(
                    "riderx_selected_role",
                    accountRole
                );


                if (
                    accountRole === "customer"
                ) {

                    localStorage.setItem(
                        "riderx_customer",
                        JSON.stringify(
                            sessionData
                        )
                    );

                }


                if (
                    accountRole === "rider"
                ) {

                    localStorage.setItem(
                        "riderx_rider",
                        JSON.stringify(
                            sessionData
                        )
                    );

                }


                /* --------------------------------------------
                   RIDER STATUS
                -------------------------------------------- */

                if (
                    accountRole === "rider" &&
                    normalizeStatus(
                        sessionData.status
                    ) === "blocked"
                ) {

                    showError(
                        "Your rider account is currently blocked. Please contact RiderX support."
                    );


                    await safeLogout();


                    setLoading(
                        false
                    );

                    return;
                }


                /* --------------------------------------------
                   SUCCESS
                -------------------------------------------- */

                showSuccess(
                    "Login successful. Opening your RiderX app..."
                );


                setTimeout(
                    function () {

                        redirectByRole(
                            accountRole,
                            sessionData
                        );

                    },
                    600
                );


            } catch (error) {

                console.error(
                    "RiderX login error:",
                    error
                );


                showError(
                    getFirebaseErrorMessage(
                        error
                    )
                );


                setLoading(
                    false
                );

            }

        }
    );


    /* ========================================================
       FORGOT PASSWORD
    ======================================================== */

    forgotPassword.addEventListener(
        "click",
        async function () {

            hideMessages();

            clearFieldError(
                emailInput
            );


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            if (
                !isValidEmail(
                    email
                )
            ) {

                markFieldError(
                    emailInput
                );

                showError(
                    "Enter your email address first, then tap Forgot Password."
                );

                emailInput.focus();

                return;
            }


            forgotPassword.disabled =
                true;


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showSuccess(
                    "Password reset email sent. Check your inbox and spam folder."
                );


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                showError(
                    getPasswordResetError(
                        error
                    )
                );


            } finally {

                forgotPassword.disabled =
                    false;
            }

        }
    );


    /* ========================================================
       OTP
    ======================================================== */

    otpButton.addEventListener(
        "click",
        function () {

            const role =
                getSelectedRole();


            if (role) {

                localStorage.setItem(
                    "riderx_selected_role",
                    role
                );

            }


            window.location.href =
                "./otp-login.html";

        }
    );


    /* ========================================================
       REGISTER
    ======================================================== */

    document
        .getElementById(
            "registerLink"
        )
        .addEventListener(
            "click",
            function () {

                const role =
                    getSelectedRole();


                if (role) {

                    localStorage.setItem(
                        "riderx_selected_role",
                        role
                    );

                }

            }
        );


    /* ========================================================
       AUTH SESSION CHECK
       If an authenticated Firebase user is already present,
       do not force them through login again.
    ======================================================== */

    let initialAuthCheck =
        true;


    onAuthStateChanged(
        auth,
        async function (firebaseUser) {

            if (
                !initialAuthCheck
            ) {

                return;
            }


            initialAuthCheck =
                false;


            if (!firebaseUser) {

                return;
            }


            /*
             * Only redirect an already-authenticated user when
             * no login form submission is currently happening.
             */

            if (
                loginButton.disabled
            ) {

                return;
            }


            try {

                const profileSnapshot =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            firebaseUser.uid
                        )
                    );


                if (
                    !profileSnapshot.exists()
                ) {

                    return;
                }


                const profile =
                    profileSnapshot.data();


                const profileRole =
                    normalizeRole(
                        profile?.role
                    );


                if (!profileRole) {

                    return;
                }


                /*
                 * Only automatically redirect if the user has
                 * already selected the same role or no role.
                 */

                const selected =
                    getSelectedRole();


                if (
                    selected &&
                    selected !== profileRole
                ) {

                    return;
                }


                const sessionData = {

                    uid:
                        firebaseUser.uid,

                    id:
                        firebaseUser.uid,

                    name:
                        profile?.name ||
                        profile?.fullName ||
                        firebaseUser.displayName ||
                        "RiderX User",

                    fullName:
                        profile?.fullName ||
                        profile?.name ||
                        firebaseUser.displayName ||
                        "RiderX User",

                    email:
                        firebaseUser.email ||
                        profile?.email ||
                        "",

                    phone:
                        profile?.phone ||
                        profile?.mobile ||
                        "",

                    mobile:
                        profile?.mobile ||
                        profile?.phone ||
                        "",

                    role:
                        profileRole,

                    status:
                        profile?.status ||
                        "active",

                    city:
                        profile?.city ||
                        "Chandigarh",

                    vehicleType:
                        profile?.vehicleType ||
                        "",

                    vehicleNumber:
                        profile?.vehicleNumber ||
                        "",

                    rating:
                        Number(
                            profile?.rating ?? 5
                        ),

                    ratingCount:
                        Number(
                            profile?.ratingCount ?? 0
                        )

                };


                localStorage.setItem(
                    "riderx_user",
                    JSON.stringify(
                        sessionData
                    )
                );


                localStorage.setItem(
                    "userRole",
                    profileRole
                );


                localStorage.setItem(
                    "riderx_selected_role",
                    profileRole
                );


                redirectByRole(
                    profileRole,
                    sessionData
                );


            } catch (error) {

                console.warn(
                    "Existing session check failed:",
                    error
                );

            }

        }
    );


    /* ========================================================
       HELPERS
    ======================================================== */

    function getSelectedRole() {

        if (
            customerRole.checked
        ) {

            return "customer";
        }


        if (
            riderRole.checked
        ) {

            return "rider";
        }


        return "";
    }


    function normalizeRole(
        role
    ) {

        const value =
            String(
                role || ""
            )
                .trim()
                .toLowerCase();


        if (
            value === "rider" ||
            value === "driver" ||
            value === "delivery"
        ) {

            return "rider";
        }


        if (
            value === "customer"
        ) {

            return "customer";
        }


        return "";
    }


    function formatRole(
        role
    ) {

        return normalizeRole(
            role
        ) === "rider"
            ? "Rider"
            : "Customer";
    }


    function normalizeStatus(
        status
    ) {

        return String(
            status || ""
        )
            .trim()
            .toLowerCase();
    }


    function isValidEmail(
        email
    ) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/
            .test(
                email
            );
    }


    /* ========================================================
       REDIRECT
    ======================================================== */

    function redirectByRole(
        role,
        session
    ) {

        const normalizedRole =
            normalizeRole(
                role
            );


        if (
            normalizedRole ===
            "customer"
        ) {

            window.location.replace(
                "../customer/home.html"
            );

            return;
        }


        if (
            normalizedRole ===
            "rider"
        ) {

            /*
             * Rider approval is handled by the rider side.
             * Pending riders can still enter their rider app,
             * where later verification guards will control
             * online/ride acceptance permissions.
             */

            window.location.replace(
                "../rider/home.html"
            );

            return;
        }


        showError(
            "Your account role could not be determined. Please contact RiderX support."
        );
    }


    /* ========================================================
       LOADING
    ======================================================== */

    function setLoading(
        loading
    ) {

        loginButton.disabled =
            loading;


        if (
            loading
        ) {

            loginButton.innerHTML =
                '<span class="loader"></span>Logging in...';

        } else {

            loginButton.textContent =
                "Login";
        }

    }


    /* ========================================================
       MESSAGES
    ======================================================== */

    function hideMessages() {

        errorBox.classList.remove(
            "show"
        );

        successBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            "";
    }


    function showError(
        message
    ) {

        successBox.classList.remove(
            "show"
        );

        successBox.textContent =
            "";

        errorBox.textContent =
            message;

        errorBox.classList.add(
            "show"
        );
    }


    function showSuccess(
        message
    ) {

        errorBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            message;

        successBox.classList.add(
            "show"
        );
    }


    /* ========================================================
       FIELD ERRORS
    ======================================================== */

    function markFieldError(
        field
    ) {

        if (!field) {
            return;
        }

        field.classList.add(
            "field-error"
        );
    }


    function clearFieldError(
        field
    ) {

        if (!field) {
            return;
        }

        field.classList.remove(
            "field-error"
        );
    }


    /* ========================================================
       FIREBASE ERROR
    ======================================================== */

    function getFirebaseErrorMessage(
        error
    ) {

        const code =
            String(
                error?.code || ""
            )
                .toLowerCase();


        switch (code) {

            case "auth/invalid-email":

                return "Please enter a valid email address.";


            case "auth/user-not-found":

                return "No RiderX account was found with this email.";


            case "auth/wrong-password":

                return "Incorrect password. Please try again.";


            case "auth/invalid-credential":

                return "Email or password is incorrect.";


            case "auth/user-disabled":

                return "This Firebase account has been disabled.";


            case "auth/too-many-requests":

                return "Too many login attempts. Please wait and try again later.";


            case "auth/network-request-failed":

                return "Network error. Please check your internet connection.";


            case "auth/operation-not-allowed":

                return "Email/password login is not enabled in Firebase Authentication.";


            case "permission-denied":

                return "Firebase permission denied. Please check Firestore Security Rules.";


            default:

                if (
                    error?.message &&
                    /permission/i.test(
                        error.message
                    )
                ) {

                    return "Firebase permission denied. Please check Firestore Security Rules.";
                }


                return "Login failed. Please check your details and try again.";
        }
    }


    function getPasswordResetError(
        error
    ) {

        const code =
            String(
                error?.code || ""
            )
                .toLowerCase();


        switch (code) {

            case "auth/user-not-found":

                return "No account was found with this email.";


            case "auth/invalid-email":

                return "Please enter a valid email address.";


            case "auth/too-many-requests":

                return "Too many requests. Please wait and try again later.";


            case "auth/network-request-failed":

                return "Network error. Please check your internet connection.";


            default:

                return "Unable to send the password reset email. Please try again.";
        }
    }


    /* ========================================================
       SAFE LOGOUT
    ======================================================== */

    async function safeLogout() {

        try {

            const {
                signOut
            } = await import(
                "../firebase/firebase-config.js"
            );


            await signOut(
                auth
            );

        } catch (error) {

            console.warn(
                "Logout cleanup failed:",
                error
            );
        }


        localStorage.removeItem(
            "riderx_user"
        );

        localStorage.removeItem(
            "riderx_customer"
        );

        localStorage.removeItem(
            "riderx_rider"
        );

        localStorage.removeItem(
            "userRole"
        );
    }


</script>
