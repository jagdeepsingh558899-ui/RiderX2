<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RiderX Login</title>

<link rel="stylesheet"
href="../css/style.css">

<style>

body{

background:#000;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.login-box{

width:100%;
max-width:420px;

background:#111;

border:2px solid #FFD600;

border-radius:25px;

padding:30px 25px;

box-shadow:0 0 30px rgba(255,214,0,.15);

animation:zoomIn .8s;

}

.logo{

text-align:center;
margin-bottom:25px;

}

.logo img{

width:95px;
height:95px;
margin-bottom:15px;

}

.logo h1{

color:#FFD600;
font-size:38px;

}

.logo span{

color:#fff;

}

.logo p{

color:#aaa;
margin-top:8px;

}

.input-box{

margin-top:18px;

}

.input-box label{

display:block;
margin-bottom:8px;
color:#FFD600;

}

.input-box input{

width:100%;
height:55px;

background:#222;

border:none;

border-radius:15px;

padding:0 15px;

color:#fff;

font-size:16px;

outline:none;

}

.input-box input::placeholder{

color:#888;

}

button{

width:100%;

height:55px;

margin-top:28px;

background:#FFD600;

color:#111;

font-size:18px;

font-weight:bold;

border:none;

border-radius:15px;

cursor:pointer;

transition:.3s;

}

button:active{

transform:scale(.97);

}

#msg{

margin-top:18px;

text-align:center;

color:#ff5252;

font-size:14px;

}

.bottom{

margin-top:25px;

text-align:center;

}

.bottom a{

color:#FFD600;

text-decoration:none;

font-weight:bold;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

<img src="../assets/logo.svg">

<h1>Rider<span>X</span></h1>

<p>Welcome Back</p>

</div>

<div class="input-box">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter Email">

</div>

<div class="input-box">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password">

</div>

<button
onclick="login()">

LOGIN

</button>

<p id="msg"></p>

<div class="bottom">

Don't have an account?

<a href="register.html">

Register

</a>

</div>

</div>

<script type="module">
  import { auth } from "../firebase/config.js";

import {
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import { db } from "../firebase/config.js";

window.login = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("msg");

msg.innerHTML = "";

if(email==="" || password===""){

msg.innerHTML = "Please fill all fields.";
return;

}

try{

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

const userDoc =
await getDoc(
doc(db,"users",userCredential.user.uid)
);

msg
