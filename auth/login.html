<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX Login"
    >

    <title>RiderX - Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #070707;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button {
            font: inherit;
        }

        .page {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .glow.one {
            width: 430px;
            height: 430px;
            top: -300px;
            right: -170px;
            background: rgba(255, 212, 0, .08);
        }

        .glow.two {
            width: 390px;
            height: 390px;
            bottom: -280px;
            left: -190px;
            background: rgba(255, 212, 0, .05);
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 455px;
            padding: 30px 23px 22px;
            border: 1px solid #292929;
            border-radius: 24px;
            background: #111111;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .55);
        }

        .brand {
            text-align: center;
            margin-bottom: 27px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: #ffd400;
            color: #090909;
            font-size: 24px;
            font-weight: 1000;
            box-shadow: 0 10px 35px rgba(255, 212, 0, .12);
        }

        .brand h1 {
            margin: 0;
            font-size: 27px;
            font-weight: 1000;
            letter-spacing: -.6px;
        }

        .brand h1 span {
            color: #ffd400;
        }

        .brand p {
            margin: 6px 0 0;
            color: #777777;
            font-size: 9px;
        }

        .heading {
            text-align: center;
        }

        .heading h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
        }

        .heading p {
            margin: 7px auto 0;
            max-width: 340px;
            color: #777777;
            font-size: 9px;
            line-height: 1.6;
        }

        .choices {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        .choice {
            width: 100%;
            min-height: 94px;
            display: grid;
            grid-template-columns: 54px 1fr 24px;
            align-items: center;
            gap: 13px;
            padding: 15px;
            border: 1px solid #303030;
            border-radius: 15px;
            background: #171717;
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            transition:
                transform .15s ease,
                border-color .15s ease,
                background .15s ease;
        }

        .choice:hover {
            transform: translateY(-1px);
            border-color: #ffd400;
            background: #1a1a1a;
        }

        .choice:active {
            transform: scale(.99);
        }

        .icon {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #232323;
            color: #ffd400;
            font-size: 17px;
            font-weight: 1000;
        }

        .choice strong {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: 1000;
        }

        .choice span {
            display: block;
            color: #777777;
            font-size: 8px;
            line-height: 1.55;
        }

        .arrow {
            color: #555555;
            font-size: 17px;
            font-weight: 900;
        }

        .choice:hover .arrow {
            color: #ffd400;
        }

        .otp {
            width: 100%;
            height: 45px;
            margin-top: 15px;
            border: 1px solid #333333;
            border-radius: 10px;
            background: #181818;
            color: #aaaaaa;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .otp:hover {
            border-color: #ffd400;
            color: #ffd400;
        }

        .register {
            margin-top: 20px;
            padding-top: 17px;
            border-top: 1px solid #272727;
            text-align: center;
            color: #666666;
            font-size: 9px;
        }

        .register button {
            margin-left: 4px;
            border: 0;
            padding: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-weight: 900;
        }

        .status {
            display: none;
            margin-top: 14px;
            padding: 9px;
            border: 1px solid #443b00;
            border-radius: 8px;
            background: rgba(255, 212, 0, .07);
            color: #ffd400;
            font-size: 8px;
            text-align: center;
        }

        .status.show {
            display: block;
        }

        .footer {
            margin-top: 18px;
            color: #444444;
            font-size: 8px;
            text-align: center;
        }

        @media (max-width: 390px) {

            .card {
                padding: 25px 17px 19px;
                border-radius: 20px;
            }

            .choice {
                grid-template-columns: 48px 1fr 20px;
                min-height: 86px;
                padding: 12px;
            }

            .icon {
                width: 48px;
                height: 48px;
            }

        }

    </style>

</head>

<body>

<main class="page">

    <div class="glow one"></div>
    <div class="glow two"></div>


    <section class="card">

        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                One platform. Every journey.
            </p>

        </div>


        <div class="heading">

            <h2>
                Login to RiderX
            </h2>

            <p>
                Choose how you use RiderX and
                continue to your account.
            </p>

        </div>


        <div class="choices">

            <button
                type="button"
                class="choice"
                id="customerLogin"
            >

                <div class="icon">
                    C
                </div>

                <div>

                    <strong>
                        Customer
                    </strong>

                    <span>
                        Book rides, track your driver,
                        manage trips and payments.
                    </span>

                </div>

                <div class="arrow">
                    →
                </div>

            </button>


            <button
                type="button"
                class="choice"
                id="riderLogin"
            >

                <div class="icon">
                    R
                </div>

                <div>

                    <strong>
                        Rider / Driver Partner
                    </strong>

                    <span>
                        Go online, accept rides,
                        navigate and manage earnings.
                    </span>

                </div>

                <div class="arrow">
                    →
                </div>

            </button>

        </div>


        <button
            type="button"
            class="otp"
            id="otpLogin"
        >
            Login with Mobile / OTP
        </button>


        <div
            class="status"
            id="status"
        ></div>


        <div class="register">

            New to RiderX?

            <button
                type="button"
                id="registerButton"
            >
                Create an account
            </button>

        </div>


        <div class="footer">
            © 2026 RiderX • Chandigarh
        </div>

    </section>

</main>


<script>

    "use strict";


    const customerLogin =
        document.getElementById(
            "customerLogin"
        );


    const riderLogin =
        document.getElementById(
            "riderLogin"
        );


    const otpLogin =
        document.getElementById(
            "otpLogin"
        );


    const registerButton =
        document.getElementById(
            "registerButton"
        );


    const status =
        document.getElementById(
            "status"
        );


    function selectRole(
        role
    ) {

        localStorage.setItem(
            "riderx_selected_role",
            role
        );

        localStorage.setItem(
            "riderx_role",
            role
        );

    }


    function showStatus(
        message
    ) {

        status.textContent =
            message;

        status.classList.add(
            "show"
        );

    }


    customerLogin.addEventListener(
        "click",
        function () {

            selectRole(
                "customer"
            );

            showStatus(
                "Opening Customer Login..."
            );

            setTimeout(
                function () {

                    window.location.href =
                        "./customer-login.html";

                },
                160
            );

        }
    );


    riderLogin.addEventListener(
        "click",
        function () {

            selectRole(
                "rider"
            );

            showStatus(
                "Opening Rider Login..."
            );

            setTimeout(
                function () {

                    window.location.href =
                        "./rider-login.html";

                },
                160
            );

        }
    );


    otpLogin.addEventListener(
        "click",
        function () {

            /*
             * OTP page will use the currently selected
             * account role. If no role exists, send the
             * user through the safe role-selection page.
             */

            const role =
                localStorage.getItem(
                    "riderx_selected_role"
                );


            if (
                role === "customer" ||
                role === "rider"
            ) {

                window.location.href =
                    "./otp-login.html";

                return;

            }


            window.location.href =
                "./role.html";

        }
    );


    registerButton.addEventListener(
        "click",
        function () {

            /*
             * Registration starts from the central role
             * selection page so Customer and Rider profiles
             * can never accidentally be mixed.
             */

            window.location.href =
                "./role.html";

        }
    );


    /*
     * Prevent an invalid/stale role from being treated
     * as a valid account type.
     */

    const role =
        localStorage.getItem(
            "riderx_selected_role"
        );


    if (
        role !== "customer" &&
        role !== "rider"
    ) {

        localStorage.removeItem(
            "riderx_selected_role"
        );

    }

</script>

</body>

</html>
