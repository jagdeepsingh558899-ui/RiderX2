<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RiderX Login</title>

<link
    rel="stylesheet"
    href="../assets/app.css"
>

<link
    rel="manifest"
    href="../manifest.json"
>

<meta
    name="theme-color"
    content="#000000"
>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{

    min-height:100vh;

    background:#000;

    color:#fff;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial,sans-serif;

    padding:20px;
}

.auth-card{

    width:100%;

    max-width:420px;

    background:#111;

    padding:30px;

    border-radius:25px;

    border:1px solid #333;

    box-shadow:
        0 20px 60px rgba(0,0,0,.55);
}

.logo{

    text-align:center;

    font-size:38px;

    font-weight:900;

    margin-bottom:8px;
}

.logo span{

    color:#FFD600;
}

.subtitle{

    text-align:center;

    color:#888;

    font-size:13px;

    margin-bottom:25px;
}

h2{

    text-align:center;

    color:#FFD600;

    margin:0 0 25px;
}

.input-box{

    margin-bottom:18px;
}

label{

    color:#aaa;

    font-size:14px;

    display:block;

    margin-bottom:7px;
}

input{

    width:100%;

    padding:14px;

    background:#000;

    border:1px solid #444;

    border-radius:12px;

    color:#fff;

    font-size:15px;

    outline:none;
}

input:focus{

    border-color:#FFD600;

    box-shadow:
        0 0 0 2px rgba(255,214,0,.08);
}

input::placeholder{

    color:#666;
}

.btn{

    width:100%;

    padding:15px;

    background:#FFD600;

    color:#000;

    border:none;

    border-radius:12px;

    font-weight:bold;

    font-size:17px;

    cursor:pointer;
}

.btn:disabled{

    opacity:.5;

    cursor:not-allowed;
}

.error-msg{

    color:#ff4444;

    margin-bottom:15px;

    display:none;

    line-height:1.5;

    font-size:14px;
}

.auth-links{

    text-align:center;

    margin-top:20px;

    color:#aaa;

    font-size:14px;
}

.auth-links a{

    color:#FFD600;

    text-decoration:none;

    font-weight:bold;
}

.mode{

    text-align:center;

    margin-bottom:20px;

    padding:10px;

    background:#080808;

    border:1px solid #222;

    border-radius:10px;

    color:#aaa;

    font-size:12px;

    display:none;
}

.mode strong{

    color:#FFD600;
}

</style>

</head>


<body>


<div class="auth-card">


    <div class="logo">
        RID<span>ERX</span>
    </div>


    <div class="subtitle">
        Secure RiderX Account Login
    </div>


    <h2>
        Login
    </h2>


    <div
        id="loginMode"
        class="mode">
    </div>


    <div
        id="error-message"
        class="error-msg">
    </div>


    <form id="login-form">


        <div class="input-box">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                required
                autocomplete="username"
                inputmode="email"
                placeholder="Email Address"
            >

        </div>


        <div class="input-box">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="Password"
            >

        </div>


        <button
            class="btn"
            id="login-btn"
            type="submit">

            Login

        </button>


    </form>


    <div class="auth-links">

        Don't have an account?

        <a
            id="registerLink"
            href="register.html">

            Register

        </a>

    </div>


</div>


<script>


// ============================================================
// LOGIN PAGE ROLE
// ============================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const role =
    (
        params.get("role") || ""
    )
    .trim()
    .toLowerCase();


const mode =
    document.getElementById("loginMode");


const registerLink =
    document.getElementById("registerLink");


// ============================================================
// RIDER LOGIN
// ============================================================

if (role === "rider") {

    mode.style.display = "block";

    mode.innerHTML =
        "Login as <strong>Rider</strong>";

    registerLink.href =
        "register.html?role=rider";
}


// ============================================================
// CUSTOMER LOGIN
// ============================================================

else if (role === "customer") {

    mode.style.display = "block";

    mode.innerHTML =
        "Login as <strong>Customer</strong>";

    registerLink.href =
        "register.html?role=customer";
}


// ============================================================
// NORMAL LOGIN
// ============================================================

else {

    registerLink.href =
        "register.html";
}

</script>


<script
    type="module"
    src="../js/login.js">
</script>


</body>

</html>
