<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffd400"
    >

    <meta
        name="description"
        content="RiderX secure login"
    >

    <title>RiderX - Login</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #070707;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));
            position: relative;
            overflow: hidden;
        }

        .page::before {
            content: "";
            position: absolute;
            width: 390px;
            height: 390px;
            top: -210px;
            right: -150px;
            border-radius: 50%;
            background: rgba(255, 212, 0, .08);
            pointer-events: none;
        }

        .page::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            bottom: -210px;
            left: -170px;
            border-radius: 50%;
            background: rgba(255, 212, 0, .05);
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 430px;
            padding: 30px 23px 22px;
            border: 1px solid #292929;
            border-radius: 23px;
            background: #111111;
            box-shadow: 0 25px 80px rgba(0, 0, 0, .55);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 19px;
            background: #ffd400;
            color: #090909;
            font-size: 23px;
            font-weight: 1000;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 1000;
        }

        .brand h1 span {
            color: #ffd400;
        }

        .brand p {
            margin: 6px 0 0;
            color: #777777;
            font-size: 10px;
        }

        .heading {
            margin-bottom: 18px;
        }

        .heading h2 {
            margin: 0;
            font-size: 19px;
            font-weight: 900;
        }

        .heading p {
            margin: 7px 0 0;
            color: #777777;
            font-size: 10px;
            line-height: 1.6;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            margin-top: 12px;
            padding: 6px 10px;
            border: 1px solid #343434;
            border-radius: 8px;
            background: #181818;
            color: #ffd400;
            font-size: 9px;
            font-weight: 900;
        }

        .message {
            display: none;
            margin-bottom: 13px;
            padding: 10px;
            border-radius: 9px;
            font-size: 9px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            border: 1px solid #542828;
            background: #241414;
            color: #ff7777;
        }

        .message.success {
            border: 1px solid #275335;
            background: #132319;
            color: #65e58b;
        }

        .field {
            margin-bottom: 13px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #aaaaaa;
            font-size: 9px;
            font-weight: 800;
        }

        .input-wrap {
            position: relative;
        }

        .input {
            width: 100%;
            height: 48px;
            padding: 0 13px;
            border: 1px solid #333333;
            border-radius: 10px;
            outline: none;
            background: #191919;
            color: #ffffff;
            font-size: 12px;
            transition: .2s ease;
        }

        .input::placeholder {
            color: #555555;
        }

        .input:focus {
            border-color: #ffd400;
            box-shadow: 0 0 0 2px rgba(255, 212, 0, .07);
        }

        .password-input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            width: 35px;
            height: 35px;
            transform: translateY(-50%);
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #777777;
            cursor: pointer;
            font-size: 10px;
        }

        .password-toggle:hover {
            color: #ffd400;
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 3px 0 17px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #777777;
            font-size: 9px;
            cursor: pointer;
        }

        .remember input {
            accent-color: #ffd400;
        }

        .forgot {
            border: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-size: 9px;
            font-weight: 800;
        }

        .primary-btn {
            width: 100%;
            height: 49px;
            border: 0;
            border-radius: 10px;
            background: #ffd400;
            color: #111111;
            cursor: pointer;
            font-size: 12px;
            font-weight: 1000;
            transition: .2s ease;
        }

        .primary-btn:hover {
            background: #ffe04a;
        }

        .primary-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 19px 0;
            color: #555555;
            font-size: 8px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #282828;
        }

        .secondary-btn {
            width: 100%;
            height: 46px;
            border: 1px solid #353535;
            border-radius: 10px;
            background: #171717;
            color: #ffffff;
            cursor: pointer;
            font-size: 10px;
            font-weight: 900;
        }

        .secondary-btn:hover {
            border-color: #ffd400;
            color: #ffd400;
        }

        .register {
            margin-top: 18px;
            text-align: center;
            color: #666666;
            font-size: 9px;
        }

        .register button {
            border: 0;
            padding: 0;
            background: transparent;
            color: #ffd400;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .role-switch {
            display: flex;
            gap: 7px;
            margin-top: 17px;
        }

        .role-btn {
            flex: 1;
            height: 39px;
            border: 1px solid #303030;
            border-radius: 9px;
            background: #161616;
            color: #777777;
            cursor: pointer;
            font-size: 9px;
            font-weight: 900;
        }

        .role-btn.active {
            border-color: #ffd400;
            background: rgba(255, 212, 0, .08);
            color: #ffd400;
        }

        .security {
            margin-top: 17px;
            padding: 10px;
            border: 1px solid #252525;
            border-radius: 9px;
            background: #151515;
            color: #666666;
            font-size: 8px;
            line-height: 1.5;
            text-align: center;
        }

        .security strong {
            color: #aaaaaa;
        }

        .footer {
            margin-top: 17px;
            color: #444444;
            font-size: 8px;
            text-align: center;
        }

        .loader {
            display: inline-block;
            width: 13px;
            height: 13px;
            margin-right: 7px;
            vertical-align: -2px;
            border: 2px solid rgba(0, 0, 0, .25);
            border-top-color: #111111;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 420px) {

            .card {
                padding: 25px 17px 19px;
                border-radius: 19px;
            }

        }

    </style>

</head>

<body>

<main class="page">

    <section class="card">

        <div class="brand">

            <div class="logo">
                RX
            </div>

            <h1>
                Rider<span>X</span>
            </h1>

            <p>
                Your city. Your ride.
            </p>

        </div>


        <div class="heading">

            <h2>
                Welcome back
            </h2>

            <p>
                Sign in to continue using RiderX.
            </p>

            <div
                class="role-badge"
                id="roleBadge"
            >
                Customer Login
            </div>

        </div>


        <div
            class="message error"
            id="errorBox"
            role="alert"
            aria-live="polite"
        ></div>


        <div
            class="message success"
            id="successBox"
            role="status"
            aria-live="polite"
        ></div>


        <form
            id="loginForm"
            novalidate
        >

            <div class="field">

                <label for="email">
                    Email address
                </label>

                <input
                    class="input"
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="input-wrap">

                    <input
                        class="input password-input"
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>


                <button
                    type="button"
                    class="forgot"
                    id="forgotBtn"
                >
                    Forgot password?
                </button>

            </div>


            <button
                type="submit"
                class="primary-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            class="secondary-btn"
            id="otpBtn"
        >
            Login with Mobile OTP
        </button>


        <div class="role-switch">

            <button
                type="button"
                class="role-btn active"
                id="customerRoleBtn"
            >
                Customer
            </button>

            <button
                type="button"
                class="role-btn"
                id="riderRoleBtn"
            >
                Rider
            </button>

        </div>


        <div class="register">

            Don't have an account?

            <button
                type="button"
                id="registerBtn"
            >
                Create account
            </button>

        </div>


        <div class="security">

            <strong>Secure RiderX Login</strong><br>

            Your account is authenticated using Firebase Authentication.
            Rider accounts are also checked against RiderX approval status.

        </div>


        <div class="footer">
            © 2026 RiderX • Chandigarh
        </div>

    </section>

</main>


<script type="module">

    "use strict";


    import {

        auth,
        db,

        signInWithEmailAndPassword,
        sendPasswordResetEmail,

        doc,
        getDoc

    } from "../firebase/firebase-config.js";


    const loginForm =
        document.getElementById(
            "loginForm"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const rememberInput =
        document.getElementById(
            "remember"
        );


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    const forgotBtn =
        document.getElementById(
            "forgotBtn"
        );


    const otpBtn =
        document.getElementById(
            "otpBtn"
        );


    const registerBtn =
        document.getElementById(
            "registerBtn"
        );


    const passwordToggle =
        document.getElementById(
            "passwordToggle"
        );


    const customerRoleBtn =
        document.getElementById(
            "customerRoleBtn"
        );


    const riderRoleBtn =
        document.getElementById(
            "riderRoleBtn"
        );


    const roleBadge =
        document.getElementById(
            "roleBadge"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    const successBox =
        document.getElementById(
            "successBox"
        );


    let selectedRole =
        normalizeRole(
            localStorage.getItem(
                "riderx_selected_role"
            ) ||
            localStorage.getItem(
                "userRole"
            ) ||
            "customer"
        );


    let loading =
        false;


    applyRoleUI();


    const rememberedEmail =
        localStorage.getItem(
            "riderx_remember_email"
        );


    if (
        rememberedEmail
    ) {

        emailInput.value =
            rememberedEmail;

        rememberInput.checked =
            true;

    }


    passwordToggle.addEventListener(
        "click",
        function () {

            const isPassword =
                passwordInput.type ===
                "password";


            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";


            passwordToggle.textContent =
                isPassword
                    ? "HIDE"
                    : "SHOW";


            passwordToggle.setAttribute(
                "aria-label",
                isPassword
                    ? "Hide password"
                    : "Show password"
            );

        }
    );


    customerRoleBtn.addEventListener(
        "click",
        function () {

            setRole(
                "customer"
            );

        }
    );


    riderRoleBtn.addEventListener(
        "click",
        function () {

            setRole(
                "rider"
            );

        }
    );


    function setRole(
        role
    ) {

        selectedRole =
            normalizeRole(
                role
            );


        localStorage.setItem(
            "riderx_selected_role",
            selectedRole
        );


        applyRoleUI();

        clearMessages();

    }


    function applyRoleUI() {

        const rider =
            selectedRole ===
            "rider";


        customerRoleBtn.classList.toggle(
            "active",
            !rider
        );


        riderRoleBtn.classList.toggle(
            "active",
            rider
        );


        roleBadge.textContent =
            rider
                ? "Rider Login"
                : "Customer Login";


        registerBtn.textContent =
            rider
                ? "Create rider account"
                : "Create customer account";

    }


    function normalizeRole(
        role
    ) {

        const value =
            String(
                role || ""
            )
                .trim()
                .toLowerCase();


        if (
            value === "rider" ||
            value === "driver"
        ) {

            return "rider";

        }


        return "customer";

    }


    function clearMessages() {

        errorBox.textContent =
            "";

        successBox.textContent =
            "";

        errorBox.classList.remove(
            "show"
        );

        successBox.classList.remove(
            "show"
        );

    }


    function showError(
        message
    ) {

        successBox.classList.remove(
            "show"
        );

        successBox.textContent =
            "";

        errorBox.textContent =
            message;

        errorBox.classList.add(
            "show"
        );

    }


    function showSuccess(
        message
    ) {

        errorBox.classList.remove(
            "show"
        );

        errorBox.textContent =
            "";

        successBox.textContent =
            message;

        successBox.classList.add(
            "show"
        );

    }


    function setLoading(
        value
    ) {

        loading =
            value;


        loginBtn.disabled =
            value;


        forgotBtn.disabled =
            value;


        otpBtn.disabled =
            value;


        customerRoleBtn.disabled =
            value;


        riderRoleBtn.disabled =
            value;


        if (
            value
        ) {

            loginBtn.innerHTML =
                '<span class="loader"></span>Signing in...';

        } else {

            loginBtn.textContent =
                "Login";

        }

    }


    loginForm.addEventListener(
        "submit",
        async function (
            event
        ) {

            event.preventDefault();


            if (
                loading
            ) {

                return;

            }


            clearMessages();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            const password =
                passwordInput.value;


            if (
                !email
            ) {

                showError(
                    "Please enter your email address."
                );

                emailInput.focus();

                return;

            }


            if (
                !isValidEmail(
                    email
                )
            ) {

                showError(
                    "Please enter a valid email address."
                );

                emailInput.focus();

                return;

            }


            if (
                !password
            ) {

                showError(
                    "Please enter your password."
                );

                passwordInput.focus();

                return;

            }


            if (
                password.length < 6
            ) {

                showError(
                    "Password must contain at least 6 characters."
                );

                passwordInput.focus();

                return;

            }


            setLoading(
                true
            );


            try {

                const credential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const firebaseUser =
                    credential.user;


                if (
                    !firebaseUser
                ) {

                    throw new Error(
                        "Firebase did not return an authenticated user."
                    );

                }


                const profile =
                    await loadUserProfile(
                        firebaseUser.uid,
                        firebaseUser
                    );


                if (
                    !profile
                ) {

                    showError(
                        "Your Firebase account exists, but no RiderX profile was found. Please create your RiderX account first."
                    );


                    setLoading(
                        false
                    );


                    return;

                }


                const actualRole =
                    normalizeRole(
                        profile.role ||
                        profile.userRole ||
                        profile.accountType
                    );


                if (
                    actualRole !==
                    selectedRole
                ) {

                    await auth.signOut();


                    showError(
                        "This account belongs to the " +
                        (
                            actualRole === "rider"
                                ? "Rider"
                                : "Customer"
                        ) +
                        " side. Please select the correct login type."
                    );


                    setLoading(
                        false
                    );


                    return;

                }


                if (
                    selectedRole ===
                    "rider"
                ) {

                    const access =
                        checkRiderAccess(
                            profile
                        );


                    if (
                        !access.allowed
                    ) {

                        await saveSession(
                            firebaseUser,
                            profile
                        );


                        await auth.signOut();


                        showError(
                            access.message
                        );


                        setLoading(
                            false
                        );


                        return;

                    }

                }


                await saveSession(
                    firebaseUser,
                    profile
                );


                if (
                    rememberInput.checked
                ) {

                    localStorage.setItem(
                        "riderx_remember_email",
                        email
                    );

                } else {

                    localStorage.removeItem(
                        "riderx_remember_email"
                    );

                }


                showSuccess(
                    "Login successful. Opening RiderX..."
                );


                setTimeout(
                    function () {

                        redirectAfterLogin(
                            selectedRole,
                            profile
                        );

                    },
                    600
                );


            } catch (
                error
            ) {

                console.error(
                    "RiderX login error:",
                    error
                );


                showError(
                    firebaseErrorMessage(
                        error
                    )
                );


                setLoading(
                    false
                );

            }

        }
    );


    async function loadUserProfile(
        uid,
        firebaseUser
    ) {

        const userSnapshot =
            await getDoc(
                doc(
                    db,
                    "users",
                    uid
                )
            );


        if (
            userSnapshot.exists()
        ) {

            return userSnapshot.data();

        }


        /*
         * Backward compatibility with existing
         * RiderX role collections.
         */

        const customerSnapshot =
            await getDoc(
                doc(
                    db,
                    "customers",
                    uid
                )
            );


        if (
            customerSnapshot.exists()
        ) {

            return customerSnapshot.data();

        }


        const riderSnapshot =
            await getDoc(
                doc(
                    db,
                    "riders",
                    uid
                )
            );


        if (
            riderSnapshot.exists()
        ) {

            return riderSnapshot.data();

        }


        /*
         * Do not silently create a profile during
         * normal login. Registration should create it.
         */

        return null;

    }


    function checkRiderAccess(
        profile
    ) {

        const status =
            String(
                profile.approvalStatus ||
                profile.applicationStatus ||
                profile.verificationStatus ||
                profile.status ||
                ""
            )
                .trim()
                .toLowerCase();


        if (
            profile.approved === false ||
            profile.isApproved === false ||
            status === "pending"
        ) {

            return {

                allowed:
                    false,

                message:
                    "Your RiderX rider account is still waiting for admin approval."

            };

        }


        if (
            status === "rejected" ||
            status === "blocked" ||
            status === "suspended"
        ) {

            return {

                allowed:
                    false,

                message:
                    "Your rider account is currently " +
                    status +
                    ". Please contact RiderX support."

            };

        }


        return {

            allowed:
                true,

            message:
                ""

        };

    }


    async function saveSession(
        firebaseUser,
        profile
    ) {

        const role =
            normalizeRole(
                profile.role ||
                profile.userRole ||
                profile.accountType ||
                selectedRole
            );


        const phone =
            normalizePhone(
                profile.phone ||
                profile.mobile ||
                profile.phoneNumber ||
                firebaseUser.phoneNumber ||
                ""
            );


        const user = {

            uid:
                firebaseUser.uid,

            id:
                firebaseUser.uid,

            name:
                profile.name ||
                profile.fullName ||
                profile.displayName ||
                firebaseUser.displayName ||
                (
                    role === "rider"
                        ? "Rider"
                        : "RiderX Customer"
                ),

            fullName:
                profile.fullName ||
                profile.name ||
                profile.displayName ||
                firebaseUser.displayName ||
                "",

            displayName:
                profile.displayName ||
                firebaseUser.displayName ||
                "",

            email:
                profile.email ||
                firebaseUser.email ||
                "",

            phone:
                phone,

            mobile:
                phone,

            phoneNumber:
                firebaseUser.phoneNumber ||
                profile.phoneNumber ||
                "",

            role:
                role,

            userRole:
                role,

            accountType:
                role,

            status:
                profile.status ||
                "active",

            approvalStatus:
                profile.approvalStatus ||
                profile.applicationStatus ||
                (
                    role === "rider"
                        ? "approved"
                        : "approved"
                ),

            approved:
                profile.approved !== false &&
                profile.isApproved !== false,

            city:
                profile.city ||
                "Chandigarh",

            photoURL:
                profile.photoURL ||
                firebaseUser.photoURL ||
                "",

            rating:
                Number(
                    profile.rating ||
                    5
                ),

            walletBalance:
                Number(
                    profile.walletBalance ||
                    0
                ),

            totalRides:
                Number(
                    profile.totalRides ||
                    0
                ),

            completedRides:
                Number(
                    profile.completedRides ||
                    0
                ),

            currentRideId:
                profile.currentRideId ||
                null,

            vehicleType:
                profile.vehicleType ||
                (
                    role === "rider"
                        ? "bike"
                        : null
                ),

            vehicleNumber:
                profile.vehicleNumber ||
                "",

            loginMethod:
                "password",

            loginAt:
                new Date().toISOString()

        };


        localStorage.setItem(
            "riderx_user",
            JSON.stringify(
                user
            )
        );


        localStorage.setItem(
            "userRole",
            role
        );


        localStorage.setItem(
            "riderx_role",
            role
        );


        localStorage.setItem(
            "riderx_selected_role",
            role
        );


        if (
            role === "rider"
        ) {

            localStorage.setItem(
                "riderx_rider",
                JSON.stringify(
                    user
                )
            );


            localStorage.setItem(
                "riderx_rider_id",
                firebaseUser.uid
            );

        } else {

            localStorage.setItem(
                "riderx_customer",
                JSON.stringify(
                    user
                )
            );


            localStorage.setItem(
                "riderx_customer_id",
                firebaseUser.uid
            );

        }

    }


    function redirectAfterLogin(
        role,
        profile
    ) {

        if (
            role === "rider"
        ) {

            const access =
                checkRiderAccess(
                    profile
                );


            if (
                access.allowed
            ) {

                window.location.replace(
                    "../rider/home.html"
                );

            } else {

                window.location.replace(
                    "./rider-login.html"
                );

            }


            return;

        }


        window.location.replace(
            "../customer/home.html"
        );

    }


    otpBtn.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                selectedRole
            );


            if (
                selectedRole ===
                "rider"
            ) {

                window.location.href =
                    "./rider-login.html";

            } else {

                window.location.href =
                    "./otp-login.html";

            }

        }
    );


    registerBtn.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "riderx_selected_role",
                selectedRole
            );


            window.location.href =
                "./register.html";

        }
    );


    forgotBtn.addEventListener(
        "click",
        async function () {

            clearMessages();


            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();


            if (
                !email
            ) {

                showError(
                    "Enter your email address first, then tap Forgot password."
                );


                emailInput.focus();

                return;

            }


            if (
                !isValidEmail(
                    email
                )
            ) {

                showError(
                    "Please enter a valid email address."
                );


                emailInput.focus();

                return;

            }


            forgotBtn.disabled =
                true;


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showSuccess(
                    "Password reset email sent. Check your inbox and spam folder."
                );


            } catch (
                error
            ) {

                console.error(
                    "RiderX password reset error:",
                    error
                );


                showError(
                    passwordResetError(
                        error
                    )
                );

            } finally {

                forgotBtn.disabled =
                    false;

            }

        }
    );


    function isValidEmail(
        email
    ) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        );

    }


    function normalizePhone(
        value
    ) {

        let number =
            String(
                value || ""
            )
                .replace(
                    /\D/g,
                    ""
                );


        if (
            number.startsWith("91") &&
            number.length === 12
        ) {

            number =
                number.substring(2);

        }


        if (
            number.length > 10
        ) {

            number =
                number.slice(
                    -10
                );

        }


        return number;

    }


    function firebaseErrorMessage(
        error
    ) {

        const code =
            String(
                error?.code ||
                ""
            )
                .toLowerCase();


        switch (
            code
        ) {

            case "auth/invalid-email":

                return "The email address is invalid.";


            case "auth/user-not-found":

                return "No RiderX account was found with this email address.";


            case "auth/wrong-password":

                return "Incorrect password. Please try again or reset your password.";


            case "auth/invalid-credential":

                return "Email or password is incorrect.";


            case "auth/user-disabled":

                return "This account has been disabled. Please contact RiderX support.";


            case "auth/too-many-requests":

                return "Too many login attempts. Please wait and try again later.";


            case "auth/network-request-failed":

                return "Network error. Please check your internet connection.";


            case "auth/operation-not-allowed":

                return "Email/password authentication is not enabled in Firebase.";


            case "auth/invalid-api-key":

                return "Firebase configuration is invalid. Please check the RiderX Firebase configuration.";


            case "auth/app-not-authorized":

                return "This RiderX domain is not authorized in Firebase.";


            default:

                return (
                    error?.message ||
                    "Login failed. Please try again."
                );

        }

    }


    function passwordResetError(
        error
    ) {

        const code =
            String(
                error?.code ||
                ""
            )
                .toLowerCase();


        switch (
            code
        ) {

            case "auth/user-not-found":

                return "No RiderX account was found with this email address.";


            case "auth/invalid-email":

                return "Please enter a valid email address.";


            case "auth/too-many-requests":

                return "Too many reset requests. Please wait and try again later.";


            case "auth/network-request-failed":

                return "Network error. Please check your internet connection.";


            default:

                return (
                    error?.message ||
                    "Unable to send password reset email."
                );

        }

    }

</script>

</body>

</html>
