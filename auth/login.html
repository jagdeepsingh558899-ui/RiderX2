<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Login</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#000000">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    padding:20px;
}

.auth-card{
    width:100%;
    max-width:420px;
    background:#111;
    padding:30px;
    border-radius:25px;
    border:1px solid #333;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    margin-bottom:10px;
}

.logo span{
    color:#FFD600;
}

.role-title{
    text-align:center;
    color:#FFD600;
    margin-bottom:25px;
    font-size:20px;
}

.input-box{
    margin-bottom:16px;
}

label{
    color:#aaa;
    font-size:14px;
    display:block;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    background:#000;
    border:1px solid #444;
    border-radius:12px;
    color:#fff;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#FFD600;
}

.btn{
    width:100%;
    padding:15px;
    background:#FFD600;
    border:none;
    border-radius:12px;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-bottom:16px;
    padding:11px;
    border-radius:10px;
    font-size:14px;
    line-height:1.4;
}

.message.error{
    display:block;
    background:rgba(255,60,60,.1);
    color:#ff6666;
}

.message.success{
    display:block;
    background:rgba(34,214,107,.1);
    color:#22d66b;
}

.loading{
    display:none;
    text-align:center;
    color:#FFD600;
    margin-top:15px;
    font-size:13px;
}

.auth-links{
    text-align:center;
    margin-top:20px;
    color:#aaa;
}

.auth-links a{
    color:#FFD600;
    text-decoration:none;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#777;
    font-size:13px;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="auth-card">

    <div class="logo">
        RID<span>ERX</span>
    </div>

    <div
        class="role-title"
        id="roleTitle">

        Login

    </div>


    <div
        id="error-message"
        class="message">
    </div>


    <form id="login-form">

        <div class="input-box">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                required
                autocomplete="username"
                placeholder="Email Address">

        </div>


        <div class="input-box">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="Password">

        </div>


        <button
            class="btn"
            id="login-btn"
            type="submit">

            Login

        </button>

    </form>


    <div
        id="loading"
        class="loading">

        Signing in...

    </div>


    <div class="auth-links">

        Don't have an account?

        <a
            id="registerLink"
            href="register.html">

            Register

        </a>

    </div>


    <a
        class="back"
        href="../index.html">

        ← Back to RiderX

    </a>

</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const role =
    params.get("role");

const roleTitle =
    document.getElementById("roleTitle");

const registerLink =
    document.getElementById("registerLink");


if(role === "rider"){

    roleTitle.textContent =
        "Rider Login";

    registerLink.href =
        "register.html?role=rider";

}

else{

    roleTitle.textContent =
        "Customer Login";

    registerLink.href =
        "register.html?role=customer";

}

</script>


<script type="module">

import {

    auth,
    db

} from "../firebase/firebase-config.js";


import {

    signInWithEmailAndPassword,
    signOut

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {

    doc,
    getDoc

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const form =
    document.getElementById("login-form");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const button =
    document.getElementById("login-btn");

const message =
    document.getElementById("error-message");

const loading =
    document.getElementById("loading");


function showMessage(text,type){

    message.textContent =
        text || "";

    message.className =
        "message " + (type || "");

}


function setLoading(active){

    button.disabled =
        active;

    emailInput.disabled =
        active;

    passwordInput.disabled =
        active;

    loading.style.display =
        active ? "block" : "none";

}


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        if(!email || !password){

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;

        }


        setLoading(true);

        showMessage("");


        try{

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                result.user;


            const snap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    )
                );


            if(!snap.exists()){

                await signOut(auth);

                throw new Error(
                    "User profile not found in Firestore."
                );

            }


            const data =
                snap.data();


            const userRole =
                String(
                    data.role ||
                    ""
                )
                .trim()
                .toLowerCase();


            /*
             * IMPORTANT:
             * Never use the URL role as the actual
             * authorization role.
             *
             * Firebase Firestore role is authoritative.
             */


            if(
                role === "rider" &&
                userRole !== "rider"
            ){

                await signOut(auth);

                throw new Error(
                    "This account is not registered as a rider."
                );

            }


            if(
                role === "customer" &&
                userRole === "rider"
            ){

                await signOut(auth);

                throw new Error(
                    "Please use Rider Login for this rider account."
                );

            }


            if(userRole === "admin"){

                /*
                 * Normal customer/rider login page
                 * does not automatically open admin.
                 * Admin must use admin/login.html.
                 */

                await signOut(auth);

                throw new Error(
                    "Admin account detected. Please use the Admin Login page."
                );

            }


            showMessage(
                "Login successful. Opening your account...",
                "success"
            );


            setLoading(true);


            setTimeout(
                function(){

                    if(userRole === "rider"){

                        if(
                            data.approved === true &&
                            data.status === "active"
                        ){

                            window.location.replace(
                                "../rider/home.html"
                            );

                        }
                        else{

                            window.location.replace(
                                "../rider/pending.html"
                            );

                        }

                    }

                    else if(userRole === "customer"){

                        window.location.replace(
                            "../customer/home.html"
                        );

                    }

                    else{

                        signOut(auth);

                        showMessage(
                            "Account role is missing or invalid.",
                            "error"
                        );

                        setLoading(false);

                    }

                },
                400
            );


        }
        catch(error){

            console.error(
                "RiderX Login Error:",
                error
            );


            let msg =
                "Login failed.";


            switch(error.code){

                case "auth/invalid-credential":

                    msg =
                        "Email or password is incorrect.";

                    break;

                case "auth/user-not-found":

                    msg =
                        "Account not found.";

                    break;

                case "auth/wrong-password":

                    msg =
                        "Wrong password.";

                    break;

                case "auth/invalid-email":

                    msg =
                        "Invalid email address.";

                    break;

                case "auth/user-disabled":

                    msg =
                        "This account has been disabled.";

                    break;

                case "auth/too-many-requests":

                    msg =
                        "Too many attempts. Please try again later.";

                    break;

                case "auth/network-request-failed":

                    msg =
                        "Network error. Check your internet connection.";

                    break;

                default:

                    if(error.message){

                        msg =
                            error.message;

                    }

            }


            setLoading(false);

            showMessage(
                "❌ " + msg,
                "error"
            );

        }

    }
);

</script>

</body>

</html>
