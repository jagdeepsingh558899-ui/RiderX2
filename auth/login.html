<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RiderX - Login</title><meta name="theme-color" content="#FFD400">
<meta name="description" content="Login to RiderX"><link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/responsive.css"><style>
:root {
    --rx-yellow: #ffd400;
    --rx-yellow-dark: #e6bd00;
    --rx-black: #050505;
    --rx-card: #111111;
    --rx-card-2: #181818;
    --rx-border: rgba(255, 212, 0, .18);
    --rx-text: #ffffff;
    --rx-muted: #9b9b9b;
    --rx-danger: #ff4d4d;
    --rx-success: #42d392;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: var(--rx-black);
    color: var(--rx-text);
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

.login-page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
}

.login-page::before {
    content: "";
    position: absolute;
    width: 360px;
    height: 360px;
    background: rgba(255, 212, 0, .08);
    border-radius: 50%;
    filter: blur(80px);
    top: -160px;
    left: -120px;
    pointer-events: none;
}

.login-page::after {
    content: "";
    position: absolute;
    width: 320px;
    height: 320px;
    background: rgba(255, 212, 0, .06);
    border-radius: 50%;
    filter: blur(80px);
    bottom: -160px;
    right: -120px;
    pointer-events: none;
}

.login-card {
    width: 100%;
    max-width: 440px;
    background: linear-gradient(
        145deg,
        rgba(25, 25, 25, .98),
        rgba(10, 10, 10, .98)
    );
    border: 1px solid var(--rx-border);
    border-radius: 26px;
    padding: 30px 24px 24px;
    box-shadow:
        0 25px 80px rgba(0, 0, 0, .65),
        0 0 40px rgba(255, 212, 0, .04);
    position: relative;
    z-index: 2;
}

.logo-area {
    text-align: center;
    margin-bottom: 24px;
}

.logo {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--rx-yellow);
    color: #000;
    font-size: 28px;
    font-weight: 900;
    box-shadow: 0 12px 35px rgba(255, 212, 0, .18);
}

.logo-title {
    margin: 0;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -.5px;
}

.logo-title span {
    color: var(--rx-yellow);
}

.logo-subtitle {
    margin: 7px 0 0;
    color: var(--rx-muted);
    font-size: 14px;
}

.selected-role {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
    border-radius: 14px;
    background: rgba(255, 212, 0, .06);
    border: 1px solid rgba(255, 212, 0, .14);
}

.selected-role-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.role-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--rx-yellow);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
}

.role-label {
    font-size: 12px;
    color: var(--rx-muted);
}

.role-value {
    font-size: 14px;
    font-weight: 800;
    text-transform: capitalize;
}

.change-role {
    border: 0;
    background: transparent;
    color: var(--rx-yellow);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.login-methods {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 18px;
}

.method-btn {
    border: 1px solid #2a2a2a;
    background: #151515;
    color: #aaa;
    padding: 11px 10px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
}

.method-btn.active {
    background: var(--rx-yellow);
    color: #000;
    border-color: var(--rx-yellow);
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #d5d5d5;
    font-size: 13px;
    font-weight: 700;
}

.input-wrap {
    position: relative;
}

.form-input {
    width: 100%;
    height: 50px;
    border: 1px solid #2b2b2b;
    border-radius: 13px;
    outline: none;
    background: #0b0b0b;
    color: #fff;
    padding: 0 14px;
    font-size: 15px;
    transition: .2s ease;
}

.form-input:focus {
    border-color: var(--rx-yellow);
    box-shadow: 0 0 0 3px rgba(255, 212, 0, .08);
}

.password-toggle {
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: #999;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
}

.forgot-row {
    display: flex;
    justify-content: flex-end;
    margin-top: -4px;
    margin-bottom: 18px;
}

.forgot-btn {
    border: 0;
    background: transparent;
    color: var(--rx-yellow);
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
}

.primary-btn {
    width: 100%;
    height: 52px;
    border: 0;
    border-radius: 14px;
    background: var(--rx-yellow);
    color: #000;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    transition: .2s ease;
}

.primary-btn:hover {
    background: #ffe45c;
}

.primary-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #777;
    font-size: 12px;
    margin: 20px 0;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    background: #272727;
    flex: 1;
}

.phone-section {
    display: none;
}

.phone-section.active {
    display: block;
}

.email-section.hidden {
    display: none;
}

.otp-section {
    display: none;
}

.otp-section.active {
    display: block;
}

.otp-input {
    text-align: center;
    letter-spacing: 8px;
    font-size: 20px;
    font-weight: 800;
}

.otp-help {
    color: var(--rx-muted);
    font-size: 12px;
    line-height: 1.5;
    margin-top: 9px;
}

.message {
    display: none;
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 15px;
    font-size: 13px;
    line-height: 1.45;
}

.message.show {
    display: block;
}

.message.error {
    color: #ffd5d5;
    background: rgba(255, 77, 77, .10);
    border: 1px solid rgba(255, 77, 77, .25);
}

.message.success {
    color: #d9ffe9;
    background: rgba(66, 211, 146, .10);
    border: 1px solid rgba(66, 211, 146, .22);
}

.register-text {
    text-align: center;
    margin-top: 22px;
    color: var(--rx-muted);
    font-size: 13px;
}

.register-btn {
    border: 0;
    background: transparent;
    color: var(--rx-yellow);
    font-weight: 800;
    cursor: pointer;
}

.loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0, 0, 0, .78);
    backdrop-filter: blur(7px);
    align-items: center;
    justify-content: center;
}

.loading-overlay.show {
    display: flex;
}

.loading-box {
    width: min(88%, 330px);
    padding: 26px;
    border-radius: 20px;
    background: #121212;
    border: 1px solid rgba(255, 212, 0, .18);
    text-align: center;
}

.spinner {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 4px solid #333;
    border-top-color: var(--rx-yellow);
    animation: rxspin .8s linear infinite;
    margin: 0 auto 16px;
}

@keyframes rxspin {
    to {
        transform: rotate(360deg);
    }
}

.loading-text {
    color: #fff;
    font-weight: 700;
    font-size: 14px;
}

.back-btn {
    width: 100%;
    margin-top: 12px;
    height: 45px;
    border-radius: 12px;
    border: 1px solid #292929;
    background: #151515;
    color: #aaa;
    font-weight: 700;
    cursor: pointer;
}

@media (max-width: 480px) {
    .login-page {
        padding: 12px;
        align-items: flex-start;
        padding-top: 24px;
    }

    .login-card {
        border-radius: 22px;
        padding: 25px 18px 20px;
    }

    .logo-title {
        font-size: 24px;
    }
}
</style></head><body><div class="login-page"><main class="login-card">

        <div class="selected-role-left">

</div><div
    class="loading-overlay"

><div class="loading-box">

</div>

</div><script type="module">

"use strict";

/*
 * RiderX login page
 *
 * IMPORTANT:
 * Authentication is handled by:
 *     ../js/auth.js
 *
 * This page does NOT create another Firebase app.
 * This page does NOT manually trust localStorage as authentication.
 */

const STORAGE_ROLE = "riderx_selected_role";

const ROUTES = {
    role: "../auth/role.html",
    customer: "../customer/home.html",
    rider: "../rider/home.html",
    admin: "../admin/dashboard.html"
};

const $ = (selector) =>
    document.querySelector(selector);

const messageBox =
    $("#message");

const loadingOverlay =
    $("#loadingOverlay");

const loadingText =
    $("#loadingText");

function clean(value) {
    return String(value ?? "").trim();
}

function normalizeRole(role) {

    const value =
        clean(role)
            .toLowerCase()
            .replace(/[\s-]+/g, "_");

    if (
        [
            "customer",
            "customers",
            "user",
            "users"
        ].includes(value)
    ) {
        return "customer";
    }

    if (
        [
            "rider",
            "riders",
            "driver",
            "drivers",
            "partner",
            "driver_partner",
            "driverpartner",
            "captain"
        ].includes(value)
    ) {
        return "rider";
    }

    if (
        [
            "admin",
            "administrator"
        ].includes(value)
    ) {
        return "admin";
    }

    if (
        [
            "superadmin",
            "super_admin",
            "superadministrator"
        ].includes(value)
    ) {
        return "superadmin";
    }

    return "";
}

function getSelectedRole() {

    const stored =
        localStorage.getItem(
            STORAGE_ROLE
        );

    return normalizeRole(stored);
}

function setMessage(
    text,
    type = "error"
) {

    if (!messageBox) {
        return;
    }

    messageBox.textContent =
        clean(text);

    messageBox.className =
        "message show " + type;
}

function clearMessage() {

    if (!messageBox) {
        return;
    }

    messageBox.textContent =
        "";

    messageBox.className =
        "message";
}

function setLoading(
    loading,
    text
) {

    if (!loadingOverlay) {
        return;
    }

    if (loading) {

        loadingText.textContent =
            text ||
            "Please wait...";

        loadingOverlay.classList.add(
            "show"
        );

        loadingOverlay.setAttribute(
            "aria-hidden",
            "false"
        );

    } else {

        loadingOverlay.classList.remove(
            "show"
        );

        loadingOverlay.setAttribute(
            "aria-hidden",
            "true"
        );

    }

}

function roleDestination(role) {

    role =
        normalizeRole(role);

    if (
        role === "customer"
    ) {
        return ROUTES.customer;
    }

    if (
        role === "rider"
    ) {
        return ROUTES.rider;
    }

    if (
        role === "admin" ||
        role === "superadmin"
    ) {
        return ROUTES.admin;
    }

    return "";
}

function redirectAfterLogin(role) {

    const normalized =
        normalizeRole(role);

    const destination =
        roleDestination(
            normalized
        );

    if (!destination) {

        throw new Error(
            "Your RiderX role is not configured."
        );

    }

    /*
     * Do not return to role.html after authentication.
     * The Firebase-authenticated role is now authoritative.
     */

    window.location.replace(
        destination
    );

}

function updateRoleUI(role) {

    role =
        normalizeRole(role);

    const roleText =
        $("#selectedRoleText");

    const roleIcon =
        $("#roleIcon");

    if (
        role === "rider"
    ) {

        roleText.textContent =
            "Rider";

        roleIcon.textContent =
            "R";

    } else {

        roleText.textContent =
            "Customer";

        roleIcon.textContent =
            "C";

    }

}

function requireSelectedRole() {

    const role =
        getSelectedRole();

    /*
     * If the user opens login.html directly without selecting
     * a role, send them to role selection.
     *
     * This is intentionally done only when there is NO role.
     * We never redirect an authenticated user based solely on
     * this page's localStorage value.
     */

    if (!role) {

        window.location.replace(
            ROUTES.role
        );

        return null;

    }

    updateRoleUI(
        role
    );

    return role;

}

async function getAuthEngine() {

    /*
     * auth.js exposes window.RiderX.auth.
     * Wait briefly because auth.js may still be initializing.
     */

    const started =
        Date.now();

    while (
        Date.now() - started < 10000
    ) {

        if (
            window.RiderX &&
            window.RiderX.auth
        ) {

            const auth =
                window.RiderX.auth;

            try {

                await auth.waitForAuth(
                    10000
                );

            } catch (error) {

                console.warn(
                    "RiderX auth readiness warning:",
                    error
                );

            }

            return auth;

        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    50
                )
        );

    }

    throw new Error(
        "RiderX authentication engine is unavailable."
    );

}

async function initializePage() {

    /*
     * Do NOT immediately redirect merely because localStorage
     * contains an old role.
     *
     * First wait for Firebase auth state.
     */

    let auth;

    try {

        auth =
            await getAuthEngine();

    } catch (error) {

        console.error(
            "RiderX login initialization failed:",
            error
        );

        setMessage(
            error.message ||
            "RiderX authentication engine is unavailable."
        );

        return;

    }

    /*
     * If Firebase already has a real authenticated user,
     * auth.js has already resolved the Firestore role.
     * Send them directly to their dashboard.
     *
     * This prevents the role-select/login loop.
     */

    if (
        auth.state?.firebaseUser?.uid &&
        auth.state?.role
    ) {

        try {

            redirectAfterLogin(
                auth.state.role
            );

            return;

        } catch (error) {

            console.warn(
                "RiderX authenticated redirect failed:",
                error
            );

        }

    }

    /*
     * Only unauthenticated users need a selected role.
     */

    const role =
        requireSelectedRole();

    if (!role) {
        return;
    }

}

async function loginEmail() {

    clearMessage();

    const role =
        requireSelectedRole();

    if (!role) {
        return;
    }

    const email =
        clean(
            $("#email")?.value
        ).toLowerCase();

    const password =
        String(
            $("#password")?.value || ""
        );

    if (!email) {

        setMessage(
            "Please enter your email."
        );

        return;

    }

    if (!password) {

        setMessage(
            "Please enter your password."
        );

        return;

    }

    setLoading(
        true,
        "Signing you in..."
    );

    try {

        const auth =
            await getAuthEngine();

        const result =
            await auth.loginEmail(
                email,
                password
            );

        /*
         * IMPORTANT:
         * Do not trust the role selected on the login page
         * after authentication.
         *
         * auth.js resolves the real Firestore role.
         */

        const actualRole =
            normalizeRole(
                result?.role ||
                auth.getRole()
            );

        if (!actualRole) {

            throw new Error(
                "Your RiderX account role is not configured."
            );

        }

        /*
         * If a user selected Rider but their Firebase account
         * is actually Customer, Firestore role wins.
         */

        redirectAfterLogin(
            actualRole
        );

    } catch (error) {

        console.error(
            "RiderX email login error:",
            error
        );

        setLoading(
            false
        );

        setMessage(
            error?.message ||
            "Login failed. Please try again."
        );

    }

}

async function sendOtp() {

    clearMessage();

    const role =
        requireSelectedRole();

    if (!role) {
        return;
    }

    const phone =
        clean(
            $("#phone")?.value
        );

    if (!phone) {

        setMessage(
            "Please enter your mobile number."
        );

        return;

    }

    setLoading(
        true,
        "Sending OTP..."
    );

    try {

        const auth =
            await getAuthEngine();

        await auth.sendOtp(
            phone,
            "recaptcha-container"
        );

        $("#phoneStep")
            ?.classList.add(
                "hidden"
            );

        $("#otpStep")
            ?.classList.add(
                "active"
            );

        setMessage(
            "OTP sent successfully.",
            "success"
        );

    } catch (error) {

        console.error(
            "RiderX OTP error:",
            error
        );

        setMessage(
            error?.message ||
            "Unable to send OTP."
        );

    } finally {

        setLoading(
            false
        );

    }

}

async function verifyOtp() {

    clearMessage();

    const role =
        requireSelectedRole();

    if (!role) {
        return;
    }

    const otp =
        clean(
            $("#otp")?.value
        );

    if (!/^\d{6}$/.test(otp)) {

        setMessage(
            "Enter the 6-digit OTP."
        );

        return;

    }

    setLoading(
        true,
        "Verifying OTP..."
    );

    try {

        const auth =
            await getAuthEngine();

        const result =
            await auth.verifyOtp(
                otp,
                role
            );

        const actualRole =
            normalizeRole(
                result?.role ||
                auth.getRole()
            );

        if (!actualRole) {

            throw new Error(
                "Your RiderX account role is not configured."
            );

        }

        redirectAfterLogin(
            actualRole
        );

    } catch (error) {

        console.error(
            "RiderX OTP verification error:",
            error
        );

        setLoading(
            false
        );

        setMessage(
            error?.message ||
            "OTP verification failed."
        );

    }

}

async function resetPassword() {

    clearMessage();

    const email =
        clean(
            $("#email")?.value
        ).toLowerCase();

    if (!email) {

        setMessage(
            "Enter your email first, then tap Forgot password."
        );

        return;

    }

    setLoading(
        true,
        "Sending password reset..."
    );

    try {

        const auth =
            await getAuthEngine();

        await auth.resetPassword(
            email
        );

        setMessage(
            "Password reset email sent. Check your inbox.",
            "success"
        );

    } catch (error) {

        console.error(
            "RiderX password reset error:",
            error
        );

        setMessage(
            error?.message ||
            "Unable to send password reset email."
        );

    } finally {

        setLoading(
            false
        );

    }

}

function switchMethod(
    method
) {

    const email =
        method === "email";

    $("#emailMethodBtn")
        ?.classList.toggle(
            "active",
            email
        );

    $("#phoneMethodBtn")
        ?.classList.toggle(
            "active",
            !email
        );

    $("#emailSection")
        ?.classList.toggle(
            "hidden",
            !email
        );

    $("#phoneSection")
        ?.classList.toggle(
            "active",
            !email
        );

    clearMessage();

}

function bindEvents() {

    $("#emailLoginForm")
        ?.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                loginEmail();

            }
        );

    $("#emailMethodBtn")
        ?.addEventListener(
            "click",
            function () {

                switchMethod(
                    "email"
                );

            }
        );

    $("#phoneMethodBtn")
        ?.addEventListener(
            "click",
            function () {

                switchMethod(
                    "phone"
                );

            }
        );

    $("#passwordToggle")
        ?.addEventListener(
            "click",
            function () {

                const input =
                    $("#password");

                if (!input) {
                    return;
                }

                const visible =
                    input.type === "text";

                input.type =
                    visible
                        ? "password"
                        : "text";

                this.textContent =
                    visible
                        ? "SHOW"
                        : "HIDE";

            }
        );

    $("#forgotPasswordBtn")
        ?.addEventListener(
            "click",
            resetPassword
        );

    $("#sendOtpBtn")
        ?.addEventListener(
            "click",
            sendOtp
        );

    $("#verifyOtpBtn")
        ?.addEventListener(
            "click",
            verifyOtp
        );

    $("#changePhoneBtn")
        ?.addEventListener(
            "click",
            function () {

                $("#otpStep")
                    ?.classList.remove(
                        "active"
                    );

                $("#phoneStep")
                    ?.classList.remove(
                        "hidden"
                    );

                $("#otp").value =
                    "";

                clearMessage();

            }
        );

    $("#changeRoleBtn")
        ?.addEventListener(
            "click",
            function () {

                /*
                 * Explicit user action:
                 * role selection can be changed.
                 */

                localStorage.removeItem(
                    STORAGE_ROLE
                );

                window.location.replace(
                    ROUTES.role
                );

            }
        );

    $("#registerBtn")
        ?.addEventListener(
            "click",
            function () {

                /*
                 * Keep the selected role so the registration
                 * page can use the same Customer/Rider choice.
                 */

                window.location.replace(
                    "../auth/register.html"
                );

            }
        );

}

document.addEventListener(
    "DOMContentLoaded",
    function () {

        bindEvents();

        initializePage();

    },
    {
        once: true
    }
);

</script><!--
    IMPORTANT:
    js/auth.js must be loaded after the page DOM exists.

    It is loaded as a module because the current RiderX
    authentication engine imports firebase-config.js itself.
--><script
    type="module"
    src="../js/auth.js"
></script></body>
