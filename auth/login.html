<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Login</title>


<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;

color:white;

font-family:Arial,sans-serif;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}


.login-box{

width:90%;

max-width:400px;

background:#111;

padding:30px;

border-radius:25px;

box-shadow:0 0 25px #FFD600;

text-align:center;

}


.logo{

width:90px;

}


h1{

color:#FFD600;

}


input{

width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:12px;

background:#222;

color:white;

font-size:16px;

}



button{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:12px;

background:#FFD600;

font-weight:bold;

font-size:16px;

cursor:pointer;

}



.divider{

margin:20px 0;

color:#aaa;

}



.link{

color:#FFD600;

margin-top:15px;

display:block;

cursor:pointer;

}



.hidden{

display:none;

}



</style>

</head>



<body>



<div class="login-box">


<img src="../assets/logo.svg" class="logo">


<h1>RiderX</h1>


<h3 id="title">
Login
</h3>




<!-- Phone Login -->


<div id="phoneSection">


<input 
type="tel"
id="phone"
placeholder="+91 Mobile Number">


<button id="sendOtp">

Send OTP

</button>



<input 
class="hidden"
type="text"
id="otp"
placeholder="Enter OTP">


<button 
class="hidden"
id="verifyOtp">

Verify OTP

</button>


</div>





<div class="divider">

OR

</div>





<!-- Email Login -->


<div id="emailSection">


<input
type="email"
id="email"
placeholder="Email Address">



<input
type="password"
id="password"
placeholder="Password">



<button id="emailLogin">

Login With Email

</button>


</div>




<a class="link"
href="register.html">

Create New Account

</a>



<a class="link"
id="forgot">

Forgot Password?

</a>



</div>






<script type="module" src="../js/auth.js"></script>



</body>

</html>
