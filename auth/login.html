<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#FFD400"
>

<meta
    name="description"
    content="RiderX secure customer and rider login"
>

<title>RiderX - Login</title>

<link
    rel="stylesheet"
    href="../css/Style.css"
>

<link
    rel="stylesheet"
    href="../css/Auth.css"
>

<link
    rel="stylesheet"
    href="../css/Responsive.css"
>

<style>

:root {
    --rx-yellow: #FFD400;
    --rx-black: #080808;
    --rx-dark: #111111;
    --rx-card: #171717;
    --rx-border: rgba(255,255,255,.10);
    --rx-text: #ffffff;
    --rx-muted: #a7a7a7;
    --rx-danger: #ff5252;
    --rx-success: #35d07f;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
        radial-gradient(
            circle at top,
            rgba(255,212,0,.13),
            transparent 35%
        ),
        var(--rx-black);
    color: var(--rx-text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.rx-page {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
}

.rx-wrapper {
    width: 100%;
    max-width: 430px;
}

.rx-brand {
    text-align: center;
    margin-bottom: 22px;
}

.rx-logo {
    width: 68px;
    height: 68px;
    margin: 0 auto 12px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--rx-yellow);
    color: #000;
    font-size: 27px;
    font-weight: 950;
    letter-spacing: -1px;
    box-shadow:
        0 12px 35px rgba(255,212,0,.18);
}

.rx-brand h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -.7px;
}

.rx-brand p {
    margin: 7px 0 0;
    color: var(--rx-muted);
    font-size: 14px;
}

.rx-card {
    width: 100%;
    padding: 22px;
    border: 1px solid var(--rx-border);
    border-radius: 24px;
    background: rgba(23,23,23,.96);
    box-shadow:
        0 25px 70px rgba(0,0,0,.45);
    backdrop-filter: blur(18px);
}

.rx-role-title {
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 800;
    color: #ddd;
}

.rx-role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
}

.rx-role {
    min-height: 72px;
    padding: 12px;
    border: 1px solid var(--rx-border);
    border-radius: 16px;
    background: #101010;
    color: #fff;
    text-align: left;
    transition: .18s ease;
}

.rx-role:hover {
    border-color: rgba(255,212,0,.45);
}

.rx-role.active {
    border-color: var(--rx-yellow);
    background:
        linear-gradient(
            145deg,
            rgba(255,212,0,.17),
            rgba(255,212,0,.04)
        );
    box-shadow:
        inset 0 0 0 1px rgba(255,212,0,.12);
}

.rx-role-icon {
    display: block;
    font-size: 22px;
    margin-bottom: 5px;
}

.rx-role-name {
    display: block;
    font-size: 14px;
    font-weight: 850;
}

.rx-role-desc {
    display: block;
    margin-top: 2px;
    color: #929292;
    font-size: 11px;
}

.rx-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    padding: 4px;
    margin-bottom: 18px;
    border-radius: 13px;
    background: #0d0d0d;
}

.rx-tab {
    border: 0;
    border-radius: 10px;
    padding: 11px 8px;
    background: transparent;
    color: #999;
    font-size: 13px;
    font-weight: 800;
}

.rx-tab.active {
    background: var(--rx-yellow);
    color: #000;
}

.rx-panel {
    display: none;
}

.rx-panel.active {
    display: block;
}

.rx-field {
    margin-bottom: 14px;
}

.rx-field label {
    display: block;
    margin-bottom: 7px;
    color: #ddd;
    font-size: 12px;
    font-weight: 750;
}

.rx-input-wrap {
    position: relative;
}

.rx-input {
    width: 100%;
    min-height: 50px;
    padding: 0 14px;
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 13px;
    outline: none;
    background: #0d0d0d;
    color: #fff;
    font-size: 14px;
    transition: .18s ease;
}

.rx-input:focus {
    border-color: var(--rx-yellow);
    box-shadow:
        0 0 0 3px rgba(255,212,0,.08);
}

.rx-input::placeholder {
    color: #666;
}

.rx-phone-row {
    display: grid;
    grid-template-columns: 76px 1fr;
    gap: 8px;
}

.rx-country {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 13px;
    background: #0d0d0d;
    color: #ddd;
    font-size: 13px;
    font-weight: 800;
}

.rx-password-row .rx-input {
    padding-right: 48px;
}

.rx-password-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #999;
}

.rx-password-toggle:hover {
    color: var(--rx-yellow);
}

.rx-forgot {
    display: flex;
    justify-content: flex-end;
    margin-top: -5px;
    margin-bottom: 16px;
}

.rx-link {
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--rx-yellow);
    font-size: 12px;
    font-weight: 750;
}

.rx-link:hover {
    text-decoration: underline;
}

.rx-primary {
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 14px;
    background: var(--rx-yellow);
    color: #000;
    font-size: 15px;
    font-weight: 950;
    transition: .18s ease;
}

.rx-primary:hover {
    filter: brightness(1.05);
    transform: translateY(-1px);
}

.rx-primary:active {
    transform: translateY(0);
}

.rx-primary:disabled {
    cursor: not-allowed;
    opacity: .55;
    transform: none;
}

.rx-secondary {
    width: 100%;
    min-height: 48px;
    margin-top: 10px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 13px;
    background: #101010;
    color: #fff;
    font-size: 14px;
    font-weight: 800;
}

.rx-secondary:hover {
    border-color: rgba(255,212,0,.4);
}

.rx-status {
    display: none;
    margin-bottom: 14px;
    padding: 11px 13px;
    border-radius: 12px;
    font-size: 12px;
    line-height: 1.45;
}

.rx-status.show {
    display: block;
}

.rx-status.error {
    border: 1px solid rgba(255,82,82,.25);
    background: rgba(255,82,82,.08);
    color: #ff8d8d;
}

.rx-status.success {
    border: 1px solid rgba(53,208,127,.25);
    background: rgba(53,208,127,.08);
    color: #75e8a8;
}

.rx-status.info {
    border: 1px solid rgba(255,212,0,.20);
    background: rgba(255,212,0,.06);
    color: #ffe875;
}

.rx-otp {
    display: none;
}

.rx-otp.show {
    display: block;
}

.rx-otp-title {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 900;
}

.rx-otp-text {
    margin: 0 0 14px;
    color: #999;
    font-size: 12px;
    line-height: 1.5;
}

.rx-otp-input {
    text-align: center;
    letter-spacing: 7px;
    font-size: 21px;
    font-weight: 900;
}

.rx-otp-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
}

.rx-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
    color: #666;
    font-size: 11px;
}

.rx-divider::before,
.rx-divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: rgba(255,255,255,.08);
}

.rx-footer {
    margin-top: 18px;
    text-align: center;
    color: #666;
    font-size: 11px;
    line-height: 1.5;
}

.rx-spinner {
    display: inline-block;
    width: 15px;
    height: 15px;
    margin-right: 7px;
    vertical-align: -3px;
    border: 2px solid rgba(0,0,0,.25);
    border-top-color: #000;
    border-radius: 50%;
    animation: rxSpin .7s linear infinite;
}

@keyframes rxSpin {
    to {
        transform: rotate(360deg);
    }
}

.rx-hidden {
    display: none !important;
}

#recaptcha-container {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
}

@media (max-width: 420px) {

    .rx-page {
        padding: 16px 12px;
        align-items: flex-start;
        padding-top: 24px;
    }

    .rx-card {
        padding: 18px;
        border-radius: 21px;
    }

    .rx-brand {
        margin-bottom: 17px;
    }

    .rx-logo {
        width: 58px;
        height: 58px;
        border-radius: 17px;
        font-size: 23px;
    }

    .rx-brand h1 {
        font-size: 25px;
    }

}

</style>

</head>


<body>

<main class="rx-page">

    <div class="rx-wrapper">

        <!-- BRAND -->

        <section class="rx-brand">

            <div
                class="rx-logo"
                aria-label="RiderX"
            >
                RX
            </div>

            <h1>Welcome to RiderX</h1>

            <p>
                Login to continue your journey
            </p>

        </section>


        <!-- LOGIN CARD -->

        <section class="rx-card">

            <!-- ROLE -->

            <p class="rx-role-title">
                Continue as
            </p>

            <div class="rx-role-grid">

                <button
                    type="button"
                    class="rx-role active"
                    data-role="customer"
                    aria-pressed="true"
                >

                    <span class="rx-role-icon">
                        🧑
                    </span>

                    <span class="rx-role-name">
                        Customer
                    </span>

                    <span class="rx-role-desc">
                        Book rides & services
                    </span>

                </button>


                <button
                    type="button"
                    class="rx-role"
                    data-role="rider"
                    aria-pressed="false"
                >

                    <span class="rx-role-icon">
                        🏍️
                    </span>

                    <span class="rx-role-name">
                        Rider
                    </span>

                    <span class="rx-role-desc">
                        Accept rides & earn
                    </span>

                </button>

            </div>


            <!-- STATUS -->

            <div
                id="statusBox"
                class="rx-status"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- LOGIN METHOD TABS -->

            <div
                class="rx-tabs"
                role="tablist"
            >

                <button
                    type="button"
                    class="rx-tab active"
                    id="emailTab"
                    data-method="email"
                    role="tab"
                    aria-selected="true"
                >
                    Email
                </button>

                <button
                    type="button"
                    class="rx-tab"
                    id="phoneTab"
                    data-method="phone"
                    role="tab"
                    aria-selected="false"
                >
                    Phone OTP
                </button>

            </div>


            <!-- EMAIL PANEL -->

            <form
                id="emailPanel"
                class="rx-panel active"
                novalidate
            >

                <div class="rx-field">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        id="email"
                        name="email"
                        class="rx-input"
                        type="email"
                        inputmode="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        maxlength="150"
                        required
                    >

                </div>


                <div class="rx-field">

                    <label for="password">
                        Password
                    </label>

                    <div
                        class="rx-input-wrap rx-password-row"
                    >

                        <input
                            id="password"
                            name="password"
                            class="rx-input"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            maxlength="128"
                            required
                        >

                        <button
                            type="button"
                            id="passwordToggle"
                            class="rx-password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="rx-forgot">

                    <button
                        type="button"
                        id="forgotPassword"
                        class="rx-link"
                    >
                        Forgot password?
                    </button>

                </div>


                <button
                    type="submit"
                    id="emailLoginButton"
                    class="rx-primary"
                >
                    Login
                </button>


                <div class="rx-divider">
                    <span>OR</span>
                </div>


                <button
                    type="button"
                    id="registerButton"
                    class="rx-secondary"
                >
                    Create new account
                </button>

            </form>


            <!-- PHONE PANEL -->

            <div
                id="phonePanel"
                class="rx-panel"
            >

                <div id="phoneLoginStep">

                    <div class="rx-field">

                        <label for="phone">
                            Mobile number
                        </label>

                        <div class="rx-phone-row">

                            <div class="rx-country">
                                +91 🇮🇳
                            </div>

                            <input
                                id="phone"
                                name="phone"
                                class="rx-input"
                                type="tel"
                                inputmode="numeric"
                                autocomplete="tel"
                                placeholder="10-digit mobile number"
                                maxlength="10"
                            >

                        </div>

                    </div>


                    <button
                        type="button"
                        id="sendOtpButton"
                        class="rx-primary"
                    >
                        Send OTP
                    </button>

                </div>


                <!-- OTP STEP -->

                <div
                    id="otpStep"
                    class="rx-otp"
                >

                    <h3 class="rx-otp-title">
                        Verify your mobile
                    </h3>

                    <p
                        id="otpDescription"
                        class="rx-otp-text"
                    >
                        Enter the 6-digit OTP sent to your mobile number.
                    </p>


                    <div class="rx-field">

                        <label for="otp">
                            Verification code
                        </label>

                        <input
                            id="otp"
                            class="rx-input rx-otp-input"
                            type="text"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            placeholder="••••••"
                            maxlength="6"
                        >

                    </div>


                    <button
                        type="button"
                        id="verifyOtpButton"
                        class="rx-primary"
                    >
                        Verify & Login
                    </button>


                    <div class="rx-otp-actions">

                        <button
                            type="button"
                            id="changePhoneButton"
                            class="rx-secondary"
                        >
                            Change number
                        </button>

                        <button
                            type="button"
                            id="resendOtpButton"
                            class="rx-secondary"
                        >
                            Resend OTP
                        </button>

                    </div>

                </div>


                <div id="recaptcha-container"></div>

            </div>


        </section>


        <footer class="rx-footer">
            RiderX secure authentication
            <br>
            Your Firebase account is the source of truth.
        </footer>

    </div>

</main>


<script type="module">

/* ============================================================
   RIDERX LOGIN PAGE
   File: auth/login.html

   Compatible with:
       ../js/auth.js

   Authentication:
       Firebase Auth

   Profile / role:
       Firestore users/{uid}

   Roles:
       customer
       rider

   Admin:
       Never selectable from this public login page.
============================================================ */


const $ = (selector) =>
    document.querySelector(selector);


const $$ = (selector) =>
    Array.from(
        document.querySelectorAll(selector)
    );


/* =========================================================
   ELEMENTS
========================================================= */

const statusBox =
    $("#statusBox");

const emailPanel =
    $("#emailPanel");

const phonePanel =
    $("#phonePanel");

const emailTab =
    $("#emailTab");

const phoneTab =
    $("#phoneTab");

const emailInput =
    $("#email");

const passwordInput =
    $("#password");

const passwordToggle =
    $("#passwordToggle");

const phoneInput =
    $("#phone");

const otpInput =
    $("#otp");

const emailLoginButton =
    $("#emailLoginButton");

const sendOtpButton =
    $("#sendOtpButton");

const verifyOtpButton =
    $("#verifyOtpButton");

const resendOtpButton =
    $("#resendOtpButton");

const changePhoneButton =
    $("#changePhoneButton");

const forgotPasswordButton =
    $("#forgotPassword");

const registerButton =
    $("#registerButton");

const phoneLoginStep =
    $("#phoneLoginStep");

const otpStep =
    $("#otpStep");

const otpDescription =
    $("#otpDescription");


/* =========================================================
   PAGE STATE
========================================================= */

let selectedRole =
    "customer";

let selectedMethod =
    "email";

let otpSent =
    false;

let pageBusy =
    false;


/* =========================================================
   STATUS
========================================================= */

function showStatus(
    message,
    type = "info"
) {

    if (!statusBox) {
        return;
    }

    statusBox.textContent =
        String(message || "");

    statusBox.className =
        "rx-status show " +
        type;

}


function clearStatus() {

    if (!statusBox) {
        return;
    }

    statusBox.textContent =
        "";

    statusBox.className =
        "rx-status";

}


/* =========================================================
   BUTTON LOADING
========================================================= */

function setButtonLoading(
    button,
    loading,
    text
) {

    if (!button) {
        return;
    }

    if (loading) {

        if (!button.dataset.originalText) {

            button.dataset.originalText =
                button.textContent.trim();

        }

        button.disabled =
            true;

        button.innerHTML =
            '<span class="rx-spinner"></span>' +
            (text || "Please wait...");

    } else {

        button.disabled =
            false;

        button.textContent =
            button.dataset.originalText ||
            text ||
            "Continue";

    }

}


/* =========================================================
   PAGE BUSY
========================================================= */

function setBusy(
    busy
) {

    pageBusy =
        Boolean(busy);

    if (!busy) {

        setButtonLoading(
            emailLoginButton,
            false,
            "Login"
        );

        setButtonLoading(
            sendOtpButton,
            false,
            "Send OTP"
        );

        setButtonLoading(
            verifyOtpButton,
            false,
            "Verify & Login"
        );

        setButtonLoading(
            resendOtpButton,
            false,
            "Resend OTP"
        );

    }

}


/* =========================================================
   ROLE SELECTION
========================================================= */

function setRole(
    role
) {

    const normalized =
        String(
            role || ""
        )
            .trim()
            .toLowerCase();

    if (
        ![
            "customer",
            "rider"
        ].includes(normalized)
    ) {

        return;

    }

    selectedRole =
        normalized;

    $$(".rx-role")
        .forEach(
            function (button) {

                const active =
                    button.dataset.role ===
                    normalized;

                button.classList.toggle(
                    "active",
                    active
                );

                button.setAttribute(
                    "aria-pressed",
                    active ? "true" : "false"
                );

            }
        );

    /*
     * This value is only a UI selection.
     * Firestore role remains authoritative
     * for an existing account.
     */

    try {

        localStorage.setItem(
            "riderx_selected_role",
            normalized
        );

    } catch (error) {

        console.warn(
            "RiderX role cache unavailable:",
            error
        );

    }

}


/* =========================================================
   RESTORE SELECTED ROLE
========================================================= */

function restoreRole() {

    try {

        const saved =
            localStorage.getItem(
                "riderx_selected_role"
            );

        if (
            [
                "customer",
                "rider"
            ].includes(
                saved
            )
        ) {

            setRole(
                saved
            );

            return;

        }

    } catch (error) {

        console.warn(
            "RiderX role restore failed:",
            error
        );

    }

    setRole(
        "customer"
    );

}


/* =========================================================
   METHOD SWITCH
========================================================= */

function setMethod(
    method
) {

    selectedMethod =
        method === "phone"
            ? "phone"
            : "email";

    const emailActive =
        selectedMethod === "email";

    emailTab.classList.toggle(
        "active",
        emailActive
    );

    phoneTab.classList.toggle(
        "active",
        !emailActive
    );

    emailTab.setAttribute(
        "aria-selected",
        emailActive ? "true" : "false"
    );

    phoneTab.setAttribute(
        "aria-selected",
        !emailActive ? "true" : "false"
    );

    emailPanel.classList.toggle(
        "active",
        emailActive
    );

    phonePanel.classList.toggle(
        "active",
        !emailActive
    );

    clearStatus();

}


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

passwordToggle.addEventListener(
    "click",
    function () {

        const showing =
            passwordInput.type ===
            "text";

        passwordInput.type =
            showing
                ? "password"
                : "text";

        passwordToggle.textContent =
            showing
                ? "👁"
                : "🙈";

        passwordToggle.setAttribute(
            "aria-label",
            showing
                ? "Show password"
                : "Hide password"
        );

    }
);


/* =========================================================
   ROLE BUTTONS
========================================================= */

$$(".rx-role")
    .forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    setRole(
                        button.dataset.role
                    );

                }
            );

        }
    );


/* =========================================================
   LOGIN METHOD BUTTONS
========================================================= */

emailTab.addEventListener(
    "click",
    function () {

        if (!pageBusy) {
            setMethod("email");
        }

    }
);


phoneTab.addEventListener(
    "click",
    function () {

        if (!pageBusy) {
            setMethod("phone");
        }

    }
);


/* =========================================================
   PHONE INPUT
========================================================= */

phoneInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""

/* =========================================================
   FIREBASE AUTH ENGINE
========================================================= */

async function getAuthEngine() {

    /*
     * auth.js is the canonical RiderX authentication engine.
     */

    if (
        !window.RiderX ||
        !window.RiderX.auth
    ) {

        throw new Error(
            "RiderX authentication engine is unavailable."
        );

    }

    const auth =
        window.RiderX.auth;

    if (
        typeof auth.init ===
        "function"
    ) {

        await auth.init();

    }

    return auth;

}


/* =========================================================
   REDIRECT AFTER AUTH
========================================================= */

async function redirectAfterLogin(
    auth,
    result
) {

    const role =
        auth.normalizeRole(
            result?.role ||
            auth.getRole()
        );

    if (!role) {

        throw new Error(
            "RiderX account role is not configured."
        );

    }

    /*
     * Never trust the browser-selected role
     * for an existing account.
     *
     * auth.js resolves the real Firestore role.
     */

    if (
        role === "customer"
    ) {

        window.location.replace(
            "../customer/home.html"
        );

        return;

    }

    if (
        role === "rider"
    ) {

        window.location.replace(
            "../rider/home.html"
        );

        return;

    }

    if (
        role === "admin" ||
        role === "superadmin"
    ) {

        window.location.replace(
            "../admin/dashboard.html"
        );

        return;

    }

    throw new Error(
        "Unsupported RiderX account role."
    );

}


/* =========================================================
   EMAIL LOGIN
========================================================= */

emailPanel.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        if (pageBusy) {
            return;
        }

        clearStatus();

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;

        if (!email) {

            showStatus(
                "Please enter your email address.",
                "error"
            );

            emailInput.focus();

            return;

        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {

            showStatus(
                "Please enter a valid email address.",
                "error"
            );

            emailInput.focus();

            return;

        }

        if (!password) {

            showStatus(
                "Please enter your password.",
                "error"
            );

            passwordInput.focus();

            return;

        }

        setBusy(true);

        setButtonLoading(
            emailLoginButton,
            true,
            "Signing in..."
        );

        try {

            const auth =
                await getAuthEngine();

            const result =
                await auth.loginEmail(
                    email,
                    password
                );

            showStatus(
                "Login successful. Opening RiderX...",
                "success"
            );

            await redirectAfterLogin(
                auth,
                result
            );

        } catch (error) {

            console.error(
                "RiderX login page email error:",
                error
            );

            showStatus(
                error?.message ||
                "Login failed. Please try again.",
                "error"
            );

            setBusy(false);

        }

    }
);


/* =========================================================

========================================================= */

sendOtpButton.addEventListener(
    "click",
    async function () {

        if (pageBusy) {
            return;
        }

        clearStatus();

        const phone =
            phoneInput.value
                .replace(
                    /\D/g,
                    ""
                );

        if (
            phone.length !== 10
        ) {

            showStatus(
                "Enter a valid 10-digit Indian mobile number.",
                "error"
            );

            phoneInput.focus();

            return;

        }

        setBusy(true);

        setButtonLoading(
            sendOtpButton,
            true,
            "Sending OTP..."
        );

        try {

            const auth =
                await getAuthEngine();

            /*
             * auth.js converts the Indian number
             * to +91XXXXXXXXXX.
             */

            const result =
                await auth.sendOtp(
                    phone,
                    document.getElementById(
                        "recaptcha-container"
                    )
                );

            otpSent =
                true;

            phoneLoginStep.classList.add(
                "rx-hidden"
            );

            otpStep.classList.add(
                "show"
            );

            otpDescription.textContent =
                "Enter the 6-digit OTP sent to +91 " +
                phone +
                ".";

            showStatus(
                "OTP sent successfully.",
                "success"
            );

            otpInput.value =
                "";

            otpInput.focus();

            setBusy(false);

            /*
             * result is intentionally retained for
             * compatibility/debugging.
             */

            void result;

        } catch (error) {

            console.error(
                "RiderX OTP send page error:",
                error
            );

            showStatus(
                error?.message ||
                "Unable to send OTP. Please try again.",
                "error"
            );

            setBusy(false);

        }

    }
);

/* =========================================================
   AUTO REDIRECT IF ALREADY AUTHENTICATED
========================================================= */

async function checkExistingSession() {

    try {

        const auth =
            await getAuthEngine();

        await auth.waitForAuth(
            8000
        );

        if (
            auth.isLoggedIn()
        ) {

            const role =
                auth.getRole();

            if (
                [
                    "customer",
                    "rider",
                    "admin",
                    "superadmin"
                ].includes(role)
            ) {

                /*
                 * Do not keep an authenticated user
                 * on the login page.
                 */

                await redirectAfterLogin(
                    auth,
                    {
                        role:
                            role
                    }
                );

            }

        }

    } catch (error) {

        /*
         * Login page must remain usable even if
         * the automatic session check fails.
         */

        console.warn(
            "RiderX existing session check failed:",
            error
        );

    }

}


/* =========================================================
   INITIAL PAGE SETUP
========================================================= */

restoreRole();

setMethod(
    "email"
);


/*
 * Load auth engine immediately so Firebase state
 * can be restored before the user submits the form.
 */

checkExistingSession();

========================================================= */

    "riderx-auth-auth-error",
    function (event) {

        const message =
            event?.detail?.error?.message;

        if (
            message &&
            !pageBusy

            showStatus(
                message,
                "error"
            );

        }

    }
);
