<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Status</title>

<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;
color:white;
font-family:Arial;

}


.header{

background:#111;
padding:20px;
text-align:center;
font-size:24px;
border-bottom:2px solid #FFD600;

}



.box{

margin:20px;
background:#111;
padding:25px;
border-radius:20px;
text-align:center;

}



.status{

font-size:22px;
color:#FFD600;
margin:20px 0;

}



button{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#FFD600;
font-weight:bold;

}


</style>

</head>


<body>



<div class="header">

RIDER<span>X</span>

</div>




<div class="box">


<h2>

Your Ride

</h2>



<div id="status" class="status">

Searching Rider...

</div>



<p id="details">

Please wait

</p>



<button id="trackBtn" style="display:none">

View Live Tracking

</button>



</div>






<script type="module">


import { db } from "../firebase/config.js";


import {

doc,
getDoc

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId = localStorage.getItem("rideId");




async function checkRide(){


if(!rideId){

return;

}



const snap = await getDoc(

doc(db,"rides",rideId)

);



if(!snap.exists()){

return;

}




let data=snap.data();



let status=document.getElementById("status");

let details=document.getElementById("details");

let btn=document.getElementById("trackBtn");





if(data.status==="Pending"){


status.innerHTML="🔎 Searching Rider...";


details.innerHTML="Nearby riders are checking your ride";


}



if(data.status==="Accepted"){


status.innerHTML="✅ Rider Found";


details.innerHTML=

"Your rider is coming";


btn.style.display="block";



btn.onclick=()=>{


window.location.href="live-tracking.html";


};


}



}




checkRide();



setInterval(

checkRide,

5000

);



</script>




</body>

</html>
