<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Status</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.status-box{

background:#1d1d1d;
padding:25px;
border-radius:15px;
text-align:center;

}


.status{

font-size:25px;
color:#ffcc00;
font-weight:bold;

}


button{

width:100%;
padding:14px;
margin-top:15px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

🚕 Ride Status

</div>



<div class="container">


<div class="status-box">


<h2>
Your Ride
</h2>


<div id="status" class="status">

Checking...

</div>



<p id="details"></p>



<button onclick="openTracking()">

🗺️ Track Rider

</button>


</div>


</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs,
query,
orderBy,
limit

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






async function checkRide(){



let q=query(

collection(db,"rides"),

orderBy("createdAt","desc"),

limit(1)

);



let snap=await getDocs(q);



snap.forEach((ride)=>{


let data=ride.data();



document.getElementById("status").innerHTML=


data.status=="Accepted"

?

"🏍 Rider Found"

:

data.status;



document.getElementById("details").innerHTML=


`

📍 Pickup: ${data.pickup || ""}

<br>

🏁 Drop: ${data.drop || ""}

<br>

💰 ${data.fare || ""}

`;



});



}





window.openTracking=function(){


window.location.href="tracking.html";


}




checkRide();


setInterval(

checkRide,

5000

);



</script>


</body>

</html>
