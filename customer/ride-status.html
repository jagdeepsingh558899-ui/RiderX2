<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Status</title>

<link rel="stylesheet" href="../css/style.css">


<style>

body{

background:#000;
color:white;
font-family:Arial;

}


.header{

background:#111;
padding:20px;
text-align:center;
font-size:24px;
border-bottom:2px solid #FFD600;

}



.box{

margin:20px;
background:#111;
padding:25px;
border-radius:20px;
text-align:center;

}



.status{

font-size:22px;
color:#FFD600;
margin:20px 0;

}



.card{

background:#222;
padding:15px;
margin-top:15px;
border-radius:12px;

}



.otp{

font-size:40px;
color:#FFD600;
letter-spacing:8px;
margin:15px;

}



button{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#FFD600;
font-weight:bold;

}



</style>

</head>


<body>



<div class="header">

RIDER<span>X</span>

</div>



<div class="box">


<h2>

Your Ride

</h2>



<div id="status" class="status">

Searching Rider...

</div>




<div class="card" id="details">

Please wait...

</div>




<div class="card">


<h3>

🔐 Pickup OTP

</h3>


<div class="otp" id="otp">

----

</div>


</div>





<button id="trackBtn" style="display:none">

🗺 View Live Tracking

</button>



</div>







<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
onSnapshot

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId=

localStorage.getItem("rideId");





onSnapshot(

doc(db,"rides",rideId),

(snap)=>{



if(!snap.exists()) return;



let data=snap.data();



document.getElementById("status").innerHTML=


data.status==="Pending"

?

"🔎 Searching Rider..."

:

data.status==="Accepted"

?

"🏍 Rider Coming"

:

data.status==="Started"

?

"🚕 Ride Started"

:

"✅ Ride Completed";






document.getElementById("details").innerHTML=

`

Service: ${data.service}

<br><br>

Pickup:

${data.pickup}

<br><br>

Drop:

${data.drop}

<br><br>

Fare:

₹${data.fare}

<br><br>

Rider:

${data.riderId || "Searching..."}

`;






if(data.otp){


document.getElementById("otp").innerHTML=

data.otp;


}






if(

data.status==="Accepted" ||

data.status==="Started"

){


document.getElementById("trackBtn").style.display="block";


}



});






document.getElementById("trackBtn").onclick=()=>{


location.href="live-tracking.html";


};



</script>



</body>

</html>
