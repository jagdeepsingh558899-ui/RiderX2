<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Status</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.status-box{

background:#1d1d1d;
padding:25px;
border-radius:15px;
text-align:center;

}


.status{

font-size:25px;
color:#ffcc00;
font-weight:bold;

}


</style>

</head>


<body>


<div class="header">

🚕 Ride Status

</div>



<div class="container">


<div class="status-box">


<h2>
Your Ride
</h2>


<p id="rideStatus" class="status">

Checking...

</p>


<p id="details">

</p>


</div>



<a class="back" href="dashboard.html">

⬅ Back Dashboard

</a>


</div>





<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
getDocs,
query,
orderBy,
limit

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function checkRide(){


let status =
document.getElementById("rideStatus");


let details =
document.getElementById("details");



const q=query(

collection(db,"rides"),

orderBy("createdAt","desc"),

limit(1)

);



const snapshot =
await getDocs(q);



if(snapshot.empty){


status.innerHTML=
"No Ride Found";


return;

}



snapshot.forEach((ride)=>{


let data=ride.data();



status.innerHTML =
data.status;



details.innerHTML =

`
📍 ${data.pickup}
<br>
➡️ ${data.drop}
<br>
💰 ${data.fare}
`;



});



}



checkRide();



setInterval(

checkRide,

5000

);



</script>


</body>

</html>
