<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>RiderX - Ride Status</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        #map {
            width: 100%;
            height: 55vh;

            min-height: 360px;

            background: #111;
        }

        .topbar {

            position: sticky;

            top: 0;

            z-index: 1000;

            height: 62px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 16px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.95
                );

            backdrop-filter:
                blur(14px);

            border-bottom:
                1px solid
                rgba(
                    255,
                    214,
                    0,
                    0.30
                );

        }

        .brand {

            font-size: 21px;

            font-weight: 900;

        }

        .brand span {

            color: #FFD600;

        }

        .live-status {

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 11px;

            font-weight: 900;

        }

        .dot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #777;

        }

        .dot.active {

            background: #20d66b;

            box-shadow:
                0 0 12px
                rgba(
                    32,
                    214,
                    107,
                    0.8
                );

        }

        .panel {

            background: #000;

            padding: 14px 12px 30px;

        }

        .status-card {

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #0c0c0c
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 22px;

            padding: 18px;

            margin-bottom: 12px;

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );

        }

        .status-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

        }

        .status-title {

            font-size: 20px;

            font-weight: 900;

        }

        .status-badge {

            padding: 8px 12px;

            border-radius: 999px;

            background:
                rgba(
                    255,
                    214,
                    0,
                    0.12
                );

            color: #FFD600;

            border:
                1px solid
                rgba(
                    255,
                    214,
                    0,
                    0.25
                );

            font-size: 10px;

            font-weight: 900;

        }

        .sub {

            margin-top: 7px;

            color: #888;

            font-size: 12px;

            line-height: 1.4;

        }

        .rider-card {

            display: none;

            background: #171717;

            border-radius: 20px;

            padding: 15px;

            margin-bottom: 12px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

        }

        .rider-main {

            display: flex;

            align-items: center;

            gap: 12px;

        }

        .avatar {

            width: 52px;

            height: 52px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #FFD600;

            color: #000;

            font-size: 22px;

            font-weight: 900;

        }

        .rider-name {

            font-size: 16px;

            font-weight: 900;

        }

        .rider-id {

            margin-top: 4px;

            color: #888;

            font-size: 11px;

        }

        .ride-details {

            background: #171717;

            border-radius: 20px;

            padding: 16px;

            margin-bottom: 12px;

        }

        .detail-row {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding: 11px 0;

            border-bottom:
                1px solid
                #292929;

        }

        .detail-row:last-child {

            border-bottom: none;

        }

        .detail-label {

            color: #888;

            font-size: 12px;

        }

        .detail-value {

            text-align: right;

            font-size: 13px;

            font-weight: 800;

            max-width: 65%;

        }

        .otp-card {

            background:
                linear-gradient(
                    135deg,
                    #FFD600,
                    #ffea69
                );

            color: #000;

            border-radius: 20px;

            padding: 17px;

            margin-bottom: 12px;

            text-align: center;

        }

        .otp-label {

            font-size: 11px;

            font-weight: 900;

            text-transform: uppercase;

        }

        .otp {

            margin-top: 5px;

            font-size: 40px;

            letter-spacing: 9px;

            font-weight: 900;

        }

        .buttons {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 10px;

        }

        button {

            min-height: 50px;

            border: none;

            border-radius: 14px;

            font-size: 13px;

            font-weight: 900;

            cursor: pointer;

        }

        .primary {

            background: #FFD600;

            color: #000;

        }

        .secondary {

            background: #202020;

            color: #fff;

            border:
                1px solid
                #3a3a3a;

        }

        .cancel {

            width: 100%;

            margin-top: 10px;

            background: #1c1c1c;

            color: #ff6262;

            border:
                1px solid
                rgba(
                    255,
                    98,
                    98,
                    0.25
                );

        }

        .message {

            padding: 10px;

            text-align: center;

            color: #777;

            font-size: 11px;

            line-height: 1.5;

        }

        .leaflet-control-zoom a {

            background: #111 !important;

            color: #fff !important;

            border-color: #333 !important;

        }

        .rider-marker {

            width: 48px;

            height: 48px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #FFD600;

            border: 4px solid #000;

            font-size: 24px;

            box-shadow:
                0 5px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

        }

        @media (min-width: 800px) {

            #map {
                height: 62vh;
            }

            .panel {
                max-width: 700px;
                margin: auto;
            }

        }

    </style>

</head>


<body>


    <div class="topbar">

        <div class="brand">
            Rider<span>X</span>
        </div>

        <div class="live-status">

            <div
                id="liveDot"
                class="dot"
            ></div>

            <span id="liveText">
                WAITING
            </span>

        </div>

    </div>


    <div id="map"></div>


    <div class="panel">


        <div class="status-card">

            <div class="status-row">

                <div
                    id="statusTitle"
                    class="status-title"
                >
                    Finding your rider
                </div>

                <div
                    id="statusBadge"
                    class="status-badge"
                >
                    SEARCHING
                </div>

            </div>

            <div
                id="statusMessage"
                class="sub"
            >
                We're looking for a RiderX rider near you.
            </div>

        </div>


        <div
            id="riderCard"
            class="rider-card"
        >

            <div class="rider-main">

                <div class="avatar">
                    🏍️
                </div>

                <div>

                    <div
                        id="riderName"
                        class="rider-name"
                    >
                        RiderX Rider
                    </div>

                    <div
                        id="riderId"
                        class="rider-id"
                    >
                        Connecting...
                    </div>

                </div>

            </div>

        </div>


        <div class="ride-details">

            <div class="detail-row">

                <div class="detail-label">
                    Service
                </div>

                <div
                    id="service"
                    class="detail-value"
                >
                    Bike Taxi
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Pickup
                </div>

                <div
                    id="pickup"
                    class="detail-value"
                >
                    Loading...
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Drop
                </div>

                <div
                    id="drop"
                    class="detail-value"
                >
                    Loading...
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Fare
                </div>

                <div
                    id="fare"
                    class="detail-value"
                >
                    ₹0
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Distance
                </div>

                <div
                    id="distance"
                    class="detail-value"
                >
                    0 KM
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Ride ID
                </div>

                <div
                    id="rideIdDisplay"
                    class="detail-value"
                >
                    ----
                </div>

            </div>

        </div>


        <div class="otp-card">

            <div class="otp-label">
                Pickup OTP
            </div>

            <div
                id="otp"
                class="otp"
            >
                ----
            </div>

        </div>


        <div class="buttons">

            <button
                id="centerBtn"
                class="primary"
            >
                📍 Rider Location
            </button>

            <button
                id="refreshBtn"
                class="secondary"
            >
                🔄 Refresh
            </button>

        </div>


        <button
            id="cancelBtn"
            class="cancel"
        >
            Cancel Ride
        </button>


        <div
            id="message"
            class="message"
        >
            Connecting to RiderX...
        </div>


    </div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script type="module">

        import {
            auth,
            db
        } from "../firebase/firebase-config.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


        import {
            doc,
            getDoc,
            onSnapshot,
            updateDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        // =====================================================
        // STATE
        // =====================================================

        let map = null;

        let riderMarker = null;

        let pickupMarker = null;

        let dropMarker = null;

        let rideId = null;

        let rideData = null;

        let lastRiderLocation = null;


        // =====================================================
        // DOM
        // =====================================================

        const statusTitle =
            document.getElementById(
                "statusTitle"
            );

        const statusBadge =
            document.getElementById(
                "statusBadge"
            );

        const statusMessage =
            document.getElementById(
                "statusMessage"
            );

        const riderCard =
            document.getElementById(
                "riderCard"
            );

        const liveDot =
            document.getElementById(
                "liveDot"
            );

        const liveText =
            document.getElementById(
                "liveText"
            );

        const message =
            document.getElementById(
                "message"
            );


        // =====================================================
        // GET RIDE ID
        // =====================================================

        function getRideId() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return (
                params.get("rideId") ||
                localStorage.getItem(
                    "rideId"
                ) ||
                localStorage.getItem(
                    "activeRideId"
                )
            );

        }


        // =====================================================
        // MAP
        // =====================================================

        function initMap() {

            map =
                L.map("map").setView(
                    [30.7333, 76.7794],
                    13
                );


            L.tileLayer(
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 19,
                    attribution:
                        "&copy; OpenStreetMap"
                }
            ).addTo(map);

        }


        // =====================================================
        // RIDER ICON
        // =====================================================

        function createRiderIcon() {

            return L.divIcon({

                className: "",

                html:
                    '<div class="rider-marker">🏍️</div>',

                iconSize:
                    [48, 48],

                iconAnchor:
                    [24, 24]

            });

        }


        // =====================================================
        // FORMAT LOCATION
        // =====================================================

        function formatLocation(
            value
        ) {

            if (!value) {

                return "Not available";

            }


            if (
                typeof value ===
                "string"
            ) {

                return value;

            }


            if (
                typeof value ===
                "object"
            ) {

                return (
                    value.address ||
                    value.name ||
                    (
                        value.lat !==
                            undefined &&
                        value.lng !==
                            undefined
                    )
                        ?
                        `${value.lat}, ${value.lng}`
                        :
                        "Location"
                );

            }


            return "Location";

        }


        // =====================================================
        // ADD PICKUP / DROP
        // =====================================================

        function updateRouteMarkers(
            data
        ) {

            const pickup =
                data.pickup;

            const drop =
                data.drop;


            if (
                pickup &&
                typeof pickup ===
                "object" &&
                pickup.lat !==
                undefined
            ) {

                if (!pickupMarker) {

                    pickupMarker =
                        L.marker(
                            [
                                pickup.lat,
                                pickup.lng
                            ]
                        )
                        .addTo(map)
                        .bindPopup(
                            "Pickup"
                        );

                } else {

                    pickupMarker.setLatLng(
                        [
                            pickup.lat,
                            pickup.lng
                        ]
                    );

                }

            }


            if (
                drop &&
                typeof drop ===
                "object" &&
                drop.lat !==
                undefined
            ) {

                if (!dropMarker) {

                    dropMarker =
                        L.marker(
                            [
                                drop.lat,
                                drop.lng
                            ]
                        )
                        .addTo(map)
                        .bindPopup(
                            "Drop"
                        );

                } else {

                    dropMarker.setLatLng(
                        [
                            drop.lat,
                            drop.lng
                        ]
                    );

                }

            }

        }


        // =====================================================
        // UPDATE RIDER MARKER
        // =====================================================

        function updateRiderLocation(
            location
        ) {

            if (!location) {

                return;

            }


            const lat =
                Number(
                    location.lat ??
                    location.latitude
                );

            const lng =
                Number(
                    location.lng ??
                    location.longitude
                );


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ) {

                return;

            }


            lastRiderLocation = {
                lat,
                lng
            };


            if (!riderMarker) {

                riderMarker =
                    L.marker(
                        [
                            lat,
                            lng
                        ],
                        {
                            icon:
                                createRiderIcon()
                        }
                    )
                    .addTo(map)
                    .bindPopup(
                        "RiderX Rider"
                    );

            } else {

                riderMarker.setLatLng(
                    [
                        lat,
                        lng
                    ]
                );

            }


            liveDot.classList.add(
                "active"
            );

            liveText.innerText =
                "RIDER LIVE";


            message.innerText =
                "Rider ki live location update ho rahi hai.";

        }


        // =====================================================
        // FIT MAP
        // =====================================================

        function centerMap() {

            if (
                lastRiderLocation
            ) {

                map.setView(
                    [
                        lastRiderLocation.lat,
                        lastRiderLocation.lng
                    ],
                    16
                );

                return;

            }


            const points = [];


            if (
                pickupMarker
            ) {

                points.push(
                    pickupMarker.getLatLng()
                );

            }


            if (
                dropMarker
            ) {

                points.push(
                    dropMarker.getLatLng()
                );

            }


            if (
                points.length
            ) {

                map.fitBounds(
                    L.latLngBounds(
                        points
                    ),
                    {
                        padding:
                            [40, 40]
                    }
                );

            }

        }


        // =====================================================
        // UPDATE RIDE UI
        // =====================================================

        function updateRideUI(
            data
        ) {

            document.getElementById(
                "service"
            ).innerText =
                data.serviceType ||
                data.service ||
                "Bike Taxi";


            document.getElementById(
                "pickup"
            ).innerText =
                formatLocation(
                    data.pickup
                );


            document.getElementById(
                "drop"
            ).innerText =
                formatLocation(
                    data.drop
                );


            document.getElementById(
                "fare"
            ).innerText =
                "₹" +
                Number(
                    data.fare || 0
                );


            document.getElementById(
                "distance"
            ).innerText =
                Number(
                    data.distance || 0
                ).toFixed(1) +
                " KM";


            document.getElementById(
                "rideIdDisplay"
            ).innerText =
                rideId
                    ? rideId.slice(
                        0,
                        10
                    )
                    : "----";


            if (data.otp) {

                document.getElementById(
                    "otp"
                ).innerText =
                    String(
                        data.otp
                    );

            }


            const riderId =
                data.riderId ||
                data.driverId;


            if (riderId) {

                riderCard.style.display =
                    "block";


                document.getElementById(
                    "riderName"
                ).innerText =
                    data.riderName ||
                    data.driverName ||
                    "RiderX Rider";


                document.getElementById(
                    "riderId"
                ).innerText =
                    "Rider ID: " +
                    String(
                        riderId
                    ).slice(
                        0,
                        12
                    );

            }


            const status =
                String(
                    data.status ||
                    "REQUESTED"
                ).toUpperCase();


            switch (
                status
            ) {

                case "REQUESTED":

                case "PENDING":

                    statusTitle.innerText =
                        "Finding your rider";

                    statusBadge.innerText =
                        "SEARCHING";

                    statusMessage.innerText =
                        "We're looking for a RiderX rider near you.";

                    break;


                case "ACCEPTED":

                    statusTitle.innerText =
                        "Your rider is coming";

                    statusBadge.innerText =
                        "ACCEPTED";

                    statusMessage.innerText =
                        "Rider ne ride accept kar li hai.";

                    break;


                case "STARTED":

                case "IN_PROGRESS":

                    statusTitle.innerText =
                        "You're on your way";

                    statusBadge.innerText =
                        "ON TRIP";

                    statusMessage.innerText =
                        "Your ride is currently in progress.";

                    break;


                case "COMPLETED":

                    statusTitle.innerText =
                        "Ride completed";

                    statusBadge.innerText =
                        "COMPLETED";

                    statusMessage.innerText =
                        "Thanks for riding with RiderX.";

                    liveText.innerText =
                        "TRIP END";

                    break;


                case "CANCELLED":

                case "CANCELED":

                    statusTitle.innerText =
                        "Ride cancelled";

                    statusBadge.innerText =
                        "CANCELLED";

                    statusMessage.innerText =
                        "This ride has been cancelled.";

                    break;


                default:

                    statusTitle.innerText =
                        "Ride update";

                    statusBadge.innerText =
                        status;

            }


            updateRouteMarkers(
                data
            );


            if (
                data.riderLocation
            ) {

                updateRiderLocation(
                    data.riderLocation
                );

            }

        }


        // =====================================================
        // LISTEN TO RIDE
        // =====================================================

        function listenToRide() {

            if (!rideId) {

                statusTitle.innerText =
                    "Ride not found";

                statusBadge.innerText =
                    "NO RIDE";

                message.innerText =
                    "Ride ID nahi mila.";

                return;

            }


            const rideRef =
                doc(
                    db,
                    "rides",
                    rideId
                );


            onSnapshot(

                rideRef,

                (snap) => {

                    if (
                        !snap.exists()
                    ) {

                        statusTitle.innerText =
                            "Ride not found";

                        statusBadge.innerText =
                            "NOT FOUND";

                        return;

                    }


                    rideData =
                        snap.data();


                    updateRideUI(
                        rideData
                    );

                },

                (error) => {

                    console.error(
                        "Ride Listener Error:",
                        error
                    );


                    message.innerText =
                        "Ride connection error: " +
                        error.message;

                }

            );

        }


        // =====================================================
        // CANCEL RIDE
        // =====================================================

        document.getElementById(
            "cancelBtn"
        ).onclick =
            async function () {

                if (!rideId) {

                    return;

                }


                const ok =
                    confirm(
                        "Kya aap ride cancel karna chahte ho?"
                    );


                if (!ok) return;


                try {

                    await updateDoc(
                        doc(
                            db,
                            "rides",
                            rideId
                        ),
                        {

                            status:
                                "CANCELLED",

                            cancelledBy:
                                "customer",

                            cancelledAt:
                                serverTimestamp()

                        }
                    );


                    message.innerText =
                        "Ride cancelled.";

                } catch (error) {

                    console.error(
                        error
                    );

                    alert(
                        "Ride cancel nahi hui: " +
                        error.message
                    );

                }

            };


        // =====================================================
        // CENTER BUTTON
        // =====================================================

        document.getElementById(
            "centerBtn"
        ).onclick =
            function () {

                centerMap();

            };


        // =====================================================
        // REFRESH
        // =====================================================

        document.getElementById(
            "refreshBtn"
        ).onclick =
            function () {

                window.location.reload();

            };


        // =====================================================
        // AUTH
        // =====================================================

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    statusTitle.innerText =
                        "Login required";

                    statusBadge.innerText =
                        "LOGIN";

                    message.innerText =
                        "Customer login required.";

                    return;

                }


                rideId =
                    getRideId();


                if (!rideId) {

                    statusTitle.innerText =
                        "No active ride";

                    statusBadge.innerText =
                        "NO RIDE";

                    message.innerText =
                        "Booking ke baad ride-status page open karo.";

                    return;

                }


                listenToRide();

            }
        );


        // =====================================================
        // INIT
        // =====================================================

        initMap();

    </script>

</body>

</html>
