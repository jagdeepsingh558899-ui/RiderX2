<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride Status</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">

🚕 Ride Status

</div>



<div class="container">


<div class="card">


<h2 id="status">

Loading...

</h2>


<p id="fare">

Fare:-

</p>


<p id="rider">

Rider:-

</p>



<button onclick="openTracking()">

🗺️ Track Rider

</button>



</div>


</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId = localStorage.getItem("rideId");





function loadStatus(){



if(!rideId){

document.getElementById("status").innerHTML=

"No Ride Found";

return;

}



onSnapshot(

doc(db,"rides",rideId),

async(snapshot)=>{



let data=snapshot.data();



if(!data)return;



document.getElementById("status").innerHTML=

"Status: "+data.status;



document.getElementById("fare").innerHTML=

"Fare: "+data.fare;



if(data.riderId){


let rider=await getDoc(

doc(db,"users",data.riderId)

);



if(rider.exists()){


document.getElementById("rider").innerHTML=

"Rider: "+

(rider.data().name || "Rider");


}


}



}


);



}






window.openTracking=function(){


window.location.href=

"live-tracking.html";


}



loadStatus();



</script>


</body>

</html>
