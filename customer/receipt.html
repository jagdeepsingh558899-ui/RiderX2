<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Receipt</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#000;
color:white;

padding:20px;

}



.box{

background:#111;

border:2px solid #FFD600;

border-radius:20px;

padding:25px;

}



h1 span{

color:#FFD600;

}



.item{

margin-top:15px;

background:#222;

padding:15px;

border-radius:12px;

}



button{

width:100%;

padding:15px;

margin-top:20px;

background:#FFD600;

border:none;

border-radius:12px;

font-weight:bold;

}



</style>


</head>


<body>



<div class="box">


<h1>

RIDER<span>X</span>

</h1>


<h2>

Ride Receipt

</h2>




<div class="item">

Service:

<span id="service">

Loading...

</span>

</div>




<div class="item">

Pickup:

<span id="pickup">

-

</span>

</div>



<div class="item">

Drop:

<span id="drop">

-

</span>

</div>




<div class="item">

Fare:

₹<span id="fare">

0

</span>

</div>




<div class="item">

Payment Status:

<span id="payment">

Pending

</span>

</div>




<button onclick="payCash()">

💵 Pay Cash

</button>




<button onclick="payOnline()">

💳 Online Payment

</button>



</div>







<script type="module">


import { db } from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId =

localStorage.getItem("rideId");





async function loadReceipt(){



const snap = await getDoc(

doc(db,"rides",rideId)

);



if(!snap.exists()){

return;

}



let data=snap.data();




document.getElementById("service").innerHTML=
data.service;



document.getElementById("pickup").innerHTML=
data.pickup;



document.getElementById("drop").innerHTML=
data.drop;



document.getElementById("fare").innerHTML=
data.fare;



}



window.payCash=async()=>{


await updateDoc(

doc(db,"rides",rideId),

{


paymentMethod:"Cash",

paymentStatus:"Paid"

}

);


alert("Cash Payment Completed ✅");


};



window.payOnline=async()=>{


await updateDoc(

doc(db,"rides",rideId),

{


paymentMethod:"Online",

paymentStatus:"Paid"

}

);


alert("Online Payment Started 💳");


};




loadReceipt();



</script>



</body>

</html>
