<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>RiderX | Book Ride</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

:root{
    --yellow:#ffe500;
    --black:#000;
    --dark:#090909;
    --card:#151515;
    --card2:#202020;
    --white:#fff;
    --muted:#8b8b8b;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
}

body{
    position:fixed;
    inset:0;
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    background:#ddd;
}

.leaflet-control-zoom{
    display:none!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
    padding:2px 4px!important;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:
        max(12px,env(safe-area-inset-top))
        14px
        0;
    pointer-events:none;
}

.topbar-inner{
    height:52px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-btn{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:50%;

    background:rgba(15,15,15,.94);
    color:#fff;

    font-size:17px;

    box-shadow:
        0 6px 22px rgba(0,0,0,.4);

    pointer-events:auto;

    transition:
        transform .15s ease;
}

.top-btn:active{
    transform:scale(.91);
}

.logo{
    padding:8px 17px;

    border-radius:15px;

    background:rgba(15,15,15,.94);

    font-size:17px;
    font-weight:800;

    letter-spacing:.3px;

    box-shadow:
        0 6px 22px rgba(0,0,0,.4);
}

.logo span{
    color:var(--yellow);
}


/* =========================================================
   STATUS
========================================================= */

.status-pill{
    position:fixed;

    top:
        calc(
            max(12px,env(safe-area-inset-top))
            + 61px
        );

    left:50%;

    transform:translateX(-50%);

    z-index:1000;

    max-width:90%;

    padding:8px 16px;

    border-radius:30px;

    background:rgba(17,17,17,.94);

    color:#fff;

    font-size:11px;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;

    box-shadow:
        0 5px 20px rgba(0,0,0,.35);

    pointer-events:none;
}


/* =========================================================
   CENTER PIN
========================================================= */

.center-pin{
    position:fixed;

    left:50%;
    top:50%;

    z-index:500;

    transform:
        translate(-50%,-100%);

    pointer-events:none;
}

.center-pin-icon{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--yellow);
    color:#000;

    border-radius:
        50%
        50%
        50%
        0;

    transform:rotate(-45deg);

    box-shadow:
        0 7px 20px rgba(0,0,0,.35);
}

.center-pin-icon i{
    transform:rotate(45deg);
}


/* =========================================================
   FLOATING LOCATION
========================================================= */

.location-btn{
    position:fixed;

    right:15px;

    /*
     * Sheet collapsed height approximately 30vh.
     * Button stays above the sheet.
     */
    bottom:
        calc(
            30vh + 18px
        );

    z-index:950;

    width:48px;
    height:48px;

    border:0;
    border-radius:50%;

    background:#111;
    color:var(--yellow);

    font-size:18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.45);

    transition:
        bottom .3s ease,
        transform .15s ease;
}

.location-btn:active{
    transform:scale(.92);
}


/* =========================================================
   BOTTOM SHEET
========================================================= */

.sheet{
    position:fixed;

    left:0;
    right:0;

    /*
     * Initial collapsed position.
     * About 30% of screen visible.
     */
    bottom:0;

    height:auto;

    max-height:
        calc(
            88vh
        );

    z-index:1000;

    padding:
        10px
        14px
        max(
            14px,
            env(safe-area-inset-bottom)
        );

    background:
        rgba(9,9,9,.985);

    border-radius:
        28px
        28px
        0
        0;

    box-shadow:
        0 -12px 40px rgba(0,0,0,.5);

    overflow-y:auto;
    overflow-x:hidden;

    /*
     * Sheet position is controlled by JS.
     */
    transform:
        translateY(
            calc(
                100% - 30vh
            )
        );

    transition:
        transform .32s cubic-bezier(.22,.8,.22,1);

    overscroll-behavior:contain;

    touch-action:pan-y;

    -webkit-overflow-scrolling:touch;
}

.sheet.dragging{
    transition:none;
}


/* =========================================================
   HANDLE
========================================================= */

.handle-area{
    width:100%;

    height:32px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:grab;

    touch-action:none;
}

.handle-area:active{
    cursor:grabbing;
}

.handle{
    width:48px;
    height:5px;

    background:#555;

    border-radius:10px;

    transition:
        background .2s ease,
        width .2s ease;
}

.handle-area:active .handle{
    width:58px;
    background:#777;
}


/* =========================================================
   SHEET CONTENT
========================================================= */

.sheet-content{
    padding-bottom:4px;
}


/* =========================================================
   TITLE
========================================================= */

.title{
    font-size:19px;
    font-weight:800;

    margin:
        0
        0
        13px;
}


/* =========================================================
   SEARCH BOX
========================================================= */

.search-box{
    background:#151515;

    border-radius:17px;

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.04);
}

.search-row{
    display:flex;

    align-items:center;

    gap:10px;

    min-height:56px;

    padding:
        8px
        10px;
}

.search-row + .search-row{
    border-top:
        1px solid
        #2c2c2c;
}

.location-dot{
    width:27px;
    height:27px;

    min-width:27px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:10px;
}

.pick-dot{
    background:#12351f;
    color:var(--green);
}

.drop-dot{
    background:#3a3300;
    color:var(--yellow);
}

.location-input{
    flex:1;

    width:100%;

    min-width:0;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:13px;
}

.location-input::placeholder{
    color:#777;
}

.location-input:focus{
    color:#fff;
}

.map-select-btn{
    width:36px;
    height:36px;

    min-width:36px;

    border:0;

    border-radius:50%;

    background:#242424;

    color:var(--yellow);

    display:flex;
    align-items:center;
    justify-content:center;
}

.map-select-btn:active{
    transform:scale(.92);
}


/* =========================================================
   SERVICES
========================================================= */

.section-title{
    margin-top:15px;
    margin-bottom:8px;

    font-size:12px;
    color:#999;
}

.services{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;
}

.service{
    min-height:72px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    border:
        1px solid
        #303030;

    border-radius:15px;

    background:#151515;

    color:#aaa;

    cursor:pointer;

    transition:
        transform .15s ease,
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
}

.service:active{
    transform:scale(.95);
}

.service i{
    font-size:19px;
}

.service span{
    font-size:10px;
}

.service.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#000;

    box-shadow:
        0 5px 15px
        rgba(255,229,0,.1);
}


/* =========================================================
   FARE
========================================================= */

.fare-card{
    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-top:14px;

    padding:14px;

    background:#151515;

    border-radius:16px;

    border:
        1px solid
        rgba(255,255,255,.04);
}

.fare-label{
    font-size:13px;
    font-weight:600;
}

.fare-info{
    margin-top:3px;

    color:#777;

    font-size:10px;
}

.fare-price{
    color:var(--yellow);

    font-size:23px;

    font-weight:800;
}


/* =========================================================
   DISTANCE
========================================================= */

.distance{
    text-align:center;

    margin-top:8px;

    color:#777;

    font-size:10px;
}


/* =========================================================
   PAYMENT
========================================================= */

.payment-row{
    display:flex;

    align-items:center;

    gap:9px;

    margin-top:10px;

    padding:13px;

    background:#151515;

    border-radius:15px;
}

.payment-icon{
    color:var(--yellow);
}

#paymentMethod{
    flex:1;

    min-width:0;

    border:0;
    outline:0;

    background:#151515;

    color:#fff;

    font-size:13px;
}


/* =========================================================
   BOOK BUTTON
========================================================= */

.book-btn{
    width:100%;

    margin-top:14px;

    min-height:54px;

    border:0;

    border-radius:16px;

    background:var(--yellow);

    color:#000;

    font-size:16px;

    font-weight:800;

    box-shadow:
        0 5px 20px
        rgba(255,229,0,.12);

    transition:
        transform .15s ease,
        background .2s ease;
}

.book-btn:active{
    transform:scale(.985);
}

.book-btn:disabled{
    background:#444;
    color:#888;
    box-shadow:none;
}


/* =========================================================
   STATUS
========================================================= */

#bookingStatus{
    min-height:20px;

    margin-top:9px;

    text-align:center;

    color:var(--yellow);

    font-size:11px;
}


/* =========================================================
   ACTIVE RIDE
========================================================= */

.active-ride{
    display:none;

    margin-top:12px;

    padding:13px;

    background:#151515;

    border-radius:16px;
}

.active-ride.show{
    display:block;
}

.active-ride-top{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.active-title{
    font-size:13px;
    font-weight:700;
}

.active-status{
    color:var(--yellow);
    font-size:11px;

    text-align:right;
}

.cancel-btn{
    width:100%;

    margin-top:10px;

    padding:11px;

    border:
        1px solid
        #3a2020;

    border-radius:12px;

    background:#170909;

    color:#ff6b6b;

    font-size:12px;

    font-weight:600;
}


/* =========================================================
   SHEET STATE
========================================================= */

body.sheet-expanded .sheet{
    transform:translateY(0);
}

body.sheet-expanded .location-btn{
    bottom:
        calc(
            88vh + 12px
        );
}

body.sheet-collapsed .sheet{
    transform:
        translateY(
            calc(
                100% - 30vh
            )
        );
}

body.sheet-collapsed .location-btn{
    bottom:
        calc(
            30vh + 18px
        );
}


/* =========================================================
   TABLET / SMALL DESKTOP
========================================================= */

@media(min-width:700px){

    .sheet{
        left:50%;
        right:auto;

        width:520px;

        transform:
            translate(
                -50%,
                calc(
                    100% - 30vh
                )
            );

        border-radius:
            28px
            28px
            0
            0;
    }

    body.sheet-expanded .sheet{
        transform:
            translate(
                -50%,
                0
            );
    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:380px){

    .topbar{
        padding-left:10px;
        padding-right:10px;
    }

    .top-btn{
        width:42px;
        height:42px;
    }

    .logo{
        font-size:15px;
        padding:7px 14px;
    }

    .sheet{
        padding-left:11px;
        padding-right:11px;
    }

    .title{
        font-size:17px;
    }

    .service{
        min-height:66px;
    }

    .service i{
        font-size:17px;
    }

}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(padding:max(0px)){

    .sheet{
        padding-bottom:
            max(
                14px,
                env(safe-area-inset-bottom)
            );
    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .sheet,
    .service,
    .top-btn,
    .book-btn{
        transition:none!important;
    }

}

</style>

</head>

<!-- =======================================================
     PAGE CONTROLLER
======================================================== -->

<script type="module">

document.addEventListener(
    "DOMContentLoaded",
    () => {

        /* ==================================================
           BACK BUTTON
        ================================================== */

        const back =
            document.getElementById(
                "backButton"
            );

        if(back){

            back.addEventListener(
                "click",
                () => {

                    history.back();

                }
            );

        }


        /* ==================================================
           LOCATION BUTTON
        ================================================== */

        const locationButton =
            document.getElementById(
                "floatingLocation"
            );

        const mainLocation =
            document.getElementById(
                "myLocation"
            );


        if(locationButton){

            locationButton.addEventListener(
                "click",
                () => {

                    mainLocation?.click();

                }
            );

        }


        /* ==================================================
           ACTIVE RIDE
        ================================================== */

        const activeRide =
            document.getElementById(
                "activeRide"
            );

        const activeStatus =
            document.getElementById(
                "activeRideStatus"
            );


        window.addEventListener(
            "riderx:ride-created",
            () => {

                activeRide?.classList.add(
                    "show"
                );

                if(activeStatus){

                    activeStatus.innerText =
                        "Searching...";

                }

                /*
                 * Automatically expand the
                 * booking sheet after booking.
                 */

                expandSheet();

            }
        );


        window.addEventListener(
            "riderx:ride-status",
            (event) => {

                const status =
                    event.detail?.status ||
                    "REQUESTED";


                activeRide?.classList.add(
                    "show"
                );


                if(activeStatus){

                    activeStatus.innerText =
                        status;

                }

                /*
                 * Ride tracking information
                 * deserves expanded panel.
                 */

                if(
                    status === "ACCEPTED" ||
                    status === "ARRIVING" ||
                    status === "STARTED"
                ){

                    expandSheet();

                }

            }
        );


        /* ==================================================
           CANCEL
        ================================================== */

        const cancel =
            document.getElementById(
                "cancelRide"
            );


        if(cancel){

            cancel.addEventListener(
                "click",
                () => {

                    if(
                        window.RiderXCustomer &&
                        typeof
                        window.RiderXCustomer.cancelRide ===
                        "function"
                    ){

                        window.RiderXCustomer.cancelRide();

                    }

                }
            );

        }


        /* ==================================================
           BOTTOM SHEET
        ================================================== */

        const sheet =
            document.getElementById(
                "bookingSheet"
            );

        const handle =
            document.getElementById(
                "sheetHandle"
            );


        if(!sheet || !handle){
            return;
        }


        let dragging = false;

        let startY = 0;

        let currentY = 0;

        let startTranslate = 0;


        /*
         * Calculate current transform
         */

        function getTranslateY(){

            const style =
                window.getComputedStyle(
                    sheet
                );

            const matrix =
                new DOMMatrixReadOnly(
                    style.transform
                );

            return matrix.m42 || 0;

        }


        /*
         * Sheet positions
         */

        function collapsedPosition(){

            return Math.max(
                0,
                sheet.offsetHeight -
                window.innerHeight * 0.30
            );

        }


        function expandedPosition(){

            return 0;

        }


        function setSheetPosition(
            value,
            animate = true
        ){

            const max =
                collapsedPosition();

            const min =
                expandedPosition();

            const clamped =
                Math.max(
                    min,
                    Math.min(
                        max,
                        value
                    )
                );


            if(!animate){

                sheet.classList.add(
                    "dragging"
                );

            }else{

                sheet.classList.remove(
                    "dragging"
                );

            }


            sheet.style.transform =
                `translateY(${clamped}px)`;

        }


        function expandSheet(){

            document.body.classList.remove(
                "sheet-collapsed"
            );

            document.body.classList.add(
                "sheet-expanded"
            );


            sheet.classList.remove(
                "dragging"
            );


            sheet.style.transform =
                "translateY(0)";


            setTimeout(
                () => {

                    if(window.RiderXCustomer?.getState){

                        const map =
                            window.RiderXCustomer
                                .getState()
                                ?.map;

                        if(map){

                            map.invalidateSize();

                        }

                    }

                },
                350
            );

        }


        function collapseSheet(){

            document.body.classList.remove(
                "sheet-expanded"
            );

            document.body.classList.add(
                "sheet-collapsed"
            );


            sheet.classList.remove(
                "dragging"
            );


            sheet.style.transform =
                `translateY(${collapsedPosition()}px)`;


            setTimeout(
                () => {

                    if(window.RiderXCustomer?.getState){

                        const map =
                            window.RiderXCustomer
                                .getState()
                                ?.map;

                        if(map){

                            map.invalidateSize();

                        }

                    }

                },
                350
            );

        }


        function toggleSheet(){

            if(
                document.body.classList.contains(
                    "sheet-expanded"
                )
            ){

                collapseSheet();

            }else{

                expandSheet();

            }

        }


        /*
         * Initial position
         */

        setTimeout(
            () => {

                collapseSheet();

            },
            100
        );


        /*
         * TOUCH START
         */

        handle.addEventListener(
            "touchstart",
            (event) => {

                if(
                    !event.touches ||
                    !event.touches.length
                ){

                    return;

                }


                dragging = true;

                startY =
                    event.touches[0].clientY;

                currentY =
                    startY;

                startTranslate =
                    getTranslateY();


                sheet.classList.add(
                    "dragging"
                );

            },
            {
                passive:true
            }
        );


        /*
         * TOUCH MOVE
         */

        handle.addEventListener(
            "touchmove",
            (event) => {

                if(!dragging){
                    return;
                }


                currentY =
                    event.touches[0].clientY;


                const delta =
                    currentY -
                    startY;


                const next =
                    startTranslate +
                    delta;


                setSheetPosition(
                    next,
                    false
                );

            },
            {
                passive:true
            }
        );


        /*
         * TOUCH END
         */

        handle.addEventListener(
            "touchend",
            () => {

                if(!dragging){
                    return;
                }


                dragging = false;


                sheet.classList.remove(
                    "dragging"
                );


                const finalY =
                    getTranslateY();


                const max =
                    collapsedPosition();


                /*
                 * Snap point:
                 *
                 * Top  = 0
                 * Bottom = 30% visible
                 */

                if(
                    finalY <
                    max * 0.50
                ){

                    expandSheet();

                }else{

                    collapseSheet();

                }

            },
            {
                passive:true
            }
        );


        /*
         * MOUSE / DESKTOP DRAG
         */

        handle.addEventListener(
            "mousedown",
            (event) => {

                dragging = true;

                startY =
                    event.clientY;

                currentY =
                    startY;

                startTranslate =
                    getTranslateY();


                sheet.classList.add(
                    "dragging"
                );


                event.preventDefault();

            }
        );


        document.addEventListener(
            "mousemove",
            (event) => {

                if(!dragging){
                    return;
                }


                currentY =
                    event.clientY;


                const delta =
                    currentY -
                    startY;


                setSheetPosition(
                    startTranslate +
                    delta,
                    false
                );

            }
        );


        document.addEventListener(
            "mouseup",
            () => {

                if(!dragging){
                    return;
                }


                dragging = false;


                sheet.classList.remove(
                    "dragging"
                );


                const finalY =
                    getTranslateY();


                const max =
                    collapsedPosition();


                if(
                    finalY <
                    max * 0.50
                ){

                    expandSheet();

                }else{

                    collapseSheet();

                }

            }
        );


        /*
         * TAP HANDLE
         */

        handle.addEventListener(
            "click",
            () => {

                if(
                    Math.abs(
                        currentY -
                        startY
                    ) < 8
                ){

                    toggleSheet();

                }

            }
        );


        /*
         * Recalculate on orientation
         */

        window.addEventListener(
            "resize",
            () => {

                if(
                    document.body.classList.contains(
                        "sheet-expanded"
                    )
                ){

                    expandSheet();

                }else{

                    collapseSheet();

                }

            }
        );

    },
    {
        once:true
    }
);

</script>
