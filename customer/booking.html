<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Booking</title>


<link rel="manifest" href="../manifest.json">

<meta name="theme-color" content="#FFD600">


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


</head>


<body>



<div class="topbar">

<h2>
🏍 RiderX
</h2>

</div>





<div class="container">






<!-- INSTALL APP -->

<div class="card">


<button id="installApp" style="display:none;">

📲 Install RiderX App

</button>


</div>









<!-- MAP -->


<div class="map-container">

<div id="map"></div>

</div>









<!-- MAIN OPTIONS -->


<div class="card">


<h3>
Choose Service
</h3>



<button id="rideOption" class="btn">

🏍 Book Ride

</button>




<button id="parcelOption" class="btn-outline">

📦 Book Parcel

</button>



</div>









<!-- RIDE SECTION -->


<div id="rideSection" class="card">


<h3>
Book Ride
</h3>




<div class="service-buttons">



<button class="service-btn active" data-service="Bike">

🏍 Bike

</button>



<button class="service-btn" data-service="Taxi">

🚕 Taxi

</button>



<button class="service-btn" data-service="Cab">

🚗 Cab

</button>



</div>



</div>









<!-- PARCEL SECTION -->


<div id="parcelSection" class="card" style="display:none;">


<h3>
Book Parcel

</h3>




<div class="service-buttons">



<button class="service-btn active" data-service="Parcel">

📦 Parcel

</button>



<button class="service-btn" data-service="Food">

🍔 Food

</button>



</div>



</div>









<input 
type="hidden"
id="service"
value="Bike"
>









<!-- LOCATION -->


<div class="card">


<h3>
Location
</h3>



<input

id="pickup"

class="input"

placeholder="Pickup Location"

readonly

>




<button id="locationBtn" class="btn">

📍 Use My Location

</button>





<input

id="drop"

class="input"

placeholder="Drop Location"

>


</div>









<!-- PAYMENT -->


<div class="card">


<h3>
Payment Method
</h3>



<select id="paymentMethod" class="input">


<option value="Cash">

💵 Cash

</option>


<option value="Online">

💳 Online

</option>


</select>



</div>









<!-- FARE -->


<div class="booking-card">


<div class="booking-title">


<h3>
Fare
</h3>


<div class="booking-price">

₹<span id="fare">

0

</span>

</div>


</div>



<div class="booking-row">

<span>
Service
</span>


<b id="selectedService">

Bike

</b>


</div>





<div class="booking-row">

<span>
Distance
</span>


<b id="distance">

-

</b>


</div>




</div>









<button id="bookBtn" class="btn">


Book Ride

</button>





</div>









<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/App.js"></script>


<script type="module" src="../js/booking.js"></script>





<script>


const rideOption =
document.getElementById("rideOption");


const parcelOption =
document.getElementById("parcelOption");


const rideSection =
document.getElementById("rideSection");


const parcelSection =
document.getElementById("parcelSection");


const buttons =
document.querySelectorAll(".service-btn");


const service =
document.getElementById("service");


const selected =
document.getElementById("selectedService");






rideOption.onclick=()=>{


rideSection.style.display="block";

parcelSection.style.display="none";


service.value="Bike";


selected.innerHTML="Bike";


};





parcelOption.onclick=()=>{


rideSection.style.display="none";

parcelSection.style.display="block";


service.value="Parcel";


selected.innerHTML="Parcel";


};







buttons.forEach(btn=>{


btn.onclick=()=>{


buttons.forEach(b=>{

b.classList.remove("active");

});



btn.classList.add("active");



service.value =
btn.dataset.service;



selected.innerHTML =
btn.dataset.service;



};


});





</script>







</body>

</html>
