<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">
🚕 RiderX Booking
</div>


<div class="container">


<select id="service">

<option value="Bike Taxi">🏍 Bike Taxi</option>

<option value="Cab">🚕 Cab</option>

<option value="Parcel">📦 Parcel</option>

<option value="Food">🍔 Food</option>

</select>



<input id="pickup" placeholder="Pickup Location" readonly>



<button onclick="getPickup()">
📍 Use Current Location
</button>



<input id="drop" placeholder="Drop Location">



<input id="coupon" placeholder="Coupon Code">



<button onclick="applyCoupon()">
🎁 Apply Coupon
</button>



<button onclick="calculateRide()">
📏 Calculate Fare
</button>



<p id="distance">
Distance: -
</p>



<p id="fare">
Fare: -
</p>



<button onclick="bookRide()">
Confirm Booking
</button>



</div>




<script type="module">


import {db} from "../firebase/config.js";

import {getFareSettings} from "../js/fare.js";

import {getCoordinates} from "../js/geocode.js";


import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let pickupLat=null;

let pickupLng=null;

let dropLat=null;

let dropLng=null;


let distance=0;

let finalFare=0;


let settings={};

let couponDiscount=0;




async function loadSettings(){

settings = await getFareSettings();

}


loadSettings();






window.getPickup=function(){


navigator.geolocation.getCurrentPosition(

(position)=>{


pickupLat=position.coords.latitude;

pickupLng=position.coords.longitude;


document.getElementById("pickup").value=

pickupLat+","+pickupLng;


}

);


}







window.applyCoupon=function(){


let code=

document.getElementById("coupon").value;



if(

code==settings.coupon

){


couponDiscount=

Number(settings.discount || 0);



alert(

"Coupon Applied 🎁 "+couponDiscount+"% OFF"

);



}

else{


couponDiscount=0;


alert("Invalid Coupon ❌");


}


}







window.calculateRide=async function(){



let result=

await getCoordinates(

document.getElementById("drop").value

);



if(!result){

alert("Drop location not found");

return;

}



dropLat=result.lat;

dropLng=result.lng;



let R=6371;


let dLat=

(dropLat-pickupLat)*Math.PI/180;


let dLng=

(dropLng-pickupLng)*Math.PI/180;



let a=

Math.sin(dLat/2)**2+

Math.cos(pickupLat*Math.PI/180)

*

Math.cos(dropLat*Math.PI/180)

*

Math.sin(dLng/2)**2;



distance=

(

R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

)

).toFixed(2);





let type=

document.getElementById("service").value;



if(type=="Bike Taxi"){


finalFare=

Number(settings.bikeBase)

+

distance*Number(settings.bikeKm);


}

else if(type=="Cab"){


finalFare=

Number(settings.cabBase)

+

distance*Number(settings.cabKm);


}

else{


finalFare=

100+(distance*10);


}





finalFare=

finalFare-

(finalFare*couponDiscount/100);





document.getElementById("distance").innerHTML=

"Distance: "+distance+" KM";



document.getElementById("fare").innerHTML=

"Fare: ₹"+Math.round(finalFare);



}







window.bookRide=async function(){



await addDoc(

collection(db,"rides"),

{


pickupLat,

pickupLng,


dropLat,

dropLng,


distance,


service:

document.getElementById("service").value,


fare:

"₹"+Math.round(finalFare),


coupon:

document.getElementById("coupon").value,


status:"Pending",


paymentStatus:"Pending",


createdAt:serverTimestamp()


}

);



alert("Ride Booked ✅");



}





</script>


</body>

</html>
