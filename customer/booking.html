<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Book Ride</title>


<link rel="icon" href="../assets/logo.png">


<!-- Leaflet Map -->

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<link rel="stylesheet" href="../css/Style.css">

<link rel="stylesheet" href="../css/Dashboard.css">

<link rel="stylesheet" href="../css/Responsive.css">

<link rel="stylesheet" href="../css/Animation.css">


</head>


<body>


<nav class="navbar">


<div class="logo">

<img src="../assets/logo.png">

<span>RiderX</span>

</div>


<div class="nav-links">

<a href="home.html">Home</a>

<a href="profile.html">Profile</a>

</div>


</nav>





<div class="dashboard-wrapper page">



<div class="booking-box">



<h1>

📍 Book Your Ride

</h1>



<br>



<!-- Service -->

<div class="ride-type">


<div class="option active" data-type="Bike Taxi">

🏍 Bike Taxi

</div>



<div class="option" data-type="Cab">

🚕 Cab

</div>



<div class="option" data-type="Parcel">

📦 Parcel

</div>



<div class="option" data-type="Food">

🍔 Food

</div>



</div>






<!-- Map -->


<div id="map" class="map-container"></div>




<br>




<div class="input-box">


<label>

Pickup Location

</label>


<input

id="pickup"

placeholder="Your current location">


</div>






<div class="input-box">


<label>

Drop Location

</label>


<input

id="drop"

placeholder="Enter destination">


</div>






<div class="card">


<h3>

Estimated Fare:

<span id="fare">

₹0

</span>


</h3>



<p>

Distance:

<span id="distance">

0 KM

</span>


</p>


</div>





<br>



<button

id="bookRide"

class="btn btn-animation">


🚀 Book Ride

</button>





<p id="message"></p>




</div>



</div>






<!-- Leaflet -->


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script type="module" src="../js/Map.js"></script>

<script type="module" src="../js/Booking.js"></script>



</body>

</html>
