<style>

/* =========================================================
   RIDERX BOOKING PAGE
========================================================= */

:root{

    --yellow:#FFD400;
    --black:#080808;
    --dark:#111;
    --card:#191919;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
    --red:#ef4444;

}


*{

    box-sizing:border-box;
    margin:0;
    padding:0;

}


html,
body{

    width:100%;
    height:100%;
    overflow:hidden;

}


body{

    background:#080808;
    color:#fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


button,
input{

    font-family:inherit;

}


.booking-page{

    width:100%;
    max-width:650px;

    height:100vh;
    height:100dvh;

    margin:auto;

    position:relative;

    overflow:hidden;

    background:#111;

}


/* =========================================================
   MAP
========================================================= */

#map{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:1;

}


.leaflet-control-attribution{

    font-size:7px !important;

}


.leaflet-control-zoom{

    margin-bottom:300px !important;

}


.leaflet-marker-icon{

    filter:drop-shadow(
        0 2px 4px rgba(0,0,0,.4)
    );

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:20;

    padding:12px;

    display:flex;

    align-items:center;

    gap:8px;

    pointer-events:none;

}


.top-btn{

    width:43px;
    height:43px;

    border:0;

    border-radius:50%;

    background:
        rgba(15,15,15,.94);

    color:#fff;

    font-size:25px;

    box-shadow:
        0 3px 14px rgba(0,0,0,.3);

    cursor:pointer;

    pointer-events:auto;

}


.top-title{

    flex:1;

    background:
        rgba(15,15,15,.94);

    border-radius:22px;

    height:43px;

    display:flex;

    align-items:center;

    padding:0 14px;

    font-size:12px;

    font-weight:900;

    box-shadow:
        0 3px 14px rgba(0,0,0,.3);

}


/* =========================================================
   LOCATION BUTTON
========================================================= */

.location-btn{

    position:absolute;

    right:13px;

    bottom:46%;

    z-index:20;

    width:45px;
    height:45px;

    border:0;

    border-radius:50%;

    background:#fff;

    color:#000;

    font-size:20px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.35);

    cursor:pointer;

}


/* =========================================================
   SHEET
========================================================= */

.booking-sheet{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:30;

    height:42%;

    min-height:330px;

    max-height:88%;

    background:#101010;

    border-radius:
        25px 25px 0 0;

    border-top:
        1px solid #292929;

    box-shadow:
        0 -8px 30px rgba(0,0,0,.45);

    display:flex;

    flex-direction:column;

    transition:
        height .28s ease;

    touch-action:none;

}


.booking-sheet.expanded{

    height:82%;

}


.sheet-handle-area{

    height:34px;

    flex:none;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:grab;

}


.sheet-handle{

    width:42px;
    height:4px;

    background:#555;

    border-radius:10px;

}


.sheet-content{

    flex:1;

    overflow-y:auto;

    padding:
        0 14px 25px;

    touch-action:pan-y;

}


.sheet-content::-webkit-scrollbar{

    width:3px;

}


.sheet-content::-webkit-scrollbar-thumb{

    background:#333;

    border-radius:10px;

}


/* =========================================================
   LOCATION
========================================================= */

.location-box{

    background:#191919;

    border:
        1px solid var(--border);

    border-radius:15px;

    overflow:visible;

}


.location-row{

    display:flex;

    align-items:center;

    min-height:54px;

    padding:8px 11px;

    position:relative;

}


.location-row + .location-row{

    border-top:
        1px solid #292929;

}


.location-marker{

    width:30px;
    min-width:30px;

    height:30px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-right:9px;

    font-size:13px;

}


.pickup-marker{

    background:
        rgba(255,212,0,.15);

    color:
        var(--yellow);

}


.drop-marker{

    background:
        rgba(255,255,255,.08);

    color:#fff;

}


.location-input-wrap{

    flex:1;

    min-width:0;

    position:relative;

}


.location-label{

    color:#666;

    font-size:7px;

    text-transform:uppercase;

    font-weight:800;

    margin-bottom:3px;

}


.location-input{

    width:100%;

    border:0;

    outline:none;

    background:transparent;

    color:#fff;

    font-size:10px;

    font-family:inherit;

    text-overflow:ellipsis;

}


.location-input::placeholder{

    color:#777;

}


.swap-btn{

    width:29px;
    height:29px;

    border:
        1px solid #333;

    border-radius:8px;

    background:#222;

    color:#aaa;

    cursor:pointer;

}


/* =========================================================
   SEARCH
========================================================= */

.search-results{

    display:none;

    position:absolute;

    left:0;
    right:0;

    top:43px;

    z-index:200;

    background:#181818;

    border:
        1px solid #303030;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 8px 25px rgba(0,0,0,.45);

}


.search-results.show{

    display:block;

}


.search-result{

    padding:11px;

    border-bottom:
        1px solid #292929;

    font-size:9px;

    line-height:1.35;

    color:#ccc;

    cursor:pointer;

}


.search-result:last-child{

    border-bottom:0;

}


.search-result:hover{

    background:#222;

}


/* =========================================================
   SECTION
========================================================= */

.section-title{

    font-size:12px;

    font-weight:900;

    margin:
        16px 0 9px;

}


/* =========================================================
   SERVICES
========================================================= */

.services{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:2px;

}


.services::-webkit-scrollbar{

    display:none;

}


.service{

    flex:1;

    min-width:82px;

    border:
        1px solid #303030;

    background:#181818;

    border-radius:14px;

    padding:
        10px 7px;

    color:#fff;

    cursor:pointer;

    text-align:center;

}


.service.active{

    background:
        var(--yellow);

    color:#000;

    border-color:
        var(--yellow);

}


.service-icon{

    font-size:21px;

    margin-bottom:5px;

}


.service-name{

    font-size:8px;

    font-weight:900;

}


.service-price{

    font-size:7px;

    margin-top:4px;

    opacity:.65;

}


/* =========================================================
   FARE
========================================================= */

.fare-card{

    margin-top:13px;

    padding:13px;

    background:#191919;

    border:

    border-radius:15px;

}


.fare-row{

    display:flex;

    align-items:center;

    margin-bottom:8px;

}


.fare-label{

    flex:1;

    color:#777;

    font-size:8px;

}


.fare-value{

    font-size:9px;

    font-weight:800;

}


.total-row{

    padding-top:9px;

    border-top:
        1px solid #2b2b2b;

}


.total-row .fare-label{

    color:#fff;

    font-size:10px;

    font-weight:900;

}


.total-row .fare-value{

    color:

    font-size:19px;

}


/* =========================================================
   PAYMENT
========================================================= */

.payment-row{

    display:flex;

    align-items:center;

    gap:8px;

    margin-top:11px;

}


.payment-option{

    flex:1;

    height:42px;

    border:

    background:#181818;

    color:#aaa;

    border-radius:11px;

    font-size:9px;

    font-weight:800;

    cursor:pointer;

}


.payment-option.active{

    background:#222;

    border-color:

    color:
        var(--yellow);

}


/* =========================================================
   BOOK BUTTON
========================================================= */

.book-btn{

    width:100%;

    height:52px;

    margin-top:13px;

    border:0;

    border-radius:14px;

    background:
        var(--yellow);

    color:#000;

    font-size:12px;

    font-weight:900;

    cursor:pointer;

}


.book-btn:disabled{

    opacity:.45;

    cursor:not-allowed;

}


/* =========================================================
   ENGINE STATUS
========================================================= */

.engine-status{

    display:flex;

    align-items:center;

    gap:6px;

    margin-top:8px;

    justify-content:center;

    font-size:7px;

    color:#666;

}


.engine-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:#777;

}


.engine-status.ready .engine-dot{

    background:
        var(--green);

}


.engine-status.error .engine-dot{

    background:
        var(--red);

}


/* =========================================================
   LOADING
========================================================= */

.loading-overlay{

    position:absolute;

    inset:0;

    z-index:100;

    background:
        rgba(0,0,0,.72);

    display:none;

    align-items:center;

    justify-content:center;

}


.loading-overlay.show{

}


.loading-box{

    width:190px;

    background:#181818;

    border:
        1px solid #333;

    border-radius:15px;

    text-align:center;

}


.spinner{

    width:28px;
    height:28px;

    border:
        3px solid #333;

    border-top-color:

    border-radius:50%;

    animation:

    margin:

}


.loading-text{

    color:#aaa;

    font-size:9px;

}


@keyframes spin{

    to{

    }

}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:absolute;

    z-index:120;

    left:50%;

    bottom:20px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:
        calc(100% - 30px);

    padding:
        11px 13px;

    border-radius:11px;

    background:#222;

    border:
        1px solid #333;

    color:#fff;

    text-align:center;

    font-size:9px;

    opacity:0;

    pointer-events:none;

    transition:.25s;

}


.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);

}


.toast.error{

    border-color:
        rgba(239,68,68,.5);

}


.toast.success{

    border-color:
        rgba(34,197,94,.5);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:390px){

    .booking-sheet{

        min-height:315px;

    }


    .service{

        min-width:76px;

    }

}

</style>

<!-- =====================================================
     RIDERX BOOKING ENGINE
     FIREBASE V10 MODULAR COMPATIBLE

<script type="module">

import {

    auth,

    db,

    realtimeDb,

    collection,

    doc,

    setDoc,

    serverTimestamp

} from "../firebase/firebase-config.js";


/* =========================================================
   BOOKING STATE
========================================================= */

const bookingState = {

    initialized:false,

    pickup:null,

    drop:null,

    service:"bike",

    payment:"cash",

    distanceKm:0,

    durationMinutes:0,

    fare:0

};


/* =========================================================
   USER
========================================================= */

function getCurrentUser(){

    return auth?.currentUser || null;

}


/* =========================================================
   RIDE ID
========================================================= */

function generateRideId(){

    return (

        "RX-" +

        Date.now().toString(36) +

        "-" +

        Math.random()
            .toString(36)
            .substring(2,8)

    ).toUpperCase();

}


/* =========================================================
   SERVICE
========================================================= */

function setService(service){

    service =
        String(service || "bike")
            .toLowerCase();


    const allowed = [

        "bike",
        "cab",
        "parcel",
        "food"

    ];


    if(
        !allowed.includes(service)
    ){

        service = "bike";

    }


    bookingState.service =
        service;


    return service;

}


/* =========================================================
   PAYMENT
========================================================= */

function setPaymentMethod(method){

    method =
        String(method || "cash")
            .toLowerCase();


    const allowed = [

        "cash",
        "online",
        "wallet",
        "upi"

    ];


    if(
        !allowed.includes(method)
    ){

        method = "cash";

    }


    bookingState.payment =
        method;


    return method;

}


/* =========================================================
   PICKUP
========================================================= */

function setPickupLocation(
    lat,
    lng,
    address=""
){

    bookingState.pickup = {

        lat:Number(lat),

        lng:Number(lng),

        address:
            address ||
            "Pickup location"

    };


    return bookingState.pickup;

}


/* =========================================================
   DROP
========================================================= */

function setDropLocation(
    lat,
    lng,
    address=""
){

    bookingState.drop = {

        lat:Number(lat),

        lng:Number(lng),

        address:
            address ||
            "Drop location"

    };


    return bookingState.drop;

}


/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
    lat1,
    lng1,
    lat2,
    lng2
){

    const R = 6371;


    const dLat =
        (
            Number(lat2) -
            Number(lat1)
        ) *
        Math.PI /
        180;


    const dLng =
        (
            Number(lng2) -
            Number(lng1)
        ) *
        Math.PI /
        180;


    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(
            Number(lat1) *
            Math.PI /
            180
        )

        *

        Math.cos(
            Number(lat2) *
            Math.PI /
            180
        )

        *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R * c;

}


/* =========================================================
   FARE
========================================================= */

function calculateFareEstimate(){

    if(
        !bookingState.pickup ||
        !bookingState.drop
    ){

        bookingState.distanceKm = 0;

        bookingState.durationMinutes = 0;

        bookingState.fare = 0;


        return {

            distanceKm:0,

            durationMinutes:0,

            fare:0

        };

    }


    const distanceKm =
        calculateDistance(

            bookingState.pickup.lat,

            bookingState.pickup.lng,

            bookingState.drop.lat,

            bookingState.drop.lng

        );


    bookingState.distanceKm =
        distanceKm;


    bookingState.durationMinutes =
        Math.max(
            5,
            Math.round(
                distanceKm * 3
            )
        );


    let baseFare = 30;

    let rate = 8;


    if(
        bookingState.service ===
        "cab"
    ){

        baseFare = 60;

        rate = 12;

    }


    if(
        bookingState.service ===
        "parcel"
    ){

        baseFare = 40;

        rate = 10;

    }


    if(
        bookingState.service ===
        "food"
    ){

        baseFare = 35;

        rate = 9;

    }


    const hour =
        new Date()
            .getHours();


    let night =
        false;


    if(
        hour >= 22 ||
        hour < 6
    ){

        night = true;

    }


    let distanceFare = 0;


    if(
        bookingState.service ===
        "bike"
    ){

        if(night){

            rate = 11;

            distanceFare =
                distanceKm * rate;

        }else if(
            distanceKm > 10
        ){

            distanceFare =

                (
                    10 * 8
                )

                +

                (
                    (distanceKm - 10) *
                    9
                );

        }else{

            rate = 8;

            distanceFare =
                distanceKm * rate;

        }

    }else{

        distanceFare =
            distanceKm * rate;

    }


    const bookingFee =
        bookingState.service ===
        "bike"
            ? 5
            : 10;


    const fare =
        Math.max(

            Math.round(

                baseFare +

                distanceFare +

                bookingFee

            ),

            baseFare

        );


    bookingState.fare =
        fare;


    return {

        distanceKm:
            Number(
                distanceKm.toFixed(2)
            ),

        durationMinutes:
            bookingState.durationMinutes,

        baseFare,

        distanceFare:
            Math.round(
                distanceFare
            ),

        bookingFee,

        fare

    };

}


/* =========================================================

async function createRideRequest(
    paymentMethod
){

    const user =
        getCurrentUser();


    if(!user){

        const error =
            new Error(
                "Please login as customer first."
            );


        error.code =
            "unauthenticated";


        throw error;

    }


    if(
        !bookingState.pickup
    ){

        throw new Error(
            "Pickup location is required."
        );

    }


    if(
        !bookingState.drop
    ){

        throw new Error(
            "Drop location is required."
        );

    }


    if(

        bookingState.pickup.lat ===
        bookingState.drop.lat

        &&

        bookingState.pickup.lng ===
        bookingState.drop.lng

    ){

        throw new Error(
            "Pickup and drop cannot be the same."
        );

    }


    setPaymentMethod(
        paymentMethod ||
        bookingState.payment
    );


    const estimate =
        calculateFareEstimate();


    if(
        estimate.distanceKm <= 0
    ){

        throw new Error(
            "Unable to calculate route distance."
        );

    }


    if(
        estimate.fare <= 0
    ){

        throw new Error(
            "Unable to calculate fare."
        );

        generateRideId();

        distanceKm:

        riderId:null,

        riderUid:null,

        riderName:null,

        riderPhone:null,


        otp:null,


        city:"Chandigarh",


        createdAt:now,

        requestedAt:now,

        updatedAt:now,


        source:"riderx-web"

    };


    /* =====================================================
       FIRESTORE
    ===================================================== */

    const rideRef =
        doc(
            db,
            "rides",
            rideId
        );


    await setDoc(
        rideRef,
        ride
    );


    /* =====================================================
       REALTIME DATABASE MIRROR
    ===================================================== */

    try{

        if(realtimeDb){

            const {

                ref,
                set

            } = await import(
                "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
            );


            await set(

                ),

    }

/* =========================================================
   SET PICKUP
========================================================= */

function setPickup(
    lat,
    lng
){

    lat =
        Number(lat);

    lng =
        Number(lng);


    pickupCoords = {

        lat,

        lng

    };


    if(pickupMarker){

        pickupMarker.setLatLng(

            [lat,lng]

        );

    }else{

        pickupMarker =

            L.marker(

                [lat,lng],

                {

                    draggable:true

                }

            ).addTo(map);


        pickupMarker.on(

            "dragend",

            function(){

                const p =
                    pickupMarker
                        .getLatLng();


                pickupCoords = {

                    lat:p.lat,

                    lng:p.lng

                };


                reverseGeocode(

                    p.lat,

                    p.lng,

                    "pickup"

                );

            }

        );

    }


    syncBookingLocations();


    reverseGeocode(

        lat,

        lng,

        "pickup"

    );


    updateBookingState();

}

   SET DROP
========================================================= */

function setDrop(
    lat,
    lng
){

        Number(lat);

    lng =

    dropCoords = {

        lat,

        lng

    };


    if(dropMarker){

        dropMarker.setLatLng(

        dropMarker.on(

/* =========================================================
   DRAW ROUTE
========================================================= */

async function drawRoute(){

    if(
        !pickupCoords ||
        !dropCoords
    ){

        if(routeLine){

            map.removeLayer(
                routeLine
            );

            routeLine = null;

        }

        return;

    }


    try{

        const url =

            "https://router.project-osrm.org/route/v1/driving/" +

            pickupCoords.lng +
            "," +
            pickupCoords.lat +

            ";" +

            dropCoords.lng +
            "," +
            dropCoords.lat +

            "?overview=full&geometries=geojson";


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "Route service unavailable."
            );

        }


        const data =
            await response.json();


        if(
            data.code !==
            "Ok" ||

            !data.routes?.length
        ){

            throw new Error(
                "No route found."
            );

        }


        const route =
            data.routes[0];


        routeDistanceKm =
            route.distance / 1000;


        routeDurationMin =
            Math.max(

                1,

                Math.round(
                    route.duration / 60
                )

            );


        if(routeLine){

            map.removeLayer(
                routeLine
            );

        }


        routeLine =
            L.geoJSON(

                route.geometry,

                {

                    style:{

                        color:"#FFD400",

                        weight:5,

                        opacity:.9

                    }

                }

            ).addTo(map);


        map.fitBounds(

            routeLine.getBounds(),

            {

                paddingTopLeft:[
                    30,
                    100
                ],

                paddingBottomRight:[
                    30,
                    330
                ]

            }

        );


        updateFareFromRoute();


    }catch(error){

        console.warn(
            "OSRM route failed:",
            error
        );


        routeDistanceKm =
            calculateDistance(

                pickupCoords.lat,

                pickupCoords.lng,

                dropCoords.lat,

                dropCoords.lng

            );


        routeDurationMin =
            Math.max(

                5,

                Math.round(
                    routeDistanceKm * 3
                )

            );


        updateFareFromRoute();

    }

}


/* =========================================================
   SYNC BOOKING LOCATIONS
========================================================= */

function syncBookingLocations(){

    const api =
        window.RiderXBookingAPI;


    if(!api){

        return false;

    }


    if(pickupCoords){

        api.setPickupLocation(

            pickupCoords.lat,

            pickupCoords.lng,

            $("pickupInput")

    }


    if(dropCoords){

        api.setDropLocation(

            dropCoords.lng,

            $("dropInput")
                .value
                .trim()

        );

    }


    return true;

}


/* =========================================================
   REVERSE GEOCODE
========================================================= */

async function reverseGeocode(
    lat,
    lng,
    type
){

    try{

        const response =

            await fetch(

                "https://nominatim.openstreetmap.org/reverse?" +

                new URLSearchParams({

                    lat,

                    lon:lng,

                    format:"json",

                    zoom:18

                }),

                {

                    headers:{

                        "Accept-Language":
                            "en"

                    }

                }

            );


        if(!response.ok){

            throw new Error(
                "Reverse geocoding failed."
            );

        }


        const data =
            await response.json();


        const address =

            data.display_name ||

            `${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}`;


        if(
            type === "pickup"
        ){

            $("pickupInput").value =
                address;

        }else{

            $("dropInput").value =
                address;

        }


        syncBookingLocations();


        if(
            pickupCoords &&
            dropCoords
        ){

            drawRoute();

        }else{

            updateFareFromRoute();

        }


    }catch(error){

        console.warn(
            "Reverse geocode:",
            error
        );


        syncBookingLocations();


        if(
            pickupCoords &&
            dropCoords
        ){

            drawRoute();

        }else{

            updateFareFromRoute();

        }

    }

                    limit:5,

                    headers:{

/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371;


    const dLat =
        (
            lat2-lat1
        ) *
        Math.PI /
        180;


    const dLon =
        (
            lon2-lon1
        ) *
        Math.PI /
        180;


    const a =

        Math.sin(dLat/2) *
        Math.sin(dLat/2)

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1-a)

        );


    return R*c;

}


/* =========================================================
   FARE UI
========================================================= */

function updateFareFromRoute(){

    if(
        !pickupCoords ||
        !dropCoords
    ){

        routeDistanceKm = 0;

        routeDurationMin = 0;


        $("distanceText").textContent =
            "-- km";


        $("baseFare").textContent =
            "₹0";


        $("distanceFare").textContent =
            "₹0";


        $("bookingFee").textContent =
            "₹0";


        $("totalFare").textContent =
            "₹0";


        return;

    }


    if(
        routeDistanceKm <= 0
    ){

        routeDistanceKm =
            calculateDistance(

                pickupCoords.lat,

                pickupCoords.lng,

                dropCoords.lat,

                dropCoords.lng

            );

    }


    routeDurationMin =
        routeDurationMin > 0

            ? routeDurationMin

            : Math.max(

                5,

                Math.round(
                    routeDistanceKm * 3
                )

            );


    $("distanceText").textContent =

        routeDistanceKm.toFixed(1) +
        " km";


    let base = 30;

    let rate = 8;


    if(
        selectedService === "cab"
    ){

        base = 60;

        rate = 12;

    }


    else if(
        selectedService === "parcel"
    ){

        base = 40;

        rate = 10;

    }


    else if(
        selectedService === "food"
    ){

        base = 35;

        rate = 9;

    }


    const hour =
        new Date()
            .getHours();


    const night =

        hour >= 22 ||
        hour < 6;


    let distanceFare = 0;


    if(
        selectedService ===
        "bike"
    ){

        if(night){

            rate = 11;

            distanceFare =
                routeDistanceKm *
                rate;

        }

        else if(
            routeDistanceKm > 10
        ){

            distanceFare =

                (
                    10 * 8
                )

                +

                (
                    (
                        routeDistanceKm -
                        10
                    ) *

                    9

                );

        }

        else{

            rate = 8;

            distanceFare =
                routeDistanceKm *
                rate;

        }

    }

    else{

        distanceFare =
            routeDistanceKm *
            rate;

    }


    const bookingFee =

        selectedService === "bike"

            ? 5

            : 10;


    const total =

        Math.max(

            Math.round(

                base +

                distanceFare +

                bookingFee

            ),

            base

        );


    $("baseFare").textContent =
        "₹" +
        Math.round(base);


    $("distanceFare").textContent =
        "₹" +
        Math.round(distanceFare);


    $("bookingFee").textContent =
        "₹" +
        bookingFee;


    $("totalFare").textContent =
        "₹" +
        total;


    syncBookingLocations();


    if(
        window.RiderXBookingAPI
    ){

        window.RiderXBookingAPI
            .setService(
                selectedService
            );


        window.RiderXBookingAPI
            .setPaymentMethod(
                selectedPayment
            );


        window.RiderXBookingAPI
            .calculateFareEstimate();

    }

}

    document

            ".service"
        )
        .forEach(

            el =>

                el.classList.remove(
                    "active"
                )

        );


    button.classList.add(
        "active"
    );


    if(
        window.RiderXBookingAPI
    ){

        window.RiderXBookingAPI
            .setService(
                selectedService
            );

    }


    updateFareFromRoute();

}


/* =========================================================
   PAYMENT
========================================================= */

function selectPayment(
    payment,
    button
){

    selectedPayment =
        String(payment)
            .toLowerCase();


    document
        .querySelectorAll(
            ".payment-option"
        )
        .forEach(

            el =>

                el.classList.remove(
                    "active"
                )

        );


    button.classList.add(
        "active"
    );


    if(
        window.RiderXBookingAPI
    ){

        window.RiderXBookingAPI
            .setPaymentMethod(
                selectedPayment
            );

    }

}


/* =========================================================
   SWAP
========================================================= */

function swapLocations(){

    const oldPickupText =
        $("pickupInput").value;


    const oldDropText =
        $("dropInput").value;


    const oldCoords =
        pickupCoords;


    pickupCoords =
        dropCoords;


    dropCoords =
        oldCoords;


    $("pickupInput").value =
        oldDropText;


    $("dropInput").value =
        oldPickupText;


    if(
        pickupMarker &&
        pickupCoords
    ){

        pickupMarker.setLatLng(

            [

                pickupCoords.lat,

                pickupCoords.lng

            ]

        );

    }


    if(
        dropMarker &&
        dropCoords
    ){

        dropMarker.setLatLng(

            [

                dropCoords.lat,

                dropCoords.lng

            ]

        );

    }


    syncBookingLocations();


    if(
        pickupCoords &&
        dropCoords
    ){

        drawRoute();

    }

}


/* =========================================================
   BOOK RIDE
========================================================= */

async function bookRide(){

    const bookButton =
        $("bookBtn");


    if(
        bookButton.disabled
    ){

        return;

    }


    if(
        !window.RiderXBookingReady
    ){

        showToast(

            "RiderX booking engine is not ready. Please wait a moment and try again.",

            "error"

        );

        return;

    }


    if(!pickupCoords){

        showToast(

            "Please select pickup location.",

            "error"

        );

        return;

    }


    if(!dropCoords){

        showToast(

            "Please select drop location.",

            "error"

        );

        return;

    }


    if(
        pickupCoords.lat ===
        dropCoords.lat &&

        pickupCoords.lng ===
        dropCoords.lng
    ){

        showToast(

            "Pickup and drop cannot be the same.",

            "error"

        );

        return;

    }


    const api =
        window.RiderXBookingAPI;


    if(!api){

        showToast(

            "Booking engine unavailable. Please reload the page.",

            "error"

        );

        return;

    }


    const user =
        api.auth?.currentUser;


    if(!user){

        showToast(

            "Please login as customer first.",

            "error"

        );


        setTimeout(

            () => {

                window.location.href =
                    "../auth/login.html?role=customer";

            },

            900

        );


        return;

    }


    syncBookingLocations();


    api.setService(
        selectedService
    );


    api.setPaymentMethod(
        selectedPayment
    );


    const estimate =
        api.calculateFareEstimate();


    if(
        !estimate ||
        !estimate.fare
    ){

        showToast(

            "Unable to calculate fare.",

            "error"

        );

        return;

    }


    setLoading(

        true,

        "Creating ride request..."

    );


    try{

        const booking =

            await api.createRideRequest(

                selectedPayment

            );


        if(!booking){

            throw new Error(
                "Ride request was not created."
            );

        }


        const rideId =

            typeof booking === "string"

                ? booking

                : (

                    booking.id ||

                    booking.rideId ||

                    booking.bookingId ||

                    ""

                );


        if(!rideId){

            throw new Error(

                "Ride was created but no ride ID was returned."

            );

        }


        localStorage.setItem(

            "riderx_active_ride_id",

            rideId

        );


        localStorage.setItem(

            "riderxPendingBooking",

            JSON.stringify({

                rideId,

                customerId:
                    user.uid,

                status:
                    "searching"

            })

        );


        setLoading(

            true,

            "Ride request sent..."

        );


        showToast(

            "Ride request sent successfully.",

            "success"

        );


        setTimeout(

            () => {

                window.location.href =

                    "searching.html?rideId=" +

                    encodeURIComponent(
                        rideId
                    );

            },

            700

        );


    }catch(error){

        console.error(

            "RiderX ride creation error:",

            error

        );


        setLoading(false);


        let message =

            error?.message ||

            "Unable to create ride.";


        if(

            error?.code ===
            "permission-denied"

        ){

            message =

                "Firestore permission denied. Check your Firebase rules.";

        }


        if(

            error?.code ===
            "unauthenticated"

        ){

            message =

                "Customer login expired. Please login again.";

        }


        showToast(

            message,

            "error"

        );

    }

}


/* =========================================================
   UPDATE BOOKING STATE
========================================================= */

function updateBookingState(){

    syncBookingLocations();


    if(
        pickupCoords &&
        dropCoords
    ){

        drawRoute();

    }

}


/* =========================================================
   LOADING
========================================================= */

function setLoading(
    show,
    text="Please wait..."
){

    $("loadingOverlay")
        .classList.toggle(
            "show",
            show
        );


    $("loadingText")
        .textContent =
        text;


    /*
     * Do not permanently disable
     * the button if loading finished.
     */

    if(!show){

        $("bookBtn").disabled =
            !window.RiderXBookingReady;

    }else{

        $("bookBtn").disabled =
            true;

    }

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type=""
){

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.className =
        "toast show " +
        type;


    clearTimeout(
        toastTimer
    );


    toastTimer =

        setTimeout(

            function(){

                toast.className =
                    "toast";

            },

            3500

        );

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

    if(
        history.length > 1
    ){

        history.back();

    }else{

        window.location.href =
            "home.html";

    }

}


/* =========================================================
   DRAGGABLE SHEET
========================================================= */

const sheet =
    $("bookingSheet");


const handle =
    $("sheetHandle");


function startSheetDrag(y){

    draggingSheet =
        true;


    sheetStartY =
        y;


    sheetStartHeight =

        sheet
            .getBoundingClientRect()
            .height;

}


function moveSheetDrag(y){

    if(!draggingSheet){

        return;

    }


    const delta =
        sheetStartY - y;


    const viewport =
        window.innerHeight;


    let newHeight =

        sheetStartHeight +
        delta;


    const minHeight =
        315;


    const maxHeight =
        viewport * .88;


    newHeight =

        Math.max(

            minHeight,

            Math.min(

                maxHeight,

                newHeight

            )

        );


    sheet.style.height =
        newHeight + "px";


    sheet.classList.remove(
        "expanded"
    );

}


function endSheetDrag(){

    if(!draggingSheet){

        return;

    }


    draggingSheet =
        false;


    const height =

        sheet
            .getBoundingClientRect()
            .height;


    const viewport =
        window.innerHeight;


    sheet.style.height =
        "";


    if(
        height >
        viewport * .58
    ){

        sheet.classList.add(
            "expanded"
        );

    }else{

        sheet.classList.remove(
            "expanded"
        );

    }

}


/* =========================================================
   TOUCH EVENTS
========================================================= */

handle.addEventListener(

    "touchstart",

    function(event){

        startSheetDrag(

            event.touches[0]
                .clientY

        );

    },

    {
        passive:true
    }

);


handle.addEventListener(

    "touchmove",

    function(event){

        moveSheetDrag(

            event.touches[0]
                .clientY

        );

    },

    {
        passive:true
    }

);


handle.addEventListener(

    "touchend",

    endSheetDrag

);


/* =========================================================
   MOUSE EVENTS
========================================================= */

handle.addEventListener(

    "mousedown",

    function(event){

        startSheetDrag(
            event.clientY
        );

    }

);


document.addEventListener(

    "mousemove",

    function(event){

        moveSheetDrag(
            event.clientY
        );

    }

);


document.addEventListener(

    "mouseup",

    endSheetDrag

);


/* =========================================================
   HANDLE CLICK
========================================================= */

handle.addEventListener(

    "click",

    function(){

        if(
            draggingSheet
        ){

            return;

        }


        sheet.classList.toggle(
            "expanded"
        );

    }

);


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function(){

        initMap();


        /*
         * Initial fare.
         */

        updateFareFromRoute();


        /*
         * Default state.
         */

        selectedService =
            "bike";


        selectedPayment =
            "cash";


        /*
         * Current location.
         */

        if(
            navigator.geolocation
        ){

            navigator.geolocation.getCurrentPosition(

                function(position){

                    setPickup(

                        position.coords.latitude,

                        position.coords.longitude

                    );


                    if(map){

                        map.setView(

                            [

                                position.coords.latitude,

                                position.coords.longitude

                            ],

                            15

                        );

                    }

                },


                function(){

                    console.log(
                        "Automatic location permission not granted."
                    );

                },


                {

                    enableHighAccuracy:true,

                    timeout:7000,

                    maximumAge:60000

                }

            );

        }

    },

    {
        once:true
    }

);


/* =========================================================
   BOOKING ENGINE READY EVENT
========================================================= */

window.addEventListener(

    "riderx-booking-ready",

    function(){

        window.RiderXBookingReady =
            true;


        const status =
            $("engineStatus");


        const statusText =
            $("engineStatusText");


        if(status){

            status.classList.add(
                "ready"
            );

        }


        if(statusText){

            statusText.textContent =
                "Booking engine ready";

        }


        if(
            pickupCoords
        ){

            syncBookingLocations();

        }


        const bookButton =
            $("bookBtn");


        if(bookButton){

            bookButton.disabled =
                false;

        }

    }

);

</script>
