<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>


<link rel="stylesheet" href="../css/style.css">


<!-- Leaflet Map CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">


<style>

body{
margin:0;
background:#000;
color:white;
font-family:Arial, sans-serif;
}


.topbar{

background:#111;
padding:15px;
text-align:center;
border-bottom:2px solid #FFD600;

}


.topbar h1{

margin:0;
font-size:28px;

}


.topbar span{

color:#FFD600;

}


.container{

padding:15px;

}


/* MAP FIX */

#map{

display:block;
width:100%;
height:350px;
min-height:350px;
border-radius:20px;
margin-bottom:15px;
background:#222;
z-index:1;

}



input,
select,
button{

width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;
box-sizing:border-box;
font-size:16px;

}


select,
input{

background:white;
color:black;

}


button{

background:#FFD600;
font-weight:bold;
cursor:pointer;

}


p{

font-size:18px;

}


.leaflet-container{

height:350px;
width:100%;
border-radius:20px;

}


</style>

</head>



<body>


<div class="topbar">

<h1>
RIDER<span>X</span>
</h1>

</div>



<div class="container">


<!-- MAP -->

<div id="map"></div>




<select id="service">

<option value="Bike Taxi">
🏍 Bike Taxi
</option>


<option value="Cab">
🚕 Cab
</option>


<option value="Parcel">
📦 Parcel
</option>


<option value="Food">
🍔 Food
</option>


</select>




<input 
id="pickup"
placeholder="Pickup Location"
readonly>



<button id="locationBtn">

📍 Use My Location

</button>



<input 
id="drop"
placeholder="Drop Location">





<p>

Distance:
<span id="distance">
-
</span>

</p>




<p>

Fare: ₹
<span id="fare">
0
</span>

</p>




<button id="bookBtn">

Confirm Booking

</button>




</div>





<!-- Leaflet JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>



<script type="module" src="../js/booking.js"></script>



</body>

</html>
