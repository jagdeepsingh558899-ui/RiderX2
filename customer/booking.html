<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">
🚕 Book Your Ride
</div>


<div class="container">


<div class="box">


<select id="service">

<option value="Bike Taxi">🏍 Bike Taxi</option>

<option value="Cab">🚕 Cab</option>

<option value="Parcel">📦 Parcel</option>

<option value="Food">🍔 Food</option>

</select>



<input 
id="pickup"
placeholder="Pickup Location">



<button onclick="getLocation()">
📍 Use Current Location
</button>



<input 
id="drop"
placeholder="Drop Location">



<input 
id="fare"
placeholder="Estimated Fare"
readonly>




<button onclick="calculateFare()">
Calculate Fare
</button>




<button onclick="bookRide()">
Confirm Booking
</button>



</div>


<a class="back" href="dashboard.html">
⬅ Back Dashboard
</a>


</div>




<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
addDoc,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





// Current Location


window.getLocation=function(){


if(navigator.geolocation){


navigator.geolocation.getCurrentPosition(

(position)=>{


let lat =
position.coords.latitude;


let lng =
position.coords.longitude;



document.getElementById("pickup").value =

"Lat: "+lat+" , Lng: "+lng;



},


()=>{

alert("Location permission denied");

}


);


}


}







window.calculateFare=function(){


let service =
document.getElementById("service").value;


let fare=0;


if(service=="Bike Taxi"){

fare=50;

}

else if(service=="Cab"){

fare=150;

}

else if(service=="Parcel"){

fare=80;

}

else{

fare=100;

}



document.getElementById("fare").value="₹"+fare;


}








window.bookRide=async function(){


let pickup =
document.getElementById("pickup").value;


let drop =
document.getElementById("drop").value;


let service =
document.getElementById("service").value;


let fare =
document.getElementById("fare").value;



if(!pickup || !drop){

alert("Pickup and Drop required");

return;

}



await addDoc(

collection(db,"rides"),

{


pickup:pickup,

drop:drop,

service:service,

fare:fare,

status:"Pending",

createdAt:serverTimestamp()


}

);



alert("Ride Requested ✅");


window.location.href="history.html";


}



</script>


</body>

</html>
