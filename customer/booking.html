<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX | Book Ride</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">



<style>

:root{

--yellow:#FFE500;
--black:#080808;
--card:#151515;
--gray:#999;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}



body{

background:var(--black);
color:white;
padding-bottom:80px;

}



/* Header */


.header{

display:flex;
align-items:center;
justify-content:space-between;
padding:20px;

}



.logo{

font-size:28px;
font-weight:800;

}


.logo span{

color:var(--yellow);

}



.back{

color:var(--yellow);
font-size:22px;

}




.container{

padding:15px;

}




.card{

background:var(--card);

border-radius:20px;

padding:20px;

margin-bottom:15px;

border:1px solid rgba(255,229,0,.2);

}





h2{

margin-bottom:15px;

}





/* Ride Type */


.ride-types{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:12px;

}



.type{

background:#222;

padding:15px;

border-radius:15px;

text-align:center;

cursor:pointer;

}



.type i{

font-size:25px;

color:var(--yellow);

margin-bottom:8px;

}



.type.active{

background:var(--yellow);

color:black;

}



.type.active i{

color:black;

}





/* Inputs */


.input-box{

margin-top:15px;

}



.input-box input{

width:100%;

padding:14px;

background:#222;

border:none;

outline:none;

border-radius:12px;

color:white;

font-size:15px;

}



.input-box input:focus{

border:1px solid var(--yellow);

}





/* Map */


#map{

height:300px;

border-radius:18px;

margin-top:15px;

z-index:1;

}





/* Fare */


.fare-box{

display:flex;

justify-content:space-between;

align-items:center;

margin-top:15px;

font-size:18px;

}



.fare{

color:var(--yellow);

font-weight:800;

}





.book-btn{

width:100%;

padding:16px;

background:var(--yellow);

color:black;

border:none;

border-radius:15px;

font-size:17px;

font-weight:700;

margin-top:20px;

cursor:pointer;

}





.bottom-nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:70px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

border-top:1px solid #222;

}



.bottom-nav a{

text-decoration:none;

color:#777;

font-size:12px;

text-align:center;

}



.bottom-nav i{

display:block;

font-size:20px;

margin-bottom:5px;

}



.active{

color:var(--yellow)!important;

}




</style>


</head>



<body>



<div class="header">


<a href="home.html" class="back">

<i class="fa-solid fa-arrow-left"></i>

</a>



<div class="logo">

RIDER<span>X</span>

</div>



<div></div>



</div>





<div class="container">



<div class="card">


<h2>
<i class="fa-solid fa-location-dot" style="color:#FFE500"></i>
Book Your Ride
</h2>




<div class="ride-types">


<div class="type active" onclick="selectRide(this,'Bike Taxi')">

<i class="fa-solid fa-motorcycle"></i>

<p>Bike Taxi</p>

</div>




<div class="type" onclick="selectRide(this,'Cab')">

<i class="fa-solid fa-car"></i>

<p>Cab</p>

</div>




<div class="type" onclick="selectRide(this,'Parcel')">

<i class="fa-solid fa-box"></i>

<p>Parcel</p>

</div>




<div class="type" onclick="selectRide(this,'Food')">

<i class="fa-solid fa-utensils"></i>

<p>Food</p>

</div>


</div>


<input type="hidden" id="rideType" value="Bike Taxi">


<div class="input-box">

<input id="pickup" placeholder="Pickup location">

</div>



<div class="input-box">

<input id="drop" placeholder="Drop location">

</div>


<div id="map"></div>
 
<div class="fare-box">

<div>
Estimated Fare
</div>

<div class="fare" id="fare">
₹0
</div>

</div>



<button class="book-btn" onclick="bookRide()">

<i class="fa-solid fa-bolt"></i>
Book Ride

</button>


</div>


</div>





<!-- Bottom Navigation -->

<div class="bottom-nav">


<a href="home.html">

<i class="fa-solid fa-house"></i>

Home

</a>



<a href="booking.html" class="active">

<i class="fa-solid fa-motorcycle"></i>

Booking

</a>



<a href="history.html">

<i class="fa-solid fa-clock"></i>

History

</a>



<a href="wallet.html">

<i class="fa-solid fa-wallet"></i>

Wallet

</a>



<a href="profile.html">

<i class="fa-solid fa-user"></i>

Profile

</a>



</div>






<!-- Leaflet JS -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>


<script src="../firebase/firebase-config.js"></script>



<script>


let selectedRide = "Bike Taxi";


let map;

let userLocation = null;




// Select Ride Type

function selectRide(element,type){


document.querySelectorAll(".type")
.forEach(item=>{

item.classList.remove("active");

});


element.classList.add("active");


selectedRide = type;


document.getElementById("rideType").value = type;


calculateFare();


}





// Map Setup

function loadMap(){


map = L.map('map')
.setView(
[30.7333,76.7794],
13
);


// Chandigarh default


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{

maxZoom:19

})
.addTo(map);



if(navigator.geolocation){


navigator.geolocation.getCurrentPosition(

(position)=>{


let lat =
position.coords.latitude;


let lng =
position.coords.longitude;



userLocation = {

lat,
lng

};



map.setView(
[lat,lng],
15
);



L.marker([lat,lng])
.addTo(map)
.bindPopup("Your Location")
.openPopup();



}


);



}


}





// Fare Calculation

function calculateFare(){


let distance = 5;


// Default 5 km


let fare = 0;



if(distance <=10){

fare = distance * 8;

}

else{

fare = (10*8)+((distance-10)*9);

}



let hour = new Date()
.getHours();



if(hour>=22 || hour<6){

fare = distance*11;

}



document.getElementById("fare")
.innerHTML =
"₹"+fare;



}





// Book Ride


async function bookRide(){



let user =
firebase.auth().currentUser;



if(!user){

alert("Please login first");

window.location.href="../auth/login.html";

return;

}



let pickup =
document.getElementById("pickup").value;



let drop =
document.getElementById("drop").value;




if(!pickup || !drop){

alert("Please enter pickup and drop location");

return;

}




try{


await firebase.firestore()
.collection("rides")
.add({

customerId:user.uid,

rideType:selectedRide,

pickup:pickup,

drop:drop,


status:"Searching Rider",


fare:
document.getElementById("fare")
.innerText,


createdAt:
firebase.firestore.FieldValue.serverTimestamp()


});



alert("Ride Booked Successfully");


window.location.href="searching.html";



}

catch(error){


alert(error.message);


}



}





window.onload=function(){

loadMap();

calculateFare();

};



</script>



</body>

</html>
