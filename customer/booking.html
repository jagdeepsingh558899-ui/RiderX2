<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>RiderX | Book Ride</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --yellow: #ffe500;
      --black: #050505;
      --panel: #111111;
      --card: #191919;
      --border: #292929;
      --muted: #999;
      --green: #22c55e;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--black);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HEADER */

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 15px;
      pointer-events: none;
    }

    .topbar > * {
      pointer-events: auto;
    }

    .back-btn,
    .location-btn {
      width: 44px;
      height: 44px;

      border: 1px solid rgba(255,255,255,.15);
      border-radius: 50%;

      background: rgba(10,10,10,.88);
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      cursor: pointer;

      backdrop-filter: blur(10px);
    }

    .back-btn {
      text-decoration: none;
    }

    .location-btn {
      color: var(--yellow);
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);

      font-size: 20px;
      font-weight: 900;
      letter-spacing: .5px;

      background: rgba(10,10,10,.88);
      padding: 9px 15px;
      border-radius: 30px;

      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
    }

    .logo span {
      color: var(--yellow);
    }

    /* MAP */

    #map {
      width: 100%;
      height: 62vh;
      min-height: 430px;
      background: #111;
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
    }

    .leaflet-control-zoom {
      margin-top: 70px !important;
    }

    .leaflet-control-zoom a {
      background: #111 !important;
      color: var(--yellow) !important;
      border-color: #333 !important;
    }

    /* MAP INSTRUCTION */

    .map-tip {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 900;

      width: calc(100% - 40px);
      max-width: 400px;

      text-align: center;

      padding: 10px 15px;

      border-radius: 25px;

      background: rgba(0,0,0,.82);
      border: 1px solid rgba(255,229,0,.25);

      color: #ddd;
      font-size: 12px;

      backdrop-filter: blur(10px);
    }

    .map-tip i {
      color: var(--yellow);
      margin-right: 5px;
    }

    /* BOOKING PANEL */

    .booking-panel {
      position: relative;
      z-index: 20;

      margin-top: -25px;

      background: var(--panel);

      border-radius: 26px 26px 0 0;

      padding: 20px 16px 30px;

      box-shadow: 0 -10px 35px rgba(0,0,0,.45);
    }

    .drag-line {
      width: 45px;
      height: 4px;
      background: #444;
      border-radius: 10px;
      margin: -8px auto 18px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .title-row h2 {
      font-size: 19px;
    }

    .city-badge {
      font-size: 11px;
      color: var(--yellow);

      border: 1px solid rgba(255,229,0,.25);
      background: rgba(255,229,0,.08);

      padding: 6px 9px;
      border-radius: 20px;
    }

    /* SERVICES */

    .service-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 8px;

      margin-bottom: 16px;
    }

    .service-card {
      background: #1d1d1d;
      border: 1px solid #2c2c2c;

      border-radius: 15px;

      padding: 12px 5px;

      text-align: center;

      cursor: pointer;

      transition: .2s;
    }

    .service-card i {
      display: block;

      color: #aaa;
      font-size: 21px;

      margin-bottom: 7px;
    }

    .service-card span {
      font-size: 11px;
      color: #bbb;
    }

    .service-card.active {
      background: rgba(255,229,0,.12);
      border-color: var(--yellow);
    }

    .service-card.active i,
    .service-card.active span {
      color: var(--yellow);
    }

    /* LOCATION BOX */

    .location-box {
      background: #191919;
      border: 1px solid #292929;
      border-radius: 17px;

      overflow: hidden;

      margin-bottom: 15px;
    }

    .location-row {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 13px;
    }

    .location-row + .location-row {
      border-top: 1px solid #292929;
    }

    .dot {
      width: 11px;
      height: 11px;

      border-radius: 50%;

      flex-shrink: 0;
    }

    .pickup-dot {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(34,197,94,.12);
    }

    .drop-dot {
      background: var(--red);
      box-shadow: 0 0 0 4px rgba(239,68,68,.12);
    }

    .location-content {
      flex: 1;
      min-width: 0;
    }

    .location-label {
      color: #888;
      font-size: 10px;
      margin-bottom: 3px;
    }

    .location-input {
      width: 100%;

      border: 0;
      outline: 0;

      background: transparent;
      color: white;

      font-size: 14px;
    }

    .location-input::placeholder {
      color: #666;
    }

    .locate-small {
      background: #222;
      color: var(--yellow);

      border: 0;
      width: 34px;
      height: 34px;

      border-radius: 50%;

      cursor: pointer;
    }

    /* FARE */

    .fare-card {
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #191919;
      border: 1px solid #292929;

      border-radius: 17px;

      padding: 14px;

      margin-bottom: 14px;
    }

    .fare-left small {
      display: block;
      color: #888;
      font-size: 10px;
      margin-bottom: 4px;
    }

    .fare-left strong {
      font-size: 20px;
      color: var(--yellow);
    }

    .fare-right {
      text-align: right;
      font-size: 11px;
      color: #999;
    }

    /* BOOK BUTTON */

    .book-btn {
      width: 100%;

      padding: 16px;

      border: 0;
      border-radius: 16px;

      background: var(--yellow);
      color: #000;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      box-shadow: 0 8px 25px rgba(255,229,0,.15);
    }

    .book-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    /* LOADING */

    .loading-overlay {
      position: fixed;
      inset: 0;

      z-index: 9999;

      background: rgba(0,0,0,.78);

      display: none;

      align-items: center;
      justify-content: center;
    }

    .loading-box {
      width: 85%;
      max-width: 320px;

      background: #171717;

      border: 1px solid #333;

      border-radius: 20px;

      padding: 25px;

      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;

      border: 4px solid #333;
      border-top-color: var(--yellow);

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* TOAST */

    .toast {
      position: fixed;

      left: 15px;
      right: 15px;
      bottom: 20px;

      z-index: 10000;

      background: #202020;

      border: 1px solid #333;
      border-left: 4px solid var(--yellow);

      border-radius: 13px;

      padding: 13px 15px;

      font-size: 13px;

      display: none;
    }

    /* RESPONSIVE */

    @media (min-width: 768px) {

      #map {
        height: 58vh;
      }

      .booking-panel {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }

    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <div class="topbar">

    <a href="home.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="logo">
      RIDER<span>X</span>
    </div>

    <button class="location-btn" onclick="useCurrentLocation()">
      <i class="fa-solid fa-location-crosshairs"></i>
    </button>

  </div>

  <!-- MAP -->

  <div id="map"></div>

  <div class="map-tip">
    <i class="fa-solid fa-hand-pointer"></i>
    Map par tap karke pickup location select karein
  </div>

  <!-- BOOKING PANEL -->

  <section class="booking-panel">

    <div class="drag-line"></div>

    <div class="title-row">

      <h2>Where to?</h2>

      <span class="city-badge">
        <i class="fa-solid fa-location-dot"></i>
        Chandigarh
      </span>

    </div>

    <!-- SERVICES -->

    <div class="service-grid">

      <div class="service-card active"
           data-service="bike"
           onclick="selectService('bike',this)">

        <i class="fa-solid fa-motorcycle"></i>
        <span>Bike Taxi</span>

      </div>

      <div class="service-card"
           data-service="cab"
           onclick="selectService('cab',this)">

        <i class="fa-solid fa-car"></i>
        <span>Cab</span>

      </div>

      <div class="service-card"
           data-service="parcel"
           onclick="selectService('parcel',this)">

        <i class="fa-solid fa-box"></i>
        <span>Parcel</span>

      </div>

      <div class="service-card"
           data-service="food"
           onclick="selectService('food',this)">

        <i class="fa-solid fa-utensils"></i>
        <span>Food</span>

      </div>

    </div>

    <!-- PICKUP / DROP -->

    <div class="location-box">

      <div class="location-row">

        <div class="dot pickup-dot"></div>

        <div class="location-content">

          <div class="location-label">
            PICKUP
          </div>

          <input
            id="pickup"
            class="location-input"
            placeholder="Choose pickup location"
            autocomplete="off"
          >

        </div>

        <button
          class="locate-small"
          onclick="useCurrentLocation()"
          title="Current location">

          <i class="fa-solid fa-location-crosshairs"></i>

        </button>

      </div>


      <div class="location-row">

        <div class="dot drop-dot"></div>

        <div class="location-content">

          <div class="location-label">
            DROP-OFF
          </div>

          <input
            id="drop"
            class="location-input"
            placeholder="Choose destination"
            autocomplete="off"
          >

        </div>

      </div>

    </div>

    <!-- FARE -->

    <div class="fare-card">

      <div class="fare-left">

        <small>ESTIMATED FARE</small>

        <strong id="fareAmount">₹0</strong>

      </div>

      <div class="fare-right">

        <div id="distanceText">
          Select locations
        </div>

        <div id="serviceText">
          Bike Taxi
        </div>

      </div>

    </div>

    <!-- BOOK -->

    <button
      id="bookButton"
      class="book-btn"
      onclick="requestRide()">

      <i class="fa-solid fa-bolt"></i>
      Book Ride

    </button>

  </section>


  <!-- LOADING -->

  <div class="loading-overlay" id="loadingOverlay">

    <div class="loading-box">

      <div class="spinner"></div>

      <h3>Finding nearby riders</h3>

      <p style="color:#888;font-size:12px;margin-top:8px;">
        Please wait while RiderX searches for the nearest rider.
      </p>

    </div>

  </div>


  <div class="toast" id="toast"></div>


  <!-- LEAFLET -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


  <!-- FIREBASE -->

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script src="../firebase/firebase-config.js"></script>


  <script>

    /*
      RiderX Booking System

      IMPORTANT:
      This file uses the existing firebase-config.js.
      It supports either:
        firebase.auth()
        firebase.firestore()

      or projects where auth/db are exposed globally.
    */


    let map = null;

    let pickupMarker = null;

    let dropMarker = null;

    let routeLine = null;

    let selectedService = "bike";

    let pickupCoords = null;

    let dropCoords = null;

    let currentDistance = 0;


    /* Chandigarh default */

    const CHANDIGARH = [
      30.7333,
      76.7794
    ];


    /*
      Initialize map
    */

    document.addEventListener("DOMContentLoaded", () => {

      initializeMap();

      setupInputs();

    });


    function initializeMap() {

      map = L.map("map", {
        zoomControl: true
      }).setView(CHANDIGARH, 13);


      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors"
        }
      ).addTo(map);


      /*
        Map click:
        First click = pickup
        Second click = drop
      */

      map.on("click", async function(e) {

        const coords = [
          e.latlng.lat,
          e.latlng.lng
        ];


        if (!pickupCoords) {

          await setPickup(
            coords,
            "Selected pickup location"
          );

          showToast(
            "Pickup selected. Now tap the map to select drop location."
          );

          return;
        }


        if (!dropCoords) {

          await setDrop(
            coords,
            "Selected destination"
          );

          return;
        }


        /*
          If both already exist,
          next click changes drop.
        */

        await setDrop(
          coords,
          "Selected destination"
        );

      });


      /*
        Try user's current location automatically
      */

      setTimeout(() => {

        useCurrentLocation(false);

      }, 500);

    }


    /*
      Current location
    */

    function useCurrentLocation(showMessage = true) {

      if (!navigator.geolocation) {

        showToast(
          "Your browser does not support GPS location."
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        async position => {

          const coords = [
            position.coords.latitude,
            position.coords.longitude
          ];


          await setPickup(
            coords,
            "Your current location"
          );


          map.setView(coords, 16);


          if (showMessage) {

            showToast(
              "Current location selected as pickup."
            );

          }

        },

        error => {

          console.error(error);

          showToast(
            "Location permission allow karein."
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }

      );

    }


    /*
      Pickup marker
    */

    async function setPickup(coords, address) {

      pickupCoords = coords;


      if (pickupMarker) {

        map.removeLayer(pickupMarker);

      }


      pickupMarker = L.marker(coords, {

        draggable: true

      })
      .addTo(map)
      .bindPopup("Pickup")
      .openPopup();


      pickupMarker.on("dragend", function(e) {

        const p = e.target.getLatLng();

        pickupCoords = [
          p.lat,
          p.lng
        ];

        reverseGeocodePickup();

        updateRouteAndFare();

      });


      document.getElementById("pickup").value =
        address || "Pickup location";


      reverseGeocodePickup();

      updateRouteAndFare();

    }


    /*
      Drop marker
    */

    async function setDrop(coords, address) {

      dropCoords = coords;


      if (dropMarker) {

        map.removeLayer(dropMarker);

      }


      dropMarker = L.marker(coords, {

        draggable: true

      })
      .addTo(map)
      .bindPopup("Drop");


      dropMarker.on("dragend", function(e) {

        const p = e.target.getLatLng();

        dropCoords = [
          p.lat,
          p.lng
        ];

        reverseGeocodeDrop();

        updateRouteAndFare();

      });


      document.getElementById("drop").value =
        address || "Destination";


      reverseGeocodeDrop();

      updateRouteAndFare();


      if (pickupCoords) {

        fitMapToRoute();

      }

    }


    /*
      Reverse geocoding
      OpenStreetMap Nominatim
    */

    async function reverseGeocodePickup() {

      if (!pickupCoords) return;


      try {

        const url =
          "https://nominatim.openstreetmap.org/reverse" +
          "?format=json" +
          "&lat=" + encodeURIComponent(pickupCoords[0]) +
          "&lon=" + encodeURIComponent(pickupCoords[1]) +
          "&zoom=18" +
          "&addressdetails=1";


        const response =
          await fetch(url, {
            headers: {
              "Accept": "application/json"
            }
          });


        if (!response.ok) return;


        const data = await response.json();


        if (data.display_name) {

          document.getElementById("pickup").value =
            data.display_name;

        }

      } catch (error) {

        console.warn(
          "Pickup reverse geocoding failed",
          error
        );

      }

    }


    async function reverseGeocodeDrop() {

      if (!dropCoords) return;


      try {

        const url =
          "https://nominatim.openstreetmap.org/reverse" +
          "?format=json" +
          "&lat=" + encodeURIComponent(dropCoords[0]) +
          "&lon=" + encodeURIComponent(dropCoords[1]) +
          "&zoom=18" +
          "&addressdetails=1";


        const response =
          await fetch(url, {
            headers: {
              "Accept": "application/json"
            }
          });


        if (!response.ok) return;


        const data = await response.json();


        if (data.display_name) {

          document.getElementById("drop").value =
            data.display_name;

        }

      } catch (error) {

        console.warn(
          "Drop reverse geocoding failed",
          error
        );

      }

    }


    /*
      Distance using Haversine
    */

    function calculateDistance(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371;

      const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

      const dLon =
        (lon2 - lon1) *
        Math.PI / 180;


      const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );


      return R * c;

    }


    /*
      Fare calculation
    */

    function calculateFare(distanceKm) {

      if (!distanceKm || distanceKm <= 0) {

        return 0;

      }


      let baseFare = 0;

      let perKm = 8;


      /*
        RiderX pricing:
        6 AM - 10 PM
        first 10 km = ₹8/km
        above 10 km = ₹9/km

        10 PM - 6 AM
        ₹11/km
      */

      const hour =
        new Date().getHours();


      if (hour >= 22 || hour < 6) {

        perKm = 11;

        baseFare =
          distanceKm * perKm;

      } else {

        if (distanceKm <= 10) {

          baseFare =
            distanceKm * 8;

        } else {

          baseFare =
            (10 * 8) +
            ((distanceKm - 10) * 9);

        }

      }


      /*
        Service multiplier
      */

      if (selectedService === "cab") {

        baseFare *= 1.5;

      }

      else if (selectedService === "parcel") {

        baseFare *= 1.25;

      }

      else if (selectedService === "food") {

        baseFare *= 1.20;

      }


      /*
        Minimum fare
      */

      const minimumFare = {

        bike: 30,

        cab: 70,

        parcel: 50,

        food: 40

      };


      baseFare =
        Math.max(
          baseFare,
          minimumFare[selectedService] || 30
        );


      return Math.round(baseFare);

    }


    /*
      Update route and fare
    */

    async function updateRouteAndFare() {

      if (!pickupCoords || !dropCoords) {

        document.getElementById("fareAmount")
          .textContent = "₹0";

        document.getElementById("distanceText")
          .textContent = "Select locations";

        return;

      }


      currentDistance =
        calculateDistance(
          pickupCoords[0],
          pickupCoords[1],
          dropCoords[0],
          dropCoords[1]
        );


      const fare =
        calculateFare(currentDistance);


      document.getElementById("fareAmount")
        .textContent =
        "₹" + fare;


      document.getElementById("distanceText")
        .textContent =
        currentDistance.toFixed(1) + " km";


      document.getElementById("serviceText")
        .textContent =
        getServiceName();


      drawRoute();

    }


    function getServiceName() {

      const names = {

        bike: "Bike Taxi",

        cab: "Cab",

        parcel: "Parcel",

        food: "Food"

      };


      return names[selectedService] ||
        "Bike Taxi";

    }


    /*
      Draw approximate route
      using OSRM
    */

    async function drawRoute() {

      if (!pickupCoords || !dropCoords) return;


      try {

        const url =
          "https://router.project-osrm.org/route/v1/driving/" +

          pickupCoords[1] +
          "," +
          pickupCoords[0] +
          ";" +

          dropCoords[1] +
          "," +
          dropCoords[0] +

          "?overview=full&geometries=geojson";


        const response =
          await fetch(url);


        if (!response.ok) return;


        const data =
          await response.json();


        if (
          !data.routes ||
          !data.routes.length
        ) return;


        const geometry =
          data.routes[0].geometry;


        if (routeLine) {

          map.removeLayer(routeLine);

        }


        routeLine =
          L.geoJSON(
            geometry,
            {
              style: {
                color: "#FFE500",
                weight: 5,
                opacity: .9
              }
            }
          ).addTo(map);


        /*
          Use road distance instead of
          straight-line distance
        */

        const roadDistance =
          data.routes[0].distance / 1000;


        currentDistance =
          roadDistance;


        const fare =
          calculateFare(
            currentDistance
          );


        document.getElementById("fareAmount")
          .textContent =
          "₹" + fare;


        document.getElementById("distanceText")
          .textContent =
          roadDistance.toFixed(1) +
          " km";


        fitMapToRoute();


      } catch (error) {

        console.warn(
          "Route service unavailable",
          error
        );

      }

    }


    /*
      Fit pickup/drop/route
    */

    function fitMapToRoute() {

      if (!pickupCoords || !dropCoords) return;


      const bounds =
        L.latLngBounds([
          pickupCoords,
          dropCoords
        ]);


      if (routeLine) {

        try {

          bounds.extend(
            routeLine.getBounds()
          );

        } catch (e) {}

      }


      map.fitBounds(
        bounds,
        {
          padding: [40, 40],
          maxZoom: 16
        }
      );

    }


    /*
      Service selection
    */

    function selectService(
      service,
      element
    ) {

      selectedService =
        service;


      document.querySelectorAll(
        ".service-card"
      ).forEach(card => {

        card.classList.remove(
          "active"
        );

      });


      element.classList.add(
        "active"
      );


      document.getElementById(
        "serviceText"
      ).textContent =
        getServiceName();


      updateRouteAndFare();

    }
