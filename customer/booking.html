<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">

🚕 RiderX Booking

</div>


<div class="container">


<select id="service">

<option value="Bike Taxi">
🏍 Bike Taxi
</option>

<option value="Cab">
🚕 Cab
</option>

<option value="Parcel">
📦 Parcel
</option>

<option value="Food">
🍔 Food
</option>

</select>



<input id="pickup" placeholder="Pickup" readonly>


<button onclick="getPickup()">

📍 Current Location

</button>



<input id="drop" placeholder="Drop Location">



<button onclick="calculateRide()">

Calculate Fare

</button>



<p id="distance">

Distance:-

</p>


<p id="price">

Fare:-

</p>



<button onclick="bookRide()">

Confirm Ride

</button>


</div>




<script type="module">


import {db} from "../firebase/config.js";


import {getFareSettings} from "../js/fare.js";


import {getCoordinates} from "../js/geocode.js";


import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let pickupLat;

let pickupLng;

let dropLat;

let dropLng;

let distance=0;

let finalFare=0;

let settings;




async function loadFare(){


settings=await getFareSettings();


}



loadFare();







window.getPickup=function(){


navigator.geolocation.getCurrentPosition(

(pos)=>{


pickupLat=pos.coords.latitude;

pickupLng=pos.coords.longitude;


pickup.value=

pickupLat+","+pickupLng;



}

);


}








window.calculateRide=async function(){



let dropAddress=

drop.value;



let result=

await getCoordinates(dropAddress);



if(!result){

alert("Location not found");

return;

}



dropLat=result.lat;

dropLng=result.lng;



let R=6371;



let dLat=

(dropLat-pickupLat)*Math.PI/180;



let dLng=

(dropLng-pickupLng)*Math.PI/180;



let a=

Math.sin(dLat/2)**2+

Math.cos(pickupLat*Math.PI/180)

*

Math.cos(dropLat*Math.PI/180)

*

Math.sin(dLng/2)**2;



distance=

(

R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

)

).toFixed(2);





let type=

service.value;



if(type=="Bike Taxi"){


finalFare=

Number(settings.bikeBase)

+

(distance*Number(settings.bikeKm));


}


else if(type=="Cab"){


finalFare=

Number(settings.cabBase)

+

(distance*Number(settings.cabKm));


}

else{


finalFare=100+(distance*10);


}





let discount=

Number(settings.offer || 0);



finalFare=

finalFare-

(finalFare*discount/100);






document.getElementById("distance").innerHTML=

"Distance: "+distance+" KM";



document.getElementById("price").innerHTML=

"Fare: ₹"+Math.round(finalFare);



}







window.bookRide=async function(){



await addDoc(

collection(db,"rides"),

{


pickupLat,

pickupLng,


dropLat,

dropLng,


distance,


service:service.value,


fare:"₹"+Math.round(finalFare),


status:"Pending",


paymentStatus:"Pending",


createdAt:serverTimestamp()



}

);



alert("Ride Booked ✅");


}



</script>


</body>

</html>
