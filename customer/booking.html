<!DOCTYPE html>
<html lang="en">
<head>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RiderX - Book a Ride</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Dashboard.css">
<link rel="stylesheet" href="../css/Responsive.css">

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

:root{
    --yellow:#FFD400;
    --black:#080808;
    --dark:#111;
    --card:#191919;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.booking-page{
    width:100%;
    max-width:650px;
    height:100vh;
    height:100dvh;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:#111;
}

/* MAP */

#map{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

.leaflet-control-attribution{
    font-size:7px !important;
}

/* TOP BAR */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;
    padding:12px;
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:none;
}

.top-btn{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:rgba(15,15,15,.94);
    color:#fff;
    font-size:21px;
    box-shadow:0 3px 14px rgba(0,0,0,.3);
    cursor:pointer;
    pointer-events:auto;
}

.top-title{
    flex:1;
    background:rgba(15,15,15,.94);
    border-radius:22px;
    height:43px;
    display:flex;
    align-items:center;
    padding:0 14px;
    font-size:12px;
    font-weight:900;
    box-shadow:0 3px 14px rgba(0,0,0,.3);
}

/* LOCATION BUTTON */

.location-btn{
    position:absolute;
    right:13px;
    bottom:46%;
    z-index:20;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#000;
    font-size:19px;
    box-shadow:0 3px 15px rgba(0,0,0,.35);
    cursor:pointer;
}

/* SHEET */

.booking-sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    height:42%;
    min-height:330px;
    max-height:88%;
    background:#101010;
    border-radius:25px 25px 0 0;
    border-top:1px solid #292929;
    box-shadow:0 -8px 30px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    transition:height .28s ease;
    touch-action:none;
}

.booking-sheet.expanded{
    height:82%;
}

.sheet-handle-area{
    height:34px;
    flex:none;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:grab;
}

.sheet-handle{
    width:42px;
    height:4px;
    background:#555;
    border-radius:10px;
}

.sheet-content{
    flex:1;
    overflow-y:auto;
    padding:0 14px 20px;
    touch-action:pan-y;
}

.sheet-content::-webkit-scrollbar{
    width:3px;
}

.sheet-content::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:10px;
}

/* LOCATION */

.location-box{
    background:#191919;
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
}

.location-row{
    display:flex;
    align-items:center;
    min-height:54px;
    padding:8px 11px;
}

.location-row + .location-row{
    border-top:1px solid #292929;
}

.location-marker{
    width:30px;
    min-width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:9px;
    font-size:13px;
}

.pickup-marker{
    background:rgba(255,212,0,.15);
    color:var(--yellow);
}

.drop-marker{
    background:rgba(255,255,255,.08);
    color:#fff;
}

.location-input-wrap{
    flex:1;
    min-width:0;
}

.location-label{
    color:#666;
    font-size:7px;
    text-transform:uppercase;
    font-weight:800;
    margin-bottom:3px;
}

.location-input{
    width:100%;
    border:0;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:10px;
    font-family:inherit;
    text-overflow:ellipsis;
}

.location-input::placeholder{
    color:#777;
}

.swap-btn{
    width:29px;
    height:29px;
    border:1px solid #333;
    border-radius:8px;
    background:#222;
    color:#aaa;
    cursor:pointer;
}

/* SERVICE */

.section-title{
    font-size:12px;
    font-weight:900;
    margin:16px 0 9px;
}

.services{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
}

.services::-webkit-scrollbar{
    display:none;
}

.service{
    flex:1;
    min-width:82px;
    border:1px solid #303030;
    background:#181818;
    border-radius:14px;
    padding:10px 7px;
    color:#fff;
    cursor:pointer;
    text-align:center;
}

.service.active{
    background:var(--yellow);
    color:#000;
    border-color:var(--yellow);
}

.service-icon{
    font-size:21px;
    margin-bottom:5px;
}

.service-name{
    font-size:8px;
    font-weight:900;
}

.service-price{
    font-size:7px;
    margin-top:4px;
    opacity:.65;
}

/* FARE */

.fare-card{
    margin-top:13px;
    padding:13px;
    background:#191919;
    border:1px solid var(--border);
    border-radius:15px;
}

.fare-row{
    display:flex;
    align-items:center;
    margin-bottom:8px;
}

.fare-label{
    flex:1;
    color:#777;
    font-size:8px;
}

.fare-value{
    font-size:9px;
    font-weight:800;
}

.total-row{
    padding-top:9px;
    border-top:1px solid #2b2b2b;
}

.total-row .fare-label{
    color:#fff;
    font-size:10px;
    font-weight:900;
}

.total-row .fare-value{
    color:var(--yellow);
    font-size:19px;
}

/* PAYMENT */

.payment-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:11px;
}

.payment-option{
    flex:1;
    height:42px;
    border:1px solid #303030;
    background:#181818;
    color:#aaa;
    border-radius:11px;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
}

.payment-option.active{
    background:#222;
    border-color:var(--yellow);
    color:var(--yellow);
}

/* BOOK BUTTON */

.book-btn{
    width:100%;
    height:52px;
    margin-top:13px;
    border:0;
    border-radius:14px;
    background:var(--yellow);
    color:#000;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.book-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* SEARCH */

.search-results{
    display:none;
    margin-top:6px;
    background:#181818;
    border:1px solid #303030;
    border-radius:12px;
    overflow:hidden;
}

.search-results.show{
    display:block;
}

.search-result{
    padding:10px;
    border-bottom:1px solid #292929;
    font-size:9px;
    color:#ccc;
    cursor:pointer;
}

.search-result:last-child{
    border-bottom:0;
}

.search-result:hover{
    background:#222;
}

/* LOADING */

.loading-overlay{
    position:absolute;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
}

.loading-overlay.show{
    display:flex;
}

.loading-box{
    width:150px;
    padding:20px;
    background:#181818;
    border:1px solid #333;
    border-radius:15px;
    text-align:center;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #333;
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 10px;
}

.loading-text{
    color:#aaa;
    font-size:9px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* TOAST */

.toast{
    position:absolute;
    z-index:120;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    width:calc(100% - 30px);
    padding:11px 13px;
    border-radius:11px;
    background:#222;
    border:1px solid #333;
    color:#fff;
    text-align:center;
    font-size:9px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.error{
    border-color:rgba(239,68,68,.5);
}

.toast.success{
    border-color:rgba(34,197,94,.5);
}

@media(max-width:390px){

    .booking-sheet{
        min-height:315px;
    }

    .service{
        min-width:76px;
    }

}

</style>
</head>

<body>

<div class="booking-page">

    <div id="map"></div>

    <!-- TOP -->

    <div class="topbar">

        <button
            class="top-btn"
            onclick="goBack()"
        >
            ‹
        </button>

        <div class="top-title">
            Book a Ride
        </div>

    </div>


    <!-- LOCATION -->

    <button
        class="location-btn"
        onclick="useCurrentLocation()"
        title="My location"
    >
        ◎
    </button>


    <!-- BOOKING SHEET -->

    <section
        class="booking-sheet"
        id="bookingSheet"
    >

        <div
            class="sheet-handle-area"
            id="sheetHandle"
        >
            <div class="sheet-handle"></div>
        </div>


        <div class="sheet-content">

            <!-- LOCATIONS -->

            <div class="location-box">

                <div class="location-row">

                    <div class="location-marker pickup-marker">
                        ●
                    </div>

                    <div class="location-input-wrap">

                        <div class="location-label">
                            Pickup
                        </div>

                        <input
                            id="pickupInput"
                            class="location-input"
                            type="text"
                            placeholder="Where should we pick you up?"
                            autocomplete="off"
                        >

                        <div
                            id="pickupResults"
                            class="search-results"
                        ></div>

                    </div>

                    <button
                        class="swap-btn"
                        onclick="swapLocations()"
                        title="Swap"
                    >
                        ⇅
                    </button>

                </div>


                <div class="location-row">

                    <div class="location-marker drop-marker">
                        ●
                    </div>

                    <div class="location-input-wrap">

                        <div class="location-label">
                            Drop
                        </div>

                        <input
                            id="dropInput"
                            class="location-input"
                            type="text"
                            placeholder="Where are you going?"
                            autocomplete="off"
                        >

                        <div
                            id="dropResults"
                            class="search-results"
                        ></div>

                    </div>

                </div>

            </div>


            <!-- SERVICES -->

            <div class="section-title">
                Choose your ride
            </div>

            <div class="services">

                <button
                    class="service active"
                    data-service="bike"
                    onclick="selectService('bike',this)"
                >

                    <div class="service-icon">
                        🏍️
                    </div>

                    <div class="service-name">
                        Bike Taxi
                    </div>

                    <div class="service-price">
                        From ₹8/km
                    </div>

                </button>


                <button
                    class="service"
                    data-service="cab"
                    onclick="selectService('cab',this)"
                >

                    <div class="service-icon">
                        🚕
                    </div>

                    <div class="service-name">
                        Cab
                    </div>

                    <div class="service-price">
                        From ₹12/km
                    </div>

                </button>


                <button
                    class="service"
                    data-service="parcel"
                    onclick="selectService('parcel',this)"
                >

                    <div class="service-icon">
                        📦
                    </div>

                    <div class="service-name">
                        Parcel
                    </div>

                    <div class="service-price">
                        From ₹10/km
                    </div>

                </button>


                <button
                    class="service"
                    data-service="food"
                    onclick="selectService('food',this)"
                >

                    <div class="service-icon">
                        🍔
                    </div>

                    <div class="service-name">
                        Food
                    </div>

                    <div class="service-price">
                        Delivery
                    </div>

                </button>

            </div>


            <!-- FARE -->

            <div class="fare-card">

                <div class="fare-row">

                    <div class="fare-label">
                        Distance
                    </div>

                    <div
                        class="fare-value"
                        id="distanceText"
                    >
                        -- km
                    </div>

                </div>


                <div class="fare-row">

                    <div class="fare-label">
                        Base fare
                    </div>

                    <div
                        class="fare-value"
                        id="baseFare"
                    >
                        ₹0
                    </div>

                </div>


                <div class="fare-row">

                    <div class="fare-label">
                        Distance fare
                    </div>

                    <div
                        class="fare-value"
                        id="distanceFare"
                    >
                        ₹0
                    </div>

                </div>


                <div class="fare-row">

                    <div class="fare-label">
                        Booking fee
                    </div>

                    <div
                        class="fare-value"
                        id="bookingFee"
                    >
                        ₹0
                    </div>

                </div>


                <div class="fare-row total-row">

                    <div class="fare-label">
                        Estimated fare
                    </div>

                    <div
                        class="fare-value"
                        id="totalFare"
                    >
                        ₹0
                    </div>

                </div>

            </div>


            <!-- PAYMENT -->

            <div class="section-title">
                Payment method
            </div>

            <div class="payment-row">

                <button
                    class="payment-option active"
                    data-payment="cash"
                    onclick="selectPayment('cash',this)"
                >
                    💵 Cash
                </button>

                <button
                    class="payment-option"
                    data-payment="online"
                    onclick="selectPayment('online',this)"
                >
                    💳 Online
                </button>

                <button
                    class="payment-option"
                    data-payment="wallet"
                    onclick="selectPayment('wallet',this)"

            <!-- BOOK -->

                class="book-btn"
                id="bookBtn"
                onclick="bookRide()"

                Confirm & Book Ride
            </button>

        </div>

    </section>


    <!-- LOADING -->

    <div
        class="loading-overlay"
        id="loadingOverlay"
    >

        <div class="loading-box">

            <div class="spinner"></div>

            <div
                class="loading-text"
                id="loadingText"
            >
                Booking your ride...
            </div>

        </div>

    </div>


    <div
        class="toast"
        id="toast"
    ></div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==========================================
   RIDERX CUSTOMER BOOKING
========================================== */

const $ = id =>
    document.getElementById(id);

let map = null;

let pickupMarker = null;
let dropMarker = null;

let pickupCoords = null;
let dropCoords = null;

let selectedService = "bike";
let selectedPayment = "cash";

let routeDistanceKm = 0;
let routeDurationMin = 0;

let pickupSearchTimer = null;
let dropSearchTimer = null;

let toastTimer = null;

let sheetStartY = 0;
let sheetStartHeight = 0;
let draggingSheet = false;


/* ==========================================
   MAP
========================================== */

function initMap(){

    const defaultCenter = [
        30.7333,
        76.7794
    ];

    map = L.map(
        "map",
        {
            zoomControl:false,
            attributionControl:true
        }
    ).setView(
        defaultCenter,
        13
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);


    L.control.zoom({
        position:"bottomleft"
    }).addTo(map);


    map.on(
        "click",
        function(event){

            if(
                !pickupCoords
            ){

                setPickup(
                    event.latlng.lat,
                    event.latlng.lng
                );

            }else if(
                !dropCoords
            ){

                setDrop(
                    event.latlng.lat,
                    event.latlng.lng
                );

            }

        }
    );

}


/* ==========================================
   CURRENT LOCATION
========================================== */

function useCurrentLocation(){

    if(!navigator.geolocation){

        showToast(
            "Location is not supported on this device.",
            "error"
        );

        return;

    }


    showToast(
        "Finding your location..."
    );


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            setPickup(
                lat,
                lng
            );


            map.setView(
                [lat,lng],
                16
            );


            reverseGeocode(
                lat,
                lng,
                "pickup"
            );

        },

        error => {

            console.error(
                error
            );

            showToast(
                "Unable to get your location.",
                "error"
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:30000
        }

    );

}


/* ==========================================
   SET PICKUP
========================================== */

function setPickup(
    lat,
    lng
){

    pickupCoords = {
        lat:lat,
        lng:lng
    };


    if(pickupMarker){

        pickupMarker.setLatLng(
            [lat,lng]
        );

    }else{

        pickupMarker =
            L.marker(
                [lat,lng],
                {
                    draggable:true
                }
            ).addTo(map);


        pickupMarker.on(
            "dragend",
            function(){

                const p =
                    pickupMarker.getLatLng();

                pickupCoords = {
                    lat:p.lat,
                    lng:p.lng
                };

                reverseGeocode(
                    p.lat,
                    p.lng,
                    "pickup"
                );

                calculateFare();

            }
        );

    }


    reverseGeocode(
        lat,
        lng,
        "pickup"
    );

}


/* ==========================================
   SET DROP
========================================== */

function setDrop(
    lat,
    lng
){

    dropCoords = {
        lat:lat,
        lng:lng
    };


    if(dropMarker){

        dropMarker.setLatLng(
            [lat,lng]
        );

    }else{

        dropMarker =
            L.marker(
                [lat,lng],
                {
                    draggable:true
                }
            ).addTo(map);


        dropMarker.on(
            "dragend",
            function(){

                const p =
                    dropMarker.getLatLng();

                dropCoords = {
                    lat:p.lat,
                    lng:p.lng
                };

                reverseGeocode(
                    p.lat,
                    p.lng,
                    "drop"
                );

                calculateFare();

            }
        );

    }


    reverseGeocode(
        lat,
        lng,
        "drop"
    );


    calculateFare();

}


/* ==========================================
   REVERSE GEOCODE
========================================== */

async function reverseGeocode(
    lat,
    lng,
    type
){

    try{

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/reverse?" +
                new URLSearchParams({
                    lat:lat,
                    lon:lng,
                    format:"json",
                    zoom:18
                }),
                {
                    headers:{
                        "Accept-Language":"en"
                    }
                }
            );


        const data =
            await response.json();


        const address =
            data.display_name ||
            `${lat.toFixed(5)}, ${lng.toFixed(5)}`;


        if(type === "pickup"){

            $("pickupInput").value =
                address;

        }else{

            $("dropInput").value =
                address;

        }


        calculateFare();

    }catch(error){

        console.error(
            "Reverse geocode:",
            error
        );

    }

}


/* ==========================================
   SEARCH LOCATION
========================================== */

async function searchLocation(
    query,
    type
){

    if(
        !query ||
        query.trim().length < 3
    ){

        hideSearchResults(type);

        return;

    }


    try{

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({
                    q:query + ", Chandigarh",
                    format:"json",
                    limit:5
                }),
                {
                    headers:{
                        "Accept-Language":"en"
                    }
                }
            );


        const results =
            await response.json();


        showSearchResults(
            results,
            type
        );

    }catch(error){

        console.error(
            "Location search:",
            error
        );

    }

}


/* ==========================================
   SEARCH RESULTS
========================================== */

function showSearchResults(
    results,
    type
){

    const container =
        type === "pickup"
            ? $("pickupResults")
            : $("dropResults");


    if(!results.length){

        hideSearchResults(type);

        return;

    }


    container.innerHTML =
        "";


    results.forEach(
        result => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "search-result";

            item.textContent =
                result.display_name;


            item.onclick =
                function(){

                    const lat =
                        Number(
                            result.lat
                        );

                    const lon =
                        Number(
                            result.lon
                        );


                    if(type === "pickup"){

                        setPickup(
                            lat,
                            lon
                        );

                    }else{

                        setDrop(
                            lat,
                            lon
                        );

                    }


                    container.classList.remove(
                        "show"
                    );


                    map.setView(
                        [lat,lon],
                        15
                    );

                };


            container.appendChild(
                item
            );

        }
    );


    container.classList.add(
        "show"
    );

}


function hideSearchResults(
    type
){

    const container =
        type === "pickup"

/* ==========================================

========================================== */

function swapLocations(){

    const oldPickup =
        $("pickupInput").value;

    const oldDrop =
        $("dropInput").value;


    $("pickupInput").value =
        oldDrop;

    $("dropInput").value =
        oldPickup;


    const oldCoords =
        pickupCoords;

    pickupCoords =
        dropCoords;

    dropCoords =
        oldCoords;


    if(
        pickupMarker &&
        dropMarker
    ){

        pickupMarker.setLatLng([
            pickupCoords.lat,
            pickupCoords.lng
        ]);

        dropMarker.setLatLng([
            dropCoords.lat,
            dropCoords.lng
        ]);

    }


    calculateFare();

}

/* ==========================================
   DISTANCE
========================================== */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371;


    const dLat =
        (lat2-lat1) *
        Math.PI /
        180;


    const dLon =
        (lon2-lon1) *
        Math.PI /
        180;


    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(
            lat1 *
            Math.PI /
            180
        ) *

        Math.cos(
            lat2 *
            Math.PI /
            180
        ) *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;

}


/* ==========================================
   FARE
========================================== */

function calculateFare(){

    if(
        !pickupCoords ||
        !dropCoords
    ){

        routeDistanceKm =
            0;

        $("distanceText").textContent =
            "-- km";

        $("baseFare").textContent =
            "₹0";

        $("distanceFare").textContent =
            "₹0";

        $("bookingFee").textContent =
            "₹0";

        $("totalFare").textContent =
            "₹0";

        return;

    }


    routeDistanceKm =
        calculateDistance(
            pickupCoords.lat,
            pickupCoords.lng,
            dropCoords.lat,
            dropCoords.lng
        );


    routeDurationMin =
        Math.max(
            5,
            Math.round(
                routeDistanceKm * 3
            )
        );


    $("distanceText").textContent =
        routeDistanceKm.toFixed(1) +
        " km";


    let rate =
        8;


    let base =
        20;


    if(
        selectedService ===
        "cab"
    ){

        rate =
            12;

        base =
            40;

    }else if(
        selectedService ===
        "parcel"
    ){

        rate =
            10;

        base =
            25;

    }else if(
        selectedService ===
        "food"
    ){

        rate =
            10;

        base =
            20;

    }


    /*
       RiderX pricing:
       Day:
       Up to 10 km = ₹8/km
       Above 10 km = ₹9/km

       Night:
       10 PM - 6 AM = ₹11/km
    */

    const hour =
        new Date().getHours();


    if(
        selectedService ===
        "bike"
    ){

        if(
            hour >= 22 ||
            hour < 6
        ){

            rate =
                11;

        }else if(
            routeDistanceKm > 10
        ){

            rate =
                9;

        }else{

            rate =
                8;

        }

    }


    const distanceFare =
        routeDistanceKm *
        rate;


    const bookingFee =
        selectedService ===
        "bike"
            ? 5
            : 10;


    const total =
        Math.max(
            base +
            distanceFare +
            bookingFee,
            base
        );


    $("baseFare").textContent =
        "₹" +
        Math.round(base);


    $("distanceFare").textContent =
        "₹" +
        Math.round(
            distanceFare
        );


    $("bookingFee").textContent =
        "₹" +
        bookingFee;


    $("totalFare").textContent =
        "₹" +
        Math.round(total);

}


/* ==========================================
   GET TOTAL
========================================== */

function getEstimatedFare(){

    const text =
        $("totalFare")
        .textContent
        .replace(
            /[^0-9.]/g,
            ""
        );


    return Number(text) || 0;

}


/* ==========================================
   BOOK RIDE
========================================== */

async function bookRide(){

    if(!pickupCoords){

        showToast(
            "Please select pickup location.",
            "error"
        );

        return;

    }


    if(!dropCoords){

        showToast(
            "Please select drop location.",
            "error"
        );

        return;

    }


    if(
        routeDistanceKm <= 0
    ){

        showToast(
            "Unable to calculate route distance.",
            "error"
        );

        return;

    }


    const rideData = {

        serviceType:
            selectedService,

        pickup:{
            lat:
                pickupCoords.lat,

            lng:
                pickupCoords.lng,

            address:
                $("pickupInput").value.trim()
        },

        drop:{
            lat:
                dropCoords.lat,

            lng:
                dropCoords.lng,

            address:
                $("dropInput").value.trim()
        },

        distance:
            Number(
                routeDistanceKm.toFixed(2)
            ),

        duration:
            routeDurationMin,

        fare:
            getEstimatedFare(),

        paymentMethod:
            selectedPayment,

        status:
            "searching",

        createdAt:
            new Date().toISOString()

    };


    setLoading(
        true,
        "Finding nearby riders..."
    );


    try{

        let result = null;


        /*
          Existing Booking.js/Firebase
          functions are preferred.
        */

        if(
            typeof window.createRideBooking ===
            "function"
        ){

            result =
                await window.createRideBooking(
                    rideData
                );

        }else if(
            typeof window.bookRide ===
            "function" &&
            window.bookRide !== bookRide
        ){

            result =
                await window.bookRide(
                    rideData
                );

        }else if(
            typeof window.createBooking ===
            "function"
        ){

            result =
                await window.createBooking(
                    rideData
                );

        }else{

            document.dispatchEvent(
                new CustomEvent(
                    "riderxCreateBooking",
                    {
                        detail:rideData
                    }
                )
            );


            /*
              Fallback local state.
              This keeps the page usable
              until Booking.js handles it.
            */

            localStorage.setItem(
                "riderxPendingBooking",
                JSON.stringify(
                    rideData
                )
            );

            result = {
                id:
                    "local-" +
                    Date.now()
            };

        }


        if(result === false){

            throw new Error(
                "Booking failed."
            );

        }


        const rideId =
            result?.rideId ||
            result?.id ||
            result?.bookingId ||
            "";


        setLoading(
            true,
            "Ride request sent..."
        );


        setTimeout(
            function(){

                let url =
                    "searching.html";


                if(rideId){

                    url +=
                        "?rideId=" +
                        encodeURIComponent(
                            rideId
                        );

                }


                window.location.href =
                    url;

            },
            350
        );


    }catch(error){

        console.error(
            "Booking error:",
            error
        );


        setLoading(
            false
        );


        showToast(
            error.message ||
            "Unable to book ride.",
            "error"
        );

    }

}

/* ==========================================
   DRAGGABLE SHEET
========================================== */

const sheet =
    $("bookingSheet");

const handle =
    $("sheetHandle");


function startSheetDrag(
    y
){

    draggingSheet =
        true;

    sheetStartY =
        y;

    sheetStartHeight =
        sheet.getBoundingClientRect()
            .height;

}


function moveSheetDrag(
    y
){

    if(!draggingSheet)
        return;


    const delta =
        sheetStartY - y;


    const viewport =
        window.innerHeight;


    let newHeight =
        sheetStartHeight +
        delta;


    const minHeight =
        315;


    const maxHeight =
        viewport *
        .88;


    newHeight =
        Math.max(
            minHeight,
            Math.min(
                maxHeight,
                newHeight
            )
        );


    sheet.style.height =
        newHeight +
        "px";


    sheet.classList.remove(
        "expanded"
    );

}


function endSheetDrag(){

    if(!draggingSheet)
        return;


    draggingSheet =
        false;


    const height =
        sheet.getBoundingClientRect()
            .height;


    const viewport =
        window.innerHeight;


    sheet.style.height =
        "";


    if(
        height >
        viewport * .58
    ){

        sheet.classList.add(
            "expanded"
        );

    }else{

        sheet.classList.remove(
            "expanded"
        );

    }

}


handle.addEventListener(
    "touchstart",
    function(event){

        startSheetDrag(
            event.touches[0].clientY
        );

    },
    {
        passive:true
    }
);


handle.addEventListener(
    "touchmove",
    function(event){

        moveSheetDrag(
            event.touches[0].clientY
        );

    },
    {
        passive:true
    }
);


handle.addEventListener(
    "touchend",
    endSheetDrag
);


handle.addEventListener(
    "mousedown",
    function(event){

        startSheetDrag(
            event.clientY
        );

    }
);


document.addEventListener(
    "mousemove",
    function(event){

        moveSheetDrag(
            event.clientY
        );

    }
);


document.addEventListener(
    "mouseup",
    endSheetDrag
);


/* ==========================================
   SHEET TAP
========================================== */

handle.addEventListener(
    "click",
    function(){

        sheet.classList.toggle(
            "expanded"
        );

    }
);

document.addEventListener(

    function(){

        initMap();

        calculateFare();

        /*
          Automatically request location
          when browser permits it.
        */

        if(
            navigator.geolocation
        ){

            navigator.geolocation.getCurrentPosition(
                function(position){

                    setPickup(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    map.setView(
                        [
                            position.coords.latitude,
                            position.coords.longitude
                        ],
                        15
                    );

                },
                function(){

                    /*
                      Permission denied:
                      user can still select location
                      manually from map/search.
                    */

                },
                {
                    enableHighAccuracy:true,
                    timeout:5000,
                    maximumAge:60000
                }
            );

        }

    }
);
