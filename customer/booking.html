<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Booking</title>


<link rel="manifest" href="../manifest.json">


<meta name="theme-color" content="#FFD600">


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


</head>


<body>


<div class="topbar">


<h2 id="pageTitle">

🏍 Book Ride

</h2>


</div>







<div class="container">








<div class="map-container">

<div id="map"></div>

</div>









<div class="card">


<h3>

Select Service

</h3>




<div id="rideServices">


<button class="btn serviceBtn" data-service="Bike">

🏍 Bike

</button>


<button class="btn serviceBtn" data-service="Taxi">

🚕 Taxi

</button>


<button class="btn serviceBtn" data-service="Cab">

🚗 Cab

</button>


</div>








<div id="deliveryServices" style="display:none;">


<button class="btn serviceBtn" data-service="Parcel">

📦 Parcel

</button>


<button class="btn serviceBtn" data-service="Food">

🍔 Food

</button>


</div>



</div>









<div class="card">


<input

id="pickup"

class="input"

placeholder="Pickup Location"

readonly

>




<button id="locationBtn" class="btn">

📍 Use My Location

</button>




<input

id="drop"

class="input"

placeholder="Drop Location"

>




</div>









<div class="card">


<h3>

Payment

</h3>


<select id="paymentMethod" class="input">


<option value="Cash">

💵 Cash

</option>



<option value="Online">

💳 Online

</option>


</select>



</div>









<div class="booking-card">


<h3>

Fare

</h3>


<div class="booking-price">

₹<span id="fare">0</span>

</div>



<div class="booking-row">

<span>

Distance

</span>


<b id="distance">

-

</b>


</div>


</div>









<button id="bookBtn" class="btn">

Confirm Booking

</button>







</div>









<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/booking.js"></script>





<script>


const params =
new URLSearchParams(location.search);



let service =
params.get("service");



if(service==="Parcel" || service==="Food"){


document.getElementById(
"pageTitle"
).innerHTML="📦 Book Delivery";


document.getElementById(
"rideServices"
).style.display="none";


document.getElementById(
"deliveryServices"
).style.display="block";


}


</script>



</body>

</html>
