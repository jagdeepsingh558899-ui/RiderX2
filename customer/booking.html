<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>RiderX | Book Ride</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

:root{
    --yellow:#ffe500;
    --black:#050505;
    --card:#111;
    --card2:#181818;
    --border:#303030;
    --green:#22c55e;
    --red:#ff4d4d;
    --muted:#999;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,Arial,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
}

body{
    position:relative;
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.leaflet-control-zoom{
    margin-top:80px!important;
}

.leaflet-control-zoom a{
    background:#111!important;
    color:var(--yellow)!important;
    border-color:#333!important;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:14px;
}

.topbar-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.icon-btn{
    width:44px;
    height:44px;
    border:1px solid #333;
    border-radius:50%;
    background:#111;
    color:#fff;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.icon-btn:active{
    transform:scale(.95);
}

.logo{
    background:#111;
    border:1px solid #333;
    padding:8px 17px;
    border-radius:15px;
    font-size:18px;
    font-weight:800;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.logo span{
    color:var(--yellow);
}

/* =========================================================
   STATUS
========================================================= */

.status{
    position:absolute;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    z-index:900;

    min-width:170px;
    max-width:85%;

    background:#111;
    border:1px solid #333;
    padding:8px 15px;
    border-radius:30px;

    text-align:center;
    font-size:11px;
    color:#ddd;

    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

/* =========================================================
   CENTER PICKUP PIN
========================================================= */

.center-marker{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-100%);
    z-index:500;
    pointer-events:none;
}

.pin{
    width:45px;
    height:45px;

    background:var(--yellow);
    color:#000;

    border-radius:50% 50% 50% 0;

    transform:rotate(-45deg);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 5px 25px rgba(255,229,0,.35);
}

.pin i{
    transform:rotate(45deg);
}

/* =========================================================
   BOOKING SHEET
========================================================= */

.booking-sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    z-index:1000;

    background:rgba(9,9,9,.97);

    border-radius:27px 27px 0 0;

    padding:13px 15px 18px;

    max-height:62vh;
    overflow-y:auto;

    border-top:1px solid #292929;

    box-shadow:0 -10px 40px rgba(0,0,0,.55);
}

.handle{
    width:45px;
    height:5px;
    background:#555;
    border-radius:20px;
    margin:0 auto 14px;
}

.title{
    font-size:18px;
    font-weight:800;
    margin-bottom:13px;
}

.subtitle{
    color:#777;
    font-size:11px;
    margin-top:-8px;
    margin-bottom:13px;
}

/* =========================================================
   LOCATION
========================================================= */

.location-box{
    background:#151515;
    border:1px solid #292929;
    border-radius:16px;
    overflow:hidden;
}

.location-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
}

.location-row + .location-row{
    border-top:1px solid #292929;
}

.location-dot{
    width:26px;
    height:26px;
    min-width:26px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
}

.pick-dot{
    background:#12351f;
    color:var(--green);
}

.drop-dot{
    background:#3b3500;
    color:var(--yellow);
}

.location-input{
    flex:1;

    min-width:0;

    background:transparent;
    border:0;
    outline:0;

    color:#fff;

    font-size:12px;
}

.location-input::placeholder{
    color:#777;
}

.location-action{
    width:34px;
    height:34px;

    border:0;
    border-radius:50%;

    background:#222;
    color:var(--yellow);

    cursor:pointer;
}

/* =========================================================
   SEARCH RESULTS
========================================================= */

.search-results{
    display:none;

    background:#111;
    border:1px solid #333;
    border-radius:12px;

    margin-top:6px;

    max-height:160px;
    overflow-y:auto;

    position:relative;
    z-index:2000;
}

.search-item{
    padding:10px;
    font-size:11px;
    color:#ddd;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.search-item:last-child{
    border-bottom:0;
}

.search-item:hover{
    background:#1d1d1d;
}

/* =========================================================
   SERVICES
========================================================= */

.services{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:14px;
}

.service{
    background:#171717;
    border:1px solid #333;
    border-radius:14px;

    padding:11px 4px;

    text-align:center;

    color:#aaa;

    cursor:pointer;

    transition:.15s;
}

.service i{
    font-size:18px;
    margin-bottom:4px;
}

.service span{
    display:block;
    font-size:10px;
}

.service.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#000;
}

/* =========================================================
   FARE
========================================================= */

.estimate{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:13px;
}

.info-card{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    padding:11px;
}

.info-label{
    color:#777;
    font-size:10px;
}

.info-value{
    margin-top:3px;
    font-size:14px;
    font-weight:700;
}

.fare-card{
    margin-top:8px;

    background:#151515;
    border:1px solid #292929;
    border-radius:15px;

    padding:13px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.fare-label{
    font-size:12px;
    color:#aaa;
}

.price{
    font-size:23px;
    font-weight:800;
    color:var(--yellow);
}

/* =========================================================
   PAYMENT
========================================================= */

.payment{
    margin-top:10px;

    display:flex;
    gap:8px;
}

.payment-option{
    flex:1;

    padding:11px 5px;

    background:#151515;
    border:1px solid #333;

    border-radius:13px;

    color:#aaa;

    text-align:center;

    font-size:10px;

    cursor:pointer;
}

.payment-option i{
    display:block;
    font-size:17px;
    margin-bottom:3px;
}

.payment-option.active{
    border-color:var(--yellow);
    background:#211f00;
    color:var(--yellow);
}

/* =========================================================
   BOOK BUTTON
========================================================= */

.book-btn{
    width:100%;

    margin-top:13px;

    padding:15px;

    border:0;
    border-radius:15px;

    background:var(--yellow);
    color:#000;

    font-size:16px;
    font-weight:800;

    cursor:pointer;
}

.book-btn:disabled{
    background:#444;
    color:#888;
    cursor:not-allowed;
}

.book-btn.loading{
    opacity:.7;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:translate(-50%,120px);

    z-index:5000;

    background:#111;

    border:1px solid #333;

    padding:12px 18px;

    border-radius:13px;

    font-size:12px;

    box-shadow:0 10px 35px rgba(0,0,0,.55);

    transition:.3s;

    text-align:center;
}

.toast.show{
    transform:translate(-50%,0);
}

.toast.success{
    border-color:#1f9d55;
}

.toast.error{
    border-color:#a33;
}

/* =========================================================
   SEARCHING OVERLAY
========================================================= */

.searching-overlay{
    display:none;

    position:fixed;
    inset:0;

    z-index:4500;

    background:rgba(0,0,0,.75);

    align-items:center;
    justify-content:center;
}

.searching-box{
    width:calc(100% - 40px);
    max-width:360px;

    background:#111;

    border:1px solid #333;

    border-radius:22px;

    padding:28px 20px;

    text-align:center;
}

.loader{
    width:45px;
    height:45px;

    border:4px solid #333;
    border-top-color:var(--yellow);

    border-radius:50%;

    animation:spin 1s linear infinite;

    margin:0 auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.searching-title{
    font-size:17px;
    font-weight:800;
}

.searching-text{
    margin-top:6px;
    color:#888;
    font-size:11px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

    .booking-sheet{
        max-height:66vh;
    }

    .service{
        padding:9px 2px;
    }

    .service i{
        font-size:16px;
    }

}

</style>

</head>

<body>

        </div>

            class="icon-btn"
            id="myLocation"

            <i class="fa-solid fa-location-crosshairs"></i>

<!-- ======================================================

    id="toast"
    class="toast">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module">

/* =========================================================
   RIDERX BOOKING — CLEAN FINAL CONTROLLER
========================================================= */

import {

    auth,
    db

} from "../firebase/firebase-config.js";


import {

    collection,
    addDoc,
    doc,
    getDoc,
    onSnapshot,
    Timestamp

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


import {

    onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


/* =========================================================
   ELEMENTS
========================================================= */

const mapElement =
    document.getElementById("map");

const statusElement =
    document.getElementById("status");

const centerMarker =
    document.getElementById("centerMarker");

const pickupInput =
    document.getElementById("pickupInput");

const dropInput =
    document.getElementById("dropInput");

const pickupResults =
    document.getElementById("pickupResults");

const dropResults =
    document.getElementById("dropResults");

const pickupMapBtn =
    document.getElementById("pickupMapBtn");

const dropMapBtn =
    document.getElementById("dropMapBtn");

const myLocationBtn =
    document.getElementById("myLocation");

const bookRideBtn =
    document.getElementById("bookRideBtn");

const distanceDisplay =
    document.getElementById("distanceDisplay");

const durationDisplay =
    document.getElementById("durationDisplay");

const fareDisplay =
    document.getElementById("fareDisplay");

const searchingOverlay =
    document.getElementById("searchingOverlay");

const searchingText =
    document.getElementById("searchingText");

const toast =
    document.getElementById("toast");


/* =========================================================
   STATE
========================================================= */

let map = null;

let currentUser = null;

let pickupCoords = null;

let dropCoords = null;

let pickupMarker = null;

let dropMarker = null;

let routeLayer = null;

let selectingMode = null;

let selectedService = "bike";

let selectedPayment = "cash";

let distanceKm = 0;

let durationMin = 0;

let estimatedFare = 0;

let fareSettings = null;

let rideListener = null;

let currentRideId = null;


/* =========================================================
   DEFAULT FARE
========================================================= */

const DEFAULT_FARES = {

    bike: {
        baseFare: 30,
        dayRate: 8,
        extraRate: 9,
        nightRate: 11
    },

    cab: {
        baseFare: 60,
        dayRate: 12,
        extraRate: 14,
        nightRate: 16
    },

    parcel: {
        baseFare: 40,
        dayRate: 9,
        extraRate: 10,
        nightRate: 12
    },

    food: {
        baseFare: 30,
        dayRate: 8,
        extraRate: 9,
        nightRate: 11
    }

};


/* =========================================================
   TOAST
========================================================= */

function showToast(
    text,
    type = ""
){

    toast.textContent = text;

    toast.className =
        "toast show " + type;


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2800
    );

}


/* =========================================================
   MAP INIT
========================================================= */

function initMap(){

    map =
        L.map(
            mapElement,
            {
                zoomControl:true
            }
        );


    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom:19,

            attribution:
                "&copy; OpenStreetMap contributors"

        }

    ).addTo(map);


    map.setView(
        [30.7333, 76.7794],
        13
    );


    map.on(
        "moveend",
        handleMapMove
    );


    statusElement.textContent =
        "Getting your location...";


    setTimeout(
        () => {

            useCurrentLocation();

        },
        500
    );

}


/* =========================================================
   CURRENT LOCATION
========================================================= */

function useCurrentLocation(){

    if(
        !navigator.geolocation
    ){

        showToast(
            "Location is not supported on this device.",
            "error"
        );

        return;

    }


    statusElement.textContent =
        "Getting your location...";


    navigator.geolocation.getCurrentPosition(

        async position => {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            map.setView(
                [lat,lng],
                16
            );


            setPickupFromCoords(
                lat,
                lng,
                "Current location"
            );


            try{

                const address =
                    await reverseGeocode(
                        lat,
                        lng
                    );


                pickupInput.value =
                    address ||
                    "Current location";


                if(pickupCoords){

                    pickupCoords.address =
                        pickupInput.value;

                }

            }catch(error){

                console.warn(
                    "Reverse geocode failed",
                    error
                );

            }


            statusElement.textContent =
                "Pickup location selected";

        },

        error => {

            console.error(
                error
            );


            statusElement.textContent =
                "Select pickup location";


            showToast(
                "Location permission allow karein.",
                "error"
            );

        },

        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:10000

        }

    );

}


/* =========================================================
   MAP CENTER SELECTION
========================================================= */

function handleMapMove(){

    if(!selectingMode){
        return;
    }


    const center =
        map.getCenter();


    if(
        selectingMode === "pickup"
    ){

        setPickupFromCoords(
            center.lat,
            center.lng,
            pickupInput.value ||
            "Selected pickup"
        );

    }


    if(
        selectingMode === "drop"
    ){

        setDropFromCoords(
            center.lat,
            center.lng,
            dropInput.value ||
            "Selected destination"
        );

    }


    updateRouteAndFare();

}


/* =========================================================
   PICKUP
========================================================= */

function setPickupFromCoords(
    lat,
    lng,
    address
){

    pickupCoords = {

        lat:Number(lat),

        lng:Number(lng),

        address:
            String(address || "")

    };


    if(pickupMarker){

        map.removeLayer(
            pickupMarker
        );

    }


    pickupMarker =
        L.marker(
            [lat,lng]
        )
        .addTo(map)
        .bindPopup(
            "Pickup"
        );


    selectingMode = null;

}


/* =========================================================
   DROP
========================================================= */

function setDropFromCoords(
    lat,
    lng,
    address
){

    dropCoords = {

        lat:Number(lat),

        lng:Number(lng),

        address:
            String(address || "")

    };


    if(dropMarker){

        map.removeLayer(
            dropMarker
        );

    }


    dropMarker =
        L.marker(
            [lat,lng]
        )
        .addTo(map)
        .bindPopup(
            "Destination"
        );


    selectingMode = null;

}


/* =========================================================
   MAP BUTTONS
========================================================= */

pickupMapBtn.addEventListener(
    "click",
    () => {

        selectingMode =
            "pickup";


        centerMarker.style.display =
            "block";


        statusElement.textContent =
            "Move map to choose pickup";


        showToast(
            "Map ko move karke pickup select karein."
        );

    }
);


dropMapBtn.addEventListener(
    "click",
    () => {

        selectingMode =
            "drop";


        centerMarker.style.display =
            "block";


        statusElement.textContent =
            "Move map to choose destination";


        showToast(
            "Map ko move karke destination select karein."
        );

    }
);


myLocationBtn.addEventListener(
    "click",
    useCurrentLocation
);


/* =========================================================
   SERVICE
========================================================= */

document
.querySelectorAll(".service")
.forEach(
    card => {

        card.addEventListener(

/* =========================================================
   HAVERSINE DISTANCE
========================================================= */

function calculateDistance(
    lat1,
    lng1,
    lat2,
    lng2
){

    const R = 6371;


    const dLat =
        (lat2-lat1)
        *
        Math.PI /
        180;


    const dLng =
        (lng2-lng1)
        *
        Math.PI /
        180;


    const a =

        Math.sin(dLat/2)
        *
        Math.sin(dLat/2)

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(dLng/2)
        *
        Math.sin(dLng/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;

}


/* =========================================================
   REAL ROUTE — OSRM
========================================================= */

async function getRealRoute(){

    if(
        !pickupCoords ||
        !dropCoords
    ){

        return null;

    }


    const url =

        "https://router.project-osrm.org/route/v1/driving/"
        +

        pickupCoords.lng +
        "," +
        pickupCoords.lat +

        ";" +

        dropCoords.lng +
        "," +
        dropCoords.lat +

        "?overview=full&geometries=geojson";


    const response =
        await fetch(url);


    if(!response.ok){

        throw new Error(
            "Route service unavailable"
        );

    }


    const data =
        await response.json();


    if(
        !data.routes ||
        !data.routes.length
    ){

        return null;

    }


    const route =
        data.routes[0];


    return {

        distance:
            route.distance / 1000,

        duration:
            route.duration / 60,

        geometry:
            route.geometry

    };

}


/* =========================================================
   ROUTE + FARE
========================================================= */

async function updateRouteAndFare(){

    if(
        !pickupCoords ||
        !dropCoords
    ){

        distanceKm = 0;

        durationMin = 0;

        estimatedFare = 0;

        updateUI();

        return;

    }


    try{

        const route =
            await getRealRoute();


        if(route){

            distanceKm =
                Number(
                    route.distance.toFixed(2)
                );


            durationMin =
                Math.max(
                    1,
                    Math.round(
                        route.duration
                    )
                );


            if(routeLayer){

                map.removeLayer(
                    routeLayer
                );

            }


            routeLayer =
                L.geoJSON(
                    route.geometry,
                    {

                        style:{
                            color:"#ffe500",
                            weight:5,
                            opacity:.9
                        }

                    }
                )
                .addTo(map);


        }else{

            distanceKm =
                calculateDistance(

                    pickupCoords.lat,
                    pickupCoords.lng,

                    dropCoords.lat,
                    dropCoords.lng

                );


            durationMin =
                Math.max(
                    1,
                    Math.round(
                        distanceKm * 3
                    )
                );

        }


    }catch(error){

        console.warn(
            "OSRM failed:",
            error
        );


        distanceKm =
            calculateDistance(

                pickupCoords.lat,
                pickupCoords.lng,

                dropCoords.lat,
                dropCoords.lng

            );


        durationMin =
            Math.max(
                1,
                Math.round(
                    distanceKm * 3
                )
            );

    }


    calculateFare();

}

/* =========================================================
   GET FARE
========================================================= */

function getFareForService(){

    const adminFare =
        fareSettings &&
        fareSettings[selectedService];


    if(adminFare){

        return {

            baseFare:
                Number(
                    adminFare.baseFare ??
                    30
                ),

            dayRate:
                Number(
                    adminFare.dayRate ??
                    8
                ),

            extraRate:
                Number(
                    adminFare.extraRate ??
                    9
                ),

            nightRate:
                Number(
                    adminFare.nightRate ??
                    11
                )

        };

    }


    return (
        DEFAULT_FARES[
            selectedService
        ]
        ||
        DEFAULT_FARES.bike
    );

}


/* =========================================================
   CALCULATE FARE
========================================================= */

function calculateFare(){

    if(
        !pickupCoords ||
        !dropCoords ||
        distanceKm <= 0
    ){

        estimatedFare = 0;

        updateUI();

        return;

    }


    const fare =
        getFareForService();


    const hour =
        new Date().getHours();


    let perKm;


    if(
        hour >= 22 ||
        hour < 6
    ){

        perKm =
            fare.nightRate;

    }else{

        perKm =
            fare.dayRate;

    }


    let total =
        fare.baseFare;


    if(
        distanceKm <= 10
    ){

        total +=
            distanceKm *
            perKm;

    }else{

        total +=
            10 *
            perKm;


        total +=
            (
                distanceKm - 10
            )
            *
            fare.extraRate;

    }


    estimatedFare =
        Math.max(
            50,
            Math.round(total)
        );


    updateUI();

}


/* =========================================================
   UI
========================================================= */

function updateUI(){

    distanceDisplay.textContent =
        distanceKm > 0
        ? distanceKm.toFixed(1) + " km"
        : "0 km";


    durationDisplay.textContent =
        durationMin > 0
        ? durationMin + " min"
        : "0 min";


    fareDisplay.textContent =
        "₹" +
        estimatedFare;


    bookRideBtn.disabled =
        !(
            currentUser &&
            pickupCoords &&
            dropCoords &&
            distanceKm > 0
        );

}

========================================================= */

let searchTimer = null;


async function searchLocation(
    text,
    type
){

    const query =
        text.trim();


    const resultsBox =
        type === "pickup"
        ? pickupResults
        : dropResults;


    if(
        query.length < 3
    ){

        resultsBox.style.display =
            "none";

        resultsBox.innerHTML =
            "";

        return;

    }


    clearTimeout(
        searchTimer
    );


    searchTimer =
        setTimeout(
            async () => {

                try{

                    const url =

                        "https://nominatim.openstreetmap.org/search"
                        +
                        "?format=json"
                        +
                        "&limit=5"
                        +
                        "&countrycodes=in"
                        +
                        "&q="
                        +
                        encodeURIComponent(
                            query
                        );


                    const response =
                        await fetch(
                            url,
                            {
                                headers:{
                                    "Accept":
                                        "application/json"
                                }
                            }
                        );


                    const data =
                        await response.json();


                    resultsBox.innerHTML =
                        "";


                    if(!data.length){

                        resultsBox.style.display =
                            "none";

                        return;

                    }


                    data.forEach(
                        place => {

                            const item =
                                document.createElement(
                                    "div"
                                );


                            item.className =
                                "search-item";


                            item.textContent =
                                place.display_name;


                            item.addEventListener(
                                "click",
                                () => {

                                    const lat =
                                        Number(
                                            place.lat
                                        );

                                    const lng =
                                        Number(
                                            place.lon
                                        );


                                    if(
                                        type ===
                                        "pickup"
                                    ){

                                        pickupInput.value =
                                            place.display_name;


                                        setPickupFromCoords(
                                            lat,
                                            lng,
                                            place.display_name
                                        );

                                    }else{

                                        dropInput.value =
                                            place.display_name;


                                        setDropFromCoords(
                                            lat,
                                            lng,
                                            place.display_name
                                        );

                                    }


                                    resultsBox.style.display =
                                        "none";


                                    map.setView(
                                        [lat,lng],
                                        16
                                    );


                                    updateRouteAndFare();

                                }
                            );


                            resultsBox.appendChild(
                                item
                            );

                        }
                    );


                    resultsBox.style.display =
                        "block";

                }catch(error){

                    console.warn(
                        "Search error:",
                        error
                    );

                }

            },
            450
        );

}


pickupInput.addEventListener(
    "input",
    () =>
        searchLocation(
            pickupInput.value,
            "pickup"
        )
);


dropInput.addEventListener(

        )

async function reverseGeocode(

){

    const url =

        "https://nominatim.openstreetmap.org/reverse"
        +
        "?format=json"
        +
        "&lat=" +
        encodeURIComponent(lat)
        +
        "&lon=" +
        encodeURIComponent(lng);


    const response =
        await fetch(
            url,
            {
                headers:{
                    "Accept":
                        "application/json"

    return data.display_name || "";

}
