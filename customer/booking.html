<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

#map{

width:100%;
height:350px;
border-radius:20px;
margin-bottom:15px;

}


.container{

padding:15px;

}


input,select,button{

width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;

}


button{

background:#FFD600;
font-weight:bold;

}


</style>

</head>


<body>


<div class="topbar">

<h1>
RIDER<span>X</span>
</h1>

</div>



<div class="container">


<div id="map"></div>



<select id="service">

<option value="Bike Taxi">
🏍 Bike Taxi
</option>


<option value="Cab">
🚕 Cab
</option>


<option value="Parcel">
📦 Parcel
</option>


<option value="Food">
🍔 Food
</option>


</select>



<input id="pickup" placeholder="Pickup Location" readonly>



<button id="locationBtn">

📍 Use My Location

</button>



<input id="drop" placeholder="Drop Location">



<p>
Distance:
<span id="distance">
-
</span>
</p>


<p>
Fare: ₹
<span id="fare">
0
</span>
</p>



<button id="bookBtn">

Confirm Booking

</button>



</div>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/booking.js"></script>


</body>

</html>
