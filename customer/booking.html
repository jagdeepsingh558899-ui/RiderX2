<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">
🚕 RiderX Booking
</div>


<div class="container">


<select id="service">

<option value="Bike Taxi">🏍 Bike Taxi</option>

<option value="Cab">🚕 Cab</option>

<option value="Parcel">📦 Parcel</option>

<option value="Food">🍔 Food</option>

</select>


<input id="pickup" placeholder="Pickup Location" readonly>


<button onclick="getPickup()">

📍 Use Current Location

</button>



<input id="drop" placeholder="Drop Location">



<button onclick="calculateRide()">

📏 Calculate Fare

</button>



<p id="distance">

Distance: -

</p>



<input id="fare" placeholder="Fare" readonly>



<button onclick="bookRide()">

Confirm Booking

</button>


</div>




<script type="module">


import {db} from "../firebase/config.js";


import {getCoordinates} from "../js/geocode.js";


import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let pickupLat;

let pickupLng;


let dropLat;

let dropLng;


let distance=0;




window.getPickup=function(){


navigator.geolocation.getCurrentPosition(

(pos)=>{


pickupLat=pos.coords.latitude;

pickupLng=pos.coords.longitude;



document.getElementById("pickup").value=

pickupLat+","+pickupLng;


}


);


}







window.calculateRide=async function(){



let address=

document.getElementById("drop").value;



let result=

await getCoordinates(address);



if(!result){

alert("Drop location not found");

return;

}



dropLat=result.lat;

dropLng=result.lng;



let R=6371;



let dLat=

(dropLat-pickupLat)*Math.PI/180;


let dLng=

(dropLng-pickupLng)*Math.PI/180;



let a=

Math.sin(dLat/2)**2+

Math.cos(pickupLat*Math.PI/180)

*

Math.cos(dropLat*Math.PI/180)

*

Math.sin(dLng/2)**2;



distance=

(R*2*Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

)).toFixed(2);




let service=

document.getElementById("service").value;



let fare=50;



if(service=="Cab")

fare=100;



fare += distance*10;



document.getElementById("distance").innerHTML=

"Distance: "+distance+" KM";



document.getElementById("fare").value=

"₹"+Math.round(fare);



}







window.bookRide=async function(){



await addDoc(

collection(db,"rides"),

{


pickupLat:pickupLat,

pickupLng:pickupLng,


dropLat:dropLat,

dropLng:dropLng,


distance:distance,


service:

document.getElementById("service").value,


fare:

document.getElementById("fare").value,


status:"Pending",


createdAt:serverTimestamp()


}

);



alert("Ride Booked ✅");



}



</script>


</body>

</html>
