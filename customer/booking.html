<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --yellow:#ffe500;

    --black:#000000;

    --dark:#090909;

    --card:#151515;

    --card2:#202020;

    --border:#2c2c2c;

    --white:#ffffff;

    --muted:#888888;

    --green:#22c55e;

    --red:#ef4444;

    --sheet-compact:30vh;

    --sheet-expanded:78vh;

}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

    font-family:Poppins,Arial,sans-serif;

    -webkit-tap-highlight-color:transparent;

}


html,
body{

    width:100%;

    height:100%;

    overflow:hidden;

    background:#000;

    color:#fff;

}


/* =========================================================
   MAP
========================================================= */

#map{

    position:fixed;

    top:0;

    left:0;

    right:0;

    bottom:0;

    width:100%;

    height:100%;

    z-index:1;

    background:#ddd;

}


.leaflet-control-zoom{

    display:none;

}


.leaflet-control-attribution{

    font-size:8px!important;

    padding:1px 3px!important;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    position:fixed;

    top:0;

    left:0;

    right:0;

    z-index:1000;

    padding:

        max(12px, env(safe-area-inset-top))

        14px

        0

        14px;

    pointer-events:none;

}


.topbar-inner{

    display:flex;

    align-items:center;

    justify-content:space-between;

}


.top-btn{

    width:45px;

    height:45px;

    border:0;

    border-radius:50%;

    background:rgba(10,10,10,.94);

    color:#fff;

    font-size:17px;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:

        0 5px 20px rgba(0,0,0,.35);

    pointer-events:auto;

}


.top-btn:active{

    transform:scale(.94);

}


.logo{

    padding:8px 17px;

    border-radius:15px;

    background:rgba(10,10,10,.94);

    font-size:17px;

    font-weight:800;

    box-shadow:

        0 5px 20px rgba(0,0,0,.35);

}


.logo span{

    color:var(--yellow);

}


/* =========================================================
   STATUS
========================================================= */

.status-pill{

    position:fixed;

    top:72px;

    left:50%;

    transform:translateX(-50%);

    z-index:900;

    max-width:90%;

    padding:8px 16px;

    border-radius:30px;

    background:rgba(17,17,17,.94);

    color:#fff;

    font-size:11px;

    white-space:nowrap;

    box-shadow:

        0 5px 20px rgba(0,0,0,.35);

    pointer-events:none;

}


/* =========================================================
   CENTER PIN
========================================================= */

.center-pin{

    position:fixed;

    left:50%;

    top:50%;

    z-index:500;

    transform:translate(-50%,-100%);

    pointer-events:none;

}


.center-pin-icon{

    width:45px;

    height:45px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--yellow);

    color:#000;

    border-radius:50% 50% 50% 0;

    transform:rotate(-45deg);

    box-shadow:

        0 7px 20px rgba(0,0,0,.35);

}


.center-pin-icon i{

    transform:rotate(45deg);

}


/* =========================================================
   MAP LOCATION BUTTON
========================================================= */

.location-btn{

    position:fixed;

    right:15px;

    bottom:

        calc(

            var(--sheet-compact) + 18px

        );

    z-index:850;

    width:48px;

    height:48px;

    border:0;

    border-radius:50%;

    background:rgba(17,17,17,.96);

    color:var(--yellow);

    font-size:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:

        0 5px 20px rgba(0,0,0,.4);

    transition:

        bottom .35s ease,

        transform .15s ease;

}


.location-btn:active{

    transform:scale(.94);

}


/* =========================================================
   BOOKING SHEET
========================================================= */

.sheet{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    z-index:1000;

    height:var(--sheet-compact);

    max-height:var(--sheet-expanded);

    overflow:hidden;

    padding:

        8px

        14px

        max(14px, env(safe-area-inset-bottom))

        14px;

    background:

        linear-gradient(

            180deg,

            #0b0b0b 0%,

            #090909 100%

        );

    border-radius:

        27px

        27px

        0

        0;

    box-shadow:

        0 -12px 35px rgba(0,0,0,.48);

    transition:

        height .35s cubic-bezier(.22,.8,.24,1);

    touch-action:none;

}


/* =========================================================
   SHEET EXPANDED
========================================================= */

.sheet.expanded{

    height:var(--sheet-expanded);

}


/* =========================================================
   HANDLE AREA
========================================================= */

.handle-area{

    width:100%;

    height:36px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:grab;

    touch-action:none;

}


.handle-area:active{

    cursor:grabbing;

}


.handle{

    width:46px;

    height:5px;

    background:#555;

    border-radius:20px;

    transition:

        width .2s ease,

        background .2s ease;

}


.handle-area:active .handle{

    width:58px;

    background:#777;

}


/* =========================================================
   SHEET SCROLL
========================================================= */

.sheet-content{

    height:

        calc(

            100%

            - 36px

        );

    overflow-y:auto;

    overflow-x:hidden;

    padding-bottom:8px;

    overscroll-behavior:contain;

    -webkit-overflow-scrolling:touch;

}


.sheet-content::-webkit-scrollbar{

    width:0;

}


/* =========================================================
   TITLE
========================================================= */

.title{

    font-size:19px;

    font-weight:800;

    margin-bottom:13px;

}


/* =========================================================
   SEARCH BOX
========================================================= */

.search-box{

    background:#151515;

    border-radius:17px;

    overflow:hidden;

}


.search-row{

    display:flex;

    align-items:center;

    gap:10px;

    min-height:56px;

    padding:8px 10px;

}


.search-row + .search-row{

    border-top:

        1px solid

        var(--border);

}


.location-dot{

    width:27px;

    height:27px;

    min-width:27px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    font-size:10px;

}


.pick-dot{

    background:#12351f;

    color:var(--green);

}


.drop-dot{

    background:#3a3300;

    color:var(--yellow);

}


.location-input{

    flex:1;

    width:100%;

    min-width:0;

    border:0;

    outline:0;

    background:transparent;

    color:#fff;

    font-size:13px;

}


.location-input::placeholder{

    color:#777;

}


.map-select-btn{

    width:36px;

    height:36px;

    min-width:36px;

    border:0;

    border-radius:50%;

    background:#242424;

    color:var(--yellow);

    display:flex;

    align-items:center;

    justify-content:center;

}


.map-select-btn:active{

    transform:scale(.94);

}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title{

    margin-top:15px;

    margin-bottom:8px;

    font-size:12px;

    color:#999;

}


/* =========================================================
   SERVICES
========================================================= */

.services{

    display:grid;

    grid-template-columns:

        repeat(4,1fr);

    gap:8px;

}


.service{

    min-height:72px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    border:1px solid #303030;

    border-radius:15px;

    background:#151515;

    color:#aaa;

    cursor:pointer;

    transition:

        .2s ease;

}


.service i{

    font-size:19px;

}


.service span{

    font-size:10px;

}


.service.active{

    background:var(--yellow);

    border-color:var(--yellow);

    color:#000;

    box-shadow:

        0 5px 18px

        rgba(255,229,0,.08);

}


.service:active{

    transform:scale(.97);

}


/* =========================================================
   FARE
========================================================= */

.fare-card{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:14px;

    padding:14px;

    background:#151515;

    border-radius:16px;

}


.fare-label{

    font-size:13px;

    font-weight:600;

}


.fare-info{

    margin-top:3px;

    color:#777;

    font-size:10px;

}


.fare-price{

    color:var(--yellow);

    font-size:23px;

    font-weight:800;

}


/* =========================================================
   DISTANCE
========================================================= */

.distance{

    text-align:center;

    margin-top:8px;

    color:#777;

    font-size:10px;

}


/* =========================================================
   PAYMENT
========================================================= */

.payment-row{

    display:flex;

    align-items:center;

    gap:9px;

    margin-top:10px;

    padding:13px;

    background:#151515;

    border-radius:15px;

}


.payment-icon{

    color:var(--yellow);

}


#paymentMethod{

    flex:1;

    border:0;

    outline:0;

    background:#151515;

    color:#fff;

    font-size:13px;

}


/* =========================================================
   BOOK BUTTON
========================================================= */

.book-btn{

    width:100%;

    margin-top:14px;

    min-height:54px;

    border:0;

    border-radius:16px;

    background:var(--yellow);

    color:#000;

    font-size:16px;

    font-weight:800;

    box-shadow:

        0 5px 20px

        rgba(255,229,0,.12);

    transition:

        transform .15s ease,

        background .2s ease;

}


.book-btn:active{

    transform:scale(.985);

}


.book-btn:disabled{

    background:#444;

    color:#888;

    box-shadow:none;

}


/* =========================================================
   STATUS
========================================================= */

#bookingStatus{

    min-height:20px;

    margin-top:9px;

    text-align:center;

    color:var(--yellow);

    font-size:11px;

}


/* =========================================================
   ACTIVE RIDE
========================================================= */

.active-ride{

    display:none;

    margin-top:12px;

    padding:13px;

    background:#151515;

    border-radius:16px;

}


.active-ride.show{

    display:block;

}


.active-ride-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}


.active-title{

    font-size:13px;

    font-weight:700;

}


.active-status{

    color:var(--yellow);

    font-size:11px;

}


.cancel-btn{

    width:100%;

    margin-top:10px;

    padding:11px;

    border:1px solid #3a2020;

    border-radius:12px;

    background:#170909;

    color:#ff6b6b;

    font-size:12px;

    font-weight:600;

}


/* =========================================================
   SMALL MOBILE
========================================================= */

@media(max-width:380px){

    :root{

        --sheet-compact:31vh;

        --sheet-expanded:82vh;

    }


    .sheet{

        padding-left:11px;

        padding-right:11px;

    }


    .title{

        font-size:17px;

    }


    .service{

        min-height:66px;

    }


    .service i{

        font-size:17px;

    }

}


/* =========================================================
   TALL MOBILE
========================================================= */

@media(min-height:750px){

    :root{

        --sheet-compact:29vh;

        --sheet-expanded:76vh;

    }

}


/* =========================================================
   SAFE AREA
========================================================= */

@supports(padding:max(0px)){

    .sheet{

        padding-bottom:

            max(

                14px,

                env(safe-area-inset-bottom)

            );

    }

}

</style>

</head>

     MAP

<!-- =========================================================
     PAGE CONTROLLER
========================================================= -->

<script type="module">

document.addEventListener(

    "DOMContentLoaded",

    () => {


        /* ====================================================
           ELEMENTS
        ==================================================== */

        const sheet =
            document.getElementById(
                "bookingSheet"
            );


        const handle =
            document.getElementById(
                "sheetHandle"
            );


        const floatingLocation =
            document.getElementById(
                "floatingLocation"
            );


        const mainLocation =
            document.getElementById(
                "myLocation"
            );


        const back =
            document.getElementById(
                "backButton"
            );


        const activeRide =
            document.getElementById(
                "activeRide"
            );


        const activeStatus =
            document.getElementById(
                "activeRideStatus"
            );


        /* ====================================================
           SHEET STATE
        ==================================================== */

        let expanded = false;

        let startY = 0;

        let currentY = 0;

        let dragging = false;


        /* ====================================================
           MAP RESIZE
        ==================================================== */

        function refreshMap(){

            setTimeout(

                () => {

                    if(
                        window.RiderXCustomer &&
                        typeof window.RiderXCustomer.getState ===
                        "function"
                    ){

                        const map =
                            window.RiderXCustomer
                                .getState()
                                ?.map;

                        if(map){

                            map.invalidateSize();

                        }

                    }

                    if(
                        window.L &&
                        window.RiderXCustomer
                    ){

                        const state =
                            window.RiderXCustomer
                                .getState?.();

                        if(
                            state &&
                            state.map
                        ){

                            state.map.invalidateSize();

                        }

                    }

                },

                380

            );

        }


        /* ====================================================
           SET SHEET
        ==================================================== */

        function setSheet(
            shouldExpand
        ){

            expanded =
                Boolean(
                    shouldExpand
                );


            if(sheet){

                sheet.classList.toggle(
                    "expanded",
                    expanded
                );

            }


            refreshMap();

        }


        /* ====================================================
           TOGGLE SHEET
        ==================================================== */

        function toggleSheet(){

            setSheet(
                !expanded
            );

        }


        /* ====================================================
           HANDLE CLICK
        ==================================================== */

        if(handle){

            handle.addEventListener(

                "click",

                () => {

                    if(!dragging){

                        toggleSheet();

                    }

                }

            );

        }


        /* ====================================================
           TOUCH START
        ==================================================== */

        if(handle){

            handle.addEventListener(

                "touchstart",

                (event) => {

                    if(
                        !event.touches ||
                        !event.touches.length
                    ){

                        return;

                    }


                    startY =
                        event.touches[0].clientY;


                    currentY =
                        startY;


                    dragging =
                        true;

                },

                {
                    passive:true
                }

            );


            /* =================================================
               TOUCH MOVE
            ================================================= */

            handle.addEventListener(

                "touchmove",

                (event) => {

                    if(
                        !dragging ||
                        !event.touches ||
                        !event.touches.length
                    ){

                        return;

                    }


                    currentY =
                        event.touches[0].clientY;

                },

                {
                    passive:true
                }

            );


            /* =================================================
               TOUCH END
            ================================================= */

            handle.addEventListener(

                "touchend",

                () => {

                    if(!dragging){

                        return;

                    }


                    const difference =
                        currentY -
                        startY;


                    dragging =
                        false;


                    if(
                        Math.abs(
                            difference
                        ) < 20
                    ){

                        toggleSheet();

                        return;

                    }


                    if(
                        difference < 0
                    ){

                        setSheet(true);

                    }else{

                        setSheet(false);

                    }

                },

                {
                    passive:true
                }

            );

        }


        /* ====================================================
           MOUSE DRAG
        ==================================================== */

        if(handle){

            handle.addEventListener(

                "mousedown",

                (event) => {

                    startY =
                        event.clientY;

                    currentY =
                        startY;

                    dragging =
                        true;

                    event.preventDefault();

                }

            );


            window.addEventListener(

                "mousemove",

                (event) => {

                    if(!dragging){

                        return;

                    }


                    currentY =
                        event.clientY;

                }

            );


            window.addEventListener(

                "mouseup",

                () => {

                    if(!dragging){

                        return;

                    }


                    const difference =
                        currentY -
                        startY;


                    dragging =
                        false;


                    if(
                        Math.abs(
                            difference
                        ) < 20
                    ){

                        toggleSheet();

                        return;

                    }


                    if(
                        difference < 0
                    ){

                        setSheet(true);

                    }else{

                        setSheet(false);

                    }

                }

            );

        }


        /* ====================================================
           BACK BUTTON
        ==================================================== */

        if(back){

            back.addEventListener(

                "click",

                () => {

                    if(
                        expanded
                    ){

                        setSheet(false);

                        return;

                    }


                    history.back();

                }

            );

        }


        /* ====================================================
           LOCATION BUTTON
        ==================================================== */

        if(floatingLocation){

            floatingLocation.addEventListener(

                "click",

                () => {

                    if(mainLocation){

                        mainLocation.click();

                    }

                }

            );

        }


        /* ====================================================
           RIDE CREATED
        ==================================================== */

        window.addEventListener(

            "riderx:ride-created",

            () => {

                activeRide?.classList.add(
                    "show"
                );


                if(activeStatus){

                    activeStatus.innerText =
                        "Searching...";

                }

            }

        );


        /* ====================================================
           RIDE STATUS
        ==================================================== */

        window.addEventListener(

            "riderx:ride-status",

            (event) => {

                const status =
                    event.detail?.status ||
                    "REQUESTED";


                activeRide?.classList.add(
                    "show"
                );


                if(activeStatus){

                    activeStatus.innerText =
                        status;

                }


                if(
                    status === "ACCEPTED" ||
                    status === "ARRIVING" ||
                    status === "STARTED"
                ){

                    setSheet(false);

                }


                if(
                    status === "COMPLETED" ||
                    status === "CANCELLED"
                ){

                    setSheet(false);

                }

            }

        );


        /* ====================================================
           CANCEL
        ==================================================== */

        const cancel =
            document.getElementById(
                "cancelRide"
            );


        if(cancel){

            cancel.addEventListener(

                "click",

                () => {

                    if(
                        window.RiderXCustomer &&
                        typeof window.RiderXCustomer.cancelRide ===
                        "function"
                    ){

                        window.RiderXCustomer.cancelRide();

                    }

                }

            );

        }


        /* ====================================================
           INITIAL MAP REFRESH
        ==================================================== */

        setTimeout(

            () => {

                refreshMap();

            },

            800

        );


    },

    {
        once:true
    }

);

</script>


</body>

</html>
