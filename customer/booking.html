<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Map Booking</title>

<link rel="stylesheet" href="../css/style.css">


<!-- Leaflet Map -->

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>


<style>

#map{

height:300px;
width:100%;
border-radius:15px;
margin:15px 0;

}


</style>

</head>


<body>


<div class="header">

🚕 RiderX Booking

</div>



<div class="container">


<div class="box">


<select id="service">

<option value="Bike Taxi">🏍 Bike Taxi</option>

<option value="Cab">🚕 Cab</option>

<option value="Parcel">📦 Parcel</option>

<option value="Food">🍔 Food</option>

</select>




<input id="pickup" placeholder="Pickup Location">


<input id="drop" placeholder="Drop Location">



<div id="map"></div>



<input id="fare" placeholder="Fare" readonly>




<button onclick="calculateFare()">

Calculate Fare

</button>



<button onclick="bookRide()">

Confirm Ride

</button>



</div>



<a class="back" href="dashboard.html">

⬅ Back

</a>



</div>





<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
addDoc,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let map;


let marker;




function initMap(){


map = L.map("map").setView(

[26.9124,75.7873],

13

);



L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:"OpenStreetMap"

}

).addTo(map);



}





window.getLocation=function(){


navigator.geolocation.getCurrentPosition(

(position)=>{


let lat=position.coords.latitude;

let lng=position.coords.longitude;



if(marker){

map.removeLayer(marker);

}



marker=L.marker([lat,lng])

.addTo(map)

.bindPopup("Pickup")

.openPopup();



map.setView([lat,lng],15);



document.getElementById("pickup").value=

lat+","+lng;


}

);


}







window.calculateFare=function(){


let service=

document.getElementById("service").value;


let fare=100;



if(service=="Bike Taxi")

fare=50;


if(service=="Cab")

fare=150;


if(service=="Parcel")

fare=80;



document.getElementById("fare").value="₹"+fare;


}







window.bookRide=async function(){


await addDoc(

collection(db,"rides"),

{

pickup:

document.getElementById("pickup").value,


drop:

document.getElementById("drop").value,


service:

document.getElementById("service").value,


fare:

document.getElementById("fare").value,


status:"Pending",


createdAt:serverTimestamp()


}

);



alert("Ride Booked ✅");


}





initMap();


</script>


</body>

</html>
