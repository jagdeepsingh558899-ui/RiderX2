<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Book Ride</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">

🚕 Book Ride

</div>



<div class="container">


<select id="service">

<option>Bike Taxi</option>
<option>Cab</option>
<option>Parcel</option>
<option>Food</option>

</select>



<input id="pickup" placeholder="Pickup Location">


<input id="drop" placeholder="Drop Location">



<button onclick="getLocation()">

📍 Use Current Location

</button>



<input id="fare" placeholder="Fare" readonly>



<button onclick="calculateFare()">

Calculate Fare

</button>



<button onclick="bookRide()">

Confirm Booking

</button>



</div>





<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
addDoc,
serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let pickupLat = null;

let pickupLng = null;





window.getLocation=function(){


navigator.geolocation.getCurrentPosition(

(position)=>{


pickupLat =
position.coords.latitude;


pickupLng =
position.coords.longitude;



document.getElementById("pickup").value =

pickupLat + "," + pickupLng;



}


);


}







window.calculateFare=function(){


let service =

document.getElementById("service").value;



let fare=50;



if(service=="Cab")

fare=150;



if(service=="Parcel")

fare=80;



if(service=="Food")

fare=100;



document.getElementById("fare").value=

"₹"+fare;



}








window.bookRide=async function(){



let drop =

document.getElementById("drop").value;



if(!pickupLat){

alert("Please select pickup location");

return;

}



await addDoc(

collection(db,"rides"),

{


pickup:

document.getElementById("pickup").value,


drop:drop,


pickupLat:pickupLat,


pickupLng:pickupLng,



service:

document.getElementById("service").value,



fare:

document.getElementById("fare").value,



status:"Pending",


createdAt:serverTimestamp()



}

);



alert("Ride Requested ✅");



window.location.href="ride-status.html";


}





</script>


</body>

</html>
