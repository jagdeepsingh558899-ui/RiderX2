<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>RiderX | Book Ride</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

:root{
    --yellow:#ffe500;
    --black:#050505;
    --panel:#101010;
    --card:#181818;
    --card2:#202020;
    --border:#303030;
    --white:#fff;
    --muted:#999;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.leaflet-control-zoom{
    margin-top:75px!important;
    margin-right:12px!important;
}

.leaflet-control-zoom a{
    background:#111!important;
    color:var(--yellow)!important;
    border-color:#333!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:13px;
    pointer-events:none;
}

.topbar-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.icon-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:rgba(15,15,15,.95);
    color:#fff;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 18px rgba(0,0,0,.35);
    pointer-events:auto;
    cursor:pointer;
}

.icon-btn:active{
    transform:scale(.94);
}

.logo{
    background:rgba(15,15,15,.96);
    padding:8px 17px;
    border-radius:15px;
    font-size:17px;
    font-weight:800;
    box-shadow:0 5px 18px rgba(0,0,0,.35);
}

.logo span{
    color:var(--yellow);
}

/* =========================================================
   MAP LOCATION BUTTON
========================================================= */

.map-location{
    position:absolute;
    right:14px;
    bottom:285px;
    z-index:900;
}

.map-location button{
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:#111;
    color:var(--yellow);
    font-size:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.4);
}

/* =========================================================
   STATUS
========================================================= */

.status{
    position:absolute;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    z-index:900;

    background:#111;
    color:#fff;

    padding:8px 15px;
    border-radius:30px;

    font-size:10px;
    white-space:nowrap;

    box-shadow:0 5px 18px rgba(0,0,0,.4);
}

/* =========================================================
   CENTER PIN
========================================================= */

.center-marker{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-100%);
    z-index:500;
    pointer-events:none;
}

.pin{
    width:46px;
    height:46px;

    background:var(--yellow);
    color:#000;

    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 7px 22px rgba(0,0,0,.45);
}

.pin i{
    transform:rotate(45deg);
}

/* =========================================================
   BOTTOM SHEET
========================================================= */

.booking-sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    z-index:1000;

    background:#090909;

    border-radius:27px 27px 0 0;

    padding:12px 15px
             calc(15px + env(safe-area-inset-bottom));

    max-height:66vh;
    overflow-y:auto;

    box-shadow:0 -12px 35px rgba(0,0,0,.5);
}

.handle{
    width:42px;
    height:5px;
    border-radius:10px;
    background:#555;
    margin:1px auto 14px;
}

.title{
    font-size:19px;
    font-weight:800;
    margin-bottom:13px;
}

.subtitle{
    color:#777;
    font-size:11px;
    margin-top:-8px;
    margin-bottom:13px;
}

/* =========================================================
   LOCATION CARD
========================================================= */

.location-box{
    background:var(--card);
    border-radius:17px;
    border:1px solid #262626;
    overflow:hidden;
}

.row{
    min-height:55px;

    display:flex;
    align-items:center;

    gap:10px;

    padding:9px 10px;
}

.row + .row{
    border-top:1px solid #2c2c2c;
}

.dot{
    width:27px;
    height:27px;
    min-width:27px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
}

.pick{
    background:#12351f;
    color:var(--green);
}

.drop{
    background:#3b3500;
    color:var(--yellow);
}

.location-input{
    flex:1;
    min-width:0;

    background:transparent;
    border:0;
    outline:0;

    color:#fff;

    font-size:13px;
}

.location-input::placeholder{
    color:#777;
}

.action{
    width:36px;
    height:36px;
    min-width:36px;

    border:0;
    border-radius:50%;

    background:#252525;
    color:var(--yellow);

    cursor:pointer;
}

.action:active{
    transform:scale(.94);
}

/* =========================================================
   SERVICE SELECTOR
========================================================= */

.section-label{
    font-size:12px;
    color:#888;
    margin-top:15px;
    margin-bottom:8px;
}

.services{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.service{
    min-height:68px;

    background:#171717;

    border:1px solid #303030;

    border-radius:15px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    color:#aaa;

    cursor:pointer;
    user-select:none;
}

.service i{
    font-size:19px;
}

.service span{
    font-size:10px;
    font-weight:600;
}

.service.active{
    background:var(--yellow);
    color:#000;
    border-color:var(--yellow);
}

/* =========================================================
   FARE CARD
========================================================= */

.fare{
    margin-top:13px;

    background:var(--card);

    border:1px solid #292929;

    border-radius:17px;

    padding:13px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.fare-left{
    font-size:13px;
    font-weight:600;
}

.fare-left small{
    display:block;
    color:#777;
    font-size:10px;
    margin-top:3px;
    font-weight:400;
}

.price{
    color:var(--yellow);
    font-size:23px;
    font-weight:800;
}

#estimated-distance-display{
    text-align:center;
    color:#777;
    font-size:10px;
    margin-top:7px;
}

/* =========================================================
   PAYMENT
========================================================= */

.payment-title{
    font-size:12px;
    color:#888;
    margin-top:12px;
    margin-bottom:7px;
}

.payment{
    width:100%;

    padding:13px;

    background:var(--card);

    border:1px solid #303030;

    color:#fff;

    border-radius:14px;

    outline:none;

    font-size:12px;
}

.payment option{
    background:#111;
    color:#fff;
}

/* =========================================================
   BOOK BUTTON
========================================================= */

.book-btn{
    width:100%;

    margin-top:13px;

    min-height:53px;

    border:0;

    border-radius:16px;

    background:var(--yellow);

    color:#000;

    font-size:15px;
    font-weight:800;

    cursor:pointer;

    box-shadow:0 5px 18px rgba(255,229,0,.15);
}

.book-btn:active{
    transform:scale(.985);
}

.book-btn:disabled{
    background:#4b4b4b;
    color:#999;
    box-shadow:none;
    cursor:not-allowed;
}

/* =========================================================
   BOOKING STATUS
========================================================= */

#bookingStatus{
    min-height:18px;

    text-align:center;

    margin-top:8px;

    color:var(--yellow);

    font-size:11px;
}

/* =========================================================
   SEARCH / LOADING OVERLAY
========================================================= */

#rideLoading{
    position:fixed;
    inset:0;

    z-index:5000;

    background:rgba(0,0,0,.78);

    display:none;

    align-items:center;
    justify-content:center;
}

.loading-card{
    width:85%;
    max-width:340px;

    background:#151515;

    border:1px solid #303030;

    border-radius:22px;

    padding:25px;

    text-align:center;
}

.loading-icon{
    width:60px;
    height:60px;

    margin:0 auto 15px;

    border-radius:50%;

    background:var(--yellow);

    color:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
}

.loading-card h3{
    font-size:17px;
    margin-bottom:5px;
}

.loading-card p{
    color:#888;
    font-size:11px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:380px){

    .booking-sheet{
        padding-left:11px;
        padding-right:11px;
    }

    .service{
        min-height:62px;
    }

    .service i{
        font-size:17px;
    }

    .title{
        font-size:17px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     MAP
===================================================== -->

<div id="map"></div>


<!-- =====================================================
     TOP BAR
===================================================== -->

<div class="topbar">

    <div class="topbar-inner">

        <button
            class="icon-btn"
            type="button"
            onclick="history.back()">

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div class="logo">

            RIDER<span>X</span>

        </div>


        <button
            class="icon-btn"
            type="button"
            id="myLocation">

            <i class="fa-solid fa-location-crosshairs"></i>

        </button>

    </div>

</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div
    class="status"
    id="status">

    Select pickup location

</div>


<!-- =====================================================
     CENTER PIN
===================================================== -->

<div
    class="center-marker"
    id="centerMarker">

    <div class="pin">

        <i class="fa-solid fa-location-dot"></i>

    </div>

</div>


<!-- =====================================================
     MAP LOCATION BUTTON
===================================================== -->

<div class="map-location">

    <button
        type="button"
        id="mapLocationButton">

        <i class="fa-solid fa-location-crosshairs"></i>

    </button>

</div>


<!-- =====================================================
     BOOKING SHEET
===================================================== -->

<div class="booking-sheet">

    <div class="handle"></div>


    <div class="title">
        Where do you want to go?
    </div>

    <div class="subtitle">
        Choose pickup and destination
    </div>


    <!-- LOCATION -->

    <div class="location-box">

        <!-- PICKUP -->

        <div class="row">

            <div class="dot pick">

                <i class="fa-solid fa-circle"></i>

            </div>


            <input
                id="pickupLocation"
                class="location-input"
                type="text"
                placeholder="Pickup location"
                autocomplete="off">


            <button
                class="action"
                id="pickupMapBtn"
                type="button">

                <i class="fa-solid fa-map-pin"></i>

            </button>

        </div>


        <!-- DROP -->

        <div class="row">

            <div class="dot drop">

                <i class="fa-solid fa-location-dot"></i>

            </div>


            <input
                id="dropoffLocation"
                class="location-input"
                type="text"
                placeholder="Where to?"
                autocomplete="off">


            <button
                class="action"
                id="dropMapBtn"
                type="button">

                <i class="fa-solid fa-map-pin"></i>

            </button>

        </div>

    </div>


    <!-- SERVICES -->

    <div class="section-label">
        Choose service
    </div>


    <div class="services">

        <div
            class="service active"
            data-service="bike">

            <i class="fa-solid fa-motorcycle"></i>

            <span>Bike</span>

        </div>


        <div
            class="service"
            data-service="cab">

            <i class="fa-solid fa-car"></i>

            <span>Cab</span>

        </div>


        <div
            class="service"
            data-service="parcel">

            <i class="fa-solid fa-box"></i>

            <span>Parcel</span>

        </div>


        <div
            class="service"
            data-service="food">

            <i class="fa-solid fa-utensils"></i>

            <span>Food</span>

        </div>

    </div>


    <!-- FARE -->

    <div class="fare">

        <div class="fare-left">

            Estimated Fare

            <small id="fareInfo">
                Select pickup & drop
            </small>

        </div>


        <div
            class="price"
            id="fare">

            ₹0

        </div>

    </div>


    <div id="estimated-distance-display">
        0 KM
    </div>


    <!-- PAYMENT -->

    <div class="payment-title">
        Payment method
    </div>


    <select
        id="paymentMethod"
        class="payment">

        <option value="cash">
            💵 Cash
        </option>

        <option value="online">
            📱 UPI / Online
        </option>

        <option value="wallet">
            💳 RiderX Wallet
        </option>

    </select>


    <!-- BOOK -->

    <button
        id="bookRide"
        class="book-btn"
        type="button"
        disabled>

        <i class="fa-solid fa-paper-plane"></i>

        Book RiderX

    </button>


    <div id="bookingStatus"></div>

</div>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="rideLoading">

    <div class="loading-card">

        <div class="loading-icon">

            <i class="fa-solid fa-motorcycle"></i>

        </div>

        <h3>
            Finding a RiderX rider
        </h3>

        <p>
            Searching nearby available riders...
        </p>

    </div>

</div>


<!-- =====================================================
     LEAFLET
===================================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- =====================================================
     RIDERX CUSTOMER ENGINE
===================================================== -->

<script
    type="module"
    src="../js/customer.js">
</script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const locationButton =
            document.getElementById(
                "mapLocationButton"
            );

        const topLocationButton =
            document.getElementById(
                "myLocation"
            );

        function locate(){

            if(
                window.RiderXCustomer &&
                typeof window.RiderXCustomer.locate === "function"
            ){

                window.RiderXCustomer.locate();

            }

        }

        if(locationButton){

            locationButton.addEventListener(
                "click",
                locate
            );

        }

        if(topLocationButton){

            topLocationButton.addEventListener(
                "click",
                locate
            );

        }

    }
);

</script>

</body>
</html>
