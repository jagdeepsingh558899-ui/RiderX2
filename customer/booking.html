<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">
🚕 RiderX Booking
</div>


<div class="container">


<select id="service">

</select>



<input id="pickup" placeholder="Pickup Location" readonly>


<button onclick="getPickup()">
📍 Use Current Location
</button>



<input id="drop" placeholder="Drop Location">


<input id="coupon" placeholder="Coupon Code">


<button onclick="applyCoupon()">
🎁 Apply Coupon
</button>



<button onclick="calculateRide()">
📏 Calculate Fare
</button>



<p id="distance">
Distance: -
</p>


<p id="fare">
Fare: -
</p>

<input id="coupon" placeholder="Enter Coupon Code">

<button onclick="applyCoupon()">
Apply Coupon
</button>

<p id="couponMsg"></p>

<button onclick="bookRide()">
Confirm Booking
</button>



</div>





<script type="module">
let discount = 0;


window.applyCoupon = async function(){


let code = 
document.getElementById("coupon").value.toUpperCase();



let snap = await getDocs(

collection(db,"coupons")

);



let found=false;



snap.forEach((c)=>{


let data=c.data();



if(data.code == code){


found=true;


discount=data.discount;



document.getElementById("couponMsg").innerHTML=

"Coupon Applied ✅";


}



});




if(!found){


document.getElementById("couponMsg").innerHTML=

"Invalid Coupon ❌";


}



}

import {db} from "../firebase/config.js";


import {getFareSettings} from "../js/fare.js";


import {getCoordinates} from "../js/geocode.js";


import {let fareRates={};


async function loadFareRates(){


let snap = await getDoc(

doc(db,"settings","fare")

);



if(snap.exists()){

fareRates=snap.data();

}


}


loadFareRates();

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let settings={};


let pickupLat;

let pickupLng;


let dropLat;

let dropLng;


let distance=0;

let finalFare=0;

let couponDiscount=0;






async function loadSettings(){


settings=await getFareSettings();



let service=document.getElementById("service");

service.innerHTML="";



if(settings.bike){

service.innerHTML+=

`<option value="Bike Taxi">🏍 Bike Taxi</option>`;

}



if(settings.cab){

service.innerHTML+=

`<option value="Cab">🚕 Cab</option>`;

}



if(settings.parcel){

service.innerHTML+=

`<option value="Parcel">📦 Parcel</option>`;

}



if(settings.food){

service.innerHTML+=

`<option value="Food">🍔 Food</option>`;

}



}



loadSettings();






window.getPickup=function(){


navigator.geolocation.getCurrentPosition(

(pos)=>{


pickupLat=pos.coords.latitude;

pickupLng=pos.coords.longitude;


document.getElementById("pickup").value=

pickupLat+","+pickupLng;


}

);


}






window.applyCoupon=function(){


let code=

document.getElementById("coupon").value;



if(code==settings.coupon){


couponDiscount=

Number(settings.discount || 0);



alert("Coupon Applied ✅");


}

else{


couponDiscount=0;

alert("Invalid Coupon ❌");


}


}







window.calculateRide=async function(){



let result=

await getCoordinates(

document.getElementById("drop").value

);



if(!result){

alert("Drop location not found");

return;

}



dropLat=result.lat;

dropLng=result.lng;



let R=6371;


let dLat=(dropLat-pickupLat)*Math.PI/180;


let dLng=(dropLng-pickupLng)*Math.PI/180;



let a=

Math.sin(dLat/2)**2+

Math.cos(pickupLat*Math.PI/180)

*

Math.cos(dropLat*Math.PI/180)

*

Math.sin(dLng/2)**2;



distance=

(

R*

2*

Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

)

).toFixed(2);






let type=

document.getElementById("service").value;



if(type=="Bike Taxi"){


finalFare=fareRates.bike

Number(settings.bikeBase)

+

distance*Number(settings.bikeKm);


}

else if(type=="Cab"){


finalFare=fareRates.cab

Number(settings.cabBase)

+

distance*Number(settings.cabKm);


}

else{


finalFare=

100+(distance*10);


}





finalFare=

finalFare-

(finalFare*couponDiscount/100);





document.getElementById("distance").innerHTML=

"Distance: "+distance+" KM";



document.getElementById("fare").innerHTML=

"Fare: ₹"+Math.round(finalFare);



}







window.bookRide=async function(){


let ride=await addDoc(

collection(db,"rides"),

{


pickupLat,

pickupLng,


dropLat,

dropLng,


distance,


service:

document.getElementById("service").value,


fare:

"₹"+Math.round(finalFare),


coupon:

document.getElementById("coupon").value,


status:"Pending",


paymentStatus:"Pending",


createdAt:serverTimestamp()


}

);





localStorage.setItem(

"rideId",

ride.id

);



alert("Ride Booked ✅");



window.location.href=

"ride-status.html";



}
