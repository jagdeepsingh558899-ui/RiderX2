<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">


<style>

#map{
height:350px;
width:100%;
border-radius:15px;
margin-bottom:15px;
}

input,select,button{

width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;

}

button{

background:#ffcc00;
border:none;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

🚕 RiderX Booking

</div>



<div class="container">


<div id="map"></div>



<select id="service">

<option value="Bike Taxi">
🏍 Bike Taxi
</option>

<option value="Cab">
🚕 Cab
</option>

<option value="Parcel">
📦 Parcel
</option>

</select>



<input id="pickup" placeholder="Pickup Location" readonly>


<button onclick="getPickup()">
📍 Use Current Location
</button>



<input id="drop" placeholder="Drop Location">



<input id="coupon" placeholder="Coupon Code">


<button onclick="applyCoupon()">
🎁 Apply Coupon
</button>



<button onclick="calculateRide()">
📏 Calculate Fare
</button>



<p id="distance">
Distance: -
</p>


<p id="fare">
Fare: -
</p>


<p id="couponMsg"></p>



<button onclick="bookRide()">
Confirm Booking
</button>


</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>



<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
addDoc,
serverTimestamp,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let map;

let marker;



let pickupLat=null;
let pickupLng=null;

let dropLat=null;
let dropLng=null;

let distance=0;
let finalFare=0;

let discount=0;




window.onload=function(){


map=L.map("map").setView(
[26.9124,75.7873],
13
);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:"© OpenStreetMap"

}

).addTo(map);



};






window.getPickup=function(){


navigator.geolocation.getCurrentPosition(

(position)=>{


pickupLat=position.coords.latitude;

pickupLng=position.coords.longitude;



document.getElementById("pickup").value=

pickupLat+","+pickupLng;



if(marker){

map.removeLayer(marker);

}



marker=L.marker(

[pickupLat,pickupLng]

)

.addTo(map)

.bindPopup("Pickup Location")

.openPopup();



map.setView(

[pickupLat,pickupLng],

15

);



},

()=>{

alert("Location permission allow karo");

}

);


}






window.applyCoupon=async function(){



let code=

document.getElementById("coupon").value.toUpperCase();



let snap=

await getDocs(

collection(db,"coupons")

);



let applied=false;



snap.forEach((doc)=>{


let data=doc.data();



if(data.code==code){


discount=data.discount;


applied=true;


}


});



document.getElementById("couponMsg").innerHTML=

applied ?

"Coupon Applied ✅"

:

"Invalid Coupon ❌";


}







window.calculateRide=async function(){



if(!pickupLat){

alert("Pehle pickup location lo");

return;

}



let place=

document.getElementById("drop").value;



let res=

await fetch(

"https://nominatim.openstreetmap.org/search?format=json&q="+place

);



let data=

await res.json();



if(data.length==0){

alert("Drop location nahi mila");

return;

}



dropLat=

Number(data[0].lat);


dropLng=

Number(data[0].lon);





let R=6371;


let dLat=

(dropLat-pickupLat)*Math.PI/180;


let dLng=

(dropLng-pickupLng)*Math.PI/180;




let a=

Math.sin(dLat/2)**2+

Math.cos(pickupLat*Math.PI/180)

*

Math.cos(dropLat*Math.PI/180)

*

Math.sin(dLng/2)**2;



distance=

R*2*Math.atan2(

Math.sqrt(a),

Math.sqrt(1-a)

);




finalFare=

50+(distance*10);



finalFare=

finalFare-(finalFare*discount/100);





document.getElementById("distance").innerHTML=

"Distance: "+distance.toFixed(2)+" KM";



document.getElementById("fare").innerHTML=

"Fare: ₹"+Math.round(finalFare);



}








window.bookRide=async function(){



let ride=

await addDoc(

collection(db,"rides"),

{


pickupLat,

pickupLng,


dropLat,

dropLng,


distance,


service:

document.getElementById("service").value,


fare:

"₹"+Math.round(finalFare),


status:"Pending",


paymentStatus:"Pending",


createdAt:serverTimestamp()


}

);




localStorage.setItem(

"rideId",

ride.id

);



alert("Ride Booked ✅");



location.href="ride-status.html";


}



</script>


</body>

</html>
