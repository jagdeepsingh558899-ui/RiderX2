<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Book Ride</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">


<style>

body{
background:#000;
color:white;
margin:0;
font-family:Arial;
}


.topbar{
background:#111;
padding:15px;
text-align:center;
border-bottom:2px solid #FFD600;
}


.topbar h1{
margin:0;
}


.topbar span{
color:#FFD600;
}


.container{
padding:15px;
}


#map{

width:100%;
height:400px;
border-radius:20px;
margin-bottom:15px;
}


input,
select,
button{

width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;
font-size:16px;

}


input,select{

background:white;
color:black;

}


button{

background:#FFD600;
font-weight:bold;

}


.info{

background:#111;
padding:15px;
border-radius:15px;
margin-top:15px;

}


</style>


</head>


<body>


<div class="topbar">

<h1>
RIDER<span>X</span>
</h1>

</div>



<div class="container">



<div id="map"></div>



<select id="service">

<option value="Bike Taxi">🏍 Bike Taxi</option>

<option value="Cab">🚕 Cab</option>

<option value="Parcel">📦 Parcel</option>

<option value="Food">🍔 Food</option>

</select>



<input 
id="pickup"
placeholder="Pickup Location"
readonly>



<input 
id="drop"
placeholder="Drop Location"
readonly>



<div class="info">


<p>
Distance:
<span id="distance">0 KM</span>
</p>


<p>
Fare:
₹<span id="fare">0</span>
</p>


</div>



<button id="locationBtn">

📍 Use Current Location

</button>



<button id="bookBtn">

Confirm Booking

</button>



</div>




<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>


<script type="module" src="../js/booking.js"></script>


</body>

</html>
