:root{
    --yellow:#FFD400;
    --black:#080808;
    --dark:#111;
    --card:#191919;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.booking-page{
    width:100%;
    max-width:650px;
    height:100vh;
    height:100dvh;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:#111;
}

/* =========================================================
   MAP
========================================================= */

#map{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

.leaflet-control-attribution{
    font-size:7px !important;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;
    padding:12px;
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:none;
}

.top-btn{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:rgba(15,15,15,.94);
    color:#fff;
    font-size:21px;
    box-shadow:0 3px 14px rgba(0,0,0,.3);
    cursor:pointer;
    pointer-events:auto;
}

.top-title{
    flex:1;
    background:rgba(15,15,15,.94);
    border-radius:22px;
    height:43px;
    display:flex;
    align-items:center;
    padding:0 14px;
    font-size:12px;
    font-weight:900;
    box-shadow:0 3px 14px rgba(0,0,0,.3);
}

/* =========================================================
   LOCATION BUTTON
========================================================= */

.location-btn{
    position:absolute;
    right:13px;
    bottom:46%;
    z-index:20;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#000;
    font-size:19px;
    box-shadow:0 3px 15px rgba(0,0,0,.35);
    cursor:pointer;
}

/* =========================================================
   SHEET
========================================================= */

.booking-sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    height:42%;
    min-height:330px;
    max-height:88%;
    background:#101010;
    border-radius:25px 25px 0 0;
    border-top:1px solid #292929;
    box-shadow:0 -8px 30px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    transition:height .28s ease;
    touch-action:none;
}

.booking-sheet.expanded{
    height:82%;
}

.sheet-handle-area{
    height:34px;
    flex:none;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:grab;
}

.sheet-handle{
    width:42px;
    height:4px;
    background:#555;
    border-radius:10px;
}

.sheet-content{
    flex:1;
    overflow-y:auto;
    padding:0 14px 20px;
    touch-action:pan-y;
}

.sheet-content::-webkit-scrollbar{
    width:3px;
}

.sheet-content::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:10px;
}

/* =========================================================
   LOCATION
========================================================= */

.location-box{
    background:#191919;
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
}

.location-row{
    display:flex;
    align-items:center;
    min-height:54px;
    padding:8px 11px;
}

.location-row + .location-row{
    border-top:1px solid #292929;
}

.location-marker{
    width:30px;
    min-width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:9px;
    font-size:13px;
}

.pickup-marker{
    background:rgba(255,212,0,.15);
    color:var(--yellow);
}

.drop-marker{
    background:rgba(255,255,255,.08);
    color:#fff;
}

.location-input-wrap{
    flex:1;
    min-width:0;
}

.location-label{
    color:#666;
    font-size:7px;
    text-transform:uppercase;
    font-weight:800;
    margin-bottom:3px;
}

.location-input{
    width:100%;
    border:0;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:10px;
    font-family:inherit;
    text-overflow:ellipsis;
}

.location-input::placeholder{
    color:#777;
}

.swap-btn{
    width:29px;
    height:29px;
    border:1px solid #333;
    border-radius:8px;
    background:#222;
    color:#aaa;
    cursor:pointer;
}

/* =========================================================
   SEARCH
========================================================= */

.search-results{
    display:none;
    margin-top:6px;
    background:#181818;
    border:1px solid #303030;
    border-radius:12px;
    overflow:hidden;
}

.search-results.show{
    display:block;
}

.search-result{
    padding:10px;
    border-bottom:1px solid #292929;
    font-size:9px;
    color:#ccc;
    cursor:pointer;
}

.search-result:last-child{
    border-bottom:0;
}

.search-result:hover{
    background:#222;
}

/* =========================================================
   SERVICE
========================================================= */

.section-title{
    font-size:12px;
    font-weight:900;
    margin:16px 0 9px;
}

.services{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
}

.services::-webkit-scrollbar{
    display:none;
}

.service{

    min-width:82px;
    border:1px solid #303030;
    background:#181818;
    border-radius:14px;
    padding:10px 7px;
    color:#fff;
    cursor:pointer;
    text-align:center;
}

.service.active{

    border-color:var(--yellow);
}

.service-icon{
    font-size:21px;
    margin-bottom:5px;
}

.service-name{
    font-size:8px;
    font-weight:900;
}

.service-price{
    font-size:7px;
    margin-top:4px;
    opacity:.65;
}

/* =========================================================
   FARE
========================================================= */

.fare-card{
    margin-top:13px;
    padding:13px;
    background:#191919;
    border:1px solid var(--border);
    border-radius:15px;
}

.fare-row{

    align-items:center;
    margin-bottom:8px;
}

.fare-label{
    flex:1;
    color:#777;
    font-size:8px;
}

.fare-value{

    font-weight:800;
}

.total-row{

}

.total-row .fare-label{
    color:#fff;
    font-size:10px;
    font-weight:900;
}

.total-row .fare-value{
    color:var(--yellow);
    font-size:19px;
}

/* =========================================================
   PAYMENT
========================================================= */

.payment-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:11px;
}

.payment-option{
    flex:1;
    height:42px;
    border:1px solid #303030;
    background:#181818;
    color:#aaa;
    border-radius:11px;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
}

.payment-option.active{
    background:#222;
    border-color:var(--yellow);
    color:var(--yellow);
}

/* =========================================================
   BOOK BUTTON
========================================================= */

.book-btn{
    width:100%;
    height:52px;
    margin-top:13px;
    border:0;
    border-radius:14px;
    background:var(--yellow);
    color:#000;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.book-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* =========================================================
   LOADING
========================================================= */

.loading-overlay{
    position:absolute;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
}

.loading-overlay.show{
    display:flex;
}

.loading-box{
    width:175px;
    padding:20px;
    background:#181818;
    border:1px solid #333;
    border-radius:15px;
    text-align:center;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #333;
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 10px;
}

.loading-text{
    color:#aaa;
    font-size:9px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:absolute;
    z-index:120;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    width:calc(100% - 30px);
    padding:11px 13px;
    border-radius:11px;
    background:#222;
    border:1px solid #333;
    color:#fff;
    text-align:center;
    font-size:9px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.error{
    border-color:rgba(239,68,68,.5);
}

.toast.success{
    border-color:rgba(34,197,94,.5);
}

@media(max-width:390px){

    .booking-sheet{
        min-height:315px;
    }

    .service{
        min-width:76px;
    }

}

     RIDERX BOOKING ENGINE
     IMPORTANT:
     Firebase is initialized by firebase-config.js.
     booking.js uses that same Firebase instance.
========================================================= --><script type="module">

import {
    auth
} from "../firebase/firebase-config.js";

import {
    initBookingModule,
    setService,
    setPaymentMethod,
    setPickupLocation,
    setDropLocation,
    calculateFareEstimate,
    createRideRequest
} from "../js/booking.js";


window.RiderXBookingReady = false;

window.RiderXBookingAPI = {

    auth,

    initBookingModule,

    setService,

    setPaymentMethod,

    setPickupLocation,

    setDropLocation,

    calculateFareEstimate,

    createRideRequest

};


try{

    await initBookingModule();

    window.RiderXBookingReady = true;

    console.log(
        "RiderX booking engine ready."
    );

}catch(error){

    console.error(
        "RiderX booking engine initialization failed:",
        error
    );

}

</script><script>

/* =========================================================
   RIDERX CUSTOMER BOOKING PAGE
========================================================= */

const $ = id =>
    document.getElementById(id);


let map = null;

let pickupMarker = null;
let dropMarker = null;

let pickupCoords = null;
let dropCoords = null;

let selectedService = "bike";
let selectedPayment = "cash";

let routeDistanceKm = 0;
let routeDurationMin = 0;

let pickupSearchTimer = null;
let dropSearchTimer = null;

let toastTimer = null;

let sheetStartY = 0;
let sheetStartHeight = 0;
let draggingSheet = false;


/* =========================================================
   MAP
========================================================= */

function initMap(){

    const defaultCenter = [
        30.7333,
        76.7794
    ];

    map = L.map(
        "map",
        {
            zoomControl:false,
            attributionControl:true
        }
    ).setView(
        defaultCenter,
        13
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);


    L.control.zoom({
        position:"bottomleft"
    }).addTo(map);


    map.on(
        "click",
        function(event){

            if(!pickupCoords){

                setPickup(
                    event.latlng.lat,
                    event.latlng.lng
                );

            }else if(!dropCoords){

                setDrop(
                    event.latlng.lat,
                    event.latlng.lng
                );

            }

        }
    );

}


/* =========================================================
   CURRENT LOCATION
========================================================= */

function useCurrentLocation(){

    if(!navigator.geolocation){

        showToast(
            "Location is not supported on this device.",
            "error"
        );

        return;
    }


    showToast(
        "Finding your location..."
    );


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            setPickup(
                lat,
                lng
            );


            map.setView(
                [lat,lng],
                16
            );

        },

        error => {

            console.error(
                "Location error:",
                error
            );

            showToast(
                "Unable to get your location.",
                "error"
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:30000
        }

    );

}


/* =========================================================
   SET PICKUP
========================================================= */

function setPickup(
    lat,
    lng
){

    pickupCoords = {
        lat:Number(lat),
        lng:Number(lng)
    };


    if(pickupMarker){

        pickupMarker.setLatLng(
            [lat,lng]
        );

    }else{

        pickupMarker =
            L.marker(
                [lat,lng],
                {
                    draggable:true
                }
            ).addTo(map);


        pickupMarker.on(
            "dragend",
            function(){

                const p =
                    pickupMarker.getLatLng();

                pickupCoords = {
                    lat:p.lat,
                    lng:p.lng
                };

                reverseGeocode(
                    p.lat,
                    p.lng,
                    "pickup"
                );

            }
        );

    }


    reverseGeocode(
        lat,
        lng,
        "pickup"
    );

}


/* =========================================================
   SET DROP
========================================================= */

function setDrop(
    lat,
    lng
){

    dropCoords = {
        lat:Number(lat),
        lng:Number(lng)
    };


    if(dropMarker){

        dropMarker.setLatLng(
            [lat,lng]
        );

    }else{

        dropMarker =
            L.marker(
                [lat,lng],
                {
                    draggable:true
                }
            ).addTo(map);


        dropMarker.on(
            "dragend",
            function(){

                const p =
                    dropMarker.getLatLng();

                dropCoords = {
                    lat:p.lat,
                    lng:p.lng
                };

                reverseGeocode(
                    p.lat,
                    p.lng,
                    "drop"
                );

            }
        );

    }


    reverseGeocode(
        lat,
        lng,
        "drop"
    );

}


/* =========================================================
   SYNC LOCATION WITH BOOKING ENGINE
========================================================= */

function syncBookingLocations(){

    const api =
        window.RiderXBookingAPI;

    if(!api){

        return false;
    }


    if(
        pickupCoords
    ){

        api.setPickupLocation(
            pickupCoords.lat,
            pickupCoords.lng,
            $("pickupInput").value.trim()
        );

    }


    if(
        dropCoords
    ){

        api.setDropLocation(
            dropCoords.lat,
            dropCoords.lng,
            $("dropInput").value.trim()
        );

    }


    return true;

}


/* =========================================================
   REVERSE GEOCODE
========================================================= */

async function reverseGeocode(
    lat,
    lng,
    type
){

    try{

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/reverse?" +
                new URLSearchParams({
                    lat:lat,
                    lon:lng,
                    format:"json",
                    zoom:18
                }),
                {
                    headers:{
                        "Accept-Language":"en"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Reverse geocoding failed."
            );

        }


        const data =
            await response.json();


        const address =
            data.display_name ||
            `${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}`;


        if(type === "pickup"){

            $("pickupInput").value =
                address;

        }else{

            $("dropInput").value =
                address;

        }


        syncBookingLocations();

        calculateFare();

    }catch(error){

        console.error(
            "Reverse geocode:",
            error
        );

        syncBookingLocations();

        calculateFare();

    }

}


/* =========================================================
   SEARCH LOCATION
========================================================= */

async function searchLocation(
    query,
    type
){

    if(
        !query ||
        query.trim().length < 3
    ){

        hideSearchResults(type);

        return;
    }


    try{

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({
                    q:query + ", Chandigarh",
                    format:"json",
                    limit:5
                }),
                {
                    headers:{
                        "Accept-Language":"en"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Location search failed."
            );

        }


        const results =
            await response.json();


        showSearchResults(
            results,
            type
        );

    }catch(error){

        console.error(
            "Location search:",
            error
        );

    }

}


/* =========================================================
   SEARCH RESULTS
========================================================= */

function showSearchResults(
    results,
    type
){

    const container =
        type === "pickup"
            ? $("pickupResults")
            : $("dropResults");


    if(
        !Array.isArray(results) ||
        !results.length
    ){

        hideSearchResults(type);

        return;
    }


    container.innerHTML =
        "";


    results.forEach(
        result => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "search-result";


            item.textContent =
                result.display_name;


            item.onclick =
                function(){

                    const lat =
                        Number(
                            result.lat
                        );

                    const lon =
                        Number(
                            result.lon
                        );


                    if(type === "pickup"){

                        setPickup(
                            lat,
                            lon
                        );

                    }else{

                        setDrop(
                            lat,
                            lon
                        );

                    }


                    container.classList.remove(
                        "show"
                    );


                    map.setView(
                        [lat,lon],
                        15
                    );

                };


            container.appendChild(
                item
            );

        }
    );


    container.classList.add(
        "show"
    );

}


function hideSearchResults(
    type
){

    const container =
        type === "pickup"
            ? $("pickupResults")
            : $("dropResults");


    container.classList.remove(
        "show"
    );

}

/* =========================================================

========================================================= */

function swapLocations(){

    if(
        !pickupCoords &&
        !dropCoords
    ){

        return;
    }


    const oldPickupText =
        $("pickupInput").value;

    const oldDropText =
        $("dropInput").value;


    $("pickupInput").value =
        oldDropText;

    $("dropInput").value =
        oldPickupText;


    const oldCoords =
        pickupCoords;

    pickupCoords =
        dropCoords;

    dropCoords =
        oldCoords;


    if(
        pickupMarker &&
        pickupCoords
    ){

        pickupMarker.setLatLng([
            pickupCoords.lat,
            pickupCoords.lng
        ]);

    }


    if(
        dropMarker &&
        dropCoords
    ){

        dropMarker.setLatLng([
            dropCoords.lat,
            dropCoords.lng
        ]);

    }


    syncBookingLocations();

    calculateFare();

}

/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R =
        6371;


    const dLat =
        (lat2-lat1) *
        Math.PI /
        180;


    const dLon =
        (lon2-lon1) *
        Math.PI /
        180;


    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2) +

        Math.cos(
            lat1 *
            Math.PI /
            180
        ) *

        Math.cos(
            lat2 *
            Math.PI /
            180
        ) *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;

}


/* =========================================================
   FARE
========================================================= */

function calculateFare(){

    if(
        !pickupCoords ||
        !dropCoords
    ){

        routeDistanceKm =
            0;

        $("distanceText").textContent =
            "-- km";

        $("baseFare").textContent =
            "₹0";

        $("distanceFare").textContent =
            "₹0";

        $("bookingFee").textContent =
            "₹0";

        $("totalFare").textContent =
            "₹0";

        return;
    }


    routeDistanceKm =
        calculateDistance(
            pickupCoords.lat,
            pickupCoords.lng,
            dropCoords.lat,
            dropCoords.lng
        );


    routeDurationMin =
        Math.max(
            5,
            Math.round(
                routeDistanceKm * 3
            )
        );


    $("distanceText").textContent =
        routeDistanceKm.toFixed(1) +
        " km";


    let rate =
        8;

    let base =
        20;


    if(
        selectedService === "cab"
    ){

        rate = 12;
        base = 40;

    }else if(
        selectedService === "parcel"
    ){

        rate = 10;
        base = 25;

    }else if(
        selectedService === "food"
    ){

        rate = 10;
        base = 20;

    }


    const hour =
        new Date().getHours();


    if(
        selectedService === "bike"
    ){

        if(
            hour >= 22 ||
            hour < 6
        ){

            rate = 11;

        }else if(
            routeDistanceKm > 10
        ){

            rate = 9;

        }else{

            rate = 8;

        }

    }


    const distanceFare =
        routeDistanceKm *
        rate;


    const bookingFee =
        selectedService === "bike"
            ? 5
            : 10;


    const total =
        Math.max(
            base +
            distanceFare +
            bookingFee,
            base
        );


    $("baseFare").textContent =
        "₹" +
        Math.round(base);


    $("distanceFare").textContent =
        "₹" +
        Math.round(distanceFare);


    $("bookingFee").textContent =
        "₹" +
        bookingFee;


    $("totalFare").textContent =
        "₹" +
        Math.round(total);


    /*
     * Keep authoritative booking engine
     * state synchronized with this UI.
     */

    if(
        window.RiderXBookingAPI
    ){

        syncBookingLocations();

        window.RiderXBookingAPI
            .setService(
                selectedService
            );

    }

}

}


/* =========================================================
   BOOK RIDE
========================================================= */

async function bookRide(){

    const bookButton =
        $("bookBtn");


    if(
        bookButton.disabled
    ){

        return;
    }


    if(!pickupCoords){

        showToast(
            "Please select pickup location.",
            "error"
        );

        return;
    }


    if(!dropCoords){

        showToast(
            "Please select drop location.",
            "error"
        );

        return;
    }


    if(
        routeDistanceKm <= 0
    ){

        showToast(
            "Unable to calculate route distance.",
            "error"
        );

        return;
    }


    if(
        pickupCoords.lat === dropCoords.lat &&
        pickupCoords.lng === dropCoords.lng
    ){

        showToast(
            "Pickup and drop cannot be the same.",
            "error"
        );

        return;
    }


    const api =
        window.RiderXBookingAPI;


    if(!api){

        showToast(
            "RiderX booking engine is not ready. Please reload.",
            "error"
        );

        return;
    }


    const user =
        api.auth?.currentUser;


    if(!user){

        showToast(
            "Please login as customer first.",
            "error"
        );


        setTimeout(
            () => {

                window.location.href =
                    "../auth/login.html?role=customer";

            },
            900
        );


        return;
    }


    /*
     * VERY IMPORTANT:
     * Sync page state into the authoritative
     * RiderX booking engine before creating
     * the Firestore ride.
     */

    syncBookingLocations();


    api.setService(
        selectedService
    );


    api.setPaymentMethod(
        selectedPayment
    );


    api.calculateFareEstimate();


    setLoading(
        true,
        "Creating ride request..."
    );


    try{

        /*
         * This is the real Firebase booking path.
         *
         * js/booking.js -> Firestore -> rides/{rideId}
         */

        const booking =
            await api.createRideRequest(
                selectedPayment
            );


        if(!booking){

            throw new Error(
                "Ride request was not created."
            );

        }


        const rideId =
            typeof booking === "string"
                ? booking
                : (
                    booking.id ||
                    booking.rideId ||
                    booking.bookingId ||
                    ""
                );


        if(!rideId){

            throw new Error(
                "Firebase created the ride but no ride ID was returned."
            );

        }


        /*
         * Save only the real Firebase ride ID.
         * No fake/local booking is created.
         */

        localStorage.setItem(
            "riderx_active_ride_id",
            rideId
        );


        localStorage.setItem(
            "riderxPendingBooking",
            JSON.stringify({
                rideId:rideId,
                customerId:user.uid,
                status:"searching"
            })
        );


        setLoading(
            true,
            "Ride request sent..."
        );


        showToast(
            "Ride request sent successfully.",
            "success"
        );


        setTimeout(
            function(){

                let url =
                    "searching.html";


                url +=
                    "?rideId=" +
                    encodeURIComponent(
                        rideId
                    );


                window.location.href =
                    url;

            },
            600
        );


    }catch(error){

        console.error(
            "RiderX ride creation error:",
            error
        );


        setLoading(
            false
        );


        let message =
            error?.message ||
            "Unable to create ride.";


        /*
         * Make Firebase permission errors
         * easier to understand.
         */

        if(
            error?.code ===
            "permission-denied"
        ){

            message =
                "Firestore permission denied. Please publish the correct Firestore rules.";

        }


        if(
            error?.code ===
            "unauthenticated"
        ){

            message =
                "Customer login expired. Please login again.";

        }


        showToast(
            message,
            "error"
        );

    }

}

/* =========================================================
   DRAGGABLE SHEET
========================================================= */

const sheet =
    $("bookingSheet");

const handle =
    $("sheetHandle");


function startSheetDrag(
    y
){

    draggingSheet =
        true;

    sheetStartY =
        y;

    sheetStartHeight =
        sheet.getBoundingClientRect()
            .height;

}


function moveSheetDrag(
    y
){

    if(!draggingSheet){

        return;
    }


    const delta =
        sheetStartY - y;


    const viewport =
        window.innerHeight;


    let newHeight =
        sheetStartHeight +
        delta;


    const minHeight =
        315;


    const maxHeight =
        viewport * .88;


    newHeight =
        Math.max(
            minHeight,
            Math.min(
                maxHeight,
                newHeight
            )
        );


    sheet.style.height =
        newHeight +
        "px";


    sheet.classList.remove(
        "expanded"
    );

}


function endSheetDrag(){

    if(!draggingSheet){

        return;
    }


    draggingSheet =
        false;


    const height =
        sheet.getBoundingClientRect()
            .height;


    const viewport =
        window.innerHeight;


    sheet.style.height =
        "";


    if(
        height >
        viewport * .58
    ){

        sheet.classList.add(
            "expanded"
        );

    }else{

        sheet.classList.remove(
            "expanded"
        );

    }

}


handle.addEventListener(
    "touchstart",
    function(event){

        startSheetDrag(
            event.touches[0].clientY
        );

    },
    {
        passive:true
    }
);


handle.addEventListener(
    "touchmove",
    function(event){

        moveSheetDrag(
            event.touches[0].clientY
        );

    },
    {
        passive:true
    }
);


handle.addEventListener(
    "touchend",
    endSheetDrag
);


handle.addEventListener(
    "mousedown",
    function(event){

        startSheetDrag(
            event.clientY
        );

    }
);


document.addEventListener(
    "mousemove",
    function(event){

        moveSheetDrag(
            event.clientY
        );

    }
);


document.addEventListener(
    "mouseup",
    endSheetDrag
);


handle.addEventListener(
    "click",
    function(){

        sheet.classList.toggle(
            "expanded"
        );

    }
);
