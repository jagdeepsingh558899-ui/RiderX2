<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Book Ride</title>


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


</head>


<body>



<div class="topbar">

<h2>
🏍 Book Ride
</h2>

</div>





<div class="container">





<div class="map-container">

<div id="map"></div>

</div>






<div class="card">



<h3>
Select Service
</h3>



<select id="service" class="input">


<option>
Bike Taxi
</option>


<option>
Cab
</option>


<option>
Parcel
</option>


<option>
Food
</option>


</select>





<input

id="pickup"

class="input"

placeholder="Pickup Location"

readonly

>





<button id="locationBtn" class="btn">

📍 Use My Location

</button>







<input

id="drop"

class="input"

placeholder="Drop Location"

>





</div>








<div class="card">



<h3>
Payment Method
</h3>



<select id="paymentMethod" class="input">


<option value="Cash">

💵 Cash

</option>



<option value="Online">

💳 Online Payment

</option>



</select>



</div>








<div class="booking-card">



<div class="booking-title">


<h3>
Fare
</h3>


<div class="booking-price">

₹<span id="fare">

0

</span>

</div>


</div>




<div class="booking-row">

<span>
Distance
</span>


<b id="distance">

-

</b>


</div>




</div>







<button id="bookBtn" class="btn">


Confirm Booking


</button>







</div>







<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/booking.js"></script>



</body>

</html>
