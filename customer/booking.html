<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Book Ride</title>


<link rel="stylesheet" href="../css/style.css">


<style>


body{

margin:0;

background:#000;

color:white;

font-family:Arial,sans-serif;

}



.header{

background:#111;

padding:20px;

color:#FFD600;

font-size:25px;

font-weight:bold;

}



.container{

padding:20px;

}



.box{

background:#111;

padding:20px;

border-radius:20px;

margin-bottom:20px;

}



input,select{


width:100%;

padding:15px;

margin:10px 0;

background:#222;

border:none;

border-radius:12px;

color:white;

font-size:16px;

box-sizing:border-box;

}



.services{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}



.service{


background:#222;

padding:15px;

border-radius:15px;

text-align:center;

cursor:pointer;

}



.service.active{

background:#FFD600;

color:#000;

}



.payment{

display:flex;

gap:10px;

}



.payment button{

flex:1;

padding:12px;

border:none;

border-radius:12px;

background:#222;

color:white;

}



.payment .active{

background:#FFD600;

color:#000;

}



.fare{

font-size:22px;

color:#FFD600;

font-weight:bold;

}



.book{

background:#FFD600;

color:#000;

padding:16px;

border-radius:15px;

text-align:center;

font-weight:bold;

font-size:18px;

cursor:pointer;

}



</style>


</head>



<body>



<div class="header">

🏍 RiderX Booking

</div>




<div class="container">



<div class="box">


<h3>
Pickup Location
</h3>


<input

id="pickup"

placeholder="Enter pickup location">





<h3>
Drop Location
</h3>


<input

id="drop"

placeholder="Enter drop location">


</div>







<div class="box">


<h3>
Select Service
</h3>



<div class="services">


<div class="service active" data-type="bike">

🏍

<br>

Bike Taxi

</div>



<div class="service" data-type="cab">

🚕

<br>

Cab

</div>



<div class="service" data-type="parcel">

📦

<br>

Parcel

</div>



<div class="service" data-type="food">

🍔

<br>

Food

</div>


</div>


</div>







<div class="box">


<h3>
Payment

</h3>


<div class="payment">


<button class="active">

Cash

</button>


<button>

Online

</button>


</div>


</div>






<div class="box">


<h3>
Estimated Fare

</h3>


<div class="fare" id="fare">

₹0

</div>


</div>







<div class="book" id="bookRide">

Request Ride

</div>





</div>








<script type="module" src="../js/booking.js"></script>



</body>

</html>
