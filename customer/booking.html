<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Book Ride</title>

<link rel="icon" href="../assets/logo.png">


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Dashboard.css">
<link rel="stylesheet" href="../css/Responsive.css">
<link rel="stylesheet" href="../css/Animation.css">

</head>


<body>


<nav class="navbar">

<div class="logo">

<img src="../assets/logo.png">

<span>RiderX</span>

</div>

</nav>





<div class="dashboard-wrapper page">



<div class="booking-box">


<h1>📍 Book Your Ride</h1>


<br>



<div class="ride-type">


<div class="option active" data-type="Bike Taxi">
🏍 Bike Taxi
</div>


<div class="option" data-type="Cab">
🚕 Cab
</div>


<div class="option" data-type="Parcel">
📦 Parcel
</div>


<div class="option" data-type="Food">
🍔 Food
</div>


</div>





<!-- Live Map -->

<div id="map" class="map-container"></div>



<br>



<div class="input-box">

<label>Pickup Location</label>

<input id="pickup" placeholder="Current location">

</div>




<div class="input-box">

<label>Drop Location</label>

<input id="drop" placeholder="Enter destination">

</div>




<div class="card">


<h3>
Fare:
<span id="fare">₹0</span>
</h3>


<p>
Distance:
<span id="distance">0 KM</span>
</p>


</div>





<button id="bookRide" class="btn">

🚀 Book Ride

</button>





<!-- Tracking Status -->

<div class="card">


<h2>Ride Status</h2>


<p id="rideStatus">

Searching Rider...

</p>


<div id="riderInfo">


</div>


</div>




</div>


</div>








<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script type="module" src="../js/Map.js"></script>

<script type="module" src="../js/Booking.js"></script>

<script type="module" src="../js/CustomerRide.js"></script>


</body>

</html>
