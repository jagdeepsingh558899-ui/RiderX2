<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

.header{
    background:#ffcc00;
    color:#000;
    padding:20px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.container{
    padding:20px;
}


.box{

background:#1d1d1d;
padding:20px;
border-radius:15px;

}


input,select{

width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:none;
font-size:16px;

}


button{

width:100%;
padding:15px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;
font-size:17px;

}


.back{

display:block;
margin-top:15px;
background:#ffcc00;
color:#000;
padding:12px;
text-align:center;
border-radius:10px;
text-decoration:none;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">
🚕 Book Your Ride
</div>


<div class="container">


<div class="box">


<select id="service">

<option value="Bike Taxi">
🏍 Bike Taxi
</option>

<option value="Cab">
🚕 Cab
</option>

<option value="Parcel">
📦 Parcel
</option>

<option value="Food">
🍔 Food
</option>

</select>



<input 
id="pickup"
placeholder="Pickup Location">


<input 
id="drop"
placeholder="Drop Location">



<input 
id="fare"
placeholder="Estimated Fare"
readonly>



<button onclick="calculateFare()">
Calculate Fare
</button>



<button onclick="bookRide()">
Confirm Booking
</button>



</div>


<a class="back" href="dashboard.html">
⬅ Back Dashboard
</a>


</div>



<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
addDoc

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



function calculateFare(){

let service=document.getElementById("service").value;

let price=0;


if(service=="Bike Taxi"){
price=50;
}

else if(service=="Cab"){
price=150;
}

else if(service=="Parcel"){
price=80;
}

else{
price=100;
}


document.getElementById("fare").value="₹"+price;


}



window.calculateFare=calculateFare;



window.bookRide=async function(){


let pickup=document.getElementById("pickup").value;

let drop=document.getElementById("drop").value;

let service=document.getElementById("service").value;

let fare=document.getElementById("fare").value;



if(!pickup || !drop){

alert("Please enter pickup and drop");

return;

}



await addDoc(collection(db,"rides"),{


pickup:pickup,

drop:drop,

service:service,

fare:fare,

status:"Pending",

createdAt:new Date()


});



alert("Ride booked successfully");


window.location.href="history.html";


}



</script>


</body>

</html>
