<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiderX - Book Your Ride</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../firebase/firebase-config.js"></script>
  <script src="../js/fare-calculator.js"></script>
  
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }
    .booking-panel {
      background: #1E1E1E;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .service-card {
      background: #2A2A2A;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .service-card.active {
      border-color: #FFC107;
      background: #332B00;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2A2A2A;
      color: #FFF;
      box-sizing: border-box;
    }
    .btn-action {
      width: 100%;
      padding: 14px;
      background-color: #FFC107;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .fare-display {
      font-size: 18px;
      font-weight: bold;
      color: #FFC107;
      margin: 10px 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="booking-panel">
    <h3>Select Service</h3>
    <div class="service-grid">
      <div class="service-card active" onclick="selectService('bike', this)">
        <div>🏍️</div>
        <small>Bike</small>
      </div>
      <div class="service-card" onclick="selectService('cab', this)">
        <div>🚗</div>
        <small>Cab</small>
      </div>
      <div class="service-card" onclick="selectService('parcel', this)">
        <div>📦</div>
        <small>Parcel</small>
      </div>
      <div class="service-card" onclick="selectService('food', this)">
        <div>🍔</div>
        <small>Food</small>
      </div>
    </div>

    <div class="input-group">
      <input type="text" id="pickup" placeholder="Pickup Location (e.g., Connaught Place)" value="Connaught Place">
    </div>
    <div class="input-group">
      <input type="text" id="drop" placeholder="Drop Location (e.g., Cyber Hub)" value="Cyber Hub">
    </div>

    <div class="fare-display" id="fareAmount">Estimated Fare: ₹0</div>

    <button class="btn-action" onclick="requestRide()">Book Ride Now</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let selectedService = 'bike';
    let map, pickupMarker, dropMarker;
    let pickupCoords = [28.6139, 77.2090]; // Default Delhi Lat/Lng
    let dropCoords = [28.4595, 77.0266];   // Default Gurgaon Lat/Lng

    // Initialize Leaflet Map
    document.addEventListener("DOMContentLoaded", () => {
      map = L.map('map').setView(pickupCoords, 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      pickupMarker = L.marker(pickupCoords).addTo(map).bindPopup("Pickup").openPopup();
      dropMarker = L.marker(dropCoords).addTo(map).bindPopup("Drop");

      calculateFare();
    });

    function selectService(service, element) {
      selectedService = service;
      document.querySelectorAll('.service-card').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      calculateFare();
    }

    function calculateFare() {
      const distance = FareCalculator.calculateDistance(
        pickupCoords[0], pickupCoords[1],
        dropCoords[0], dropCoords[1]
      );
      const fareDetails = FareCalculator.calculateFare(selectedService, distance);
      document.getElementById('fareAmount').innerText = `Estimated Fare: ₹${fareDetails.fare} (${distance} km)`;
    }

    function requestRide() {
      const user = auth.currentUser;
      if (!user) {
        alert("Please login first to book a ride.");
        window.location.href = "../auth/login.html";
        return;
      }

      const distance = FareCalculator.calculateDistance(
        pickupCoords[0], pickupCoords[1],
        dropCoords[0], dropCoords[1]
      );
      const fareDetails = FareCalculator.calculateFare(selectedService, distance);

      db.collection('rides').add({
        customerId: user.uid,
        customerName: user.displayName || "Customer",
        serviceType: selectedService,
        pickup: {
          address: document.getElementById('pickup').value,
          lat: pickupCoords[0],
          lng: pickupCoords[1]
        },
        drop: {
          address: document.getElementById('drop').value,
          lat: dropCoords[0],
          lng: dropCoords[1]
        },
        fare: fareDetails.fare,
        distanceKm: distance,
        status: 'SEARCHING',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then((docRef) => {
        alert("Ride Requested Successfully! Searching for nearby riders...");
      }).catch((error) => {
        console.error("Booking Error: ", error);
        alert("Booking failed. Please try again.");
      });
    }
  </script>
</body>
</html>
