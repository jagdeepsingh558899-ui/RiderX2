<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

#map{

width:100%;
height:350px;
border-radius:20px;

}


.container{

padding:15px;

}


input,select,button{

width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;

}


button{

background:#FFD600;
font-weight:bold;

}


</style>


</head>


<body>



<div class="header">

🏍 Book Ride

</div>



<div class="container">


<div id="map"></div>



<select id="service">

<option value="Bike Taxi">

🏍 Bike Taxi

</option>

<option value="Cab">

🚕 Cab

</option>

<option value="Parcel">

📦 Parcel

</option>

<option value="Food">

🍔 Food

</option>


</select>



<input id="pickup" placeholder="Pickup Location" readonly>


<button id="locationBtn">

📍 Use My Location

</button>



<input id="drop" placeholder="Drop Location">



<p>

Distance:

<span id="distance">-</span>

</p>



<p>

Fare:

₹<span id="fare">0</span>

</p>



<button id="bookBtn">

Confirm Booking

</button>



</div>




<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/booking.js"></script>



<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function loadServices(){



const snap = await getDoc(

doc(db,"settings","services")

);



if(!snap.exists()) return;



let data=snap.data();



let select=document.getElementById("service");



[...select.options].forEach(option=>{


let name=option.value;



if(

name==="Bike Taxi" && !data.bike

){

option.style.display="none";

}



if(

name==="Cab" && !data.cab

){

option.style.display="none";

}



if(

name==="Parcel" && !data.parcel

){

option.style.display="none";

}



if(

name==="Food" && !data.food

){

option.style.display="none";

}



});



}



loadServices();



</script>



</body>

</html>
