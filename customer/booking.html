<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>RiderX | Book Ride</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

:root{
    --yellow:#ffe500;
    --black:#050505;
    --card:#111;
    --card2:#181818;
    --line:#2b2b2b;
    --green:#22c55e;
    --red:#ef4444;
    --white:#fff;
    --muted:#888;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
}

body{
    position:relative;
}

/* MAP */

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.leaflet-control-zoom{
    margin-top:75px!important;
}

.leaflet-control-zoom a{
    background:#111!important;
    color:var(--yellow)!important;
    border-color:#333!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
}

/* TOP */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:14px;
    pointer-events:none;
}

.topbar-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:rgba(10,10,10,.94);
    color:#fff;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 18px rgba(0,0,0,.4);
    pointer-events:auto;
}

.top-btn:active{
    transform:scale(.94);
}

.logo{
    background:rgba(10,10,10,.94);
    padding:9px 17px;
    border-radius:15px;
    font-size:17px;
    font-weight:800;
    letter-spacing:.4px;
    box-shadow:0 5px 18px rgba(0,0,0,.4);
}

.logo span{
    color:var(--yellow);
}

/* GPS */

.gps-ring{
    position:absolute;
    top:72px;
    right:15px;
    z-index:900;
}

.gps-btn{
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:#111;
    color:var(--yellow);
    font-size:17px;
    box-shadow:0 5px 18px rgba(0,0,0,.4);
}

/* CENTER PIN */

.center-marker{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-100%);
    z-index:600;
    pointer-events:none;
    display:none;
}

.pin{
    width:44px;
    height:44px;
    background:var(--yellow);
    color:#000;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.pin i{
    transform:rotate(45deg);
}

/* STATUS */

.status-pill{
    position:absolute;
    top:73px;
    left:50%;
    transform:translateX(-50%);
    z-index:900;
    padding:8px 15px;
    border-radius:30px;
    background:rgba(10,10,10,.94);
    color:#fff;
    font-size:10px;
    white-space:nowrap;
    box-shadow:0 5px 18px rgba(0,0,0,.35);
}

/* BOTTOM SHEET */

.booking-sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:1000;

    background:#080808;

    border-radius:25px 25px 0 0;

    padding:14px;

    max-height:65vh;
    overflow-y:auto;

    box-shadow:0 -12px 35px rgba(0,0,0,.55);
}

.handle{
    width:44px;
    height:5px;
    border-radius:20px;
    background:#444;
    margin:0 auto 14px;
}

.title{
    font-size:19px;
    font-weight:800;
}

.subtitle{
    margin-top:3px;
    margin-bottom:13px;
    color:#777;
    font-size:11px;
}

/* LOCATION */

.location-box{
    background:var(--card2);
    border-radius:17px;
    border:1px solid #242424;
    overflow:hidden;
}

.location-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
}

.location-row + .location-row{
    border-top:1px solid var(--line);
}

.location-dot{
    width:26px;
    height:26px;
    min-width:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
}

.pick-dot{
    background:#12351f;
    color:var(--green);
}

.drop-dot{
    background:#3b3500;
    color:var(--yellow);
}

.location-input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:12px;
}

.location-input::placeholder{
    color:#666;
}

.location-action{
    width:36px;
    height:36px;
    min-width:36px;
    border:0;
    border-radius:50%;
    background:#252525;
    color:var(--yellow);
}

.location-action:active{
    transform:scale(.94);
}

/* SEARCH RESULTS */

.search-results{
    display:none;
    max-height:160px;
    overflow-y:auto;
    border-top:1px solid #292929;
}

.search-results.show{
    display:block;
}

.search-item{
    padding:10px 12px;
    border-bottom:1px solid #222;
    font-size:11px;
    color:#ddd;
}

.search-item:last-child{
    border-bottom:0;
}

.search-item:active{
    background:#222;
}

/* SERVICES */

.services{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:13px;
}

.service{
    background:#151515;
    border:1px solid #2c2c2c;
    border-radius:15px;
    padding:11px 4px;
    text-align:center;
    color:#888;
}

.service i{
    font-size:18px;
}

.service span{
    display:block;
    margin-top:4px;
    font-size:9px;
}

.service.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#000;
}

/* ESTIMATE */

.estimate{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.info-card{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    padding:11px;
}

.info-label{
    color:#777;
    font-size:9px;
}

.info-value{
    margin-top:3px;
    font-size:14px;
    font-weight:700;
}

/* FARE */

.fare-card{
    margin-top:10px;
    background:#151515;
    border:1px solid #292929;
    border-radius:15px;
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.fare-label{
    font-size:11px;
    color:#999;
}

.fare-sub{
    margin-top:3px;
    font-size:9px;
    color:#666;
}

.price{
    color:var(--yellow);
    font-size:23px;
    font-weight:800;
}

/* PAYMENT */

.payment-title{
    margin-top:12px;
    margin-bottom:7px;
    font-size:10px;
    color:#777;
}

.payment{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.payment-option{
    padding:10px 5px;
    border:1px solid #303030;
    border-radius:12px;
    background:#151515;
    color:#888;
    text-align:center;
    font-size:9px;
}

.payment-option i{
    display:block;
    margin-bottom:4px;
    font-size:14px;
}

.payment-option.active{
    border-color:var(--yellow);
    color:var(--yellow);
    background:#1b1b00;
}

/* BOOK */

.book-btn{
    width:100%;
    margin-top:13px;
    padding:15px;
    border:0;
    border-radius:15px;
    background:var(--yellow);
    color:#000;
    font-size:15px;
    font-weight:800;
}

.book-btn:disabled{
    background:#3c3c3c;
    color:#777;
}

.book-btn:active{
    transform:scale(.985);
}

/* SEARCHING */

.searching-overlay{
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:flex-end;
}

.searching-overlay.show{
    display:flex;
}

.searching-box{
    width:100%;
    background:#0b0b0b;
    border-radius:25px 25px 0 0;
    padding:25px 20px 30px;
    text-align:center;
}

.loader{
    width:45px;
    height:45px;
    border-radius:50%;
    border:4px solid #333;
    border-top-color:var(--yellow);
    animation:spin 1s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.searching-title{
    font-size:18px;
    font-weight:800;
}

.searching-text{
    margin-top:5px;
    color:#777;
    font-size:11px;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,100px);
    z-index:6000;
    background:#111;
    border:1px solid #333;
    padding:11px 17px;
    border-radius:13px;
    font-size:11px;
    opacity:0;
    transition:.25s;
    pointer-events:none;
    max-width:90%;
    text-align:center;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

.toast.success{
    border-color:#22c55e;
}

.toast.error{
    border-color:#ef4444;
}

/* MOBILE */

@media(max-width:380px){

    .booking-sheet{
        max-height:68vh;
        padding:12px;
    }

    .service{
        padding:9px 3px;
    }

    .service i{
        font-size:16px;
    }

    .title{
        font-size:17px;
    }

}

</style>

</head>
