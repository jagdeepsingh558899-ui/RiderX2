<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>RiderX | Book Ride</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>
:root{
    --yellow:#ffe500;
    --black:#000;
    --dark:#080808;
    --card:#141414;
    --card2:#1d1d1d;
    --line:#2b2b2b;
    --white:#fff;
    --muted:#8d8d8d;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
}

body{
    position:fixed;
    inset:0;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   MAP
========================================================= */

#map{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    background:#ddd;
}

.leaflet-control-zoom{
    display:none!important;
}

.leaflet-control-attribution{
    font-size:8px!important;
    padding:2px 4px!important;
}

.leaflet-container{
    font-family:Poppins,Arial,sans-serif;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1200;
    padding:
        max(10px,env(safe-area-inset-top))
        14px
        0;
    pointer-events:none;
}

.topbar-inner{
    height:54px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.top-btn{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(10,10,10,.94);
    color:#fff;
    font-size:17px;
    box-shadow:0 6px 24px rgba(0,0,0,.42);
    pointer-events:auto;
    transition:transform .15s ease;
}

.top-btn:active{
    transform:scale(.91);
}

.logo{
    padding:8px 17px;
    border-radius:15px;
    background:rgba(10,10,10,.94);
    color:#fff;
    font-size:17px;
    font-weight:800;
    letter-spacing:.4px;
    box-shadow:0 6px 24px rgba(0,0,0,.42);
}

.logo span{
    color:var(--yellow);
}


/* =========================================================
   NOTIFICATION BUTTON
========================================================= */

.notification-btn{
    position:relative;
}

.notification-dot{
    position:absolute;
    top:8px;
    right:8px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--yellow);
    border:2px solid #111;
    display:none;
}

.notification-dot.show{
    display:block;
}


/* =========================================================
   STATUS PILL
========================================================= */

.status-pill{
    position:fixed;
    top:
        calc(
            max(10px,env(safe-area-inset-top))
            + 63px
        );
    left:50%;
    transform:translateX(-50%);
    z-index:1100;
    max-width:88%;
    padding:8px 15px;
    border-radius:30px;
    background:rgba(15,15,15,.94);
    color:#fff;
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
    pointer-events:none;
}


/* =========================================================
   CENTER PIN
========================================================= */

.center-pin{
    position:fixed;
    left:50%;
    top:50%;
    z-index:500;
    transform:translate(-50%,-100%);
    pointer-events:none;
}

.center-pin-icon{
    width:45px;
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--yellow);
    color:#000;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    box-shadow:0 7px 20px rgba(0,0,0,.35);
}

.center-pin-icon i{
    transform:rotate(45deg);
}


/* =========================================================
   LOCATION BUTTON
========================================================= */

.location-btn{
    position:fixed;
    right:15px;
    bottom:calc(30vh + 18px);
    z-index:1050;
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#111;
    color:var(--yellow);
    font-size:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.45);
    transition:
        bottom .3s ease,
        transform .15s ease;
}

.location-btn:active{
    transform:scale(.92);
}


/* =========================================================
   BOTTOM SHEET
========================================================= */

.sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1000;

    max-height:88vh;

    padding:
        8px
        14px
        max(14px,env(safe-area-inset-bottom));

    background:rgba(8,8,8,.985);

    border-radius:28px 28px 0 0;

    box-shadow:0 -14px 42px rgba(0,0,0,.55);

    overflow-y:auto;
    overflow-x:hidden;

    transform:translateY(calc(100% - 30vh));

    transition:
        transform .32s cubic-bezier(.22,.8,.22,1);

    overscroll-behavior:contain;

    touch-action:pan-y;

    -webkit-overflow-scrolling:touch;
}

.sheet.dragging{
    transition:none;
}


/* =========================================================
   HANDLE
========================================================= */

.handle-area{
    width:100%;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    touch-action:none;
}

.handle-area:active{
    cursor:grabbing;
}

.handle{
    width:48px;
    height:5px;
    border-radius:10px;
    background:#555;
}

.handle-area:active .handle{
    width:58px;
    background:#777;
}


/* =========================================================
   CONTENT
========================================================= */

.sheet-content{
    padding-bottom:4px;
}

.title{
    font-size:20px;
    line-height:1.2;
    font-weight:800;
    margin:0 0 13px;
}


/* =========================================================
   LOCATION SEARCH
========================================================= */

.search-box{
    background:#151515;
    border-radius:17px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.045);
}

.search-row{
    min-height:57px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
}

.search-row + .search-row{
    border-top:1px solid #292929;
}

.location-dot{
    width:27px;
    height:27px;
    min-width:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:9px;
}

.pick-dot{
    background:#12351f;
    color:var(--green);
}

.drop-dot{
    background:#3a3300;
    color:var(--yellow);
}

.location-input{
    flex:1;
    width:100%;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:13px;
}

.location-input::placeholder{
    color:#777;
}

.map-select-btn{
    width:36px;
    height:36px;
    min-width:36px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#242424;
    color:var(--yellow);
}

.map-select-btn:active{
    transform:scale(.92);
}


/* =========================================================
   RECENT / LOCATION SUGGESTIONS
========================================================= */

.suggestions{
    display:none;
    margin-top:8px;
    background:#151515;
    border-radius:15px;
    overflow:hidden;
    border:1px solid #292929;
}

.suggestions.show{
    display:block;
}

.suggestion{
    min-height:52px;
    display:flex;
    align-items:center;
    gap:11px;
    padding:8px 12px;
    border:0;
    border-bottom:1px solid #282828;
    width:100%;
    background:transparent;
    color:#fff;
    text-align:left;
}

.suggestion:last-child{
    border-bottom:0;
}

.suggestion:active{
    background:#222;
}

.suggestion-icon{
    width:32px;
    height:32px;
    min-width:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#242424;
    color:var(--yellow);
}

.suggestion-title{
    font-size:12px;
    font-weight:600;
}

.suggestion-subtitle{
    font-size:9px;
    color:#777;
    margin-top:2px;
}


/* =========================================================
   SERVICES
========================================================= */

.section-title{
    margin-top:15px;
    margin-bottom:8px;
    color:#999;
    font-size:12px;
    font-weight:500;
}

.services{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.service{
    min-height:74px;
    border:1px solid #303030;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    background:#151515;
    color:#aaa;
    transition:
        transform .15s ease,
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
}

.service:active{
    transform:scale(.95);
}

.service i{
    font-size:19px;
}

.service span{
    font-size:10px;
}

.service.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#000;
    box-shadow:0 5px 16px rgba(255,229,0,.12);
}


/* =========================================================
   FARE
========================================================= */

.fare-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:14px;
    padding:14px;
    background:#151515;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.04);
}

.fare-label{
    font-size:13px;
    font-weight:600;
}

.fare-info{
    margin-top:3px;
    color:#777;
    font-size:10px;
}

.fare-price{
    color:var(--yellow);
    font-size:23px;
    font-weight:800;
    white-space:nowrap;
}


/* =========================================================
   DISTANCE
========================================================= */

.distance{
    text-align:center;
    margin-top:8px;
    color:#777;
    font-size:10px;
}


/* =========================================================
   PAYMENT
========================================================= */

.payment-row{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:10px;
    padding:13px;
    background:#151515;
    border-radius:15px;
}

.payment-icon{
    color:var(--yellow);
}

#paymentMethod{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:#151515;
    color:#fff;
    font-size:13px;
}


/* =========================================================
   BOOK BUTTON
========================================================= */

.book-btn{
    width:100%;
    min-height:54px;
    margin-top:14px;
    border:0;
    border-radius:16px;
    background:var(--yellow);
    color:#000;
    font-size:16px;
    font-weight:800;
    box-shadow:0 5px 20px rgba(255,229,0,.12);
    transition:transform .15s ease,background .2s ease;
}

.book-btn:active{
    transform:scale(.985);
}

.book-btn:disabled{
    background:#3e3e3e;
    color:#888;
    box-shadow:none;
}


/* =========================================================
   LOADING
========================================================= */

.book-btn.loading{
    pointer-events:none;
}

.book-btn.loading i{
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   BOOKING STATUS
========================================================= */

#bookingStatus{
    min-height:20px;
    margin-top:9px;
    text-align:center;
    color:var(--yellow);
    font-size:11px;
}


/* =========================================================
   ACTIVE RIDE
========================================================= */

.active-ride{
    display:none;
    margin-top:12px;
    padding:13px;
    background:#151515;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.04);
}

.active-ride.show{
    display:block;
}

.active-ride-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.active-title{
    font-size:13px;
    font-weight:700;
}

.active-status{
    color:var(--yellow);
    font-size:11px;
    text-align:right;
}

.cancel-btn{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:1px solid #3a2020;
    border-radius:12px;
    background:#170909;
    color:#ff6b6b;
    font-size:12px;
    font-weight:600;
}

.cancel-btn:active{
    transform:scale(.985);
}


/* =========================================================
   SHEET STATES
========================================================= */

body.sheet-expanded .sheet{
    transform:translateY(0);
}

body.sheet-expanded .location-btn{
    bottom:calc(88vh + 12px);
}

body.sheet-collapsed .sheet{
    transform:translateY(calc(100% - 30vh));
}

body.sheet-collapsed .location-btn{
    bottom:calc(30vh + 18px);
}


/* =========================================================
   DESKTOP / TABLET
========================================================= */

@media(min-width:700px){

    .sheet{
        left:50%;
        right:auto;
        width:520px;
        transform:
            translate(
                -50%,
                calc(100% - 30vh)
            );
    }

    body.sheet-expanded .sheet{
        transform:translate(-50%,0);
    }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:380px){

    .topbar{
        padding-left:10px;
        padding-right:10px;
    }

    .top-btn{
        width:42px;
        height:42px;
    }

    .logo{
        padding:7px 14px;
        font-size:15px;
    }

    .sheet{
        padding-left:11px;
        padding-right:11px;
    }

    .title{
        font-size:18px;
    }

    .service{
        min-height:66px;
    }

    .service i{
        font-size:17px;
    }
}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .sheet,
    .service,
    .top-btn,
    .book-btn{
        transition:none!important;
    }
}
</style>
</head>

<!-- =======================================================
     BOOKING PAGE CONTROLLER
======================================================== -->

<script type="module">

document.addEventListener(
    "DOMContentLoaded",
    function(){

        "use strict";


        /* ==================================================
           ELEMENTS
        ================================================== */

        const sheet =
            document.getElementById(
                "bookingSheet"
            );

        const handle =
            document.getElementById(
                "sheetHandle"
            );

        const backButton =
            document.getElementById(
                "backButton"
            );

        const locationButton =
            document.getElementById(
                "floatingLocation"
            );

        const mainLocation =
            document.getElementById(
                "myLocation"
            );

        const notificationButton =
            document.getElementById(
                "notificationButton"
            );


        /* ==================================================
           BACK
        ================================================== */

        if(backButton){

            backButton.addEventListener(
                "click",
                function(){

                    if(
                        window.history.length > 1
                    ){

                        window.history.back();

                    }else{

                        window.location.href =
                            "./Home.html";

                    }

                }
            );

        }


        /* ==================================================
           CURRENT LOCATION
        ================================================== */

        if(locationButton){

            locationButton.addEventListener(
                "click",
                function(){

                    if(mainLocation){

                        mainLocation.click();

                        return;
                    }


                    if(
                        navigator.geolocation
                    ){

                        navigator.geolocation.getCurrentPosition(
                            function(position){

                                window.dispatchEvent(
                                    new CustomEvent(
                                        "riderx:current-location",
                                        {
                                            detail:{
                                                lat:
                                                    position.coords.latitude,

                                                lng:
                                                    position.coords.longitude
                                            }
                                        }
                                    )
                                );

                            },
                            function(){

                                console.warn(
                                    "RiderX: Location permission unavailable."
                                );

                            },
                            {
                                enableHighAccuracy:true,
                                timeout:10000,
                                maximumAge:5000
                            }
                        );

                    }

                }
            );

        }


        /* ==================================================
           NOTIFICATION
        ================================================== */

        if(notificationButton){

            notificationButton.addEventListener(
                "click",
                function(){

                    /*
                     * If notification page exists,
                     * open it. Otherwise trigger the
                     * notification permission helper.
                     */

                    if(
                        window.RiderX &&
                        window.RiderX.enableNotification
                    ){

                        window.RiderX
                            .enableNotification()
                            .catch(
                                function(error){
                                    console.error(error);
                                }
                            );

                    }else{

                        window.dispatchEvent(
                            new CustomEvent(
                                "riderx:notification-open"
                            )
                        );

                    }

                }
            );

        }


        /* ==================================================
           ACTIVE RIDE
        ================================================== */

        const activeRide =
            document.getElementById(
                "activeRide"
            );

        const activeStatus =
            document.getElementById(
                "activeRideStatus"
            );


        window.addEventListener(
            "riderx:ride-created",
            function(){

                if(activeRide){

                    activeRide.classList.add(
                        "show"
                    );

                }

                if(activeStatus){

                    activeStatus.textContent =
                        "Searching...";

                }

                expandSheet();

            }
        );


        window.addEventListener(
            "riderx:ride-status",
            function(event){

                const status =
                    event.detail &&
                    event.detail.status
                        ? event.detail.status
                        : "REQUESTED";


                if(activeRide){

                    activeRide.classList.add(
                        "show"
                    );

                }

                if(activeStatus){

                    activeStatus.textContent =
                        String(status)
                            .replace(
                                /_/g,
                                " "
                            );

                }


                if(
                    status === "ACCEPTED" ||
                    status === "ARRIVING" ||
                    status === "STARTED" ||
                    status === "IN_PROGRESS"
                ){

                    expandSheet();

                }

            }
        );


        /* ==================================================
           CANCEL RIDE
        ================================================== */

        const cancel =
            document.getElementById(
                "cancelRide"
            );


        if(cancel){

            cancel.addEventListener(
                "click",
                function(){

                    if(
                        window.RiderXCustomer &&
                        typeof
                        window.RiderXCustomer
                            .cancelRide ===
                        "function"
                    ){

                        window.RiderXCustomer
                            .cancelRide();

                    }else{

                        window.dispatchEvent(
                            new CustomEvent(
                                "riderx:cancel-ride"
                            )
                        );

                    }

                }
            );

        }


        /* ==================================================
           BOTTOM SHEET
        ================================================== */

        if(!sheet || !handle){

            return;
        }


        let dragging = false;

        let startY = 0;

        let startTranslate = 0;

        let lastY = 0;

        let moved = false;


        function getTranslateY(){

            const style =
                window.getComputedStyle(
                    sheet
                );

            const transform =
                style.transform;


            if(
                !transform ||
                transform === "none"
            ){

                return 0;
            }


            try{

                const matrix =
                    new DOMMatrixReadOnly(
                        transform
                    );

                return matrix.m42 || 0;

            }catch(error){

                return 0;
            }

        }


        function collapsedPosition(){

            return Math.max(
                0,
                sheet.offsetHeight -
                window.innerHeight * .30
            );

        }


        function applyPosition(
            value
        ){

            const max =
                collapsedPosition();

            const clamped =
                Math.max(
                    0,
                    Math.min(
                        max,
                        value
                    )
                );


            sheet.style.transform =
                "translateY(" +
                clamped +
                "px)";

        }


        function expandSheet(){

            document.body.classList.remove(
                "sheet-collapsed"
            );

            document.body.classList.add(
                "sheet-expanded"
            );

            sheet.classList.remove(
                "dragging"
            );

            sheet.style.transform =
                "translateY(0)";


            invalidateMap();

        }


        function collapseSheet(){

            document.body.classList.remove(
                "sheet-expanded"
            );

            document.body.classList.add(
                "sheet-collapsed"
            );

            sheet.classList.remove(
                "dragging"
            );


            sheet.style.transform =
                "translateY(" +
                collapsedPosition() +
                "px)";


            invalidateMap();

        }


        function toggleSheet(){

            if(
                document.body.classList.contains(
                    "sheet-expanded"
                )
            ){

                collapseSheet();

            }else{

                expandSheet();

            }

        }


        function invalidateMap(){

            setTimeout(
                function(){

                    try{

                        if(
                            window.RiderXCustomer &&
                            typeof
                            window.RiderXCustomer
                                .getState ===
                            "function"
                        ){

                            const state =
                                window.RiderXCustomer
                                    .getState();

                            const map =
                                state &&
                                state.map;

                            if(map){

                                map.invalidateSize();

                            }

                        }

                    }catch(error){

                        console.warn(
                            "RiderX map resize:",
                            error
                        );

                    }

                },
                350
            );

        }


        /* ==================================================
           INITIAL STATE
        ================================================== */

        setTimeout(
            function(){

                collapseSheet();

            },
            120
        );


        /* ==================================================
           TOUCH START
        ================================================== */

        handle.addEventListener(
            "touchstart",
            function(event){

                if(
                    !event.touches ||
                    !event.touches.length
                ){

                    return;
                }


                dragging = true;

                moved = false;

                startY =
                    event.touches[0].clientY;

                lastY =
                    startY;

                startTranslate =
                    getTranslateY();


                sheet.classList.add(
                    "dragging"
                );

            },
            {
                passive:true
            }
        );


        /* ==================================================
           TOUCH MOVE
        ================================================== */

        handle.addEventListener(
            "touchmove",
            function(event){

                if(
                    !dragging ||
                    !event.touches ||
                    !event.touches.length
                ){

                    return;
                }


                lastY =
                    event.touches[0].clientY;


                const delta =
                    lastY -
                    startY;


                if(
                    Math.abs(delta) > 5
                ){

                    moved = true;

                }


                applyPosition(
                    startTranslate +
                    delta
                );

            },
            {
                passive:true
            }
        );


        /* ==================================================
           TOUCH END
        ================================================== */

        handle.addEventListener(
            "touchend",
            function(){

                if(!dragging){

                    return;
                }


                dragging = false;

                sheet.classList.remove(
                    "dragging"
                );


                const finalY =
                    getTranslateY();

                const max =
                    collapsedPosition();


                if(!moved){

                    toggleSheet();

                    return;
                }


                if(
                    finalY <
                    max * .50
                ){

                    expandSheet();

                }else{

                    collapseSheet();

                }

            },
            {
                passive:true
            }
        );


        /* ==================================================
           DESKTOP MOUSE DRAG
        ================================================== */

        handle.addEventListener(
            "mousedown",
            function(event){

                dragging = true;

                moved = false;

                startY =
                    event.clientY;

                lastY =
                    startY;

                startTranslate =
                    getTranslateY();


                sheet.classList.add(
                    "dragging"
                );


                event.preventDefault();

            }
        );


        document.addEventListener(
            "mousemove",
            function(event){

                if(!dragging){

                    return;
                }


                lastY =
                    event.clientY;


                const delta =
                    lastY -
                    startY;


                if(
                    Math.abs(delta) > 5
                ){

                    moved = true;

                }


                applyPosition(
                    startTranslate +
                    delta
                );

            }
        );


        document.addEventListener(
            "mouseup",
            function(){

                if(!dragging){

                    return;
                }


                dragging = false;

                sheet.classList.remove(
                    "dragging"
                );


                const finalY =
                    getTranslateY();

                const max =
                    collapsedPosition();


                if(!moved){

                    toggleSheet();

                    return;
                }


                if(
                    finalY <
                    max * .50
                ){

                    expandSheet();

                }else{

                    collapseSheet();

                }

            }
        );


        /* ==================================================
           RESIZE
        ================================================== */

        let resizeTimer = null;


        window.addEventListener(
            "resize",
            function(){

                clearTimeout(
                    resizeTimer
                );


                resizeTimer =
                    setTimeout(
                        function(){

                            if(
                                document.body
                                    .classList
                                    .contains(
                                        "sheet-expanded"
                                    )
                            ){

                                expandSheet();

                            }else{

                                collapseSheet();

                            }

                        },
                        120
                    );

            }
        );


        /* ==================================================
           NOTIFICATION EVENT
        ================================================== */

        window.addEventListener(
            "riderx:notification",
            function(){

                const dot =
                    document.getElementById(
                        "notificationDot"
                    );


                if(dot){

                    dot.classList.add(
                        "show"
                    );

                }

            }
        );


        /* ==================================================
           LOCATION SUGGESTION INPUT SUPPORT
        ================================================== */

        const pickup =
            document.getElementById(
                "pickupLocation"
            );

        const dropoff =
            document.getElementById(
                "dropoffLocation"
            );

        const suggestions =
            document.getElementById(
                "locationSuggestions"
            );


        function hideSuggestions(){

            if(suggestions){

                suggestions.classList.remove(
                    "show"
                );

                suggestions.innerHTML =
                    "";

            }

        }


        function dispatchLocationSearch(
            type,
            value
        ){

            window.dispatchEvent(
                new CustomEvent(
                    "riderx:location-search",
                    {
                        detail:{
                            type:type,
                            value:value
                        }
                    }
                )
            );

        }


        if(pickup){

            pickup.addEventListener(
                "focus",
                function(){

                    expandSheet();

                }
            );


            pickup.addEventListener(
                "input",
                function(){

                    dispatchLocationSearch(
                        "pickup",
                        pickup.value.trim()
                    );

                }
            );

        }


        if(dropoff){

            dropoff.addEventListener(
                "focus",
                function(){

                    expandSheet();

                }
            );


            dropoff.addEventListener(
                "input",
                function(){

                    dispatchLocationSearch(
                        "dropoff",
                        dropoff.value.trim()
                    );

                }
            );

        }


        document.addEventListener(
            "click",
            function(event){

                if(
                    suggestions &&
                    !suggestions.contains(
                        event.target
                    ) &&
                    event.target !== pickup &&
                    event.target !== dropoff
                ){

                    hideSuggestions();

                }

            }
        );


    },
    {
        once:true
    }
);

</script>

</body>
    </html>
