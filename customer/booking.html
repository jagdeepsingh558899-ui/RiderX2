<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Booking</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

body{
background:#000;
color:white;
}


.container{

padding:15px;

}


.header{

text-align:center;
font-size:28px;
font-weight:bold;
padding:20px;

}


.header span{

color:#00eaff;

}


#map{

height:350px;
width:100%;
border-radius:20px;
margin-bottom:15px;

}


input,select,button{

width:100%;
padding:14px;
margin-top:12px;
border-radius:12px;
border:none;
font-size:16px;

}


button{

background:#00eaff;
font-weight:bold;

}


.card{

background:#111;
padding:15px;
border-radius:15px;
margin-top:15px;

}


</style>


</head>


<body>


<div class="header">

RIDER<span>X</span> Booking

</div>



<div class="container">


<div id="map"></div>



<select id="service">

<option value="Bike Taxi">
🏍 Bike Taxi
</option>

<option value="Cab">
🚕 Cab
</option>

<option value="Parcel">
📦 Parcel
</option>

<option value="Food">
🍔 Food Delivery
</option>

</select>



<input id="pickup" placeholder="Pickup Location" readonly>



<button id="locationBtn">

📍 Use My Location

</button>



<input id="drop" placeholder="Enter Drop Location">



<div class="card">


<p id="distance">

Distance : -

</p>


<p>

Fare : ₹<span id="fare">0</span>

</p>


</div>



<button id="bookBtn">

Confirm Ride

</button>



</div>





<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script type="module" src="../js/booking.js"></script>


</body>

</html>
