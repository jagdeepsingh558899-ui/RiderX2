<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>RiderX - Book a Ride</title>

<meta
    name="theme-color"
    content="#FFD400"
>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<link
    rel="stylesheet"
    href="../css/dashboard.css"
>

<link
    rel="stylesheet"
    href="../css/responsive.css"
>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

:root{
    --yellow:#FFD400;
    --black:#080808;
    --dark:#111;
    --card:#191919;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.booking-page{
    width:100%;
    max-width:650px;
    height:100vh;
    height:100dvh;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:#111;
}

#map{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

.leaflet-control-attribution{
    font-size:7px !important;
}

.leaflet-control-zoom{
    margin-bottom:300px !important;
}

.leaflet-marker-icon{
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
}

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:20;
    padding:12px;
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:none;
}

.top-btn{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:rgba(15,15,15,.94);
    color:#fff;
    font-size:25px;
    box-shadow:0 3px 14px rgba(0,0,0,.3);
    cursor:pointer;
    pointer-events:auto;
}

.top-title{
    flex:1;
    background:rgba(15,15,15,.94);
    border-radius:22px;
    height:43px;
    display:flex;
    align-items:center;
    padding:0 14px;
    font-size:12px;
    font-weight:900;
    box-shadow:0 3px 14px rgba(0,0,0,.3);
}

.location-btn{
    position:absolute;
    right:13px;
    bottom:46%;
    z-index:20;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#000;
    font-size:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.35);
    cursor:pointer;
}

.booking-sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    height:42%;
    min-height:330px;
    max-height:88%;
    background:#101010;
    border-radius:25px 25px 0 0;
    border-top:1px solid #292929;
    box-shadow:0 -8px 30px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    transition:height .28s ease;
    touch-action:none;
}

.booking-sheet.expanded{
    height:82%;
}

.sheet-handle-area{
    height:34px;
    flex:none;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:grab;
}

.sheet-handle{
    width:42px;
    height:4px;
    background:#555;
    border-radius:10px;
}

.sheet-content{
    flex:1;
    overflow-y:auto;
    padding:0 14px 25px;
    touch-action:pan-y;
    -webkit-overflow-scrolling:touch;
}

.sheet-content::-webkit-scrollbar{
    width:3px;
}

.sheet-content::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:10px;
}

.location-box{
    background:#191919;
    border:1px solid var(--border);
    border-radius:15px;
    overflow:visible;
}

.location-row{
    display:flex;
    align-items:center;
    min-height:54px;
    padding:8px 11px;
    position:relative;
}

.location-row + .location-row{
    border-top:1px solid #292929;
}

.location-marker{
    width:30px;
    min-width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:9px;
    font-size:13px;
}

.pickup-marker{
    background:rgba(255,212,0,.15);
    color:var(--yellow);
}

.drop-marker{
    background:rgba(255,255,255,.08);
    color:#fff;
}

.location-input-wrap{
    flex:1;
    min-width:0;
    position:relative;
}

.location-label{
    color:#666;
    font-size:7px;
    text-transform:uppercase;
    font-weight:800;
    margin-bottom:3px;
}

.location-input{
    width:100%;
    border:0;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:10px;
    font-family:inherit;
    text-overflow:ellipsis;
}

.location-input::placeholder{
    color:#777;
}

.swap-btn{
    width:29px;
    height:29px;
    border:1px solid #333;
    border-radius:8px;
    background:#222;
    color:#aaa;
    cursor:pointer;
}

.search-results{
    display:none;
    position:absolute;
    left:-1px;
    right:-1px;
    top:43px;
    z-index:500;
    background:#181818;
    border:1px solid #303030;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.search-results.show{
    display:block;
}

.search-result{
    padding:11px;
    border-bottom:1px solid #292929;
    font-size:9px;
    line-height:1.35;
    color:#ccc;
    cursor:pointer;
}

.search-result:last-child{
    border-bottom:0;
}

.search-result:hover{
    background:#222;
}

.section-title{
    font-size:12px;
    font-weight:900;
    margin:16px 0 9px;
}

.services{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
}

.services::-webkit-scrollbar{
    display:none;
}

.service{
    flex:1;
    min-width:82px;
    border:1px solid #303030;
    background:#181818;
    border-radius:14px;
    padding:10px 7px;
    color:#fff;
    cursor:pointer;
    text-align:center;
}

.service.active{
    background:var(--yellow);
    color:#000;
    border-color:var(--yellow);
}

.service-icon{
    font-size:21px;
    margin-bottom:5px;
}

.service-name{
    font-size:8px;
    font-weight:900;
}

.service-price{
    font-size:7px;
    margin-top:4px;
    opacity:.65;
}

.fare-card{
    margin-top:13px;
    padding:13px;
    background:#191919;
    border:1px solid var(--border);
    border-radius:15px;
}

.fare-row{
    display:flex;
    align-items:center;
    margin-bottom:8px;
}

.fare-label{
    flex:1;
    color:#777;
    font-size:8px;
}

.fare-value{
    font-size:9px;
    font-weight:800;
}

.total-row{
    padding-top:9px;
    border-top:1px solid #2b2b2b;
}

.total-row .fare-label{
    color:#fff;
    font-size:10px;
    font-weight:900;
}

.total-row .fare-value{
    color:var(--yellow);
    font-size:19px;
}

.payment-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:11px;
}

.payment-option{
    flex:1;
    height:42px;
    border:1px solid #303030;
    background:#181818;
    color:#aaa;
    border-radius:11px;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
}

.payment-option.active{
    background:#222;
    border-color:var(--yellow);
    color:var(--yellow);
}

.book-btn{
    width:100%;
    height:52px;
    margin-top:13px;
    border:0;
    border-radius:14px;
    background:var(--yellow);
    color:#000;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.book-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.engine-status{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    justify-content:center;
    font-size:7px;
    color:#666;
}

.engine-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#777;
}

.engine-status.ready .engine-dot{
    background:var(--green);
}

.engine-status.error .engine-dot{
    background:var(--red);
}

.loading-overlay{
    position:absolute;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
}

.loading-overlay.show{
    display:flex;
}

.loading-box{
    width:190px;
    padding:20px;
    background:#181818;
    border:1px solid #333;
    border-radius:15px;
    text-align:center;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #333;
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 10px;
}

.loading-text{
    color:#aaa;
    font-size:9px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.toast{
    position:absolute;
    z-index:1200;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    width:calc(100% - 30px);
    padding:11px 13px;
    border-radius:11px;
    background:#222;
    border:1px solid #333;
    color:#fff;
    text-align:center;
    font-size:9px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.toast.error{
    border-color:rgba(239,68,68,.5);
}

.toast.success{
    border-color:rgba(34,197,94,.5);
}

@media(max-width:390px){

    .booking-sheet{
        min-height:315px;
    }

    .service{
        min-width:76px;
    }

}

</style>

</head>

<body>

<div class="booking-page">

<div id="map"></div>

<div class="topbar">

    <button
        class="top-btn"
        type="button"
        onclick="goBack()"
        aria-label="Back"
    >
        ‹
    </button>

    <div class="top-title">
        Book a Ride
    </div>

</div>

<button
    class="location-btn"
    type="button"
    onclick="useCurrentLocation()"
    title="My location"
    aria-label="My location"
>
    ◎
</button>

<section
    class="booking-sheet"
    id="bookingSheet"
>

    <div
        class="sheet-handle-area"
        id="sheetHandle"
    >
        <div class="sheet-handle"></div>
    </div>

    <div class="sheet-content">

        <div class="location-box">

            <div class="location-row">

                <div class="location-marker pickup-marker">
                    ●
                </div>

                <div class="location-input-wrap">

                    <div class="location-label">
                        Pickup
                    </div>

                    <input
                        id="pickupInput"
                        class="location-input"
                        type="text"
                        placeholder="Where should we pick you up?"
                        autocomplete="off"
                    >

                    <div
                        id="pickupResults"
                        class="search-results"
                    ></div>

                </div>

                <button
                    class="swap-btn"
                    type="button"
                    onclick="swapLocations()"
                    title="Swap"
                >
                    ⇅
                </button>

            </div>

            <div class="location-row">

                <div class="location-marker drop-marker">
                    ●
                </div>

                <div class="location-input-wrap">

                    <div class="location-label">
                        Drop
                    </div>

                    <input
                        id="dropInput"
                        class="location-input"
                        type="text"
                        placeholder="Where are you going?"
                        autocomplete="off"
                    >

                    <div
                        id="dropResults"
                        class="search-results"
                    ></div>

                </div>

            </div>

        </div>

        <div class="section-title">
            Choose your ride
        </div>

        <div class="services">

            <button
                class="service active"
                type="button"
                data-service="bike"
                onclick="selectService('bike',this)"
            >

                <div class="service-icon">
                    🏍️
                </div>

                <div class="service-name">
                    Bike Taxi
                </div>

                <div class="service-price">
                    From ₹8/km
                </div>

            </button>

            <button
                class="service"
                type="button"
                data-service="cab"
                onclick="selectService('cab',this)"
            >

                <div class="service-icon">
                    🚕
                </div>

                <div class="service-name">
                    Cab
                </div>

                <div class="service-price">
                    From ₹12/km
                </div>

            </button>

            <button
                class="service"
                type="button"
                data-service="parcel"
                onclick="selectService('parcel',this)"
            >

                <div class="service-icon">
                    📦
                </div>

                <div class="service-name">
                    Parcel
                </div>

                <div class="service-price">
                    From ₹10/km
                </div>

            </button>

            <button
                class="service"
                type="button"
                data-service="food"
                onclick="selectService('food',this)"
            >

                <div class="service-icon">
                    🍔
                </div>

                <div class="service-name">
                    Food
                </div>

                <div class="service-price">
                    Delivery
                </div>

            </button>

        </div>

        <div class="fare-card">

            <div class="fare-row">

                <div class="fare-label">
                    Distance
                </div>

                <div
                    class="fare-value"
                    id="distanceText"
                >
                    -- km
                </div>

            </div>

            <div class="fare-row">

                <div class="fare-label">
                    Base fare
                </div>

                <div
                    class="fare-value"
                    id="baseFare"
                >
                    ₹0
                </div>

            </div>

            <div class="fare-row">

                <div class="fare-label">
                    Distance fare
                </div>

                <div
                    class="fare-value"
                    id="distanceFare"
                >
                    ₹0
                </div>

            </div>

            <div class="fare-row">

                <div class="fare-label">
                    Booking fee
                </div>

                <div
                    class="fare-value"
                    id="bookingFee"
                >
                    ₹0
                </div>

            </div>

            <div class="fare-row total-row">

                <div class="fare-label">
                    Estimated fare
                </div>

                <div
                    class="fare-value"
                    id="totalFare"
                >
                    ₹0
                </div>

            </div>

        </div>

        <div class="section-title">
            Payment method
        </div>

        <div class="payment-row">

            <button
                class="payment-option active"
                type="button"

                onclick="selectPayment('cash',this)"

                💵 Cash
            </button>

            <button
                class="payment-option"
                type="button"

                onclick="selectPayment('online',this)"

            </button>

            <button

                👛 Wallet

            id="bookBtn"

            <span class="engine-dot"></span>

</section>

<div
    class="loading-overlay"
    id="loadingOverlay"
>

    <div class="loading-box">

        <div class="spinner"></div>

        <div
            class="loading-text"

</div>

<div
    class="toast"
    id="toast"
></div>

</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script type="module">

import {
    auth,
    db,
    realtimeDb,
    doc,
    setDoc
} from "../firebase/firebase-config.js";


const bookingState = {

    initialized:false,

    pickup:null,

    drop:null,

    service:"bike",

    payment:"cash",

    distanceKm:0,

    durationMinutes:0,

    routeDistanceKm:0,

    routeDurationMinutes:0,

    fare:0

};


function getCurrentUser(){

    return auth?.currentUser || null;

}


function generateRideId(){

    return (
        "RX-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .slice(2,8)
    ).toUpperCase();

}


function setService(service){

    service =
        String(service || "bike")
            .toLowerCase();

    if(
        ![
            "bike",
            "cab",
            "parcel",
            "food"
        ].includes(service)
    ){

        service = "bike";

    }

    bookingState.service =
        service;

    return service;

}


function setPaymentMethod(method){

    method =
        String(method || "cash")
            .toLowerCase();

    if(
        ![
            "cash",
            "online",
            "wallet",
            "upi"
        ].includes(method)
    ){

        method = "cash";

    }

    bookingState.payment =
        method;

    return method;

}


function setPickupLocation(
    lat,
    lng,
    address=""
){

    bookingState.pickup = {

        lat:Number(lat),

        lng:Number(lng),

        address:
            String(address || "")
                .trim() ||
            "Pickup location"

    };

    return bookingState.pickup;

}


function setDropLocation(
    lat,
    lng,
    address=""
){

    bookingState.drop = {

        lat:Number(lat),

        lng:Number(lng),

        address:
            String(address || "")
                .trim() ||
            "Drop location"

    };

    return bookingState.drop;

}


function clearPickupLocation(){

    bookingState.pickup = null;

}


function clearDropLocation(){

    bookingState.drop = null;

}


function setRouteData(
    distanceKm,
    durationMinutes
){

    const distance =
        Number(distanceKm);

    const duration =
        Number(durationMinutes);


    bookingState.routeDistanceKm =
        Number.isFinite(distance) &&
        distance > 0
            ? distance
            : 0;


    bookingState.routeDurationMinutes =
        Number.isFinite(duration) &&
        duration > 0
            ? duration
            : 0;


    bookingState.distanceKm =
        bookingState.routeDistanceKm;


    bookingState.durationMinutes =
        bookingState.routeDurationMinutes;


    return {

        distanceKm:
            bookingState.routeDistanceKm,

        durationMinutes:
            bookingState.routeDurationMinutes

    };

}


function calculateDistance(
    lat1,
    lng1,
    lat2,
    lng2
){

    const R = 6371;

    const dLat =
        (
            Number(lat2) -
            Number(lat1)
        ) *
        Math.PI /
        180;

    const dLng =
        (
            Number(lng2) -
            Number(lng1)
        ) *
        Math.PI /
        180;

    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(
            Number(lat1) *
            Math.PI /
            180
        )

        *

        Math.cos(
            Number(lat2) *
            Math.PI /
            180
        )

        *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);


    const safeA =
        Math.min(
            1,
            Math.max(
                0,
                a
            )
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(safeA),
            Math.sqrt(1 - safeA)
        );


    return R * c;

}


function calculateFareEstimate(){

    if(
        !bookingState.pickup ||
        !bookingState.drop
    ){

        bookingState.distanceKm = 0;
        bookingState.durationMinutes = 0;
        bookingState.fare = 0;

        return {
            distanceKm:0,
            durationMinutes:0,
            baseFare:0,
            distanceFare:0,
            bookingFee:0,
            fare:0
        };

    }


    let distanceKm =
        Number(
            bookingState.routeDistanceKm
        );


    if(
        !Number.isFinite(distanceKm) ||
        distanceKm <= 0
    ){

        distanceKm =
            calculateDistance(

                bookingState.pickup.lat,
                bookingState.pickup.lng,

                bookingState.drop.lat,
                bookingState.drop.lng

            );

    }


    let durationMinutes =
        Number(
            bookingState.routeDurationMinutes
        );


    if(
        !Number.isFinite(durationMinutes) ||
        durationMinutes <= 0
    ){

        durationMinutes =
            Math.max(
                5,
                Math.round(
                    distanceKm * 3
                )
            );

    }


    bookingState.distanceKm =
        distanceKm;

    bookingState.durationMinutes =
        durationMinutes;


    let baseFare = 30;
    let rate = 8;


    if(
        bookingState.service === "cab"
    ){

        baseFare = 60;
        rate = 12;

    }else if(
        bookingState.service === "parcel"
    ){

        baseFare = 40;
        rate = 10;

    }else if(
        bookingState.service === "food"
    ){

        baseFare = 35;
        rate = 9;

    }


    const hour =
        new Date().getHours();


    const night =
        hour >= 22 ||
        hour < 6;


    let distanceFare = 0;


    if(
        bookingState.service === "bike"
    ){

        if(night){

            distanceFare =
                distanceKm * 11;

        }else if(
            distanceKm > 10
        ){

            distanceFare =
                (10 * 8) +
                (
                    (distanceKm - 10) *
                    9
                );

        }else{

            distanceFare =
                distanceKm * 8;

        }

    }else{

        distanceFare =
            distanceKm * rate;

    }


    const bookingFee =
        bookingState.service === "bike"
            ? 5
            : 10;


    const fare =
        Math.max(

            Math.round(
                baseFare +
                distanceFare +
                bookingFee
            ),

            baseFare

        );


    bookingState.fare =
        fare;


    return {

        distanceKm:
            Number(
                distanceKm.toFixed(2)
            ),

        durationMinutes,

        baseFare,

        distanceFare:
            Math.round(
                distanceFare
            ),

        bookingFee,

        fare

    };

}


async function createRideRequest(
    paymentMethod
){

    const user =
        getCurrentUser();


    if(!user){

        const error =
            new Error(
                "Please login as customer first."
            );

        error.code =
            "unauthenticated";

        throw error;

    }


    if(
        !bookingState.pickup
    ){

        throw new Error(
            "Pickup location is required."
        );

    }


    if(
        !bookingState.drop
    ){

        throw new Error(
            "Drop location is required."
        );

    }


    if(
        bookingState.pickup.lat ===
        bookingState.drop.lat &&
        bookingState.pickup.lng ===
        bookingState.drop.lng
    ){

        throw new Error(
            "Pickup and drop cannot be the same."
        );

    }


    setPaymentMethod(
        paymentMethod ||
        bookingState.payment
    );


    const estimate =
        calculateFareEstimate();


    if(
        !estimate.distanceKm ||
        estimate.distanceKm <= 0
    ){

        throw new Error(
            "Unable to calculate route distance."
        );

    }


    if(
        !estimate.fare ||
        estimate.fare <= 0
    ){

        throw new Error(
            "Unable to calculate fare."
        );

    }


    const rideId =
        generateRideId();


    const serviceName =

        bookingState.service === "bike"
            ? "Bike Taxi"

        : bookingState.service === "cab"
            ? "Cab"

        : bookingState.service === "parcel"
            ? "Parcel"

        : "Food Delivery";


    const now =
        Date.now();


    const ride = {

        id:rideId,

        rideId:rideId,

        bookingId:rideId,

        customerId:user.uid,

        customerUid:user.uid,

        customerName:
            user.displayName ||
            user.email ||
            "Customer",

        customerEmail:
            user.email ||
            "",

        customerPhone:
            user.phoneNumber ||
            "",

        service:
            bookingState.service,

        serviceType:
            bookingState.service,

        serviceName,

        pickup:
            bookingState.pickup,

        pickupLocation:
            bookingState.pickup,

        destination:
            bookingState.drop,

        drop:
            bookingState.drop,

        dropLocation:
            bookingState.drop,

        pickupAddress:
            bookingState.pickup.address,

        destinationAddress:
            bookingState.drop.address,

        dropAddress:
            bookingState.drop.address,

        distanceKm:
            estimate.distanceKm,

        durationMinutes:
            estimate.durationMinutes,

        baseFare:
            estimate.baseFare,

        distanceFare:
            estimate.distanceFare,

        bookingFee:
            estimate.bookingFee,

        estimatedFare:
            estimate.fare,

        totalFare:
            estimate.fare,

        fare:
            estimate.fare,

        currency:"INR",

        paymentMethod:
            bookingState.payment,

        paymentStatus:
            bookingState.payment === "cash"
                ? "pending"
                : "pending",

        status:"searching",

        rideStatus:"searching",

        bookingStatus:"searching",

        riderId:null,

        riderUid:null,

        riderName:null,

        riderPhone:null,

        riderVehicle:null,

        otp:null,

        city:"Chandigarh",

        createdAt:now,

        requestedAt:now,

        updatedAt:now,

        source:"riderx-web",

        platform:"web"

    };


    const rideRef =
        doc(
            db,
            "rides",
            rideId
        );


    await setDoc(
        rideRef,
        ride
    );


    try{

        if(realtimeDb){

            const {
                ref,
                set
            } = await import(
                "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"
            );


            await set(
                ref(
                    realtimeDb,
                    "rides/" + rideId
                ),
                ride
            );


            await set(
                ref(
                    realtimeDb,
                    "customerRides/" +
                    user.uid +
                    "/" +
                    rideId
                ),
                {
                    bookingId:rideId,
                    rideId:rideId,
                    status:"searching",
                    rideStatus:"searching",
                    createdAt:now,
                    updatedAt:now
                }
            );

        }

    }catch(error){

        console.warn(
            "RTDB ride mirror warning:",
            error
        );

    }


    localStorage.setItem(
        "riderx_active_ride_id",
        rideId
    );


    localStorage.setItem(
        "riderxPendingBooking",
        JSON.stringify({

            rideId,

            bookingId:rideId,

            customerId:user.uid,

            status:"searching",

            createdAt:now

        })
    );


    return ride;

}


window.RiderXBookingAPI = {

    auth,

    db,

    realtimeDb,

    initBookingModule:
        async function(){

            if(
                bookingState.initialized
            ){

                return true;

            }

            );

        },

    setService,

    calculateFareEstimate,

    createRideRequest

};


try{

    await window.RiderXBookingAPI
        .initBookingModule();


    window.RiderXBookingReady =

    const status =

<script>

const $ =
    id =>
        document.getElementById(id);


let map = null;

let pickupMarker = null;

let dropMarker = null;

let routeLine = null;

let pickupCoords = null;

let dropCoords = null;

let selectedService = "bike";

let selectedPayment = "cash";

let routeDistanceKm = 0;

let routeDurationMin = 0;

let pickupSearchTimer = null;

let dropSearchTimer = null;

let toastTimer = null;

let routeRequestId = 0;

let pickupSearchRequestId = 0;

let dropSearchRequestId = 0;

let reversePickupRequestId = 0;

let reverseDropRequestId = 0;

let sheetStartY = 0;

let sheetStartHeight = 0;

let draggingSheet = false;

let sheetDragged = false;


function clearRoute(){

    routeRequestId++;


    if(
        routeLine &&
        map
    ){

        map.removeLayer(
            routeLine
        );

    }


    routeLine = null;

    routeDistanceKm = 0;

    routeDurationMin = 0;

}


function initMap(){

    if(
        map ||
        !window.L
    ){

        return;

    }


    const defaultCenter = [
        30.7333,
        76.7794
    ];


    map =
        L.map(
            "map",
            {
                zoomControl:false,
                attributionControl:true
            }
        ).setView(
            defaultCenter,
            13
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap contributors"
        }
    ).addTo(map);


    L.control.zoom({
        position:"bottomleft"
    }).addTo(map);


    map.on(
        "click",
        function(event){

            hideSearchResults("pickup");
            hideSearchResults("drop");


            if(!pickupCoords){

                setPickup(
                    event.latlng.lat,
                    event.latlng.lng
                );

                return;

            }


            if(!dropCoords){

                setDrop(
                    event.latlng.lat,
                    event.latlng.lng
                );

            }

        }
    );


    setTimeout(
        () => map.invalidateSize(),
        250
    );

}


function updateBookButton(){

    const button =
        $("bookBtn");


    if(!button){
        return;
    }


    const ready =
        !!window.RiderXBookingReady;


    button.disabled =
        !ready ||
        !pickupCoords ||
        !dropCoords;

}


window.updateBookButton =
    updateBookButton;


function useCurrentLocation(){

    if(
        !navigator.geolocation
    ){

        showToast(
            "Location is not supported on this device.",
            "error"
        );

        return;

    }


    showToast(
        "Finding your location..."
    );


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            setPickup(
                lat,
                lng
            );


            if(map){

                map.setView(
                    [lat,lng],
                    16
                );

            }

        },

        error => {

            console.warn(
                "Location error:",
                error
            );


            showToast(
                "Unable to get your location. Select pickup manually.",
                "error"
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:30000
        }

    );

}


window.useCurrentLocation =
    useCurrentLocation;


function createMarker(
    type,
    lat,
    lng
){

    const marker =
        L.marker(
            [lat,lng],
            {
                draggable:true
            }
        ).addTo(map);


    marker.on(
        "dragend",
        function(){

            const p =
                marker.getLatLng();


            if(type === "pickup"){

                pickupCoords = {
                    lat:p.lat,
                    lng:p.lng
                };


                reverseGeocode(
                    p.lat,
                    p.lng,
                    "pickup"
                );

            }else{

                dropCoords = {
                    lat:p.lat,
                    lng:p.lng
                };


                reverseGeocode(
                    p.lat,
                    p.lng,
                    "drop"
                );

            }


            clearRoute();

            syncBookingLocations();

            updateBookingState();

        }
    );


    return marker;

}


function setPickup(
    lat,
    lng,
    address=""
){

    lat = Number(lat);
    lng = Number(lng);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    pickupCoords = {
        lat,
        lng
    };


    if(
        pickupMarker &&
        map
    ){

        pickupMarker.setLatLng(
            [lat,lng]
        );

    }else if(map){

        pickupMarker =
            createMarker(
                "pickup",
                lat,
                lng
            );

    }


    if(address){

        $("pickupInput").value =
            address;

    }


    syncBookingLocations();

    updateBookingState();


    if(!address){

        reverseGeocode(
            lat,
            lng,
            "pickup"
        );

    }

}


window.setPickup =
    setPickup;


function setDrop(
    lat,
    lng,
    address=""
){

    lat = Number(lat);
    lng = Number(lng);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    dropCoords = {
        lat,
        lng
    };


    if(
        dropMarker &&
        map
    ){

        dropMarker.setLatLng(
            [lat,lng]
        );

    }else if(map){

        dropMarker =
            createMarker(
                "drop",
                lat,
                lng
            );

    }


    if(address){

        $("dropInput").value =
            address;

    }


    syncBookingLocations();

    updateBookingState();


    if(!address){

        reverseGeocode(
            lat,
            lng,
            "drop"
        );

    }

}


window.setDrop =
    setDrop;


async function drawRoute(){

    if(
        !pickupCoords ||
        !dropCoords
    ){

        clearRoute();

        updateFareFromRoute();

        return;

    }


    const requestId =
        ++routeRequestId;


    try{

        const url =

            "https://router.project-osrm.org/route/v1/driving/" +

            pickupCoords.lng +
            "," +
            pickupCoords.lat +

            ";" +

            dropCoords.lng +
            "," +
            dropCoords.lat +

            "?overview=full&geometries=geojson";


        const response =
            await fetch(url);


        if(
            requestId !== routeRequestId
        ){

            return;

        }


        if(!response.ok){

            throw new Error(
                "Route service unavailable."
            );

        }


        const data =
            await response.json();


        if(
            data.code !== "Ok" ||
            !data.routes?.length
        ){

            throw new Error(
                "No route found."
            );

        }


        const route =
            data.routes[0];


        routeDistanceKm =
            Number(
                route.distance / 1000
            );


        routeDurationMin =
            Math.max(
                1,
                Math.round(
                    route.duration / 60
                )
            );


        if(routeLine){

            map.removeLayer(
                routeLine
            );

        }


        routeLine =
            L.geoJSON(
                route.geometry,
                {
                    style:{
                        color:"#FFD400",
                        weight:5,
                        opacity:.9
                    }
                }
            ).addTo(map);


        map.fitBounds(
            routeLine.getBounds(),
            {
                paddingTopLeft:[
                    30,
                    100
                ],
                paddingBottomRight:[
                    30,
                    330
                ]
            }
        );


        updateFareFromRoute();

    }catch(error){

        console.warn(
            "OSRM route failed:",
            error
        );


        if(
            requestId !== routeRequestId
        ){

            return;

        }


        routeDistanceKm =
            calculateDistance(
                pickupCoords.lat,
                pickupCoords.lng,
                dropCoords.lat,
                dropCoords.lng
            );


        routeDurationMin =
            Math.max(
                5,
                Math.round(
                    routeDistanceKm * 3
                )
            );


        updateFareFromRoute();

    }

}


function syncBookingLocations(){

    const api =
        window.RiderXBookingAPI;


    if(!api){
        return false;
    }


    if(pickupCoords){

        api.setPickupLocation(

            pickupCoords.lat,

            pickupCoords.lng,

            $("pickupInput")
                .value
                .trim()

        );

    }else{

        api.clearPickupLocation();

    }


    if(dropCoords){

        api.setDropLocation(

            dropCoords.lat,

            dropCoords.lng,

            $("dropInput")
                .value
                .trim()

        );

    }else{

        api.clearDropLocation();

    }


    return true;

}


async function reverseGeocode(
    lat,
    lng,
    type
){

    const requestId =
        type === "pickup"
            ? ++reversePickupRequestId
            : ++reverseDropRequestId;


    try{

        const response =
            await fetch(

                "https://nominatim.openstreetmap.org/reverse?" +

                new URLSearchParams({

                    lat,
                    lon:lng,
                    format:"json",
                    zoom:18

                }),

                {
                    headers:{
                        "Accept-Language":"en"
                    }

                }

            );


        if(!response.ok){

            throw new Error(
                "Reverse geocoding failed."
            );

        }


        const data =
            await response.json();


        if(
            (
                type === "pickup" &&
                requestId !== reversePickupRequestId
            ) ||
            (
                type === "drop" &&
                requestId !== reverseDropRequestId
            )
        ){

            return;

        }


        const address =
            data.display_name ||
            `${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}`;


        if(type === "pickup"){

            if(
                pickupCoords &&
                Math.abs(
                    pickupCoords.lat - Number(lat)
                ) < 0.00001 &&
                Math.abs(
                    pickupCoords.lng - Number(lng)
                ) < 0.00001
            ){

                $("pickupInput").value =
                    address;

            }

        }else{

            if(
                dropCoords &&
                Math.abs(
                    dropCoords.lat - Number(lat)
                ) < 0.00001 &&
                Math.abs(
                    dropCoords.lng - Number(lng)
                ) < 0.00001
            ){

                $("dropInput").value =
                    address;

            }

        }


        syncBookingLocations();


        if(
            pickupCoords &&
            dropCoords
        ){

            drawRoute();

        }else{

            updateFareFromRoute();

        }

    }catch(error){

        console.warn(
            "Reverse geocode:",
            error
        );


        syncBookingLocations();


        if(
            pickupCoords &&
            dropCoords
        ){

            drawRoute();

        }else{

            updateFareFromRoute();

        }

    }

}


async function searchLocation(
    query,
    type
){

    query =
        String(query || "")
            .trim();


    if(query.length < 3){

        hideSearchResults(type);

        return;

    }


    const requestId =
        type === "pickup"
            ? ++pickupSearchRequestId
            : ++dropSearchRequestId;


    try{

        const response =
            await fetch(

                "https://nominatim.openstreetmap.org/search?" +

                new URLSearchParams({

                    q:query,

                    format:"json",

                    limit:5,

                    countrycodes:"in",

                    addressdetails:1

                }),

                {
                    headers:{
                        "Accept-Language":"en"
                    }

                }

            );


        if(!response.ok){

            throw new Error(
                "Location search failed."
            );

        }


        const results =
            await response.json();


        if(
            (
                type === "pickup" &&
                requestId !== pickupSearchRequestId
            ) ||
            (
                type === "drop" &&
                requestId !== dropSearchRequestId
            )
        ){

            return;

        }


        showSearchResults(
            results,
            type
        );

    }catch(error){

        console.warn(
            "Location search:",
            error
        );

    }

}


function showSearchResults(
    results,
    type
){

    const container =
        type === "pickup"
            ? $("pickupResults")
            : $("dropResults");


    if(
        !Array.isArray(results) ||
        !results.length
    ){

        hideSearchResults(type);

        return;

    }


    container.innerHTML = "";


    results.forEach(
        result => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "search-result";


            item.textContent =
                result.display_name;


            item.addEventListener(
                "click",
                function(){

                    const lat =
                        Number(result.lat);

                    const lng =
                        Number(result.lon);


                    if(type === "pickup"){

                        setPickup(
                            lat,
                            lng,
                            result.display_name
                        );

                    }else{

                        setDrop(
                            lat,
                            lng,
                            result.display_name
                        );

                    }


                    hideSearchResults(type);


                    if(map){

                        map.setView(
                            [lat,lng],
                            15
                        );

                    }

                }
            );


            container.appendChild(
                item
            );

        }
    );


    container.classList.add(
        "show"
    );

}


function hideSearchResults(
    type
){

    const container =
        type === "pickup"
            ? $("pickupResults")
            : $("dropResults");


    if(container){

        container.classList.remove(
            "show"
        );

    }

}


function clearLocation(
    type
){

    if(type === "pickup"){

        pickupCoords = null;

        reversePickupRequestId++;

        if(pickupMarker && map){

            map.removeLayer(
                pickupMarker
            );

        }

        pickupMarker = null;

    }else{

        dropCoords = null;

        reverseDropRequestId++;

        if(dropMarker && map){

            map.removeLayer(
                dropMarker
            );

        }

        dropMarker = null;

    }


    clearRoute();

    syncBookingLocations();

    updateFareFromRoute();

    updateBookButton();

}


$("pickupInput")
    .addEventListener(
        "input",
        function(){

            clearLocation("pickup");


            clearTimeout(
                pickupSearchTimer
            );


            const value =
                this.value.trim();


            if(value.length < 3){

                hideSearchResults("pickup");

                return;

            }


            pickupSearchTimer =
                setTimeout(
                    () => {

                        searchLocation(
                            value,
                            "pickup"

                    },

                );

        }

$("dropInput")
    .addEventListener(
        "input",
        function(){

            clearLocation("drop");


            clearTimeout(
                dropSearchTimer
            );


            const value =
                this.value.trim();


            if(value.length < 3){

                hideSearchResults("drop");

                return;

            }


            dropSearchTimer =
                setTimeout(
                    () => {

                        searchLocation(
                            value,
                            "drop"
                        );

                    },
                    500
                );

        }
    );


function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;

    const dLat =
        (
            Number(lat2) -
            Number(lat1)
        ) *
        Math.PI /
        180;

    const dLon =
        (
            Number(lon2) -
            Number(lon1)
        ) *
        Math.PI /
        180;


    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(
            Number(lat1) *
            Math.PI /
            180
        )

        *

        Math.cos(
            Number(lat2) *
            Math.PI /
            180
        )

        *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    const safeA =
        Math.min(
            1,
            Math.max(
                0,
                a
            )
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(safeA),
            Math.sqrt(1 - safeA)
        );


    return R * c;

}


function updateFareFromRoute(){

    if(
        !pickupCoords ||
        !dropCoords
    ){

        $("distanceText").textContent =
            "-- km";

        $("baseFare").textContent =
            "₹0";

        $("distanceFare").textContent =
            "₹0";

        $("bookingFee").textContent =
            "₹0";

        $("totalFare").textContent =
            "₹0";


        if(
            window.RiderXBookingAPI
        ){

            window.RiderXBookingAPI
                .setRouteData(
                    0,
                    0
                );

        }


        updateBookButton();

        return;

    }


    if(
        routeDistanceKm <= 0
    ){

        routeDistanceKm =
            calculateDistance(

                pickupCoords.lat,
                pickupCoords.lng,

                dropCoords.lat,
                dropCoords.lng

            );

    }


    if(
        routeDurationMin <= 0
    ){

        routeDurationMin =
            Math.max(
                5,
                Math.round(
                    routeDistanceKm * 3
                )
            );

    }


    $("distanceText").textContent =
        routeDistanceKm.toFixed(1) +
        " km";


    let base = 30;

    let rate = 8;


    if(selectedService === "cab"){

        base = 60;
        rate = 12;

    }else if(
        selectedService === "parcel"
    ){

        base = 40;
        rate = 10;

    }else if(
        selectedService === "food"
    ){

        base = 35;
        rate = 9;

    }


    const hour =
        new Date().getHours();


    const night =
        hour >= 22 ||
        hour < 6;


    let distanceFare = 0;


    if(
        selectedService === "bike"
    ){

        if(night){

            distanceFare =
                routeDistanceKm * 11;

        }else if(
            routeDistanceKm > 10
        ){

            distanceFare =
                (10 * 8) +
                (
                    (routeDistanceKm - 10) *
                    9
                );

        }else{

            distanceFare =
                routeDistanceKm * 8;

        }

    }else{

        distanceFare =
            routeDistanceKm * rate;

    }


    const bookingFee =
        selectedService === "bike"
            ? 5
            : 10;


    const total =
        Math.max(

            Math.round(
                base +
                distanceFare +
                bookingFee
            ),

            base

        );


    $("baseFare").textContent =
        "₹" +
        Math.round(base);


    $("distanceFare").textContent =
        "₹" +
        Math.round(distanceFare);


    $("bookingFee").textContent =
        "₹" +
        bookingFee;


    $("totalFare").textContent =
        "₹" +
        total;


    syncBookingLocations();


    if(
        window.RiderXBookingAPI
    ){

        window.RiderXBookingAPI
            .setService(
                selectedService
            );


        window.RiderXBookingAPI
            .setPaymentMethod(
                selectedPayment
            );


        window.RiderXBookingAPI
            .setRouteData(
                routeDistanceKm,
                routeDurationMin
            );


        window.RiderXBookingAPI
            .calculateFareEstimate();

    }


    updateBookButton();

}


function selectService(
    service,
    button
){

    selectedService =
        String(service || "bike")
            .toLowerCase();


    if(
        ![
            "bike",
            "cab",
            "parcel",
            "food"
        ].includes(selectedService)
    ){

        selectedService = "bike";

    }


    document
        .querySelectorAll(".service")
        .forEach(
            el =>
                el.classList.remove(
                    "active"
                )
        );


    if(button){

        button.classList.add(
            "active"
        );

    }


    if(
        window.RiderXBookingAPI
    ){

        window.RiderXBookingAPI
            .setService(
                selectedService
            );

    }


    updateFareFromRoute();

}


window.selectService =
    selectService;


function selectPayment(
    payment,
    button
){

    selectedPayment =
        String(payment || "cash")
            .toLowerCase();


    if(
        ![
            "cash",
            "online",
            "wallet"
        ].includes(selectedPayment)
    ){

        selectedPayment = "cash";

    }


    document
        .querySelectorAll(
            ".payment-option"
        )
        .forEach(
            el =>
                el.classList.remove(
                    "active"
                )
        );


    if(button){

        button.classList.add(
            "active"
        );

    }


    if(
        window.RiderXBookingAPI
    ){

        window.RiderXBookingAPI
            .setPaymentMethod(
                selectedPayment
            );

    }

}


window.selectPayment =
    selectPayment;


function swapLocations(){

    const pickupText =
        $("pickupInput").value;

    const dropText =
        $("dropInput").value;


    const oldPickup =
        pickupCoords
            ? {...pickupCoords}
            : null;

    const oldDrop =
        dropCoords
            ? {...dropCoords}
            : null;


    pickupCoords =
        oldDrop;

    dropCoords =
        oldPickup;


    $("pickupInput").value =
        dropText;

    $("dropInput").value =
        pickupText;


    if(
        pickupCoords
    ){

        if(!pickupMarker){

            pickupMarker =
                createMarker(
                    "pickup",
                    pickupCoords.lat,
                    pickupCoords.lng
                );

        }else{

            pickupMarker.setLatLng(
                [
                    pickupCoords.lat,
                    pickupCoords.lng
                ]
            );

        }

    }else if(pickupMarker){

        map.removeLayer(
            pickupMarker
        );

        pickupMarker = null;

    }


    if(
        dropCoords
    ){

        if(!dropMarker){

            dropMarker =
                createMarker(
                    "drop",
                    dropCoords.lat,
                    dropCoords.lng
                );

        }else{

            dropMarker.setLatLng(
                [
                    dropCoords.lat,
                    dropCoords.lng
                ]
            );

        }

    }else if(dropMarker){

        map.removeLayer(
            dropMarker
        );

        dropMarker = null;

    }


    clearRoute();

    syncBookingLocations();

    updateBookingState();

}


window.swapLocations =
    swapLocations;


async function bookRide(){

    const bookButton =
        $("bookBtn");


    if(
        !bookButton ||
        bookButton.disabled
    ){

        return;

    }


    if(
        !window.RiderXBookingReady
    ){

        showToast(
            "RiderX booking engine is not ready. Please wait.",
            "error"
        );

        return;

    }


    if(!pickupCoords){

        showToast(
            "Please select pickup location.",
            "error"
        );

        return;

    }


    if(!dropCoords){

        showToast(
            "Please select drop location.",
            "error"
        );

        return;

    }


    if(
        pickupCoords.lat ===
        dropCoords.lat &&
        pickupCoords.lng ===
        dropCoords.lng
    ){

        showToast(
            "Pickup and drop cannot be the same.",
            "error"
        );

        return;

    }


    const api =
        window.RiderXBookingAPI;


    if(!api){

        showToast(
            "Booking engine unavailable. Please reload the page.",
            "error"
        );

        return;

    }


    const user =
        api.auth?.currentUser;


    if(!user){

        showToast(
            "Please login as customer first.",
            "error"
        );


        setTimeout(
            () => {

                window.location.href =
                    "../auth/login.html?role=customer";

            },
            900
        );


        return;

    }


    syncBookingLocations();


    api.setService(
        selectedService
    );


    api.setPaymentMethod(
        selectedPayment
    );


    api.setRouteData(
        routeDistanceKm,
        routeDurationMin
    );


    const estimate =
        api.calculateFareEstimate();


    if(
        !estimate ||
        !estimate.fare ||
        estimate.fare <= 0
    ){

        showToast(
            "Unable to calculate fare.",
            "error"
        );

        return;

    }


    setLoading(
        true,
        "Creating ride request..."
    );


    try{

        const booking =
            await api.createRideRequest(
                selectedPayment
            );


        if(!booking){

            throw new Error(
                "Ride request was not created."
            );

        }


        const rideId =

            booking.id ||
            booking.rideId ||
            booking.bookingId ||
            "";


        if(!rideId){

            throw new Error(
                "Ride was created but no ride ID was returned."
            );

        }


        localStorage.setItem(
            "riderx_active_ride_id",
            rideId
        );


        localStorage.setItem(
            "riderxPendingBooking",
            JSON.stringify({

                rideId,

                bookingId:rideId,

                customerId:
                    user.uid,

                status:"searching",

                createdAt:
                    Date.now()

            })
        );


        setLoading(
            true,
            "Ride request sent..."
        );


        showToast(
            "Ride request sent successfully.",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    "searching.html?rideId=" +
                    encodeURIComponent(
                        rideId
                    );

            },
            700
        );


    }catch(error){

        console.error(
            "RiderX ride creation error:",
            error
        );


        setLoading(false);


        let message =
            error?.message ||
            "Unable to create ride.";


        if(
            error?.code ===
            "permission-denied"
        ){

            message =
                "Firestore permission denied. Check your Firebase rules.";

        }


        if(
            error?.code ===
            "unauthenticated"
        ){

            message =
                "Customer login expired. Please login again.";

        }


        showToast(
            message,
            "error"
        );

    }

}


window.bookRide =
    bookRide;


function updateBookingState(){

    syncBookingLocations();


    if(
        pickupCoords &&
        dropCoords
    ){

        drawRoute();

    }else{

        updateFareFromRoute();

    }


    updateBookButton();

}


function setLoading(
    show,
    text="Please wait..."
){

    $("loadingOverlay")
        .classList.toggle(
            "show",
            !!show
        );


    $("loadingText")
        .textContent =
        text;


    if(!show){

        updateBookButton();

    }else{

        $("bookBtn").disabled =
            true;

    }

}


function showToast(
    message,
    type=""
){

    const toast =
        $("toast");


    toast.textContent =
        String(message || "");


    toast.className =
        "toast show " +
        String(type || "");


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.className =
                    "toast";

            },
            3500
        );

}


window.showToast =
    showToast;


function goBack(){

    if(
        history.length > 1
    ){

        history.back();

    }else{

        window.location.href =
            "home.html";

    }

}


window.goBack =
    goBack;


const sheet =
    $("bookingSheet");

const handle =
    $("sheetHandle");


function startSheetDrag(y){

    draggingSheet = true;

    sheetDragged = false;

    sheetStartY = y;

    sheetStartHeight =
        sheet.getBoundingClientRect().height;

}


function moveSheetDrag(y){

    if(!draggingSheet){
        return;
    }


    const delta =
        sheetStartY - y;


    if(
        Math.abs(delta) > 4
    ){

        sheetDragged = true;

    }


    const viewport =
        window.innerHeight ||
        document.documentElement.clientHeight;


    let newHeight =
        sheetStartHeight +
        delta;


    const minHeight =
        315;


    const maxHeight =
        viewport * .88;


    newHeight =
        Math.max(
            minHeight,
            Math.min(
                maxHeight,
                newHeight
            )
        );


    sheet.style.height =
        newHeight + "px";


    sheet.classList.remove(
        "expanded"
    );

}


function endSheetDrag(){

    if(!draggingSheet){
        return;
    }


    draggingSheet = false;


    const height =
        sheet.getBoundingClientRect().height;


    const viewport =
        window.innerHeight ||
        document.documentElement.clientHeight;


    sheet.style.height = "";


    if(
        height >
        viewport * .58
    ){

        sheet.classList.add(
            "expanded"
        );

    }else{

        sheet.classList.remove(
            "expanded"
        );

    }

}


handle.addEventListener(
    "touchstart",
    function(event){

        startSheetDrag(
            event.touches[0].clientY
        );

    },
    {
        passive:true
    }
);


handle.addEventListener(
    "touchmove",
    function(event){

        moveSheetDrag(
            event.touches[0].clientY
        );

    },
    {
        passive:true
    }
);


handle.addEventListener(
    "touchend",
    endSheetDrag
);


handle.addEventListener(
    "mousedown",
    function(event){

        startSheetDrag(
            event.clientY
        );

    }
);


document.addEventListener(
    "mousemove",
    function(event){

        moveSheetDrag(
            event.clientY
        );

    }
);


document.addEventListener(
    "mouseup",
    endSheetDrag
);


handle.addEventListener(
    "click",
    function(){

        if(sheetDragged){

            sheetDragged = false;

            return;

        }


        sheet.classList.toggle(
            "expanded"
        );

    }
);


document.addEventListener(
    "click",
    function(event){

        const pickupResults =
            $("pickupResults");

        const dropResults =
            $("dropResults");

        const pickupInput =
            $("pickupInput");

        const dropInput =
            $("dropInput");


        if(
            !pickupInput.contains(event.target) &&
            !pickupResults.contains(event.target)
        ){

            hideSearchResults("pickup");

        }


        if(
            !dropInput.contains(event.target) &&
            !dropResults.contains(event.target)
        ){

            hideSearchResults("drop");

        }

    }
);


document.addEventListener(
    "DOMContentLoaded",
    function(){

        initMap();


        selectedService =
            "bike";

        selectedPayment =
            "cash";


        updateFareFromRoute();

        updateBookButton();


        if(
            navigator.geolocation
        ){

            navigator.geolocation.getCurrentPosition(

                function(position){

                    if(
                        !pickupCoords
                    ){

                        setPickup(

                            position.coords.latitude,

                            position.coords.longitude

                        );


                        if(map){

                            map.setView(
                                [
                                    position.coords.latitude,
                                    position.coords.longitude
                                ],
                                15
                            );

                        }

                    }

                },

                function(){

                    console.log(
                        "Automatic location permission not granted."
                    );

                },

                {

                    enableHighAccuracy:true,

                    timeout:7000,

                    maximumAge:60000

                }

            );

        }

    },
    {
        once:true
    }
);


window.addEventListener(
    "riderx-booking-ready",
    function(){

        window.RiderXBookingReady =
            true;


        const status =
            $("engineStatus");


        const statusText =
            $("engineStatusText");


        if(status){

            status.classList.add(
                "ready"
            );

        }


        if(statusText){

            statusText.textContent =
                "Booking engine ready";

        }


        syncBookingLocations();


        if(
            pickupCoords &&
            dropCoords
        ){

            updateFareFromRoute();

        }


        updateBookButton();

    }
);

</script>
