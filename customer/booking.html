<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>RiderX Booking</title>


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

#map{

height:350px;

border-radius:20px;

margin:15px 0;

}

</style>


</head>


<body>


<div class="splash">


<img src="../assets/logo.png" class="logo">


<h1>
Rider<span>X</span>
</h1>


<h2>
Book Your Ride
</h2>



<div id="map"></div>



<input id="pickup"
placeholder="Pickup Location"
readonly>


<input id="drop"
placeholder="Drop Location">



<select id="vehicle">

<option value="bike">
🏍 Bike
</option>


<option value="cab">
🚕 Cab
</option>


<option value="parcel">
📦 Parcel
</option>


</select>



<h3 id="distance">
Distance: 0 KM
</h3>



<h3 id="fare">
Fare: ₹0
</h3>



<button onclick="calculateRide()">

Calculate Fare

</button>



<button onclick="bookRide()">

Book Ride

</button>



<p id="message"></p>



</div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script type="module" src="../js/booking.js"></script>


</body>

</html>
