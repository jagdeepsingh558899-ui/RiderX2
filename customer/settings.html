<!DOCTYPE html>
<html lang="en">
<head>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX | Settings</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#FFE500">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}


body{

background:#080808;
color:white;
min-height:100vh;
padding-bottom:80px;

}


.header{

display:flex;
align-items:center;
justify-content:space-between;
padding:20px;

border-bottom:1px solid #222;

}


.logo{

font-size:25px;
font-weight:800;

}

.logo span{

color:#FFE500;

}


.container{

padding:20px;

}



.card{

background:#151515;
border:1px solid #292929;
border-radius:18px;
padding:20px;
margin-bottom:20px;

}


.title{

font-size:18px;
font-weight:700;
margin-bottom:15px;

}


.option{

display:flex;
align-items:center;
justify-content:space-between;

padding:15px 0;

border-bottom:1px solid #292929;

}


.option:last-child{

border:none;

}


.icon{

width:40px;
height:40px;

background:#FFE500;
color:black;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

margin-right:12px;

}



.left{

display:flex;
align-items:center;

}



select{

background:#222;
color:white;

padding:8px;
border-radius:8px;

border:1px solid #FFE500;

}



button{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#FFE500;

font-weight:700;

cursor:pointer;

}



.logout{

background:#ff3b30;
color:white;

}



.switch{

position:relative;

width:50px;
height:26px;

}


.switch input{

display:none;

}


.slider{

position:absolute;

background:#555;

width:100%;
height:100%;

border-radius:20px;

}


.slider:before{

content:"";

position:absolute;

width:22px;
height:22px;

background:white;

border-radius:50%;

top:2px;
left:2px;

transition:.3s;

}


input:checked + .slider{

background:#FFE500;

}


input:checked + .slider:before{

transform:translateX(24px);

}



.bottom{

position:fixed;

bottom:0;
left:0;

width:100%;

background:#111;

display:flex;

justify-content:space-around;

padding:12px 0;

border-top:1px solid #333;

}



.bottom a{

color:#aaa;

text-decoration:none;

font-size:12px;

text-align:center;

}


.bottom i{

display:block;

font-size:20px;

margin-bottom:4px;

}


.active{

color:#FFE500!important;

}



</style>


</head>


<body>



<div class="header">

<div class="logo">
RIDER<span>X</span>
</div>


<i class="fa-solid fa-gear"></i>

</div>




<div class="container">



<div class="card">


<div class="title">

Language / भाषा

</div>



<div class="option">


<div class="left">

<div class="icon">
<i class="fa-solid fa-language"></i>
</div>

<span data-lang="language">
Language
</span>


</div>


<select id="language">

<option value="en">
English
</option>


<option value="hi">
हिंदी
</option>


</select>


</div>


</div>





<div class="card">


<div class="title">

Appearance

</div>



<div class="option">


<div class="left">


<div class="icon">

<i class="fa-solid fa-moon"></i>

</div>


<span>
Dark Mode
</span>


</div>



<label class="switch">

<input type="checkbox" id="darkMode" checked>

<span class="slider"></span>

</label>



</div>


</div>







<div class="card">


<div class="title">

App

</div>


<div class="option">


<div class="left">


<div class="icon">

<i class="fa-solid fa-download"></i>

</div>


<span>
Install RiderX App
</span>


</div>


</div>


<button onclick="installApp()">

<i class="fa-solid fa-mobile-screen"></i>
Install App

</button>


</div>








<div class="card">


<div class="title">

Account

</div>


<div class="option">


<div class="left">

<div class="icon">

<i class="fa-solid fa-user"></i>

</div>


Profile

</div>


</div>



<div class="option">


<div class="left">

<div class="icon">

<i class="fa-solid fa-bell"></i>

</div>


Notifications

</div>


</div>



<button class="logout" onclick="logout()">

Logout

</button>



</div>




</div>






<div class="bottom">


<a href="home.html">

<i class="fa-solid fa-house"></i>
Home

</a>



<a href="booking.html">

<i class="fa-solid fa-motorcycle"></i>
Booking

</a>



<a href="history.html">

<i class="fa-solid fa-clock"></i>
History

</a>


<a href="wallet.html">

<i class="fa-solid fa-wallet"></i>
Wallet

</a>



<a href="profile.html">

<i class="fa-solid fa-user"></i>
Profile

</a>


</div>





<script>


let deferredPrompt;



window.addEventListener(
"beforeinstallprompt",
(e)=>{

e.preventDefault();

deferredPrompt=e;


});




function installApp(){


if(deferredPrompt){


deferredPrompt.prompt();


deferredPrompt.userChoice.then(()=>{

deferredPrompt=null;

});


}

else{


alert(
"Install option is available from Chrome menu"
);


}


}





document.getElementById("language")
.onchange=function(){


localStorage.setItem(
"language",
this.value
);


if(this.value==="hi"){

alert("हिंदी भाषा चालू हो गई");

}
else{

alert("English language activated");

}


};





let mode=document.getElementById("darkMode");


mode.onchange=function(){


localStorage.setItem(
"darkMode",
this.checked
);


};




function logout(){

firebase.auth().signOut()
.then(()=>{

window.location.href="../auth/login.html";

});


}



</script>



<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="../firebase/firebase-config.js"></script>



</body>

</html>
