<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Settings</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

background:#000;
color:#fff;
padding-bottom:30px;

}



.header{

height:70px;

background:#111;

display:flex;

align-items:center;

padding:0 20px;

gap:20px;

}



.header i{

color:#FFD600;
font-size:22px;

}



.logo{

font-size:28px;
font-weight:900;

}



.logo span{

color:#FFD600;

}




.container{

padding:20px;

}



.card{

background:#111;

border:1px solid #333;

border-radius:20px;

padding:20px;

margin-bottom:15px;

}



.title{

font-size:18px;

font-weight:bold;

margin-bottom:15px;

color:#FFD600;

}



.option{

display:flex;

justify-content:space-between;

align-items:center;

padding:15px 0;

border-bottom:1px solid #222;

}



.option:last-child{

border:none;

}



.option i{

width:30px;

color:#FFD600;

}



.option-left{

display:flex;

align-items:center;

gap:12px;

}



select{

background:#222;

color:#fff;

border:none;

padding:10px;

border-radius:10px;

}




.switch{

width:50px;

height:26px;

background:#444;

border-radius:20px;

position:relative;

cursor:pointer;

}



.switch::after{

content:"";

position:absolute;

width:22px;

height:22px;

background:#fff;

border-radius:50%;

top:2px;

left:3px;

transition:.3s;

}



.switch.active{

background:#FFD600;

}



.switch.active::after{

left:25px;

background:#000;

}




.btn{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:15px;

font-weight:bold;

font-size:16px;

background:#FFD600;

color:#000;

}



.logout{

background:#ff3030;

color:#fff;

}



</style>

</head>



<body>



<div class="header">


<i onclick="history.back()"
class="fa-solid fa-arrow-left"></i>



<div class="logo">

RID<span>ERX</span>

</div>


</div>






<div class="container">





<div class="card">


<div class="title">

<i class="fa-solid fa-mobile-screen"></i>

App

</div>




<div class="option"
onclick="installApp()">



<div class="option-left">

<i class="fa-solid fa-download"></i>

<span>

Install RiderX App

</span>


</div>



<i class="fa-solid fa-chevron-right"></i>



</div>


</div>







<div class="card">


<div class="title">

<i class="fa-solid fa-language"></i>

Language

</div>



<div class="option">


<div class="option-left">


<i class="fa-solid fa-globe"></i>


<span>

Select Language

</span>


</div>



<select id="language"
onchange="changeLanguage()">


<option value="en">

English

</option>


<option value="hi">

हिंदी

</option>


</select>



</div>



</div>







<div class="card">


<div class="title">

<i class="fa-solid fa-gear"></i>

Preferences

</div>




<div class="option">


<div class="option-left">


<i class="fa-solid fa-moon"></i>


<span>

Dark Mode

</span>


</div>



<div class="switch active"
id="darkMode"
onclick="toggleDark()">

</div>



</div>






<div class="option">


<div class="option-left">


<i class="fa-solid fa-bell"></i>


<span>

Ride Notifications

</span>


</div>



<div class="switch active"
id="notify"
onclick="toggleNotify()">

</div>



</div>




</div>








<div class="card">


<div class="title">

Support

</div>




<div class="option"
onclick="alert('Coming Soon')">


<div class="option-left">


<i class="fa-solid fa-headset"></i>


<span>

Help & Support

</span>


</div>



<i class="fa-solid fa-chevron-right"></i>


</div>




<div class="option">


<div class="option-left">


<i class="fa-solid fa-shield"></i>


<span>

Privacy Policy

</span>


</div>



</div>



</div>







<button class="btn"
onclick="goProfile()">


<i class="fa-solid fa-user"></i>

Back To Profile


</button>



<button class="btn logout"
onclick="logout()">


<i class="fa-solid fa-right-from-bracket"></i>

Logout


</button>




</div>









<script type="module">


import {

auth

}

from "../firebase/firebase-config.js";


import {

signOut

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";




let deferredPrompt;



window.addEventListener(
"beforeinstallprompt",
(e)=>{


e.preventDefault();


deferredPrompt=e;


});







window.installApp=async()=>{


if(deferredPrompt){


deferredPrompt.prompt();


deferredPrompt=null;


}

else{


alert(
"App install option browser menu me available hai"
);


}


};







window.changeLanguage=()=>{


let lang =
document.getElementById("language").value;



localStorage.setItem(
"language",
lang
);



alert(
lang==="hi"
?"भाषा हिंदी चुनी गई"
:"English Selected"
);



};








window.toggleDark=()=>{


document
.getElementById("darkMode")
.classList.toggle("active");


};








window.toggleNotify=()=>{


document
.getElementById("notify")
.classList.toggle("active");


};








window.goProfile=()=>{


location.href="profile.html";


};








window.logout=async()=>{


await signOut(auth);


location.href="../auth/login.html";


};





</script>



</body>

</html>
