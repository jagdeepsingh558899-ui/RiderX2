<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Customer Settings</title>


<link rel="stylesheet" href="../css/Style.css">

<link rel="stylesheet" href="../css/Responsive.css">


</head>


<body>


<nav class="navbar">


<div class="logo">


<img src="../assets/logo.png">


<span>
RiderX
</span>


</div>


</nav>







<div class="dashboard-wrapper page">



<div class="card">


<h2>

⚙ Settings

</h2>


<br>



<!-- Install App -->


<div class="card">


<h3>

📲 Install RiderX App

</h3>


<p>

Install app for faster booking experience

</p>


<br>


<button id="installBtn" class="btn">

Install App

</button>


</div>









<!-- Language -->


<div class="card">


<h3>

🌐 Language

</h3>


<br>


<select class="input-box" id="language">


<option>

English

</option>


<option>

Hindi

</option>


</select>


</div>









<!-- Dark Mode -->


<div class="card">


<h3>

🌙 Dark Mode

</h3>


<br>


<button id="darkBtn" class="btn">

Enable Dark Mode

</button>


</div>









<!-- Account -->


<div class="card">


<h3>

👤 Account

</h3>


<br>


<a href="Profile.html" class="btn">

Edit Profile

</a>


</div>





</div>


</div>








<script>


// Install App


let deferredPrompt;



const installBtn =
document.getElementById("installBtn");



window.addEventListener(

"beforeinstallprompt",

(e)=>{


e.preventDefault();


deferredPrompt=e;


});






installBtn.onclick=async()=>{


if(deferredPrompt){


deferredPrompt.prompt();


await deferredPrompt.userChoice;


deferredPrompt=null;


}


};








// Dark Mode


const darkBtn =
document.getElementById("darkBtn");



darkBtn.onclick=()=>{


document.body.classList.toggle("dark-mode");



localStorage.setItem(

"darkMode",

"on"

);


};





if(localStorage.getItem("darkMode")){


document.body.classList.add("dark-mode");


}



</script>



</body>

</html>
