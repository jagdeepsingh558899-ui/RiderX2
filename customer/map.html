<!DOCTYPE html>
<html lang="en">

<head>
  
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Book Ride</title>


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>


<style>

body{

margin:0;

background:#000;

color:white;

font-family:Arial,sans-serif;

}


.header{

background:#111;

padding:18px;

color:#FFD600;

font-size:26px;

font-weight:900;

}



.container{

padding:15px;

}



#map{

height:350px;

width:100%;

border-radius:20px;

overflow:hidden;

}



.card{

background:#111;

padding:18px;

border-radius:20px;

margin-top:15px;

}



label{

color:#FFD600;

font-weight:bold;

}



input,select{

width:100%;

padding:14px;

margin-top:8px;

margin-bottom:12px;

background:#222;

color:white;

border:none;

border-radius:12px;

box-sizing:border-box;

}



.services{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

}



.service{

background:#222;

padding:15px;

text-align:center;

border-radius:15px;

cursor:pointer;

}



.active{

background:#FFD600;

color:#000;

}



.fare{

font-size:28px;

color:#FFD600;

font-weight:bold;

}



button{

width:100%;

padding:16px;

border:none;

border-radius:15px;

background:#FFD600;

color:#000;

font-weight:bold;

font-size:17px;

margin-top:15px;

}



</style>

</head>



<body>



<div class="header">

🏍 RiderX Ride

</div>





<div class="container">



<div id="map"></div>





<div class="card">


<label>

Pickup Location

</label>


<input id="pickup" placeholder="Current location">





<label>

Drop Location

</label>


<input id="drop" placeholder="Enter destination">



</div>







<div class="card">


<label>

Select Service

</label>



<div class="services">


<div class="service active" data-service="Bike Taxi">

🏍 Bike

</div>



<div class="service" data-service="Cab">

🚕 Cab

</div>



<div class="service" data-service="Parcel">

📦 Parcel

</div>



<div class="service" data-service="Food">

🍔 Food

</div>


</div>



</div>







<div class="card">


Estimated Fare


<div class="fare" id="fare">

₹0

</div>



<button id="bookRide">

Book Ride

</button>



</div>





</div>









<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script type="module" src="../js/customer-map.js"></script>



</body>

</html>
