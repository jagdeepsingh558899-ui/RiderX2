<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Live Ride</title>


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{
margin:0;
background:#000;
color:white;
}


#map{

height:75vh;
width:100%;

}


.card{

position:fixed;
bottom:0;
left:0;
right:0;

background:#111;

padding:20px;

border-radius:25px 25px 0 0;

z-index:999;

}


.status{

font-size:18px;
font-weight:bold;

}


button{

width:100%;
padding:14px;

margin-top:10px;

border-radius:15px;

border:none;

background:#FFD600;

font-weight:bold;

}



</style>


</head>


<body>



<div class="header">

🚕 RiderX Live Ride

</div>



<div id="map"></div>





<div class="card">


<div class="status" id="status">

Searching Rider...

</div>


<hr>


<p>

🏍 Rider:

<span id="riderName">

Waiting...

</span>

</p>


<p>

📍 Distance:

<span id="distance">

-

</span>

</p>


<p>

⏱ ETA:

<span id="eta">

-

</span>

</p>



<button id="callBtn">

📞 Call Rider

</button>


<button id="cancelBtn">

Cancel Ride

</button>



</div>






<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module" src="../js/customer-map.js"></script>


</body>


</html>
