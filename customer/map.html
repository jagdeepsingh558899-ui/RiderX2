<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Live Ride</title>


<link rel="stylesheet" href="../css/style.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


</head>


<body>



<div class="topbar">


<h2>
🚕 Live Ride
</h2>


</div>







<div class="container">






<div class="map-container">

<div id="map"></div>

</div>









<div class="card">


<h3>
Ride Status
</h3>


<h2 id="rideStatus">

Searching...

</h2>


</div>









<div class="card">


<h3>
Rider Details
</h3>



<p>

Name:

<b id="riderName">

Waiting...

</b>

</p>



<p>

Vehicle:

<b id="vehicle">

-

</b>

</p>





<button class="btn">

📞 Call Rider

</button>



<button class="btn-outline">

💬 Chat

</button>



</div>








</div>







<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/map.js"></script>


</body>

</html>
