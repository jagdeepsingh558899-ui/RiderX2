<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Live Tracking</title>


<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#FFD600">


<link rel="stylesheet" href="../css/style.css">


<!-- Leaflet CSS -->
<link 
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


</head>



<body>


<div class="topbar">

<h2>
🏍 RiderX
</h2>


<img src="../assets/logo.png">

</div>






<div class="container">



<!-- INSTALL APP -->


<div class="card">


<button

id="installApp"

class="btn"

style="display:none">

📲 Install RiderX App

</button>


</div>








<!-- MAP -->


<div class="map-container">


<div id="map"></div>


</div>









<!-- STATUS -->


<div class="card">


<h3>
Ride Status
</h3>


<h2 id="rideStatus">

Searching Rider...

</h2>


</div>









<!-- RIDER DETAILS -->


<div 
class="card"
id="riderCard"
style="display:none;"
>


<h3>
Your Rider
</h3>



<p>

🏍 Name:

<span id="riderName">
-
</span>


</p>



<p>

📞 Phone:

<span id="riderPhone">
-
</span>


</p>





<button

id="callRider"

class="btn">

📞 Call Rider

</button>





<button

id="chatRider"

class="btn-outline">

💬 Chat Rider

</button>



</div>









<!-- OTP -->


<div 

class="card"

id="otpBox"

style="display:none;"

>


<h3>

🔐 Ride OTP

</h3>



<h1>

<span id="rideOTP">

----

</span>

</h1>



<p>

Pickup ke time rider ko OTP dein.

</p>



</div>









<!-- RIDE INFO -->


<div class="card">


<h3>
Ride Details
</h3>



<div class="booking-row">

<span>
Pickup
</span>

<b id="pickupText">
-
</b>

</div>




<div class="booking-row">

<span>
Drop
</span>

<b id="dropText">
-
</b>

</div>





<div class="booking-row">

<span>
Fare
</span>

<b>

₹
<span id="fareText">

0

</span>

</b>

</div>




</div>







</div>










<div class="bottom-nav">


<a class="active">

🏠
<br>
Home

</a>



<a href="History.html">

📜
<br>
History

</a>




<a href="Profile.html">

👤
<br>
Profile

</a>



</div>









<!-- Leaflet JS -->

<script

src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

</script>





<script

type="module"

src="../js/App.js">

</script>




<script

type="module"

src="../js/customer-map.js">

</script>






</body>


</html>
