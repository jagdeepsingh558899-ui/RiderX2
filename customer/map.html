<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Live Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
}


.header{

    text-align:center;
    padding:20px;
    font-size:30px;
    font-weight:bold;

}


.header span{

    color:#FFD600;

}


#map{

    width:100%;
    height:500px;

}



button{

    width:90%;
    margin:20px 5%;
    padding:15px;

    border:none;
    border-radius:15px;

    background:#FFD600;

    font-size:18px;
    font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

RIDER<span>X</span>

</div>



<div id="map"></div>



<button id="location">

📍 My Location

</button>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script>


let map = L.map('map').setView(

[30.7333,76.7794],

13

);



L.tileLayer(

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

{

maxZoom:19,

attribution:'© OpenStreetMap'

}

).addTo(map);



document
.getElementById("location")
.onclick=function(){


navigator.geolocation.getCurrentPosition(

function(position){


let lat =
position.coords.latitude;


let lng =
position.coords.longitude;



map.setView(

[lat,lng],

16

);



L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup(
"You are here"
)

.openPopup();



},


function(){

alert(
"Location permission allow karo"
);

}


);



};


setTimeout(()=>{

map.invalidateSize();

},1000);



</script>


</body>

</html>
