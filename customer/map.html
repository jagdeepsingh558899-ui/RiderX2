<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>RiderX - Select Location</title>

<meta
    name="theme-color"
    content="#FFD400"
>

<link
    rel="stylesheet"
    href="../css/Style.css"
>

<link
    rel="stylesheet"
    href="../css/Dashboard.css"
>

<link
    rel="stylesheet"
    href="../css/Responsive.css"
>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

:root{
    --yellow:#FFD400;
    --black:#080808;
    --bg:#101010;
    --card:#191919;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    position:relative;
    width:100%;
    max-width:650px;
    height:100vh;
    margin:auto;
    overflow:hidden;
    background:#111;
}


/* =========================
   MAP
========================= */

#map{
    position:absolute;
    inset:0;
    z-index:1;
}

.leaflet-container{
    font-family:Arial,Helvetica,sans-serif;
}

.leaflet-control-attribution{
    font-size:7px!important;
    background:rgba(0,0,0,.7)!important;
    color:#aaa!important;
}

.leaflet-control-attribution a{
    color:#ccc!important;
}

.leaflet-control-zoom{
    display:none;
}


/* =========================
   TOP BAR
========================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:30;
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px 12px;
}

.back-btn{
    width:42px;
    height:42px;
    min-width:42px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:50%;
    background:rgba(10,10,10,.94);
    color:#fff;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.top-title{
    flex:1;
    padding:10px 12px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:13px;
    background:rgba(10,10,10,.94);
    backdrop-filter:blur(12px);
}

.top-main{
    font-size:9px;
    font-weight:900;
}

.top-sub{
    margin-top:3px;
    color:#777;
    font-size:6px;
}


/* =========================
   SEARCH
========================= */

.search-box{
    position:absolute;
    top:67px;
    left:12px;
    right:12px;
    z-index:30;
}

.search-wrap{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    background:rgba(12,12,12,.95);
    box-shadow:0 7px 25px rgba(0,0,0,.3);
}

.search-icon{
    color:#777;
    font-size:13px;
}

.search-input{
    width:100%;
    border:0;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:8px;
}

.search-input::placeholder{
    color:#666;
}

.clear-btn{
    display:none;
    width:22px;
    height:22px;
    border:0;
    border-radius:50%;
    background:#303030;
    color:#aaa;
    cursor:pointer;
}


/* =========================
   SEARCH RESULTS
========================= */

.results{
    display:none;
    margin-top:6px;
    max-height:220px;
    overflow-y:auto;
    border:1px solid #303030;
    border-radius:13px;
    background:#151515;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.results.show{
    display:block;
}

.result-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px;
    border-bottom:1px solid #292929;
    cursor:pointer;
}

.result-item:last-child{
    border-bottom:0;
}

.result-icon{
    width:29px;
    height:29px;
    min-width:29px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:#242424;
    color:var(--yellow);
}

.result-main{
    min-width:0;
    flex:1;
}

.result-name{
    font-size:7px;
    font-weight:900;
}

.result-address{
    margin-top:3px;
    color:#777;
    font-size:6px;
    line-height:1.3;
}


/* =========================
   MAP BUTTONS
========================= */

.map-actions{
    position:absolute;
    right:12px;
    top:126px;
    z-index:20;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.map-btn{
    width:40px;
    height:40px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:rgba(12,12,12,.94);
    color:#fff;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.map-btn.active{
    color:var(--yellow);
}


/* =========================
   CENTER PIN
========================= */

.center-pin{
    position:absolute;
    left:50%;
    top:50%;
    z-index:10;
    width:30px;
    height:38px;
    transform:translate(-50%,-100%);
    pointer-events:none;
}

.pin-head{
    width:28px;
    height:28px;
    border:3px solid #fff;
    border-radius:50% 50% 50% 0;
    background:var(--yellow);
    transform:rotate(-45deg);
    box-shadow:0 4px 15px rgba(0,0,0,.35);
}

.pin-dot{
    position:absolute;
    left:10px;
    top:10px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#111;
}

.pin-shadow{
    position:absolute;
    left:8px;
    bottom:0;
    width:15px;
    height:5px;
    border-radius:50%;
    background:rgba(0,0,0,.3);
}


/* =========================
   LOCATION LABEL
========================= */

.center-label{
    position:absolute;
    left:50%;
    top:calc(50% + 10px);
    z-index:12;
    transform:translateX(-50%);
    padding:6px 9px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:9px;
    background:rgba(10,10,10,.9);
    color:#ddd;
    font-size:6px;
    white-space:nowrap;
    pointer-events:none;
}


/* =========================
   BOTTOM SHEET
========================= */

.sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:40;
    max-width:650px;
    margin:auto;
    padding:9px 13px 18px;
    border-radius:24px 24px 0 0;
    border-top:1px solid #303030;
    background:rgba(13,13,13,.98);
    box-shadow:0 -10px 35px rgba(0,0,0,.45);
}

.handle{
    width:42px;
    height:4px;
    margin:0 auto 11px;
    border-radius:10px;
    background:#444;
}

.sheet-title{
    font-size:11px;
    font-weight:900;
}

.sheet-sub{
    margin-top:4px;
    color:#777;
    font-size:6px;
}


/* =========================
   LOCATION TYPE
========================= */

.type-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:12px;
}

.type-btn{
    height:37px;
    border:1px solid #333;
    border-radius:10px;
    background:#202020;
    color:#888;
    font-size:7px;
    font-weight:900;
    cursor:pointer;
}

.type-btn.active{
    border-color:var(--yellow);
    background:#272300;
    color:var(--yellow);
}


/* =========================
   SELECTED LOCATION
========================= */

.location-card{
    display:flex;
    align-items:center;
    gap:9px;
    margin-top:9px;
    padding:10px;
    border:1px solid #303030;
    border-radius:13px;
    background:#191919;
}

.location-dot{
    width:10px;
    height:10px;
    min-width:10px;
    border-radius:50%;
    background:var(--yellow);
}

.location-dot.drop{
    background:#fff;
}

.location-info{
    flex:1;
    min-width:0;
}

.location-label{
    color:#666;
    font-size:6px;
    font-weight:900;
    text-transform:uppercase;
}

.location-address{
    margin-top:4px;
    color:#ddd;
    font-size:7px;
    line-height:1.35;
    overflow:hidden;
}

.location-edit{
    width:31px;
    height:31px;
    border:1px solid #363636;
    border-radius:9px;
    background:#222;
    color:#aaa;
    cursor:pointer;
}


/* =========================
   CONFIRM
========================= */

.confirm-btn{
    width:100%;
    height:43px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:var(--yellow);
    color:#000;
    font-size:8px;
    font-weight:900;
    cursor:pointer;
}

.confirm-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}


/* =========================
   CURRENT LOCATION MARKER
========================= */

.user-marker{
    width:18px;
    height:18px;
    border:3px solid #fff;
    border-radius:50%;
    background:#2583ff;
    box-shadow:
        0 0 0 7px rgba(37,131,255,.2),
        0 3px 12px rgba(0,0,0,.4);
}


/* =========================
   LOADING
========================= */

.loading{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:9px;
    background:#101010;
}

.loading.hidden{
    display:none;
}

.spinner{
    width:32px;
    height:32px;
    border:3px solid #333;
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

.loading-text{
    color:#777;
    font-size:7px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:205px;
    z-index:150;
    width:calc(100% - 30px);
    max-width:500px;
    padding:11px 13px;
    transform:translate(-50%,20px);
    border:1px solid #333;
    border-radius:11px;
    background:#222;
    color:#fff;
    text-align:center;
    font-size:8px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.error{
    border-color:rgba(239,68,68,.5);
}

.toast.success{
    border-color:rgba(34,197,94,.5);
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .sheet{
        padding-left:11px;
        padding-right:11px;
    }

    .search-box{
        left:10px;
        right:10px;
    }

    .map-actions{
        right:10px;
    }

}

</style>

</head>

<body>

<div class="app">

    <div id="map"></div>

    <div
        class="loading"
        id="loading"
    >
        <div class="spinner"></div>

        <div
            class="loading-text"
            id="loadingText"
        >
            Getting your location...
        </div>
    </div>


    <!-- TOP BAR -->

    <div class="topbar">

        <button
            class="back-btn"
            onclick="goBack()"
            aria-label="Back"
        >
            ‹
        </button>

        <div class="top-title">

            <div class="top-main">
                Select Location
            </div>

            <div class="top-sub">
                Move the map or search for a location
            </div>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <div class="search-wrap">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="Search place or address"
                autocomplete="off"
            >

            <button
                id="clearBtn"
                class="clear-btn"
                onclick="clearSearch()"
                aria-label="Clear search"
            >
                ×
            </button>

        </div>

        <div
            class="results"
            id="results"
        ></div>

    </div>


    <!-- MAP ACTIONS -->

    <div class="map-actions">

        <button
            class="map-btn"
            id="currentLocationBtn"
            onclick="useCurrentLocation()"
            title="Current location"
        >
            ◎
        </button>

        <button
            class="map-btn"
            onclick="zoomIn()"
            title="Zoom in"
        >
            +
        </button>

        <button
            class="map-btn"
            onclick="zoomOut()"
            title="Zoom out"
        >
            −
        </button>

    </div>


    <!-- CENTER PIN -->

    <div class="center-pin">

        <div class="pin-head"></div>

        <div class="pin-dot"></div>

        <div class="pin-shadow"></div>

    </div>


    <div
        class="center-label"
        id="centerLabel"
    >
        Move map to select
    </div>


    <!-- BOTTOM SHEET -->

    <section class="sheet">

        <div class="handle"></div>

        <div class="sheet-title">
            Choose location
        </div>

        <div class="sheet-sub">
            Select pickup or destination location
        </div>


        <div class="type-tabs">

            <button
                id="pickupBtn"
                class="type-btn active"
                onclick="setLocationType('pickup')"
            >
                ● Pickup
            </button>

            <button
                id="dropBtn"
                class="type-btn"
                onclick="setLocationType('drop')"
            >
                ● Destination
            </button>

        </div>


        <div class="location-card">

            <div
                id="locationDot"
                class="location-dot"
            ></div>

            <div class="location-info">

                <div
                    id="locationLabel"
                    class="location-label"
                >
                    Pickup location
                </div>

                <div
                    id="selectedAddress"
                    class="location-address"
                >
                    Getting your location...
                </div>

            </div>

            <button
                class="location-edit"
                onclick="useCurrentLocation()"
                aria-label="Use current location"
            >
                ◎
            </button>

        </div>


        <button
            id="confirmBtn"
            class="confirm-btn"
            onclick="confirmLocation()"
            disabled
        >
            Confirm Pickup Location
        </button>

    </section>

</div>


<div
    id="toast"
    class="toast"
></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ============================================================
   RIDERX
   CUSTOMER LOCATION SELECTOR
   ============================================================ */


/* ============================================================
   STATE
   ============================================================ */

let map = null;

let currentLocationMarker = null;

let selectedType = "pickup";

let selectedLocation = null;

let pickupLocation = null;

let dropLocation = null;

let searchTimer = null;

let toastTimer = null;

let reverseTimer = null;

let reverseRequestId = 0;

let isSearching = false;

let isMapReady = false;


/* ============================================================
   FALLBACK LOCATION
   IMPORTANT:
   This is ONLY used when GPS / saved / URL location
   is unavailable.
   ============================================================ */

const FALLBACK_LOCATION = {
    lat:30.7046,
    lng:76.7179
};


/* ============================================================
   ELEMENT HELPER
   ============================================================ */

const $ = id =>
    document.getElementById(id);


/* ============================================================
   DOM READY
   ============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        const params = getParams();

        selectedType =
            params.type === "drop" ||
            params.type === "destination"
                ? "drop"
                : "pickup";


        updateTypeUI();


        loadSavedLocations(
            params
        );


        setupSearch();


        await initMap(
            params
        );

    }
);


/* ============================================================
   URL PARAMETERS
   ============================================================ */

function getParams(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    return {

        type:
            params.get("type") ||
            params.get("locationType") ||
            "pickup",

        lat:
            params.get("lat"),

        lng:
            params.get("lng"),

        address:
            params.get("address"),

        return:
            params.get("return"),

        pickupLat:
            params.get("pickupLat"),

        pickupLng:
            params.get("pickupLng"),

        pickupAddress:
            params.get("pickupAddress"),

        dropLat:
            params.get("dropLat"),

        dropLng:
            params.get("dropLng"),

        dropAddress:
            params.get("dropAddress")

    };

}


/* ============================================================
   MAP INITIALIZATION
   ============================================================ */

async function initMap(params){

    let startLocation =
        getInitialLocation(
            params
        );


    map =
        L.map(
            "map",
            {
                zoomControl:false,
                attributionControl:true
            }
        )
        .setView(
            [
                startLocation.lat,
                startLocation.lng
            ],
            startLocation.zoom || 16
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    )
    .addTo(
        map
    );


    map.on(
        "moveend",
        function(){

            updateCenterLocation();

        }
    );


    map.on(
        "zoomend",
        function(){

            updateCenterLocation();

        }
    );


    isMapReady = true;


    /*
      If we already have an exact URL/saved
      location, show it immediately.
    */

    if(
        startLocation.exact &&
        startLocation.address
    ){

        setSelectedLocation(
            startLocation.lat,
            startLocation.lng,
            startLocation.address,
            false
        );

    }else{

        /*
          GPS is the preferred source.
          Do NOT default to Chandigarh first.
        */

        if(
            startLocation.source === "gps-needed"
        ){

            await requestInitialGPS();

        }else{

            updateCenterLocation();

        }

    }


    $("loading")
        .classList.add(
            "hidden"
        );

}


/* ============================================================
   INITIAL LOCATION PRIORITY

   1. Explicit URL lat/lng
   2. URL pickup/drop
   3. Saved pickup/drop
   4. Temporary booking data
   5. GPS
   6. Chandigarh fallback
   ============================================================ */

function getInitialLocation(params){

    let lat = null;
    let lng = null;
    let address = null;


    /*
      1. Direct URL coordinates
    */

    if(
        validCoordinates(
            params.lat,
            params.lng
        )
    ){

        lat = Number(params.lat);
        lng = Number(params.lng);
        address = params.address || null;


        return {
            lat,
            lng,
            address,
            exact:true,
            source:"url"
        };

    }


    /*
      2. URL pickup
    */

    if(
        selectedType === "pickup" &&
        validCoordinates(
            params.pickupLat,
            params.pickupLng
        )
    ){

        return {
            lat:Number(params.pickupLat),
            lng:Number(params.pickupLng),
            address:
                params.pickupAddress ||
                null,
            exact:true,
            source:"url-pickup"
        };

    }


    /*
      3. URL destination
    */

    if(
        selectedType === "drop" &&
        validCoordinates(
            params.dropLat,
            params.dropLng
        )
    ){

        return {
            lat:Number(params.dropLat),
            lng:Number(params.dropLng),
            address:
                params.dropAddress ||
                null,
            exact:true,
            source:"url-drop"
        };

    }


    /*
      4. Saved selected location
    */

    const saved =
        selectedType === "pickup"
            ? pickupLocation
            : dropLocation;


    if(
        saved &&
        validCoordinates(
            saved.lat,
            saved.lng
        )
    ){

        return {
            lat:Number(saved.lat),
            lng:Number(saved.lng),
            address:saved.address || null,
            exact:true,
            source:"saved"
        };

    }


    /*
      5. Booking data
    */

    const booking =
        getBookingData();


    const bookingLocation =
        selectedType === "pickup"
            ? booking.pickup
            : booking.drop;


    if(
        bookingLocation &&
        validCoordinates(
            bookingLocation.lat,
            bookingLocation.lng
        )
    ){

        return {
            lat:Number(bookingLocation.lat),
            lng:Number(bookingLocation.lng),
            address:
                bookingLocation.address ||
                null,
            exact:true,
            source:"booking"
        };

    }


    /*
      6. Need GPS
    */

    if(
        navigator.geolocation
    ){

        return {
            ...FALLBACK_LOCATION,
            exact:false,
            source:"gps-needed"
        };

    }


    /*
      7. Final fallback only
    */

    return {
        ...FALLBACK_LOCATION,
        exact:false,
        source:"fallback"
    };

}


/* ============================================================
   INITIAL GPS
   ============================================================ */

function requestInitialGPS(){

    return new Promise(
        resolve => {

            if(
                !navigator.geolocation
            ){

                updateCenterLocation();

                resolve();

                return;

            }


            $("loadingText")
                .textContent =
                "Getting your current location...";


            navigator.geolocation.getCurrentPosition(

                position => {

                    const lat =
                        position.coords.latitude;

                    const lng =
                        position.coords.longitude;


                    if(
                        !validCoordinates(
                            lat,
                            lng
                        )
                    ){

                        updateCenterLocation();

                        resolve();

                        return;

                    }


                    updateCurrentMarker(
                        lat,
                        lng
                    );


                    map.setView(
                        [
                            lat,
                            lng
                        ],
                        17,
                        {
                            animate:false
                        }
                    );


                    setSelectedLocation(
                        lat,
                        lng,
                        "Getting address...",
                        false
                    );


                    reverseGeocode(
                        lat,
                        lng
                    );


                    resolve();

                },

                error => {

                    console.warn(
                        "Initial GPS unavailable:",
                        error
                    );


                    /*
                      GPS failed:
                      use fallback ONLY now.
                    */

                    map.setView(
                        [
                            FALLBACK_LOCATION.lat,
                            FALLBACK_LOCATION.lng
                        ],
                        14,
                        {
                            animate:false
                        }
                    );


                    updateCenterLocation();


                    resolve();

                },

                {
                    enableHighAccuracy:true,
                    timeout:10000,
                    maximumAge:30000
                }

            );

        }
    );

}


/* ============================================================
   CENTER LOCATION
   ============================================================ */

function updateCenterLocation(){

    if(
        !map ||
        !isMapReady ||
        isSearching
    ){

        return;

    }


    const center =
        map.getCenter();


    const requestId =
        ++reverseRequestId;


    selectedLocation = {

        lat:center.lat,
        lng:center.lng,
        address:"Getting address..."

    };


    $("selectedAddress")
        .textContent =
        "Getting address...";


    $("centerLabel")
        .textContent =
        "Getting address...";


    $("confirmBtn")
        .disabled = true;


    clearTimeout(
        reverseTimer
    );


    reverseTimer =
        setTimeout(
            function(){

                reverseGeocode(
                    center.lat,
                    center.lng,
                    requestId
                );

            },
            250
        );

}


/* ============================================================
   REVERSE GEOCODING
   ============================================================ */

async function reverseGeocode(
    lat,
    lng,
    requestId = reverseRequestId
){

    const thisRequest =
        requestId;


    try{

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/reverse" +
                "?format=json" +
                "&lat=" +
                encodeURIComponent(lat) +
                "&lon=" +
                encodeURIComponent(lng) +
                "&zoom=18" +
                "&addressdetails=1",
                {
                    headers:{
                        "Accept-Language":"en"
                    }
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Reverse geocode failed"
            );

        }


        const data =
            await response.json();


        /*
          Ignore stale request.
        */

        if(
            thisRequest !==
            reverseRequestId
        ){

            return;

        }


        if(
            !selectedLocation
        ){

            return;

        }


        const distance =
            calculateDistance(
                selectedLocation.lat,
                selectedLocation.lng,
                lat,
                lng
            );


        /*
          Ignore response for old map position.
        */

        if(
            distance >
            0.03
        ){

            return;

        }


        const address =
            data.display_name ||
            "Selected location";


        selectedLocation.address =
            address;


        $("selectedAddress")
            .textContent =
            address;


        $("centerLabel")
            .textContent =
            shortAddress(
                address
            );


        $("confirmBtn")
            .disabled =
            false;

    }catch(error){

        console.error(
            error
        );


        if(
            thisRequest !==
            reverseRequestId
        ){

            return;

        }


        if(
            selectedLocation
        ){

            selectedLocation.address =
                "Selected map location";


            $("selectedAddress")
                .textContent =
                "Selected map location";


            $("centerLabel")
                .textContent =
                "Selected location";


            $("confirmBtn")
                .disabled =
                false;

        }

    }

}


/* ============================================================
   SEARCH SETUP
   ============================================================ */

function setupSearch(){

    const input =
        $("searchInput");


    input.addEventListener(
        "input",
        function(){

            const query =
                input.value.trim();


            $("clearBtn")
                .style.display =
                query
                    ? "block"
                    : "none";


            clearTimeout(
                searchTimer
            );


            if(
                query.length <
                3
            ){

                $("results")
                    .classList.remove(
                        "show"
                    );

                return;

            }


            searchTimer =
                setTimeout(
                    function(){

                        searchPlaces(
                            query
                        );

                    },
                    600
                );

        }
    );


    input.addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();


                const query =
                    input.value.trim();


                if(
                    query.length >=
                    3
                ){

                    searchPlaces(
                        query
                    );

                }

            }

        }
    );

}


/* ============================================================
   SEARCH PLACES
   ============================================================ */

async function searchPlaces(query){

    if(
        isSearching
    ){

        return;

    }


    isSearching = true;


    const results =
        $("results");


    results.innerHTML =
        `
        <div
            class="result-item"
            style="
                justify-content:center;
                color:#777;
            "
        >
            Searching...
        </div>
        `;


    results.classList.add(
        "show"
    );


    try{

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search" +
                "?format=json" +
                "&q=" +
                encodeURIComponent(query) +
                "&limit=6" +
                "&addressdetails=1",
                {
                    headers:{
                        "Accept-Language":"en"
                    }
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Search failed"
            );

        }


        const data =
            await response.json();


        renderResults(
            data
        );

    }catch(error){

        console.error(
            error
        );


        results.innerHTML =
            `
            <div
                class="result-item"
                style="
                    justify-content:center;
                    color:#777;
                "
            >
                Unable to search right now
            </div>
            `;

    }finally{

        isSearching = false;

    }

}


/* ============================================================
   RENDER SEARCH RESULTS
   ============================================================ */

function renderResults(data){

    const results =
        $("results");


    if(
        !data ||
        data.length === 0
    ){

        results.innerHTML =
            `
            <div
                class="result-item"
                style="
                    justify-content:center;
                    color:#777;
                "
            >
                No location found
            </div>
            `;

        return;

    }


    results.innerHTML = "";


    data.forEach(
        item => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "result-item";


            row.innerHTML =
                `
                <div class="result-icon">
                    📍
                </div>

                <div class="result-main">

                    <div class="result-name">
                        ${escapeHtml(
                            getPlaceName(item)
                        )}
                    </div>

                    <div class="result-address">
                        ${escapeHtml(
                            item.display_name || ""
                        )}
                    </div>

                </div>
                `;


            row.addEventListener(
                "click",
                function(){

                    selectSearchResult(
                        item
                    );

                }
            );


            results.appendChild(
                row
            );

        }
    );

}


/* ============================================================
   SELECT SEARCH RESULT
   ============================================================ */

function selectSearchResult(item){

    const lat =
        Number(item.lat);

    const lng =
        Number(item.lon);


    if(
        !validCoordinates(
            lat,
            lng
        )
    ){

        showToast(
            "Invalid location.",
            "error"
        );

        return;

    }


    const address =
        item.display_name ||
        "Selected location";


    isSearching = true;


    ++reverseRequestId;


    selectedLocation = {

        lat,
        lng,
        address

    };


    map.setView(
        [
            lat,
            lng
        ],
        17,
        {
            animate:true
        }
    );


    $("selectedAddress")
        .textContent =
        address;


    $("centerLabel")
        .textContent =
        shortAddress(
            address
        );


    $("confirmBtn")
        .disabled =
        false;


    $("results")
        .classList.remove(
            "show"
        );


    $("searchInput")
        .value =
        getPlaceName(
            item
        );


    $("clearBtn")
        .style.display =
        "block";


    setTimeout(
        function(){

            isSearching = false;

        },

    );

}


/* ============================================================
   SET SELECTED LOCATION
   ============================================================ */

function setSelectedLocation(
    lat,
    lng,
    address,
    moveMap = true
){

    lat = Number(lat);
    lng = Number(lng);


    if(
        !validCoordinates(
            lat,
            lng
        )
    ){

        return;

    }


    ++reverseRequestId;


    selectedLocation = {

        lat,
        lng,
        address:
            address ||
            "Selected location"

    };


    $("selectedAddress")
        .textContent =
        selectedLocation.address;


    $("centerLabel")
        .textContent =
        shortAddress(
            selectedLocation.address
        );


    $("confirmBtn")
        .disabled =
        false;


    if(
        moveMap &&
        map
    ){

        map.setView(
            [
                lat,
                lng
            ],
            Math.max(
                map.getZoom(),
                15
            ),
            {
                animate:true
            }
        );

    }

}


/* ============================================================
   LOCATION TYPE
   ============================================================ */

function setLocationType(type){

    selectedType =
        type === "drop"
            ? "drop"
            : "pickup";


    updateTypeUI();


    const existing =
        selectedType === "pickup"
            ? pickupLocation
            : dropLocation;


    if(
        existing &&
        validCoordinates(
            existing.lat,
            existing.lng
        )
    ){

        setSelectedLocation(
            existing.lat,
            existing.lng,
            existing.address ||
                (
                    selectedType === "pickup"
                        ? "Pickup location"
                        : "Destination"
                )
        );

        return;

    }


    /*
      No saved destination:
      keep current map center as selection.
    */

    if(
        map
    ){

        const center =
            map.getCenter();


        setSelectedLocation(
            center.lat,
            center.lng,
            "Getting address..."
        );


        reverseGeocode(
            center.lat,
            center.lng
        );

    }

}


/* ============================================================
   UPDATE TYPE UI
   ============================================================ */

function updateTypeUI(){

    const pickupBtn =
        $("pickupBtn");

    const dropBtn =
        $("dropBtn");


    if(
        !pickupBtn ||
        !dropBtn
    ){

        return;

    }


    pickupBtn.classList.toggle(
        "active",
        selectedType === "pickup"
    );


    dropBtn.classList.toggle(

    );

    );

        .textContent =

        .textContent =
        selectedType === "pickup"
            ? "Confirm Pickup Location"

}


/* ============================================================
   CURRENT LOCATION
   ============================================================ */

function useCurrentLocation(){

    if(
        !navigator.geolocation
    ){

        showToast(
            "Location is not supported on this device.",
            "error"
        );

        return;

    }


    showToast(
        "Getting your current location..."
    );


    $("currentLocationBtn")
        .classList.add(
            "active"
        );


    navigator.geolocation.getCurrentPosition(

        async position => {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            if(
                !validCoordinates(
                    lat,
                    lng
                )
            ){

                showToast(
                    "Invalid GPS location.",
                    "error"
                );

                $("currentLocationBtn")
                    .classList.remove(
                        "active"
                    );

                return;

            }


            updateCurrentMarker(
                lat,
                lng
            );


            ++reverseRequestId;


            setSelectedLocation(
                lat,
                lng,
                "Getting address...",
                false
            );


            if(
                map
            ){

                map.setView(
                    [
                        lat,
                        lng
                    ],
                    17,
                    {
                        animate:true
                    }
                );

            }


            await reverseGeocode(
                lat,
                lng
            );


            $("currentLocationBtn")
                .classList.remove(
                    "active"
                );


            showToast(
                "Current location selected.",
                "success"
            );

        },

        error => {

            console.error(
                "GPS error:",
                error
            );


            $("currentLocationBtn")
                .classList.remove(
                    "active"
                );


            let message =
                "Unable to get your location.";


            if(
                error.code ===
                1
            ){

                message =
                    "Please allow location permission.";

            }else if(
                error.code ===
                2
            ){

                message =
                    "Your location is currently unavailable.";

            }else if(
                error.code ===
                3
            ){

                message =
                    "Location request timed out.";

            }


            showToast(
                message,
                "error"
            );

        },

        {
            enableHighAccuracy:true,
            timeout:12000,
            maximumAge:5000
        }

    );

}


/* ============================================================
   CURRENT LOCATION MARKER
   ============================================================ */

function updateCurrentMarker(
    lat,
    lng
){

    if(
        !map
    ){

        return;

    }


    if(
        currentLocationMarker
    ){

        currentLocationMarker.setLatLng(
            [
                lat,
                lng
            ]
        );

        return;

    }


    currentLocationMarker =
        L.marker(
            [
                lat,
                lng
            ],
            {
                icon:
                    L.divIcon({

                        className:"",
                        html:
                            `
                            <div class="user-marker"></div>
                            `,

                        iconSize:[
                            18,
                            18
                        ],

                        iconAnchor:[
                            9,
                            9
                        ]

                    })
            }
        )
        .addTo(
            map
        );

}

/* ============================================================
   CONFIRM LOCATION
   ============================================================ */

function confirmLocation(){

    if(
        !selectedLocation
    ){

        showToast(
            "Please select a location first.",
            "error"
        );

        return;

    }


    if(
        !validCoordinates(
            selectedLocation.lat,
            selectedLocation.lng
        )
    ){

        showToast(
            "Invalid location.",
            "error"
        );

        return;

    }


    const address =
        selectedLocation.address ||
        "Selected location";


    const location = {

        lat:Number(
            selectedLocation.lat
        ),

        lng:Number(
            selectedLocation.lng
        ),

        address:address

    };


    /*
      Save pickup.
    */

    if(
        selectedType === "pickup"
    ){

        pickupLocation =
            {
                ...location
            };


        localStorage.setItem(
            "riderxPickupLocation",
            JSON.stringify(
                pickupLocation
            )
        );

    }


    /*
      Save destination.
    */

    else{

        dropLocation =
            {
                ...location
            };


        localStorage.setItem(
            "riderxDropLocation",
            JSON.stringify(
                dropLocation
            )
        );

    }


    /*
      Preserve combined booking data.
    */

    const booking =
        getBookingData();


    if(
        selectedType === "pickup"
    ){

        booking.pickup =
            {
                ...location
            };

    }else{

        booking.drop =
            {
                ...location
            };

    }


    localStorage.setItem(
        "riderxBookingData",
        JSON.stringify(
            booking
        )
    );


    /*
      Build return page.
    */

    const target =
        getReturnPage();


    const query =
        buildReturnQuery(
            selectedType,
            location,
            booking
        );


    showToast(
        selectedType === "pickup"
            ? "Pickup location saved."
            : "Destination saved.",
        "success"
    );


    setTimeout(
        function(){

            window.location.href =
                target +
                query;

        },
        450
    );

}


/* ============================================================
   BOOKING DATA
   ============================================================ */

function getBookingData(){

    try{

        const raw =
            localStorage.getItem(
                "riderxBookingData"
            );


        if(
            raw
        ){

            const parsed =
                JSON.parse(raw);


            if(
                parsed &&
                typeof parsed === "object"
            ){

                return parsed;

            }

        }

    }catch(error){

        console.error(
            "Booking data error:",
            error
        );

    }


    return {};

}


/* ============================================================
   RETURN PAGE
   ============================================================ */

function getReturnPage(){

    const params =
        getParams();


    const requested =
        params.return ||
        "booking.html";


    /*
      Security:
      only allow local relative pages.
    */

    if(
        requested.startsWith("/") ||
        requested.includes("://") ||
        requested.includes("\\")
    ){

        return "booking.html";

    }


    return requested;

}


/* ============================================================
   RETURN QUERY
   ============================================================ */

function buildReturnQuery(
    type,
    location,
    booking
){

    const params =
        new URLSearchParams();


    params.set(
        "locationType",
        type
    );


    params.set(
        "lat",
        location.lat
    );


    params.set(
        "lng",
        location.lng
    );


    params.set(
        "address",
        location.address
    );


    if(
        type === "pickup"
    ){

        params.set(
            "pickupLat",
            location.lat
        );

        params.set(
            "pickupLng",
            location.lng
        );

        params.set(
            "pickupAddress",
            location.address
        );


        /*
          Preserve existing destination.
        */

        const drop =
            booking.drop ||
            dropLocation;


        if(
            drop &&
            validCoordinates(
                drop.lat,
                drop.lng
            )
        ){

            params.set(
                "dropLat",
                drop.lat
            );

            params.set(
                "dropLng",
                drop.lng
            );

            params.set(
                "dropAddress",
                drop.address ||
                "Destination"
            );

        }

    }else{

        params.set(
            "dropLat",
            location.lat
        );

        params.set(
            "dropLng",
            location.lng
        );

        params.set(
            "dropAddress",
            location.address
        );


        /*
          Preserve existing pickup.
        */

        const pickup =
            booking.pickup ||
            pickupLocation;


        if(
            pickup &&
            validCoordinates(
                pickup.lat,
                pickup.lng
            )
        ){

            params.set(
                "pickupLat",
                pickup.lat
            );

            params.set(
                "pickupLng",
                pickup.lng
            );

            params.set(
                "pickupAddress",
                pickup.address ||
                "Pickup location"
            );

        }

    }


    /*
      IMPORTANT:
      Preserve return page so we do not accidentally
      always go to booking.html.
    */

    const returnPage =
        getReturnPage();


    if(
        returnPage !==
        "booking.html"
    ){

        params.set(
            "return",
            returnPage
        );

    }


    return (
        "?" +
        params.toString()
    );

}


/* ============================================================
   LOAD SAVED LOCATIONS
   ============================================================ */

function loadSavedLocations(params){

    try{

        const pickupRaw =
            localStorage.getItem(
                "riderxPickupLocation"
            );


        const dropRaw =
            localStorage.getItem(
                "riderxDropLocation"
            );


        if(
            pickupRaw
        ){

            const parsed =
                JSON.parse(
                    pickupRaw
                );


            if(
                parsed &&
                validCoordinates(
                    parsed.lat,
                    parsed.lng
                )
            ){

                pickupLocation =
                    parsed;

            }

        }


        if(
            dropRaw
        ){

            const parsed =
                JSON.parse(
                    dropRaw
                );


            if(
                parsed &&
                validCoordinates(
                    parsed.lat,
                    parsed.lng
                )
            ){

                dropLocation =
                    parsed;

            }

        }


        /*
          URL pickup has priority over saved pickup.
        */

        if(
            validCoordinates(
                params.pickupLat,
                params.pickupLng
            )
        ){

            pickupLocation = {

                lat:
                    Number(
                        params.pickupLat
                    ),

                lng:
                    Number(
                        params.pickupLng
                    ),

                address:
                    params.pickupAddress ||
                    "Pickup location"

            };

        }


        /*
          URL drop has priority over saved drop.
        */

        if(
            validCoordinates(
                params.dropLat,
                params.dropLng
            )
        ){

            dropLocation = {

                lat:
                    Number(
                        params.dropLat
                    ),

                lng:
                    Number(
                        params.dropLng
                    ),

                address:
                    params.dropAddress ||
                    "Destination"

            };

        }

    }catch(error){

        console.error(
            "Saved location error:",
            error
        );

    }

}


/* ============================================================
   BACK
   ============================================================ */

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ){

        window.history.back();

        return;

    }


    window.location.href =
        "booking.html";

}


/* ============================================================
   VALID COORDINATES
   ============================================================ */

function validCoordinates(
    lat,
    lng
){

    const latitude =
        Number(lat);

    const longitude =
        Number(lng);


    return (
        Number.isFinite(latitude) &&
        Number.isFinite(longitude) &&
        latitude >= -90 &&
        latitude <= 90 &&
        longitude >= -180 &&
        longitude <= 180
    );

}


/* ============================================================
   PLACE NAME
   ============================================================ */

function getPlaceName(item){

    if(
        item &&
        item.name
    ){

        return item.name;

    }


    if(
        item &&
        item.address
    ){

        return (
            item.address.road ||
            item.address.suburb ||
            item.address.neighbourhood ||
            item.address.city ||
            item.address.town ||
            item.address.village ||
            "Selected place"
        );

    }


    return "Selected place";

}


/* ============================================================
   SHORT ADDRESS
   ============================================================ */

function shortAddress(address){

    if(
        !address
    ){

        return "Selected location";

    }


    const parts =
        String(address)
            .split(",")
            .map(
                part =>
                    part.trim()
            )
            .filter(Boolean);


    if(
        parts.length >= 3
    ){

        return parts
            .slice(0,2)
            .join(", ");

    }


    return String(address)
        .slice(0,45);

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ============================================================
   DISTANCE
   ============================================================ */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;


    const dLat =
        (
            lat2 -
            lat1
        ) *
        Math.PI /
        180;


    const dLon =
        (
            lon2 -
            lon1
        ) *
        Math.PI /
        180;


    const a =
        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        ) +

        Math.cos(
            lat1 *
            Math.PI /
            180
        ) *

        Math.cos(
            lat2 *
            Math.PI /
            180
        ) *

        Math.sin(
            dLon / 2
        ) *
        Math.sin(
            dLon / 2
        );


    return (
        R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        )
    );

}

   TOAST
   ============================================================ */

function showToast(
    message,
    type = ""
){

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.className =
        "toast show " +
        type;


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.className =
                    "toast";

            },
            2800
        );

}


/* ============================================================
   CLOSE SEARCH
   ============================================================ */

document.addEventListener(
    "click",
    function(event){

        const searchBox =
            document.querySelector(
                ".search-box"
            );


        if(
            searchBox &&
            !searchBox.contains(
                event.target
            )
        ){

            $("results")
                .classList.remove(
                    "show"
                );

        }

    }
);


/* ============================================================
   PREVENT ENTER FORM-LIKE BEHAVIOUR
   ============================================================ */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            $("results")
                .classList.remove(
                    "show"
                );

        }

    }
);

</script>
