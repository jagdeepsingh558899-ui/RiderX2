<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#FFD400"
>

<meta
    name="description"
    content="RiderX customer notifications"
>

<title>RiderX - Notifications</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<link
    rel="stylesheet"
    href="../css/dashboard.css"
>

<link
    rel="stylesheet"
    href="../css/responsive.css"
>

<style>

:root{
    --yellow:#FFD400;
    --bg:#0d0d0d;
    --card:#181818;
    --border:#2d2d2d;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
    background:#080808;
}

body{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font-family:inherit;
    cursor:pointer;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.app{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    background:var(--bg);
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:50;

    display:flex;
    align-items:center;
    gap:10px;

    padding:
        max(12px,env(safe-area-inset-top))
        12px
        12px;

    border-bottom:1px solid #252525;

    background:rgba(10,10,10,.96);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.back-btn{
    width:40px;
    height:40px;
    min-width:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #303030;
    border-radius:50%;

    background:#1b1b1b;
    color:#fff;

    font-size:22px;
}

.back-btn:active{
    transform:scale(.95);
}

.title-box{
    flex:1;
    min-width:0;
}

.title{
    font-size:16px;
    font-weight:900;
}

.subtitle{
    margin-top:3px;
    color:#777;
    font-size:10px;
}

.header-action{
    border:0;
    background:transparent;
    color:var(--yellow);
    font-size:11px;
    font-weight:900;
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    padding:13px;
    padding-bottom:
        max(35px,env(safe-area-inset-bottom));
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    margin-bottom:10px;
}

.unread-text{
    color:#777;
    font-size:11px;
}

.unread-text strong{
    color:#fff;
}

.clear-btn{
    padding:8px 11px;

    border:1px solid #343434;
    border-radius:9px;

    background:#191919;
    color:#aaa;

    font-size:10px;
    font-weight:900;
}

.clear-btn:active{
    transform:scale(.97);
}


/* =========================================================
   FILTERS
========================================================= */

.filters{
    display:flex;
    gap:7px;

    margin-bottom:12px;

    overflow-x:auto;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:0 0 auto;

    padding:8px 12px;

    border:1px solid #303030;
    border-radius:20px;

    background:#181818;
    color:#777;

    font-size:10px;
    font-weight:900;
}

.filter.active{
    border-color:#806b00;
    background:#2a2500;
    color:var(--yellow);
}


/* =========================================================
   NOTIFICATION LIST
========================================================= */

.notification-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.notification{
    position:relative;

    display:flex;
    gap:10px;

    padding:12px;

    border:1px solid var(--border);
    border-radius:15px;

    background:var(--card);

    cursor:pointer;

    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
}

.notification:hover{
    border-color:#3b3b3b;
}

.notification:active{
    transform:scale(.99);
    background:#202020;
}

.notification.unread{
    border-color:#3a350f;

    background:
        linear-gradient(
            135deg,
            #1b1b17,
            #171717
        );
}

.notification.unread::before{
    content:"";

    position:absolute;

    top:12px;
    right:12px;

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--yellow);
}

.notification-icon{
    width:42px;
    height:42px;
    min-width:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:#252525;

    font-size:16px;
}

.notification-icon.yellow{
    background:#302b05;
}

.notification-icon.green{
    background:#15301f;
}

.notification-icon.red{
    background:#301616;
}

.notification-icon.blue{
    background:#151f31;
}

.notification-content{
    flex:1;
    min-width:0;

    padding-right:8px;
}

.notification-title{
    padding-right:10px;

    font-size:13px;
    font-weight:900;
    line-height:1.3;
}

.notification-message{
    margin-top:5px;

    color:#858585;

    font-size:11px;
    line-height:1.45;

    overflow-wrap:anywhere;
}

.notification-time{
    margin-top:7px;

    color:#505050;

    font-size:9px;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    padding:55px 20px;

    text-align:center;

    color:#777;

    font-size:11px;
}

.spinner{
    width:30px;
    height:30px;

    margin:0 auto 12px;

    border:3px solid #303030;
    border-top-color:var(--yellow);

    border-radius:50%;

    animation:riderxSpin .8s linear infinite;
}

@keyframes riderxSpin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

.error{
    display:none;

    margin:20px 0;
    padding:20px;

    text-align:center;

    border:1px solid #402020;
    border-radius:15px;

    background:#180909;
}

.error.show{
    display:block;
}

.error-icon{
    font-size:25px;
}

.error-title{
    margin-top:9px;

    font-size:13px;
    font-weight:900;
}

.error-text{
    margin-top:6px;

    color:#888;

    font-size:10px;
    line-height:1.5;
}

.retry-btn{
    margin-top:13px;

    padding:9px 17px;

    border:0;
    border-radius:10px;

    background:var(--yellow);
    color:#000;

    font-size:10px;
    font-weight:900;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    display:none;

    padding:60px 20px;

    text-align:center;
}

.empty.show{
    display:block;
}

.empty-icon{
    width:65px;
    height:65px;

    margin:0 auto 13px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#191919;

    font-size:25px;
}

.empty-title{
    font-size:15px;
    font-weight:900;
}

.empty-text{
    max-width:280px;

    margin:7px auto 0;

    color:#666;

    font-size:10px;
    line-height:1.5;
}


/* =========================================================
   DATE GROUP
========================================================= */

.date-label{
    margin:14px 2px 7px;

    color:#555;

    font-size:9px;
    font-weight:900;

    text-transform:uppercase;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;

    display:none;

    align-items:flex-end;
    justify-content:center;

    background:rgba(0,0,0,.72);
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:650px;
    max-height:75vh;

    overflow:auto;

    padding:
        18px
        14px
        max(25px,env(safe-area-inset-bottom));

    border-top:1px solid #333;
    border-radius:22px 22px 0 0;

    background:#151515;
}

.handle{
    width:40px;
    height:4px;

    margin:0 auto 15px;

    border-radius:20px;

    background:#444;
}

.modal-icon{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:11px;

    border-radius:14px;

    background:#292929;

    font-size:18px;
}

.modal-title{
    font-size:15px;
    font-weight:900;
}

.modal-time{
    margin-top:4px;

    color:#666;

    font-size:9px;
}

.modal-message{
    margin-top:13px;

    color:#999;

    font-size:11px;
    line-height:1.6;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.modal-close{
    width:100%;
    height:42px;

    margin-top:17px;

    border:0;
    border-radius:11px;

    background:var(--yellow);
    color:#000;

    font-size:11px;
    font-weight:900;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:
        max(25px,env(safe-area-inset-bottom));

    z-index:200;

    width:calc(100% - 28px);
    max-width:500px;

    padding:11px 13px;

    transform:translate(-50%,20px);

    border:1px solid #333;
    border-radius:11px;

    background:#222;
    color:#fff;

    text-align:center;

    font-size:10px;

    opacity:0;
    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:380px){

    .content{
        padding-left:10px;
        padding-right:10px;
    }

    .title{
        font-size:14px;
    }

    .header-action{
        font-size:9px;
    }

}

</style>

</head>


<body>

<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <button
            type="button"
            class="back-btn"
            id="backButton"
            aria-label="Go back"
        >
            ‹
        </button>


        <div class="title-box">

            <div class="title">
                Notifications
            </div>

            <div class="subtitle">
                RiderX updates and ride alerts
            </div>

        </div>


        <button
            type="button"
            class="header-action"
            id="markAllButton"
        >
            Mark all read
        </button>

    </header>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <main class="content">


        <div class="topbar">

            <div class="unread-text">

                <strong id="unreadCount">
                    0
                </strong>

                unread notifications

            </div>


            <button
                type="button"
                class="clear-btn"
                id="clearButton"
            >
                Clear all
            </button>

        </div>


        <!-- FILTERS -->

        <div class="filters">

            <button
                type="button"
                class="filter active"
                data-filter="all"
            >
                All
            </button>


            <button
                type="button"
                class="filter"
                data-filter="ride"
            >
                Rides
            </button>


            <button
                type="button"
                class="filter"
                data-filter="payment"
            >
                Payments
            </button>


            <button
                type="button"
                class="filter"
                data-filter="promo"
            >
                Offers
            </button>


            <button
                type="button"
                class="filter"
                data-filter="system"

                Updates

            </div>

            <div
                class="error-text"

                Please check your connection and try again.
            </div>

            <button
                type="button"

                id="retryButton"
            >
                Retry
            </button>

        </div>


        <!-- NOTIFICATION LIST -->

        <div
            id="notificationList"
            class="notification-list"
            aria-live="polite"
        ></div>


        <!-- EMPTY -->

        <div
            id="emptyState"
            class="empty"
        >

            <div class="empty-icon">
                🔔
            </div>

            <div class="empty-title">
                No notifications
            </div>

            <div class="empty-text">
                You're all caught up. New RiderX ride
                and account updates will appear here.
            </div>

        </div>

    </main>

</div>


<!-- =======================================================
     DETAIL MODAL
======================================================= -->

<div
    class="modal"
    id="detailModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
>

    <div
        class="modal-card"
        role="document"
    >

        <div class="handle"></div>


        <div
            class="modal-icon"
            id="modalIcon"
        >
            🔔
        </div>


        <div
            class="modal-title"
            id="modalTitle"
        >
            Notification
        </div>


        <div
            class="modal-time"
            id="modalTime"
        >
            Just now
        </div>


        <div
            class="modal-message"
            id="modalMessage"
        ></div>


        <button
            type="button"
            class="modal-close"
            id="modalCloseButton"
        >
            Done
        </button>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
></div>


<!-- =======================================================
     FIREBASE + NOTIFICATIONS
======================================================= -->

<script type="module">

/* =========================================================
   RIDERX CUSTOMER NOTIFICATIONS
   =========================================================

   IMPORTANT FIRESTORE STRUCTURE:

   notifications/{notificationId}

   {
       userId: "CUSTOMER_UID",
       type: "ride",
       title: "Ride accepted",
       message: "Your ride has been accepted.",
       rideId: "RIDE_ID",
       createdAt: serverTimestamp(),
       read: false
   }

   Also supports:
   body
   description
   category
   notificationType
   timestamp
   isRead

   ========================================================= */


/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    doc,
    updateDoc,
    deleteDoc,
    writeBatch,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =========================================================
   DOM
========================================================= */

const notificationList =
    document.getElementById(
        "notificationList"
    );


const loadingState =
    document.getElementById(
        "loadingState"
    );


const emptyState =
    document.getElementById(
        "emptyState"
    );


const errorState =
    document.getElementById(
        "errorState"
    );


const errorText =
    document.getElementById(
        "errorText"
    );


const retryButton =
    document.getElementById(
        "retryButton"
    );


const unreadCount =
    document.getElementById(
        "unreadCount"
    );


const markAllButton =
    document.getElementById(
        "markAllButton"
    );


const clearButton =
    document.getElementById(
        "clearButton"
    );


const detailModal =
    document.getElementById(
        "detailModal"
    );


const modalIcon =
    document.getElementById(
        "modalIcon"
    );


const modalTitle =
    document.getElementById(
        "modalTitle"
    );


const modalTime =
    document.getElementById(
        "modalTime"
    );


const modalMessage =
    document.getElementById(
        "modalMessage"
    );


const modalCloseButton =
    document.getElementById(
        "modalCloseButton"
    );


const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let unsubscribeNotifications = null;

let notifications = [];

let currentFilter = "all";

let toastTimer = null;

let loading = true;


/* =========================================================
   LEGACY LOCAL STORAGE
========================================================= */

const LEGACY_STORAGE_KEYS = [
    "riderxNotifications",
    "notifications",
    "customerNotifications"
];


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    toast.textContent =
        String(
            message || ""
        );


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    loading = false;

    loadingState.style.display =
        "none";

    errorText.textContent =
        String(
            message ||
            "Unable to load notifications."
        );

    errorState.classList.add(
        "show"
    );

}


function hideError(){

    errorState.classList.remove(
        "show"
    );

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

    loading = true;

    loadingState.style.display =
        "block";

    emptyState.classList.remove(
        "show"
    );

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        if(
            unsubscribeNotifications
        ){

            unsubscribeNotifications();

            unsubscribeNotifications =
                null;

        }


        if(!user){

            currentUser =
                null;

            notifications =
                [];

            renderNotifications();

            location.replace(
                "../auth/login.html"
            );

            return;

        }


        currentUser =
            user;


        listenToNotifications(
            user.uid
        );

    }
);


/* =========================================================
   FIRESTORE LISTENER
========================================================= */

function listenToNotifications(uid){

    if(!uid){

        return;

    }


    if(
        unsubscribeNotifications
    ){

        unsubscribeNotifications();

        unsubscribeNotifications =
            null;

    }


    showLoading();

    hideError();


    const notificationsRef =
        collection(
            db,
            "notifications"
        );


    /*
     * Primary query.
     *
     * This is the query admin-created
     * notifications are expected to match.
     */

    const primaryQuery =
        query(
            notificationsRef,
            where(
                "userId",
                "==",
                uid
            ),
            orderBy(
                "createdAt",
                "desc"
            )
        );


    unsubscribeNotifications =
        onSnapshot(
            primaryQuery,

            snapshot => {

                processFirestoreSnapshot(
                    snapshot
                );

            },

            error => {

                console.warn(
                    "Primary notification query failed:",
                    error
                );


                /*
                 * If composite index is missing,
                 * use userId-only query.
                 */

                startFallbackListener(
                    uid
                );

            }
        );

}


/* =========================================================
   FALLBACK LISTENER
========================================================= */

function startFallbackListener(uid){

    if(
        unsubscribeNotifications
    ){

        unsubscribeNotifications();

        unsubscribeNotifications =
            null;

    }


    const notificationsRef =
        collection(
            db,
            "notifications"
        );


    const fallbackQuery =
        query(
            notificationsRef,
            where(
                "userId",
                "==",
                uid
            )
        );


    unsubscribeNotifications =
        onSnapshot(
            fallbackQuery,

            snapshot => {

                processFirestoreSnapshot(
                    snapshot
                );

            },

            error => {

                console.error(
                    "Fallback notification listener failed:",
                    error
                );


                /*
                 * If Firebase is unavailable,
                 * keep legacy local notifications
                 * instead of showing a blank page.
                 */

                loadLegacyNotifications();

                showError(
                    error.message ||
                    "Unable to load notifications."
                );

            }
        );

}


/* =========================================================
   FIRESTORE SNAPSHOT
========================================================= */

function processFirestoreSnapshot(
    snapshot
){

    const firestoreNotifications =
        snapshot.docs.map(
            item => {

                const data =
                    item.data() || {};


                return normalizeNotification(
                    {
                        ...data,
                        id:item.id,
                        source:"firestore"
                    }
                );

            }
        )
        .filter(Boolean);


    notifications =
        firestoreNotifications;


    /*
     * If Firestore has no notifications,
     * optionally preserve old local notifications.
     */

    if(
        !notifications.length
    ){

        const legacy =
            readLegacyNotifications();


        if(
            legacy.length
        ){

            notifications =
                legacy;

        }

    }


    sortNotifications();

    loading = false;

    loadingState.style.display =
        "none";

    hideError();

    renderNotifications();

}


/* =========================================================
   NORMALIZE NOTIFICATION
========================================================= */

function normalizeNotification(
    item
){

    if(
        !item ||
        typeof item !== "object"
    ){

        return null;

    }


    const type =
        normalizeType(
            item.type ||
            item.category ||
            item.kind ||
            item.notificationType
        );


    const timestamp =
        getTimestampValue(
            item.createdAt ??
            item.timestamp ??
            item.time
        );


    return {

        id:
            String(
                item.id ||
                item.notificationId ||
                (
                    "notification-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .slice(2,8)
                )
            ),

        userId:
            item.userId
                ? String(item.userId)
                : "",

        type:
            type,

        icon:
            safeIcon(
                item.icon,
                type
            ),

        title:
            String(
                item.title ||
                item.heading ||
                "RiderX Notification"
            ),

        message:
            String(
                item.message ||
                item.body ||
                item.description ||
                item.text ||
                ""
            ),

        time:
            timestamp || Date.now(),

        read:
            item.read === true ||
            item.isRead === true,

        rideId:
            item.rideId ||
            item.rideID ||
            item.ride ||
            "",

        actionUrl:
            typeof item.actionUrl === "string"
                ? item.actionUrl
                : (
                    typeof item.url === "string"
                        ? item.url
                        : ""
                ),

        source:
            item.source ||
            "firestore"

    };

}


/* =========================================================
   TYPE
========================================================= */

function normalizeType(type){

    const value =
        String(
            type || "system"
        )
        .toLowerCase()
        .trim();


    if(
        [
            "ride",
            "booking",
            "trip",
            "driver",
            "rider",
            "request",
            "pickup"
        ].includes(value)
    ){

        return "ride";

    }


    if(
        [
            "payment",
            "wallet",
            "transaction",
            "refund",
            "earning",
            "fare"
        ].includes(value)
    ){

        return "payment";

    }


    if(
        [
            "promo",
            "offer",
            "coupon",
            "promotion"
        ].includes(value)
    ){

        return "promo";

    }


    return "system";

}


/* =========================================================
   ICON
========================================================= */

function safeIcon(
    icon,
    type
){

    if(
        typeof icon === "string" &&
        icon.trim()
    ){

        return icon;

    }


    switch(type){

        case "ride":
            return "🚕";

        case "payment":
            return "💳";

        case "promo":
            return "🎁";

        case "system":
            return "⚙️";

        default:
            return "🔔";

    }

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestampValue(
    timestamp
){

    if(!timestamp){

        return 0;

    }


    try{

        /*
         * Firestore Timestamp
         */

        if(
            typeof timestamp.toMillis ===
            "function"
        ){

            return timestamp.toMillis();

        }


        /*
         * Firestore Timestamp
         * alternative.
         */

        if(
            typeof timestamp.toDate ===
            "function"
        ){

            return timestamp
                .toDate()
                .getTime();

        }


        /*
         * JS Date
         */

        if(
            timestamp instanceof Date
        ){

            return timestamp.getTime();

        }


        /*
         * Numeric milliseconds
         */

        if(
            typeof timestamp === "number"
        ){

            /*
             * If seconds were supplied,
             * convert to milliseconds.
             */

            if(
                timestamp < 10000000000
            ){

                return timestamp * 1000;

            }

            return timestamp;

        }


        /*
         * Firestore-like object:
         * { seconds, nanoseconds }
         */

        if(
            typeof timestamp === "object" &&
            typeof timestamp.seconds === "number"
        ){

            return (
                timestamp.seconds * 1000
            ) +
            Math.floor(
                (timestamp.nanoseconds || 0) /
                1000000
            );

        }


        const parsed =
            new Date(
                timestamp
            ).getTime();


        return Number.isFinite(parsed)
            ? parsed
            : 0;

    }catch{

        return 0;

    }

}


/* =========================================================
   SORT
========================================================= */

function sortNotifications(){

    notifications.sort(
        (a,b) => {

            return (
                Number(b.time || 0) -
                Number(a.time || 0)
            );

        }
    );

}


/* =========================================================
   LEGACY LOCAL STORAGE
========================================================= */

function readLegacyNotifications(){

    let loaded = [];


    for(
        const key of LEGACY_STORAGE_KEYS
    ){

        try{

            const raw =
                localStorage.getItem(
                    key
                );


            if(!raw){

                continue;

            }


            const parsed =
                JSON.parse(
                    raw
                );


            if(
                Array.isArray(parsed)
            ){

                loaded =
                    parsed;

                break;

            }

        }catch(error){

            console.warn(
                "Legacy notification read failed:",
                key,
                error
            );

        }

    }


    return loaded
        .map(
            item =>
                normalizeNotification(
                    {
                        ...item,
                        source:"legacy"
                    }
                )
        )
        .filter(Boolean);

}


function loadLegacyNotifications(){

    notifications =
        readLegacyNotifications();

    sortNotifications();

    loadingState.style.display =
        "none";

    renderNotifications();

}


/* =========================================================
   RENDER
========================================================= */

function renderNotifications(){

    notificationList.innerHTML =
        "";


    const filtered =
        notifications.filter(
            item => {

                return (
                    currentFilter === "all" ||
                    item.type === currentFilter
                );

            }
        );


    sortNotifications();


    if(
        !filtered.length
    ){

        emptyState.classList.add(
            "show"
        );

    }else{

        emptyState.classList.remove(
            "show"
        );


        const groups =
            groupByDate(
                filtered
            );


        Object.keys(groups)
            .forEach(
                group => {

                    const label =
                        document.createElement(
                            "div"
                        );


                    label.className =
                        "date-label";


                    label.textContent =
                        group;


                    notificationList.appendChild(
                        label
                    );


                    groups[group].forEach(
                        item => {

                            notificationList.appendChild(
                                createNotificationElement(
                                    item
                                )
                            );

                        }
                    );

                }
            );

    }


    updateUnreadCount();


    markAllButton.disabled =
        !notifications.some(
            item => !item.read
        );


    clearButton.disabled =
        !notifications.length;

}


/* =========================================================
   CREATE ELEMENT
========================================================= */

function createNotificationElement(
    item
){

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "notification" +
        (
            item.read
                ? ""
                : " unread"
        );


    element.setAttribute(
        "role",
        "button"
    );


    element.setAttribute(
        "tabindex",
        "0"
    );


    element.setAttribute(
        "aria-label",
        item.title
    );


    element.innerHTML = `

        <div
            class="notification-icon ${escapeHtml(
                getIconClass(
                    item.type
                )
            )}"
        >
            ${escapeHtml(item.icon)}
        </div>


        <div class="notification-content">

            <div class="notification-title">
                ${escapeHtml(item.title)}
            </div>


            <div class="notification-message">
                ${escapeHtml(item.message)}
            </div>


            <div class="notification-time">
                ${escapeHtml(
                    formatTime(item.time)
                )}
            </div>

        </div>

    `;


    const open =
        () => {

            openNotification(
                item
            );

        };


    element.addEventListener(
        "click",
        open
    );


    element.addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                open();

            }

        }
    );


    return element;

}


/* =========================================================
   ICON CLASS
========================================================= */

function getIconClass(type){

    switch(type){

        case "ride":
            return "yellow";

        case "payment":
            return "green";

        case "promo":
            return "blue";

        case "system":
            return "yellow";

        default:
            return "";

    }

}


/* =========================================================
   GROUP BY DATE
========================================================= */

function groupByDate(
    list
){

    const groups = {};


    list.forEach(
        item => {

            const label =
                getDateLabel(
                    item.time
                );


            if(
                !groups[label]
            ){

                groups[label] = [];

            }


            groups[label].push(
                item
            );

        }
    );


    return groups;

}


/* =========================================================
   DATE LABEL
========================================================= */

function getDateLabel(
    timestamp
){

    const date =
        new Date(
            timestamp
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Earlier";

    }


    const now =
        new Date();


    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );


    const yesterday =
        new Date(
            today
        );


    yesterday.setDate(
        yesterday.getDate() - 1
    );


    const target =
        new Date(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        );


    if(
        target.getTime() ===
        today.getTime()
    ){

        return "Today";

    }


    if(
        target.getTime() ===
        yesterday.getTime()
    ){

        return "Yesterday";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
    timestamp
){

    const value =
        getTimestampValue(
            timestamp
        );


    const date =
        new Date(
            value
        );


    if(
        !value ||
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Recently";

    }


    const diff =
        Math.max(
            0,
            Date.now() -
            date.getTime()
        );


    const minute =
        60000;

    const hour =
        minute * 60;

    const day =
        hour * 24;


    if(
        diff < minute
    ){

        return "Just now";

    }


    if(
        diff < hour
    ){

        const value =
            Math.floor(
                diff / minute
            );


        return (
            value +
            (
                value === 1
                    ? " minute ago"
                    : " minutes ago"
            )
        );

    }


    if(
        diff < day
    ){

        const value =
            Math.floor(
                diff / hour
            );


        return (
            value +
            (
                value === 1
                    ? " hour ago"
                    : " hours ago"
            )
        );

    }


    return (
        date.toLocaleDateString(
            "en-IN",
            {
                day:"numeric",
                month:"short"
            }
        ) +
        " • " +
        date.toLocaleTimeString(
            "en-IN",
            {
                hour:"numeric",
                minute:"2-digit"
            }
        )
    );

}


/* =========================================================
   FILTER
========================================================= */

function setFilter(
    filter
){

    const allowed = [
        "all",
        "ride",
        "payment",
        "promo",
        "system"
    ];


    currentFilter =
        allowed.includes(
            filter
        )
            ? filter
            : "all";


    document
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.filter ===
                    currentFilter
                );

            }
        );


    renderNotifications();

}


/* =========================================================
   OPEN NOTIFICATION
========================================================= */

async function openNotification(
    item
){

    if(!item){

        return;

    }


    /*
     * Mark read locally immediately
     * so UI responds without waiting.
     */

    item.read = true;

    renderNotifications();


    /*
     * Persist Firestore read state.
     */

    if(
        currentUser &&
        item.source === "firestore"
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "notifications",
                    item.id
                ),
                {
                    read:true,
                    isRead:true,
                    readAt:
                        serverTimestamp()
                }
            );

        }catch(error){

            console.warn(
                "Unable to mark notification read:",
                error
            );

        }

    }


    modalIcon.textContent =
        item.icon;


    modalTitle.textContent =
        item.title;


    modalTime.textContent =
        formatTime(
            item.time
        );


    modalMessage.textContent =
        item.message;


    detailModal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";


    /*
     * Ride notification navigation
     */

    if(
        item.rideId
    ){

        const rideId =
            String(
                item.rideId
            );


        try{

            sessionStorage.setItem(
                "riderx_selected_ride",
                rideId
            );


            sessionStorage.setItem(
                "riderx_active_ride_id",
                rideId
            );

        }catch{}


        /*
         * Don't automatically navigate
         * away from detail modal.
         *
         * User can close it first.
         */

    }

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    detailModal.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";

}


/* =========================================================
   MARK ALL READ
========================================================= */

async function markAllRead(){

    if(!currentUser){

        showToast(
            "Please login first."
        );

        return;

    }


    const unread =
        notifications.filter(
            item =>
                !item.read &&
                item.source === "firestore"
        );


    /*
     * Mark legacy items locally too.
     */

    notifications.forEach(
        item => {

            item.read = true;

        }
    );


    renderNotifications();


    if(
        !unread.length
    ){

        showToast(
            "All notifications are already read."
        );

        return;

    }


    markAllButton.disabled =
        true;


    try{

        /*
         * Firestore batch limit is 500.
         * 450 gives a safe margin.
         */

        const chunkSize =
            450;


        for(
            let i = 0;
            i < unread.length;
            i += chunkSize
        ){

            const chunk =
                unread.slice(
                    i,
                    i + chunkSize
                );


            const batch =
                writeBatch(
                    db
                );


            chunk.forEach(
                item => {

                    batch.update(
                        doc(
                            db,
                            "notifications",
                            item.id
                        ),
                        {
                            read:true,
                            isRead:true,
                            readAt:
                                serverTimestamp()
                        }
                    );

                }
            );


            await batch.commit();

        }


        showToast(
            "All notifications marked as read."
        );

    }catch(error){

        console.error(
            "Mark all notifications read failed:",
            error
        );


        showToast(
            "Unable to update notifications."
        );

    }finally{

        markAllButton.disabled =
            false;

    }

}


/* =========================================================
   CLEAR ALL
========================================================= */

async function clearNotifications(){

    if(!currentUser){

        showToast(
            "Please login first."
        );

        return;

    }


    const firestoreItems =
        notifications.filter(
            item =>
                item.source === "firestore"
        );


    if(
        !firestoreItems.length
    ){

        /*
         * Clear old local notifications too.
         */

        notifications = [];

        removeLegacyStorage();

        renderNotifications();

        showToast(
            "Notifications cleared."
        );

        return;

    }


    const confirmed =
        window.confirm(
            "Clear all RiderX notifications?"
        );


    if(
        !confirmed
    ){

        return;

    }


    clearButton.disabled =
        true;


    try{

        const chunkSize =
            450;


        for(
            let i = 0;
            i < firestoreItems.length;
            i += chunkSize
        ){

            const chunk =
                firestoreItems.slice(
                    i,
                    i + chunkSize
                );


            const batch =
                writeBatch(
                    db
                );


            chunk.forEach(
                item => {

                    batch.delete(
                        doc(
                            db,
                            "notifications",
                            item.id
                        )
                    );

                }
            );


            await batch.commit();

        }


        notifications = [];

        removeLegacyStorage();

        renderNotifications();


        showToast(
            "Notifications cleared."
        );

    }catch(error){

        console.error(
            "Clear notifications failed:",
            error
        );


        showToast(
            "Unable to clear notifications."
        );

    }finally{

        clearButton.disabled =
            false;

    }

}


/* =========================================================
   REMOVE LEGACY STORAGE
========================================================= */

function removeLegacyStorage(){

    LEGACY_STORAGE_KEYS.forEach(
        key => {

            try{

                localStorage.removeItem(
                    key
                );

            }catch(error){

                console.warn(
                    "Unable to remove legacy storage:",
                    key,
                    error
                );

            }

        }
    );

}


/* =========================================================
   UNREAD COUNT
========================================================= */

function updateUnreadCount(){

    const count =
        notifications.filter(
            item =>
                !item.read
        ).length;


    unreadCount.textContent =
        String(
            count
        );

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

    try{

        if(
            document.referrer &&
            new URL(
                document.referrer
            ).origin ===
            window.location.origin
        ){

            window.history.back();

            return;

        }

    }catch(error){

        console.warn(
            "Back navigation check failed:",
            error
        );

    }


    window.location.href =
        "home.html";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   EVENT BINDINGS
========================================================= */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        goBack
    );


markAllButton.addEventListener(
    "click",
    markAllRead
);


clearButton.addEventListener(
    "click",
    clearNotifications
);


retryButton.addEventListener(
    "click",
    () => {

        if(
            currentUser
        ){

            listenToNotifications(
                currentUser.uid
            );

        }else{

            location.replace(
                "../auth/login.html"
            );

        }

    }
);


modalCloseButton.addEventListener(
    "click",
    closeModal
);


document
    .querySelectorAll(
        ".filter"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    setFilter(
                        button.dataset.filter
                    );

                }
            );

        }
    );


detailModal.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            detailModal
        ){

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);


/* =========================================================
   PAGE CLEANUP
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        if(
            unsubscribeNotifications
        ){

            unsubscribeNotifications();

            unsubscribeNotifications =
                null;

        }

    }
);


/* =========================================================
   LEGACY CROSS-TAB SYNC
========================================================= */

window.addEventListener(
    "storage",
    event => {

        if(
            LEGACY_STORAGE_KEYS.includes(
                event.key
            )
        ){

            /*
             * Don't replace active Firestore
             * notifications with local data.
             */

            if(
                !currentUser
            ){

                loadLegacyNotifications();

            }

        }

    }
);


/* =========================================================
   INITIAL UI
========================================================= */

markAllButton.disabled =
    true;

clearButton.disabled =
    true;

showLoading();

</script>
