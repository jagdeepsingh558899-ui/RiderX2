<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX - Notifications</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

:root{
    --yellow:#FFD400;
    --bg:#0d0d0d;
    --card:#181818;
    --border:#2d2d2d;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
    background:#080808;
}

body{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    background:var(--bg);
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-bottom:1px solid #252525;
    background:rgba(10,10,10,.96);
    backdrop-filter:blur(14px);
}

.back-btn{
    width:40px;
    height:40px;
    min-width:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #303030;
    border-radius:50%;
    background:#1b1b1b;
    color:#fff;
    font-size:22px;
}

.back-btn:active{
    transform:scale(.95);
}

.title-box{
    flex:1;
    min-width:0;
}

.title{
    font-size:12px;
    font-weight:900;
}

.subtitle{
    margin-top:3px;
    color:#777;
    font-size:6px;
}

.header-action{
    border:0;
    background:transparent;
    color:var(--yellow);
    font-size:7px;
    font-weight:900;
}


/* =========================================================
   CONTENT
========================================================= */

.content{
    padding:13px;
    padding-bottom:35px;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.unread-text{
    color:#777;
    font-size:7px;
}

.unread-text strong{
    color:#fff;
}

.clear-btn{
    padding:7px 10px;
    border:1px solid #343434;
    border-radius:9px;
    background:#191919;
    color:#aaa;
    font-size:6px;
    font-weight:900;
}

.clear-btn:active{
    transform:scale(.97);
}


/* =========================================================
   FILTERS
========================================================= */

.filters{
    display:flex;
    gap:7px;
    margin-bottom:12px;
    overflow-x:auto;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:0 0 auto;
    padding:7px 11px;
    border:1px solid #303030;
    border-radius:20px;
    background:#181818;
    color:#777;
    font-size:6px;
    font-weight:900;
}

.filter.active{
    border-color:#806b00;
    background:#2a2500;
    color:var(--yellow);
}


/* =========================================================
   NOTIFICATION LIST
========================================================= */

.notification-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.notification{
    position:relative;
    display:flex;
    gap:10px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:15px;
    background:var(--card);
    cursor:pointer;
    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
}

.notification:hover{
    border-color:#3b3b3b;
}

.notification:active{
    transform:scale(.99);
    background:#202020;
}

.notification.unread{
    border-color:#3a350f;
    background:
        linear-gradient(
            135deg,
            #1b1b17,
            #171717
        );
}

.notification.unread::before{
    content:"";
    position:absolute;
    top:12px;
    right:12px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--yellow);
}

.notification-icon{
    width:38px;
    height:38px;
    min-width:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:#252525;
    font-size:14px;
}

.notification-icon.yellow{
    background:#302b05;
}

.notification-icon.green{
    background:#15301f;
}

.notification-icon.red{
    background:#301616;
}

.notification-icon.blue{
    background:#151f31;
}

.notification-content{
    flex:1;
    min-width:0;
    padding-right:8px;
}

.notification-title{
    padding-right:10px;
    font-size:8px;
    font-weight:900;
    line-height:1.3;
}

.notification-message{
    margin-top:5px;
    color:#858585;
    font-size:6px;
    line-height:1.45;
}

.notification-time{
    margin-top:7px;
    color:#505050;
    font-size:5px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    display:none;
    padding:60px 20px;
    text-align:center;
}

.empty.show{
    display:block;
}

.empty-icon{
    width:65px;
    height:65px;
    margin:0 auto 13px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#191919;
    font-size:25px;
}

.empty-title{
    font-size:10px;
    font-weight:900;
}

.empty-text{
    max-width:260px;
    margin:7px auto 0;
    color:#666;
    font-size:6px;
    line-height:1.5;
}


/* =========================================================
   DATE GROUP
========================================================= */

.date-label{
    margin:14px 2px 7px;
    color:#555;
    font-size:6px;
    font-weight:900;
    text-transform:uppercase;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.72);
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:650px;
    max-height:75vh;
    overflow:auto;
    padding:18px 14px 25px;
    border-top:1px solid #333;
    border-radius:22px 22px 0 0;
    background:#151515;
}

.handle{
    width:40px;
    height:4px;
    margin:0 auto 15px;
    border-radius:20px;
    background:#444;
}

.modal-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:11px;
    border-radius:14px;
    background:#292929;
    font-size:18px;
}

.modal-title{
    font-size:11px;
    font-weight:900;
}

.modal-time{
    margin-top:4px;
    color:#666;
    font-size:6px;
}

.modal-message{
    margin-top:13px;
    color:#999;
    font-size:7px;
    line-height:1.6;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.modal-close{
    width:100%;
    height:42px;
    margin-top:17px;
    border:0;
    border-radius:11px;
    background:var(--yellow);
    color:#000;
    font-size:7px;
    font-weight:900;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    z-index:200;
    width:calc(100% - 28px);
    max-width:500px;
    padding:11px 13px;
    transform:translate(-50%,20px);
    border:1px solid #333;
    border-radius:11px;
    background:#222;
    color:#fff;
    text-align:center;
    font-size:7px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:380px){

    .content{
        padding-left:10px;
        padding-right:10px;
    }

    .title{
        font-size:11px;
    }

    .header-action{
        font-size:6px;
    }

}

</style>

</head>

<body>

<div class="app">

    <header class="header">

        <button
            type="button"
            class="back-btn"
            id="backButton"
            aria-label="Go back"
        >
            ‹
        </button>

        <div class="title-box">

            <div class="title">
                Notifications
            </div>

            <div class="subtitle">
                RiderX updates and ride alerts
            </div>

        </div>

        <button
            type="button"
            class="header-action"
            id="markAllButton"
        >
            Mark all read
        </button>

    </header>


    <main class="content">

        <div class="topbar">

            <div class="unread-text">
                <strong id="unreadCount">0</strong>
                unread notifications
            </div>

            <button
                type="button"
                class="clear-btn"
                id="clearButton"
            >
                Clear all
            </button>

        </div>


        <div class="filters">

            <button
                type="button"
                class="filter active"
                data-filter="all"
            >
                All
            </button>

            <button
                type="button"
                class="filter"
                data-filter="ride"
            >
                Rides
            </button>

            <button
                type="button"
                class="filter"
                data-filter="payment"
            >
                Payments
            </button>

            <button
                type="button"
                class="filter"
                data-filter="promo"
            >
                Offers
            </button>

            <button
                type="button"
                class="filter"
                data-filter="system"
            >
                Updates
            </button>

        </div>


        <div
            id="notificationList"
            class="notification-list"
            aria-live="polite"
        ></div>


        <div
            id="emptyState"
            class="empty"
        >

            <div class="empty-icon">
                🔔
            </div>

            <div class="empty-title">
                No notifications
            </div>

            <div class="empty-text">
                You're all caught up. New RiderX ride
                and account updates will appear here.
            </div>

        </div>

    </main>

</div>


<!-- =======================================================
     DETAIL MODAL
======================================================= -->

<div
    class="modal"
    id="detailModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
>

    <div
        class="modal-card"
        role="document"
    >

        <div class="handle"></div>

        <div
            class="modal-icon"
            id="modalIcon"
        >
            🔔
        </div>

        <div
            class="modal-title"
            id="modalTitle"
        >
            Notification
        </div>

        <div
            class="modal-time"
            id="modalTime"
        >
            Just now
        </div>

        <div
            class="modal-message"
            id="modalMessage"
        ></div>

        <button
            type="button"
            class="modal-close"
            id="modalCloseButton"
        >
            Done
        </button>

    </div>

</div>


<div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
></div>


<script>

/* =========================================================
   RIDERX CUSTOMER NOTIFICATIONS
   Final notification center

   Supports:
   - Ride notifications
   - Payment notifications
   - Promo notifications
   - System notifications
   - Unread/read state
   - Filters
   - Notification detail modal
   - Clear all
   - Cross-tab localStorage sync
   - Multiple legacy RiderX storage keys
   - Safe normalization
========================================================= */

(function(){

    "use strict";


    /* =====================================================
       STORAGE
    ===================================================== */

    const STORAGE_KEYS = [
        "riderxNotifications",
        "notifications",
        "customerNotifications"
    ];

    const PRIMARY_STORAGE_KEY =
        "riderxNotifications";


    /* =====================================================
       STATE
    ===================================================== */

    let notifications = [];

    let currentFilter = "all";

    let toastTimer = null;


    /* =====================================================
       DEFAULT NOTIFICATIONS
    ===================================================== */

    const defaultNotifications = [

        {
            id:"welcome",
            type:"system",
            icon:"👋",
            title:"Welcome to RiderX",
            message:
                "Welcome to RiderX. Book Bike Taxi, Cab, Parcel and Food Delivery from one app.",
            time:Date.now(),
            read:false
        },

        {
            id:"payment-ready",
            type:"payment",
            icon:"💳",
            title:"Payments are ready",
            message:
                "You can now manage your RiderX wallet and payment methods from the Wallet section.",
            time:Date.now() - 3600000,
            read:false
        }

    ];


    /* =====================================================
       DOM
    ===================================================== */

    const $ = function(id){

        return document.getElementById(id);

    };


    /* =====================================================
       LOAD NOTIFICATIONS
    ===================================================== */

    function loadNotifications(){

        let loaded = null;

        for(
            const key of STORAGE_KEYS
        ){

            try{

                const raw =
                    localStorage.getItem(key);

                if(
                    !raw
                ){

                    continue;

                }


                const parsed =
                    JSON.parse(raw);


                if(
                    Array.isArray(parsed)
                ){

                    loaded = parsed;

                    break;

                }

            }catch(error){

                console.warn(
                    "RiderX notification storage read failed:",
                    key,
                    error
                );

            }

        }


        if(
            loaded &&
            loaded.length
        ){

            notifications =
                normalizeNotifications(
                    loaded
                );

        }else{

            notifications =
                defaultNotifications.map(
                    function(item){

                        return {
                            ...item
                        };

                    }
                );

        }


        removeDuplicateNotifications();

        saveNotifications();

        renderNotifications();

    }


    /* =====================================================
       NORMALIZE
    ===================================================== */

    function normalizeNotifications(data){

        if(
            !Array.isArray(data)
        ){

            return [];

        }


        return data
            .map(
                function(item,index){

                    if(
                        !item ||
                        typeof item !== "object"
                    ){

                        return null;

                    }


                    const type =
                        normalizeType(
                            item.type ||
                            item.category ||
                            item.kind
                        );


                    const rawTime =
                        item.time ??
                        item.createdAt ??
                        item.timestamp ??
                        Date.now();


                    const numericTime =
                        Number(
                            rawTime
                        );


                    return {

                        id:
                            String(
                                item.id ||
                                item.notificationId ||
                                "notification-" +
                                Date.now() +
                                "-" +
                                index
                            ),

                        type:
                            type,

                        icon:
                            safeIcon(
                                item.icon,
                                type
                            ),

                        title:
                            String(
                                item.title ||
                                item.heading ||
                                "RiderX Notification"
                            ),

                        message:
                            String(
                                item.message ||
                                item.body ||
                                item.text ||
                                ""
                            ),

                        time:
                            Number.isFinite(
                                numericTime
                            )
                                ? numericTime
                                : Date.now(),

                        read:
                            item.read === true ||
                            item.isRead === true

                    };

                }
            )
            .filter(
                Boolean
            );

    }


    /* =====================================================
       TYPE
    ===================================================== */

    function normalizeType(type){

        const value =
            String(
                type || "system"
            )
            .toLowerCase()
            .trim();


        if(
            [
                "ride",
                "booking",
                "trip",
                "driver",
                "rider"
            ].includes(value)
        ){

            return "ride";

        }


        if(
            [
                "payment",
                "wallet",
                "transaction",
                "refund"
            ].includes(value)
        ){

            return "payment";

        }


        if(
            [
                "promo",
                "offer",
                "coupon",
                "promotion"
            ].includes(value)
        ){

            return "promo";

        }


        return "system";

    }


    /* =====================================================
       ICON
    ===================================================== */

    function safeIcon(icon,type){

        if(
            typeof icon === "string" &&
            icon.trim()
        ){

            return icon;

        }


        return getIcon(type);

    }


    function getIcon(type){

        switch(type){

            case "ride":
                return "🚕";

            case "payment":
                return "💳";

            case "promo":
                return "🎁";

            case "system":
                return "⚙️";

            default:
                return "🔔";

        }

    }


    /* =====================================================
       REMOVE DUPLICATES
    ===================================================== */

    function removeDuplicateNotifications(){

        const seen = new Set();

        notifications =
            notifications.filter(
                function(item){

                    if(
                        seen.has(item.id)
                    ){

                        return false;

                    }

                    seen.add(item.id);

                    return true;

                }
            );

    }


    /* =====================================================
       SAVE
    ===================================================== */

    function saveNotifications(){

        try{

            localStorage.setItem(
                PRIMARY_STORAGE_KEY,
                JSON.stringify(
                    notifications
                )
            );

        }catch(error){

            console.warn(
                "RiderX notification save failed:",
                error
            );

        }

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderNotifications(){

        const list =
            $("notificationList");

        const empty =
            $("emptyState");


        if(
            !list ||
            !empty
        ){

            return;

        }


        list.innerHTML = "";


        let filtered =
            notifications.filter(
                function(item){

                    return (
                        currentFilter === "all" ||
                        item.type === currentFilter
                    );

                }
            );


        filtered.sort(
            function(a,b){

                return (
                    Number(b.time) -
                    Number(a.time)
                );

            }
        );


        if(
            !filtered.length
        ){

            empty.classList.add(
                "show"
            );

            updateUnreadCount();

            return;

        }


        empty.classList.remove(
            "show"
        );


        const groups =
            groupByDate(
                filtered
            );


        Object.keys(groups)
            .forEach(
                function(group){

                    const label =
                        document.createElement(
                            "div"
                        );

                    label.className =
                        "date-label";

                    label.textContent =
                        group;

                    list.appendChild(
                        label
                    );


                    groups[group].forEach(
                        function(notification){

                            list.appendChild(
                                createNotificationElement(
                                    notification
                                )
                            );

                        }
                    );

                }
            );


        updateUnreadCount();

    }


    /* =====================================================
       CREATE NOTIFICATION
    ===================================================== */

    function createNotificationElement(item){

        const el =
            document.createElement(
                "div"
            );


        el.className =
            "notification" +
            (
                item.read
                    ? ""
                    : " unread"
            );


        el.setAttribute(
            "role",
            "button"
        );


        el.setAttribute(
            "tabindex",
            "0"
        );


        el.setAttribute(
            "aria-label",
            item.title
        );


        const iconClass =
            getIconClass(
                item.type
            );


        el.innerHTML = `

            <div class="notification-icon ${iconClass}">
                ${escapeHtml(item.icon)}
            </div>

            <div class="notification-content">

                <div class="notification-title">
                    ${escapeHtml(item.title)}
                </div>

                <div class="notification-message">
                    ${escapeHtml(item.message)}
                </div>

                <div class="notification-time">
                    ${escapeHtml(
                        formatTime(item.time)
                    )}
                </div>

            </div>

        `;


        const open =
            function(){

                openNotification(
                    item.id
                );

            };


        el.addEventListener(
            "click",
            open
        );


        el.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Enter" ||
                    event.key === " "
                ){

                    event.preventDefault();

                    open();

                }

            }
        );


        return el;

    }


    /* =====================================================
       ICON CLASS
    ===================================================== */

    function getIconClass(type){

        switch(type){

            case "ride":
                return "yellow";

            case "payment":
                return "green";

            case "promo":
                return "blue";

            case "system":
                return "yellow";

            default:
                return "";

        }

    }


    /* =====================================================
       GROUP BY DATE
    ===================================================== */

    function groupByDate(list){

        const groups = {};


        list.forEach(
            function(item){

                const label =
                    getDateLabel(
                        item.time
                    );


                if(
                    !groups[label]
                ){

                    groups[label] = [];

                }


                groups[label].push(
                    item
                );

            }
        );


        return groups;

    }


    /* =====================================================
       DATE LABEL
    ===================================================== */

    function getDateLabel(timestamp){

        const date =
            new Date(
                timestamp
            );


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "Earlier";

        }


        const now =
            new Date();


        const today =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()
            );


        const yesterday =
            new Date(
                today
            );


        yesterday.setDate(
            yesterday.getDate() - 1
        );


        const target =
            new Date(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            );


        if(
            target.getTime() ===
            today.getTime()
        ){

            return "Today";

        }


        if(
            target.getTime() ===
            yesterday.getTime()
        ){

            return "Yesterday";

        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day:"numeric",
                month:"short",
                year:"numeric"
            }
        );

    }


    /* =====================================================
       TIME
    ===================================================== */

    function formatTime(timestamp){

        const date =
            new Date(
                timestamp
            );


        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "Recently";

        }


        const diff =
            Math.max(
                0,
                Date.now() -
                date.getTime()
            );


        const minute =
            60000;

        const hour =
            minute * 60;

        const day =
            hour * 24;


        if(
            diff < minute
        ){

            return "Just now";

        }


        if(
            diff < hour
        ){

            const value =
                Math.floor(
                    diff / minute
                );

            return value +
                (
                    value === 1
                        ? " minute ago"
                        : " minutes ago"
                );

        }


        if(
            diff < day
        ){

            const value =
                Math.floor(
                    diff / hour
                );

            return value +
                (
                    value === 1
                        ? " hour ago"
                        : " hours ago"
                );

        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day:"numeric",
                month:"short"
            }
        ) +
        " • " +
        date.toLocaleTimeString(
            "en-IN",
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function setFilter(filter){

        currentFilter =
            normalizeType(
                filter
            );


        if(
            filter === "all"
        ){

            currentFilter = "all";

        }


        document
            .querySelectorAll(
                ".filter"
            )
            .forEach(
                function(button){

                    button.classList.toggle(
                        "active",
                        button.dataset.filter ===
                        currentFilter
                    );

                }
            );


        renderNotifications();

    }


    /* =====================================================
       OPEN
    ===================================================== */

    function openNotification(id){

        const item =
            notifications.find(
                function(notification){

                    return (
                        notification.id ===
                        id
                    );

                }
            );


        if(
            !item
        ){

            return;

        }


        item.read = true;

        saveNotifications();

        renderNotifications();


        $("modalIcon").textContent =
            item.icon;


        $("modalTitle").textContent =
            item.title;


        $("modalTime").textContent =
            formatTime(
                item.time
            );


        $("modalMessage").textContent =
            item.message;


        $("detailModal").classList.add(
            "show"
        );


        document.body.style.overflow =
            "hidden";

    }


    /* =====================================================
       CLOSE
    ===================================================== */

    function closeModal(){

        $("detailModal").classList.remove(
            "show"
        );

        document.body.style.overflow =
            "";

    }


    /* =====================================================
       MARK ALL READ
    ===================================================== */

    function markAllRead(){

        let changed = false;


        notifications.forEach(
            function(item){

                if(
                    !item.read
                ){

                    item.read = true;

                    changed = true;

                }

            }
        );


        if(
            changed
        ){

            saveNotifications();

            renderNotifications();

            showToast(
                "All notifications marked as read."
            );

        }else{

            showToast(
                "All notifications are already read."
            );

        }

    }


    /* =====================================================
       CLEAR
    ===================================================== */

    function clearNotifications(){

        if(
            !notifications.length
        ){

            showToast(
                "No notifications to clear."
            );

            return;

        }


        const confirmed =
            window.confirm(
                "Clear all RiderX notifications?"
            );


        if(
            !confirmed
        ){

            return;

        }


        notifications = [];

        saveNotifications();

        renderNotifications();

        showToast(
            "Notifications cleared."
        );

    }


    /* =====================================================
       UNREAD COUNT
    ===================================================== */

    function updateUnreadCount(){

        const count =
            notifications.filter(
                function(item){

                    return !item.read;

                }
            ).length;


        $("unreadCount").textContent =
            count;

    }


    /* =====================================================
       BACK
    ===================================================== */

    function goBack(){

        try{

            if(
                document.referrer &&
                new URL(
                    document.referrer
                ).origin ===
                window.location.origin
            ){

                window.history.back();

                return;

            }

        }catch(error){

            console.warn(
                "Back navigation check failed:",
                error
            );

        }


        window.location.href =
            "home.html";

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value){

        return String(
            value ?? ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(message){

        const toast =
            $("toast");


        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        clearTimeout(
            toastTimer
        );


        toastTimer =
            setTimeout(
                function(){

                    toast.classList.remove(
                        "show"
                    );

                },
                2500
            );

    }


    /* =====================================================
       CROSS TAB / PAGE SYNC
    ===================================================== */

    window.addEventListener(
        "storage",
        function(event){

            if(
                STORAGE_KEYS.includes(
                    event.key
                )
            ){

                loadNotifications();

            }

        }
    );


    /* =====================================================
       PUBLIC RIDERX NOTIFICATION API
       
       Other RiderX pages can call:

       RiderXNotifications.add({...})

       Example:

       RiderXNotifications.add({
           type:"ride",
           title:"Ride accepted",
           message:"Your rider has accepted the ride."
       });
    ===================================================== */

    window.RiderXNotifications = {

        getAll:function(){

            return notifications.map(
                function(item){

                    return {
                        ...item
                    };

                }
            );

        },


        getUnreadCount:function(){

            return notifications.filter(
                function(item){

                    return !item.read;

                }
            ).length;

        },


        add:function(data){

            if(
                !data ||
                typeof data !== "object"
            ){

                return null;

            }


            const type =
                normalizeType(
                    data.type
                );


            const item = {

                id:
                    String(
                        data.id ||
                        "notification-" +
                        Date.now() +
                        "-" +
                        Math.random()
                            .toString(36)
                            .slice(2,8)
                    ),

                type:
                    type,

                icon:
                    safeIcon(
                        data.icon,
                        type
                    ),

                title:
                    String(
                        data.title ||
                        "RiderX Notification"
                    ),

                message:
                    String(
                        data.message ||
                        data.body ||
                        ""
                    ),

                time:
                    Number(
                        data.time ||
                        Date.now()
                    ),

                read:
                    data.read === true

            };


            notifications.unshift(
                item
            );


            removeDuplicateNotifications();

            saveNotifications();

            renderNotifications();


            return {
                ...item
            };

        },


        markRead:function(id){

            const item =
                notifications.find(
                    function(notification){

                        return (
                            notification.id ===
                            String(id)
                        );

                    }
                );


            if(
                !item
            ){

                return false;

            }


            item.read = true;

            saveNotifications();

            renderNotifications();

            return true;

        },


        markAllRead:function(){

            markAllRead();

        }

    };


    /* =====================================================
       EVENT BINDINGS
    ===================================================== */

    function bindEvents(){

        $("backButton")
            .addEventListener(
                "click",
                goBack
            );


        $("markAllButton")
            .addEventListener(
                "click",
                markAllRead
            );


        $("clearButton")
            .addEventListener(
                "click",
                clearNotifications
            );


        $("modalCloseButton")
            .addEventListener(
                "click",
                closeModal
            );


        document
            .querySelectorAll(
                ".filter"
            )
            .forEach(
                function(button){

                    button.addEventListener(
                        "click",
                        function(){

                            setFilter(
                                button.dataset.filter
                            );

                        }
                    );

                }
            );


        $("detailModal")
            .addEventListener(
                "click",
                function(event){

                    if(
                        event.target ===
                        $("detailModal")
                    ){

                        closeModal();

                    }

                }
            );


        document.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Escape"
                ){

                    closeModal();

                }

            }
        );

    }


    /* =====================================================
       INIT
    ===================================================== */

    function init(){

        bindEvents();

        loadNotifications();

    }


    if(
        document.readyState ===
        "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            init,
            {
                once:true
            }
        );

    }else{

        init();

    }

})();

</script>

</body>

</html>
