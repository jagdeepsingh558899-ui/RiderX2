<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rating</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.box{

background:#111;
padding:25px;
border-radius:20px;
border:2px solid #FFD600;
text-align:center;

}


.star{

font-size:40px;
cursor:pointer;

}


textarea{

width:100%;
height:100px;
margin-top:20px;
border-radius:12px;
padding:10px;

}


button{

width:100%;
padding:15px;
margin-top:15px;
background:#FFD600;
border:none;
border-radius:12px;
font-weight:bold;

}


</style>

</head>


<body>



<div class="header">

⭐ Rate Rider

</div>



<div class="container">


<div class="box">


<h2>

How was your ride?

</h2>



<div>


<span class="star" onclick="rate(1)">☆</span>
<span class="star" onclick="rate(2)">☆</span>
<span class="star" onclick="rate(3)">☆</span>
<span class="star" onclick="rate(4)">☆</span>
<span class="star" onclick="rate(5)">☆</span>


</div>




<textarea id="review" placeholder="Write your review"></textarea>




<button onclick="submitRating()">

Submit Rating

</button>



<p id="msg"></p>



</div>


</div>






<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
addDoc,
doc,
getDoc,
updateDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rating=0;


let rideId=

localStorage.getItem("rideId");







function rate(value){


rating=value;


document.querySelectorAll(".star")
.forEach((star,index)=>{


star.innerHTML=

index < value

?

"★"

:

"☆";


});


}



window.rate=rate;







window.submitRating=async()=>{



if(rating===0){


document.getElementById("msg").innerHTML=

"Please select stars ⭐";


return;


}





let rideSnap=

await getDoc(

doc(db,"rides",rideId)

);



if(!rideSnap.exists()) return;



let data=

rideSnap.data();






await addDoc(

collection(db,"reviews"),

{


rideId:rideId,


riderId:data.riderId || "",


rating:rating,


review:

document.getElementById("review").value,


createdAt:serverTimestamp()


}

);






await updateDoc(

doc(db,"rides",rideId),

{


rated:true

}

);






document.getElementById("msg").innerHTML=

"Thank you for rating ⭐";





setTimeout(()=>{


location.href="history.html";


},1500);



};



</script>



</body>

</html>
