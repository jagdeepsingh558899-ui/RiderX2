<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rating</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
}

.box{

width:90%;
max-width:400px;
margin:50px auto;
background:#1d1d1d;
padding:25px;
border-radius:15px;
text-align:center;

}


.star{

font-size:40px;
cursor:pointer;
color:#777;

}


textarea,input{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:none;

}


button{

width:100%;
padding:14px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="box">


<h1>⭐ Rate Rider</h1>


<div>

<span class="star" onclick="setRating(1)">★</span>
<span class="star" onclick="setRating(2)">★</span>
<span class="star" onclick="setRating(3)">★</span>
<span class="star" onclick="setRating(4)">★</span>
<span class="star" onclick="setRating(5)">★</span>

</div>


<textarea id="comment" placeholder="Write feedback"></textarea>


<button onclick="submitRating()">

Submit Rating

</button>


<p id="msg"></p>


</div>





<script type="module">


import { addRating } from "../js/rating.js";


let selectedRating = 0;



window.setRating=function(num){

selectedRating=num;

document.getElementById("msg").innerHTML =
num+" Star Selected ⭐";

}




window.submitRating=async function(){


if(selectedRating==0){

alert("Select rating");

return;

}



let result = await addRating(

"ride",

"user",

selectedRating,

document.getElementById("comment").value

);



if(result){

document.getElementById("msg").innerHTML=
"Thanks for rating ✅";

}


}



</script>


</body>

</html>
