<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rating</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<header class="topbar">
<h1>Rider<span>X</span></h1>
</header>

<div class="container">

<div class="service-card">

<h2>⭐ Rate Your Ride</h2>

<p>How was your ride?</p>

<select id="rating">

<option value="5">⭐⭐⭐⭐⭐ Excellent</option>
<option value="4">⭐⭐⭐⭐ Good</option>
<option value="3">⭐⭐⭐ Average</option>
<option value="2">⭐⭐ Poor</option>
<option value="1">⭐ Very Poor</option>

</select>

<textarea
id="review"
placeholder="Write your review..."
style="width:100%;height:120px;margin-top:15px;padding:10px;border-radius:10px;"></textarea>

<button id="submitRatingBtn">
Submit Review
</button>

</div>

</div>

<script type="module" src="../js/rating.js"></script>

</body>

</html>
