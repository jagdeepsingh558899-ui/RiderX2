<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Rating</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.box{

background:#1d1d1d;
padding:25px;
border-radius:15px;
text-align:center;

}


.star{

font-size:35px;
cursor:pointer;

}


textarea{

width:100%;
height:100px;
margin-top:15px;

}


button{

width:100%;
padding:14px;
margin-top:15px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

⭐ Rate Rider

</div>



<div class="container">


<div class="box">


<h2>

How was your ride?

</h2>



<div>


<span class="star" onclick="rate(1)">☆</span>

<span class="star" onclick="rate(2)">☆</span>

<span class="star" onclick="rate(3)">☆</span>

<span class="star" onclick="rate(4)">☆</span>

<span class="star" onclick="rate(5)">☆</span>


</div>



<textarea id="review" placeholder="Write review"></textarea>



<button onclick="submitRating()">

Submit Rating

</button>


</div>


</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
addDoc,
doc,
getDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let rating=0;


let rideId=

localStorage.getItem("rideId");



function rate(value){


rating=value;


let stars=document.querySelectorAll(".star");



stars.forEach((s,i)=>{


s.innerHTML=

i<value ? "★" : "☆";


});


}


window.rate=rate;







window.submitRating=async function(){



let ride=

await getDoc(

doc(db,"rides",rideId)

);



let data=ride.data();



await addDoc(

collection(db,"reviews"),

{


rideId,

riderId:data.riderId,


rating,


review:

document.getElementById("review").value,


createdAt:serverTimestamp()


}

);



alert("Thanks for rating ⭐");


location.href="home.html";



}





</script>


</body>

</html>
