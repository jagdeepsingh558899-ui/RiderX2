<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiderX - Customer Profile</title>
    <!-- Tailwind CSS for modern responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0a0a0a',
                        brandCard: '#141414',
                        brandYellow: '#facc15',
                        brandYellowHover: '#eab308',
                        brandGray: '#262626',
                        brandTextGray: '#a3a3a3'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .glass-card {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(250, 204, 21, 0.15);
        }
    </style>

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <!-- Firebase Config -->
    <script src="../firebase/firebase-config.js"></script>
</head>
<body class="bg-brandDark min-h-screen pb-24 text-white">

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-brandDark/90 backdrop-blur-md border-b border-neutral-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-wider text-white">RIDER<span class="text-brandYellow">X</span></span>
        </div>
        <button id="logoutBtn" class="text-brandTextGray hover:text-brandYellow transition text-sm font-semibold flex items-center space-x-1">
            <i class="fa-solid fa-power-off"></i>
            <span>Logout</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-6">
        <!-- Profile Header Card -->
        <div class="glass-card rounded-2xl p-6 shadow-2xl text-center relative overflow-hidden mb-6">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-brandYellow/10 rounded-full blur-2xl"></div>
            
            <div class="relative inline-block mx-auto mb-4">
                <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-brandYellow to-amber-600 mx-auto">
                    <img id="profileImage" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" alt="Profile" class="w-full h-full rounded-full object-cover bg-brandGray">
                </div>
                <label for="imageUploadInput" class="absolute bottom-0 right-0 bg-brandYellow text-black p-2 rounded-full shadow-lg cursor-pointer hover:bg-brandYellowHover transition">
                    <i class="fa-solid fa-camera text-xs"></i>
                </label>
                <input type="file" id="imageUploadInput" accept="image/*" class="hidden">
            </div>

            <h1 id="profileNameDisplay" class="text-xl font-bold text-white mb-1">Loading Name...</h1>
            <p id="profileEmailDisplay" class="text-sm text-brandTextGray mb-3">Loading Email...</p>
            <span class="inline-block bg-brandYellow/10 text-brandYellow text-xs px-3 py-1 rounded-full font-medium border border-brandYellow/20">Verified Customer</span>
        </div>

        <!-- Edit Profile Form Card -->
        <div class="glass-card rounded-2xl p-6 shadow-xl mb-6">
            <h2 class="text-lg font-semibold mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-user-pen text-brandYellow text-sm"></i>
                <span>Edit Profile</span>
            </h2>

            <form id="updateProfileForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-brandTextGray mb-1">Full Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brandTextGray">
                            <i class="fa-regular fa-user text-xs"></i>
                        </span>
                        <input type="text" id="fullNameInput" required class="w-full bg-brandGray/50 border border-neutral-800 rounded-xl px-4 py-3 pl-10 text-sm text-white focus:outline-none focus:border-brandYellow transition" placeholder="Enter your full name">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-brandTextGray mb-1">Mobile Number</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-brandTextGray">
                            <i class="fa-solid fa-phone text-xs"></i>
                        </span>
                        <input type="tel" id="mobileNumberInput" required class="w-full bg-brandGray/50 border border-neutral-800 rounded-xl px-4 py-3 pl-10 text-sm text-white focus:outline-none focus:border-brandYellow transition" placeholder="Enter your mobile number">
                    </div>
                </div>

                <button type="submit" id="saveBtn" class="w-full bg-brandYellow text-black font-bold py-3 px-4 rounded-xl hover:bg-brandYellowHover transition shadow-lg shadow-brandYellow/20 text-sm flex items-center justify-center space-x-2">
                    <span>Save Changes</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-brandDark/95 backdrop-blur-md border-t border-neutral-800 z-50 py-2">
        <div class="max-w-md mx-auto flex justify-around items-center px-2">
            <a href="home.html" class="flex flex-col items-center py-1 px-3 text-brandTextGray hover:text-brandYellow transition">
                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="booking.html" class="flex flex-col items-center py-1 px-3 text-brandTextGray hover:text-brandYellow transition">
                <i class="fa-solid fa-location-arrow text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Booking</span>
            </a>
            <a href="history.html" class="flex flex-col items-center py-1 px-3 text-brandTextGray hover:text-brandYellow transition">
                <i class="fa-solid fa-clock-rotate-left text-lg mb-1"></i>
                <span class="text-[10px] font-medium">History</span>
            </a>
            <a href="wallet.html" class="flex flex-col items-center py-1 px-3 text-brandTextGray hover:text-brandYellow transition">
                <i class="fa-solid fa-wallet text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Wallet</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center py-1 px-3 text-brandYellow transition">
                <i class="fa-solid fa-user text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Profile</span>
            </a>
        </div>
    </nav>

    <!-- Application Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const auth = firebase.auth();
            const db = firebase.firestore();
            const storage = firebase.storage();

            let currentUserUid = null;

            // 1. Customer Authentication Check
            auth.onAuthStateChanged(function (user) {
                if (!user) {
                    window.location.href = '../auth/login.html';
                } else {
                    currentUserUid = user.uid;
                    loadCustomerProfile(currentUserUid);
                }
            });

            // 2. Load Customer Profile Data
            function loadCustomerProfile(uid) {
                const docRef = db.collection('customers').doc(uid);

                docRef.get().then(function (doc) {
                    if (doc.exists) {
                        const data = doc.data();
                        const fullName = data.fullName || data.name || '';
                        const mobileNumber = data.mobileNumber || data.phone || '';
                        const photoURL = data.photoURL || '';
                        const email = auth.currentUser.email || '';

                        // Update UI fields
                        document.getElementById('profileNameDisplay').textContent = fullName || 'RiderX Member';
                        document.getElementById('profileEmailDisplay').textContent = email;
                        document.getElementById('fullNameInput').value = fullName;
                        document.getElementById('mobileNumberInput').value = mobileNumber;

                        if (photoURL) {
                            document.getElementById('profileImage').src = photoURL;
                        }
                    } else {
                        // Initialize basic document if not exists
                        const initialData = {
                            fullName: auth.currentUser.displayName || '',
                            email: auth.currentUser.email || '',
                            mobileNumber: '',
                            photoURL: ''
                        };
                        docRef.set(initialData, { merge: true });
                    }
                }).catch(function (error) {
                    console.error("Error loading profile:", error);
                });
            }

            // 4. Update Profile Form Submission
            const updateProfileForm = document.getElementById('updateProfileForm');
            updateProfileForm.addEventListener('submit', function (e) {
                e.preventDefault();
                if (!currentUserUid) return;

                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i><span>Saving...</span>';

                const newFullName = document.getElementById('fullNameInput').value.trim();
                const newMobileNumber = document.getElementById('mobileNumberInput').value.trim();

                const updateData = {
                    fullName: newFullName,
                    mobileNumber: newMobileNumber,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                db.collection('customers').doc(currentUserUid).set(updateData, { merge: true })
                    .then(function () {
                        document.getElementById('profileNameDisplay').textContent = newFullName;
                        alert('Profile updated successfully!');
                    })
                    .catch(function (error) {
                        console.error("Error updating profile:", error);
                        alert('Failed to update profile. Please try again.');
                    })
                    .finally(function () {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = '<span>Save Changes</span>';
                    });
            });

            // 5. Profile Photo Upload
            const imageUploadInput = document.getElementById('imageUploadInput');
            imageUploadInput.addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (!file || !currentUserUid) return;

                const storageRef = storage.ref(`customers/profile/${currentUserUid}`);
                const uploadTask = storageRef.put(file);

                uploadTask.on('state_changed', 
                    function (snapshot) {
                        // Optional progress tracking
                    }, 
                    function (error) {
                        console.error("Upload error:", error);
                        alert('Failed to upload image.');
                    }, 
                    function () {
                        uploadTask.snapshot.ref.getDownloadURL().then(function (downloadURL) {
                            // Save photoURL in Firestore
                            db.collection('customers').doc(currentUserUid).set({
                                photoURL: downloadURL,
                                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }, { merge: true })
                            .then(function () {
                                document.getElementById('profileImage').src = downloadURL;
                                alert('Profile photo updated successfully!');
                            })
                            .catch(function (error) {
                                console.error("Error saving photo URL:", error);
                            });
                        });
                    }
                );
            });

            // 6. Logout Functionality
            const logoutBtn = document.getElementById('logoutBtn');
            logoutBtn.addEventListener('click', function () {
                auth.signOut().then(function () {
                    window.location.href = '../auth/login.html';
                }).catch(function (error) {
                    console.error("Logout error:", error);
                });
            });
        });
    </script>
</body>
</html>
