<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX | Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}


body{

background:#080808;
color:white;
min-height:100vh;

}


.header{

display:flex;
align-items:center;
justify-content:space-between;
padding:20px;

}


.logo{

font-size:26px;
font-weight:800;

}

.logo span{

color:#ffe500;

}


.back{

color:#ffe500;
font-size:22px;

}



.container{

padding:20px;

}



.profile-card{

background:#151515;
border:1px solid rgba(255,229,0,.2);
border-radius:20px;
padding:25px;
text-align:center;

}



.profile-img{

width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
border:3px solid #ffe500;

}



.upload{

margin-top:15px;

}



.upload input{

display:none;

}


.upload label{

background:#ffe500;
color:#000;
padding:10px 20px;
border-radius:10px;
cursor:pointer;
font-weight:600;

}



.form{

margin-top:25px;

}



.input{

margin-bottom:15px;

}



label{

display:block;
color:#aaa;
font-size:14px;
margin-bottom:5px;

}



input{

width:100%;
padding:14px;
border-radius:10px;
border:none;
outline:none;
background:#222;
color:white;

}



button{

width:100%;
margin-top:15px;
padding:14px;
border:none;
border-radius:12px;
background:#ffe500;
font-weight:700;
cursor:pointer;

}



.logout{

background:#ff3333;
color:white;

}



.nav{

position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:#111;
display:flex;
justify-content:space-around;
align-items:center;

}



.nav a{

color:#aaa;
text-decoration:none;
font-size:12px;
text-align:center;

}


.nav i{

font-size:20px;
display:block;
margin-bottom:5px;

}


.active{

color:#ffe500!important;

}


</style>

</head>


<body>


<div class="header">

<a href="home.html" class="back">
<i class="fa-solid fa-arrow-left"></i>
</a>


<div class="logo">
RIDER<span>X</span>
</div>


</div>




<div class="container">


<div class="profile-card">


<img id="profileImage"
src="https://via.placeholder.com/150"
class="profile-img">


<div class="upload">

<label for="photo">
<i class="fa fa-camera"></i>
Change Photo
</label>

<input type="file" id="photo" accept="image/*">

</div>



<div class="form">


<div class="input">

<label>Name</label>

<input id="name" type="text">

</div>



<div class="input">

<label>Email</label>

<input id="email" type="email" readonly>

</div>



<div class="input">

<label>Mobile Number</label>

<input id="phone" type="text">

</div>



<button onclick="saveProfile()">

Save Profile

</button>



<button class="logout" onclick="logout()">

Logout

</button>



</div>



</div>


</div>





<div class="nav">


<a href="home.html">
<i class="fa fa-home"></i>
Home
</a>



<a href="booking.html">
<i class="fa fa-motorcycle"></i>
Book
</a>



<a href="history.html">
<i class="fa fa-clock"></i>
History
</a>



<a class="active" href="profile.html">
<i class="fa fa-user"></i>
Profile
</a>



</div>





<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>


<script src="../firebase/firebase-config.js"></script>



<script>


const auth=firebase.auth();

const db=firebase.firestore();



let currentUser=null;



auth.onAuthStateChanged(async(user)=>{


if(!user){

location.href="../auth/login.html";

return;

}


currentUser=user;



document.getElementById("email").value=user.email;



const doc=await db.collection("customers")
.doc(user.uid)
.get();



if(doc.exists){


const data=doc.data();


document.getElementById("name").value=
data.fullName || data.name || "";


document.getElementById("phone").value=
data.mobileNumber || data.phone || "";


if(data.photoURL){

document.getElementById("profileImage").src=data.photoURL;

}


}



});





async function saveProfile(){


try{


await db.collection("customers")
.doc(currentUser.uid)
.update({

fullName:
document.getElementById("name").value,

mobileNumber:
document.getElementById("phone").value


});


alert("Profile Updated Successfully");


}


catch(e){

alert(e.message);

}


}




async function logout(){


await auth.signOut();

location.href="../auth/login.html";


}




</script>


</body>
</html>
