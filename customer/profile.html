<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Profile</title>


<link rel="icon" href="../assets/logo.png">


<link rel="stylesheet" href="../css/Style.css">

<link rel="stylesheet" href="../css/Dashboard.css">

<link rel="stylesheet" href="../css/Responsive.css">

<link rel="stylesheet" href="../css/Animation.css">


</head>



<body>



<nav class="navbar">


<div class="logo">

<img src="../assets/logo.png">

<span>RiderX</span>

</div>


</nav>






<div class="dashboard-wrapper page">



<div class="profile-card fade-in">



<img 
id="profileImage"
src="../assets/logo.png"
class="profile-img">





<h2 id="userName">

Loading...

</h2>




<p id="userEmail">

Loading...

</p>





<div class="profile-form">



<label>

Name

</label>


<input 
id="name"
placeholder="Enter Name">





<label>

Mobile

</label>


<input 
id="phone"
placeholder="Mobile Number">





<label>

Email

</label>


<input 
id="email"
readonly>







<button 
id="saveProfile"
class="btn">

Save Profile

</button>





</div>





</div>








<div class="grid">



<div class="card">


<h3>

💰 Wallet

</h3>


<a href="wallet.html" class="btn">

Open Wallet

</a>


</div>





<div class="card">


<h3>

⚙ Settings

</h3>


<a href="settings.html" class="btn">

Settings

</a>


</div>






<div class="card">


<h3>

🚪 Logout

</h3>


<button id="logout" class="btn btn-dark">

Logout

</button>


</div>




</div>






</div>






<script type="module" src="../js/Profile.js"></script>


</body>

</html>
