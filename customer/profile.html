<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX | Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

:root{
--yellow:#FFE500;
--black:#080808;
--card:#151515;
--gray:#999;
}


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

background:var(--black);
color:white;
min-height:100vh;
padding-bottom:80px;

}



.header{

height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;

}


.logo{

font-size:26px;
font-weight:800;

}

.logo span{

color:var(--yellow);

}



.back{

color:var(--yellow);
font-size:22px;

}



.container{

padding:20px;

}



.card{

background:var(--card);
border:1px solid rgba(255,229,0,.25);
border-radius:22px;
padding:25px;

}



.profile-top{

text-align:center;

}



.profile-img{

height:110px;
width:110px;
border-radius:50%;
object-fit:cover;
border:3px solid var(--yellow);

}



.upload-btn{

display:inline-block;
margin-top:15px;
background:var(--yellow);
color:#000;
padding:10px 20px;
border-radius:12px;
font-weight:700;
cursor:pointer;

}


#photo{

display:none;

}



.form{

margin-top:30px;

}



.field{

margin-bottom:18px;

}



.field label{

display:block;
color:#aaa;
font-size:14px;
margin-bottom:6px;

}



.field input{

width:100%;
padding:14px;
background:#222;
border:none;
outline:none;
border-radius:12px;
color:white;

}



.btn{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:var(--yellow);
color:#000;
font-weight:700;
font-size:16px;
cursor:pointer;

}



.logout{

background:#ff3333;
color:white;

}



.nav{

position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:#111;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid #222;

}



.nav a{

color:#777;
text-decoration:none;
font-size:12px;
text-align:center;

}



.nav i{

display:block;
font-size:20px;
margin-bottom:4px;

}



.active{

color:var(--yellow)!important;

}


</style>

</head>


<body>


<header class="header">

<a class="back" href="home.html">
<i class="fa-solid fa-arrow-left"></i>
</a>


<div class="logo">
RIDER<span>X</span>
</div>


<div></div>

</header>



<div class="container">


<div class="card">


<div class="profile-top">


<img id="profileImage"
src="../assets/Images/profile.png"
onerror="this.src='https://via.placeholder.com/150'"
class="profile-img">



<br>


<label class="upload-btn" for="photo">

<i class="fa fa-camera"></i>
Change Photo

</label>


<input type="file" id="photo" accept="image/*">


</div>



<div class="form">


<div class="field">

<label>Full Name</label>

<input id="name" type="text" placeholder="Your Name">

</div>



<div class="field">

<label>Email</label>

<input id="email" type="email" readonly>

</div>



<div class="field">

<label>Mobile Number</label>

<input id="phone" type="text">

</div>



<button class="btn" onclick="updateProfile()">

Save Profile

</button>



<button class="btn logout" onclick="logout()">

Logout

</button>


</div>


</div>


</div>


<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>


<script src="../firebase/firebase-config.js"></script>



<script>


const auth = firebase.auth();

const db = firebase.firestore();

const storage = firebase.storage();


let currentUser=null;

let selectedPhoto=null;



// Load Profile

auth.onAuthStateChanged(async(user)=>{


if(!user){

window.location.href="../auth/login.html";

return;

}



currentUser=user;



document.getElementById("email").value=user.email || "";



const snap = await db.collection("customers")
.doc(user.uid)
.get();



if(snap.exists){


const data=snap.data();



document.getElementById("name").value =
data.fullName || data.name || "";



document.getElementById("phone").value =
data.mobileNumber || data.phone || "";



if(data.photoURL){

document.getElementById("profileImage").src=data.photoURL;

}


}


});




// Select Image

document.getElementById("photo")
.addEventListener("change",(e)=>{


selectedPhoto=e.target.files[0];



if(selectedPhoto){


const reader=new FileReader();



reader.onload=function(){

document.getElementById("profileImage").src=
reader.result;


}



reader.readAsDataURL(selectedPhoto);


}



});




// Update Profile

async function updateProfile(){


try{


let photoURL="";



if(selectedPhoto){


const ref =
storage.ref(
"customers/profile/"+currentUser.uid
);



await ref.put(selectedPhoto);



photoURL=
await ref.getDownloadURL();



}



let updateData={


fullName:
document.getElementById("name").value.trim(),


mobileNumber:
document.getElementById("phone").value.trim()


};



if(photoURL){

updateData.photoURL=photoURL;

}



await db.collection("customers")
.doc(currentUser.uid)
.update(updateData);



alert("Profile Updated Successfully");


}



catch(error){

alert(error.message);


}


}




// Logout

async function logout(){


await auth.signOut();


window.location.href="../auth/login.html";


}



</script>





<!-- Bottom Navigation -->

<div class="nav">


<a href="home.html">

<i class="fa fa-home"></i>

Home

</a>



<a href="booking.html">

<i class="fa fa-motorcycle"></i>

Book

</a>



<a href="history.html">

<i class="fa fa-clock"></i>

History

</a>



<a href="wallet.html">

<i class="fa fa-wallet"></i>

Wallet

</a>



<a class="active" href="profile.html">

<i class="fa fa-user"></i>

Profile

</a>


</div>


</body>

</html>
