<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX | Customer Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    
<style>
    
:root{
    --yellow:#FFE500;
    --black:#080808;
    --card:#151515;
    --text:#ffffff;
    --gray:#999;
    --danger:#ff3333;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


body{

    background:var(--black);
    color:var(--text);
    min-height:100vh;
    padding-bottom:80px;

}


/* Header */

.header{

    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;

}


.logo{

    font-size:28px;
    font-weight:800;

}


.logo span{

    color:var(--yellow);

}


.back{

    color:var(--yellow);
    font-size:22px;

}



/* Main */

.container{

    padding:20px;

}



.profile-card{

    background:linear-gradient(
        145deg,
        #181818,
        #101010
    );

    border:1px solid rgba(255,229,0,.25);

    border-radius:25px;

    padding:25px;

    box-shadow:
    0 10px 40px rgba(0,0,0,.5);

}



/* Profile Image */

.profile-section{

    text-align:center;

}



.profile-img{

    width:120px;
    height:120px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid var(--yellow);

}



.change-photo{

    display:inline-block;

    margin-top:15px;

    background:var(--yellow);

    color:#000;

    padding:10px 20px;

    border-radius:12px;

    font-weight:700;

    cursor:pointer;

}



#photoInput{

    display:none;

}




/* Form */

.form-box{

    margin-top:30px;

}



.input-box{

    margin-bottom:18px;

}



.input-box label{

    color:var(--gray);

    font-size:14px;

    display:block;

    margin-bottom:7px;

}



.input-box input{

    width:100%;

    padding:14px;

    background:#222;

    color:white;

    border:none;

    outline:none;

    border-radius:12px;

    font-size:15px;

}



.input-box input:focus{

    border:1px solid var(--yellow);

}



/* Buttons */

.btn{

    width:100%;

    padding:15px;

    margin-top:15px;

    border:none;

    border-radius:12px;

    background:var(--yellow);

    color:#000;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

}



.logout-btn{

    background:var(--danger);

    color:white;

}



/* Bottom Navigation */

.bottom-nav{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    height:70px;

    background:#111;

    display:flex;

    justify-content:space-around;

    align-items:center;

    border-top:1px solid #222;

}



.bottom-nav a{

    color:#777;

    text-decoration:none;

    text-align:center;

    font-size:12px;

}



.bottom-nav i{

    display:block;

    font-size:20px;

    margin-bottom:5px;

}



.active{

    color:var(--yellow)!important;

}



</style>

</head>


<body>


<div class="header">


<a href="home.html" class="back">

<i class="fa-solid fa-arrow-left"></i>

</a>



<div class="logo">

RIDER<span>X</span>

</div>


<div></div>


</div>




<div class="container">


<div class="profile-card">


<div class="profile-section">


<img id="profileImage"

src="https://via.placeholder.com/150"

class="profile-img">



<br>


<label class="change-photo" for="photoInput">

<i class="fa-solid fa-camera"></i>

Change Photo

</label>


<input type="file" id="photoInput" accept="image/*">


</div>





<div class="form-box">


<div class="input-box">

<label>Full Name</label>

<input id="fullName" type="text">

</div>



<div class="input-box">

<label>Email</label>

<input id="email" type="email" readonly>

</div>



<div class="input-box">

<label>Mobile Number</label>

<input id="mobile" type="text">

</div>


<button class="btn" onclick="saveProfile()">

Save Profile

</button>


<button class="btn logout-btn" onclick="logout()">

Logout

</button>


</div>


</div>


</div>
<!-- Firebase SDK -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

<script src="../firebase/firebase-config.js"></script>


<script>

const auth = firebase.auth();

const db = firebase.firestore();

const storage = firebase.storage();


let currentUser = null;

let selectedFile = null;



// Check Login + Load Profile

auth.onAuthStateChanged(async(user)=>{


if(!user){

window.location.href="../auth/login.html";

return;

}


currentUser = user;


document.getElementById("email").value =
user.email || "";



const userDoc =
await db.collection("customers")
.doc(user.uid)
.get();



if(userDoc.exists){


const data = userDoc.data();



document.getElementById("fullName").value =
data.fullName || data.name || "";



document.getElementById("mobile").value =
data.mobileNumber || data.phone || "";



if(data.photoURL){

document.getElementById("profileImage").src =
data.photoURL;

}


}



});





// Select Photo

document.getElementById("photoInput")
.addEventListener("change",(e)=>{


selectedFile = e.target.files[0];



if(selectedFile){


const reader = new FileReader();


reader.onload = function(){

document.getElementById("profileImage").src =
reader.result;


};


reader.readAsDataURL(selectedFile);


}



});






// Save Profile

async function saveProfile(){


try{


let photoURL = "";



if(selectedFile){


const storageRef =
storage.ref(
"customers/profile/" + currentUser.uid
);



await storageRef.put(selectedFile);



photoURL =
await storageRef.getDownloadURL();


}




const updateData = {


fullName:
document.getElementById("fullName").value.trim(),


mobileNumber:
document.getElementById("mobile").value.trim()


};



if(photoURL){

updateData.photoURL = photoURL;

}



await db.collection("customers")
.doc(currentUser.uid)
.set(
updateData,
{
merge:true
}
);



alert("Profile Updated Successfully");


}



catch(error){

alert(error.message);

}


}





// Logout

async function logout(){


await auth.signOut();


window.location.href="../auth/login.html";


}


</script>




<!-- Bottom Navigation -->

<div class="bottom-nav">


<a href="home.html">

<i class="fa-solid fa-house"></i>

Home

</a>



<a href="booking.html">

<i class="fa-solid fa-motorcycle"></i>

Booking

</a>



<a href="history.html">

<i class="fa-solid fa-clock"></i>

History

</a>



<a href="wallet.html">

<i class="fa-solid fa-wallet"></i>

Wallet

</a>



<a href="profile.html" class="active">

<i class="fa-solid fa-user"></i>

Profile

</a>



</div>


</body>
</html>
