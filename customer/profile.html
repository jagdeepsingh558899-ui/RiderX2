<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Customer Profile</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

.header{

background:#ffcc00;
color:#000;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;

}


.container{

padding:20px;

}


.profile{

background:#1d1d1d;
padding:25px;
border-radius:15px;
text-align:center;

}


.avatar{

width:90px;
height:90px;
border-radius:50%;
background:#ffcc00;
color:#000;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
margin:auto;

}


.info{

margin-top:20px;
text-align:left;

}


.info p{

background:#222;
padding:12px;
border-radius:10px;

}


button{

width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:10px;
background:#ffcc00;
font-weight:bold;
font-size:16px;

}


.back{

display:block;
margin-top:15px;
background:#ffcc00;
color:#000;
padding:12px;
text-align:center;
border-radius:10px;
text-decoration:none;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

👤 Customer Profile

</div>



<div class="container">


<div class="profile">


<div class="avatar">
👤
</div>



<h2 id="name">
Customer
</h2>



<div class="info">


<p>
📧 Email: <span id="email">Loading...</span>
</p>


<p>
📱 Phone: <span id="phone">N/A</span>
</p>


<p>
⭐ RiderX Member
</p>


</div>



<button onclick="logout()">
Logout
</button>



</div>



<a class="back" href="dashboard.html">
⬅ Back Dashboard
</a>



</div>




<script type="module">


import { auth } from "../firebase/config.js";


import {

onAuthStateChanged,
signOut

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";



onAuthStateChanged(auth,(user)=>{


if(user){

document.getElementById("email").innerHTML=user.email;

}

else{

document.getElementById("email").innerHTML="Guest";

}


});



window.logout=function(){


signOut(auth).then(()=>{


window.location.href="../index.html";


});


}



</script>


</body>

</html>
