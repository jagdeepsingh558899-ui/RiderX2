<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Customer Profile</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

:root{

--yellow:#FFE500;
--black:#050505;
--card:#121212;
--gray:#999;
--danger:#ff3030;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

background:var(--black);
color:white;
padding-bottom:80px;

}





.header{

height:70px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

background:#111;

border-bottom:1px solid #222;

}




.logo{

font-size:30px;
font-weight:900;

}



.logo span{

color:var(--yellow);

}



.back{

color:var(--yellow);
font-size:22px;

}





.container{

padding:20px;

}





.profile-card{

background:linear-gradient(145deg,#171717,#0d0d0d);

border-radius:25px;

padding:25px;

border:1px solid rgba(255,229,0,.3);

}





.profile-section{

text-align:center;

}





.profile-img{

width:120px;

height:120px;

border-radius:50%;

object-fit:cover;

border:4px solid var(--yellow);

}




.change-photo{

display:inline-block;

margin-top:15px;

background:var(--yellow);

color:#000;

padding:10px 20px;

border-radius:12px;

font-weight:bold;

}





#photoInput{

display:none;

}





.input-box{

margin-top:18px;

}



.input-box label{

display:block;

color:var(--gray);

margin-bottom:8px;

font-size:14px;

}



.input-box input,
.input-box select{


width:100%;

padding:14px;

background:#222;

border:none;

outline:none;

border-radius:12px;

color:white;

font-size:15px;

}




.btn{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:14px;

font-size:16px;

font-weight:bold;

background:var(--yellow);

color:#000;

}





.setting-btn{

background:#1c1c1c;

color:white;

border:1px solid #333;

}




.logout{

background:var(--danger);

color:white;

}





.bottom-nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:70px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

border-top:1px solid #222;

}





.bottom-nav a{

text-decoration:none;

color:#777;

font-size:12px;

text-align:center;

}



.bottom-nav i{

display:block;

font-size:20px;

margin-bottom:5px;

}



.active{

color:var(--yellow)!important;

}



</style>

</head>


<body>


<header class="header">


<a href="home.html" class="back">

<i class="fa-solid fa-arrow-left"></i>

</a>



<div class="logo">

RID<span>ERX</span>

</div>



<div></div>


</header>





<div class="container">


<div class="profile-card">



<div class="profile-section">


<img id="profileImage"

src="../assets/Logo/RiderX-logo.png"

class="profile-img">



<br>



<label for="photoInput" class="change-photo">

<i class="fa-solid fa-camera"></i>

Change Photo

</label>



<input type="file"

id="photoInput"

accept="image/*">


</div>





<div class="input-box">

<label>Name</label>

<input id="name"
placeholder="Enter Name">

</div>




<div class="input-box">

<label>Email</label>

<input id="email"
readonly>

</div>





<div class="input-box">

<label>Mobile Number</label>

<input id="phone"
placeholder="Mobile Number">

</div>





<div class="input-box">

<label>Address</label>

<input id="address"
placeholder="Address">

</div>





<button class="btn"

onclick="saveProfile()">

<i class="fa-solid fa-floppy-disk"></i>

Save Profile

</button>





<button class="btn setting-btn"

onclick="openSettings()">

<i class="fa-solid fa-gear"></i>

Settings

</button>





<button class="btn logout"

onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>



</div>


</div>
<script type="module">

import {

auth,
db,
storage

}

from "../firebase/firebase-config.js";


import {

onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {

doc,
getDoc,
setDoc

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


import {

ref,
uploadBytes,
getDownloadURL

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";




let currentUser=null;

let selectedPhoto=null;





// ===============================
// LOAD PROFILE
// ===============================


onAuthStateChanged(auth,async(user)=>{


if(!user){

location.href="../auth/login.html";

return;

}



currentUser=user;



email.value=user.email || "";



const snap =
await getDoc(
doc(db,"users",user.uid)
);



if(snap.exists()){


let data=snap.data();



name.value=data.name || "";

phone.value=data.phone || "";

address.value=data.address || "";



if(data.photoURL){

profileImage.src=data.photoURL;

}



}



});







// ===============================
// PHOTO SELECT
// ===============================


photoInput.addEventListener("change",(e)=>{


selectedPhoto=e.target.files[0];



if(selectedPhoto){


let reader=new FileReader();



reader.onload=()=>{


profileImage.src=reader.result;


};



reader.readAsDataURL(selectedPhoto);


}



});







// ===============================
// SAVE PROFILE
// ===============================


window.saveProfile=async()=>{


try{


let photoURL="";



if(selectedPhoto){


const imageRef =
ref(
storage,
"users/profile/"+currentUser.uid
);



await uploadBytes(
imageRef,
selectedPhoto
);



photoURL =
await getDownloadURL(imageRef);


}




let updateData={


name:name.value.trim(),

phone:phone.value.trim(),

address:address.value.trim(),

updatedAt:new Date()


};





if(photoURL){

updateData.photoURL=photoURL;

}





await setDoc(

doc(
db,
"users",
currentUser.uid
),

updateData,

{
merge:true
}

);



alert(
"Profile Updated Successfully"
);



}


catch(error){

alert(error.message);

}


};









// ===============================
// SETTINGS
// ===============================


window.openSettings=()=>{


location.href="settings.html";


};








// ===============================
// LOGOUT
// ===============================


window.logout=async()=>{


await signOut(auth);


location.href="../auth/login.html";


};





</script>





<!-- Bottom Navigation -->


<nav class="bottom-nav">


<a href="home.html">

<i class="fa-solid fa-house"></i>

Home

</a>



<a href="booking.html">

<i class="fa-solid fa-motorcycle"></i>

Book

</a>



<a href="history.html">

<i class="fa-solid fa-clock"></i>

History

</a>




<a href="wallet.html">

<i class="fa-solid fa-wallet"></i>

Wallet

</a>




<a href="profile.html" class="active">

<i class="fa-solid fa-user"></i>

Profile

</a>



</nav>



</body>

</html>
