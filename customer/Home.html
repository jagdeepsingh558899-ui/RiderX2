<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Customer</title>


<link rel="stylesheet" href="../css/style.css">



<style>


body{

margin:0;

background:#000;

color:white;

font-family:Arial,sans-serif;

padding-bottom:80px;

}



.header{


background:#111;

padding:20px;

border-bottom-left-radius:25px;

border-bottom-right-radius:25px;


}



.logo{

width:55px;

}



.brand{

color:#FFD600;

font-size:28px;

font-weight:900;

}



.welcome{

margin-top:15px;

}



.container{

padding:20px;

}



.card{

background:#111;

border-radius:20px;

padding:20px;

margin-bottom:20px;

box-shadow:0 0 15px #222;

}



.services{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}



.service{

background:#222;

padding:20px;

border-radius:18px;

text-align:center;

font-size:18px;

cursor:pointer;

}



.service:hover{

background:#FFD600;

color:#000;

}



.book{

background:#FFD600;

color:#000;

padding:16px;

border-radius:15px;

text-align:center;

font-weight:bold;

font-size:18px;

}



.map{

height:250px;

background:#222;

border-radius:20px;

display:flex;

align-items:center;

justify-content:center;

color:#aaa;

}




.bottom{


position:fixed;

bottom:0;

left:0;

width:100%;

height:70px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;


}



.bottom div{

text-align:center;

color:#fff;

font-size:13px;

}



.active{

color:#FFD600!important;

}



</style>


</head>


<body>



<div class="header">


<img src="../assets/logo.svg" class="logo">


<span class="brand">

RiderX

</span>



<div class="welcome">

Welcome Customer 👋

</div>


</div>




<div class="container">



<div class="card">


<h3>
Book Your Ride
</h3>



<div class="services">


<div class="service">

🏍

<br>

Bike Taxi

</div>



<div class="service">

🚕 

<br>

Cab

</div>



<div class="service">

📦

<br>

Parcel

</div>



<div class="service">

🍔

<br>

Food

</div>


</div>


</div>






<div class="card">


<h3>
Live Location
</h3>



<div class="map">

Map Loading...

</div>


</div>







<div class="book"
onclick="location.href='booking.html'">

Book Ride Now

</div>





</div>






<div class="bottom">


<div class="active">

🏠

<br>

Home

</div>



<div onclick="location.href='history.html'">

📜

<br>

History

</div>



<div onclick="location.href='wallet.html'">

💰

<br>

Wallet

</div>



<div onclick="location.href='profile.html'">

👤

<br>

Profile

</div>



</div>





</body>

</html>
