<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX Chat</title>


<link rel="stylesheet" href="../css/style.css">


<style>

.chat-container{

height:75vh;

overflow-y:auto;

padding:15px;

}


.chat-input{

position:fixed;

bottom:0;

left:0;

width:100%;

background:#111;

padding:12px;

display:flex;

gap:10px;

}


.chat-input input{

flex:1;

height:50px;

background:#222;

color:white;

border-radius:15px;

padding:10px;

}


.chat-input button{

width:80px;

background:#FFD600;

border-radius:15px;

font-weight:bold;

}



.my-message{

background:#FFD600;

color:#111;

padding:12px;

border-radius:15px;

margin:10px;

margin-left:60px;

}


.other-message{

background:#222;

color:white;

padding:12px;

border-radius:15px;

margin:10px;

margin-right:60px;

}



</style>


</head>



<body>



<div class="topbar">

<h2>
💬 RiderX Chat
</h2>

</div>





<div id="chatBox" class="chat-container">


</div>





<div class="chat-input">


<input

id="messageInput"

placeholder="Type message..."

>



<button id="sendBtn">

Send

</button>



</div>





<script type="module" src="../js/Chat.js"></script>


</body>


</html>
