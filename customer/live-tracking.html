<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Live Tracking</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{

margin:0;
background:#000;
color:white;
font-family:Arial;

}


.header{

padding:20px;
text-align:center;
background:#111;
border-bottom:2px solid #FFD600;
font-size:22px;
font-weight:bold;

}


#map{

height:85vh;
width:100%;

}


</style>


</head>


<body>



<div class="header">

🏍 Rider Coming...

</div>



<div id="map"></div>




<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module">


import { db } from "../firebase/config.js";


import {

doc,
getDoc,
onSnapshot

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId =
localStorage.getItem("rideId");



let map =
L.map("map").setView(

[30.7333,76.7794],

13

);




L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);






let riderMarker=null;






async function trackRider(){



const rideSnap =
await getDoc(

doc(db,"rides",rideId)

);



if(!rideSnap.exists()){

return;

}



let ride =
rideSnap.data();



let riderId =
ride.riderId;




if(!riderId){

return;

}






onSnapshot(

doc(db,"riderLocations",riderId),

(location)=>{


if(!location.exists()){

return;

}




let data =
location.data();



let lat =
data.lat;


let lng =
data.lng;





if(riderMarker){


riderMarker.setLatLng(

[lat,lng]

);


}

else{


riderMarker = L.marker(

[lat,lng]

)

.addTo(map)

.bindPopup(

"🏍 Your Rider"

)

.openPopup();



}




map.setView(

[lat,lng],

15

);



}

);



}





trackRider();



</script>



</body>

</html>
