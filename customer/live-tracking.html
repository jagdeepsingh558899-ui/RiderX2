<!DOCTYPE html>
<html lang="en">
  
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Live Tracking</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{

margin:0;
background:#000;
color:white;
font-family:Arial;

}


.header{

padding:20px;
text-align:center;
background:#111;
border-bottom:2px solid #FFD600;
font-size:22px;
font-weight:bold;

}


.info{

padding:15px;
background:#111;
line-height:1.6;

}


#map{

height:75vh;
width:100%;

}

</style>

</head>


<body>


<div class="header">

🏍 Rider Coming...

</div>


<div class="info" id="status">

Searching Rider...

</div>


<div id="map"></div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc,
onSnapshot

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let rideId =
localStorage.getItem("rideId");


let map =
L.map("map").setView(

[30.7333,76.7794],

13

);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);




let riderMarker=null;

let pickupMarker=null;

let dropMarker=null;

let route=null;


let pickup=null;





function distanceKm(lat1,lon1,lat2,lon2){


let R=6371;


let dLat=(lat2-lat1)*Math.PI/180;

let dLon=(lon2-lon1)*Math.PI/180;


let a=

Math.sin(dLat/2)*Math.sin(dLat/2)+

Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*

Math.sin(dLon/2)*Math.sin(dLon/2);



let c=

2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));


return (R*c).toFixed(2);


}





async function loadRide(){



let snap=

await getDoc(

doc(db,"rides",rideId)

);



if(!snap.exists()) return;



let data=snap.data();



pickup=data.pickupCoords;

let drop=data.dropCoords;



document.getElementById("status").innerHTML=

`

Status: ${data.status}

<br>

Service: ${data.service}

<br>

Distance: Waiting...

<br>

ETA: Waiting...

`;




if(pickup){


pickupMarker=L.marker(

[pickup.lat,pickup.lng]

)

.addTo(map)

.bindPopup("📍 Pickup");


}



if(drop){


dropMarker=L.marker(

[drop.lat,drop.lng]

)

.addTo(map)

.bindPopup("🏁 Drop");



route=L.polyline(

[

[pickup.lat,pickup.lng],

[drop.lat,drop.lng]

]

)

.addTo(map);



map.fitBounds(

route.getBounds()

);



}





if(data.riderId){

trackRider(data.riderId);

}


}







function trackRider(riderId){



onSnapshot(

doc(db,"riderLocations",riderId),

(snap)=>{


if(!snap.exists()) return;



let data=snap.data();



if(riderMarker){


riderMarker.setLatLng(

[data.lat,data.lng]

);


}

else{


riderMarker=L.marker(

[data.lat,data.lng]

)

.addTo(map)

.bindPopup(

"🏍 Rider"

)

.openPopup();


}





if(pickup){


let km=

distanceKm(

data.lat,

data.lng,

pickup.lat,

pickup.lng

);



let eta=

Math.ceil(

km/0.5

);



document.getElementById("status").innerHTML=

`

Status: Rider Coming 🏍

<br>

Distance: ${km} KM

<br>

ETA: ${eta} Minutes

`;



}



map.panTo(

[data.lat,data.lng]

);



}

);



}






onSnapshot(

doc(db,"rides",rideId),

(snap)=>{


if(snap.exists()){


let data=snap.data();


if(data.riderId){


trackRider(data.riderId);


}


}



});





loadRide();



</script>


</body>

</html>
