<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Live Tracking</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{

margin:0;
background:#000;
color:white;
font-family:Arial;

}


.header{

padding:20px;
text-align:center;
background:#111;
border-bottom:2px solid #FFD600;
font-size:22px;
font-weight:bold;

}


.info{

padding:12px;
background:#111;

}


#map{

height:80vh;
width:100%;

}

</style>

</head>


<body>



<div class="header">

🏍 Rider Coming...

</div>


<div class="info" id="status">

Searching Rider...

</div>



<div id="map"></div>




<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc,
onSnapshot

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId =
localStorage.getItem("rideId");



let map =
L.map("map").setView(

[30.7333,76.7794],

13

);



L.tileLayer(

"https://tile.openstreetmap.org/{x}/{y}.png",

{

maxZoom:19

}

).addTo(map);





let riderMarker=null;

let pickupMarker=null;

let dropMarker=null;

let route=null;






async function loadRide(){



let snap = await getDoc(

doc(db,"rides",rideId)

);



if(!snap.exists()) return;



let data=snap.data();




document.getElementById("status").innerHTML=

`

Status: ${data.status}

<br>

Service: ${data.service}

`;





let pickup=data.pickupCoords;

let drop=data.dropCoords;




if(pickup){


pickupMarker=L.marker(

[pickup.lat,pickup.lng]

)

.addTo(map)

.bindPopup(

"📍 Pickup"

);


}



if(drop){


dropMarker=L.marker(

[drop.lat,drop.lng]

)

.addTo(map)

.bindPopup(

"🏁 Drop"

);



route=L.polyline(

[

[pickup.lat,pickup.lng],

[drop.lat,drop.lng]

]

)

.addTo(map);



map.fitBounds(

route.getBounds()

);



}





if(data.riderId){


trackRider(data.riderId);


}



}








function trackRider(riderId){



onSnapshot(

doc(db,"riderLocations",riderId),

(snap)=>{



if(!snap.exists()) return;




let data=snap.data();





if(riderMarker){



riderMarker.setLatLng(

[data.lat,data.lng]

);



}

else{


riderMarker=L.marker(

[data.lat,data.lng]

)

.addTo(map)

.bindPopup(

"🏍 Your Rider"

)

.openPopup();



}





map.panTo(

[data.lat,data.lng]

);



}

);



}







onSnapshot(

doc(db,"rides",rideId),

(snap)=>{


if(snap.exists()){


let data=snap.data();


document.getElementById("status").innerHTML=

`

Status: ${data.status}

<br>

Service: ${data.service}

`;



if(data.riderId){


trackRider(data.riderId);


}


}



});




loadRide();



</script>


</body>

</html>
