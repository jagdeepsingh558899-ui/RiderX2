<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Live Tracking</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet" href="../css/style.css">


<style>

#map{

height:80vh;
width:100%;

}

</style>


</head>


<body>


<div class="header">

🏍 Live Rider Tracking

</div>


<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId=

localStorage.getItem("rideId");



let map=L.map("map").setView(

[26.9,75.8],

13

);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png"

).addTo(map);




let riderMarker;






async function trackRider(){



let ride=await getDoc(

doc(db,"rides",rideId)

);



if(!ride.exists()) return;



let riderId=

ride.data().riderId;



onSnapshot(

doc(db,"users",riderId),

(snapshot)=>{


let data=snapshot.data();



if(data.lat && data.lng){



if(!riderMarker){


riderMarker=L.marker(

[

data.lat,

data.lng

]

).addTo(map);



riderMarker.bindPopup(

"🏍 Rider"

);



}

else{


riderMarker.setLatLng(

[

data.lat,

data.lng

]

);


}



map.setView(

[

data.lat,

data.lng

],

15

);



}



}

);



}



trackRider();



</script>


</body>

</html>
