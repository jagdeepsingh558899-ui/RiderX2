<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Payment</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.box{

background:#111;
padding:25px;
border-radius:20px;
border:2px solid #FFD600;

}


select,button{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;

}


button{

background:#FFD600;
font-weight:bold;

}


.amount{

font-size:30px;
color:#FFD600;

}


</style>


</head>


<body>



<div class="header">

💳 Payment

</div>




<div class="container">


<div class="box">



<h2>

RiderX Payment

</h2>



<h3>

Total Fare

</h3>



<div class="amount">

₹<span id="fare">0</span>

</div>




<select id="method">


<option value="Cash">

💵 Cash

</option>


<option value="Online">

📱 Online

</option>


</select>




<button id="payBtn">

Confirm Payment

</button>




<p id="msg"></p>



</div>


</div>






<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc,
updateDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId=

localStorage.getItem("rideId");





async function loadFare(){



let snap=

await getDoc(

doc(db,"rides",rideId)

);



if(snap.exists()){


document.getElementById("fare").innerHTML=

snap.data().fare || 0;


}



}




document.getElementById("payBtn").onclick=

async()=>{



let method=

document.getElementById("method").value;





await updateDoc(

doc(db,"rides",rideId),

{


paymentMethod:method,


paymentStatus:"Paid",


paidAt:serverTimestamp()


}

);





document.getElementById("msg").innerHTML=

"Payment Successful ✅";





setTimeout(()=>{


location.href="receipt.html";


},1500);



};





loadFare();



</script>



</body>

</html>
