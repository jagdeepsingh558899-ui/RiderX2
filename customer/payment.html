<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Payment</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.box{

background:#1d1d1d;
padding:20px;
border-radius:15px;

}

button{

width:100%;
padding:14px;
margin-top:15px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

💳 Payment

</div>



<div class="container">


<div class="box">


<h2 id="amount">

Payment

</h2>



<select id="method">

<option value="Cash">
💵 Cash
</option>


<option value="Online">
📱 Online
</option>

</select>



<button onclick="pay()">

Confirm Payment

</button>



<p id="msg"></p>


</div>


</div>




<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId=

localStorage.getItem("rideId");






window.pay=async function(){



let method=

document.getElementById("method").value;



await updateDoc(

doc(db,"rides",rideId),

{


paymentMethod:method,


paymentStatus:"Paid"


}

);



document.getElementById("msg").innerHTML=

"Payment Successful ✅";



}



</script>


</body>

</html>
