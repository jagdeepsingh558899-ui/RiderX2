<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Payment</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.box{

background:#1d1d1d;
padding:25px;
border-radius:15px;
text-align:center;

}


button{

width:100%;
padding:15px;
margin-top:15px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

💳 Payment

</div>



<div class="container">


<div class="box">


<h2 id="amount">

Amount

</h2>



<button onclick="pay('Cash')">

💵 Cash Payment

</button>



<button onclick="pay('Online')">

📱 Online Payment

</button>



<p id="msg"></p>


</div>


</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
updateDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let rideId=

localStorage.getItem("rideId");







window.pay=async function(method){



await updateDoc(

doc(db,"rides",rideId),

{

payment:method,

paymentStatus:"Paid"

}

);



document.getElementById("msg").innerHTML=

"Payment Successful ✅";


}



</script>


</body>

</html>
