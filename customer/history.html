<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride History</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#000;
color:#fff;
padding-bottom:80px;

}




.header{

height:65px;
background:#111;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 20px;

}



.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#FFD600;

}




.container{

padding:20px;

}




.title{

font-size:22px;
font-weight:bold;
margin-bottom:20px;

}





.filter{

display:flex;
gap:10px;
overflow-x:auto;
margin-bottom:20px;

}



.filter button{

padding:10px 18px;

border-radius:20px;

border:1px solid #444;

background:#111;

color:#fff;

}



.filter button.active{

background:#FFD600;
color:#000;

}





.ride-card{

background:#111;

border-radius:20px;

padding:18px;

margin-bottom:15px;

border:1px solid #333;

}





.ride-top{

display:flex;

justify-content:space-between;

margin-bottom:15px;

}




.status{

padding:6px 12px;

border-radius:20px;

font-size:12px;

font-weight:bold;

}



.REQUESTED{

background:#ff9f0a;
color:#000;

}



.ACCEPTED{

background:#2196f3;
color:#fff;

}



.COMPLETED{

background:#00c853;
color:#000;

}



.CANCELLED{

background:#ff3b30;
color:#fff;

}





.route{

background:#000;

padding:15px;

border-radius:15px;

}




.location{

margin:10px 0;

}




.location i{

color:#FFD600;

margin-right:8px;

}





.info{

display:flex;

justify-content:space-between;

margin-top:15px;

padding-top:15px;

border-top:1px solid #333;

}




.fare{

font-size:22px;

font-weight:bold;

color:#FFD600;

}




.empty{

text-align:center;

padding:50px 20px;

color:#888;

}




.empty i{

font-size:50px;

color:#FFD600;

margin-bottom:15px;

}





.bottom{

position:fixed;

bottom:0;

left:0;

width:100%;


background:#111;


display:flex;

justify-content:space-around;

padding:12px 0;


border-top:1px solid #333;


}




.bottom div{

text-align:center;

font-size:12px;

cursor:pointer;

}



.bottom i{

font-size:20px;

margin-bottom:5px;

}




.active-nav{

color:#FFD600;

}



.loader{

text-align:center;

padding:30px;

color:#FFD600;

}



</style>


</head>



<body>



<header class="header">


<div class="logo">

RID<span>ERX</span>

</div>


<i class="fa-solid fa-user"
onclick="location.href='profile.html'">

</i>


</header>




<div class="container">


<div class="title">

My Rides

</div>




<div class="filter">


<button class="active" data-filter="all">

All

</button>


<button data-filter="REQUESTED">

Pending

</button>


<button data-filter="ACCEPTED">

Accepted

</button>


<button data-filter="COMPLETED">

Completed

</button>


<button data-filter="CANCELLED">

Cancelled

</button>


</div>





<div id="loader" class="loader">

Loading Rides...

</div>




<div id="ridesList">


</div>




<div id="empty" class="empty" style="display:none;">


<i class="fa-solid fa-route"></i>


<h3>No Rides Found</h3>


<p>Your booked rides will appear here</p>


</div>



</div>





<nav class="bottom">


<div onclick="location.href='home.html'">

<i class="fa-solid fa-house"></i>

<br>

Home

</div>



<div class="active-nav">

<i class="fa-solid fa-clock"></i>

<br>

History

</div>




<div onclick="location.href='wallet.html'">

<i class="fa-solid fa-wallet"></i>

<br>

Wallet

</div>




<div onclick="location.href='profile.html'">

<i class="fa-solid fa-user"></i>

<br>

Profile

</div>



</nav>
<script type="module">

import {

auth,
db

}

from "../firebase/firebase-config.js";


import {

collection,
query,
where,
getDocs

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


import {

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";





const ridesList =
document.getElementById("ridesList");


const loader =
document.getElementById("loader");


const empty =
document.getElementById("empty");



let allRides=[];






// ===============================
// LOAD RIDES
// ===============================


onAuthStateChanged(auth,(user)=>{


if(user){


loadHistory(user.uid);


}

else{


window.location.href="../auth/login.html";


}


});







async function loadHistory(uid){


try{


const q = query(

collection(db,"rides"),

where(
"customerId",
"==",
uid
)

);



const snap =
await getDocs(q);



allRides=[];



snap.forEach((doc)=>{


let data=doc.data();



allRides.push({


id:doc.id,


...data


});



});





allRides.sort((a,b)=>{


let aTime =
a.createdAt?.seconds || 0;


let bTime =
b.createdAt?.seconds || 0;


return bTime-aTime;


});





renderRides(allRides);




}

catch(error){


console.log(error);


showEmpty();


}



}








// ===============================
// RENDER
// ===============================


function renderRides(data){



loader.style.display="none";


ridesList.innerHTML="";




if(data.length===0){


showEmpty();


return;


}



empty.style.display="none";




data.forEach(ride=>{



let status =
(ride.status || "REQUESTED")
.toUpperCase();




let fare =
ride.fare || 0;




let card = document.createElement("div");



card.className="ride-card";




card.innerHTML=`

<div class="ride-top">


<div>

<b>RiderX Ride</b>

<br>

<small>

${ride.serviceType || "Bike"}

</small>

</div>


<div class="status ${status}">

${status}

</div>


</div>





<div class="route">


<div class="location">

<i class="fa-solid fa-location-dot"></i>

${ride.pickupLocation || "Pickup"}

</div>




<div class="location">

<i class="fa-solid fa-flag-checkered"></i>

${ride.dropLocation || "Drop"}

</div>


</div>





<div class="info">


<div>

Payment

<br>

<b>

${ride.paymentMethod || "Cash"}

</b>

</div>



<div class="fare">

₹${fare}

</div>



</div>



`;



ridesList.appendChild(card);



});



}









function showEmpty(){


loader.style.display="none";


ridesList.innerHTML="";


empty.style.display="block";


}








// ===============================
// FILTER
// ===============================


document
.querySelectorAll(".filter button")
.forEach(btn=>{


btn.onclick=()=>{


document
.querySelectorAll(".filter button")
.forEach(x=>
x.classList.remove("active")
);



btn.classList.add("active");



let filter =
btn.dataset.filter;



if(filter==="all"){


renderRides(allRides);


}

else{


renderRides(

allRides.filter(
ride=>
(ride.status || "")
.toUpperCase()
===filter

)

);


}



};


});



</script>


</body>

</html>
