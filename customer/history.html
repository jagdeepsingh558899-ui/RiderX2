<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>RiderX - Ride History</title>

<meta
    name="theme-color"
    content="#FFD400"
>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<link
    rel="stylesheet"
    href="../css/dashboard.css"
>

<link
    rel="stylesheet"
    href="../css/responsive.css"
>

<style>

:root{
    --yellow:#FFD400;
    --black:#080808;
    --dark:#101010;
    --card:#191919;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:var(--black);
}

body{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.history-app{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    padding-bottom:84px;
    background:#101010;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:50;

    height:66px;

    display:flex;
    align-items:center;
    gap:10px;

    padding:9px 13px;

    background:rgba(10,10,10,.97);

    border-bottom:1px solid #292929;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.back-btn{
    width:40px;
    height:40px;
    min-width:40px;

    border:1px solid #303030;
    border-radius:50%;

    background:#1d1d1d;
    color:#fff;

    font-size:23px;

    cursor:pointer;
}

.back-btn:active{
    transform:scale(.95);
}

.header-title{
    flex:1;
    min-width:0;
}

.header-title h1{
    font-size:14px;
    font-weight:900;
}

.header-title p{
    margin-top:4px;

    color:#666;

    font-size:7px;
}


/* =========================================================
   SUMMARY
========================================================= */

.summary{
    margin:13px;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:8px;
}

.summary-card{
    min-height:72px;

    padding:10px 8px;

    background:var(--card);

    border:1px solid var(--border);
    border-radius:14px;

    text-align:center;
}

.summary-value{
    font-size:14px;
    font-weight:900;

    color:var(--yellow);
}

.summary-label{
    margin-top:6px;

    color:#666;

    font-size:6px;
    text-transform:uppercase;
    font-weight:900;
}


/* =========================================================
   FILTERS
========================================================= */

.filters{
    display:flex;
    gap:7px;

    padding:0 13px 12px;

    overflow-x:auto;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    flex:none;

    height:32px;

    padding:0 12px;

    border:1px solid var(--border);
    border-radius:17px;

    background:var(--card);
    color:#888;

    font-size:7px;
    font-weight:900;

    cursor:pointer;
}

.filter-btn.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#000;
}

.filter-btn:active{
    transform:scale(.97);
}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap{
    margin:0 13px 13px;

    height:40px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:0 11px;

    background:var(--card);

    border:1px solid var(--border);
    border-radius:11px;
}

.search-icon{
    color:#777;
    font-size:13px;
}

.search-input{
    flex:1;
    min-width:0;

    height:38px;

    border:0;
    outline:none;

    background:transparent;
    color:#fff;

    font-size:9px;
}

.search-input::placeholder{
    color:#666;
}


/* =========================================================
   HISTORY
========================================================= */

.section{
    padding:0 13px;
}

.section-title{
    margin-bottom:9px;

    color:#777;

    font-size:7px;
    text-transform:uppercase;
    letter-spacing:.5px;

    font-weight:900;
}

.history-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.ride-card{
    background:var(--card);

    border:1px solid var(--border);
    border-radius:16px;

    overflow:hidden;

    cursor:pointer;
}

.ride-main{
    min-height:78px;

    display:flex;
    align-items:center;
    gap:10px;

    padding:11px;
}

.service-icon{
    width:41px;
    height:41px;
    min-width:41px;

    border-radius:12px;

    background:#232323;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
}

.ride-content{
    flex:1;
    min-width:0;
}

.route{
    font-size:8px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.route-sub{
    margin-top:5px;

    color:#666;

    font-size:6px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.ride-right{
    min-width:55px;
    text-align:right;
}

.fare{
    font-size:10px;
    font-weight:900;
}

.status{
    margin-top:4px;

    font-size:6px;
    font-weight:900;
}

.status.completed{
    color:var(--green);
}

.status.cancelled{
    color:var(--red);
}

.status.pending{
    color:var(--yellow);
}

.status.default{
    color:#888;
}

.ride-extra{
    display:none;
    padding:0 11px 11px;
}

.ride-card.expanded .ride-extra{
    display:block;
}

.extra-inner{
    padding-top:10px;
    border-top:1px solid #2b2b2b;
}

.extra-row{
    display:flex;
    justify-content:space-between;
    gap:15px;

    margin-bottom:7px;
}

.extra-label{
    color:#666;
    font-size:6px;
}

.extra-value{
    max-width:72%;

    color:#ccc;

    font-size:7px;
    text-align:right;

    word-break:break-word;
}

.ride-actions{
    display:flex;
    gap:7px;

    margin-top:9px;
}

.action-btn{
    flex:1;

    height:31px;

    border:1px solid #333;
    border-radius:8px;

    background:#222;
    color:#ccc;

    font-size:7px;
    font-weight:900;

    cursor:pointer;
}

.action-btn.primary{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#000;
}

.action-btn:active{
    transform:scale(.98);
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    padding:42px 20px;

    text-align:center;

    background:var(--card);

    border:1px solid var(--border);
    border-radius:17px;
}

.empty-icon{
    width:60px;
    height:60px;

    margin:0 auto 12px;

    border-radius:50%;

    background:#222;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
}

.empty-title{
    font-size:11px;
    font-weight:900;
}

.empty-text{
    max-width:250px;

    margin:7px auto 0;

    color:#666;

    font-size:7px;
    line-height:1.5;
}

.book-btn{
    margin-top:14px;

    height:36px;

    padding:0 17px;

    border:0;
    border-radius:10px;

    background:var(--yellow);
    color:#000;

    font-size:8px;
    font-weight:900;

    cursor:pointer;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    padding:20px;

    text-align:center;

    color:#666;

    font-size:8px;
}

.spinner{
    width:25px;
    height:25px;

    margin:0 auto 8px;

    border:3px solid #2d2d2d;
    border-top-color:var(--yellow);

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    position:fixed;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:100%;
    max-width:650px;

    height:67px;

    z-index:80;

    display:grid;
    grid-template-columns:repeat(5,1fr);

    background:rgba(13,13,13,.98);

    border-top:1px solid #292929;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.nav-item{
    border:0;

    background:transparent;
    color:#666;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    gap:4px;

    cursor:pointer;
}

.nav-icon{
    font-size:17px;
}

.nav-label{
    font-size:6px;
    font-weight:800;
}

.nav-item.active{
    color:var(--yellow);
}

.nav-book .nav-icon{
    width:42px;
    height:42px;

    margin-top:-20px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--yellow);
    color:#000;

    border:4px solid #101010;

    font-size:18px;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    z-index:5000;

    left:50%;
    bottom:80px;

    transform:translate(-50%,20px);

    width:calc(100% - 30px);
    max-width:500px;

    padding:11px 13px;

    border-radius:11px;

    background:#222;

    border:1px solid #333;

    color:#fff;

    text-align:center;

    font-size:8px;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.error{
    border-color:rgba(239,68,68,.5);
}

.toast.success{
    border-color:rgba(34,197,94,.5);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:390px){

    .summary{
        gap:6px;
    }

    .summary-card{
        min-height:68px;
    }

    .ride-main{
        padding:10px;
    }

}

</style>

<script type="module">

/* =========================================================
   RIDERX CUSTOMER HISTORY
   ---------------------------------------------------------
   Primary source:
       Firebase Realtime Database
       rides/{rideId}

   Secondary source:
       Existing global history integration

   Fallback:
       localStorage

   This file is compatible with the RiderX modular
   firebase-config.js architecture.
========================================================= */

import {
    realtimeDb,
    ref,
    get,
    onValue,
    off
} from "../firebase/firebase-config.js";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let allRides = [];

let activeFilter = "all";

let toastTimer = null;

let historyRef = null;

let historyListener = null;

let firebaseListenerStarted = false;

let authListenerStarted = false;


/* =========================================================
   DOM
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   USER ID HELPERS
========================================================= */

function getCurrentUser(){

    /*
       1. Firebase Auth user if available
       2. RiderX local user objects
    */

    try{

        if(
            window.firebase &&
            window.firebase.auth
        ){

            const user =
                window.firebase
                    .auth()
                    .currentUser;

            if(user){

                return user;

            }

        }

    }catch(error){

        console.warn(
            "RiderX legacy auth lookup failed:",
            error
        );

    }


    const keys = [
        "riderx_user",
        "riderx_customer",
        "currentUser",
        "user"
    ];


    for(
        const key of keys
    ){

        try{

            const raw =
                localStorage.getItem(key);


            if(!raw){

                continue;

            }


            const parsed =
                JSON.parse(raw);


            if(
                parsed &&
                typeof parsed === "object"
            ){

                return parsed;

            }

        }catch(error){

            continue;

        }

    }


    return null;

}


/* =========================================================
   USER ID
========================================================= */

function getUserId(){

    const user =
        currentUser ||
        getCurrentUser();


    if(!user){

        return "";

    }


    return String(
        user.uid ||
        user.id ||
        user.userId ||
        user.customerId ||
        ""
    );

}


/* =========================================================
   CUSTOMER MATCH
========================================================= */

function rideBelongsToCustomer(
    ride
){

    if(!ride || typeof ride !== "object"){

        return false;

    }


    const uid =
        getUserId();


    /*
       If no authenticated/local customer is known,
       don't expose another customer's Firebase rides.
    */

    if(!uid){

        return false;

    }


    const candidateIds = [

        ride.customerId,
        ride.customerID,
        ride.customerUid,
        ride.customerUID,
        ride.userId,
        ride.userID,
        ride.uid,
        ride.userUid,
        ride.userUID,
        ride.createdBy,
        ride.bookedBy,

        ride.customer?.uid,
        ride.customer?.id,
        ride.customer?.userId,

        ride.user?.uid,
        ride.user?.id,
        ride.user?.userId

    ];


    return candidateIds.some(
        value =>
            value !== null &&
            value !== undefined &&
            String(value) === uid
    );

}


/* =========================================================
   LOAD LOCAL HISTORY
========================================================= */

function loadLocalHistory(){

    const keys = [

        "riderxRideHistory",
        "rideHistory",
        "customerRideHistory"

    ];


    const collected = [];


    for(
        const key of keys
    ){

        try{

            const raw =
                localStorage.getItem(key);


            if(!raw){

                continue;

            }


            const data =
                JSON.parse(raw);


            if(Array.isArray(data)){

                collected.push(
                    ...data
                );

            }

        }catch(error){

            console.warn(
                "RiderX local history read failed:",
                key,
                error
            );

        }

    }


    /*
       Also include current/active ride if it has
       already been completed/cancelled and isn't
       present in the history array.
    */

    const currentKeys = [

        "currentRide",
        "activeRide",
        "riderxCurrentRide",
        "rideData",
        "lastRide"

    ];


    for(
        const key of currentKeys
    ){

        try{

            const raw =
                localStorage.getItem(key);


            if(!raw){

                continue;

            }


            const ride =
                JSON.parse(raw);


            if(
                ride &&
                typeof ride === "object"
            ){

                const status =
                    normalizeStatus(
                        ride.status ||
                        ride.rideStatus
                    );


                if(
                    [
                        "completed",
                        "cancelled"
                    ].includes(status)
                ){

                    collected.push(
                        ride
                    );

                }

            }

        }catch(error){

            continue;

        }

    }


    return deduplicateRides(
        collected
    );

}


/* =========================================================
   EXISTING APP INTEGRATION
========================================================= */

async function loadExistingHistory(){

    if(
        typeof window.getCustomerRideHistory !==
        "function"
    ){

        return null;

    }


    try{

        const result =
            await window.getCustomerRideHistory(
                currentUser
            );


        if(
            Array.isArray(result)
        ){

            return result;

        }

    }catch(error){

        console.warn(
            "RiderX existing history integration failed:",
            error
        );

    }


    return null;

}


/* =========================================================
   FIREBASE RTDB HISTORY
========================================================= */

async function loadRealtimeHistory(){

    if(!realtimeDb){

        return [];

    }


    const uid =
        getUserId();


    if(!uid){

        return [];

    }


    try{

        const ridesReference =
            ref(
                realtimeDb,
                "rides"
            );


        const snapshot =
            await get(
                ridesReference
            );


        if(
            !snapshot.exists()
        ){

            return [];

        }


        const data =
            snapshot.val() || {};


        const rides = [];


        Object.entries(
            data
        ).forEach(
            (
                [
                    key,
                    value
                ]
            ) => {

                if(
                    !value ||
                    typeof value !== "object"
                ){

                    return;

                }


                const ride = {

                    ...value,

                    id:
                        value.id ||
                        value.rideId ||
                        key,

                    rideId:
                        value.rideId ||
                        value.id ||
                        key

                };


                if(
                    rideBelongsToCustomer(
                        ride
                    )
                ){

                    rides.push(
                        ride
                    );

                }

            }
        );


        return rides;

    }catch(error){

        console.error(
            "RiderX RTDB history failed:",
            error
        );


        return [];

    }

}


/* =========================================================
   LIVE RTDB LISTENER
========================================================= */

function startRealtimeListener(){

    stopRealtimeListener();


    const uid =
        getUserId();


    if(
        !realtimeDb ||
        !uid
    ){

        return;

    }


    historyRef =
        ref(
            realtimeDb,
            "rides"
        );


    historyListener =
        onValue(
            historyRef,
            snapshot => {

                if(
                    !snapshot.exists()
                ){

                    return;

                }


                const data =
                    snapshot.val() || {};


                const realtimeRides = [];


                Object.entries(
                    data
                ).forEach(
                    (
                        [
                            key,
                            value
                        ]
                    ) => {

                        if(
                            !value ||
                            typeof value !== "object"
                        ){

                            return;

                        }


                        const ride = {

                            ...value,

                            id:
                                value.id ||
                                value.rideId ||
                                key,

                            rideId:
                                value.rideId ||
                                value.id ||
                                key

                        };


                        if(
                            rideBelongsToCustomer(
                                ride
                            )
                        ){

                            realtimeRides.push(
                                ride
                            );

                        }

                    }
                );


                /*
                   Keep local/app-integrated rides as well.
                */

                allRides =
                    deduplicateRides(
                        [
                            ...realtimeRides,
                            ...allRides
                        ]
                    );


                sortRides();

                updateSummary(
                    allRides
                );

                renderHistory();

            },
            error => {

                console.warn(
                    "RiderX RTDB history listener error:",
                    error
                );

            }
        );


    firebaseListenerStarted =
        true;

}


/* =========================================================
   STOP RTDB LISTENER
========================================================= */

function stopRealtimeListener(){

    if(
        historyRef &&
        historyListener
    ){

        try{

            off(
                historyRef,
                "value",
                historyListener
            );

        }catch(error){

            console.warn(
                "RiderX history listener cleanup failed:",
                error
            );

        }

    }


    historyRef =
        null;

    historyListener =
        null;

    firebaseListenerStarted =
        false;

}


/* =========================================================
   LOAD HISTORY
========================================================= */

async function loadHistory(){

    showLoading();


    currentUser =
        getCurrentUser();


    const localRides =
        loadLocalHistory();


    let integrationRides =
        await loadExistingHistory();


    if(
        !Array.isArray(
            integrationRides
        )
    ){

        integrationRides =
            [];

    }


    const firebaseRides =
        await loadRealtimeHistory();


    /*
       Firebase is authoritative when available.
       Local and existing integration data are merged
       so older RiderX rides are not lost.
    */

    allRides =
        deduplicateRides(
            [
                ...firebaseRides,
                ...integrationRides,
                ...localRides
            ]
        );


    sortRides();


    updateSummary(
        allRides
    );


    renderHistory();


    startRealtimeListener();

}


/* =========================================================
   SORT
========================================================= */

function sortRides(){

    allRides.sort(
        (
            a,
            b
        ) =>
            getTimestamp(
                b.updatedAt ||
                b.createdAt ||
                b.timestamp ||
                b.date
            ) -
            getTimestamp(
                a.updatedAt ||
                a.createdAt ||
                a.timestamp ||
                a.date
            )
    );

}


/* =========================================================
   DEDUPLICATE
========================================================= */

function deduplicateRides(
    rides
){

    const map =
        new Map();


    rides.forEach(
        ride => {

            if(
                !ride ||
                typeof ride !== "object"
            ){

                return;

            }


            const id =
                String(
                    ride.id ||
                    ride.rideId ||
                    ""
                ).trim();


            if(!id){

                /*
                   Keep unidentified local entries
                   using a generated stable key.
                */

                const fallback =
                    [
                        getPickup(ride),
                        getDrop(ride),
                        getTimestamp(
                            ride.createdAt ||
                            ride.timestamp ||
                            ride.date
                        ),
                        getFare(ride)
                    ].join("|");


                if(!map.has(fallback)){

                    map.set(
                        fallback,
                        ride
                    );

                }

                return;

            }


            const existing =
                map.get(id);


            if(!existing){

                map.set(
                    id,
                    ride
                );

                return;

            }


            /*
               Merge newer/more complete data.
            */

            map.set(
                id,
                {
                    ...existing,
                    ...ride
                }
            );

        }
    );


    return Array.from(
        map.values()
    );

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(
    rides
){

    const total =
        rides.length;


    const completed =
        rides.filter(
            ride =>
                normalizeStatus(
                    ride.status ||
                    ride.rideStatus
                ) ===
                "completed"
        ).length;


    const spent =
        rides.reduce(
            (
                sum,
                ride
            ) => {

                const status =
                    normalizeStatus(
                        ride.status ||
                        ride.rideStatus
                    );


                if(
                    status ===
                    "cancelled"
                ){

                    return sum;

                }


                return (
                    sum +
                    getFare(
                        ride
                    )
                );

            },
            0
        );


    $("totalRides")
        .textContent =
        total;


    $("completedRides")
        .textContent =
        completed;


    $("totalSpent")
        .textContent =
        "₹" +
        Math.round(
            spent
        );

}

/* =========================================================
   RENDER HISTORY
========================================================= */

function renderHistory(){

    const list =
        $("historyList");

    const loading =
        $("loading");

    const empty =
        $("emptyState");


    loading.style.display =
        "none";


    list
        .querySelectorAll(
            ".ride-card"
        )
        .forEach(
            card =>
                card.remove()
        );


    const search =
        $("searchInput")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        allRides.filter(
            ride => {

                const status =
                    normalizeStatus(
                        ride.status ||
                        ride.rideStatus
                    );


                const service =
                    normalizeService(
                        ride.serviceType ||
                        ride.service ||
                        ride.vehicleType
                    );


                let matchesFilter =
                    true;


                if(
                    activeFilter ===
                    "completed"
                ){

                    matchesFilter =
                        status ===
                        "completed";

                }else if(
                    activeFilter ===
                    "cancelled"
                ){

                    matchesFilter =
                        status ===
                        "cancelled";

                }else if(
                    [
                        "bike",
                        "cab",
                        "parcel",
                        "food"
                    ].includes(
                        activeFilter
                    )
                ){

                    matchesFilter =
                        service ===
                        activeFilter;

                }


                if(
                    !matchesFilter
                ){

                    return false;

                }


                if(!search){

                    return true;

                }


                const searchable =
                    [

                        getPickup(ride),

                        getDrop(ride),

                        service,

                        ride.id,
                        ride.rideId,

                        ride.riderName,
                        ride.driverName,

                        ride.vehicleNumber

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                return searchable.includes(
                    search
                );

            }
        );


    if(
        filtered.length ===
        0
    ){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        ride =>
            list.appendChild(
                createRideCard(
                    ride
                )
            )
    );

}

/* =========================================================
   LOCATION HELPERS
========================================================= */

function getLocationValue(
    value,
    fallback
){

    if(
        value &&
        typeof value === "object"
    ){

        return (
            value.address ||
            value.name ||
            value.label ||
            fallback
        );

    }


    if(
        typeof value === "string" &&
        value.trim()
    ){

        return value.trim();

    }


    return fallback;

}


function getPickup(
    ride
){

    return getLocationValue(
        ride.pickup,
        ride.pickupAddress ||
        ride.fromAddress ||
        ride.from ||
        ride.source ||
        "Pickup location"
    );

}


function getDrop(
    ride
){

    return getLocationValue(
        ride.destination ||
        ride.drop,
        ride.destinationAddress ||
        ride.dropAddress ||
        ride.toAddress ||
        ride.to ||
        ride.dropLocation ||
        "Destination"
    );

}


/* =========================================================
   FARE
========================================================= */

function getFare(
    ride
){

    const values = [

        ride.fare,
        ride.totalFare,
        ride.total,
        ride.amount,
        ride.price,
        ride.finalFare

    ];


    for(
        const value of values
    ){

        if(
            value === null ||
            value === undefined ||
            value === ""
        ){

            continue;

        }


        const number =
            Number(
                String(value)
                    .replace(
                        /[^0-9.-]/g,
                        ""
                    )
            );


        if(
            Number.isFinite(number)
        ){

            return number;

        }

    }


    return 0;

}


/* =========================================================
   SERVICE
========================================================= */

function normalizeService(
    service
){

    const value =
        String(
            service ||
            "bike"
        )
        .toLowerCase()
        .trim();


    if(
        value.includes("cab") ||
        value.includes("car") ||
        value.includes("auto")
    ){

        return "cab";

    }


    if(
        value.includes("parcel") ||
        value.includes("delivery")
    ){

        return "parcel";

    }


    if(
        value.includes("food") ||
        value.includes("meal")
    ){

        return "food";

    }


    if(
        value.includes("bike") ||
        value.includes("motor") ||
        value.includes("scooter")
    ){

        return "bike";

    }


    return "bike";

}


/* =========================================================
   STATUS
========================================================= */

function normalizeStatus(
    status
){

    const value =
        String(
            status ||
            "completed"
        )
        .toLowerCase()
        .replace(
            /[-_\s]/g,
            ""
        );


    if(
        value.includes("cancel")
    ){

        return "cancelled";

    }


    if(
        value.includes("complete") ||
        value.includes("finish") ||
        value === "done" ||
        value === "ended"
    ){

        return "completed";

    }


    if(
        value.includes("start") ||
        value.includes("ongoing") ||
        value.includes("inprogress") ||
        value.includes("ontrip")
    ){

        return "started";

    }


    if(
        value.includes("arriv")
    ){

        return "arriving";

    }


    if(
        value.includes("accept") ||
        value.includes("confirm") ||
        value === "assigned"
    ){

        return "accepted";

    }


    if(
        value.includes("search") ||
        value.includes("request") ||
        value.includes("pending")
    ){

        return value.includes("search")
            ? "searching"
            : "pending";

    }


    return value ||
        "completed";

}


/* =========================================================
   STATUS LABEL
========================================================= */

function formatStatus(
    status
){

    const labels = {

        completed:"Completed",
        cancelled:"Cancelled",
        searching:"Searching",
        pending:"Pending",
        accepted:"Accepted",
        arriving:"Arriving",
        started:"In progress"

    };


    return (
        labels[status] ||
        String(
            status || "Ride"
        )
        .replace(
            /[-_]/g,
            " "
        )
        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        )
    );

}


/* =========================================================
   PAYMENT
========================================================= */

function formatPayment(
    value
){

    if(
        value &&
        typeof value === "object"
    ){

        value =
            value.method ||
            value.type ||
            value.name ||
            "Cash";

    }


    const text =
        String(
            value || "Cash"
        );


    const lower =
        text.toLowerCase();


    if(
        lower.includes("cash")
    ){

        return "Cash";

    }


    if(
        lower.includes("wallet")
    ){

        return "RiderX Wallet";

    }


    if(
        lower.includes("upi")
    ){

        return "UPI";

    }


    if(
        lower.includes("online") ||
        lower.includes("card")
    ){

        return "Online";

    }


    return text;

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return 0;

    }


    if(
        typeof value === "number"
    ){

        /*
           Firebase timestamps are normally milliseconds
           in RiderX. Convert seconds if required.
        */

        if(
            value > 0 &&
            value < 10000000000
        ){

            return value * 1000;

        }


        return value;

    }


    if(
        value &&
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        value &&
        typeof value.toDate ===
        "function"
    ){

        return value.toDate().getTime();

    }


    if(
        typeof value === "object"
    ){

        if(
            typeof value.seconds ===
            "number"
        ){

            return (
                value.seconds * 1000 +
                Math.floor(
                    Number(
                        value.nanoseconds || 0
                    ) / 1000000
                )
            );

        }

    }


    const numeric =
        Number(value);


    if(
        Number.isFinite(numeric) &&
        numeric > 0
    ){

        if(
            numeric < 10000000000
        ){

            return numeric * 1000;

        }


        return numeric;

    }


    const parsed =
        new Date(
            value
        ).getTime();


    return Number.isFinite(parsed)
        ? parsed
        : 0;

}


/* =========================================================
   DATE
========================================================= */

function formatDateTime(
    value
){

    const timestamp =
        getTimestamp(
            value
        );


    if(!timestamp){

        return "Date unavailable";

    }


    try{

        return new Date(
            timestamp
        ).toLocaleDateString(
            "en-IN",
            {
                day:"numeric",
                month:"short",
                year:"numeric"
            }
        );

    }catch(error){

        return "Date unavailable";

    }

}


/* =========================================================
   DISTANCE
========================================================= */

function formatDistance(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "—";

    }


    const number =
        Number(
            String(value)
                .replace(
                    /[^0-9.]/g,
                    ""
                )
        );


    if(
        !Number.isFinite(number)
    ){

        return String(value);

    }


    return (
        number.toFixed(
            number < 10
                ? 1
                : 0
        ) +
        " km"
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(
    value
){

    return String(
        value === null ||
        value === undefined
            ? ""
            : value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

/* =========================================================
   AUTH INITIALIZATION
========================================================= */

async function initAuth(){

    /*
       Legacy Firebase Auth compatibility.
       RiderX current Firebase architecture may not expose
       the old global firebase object, so local user data
       remains supported.
    */

    try{

        if(
            window.firebase &&
            window.firebase.auth
        ){

            const auth =
                window.firebase.auth();


            const existingUser =
                auth.currentUser;


            if(existingUser){

                currentUser =
                    existingUser;

                await loadHistory();

                return;

            }


            if(
                typeof auth.onAuthStateChanged ===
                "function"
            ){

                if(!authListenerStarted){

                    authListenerStarted =
                        true;


                    auth.onAuthStateChanged(
                        async user => {

                            currentUser =
                                user ||
                                getCurrentUser();


                            await loadHistory();

                        }
                    );

                    return;

                }

            }

        }

    }catch(error){

        console.warn(
            "RiderX legacy auth initialization failed:",
            error
        );

    }


    currentUser =
        getCurrentUser();


    await loadHistory();

}
