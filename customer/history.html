<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride History</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="header">

📜 Ride History

</div>


<div class="container">


<div id="rideList">

Loading rides...

</div>



<a class="back" href="dashboard.html">

⬅ Back Dashboard

</a>


</div>





<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
getDocs,
query,
orderBy

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function loadHistory(){


let box =
document.getElementById("rideList");



const q=query(

collection(db,"rides"),

orderBy("createdAt","desc")

);



const snapshot =
await getDocs(q);



box.innerHTML="";



snapshot.forEach((ride)=>{


let data=ride.data();



box.innerHTML += `


<div class="ride-card">


<h3>
${data.service || "Ride"}
</h3>


<p>
📍 ${data.pickup}
</p>


<p>
➡️ ${data.drop}
</p>


<p>
💰 ${data.fare}
</p>


<p>
Status: ${data.status}
</p>



${
data.status=="Completed"

?

`<a href="rating.html">

⭐ Rate Rider

</a>`

:

""

}



</div>


`;



});


}



loadHistory();


</script>


</body>

</html>
