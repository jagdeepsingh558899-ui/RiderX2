<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride History</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

.header{
    background:#ffcc00;
    color:#000;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.ride-card{

background:#1d1d1d;
padding:18px;
margin:15px 0;
border-radius:15px;
border:1px solid #333;

}

.ride-card h3{
color:#ffcc00;
}


.back{

display:block;
background:#ffcc00;
color:#000;
padding:12px;
border-radius:10px;
text-align:center;
text-decoration:none;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">
📜 My Rides
</div>



<div class="container">


<div id="rideList">
Loading rides...
</div>



<a class="back" href="dashboard.html">
⬅ Back Dashboard
</a>


</div>




<script type="module">


import { db } from "../firebase/config.js";


import {

collection,
getDocs,
query,
orderBy

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



async function loadHistory(){


let box=document.getElementById("rideList");


try{


const q=query(
collection(db,"rides"),
orderBy("createdAt","desc")
);



const snapshot=await getDocs(q);


box.innerHTML="";



if(snapshot.empty){

box.innerHTML="<p>No rides found</p>";

return;

}



snapshot.forEach((ride)=>{


let data=ride.data();



box.innerHTML += `

<div class="ride-card">


<h3>
${data.service || "Ride"}
</h3>


<p>
📍 ${data.pickup || "N/A"} ➡ ${data.drop || "N/A"}
</p>


<p>
💰 Fare: ${data.fare || "₹0"}
</p>


<p>
Status: ${data.status || "Pending"}
</p>


</div>

`;


});


}

catch(error){

box.innerHTML="Error loading history";
console.log(error);

}


}



loadHistory();


</script>


</body>

</html>
