<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>RiderX - Ride History</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/Style.css">
<link rel="stylesheet" href="../css/Dashboard.css">
<link rel="stylesheet" href="../css/Responsive.css">

<style>

:root{
    --yellow:#FFD400;
    --black:#080808;
    --dark:#101010;
    --card:#191919;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.history-app{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    background:#101010;
    padding-bottom:82px;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:50;
    height:66px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 13px;
    background:rgba(10,10,10,.97);
    border-bottom:1px solid #292929;
    backdrop-filter:blur(12px);
}

.back-btn{
    width:40px;
    height:40px;
    min-width:40px;
    border:0;
    border-radius:50%;
    background:#1d1d1d;
    color:#fff;
    font-size:23px;
    cursor:pointer;
}

.header-title{
    flex:1;
}

.header-title h1{
    font-size:14px;
    font-weight:900;
}

.header-title p{
    margin-top:4px;
    color:#666;
    font-size:7px;
}


/* =========================
   SUMMARY
========================= */

.summary{
    margin:13px;
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:8px;
}

.summary-card{
    min-height:72px;
    padding:10px 8px;
    background:#191919;
    border:1px solid #303030;
    border-radius:14px;
    text-align:center;
}

.summary-value{
    font-size:14px;
    font-weight:900;
    color:var(--yellow);
}

.summary-label{
    margin-top:6px;
    color:#666;
    font-size:6px;
    text-transform:uppercase;
    font-weight:900;
}


/* =========================
   FILTERS
========================= */

.filters{
    display:flex;
    gap:7px;
    padding:0 13px 12px;
    overflow-x:auto;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    flex:none;
    height:32px;
    padding:0 12px;
    border-radius:17px;
    border:1px solid #303030;
    background:#191919;
    color:#888;
    font-size:7px;
    font-weight:900;
    cursor:pointer;
}

.filter-btn.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#000;
}


/* =========================
   SEARCH
========================= */

.search-wrap{
    margin:0 13px 13px;
    height:40px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 11px;
    background:#191919;
    border:1px solid #303030;
    border-radius:11px;
}

.search-icon{
    color:#777;
    font-size:13px;
}

.search-input{
    flex:1;
    min-width:0;
    height:38px;
    border:0;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:9px;
}

.search-input::placeholder{
    color:#666;
}


/* =========================
   HISTORY
========================= */

.section{
    padding:0 13px;
}

.section-title{
    margin-bottom:9px;
    color:#777;
    font-size:7px;
    text-transform:uppercase;
    letter-spacing:.5px;
    font-weight:900;
}

.history-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.ride-card{
    background:#191919;
    border:1px solid #303030;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
}

.ride-main{
    min-height:78px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
}

.service-icon{
    width:41px;
    height:41px;
    min-width:41px;
    border-radius:12px;
    background:#232323;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
}

.ride-content{
    flex:1;
    min-width:0;
}

.route{
    font-size:8px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.route-sub{
    margin-top:5px;
    color:#666;
    font-size:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.ride-right{
    text-align:right;
}

.fare{
    font-size:10px;
    font-weight:900;
}

.status{
    margin-top:4px;
    font-size:6px;
    font-weight:900;
}

.status.completed{
    color:var(--green);
}

.status.cancelled{
    color:var(--red);
}

.status.pending{
    color:var(--yellow);
}

.status.default{
    color:#888;
}

.ride-extra{
    display:none;
    padding:0 11px 11px;
}

.ride-card.expanded .ride-extra{
    display:block;
}

.extra-inner{
    padding-top:10px;
    border-top:1px solid #2b2b2b;
}

.extra-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-bottom:7px;
}

.extra-label{
    color:#666;
    font-size:6px;
}

.extra-value{
    color:#ccc;
    font-size:7px;
    text-align:right;
}

.ride-actions{
    display:flex;
    gap:7px;
    margin-top:9px;
}

.action-btn{
    flex:1;
    height:31px;
    border:1px solid #333;
    border-radius:8px;
    background:#222;
    color:#ccc;
    font-size:7px;
    font-weight:900;
    cursor:pointer;
}

.action-btn.primary{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#000;
}


/* =========================
   EMPTY
========================= */

.empty{
    padding:42px 20px;
    text-align:center;
    background:#191919;
    border:1px solid #303030;
    border-radius:17px;
}

.empty-icon{
    width:60px;
    height:60px;
    margin:0 auto 12px;
    border-radius:50%;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.empty-title{
    font-size:11px;
    font-weight:900;
}

.empty-text{
    max-width:250px;
    margin:7px auto 0;
    color:#666;
    font-size:7px;
    line-height:1.5;
}

.book-btn{
    margin-top:14px;
    height:36px;
    padding:0 17px;
    border:0;
    border-radius:10px;
    background:var(--yellow);
    color:#000;
    font-size:8px;
    font-weight:900;
    cursor:pointer;
}


/* =========================
   LOADING
========================= */

.loading{
    padding:20px;
    text-align:center;
    color:#666;
    font-size:8px;
}

.spinner{
    width:25px;
    height:25px;
    margin:0 auto 8px;
    border:3px solid #2d2d2d;
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:650px;
    height:67px;
    z-index:80;
    display:grid;
    grid-template-columns:
        repeat(5,1fr);
    background:rgba(13,13,13,.98);
    border-top:1px solid #292929;
    backdrop-filter:blur(12px);
}

.nav-item{
    border:0;
    background:transparent;
    color:#666;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:4px;
    cursor:pointer;
}

.nav-icon{
    font-size:17px;
}

.nav-label{
    font-size:6px;
    font-weight:800;
}

.nav-item.active{
    color:var(--yellow);
}

.nav-book .nav-icon{
    width:42px;
    height:42px;
    margin-top:-20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--yellow);
    color:#000;
    border:4px solid #101010;
    font-size:18px;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    z-index:100;
    left:50%;
    bottom:80px;
    transform:translate(-50%,20px);
    width:calc(100% - 30px);
    max-width:500px;
    padding:11px 13px;
    border-radius:11px;
    background:#222;
    border:1px solid #333;
    color:#fff;
    text-align:center;
    font-size:8px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.error{
    border-color:rgba(239,68,68,.5);
}

.toast.success{
    border-color:rgba(34,197,94,.5);
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:390px){

    .summary{
        gap:6px;
    }

    .summary-card{
        min-height:68px;
    }

    .ride-main{
        padding:10px;
    }

}

</style>

</head>

<body>

<div class="history-app">


    <!-- HEADER -->

    <header class="header">

        <button
            class="back-btn"
            onclick="goBack()"
            aria-label="Back"
        >
            ‹
        </button>

        <div class="header-title">

            <h1>
                Ride History
            </h1>

            <p>
                Your RiderX trips
            </p>

        </div>

    </header>


    <!-- SUMMARY -->

    <section class="summary">

        <div class="summary-card">

            <div
                class="summary-value"
                id="totalRides"
            >
                0
            </div>

            <div class="summary-label">
                Total rides
            </div>

        </div>


        <div class="summary-card">

            <div
                class="summary-value"
                id="completedRides"
            >
                0
            </div>

            <div class="summary-label">
                Completed
            </div>

        </div>


        <div class="summary-card">

            <div
                class="summary-value"
                id="totalSpent"
            >
                ₹0
            </div>

            <div class="summary-label">
                Total spent
            </div>

        </div>

    </section>


    <!-- FILTER -->

    <div class="filters">

        <button
            class="filter-btn active"
            data-filter="all"
            onclick="setFilter('all',this)"
        >
            All
        </button>

        <button
            class="filter-btn"
            data-filter="completed"
            onclick="setFilter('completed',this)"
        >
            Completed
        </button>

        <button
            class="filter-btn"
            data-filter="cancelled"
            onclick="setFilter('cancelled',this)"
        >
            Cancelled
        </button>

        <button
            class="filter-btn"
            data-filter="bike"
            onclick="setFilter('bike',this)"
        >
            Bike
        </button>

        <button
            class="filter-btn"
            data-filter="cab"
            onclick="setFilter('cab',this)"
        >
            Cab
        </button>

        <button
            class="filter-btn"
            data-filter="parcel"
            onclick="setFilter('parcel',this)"
        >
            Parcel
        </button>

        <button
            class="filter-btn"
            data-filter="food"
            onclick="setFilter('food',this)"
        >
            Food
        </button>

    </div>


    <!-- SEARCH -->

    <div class="search-wrap">

        <span class="search-icon">
            🔍
        </span>

        <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search pickup or destination..."
            autocomplete="off"
        >

    </div>


    <!-- HISTORY -->

    <section class="section">

        <div class="section-title">
            Trips
        </div>


        <div
            class="history-list"
            id="historyList"
        >

            <div
                class="loading"
                id="loading"
            >

                <div class="spinner"></div>

                Loading your rides...

            </div>

        </div>


        <div
            class="empty"
            id="emptyState"
            style="display:none;"
        >

            <div class="empty-icon">
                🚕
            </div>

            <div class="empty-title">
                No rides found
            </div>

            <div class="empty-text">
                Your RiderX trips will appear here after you complete a ride.
            </div>

            <button
                class="book-btn"
                onclick="bookRide()"
            >
                Book a Ride
            </button>

        </div>

    </section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button
        class="nav-item"
        onclick="openHome()"
    >

        <div class="nav-icon">
            ⌂
        </div>

        <div class="nav-label">
            Home
        </div>

    </button>


    <button
        class="nav-item active"
        onclick="openHistory()"
    >

        <div class="nav-icon">
            🧾
        </div>

        <div class="nav-label">
            Rides
        </div>

    </button>


    <button
        class="nav-item nav-book"
        onclick="bookRide()"
    >

        <div class="nav-icon">
            +
        </div>

        <div class="nav-label">
            Book
        </div>

    </button>


    <button
        class="nav-item"
        onclick="openWallet()"
    >

        <div class="nav-icon">
            👛
        </div>

        <div class="nav-label">
            Wallet
        </div>

    </button>


    <button
        class="nav-item"
        onclick="openProfile()"
    >

        <div class="nav-icon">
            👤
        </div>

        <div class="nav-label">
            Profile
        </div>

    </button>

</nav>


<div
    class="toast"
    id="toast"
></div>


<script>

/* ==========================================
   RIDERX CUSTOMER HISTORY
========================================== */

let currentUser =
    null;

let allRides =
    [];

let activeFilter =
    "all";

let toastTimer =
    null;


const $ =
    id => document.getElementById(id);


/* ==========================================
   AUTH
========================================== */

function initAuth(){

    try{

        if(
            window.firebase &&
            firebase.auth
        ){

            firebase.auth()
                .onAuthStateChanged(
                    async user => {

                        currentUser =
                            user;

                        await loadHistory();

                    }
                );

            return;

        }

    }catch(error){

        console.error(
            error
        );

    }


    loadHistory();

}


/* ==========================================
   LOAD HISTORY
========================================== */

async function loadHistory(){

    showLoading();


    let rides =
        null;


    /*
      Preferred existing App.js /
      History integration.
    */

    try{

        if(
            typeof window.getCustomerRideHistory ===
            "function"
        ){

            rides =
                await window.getCustomerRideHistory(
                    currentUser
                );

        }

    }catch(error){

        console.error(
            "History integration:",
            error
        );

    }


    /*
      Firebase fallback.
    */

    if(
        !Array.isArray(rides) &&
        window.firebase &&
        firebase.firestore &&
        currentUser
    ){

        try{

            const snapshot =
                await firebase
                    .firestore()
                    .collection("rides")
                    .where(
                        "customerId",
                        "==",
                        currentUser.uid
                    )
                    .get();


            rides =
                snapshot.docs.map(
                    doc => ({
                        id:
                            doc.id,
                        ...doc.data()
                    })
                );


            rides.sort(
                (
                    a,
                    b
                ) =>
                    getTimestamp(
                        b.createdAt ||
                        b.timestamp ||
                        b.date
                    ) -
                    getTimestamp(
                        a.createdAt ||
                        a.timestamp ||
                        a.date
                    )
            );

        }catch(error){

            console.error(
                "Firebase history:",
                error
            );

        }

    }


    /*
      Local fallback.
    */

    if(
        !Array.isArray(rides)
    ){

        rides =
            loadLocalHistory();

    }


    allRides =
        Array.isArray(rides)
            ? rides
            : [];


    updateSummary(
        allRides
    );


    renderHistory();


}


/* ==========================================
   LOCAL HISTORY
========================================== */

function loadLocalHistory(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    "riderxRideHistory"
                ) ||
                "[]"
            );


        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


/* ==========================================
   SUMMARY
========================================== */

function updateSummary(
    rides
){

    const total =
        rides.length;


    const completed =
        rides.filter(
            ride =>
                normalizeStatus(
                    ride.status
                ) ===
                "completed"
        ).length;


    const spent =
        rides.reduce(
            (
                sum,
                ride
            ) => {

                const status =
                    normalizeStatus(
                        ride.status
                    );


                if(
                    status ===
                    "cancelled"
                ){

                    return sum;

                }


                return sum +
                    getFare(
                        ride
                    );

            },
            0
        );


    $("totalRides")
        .textContent =
        total;


    $("completedRides")
        .textContent =
        completed;


    $("totalSpent")
        .textContent =
        "₹" +
        Math.round(
            spent
        );

}


/* ==========================================
   FILTER
========================================== */

function setFilter(
    filter,
    button
){

    activeFilter =
        filter;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            btn =>
                btn.classList.remove(
                    "active"
                )
        );


    if(button){

        button.classList.add(
            "active"
        );

    }


    renderHistory();

}


/* ==========================================
   SEARCH
========================================== */

$("searchInput")
    .addEventListener(
        "input",
        renderHistory
    );


/* ==========================================
   RENDER
========================================== */

function renderHistory(){

    const list =
        $("historyList");

    const loading =
        $("loading");

    const empty =
        $("emptyState");


    loading.style.display =
        "none";


    list
        .querySelectorAll(
            ".ride-card"
        )
        .forEach(
            item =>
                item.remove()
        );


    const search =
        $("searchInput")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        allRides.filter(
            ride => {

                const status =
                    normalizeStatus(
                        ride.status
                    );


                const service =
                    normalizeService(
                        ride.serviceType ||
                        ride.service
                    );


                let matchesFilter =
                    true;


                if(
                    activeFilter ===
                    "completed"
                ){

                    matchesFilter =
                        status ===
                        "completed";

                }else if(
                    activeFilter ===
                    "cancelled"
                ){

                    matchesFilter =
                        status ===
                        "cancelled";

                }else if(
                    [
                        "bike",
                        "cab",
                        "parcel",
                        "food"
                    ].includes(
                        activeFilter
                    )
                ){

                    matchesFilter =
                        service ===
                        activeFilter;

                }


                if(
                    !matchesFilter
                ){

                    return false;

                }


                if(!search){

                    return true;

                }


                const pickup =
                    getPickup(
                        ride
                    ).toLowerCase();


                const drop =
                    getDrop(
                        ride
                    ).toLowerCase();


                const serviceText =
                    service.toLowerCase();


                return (
                    pickup.includes(
                        search
                    ) ||
                    drop.includes(
                        search
                    ) ||
                    serviceText.includes(
                        search
                    )
                );

            }
        );


    if(
        filtered.length ===
        0
    ){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(
        ride =>
            list.appendChild(
                createRideCard(
                    ride
                )
            )
    );

}


/* ==========================================
   RIDE CARD
========================================== */

function createRideCard(
    ride
){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "ride-card";


    const service =
        normalizeService(
            ride.serviceType ||
            ride.service
        );


    const status =
        normalizeStatus(
            ride.status
        );


    const icon =
        service === "cab"
            ? "🚕"
            : service === "parcel"
            ? "📦"
            : service === "food"
            ? "🍔"
            : "🏍️";


    const serviceName =
        service === "bike"
            ? "Bike Taxi"
            : service === "cab"
            ? "Cab"
            : service === "parcel"
            ? "Parcel"
            : service === "food"
            ? "Food Delivery"
            : "Ride";


    const pickup =
        getPickup(
            ride
        );


    const drop =
        getDrop(
            ride
        );


    const fare =
        getFare(
            ride
        );


    const date =
        formatDateTime(
            ride.createdAt ||
            ride.timestamp ||
            ride.date
        );


    const statusLabel =
        formatStatus(
            status
        );


    const statusClass =
        status === "completed"
            ? "completed"
            : status === "cancelled"
            ? "cancelled"
            : status === "pending" ||
              status === "searching" ||
              status === "accepted"
            ? "pending"
            : "default";


    card.innerHTML = `

        <div class="ride-main">

            <div class="service-icon">
                ${icon}
            </div>


            <div class="ride-content">

                <div class="route">
                    ${escapeHTML(
                        pickup
                    )}
                    →
                    ${escapeHTML(
                        drop
                    )}
                </div>

                <div class="route-sub">
                    ${serviceName} • ${date}
                </div>

            </div>


            <div class="ride-right">

                <div class="fare">
                    ₹${Math.round(
                        fare
                    )}
                </div>

                <div class="status ${statusClass}">
                    ${statusLabel}
                </div>

            </div>

        </div>


        <div class="ride-extra">

            <div class="extra-inner">

                <div class="extra-row">

                    <span class="extra-label">
                        Pickup
                    </span>

                    <span class="extra-value">
                        ${escapeHTML(
                            pickup
                        )}
                    </span>

                </div>


                <div class="extra-row">

                    <span class="extra-label">
                        Destination
                    </span>

                    <span class="extra-value">
                        ${escapeHTML(
                            drop
                        )}
                    </span>

                </div>


                <div class="extra-row">

                    <span class="extra-label">
                        Service
                    </span>

                    <span class="extra-value">
                        ${serviceName}
                    </span>

                </div>


                <div class="extra-row">

                    <span class="extra-label">
                        Payment
                    </span>

                    <span class="extra-value">
                        ${escapeHTML(
                            ride.paymentMethod ||
                            ride.payment ||
                            "Cash"
                        )}
                    </span>

                </div>


                <div class="extra-row">

                    <span class="extra-label">
                        Ride ID
                    </span>

                    <span class="extra-value">
                        ${escapeHTML(
                            ride.id ||
                            ride.rideId ||
                            "—"
                        )}
                    </span>

                </div>


                <div class="ride-actions">

                    <button
                        class="action-btn primary"
                        onclick="event.stopPropagation();viewRide('${escapeAttr(
                            ride.id ||
                            ride.rideId ||
                            ""
                        )}')"
                    >
                        View ride
                    </button>


                    <button
                        class="action-btn"
                        onclick="event.stopPropagation();repeatRide('${escapeAttr(
                            service
                        )}')"
                    >
                        Book again
                    </button>

                </div>

            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        function(){

            card.classList.toggle(
                "expanded"
            );

        }
    );


    return card;

}


/* ==========================================
   HELPERS
========================================== */

function getPickup(
    ride
){

    return (
        ride.pickup?.address ||
        ride.pickupAddress ||
        ride.fromAddress ||
        ride.from ||
        "Pickup location"
    );

}


function getDrop(
    ride
){

    return (
        ride.drop?.address ||
        ride.dropAddress ||
        ride.destinationAddress ||
        ride.toAddress ||
        ride.to ||
        "Destination"
    );

}


function getFare(
    ride
){

    return Number(
        ride.fare ??
        ride.totalFare ??
        ride.amount ??
        ride.price ??
        0
    ) || 0;

}


function normalizeService(
    service
){

    const value =
        String(
            service ||
            "bike"
        )
        .toLowerCase();


    if(
        value.includes(
            "cab"
        ) ||
        value.includes(
            "car"
        )
    ){

        return "cab";

    }


    if(
        value.includes(
            "parcel"
        )
    ){

        return "parcel";

    }


    if(
        value.includes(
            "food"
        )
    ){

        return "food";

    }


    return "bike";

}


function normalizeStatus(
    status
){

    const value =
        String(
            status ||
            "completed"
        )
        .toLowerCase()
        .replace(
            /[-_ ]/g,
            ""
        );


    if(
        value.includes(
            "cancel"
        )
    ){

        return "cancelled";

    }


    if(
        value.includes(
            "complete"
        ) ||
        value === "done"
    ){

        return "completed";

    }


    if(
        value.includes(
            "search"
        )
    ){

        return "searching";

    }


    if(
        value.includes(
            "accept"
        )
    ){

        return "accepted";

    }


    if(
        value.includes(
            "pending"
        )
    ){

        return "pending";

    }


    return value ||
        "completed";

}


function formatStatus(
    status
){

    return String(
        status ||
        ""
    )
    .replace(
        /[-_]/g,
        " "
    )
    .replace(
        /\b\w/g,
        char =>
            char.toUpperCase()
    );

}


function getTimestamp(
    value
){

    if(
        value &&
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        value &&
        typeof value.toDate ===
        "function"
    ){

        return value.toDate()
            .getTime();

    }


    const time =
        value
            ? new Date(
                value
            ).getTime()
            : 0;


    return Number.isNaN(
        time
    )
        ? 0
        : time;

}


function formatDateTime(
    value
){

    const timestamp =
        getTimestamp(
            value
        );


    if(!timestamp){

        return "Date unavailable";

    }


    return new Date(
        timestamp
    ).toLocaleDateString(
        [],
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


function escapeHTML(
    value
){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttr(
    value
){

    return String(
        value || ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


/* ==========================================
   RIDE ACTIONS
========================================== */

function viewRide(
    id
){

    if(!id){

        showToast(
            "Ride information unavailable.",
            "error"
        );

        return;

    }


    window.location.href =
        "ride-status.html?rideId=" +
        encodeURIComponent(
            id
        );

}


function repeatRide(
    service
){

    localStorage.setItem(
        "riderxSelectedService",
        service
    );


    window.location.href =
        "booking.html?service=" +
        encodeURIComponent(
            service
        );

}


/* ==========================================
   NAVIGATION
========================================== */

function goBack(){

    if(
        history.length > 1
    ){

        history.back();

    }else{

        openHome();

    }

}


function openHome(){

    window.location.href =
        "home.html";

}


function openHistory(){

    window.location.href =
        "history.html";

}


function bookRide(){

    window.location.href =
        "booking.html";

}


function openWallet(){

    window.location.href =
        "wallet.html";

}


function openProfile(){

    window.location.href =
        "profile.html";

}


/* ==========================================
   UI
========================================== */

function showLoading(){

    $("loading").style.display =
        "block";


    $("emptyState").style.display =
        "none";

}


function showToast(
    message,
    type=""
){

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.className =
        "toast show " +
        type;


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.className =
                    "toast";

            },
            3000
        );

}


/* ==========================================
   INIT
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initAuth();

    }
);

</script>
