<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Ride History</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.ride-card{

background:#1d1d1d;
padding:20px;
margin:15px 0;
border-radius:15px;

}


button{

width:100%;
padding:12px;
margin-top:10px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header">

📜 Ride History

</div>



<div class="container">


<div id="rideList">

Loading...

</div>



</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs,
query,
orderBy

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";






async function loadHistory(){


let box=document.getElementById("rideList");



let q=query(

collection(db,"rides"),

orderBy("createdAt","desc")

);



let snap=await getDocs(q);



box.innerHTML="";



snap.forEach((ride)=>{


let data=ride.data();



box.innerHTML += `


<div class="ride-card">


<h3>

${data.service || "Ride"}

</h3>


<p>
📍 Pickup:
<br>
${data.pickupLat || ""}
,
${data.pickupLng || ""}
</p>


<p>

🏁 Drop:
<br>

${data.dropLat || ""}
,
${data.dropLng || ""}

</p>


<p>

💰 Fare:
${data.fare || ""}

</p>


<p>

Status:
${data.status}

</p>


<p>

Payment:
${data.payment || "Pending"}

</p>



${

data.status=="Completed"

?

`

<button onclick="rateRide()">

⭐ Rate Rider

</button>

`

:

""

}



</div>


`;



});



}






window.rateRide=function(){


window.location.href="rating.html";


}




loadHistory();



</script>


</body>

</html>
