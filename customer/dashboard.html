<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Customer Dashboard</title>


<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

body{
margin:0;
background:#000;
color:#fff;
font-family:Arial;
padding-bottom:80px;
}


.header{

height:65px;
background:#111;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
border-bottom:2px solid #FFD600;

}


.logo{

font-size:30px;
font-weight:900;

}


.logo span{

color:#FFD600;

}


#map{

height:40vh;
width:100%;

}



.box{

background:#111;
padding:20px;
border-radius:25px 25px 0 0;

}



.services{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;

}



.service{

background:#000;
padding:12px 5px;
border-radius:15px;
text-align:center;
border:1px solid #333;
font-size:12px;

}


.service.active{

background:#FFD600;
color:#000;

}



.input{

width:100%;
padding:14px;
margin:8px 0;
background:#000;
color:#fff;
border:1px solid #444;
border-radius:12px;

}



.fare{

display:flex;
justify-content:space-between;
background:#000;
padding:15px;
border-radius:15px;

}



#fare{

color:#FFD600;
font-size:25px;
font-weight:bold;

}



.btn{

width:100%;
padding:16px;
margin-top:15px;
background:#FFD600;
color:#000;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;

}



.bottom{

position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 0;

}


.bottom div{

text-align:center;
font-size:12px;

}



</style>


</head>


<body>



<div class="header">


<div class="logo">

RIDER<span>X</span>

</div>


<div>

👤

</div>


</div>





<div id="map"></div>






<div class="box">





<div class="services">


<div class="service active" data-type="bike">

🏍️
<br>
Bike

</div>


<div class="service" data-type="cab">

🚕
<br>
Cab

</div>


<div class="service" data-type="parcel">

📦
<br>
Parcel

</div>


<div class="service" data-type="food">

🍔
<br>
Food

</div>


</div>







<input 
id="pickup"
class="input"
placeholder="Pickup Location">





<input 
id="drop"
class="input"
placeholder="Drop Location">






<div class="fare">

<span>
Estimated Fare
</span>


<span id="fare">

₹0

</span>


</div>






<select id="payment" class="input">


<option value="cash">

💵 Cash

</option>


<option value="online">

📱 UPI Online

</option>


<option value="wallet">

💳 Wallet

</option>


</select>







<button id="bookRide" class="btn">

🚕 Book Ride

</button>




<p id="status"
style="text-align:center;margin-top:15px;color:#FFD600">

</p>



</div>








<div class="bottom">


<div onclick="location.href='home.html'">

🏠
<br>
Home

</div>



<div onclick="location.href='history.html'">

📜
<br>
History

</div>



<div onclick="location.href='wallet.html'">

💰
<br>
Wallet

</div>



<div onclick="location.href='profile.html'">

👤
<br>
Profile

</div>



</div>








<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/customer.js?v=10"></script>



</body>

</html>
