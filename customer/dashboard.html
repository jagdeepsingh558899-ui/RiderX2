<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Dashboard</title>

<link rel="stylesheet" href="../css/style.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#000;
color:white;

}


.header{

background:#111;

padding:20px;

border-bottom:2px solid #FFD600;

display:flex;

justify-content:space-between;

align-items:center;

}


.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#FFD600;

}


.profile{

font-size:25px;

}



.container{

padding:20px;

}



.welcome{

background:#111;

padding:20px;

border-radius:20px;

margin-bottom:20px;

}



.welcome h2 span{

color:#FFD600;

}




.book{

background:#FFD600;

color:#000;

padding:20px;

border-radius:20px;

text-align:center;

font-size:22px;

font-weight:bold;

margin-bottom:20px;

}



.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

}



.card{

background:#111;

padding:20px;

border-radius:18px;

text-align:center;

border:1px solid #333;

}



.card:hover{

border-color:#FFD600;

}



.icon{

font-size:30px;

margin-bottom:10px;

}



a{

color:white;

text-decoration:none;

}



</style>


</head>


<body>



<div class="header">


<div class="logo">

RIDER<span>X</span>

</div>


<div class="profile">

👤

</div>


</div>





<div class="container">



<div class="welcome">


<h2>

Welcome <span>Customer</span>

</h2>


<p>

Book Bike Taxi, Cab, Parcel & Food Delivery

</p>


</div>






<div class="book" onclick="openBooking()">

🚕 Book A Ride

</div>





<div class="grid">



<a href="history.html">

<div class="card">

<div class="icon">

📜

</div>

History

</div>

</a>




<a href="wallet.html">

<div class="card">

<div class="icon">

💰

</div>

Wallet

</div>

</a>




<a href="notifications.html">

<div class="card">

<div class="icon">

🔔

</div>

Notifications

</div>

</a>




<a href="profile.html">

<div class="card">

<div class="icon">

👤

</div>

Profile

</div>

</a>




</div>



</div>






<script>


function openBooking(){

window.location.href="booking.html";

}


</script>



</body>

</html>
