<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX - Wallet</title>

<meta name="theme-color" content="#FFD400">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/responsive.css">

<style>

:root{
    --yellow:#FFD400;
    --bg:#090909;
    --card:#171717;
    --border:#303030;
    --muted:#777;
    --green:#22c55e;
    --red:#ef4444;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
    background:#080808;
}

body{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

.app{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    background:var(--bg);
    overflow:hidden;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    background:rgba(13,13,13,.97);
    border-bottom:1px solid #252525;
    backdrop-filter:blur(14px);
}

.back-btn{
    width:40px;
    height:40px;
    min-width:40px;
    border:1px solid #363636;
    border-radius:50%;
    background:#1b1b1b;
    color:#fff;
    font-size:22px;
    line-height:1;
}

.title-box{
    flex:1;
    min-width:0;
}

.title{
    font-size:11px;
    font-weight:900;
}

.subtitle{
    margin-top:3px;
    color:#777;
    font-size:5px;
}


/* =========================
   CONTENT
========================= */

.content{
    padding:14px 13px 35px;
}


/* =========================
   BALANCE
========================= */

.balance-card{
    position:relative;
    overflow:hidden;
    padding:19px 16px;
    border:1px solid #4b4100;
    border-radius:19px;
    background:
        radial-gradient(
            circle at 100% 0,
            rgba(255,212,0,.20),
            transparent 48%
        ),
        #1a1807;
}

.balance-card::after{
    content:"₹";
    position:absolute;
    right:15px;
    bottom:-18px;
    color:rgba(255,212,0,.06);
    font-size:100px;
    font-weight:900;
    pointer-events:none;
}

.balance-label{
    color:#999;
    font-size:6px;
    font-weight:700;
}

.balance{
    position:relative;
    z-index:2;
    margin-top:7px;
    color:var(--yellow);
    font-size:28px;
    font-weight:900;
    letter-spacing:-1px;
}

.balance-note{
    position:relative;
    z-index:2;
    margin-top:5px;
    color:#777;
    font-size:5px;
}

.balance-actions{
    position:relative;
    z-index:3;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.add-btn,
.withdraw-btn{
    height:40px;
    border-radius:11px;
    font-size:6px;
    font-weight:900;
}

.add-btn{
    border:1px solid #3b3500;
    background:var(--yellow);
    color:#000;
}

.withdraw-btn{
    border:1px solid #393939;
    background:#222;
    color:#fff;
}


/* =========================
   QUICK STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:10px;
}

.stat{
    padding:11px 8px;
    border:1px solid var(--border);
    border-radius:13px;
    background:var(--card);
    text-align:center;
}

.stat-label{
    color:#666;
    font-size:5px;
}

.stat-value{
    margin-top:6px;
    color:#fff;
    font-size:8px;
    font-weight:900;
}

.stat-value.yellow{
    color:var(--yellow);
}

.stat-value.green{
    color:var(--green);
}


/* =========================
   SECTION
========================= */

.section{
    margin-top:14px;
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:9px;
}

.section-title{
    font-size:8px;
    font-weight:900;
}

.section-link{
    border:0;
    background:transparent;
    color:var(--yellow);
    font-size:5px;
    font-weight:900;
}


/* =========================
   PAYMENT METHODS
========================= */

.method-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    margin-bottom:7px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--card);
}

.method-card.clickable{
    cursor:pointer;
}

.method-card.clickable:active{
    transform:scale(.99);
}

.method-icon{
    width:37px;
    height:37px;
    min-width:37px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:#242100;
    color:var(--yellow);
    font-size:15px;
    font-weight:900;
}

.method-info{
    flex:1;
    min-width:0;
}

.method-name{
    font-size:7px;
    font-weight:900;
}

.method-detail{
    margin-top:4px;
    color:#666;
    font-size:5px;
}

.method-status{
    color:var(--green);
    font-size:5px;
    font-weight:900;
}


/* =========================
   TRANSACTIONS
========================= */

.transaction-list{
    border-radius:13px;
    background:var(--card);
    padding:0 11px;
    border:1px solid var(--border);
}

.transaction{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #292929;
}

.transaction:last-child{
    border-bottom:0;
}

.transaction-icon{
    width:38px;
    height:38px;
    min-width:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:#202020;
    font-size:14px;
    font-weight:900;
}

.transaction-icon.credit{
    color:var(--green);
}

.transaction-icon.debit{
    color:#ff7070;
}

.transaction-info{
    flex:1;
    min-width:0;
}

.transaction-title{
    overflow:hidden;
    color:#fff;
    font-size:7px;
    font-weight:800;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.transaction-date{
    margin-top:4px;
    color:#666;
    font-size:5px;
}

.transaction-amount{
    white-space:nowrap;
    font-size:7px;
    font-weight:900;
}

.transaction-amount.credit{
    color:var(--green);
}

.transaction-amount.debit{
    color:#ff7070;
}

.empty{
    padding:25px 10px;
    border:1px dashed #303030;
    border-radius:13px;
    color:#666;
    text-align:center;
    font-size:6px;
}


/* =========================
   ADD MONEY MODAL
========================= */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:flex-end;
    justify-content:center;
    padding:12px;
    background:rgba(0,0,0,.72);
}

.overlay.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:625px;
    padding:16px;
    border:1px solid #3a3a3a;
    border-radius:20px 20px 15px 15px;
    background:#151515;
    box-shadow:0 -15px 50px rgba(0,0,0,.45);
}

.sheet-handle{
    width:38px;
    height:4px;
    margin:0 auto 14px;
    border-radius:10px;
    background:#555;
}

.sheet-title{
    font-size:10px;
    font-weight:900;
}

.sheet-subtitle{
    margin-top:5px;
    color:#666;
    font-size:5px;
}

.amount-input{
    width:100%;
    height:48px;
    margin-top:14px;
    padding:0 13px;
    border:1px solid #3b3b3b;
    border-radius:12px;
    outline:none;
    background:#202020;
    color:#fff;
    font-size:13px;
    font-weight:900;
}

.amount-input:focus{
    border-color:#766700;
}

.quick-amounts{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:9px;
}

.quick-amount{
    height:34px;
    border:1px solid #383838;
    border-radius:9px;
    background:#202020;
    color:#fff;
    font-size:6px;
    font-weight:900;
}

.quick-amount:hover{
    border-color:#6d6000;
    color:var(--yellow);
}

.sheet-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:13px;
}

.sheet-btn{
    height:43px;
    border-radius:11px;
    font-size:6px;
    font-weight:900;
}

.cancel-sheet{
    border:1px solid #3b3b3b;
    background:#222;
    color:#fff;
}

.confirm-sheet{
    border:1px solid #5a5000;
    background:var(--yellow);
    color:#000;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:22px;
    z-index:200;
    width:calc(100% - 28px);
    max-width:500px;
    padding:11px 13px;
    border:1px solid #343434;
    border-radius:11px;
    background:#222;
    color:#fff;
    text-align:center;
    font-size:6px;
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,20px);
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:380px){

    .balance{
        font-size:25px;
    }

    .quick-amounts{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>

<body>

<div class="app">

    <header class="header">

        <button
            class="back-btn"
            id="backBtn"
            type="button"
            aria-label="Back"
        >
            ‹
        </button>

        <div class="title-box">

            <div class="title">
                RiderX Wallet
            </div>

            <div class="subtitle">
                Manage your payments and wallet
            </div>

        </div>

    </header>


    <main class="content">

        <section class="balance-card">

            <div class="balance-label">
                AVAILABLE BALANCE
            </div>

            <div
                class="balance"
                id="balance"
            >
                ₹0
            </div>

            <div class="balance-note">
                Secure RiderX wallet balance
            </div>

            <div class="balance-actions">

                <button
                    class="add-btn"
                    id="addMoneyBtn"
                    type="button"
                >
                    + ADD MONEY
                </button>

                <button
                    class="withdraw-btn"
                    id="withdrawBtn"
                    type="button"
                >
                    WITHDRAW
                </button>

            </div>

        </section>


        <section class="stats">

            <div class="stat">

                <div class="stat-label">
                    TOTAL ADDED
                </div>

                <div
                    class="stat-value yellow"
                    id="totalAdded"
                >
                    ₹0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    TOTAL SPENT
                </div>

                <div
                    class="stat-value"
                    id="totalSpent"
                >
                    ₹0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    REFUNDS
                </div>

                <div
                    class="stat-value green"
                    id="refunds"

                </div>

        <section class="section">

            <div class="section-head">

                </div>

                <button

                >

        </section>


        <section class="section">

                <div class="section-title">
                    Recent transactions
                </div>

                <button
                    class="section-link"
                    id="viewAllBtn"

                >
                    VIEW ALL
                </button>

            </div>

            <div
                class="transaction-list"
                id="transactions"
            ></div>

        </section>

    </main>

</div>


<div
    class="overlay"
    id="addMoneyOverlay"
    aria-hidden="true"
>

    <div
        class="sheet"
        id="addMoneySheet"
    >

        <div class="sheet-handle"></div>

        <div class="sheet-title">
            Add money
        </div>

        <div class="sheet-subtitle">
            Enter the amount you want to add to your RiderX wallet.
        </div>

        <input
            class="amount-input"
            id="amountInput"
            type="number"
            min="1"

            placeholder="Enter amount"

        <div class="quick-amounts">

            <button
                class="quick-amount"

                ₹100
            </button>

            <button
                class="quick-amount"

            >
                ₹200
            </button>

            <button
                class="quick-amount"
                type="button"
                data-amount="500"

                ₹500
            </button>

            <button
                class="quick-amount"
                type="button"
                data-amount="1000"
            >
                ₹1000
            </button>

        </div>

        <div class="sheet-actions">

            <button
                class="sheet-btn cancel-sheet"

            >
                CANCEL
            </button>

            <button

                CONTINUE

    </div>

</div>


<div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
></div>


<script>

/* =========================================================
   RIDERX CUSTOMER WALLET
   File: customer/wallet.html

   Responsibilities:
   - Display customer wallet
   - Maintain wallet balance
   - Maintain wallet transaction history
   - Synchronize supported local RiderX wallet keys
   - Keep wallet state consistent between open pages
   - Validate wallet operations
   - Provide add-money UI
   - Provide withdrawal status
========================================================= */


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "riderxWallet";

const TRANSACTION_KEY = "riderxWalletTransactions";

const GENERIC_WALLET_KEY = "customerWallet";


/* =========================================================
   STATE
========================================================= */

let wallet = createDefaultWallet();

let transactions = [];

let toastTimer = null;

let isSaving = false;


/* =========================================================
   DEFAULT WALLET
========================================================= */

function createDefaultWallet(){

    return {

        balance: 0,

        totalAdded: 0,

        totalSpent: 0,

        refunds: 0

    };

}


/* =========================================================
   NUMBER NORMALIZATION
========================================================= */

function safeAmount(value){

    const amount = Number(value);

    if(
        !Number.isFinite(amount) ||
        amount < 0
    ){

        return 0;

    }

    return Math.round(
        amount * 100
    ) / 100;

}


/* =========================================================
   NORMALIZE WALLET
========================================================= */

function normalizeWallet(data){

    const source =
        data &&
        typeof data === "object"
            ? data
            : {};


    return {

        balance:
            safeAmount(
                source.balance
            ),

        totalAdded:
            safeAmount(
                source.totalAdded
            ),

        totalSpent:
            safeAmount(
                source.totalSpent
            ),

        refunds:
            safeAmount(
                source.refunds
            )

    };

}


/* =========================================================
   NORMALIZE TRANSACTION
========================================================= */

function normalizeTransaction(transaction){

    if(
        !transaction ||
        typeof transaction !== "object"
    ){

        return null;

    }


    const type =
        String(
            transaction.type || ""
        ).toLowerCase() === "credit"
            ? "credit"
            : "debit";


    return {

        id:
            String(
                transaction.id ||
                (
                    "TX" +
                    Date.now() +
                    Math.random()
                        .toString(36)
                        .slice(2,8)
                )
            ),

        type:

            type,

        amount:

            safeAmount(
                transaction.amount
            ),

        title:

            String(
                transaction.title ||
                transaction.description ||
                "Wallet transaction"
            ),

        description:

            String(
                transaction.description ||
                ""
            ),

        createdAt:

            Number(
                transaction.createdAt
            ) ||
            Date.now()

    };

}


/* =========================================================
   LOAD WALLET
========================================================= */

function loadWallet(){

    wallet =
        createDefaultWallet();


    transactions = [];


    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(raw){

            const data =
                JSON.parse(
                    raw
                );


            wallet =
                normalizeWallet(
                    data
                );

        }

    }catch(error){

        console.error(
            "RiderX wallet load error:",
            error
        );

    }


    try{

        const raw =
            localStorage.getItem(
                TRANSACTION_KEY
            );


        if(raw){

            const data =
                JSON.parse(
                    raw
                );


            if(
                Array.isArray(data)
            ){

                transactions =
                    data
                        .map(
                            normalizeTransaction
                        )
                        .filter(Boolean);

            }

        }

    }catch(error){

        console.error(
            "RiderX transaction load error:",
            error
        );

    }


    syncFromKnownStorage();

    repairWalletTotals();

    saveWallet();

    render();

}


/* =========================================================
   SYNC KNOWN WALLET STORAGE
========================================================= */

function syncFromKnownStorage(){

    const possibleKeys = [

        GENERIC_WALLET_KEY,

        "wallet",

        "userWallet",

        "riderx_customer_wallet"

    ];


    for(
        const key of possibleKeys
    ){

        try{

            const raw =
                localStorage.getItem(
                    key
                );


            if(!raw){

                continue;

            }


            const data =
                JSON.parse(
                    raw
                );


            if(
                typeof data === "number"
            ){

                /*
                  Only use a generic numeric wallet
                  when the main wallet is empty.
                */

                if(
                    wallet.balance === 0
                ){

                    wallet.balance =
                        safeAmount(
                            data
                        );

                }

                continue;

            }


            if(
                !data ||
                typeof data !== "object"
            ){

                continue;

            }


            const externalBalance =
                data.balance ??
                data.walletBalance ??
                data.amount;


            if(
                externalBalance !== undefined
            ){

                const amount =
                    safeAmount(
                        externalBalance
                    );


                /*
                  Do not blindly overwrite a newer
                  RiderX wallet value with an older
                  generic key.
                */

                if(
                    wallet.balance === 0 &&
                    amount > 0
                ){

                    wallet.balance =
                        amount;

                }

            }


            if(
                data.totalAdded !== undefined &&
                wallet.totalAdded === 0
            ){

                wallet.totalAdded =
                    safeAmount(
                        data.totalAdded
                    );

            }


            if(
                data.totalSpent !== undefined &&
                wallet.totalSpent === 0
            ){

                wallet.totalSpent =
                    safeAmount(
                        data.totalSpent
                    );

            }


            if(
                data.refunds !== undefined &&
                wallet.refunds === 0
            ){

                wallet.refunds =
                    safeAmount(
                        data.refunds
                    );

            }

        }catch(error){

            console.warn(
                "Wallet sync skipped:",
                key,
                error
            );

        }

    }

}


/* =========================================================
   REPAIR TOTALS
========================================================= */

function repairWalletTotals(){

    let calculatedAdded = 0;

    let calculatedSpent = 0;

    let calculatedRefunds = 0;


    transactions.forEach(
        function(transaction){

            const amount =
                safeAmount(
                    transaction.amount
                );


            if(
                transaction.type ===
                "credit"
            ){

                if(
                    String(
                        transaction.title
                    )
                    .toLowerCase()
                    .includes("refund")
                ){

                    calculatedRefunds +=
                        amount;

                }
                else{

                    calculatedAdded +=
                        amount;

                }

            }
            else{

                calculatedSpent +=
                    amount;

            }

        }
    );


    /*
      Only fill missing totals.
      Existing Firebase/booking values
      are not destroyed.
    */

    if(
        wallet.totalAdded === 0 &&
        calculatedAdded > 0
    ){

        wallet.totalAdded =
            calculatedAdded;

    }


    if(
        wallet.totalSpent === 0 &&
        calculatedSpent > 0
    ){

        wallet.totalSpent =
            calculatedSpent;

    }


    if(
        wallet.refunds === 0 &&
        calculatedRefunds > 0
    ){

        wallet.refunds =
            calculatedRefunds;

    }

}


/* =========================================================
   SAVE WALLET
========================================================= */

function saveWallet(){

    if(isSaving){

        return false;

    }


    isSaving = true;


    try{

        const cleanWallet =
            normalizeWallet(
                wallet
            );


        wallet =
            cleanWallet;


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                wallet
            )
        );


        localStorage.setItem(
            TRANSACTION_KEY,
            JSON.stringify(
                transactions
            )
        );


        /*
          Generic customer wallet compatibility.
        */

        localStorage.setItem(
            GENERIC_WALLET_KEY,
            JSON.stringify({

                balance:
                    wallet.balance,

                totalAdded:
                    wallet.totalAdded,

                totalSpent:
                    wallet.totalSpent,

                refunds:
                    wallet.refunds

            })
        );


        return true;

    }catch(error){

        console.error(
            "RiderX wallet save error:",
            error
        );


        showToast(
            "Unable to save wallet data."
        );


        return false;

    }finally{

        isSaving = false;

    }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const balance =
        document.getElementById(
            "balance"
        );


    const totalAdded =
        document.getElementById(
            "totalAdded"
        );


    const totalSpent =
        document.getElementById(
            "totalSpent"
        );


    const refunds =
        document.getElementById(
            "refunds"
        );


    if(balance){

        balance.textContent =
            formatMoney(
                wallet.balance
            );

    }


    if(totalAdded){

        totalAdded.textContent =
            formatMoney(
                wallet.totalAdded
            );

    }


    if(totalSpent){

        totalSpent.textContent =
            formatMoney(
                wallet.totalSpent
            );

    }


    if(refunds){

        refunds.textContent =
            formatMoney(
                wallet.refunds
            );

    }


    renderPaymentMethods();

    renderTransactions();

}


/* =========================================================
   PAYMENT METHODS
========================================================= */

function renderPaymentMethods(){

    const container =
        document.getElementById(
            "paymentMethods"
        );


    if(!container){

        return;

    }


    container.innerHTML = "";


    const methods = [

        {

            icon:"₹",

            name:"RiderX Wallet",

            detail:
                formatMoney(
                    wallet.balance
                ) +
                " available",

            status:"ACTIVE"

        },

        {

            icon:"U",

            name:"UPI",

            detail:"UPI payments",

            status:"AVAILABLE"

        },

        {

            icon:"💳",

            name:"Card",

            detail:"Debit / Credit Card",

            status:"AVAILABLE"

        }

    ];


    methods.forEach(
        function(method){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "method-card";


            card.innerHTML = `

                <div class="method-icon">
                    ${escapeHtml(method.icon)}
                </div>

                <div class="method-info">

                    <div class="method-name">
                        ${escapeHtml(method.name)}
                    </div>

                    <div class="method-detail">
                        ${escapeHtml(method.detail)}
                    </div>

                </div>

                <div class="method-status">
                    ${escapeHtml(method.status)}
                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   RENDER TRANSACTIONS
========================================================= */

function renderTransactions(){

    const container =
        document.getElementById(
            "transactions"
        );


    if(!container){

        return;

    }


    container.innerHTML = "";


    if(
        !transactions.length
    ){

        container.innerHTML = `

            <div class="empty">
                No wallet transactions yet.
            </div>

        `;

        return;

    }


    const sorted =
        transactions
            .slice()
            .sort(
                function(a,b){

                    return Number(
                        b.createdAt || 0
                    ) -
                    Number(
                        a.createdAt || 0
                    );

                }
            )
            .slice(
                0,
                8
            );


    sorted.forEach(
        function(transaction){

            const amount =
                safeAmount(
                    transaction.amount
                );


            const type =
                transaction.type ===
                "credit"
                    ? "credit"
                    : "debit";


            const icon =
                type === "credit"
                    ? "↓"
                    : "↑";


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "transaction";


            row.innerHTML = `

                <div class="transaction-icon ${type}">
                    ${icon}
                </div>

                <div class="transaction-info">

                    <div class="transaction-title">
                        ${escapeHtml(
                            transaction.title ||
                            transaction.description ||
                            "Wallet transaction"
                        )}
                    </div>

                    <div class="transaction-date">
                        ${formatDate(
                            transaction.createdAt
                        )}
                    </div>

                </div>

                <div class="transaction-amount ${type}">
                    ${type === "credit" ? "+" : "-"}
                    ${formatMoney(amount)}
                </div>

            `;


            container.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   OPEN ADD MONEY
========================================================= */

function openAddMoney(){

    const overlay =
        document.getElementById(
            "addMoneyOverlay"
        );


    const input =
        document.getElementById(
            "amountInput"
        );


    if(!overlay){

        return;

    }


    overlay.classList.add(
        "show"
    );


    overlay.setAttribute(
        "aria-hidden",
        "false"
    );


    setTimeout(
        function(){

            if(input){

                input.focus();

            }

        },
        120
    );

}


/* =========================================================
   CLOSE ADD MONEY
========================================================= */

function closeAddMoney(){

    const overlay =
        document.getElementById(
            "addMoneyOverlay"
        );


    const input =
        document.getElementById(
            "amountInput"
        );


    if(overlay){

        overlay.classList.remove(
            "show"
        );


        overlay.setAttribute(
            "aria-hidden",
            "true"
        );

    }


    if(input){

        input.value =
            "";

    }

}


/* =========================================================
   SET QUICK AMOUNT
========================================================= */

function setAmount(amount){

    const input =
        document.getElementById(
            "amountInput"
        );


    if(!input){

        return;

    }


    input.value =
        safeAmount(
            amount
        );


    input.focus();

}


/* =========================================================
   VALIDATE ADD MONEY
========================================================= */

function validateAddAmount(){

    const input =
        document.getElementById(
            "amountInput"
        );


    if(!input){

        return 0;

    }


    const amount =
        Number(
            input.value
        );


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showToast(
            "Please enter a valid amount."
        );

        return 0;

    }


    if(
        amount > 50000
    ){

        showToast(
            "Maximum amount is ₹50,000."
        );

        return 0;

    }


    if(
        !Number.isInteger(amount)
    ){

        showToast(
            "Please enter a whole rupee amount."
        );

        return 0;

    }


    return amount;

}


/* =========================================================
   CONFIRM ADD MONEY
========================================================= */

function confirmAddMoney(){

    const amount =
        validateAddAmount();


    if(!amount){

        return;

    }


    /*
      This updates the local RiderX wallet.
      A real UPI/card payment must call the same
      wallet-credit logic only after the payment
      gateway confirms success.
    */

    const previousBalance =
        wallet.balance;


    wallet.balance =
        safeAmount(
            wallet.balance +
            amount
        );


    wallet.totalAdded =
        safeAmount(
            wallet.totalAdded +
            amount
        );


    const transaction = {

        id:
            "TX" +
            Date.now() +
            Math.random()
                .toString(36)
                .slice(2,7),

        type:
            "credit",

        amount:
            amount,

        title:
            "Wallet top-up",

        description:
            "Money added to RiderX wallet",

        createdAt:
            Date.now()

    };


    transactions.unshift(
        transaction
    );


    const saved =
        saveWallet();


    if(!saved){

        /*
          Roll back memory state if
          local persistence failed.
        */

        wallet.balance =
            previousBalance;

        wallet.totalAdded =
            safeAmount(
                wallet.totalAdded -
                amount
            );


        transactions =
            transactions.filter(
                item =>
                    item.id !==
                    transaction.id
            );


        render();

        return;

    }


    render();

    closeAddMoney();


    showToast(
        formatMoney(amount) +
        " added to wallet."
    );


    /*
      Notify other RiderX tabs/pages.
    */

    dispatchWalletEvent();

}


/* =========================================================
   WALLET EVENT
========================================================= */

function dispatchWalletEvent(){

    try{

        window.dispatchEvent(
            new CustomEvent(
                "riderx:wallet-updated",
                {
                    detail:{
                        wallet:{
                            ...wallet
                        }
                    }
                }
            )
        );

    }catch(error){

        console.log(
            error
        );

    }

}


/* =========================================================
   WITHDRAW
========================================================= */

function withdrawMoney(){

    if(
        wallet.balance <= 0
    ){

        showToast(
            "No wallet balance available."
        );

        return;

    }


    showToast(
        "Withdrawal is currently unavailable."
    );

}


/* =========================================================
   PAYMENT SETTINGS
========================================================= */

function openPaymentSettings(){

    showToast(
        "Payment method management is coming soon."
    );

}


/* =========================================================
   VIEW ALL
========================================================= */

function viewAllTransactions(){

    window.location.href =
        "history.html";

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

    const referrer =
        document.referrer;


    if(
        referrer &&
        referrer.includes(
            window.location.host
        )
    ){

        window.history.back();

        return;

    }


    window.location.href =
        "home.html";

}


/* =========================================================
   FORMAT MONEY
========================================================= */

function formatMoney(amount){

    const number =
        safeAmount(
            amount
        );


    return "₹" +
        number.toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:
                    Number.isInteger(number)
                        ? 0
                        : 2,

                maximumFractionDigits:
                    2

            }
        );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(value){

    if(!value){

        return "Recently";

    }


    const date =
        new Date(
            Number(value)
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Recently";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ) +
    " • " +
    date.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    if(!toast){

        return;

    }


    toast.textContent =
        String(
            message
        );


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   STORAGE EVENT
   Allows another RiderX page/tab to update wallet UI.
========================================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            STORAGE_KEY ||
            event.key ===
            TRANSACTION_KEY ||
            event.key ===
            GENERIC_WALLET_KEY
        ){

            loadWallet();

        }

    }
);


/* =========================================================
   CUSTOM WALLET EVENT
========================================================= */

window.addEventListener(
    "riderx:wallet-updated",
    function(){

        render();

    }
);


/* =========================================================
   OVERLAY CLICK
========================================================= */

document.addEventListener(
    "click",
    function(event){

        const overlay =
            document.getElementById(
                "addMoneyOverlay"
            );


        if(
            event.target ===
            overlay
        ){

            closeAddMoney();

        }

    }
);


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closeAddMoney();

        }

    }
);


/* =========================================================
   BUTTON EVENTS
========================================================= */

function bindEvents(){

    const backBtn =
        document.getElementById(
            "backBtn"
        );


    const addMoneyBtn =
        document.getElementById(
            "addMoneyBtn"
        );


    const withdrawBtn =
        document.getElementById(
            "withdrawBtn"
        );


    const managePaymentBtn =
        document.getElementById(
            "managePaymentBtn"
        );


    const viewAllBtn =
        document.getElementById(
            "viewAllBtn"
        );


    const cancelAddBtn =
        document.getElementById(
            "cancelAddBtn"
        );


    const confirmAddBtn =
        document.getElementById(
            "confirmAddBtn"
        );


    if(backBtn){

        backBtn.addEventListener(
            "click",
            goBack
        );

    }


    if(addMoneyBtn){

        addMoneyBtn.addEventListener(
            "click",
            openAddMoney
        );

    }


    if(withdrawBtn){

        withdrawBtn.addEventListener(
            "click",
            withdrawMoney
        );

    }


    if(managePaymentBtn){

        managePaymentBtn.addEventListener(
            "click",
            openPaymentSettings
        );

    }


    if(viewAllBtn){

        viewAllBtn.addEventListener(
            "click",
            viewAllTransactions
        );

    }


    if(cancelAddBtn){

        cancelAddBtn.addEventListener(
            "click",
            closeAddMoney
        );

    }


    if(confirmAddBtn){

        confirmAddBtn.addEventListener(
            "click",
            confirmAddMoney
        );

    }


    document
        .querySelectorAll(
            ".quick-amount"
        )
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        setAmount(
                            this.dataset.amount
                        );

                    }
                );

            }
        );

}


/* =========================================================
   ENTER KEY IN AMOUNT
========================================================= */

function bindAmountInput(){

    const input =
        document.getElementById(
            "amountInput"
        );


    if(!input){

        return;

    }


    input.addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();

                confirmAddMoney();

            }

        }
    );

}


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        bindEvents();

        bindAmountInput();

        loadWallet();

    }
);

</script>
