<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>RiderX | Wallet</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">



<style>

:root{

--yellow:#FFE500;
--black:#080808;
--card:#151515;
--gray:#999;

}


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}



body{

background:var(--black);
color:white;
padding-bottom:80px;

}



/* Header */

.header{

display:flex;
align-items:center;
justify-content:space-between;
padding:20px;

}



.logo{

font-size:28px;
font-weight:800;

}



.logo span{

color:var(--yellow);

}



.back{

color:var(--yellow);
font-size:22px;

}




.container{

padding:20px;

}





/* Wallet Card */


.wallet-card{


background:linear-gradient(
135deg,
#FFE500,
#ffb300
);


color:black;

border-radius:25px;

padding:30px;

box-shadow:
0 15px 40px rgba(255,229,0,.25);


}



.wallet-card p{

font-size:14px;

font-weight:600;

}



.balance{

font-size:40px;

font-weight:800;

margin-top:10px;

}





.action{

display:flex;

gap:15px;

margin-top:25px;

}




.action button{


flex:1;

padding:14px;

border:none;

border-radius:15px;

font-weight:700;

cursor:pointer;

}




.add{

background:black;

color:white;

}



.history{

background:white;

color:black;

}





/* Sections */


.card{


background:var(--card);

border-radius:20px;

padding:20px;

margin-top:20px;

border:1px solid rgba(255,229,0,.2);


}




.card h3{

margin-bottom:15px;

}





.transaction{


display:flex;

justify-content:space-between;

align-items:center;

padding:15px 0;

border-bottom:1px solid #333;

}



.transaction:last-child{

border:none;

}



.green{

color:#00e676;

}



.yellow{

color:var(--yellow);

}




.referral{


text-align:center;

}



.referral i{

font-size:45px;

color:var(--yellow);

margin-bottom:10px;

}





.referral button{

margin-top:15px;

padding:13px 25px;

background:var(--yellow);

color:black;

border:none;

border-radius:12px;

font-weight:700;

}




/* Bottom Nav */


.bottom-nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:70px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

border-top:1px solid #222;

}



.bottom-nav a{

color:#777;

text-decoration:none;

text-align:center;

font-size:12px;

}



.bottom-nav i{

display:block;

font-size:20px;

margin-bottom:5px;

}



.active{

color:var(--yellow)!important;

}



</style>


</head>


<body>



<div class="header">


<a href="home.html" class="back">

<i class="fa-solid fa-arrow-left"></i>

</a>



<div class="logo">

RIDER<span>X</span>

</div>


<div></div>


</div>





<div class="container">



<div class="wallet-card">


<p>

Available Balance

</p>


<div class="balance" id="balance">

₹0

</div>



<div class="action">


<button class="add" onclick="addMoney()">

<i class="fa-solid fa-plus"></i>

Add Money

</button>


<button class="history">

<i class="fa-solid fa-clock"></i>

History

</button>


</div>


</div>





<div class="card">


<h3>

<i class="fa-solid fa-list" style="color:#FFE500"></i>

Transactions

</h3>


<div id="transactions">


<p style="color:#999">

No transactions yet

</p>


</div>


</div>



<div class="card referral">


<i class="fa-solid fa-gift"></i>


<h3>

Refer & Earn

</h3>


<p style="color:#aaa">

Invite friends and earn RiderX rewards

</p>



<button onclick="shareReferral()">

Share Referral

</button>


</div>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="../firebase/firebase-config.js"></script>



<script>


const auth = firebase.auth();

const db = firebase.firestore();




auth.onAuthStateChanged(async(user)=>{


if(!user){

window.location.href="../auth/login.html";

return;

}



loadWallet(user.uid);



});






async function loadWallet(uid){



try{


const walletDoc = await db.collection("wallets")
.doc(uid)
.get();



if(walletDoc.exists){



let data = walletDoc.data();



document.getElementById("balance")
.innerHTML =
"₹"+(data.balance || 0);



}

else{


document.getElementById("balance")
.innerHTML="₹0";


}




const transactions =
await db.collection("wallets")
.doc(uid)
.collection("transactions")
.orderBy("createdAt","desc")
.limit(10)
.get();



let html="";


transactions.forEach((doc)=>{


let data = doc.data();



html += `

<div class="transaction">


<div>

${data.title || "Ride Payment"}

<br>

<small style="color:#999">

${data.date || ""}

</small>


</div>


<div class="${data.type==="credit" ? "green":"yellow"}">


${data.type==="credit" ? "+" : "-"}
₹${data.amount || 0}


</div>


</div>

`;



});



if(html){

document.getElementById("transactions")
.innerHTML=html;

}



}

catch(error){

console.log(error);

}



}





function addMoney(){


alert(
"Online wallet recharge will be available soon."
);


}




function shareReferral(){


if(navigator.share){


navigator.share({

title:"RiderX",

text:"Join RiderX and get rewards"

});


}

else{


alert(
"Share RiderX with your friends"
);


}



}



</script>





<!-- Bottom Navigation -->


<div class="bottom-nav">


<a href="home.html">

<i class="fa-solid fa-house"></i>

Home

</a>



<a href="booking.html">

<i class="fa-solid fa-motorcycle"></i>

Booking

</a>



<a href="history.html">

<i class="fa-solid fa-clock"></i>

History

</a>



<a href="wallet.html" class="active">

<i class="fa-solid fa-wallet"></i>

Wallet

</a>



<a href="profile.html">

<i class="fa-solid fa-user"></i>

Profile

</a>



</div>




</body>

</html>
