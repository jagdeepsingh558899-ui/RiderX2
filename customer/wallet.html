/* =========================================================
   RIDERX CUSTOMER WALLET
   File: customer/wallet.html

   Responsibilities:
   - Display wallet balance
   - Maintain wallet transaction ledger
   - Expose wallet API to booking/payment pages
   - Prevent negative balance
   - Support debit / credit / refund
   - Preserve existing RiderX local storage compatibility
   - Never treat "Add Money" as a successful real payment
========================================================= */


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "riderxWallet";

const TRANSACTION_KEY =
    "riderxWalletTransactions";

const LEGACY_WALLET_KEYS = [

    "customerWallet",
    "wallet",
    "userWallet",
    "riderx_customer_wallet"

];

const RIDE_HISTORY_KEYS = [

    "riderxRideHistory",
    "rideHistory",
    "customerRideHistory"

];


/* =========================================================
   STATE
========================================================= */

let wallet = {

    balance:0,

    totalAdded:0,

    totalSpent:0,

    refunds:0

};

let transactions = [];

let showAllTransactions = false;

let toastTimer = null;


/* =========================================================
   DOM
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   NUMBER HELPERS
========================================================= */

function toAmount(value){

    const number =
        Number(value);

    if(
        !Number.isFinite(number)
    ){

        return 0;

    }

    return Math.round(
        number * 100
    ) / 100;

}


function positiveAmount(value){

    const amount =
        toAmount(value);

    return amount > 0
        ? amount
        : 0;

}


/* =========================================================
   NORMALIZE WALLET
========================================================= */

function normalizeWallet(data){

    const source =
        data &&
        typeof data === "object"
            ? data
            : {};

    return {

        balance:
            Math.max(
                0,
                toAmount(
                    source.balance
                )
            ),

        totalAdded:
            Math.max(
                0,
                toAmount(
                    source.totalAdded
                )
            ),

        totalSpent:
            Math.max(
                0,
                toAmount(
                    source.totalSpent
                )
            ),

        refunds:
            Math.max(
                0,
                toAmount(
                    source.refunds
                )
            )

    };

}


/* =========================================================
   LOAD WALLET
========================================================= */

function loadWallet(){

    wallet =
        normalizeWallet(
            readJSON(
                STORAGE_KEY,
                wallet
            )
        );


    const savedTransactions =
        readJSON(
            TRANSACTION_KEY,
            []
        );


    transactions =
        Array.isArray(
            savedTransactions
        )
            ? savedTransactions
            : [];


    /*
      If the canonical wallet does not exist yet,
      inspect old RiderX wallet keys.
    */

    if(
        !localStorage.getItem(
            STORAGE_KEY
        )
    ){

        importLegacyWallet();

    }


    /*
      Recalculate statistics from the transaction
      ledger where possible.
    */

    recalculateStats();


    saveWallet();

    render();

}


/* =========================================================
   LEGACY WALLET IMPORT
========================================================= */

function importLegacyWallet(){

    for(
        const key of LEGACY_WALLET_KEYS
    ){

        const data =
            readJSON(
                key,
                null
            );


        if(
            data === null
        ){

            continue;

        }


        if(
            typeof data ===
            "number"
        ){

            wallet.balance =
                Math.max(
                    0,
                    toAmount(data)
                );

            return;

        }


        if(
            typeof data ===
            "object"
        ){

            const balance =
                data.balance ??
                data.walletBalance ??
                data.amount;


            if(
                balance !== undefined
            ){

                wallet.balance =
                    Math.max(
                        0,
                        toAmount(
                            balance
                        )
                    );

            }


            wallet.totalAdded =
                positiveAmount(
                    data.totalAdded
                );


            wallet.totalSpent =
                positiveAmount(
                    data.totalSpent
                );


            wallet.refunds =
                positiveAmount(
                    data.refunds
                );


            return;

        }

    }

}


/* =========================================================
   READ JSON
========================================================= */

function readJSON(
    key,
    fallback
){

    try{

        const raw =
            localStorage.getItem(
                key
            );


        if(
            !raw
        ){

            return fallback;

        }


        return JSON.parse(
            raw
        );

    }catch(error){

        console.warn(
            "RiderX wallet storage read:",
            error
        );

        return fallback;

    }

}


/* =========================================================
   SAVE WALLET
========================================================= */

function saveWallet(){

    wallet =
        normalizeWallet(
            wallet
        );


    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                wallet
            )
        );


        localStorage.setItem(
            TRANSACTION_KEY,
            JSON.stringify(
                transactions
            )
        );


        /*
          Keep the common wallet key synchronized
          for existing RiderX pages.
        */

        localStorage.setItem(
            "customerWallet",
            JSON.stringify(
                wallet
            )
        );

    }catch(error){

        console.error(
            "RiderX wallet save:",
            error
        );

    }

}


/* =========================================================
   TRANSACTION ID
========================================================= */

function createTransactionId(
    prefix
){

    return (
        prefix ||
        "TX"
    ) +
    "_" +
    Date.now() +
    "_" +
    Math.random()
        .toString(36)
        .slice(2,8);

}


/* =========================================================
   ADD TRANSACTION
========================================================= */

function addTransaction(
    type,
    amount,
    title,
    description,
    meta
){

    const cleanAmount =
        positiveAmount(
            amount
        );


    if(
        cleanAmount <= 0
    ){

        return null;

    }


    const transaction = {

        id:
            createTransactionId(
                type === "credit"
                    ? "CR"
                    : "DR"
            ),

        type:
            type === "credit"
                ? "credit"
                : "debit",

        amount:
            cleanAmount,

        title:
            title ||
            "Wallet transaction",

        description:
            description ||
            "",

        rideId:
            meta &&
            meta.rideId
                ? String(
                    meta.rideId
                )
                : "",

        service:
            meta &&
            meta.service
                ? String(
                    meta.service
                )
                : "",

        createdAt:
            Date.now()

    };


    transactions.unshift(
        transaction
    );


    /*
      Keep the ledger reasonably small
      for localStorage reliability.
    */

    if(
        transactions.length >
        500
    ){

        transactions =
            transactions.slice(
                0,
                500
            );

    }


    return transaction;

}


/* =========================================================
   CREDIT WALLET
========================================================= */

function creditWallet(
    amount,
    options
){

    const cleanAmount =
        positiveAmount(
            amount
        );


    if(
        cleanAmount <= 0
    ){

        return {

            success:false,

            error:
                "Invalid amount."

        };

    }


    const opts =
        options &&
        typeof options === "object"
            ? options
            : {};


    wallet.balance =
        toAmount(
            wallet.balance +
            cleanAmount
        );


    if(
        opts.countAsAdded !== false
    ){

        wallet.totalAdded =
            toAmount(
                wallet.totalAdded +
                cleanAmount
            );

    }


    if(
        opts.refund === true
    ){

        wallet.refunds =
            toAmount(
                wallet.refunds +
                cleanAmount
            );

    }


    addTransaction(

        "credit",

        cleanAmount,

        opts.title ||
            (
                opts.refund
                    ? "Ride refund"
                    : "Wallet credit"
            ),

        opts.description ||
            (
                opts.refund
                    ? "Refund credited to RiderX wallet"
                    : "Amount credited to RiderX wallet"
            ),

        opts

    );


    saveWallet();

    render();


    return {

        success:true,

        amount:
            cleanAmount,

        balance:
            wallet.balance

    };

}


/* =========================================================
   DEBIT WALLET
========================================================= */

function debitWallet(
    amount,
    options
){

    const cleanAmount =
        positiveAmount(
            amount
        );


    if(
        cleanAmount <= 0
    ){

        return {

            success:false,

            error:
                "Invalid amount."

        };

    }


    if(
        wallet.balance <
        cleanAmount
    ){

        return {

            success:false,

            error:
                "Insufficient wallet balance.",

            balance:
                wallet.balance

        };

    }


    const opts =
        options &&
        typeof options === "object"
            ? options
            : {};


    wallet.balance =
        toAmount(
            wallet.balance -
            cleanAmount
        );


    wallet.totalSpent =
        toAmount(
            wallet.totalSpent +
            cleanAmount
        );


    addTransaction(

        "debit",

        cleanAmount,

        opts.title ||
            "RiderX ride payment",

        opts.description ||
            "Ride payment from RiderX wallet",

        opts

    );


    saveWallet();

    render();


    return {

        success:true,

        amount:
            cleanAmount,

        balance:
            wallet.balance

    };

}


/* =========================================================
   REFUND WALLET
========================================================= */

function refundWallet(
    amount,
    options
){

    const opts = {

        ...(options || {}),

        refund:true,

        countAsAdded:false,

        title:
            options &&
            options.title
                ? options.title
                : "Ride refund"

    };


    return creditWallet(
        amount,
        opts
    );

}


/* =========================================================
   RECALCULATE STATS
========================================================= */

function recalculateStats(){

    let added =
        0;

    let spent =
        0;

    let refunds =
        0;


    transactions.forEach(
        transaction => {

            const amount =
                positiveAmount(
                    transaction.amount
                );


            if(
                transaction.type ===
                "credit"
            ){

                if(
                    transaction.refund ===
                    true
                ){

                    refunds +=
                        amount;

                }else{

                    added +=
                        amount;

                }

            }else if(
                transaction.type ===
                "debit"
            ){

                spent +=
                    amount;

            }

        }
    );


    /*
      Only overwrite totals when there is
      usable transaction data. This preserves
      older wallet data that had totals but no
      transaction ledger.
    */

    if(
        transactions.length
    ){

        wallet.totalAdded =
            toAmount(
                added
            );

        wallet.totalSpent =
            toAmount(
                spent
            );

        wallet.refunds =
            toAmount(
                refunds
            );

    }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    $("balance")
        .textContent =
        formatMoney(
            wallet.balance
        );


    $("totalAdded")
        .textContent =
        formatMoney(
            wallet.totalAdded
        );


    $("totalSpent")
        .textContent =
        formatMoney(
            wallet.totalSpent
        );


    $("refunds")
        .textContent =
        formatMoney(
            wallet.refunds
        );


    renderPaymentMethods();

    renderTransactions();

}

/* =========================================================
   TRANSACTIONS
========================================================= */

function renderTransactions(){

    const container =
        $("transactions");


    container.innerHTML = "";


    if(
        !transactions.length
    ){

        container.innerHTML = `

            <div class="empty">
                No wallet transactions yet.
            </div>

        `;

        return;

    }


    const sorted =
        transactions
            .slice()
            .sort(
                (
                    a,
                    b
                ) =>
                    Number(
                        b.createdAt || 0
                    ) -
                    Number(
                        a.createdAt || 0
                    )
            );


    const visible =
        showAllTransactions
            ? sorted
            : sorted.slice(
                0,
                8
            );


    visible.forEach(
        transaction => {

            const amount =
                positiveAmount(
                    transaction.amount
                );


            const type =
                transaction.type ===
                "credit"
                    ? "credit"
                    : "debit";


            const icon =
                type === "credit"
                    ? "↓"
                    : "↑";


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "transaction";


            row.innerHTML = `

                <div
                    class="transaction-icon ${type}"
                >
                    ${icon}
                </div>

                <div class="transaction-info">

                    <div class="transaction-title">
                        ${escapeHTML(
                            transaction.title ||
                            transaction.description ||
                            "Wallet transaction"
                        )}
                    </div>

                    <div class="transaction-date">
                        ${formatDate(
                            transaction.createdAt
                        )}
                    </div>

                </div>

                <div
                    class="transaction-amount ${type}"
                >
                    ${
                        type === "credit"
                            ? "+"
                            : "-"
                    }
                    ${formatMoney(
                        amount
                    )}
                </div>

            `;


            container.appendChild(
                row
            );

        }
    );

}

/* =========================================================
   SET AMOUNT
========================================================= */

function setAmount(
    amount
){

    const cleanAmount =
        positiveAmount(
            amount
        );


    $("amountInput")
        .value =
        cleanAmount || "";

}


/* =========================================================
   CONFIRM ADD MONEY
========================================================= */

function confirmAddMoney(){

    const amount =
        positiveAmount(
            $("amountInput")
                .value
        );


    if(
        amount <= 0
    ){

        showToast(
            "Please enter a valid amount.",
            "error"
        );

        return;

    }


    if(
        amount >
        50000
    ){

        showToast(
            "Maximum wallet top-up is ₹50,000.",
            "error"
        );

        return;

    }


    /*
      IMPORTANT:
      Do NOT directly credit wallet here.
      A real wallet top-up must first complete
      UPI/card/payment-gateway verification.

      If another RiderX payment module exists,
      it can listen to the global callback below.
    */

    const paymentRequest = {

        amount:
            amount,

        source:
            "wallet",

        createdAt:
            Date.now(),

        callback:
            function(paymentResult){

                handleWalletTopupResult(
                    amount,
                    paymentResult
                );

            }

    };


    /*
      Allow an existing payment module to handle
      the real transaction if it is available.
    */

    if(
        typeof window.RiderXWalletPayment ===
        "function"
    ){

        try{

            const result =
                window.RiderXWalletPayment(
                    paymentRequest
                );


            if(
                result &&
                typeof result.then ===
                "function"
            ){

                result
                    .then(
                        paymentResult => {

                            handleWalletTopupResult(
                                amount,
                                paymentResult
                            );

                        }
                    )
                    .catch(
                        error => {

                            console.error(
                                error
                            );

                            showToast(
                                "Payment could not be started.",
                                "error"
                            );

                        }
                    );

            }


            closeAddMoney();

            return;

        }catch(error){

            console.error(
                "Wallet payment:",
                error
            );

            showToast(
                "Payment could not be started.",
                "error"
            );

            return;

        }

    }


    /*
      No real payment provider is connected.
      Never fake-credit the wallet.
    */

    closeAddMoney();


    showInfo(

        "Payment setup required",

        "RiderX wallet top-up needs a connected UPI/card payment gateway. " +
        "The wallet has not been credited because no verified payment " +
        "success callback is connected yet."

    );

}


/* =========================================================
   HANDLE PAYMENT RESULT
========================================================= */

function handleWalletTopupResult(
    requestedAmount,
    result
){

    if(
        !result
    ){

        showToast(
            "Payment result was not received.",
            "error"
        );

        return;

    }


    const success =
        result.success === true ||
        result.status === "success" ||
        result.status === "paid" ||
        result.paymentStatus === "success";


    if(
        !success
    ){

        showToast(
            result.message ||
            "Payment was not completed.",
            "error"
        );

        return;

    }


    const paidAmount =
        positiveAmount(
            result.amount ||
            requestedAmount
        );


    if(
        paidAmount <= 0
    ){

        showToast(
            "Invalid payment amount.",
            "error"
        );

        return;

    }


    creditWallet(

        paidAmount,

        {

            title:
                "Wallet top-up",

            description:
                "Verified wallet payment",

            paymentId:
                result.paymentId ||
                result.transactionId ||
                "",

            paymentMethod:
                result.paymentMethod ||
                "Online"

        }

    );


    showToast(
        formatMoney(
            paidAmount
        ) +
        " added to your wallet.",
        "success"
    );

}

   BACK
========================================================= */

function goBack(){

/* =========================================================
   FORMAT MONEY
========================================================= */

function formatMoney(
    amount
){

    const number =
        toAmount(
            amount
        );


    return "₹" +
        number.toLocaleString(
            "en-IN",
            {
                minimumFractionDigits:
                    Number.isInteger(
                        number
                    )
                        ? 0
                        : 2,

                maximumFractionDigits:
                    2
            }
        );

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    value
){

    const timestamp =
        normalizeTimestamp(
            value
        );


    if(
        !timestamp
    ){

        return "Recently";

    }


    const date =
        new Date(
            timestamp
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Recently";

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    ) +
    " • " +
    date.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   NORMALIZE TIMESTAMP
========================================================= */

function normalizeTimestamp(
    value
){

    if(
        value &&
        typeof value.toMillis ===
        "function"
    ){

        return value.toMillis();

    }


    if(
        value &&
        typeof value.toDate ===
        "function"
    ){

        return value.toDate()
            .getTime();

    }


    if(
        typeof value ===
        "number"
    ){

        return value < 10000000000
            ? value * 1000
            : value;

    }


    if(
        value
    ){

        const timestamp =
            new Date(
                value
            ).getTime();


        return Number.isNaN(
            timestamp
        )
            ? 0
            : timestamp;

    }


    return 0;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type
){

    const toast =
        $("toast");


    toast.textContent =
        message;


    toast.className =
        "toast show" +
        (
            type
                ? " " + type
                : ""
        );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.className =
                    "toast";

            },
            3000
        );

}


/* =========================================================
   EVENT BINDINGS
========================================================= */

function bindEvents(){

    $("backBtn")
        .addEventListener(
            "click",
            goBack
        );


    $("addMoneyBtn")
        .addEventListener(
            "click",
            openAddMoney
        );


    $("withdrawBtn")
        .addEventListener(
            "click",
            withdrawMoney
        );


    $("managePaymentsBtn")
        .addEventListener(
            "click",
            openPaymentSettings
        );


    $("viewTransactionsBtn")
        .addEventListener(
            "click",
            viewAllTransactions
        );


    $("cancelAddMoneyBtn")
        .addEventListener(
            "click",
            closeAddMoney
        );


    $("confirmAddMoneyBtn")
        .addEventListener(
            "click",
            confirmAddMoney
        );


    $("infoCloseBtn")
        .addEventListener(
            "click",
            closeInfo
        );


    document
        .querySelectorAll(
            ".quick-amount"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        setAmount(
                            button.dataset.amount
                        );

                    }
                );

            }
        );


    $("addMoneyOverlay")
        .addEventListener(
            "click",
            event => {

                if(
                    event.target ===
                    $("addMoneyOverlay")
                ){

                    closeAddMoney();

                }

            }
        );


    $("infoOverlay")
        .addEventListener(
            "click",
            event => {

                if(
                    event.target ===
                    $("infoOverlay")
                ){

                    closeInfo();

                }

            }
        );


    $("amountInput")
        .addEventListener(
            "keydown",
            event => {

                if(
                    event.key ===
                    "Enter"
                ){

                    confirmAddMoney();

                }

            }
        );


    document.addEventListener(
        "keydown",
        event => {

            if(
                event.key ===
                "Escape"
            ){

                closeAddMoney();

                closeInfo();

            }

        }
    );

}


/* =========================================================
   GLOBAL RIDERX WALLET API
   Other existing RiderX JS files can call:

   RiderXWallet.getBalance()

   RiderXWallet.debit(amount, options)

   RiderXWallet.credit(amount, options)

   RiderXWallet.refund(amount, options)

   RiderXWallet.getTransactions()

========================================================= */

window.RiderXWallet = {

    getBalance:function(){

        loadWallet();

        return wallet.balance;

    },


    getWallet:function(){

        loadWallet();

        return {
            ...wallet
        };

    },


    getTransactions:function(){

        loadWallet();

        return transactions
            .slice();

    },


    hasBalance:function(
        amount
    ){

        loadWallet();

        return wallet.balance >=
            positiveAmount(
                amount
            );

    },


    debit:function(
        amount,
        options
    ){

        loadWallet();

        return debitWallet(
            amount,
            options
        );

    },


    credit:function(
        amount,
        options
    ){

        loadWallet();

        return creditWallet(
            amount,
            options
        );

    },


    refund:function(
        amount,
        options
    ){

        loadWallet();

        return refundWallet(
            amount,
            options
        );

    },


    refresh:function(){

        loadWallet();

    }

};


/* =========================================================
   OPTIONAL GLOBAL TOP-UP CALLBACK
========================================================= */

window.RiderXWalletTopupSuccess =
    function(
        result
    ){

        if(
            !result
        ){

            return {

                success:false,

                error:
                    "Missing payment result."

            };

        }


        const amount =
            positiveAmount(
                result.amount
            );


        if(
            amount <= 0
        ){

            return {

                success:false,

                error:
                    "Invalid payment amount."

            };

        }


        const response =
            creditWallet(

                amount,

                {

                    title:
                        "Wallet top-up",

                    description:
                        "Verified online payment",

                    paymentId:
                        result.paymentId ||
                        result.transactionId ||
                        "",

                    paymentMethod:
                        result.paymentMethod ||
                        "Online"

                }

            );


        if(
            response.success
        ){

            showToast(
                formatMoney(
                    amount
                ) +
                " added to your wallet.",
                "success"
            );

        }


        return response;

    };


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        bindEvents();

        loadWallet();

    }
);
