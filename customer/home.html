<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Home</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f5f5f5;
}


.header{

background:#000;
color:white;
padding:20px;
border-radius:0 0 25px 25px;

}


.logo{

font-size:32px;
font-weight:800;
letter-spacing:2px;

}

.logo span{

color:#00eaff;

}


.welcome{

margin-top:10px;
font-size:18px;

}



.container{

padding:20px;

}



.location-box{

background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px #ddd;

}



.input{

background:#f1f1f1;
padding:15px;
border-radius:12px;
margin-bottom:12px;

}



input{

border:none;
outline:none;
background:none;
width:100%;
font-size:16px;

}



.ride-title{

margin:25px 0 15px;
font-size:22px;
font-weight:bold;

}



.cards{

display:flex;
gap:15px;

}



.card{

background:white;
width:33%;
padding:15px;
border-radius:18px;
text-align:center;
box-shadow:0 5px 15px #ddd;

}



.card img{

width:45px;
height:45px;

}



.card p{

margin-top:8px;
font-weight:bold;

}



button{

margin-top:25px;
width:100%;
padding:17px;

border:none;
border-radius:15px;

background:#00eaff;

font-size:18px;
font-weight:bold;

}


</style>

</head>


<body>


<div class="header">

<div class="logo">
RIDER<span>X</span>
</div>

<div class="welcome">
Book your ride anytime
</div>

</div>



<div class="container">


<div class="location-box">


<div class="input">
<input placeholder="📍 Pickup Location">
</div>


<div class="input">
<input placeholder="🏁 Drop Location">
</div>


</div>



<div class="ride-title">
Choose Ride
</div>



<div class="cards">


<div class="card">
🚲
<p>Bike</p>
</div>


<div class="card">
🛺
<p>Auto</p>
</div>


<div class="card">
🚕
<p>Cab</p>
</div>


</div>



<button>
Book Ride
</button>


</div>



</body>

</html>
