<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.logo{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;

}


.box{

background:#1d1d1d;
padding:15px;
border-radius:15px;
margin-top:15px;

}


button{

width:100%;
padding:14px;
margin-top:15px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>


</head>


<body>


<div class="header" id="appName">

RiderX

</div>



<div class="container">


<img id="logo"
class="logo"
src="../assets/logo.png">



<div class="box" id="banner">

Welcome to RiderX 🚕

</div>



<div class="box">

<h3>
📢 Notifications
</h3>


<div id="notifications">

Loading...

</div>


</div>



<button onclick="goBooking()">

🚕 Book Ride

</button>



</div>







<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc,
collection,
getDocs

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";







async function loadApp(){



let snap=await getDoc(

doc(db,"settings","app")

);



if(snap.exists()){


let data=snap.data();



if(data.appName)

appName.innerHTML=data.appName;



if(data.logo)

logo.src=data.logo;



if(data.banner)

banner.innerHTML=data.banner;



}





let notes=await getDocs(

collection(db,"notifications")

);



let box=

document.getElementById("notifications");



box.innerHTML="";



notes.forEach((n)=>{


box.innerHTML +=`

<p>

📢 ${n.data().message}

</p>

`;


});



}






window.goBooking=function(){

location.href="booking.html";

}





loadApp();



</script>


</body>

</html>
