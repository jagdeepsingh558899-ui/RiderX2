<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Home</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="splash">


<img src="../assets/logo.png" class="logo">


<h1>
Rider<span>X</span>
</h1>


<h2>Choose Your Ride</h2>


<button onclick="openBooking('Bike')">
🏍 Bike Ride
</button>


<button onclick="openBooking('Cab')">
🚕 Cab Ride
</button>


<button onclick="openBooking('Parcel')">
📦 Parcel
</button>


<br><br>


<button onclick="profile()">
My Profile
</button>



</div>



<script>


function openBooking(type){

localStorage.setItem(
"rideType",
type
);


window.location.href="booking.html";

}



function profile(){

window.location.href="profile.html";

}


</script>


</body>

</html>
