<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Customer Home</title>


<link rel="stylesheet" href="../assets/app.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#000;
color:#fff;
padding-bottom:70px;

}



.header{

height:65px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;

}



.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#FFD600;

}



#map{

height:42vh;
width:100%;

}




.sheet{

background:#111;
border-radius:25px 25px 0 0;
padding:20px;

}




.services{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;

}



.service{

background:#000;
border:1px solid #444;
border-radius:15px;
padding:12px 5px;
text-align:center;
font-size:12px;
cursor:pointer;

}



.service.active{

background:#FFD600;
color:#000;

}





.input{

width:100%;
padding:14px;
margin:8px 0;
background:#000;
color:#fff;
border:1px solid #555;
border-radius:12px;

}





.fare{

display:flex;
justify-content:space-between;
background:#000;
padding:15px;
border-radius:15px;

}



#fare{

color:#FFD600;
font-size:24px;
font-weight:bold;

}




.btn{

width:100%;
padding:16px;
margin-top:15px;
background:#FFD600;
border:none;
border-radius:15px;
font-size:17px;
font-weight:bold;
cursor:pointer;

}




#bookingStatus{

margin-top:15px;
text-align:center;
color:#FFD600;

}





.bottom{

position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 0;
z-index:999;

}



.bottom div{

text-align:center;
font-size:12px;
cursor:pointer;

}



.bottom i{

font-size:20px;
margin-bottom:5px;

}


</style>

</head>



<body>



<header class="header">

<div class="logo">

RID<span>ERX</span>

</div>


<i class="fa-solid fa-user"
onclick="location.href='profile.html'">

</i>


</header>





<div id="map"></div>





<div class="sheet">





<div class="services">


<div class="service active" data-service="bike">

<i class="fa-solid fa-motorcycle"></i>

<br>

Bike

</div>




<div class="service" data-service="cab">

<i class="fa-solid fa-car"></i>

<br>

Cab

</div>




<div class="service" data-service="parcel">

<i class="fa-solid fa-box"></i>

<br>

Parcel

</div>




<div class="service" data-service="food">

<i class="fa-solid fa-utensils"></i>

<br>

Food

</div>


</div>







<input id="pickupLocation"
class="input"
placeholder="Pickup Location">





<input id="dropoffLocation"
class="input"
placeholder="Where to go?">





<div class="fare">


<div>

Estimated Fare

</div>


<div id="fare">

₹0

</div>


</div>







<select id="paymentMethod" class="input">


<option value="cash">

💵 Cash

</option>


<option value="online">

📱 UPI / Online

</option>


<option value="wallet">

💳 Wallet

</option>


</select>







<button id="bookRide" class="btn">


<i class="fa-solid fa-paper-plane"></i>

Book Ride


</button>






<div id="bookingStatus"></div>



</div>








<div class="bottom">



<div onclick="location.href='home.html'">

<i class="fa-solid fa-house"></i>

<br>

Home

</div>




<div onclick="location.href='history.html'">

<i class="fa-solid fa-clock"></i>

<br>

History

</div>




<div onclick="location.href='wallet.html'">

<i class="fa-solid fa-wallet"></i>

<br>

Wallet

</div>




<div onclick="location.href='profile.html'">

<i class="fa-solid fa-user"></i>

<br>

Profile

</div>




</div>







<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script type="module" src="../js/customer.js"></script>



</body>

</html>
