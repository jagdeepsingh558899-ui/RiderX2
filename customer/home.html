<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>RiderX | Home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =========================================================
   RIDERX CUSTOMER HOME
   PREMIUM BLACK / YELLOW
   ========================================================= */

:root{
    --rx-yellow:#ffe500;
    --rx-yellow-dark:#d9c300;

    --rx-black:#050505;
    --rx-black-2:#0a0a0a;
    --rx-card:#111111;
    --rx-card-2:#181818;

    --rx-white:#ffffff;
    --rx-muted:#969696;
    --rx-border:#292929;

    --rx-green:#22c55e;
    --rx-red:#ef4444;

    --safe-top:env(safe-area-inset-top);
    --safe-bottom:env(safe-area-inset-bottom);
}

/* =========================================================
   RESET
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Poppins,sans-serif;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================================================
   MAP
   ========================================================= */

#map{
    position:fixed;
    inset:0;
    z-index:1;
    background:#111;
}

/* Darken map slightly */

.map-overlay{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.34) 0%,
            transparent 25%,
            transparent 62%,
            rgba(0,0,0,.20) 100%
        );
}

/* Leaflet */

.leaflet-control-zoom{
    display:none;
}

.leaflet-control-attribution{
    font-size:8px!important;
    background:rgba(0,0,0,.45)!important;
    color:#aaa!important;
}

.leaflet-control-attribution a{
    color:#aaa!important;
}

/* =========================================================
   TOP HEADER
   ========================================================= */

.top-header{
    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:50;

    padding:
        calc(12px + var(--safe-top))
        15px
        10px;

    pointer-events:none;
}

.top-header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.header-left,
.header-right{
    display:flex;
    align-items:center;
    gap:9px;

    pointer-events:auto;
}

/* Circular buttons */

.round-btn{
    width:44px;
    height:44px;

    border:none;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    background:rgba(8,8,8,.92);

    box-shadow:
        0 7px 24px rgba(0,0,0,.35);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    transition:
        transform .18s ease,
        background .18s ease;
}

.round-btn:active{
    transform:scale(.90);
}

.round-btn i{
    font-size:17px;
}

.notification-wrap{
    position:relative;
}

.notification-dot{
    position:absolute;

    top:8px;
    right:8px;

    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--rx-yellow);

    box-shadow:
        0 0 0 2px #080808;

    display:none;
}

.notification-dot.show{
    display:block;
}

/* Logo */

.rx-logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    background:rgba(8,8,8,.94);

    padding:8px 17px;

    border-radius:15px;

    font-size:17px;
    line-height:1;

    font-weight:800;
    letter-spacing:.5px;

    box-shadow:
        0 7px 24px rgba(0,0,0,.35);

    pointer-events:auto;
}

.rx-logo span{
    color:var(--rx-yellow);
}

/* =========================================================
   LOCATION STATUS
   ========================================================= */

.location-status{
    position:fixed;

    top:
        calc(67px + var(--safe-top));

    left:50%;

    transform:
        translateX(-50%)
        translateY(-8px);

    z-index:40;

    opacity:0;

    display:flex;
    align-items:center;
    gap:7px;

    padding:8px 13px;

    border-radius:30px;

    background:rgba(8,8,8,.93);

    color:#fff;

    font-size:10px;
    font-weight:600;

    box-shadow:
        0 8px 25px rgba(0,0,0,.4);

    transition:
        opacity .25s ease,
        transform .25s ease;

    pointer-events:none;

    white-space:nowrap;
}

.location-status.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

.location-status i{
    color:var(--rx-yellow);
}

/* =========================================================
   CURRENT LOCATION BUTTON
   ========================================================= */

.current-location{
    position:fixed;

    right:15px;

    bottom:
        calc(315px + var(--safe-bottom));

    z-index:45;

    width:48px;
    height:48px;

    border:none;
    border-radius:50%;

    background:rgba(10,10,10,.94);
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 8px 25px rgba(0,0,0,.4);

    transition:
        transform .2s ease,
        background .2s ease;
}

.current-location:active{
    transform:scale(.90);
}

.current-location.active{
    color:var(--rx-yellow);
}

.current-location i{
    font-size:18px;
}

/* =========================================================
   GPS PULSE
   ========================================================= */

.gps-marker{
    width:18px;
    height:18px;

    border-radius:50%;

    background:var(--rx-yellow);

    border:4px solid #111;

    box-shadow:
        0 0 0 6px rgba(255,229,0,.20),
        0 0 0 13px rgba(255,229,0,.08);
}

/* =========================================================
   MAIN BOTTOM SHEET
   ========================================================= */

.home-sheet{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:60;

    background:
        linear-gradient(
            180deg,
            #111 0%,
            #080808 100%
        );

    border-radius:
        27px
        27px
        0
        0;

    padding:
        10px
        15px
        calc(17px + var(--safe-bottom));

    box-shadow:
        0 -15px 45px rgba(0,0,0,.42);

    max-height:54vh;

    overflow-y:auto;

    overscroll-behavior:contain;

    animation:
        sheetUp .45s cubic-bezier(.22,1,.36,1);
}

@keyframes sheetUp{
    from{
        transform:translateY(100%);
    }

    to{
        transform:translateY(0);
    }
}

/* Handle */

.sheet-handle{
    width:42px;
    height:5px;

    border-radius:10px;

    background:#444;

    margin:
        0 auto
        12px;
}

/* =========================================================
   GREETING
   ========================================================= */

.greeting{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.greeting-title{
    font-size:19px;
    font-weight:800;
}

.greeting-sub{
    color:var(--rx-muted);
    font-size:10px;
    margin-top:2px;
}

.profile-mini{
    width:40px;
    height:40px;

    border-radius:50%;

    border:2px solid #2b2b2b;

    background:
        linear-gradient(
            135deg,
            #252525,
            #0d0d0d
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--rx-yellow);

    overflow:hidden;
}

.profile-mini img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================================================
   DESTINATION SEARCH
   ========================================================= */

.search-box{
    width:100%;

    background:#191919;

    border:1px solid #252525;

    border-radius:16px;

    padding:12px;

    display:flex;
    align-items:center;

    gap:11px;

    margin-bottom:11px;

    transition:
        border-color .2s ease,
        transform .2s ease;
}

.search-box:active{
    transform:scale(.99);
}

.search-icon{
    width:36px;
    height:36px;

    border-radius:11px;

    background:#252525;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--rx-yellow);

    flex:none;
}

.search-content{
    min-width:0;
    flex:1;
}

.search-label{
    font-size:9px;
    color:#777;
}

.search-text{
    color:#fff;

    font-size:13px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.search-arrow{
    color:#777;
}

/* =========================================================
   QUICK DESTINATIONS
   ========================================================= */

.quick-destinations{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:3px;

    scrollbar-width:none;

    margin-bottom:12px;
}

.quick-destinations::-webkit-scrollbar{
    display:none;
}

.quick-place{
    flex:none;

    border:1px solid #292929;

    background:#151515;

    border-radius:13px;

    padding:8px 11px;

    color:#ddd;

    display:flex;
    align-items:center;
    gap:7px;

    font-size:10px;
    font-weight:600;
}

.quick-place i{
    color:var(--rx-yellow);
}

/* =========================================================
   SERVICES
   ========================================================= */

.section-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:8px;
}

.section-heading strong{
    font-size:12px;
}

.section-heading span{
    font-size:9px;
    color:#777;
}

.services{
    display:grid;

    grid-template-columns:
        repeat(4, minmax(0,1fr));

    gap:8px;

    margin-bottom:12px;
}

.service{
    position:relative;

    border:1px solid #2b2b2b;

    border-radius:15px;

    background:#151515;

    min-height:74px;

    padding:9px 4px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    color:#999;

    transition:
        transform .18s ease,
        background .22s ease,
        border-color .22s ease,
        color .22s ease;
}

.service:active{
    transform:scale(.95);
}

.service i{
    font-size:20px;
}

.service span{
    font-size:9px;
    font-weight:700;
}

.service small{
    position:absolute;

    top:5px;
    right:5px;

    font-size:6px;

    background:#252525;
    color:#777;

    padding:2px 4px;

    border-radius:5px;
}

.service.active{
    background:var(--rx-yellow);

    border-color:var(--rx-yellow);

    color:#000;

    box-shadow:
        0 7px 18px rgba(255,229,0,.15);
}

.service.active small{
    background:#000;
    color:var(--rx-yellow);
}

/* =========================================================
   TRIP INFORMATION
   ========================================================= */

.trip-info{
    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:8px;

    margin-bottom:10px;
}

.info-card{
    background:#151515;

    border:1px solid #242424;

    border-radius:14px;

    padding:10px 11px;

    display:flex;
    align-items:center;
    gap:9px;
}

.info-icon{
    width:32px;
    height:32px;

    border-radius:10px;

    background:#222;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--rx-yellow);
}

.info-title{
    color:#777;
    font-size:8px;
}

.info-value{
    font-size:12px;
    font-weight:700;
    margin-top:1px;
}

/* =========================================================
   PAYMENT
   ========================================================= */

.payment-row{
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#151515;

    border:1px solid #242424;

    border-radius:14px;

    padding:10px 11px;

    margin-bottom:10px;
}

.payment-left{
    display:flex;
    align-items:center;
    gap:9px;
}

.payment-icon{
    width:33px;
    height:33px;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#222;
    color:var(--rx-yellow);
}

.payment-label{
    font-size:8px;
    color:#777;
}

.payment-value{
    font-size:11px;
    font-weight:700;
}

.payment-select{
    border:none;
    outline:none;

    background:transparent;

    color:#fff;

    font-size:10px;
    font-weight:700;

    text-align:right;
}

.payment-select option{
    background:#111;
    color:#fff;
}

/* =========================================================
   FARE / BOOK
   ========================================================= */

.booking-bottom{
    display:flex;
    align-items:center;
    gap:10px;
}

.fare-box{
    flex:0 0 92px;

    min-height:54px;

    border-radius:14px;

    background:#151515;

    border:1px solid #242424;

    padding:7px 9px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.fare-label{
    color:#777;
    font-size:8px;
}

.fare-value{
    color:var(--rx-yellow);

    font-size:19px;

    font-weight:800;

    line-height:1.1;
}

.book-btn{
    flex:1;

    min-height:54px;

    border:none;

    border-radius:14px;

    background:var(--rx-yellow);

    color:#000;

    font-size:14px;
    font-weight:800;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    box-shadow:
        0 8px 22px rgba(255,229,0,.14);

    transition:
        transform .18s ease,
        filter .18s ease,
        opacity .18s ease;
}

.book-btn:active{
    transform:scale(.97);
}

.book-btn:disabled{
    background:#333;
    color:#777;
    box-shadow:none;
    cursor:not-allowed;
}

.book-btn.loading{
    pointer-events:none;
}

.book-btn.loading i{
    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   HOME MENU
   ========================================================= */

.menu-panel{
    position:fixed;

    top:0;
    left:0;

    width:min(330px,88vw);
    height:100%;

    z-index:200;

    background:
        linear-gradient(
            180deg,
            #101010,
            #050505
        );

    box-shadow:
        15px 0 45px rgba(0,0,0,.55);

    transform:translateX(-105%);

    transition:
        transform .35s cubic-bezier(.22,1,.36,1);

    padding:
        calc(20px + var(--safe-top))
        17px
        calc(20px + var(--safe-bottom));

    overflow-y:auto;
}

.menu-panel.open{
    transform:translateX(0);
}

.menu-overlay{
    position:fixed;
    inset:0;

    z-index:190;

    background:rgba(0,0,0,.62);

    opacity:0;
    visibility:hidden;

    transition:
        opacity .3s ease,
        visibility .3s ease;
}

.menu-overlay.open{
    opacity:1;
    visibility:visible;
}

.menu-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.menu-logo{
    font-size:20px;
    font-weight:800;
}

.menu-logo span{
    color:var(--rx-yellow);
}

.close-menu{
    width:40px;
    height:40px;

    border:none;
    border-radius:50%;

    background:#1c1c1c;
    color:#fff;
}

.user-card{
    background:#161616;

    border:1px solid #272727;

    border-radius:17px;

    padding:13px;

    display:flex;
    align-items:center;

    gap:11px;

    margin-bottom:17px;
}

.user-avatar{
    width:47px;
    height:47px;

    border-radius:50%;

    background:#222;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--rx-yellow);

    overflow:hidden;
}

.user-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-name{
    font-size:13px;
    font-weight:700;
}

.user-email{
    color:#777;
    font-size:9px;

    margin-top:2px;
}

.menu-item{
    width:100%;

    border:none;

    background:transparent;

    color:#ddd;

    padding:12px 8px;

    display:flex;
    align-items:center;

    gap:13px;

    border-radius:12px;

    text-align:left;

    font-size:11px;
    font-weight:600;
}

.menu-item:active{
    background:#191919;
}

.menu-item i{
    width:22px;
    text-align:center;

    color:var(--rx-yellow);
}

.menu-divider{
    height:1px;
    background:#222;
    margin:9px 0;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:
        calc(70px + var(--safe-bottom));

    z-index:300;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    min-width:220px;
    max-width:88vw;

    background:#111;

    border:1px solid #2b2b2b;

    border-radius:13px;

    padding:11px 14px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:8px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.5);

    font-size:10px;
    font-weight:600;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}

.toast.success i{
    color:var(--rx-green);
}

.toast.error i{
    color:var(--rx-red);
}

/* =========================================================
   SEARCH MODAL
   ========================================================= */

.search-modal{
    position:fixed;

    inset:0;

    z-index:500;

    background:
        linear-gradient(
            180deg,
            #111,
            #050505
        );

    transform:translateY(100%);

    transition:
        transform .35s cubic-bezier(.22,1,.36,1);

    padding:
        calc(15px + var(--safe-top))
        15px
        calc(15px + var(--safe-bottom));
}

.search-modal.open{
    transform:translateY(0);
}

.search-header{
    display:flex;
    align-items:center;
    gap:10px;

    margin-bottom:15px;
}

.search-back{
    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    background:#1b1b1b;
    color:#fff;
}

.search-input-wrap{
    flex:1;

    background:#1b1b1b;

    border:1px solid #2b2b2b;

    border-radius:13px;

    padding:0 12px;

    display:flex;
    align-items:center;

    height:46px;
}

.search-input-wrap i{
    color:var(--rx-yellow);
    margin-right:8px;
}

#destinationInput{
    flex:1;

    background:transparent;

    border:none;
    outline:none;

    color:#fff;

    font-size:13px;
}

#destinationInput::placeholder{
    color:#777;
}

.search-results{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.search-result{
    width:100%;

    border:none;

    background:#111;

    border-bottom:1px solid #222;

    color:#fff;

    text-align:left;

    padding:14px 8px;

    display:flex;
    align-items:center;

    gap:12px;
}

.search-result i{
    width:35px;
    height:35px;

    border-radius:10px;

    background:#1e1e1e;

    color:var(--rx-yellow);

    display:flex;
    align-items:center;
    justify-content:center;
}

.search-result strong{
    display:block;
    font-size:11px;
}

.search-result span{
    display:block;
    color:#777;
    font-size:8px;
    margin-top:2px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:380px){

    .home-sheet{
        padding-left:12px;
        padding-right:12px;
    }

    .greeting-title{
        font-size:17px;
    }

    .service{
        min-height:69px;
    }

    .service i{
        font-size:18px;
    }

    .fare-box{
        flex-basis:84px;
    }

    .book-btn{
        font-size:13px;
    }
}

</style>
</head>

<body>

<!-- =======================================================
     MAP
     ======================================================= -->

<div id="map"></div>

<div class="map-overlay"></div>


<!-- =======================================================
     TOP HEADER
     ======================================================= -->

<header class="top-header">

    <div class="top-header-inner">

        <div class="header-left">

            <button
                class="round-btn"
                id="menuBtn"
                type="button"
                aria-label="Open menu">

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>


        <div class="rx-logo">

            RIDER<span>X</span>

        </div>


        <div class="header-right">

            <div class="notification-wrap">

                <button
                    class="round-btn"
                    id="notificationBtn"
                    type="button"
                    aria-label="Notifications">

                    <i class="fa-regular fa-bell"></i>

                </button>

                <span
                    class="notification-dot"
                    id="notificationDot">
                </span>

            </div>

        </div>

    </div>

</header>


<!-- =======================================================
     LOCATION STATUS
     ======================================================= -->

<div
    class="location-status"
    id="locationStatus">

    <i class="fa-solid fa-location-crosshairs"></i>

    <span id="locationStatusText">
        Locating you...

<!-- =======================================================
     HOME UI CONTROLLER
     ======================================================= -->

<script>

(function(){

"use strict";

/* =========================================================
   STATE
   ========================================================= */

let menuOpen = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const menuBtn =
    document.getElementById("menuBtn");

const menuPanel =
    document.getElementById("menuPanel");

const menuOverlay =
    document.getElementById("menuOverlay");

const closeMenu =
    document.getElementById("closeMenu");

const searchBtn =
    document.getElementById("destinationSearchBtn");

const searchModal =
    document.getElementById("searchModal");

const searchBack =
    document.getElementById("searchBack");

const destinationInput =
    document.getElementById("destinationInput");

const destinationPreview =
    document.getElementById("destinationPreview");

const toast =
    document.getElementById("toast");

const toastText =
    document.getElementById("toastText");

const toastIcon =
    document.getElementById("toastIcon");

const currentLocationBtn =
    document.getElementById("currentLocationBtn");

const notificationBtn =
    document.getElementById("notificationBtn");

const profileBtn =
    document.getElementById("profileBtn");

const logoutBtn =
    document.getElementById("logoutBtn");


/* =========================================================
   MENU
   ========================================================= */

function openMenu(){

    menuOpen = true;

    menuPanel.classList.add("open");

    menuOverlay.classList.add("open");

}


function closeMenuPanel(){

    menuOpen = false;

    menuPanel.classList.remove("open");

    menuOverlay.classList.remove("open");

}


if(menuBtn){

    menuBtn.addEventListener(
        "click",
        openMenu
    );

}


if(closeMenu){

    closeMenu.addEventListener(
        "click",
        closeMenuPanel
    );

}


if(menuOverlay){

    menuOverlay.addEventListener(
        "click",
        closeMenuPanel
    );

}


/* =========================================================
   MENU NAVIGATION
   ========================================================= */

document
    .querySelectorAll(".menu-item[data-page]")
    .forEach(item=>{

        item.addEventListener(
            "click",
            ()=>{

                const page =
                    item.dataset.page;

                if(!page){
                    return;
                }

                window.location.href =
                    page;

            }
        );

    });


/* =========================================================
   SEARCH MODAL
   ========================================================= */

function openSearch(){

    searchModal.classList.add("open");

    setTimeout(
        ()=>{
            if(destinationInput){
                destinationInput.focus();
            }
        },
        350
    );

}


function closeSearch(){

    searchModal.classList.remove("open");

    if(destinationInput){
        destinationInput.blur();
    }

}


if(searchBtn){

    searchBtn.addEventListener(
        "click",
        openSearch
    );

}


if(searchBack){

    searchBack.addEventListener(
        "click",
        closeSearch
    );

}


/* =========================================================
   SEARCH RESULTS
   ========================================================= */

document
    .querySelectorAll(".search-result")
    .forEach(result=>{

        result.addEventListener(
            "click",
            ()=>{

                const value =
                    result.dataset.search ||
                    "";

                if(
                    value ===
                    "Current location"
                ){

                    if(
                        currentLocationBtn
                    ){

                        currentLocationBtn.click();

                    }

                    closeSearch();

                    return;

                }


                if(destinationPreview){

                    destinationPreview.innerText =
                        value;

                }


                if(destinationInput){

                    destinationInput.value =
                        value;

                }


                closeSearch();


                showToast(
                    "Destination selected",
                    "success"
                );

            }
        );

    });


/* =========================================================
   QUICK DESTINATIONS
   ========================================================= */

document
    .querySelectorAll(".quick-place")
    .forEach(button=>{

        button.addEventListener(
            "click",
            ()=>{

                const place =
                    button.dataset.place ||
                    "Saved place";


                if(destinationPreview){

                    destinationPreview.innerText =
                        place;

                }


                showToast(
                    place + " selected",
                    "success"
                );

            }
        );

    });


/* =========================================================
   NOTIFICATIONS
   ========================================================= */

if(notificationBtn){

    notificationBtn.addEventListener(
        "click",
        ()=>{

            const dot =
                document.getElementById(
                    "notificationDot"
                );

            if(dot){
                dot.classList.remove("show");
            }


            window.location.href =
                "notifications.html";

        }
    );

}


/* =========================================================
   PROFILE
   ========================================================= */

if(profileBtn){

    profileBtn.addEventListener(
        "click",
        ()=>{

            window.location.href =
                "profile.html";

        }
    );

}


/* =========================================================
   LOGOUT
   ========================================================= */

if(logoutBtn){

    logoutBtn.addEventListener(
        "click",
        async()=>{

            try{

                if(
                    window.RiderXCustomerAuth &&
                    typeof
                    window.RiderXCustomerAuth.logout ===
                    "function"
                ){

                    await
                    window.RiderXCustomerAuth.logout();

                }

                else{

                    const firebaseModule =
                        await import(
                            "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
                        );

                    const configModule =
                        await import(
                            "../firebase/firebase-config.js"
                        );

                    await firebaseModule.signOut(
                        configModule.auth
                    );

                }


                window.location.href =
                    "../auth/login.html";

            }

            catch(error){

                console.error(
                    "Logout error:",
                    error
                );

                showToast(
                    "Logout failed",
                    "error"
                );

            }

        }
    );

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;


window.RiderXToast =
function(
    message,
    type="info"
){

    showToast(
        message,
        type
    );

};


function showToast(
    message,
    type="info"
){

    if(!toast){
        return;
    }


    clearTimeout(
        toastTimer
    );


    toast.classList.remove(
        "success",
        "error"
    );


    if(type === "success"){

        toast.classList.add(
            "success"
        );

        toastIcon.className =
            "fa-solid fa-circle-check";

    }

    else if(type === "error"){

        toast.classList.add(
            "error"
        );

        toastIcon.className =
            "fa-solid fa-circle-exclamation";

    }

    else{

        toastIcon.className =
            "fa-solid fa-circle-info";

    }


    toastText.innerText =
        message;


    toast.classList.add(
        "show"
    );


    toastTimer =
        setTimeout(
            ()=>{
                toast.classList.remove(
                    "show"
                );
            },
            2600
        );

}


/* =========================================================
   ESC KEY
   ========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key ===
            "Escape"
        ){

            closeSearch();

            closeMenuPanel();

        }

    }
);


/* =========================================================
   CUSTOMER AUTH UI
   ========================================================= */

window.addEventListener(
    "riderx:user-ready",
    event=>{

        const user =
            event.detail?.user;

        if(!user){
            return;
        }


        const name =
            user.displayName ||
            user.email?.split("@")[0] ||
            "Customer";


        const email =
            user.email ||
            "";


        const menuName =
            document.getElementById(
                "menuUserName"
            );

        const menuEmail =
            document.getElementById(
                "menuUserEmail"
            );


        if(menuName){
            menuName.innerText =
                name;
        }


        if(menuEmail){
            menuEmail.innerText =
                email;
        }


        const greeting =
            document.getElementById(
                "greetingTitle"
            );


        if(greeting){

            greeting.innerText =
                "Where are you going, " +
                name.split(" ")[0] +
                "?";

        }

    }
);


/* =========================================================
   RIDE CREATED
   ========================================================= */

window.addEventListener(
    "riderx:ride-created",
    event=>{

        const rideId =
            event.detail?.rideId;

        if(!rideId){
            return;
        }


        showToast(
            "Ride request sent",
            "success"
        );


        const status =
            document.getElementById(
                "bookingStatus"
            );


        if(status){

            status.innerText =
                "Finding a nearby RiderX rider...";

        }

    }
);


/* =========================================================
   RIDE STATUS
   ========================================================= */

window.addEventListener(
    "riderx:ride-status",
    event=>{

        const status =
            String(
                event.detail?.status ||
                ""
            ).toUpperCase();


        if(!status){
            return;
        }


        if(status === "ACCEPTED"){

            showToast(
                "Rider accepted your ride",
                "success"
            );

        }

        else if(
            status === "ARRIVING"
        ){

            showToast(
                "Your rider is arriving",
                "success"
            );

        }

        else if(
            status === "STARTED"
        ){

            showToast(
                "Ride started",
                "success"
            );

        }

        else if(
            status === "COMPLETED"
        ){

            showToast(
                "Ride completed",
                "success"
            );

        }

        else if(
            status === "CANCELLED"
        ){

            showToast(
                "Ride cancelled",
                "error"
            );

        }

    }
);


/* =========================================================
   INITIAL UI
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    ()=>{

        const notificationDot =
            document.getElementById(
                "notificationDot"
            );


        /*
         * Keep notification dot hidden initially.
         * Notification engine will enable it later.
         */

        if(notificationDot){

            notificationDot.classList.remove(
                "show"
            );

        }

    }
);

})();

</script>
