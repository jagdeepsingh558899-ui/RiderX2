<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Customer</title>


<link rel="stylesheet" href="../assets/app.css">


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>


body{

margin:0;
background:#000;
color:white;
font-family:Arial,sans-serif;

}



.header{

height:65px;
background:#111;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;

}



.logo{

font-size:28px;
font-weight:900;

}


.logo span{

color:#FFD600;

}



#map{

height:40vh;
width:100%;

}



.sheet{

background:#111;
border-radius:25px 25px 0 0;
padding:20px;
margin-top:-20px;
position:relative;

}



.services{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;

}



.service{

background:#000;
padding:12px 5px;
text-align:center;
border-radius:15px;
border:1px solid #333;
font-size:12px;

}



.service.active{

background:#FFD600;
color:#000;

}



.input{

width:100%;
padding:14px;
margin:8px 0;
border-radius:12px;
background:#000;
border:1px solid #333;
color:white;

}



.fare{

display:flex;
justify-content:space-between;
align-items:center;
background:#000;
padding:15px;
border-radius:15px;

}



#fare{

color:#FFD600;
font-size:24px;
font-weight:bold;

}



.btn{

width:100%;
padding:16px;
margin-top:15px;
background:#FFD600;
color:#000;
border:none;
border-radius:15px;
font-weight:bold;
font-size:17px;

}



.bottom{

position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 0;

}



.bottom div{

text-align:center;
font-size:12px;
color:#aaa;

}


.bottom i{

display:block;
font-size:20px;
margin-bottom:5px;

}



</style>


</head>


<body>



<header class="header">


<div class="logo">
RID<span>ERX</span>
</div>


<i class="fa-solid fa-user"></i>


</header>





<div id="map"></div>





<div class="sheet">





<div class="services">


<div class="service active">
<i class="fa-solid fa-motorcycle"></i>
<br>
Bike
</div>


<div class="service">
<i class="fa-solid fa-car"></i>
<br>
Cab
</div>


<div class="service">
<i class="fa-solid fa-box"></i>
<br>
Parcel
</div>


<div class="service">
<i class="fa-solid fa-utensils"></i>
<br>
Food
</div>


</div>





<input 
class="input"
id="pickup"
placeholder="Pickup Location"
value="Current Location">





<input 
class="input"
id="drop"
placeholder="Where to go?">





<div class="fare">


<div>

Small Ride Estimate

</div>


<div id="fare">

₹0

</div>


</div>






<select class="input" id="payment">


<option>
💵 Cash
</option>


<option>
📱 UPI / Online
</option>


<option>
💳 RiderX Wallet
</option>


</select>






<button class="btn" id="bookRide">

<i class="fa-solid fa-paper-plane"></i>

Book Ride

</button>




</div>







<!-- Bottom Menu -->


<div class="bottom">


<div>
<i class="fa-solid fa-house"></i>
Home
</div>


<div>
<i class="fa-solid fa-clock"></i>
History
</div>


<div>
<i class="fa-solid fa-wallet"></i>
Wallet
</div>


<div>
<i class="fa-solid fa-user"></i>
Profile
</div>


</div>







<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script>


// Chandigarh Map


const map =
L.map('map').setView(
[30.7333,76.7794],
13
);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);





let fare = 0;



document.getElementById("bookRide").onclick=function(){


alert(
"Searching nearby RiderX riders..."
);


};




</script>



</body>

</html>
