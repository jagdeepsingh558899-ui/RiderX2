<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Home</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="splash">


<h1>
Rider<span>X</span>
</h1>


<h2>
Book Your Ride
</h2>


<div class="card">

<h3>Choose Service</h3>


<button onclick="bookRide('Bike')">
🏍 Bike Ride
</button>


<button onclick="bookRide('Cab')">
🚕 Cab Ride
</button>


<button onclick="bookRide('Parcel')">
📦 Parcel
</button>


</div>



<p id="status"></p>


</div>



<script>


function bookRide(type){


document.getElementById("status").innerHTML =

type + " Ride Request Sent 🚀";


}



</script>
