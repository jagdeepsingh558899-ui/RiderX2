<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX</title>

<link rel="stylesheet" href="../css/style.css">


<style>

.logo{

width:100px;
height:100px;
object-fit:cover;
border-radius:50%;

}


.banner{

background:#1d1d1d;
padding:20px;
border-radius:15px;
margin-top:20px;

}


button{

width:100%;
padding:15px;
margin-top:20px;
background:#ffcc00;
border:none;
border-radius:10px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="header" id="appName">

RiderX

</div>



<div class="container">


<img id="logo"
class="logo"
src="../assets/logo.png">



<div class="banner" id="banner">

Welcome to RiderX 🚕

</div>




<button onclick="goBooking()">

🚕 Book Ride

</button>



</div>





<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





async function loadApp(){



let snap=await getDoc(

doc(db,"settings","app")

);



if(snap.exists()){


let data=snap.data();



if(data.appName){


document.getElementById("appName").innerHTML=

data.appName;


document.title=data.appName;


}




if(data.logo){


document.getElementById("logo").src=

data.logo;


}



if(data.banner){


document.getElementById("banner").innerHTML=

data.banner;


}



}



}





window.goBooking=function(){


window.location.href="booking.html";


}





loadApp();



</script>


</body>

</html>
