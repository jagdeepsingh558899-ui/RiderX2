></script><script type="module">

import {
    realtimeDb,
    ref,
    get,
    update,
    onValue,
    off
} from "../firebase/firebase-config.js";


/* =========================================================
   RIDERX CUSTOMER LIVE TRACKING
========================================================= */

let rideData = {};

let mapInstance = null;

let riderMarker = null;
let customerMarker = null;
let pickupMarker = null;
let destinationMarker = null;

let routeLine = null;

let rideReference = null;
let rideListener = null;

let locationReference = null;
let locationListener = null;

let riderPhone = "";

let riderPosition = null;
let customerPosition = null;

let toastTimer = null;
let redirectTimer = null;

let lastToastStatus = "";

let mapHasFitted = false;

let customerWatchId = null;


/* =========================================================
   DEFAULT RIDE
========================================================= */

const defaultRide = {

    id:"",
    rideId:"",

    service:"Bike Taxi",

    status:"searching",
    rideStatus:"searching",

    fare:0,
    total:0,
    amount:0,

    paymentMethod:"Cash",

    pickup:"",
    destination:"",

    pickupAddress:"",
    destinationAddress:"",

    distance:"",
    distanceKm:0,

    riderName:"",
    driverName:"",

    riderPhoto:"",
    driverPhoto:"",

    vehicle:"",
    vehicleType:"",
    vehicleNumber:"",

    riderRating:"",
    driverRating:"",

    riderPhone:"",
    driverPhone:"",

    riderLat:null,
    riderLng:null,

    driverLat:null,
    driverLng:null,

    pickupLat:null,
    pickupLng:null,

    destinationLat:null,
    destinationLng:null,

    customerLat:null,
    customerLng:null,

    eta:null,
    etaMinutes:null,

    createdAt:0,
    updatedAt:0

};


/* =========================================================
   DOM
========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   URL PARAM
========================================================= */

function getParam(name){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get(name);

}


/* =========================================================
   LOAD LOCAL RIDE
========================================================= */

function loadLocalRide(){

    rideData = {
        ...defaultRide
    };


    const urlId =
        getParam("rideId") ||
        getParam("id");


    if(urlId){

        rideData.id =
            urlId;

        rideData.rideId =
            urlId;

    }


    const keys = [

        "currentRide",
        "activeRide",
        "riderxCurrentRide",
        "rideData",
        "lastRide"

    ];


    for(const key of keys){

        try{

            const raw =
                localStorage.getItem(key);


            if(!raw){

                continue;

            }


            const data =
                JSON.parse(raw);


            if(
                !data ||
                typeof data !== "object"
            ){

                continue;

            }


            const localId =
                data.id ||
                data.rideId ||
                "";


            if(
                urlId &&
                localId &&
                String(localId) !==
                String(urlId)
            ){

                continue;

            }


            rideData = {

                ...rideData,
                ...data

            };


            break;

        }catch(error){

            console.warn(
                "RiderX local ride read failed:",
                error
            );

        }

    }


    if(urlId){

        rideData.id =
            urlId;

        rideData.rideId =
            urlId;

    }


    renderRide();

}


/* =========================================================
   GET RIDE ID
========================================================= */

function getRideId(){

    return (
        rideData.id ||
        rideData.rideId ||
        getParam("rideId") ||
        getParam("id") ||
        ""
    );

}


/* =========================================================
   SAVE LOCAL RIDE
========================================================= */

function saveLocalRide(){

    try{

        const serialized =
            JSON.stringify(
                rideData
            );


        localStorage.setItem(
            "currentRide",
            serialized
        );

        localStorage.setItem(
            "activeRide",
            serialized
        );

        localStorage.setItem(
            "riderxCurrentRide",
            serialized
        );

    }catch(error){

        console.warn(
            "RiderX local ride save failed:",
            error
        );

    }

}


/* =========================================================
   MERGE RIDE DATA
========================================================= */

function mergeRideData(data){

    if(
        !data ||
        typeof data !== "object"
    ){

        return;

    }


    rideData = {

        ...rideData,
        ...data

    };


    if(
        data.rider &&
        typeof data.rider === "object"
    ){

        rideData.rider = {

            ...(rideData.rider || {}),
            ...data.rider

        };

    }


    if(
        data.driver &&
        typeof data.driver === "object"
    ){

        rideData.driver = {

            ...(rideData.driver || {}),
            ...data.driver

        };

    }


    if(
        data.customer &&
        typeof data.customer === "object"
    ){

        rideData.customer = {

            ...(rideData.customer || {}),
            ...data.customer

        };

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderRide(){

    const rideId =
        getRideId();


    $("rideId").textContent =
        rideId || "—";


    const fare =
        getNumber(
            rideData.fare,
            rideData.total,
            rideData.amount,
            rideData.price
        );


    $("fare").textContent =
        fare > 0
            ? "₹" + Math.round(fare)
            : "—";


    $("distance").textContent =
        formatDistance(
            rideData.distanceKm ??
            rideData.distance
        );


    $("payment").textContent =
        formatPayment(
            rideData.paymentMethod ||
            rideData.payment ||
            "Cash"
        );


    $("pickup").textContent =
        getLocationText(
            rideData.pickup,
            rideData.pickupAddress,
            rideData.from
        );


    $("destination").textContent =
        getLocationText(
            rideData.destination,
            rideData.destinationAddress,
            rideData.to
        );


    renderDriver();

    updateStatus();

    updateAllCoordinates();

}


/* =========================================================
   LOCATION TEXT
========================================================= */

function getLocationText(
    value,
    address,
    fallback
){

    if(
        value &&
        typeof value === "object"
    ){

        return (
            value.address ||
            value.name ||
            value.label ||
            address ||
            fallback ||
            "Location"
        );

    }


    return (
        value ||
        address ||
        fallback ||
        "Location"
    );

}


/* =========================================================
   DRIVER
========================================================= */

function renderDriver(){

    const rider =
        rideData.rider || {};

    const driver =
        rideData.driver || {};


    const name =
        rideData.riderName ||
        rideData.driverName ||
        rider.name ||
        rider.fullName ||
        driver.name ||
        driver.fullName ||
        "";


    const status =
        normalizeStatus(
            rideData.status ||
            rideData.rideStatus
        );


    const finalName =
        name ||
        (
            status === "searching"
                ? "Finding rider..."
                : "RiderX Partner"
        );


    $("driverName").textContent =
        finalName;


    const vehicle =
        rideData.vehicleNumber ||
        rideData.vehicle ||
        rideData.vehicleType ||
        rider.vehicleNumber ||
        rider.vehicle ||
        rider.vehicleType ||
        driver.vehicleNumber ||
        driver.vehicle ||
        driver.vehicleType ||
        "";


    $("driverVehicle").textContent =
        vehicle ||
        (
            status === "searching"
                ? "Waiting for rider acceptance"
                : "Rider"
        );


    $("driverRating").textContent =
        rideData.riderRating ||
        rideData.driverRating ||
        rider.rating ||
        driver.rating ||
        "—";


    riderPhone =
        rideData.riderPhone ||
        rideData.driverPhone ||
        rideData.phone ||
        rider.phone ||
        rider.mobile ||
        driver.phone ||
        driver.mobile ||
        "";


    const photo =
        rideData.riderPhoto ||
        rideData.driverPhoto ||
        rideData.photoURL ||
        rider.photo ||
        rider.photoURL ||
        driver.photo ||
        driver.photoURL ||
        "";


    const image =
        $("driverPhoto");

    const initial =
        $("driverInitial");


    if(photo){

        image.src =
            photo;

        image.style.display =
            "block";

        initial.style.display =
            "none";

        image.onerror =
            function(){

                image.style.display =
                    "none";

                initial.style.display =
                    "block";

                initial.textContent =
                    finalName
                        .charAt(0)
                        .toUpperCase();

            };

    }else{

        image.removeAttribute(
            "src"
        );

        image.style.display =
            "none";

        initial.style.display =
            "block";

        initial.textContent =
            finalName
                .charAt(0)
                .toUpperCase();

    }


    const enabled =
        [
            "accepted",
            "arriving",
            "started"
        ].includes(status);


    $("callBtn").disabled =
        !enabled ||
        !riderPhone;


    $("chatBtn").disabled =
        !enabled;

}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    const status =
        normalizeStatus(
            rideData.status ||
            rideData.rideStatus ||
            rideData.state ||
            "searching"
        );


    const title =
        $("arrivalTitle");

    const text =
        $("arrivalText");

    const time =
        $("arrivalTime");

    const card =
        $("arrivalCard");


    card.classList.remove(
        "accepted",
        "started",
        "cancelled"
    );


    $("cancelBtn").style.display =
        "block";


    if(status === "searching"){

        title.textContent =
            "Finding your rider";

        text.textContent =
            "RiderX is searching nearby.";

        time.textContent =
            "…";

        setLiveIndicator(
            true,
            "SEARCHING"
        );

        return;

    }


    if(status === "accepted"){

        card.classList.add(
            "accepted"
        );

        title.textContent =
            "Rider accepted";

        text.textContent =
            "Your rider is heading towards pickup.";

        time.textContent =
            getEta();

        setLiveIndicator(
            true,
            "RIDER ACCEPTED"
        );

        return;

    }


    if(status === "arriving"){

        card.classList.add(
            "accepted"
        );

        title.textContent =
            "Rider is arriving";

        text.textContent =
            "Your rider is on the way to pickup.";

        time.textContent =
            getEta();

        setLiveIndicator(
            true,
            "RIDER LIVE"
        );

        return;

    }


    if(status === "started"){

        card.classList.add(
            "started"
        );

        title.textContent =
            "Ride in progress";

        text.textContent =
            "Your trip has started.";

        time.textContent =
            "ON";

        setLiveIndicator(
            true,
            "TRIP LIVE"
        );

        $("cancelBtn").style.display =
            "none";

        return;

    }


    if(status === "completed"){

        title.textContent =
            "Ride completed";

        text.textContent =
            "Your RiderX trip has finished.";

        time.textContent =
            "✓";

        setLiveIndicator(
            false,
            "COMPLETED"
        );

        $("cancelBtn").style.display =
            "none";

        return;

    }


    if(status === "cancelled"){

        card.classList.add(
            "cancelled"
        );

        title.textContent =
            "Ride cancelled";

        text.textContent =
            "This ride has been cancelled.";

        time.textContent =
            "✕";

        setLiveIndicator(
            false,
            "CANCELLED"
        );

        $("cancelBtn").style.display =
            "none";

        return;

    }


    title.textContent =
        "Finding your rider";

    text.textContent =
        "RiderX is searching nearby.";

    time.textContent =
        "…";

}


/* =========================================================
   STATUS NORMALIZE
========================================================= */

function normalizeStatus(status){

    const value =
        String(status || "")
            .toLowerCase()
            .replace(/[_-]/g," ")
            .trim();


    if(
        value.includes("cancel")
    ){

        return "cancelled";

    }


    if(
        value.includes("complete") ||
        value.includes("finish") ||
        value.includes("ended")
    ){

        return "completed";

    }


    if(
        value.includes("start") ||
        value.includes("ongoing") ||
        value.includes("in progress") ||
        value.includes("on trip") ||
        value.includes("trip started")
    ){

        return "started";

    }


    if(
        value.includes("arriv")
    ){

        return "arriving";

    }


    if(
        value.includes("accept") ||
        value.includes("confirm") ||
        value === "assigned"
    ){

        return "accepted";

    }


    if(
        value.includes("search") ||
        value.includes("pending") ||
        value.includes("request") ||
        value === "idle" ||
        value === ""
    ){

        return "searching";

    }


    return "searching";

}


/* =========================================================
   ETA
========================================================= */

function getEta(){

    const eta =
        getNumber(
            rideData.etaMinutes,
            rideData.arrivalMinutes,
            rideData.eta
        );


    if(eta > 0){

        return (
            Math.round(eta) +
            " min"
        );

    }


    return "ETA";

}


/* =========================================================
   COORDINATE EXTRACTION
========================================================= */

function getCoordinatePair(
    source
){

    if(
        !source ||
        typeof source !== "object"
    ){

        return null;

    }


    const lat =
        getNumberOrNull(
            source.lat,
            source.latitude,
            source.location?.lat,
            source.location?.latitude
        );


    const lng =
        getNumberOrNull(
            source.lng,
            source.lon,
            source.longitude,
            source.location?.lng,
            source.location?.lon,
            source.location?.longitude
        );


    if(
        lat === null ||
        lng === null
    ){

        return null;

    }


    if(
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
    ){

        return null;

    }


    return {
        lat,
        lng
    };

}


/* =========================================================
   RIDER POSITION
========================================================= */

function getRiderPosition(){

    const rider =
        rideData.rider ||
        {};

    const driver =
        rideData.driver ||
        {};


    const direct =
        getCoordinatePair({

            lat:
                rideData.riderLat ??
                rideData.driverLat ??
                rideData.lat ??
                rideData.latitude,

            lng:
                rideData.riderLng ??
                rideData.driverLng ??
                rideData.lng ??
                rideData.longitude

        });


    if(direct){

        return direct;

    }


    return (
        getCoordinatePair(rider) ||
        getCoordinatePair(driver)
    );

}

/* =========================================================
   UPDATE ALL COORDINATES
========================================================= */

function updateAllCoordinates(){

    riderPosition =
        getRiderPosition();


    const pickupPosition =
        getPickupPosition();


    const destinationPosition =
        getDestinationPosition();


    const savedCustomer =
        getCustomerPosition();


    if(savedCustomer){

        customerPosition =
            savedCustomer;

    }


    if(
        riderPosition
    ){

        updateRiderMarker(
            riderPosition.lat,
            riderPosition.lng
        );

    }


    if(
        customerPosition
    ){

        updateCustomerMarker(
            customerPosition.lat,
            customerPosition.lng
        );

    }


    if(
        pickupPosition
    ){

        updatePickupMarker(
            pickupPosition.lat,
            pickupPosition.lng
        );

    }


    if(
        destinationPosition
    ){

        updateDestinationMarker(
            destinationPosition.lat,
            destinationPosition.lng
        );

    }


    drawRoute();


    fitMapToRide(
        false
    );

}

/* =========================================================
   SETUP MAP
========================================================= */

function setupMap(){

    if(
        typeof L === "undefined"
    ){

        showFirebaseStatus(
            "Map library unavailable"
        );

        return;

    }


    if(mapInstance){

        mapInstance.invalidateSize();

        return;

    }


    const rider =
        getRiderPosition();

    const customer =
        getCustomerPosition();

    const pickup =
        getPickupPosition();

    const destination =
        getDestinationPosition();


    const initial =
        rider ||
        customer ||
        pickup ||
        destination ||
        {
            lat:30.7333,
            lng:76.7794
        };


    try{

        mapInstance =
            L.map(
                "realMap",
                {
                    zoomControl:false,
                    attributionControl:true
                }
            )
            .setView(
                [
                    initial.lat,
                    initial.lng
                ],
                rider ||
                customer ||
                pickup ||
                destination
                    ? 15
                    : 12
            );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom:19,
                minZoom:3,
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        )
        .addTo(
            mapInstance
        );


        updateAllCoordinates();


        setTimeout(
            function(){

                if(mapInstance){

                    mapInstance.invalidateSize();

                    fitMapToRide(
                        true
                    );

                }

            },
            250
        );


    }catch(error){

        console.error(
            "RiderX map initialization failed:",
            error
        );


        showFirebaseStatus(
            "Map failed to load"
        );

    }

}

/* =========================================================
   ROUTE LINE
========================================================= */

function drawRoute(){

    if(!mapInstance){

        return;

    }


    const points = [];


    if(customerPosition){

        points.push([
            customerPosition.lat,
            customerPosition.lng
        ]);

    }


    if(
        !customerPosition
    ){

        const pickup =
            getPickupPosition();

        if(pickup){

            points.push([
                pickup.lat,
                pickup.lng
            ]);

        }

    }


    if(riderPosition){

        points.push([
            riderPosition.lat,
            riderPosition.lng
        ]);

    }


    const destination =
        getDestinationPosition();


    /*
       This is only a visual tracking line.
       Actual road navigation can be added later
       through a routing provider.
    */

    if(
        points.length < 2
    ){

        if(routeLine){

            mapInstance.removeLayer(
                routeLine
            );

            routeLine = null;

        }

        return;

    }


    if(routeLine){

        routeLine.setLatLngs(
            points
        );

    }else{

        routeLine =
            L.polyline(
                points,
                {
                    color:"#FFD400",
                    weight:4,
                    opacity:.85,
                    dashArray:"8 8"
                }
            )
            .addTo(
                mapInstance
            );

    }

}


/* =========================================================
   FIT MAP
========================================================= */

function fitMapToRide(
    force
){

    if(
        !mapInstance
    ){

        return;

    }


    const points = [];


    if(riderPosition){

        points.push([
            riderPosition.lat,
            riderPosition.lng
        ]);

    }


    if(customerPosition){

        points.push([
            customerPosition.lat,
            customerPosition.lng
        ]);

    }


    const pickup =
        getPickupPosition();


    if(pickup){

        points.push([
            pickup.lat,
            pickup.lng
        ]);

    }


    const destination =
        getDestinationPosition();


    if(destination){

        points.push([
            destination.lat,
            destination.lng
        ]);

    }


    if(!points.length){

        return;

    }


    if(
        mapHasFitted &&
        !force
    ){

        return;

    }


    if(points.length === 1){

        mapInstance.setView(
            points[0],
            15,
            {
                animate:true
            }
        );

        mapHasFitted =
            true;

        return;

    }


    try{

        const bounds =
            L.latLngBounds(
                points
            );


        mapInstance.fitBounds(
            bounds,
            {
                padding:
                    [55,55],

                maxZoom:15,

                animate:false
            }
        );


        mapHasFitted =
            true;

    }catch(error){

        console.warn(
            "RiderX map fit failed:",
            error
        );

    }

}

/* =========================================================
   CUSTOMER GPS
========================================================= */

function startCustomerLocation(){

    if(
        !navigator.geolocation
    ){

        return;

    }


    try{

        customerWatchId =
            navigator.geolocation.watchPosition(

                function(position){

                    const lat =
                        Number(
                            position.coords.latitude
                        );

                    const lng =
                        Number(
                            position.coords.longitude
                        );


                    if(
                        !Number.isFinite(lat) ||
                        !Number.isFinite(lng)
                    ){

                        return;

                    }


                    customerPosition = {
                        lat,
                        lng
                    };


                    /*
                       Do not overwrite the actual
                       pickup stored in the ride.
                       GPS is shown separately as
                       "Your location".
                    */

                    if(mapInstance){

                        updateCustomerMarker(
                            lat,
                            lng
                        );

                    }

                },

                function(error){

                    console.warn(
                        "RiderX customer location unavailable:",
                        error
                    );

                },

                {
                    enableHighAccuracy:true,
                    maximumAge:5000,
                    timeout:15000
                }

            );

    }catch(error){

        console.warn(
            "RiderX geolocation start failed:",
            error
        );

    }

}


/* =========================================================
   STOP CUSTOMER GPS
========================================================= */

function stopCustomerLocation(){

    if(
        customerWatchId !== null &&
        navigator.geolocation
    ){

        try{

            navigator.geolocation.clearWatch(
                customerWatchId
            );

        }catch(error){

            console.warn(
                "RiderX geolocation cleanup failed:",
                error
            );

        }

    }


    customerWatchId =
        null;

}


/* =========================================================
   FIREBASE RIDE LISTENER
========================================================= */

function startRideListener(){

    stopRideListener();


    const rideId =
        getRideId();


    if(!rideId){

        showFirebaseStatus(
            "Ride ID missing"
        );

        setLiveIndicator(
            false,
            "RIDE ID MISSING"
        );

        return;

    }


    if(!realtimeDb){

        showFirebaseStatus(
            "Firebase database unavailable"
        );

        setLiveIndicator(
            false,
            "OFFLINE"
        );

        return;

    }


    rideReference =
        ref(
            realtimeDb,
            "rides/" +
            rideId
        );


    showFirebaseStatus(
        "Connecting to live ride..."
    );


    rideListener =
        onValue(
            rideReference,
            function(snapshot){

                if(
                    !snapshot.exists()
                ){

                    showFirebaseStatus(
                        "Waiting for ride data..."
                    );

                    setLiveIndicator(
                        true,
                        "WAITING"
                    );

                    return;

                }


                const latest =
                    snapshot.val() || {};


                const latestId =
                    latest.id ||
                    latest.rideId ||
                    rideId;


                if(
                    latestId &&
                    rideId &&
                    String(latestId) !==
                    String(rideId)
                ){

                    console.warn(
                        "RiderX ignored unrelated ride update."
                    );

                    return;

                }


                const previousStatus =
                    normalizeStatus(
                        rideData.status ||
                        rideData.rideStatus
                    );


                mergeRideData(
                    latest
                );


                rideData.id =
                    rideId;

                rideData.rideId =
                    rideId;


                saveLocalRide();

                renderRide();

                setupMap();

                updateAllCoordinates();


                const newStatus =
                    normalizeStatus(
                        rideData.status ||
                        rideData.rideStatus
                    );


                if(
                    previousStatus !==
                    newStatus
                ){

                    handleStatusChange(
                        previousStatus,
                        newStatus
                    );

                }


                hideFirebaseStatus();

            },

            function(error){

                console.error(
                    "RiderX ride listener error:",
                    error
                );


                showFirebaseStatus(
                    "Live connection error"
                );


                setLiveIndicator(
                    false,
                    "RECONNECTING"
                );

            }

        );

}


/* =========================================================
   LIVE LOCATION LISTENER
   ---------------------------------------------------------
   Supports:
       rideLocations/{rideId}

   and merges live rider coordinates into
   the current ride without replacing the
   rest of the ride object.
========================================================= */

function startLocationListener(){

    stopLocationListener();


    const rideId =
        getRideId();


    if(
        !rideId ||
        !realtimeDb
    ){

        return;

    }


    locationReference =
        ref(
            realtimeDb,
            "rideLocations/" +
            rideId
        );


    locationListener =
        onValue(
            locationReference,
            function(snapshot){

                if(
                    !snapshot.exists()
                ){

                    return;

                }


                const location =
                    snapshot.val() || {};


                const lat =
                    getNumberOrNull(
                        location.lat,
                        location.latitude,
                        location.riderLat,
                        location.driverLat,
                        location.rider?.lat,
                        location.driver?.lat
                    );


                const lng =
                    getNumberOrNull(
                        location.lng,
                        location.lon,
                        location.longitude,
                        location.riderLng,
                        location.driverLng,
                        location.rider?.lng,
                        location.driver?.lng
                    );


                if(
                    lat === null ||
                    lng === null
                ){

                    return;

                }


                rideData.riderLat =
                    lat;

                rideData.riderLng =
                    lng;


                if(
                    !rideData.driverLat
                ){

                    rideData.driverLat =
                        lat;

                }


                if(
                    !rideData.driverLng
                ){

                    rideData.driverLng =
                        lng;

                }


                riderPosition = {
                    lat,
                    lng
                };


                saveLocalRide();

                updateRiderMarker(
                    lat,
                    lng
                );

                drawRoute();

            },

            function(error){

                console.warn(
                    "RiderX live location listener error:",
                    error
                );

            }

        );

}

/* =========================================================
   STATUS CHANGE
========================================================= */

function handleStatusChange(
    oldStatus,
    newStatus
){

    if(
        newStatus === "accepted"
    ){

        if(
            lastToastStatus !==
            "accepted"
        ){

            showToast(
                "🛵 Rider accepted your ride!"
            );

            lastToastStatus =
                "accepted";

        }

        return;

    }


    if(
        newStatus === "arriving"
    ){

        if(
            lastToastStatus !==
            "arriving"
        ){

            showToast(
                "Your rider is on the way."
            );

            lastToastStatus =
                "arriving";

        }

        return;

    }


    if(
        newStatus === "started"
    ){

        if(
            lastToastStatus !==
            "started"
        ){

            showToast(
                "Ride started."
            );

            lastToastStatus =
                "started";

        }

        return;

    }


    if(
        newStatus === "completed"
    ){

        showToast(
            "Ride completed."
        );

        return;

    }


    if(
        newStatus === "cancelled"
    ){

        showToast(
            "Ride has been cancelled."
        );

    }

}


/* =========================================================
   CALL DRIVER
========================================================= */

function callDriver(){

    const status =
        normalizeStatus(
            rideData.status ||
            rideData.rideStatus
        );


    if(
        ![
            "accepted",
            "arriving",
            "started"
        ].includes(status)
    ){

        showToast(
            "Please wait for a rider to accept."
        );

        return;

    }


    if(!riderPhone){

        showToast(
            "Rider phone number is not available."
        );

        return;

    }


    window.location.href =
        "tel:" +
        String(riderPhone)
            .replace(
                /[^\d+]/g,
                ""
            );

}


/* =========================================================
   CHAT
========================================================= */

function openChat(){

    const status =
        normalizeStatus(
            rideData.status ||
            rideData.rideStatus
        );


    if(
        ![
            "accepted",
            "arriving",
            "started"
        ].includes(status)
    ){

        showToast(
            "Chat will be available after rider accepts."
        );

        return;

    }


    const rideId =
        getRideId();


    window.location.href =
        "chat.html" +
        (
            rideId
                ? "?rideId=" +
                  encodeURIComponent(
                      rideId
                  )
                : ""
        );

}


/* =========================================================
   SHARE
========================================================= */

async function shareRide(){

    const id =
        getRideId();


    const text =
        "I'm currently riding with RiderX." +
        (
            id
                ? "\nRide ID: " +
                  id
                : ""
        );


    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:
                    "RiderX Live Ride",

                text:
                    text

            });

            return;

        }catch(error){

            if(
                error.name ===
                "AbortError"
            ){

                return;

            }

        }

    }


    try{

        await navigator.clipboard.writeText(
            text
        );

        showToast(
            "Ride details copied."
        );

    }catch(error){

        showToast(
            "Sharing is not available."
        );

    }

}


/* =========================================================
   CANCEL RIDE
========================================================= */

async function cancelRide(){

    const status =
        normalizeStatus(
            rideData.status ||
            rideData.rideStatus
        );


    if(
        [
            "completed",
            "cancelled",
            "started"
        ].includes(status)
    ){

        return;

    }


    const confirmed =
        window.confirm(
            "Are you sure you want to cancel this ride?"
        );


    if(!confirmed){

        return;

    }


    const rideId =
        getRideId();


    if(!rideId){

        showToast(
            "Ride ID is missing."
        );

        return;

    }


    const timestamp =
        Date.now();


    const updates = {

        status:"cancelled",

        rideStatus:"cancelled",

        cancelledBy:"customer",

        cancellationReason:
            "Customer cancelled",

        cancelledAt:
            timestamp,

        updatedAt:
            timestamp

    };


    try{

        if(
            realtimeDb
        ){

            await update(
                ref(
                    realtimeDb,
                    "rides/" +
                    rideId
                ),
                updates
            );


            try{

                await update(
                    ref(
                        realtimeDb,
                        "rideRequests/" +
                        rideId
                    ),
                    {
                        status:"cancelled",
                        rideStatus:"cancelled",
                        updatedAt:
                            timestamp
                    }
                );

            }catch(error){

                console.warn(
                    "RiderX request cancellation update failed:",
                    error
                );

            }

        }


        mergeRideData(
            updates
        );

        saveLocalRide();

        renderRide();


        showToast(
            "Ride cancelled."
        );


        clearTimeout(
            redirectTimer
        );


        redirectTimer =
            setTimeout(
                function(){

                    window.location.href =
                        "home.html";

                },
                1200
            );

    }catch(error){

        console.error(
            "RiderX cancellation failed:",
            error
        );


        showToast(
            "Unable to cancel ride. Please try again."
        );

    }

}

/* =========================================================
   NUMBER
========================================================= */

function getNumber(
    ...values
){

    for(
        const value of values
    ){

        if(
            value === null ||
            value === undefined ||
            value === ""
        ){

            continue;

        }


        const number =
            Number(
                String(value)
                    .replace(
                        /[^0-9.-]/g,
                        ""
                    )
            );


        if(
            Number.isFinite(number)
        ){

            return number;

        }

    }


    return 0;

}


/* =========================================================
   NUMBER OR NULL
========================================================= */

function getNumberOrNull(
    ...values
){

    for(
        const value of values
    ){

        if(
            value === null ||
            value === undefined ||
            value === ""
        ){

            continue;

        }


        const number =
            Number(
                String(value)
                    .replace(
                        /[^0-9.-]/g,
                        ""
                    )
            );


        if(
            Number.isFinite(number)
        ){

            return number;

        }

    }


    return null;

}


/* =========================================================
   DISTANCE
========================================================= */

function formatDistance(
    value
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "—";

    }


    const number =
        Number(
            String(value)
                .replace(
                    /[^0-9.]/g,
                    ""
                )
        );


    if(
        !Number.isFinite(number)
    ){

        return String(value);

    }


    return (
        number.toFixed(
            number < 10
                ? 1
                : 0
        ) +
        " km"
    );

}


/* =========================================================
   PAYMENT
========================================================= */

function formatPayment(
    value
){

    if(
        value &&
        typeof value === "object"
    ){

        value =
            value.method ||
            value.type ||
            "Cash";

    }


    const text =
        String(
            value || "Cash"
        );


    const lower =
        text.toLowerCase();


    if(
        lower.includes("cash")
    ){

        return "Cash";

    }


    if(
        lower.includes("wallet")
    ){

        return "RiderX Wallet";

    }


    if(
        lower.includes("upi")
    ){

        return "UPI";

    }


    if(
        lower.includes("online")
    ){

        return "Online";

    }


    return text;

}
