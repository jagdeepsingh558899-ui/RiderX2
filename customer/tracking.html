<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#FFD400"
>

<title>RiderX - Live Tracking</title>

<link
    rel="stylesheet"
    href="../css/style.css"
>

<link
    rel="stylesheet"
    href="../css/dashboard.css"
>

<link
    rel="stylesheet"
    href="../css/responsive.css"
>

<style>

/* ============================================================
   RIDERX CUSTOMER TRACKING
   FINAL LIVE TRACKING PAGE
   ============================================================ */

:root{
    --yellow:#FFD400;
    --yellow-dark:#d9b500;

    --bg:#080808;
    --card:#151515;
    --card-2:#1b1b1b;

    --border:#303030;
    --border-light:#3a3a3a;

    --muted:#777;
    --muted-2:#999;

    --green:#22c55e;
    --red:#ef4444;
    --white:#fff;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#050505;
}

body{
    color:#fff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button{
    font-family:inherit;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.app{
    width:100%;
    max-width:650px;
    min-height:100vh;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:var(--bg);
}


/* ============================================================
   HEADER
   ============================================================ */

.header{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:1000;

    display:flex;
    align-items:center;
    gap:10px;

    padding:12px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.88),
            rgba(0,0,0,.30),
            transparent
        );
}

.back-btn{
    width:40px;
    height:40px;
    min-width:40px;

    border:1px solid #3a3a3a;
    border-radius:50%;

    background:rgba(20,20,20,.92);
    color:#fff;

    font-size:24px;
    line-height:1;

    cursor:pointer;

    backdrop-filter:blur(12px);
}

.title-box{
    flex:1;

    min-width:0;

    padding:9px 12px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:13px;

    background:rgba(15,15,15,.86);

    backdrop-filter:blur(12px);
}

.title{
    font-size:11px;
    font-weight:900;
}

.subtitle{
    margin-top:3px;

    color:#777;

    font-size:7px;
}

.header-action{
    width:40px;
    height:40px;

    border:1px solid #3a3500;
    border-radius:12px;

    background:rgba(38,34,0,.92);
    color:var(--yellow);

    font-size:18px;

    cursor:pointer;

    backdrop-filter:blur(10px);
}


/* ============================================================
   MAP
   ============================================================ */

.map{
    position:relative;

    width:100%;
    height:67vh;

    min-height:430px;
    max-height:650px;

    overflow:hidden;

    background:#111;
}

#realMap{
    position:absolute;

    inset:0;

    z-index:1;

    width:100%;
    height:100%;
}


/* ============================================================
   MAP OVERLAYS
   ============================================================ */

.map-status{
    position:absolute;

    top:78px;
    left:13px;

    z-index:500;

    display:flex;
    align-items:center;
    gap:7px;

    padding:8px 11px;

    border:1px solid rgba(255,255,255,.13);
    border-radius:20px;

    background:rgba(15,15,15,.90);

    color:#fff;

    font-size:7px;
    font-weight:900;

    backdrop-filter:blur(12px);

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 9px rgba(34,197,94,.75);
}

.status-dot.waiting{
    background:var(--yellow);

    box-shadow:
        0 0 9px rgba(255,212,0,.75);
}

.status-dot.offline{
    background:var(--red);

    box-shadow:
        0 0 9px rgba(239,68,68,.65);
}


/* ============================================================
   MAP CONTROLS
   ============================================================ */

.map-controls{
    position:absolute;

    right:12px;
    bottom:105px;

    z-index:500;

    display:flex;
    flex-direction:column;
    gap:8px;
}

.map-control{
    width:42px;
    height:42px;

    border:1px solid #383838;
    border-radius:12px;

    background:rgba(20,20,20,.93);
    color:#fff;

    font-size:17px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    box-shadow:
        0 5px 18px rgba(0,0,0,.25);
}

.map-control.active{
    border-color:#756600;
    background:#292400;
    color:var(--yellow);
}


/* ============================================================
   CUSTOM LEAFLET MARKERS
   ============================================================ */

.rider-icon{
    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:3px solid #111;
    border-radius:50%;

    background:var(--yellow);

    color:#000;

    font-size:20px;

    box-shadow:
        0 4px 16px rgba(0,0,0,.55);

    position:relative;
}

.rider-icon::after{
    content:"";

    position:absolute;

    inset:-9px;

    border:2px solid rgba(255,212,0,.45);

    border-radius:50%;

    animation:riderPulse 2s infinite;
}

@keyframes riderPulse{

    0%{
        transform:scale(.8);
        opacity:.8;
    }

    70%{
        transform:scale(1.18);
        opacity:0;
    }

    100%{
        transform:scale(1.18);
        opacity:0;
    }

}

.pickup-icon{
    width:22px;
    height:22px;

    border:3px solid #111;
    border-radius:50% 50% 50% 0;

    background:var(--yellow);

    transform:rotate(-45deg);

    box-shadow:
        0 3px 10px rgba(0,0,0,.5);
}

.destination-icon{
    width:22px;
    height:22px;

    border:3px solid #111;
    border-radius:50%;

    background:#fff;

    box-shadow:
        0 3px 10px rgba(0,0,0,.5);
}


/* ============================================================
   MAP POPUP
   ============================================================ */

.leaflet-container{
    background:#111 !important;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.leaflet-control-zoom{
    display:none !important;
}

.leaflet-control-attribution{
    font-size:7px !important;

    background:rgba(0,0,0,.55) !important;
    color:#aaa !important;
}

.leaflet-control-attribution a{
    color:#aaa !important;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
    background:#181818;
    color:#fff;
}

.leaflet-popup-content{
    margin:10px 12px;

    font-size:11px;
}

.popup-title{
    font-weight:900;
}

.popup-sub{
    margin-top:4px;

    color:#999;

    font-size:9px;
}


/* ============================================================
   SHEET
   ============================================================ */

.sheet{
    position:relative;

    z-index:30;

    margin-top:-22px;

    min-height:360px;

    padding:10px 13px 30px;

    border:1px solid #303030;
    border-radius:24px 24px 0 0;

    background:#141414;

    box-shadow:
        0 -15px 35px rgba(0,0,0,.45);
}

.handle{
    width:40px;
    height:4px;

    margin:1px auto 14px;

    border-radius:20px;

    background:#484848;
}


/* ============================================================
   ARRIVAL
   ============================================================ */

.arrival{
    display:flex;
    align-items:center;

    gap:10px;

    padding:12px;

    border:1px solid #353100;
    border-radius:14px;

    background:#1e1b00;
}

.arrival-icon{
    width:39px;
    height:39px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:#302a00;
    color:var(--yellow);

    font-size:18px;
}

.arrival-info{
    flex:1;
    min-width:0;
}

.arrival-title{
    font-size:10px;
    font-weight:900;
}

.arrival-text{
    margin-top:4px;

    color:#8b8b8b;

    font-size:7px;
}

.arrival-time{
    color:var(--yellow);

    font-size:14px;
    font-weight:900;
}


/* ============================================================
   DRIVER
   ============================================================ */

.driver-card{
    margin-top:10px;

    padding:12px;

    border:1px solid #303030;
    border-radius:15px;

    background:var(--card);
}

.driver{
    display:flex;
    align-items:center;

    gap:10px;
}

.avatar{
    width:46px;
    height:46px;

    min-width:46px;

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#282828;
    color:var(--yellow);

    font-size:14px;
    font-weight:900;
}

.avatar img{
    width:100%;
    height:100%;

    display:none;

    object-fit:cover;
}

.driver-info{
    flex:1;

    min-width:0;
}

.driver-name{
    font-size:9px;
    font-weight:900;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.driver-meta{
    margin-top:4px;

    color:#777;

    font-size:7px;
}

.rating{
    color:var(--yellow);

    font-size:8px;
    font-weight:900;
}

.driver-actions{
    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:7px;

    margin-top:10px;
}

.driver-btn{
    height:38px;

    border:1px solid #363636;
    border-radius:10px;

    background:#202020;
    color:#fff;

    font-size:7px;
    font-weight:900;

    cursor:pointer;
}

.driver-btn.primary{
    border-color:#756600;

    background:#2b2600;

    color:var(--yellow);
}


/* ============================================================
   ROUTE
   ============================================================ */

.route-card{
    margin-top:10px;

    padding:12px;

    border:1px solid #303030;
    border-radius:15px;

    background:var(--card);
}

.section-title{
    margin-bottom:10px;

    color:#666;

    font-size:7px;
    font-weight:900;

    text-transform:uppercase;
}

.route{
    position:relative;

    padding-left:23px;
}

.route-line-small{
    position:absolute;

    left:6px;
    top:10px;
    bottom:10px;

    width:1px;

    background:#444;
}

.location{
    position:relative;

    padding-bottom:13px;
}

.location:last-child{
    padding-bottom:0;
}

.dot{
    position:absolute;

    left:-20px;
    top:1px;

    width:9px;
    height:9px;

    border:2px solid #111;
    border-radius:50%;

    background:var(--yellow);
}

.location.destination .dot{
    background:#fff;
}

.location-label{
    color:#666;

    font-size:6px;
    font-weight:900;

    text-transform:uppercase;
}

.location-name{
    margin-top:4px;

    color:#fff;

    font-size:7px;
    font-weight:800;

    line-height:1.4;
}


/* ============================================================
   RIDE INFO
   ============================================================ */

.ride-info{
    margin-top:10px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;
}

.info{
    padding:10px;

    border:1px solid #303030;
    border-radius:12px;

    background:#181818;
}

.info-label{
    color:#666;

    font-size:6px;
}

.info-value{
    margin-top:5px;

    color:#fff;

    font-size:8px;
    font-weight:900;
}


/* ============================================================
   CANCEL
   ============================================================ */

.cancel-btn{
    width:100%;

    height:43px;

    margin-top:10px;

    border:1px solid #542525;
    border-radius:11px;

    background:#211313;

    color:#ff7070;

    font-size:7px;
    font-weight:900;

    cursor:pointer;
}


/* ============================================================
   TOAST
   ============================================================ */

.toast{
    position:fixed;

    left:50%;
    bottom:24px;

    z-index:5000;

    width:calc(100% - 28px);
    max-width:500px;

    padding:11px 13px;

    transform:
        translate(-50%,20px);

    border:1px solid #333;
    border-radius:11px;

    background:#222;
    color:#fff;

    text-align:center;

    font-size:8px;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* ============================================================
   ERROR / LOADING
   ============================================================ */

.map-loading{
    position:absolute;

    inset:0;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#111;

    color:#888;

    font-size:10px;
}

.map-loading.hidden{
    display:none;
}

</style>

</head>


<body>

<div class="app">


    <!-- ======================================================
         HEADER
    ======================================================= -->

    <header class="header">

        <button
            class="back-btn"
            type="button"
            onclick="goBack()"
            aria-label="Back"
        >
            ‹
        </button>

        <div class="title-box">

            <div class="title">
                Live Ride Tracking
            </div>

            <div class="subtitle">
                RiderX real-time trip location
            </div>

        </div>

        <button
            class="header-action"
            type="button"
            onclick="centerMap()"
            aria-label="Center map"
        >
            ⌖
        </button>

    </header>


    <!-- ======================================================
         MAP
    ======================================================= -->

    <section
        class="map"
        id="mapArea"
    >

        <div
            id="realMap"
        ></div>

        <div
            class="map-loading"
            id="mapLoading"
        >
            Loading live map...
        </div>

        <div class="map-status">

            <span
                class="status-dot waiting"
                id="statusDot"
            ></span>

            <span id="mapStatusText">
                Connecting...
            </span>

        </div>


        <div class="map-controls">

            <button
                class="map-control"
                type="button"
                onclick="zoomIn()"
                aria-label="Zoom in"
            >
                +
            </button>

            <button
                class="map-control"
                type="button"
                onclick="zoomOut()"
                aria-label="Zoom out"
            >
                −
            </button>

            <button
                class="map-control active"
                id="locationBtn"
                type="button"
                onclick="centerMap()"
                aria-label="Center rider"
            >
                ⌖
            </button>

        </div>

    </section>


    <!-- ======================================================
         BOTTOM SHEET
    ======================================================= -->

    <section class="sheet">

        <div class="handle"></div>


        <!-- ARRIVAL -->

        <div class="arrival">

            <div class="arrival-icon">
                🛵
            </div>

            <div class="arrival-info">

                <div
                    class="arrival-title"
                    id="arrivalTitle"
                >
                    Connecting to ride
                </div>

                <div
                    class="arrival-text"
                    id="arrivalText"
                >
                    Getting live rider information...
                </div>

            </div>

            <div
                class="arrival-time"
                id="arrivalTime"
            >
                —
            </div>

        </div>


        <!-- DRIVER -->

        <div class="driver-card">

            <div class="driver">

                <div class="avatar">

                    <span id="driverInitial">
                        R
                    </span>

                    <img
                        id="driverPhoto"
                        alt="Rider"
                    >

                </div>

                <div class="driver-info">

                    <div
                        class="driver-name"
                        id="driverName"
                    >
                        RiderX Partner
                    </div>

                    <div
                        class="driver-meta"
                        id="driverVehicle"
                    >
                        Rider
                    </div>

                </div>

                <div class="rating">

                    ★
                    <span id="driverRating">
                        —
                    </span>

                </div>

            </div>


            <div class="driver-actions">

                <button
                    class="driver-btn primary"
                    id="callBtn"
                    type="button"
                    onclick="callDriver()"
                >
                    📞 CALL
                </button>

                <button
                    class="driver-btn"
                    id="chatBtn"
                    type="button"
                    onclick="openChat()"
                >
                    💬 CHAT
                </button>

                <button
                    class="driver-btn"
                    type="button"
                    onclick="shareRide()"
                >
                    ↗ SHARE
                </button>

            </div>

        </div>


        <!-- ROUTE -->

        <div class="route-card">

            <div class="section-title">
                Trip route
            </div>

            <div class="route">

                <div class="route-line-small"></div>


                <div class="location">

                    <div class="dot"></div>

                    <div class="location-label">
                        Pickup
                    </div>

                    <div
                        class="location-name"
                        id="pickup"
                    >
                        Pickup location
                    </div>

                </div>


                <div class="location destination">

                    <div class="dot"></div>

                    <div class="location-label">
                        Destination
                    </div>

                    <div
                        class="location-name"
                        id="destination"
                    >
                        Destination location
                    </div>

                </div>

            </div>

        </div>


        <!-- INFO -->

        <div class="ride-info">

            <div class="info">

                <div class="info-label">
                    RIDE ID
                </div>

                <div
                    class="info-value"
                    id="rideId"
                >
                    —
                </div>

            </div>

            <div class="info">

                <div class="info-label">
                    FARE
                </div>

                <div
                    class="info-value"
                    id="fare"
                >
                    —
                </div>

            </div>

            <div class="info">

                <div class="info-label">
                    DISTANCE
                </div>

                <div
                    class="info-value"
                    id="distance"
                >
                    —
                </div>

            </div>

            <div class="info">

                <div class="info-label">
                    PAYMENT
                </div>

                <div
                    class="info-value"
                    id="payment"
                >
                    Cash
                </div>

            </div>

        </div>


        <button
            class="cancel-btn"
            id="cancelBtn"
            type="button"
            onclick="cancelRide()"
        >
            ✕ CANCEL RIDE
        </button>

    </section>

</div>


<div
    class="toast"
    id="toast"
></div>


<!-- ==========================================================
     FIREBASE COMPAT
=========================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<!-- ==========================================================
     LEAFLET
=========================================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

    crossorigin=""
></script>


<script>

/* ============================================================
   RIDERX CUSTOMER TRACKING
   ============================================================ */

(function(){

"use strict";


/* ============================================================
   GLOBAL STATE
   ============================================================ */

let rideData = {};

let mapInstance = null;

let riderMarker = null;

let pickupMarker = null;

let destinationMarker = null;

let routeLine = null;

let riderAccuracyCircle = null;

let firebaseReady = false;

let database = null;

let firestore = null;

let auth = null;

let rideListeners = [];

let statusTimer = null;

let routeRequestTimer = null;

let lastRouteKey = "";

let riderPhone = "";

let currentStatus = "searching";

let mapCenteredOnce = false;

let lastRiderLat = null;

let lastRiderLng = null;


/* ============================================================
   DEFAULT RIDE
   ============================================================ */

const defaultRide = {

    id:"",

    rideId:"",

    service:"Bike Taxi",

    status:"searching",

    fare:0,

    total:0,

    amount:0,

    price:0,

    paymentMethod:"Cash",

    pickup:"",

    destination:"",

    pickupAddress:"",

    destinationAddress:"",

    from:"",

    to:"",

    distance:"",

    distanceKm:"",

    eta:"",

    etaMinutes:"",

    arrivalMinutes:"",

    riderName:"RiderX Partner",

    driverName:"",

    riderPhoto:"",

    driverPhoto:"",

    photoURL:"",

    vehicle:"",

    vehicleType:"",

    vehicleNumber:"",

    riderRating:"",

    driverRating:"",

    riderPhone:"",

    driverPhone:"",

    phone:"",

    riderId:"",

    driverId:"",

    customerId:"",

    userId:"",

    riderLat:null,

    riderLng:null,

    driverLat:null,

    driverLng:null,

    latitude:null,

    longitude:null,

    pickupLat:null,

    pickupLng:null,

    pickupLatitude:null,

    pickupLongitude:null,

    destinationLat:null,

    destinationLng:null,

    destinationLatitude:null,

    destinationLongitude:null

};


/* ============================================================
   URL PARAM
   ============================================================ */

function getParam(name){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get(name);

}


/* ============================================================
   NUMBER
   ============================================================ */

function getNumber(...values){

    for(
        const value of values
    ){

        if(
            value === null ||
            value === undefined ||
            value === ""
        ){

            continue;

        }

        const number =
            Number(
                String(value)
                    .replace(
                        /[^0-9.-]/g,
                        ""
                    )
            );

        if(
            Number.isFinite(number)
        ){

            return number;

        }

    }

    return 0;

}


/* ============================================================
   NUMBER OR NULL
   ============================================================ */

function getNumberOrNull(...values){

    for(
        const value of values
    ){

        if(
            value === null ||
            value === undefined ||
            value === ""
        ){

            continue;

        }

        if(
            typeof value === "object" &&
            value.latitude !== undefined
        ){

            const lat =
                Number(
                    value.latitude
                );

            if(
                Number.isFinite(lat)
            ){

                return lat;

            }

        }

        const number =
            Number(
                String(value)
                    .replace(
                        /[^0-9.-]/g,
                        ""
                    )
            );

        if(
            Number.isFinite(number)
        ){

            return number;

        }

    }

    return null;

}


/* ============================================================
   COORDINATE PAIR
   ============================================================ */

function getCoordinates(data, type){

    if(
        !data ||
        typeof data !== "object"
    ){

        return null;

    }


    const lower =
        String(type)
            .toLowerCase();


    if(
        lower === "rider"
    ){

        const lat =
            getNumberOrNull(
                data.riderLat,
                data.driverLat,
                data.riderLatitude,
                data.driverLatitude
            );

        const lng =
            getNumberOrNull(
                data.riderLng,
                data.driverLng,
                data.riderLongitude,
                data.driverLongitude
            );

        if(
            lat !== null &&
            lng !== null &&
            isValidCoordinate(lat,lng)
        ){

            return {
                lat,
                lng
            };

        }

    }


    if(
        lower === "pickup"
    ){

        const lat =
            getNumberOrNull(
                data.pickupLat,
                data.pickupLatitude,
                data.pickupLocation &&
                    data.pickupLocation.lat,
                data.pickupLocation &&
                    data.pickupLocation.latitude
            );

        const lng =
            getNumberOrNull(
                data.pickupLng,
                data.pickupLongitude,
                data.pickupLocation &&
                    data.pickupLocation.lng,
                data.pickupLocation &&
                    data.pickupLocation.longitude
            );

        if(
            lat !== null &&
            lng !== null &&
            isValidCoordinate(lat,lng)
        ){

            return {
                lat,
                lng
            };

        }

    }


    if(
        lower === "destination"
    ){

        const lat =
            getNumberOrNull(
                data.destinationLat,
                data.destinationLatitude,
                data.dropLat,
                data.dropLatitude,
                data.destinationLocation &&
                    data.destinationLocation.lat,
                data.destinationLocation &&
                    data.destinationLocation.latitude
            );

        const lng =
            getNumberOrNull(
                data.destinationLng,
                data.destinationLongitude,
                data.dropLng,
                data.dropLongitude,
                data.destinationLocation &&
                    data.destinationLocation.lng,
                data.destinationLocation &&
                    data.destinationLocation.longitude
            );

        if(
            lat !== null &&
            lng !== null &&
            isValidCoordinate(lat,lng)
        ){

            return {
                lat,
                lng
            };

        }

    }


    return null;

}


/* ============================================================
   VALID COORDINATE
   ============================================================ */

function isValidCoordinate(lat,lng){

    return (
        Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= -90 &&
        lat <= 90 &&
        lng >= -180 &&
        lng <= 180
    );

}


/* ============================================================
   LOAD RIDE
   ============================================================ */

function loadRide(){

    rideData = {
        ...defaultRide
    };


    const urlId =
        getParam("rideId") ||
        getParam("id");


    if(
        urlId
    ){

        rideData.id =
            urlId;

        rideData.rideId =
            urlId;

    }


    const keys = [

        "currentRide",

        "activeRide",

        "riderxCurrentRide",

        "rideData",

        "lastRide"

    ];


    for(
        const key of keys
    ){

        try{

            const raw =
                localStorage.getItem(key);


            if(
                !raw
            ){

                continue;

            }


            const data =
                JSON.parse(raw);


            if(
                data &&
                typeof data === "object"
            ){

                const storedId =
                    data.id ||
                    data.rideId;


                if(
                    urlId &&
                    storedId &&
                    String(storedId) !==
                    String(urlId)
                ){

                    continue;

                }


                rideData = {

                    ...rideData,

                    ...data

                };


                break;

            }

        }catch(error){

            console.warn(
                "Ride localStorage read failed:",
                error
            );

        }

    }


    renderRide();

    initializeMap();

    initializeFirebase();

}

function updateStatus(){

        );


    currentStatus =

    const title =

        );

        document.getElementById(
            "arrivalText"
        );

    const time =

        );

    const cancelBtn =
        document.getElementById(
            "cancelBtn"
        );

    const callBtn =
        document.getElementById(
            "callBtn"
        );

    const chatBtn =
        document.getElementById(
            "chatBtn"
        );


    cancelBtn.style.display =
        "";


    callBtn.disabled =
        false;

    chatBtn.disabled =
        false;


    if(
        status === "searching"
    ){

        title.textContent =
            "Finding your rider";

        text.textContent =
            "RiderX is searching nearby.";

        time.textContent =
            "…";

        callBtn.disabled =
            true;

        chatBtn.disabled =

        setMapStatus(

            "waiting"
        );

        return;

    }


    if(

    ){

        title.textContent =

        text.textContent =
            "Your rider is heading towards pickup.";

        time.textContent =
            getEta();

        setMapStatus(
            "Rider accepted",
            "live"
        );

        return;

    }


    if(
        status === "arriving"
    ){

        title.textContent =

        text.textContent =
            "Your rider is on the way to pickup.";

        time.textContent =
            getEta();

        setMapStatus(
            "Rider live",
            "live"
        );

        return;

    }


    if(
        status === "started"
    ){

        title.textContent =
            "Ride in progress";

        text.textContent =
            "Your trip has started.";

        time.textContent =
            "ON";

        setMapStatus(
            "Trip in progress",
            "live"
        );

        return;

    }


    if(
        status === "completed"
    ){

        title.textContent =
            "Ride completed";

        text.textContent =
            "Your RiderX trip has finished.";

        time.textContent =
            "✓";

        cancelBtn.style.display =

        );

    ){

        text.textContent =
            "This ride has been cancelled.";

        time.textContent =
            "✕";

        cancelBtn.style.display =
            "none";

        callBtn.disabled =
            true;

        chatBtn.disabled =
            true;

        setMapStatus(
            "Ride cancelled",
            "offline"
        );

    }

}


/* ============================================================
   NORMALIZE STATUS
   ============================================================ */

function normalizeStatus(status){

    const value =
        String(status)
            .toLowerCase()
            .replace(
                /[_-]/g,
                " "
            )
            .trim();


    if(
        value.includes("cancel")
    ){

        return "cancelled";

    }


    if(
        value.includes("complete") ||
        value.includes("finish") ||
        value.includes("ended")
    ){

        return "completed";

    }


    if(
        value.includes("start") ||
        value.includes("ongoing") ||
        value.includes("in progress") ||
        value.includes("on trip") ||
        value.includes("trip started")
    ){

        return "started";

    }


    if(
        value.includes("arriv")
    ){

        return "arriving";

    }


    if(
        value.includes("accept") ||
        value.includes("confirm") ||
        value === "assigned"
    ){

        return "accepted";

    }


    if(
        value.includes("search") ||
        value.includes("pending") ||
        value === "requested" ||
        value === "new"
    ){

        return "searching";

    }


    return "searching";

}


/* ============================================================
   ETA
   ============================================================ */

function getEta(){

    const eta =
        getNumber(
            rideData.eta,
            rideData.etaMinutes,
            rideData.arrivalMinutes
        );


    if(
        eta > 0
    ){

        return Math.ceil(eta) +
            " min";

    }


    if(
        lastRiderLat !== null &&
        lastRiderLng !== null
    ){

        const pickup =
            getCoordinates(
                rideData,
                "pickup"
            );


        if(
            pickup
        ){

            const distance =
                haversineKm(
                    lastRiderLat,
                    lastRiderLng,
                    pickup.lat,
                    pickup.lng
                );


            if(
                Number.isFinite(distance)
            ){

                const minutes =
                    Math.max(
                        1,
                        Math.round(
                            distance /
                            0.5
                        )
                    );


                return minutes +
                    " min";

            }

        }

    }


    return "—";

}


/* ============================================================

   ============================================================ */

function initializeMap(){

    if(
        typeof L === "undefined"
    ){

        document.getElementById(
            "mapLoading"
        ).textContent =
            "Map service unavailable.";

        return;

    }


    if(
        mapInstance
    ){

        return;

    }


    const rider =
        getCoordinates(
            rideData,
            "rider"
        );


    const pickup =
        getCoordinates(
            rideData,
            "pickup"
        );


    const destination =
        getCoordinates(
            rideData,
            "destination"
        );


    let initialCenter = null;


    if(
        rider
    ){

        initialCenter =
            rider;

    }else if(
        pickup
    ){

        initialCenter =
            pickup;

    }else if(
        destination
    ){

        initialCenter =
            destination;

    }else{

        /*
         * Do not force Chandigarh.
         * Wait for real ride coordinates.
         */

        initialCenter = {
            lat:20,
            lng:78
        };

    }


    try{

        mapInstance =
            L.map(
                "realMap",
                {
                    zoomControl:false,
                    attributionControl:true
                }
            )
            .setView(
                [
                    initialCenter.lat,
                    initialCenter.lng
                ],
                rider || pickup
                    ? 15
                    : 5
            );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom:19,

                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(
            mapInstance
        );


        document.getElementById(
            "mapLoading"
        ).classList.add(
            "hidden"
        );


        updateMapData();


        setTimeout(
            function(){

                mapInstance.invalidateSize();

            },
            300
        );


    }catch(error){

        console.error(
            "RiderX map initialization failed:",
            error
        );


        document.getElementById(
            "mapLoading"
        ).textContent =
            "Unable to load map.";

    }

}

        );

        getCoordinates(

        getCoordinates(

            rider

     */

    if(
        !mapCenteredOnce &&
        (
            rider ||
            pickup ||
            destination
        )
    ){

        fitRideBounds();

        mapCenteredOnce =
            true;

    }

/* ============================================================
   ROUTE
   ============================================================ */

function updateRoute(){

    if(
        !mapInstance
    ){

        return;

    }


    const pickup =
        getCoordinates(
            rideData,
            "pickup"
        );


    const destination =
        getCoordinates(
            rideData,
            "destination"
        );


    const rider =
        getCoordinates(
            rideData,
            "rider"
        );


    /*
     * Before ride starts:
     * Rider -> Pickup
     *
     * During ride:
     * Rider -> Destination
     */

    let start =
        null;

    let end =
        null;


    if(
        currentStatus === "started" &&
        rider &&
        destination
    ){

        start =
            rider;

        end =
            destination;

    }else if(
        rider &&
        pickup
    ){

        start =
            rider;

        end =
            pickup;

    }else if(
        pickup &&
        destination
    ){

        start =
            pickup;

        end =
            destination;

    }


    if(
        !start ||
        !end
    ){

        return;

    }


    const routeKey =
        [
            currentStatus,
            start.lat.toFixed(5),
            start.lng.toFixed(5),
            end.lat.toFixed(5),
            end.lng.toFixed(5)
        ].join("|");


    if(
        routeKey === lastRouteKey
    ){

        return;

    }


    lastRouteKey =
        routeKey;


    clearTimeout(
        routeRequestTimer
    );


    routeRequestTimer =
        setTimeout(
            function(){

                requestRoute(
                    start,
                    end
                );

            },
            250
        );

}


/* ============================================================
   REQUEST ROUTE
   ============================================================ */

async function requestRoute(start,end){

    try{

        const url =
            "https://router.project-osrm.org/route/v1/driving/" +
            encodeURIComponent(start.lng) +
            "," +
            encodeURIComponent(start.lat) +
            ";" +
            encodeURIComponent(end.lng) +
            "," +
            encodeURIComponent(end.lat) +
            "?overview=full&geometries=geojson";


        const response =
            await fetch(
                url,
                {
                    method:"GET"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Route request failed"
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !data.routes ||
            !data.routes.length
        ){

            throw new Error(
                "No route found"
            );

        }


        const route =
            data.routes[0];


        const coordinates =
            route.geometry.coordinates
                .map(
                    function(pair){

                        return [
                            pair[1],
                            pair[0]
                        ];

                    }
                );


        if(
            routeLine
        ){

            routeLine.setLatLngs(
                coordinates
            );

        }else{

            routeLine =
                L.polyline(
                    coordinates,
                    {
                        color:"#FFD400",

                        weight:5,

                        opacity:.88,

                        lineCap:"round",

                        lineJoin:"round"
                    }
                )
                .addTo(
                    mapInstance
                );

        }


        /*
         * Keep backend ride distance if already supplied.
         * Otherwise use route distance.
         */

        if(
            !rideData.distance &&
            !rideData.distanceKm &&
            route.distance
        ){

            rideData.distance =
                route.distance /
                1000;


            document.getElementById(
                "distance"
            ).textContent =
                formatDistance(
                    rideData.distance
                );

        }


        /*
         * Calculate rider ETA when rider is
         * heading to pickup.
         */

        if(
            currentStatus !== "started" &&
            route.duration
        ){

            const minutes =
                Math.max(
                    1,
                    Math.ceil(
                        route.duration /
                        60
                    )
                );


            rideData.etaMinutes =
                minutes;


            document.getElementById(
                "arrivalTime"
            ).textContent =
                minutes +
                " min";

        }

    }catch(error){

        console.warn(
            "RiderX route error:",
            error
        );

        /*
         * Do not remove the map.
         * Draw a direct fallback line only.
         */

        drawDirectRoute(
            start,
            end
        );

    }

}


/* ============================================================
   DIRECT ROUTE FALLBACK
   ============================================================ */

function drawDirectRoute(start,end){

    if(
        !mapInstance
    ){

        return;

    }


    const points = [

        [
            start.lat,
            start.lng
        ],

        [
            end.lat,
            end.lng
        ]

    ];


    if(
        routeLine
    ){

        routeLine.setLatLngs(
            points
        );

    }else{

        routeLine =
            L.polyline(
                points,
                {
                    color:"#FFD400",

                    weight:4,

                    opacity:.65,

                    dashArray:"8 8"
                }
            )
            .addTo(
                mapInstance
            );

    }

}


/* ============================================================
   FIT RIDE BOUNDS
   ============================================================ */

function fitRideBounds(){

    if(
        !mapInstance
    ){

        return;

    }


    const points = [];


    const rider =
        getCoordinates(
            rideData,
            "rider"
        );


    const pickup =
        getCoordinates(
            rideData,
            "pickup"
        );


    const destination =
        getCoordinates(
            rideData,
            "destination"
        );


    if(
        rider
    ){

        points.push(
            [
                rider.lat,
                rider.lng
            ]
        );

    }


    if(
        pickup
    ){

        points.push(
            [
                pickup.lat,
                pickup.lng
            ]
        );

    }


    if(
        destination
    ){

        points.push(
            [
                destination.lat,
                destination.lng
            ]
        );

    }


    if(
        !points.length
    ){

        return;

    }


    if(
        points.length === 1
    ){

        mapInstance.setView(
            points[0],
            15
        );

        return;

    }


    mapInstance.fitBounds(
        L.latLngBounds(
            points
        ),
        {
            padding:[
                60,
                60
            ],

            maxZoom:15,

            animate:true
        }
    );

}

/* ============================================================
   FIREBASE INITIALIZATION
   ============================================================ */

function initializeFirebase(){

    try{

        /*
         * RiderX firebase-config.js normally initializes
         * the Firebase application.
         */

        if(
            typeof firebase === "undefined"
        ){

            console.warn(
                "Firebase SDK unavailable."
            );

            startLocalSync();

            return;

        }


        if(
            firebase.apps &&
            firebase.apps.length
        ){

            firebaseReady =
                true;

        }else{

            /*
             * Do not create a fake Firebase
             * configuration here.
             *
             * Existing RiderX firebase-config.js
             * remains the source of truth.
             */

            firebaseReady =
                false;

        }


        if(
            firebaseReady
        ){

            auth =
                safeFirebaseService(
                    "auth"
                );


            database =
                safeFirebaseService(
                    "database"
                );


            firestore =
                safeFirebaseService(
                    "firestore"
                );


            subscribeToRide();

        }else{

            startLocalSync();

        }

    }catch(error){

        console.warn(
            "Firebase initialization:",
            error
        );

        startLocalSync();

    }

}


/* ============================================================
   FIREBASE SERVICE
   ============================================================ */

function safeFirebaseService(service){

    try{

        if(
            service === "auth" &&
            firebase.auth
        ){

            return firebase.auth();

        }


        if(
            service === "database" &&
            firebase.database
        ){

            return firebase.database();

        }


        if(
            service === "firestore" &&
            firebase.firestore
        ){

            return firebase.firestore();

        }

    }catch(error){

        console.warn(
            "Firebase service error:",
            service,
            error
        );

    }


    return null;

}


/* ============================================================
   SUBSCRIBE TO RIDE
   ============================================================ */

function subscribeToRide(){

    const rideId =
        rideData.id ||
        rideData.rideId;


    if(
        !rideId
    ){

        startLocalSync();

        return;

    }


    unsubscribeRide();


    let attached =
        false;


    /*
     * Firebase Realtime Database
     *
     * Supports common RiderX paths:
     *
     * rides/{rideId}
     * bookings/{rideId}
     * rideRequests/{rideId}
     */

    if(
        database
    ){

        const paths = [

            "rides/" + rideId,

            "bookings/" + rideId,

            "rideRequests/" + rideId

        ];


        paths.forEach(
            function(path){

                try{

                    const ref =
                        database.ref(
                            path
                        );


                    const handler =
                        function(snapshot){

                            const value =
                                snapshot.val();


                            if(
                                value &&
                                typeof value === "object"
                            ){

                                attached =
                                    true;

                                mergeLiveRide(
                                    value
                                );

                            }

                        };


                    ref.on(
                        "value",
                        handler
                    );


                    rideListeners.push({

                        type:"rtdb",

                        ref:ref,

                        handler:handler

                    });

                }catch(error){

                    console.warn(
                        "RTDB listener failed:",
                        path,
                        error
                    );

                }

            }
        );

    }


    /*
     * Firestore
     */

    if(
        firestore
    ){

        const collections = [

            "rides",

            "bookings",

            "rideRequests"

        ];


        collections.forEach(
            function(collection){

                try{

                    const unsubscribe =
                        firestore
                            .collection(collection)
                            .doc(String(rideId))
                            .onSnapshot(
                                function(snapshot){

                                    if(
                                        snapshot.exists
                                    ){

                                        attached =
                                            true;

                                        mergeLiveRide(
                                            snapshot.data()
                                        );

                                    }

                                },
                                function(error){

                                    console.warn(
                                        "Firestore ride listener:",
                                        collection,
                                        error
                                    );

                                }
                            );


                    rideListeners.push({

                        type:"firestore",

                        unsubscribe:unsubscribe

                    });

                }catch(error){

                    console.warn(
                        "Firestore listener failed:",
                        collection,
                        error
                    );

                }

            }
        );

    }


    /*
     * Always keep localStorage synchronization
     * active as a local fallback.
     */

    startLocalSync();


    if(
        !attached
    ){

        setMapStatus(
            "Waiting for rider",
            "waiting"
        );

    }

}


/* ============================================================
   MERGE LIVE RIDE
   ============================================================ */

function mergeLiveRide(latest){

    if(
        !latest ||
        typeof latest !== "object"
    ){

        return;

    }


    const latestId =
        latest.id ||
        latest.rideId;


    const currentId =
        rideData.id ||
        rideData.rideId;


    if(
        currentId &&
        latestId &&
        String(currentId) !==
        String(latestId)
    ){

        return;

    }


    rideData = {

        ...rideData,

        ...latest

    };


    /*
     * Handle nested rider object.
     */

    if(
        latest.rider &&
        typeof latest.rider === "object"
    ){

        rideData = {

            ...rideData,

            riderName:
                latest.rider.name ||
                rideData.riderName,

            riderPhone:
                latest.rider.phone ||
                rideData.riderPhone,

            riderPhoto:
                latest.rider.photoURL ||
                latest.rider.photo ||
                rideData.riderPhoto,

            riderRating:
                latest.rider.rating ||
                rideData.riderRating,

            vehicle:
                latest.rider.vehicle ||
                rideData.vehicle,

            vehicleNumber:
                latest.rider.vehicleNumber ||
                rideData.vehicleNumber,

            riderLat:
                latest.rider.lat ??
                latest.rider.latitude ??
                rideData.riderLat,

            riderLng:
                latest.rider.lng ??
                latest.rider.longitude ??
                rideData.riderLng

        };

    }


    /*
     * Handle nested driver object.
     */

    if(
        latest.driver &&
        typeof latest.driver === "object"
    ){

        rideData = {

            ...rideData,

            driverName:
                latest.driver.name ||
                rideData.driverName,

            driverPhone:
                latest.driver.phone ||
                rideData.driverPhone,

            driverPhoto:
                latest.driver.photoURL ||
                latest.driver.photo ||
                rideData.driverPhoto,

            driverRating:
                latest.driver.rating ||
                rideData.driverRating,

            vehicle:
                latest.driver.vehicle ||
                rideData.vehicle,

            vehicleNumber:
                latest.driver.vehicleNumber ||
                rideData.vehicleNumber,

            riderLat:
                latest.driver.lat ??
                latest.driver.latitude ??
                rideData.riderLat,

            riderLng:
                latest.driver.lng ??
                latest.driver.longitude ??
                rideData.riderLng

        };

    }


    saveRideLocally();

    renderRide();

}


/* ============================================================
   LOCAL SYNC
   ============================================================ */

function startLocalSync(){

    clearInterval(
        statusTimer
    );


    statusTimer =
        setInterval(
            function(){

                try{

                    const keys = [

                        "currentRide",

                        "activeRide",

                        "riderxCurrentRide",

                        "rideData"

                    ];


                    for(
                        const key of keys
                    ){

                        const raw =
                            localStorage.getItem(
                                key
                            );


                        if(
                            !raw
                        ){

                            continue;

                        }


                        const latest =
                            JSON.parse(raw);


                        if(
                            !latest ||
                            typeof latest !== "object"
                        ){

                            continue;

                        }


                        const currentId =
                            rideData.id ||
                            rideData.rideId;


                        const latestId =
                            latest.id ||
                            latest.rideId;


                        if(
                            currentId &&
                            latestId &&
                            String(currentId) !==
                            String(latestId)
                        ){

                            continue;

                        }


                        mergeLiveRide(
                            latest
                        );


                        break;

                    }

                }catch(error){

                    console.warn(
                        "Local ride sync failed:",
                        error
                    );

                }

            },
            2000
        );

}


/* ============================================================
   UNSUBSCRIBE
   ============================================================ */

function unsubscribeRide(){

    rideListeners.forEach(
        function(listener){

            try{

                if(
                    listener.type === "rtdb" &&
                    listener.ref &&
                    listener.handler
                ){

                    listener.ref.off(
                        "value",
                        listener.handler
                    );

                }


                if(
                    listener.type === "firestore" &&
                    listener.unsubscribe
                ){

                    listener.unsubscribe();

                }

            }catch(error){

                console.warn(
                    error
                );

            }

        }
    );


    rideListeners = [];

}


/* ============================================================
   SAVE RIDE LOCALLY
   ============================================================ */

function saveRideLocally(){

    try{

        localStorage.setItem(
            "currentRide",
            JSON.stringify(
                rideData
            )
        );

        localStorage.setItem(
            "activeRide",
            JSON.stringify(
                rideData
            )
        );

    }catch(error){

        console.warn(
            "Ride local save failed:",
            error
        );

    }

}


/* ============================================================
   LIVE COORDINATE UPDATE
   ============================================================ */

function updateLiveCoordinates(){

    const rider =
        getCoordinates(
            rideData,
            "rider"
        );


    if(
        rider
    ){

        updateRiderMarker(
            rider
        );

        updateRoute();

        updateArrivalFromDistance();

    }

}


/* ============================================================
   ARRIVAL FROM DISTANCE
   ============================================================ */

function updateArrivalFromDistance(){

    if(
        currentStatus === "completed" ||
        currentStatus === "cancelled" ||
        currentStatus === "started"
    ){

        return;

    }


    const rider =
        getCoordinates(
            rideData,
            "rider"
        );


    const pickup =
        getCoordinates(
            rideData,
            "pickup"
        );


    if(
        !rider ||
        !pickup
    ){

        return;

    }


    const distance =
        haversineKm(
            rider.lat,
            rider.lng,
            pickup.lat,
            pickup.lng
        );


    if(
        !Number.isFinite(distance)
    ){

        return;

    }


    /*
     * Approximate city-bike ETA.
     * Backend ETA remains preferred when supplied.
     */

    const minutes =
        Math.max(
            1,
            Math.ceil(
                distance /
                0.45
            )
        );


    rideData.etaMinutes =
        minutes;


    document.getElementById(
        "arrivalTime"
    ).textContent =
        minutes +
        " min";


    if(
        distance < 0.08
    ){

        document.getElementById(
            "arrivalText"
        ).textContent =
            "Your rider is very close to pickup.";

    }

}


/* ============================================================
   HAVERSINE
   ============================================================ */

function haversineKm(
    lat1,
    lng1,
    lat2,
    lng2
){

    const R =
        6371;


    const dLat =
        (
            lat2 -
            lat1
        ) *
        Math.PI /
        180;


    const dLng =
        (
            lng2 -
            lng1
        ) *
        Math.PI /
        180;


    const a =
        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        ) +

        Math.cos(
            lat1 *
            Math.PI /
            180
        ) *

        Math.cos(
            lat2 *
            Math.PI /
            180
        ) *

        Math.sin(
            dLng / 2
        ) *
        Math.sin(
            dLng / 2
        );


    return (
        R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        )
    );

}


/* ============================================================
   CALL DRIVER
   ============================================================ */

function callDriver(){

    if(
        currentStatus === "searching"
    ){

        showToast(

        );

        return;

/* ============================================================
   SHARE
   ============================================================ */

async function shareRide(){

    const id =
        rideData.id ||
        rideData.rideId ||
        "";


    const text =
        "I'm currently riding with RiderX." +
        (
            id
                ? "\nRide ID: " +
                  id
                : ""
        );


    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:
                    "RiderX Live Ride",

                text:
                    text

            });

            return;

        }catch(error){

            if(
                error &&
                error.name === "AbortError"
            ){

                return;

            }

        }

    }


    try{

        if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                text
            );

            showToast(
                "Ride details copied."
            );

        }else{

            showToast(
                text
            );

        }

    }catch(error){

        showToast(
            "Sharing is not available."
        );

    }

}


/* ============================================================
   CANCEL RIDE
   ============================================================ */

async function cancelRide(){

    if(
        currentStatus === "completed" ||
        currentStatus === "cancelled"
    ){

        return;

    }


    const confirmed =
        window.confirm(
            "Are you sure you want to cancel this ride?"
        );


    if(
        !confirmed
    ){

        return;

    }


    const rideId =
        rideData.id ||
        rideData.rideId;


    rideData.status =
        "cancelled";


    rideData.rideStatus =
        "cancelled";


    rideData.cancelledAt =
        Date.now();


    saveRideLocally();

    updateStatus();


    /*
     * Update Firebase RTDB.
     */

    if(
        database &&
        rideId
    ){

        const paths = [

            "rides/" + rideId,

            "bookings/" + rideId,

            "rideRequests/" + rideId

        ];


        for(
            const path of paths
        ){

            try{

                await database
                    .ref(path)
                    .update({

                        status:"cancelled",

                        rideStatus:"cancelled",

                        cancelledAt:
                            firebase.database
                                .ServerValue
                                .TIMESTAMP

                    });

            }catch(error){

                console.warn(
                    "RTDB cancel update:",
                    path,
                    error
                );

            }

        }

    }


    /*
     * Update Firestore where possible.
     */

    if(
        firestore &&
        rideId
    ){

        const collections = [

            "rides",

            "bookings",

            "rideRequests"

        ];


        for(
            const collection of collections
        ){

            try{

                await firestore
                    .collection(collection)
                    .doc(String(rideId))
                    .set(
                        {

                            status:"cancelled",

                            rideStatus:"cancelled",

                            cancelledAt:
                                new Date()

                        },
                        {
                            merge:true
                        }
                    );

            }catch(error){

                console.warn(
                    "Firestore cancel update:",
                    collection,
                    error
                );

            }

        }

    }


    showToast(
        "Ride cancelled."
    );


    setTimeout(
        function(){

            window.location.href =
                "home.html";

        },
        1200
    );

}


/* ============================================================
   PAYMENT
   ============================================================ */

function formatPayment(value){

    if(
        typeof value === "object" &&
        value
    ){

        value =
            value.method ||
            value.type ||
            "Cash";

    }


    const text =
        String(value || "Cash");


    const lower =
        text.toLowerCase();


    if(
        lower.includes("cash")
    ){

        return "Cash";

    }


    if(
        lower.includes("wallet")
    ){

        return "RiderX Wallet";

    }


    if(
        lower.includes("upi")
    ){

        return "UPI";

    }


    if(
        lower.includes("online")
    ){

        return "Online";

    }


    return text;

}


/* ============================================================
   DISTANCE
   ============================================================ */

function formatDistance(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "—";

    }


    const number =
        Number(
            String(value)
                .replace(
                    /[^0-9.]/g,
                    ""
                )
        );


    if(
        !Number.isFinite(number)
    ){

        return String(value);

    }


    return (
        number < 10
            ? number.toFixed(1)
            : number.toFixed(0)
    ) +
    " km";

}


/* ============================================================
   BACK
   ============================================================ */

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ){

        window.history.back();

        return;

    }


    window.location.href =

}


/* ============================================================
   MAP STATUS
   ============================================================ */

function setMapStatus(
    message,
    state
){

    const text =
        document.getElementById(
            "mapStatusText"
        );


    const dot =
        document.getElementById(
            "statusDot"
        );


    text.textContent =
        message;


    dot.classList.remove(
        "waiting",
        "offline"
    );


    if(
        state === "waiting"
    ){

        dot.classList.add(
            "waiting"
        );

    }


    if(
        state === "offline"
    ){

        dot.classList.add(
            "offline"
        );

    }

}


/* ============================================================
   TOAST
   ============================================================ */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.__riderxToast
    );


    window.__riderxToast =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value){

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ============================================================
   PERIODIC MAP REFRESH
   ============================================================ */

setInterval(
    function(){

        if(
            !rideData
        ){

            return;

        }


        updateLiveCoordinates();

    },
    2000
);


/* ============================================================
   VISIBILITY
   ============================================================ */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            !document.hidden &&
            mapInstance
        ){

            setTimeout(
                function(){

                    mapInstance.invalidateSize();

                    updateMapData();

                },
                250
            );

        }

    }
);


/* ============================================================
   PAGE UNLOAD
   ============================================================ */

window.addEventListener(
    "beforeunload",
    function(){

        clearInterval(
            statusTimer
        );

        unsubscribeRide();

    }
);


/* ============================================================
   INIT
   ============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadRide();

    }
);

})();
