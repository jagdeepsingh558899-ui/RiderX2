<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Live Tracking</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

#map{

height:450px;
width:100%;
border-radius:15px;

}

</style>

</head>


<body>


<div class="header">

🗺️ Tracking Rider

</div>



<div class="container">


<div id="map"></div>



</div>




<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script type="module">


import {db} from "../firebase/config.js";


import {

collection,
getDocs,
query,
orderBy,
limit,
doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let map=L.map("map").setView(

[26.9124,75.7873],

13

);



L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:"OpenStreetMap"

}

).addTo(map);





let riderMarker;



let riderId=null;





async function getAcceptedRide(){


let q=query(

collection(db,"rides"),

orderBy("createdAt","desc"),

limit(1)

);



let snap=await getDocs(q);



snap.forEach((ride)=>{


let data=ride.data();



if(data.status=="Accepted"){


riderId=data.riderId;


}



});



}







async function trackRider(){


if(!riderId){

return;

}



let location=await getDoc(

doc(db,"locations",riderId)

);



if(location.exists()){


let data=location.data();



if(riderMarker){

map.removeLayer(riderMarker);

}



riderMarker=L.marker(

[

data.latitude,

data.longitude

]

)

.addTo(map)

.bindPopup(

"🏍 Your Rider"

)

.openPopup();



map.setView(

[

data.latitude,

data.longitude

],

15

);



}



}





async function start(){


await getAcceptedRide();


trackRider();



setInterval(

trackRider,

5000

);


}



start();



</script>


</body>

</html>
