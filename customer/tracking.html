<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Live Tracking</title>

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">


<style>

#map{

height:450px;
width:100%;
border-radius:15px;

}

</style>

</head>


<body>


<div class="header">

🗺️ RiderX Live Tracking

</div>



<div class="container">


<div id="map"></div>


<a href="ride-status.html">

⬅ Back Ride Status

</a>


</div>





<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<script type="module">


import {db} from "../firebase/config.js";


import {

doc,
getDoc

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";





let map = L.map("map").setView(

[26.9124,75.7873],

13

);



L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

attribution:"OpenStreetMap"

}

).addTo(map);





let riderMarker;





async function loadRider(){



let snap = await getDoc(


doc(db,"locations",riderId)
);



if(snap.exists()){


let data=snap.data();



if(riderMarker){

map.removeLayer(riderMarker);

}



riderMarker=L.marker(

[

data.latitude,

data.longitude

]

)

.addTo(map)

.bindPopup(

"🏍 Rider Location"

)

.openPopup();



map.setView(

[

data.latitude,

data.longitude

],

15

);



}



}




loadRider();


setInterval(

loadRider,

5000

);



</script>


</body>

</html>
