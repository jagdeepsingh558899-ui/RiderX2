</style></head><body><div class="container"><div class="logo">

    Rider<span>X</span>

</div>


<div class="loader-wrap">

    <div class="loader"></div>

    <div class="loader-inner"></div>

    <div class="bike">
        🏍️
    </div>

</div>


<div class="title">

    Finding your rider

</div>


<div class="subtitle">

    We're looking for the nearest
    available RiderX partner.

    <br>

    Please keep this screen open.

</div>


<div class="status">

    <span class="status-dot"></span>

    SEARCHING FOR RIDER

</div>


<div
    id="rideInfo"
    class="info"
    style="display:none;"
>

    <div class="info-row">

        <span class="label">
            Ride ID
        </span>

        <span
            id="rideIdText"
            class="value"
        >
            —
        </span>

    </div>


    <div class="info-row">

        <span class="label">
            Service
        </span>

        <span
            id="serviceText"
            class="value"
        >
            —
        </span>

    </div>


    <div class="info-row">

        <span class="label">
            Fare
        </span>

        <span
            id="fareText"
            class="value"
        >
            —
        </span>

    </div>

</div>


<button
    id="cancelBtn"
    class="cancel"
>
    Cancel Ride
</button>


<div
    id="errorBox"
    class="error"
></div>

</div><script type="module">

import {
    auth,
    db
} from "../firebase/firebase-config.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


import {
    doc,
    onSnapshot,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


// =========================================================
// STATE
// =========================================================

let currentUser = null;

let rideId = null;

let unsubscribeRide = null;

let cancelling = false;


// =========================================================
// DOM
// =========================================================

const rideInfo =
    document.getElementById(
        "rideInfo"
    );

const rideIdText =
    document.getElementById(
        "rideIdText"
    );

const serviceText =
    document.getElementById(
        "serviceText"
    );

const fareText =
    document.getElementById(
        "fareText"
    );

const cancelBtn =
    document.getElementById(
        "cancelBtn"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );


// =========================================================
// GET RIDE ID
// =========================================================

function getRideId(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const fromUrl =
        params.get(
            "rideId"
        );


    if(fromUrl){

        return fromUrl;

    }


    const keys = [
        "activeRideId",
        "rideId",
        "riderx_active_ride"
    ];


    for(
        const key of keys
    ){

        const value =
            localStorage.getItem(
                key
            );


        if(value){

            return value;

        }

    }


    return null;

}


// =========================================================
// SHOW ERROR
// =========================================================

function showError(
    message
){

    errorBox.style.display =
        "block";

    errorBox.innerText =
        message;

}


// =========================================================
// CLEAR RIDE STORAGE
// =========================================================

function clearRideStorage(){

    [
        "activeRideId",
        "rideId",
        "riderx_active_ride"
    ]
    .forEach(
        key => {

            localStorage.removeItem(
                key
            );

        }
    );

}


// =========================================================
// SAVE ACTIVE RIDE
// =========================================================

function saveActiveRide(
    id
){

    localStorage.setItem(
        "activeRideId",
        id
    );

    localStorage.setItem(
        "rideId",
        id
    );

    localStorage.setItem(
        "riderx_active_ride",
        id
    );

}


// =========================================================
// OPEN RIDE STATUS
// =========================================================

function openRideStatus(
    id
){

    saveActiveRide(
        id
    );


    window.location.replace(
        "ride-status.html?rideId=" +
        encodeURIComponent(
            id
        )
    );

}


// =========================================================
// STATUS NORMALIZER
// =========================================================

function normalizedStatus(
    value
){

    return String(
        value || ""
    )
    .trim()
    .toUpperCase();

}


// =========================================================
// HANDLE RIDE SNAPSHOT
// =========================================================

function handleRide(
    snapshot
){

    if(!snapshot.exists()){

        showError(
            "Ride not found. Please book the ride again."
        );

        cancelBtn.disabled =
            true;

        return;

    }


    const ride =
        snapshot.data();


    // Security check:
    // customer can only monitor own ride.

    if(
        ride.customerId &&
        ride.customerId !==
        currentUser.uid
    ){

        showError(
            "This ride does not belong to your account."
        );

        cancelBtn.disabled =
            true;

        return;

    }


    const status =
        normalizedStatus(
            ride.status
        );


    rideInfo.style.display =
        "block";


    rideIdText.innerText =
        rideId.substring(
            0,
            12
        );


    serviceText.innerText =
        ride.serviceType ||
        ride.service ||
        ride.rideType ||
        "Bike Taxi";


    fareText.innerText =
        "₹" +
        Number(
            ride.fare || 0
        );


    // -------------------------------------------------------
    // RIDER ACCEPTED
    // -------------------------------------------------------

    if(
        status ===
        "ACCEPTED"
    ){

        cancelBtn.disabled =
            true;


        openRideStatus(
            rideId
        );

        return;

    }


    // -------------------------------------------------------
    // RIDER ARRIVING / ON TRIP
    // -------------------------------------------------------

    if(
        status ===
        "ARRIVING" ||

        status ===
        "DRIVER_ARRIVING" ||

        status ===
        "RIDER_ARRIVING" ||

        status ===
        "ARRIVED" ||

        status ===
        "STARTED" ||

        status ===
        "ON_TRIP" ||

        status ===
        "COMPLETED"
    ){

        cancelBtn.disabled =
            true;


        openRideStatus(
            rideId
        );

        return;

    }


    // -------------------------------------------------------
    // CANCELLED
    // -------------------------------------------------------

    if(
        status ===
        "CANCELLED" ||

        status ===
        "CANCELED" ||

        status ===
        "REJECTED"
    ){

        clearRideStorage();

        showError(
            "This ride is no longer active."
        );

        cancelBtn.disabled =
            true;

        setTimeout(
            () => {

                window.location.replace(
                    "home.html"
                );

            },
            1800
        );

    }

}


// =========================================================
// START RIDE LISTENER
// =========================================================

function startRideListener(){

    if(
        !rideId ||
        !currentUser
    ){

        return;

    }


    if(unsubscribeRide){

        unsubscribeRide();

    }


    const rideRef =
        doc(
            db,
            "rides",
            rideId
        );


    unsubscribeRide =
        onSnapshot(

            rideRef,

            snapshot => {

                handleRide(
                    snapshot
                );

            },

            error => {

                console.error(
                    "Ride listener:",
                    error
                );


                showError(
                    "Unable to track your ride: " +
                    error.message
                );

            }

        );

}


// =========================================================
// CANCEL RIDE
// =========================================================

cancelBtn.addEventListener(
    "click",
    async () => {

        if(
            cancelling ||
            !rideId ||
            !currentUser
        ){

            return;

        }


        const confirmed =
            window.confirm(
                "Are you sure you want to cancel this ride?"
            );


        if(!confirmed){

            return;

        }


        cancelling = true;

        cancelBtn.disabled =
            true;

        cancelBtn.innerText =
            "Cancelling...";


        try{

            const rideRef =
                doc(
                    db,
                    "rides",
                    rideId
                );


            await updateDoc(
                rideRef,
                {

                    status:
                        "CANCELLED",

                    cancelledBy:
                        currentUser.uid,

                    cancelledAt:
                        serverTimestamp()

                }
            );


            clearRideStorage();


            window.location.replace(
                "home.html"
            );


        }catch(error){

            console.error(
                "Cancel ride:",
                error
            );


            cancelling =
                false;


            cancelBtn.disabled =
                false;


            cancelBtn.innerText =
                "Cancel Ride";


            showError(
                "Ride cancel nahi hui: " +
                error.message
            );

        }

    }
);


// =========================================================
// AUTH
// =========================================================

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            showError(
                "Please login first."
            );

            cancelBtn.disabled =
                true;

            return;

        }


        currentUser =
            user;


        rideId =
            getRideId();


        if(!rideId){

            showError(
                "Active ride nahi mili. Please book a new ride."
            );

            cancelBtn.disabled =
                true;

            return;

        }


        startRideListener();

    }
);

</script></body></html>
