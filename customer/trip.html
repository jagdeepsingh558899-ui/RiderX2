<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RiderX Trip</title>

<style>

body{

background:#000;
color:white;
font-family:Arial;
text-align:center;
padding:30px;

}


.box{

background:#111;
padding:25px;
border-radius:20px;
border:2px solid #FFD600;

}


h1 span{

color:#FFD600;

}


.otp{

font-size:40px;
color:#FFD600;
margin:30px;

}


button{

padding:15px;
width:100%;
border:none;
border-radius:12px;
background:#FFD600;
font-weight:bold;

}

</style>

</head>


<body>


<div class="box">


<h1>
RIDER<span>X</span>
</h1>


<h2>

Your Ride OTP

</h2>



<div class="otp" id="otp">

----

</div>


<p>

Share this OTP with your rider after arrival

</p>



<button onclick="goTracking()">

Open Tracking

</button>


</div>





<script type="module">


import { db } from "../firebase/config.js";


import {

doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";




let otp =
Math.floor(

1000 + Math.random()*9000

);



document.getElementById("otp").innerHTML=otp;




let rideId =
localStorage.getItem("rideId");



if(rideId){


await updateDoc(

doc(db,"rides",rideId),

{


otp:otp,

status:"OTP_PENDING"


}

);


}





window.goTracking=()=>{

location.href="live-tracking.html";

};



</script>



</body>

</html>
